<body><div class="wrap"><p class="sub" style="font-size:12px;margin:0 0 14px">Exportado em 2026-10-01 09:49 · fonte: Lab Hub local</p><p class="sub"><a href="../index.html">← hub</a> · <code>_GambitStudio/spec/research-2026-09-product.md</code></p><div id="md"></div><script>const RAW="# Pesquisa 2026-09 \u2014 o que faz um app indie pequeno dar certo como PRODUTO\n\n> Escopo: ativa\u00e7\u00e3o, reten\u00e7\u00e3o, onboarding, ratings, monetiza\u00e7\u00e3o, iOS 26, App Review, featuring, qualidade e estrat\u00e9gia de portf\u00f3lio, com dados de 2025-2026. Foco no que move a meta de US$ 4k/m\u00eas (dez/2027) do GambitStudio. Tags de confian\u00e7a: [Apple oficial] \u00b7 [estudo com dados] \u00b7 [opini\u00e3o de vendor] \u00b7 [anedota]. Datas = publica\u00e7\u00e3o da fonte.\n\n## Achados\n\n**1. Reten\u00e7\u00e3o 2025-26: a mediana \u00e9 baixa e varia 2x entre fontes; o que importa \u00e9 a faixa da categoria.** Cross-industry: D1 25-26%, D7 11-13%, D30 5-7%; iOS D1 ~24% \u2192 D30 3,7% ([Phiture, 2025-26](https://phiture.com/mobilegrowthstack/managing-retention-rate-benchmarks-and-expectations/)). Pushwoosh (600+ apps, 2025): iOS D7 6,89%, D30 3,10% ([Pushwoosh](https://www.pushwoosh.com/blog/increase-user-retention-rate/)). Mixpanel Benchmark Report (8.000 produtos): D30 global 5,8%, mediana consumer ~6%, top quartil ~20% (citado por vendors, sem link prim\u00e1rio: [MWM](https://mwm.ai/glossary/retention)). Por categoria, agregando AppsFlyer 2025 + Adjust fev/2026 ([UXCam, 2026](https://uxcam.com/blog/mobile-app-retention-benchmarks/)): Produtividade D1 40-50 / D7 22-28 / D30 12-18; Health & Fitness 35-45 / 15-22 / 8-12; Games 40-50 / 12-18 / 5-8; geral 30-40 / 10-15 / 5-8. Utilities e Lifestyle n\u00e3o t\u00eam corte limpo em nenhuma fonte prim\u00e1ria. [estudo com dados]\n\n**2. Ativa\u00e7\u00e3o em 7 dias prev\u00ea reten\u00e7\u00e3o de 3 meses.** Amplitude, 2.600+ empresas: 69% dos produtos no top quartil de ativa\u00e7\u00e3o D7 est\u00e3o tamb\u00e9m no top quartil de reten\u00e7\u00e3o em 3 meses; 7% da coorte voltando no D7 j\u00e1 coloca o produto nos 25% melhores ([Amplitude Product Benchmark Report 2025](https://amplitude.com/resources/product-benchmark-report); [regra dos 7%](https://amplitude.com/blog/7-percent-retention-rule)). Corol\u00e1rio: `core_action` no D0-D7 \u00e9 a m\u00e9trica certa; reten\u00e7\u00e3o D30 \u00e9 consequ\u00eancia. [estudo com dados]\n\n**3. Onboarding: multi-p\u00e1gina e personalizado converte; comprido n\u00e3o \u00e9 o problema, vazio \u00e9.** Superwall, 40M aberturas de paywall de onboarding (fev-mai/2026): paywall multi-p\u00e1gina 12,41% vs single 9,07% (+37%), sendo s\u00f3 24% das aberturas ([Superwall, 2026](https://superwall.com/blog/new-postmulti-page-onboarding-paywalls-convert-37-better-than-single-page-heres-why)). Adapty (testes pr\u00f3prios, 19/12/2025): 2-3 perguntas de personaliza\u00e7\u00e3o +8,5% trial e +17% pagantes (+22% ARPU); configurar lembrete/notifica\u00e7\u00e3o DENTRO do onboarding +6,4% trial e +24% ARPU; copy de resultado vs feature +17% trial; recomenda \"3-5 passos e testar\", alerta em >20-30% de queda numa tela ([Adapty](https://adapty.io/blog/how-to-fix-your-onboarding-flow/)). [estudo com dados] / [opini\u00e3o de vendor]\n\n**4. O dia 0 \u00e9 onde a receita decide.** RevenueCat 2026 (115k apps, US$ 16 bi): 82% dos trials pagos come\u00e7am no dia 0 (Utilities 86%, Business 85%, Productivity 78%, o menor) e 50% de todas as convers\u00f5es pagas acontecem no dia 0 ([RevenueCat SoSA 2026](https://www.revenuecat.com/state-of-subscription-apps); [resumo 10 min](https://www.revenuecat.com/blog/growth/subscription-app-trends-benchmarks-2026)). Adapty 2026 (16k apps, US$ 3 bi, 105k paywalls): 90% dos trial starts no dia 0 ([Adapty 2026](https://adapty.io/state-of-in-app-subscriptions/)). Um app sem oferta no dia 0 s\u00f3 alcan\u00e7a quem volta, ou seja 5-8% da coorte no D30 (achado 1). [estudo com dados]\n\n**5. Hard paywall converte 5x e rende 8x por install, com a MESMA reten\u00e7\u00e3o de 1 ano.** RevenueCat 2026: convers\u00e3o D35 10,7% (hard) vs 2,1% (freemium); receita por install D60 US$ 3,09 vs US$ 0,38; reten\u00e7\u00e3o de 12 meses 27% vs 28% (paridade). Adapty 2026: hard paywall +21% LTV por assinante; paywall de onboarding sem trial converte 37,45% mas tem o menor LTV; weekly+trial tem o maior LTV 12m (US$ 49,27). Ressalva: dados de apps que j\u00e1 cobram, n\u00e3o de apps gr\u00e1tis que passaram a cobrar. [estudo com dados]\n\n**6. Trial: 5-9 dias converte mais que \u22644; 3 dias \u00e9 cancelado no mesmo dia.** RevenueCat, 17k+ apps, ago/2025-jul/2026, planos mensais: \u22644 dias 39,6% conv / 62,8% 1\u00aa renova\u00e7\u00e3o; 5-9 dias 45,9% / 62,8%; 10-16 dias 46,6% / 72,0%; 17-32 dias 43,7% / 77,5% (Health & Fitness: 46,8% em 5-9 dias). Trials de 3 dias: 55,4% dos cancelamentos no dia 0, 84% at\u00e9 o D1; 46,5% dos apps usam <4 dias mesmo assim ([RevenueCat, set/2026](https://www.revenuecat.com/blog/growth/free-trial-length)). A pr\u00f3pria RevenueCat avisa que \u00e9 correla\u00e7\u00e3o. Estrat\u00e9gias sem trial subiram de 28% (2024) para 32% (2026) e ~30% dos novos assinantes entram por intro offer ([RevenueCat, mar/2026](https://www.revenuecat.com/blog/growth/free-trials-dont-make-sense-anymore)). [estudo com dados]\n\n**7. Semanal domina a receita mas ret\u00e9m 4x pior que anual; a categoria decide o plano.** Adapty 2026: weekly = 55,5% da receita de assinatura (43,3% em 2023) e converte 1,7-7,4x melhor que anual; reten\u00e7\u00e3o D380: anual-com-trial 19,9%, mensal 14,2%, semanal 5,5%; Health & Fitness \u00e9 exce\u00e7\u00e3o com 60,6% anual; medianas US$ 7,48/sem, US$ 12,99/m\u00eas, US$ 38,42/ano; Europa cobra 29-39% mais que Am\u00e9rica do Norte. RevenueCat 2026: Productivity vende 77% mensal (91% da receita), H&F 68% anual; churn de anuais no ano 1 ~72% (35% j\u00e1 no m\u00eas 1); LTV realizado ano 1 por pagante: H&F US$ 35,64, Productivity US$ 24,95, Gaming US$ 11,22 ([Productivity](https://www.revenuecat.com/state-of-subscription-apps-2026-productivity/)). Subscription rende 4,5x o LTV de compra \u00fanica (RevenueCat 2025) e s\u00f3 10% dos apps rodam h\u00edbrido de verdade (2026). [estudo com dados]\n\n**8. A mediana \u00e9 pobre e est\u00e1 piorando; a distribui\u00e7\u00e3o \u00e9 de cauda longa.** RevenueCat 2026: 17,3% dos apps novos chegam a US$ 1k MRR em 2 anos (19% no ano anterior); 4,6% chegam a US$ 10k (5,3%); top quartil cresce MRR +80% a/a, bottom quartil cai -33% ([RevenueCat 2026](https://www.revenuecat.com/state-of-subscription-apps)). Adapty 2026: app mediano fatura US$ 492/m\u00eas, 59,3% nunca passam de US$ 1k no total, top 10% ficam com 94,5% da receita. Contexto: 557k apps novos em 2025 (+24%, maior desde 2016) ([Appfigures, dez/2025](https://appfigures.com/resources/insights/20251205?f=2)); usu\u00e1rio usa ~10 apps/dia e 34/m\u00eas; gasto em n\u00e3o-games superou games pela 1\u00aa vez ([Sensor Tower State of Mobile 2026](https://sensortower.com/blog/state-of-mobile-2026)). [estudo com dados]\n\n**9. Reativa\u00e7\u00e3o e ferramentas de reten\u00e7\u00e3o da Apple viraram alavanca real.** RevenueCat 2026: 20% dos mensais que cancelam reativam em 12 meses (13,7% em 2025). Apple: Retention Messaging (oferta na tela de cancelamento) liberado para todos os devs, Bundles/Suites, Group Purchases (inverno 2026), Personalized Collections + App Notes (jun/2026, US) e Creative Assets no header/busca ([Apple Newsroom, 08/06/2026](https://www.apple.com/newsroom/2026/06/apple-expands-app-store-capabilities-to-help-developers-grow-and-reach-new-users/)); offer codes para TODO tipo de IAP e custom product pages 35\u219270 com keywords ([MacRumors, 29/10/2025](https://www.macrumors.com/2025/10/29/apple-developer-app-store-updates/)). [Apple oficial]\n\n**10. Pre\u00e7o localizado: a alavanca mais barata que o lab n\u00e3o usa.** Personal Best (1 dev, 1 app): \u00cdndia -90% no pre\u00e7o \u2192 +128% de receita no pa\u00eds; 2025 fechou com US$ 45k (+29%) e MRR US$ 3.630 com downloads CAINDO 24% ([Codakuma, 01/01/2026](https://codakuma.com/2025-in-review/)). RevenueCat: Flo cresceu 80% em mercados n\u00e3o angl\u00f3fonos vs 35%; Brasil +31% de gasto n\u00e3o-game a/a; apps otimizados precificam \u00cdndia 50-80% abaixo dos EUA (Apple sugere -21%) ([RevenueCat, 04/09/2025](https://www.revenuecat.com/blog/growth/price-localization-for-apps)). [anedota] / [opini\u00e3o de vendor]\n\n**11. Small Business Program + Foundation Models gr\u00e1tis na nuvem.** 15% de comiss\u00e3o para quem teve \u2264 US$ 1M de proceeds (l\u00edquido) no ano anterior e no corrente; cliff ao passar, requalifica no ano seguinte ([Apple](https://developer.apple.com/app-store/small-business-program/)). WWDC26: apps com <2M downloads chamam o modelo Apple na Private Cloud Compute sem custo de API (cota di\u00e1ria por usu\u00e1rio, iCloud+ amplia; 32k de contexto, reasoning; exige Apple Intelligence e internet) ([WWDC26 sess\u00e3o 319](https://developer.apple.com/videos/play/wwdc2026/319/)). [Apple oficial]\n\n**12. Prompt nativo de rating: as regras da Apple s\u00e3o as do lab.** At\u00e9 3 pedidos por 365 dias; \"make the request when users are most likely to feel satisfaction... completed an action, level, or task\"; \"make sure not to interrupt\"; reset de nota s\u00f3 com vers\u00e3o nova e \"sparingly\" ([Apple, Ratings & Reviews](https://developer.apple.com/app-store/ratings-and-reviews/)). Aritm\u00e9tica: cada 1\u2605 exige sete 5\u2605 para manter 4,5. Convers\u00e3o tap\u2192install ~50% acima de 4,5\u2605 vs <30% abaixo de 3,5\u2605, segundo vendors de ASO ([SplitMetrics](https://splitmetrics.com/blog/app-store-reviews/); [Enterpret](https://www.enterpret.com/guides/what-is-a-good-app-store-rating-for-a-mobile-app-in-2026)), sem estudo prim\u00e1rio p\u00fablico. N\u00e3o h\u00e1 estudo p\u00fablico com n\u00fameros sobre \"mover o prompt para o aha\" al\u00e9m da recomenda\u00e7\u00e3o da Apple. [Apple oficial] / [opini\u00e3o de vendor]\n\n**13. Responder review move a nota, com janela de 72 h.** AppFollow 2026 (92,9M reviews, 20,7k apps, jul/2025-jul/2026): reply rate m\u00e9dio 24,8% (App Store 23,9%); apps que respondem 0-1% t\u00eam m\u00e9dia 3,25\u2605, 30-50% t\u00eam 3,77\u2605 (pico); resposta depois de 72 h quase n\u00e3o muda a nota ([AppFollow](https://appfollow.io/blog/app-review-reply-rate-benchmarks-2026)). Acad\u00eamico (Hassan et al.): 4,4% dos usu\u00e1rios sobem a nota ap\u00f3s resposta vs 0,7% sem (6x) ([ACM 2021](https://dl.acm.org/doi/fullHtml/10.1145/3463274.3463311)). Apple: \"the reviewer is notified and has the option to update their review\". [estudo com dados]\n\n**14. Review Summaries por LLM j\u00e1 existem em 9 storefronts; \"reviews verificadas\" n\u00e3o existem.** Resumos gerados por LLM, atualizados continuamente, em US + Austr\u00e1lia, Canad\u00e1, \u00cdndia, Irlanda, NZ, Singapura, \u00c1frica do Sul, UK (s\u00f3 ingl\u00eas); dev pode reportar resumo incorreto ([Apple](https://developer.apple.com/app-store/ratings-and-reviews/)). Nenhuma fonte Apple menciona verifica\u00e7\u00e3o de compra em reviews no iOS 26. Implica\u00e7\u00e3o: o TEXTO das reviews (n\u00e3o s\u00f3 a estrela) vira copy da p\u00e1gina; padr\u00e3o de reclama\u00e7\u00e3o repetido vira par\u00e1grafo p\u00fablico. [Apple oficial]\n\n**15. Liquid Glass: o opt-out \u00e9 tempor\u00e1rio e n\u00e3o h\u00e1 dado de que doa na convers\u00e3o, mas o prazo \u00e9 real.** Apple: SDK iOS 26 obrigat\u00f3rio desde 28/04/2026 ([Upcoming Requirements](https://www.developer.apple.com/news/upcoming-requirements/)); sobre `UIDesignRequiresCompatibility`, \"Apple intends to remove this option in the next major Xcode release\" ([Donny Wals, 10/06/2025](https://www.donnywals.com/opting-your-app-out-of-the-liquid-glass-redesign-with-xcode-26/)), ou seja Xcode 27, com exig\u00eancia de SDK 27 esperada em ~abr/2027. Apple mant\u00e9m galeria p\u00fablica de apps que adotaram (nov/2025, atualizada abr/2026) ([9to5Mac, 06/11/2025](https://9to5mac.com/2025/11/06/apple-spotlights-third-party-apps-adopting-liquid-glass-in-ios-26-and-more/)). A p\u00e1gina de featuring n\u00e3o exige tecnologia espec\u00edfica, mas pontua \"UI design\" e \"Innovation: new technologies\" (achado 18). Zero evid\u00eancia p\u00fablica de queda de convers\u00e3o por opt-out. [Apple oficial] / [opini\u00e3o]\n\n**16. App Intents/widgets/Live Activities: aposta da Apple, evid\u00eancia de reten\u00e7\u00e3o fraca.** Apple: uma implementa\u00e7\u00e3o de App Intents exp\u00f5e o app em Siri, Spotlight, Shortcuts, widgets, Controls e Apple Intelligence ([WWDC25 244](https://developer.apple.com/videos/play/wwdc2025/244/)); iOS 26 traz push-to-start e bot\u00f5es interativos em Live Activities. Dado p\u00fablico: um caso B2B com widget +34% de ativos em 30 dias ([Pushwoosh](https://www.pushwoosh.com/blog/increase-user-retention-rate/), anedota); Mixpanel (citado por vendors): apps com assistente de IA in-app ret\u00eam D30 9,1% vs 5,8% (correla\u00e7\u00e3o). Nada por categoria, nada para app pequeno. [Apple oficial] / [anedota]\n\n**17. App Review 2025-26: crash e incompletude rejeitam mais que pol\u00edtica.** Apple: 9,1M submiss\u00f5es em 2025, 2M+ rejeitadas (1,2M apps novos, 800k updates); 443k por privacidade, 371k spam/copycat/enganoso, 22k features ocultas, 59k bait-and-switch ([Apple Newsroom, 20/05/2026](https://www.apple.com/newsroom/2026/05/the-app-store-stopped-over-2-point-2-billion-usd-in-fraudulent-transactions-in-2025/)). Guideline 2.1 (crash, bug, conte\u00fado placeholder, IAP que n\u00e3o funciona) \u00e9 a mais citada, \">40% das rejei\u00e7\u00f5es\" segundo vendors ([RevenueCat docs](https://www.revenuecat.com/docs/test-and-launch/app-store-rejections)). Regras novas: age rating 13+/16+/18+ com question\u00e1rio obrigat\u00f3rio at\u00e9 31/01/2026 ([Apple, 24/07/2025](https://developer.apple.com/news/?id=ks775ehf)); 13/11/2025: 5.1.2(i) consentimento expl\u00edcito para compartilhar dado com IA de terceiros, 4.1(c) proibido usar marca/\u00edcone alheio, 4.7 mini apps HTML5 no escopo, 1.2.1(a) creator apps ([Apple](https://developer.apple.com/news/?id=ey6d8onl)). Tempo: Apple mant\u00e9m \"90% em 24 h\"; relatos de 2026 falam em 90% em 48 h e m\u00e9dia 1,5 dia, com 2-3 dias em iOS ([LowCode, 2026](https://www.lowcode.agency/blog/app-store-review-time), vendor). Accessibility Nutrition Labels: opcionais, 9 recursos (VoiceOver, Larger Text, Sufficient Contrast, Reduced Motion...), pesquis\u00e1veis na busca desde set/2025 ([Apple, 15/09/2025](https://support.apple.com/en-us/123073)). [Apple oficial]\n\n**18. Featuring: 7 crit\u00e9rios p\u00fablicos, nomina\u00e7\u00e3o com 2 semanas a 3 meses, efeito de 7-17x por 24 h.** Apple avalia UX, UI design, inova\u00e7\u00e3o (\"new technologies\"), unicidade, acessibilidade, localiza\u00e7\u00e3o (\"high-quality support for multiple languages\") e product page (\"positive ratings and reviews\"); \"minimum of two weeks notice\", ideal \"up to three months in advance\" ([Apple, Getting Featured](https://developer.apple.com/app-store/getting-featured/)). Efeito: App of the Day +1.747% de downloads, Game of the Day +792% (Sensor Tower via [TechCrunch, 2017](https://techcrunch.com/2017/10/24/apples-app-of-the-day-featuring-boosts-downloads-by-1747-games-by-792/)); vendors 2026 estimam 3-20x na janela e 5-20k downloads em 24 h para produtividade de nicho, stories/listas ~2x ([Vendredi](https://vendredi-app.fr/blog/featured-by-apple/)). Personal Best foi featured no lan\u00e7amento do iOS 26 e n\u00e3o divulgou o pico (achado 10). [Apple oficial] / [estudo antigo] / [opini\u00e3o de vendor]\n\n**19. Crash-free: a mediana do mercado \u00e9 99,95% de sess\u00f5es; 99,5% \u00e9 P25.** Luciq 2026: mediana 99,95%, P25 99,77%, P75 99,99%; iOS 99,91%; ~99,7% correlaciona com 3\u2605 e ~99,85% com 4,5\u2605+; apps 4,6-4,8\u2605 operam perto de 99,95% ([Luciq, 2026](https://www.luciq.ai/mobile-app-performance-benchmarks-2026)). Tamanho: dado s\u00f3lido \u00e9 antigo (Google 2017: -1% de convers\u00e3o por +6 MB; limite celular iOS 200 MB) e sem estudo 2025-26 confi\u00e1vel. [opini\u00e3o de vendor com dados]\n\n**20. Permiss\u00f5es: iOS opta ~45-56% em push; priming ajuda mas o \"2-3x\" \u00e9 claim de vendor.** Pushwoosh 2025 (600+ apps): iOS m\u00e9dia 56,36%, de 23% (hypercasual) a 80% (business); Batch jul/2024-jul/2025: 56%; Airship 2025: mediana 44,5% ([Pushwoosh](https://www.pushwoosh.com/blog/increase-push-notifications-opt-in/); [Batch](https://batch.com/ressources/etudes/benchmark-notifications-push-crm-mobile)). Pedir no momento de relev\u00e2ncia (logo ap\u00f3s criar o lembrete) e n\u00e3o no 1\u00ba launch \u00e9 consenso; HealthKit e c\u00e2mera n\u00e3o t\u00eam benchmark p\u00fablico. [estudo com dados] / [opini\u00e3o de vendor]\n\n**21. Portf\u00f3lio s\u00f3 funciona com distribui\u00e7\u00e3o e c\u00f3digo compartilhado; sen\u00e3o vira 9 apps e US$ 2,8k em 3 anos.** Contra: Atterdag Apps, 9 apps, set/2022-nov/2025, US$ 2.865 no total, melhor app US$ 1.353 ([Atterdag](https://atterdagapps.com/posts/3-years-as-indie-dev/)). A favor: 28 apps \u2192 US$ 25k MRR em 8 meses ([BuildMVPFast, 2026](https://www.buildmvpfast.com/blog/portfolio-app-strategy-multiple-apps-revenue-solo-founder-2026)) e 30 apps \u2192 US$ 22k/m\u00eas ([Indie Hackers](https://www.indiehackers.com/post/tech/from-failed-app-to-30-app-portfolio-making-22k-mo-in-less-than-a-year-myy3U7K9evxGOVOHti8s)), ambos com ASO agressivo, template \u00fanico e paywall desde o dia 0. Foco: Personal Best, 1 app, US$ 45k/ano (achado 10). RevenueCat recomenda \"pick a lane and double-down\" e admite que portf\u00f3lio \"spreads risk and learning\" com \"operational drag\" ([RevenueCat](https://www.revenuecat.com/blog/growth/app-portfolio-vs-single-app/)). Todos s\u00e3o sobreviventes. [anedota] / [opini\u00e3o de vendor]\n\n## O que o lab j\u00e1 faz certo\n\n- **`core_action` como ativa\u00e7\u00e3o (taxonomia can\u00f4nica) e leitura por stream** bate com o achado 2: ativa\u00e7\u00e3o D7 \u00e9 o preditor; `verify-analytics.py --strict` garante que o evento existe. Faltam s\u00f3 os benchmarks de 2026 no `analytics-analyst`.\n- **Prompt nativo direto no aha, com throttle no servi\u00e7o (\u22653 eventos, 90 dias, \u22643/ano, 1/vers\u00e3o, foreground)** \u00e9 exatamente a recomenda\u00e7\u00e3o da Apple (achado 12) e respeita o teto de 3/365. Arrancar o RatingGate (LEARNINGS #88) foi certo: pr\u00e9-prompt filtra quem avalia e fere 5.6.1.\n- **Primer de permiss\u00e3o com UM bot\u00e3o neutro (5.1.1(iv))** casa com o achado 20: priming no contexto sobe opt-in, bot\u00e3o de adiar reprova. Pedir no momento de relev\u00e2ncia j\u00e1 \u00e9 regra em `mandatory-features.md`.\n- **OnboardingKit 2-3 features + dados + permiss\u00e3o** est\u00e1 dentro dos \"3-5 passos\" (achado 3) e \u00e9 multi-p\u00e1gina (Superwall). O que falta \u00e9 a personaliza\u00e7\u00e3o (ver mudan\u00e7as).\n- **Crashlytics obrigat\u00f3rio, `PrivacyInfo.xcprivacy`, preflight de age rating/permiss\u00f5es/URLs** cobrem as tr\u00eas maiores causas de rejei\u00e7\u00e3o do achado 17 (2.1, privacidade, question\u00e1rio de idade).\n- **44 pt, texto que nunca trunca, `accessibilityIdentifier`+`Label` em todo controle, 39 locales** s\u00e3o dois dos sete crit\u00e9rios de featuring (acessibilidade, localiza\u00e7\u00e3o, achado 18) e viram Accessibility Nutrition Labels de gra\u00e7a.\n- **`review-responder` via API** ataca o achado 13; s\u00f3 falta cad\u00eancia (72 h).\n- **MVVM estrito, 600 linhas, light-first** n\u00e3o t\u00eam evid\u00eancia a favor nem contra na loja; s\u00e3o higiene interna, e higiene interna \u00e9 o que segura o crash-free (achado 19).\n- **Liquid Glass opt-out por padr\u00e3o** \u00e9 v\u00e1lido hoje (achado 15): sem evid\u00eancia de perda de convers\u00e3o; o risco \u00e9 s\u00f3 o calend\u00e1rio (Xcode 27).\n\n## O que muda no lab\n\nOrdenado por impacto esperado na meta de US$ 4k/m\u00eas. Conta de padeiro: US$ 4k l\u00edquidos a 15% de comiss\u00e3o s\u00e3o ~US$ 4,7k brutos; no mediano da Adapty (US$ 492/app/m\u00eas) seriam ~10 apps pagos na mediana, ou 1-2 no top decil. Com 17,3% dos apps chegando a US$ 1k MRR em 2 anos (achado 8), 20 apps gr\u00e1tis rendem, em expectativa, zero; 20 apps com paywall rendem ~3 apps em US$ 1k. A meta \u00e9 inalcan\u00e7\u00e1vel com o portf\u00f3lio gr\u00e1tis.\n\n1. **Derrubar \"apps sempre gr\u00e1tis na v1\" como default; trocar por \"paywall soft no dia 0 quando o app tem um job repetido\".** Evid\u00eancia: 82-90% dos trials e 50% das convers\u00f5es pagas acontecem no dia 0 (achado 4); hard paywall rende 8x por install com reten\u00e7\u00e3o de 1 ano id\u00eantica ao freemium (achado 5); adicionar paywall \"depois\" s\u00f3 alcan\u00e7a 5-8% da coorte (achado 1). Regra nova para `spec/mandatory-features.md` \u00a7\"APPS S\u00c3O GR\u00c1TIS\" e RULES: v1 nasce com `PaywallKit` como \u00faltimo step do onboarding (multi-p\u00e1gina, fech\u00e1vel, achado 3), trial de 7 dias (achado 6), planos semanal + anual (anual como default em Health/Fitness, mensal em Productivity, achado 7), e `paywall_*`/`purchase_*` da taxonomia j\u00e1 existente. Ficam gr\u00e1tis: apps de festa/uso \u00fanico (Sueca, Truco) e apps com AdMob servindo de verdade (LEARNINGS #80). Aplica-se primeiro aos apps existentes com sinal (D7 \u2265 7%, \u226525 ratings), um por vez (cad\u00eancia de submiss\u00e3o do Jo\u00e3o), e depois vira default do `/create-ios-app` (fase 3/4, brief do `screen-builder` ganha o step de paywall). Achados 4, 5, 6, 7, 8.\n\n2. **Onboarding com 2-3 perguntas de personaliza\u00e7\u00e3o antes da permiss\u00e3o, e a permiss\u00e3o configurada DENTRO do onboarding.** +8,5% trial / +17% pagantes com perguntas; +6,4% trial / +24% ARPU quando o lembrete \u00e9 criado no fluxo (achado 3). Mudan\u00e7a em `OnboardingKit`: novo `OnboardingQuestionStep` (single/multi choice, salva em `@AppStorage`, exp\u00f5e `onboarding_step_viewed` com `step_name`) entre features e permiss\u00e3o; o `screen-builder` recebe no brief quais perguntas segmentam o app (objetivo, frequ\u00eancia, n\u00edvel). Manter 90-180 s no total e a regra de \"1 bot\u00e3o neutro\" no step de permiss\u00e3o. Achados 3, 20.\n\n3. **PaywallKit: trial 7 dias por default, tela p\u00f3s-compra e win-back via Retention Messaging.** 3 dias cancela 55% no dia 0 (achado 6); tela p\u00f3s-compra com \"pr\u00f3ximo passo\" reduz cancelamento no dia 0 (RevenueCat); 20% dos mensais reativam em 12 meses e a Apple liberou Retention Messaging e Bundles (achado 9). A\u00e7\u00f5es: `PurchaseScaffold` com `trialDays = 7`, `PostPurchaseView` obrigat\u00f3rio, script `scripts/asc/retention_messaging.py` para configurar a oferta de cancelamento nos 5 apps pagos (Cloak, BLW, Hair Schedule, Walk, Calc+). Achados 6, 9.\n\n4. **Pre\u00e7o por pa\u00eds em todo app pago (script no lab, n\u00e3o \u00e0 m\u00e3o).** \u00cdndia -90% deu +128% de receita; Brasil e M\u00e9xico crescem 26-31% a/a em gasto (achado 10). Novo `scripts/asc/localize_prices.py`: l\u00ea o price point base (USA), aplica \u00edndice por tier (Tier 1 = 1,0; BR/MX ~0,5; IN ~0,2) e faz PATCH de `subscriptionPrices`/equalizations (receita do LEARNINGS #1 e #48). Rodar nos 5 apps pagos antes de qualquer nova itera\u00e7\u00e3o de ASO. Achado 10.\n\n5. **Ratings: responder em \u226472 h como rotina do `scan.py`, n\u00e3o como backlog.** Resposta em 72 h \u00e9 a janela em que a nota muda; reply rate 30-50% \u00e9 o pico (achado 13). O `orchestrator/scan.py` enfileira `review-responder` quando houver review sem resposta com >48 h; o Lab Hub mostra idade da review mais velha. B\u00f4nus: com Review Summaries por LLM (achado 14), reclama\u00e7\u00e3o repetida vira par\u00e1grafo p\u00fablico, ent\u00e3o o `analytics-analyst` passa a listar os 3 temas mais frequentes das reviews dos \u00faltimos 90 dias por app.\n\n6. **Crash-free: subir o piso de 99,5% para 99,9% e tratar 99,77% (P25) como bloqueio de release.** A mediana do mercado \u00e9 99,95% e 4,5\u2605 correlaciona com \u226599,85% (achado 19). Mudar `mandatory-features.md` \u00a79 e o `firebase_snapshot.py` (verde \u226599,9, amarelo \u226599,77, vermelho abaixo); os 3 apps sem Crashlytics (iPhotos, College, BLW, LEARNINGS #86) entram na fila antes de qualquer feature nova. Pinar Firebase com `exactVersion` (LEARNINGS #90) \u00e9 parte disso.\n\n7. **Featuring nomination em toda release significativa, com 3-12 semanas de anteced\u00eancia.** Custa uma hora e o efeito \u00e9 7-17x por 24 h (achado 18). O `release-runner` ganha o passo \"nomination\" (form do ASC) quando o release tem feature nova, e o `spec/pre-release-checklist.md` ganha os 7 crit\u00e9rios da Apple como checklist (UX, UI, inova\u00e7\u00e3o, unicidade, acessibilidade, localiza\u00e7\u00e3o, product page). Preencher Accessibility Nutrition Labels em todos os apps (opcional, pesquis\u00e1vel, crit\u00e9rio de featuring, achado 17): item novo no checklist.\n\n8. **Liquid Glass: flipar o default para \"adota\" nos apps novos e agendar a migra\u00e7\u00e3o dos vivos antes de abr/2027.** O opt-out some no Xcode 27 (achado 15); Walk, iPhotos, Cronos e College j\u00e1 adotaram. RULES passa a \"compat YES s\u00f3 em legado UIKit sem prazo de release\"; `/create-ios-app` gera com Liquid Glass ligado; os apps pagos (os que valem featuring) migram primeiro. Sem evid\u00eancia de convers\u00e3o, a raz\u00e3o \u00e9 o prazo e o crit\u00e9rio \"new technologies\" do featuring.\n\n9. **Portf\u00f3lio: parar de criar app gr\u00e1tis; concentrar em \u22643 apps com sinal e desligar o resto do pipeline.** O usu\u00e1rio abre 10 apps/dia, 557k apps novos/ano e a mediana est\u00e1 encolhendo (achado 8); portf\u00f3lio s\u00f3 paga com distribui\u00e7\u00e3o e paywall desde o dia 0 (achado 21). `kill_or_scale.py` passa a exigir tr\u00eas sinais para SCALE: D7 \u2265 7% (achado 2), \u226525 ratings, e paywall presente; app sem paywall n\u00e3o pode ser SCALE. Apps em recovery sem os tr\u00eas: congelar (sem release, sem ASO), o que j\u00e1 \u00e9 o veto de release magra do Jo\u00e3o.\n\n10. **Benchmarks de 2026 no `analytics-analyst` e na taxonomia.** Trocar os n\u00fameros de reten\u00e7\u00e3o do agente pelas faixas do achado 1 (por categoria) e adicionar as metas de funil: install\u2192trial 10,9% e trial\u2192pago 25,6% (Adapty), D35 hard 10,7% (RevenueCat). `event-taxonomy.md` ganha `onboarding_question_answered` e `post_purchase_viewed`.\n\n11. **App Intents/widgets s\u00f3 onde o job \u00e9 \"olhar r\u00e1pido\"** (Walk, Cronos, Sunrise): a evid\u00eancia \u00e9 fraca (achado 16), mas o custo com `AppIntent` \u00fanico \u00e9 baixo e alimenta Spotlight/Siri/Controls. N\u00e3o vira regra de lab; vira op\u00e7\u00e3o no brief do `screen-builder`.\n\n## Incerto ou controverso\n\n- **Benchmarks de reten\u00e7\u00e3o divergem 2x entre vendors** (Pushwoosh iOS D30 3,1% vs UXCam/AppsFlyer 5-8% vs Mixpanel top quartil 20%). Usar sempre a faixa da categoria e o pr\u00f3prio hist\u00f3rico do app; nunca um n\u00famero absoluto.\n- **Hard paywall e trial longo s\u00e3o correla\u00e7\u00e3o com vi\u00e9s de sobreviv\u00eancia**: os dados v\u00eam de apps que j\u00e1 cobram e de usu\u00e1rios que ficaram tempo suficiente para converter. RevenueCat admite isso no estudo de trial. A paridade de reten\u00e7\u00e3o 27/28% tamb\u00e9m n\u00e3o diz o que acontece quando um app GR\u00c1TIS passa a cobrar dos usu\u00e1rios atuais.\n- **\"Free trials n\u00e3o fazem mais sentido\" (RevenueCat, mar/2026) \u00e9 opini\u00e3o com interesse** (web-to-app e funis pr\u00f3prios). O dado deles mostra 5-9 dias convertendo melhor que \u22644, n\u00e3o que trial seja ruim.\n- **Portf\u00f3lio de 28-30 apps a US$ 22-25k/m\u00eas s\u00e3o anedotas de quem venceu**; Atterdag \u00e9 o caso mediano. Nenhuma fonte tem a taxa de sucesso do portf\u00f3lio de 20 apps.\n- **Liquid Glass**: nenhum dado de que adotar ou n\u00e3o muda convers\u00e3o, rating ou featuring. A \u00fanica certeza \u00e9 o prazo (Xcode 27) e que a Apple exibe adotantes em galeria pr\u00f3pria.\n- **Widgets/App Intents/Foundation Models**: sem evid\u00eancia de reten\u00e7\u00e3o por categoria para app pequeno. O free tier de PCC muda o custo de features de IA, n\u00e3o a demanda por elas.\n- **Tempos de App Review** t\u00eam duas vers\u00f5es oficiais (\"90% em 24 h\" vs \"90% em 48 h\") e os relatos de 2026 mostram 2-3 dias em iOS. Planejar com 3 dias.\n- **Guideline 2.1 = \">40% das rejei\u00e7\u00f5es\"** vem de vendors; a Apple publica s\u00f3 as categorias de fraude (privacidade, copycat), n\u00e3o a distribui\u00e7\u00e3o das rejei\u00e7\u00f5es comuns.\n- **Priming \"2-3x\" de opt-in** \u00e9 claim de vendor; o efeito real depende do momento, e HealthKit/c\u00e2mera n\u00e3o t\u00eam benchmark p\u00fablico. O lab deve medir com `permission_result`.\n- **Review Summaries** s\u00f3 existem em storefronts em ingl\u00eas; o impacto em pt-BR e es \u00e9 zero por enquanto.\n- **App of the Day +1.747%** \u00e9 dado de 2017; os n\u00fameros de 2026 s\u00e3o estimativas de ag\u00eancias. A ordem de grandeza (10x por 24 h) \u00e9 consistente entre as fontes.\n- **Small Business Program** usa proceeds l\u00edquidos e soma contas associadas; conferir o enrolamento na ASC (\u00e9 opt-in, n\u00e3o autom\u00e1tico).\n";</script><script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script><script>document.getElementById("md").innerHTML=window.marked?marked.parse(RAW):"<pre>"+RAW.replace(/</g,"&lt;")+"</pre>";</script></div><script>(function(){try{var k="lh.scroll:"+location.pathname;var v=sessionStorage.getItem(k);if(v!==null){sessionStorage.removeItem(k);window.scrollTo(0,parseInt(v,10)||0);}document.addEventListener("submit",function(e){var f=e.target;if(f&&f.method&&f.method.toLowerCase()==="post"){sessionStor
