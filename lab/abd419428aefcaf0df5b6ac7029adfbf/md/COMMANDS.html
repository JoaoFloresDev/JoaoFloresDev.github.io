<body><div class="wrap"><p class="sub" style="font-size:12px;margin:0 0 14px">Exportado em 2026-10-01 11:01 · fonte: Lab Hub local</p><p class="sub"><a href="../index.html">← hub</a> · <code>_GambitStudio/COMMANDS.md</code></p><div id="md"></div><script>const RAW="# GambitStudio \u2014 Manual operacional (como rodar as coisas)\n\n> Auto-loaded em toda sess\u00e3o. Regras est\u00e3o em `RULES.md`, o mapa em `INDEX.md`, bugs vividos em `LEARNINGS.md` \u2014 este arquivo N\u00c3O repete nada disso; s\u00f3 diz o que digitar e em que ordem. Paths relativos abaixo partem de `_GambitStudio/`.\n\n## 1. Setup por sess\u00e3o\nAbrir o Claude em qualquer subpasta de `` carrega RULES + INDEX + LEARNINGS-INDEX (1 linha por learning; o `LEARNINGS.md` completo se l\u00ea sob demanda) + este arquivo sozinho. Nenhum comando inicial.\n\n## 2. Skills (slash commands) \u2014 s\u00f3 as instaladas em `~/.claude/skills/`\n| Skill | Quando usar |\n|-------|-------------|\n| `/create-ios-app <descri\u00e7\u00e3o>` | App novo do zero (coordenador magro, 6 fases sem parar) |\n| `/research-aso-keywords` | ANTES do create em nicho novo: Name/Subtitle/Keywords data-driven |\n| `/build-ios` | Compilar (auto-detecta xcodegen/xcodeproj/xcworkspace/Flutter), device first |\n| `/develop-task <id>` | Bug/tarefa em 3 branches: repro \u2192 fix \u2192 post-fix repro |\n| `/code-driven-prints` | 5 prints iniciais em c\u00f3digo + upload na default page |\n| `/panorama-prints` | Prints via imagem panor\u00e2mica IA (prompt + processamento) |\n| `/start-aso-pipeline` | Itera\u00e7\u00e3o de ASO de app J\u00c1 publicado (cadeia de agentes) |\n| `/firebase-insights` | Como o app est\u00e1 indo pelos dados do GA4 |\n| `/lab-dashboard` \u00b7 `/refresh-lab-data` | Painel de vendas/reviews/A-B de todos os apps \u00b7 recoleta os dados |\n| `/lab-orchestrate <tarefa>` | Pedido amplo/vago: work order com crit\u00e9rio de pronto, ondas de agentes |\n| `/release-notes-style` | Texto do whatsNew (3 linhas, benefit-led) |\n| `/fluxo` | Recapitular a sess\u00e3o atual |\n| `/code-review` \u00b7 `/simplify` \u00b7 `/security-review` | Built-ins: review do diff, limpeza, seguran\u00e7a |\n\n## 3. Comandos em PT (o que o Jo\u00e3o digita)\n| Ele digita | Faz |\n|------------|-----|\n| `create X` / `cria app de X` | `/create-ios-app` |\n| `continue` / `status` | Retoma de onde parou / checklist feito \u00d7 faltando |\n| `build` / `compila` / `roda no device` | `/build-ios` (+ `scripts/ios-dev/install-on-device.sh`) |\n| `metadata` | Agente `aso-copywriter` \u2192 `metadata/<locale>.txt` (PT-BR/EN-US/ES-ES) |\n| `atualiza metadata da app store` | PATCH via ASC API (agente `aso-deployer`) \u2014 nunca fastlane deliver |\n| `come\u00e7ar ASO no app X` | `/start-aso-pipeline` |\n| `gere prints` | Perguntar: `/code-driven-prints` ou `/panorama-prints` |\n| `gere uma versao` / `release` | Agente `release-runner` (bump \u2192 tag \u2192 archive LOCAL \u2192 upload \u2192 manual steps). S\u00f3 com pedido expl\u00edcito |\n| `polish` | Fase 5 (agentes `polish-reviewer` + `qa-runner`) |\n| `premium` | `PaywallKit` + StoreKit 2; desde 27/09/2026 pode nascer na v1 (decis\u00e3o na Fase 1; regras em `spec/product-playbook.md`) |\n| `kill or scale o app X` | `scripts/asc/kill_or_scale.py --app-id <id> --days 45` |\n| `pega receita/downloads` | `GET /v1/salesReports` (vendor [vendor]); dashboard j\u00e1 separa install de update |\n| `pega search terms` / `lista campanhas` | `scripts/apple-ads/pull_search_terms.py` / `list_campaigns.py` |\n| `como t\u00e1 o app X no firebase` | `/firebase-insights` |\n| `responder avalia\u00e7\u00f5es` | Agente `review-responder` |\n\n## 4. Pipeline: do zero ao app vivo\nTudo dentro do `/create-ios-app`; a lista existe pra retomar no meio.\n\n**Fase 0.5 \u2014 Competitor intel** \u00b7 `scripts/aso/competitor_intel.py --term \"<nicho>\" --country us --top 5 --out <app>/competitor-intel` \u2192 agente `competitor-scout` l\u00ea e escreve `GAPS.md` (table stakes / brechas / padr\u00f5es visuais / dores). Brechas alimentam o spec; padr\u00f5es visuais, os prints.\n\n**Fase 1 \u2014 PM spec** \u00b7 features, regras de neg\u00f3cio, edge cases, telas + navega\u00e7\u00e3o.\n\n**Fase 2 \u2014 ASO metadata (100% data-driven, NUNCA inventar keyword)** \u00b7 agente `aso-copywriter`:\n1. Astro MCP, nesta ordem: `search_app_store` (top 10 do nicho) \u2192 `extract_competitors_keywords` (top 3) \u2192 `get_keyword_suggestions` (seed \u2192 varia\u00e7\u00f5es com pop/diff) \u2192 `search_rankings` (intensidade). App j\u00e1 publicado: tamb\u00e9m `get_app_keywords` + `get_app_ratings`.\n2. Apple Ads: `scripts/apple-ads/pull_search_terms.py --days 30` \u2192 termos reais com alta CR e baixa concorr\u00eancia viram long-tails.\n3. Sele\u00e7\u00e3o: long-tail first (3-5 palavras, pop 5-30, diff < 60). App novo = termos f\u00e1ceis (evitar \"calculator\"/\"timer\" soltos); app existente = empurrar o que est\u00e1 em #11-50 pro top 10. Sem duplicar entre name/subtitle/keywords (peso name >> subtitle >> keywords). Keywords empacotado at\u00e9 99 chars (medir com `len()` do Python, n\u00e3o `wc -c`).\n4. Escrever s\u00f3 DEPOIS: name 30 \u00b7 subtitle 30 \u00b7 keywords 100 (v\u00edrgula, sem espa\u00e7o) \u00b7 description 4000 \u00b7 promo 170, por locale, cada um pesquisado NO mercado da l\u00edngua. Footer com Privacy + EULA. Outputs: `metadata/<locale>.txt` \u00d7 3 + `metadata/_research/` (snapshot Astro e CSV do Apple Ads) + 1 linha justificando cada keyword.\n\n**Fase 3 \u2014 Foundation** \u00b7 paleta do nicho definida ANTES (RULES) \u2192 estrutura MVVM + kits (`GambitCoreKit`, `OnboardingKit`) \u2192 `Localizable.xcstrings` + `InfoPlist.xcstrings` \u2192 LaunchScreen (`spec/launch-screen.md`) \u2192 `project.yml` + `xcodegen generate` \u2192 `git init` + `gh repo create` \u2192 Bundle ID por API (`scripts/asc/api_client.py`) \u2192 app criado no ASC **web UI** (POST /v1/apps \u00e9 403) \u2192 Firebase com GA vinculado + `GoogleService-Info.plist` no target. Metadata entra por PATCH na ASC quando houver vers\u00e3o edit\u00e1vel; nada de fastlane/CI aqui.\n\n**Fase 4 \u2014 Desenvolvimento** \u00b7 `screen-builder` \u00d7 N em paralelo (brief denso, cada um s\u00f3 na pr\u00f3pria tela; keys de xcstrings voltam pro coordenador). Shimmer em todo loading, haptics nas a\u00e7\u00f5es-chave, eventos can\u00f4nicos de analytics. Build at\u00e9 0 erros.\n\n**Fase 5 \u2014 Polish + QA** \u00b7 `polish-reviewer` (spec, 3 tradu\u00e7\u00f5es, dark, estados vazio/erro) \u2192 `qa-runner` no simulador (pela fila `tools/sim-pool/simpool.py`) \u2192 `scripts/ios-dev/verify-mandatory-features.sh <app>` \u2192 `scripts/analytics/verify-analytics.py <app> --strict` \u2192 `scripts/verify/preflight.py <app> --only code,perms`. Testar tamb\u00e9m no sim de iPad.\n\n**Fase 6 \u2014 Prints** \u00b7 `/code-driven-prints` (5 telas reais, headline verb-split, breakout com glow) \u2192 sobe e verifica na default page.\n\n**Release (s\u00f3 quando o Jo\u00e3o pede)** \u00b7 manual no ASC web UI antes: pricing, App Privacy, content rights. Depois `release-runner`: bump \u2192 tag `release/N` (hist\u00f3rico) \u2192 archive LOCAL com o Xcode mais novo assinado pela ASC key (receita em LEARNINGS #0; o hook `~/.claude/hooks/archive-preflight.sh` nega export que reprovaria o preflight) \u2192 upload \u2192 build `VALID` na ASC \u2192 anexar \u00e0 vers\u00e3o \u2192 submeter. Notas do App Review cordiais, whatsNew via `/release-notes-style`.\n\n## 5. Pipeline: melhorando um app vivo\n**5.1 Bug / feature** \u00b7 `/develop-task` \u2192 `/code-review` \u2192 `gere uma versao`. Antes de tocar `important/`/`intermediate/`: propor e esperar aval. Depois de todo install no device: `xcrun devicectl device process launch --console --terminate-existing` por 20 s e grep de `Terminating|uncaught exception|Fatal error` \u2014 s\u00f3 ent\u00e3o \"instalado\".\n\n**5.2 ASO de texto** \u00b7 `/start-aso-pipeline`: Passo 0 por script (`sync_current_from_asc.py` \u2192 `current/asc_app.json`, `pull_analytics.py mode` standard/small, `ratings --gate`, `4.3b_risk`, `algorithm_changes.json`, conflito PPO decidido pelo Jo\u00e3o, `new_iteration.sh` meta v2) \u2192 extractor \u2192 mercado (`market_intel.py`) \u2192 longtail-miner \u2192 fit-checker \u2192 SERP (`market_intel.py serp/gap`) \u2192 serp-analyst \u2192 field-composer \u2192 `aso-listing-writer` \u2192 reporter \u2192 [autoriza\u00e7\u00e3o] `aso-deployer` (`version_diff.py` antes do 1\u00ba PATCH; PATCH direto; gate G `listing_check.py --only submittable` \u2192 `staged`/`blocked`) \u2192 `deploy-verifier`. Checkpoints D7 (s\u00f3 re-index) / D14 (1\u00aa leitura) / D28 via `aso-checkpoint`; fecho `pull_analytics.py final --write-meta` \u2192 `promote_winner.sh`. App < 100 inst/30d no alvo = modo small (posi\u00e7\u00e3o), n\u00e3o para. App sem os scripts novos: `init.sh --upgrade-scripts` (aval do Jo\u00e3o em intermediate/important).\n\n**5.3 Prints / PPO (A/B)** \u00b7 assets-base sempre na pasta `ppo-pipeline` do app (RULES). Upload com `templates/fastlane/upload_ppo.py` (copiado pro app; paralelo por locale, idempotente por checksum) em TODOS os locales e display types de iPhone da default page. Submit + Start por API (LEARNINGS #39); antes do Start, `scripts/asc/verify_experiment_prestart.py <experiment_id>`. Resultado por tratamento s\u00f3 no ASC web; CVR de p\u00e1gina por `scripts/asc/fetch_cvr.py`. Print de vers\u00e3o publicada \u00e9 imut\u00e1vel \u2014 refresh de print = vers\u00e3o nova.\n\n**5.4 Apple Ads** \u00b7 credenciais em `keys/apple_ads.env` (org 8229410). `scripts/apple-ads/list_campaigns.py` \u00b7 `pull_search_terms.py --days 30 [--campaign <id>]` \u2192 CSV; termos com alta CR e CPT baixo viram ad groups ou negativos.\n\n**5.5 Receita / downloads / veredito** \u00b7 `/lab-dashboard` (`http://localhost:8767/`) e `/refresh-lab-data`; `scripts/asc/kill_or_scale.py --app-id <id> --days 45 [--property <ga4> --stream <id>]`. Sales Report: `1*` = instala\u00e7\u00e3o, `7*` = update; `Apple Identifier` = app, `Parent Identifier` = SKU nas rows de IAP.\n\n**5.6 Analytics de produto** \u00b7 `/firebase-insights` (extractor \u2192 analyst \u2192 instrumentor). Leitura manual: `scripts/analytics/ga4_pull.py --stream <id>` (property compartilhada exige `--stream`); snapshot do lab em `scripts/analytics/firebase_snapshot.py`.\n\n**5.7 Reviews** \u00b7 agente `review-responder`; resposta publicada n\u00e3o se edita, se substitui por novo POST.\n\n## 6. Scripts compartilhados (uso direto)\n| Comando | Faz |\n|---------|-----|\n| `python3 scripts/asc/api_client.py` | Cliente ASC (JWT ES256 com defaults do lab): bundle IDs, capabilities, apps |\n| `scripts/asc/kill_or_scale.py --app-id <id> --days 45` | Veredito KILL/WATCH/SCALE por instala\u00e7\u00f5es reais + receita |\n| `scripts/asc/fetch_cvr.py --app <id> --create` \u2192 `--request <id>` | Impress\u00f5es / PV / CVR via ASC Analytics snapshot |\n| `scripts/asc/verify_experiment_prestart.py <exp_id>` | Contagem de prints por set do PPO antes do Start |\n| `scripts/asc/nominate.py` \u00b7 `purge_api_certs.py` | Featuring nomination (release-runner chama) \u00b7 revoga certs \"Created via API\" |\n| `scripts/verify/preflight.py <app> [--archive auto] [--app-id N] [--only code,archive,asc,rating,perms,trademark,listing] [--source <src>]` | Or\u00e1culos do LEARNINGS (plist compilado, c\u00f3digo, metadata live, age rating, permiss\u00f5es). Python 3.10+ (`/usr/local/bin/python3`) |\n| `scripts/verify/listing_check.py --app-id N --version editable --prev live --source <src> [--only submittable]` | P\u00e1gina da loja C1-C9 + gate G \"vers\u00e3o submet\u00edvel\" (offline: `<dir> [--prev <dir>]`) |\n| `scripts/aso/market_intel.py snapshot\\|diff\\|charts\\|serp\\|gap\\|volatility` | Mercado da itera\u00e7\u00e3o por script (concorrente, chart, SERP medida) |\n| `scripts/analytics/verify-analytics.py <app> --strict` | Eventos can\u00f4nicos faltando / fora da taxonomia / declarado-nunca-chamado |\n| `scripts/analytics/ga4_pull.py` \u00b7 `firebase_snapshot.py` | Leitura GA4 por stream \u00b7 snapshot do lab |\n| `scripts/ios-dev/install-on-device.sh` | xcodegen \u2192 build \u2192 install \u2192 launch no device |\n| `scripts/ios-dev/clear-provisioning-cache.sh` | Limpa profiles locais (capability mudou no portal) |\n| `scripts/ios-dev/verify-mandatory-features.sh <app>` | Gate PASS/FAIL das features obrigat\u00f3rias (fim da Fase 5) |\n| `scripts/localization/translate-xcstrings.py` \u00b7 `verify-localization.py` | Traduz o xcstrings pros 39 locales \u00b7 acha string hardcoded |\n| `scripts/aso/competitor_intel.py --term \"<nicho>\" --country us --top 5 --out <dir>` | Baixa meta/description/prints/\u00edcone dos concorrentes |\n| `scripts/apple-ads/list_campaigns.py` \u00b7 `pull_search_terms.py` | Apple Ads: campanhas \u00b7 search terms \u2192 CSV |\n| `scripts/mdview/mdview.py <arquivo.md>` | Apresentar um .md pro Jo\u00e3o no browser (`http://localhost:8768/`) |\n| `scripts/preview/preview <app-dir>` | Prints gerados no visual da ASC (`http://localhost:8765/`) |\n| `tools/sim-pool/simpool.py acquire\\|poll\\|heartbeat\\|release\\|status --owner <quem>` | Fila obrigat\u00f3ria dos 2 simuladores |\n| `orchestrator/wo.py` \u00b7 `orchestrator/scan.py` | Work orders (`done` exige `--evidence`) \u00b7 fila de rotina vencida |\n| `templates/fastlane/upload_ppo.py` | Upload de PPO (copiar pro app; exige as env vars da se\u00e7\u00e3o 7) |\n\nBuild fora do `/build-ios`: `xcode-select` aponta pro CLT, ent\u00e3o `xcodebuild`/`simctl` levam `DEVELOPER_DIR=\"/Applications/Xcode 2.app/Contents/Developer\"`. Builds em paralelo: `-clonedSourcePackagesDirPath` compartilhado + `COMPILER_INDEX_STORE_ENABLE=NO`.\n\n## 7. Env vars da ASC (s\u00f3 onde o script exige)\n`api_client.py`, `install-on-device.sh` e os scripts do aso-pipeline j\u00e1 t\u00eam os defaults; `templates/fastlane/upload_ppo.py` n\u00e3o:\n```bash\nAPP_STORE_CONNECT_KEY_ID=\"[key id]\" \\\nAPP_STORE_CONNECT_ISSUER_ID=\"[issuer]\" \\\nAPP_STORE_CONNECT_KEY_PATH=\"$[chave]\" \\\npython3 upload_ppo.py ...\n```\n\n## 8. Categorias de apps\nQuem pode mexer em qu\u00ea est\u00e1 em `RULES.md` (\"Categorias de apps\"). Resumo: `important/` e `intermediate/` = propor e esperar aval at\u00e9 pra editar/buildar; `recovery/` = iterar quando ele pede; archive/submit/deploy em QUALQUER categoria s\u00f3 com pedido na conversa. Lista de apps = o disco (`ls Apps/<categoria>/`).\n\n## 9. Troubleshooting r\u00e1pido\n| Sintoma | Solu\u00e7\u00e3o |\n|---------|---------|\n| \"provisioning profile doesn't include capability\" | `scripts/ios-dev/clear-provisioning-cache.sh` e rebuild com `-allowProvisioningUpdates`; se persistir, o resource (App Group/iCloud) n\u00e3o est\u00e1 atribu\u00eddo no portal |\n| App letterboxed no device | Falta `UILaunchStoryboardName` no Info.plist + `LaunchScreen.storyboard` em Resources/ |\n| LaunchScreen.storyboard n\u00e3o compila | `targetRuntime` tem que ser `iOS.CocoaTouch`, IDs no formato `xx-Xx-xxx` (`spec/launch-screen.md`) |\n| App mostra a chave crua (`home.title`) | Falta a entry no `Localizable.xcstrings` |\n| ASC bloqueia submit com \"Este campo \u00e9 obrigat\u00f3rio\" | whatsNew (a partir da 1.0.1) e supportUrl em CADA locale; localization criada por POST exige description + supportUrl |\n| Subtitle \"cabe\" no `wc -c` mas a ASC recusa | Contar com `len()` do Python (caracteres, n\u00e3o bytes) |\n| Halo no Dynamic Island do print | Nunca `.shadow()` no mockup \u2014 `RoundedRectangle().fill().blur()` como irm\u00e3o atr\u00e1s |\n| PPO upload `IMAGE_INCORRECT_DIMENSIONS` | Display type tem que casar com o da default page |\n| `/create-ios-app` parou no meio | Quase sempre erro de build \u2014 \"continue\" retoma da fase |\n";</script><script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script><script>document.getElementById("md").innerHTML=window.mar
