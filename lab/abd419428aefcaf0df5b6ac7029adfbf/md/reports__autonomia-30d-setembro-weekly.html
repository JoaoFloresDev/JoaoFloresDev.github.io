<body><div class="wrap"><p class="sub" style="font-size:12px;margin:0 0 14px">Exportado em 2026-10-01 12:36 · fonte: Lab Hub local</p><p class="sub"><a href="../index.html">← hub</a> · <code>_GambitStudio/reports/autonomia-30d-setembro-weekly.md</code></p><div id="md"></div><script>const RAW="# Autonomia 30d (02/09\u219202/10) \u2014 log semanal dos antecedentes\n\nMeta: US$200 do conjunto recovery OU um app +300 installs (1*) vs baseline\n`orchestrator/baselines/2026-09-02_todos-recovery-em-review.baseline.json`.\nJanela do dashboard = trailing 30d (installs 1*, LEARNINGS #53) \u2014 deltas de janela m\u00f3vel\ns\u00e3o ru\u00eddo no curto prazo; o que conta cedo s\u00e3o os ANTECEDENTES (rank Astro, ratings \u03947d, CVR).\n\n## Refresh #1 \u2014 2026-09-03 (D1, refer\u00eancia)\n\nEstado das alavancas: Peptide 1.1.1 LIVE (03/09); Sueca 42.0.0 / Neon 26 / Foguetinho 12.0.1 /\nphilos 1.0.3 / Bible 1.2.2 / DevLingo 1.9.0 / Cronos 1.2.0 em review; SafeDoc 1.1.0 REJEITADA\n(motivo pendente no Resolution Center \u2014 a\u00e7\u00e3o do Jo\u00e3o).\n\n| App (Tier A) | dl 30d (base\u2192hoje) | receita (base\u2192hoje) | ratings (base\u2192hoje, \u03947d) | antecedente |\n|---|---|---|---|---|\n| Sueca | 129\u2192122 | 6.29\u21926.32 | 160\u2192160 (\u03940) | 72.302 imp \u2192 1.236 pv \u2192 921 dl na janela; alavanca (42.0.0 prints+keywords) ainda n\u00e3o live |\n| Truco | 57\u219255 | 0\u21920 | 458\u2192458 (\u0394-1) | 956 imp \u2192 12 pv; iter keywords live com v49, D7 em 08/09 |\n| Neon | 83\u219276 | 0\u21920 | 22\u219222 (\u0394+1) | 28.861 imp \u2192 120 pv \u2192 155 dl; PV/imp 0,4% \u00e9 o gargalo \u2014 prints code-driven renderizados nesta noite, sobem quando a 26 aprovar |\n\nDemais: Bible ratings 2\u21923, DevLingo 1\u21922; Peptide/philos/Foguetinho/SafeDoc sem movimento.\ndl/receita ainda s\u00e3o a janela antiga se movendo \u2014 sem leitura at\u00e9 as alavancas ficarem live.\n\n### Adendo 2026-09-03 (tarde) \u2014 alavanca de convers\u00e3o do Neon\n\nA linha do Neon na tabela acima est\u00e1 desatualizada em duas coisas. Primeira: os prints n\u00e3o\nestavam renderizados \u2014 a sess\u00e3o da noite deixou s\u00f3 o gerador em `screenshots-tool/`, sem\nnenhum PNG em disco. Segunda: \"sobem quando a 26 aprovar\" n\u00e3o podia acontecer, porque a 26 j\u00e1\nestava LIVE e **a Apple congela os screenshots de uma vers\u00e3o publicada** (DELETE responde 409\n\"Can't Delete Screenshot After Submit for review\") \u2014 print novo na p\u00e1gina padr\u00e3o sempre exige\numa vers\u00e3o edit\u00e1vel.\n\n**A alavanca de convers\u00e3o do Neon entrou em 03/09:** 5 prints code-driven no LOOK da casa,\nfi\u00e9is \u00e0 build 26 (resultado neon, galeria Meus Desenhos, pinc\u00e9is, escrita 3D, visualizador),\nrenderizados e aplicados nos 8 idiomas que t\u00eam set na p\u00e1gina (en-US/GB/AU/CA, pt-BR/PT,\nes-ES/MX) \u00d7 APP_IPHONE_67 + APP_IPHONE_65 = **80 imagens**, verificadas por API (contagem,\nchecksum, ordem, estado). Foram **submetidos na vers\u00e3o 27 no mesmo dia** (03/09 ~09:30 BRT, build 27 VALID,\nreviewSubmission 45ab56bb, estado WAITING_FOR_REVIEW), junto de whatsNew de 3 linhas nos 39\nlocales. Archive local com Xcode 26.1 e cloud signing pela ASC key; preflight 23 checks, 0 FAIL.\nEntram no ar quando a Apple aprovar a 27.\n\n**O que o pr\u00f3ximo refresh deve medir:** PV/imp do Neon contra a refer\u00eancia de hoje, **0,4%**\n(28.861 impress\u00f5es \u2192 120 page views). S\u00f3 vale comparar a partir do dia em que a 27 ficar\nREADY_FOR_SALE \u2014 antes disso a p\u00e1gina viva ainda \u00e9 a dos prints antigos, e qualquer varia\u00e7\u00e3o\n\u00e9 ru\u00eddo. Os 3 primeiros prints (resultado, galeria, pinc\u00e9is) s\u00e3o os que aparecem como\nthumbnail na lista de busca, que \u00e9 onde o clique se decide.\n\n### Adendo 2026-09-03 \u2014 alavanca de convers\u00e3o do Truco\n\n**A alavanca de convers\u00e3o do Truco entrou em 03/09: D0 dos prints = hoje, separado do D0 do\ntexto, que \u00e9 02/09.** A p\u00e1gina vendia o app ANTERIOR ao redesign mesa+giz (arte de 2019/2020),\ncom 956 impress\u00f5es \u2192 12 page views (1,3%); prints movem convers\u00e3o e o checkpoint D7 de 09/09\nmede ranking de keywords, ent\u00e3o antecipar n\u00e3o contamina a medi\u00e7\u00e3o da iter-01 \u2014 esperar seis\ndias \u00e9 que custava convers\u00e3o. Subiram 5 prints code-driven fi\u00e9is \u00e0 v50 (placar, selo M\u00c3O DE\nONZE, ordem das cartas, op\u00e7\u00f5es, vit\u00f3ria) em 7 locales \u00d7 3 display types de iPhone = **21 sets,\n105 imagens**, verificados por API. Como a Apple congela screenshots de vers\u00e3o publicada,\nforam na **vers\u00e3o 51** com build 51 (WAITING_FOR_REVIEW), com as keywords dos 7 locales\nherdadas byte a byte da v50. Refer\u00eancia de convers\u00e3o a bater no pr\u00f3ximo refresh: **1,3%**,\nmedida s\u00f3 a partir do dia em que a 51 ficar READY_FOR_SALE.\n\n## Marco \u2014 2026-09-03 (fim do dia): alavancas de CONVERS\u00c3O no ar\n\nTruco 51 e Neon 27 aprovados: os prints code-driven entraram na loja hoje. \u00c9 a\nprimeira vez que a convers\u00e3o de p\u00e1gina do lab entra em teste com \u00e2ncora medida.\n\n| App | PV/imp antes | O que mudou na p\u00e1gina | D7 dos prints |\n|---|---|---|---|\n| Neon | **0,4%** (28.861 imp \u2192 120 pv) | 5 prints novos, galeria de capa | 10/09 |\n| Truco | **1,3%** (956 imp \u2192 12 pv) | 5 prints novos, app p\u00f3s-redesign + m\u00e3o de onze | 10/09 |\n\nD0 dos prints fixado nos meta.json como `parallel_levers.prints_refresh`, separado\ndo D0 do TEXTO (02/09) \u2014 prints movem convers\u00e3o, keywords movem ranking; misturar\nos dois no mesmo checkpoint \u00e9 como o lab j\u00e1 leu itera\u00e7\u00e3o errada antes.\n\nTamb\u00e9m hoje: DevLingo 1.9.0 liberada (estava PENDING_DEVELOPER_RELEASE), Peptide\n1.1.2 com metadata GLP-1 em review, e **4 vers\u00f5es rejeitadas sem causa conhecida**\n(Sueca 42.0.0, SafeDoc 1.1.0, Cronos 1.2.0, Bible 1.2.2) \u2014 o texto do Resolution\nCenter \u00e9 web-only e \u00e9 o \u00fanico bloqueio que a sess\u00e3o n\u00e3o consegue furar sozinha.\n\n## Semana 1 \u2014 fechamento (D3 do mandato, medido em 2026-09-06 02:05Z)\n\nComparador novo (`orchestrator/baselines/compare.py`) junta baseline e dashboard **por\napp_id, nunca por nome**. N\u00e3o \u00e9 preciosismo: duas itera\u00e7\u00f5es de ASO renomearam apps desde\n02/09 (`Peptide Tracker: Dose & Calc` \u2192 `GLP-1 & Dose`, `SafeDoc: PDF Scanner & Vault` \u2192\n`Document Vault & PDF`), e o join por nome derrubava os dois em sil\u00eancio \u2014 exatamente no\ncheckpoint que decide sucesso ou fracasso do m\u00eas.\n\n| App | installs 30d (hoje/base) | receita USD | ratings |\n|---|---|---|---|\n| Sueca | 130 / 129 **+1** | 6,44 / 6,29 **+0,15** | 160 (+0) |\n| Neon | 82 / 83 **\u22121** | 0,00 | 22 (+0) |\n| philos | 70 / 68 **+2** | 0,00 | 6 (+1) |\n| Truco | 66 / 57 **+9** | 0,00 | 460 (+2) |\n| Bible | 25 / 28 **\u22123** | 0,00 | 3 (+1) |\n| Peptide | 24 / 24 **+0** | 0,00 | 0 (+0) |\n| DevLingo | 23 / 24 **\u22121** | 0,00 | 2 (+1) |\n| Foguetinho | 11 / 14 **\u22123** | 0,00 | 79 (+0) |\n| SafeDoc | 6 / 5 **+1** | 0,00 | 0 (+0) |\n| **conjunto** | **437 / 432 (+5)** | **6,44 / 6,29 (+0,15)** | +5 |\n\n**Meta: faltam US$ 193,56, ou +291 installs no melhor app.** As duas janelas s\u00e3o 30d\nm\u00f3veis dos dois lados \u2014 isto \u00e9 delta de patamar, n\u00e3o acumulado desde a baseline.\n\nLeitura honesta: **nada mexeu ainda, e n\u00e3o deveria ter mexido.** Seis das oito alavancas\nentraram no ar entre 03 e 05/09; a mais antiga tem tr\u00eas dias. O \u00fanico movimento acima do\nru\u00eddo \u00e9 o Truco (+9 installs, +2 ratings), consistente com os prints code-driven que\nentraram em 03/09 \u2014 mas com n=9 sobre 57 \u00e9 direcional, n\u00e3o conclus\u00e3o.\n\n**O que trava a meta continua sendo a fila de rejei\u00e7\u00e3o, n\u00e3o a falta de alavanca.** Cinco\nvers\u00f5es est\u00e3o paradas fora da loja: Sueca 42.0.0, Cronos 1.2.0, Bible 1.2.2, SafeDoc 1.1.0\ne agora **Truco 52** (rejeitada em 04/09, a novidade desta noite). Sueca \u00e9 o app de maior\nvolume do conjunto e Truco \u00e9 o \u00fanico com sinal positivo \u2014 as duas alavancas mais promissoras\ndo m\u00eas est\u00e3o justamente do lado de fora.\n\nAntecedentes por app Tier A vs semana anterior: Neon PV/imp segue o gargalo declarado em\nD1 (0,4%) e o teste dos prints de 03/09 ainda n\u00e3o tem D7 (11/09); Truco saiu de 1,3% com\nprints novos e mede em 10/09; Sueca n\u00e3o tem antecedente novo porque a itera\u00e7\u00e3o de keywords\nvive na 42.0.0 rejeitada e portanto **n\u00e3o est\u00e1 no ar** \u2014 medir agora seria ru\u00eddo.\n\n### Corre\u00e7\u00e3o dos antecedentes desta semana (escrita em 06/09, madrugada)\n\nOs percentuais de impress\u00e3o\u2192p\u00e1gina citados acima estavam errados \u2014 n\u00e3o por leitura, por\ncoleta. O `pull_data.py` somava, no funil, um **backfill de oito meses** que a Apple entrega\nna primeira inst\u00e2ncia de um relat\u00f3rio ONGOING, como se fosse a janela recente. Na Sueca isso\nvirava 72.015 impress\u00f5es e 909 \"downloads 1\u00aa vez\" onde o real era 6.297 e 64. Corrigido e\nreprocessado hoje (commit `1779253`, 32 casos de teste incluindo meta-teste por muta\u00e7\u00e3o).\n\nN\u00fameros certos das mesmas janelas:\n\n| App | impress\u00f5es | page views | imp\u2192PV | instala\u00e7\u00f5es 1* (30d) | redownloads 3* |\n|---|---|---|---|---|---|\n| Sueca | 6.297 | 126 | 2,00% | 130 | 100 |\n| Neon | 6.106 | 11 | **0,18%** | 82 | 42 |\n| Truco | 1.482 | 12 | 0,81% | 66 | **130** |\n| Foguetinho | 1.357 | 7 | 0,52% | 11 | 7 |\n| philos | 1.459 | 30 | 2,06% | 70 | 7 |\n\n**O que muda de conclus\u00e3o.** O gargalo do Neon continua sendo o gargalo \u2014 e \u00e9 pior do que\ndizia o D1: 0,18%, n\u00e3o 0,4%. O Truco n\u00e3o estava 48\u00d7 atr\u00e1s da Sueca em impress\u00f5es (era a\ncompara\u00e7\u00e3o que eu tinha feito), est\u00e1 4,2\u00d7 \u2014 a tese de \"colapso de ranking\" fica mais modesta\ne a meta da itera\u00e7\u00e3o de ASO dele precisa ser dimensionada por 1.482 impress\u00f5es, n\u00e3o pelo\nn\u00famero inflado. O que ficou **mais** forte \u00e9 a raz\u00e3o redownload/instala\u00e7\u00e3o do Truco: 130\ncontra 66, a maior do conjunto, o que indica base legada viva voltando ao app.\n\n**O juiz do mandato n\u00e3o muda.** A auditoria reagrupou os 47 relat\u00f3rios di\u00e1rios crus por\nProduct Type sem usar o c\u00f3digo do lab e obteve 130 para a Sueca, id\u00eantico ao painel; a\nbaseline de 02/09 guardou o mesmo campo (`downloads_window`) com a mesma janela, e nenhuma\ncorre\u00e7\u00e3o desta noite o toca. **O delta da tabela principal continua v\u00e1lido** \u2014 foi s\u00f3 o\nbloco de funil que estava contaminado.\n\nDuas ressalvas que o checkpoint de 02/10 tem que carregar: o **Cronos n\u00e3o estava na\nbaseline** (9 apps, n\u00e3o 10 \u2014 addendum em `orchestrator/baselines/2026-09-06_cronos-addendum.baseline.json`),\ne a **receita continua cega a an\u00fancio** (LEARNINGS #80), com Neon, Truco e Foguetinho\nservindo interstitial que o relat\u00f3rio de vendas n\u00e3o enxerga.\n\nNota de m\u00e9todo: o `first_downloads` do App Store Analytics \u00e9 cortado pelo piso de\nprivacidade da Apple (nenhuma linha com menos de 5 eventos), ent\u00e3o em app pequeno ele\nmostra zero onde o relat\u00f3rio de vendas mostra dezenas \u2014 no Neon ele enxerga 0% do real.\n**N\u00e3o usar o funil da loja como denominador**; o denominador \u00e9 o Sales Report.\n";</script><script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script><script>document.getElementById("md").innerHTML=window.marked?marked.parse(RAW):"<pre>"+RAW.replace(/</g,"&lt;")+"</pre>";</script></div><script>(function(){try{var k="lh.scroll:"+location.pathname;var v=sessionStorage.getItem(k);if(v!==null){sessionStorage.removeItem(k);window.scrollTo(0,parseInt(v,10)||0);}document.addEventListener("submit",function(e){var f=e.target
