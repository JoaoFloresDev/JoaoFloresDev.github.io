/* ---------- camada de acabamento (01/10/2026) ----------
   Tipografia com duas vozes (display para títulos e números, texto para leitura),
   neutros com viés do azul da marca em vez de cinza puro, e profundidade por
   sombra em vez de só borda. Nada aqui renomeia classe: é uma camada por cima. */
:root{
  --f-disp:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --f-text:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --bg:#eef1f7; --card:#ffffff; --tx:#0a0d14; --mut:#4b5567; --acc:#2b3340;
  --bd:#cbd3e0; --bd-soft:#dfe5ee; --ok:#07804e; --down:#c42121; --warn:#9a4408;
  --sh:0 1px 2px rgba(16,19,26,.05),0 2px 8px rgba(16,19,26,.04);
  --sh-up:0 2px 6px rgba(16,19,26,.07),0 10px 24px rgba(16,19,26,.07);
  --cardup:#ffffff; --bdup:#b9c3d4;
  --boardtop:#e9edf5; --boardbot:#e3e8f1;
  --bar:#2563eb; --bar2:#60a5fa;
  --rad:14px;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#07090d; --card:#141922; --tx:#f7f9fc; --mut:#b2bdd0; --acc:#ccd6e6;
  --bd:#333c4c; --bd-soft:#232a36; --ok:#55e39d; --down:#ff8585; --warn:#ffbb55;
  --sh:0 1px 2px rgba(0,0,0,.4); --sh-up:0 6px 22px rgba(0,0,0,.5);
  --cardup:#1d2430; --bdup:#3d4859;
  --boardtop:#0d1218; --boardbot:#090d13;
  --bar:#5b9bff; --bar2:#9dc4ff;
}}

h1 .mark{display:inline-block;width:28px;height:28px;vertical-align:-5px;margin-right:11px;
  background-size:contain;background-repeat:no-repeat;background-position:center}
h2{font-family:var(--f-disp);font-size:12px;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;color:var(--mut);border-top:1px solid var(--bd-soft);
  padding-top:22px;margin:32px 0 14px}
h3{font-family:var(--f-disp);letter-spacing:-.01em}
.sub{font-size:13px;color:var(--mut)}
code,.mono{font-family:var(--f-mono);font-size:12.5px}
.card,table.t,a.tile,.row,.fcard,#md{box-shadow:var(--sh);border-color:var(--bd-soft)}
.card,a.tile,.row,.fcard{border-radius:var(--rad)}
a.tile,.row{transition:box-shadow .16s ease,border-color .16s ease,transform .16s ease}
a.tile:hover,a.row:hover{box-shadow:var(--sh-up);border-color:var(--bd);
  transform:translateY(-1px)}
/* O card do app é área de leitura, não botão: nada muda no hover. A regra antiga
   trocava a sombra, e num card sem sombra isso aparecia como animação. */
.fcard,.fcard:hover{transition:none!important;transform:none!important}
/* big numbers: the first thing anyone reads on the page */
.tiles{gap:12px;margin:18px 0 4px}
a.tile{padding:13px 17px;min-width:148px}
.tile .tl{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
  color:var(--mut)}
.tile .tv{font-family:var(--f-disp);font-size:25px;font-weight:800;letter-spacing:-.025em;
  margin-top:3px}
.tile .ts{font-size:11.5px;color:var(--mut)}
.tile .tvd{font-family:var(--f-text);font-size:13px;font-weight:600;letter-spacing:0;white-space:nowrap}
/* tables read as data, not as prose */
table.t{border-radius:var(--rad);font-variant-numeric:tabular-nums}
table.t th{font-family:var(--f-disp);font-size:11px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;background:var(--bd-soft);border-bottom:1px solid var(--bd)}
table.t td{padding:9px 13px;border-bottom:1px solid var(--bd-soft)}
table.t tbody tr:hover td,table.t tr:hover td{background:rgba(125,140,170,.06)}
.twrap{border-radius:var(--rad)}
/* buttons */
.btn{font-family:var(--f-disp);font-weight:600;font-size:13.5px;padding:9px 18px;
  border-radius:999px;box-shadow:var(--sh);transition:all .16s ease}
.btn:hover{border-color:var(--acc);box-shadow:var(--sh-up);transform:translateY(-1px)}
.pill,.st{font-family:var(--f-disp);font-weight:600;font-size:11.5px;letter-spacing:.02em}
/* status colours carry meaning, so keep them out of the accent */
.st.run,.st.appr{background:rgba(10,143,88,.14);color:var(--ok)}
.st.crit{background:rgba(208,47,47,.14);color:var(--down)}
.st.rev,.st.draft{background:rgba(180,83,9,.14);color:var(--warn)}
/* the lanes strip and any scroller get a thin, rounded bar */
.hrow,.twrap,.tiles{scrollbar-width:thin;scrollbar-color:var(--bd) transparent}
.hrow::-webkit-scrollbar,.twrap::-webkit-scrollbar,.tiles::-webkit-scrollbar{height:9px}
.hrow::-webkit-scrollbar-track,
.twrap::-webkit-scrollbar-track,
.tiles::-webkit-scrollbar-track{background:transparent}
.hrow::-webkit-scrollbar-thumb,
.twrap::-webkit-scrollbar-thumb,
.tiles::-webkit-scrollbar-thumb{background:var(--bd);border-radius:999px;
  border:3px solid transparent;background-clip:content-box}
.hrow::-webkit-scrollbar-thumb:hover,
.twrap::-webkit-scrollbar-thumb:hover,
.tiles::-webkit-scrollbar-thumb:hover{background:var(--mut);background-clip:content-box}
.hrow{background:transparent;border:0;padding:0;border-radius:0}
.hcol{flex:0 0 clamp(280px,26vw,360px);min-width:0}
a:focus-visible,button:focus-visible,.btn:focus-visible{outline:2px solid var(--acc);
  outline-offset:2px;border-radius:8px}
.dirlist,.prlist{margin:10px 0 0;padding-left:18px;list-style:none}
.dirlist>li,.prlist>li{position:relative;margin:0 0 7px;font-size:13.5px;line-height:1.5;
  color:var(--tx)}
.prlist>li{color:var(--mut);font-size:13px;margin-bottom:5px}
.dirlist>li::before,.prlist>li::before{content:"";position:absolute;left:-14px;top:.62em;
  width:5px;height:5px;border-radius:50%;background:var(--acc);opacity:.75}
.prlist>li::before{background:var(--mut);opacity:.5}
.dirp{display:none}
.dapps{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));
  margin:14px 0 4px;align-items:start}
.dapp{padding:14px 16px}
.dah{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.dah b{font-family:var(--f-disp);font-size:14.5px;font-weight:700}
.drank{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;
  border-radius:6px;background:var(--acc);color:var(--card);font-size:11.5px;font-weight:700;flex:none}
.st.d-dobrar{background:rgba(10,143,88,.16);color:var(--ok)}
.st.d-consertar{background:rgba(180,83,9,.16);color:var(--warn)}
.st.d-manter{background:rgba(125,140,170,.16);color:var(--mut)}
.st.d-congelar{background:rgba(125,140,170,.12);color:var(--mut)}
.dapp .prlist{margin-top:6px}
.dcall{color:var(--tx)!important;font-weight:600}
.fcard[id]{scroll-margin-top:18px}
.fdet{margin-top:10px;border-top:1px solid var(--bd-soft);padding-top:9px}
.fdet>summary{cursor:pointer;list-style:none;font-family:var(--f-disp);font-size:11.5px;
  font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);
  display:flex;align-items:center;gap:7px}
.fdet>summary::-webkit-details-marker{display:none}
.fdet>summary::before{content:"›";font-size:15px;transition:transform .15s}
.fdet[open]>summary::before{transform:rotate(90deg)}
.fdet>summary:hover{color:var(--acc)}
.fdet table.t{font-size:12.5px}
.fdet table.t td,.fdet table.t th{padding:6px 10px}
.fgrid.one{grid-template-columns:1fr!important;gap:18px}
/* Cada app é um painel com profundidade: a luz entra por cima, o corpo escurece
   até a base e a borda clareia só na primeira linha. É o que separa um app do
   outro sem precisar de moldura dura. */
.fgrid.one>.fcard{position:relative;padding:0;overflow:hidden;border-radius:16px;
  border:1px solid var(--bd-soft);
  background:linear-gradient(180deg,
    color-mix(in srgb, var(--acc) 5%, var(--card)) 0%,
    var(--card) 26%,
    color-mix(in srgb, #000 7%, var(--card)) 100%);
  box-shadow:0 1px 2px rgba(0,0,0,.05), 0 10px 26px -14px rgba(0,0,0,.28)}
@media(prefers-color-scheme:dark){.fgrid.one>.fcard{
  background:linear-gradient(180deg,
    color-mix(in srgb, var(--acc) 9%, var(--card)) 0%,
    var(--card) 30%,
    #0a0c10 100%);
  box-shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 18px 40px -22px rgba(0,0,0,.9)}}
.fgrid.one>.fcard::before{content:"";position:absolute;inset:0 0 auto;height:1px;
  background:linear-gradient(90deg, transparent,
    color-mix(in srgb, var(--acc) 45%, transparent), transparent)}
.fgrid.one>.fcard>.fh{background:transparent;margin:0;padding:15px 18px 12px;
  border-bottom:1px solid var(--bd-soft)}
.fgrid.one>.fcard>.fstats{padding:12px 18px 0}
.fgrid.one>.fcard>.fcols{padding:16px 18px 6px}
.fgrid.one>.fcard>.fdet{margin:0;padding:13px 18px 16px;border-top:1px solid var(--bd-soft);
  background:color-mix(in srgb, #000 4%, transparent)}
@media(prefers-color-scheme:dark){.fgrid.one>.fcard>.fdet{
  background:rgba(0,0,0,.25)}}
.fgrid.one>.fcard>.fh b{font-size:16px;letter-spacing:-.01em}
.fgrid.one>.fcard>.fh>span{font-size:12.5px;color:var(--tx);opacity:.78;
  font-variant-numeric:tabular-nums;font-weight:500}
/* a luz no topo do painel, um pouco mais presente */
.fgrid.one>.fcard::before{height:2px;
  background:linear-gradient(90deg, transparent, var(--acc), transparent);opacity:.5}
.fcard .fmeta{font-size:12px;color:var(--mut)}
/* funil: rótulo legível, número com peso, barra com corpo */
.fs{display:grid;grid-template-columns:150px 1fr auto;align-items:center;gap:12px;
  padding:5px 0}
.fs .fl{font-size:12.5px;color:var(--tx)}
.fs .fn{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;min-width:74px;
  text-align:right}
.fb{height:9px;border-radius:999px;background:var(--bd-soft);overflow:hidden}
.fb i{display:block;height:100%;border-radius:999px}
/* retenção com leitura imediata */
.rrow{margin:0}
.rc:first-child{border-top:0;padding-top:0}
/* o rótulo é legenda; quem salta é o número, na cor da régua */
.rc b{display:block;font-family:var(--f-disp);font-size:10px;font-weight:700;
  letter-spacing:.09em;text-transform:uppercase;color:var(--mut);margin:0}
.rc .rv{display:block;font-family:var(--f-disp);font-size:21px;font-weight:800;
  letter-spacing:-.025em;line-height:1.15;margin:3px 0 2px;font-variant-numeric:tabular-nums}
.rc>b{font-family:var(--f-disp);font-size:12px;font-weight:700;letter-spacing:.04em;
  color:var(--mut)}
.rc .rv{font-family:var(--f-disp);font-size:19px;font-weight:800;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums}
.rc .rb{display:block;font-size:11.5px;color:var(--mut)}
/* achados: mais ar e marcador claro */
.fnds li{font-size:12.5px;line-height:1.5;padding:4px 0 4px 16px}
.fnds li:before{width:6px;height:6px;top:.72em}
/* o detalhe convida a abrir */
.fdet>summary{font-size:11px;color:var(--acc);padding:3px 0}
.fdet>summary:hover{opacity:.82}
.fcols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;
  align-items:start}
@media(max-width:820px){.fcols{grid-template-columns:1fr;gap:12px}}
.fcol{min-width:0}
.fcol>.fnds{margin-top:0}
/* Régua de contexto do app: instalações, ativos, novos, crash-free. Antes isso
   era uma linha de texto corrido ("187 downloads/30d · WATCH · crash-free
   100%") que ninguém comparava entre cards; como números rotulados, dá pra
   varrer a coluna de cima a baixo. */
.fstats{display:flex;flex-wrap:wrap;gap:10px 26px;align-items:baseline}
.fst{display:flex;align-items:baseline;gap:7px;min-width:0}
.fstl{font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:var(--mut)}
.fst b{font-family:var(--f-disp);font-size:15px;font-weight:700;letter-spacing:-.015em;
  font-variant-numeric:tabular-nums}
.fstd{font-size:12px;font-weight:600}
.st.vd{background:rgba(125,140,170,.14);color:var(--mut)}
.fh .noasc{font-size:11.5px;font-weight:400;color:var(--warn)}
/* Cada metade do card diz o que é antes de mostrar número. */
.fgrp{margin-bottom:16px}
.fgrp:last-child{margin-bottom:0}
.fgl{display:block;font-family:var(--f-disp);font-size:10.5px;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;color:var(--mut);
  padding-bottom:7px;margin-bottom:10px;border-bottom:1px solid var(--bd-soft)}
.fcol>.fgrp>.fnds{margin-top:0}
.instrl{list-style:none;margin:9px 0 0;padding:0}
.instrl li{font-size:12.5px;line-height:1.55;color:var(--mut);padding:3px 0 3px 14px;
  position:relative;overflow-wrap:anywhere}
/* Coluna de leitura: linhas rotuladas, sem caixa. As caixas coloridas (funil
   verde, ação amarela) e o bloco expansível empilhavam quatro objetos de forma
   diferente num espaço estreito; rótulo à esquerda e texto à direita, separados
   por uma régua fina, lê de cima a baixo sem nada competindo (João, 02/10). */
.rline{display:grid;grid-template-columns:116px minmax(0,1fr);gap:16px;
  padding:12px 0;border-top:1px solid var(--bd-soft)}
.rline:first-child{border-top:0;padding-top:0}
.rlab{font-family:var(--f-disp);font-size:10.5px;font-weight:700;letter-spacing:.07em;
  text-transform:uppercase;color:var(--mut);padding-top:2px}
.rbody{min-width:0}
.rbody>b{display:block;font-family:var(--f-disp);font-size:14px;font-weight:700;
  letter-spacing:-.01em;line-height:1.35}
.rnum{display:block;margin-top:3px;font-size:12px;font-weight:600;color:var(--tx);
  font-variant-numeric:tabular-nums}
.rbody>p{margin:5px 0 0;font-size:12.5px;line-height:1.55;color:var(--mut)}
.rline.act .rlab{color:var(--tx)}
.rline.mut .rlab,.rline.mut .instrl li{color:var(--mut)}
.rbody>.fnds{margin:0}
@media(max-width:1180px){.rline{grid-template-columns:1fr;gap:6px}
  .rline .rlab{padding-top:0}}
.instrl{list-style:none;margin:0;padding:0}
.instrl li{font-size:12.5px;line-height:1.55;color:var(--mut);padding:2px 0 2px 14px;
  position:relative;overflow-wrap:anywhere}
.instrl li::before{content:"";position:absolute;left:0;top:.72em;width:5px;height:5px;
  border-radius:50%;background:var(--bd)}
/* Os passos de loja vêm de outra fonte que os de dentro do app: barra em tom
   mais surdo pra o olho ver onde a medição troca de sistema. */
.fs .fb i.store{background:linear-gradient(90deg,
  color-mix(in srgb, var(--bar) 45%, transparent),
  color-mix(in srgb, var(--bar) 70%, transparent))}
.fsub{display:block;font-size:10.5px;font-weight:600;letter-spacing:.07em;
  text-transform:uppercase;color:var(--mut);margin-bottom:6px}
.fsub.gap2{margin-top:14px}
.lchip{font-size:10px;color:var(--mut);background:var(--bd-soft);border-radius:999px;
  padding:1px 7px;cursor:help;white-space:nowrap}
.fcols{position:relative}
@media(min-width:821px){.fcols::before{content:"";position:absolute;top:0;bottom:0;
  left:50%;width:1px;background:var(--bd-soft)}}
.fdet .ascgrid{grid-template-columns:repeat(auto-fit,minmax(118px,1fr))}
.fdetcols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;
  align-items:start}
@media(max-width:1100px){.fdetcols{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:760px){.fdetcols{grid-template-columns:1fr}}
.fdetcols>div{min-width:0;display:flex;flex-direction:column;gap:14px}
.rawbox{background:var(--bg);border:1px solid var(--bd-soft);border-radius:11px;
  padding:11px 13px;min-width:0}
.rawbox h4,.rawbox h3.team{margin:0 0 8px;font-family:var(--f-disp);font-size:10.5px;
  font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--mut)}
.rawbox h3.team .chain{text-transform:none;letter-spacing:0;font-size:11px}
.rawbox table.t{border:0;box-shadow:none;background:transparent}
.rawbox table.t th{background:transparent;border-bottom:1px solid var(--bd)}
.rawbox table.t td{border-bottom:1px solid var(--bd-soft)}
.rawbox .twrap{border-radius:0}
.rawbox .ascgrid{margin-bottom:0;grid-template-columns:repeat(auto-fit,minmax(104px,1fr))}
.rawbox .ascgrid b{font-size:14px}
.srct{float:right;font-size:9px;font-weight:700;letter-spacing:.06em;padding:2px 7px;
  border-radius:999px;background:var(--bd);color:var(--mut);text-transform:uppercase}
.s-asc{background:rgba(125,140,170,.16);color:var(--tx)}
.s-firebase{background:rgba(180,83,9,.14);color:var(--warn)}
.noasc{background:rgba(180,83,9,.14);color:var(--warn);border-radius:999px;padding:1px 8px;
  font-size:10.5px;font-weight:600}
.convwhy{display:block;font-size:10.5px;color:var(--mut);margin-top:1px}
.rawbox .rate{padding:1px 7px;border-radius:999px;font-size:12.5px}
.featname{display:block;font-family:var(--f-mono);font-size:11.5px;margin-bottom:3px}
.featbar{display:block;height:4px;border-radius:999px;background:var(--bd-soft);overflow:hidden}
.featbar i{display:block;height:100%;border-radius:999px;
  background:linear-gradient(90deg, color-mix(in srgb, var(--acc) 70%, transparent), var(--acc))}
.legacyp{margin:8px 0 0;font-size:12px;color:var(--mut);line-height:1.7}
.legacyp code{font-size:11px}
.rawbox .ascgrid>div{background:var(--card)}
.fdet{margin-top:14px;border-top:1px solid var(--bd);padding-top:12px}
.fdet[open]>summary{margin-bottom:12px;color:var(--acc)}
.t .thsub{font-size:9.5px;font-weight:600;letter-spacing:.03em;color:var(--mut);
  text-transform:none}
.t .rate{padding:1px 8px;border-radius:999px;font-variant-numeric:tabular-nums}
.t .rate.good{background:rgba(10,143,88,.16);color:var(--ok)}
.t .rate.mid{background:rgba(180,83,9,.14);color:var(--warn)}
.t .rate.low{background:rgba(208,47,47,.13);color:var(--down)}
.thin{font-size:10.5px;color:var(--mut);background:var(--bd-soft);border-radius:999px;
  padding:1px 7px;cursor:help;white-space:nowrap}
.sbx{font-size:12px;color:var(--warn);background:rgba(180,83,9,.12);border-radius:999px;
  padding:1px 8px;cursor:help;white-space:nowrap}
.sbxnote{font-size:11.5px;color:var(--warn);background:rgba(180,83,9,.10);
  border:1px solid rgba(180,83,9,.25);border-radius:9px;padding:7px 10px;margin:0 0 10px}
.actv{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 9px;margin:0 0 10px;
  padding:8px 11px;border-radius:10px;background:var(--bd-soft)}
.actvt{font-family:var(--f-disp);font-size:10px;font-weight:800;letter-spacing:.09em;
  text-transform:uppercase;color:var(--mut)}
.actv b{font-family:var(--f-disp);font-size:15px;font-variant-numeric:tabular-nums}
.actvw{flex-basis:100%;font-size:11px;color:var(--mut)}
.fover{font-size:10.5px;color:var(--warn);background:rgba(180,83,9,.12);border-radius:999px;
  padding:1px 7px;cursor:help;white-space:nowrap}
.hspan{display:inline-block;margin-left:10px;font-size:10.5px;font-weight:600;letter-spacing:.04em;
  text-transform:none;color:var(--mut);background:var(--bd-soft);padding:2px 9px;border-radius:999px;
  vertical-align:2px}
.ascspan{font-size:11px;color:var(--mut);margin:2px 0 7px}
.ascgrid{display:grid;gap:7px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
  margin-bottom:10px}
.ascgrid>div{background:var(--bd-soft);border-radius:9px;padding:7px 10px;min-width:0}
.ascgrid span{display:block;font-size:10px;color:var(--mut);text-transform:uppercase;
  letter-spacing:.04em}
.ascgrid b{font-family:var(--f-disp);font-size:15px;font-variant-numeric:tabular-nums}
.fcard[id]:target{border-color:var(--acc);box-shadow:0 0 0 2px rgba(125,140,170,.3),var(--sh-up)}
/* ---------- acabamento: luz e profundidade (01/10) ----------
   Gradiente é usado onde tem função: a luz no topo dá direção à página, a barra
   do funil ganha volume, e o cabeçalho de cada app se separa do conteúdo. Fundo
   chapado em tudo o resto, para os números seguirem sendo o que salta. */
body{background:
  radial-gradient(1100px 420px at 12% -8%, color-mix(in srgb, var(--acc) 11%, transparent), transparent 70%),
  radial-gradient(900px 360px at 88% -4%, color-mix(in srgb, var(--ok) 7%, transparent), transparent 72%),
  var(--bg);
  background-attachment:fixed}

  -webkit-background-clip:text;background-clip:text;color:transparent}

h2{position:relative}
h2::after{content:"";position:absolute;left:0;top:0;width:44px;height:2px;
  background:linear-gradient(90deg, var(--acc), transparent)}
h2:first-of-type::after,h1+h2::after,.sub+h2::after{display:none}
a.tile{background:linear-gradient(170deg, color-mix(in srgb, var(--card) 100%, transparent),
  color-mix(in srgb, var(--acc) 5%, var(--card)))}
.fb i,.fs .fb i{background:linear-gradient(90deg,var(--bar),var(--bar2))}
.fgrid.one>.fcard>.fh{background:linear-gradient(180deg,
  color-mix(in srgb, var(--acc) 7%, var(--card)), var(--bd-soft))}
.ascgrid b,.tile .tv{background:linear-gradient(180deg, var(--tx), color-mix(in srgb, var(--tx) 72%, var(--mut)));
  -webkit-background-clip:text;background-clip:text;color:transparent}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
/* ---------- celular (14/10) ----------
   No iPhone a página nunca rola de lado: grade cede a largura pros filhos, tabela
   rola dentro do .twrap, o menu rola dentro da própria faixa. Quadro e big numbers
   seguem numa linha só com rolagem horizontal, em qualquer largura (João, 14/10). */
.cols>*,.cols2>*,.grid>*,.grid4>*,.dapps>*,.fgrid>*{min-width:0}
.board .hrow,.tiles{flex-wrap:nowrap!important;overflow-x:auto}
#md table{display:block;max-width:100%;overflow-x:auto}
#md p,#md li,#md :not(pre)>code{overflow-wrap:anywhere}
img,video{max-width:100%}
@media(max-width:860px){
  .topin{width:calc(100vw - 28px)}
}
@media(max-width:620px){
  /* header do celular (24/10): UMA linha de 52 px — cavalo + abas que rolam de
     lado com encaixe; a data sai do header fixo e vira a 1ª linha da página. */
  .topin{flex-wrap:nowrap;gap:2px;padding:4px 0;
    padding-left:env(safe-area-inset-left,0px)}
  a.brand{flex:none;min-width:44px;min-height:44px;justify-content:center;gap:0}
  a.brand .mark{width:24px;height:24px}
  a.brand .bname{display:none}
  .stamp{display:none}
  .navs{flex:1 1 auto;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;
    -webkit-overflow-scrolling:touch;scroll-snap-type:x proximity;overscroll-behavior-x:contain;
    margin-right:-14px;padding:0 max(14px,env(safe-area-inset-right,0px)) 0 2px;gap:2px;
    -webkit-ma[redigido]:linear-gradient(90deg,#000 calc(100% - 28px),transparent);
    ma[redigido]:linear-gradient(90deg,#000 calc(100% - 28px),transparent)}
  .navs::-webkit-scrollbar{display:none}
  a.nav{flex:none;scroll-snap-align:start;min-height:44px;padding:0 12px;gap:6px;font-size:14px}
  a.nav .flw-mon{width:24px;height:24px}
  .mstamp{display:block;margin:-10px 0 10px;font-size:11.5px;color:var(--mut)}
  .mstamp+style+h2,.mstamp+h2{margin-top:6px}
  div.own{padding:6px 12px;margin:0 0 12px;gap:10px}
  div.own img.flw-mon{width:40px;height:40px}
  details.pk-legend{padding:0 14px;margin-bottom:12px}
  details.pk-legend>summary{min-height:44px;padding:11px 0}
  body{font-size:15px;overflow-wrap:break-word}
  h1{font-size:24px}
  .sub,.card p,.row,.dirp,.prw,.nots li,.dirlist>li{font-size:14px}
  table.t td,table.t th{font-size:13.5px}
  table.t td:first-child,table.t th:first-child{min-width:148px}
  #md{padding:16px 14px}
  .board{padding:12px 0 14px;margin-left:0;margin-right:0}
  .boardh{padding:0 14px}
  .board .hrow{padding:12px 14px 12px;scroll-padding:0 14px}
  a.more,.btn{display:inline-flex;align-items:center;min-height:44px}
  .row{min-height:44px}
  .del{min-width:44px;min-height:44px;opacity:.7}
  .iid{position:relative}
  .iid::after{content:"";position:absolute;inset:-12px -8px}
  .fdet>summary,details>summary{min-height:44px}
  .fs{grid-template-columns:minmax(0,118px) minmax(0,1fr) auto}
  .leak,.fnote{margin-left:0}
  /* quadro no celular: rolagem lateral, como quadro (João 14/10, e de novo 25/10: "deixa como quadro que eu
     consigo fazer scroll horizontal, ficou muito extenso na vertical" — o empilhamento de 25/10 saiu).
     Fazer abre o quadro, com o item em trabalho no topo; Backlog fica por último. */
  .board .hcol{order:3}.board .hcol.k-do{order:1}.board .hcol.k-wait{order:2}.board .hcol.k-backlog{order:4}
  .row.working .vwork{flex-wrap:wrap}
  .row .sub{white-space:normal}
  /* big numbers em grade de 2 no celular: nada cortado */
  .tiles{display:grid!important;grid-template-columns:1fr 1fr;overflow-x:visible!important}
  .tiles>.tile,a.tile{min-width:0!important;padding:10px 12px}
  .tile .tv{font-size:clamp(17px,5.4vw,22px)!important;white-space:normal}
}

html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
a.nav.on{background:color-mix(in srgb,var(--bar) 13%,transparent);color:var(--tx);
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--bar) 22%,transparent)}
a.nav .flw-mon{transition:transform .18s ease}

/* dono da seção: legenda calma ao lado do título, não mais um segundo título em caixa alta */
h2 .ownb,h3 .ownb{text-transform:none;letter-spacing:0;font-family:var(--f-text);font-size:12.5px;font-weight:500;vertical-align:middle}
h2 .ownb .ownp b,h3 .ownb .ownp b{font-weight:700}
div.own{border-color:var(--bd-soft);box-shadow:var(--sh);border-radius:var(--rad)}
h1+div.own{margin-top:12px}
/* big numbers que não são link (Seller) ganham o mesmo cartão dos da home */
.tiles>div.tile{background:linear-gradient(170deg,var(--card),color-mix(in srgb,var(--acc) 5%,var(--card)));
  border:1px solid var(--bd-soft);border-radius:var(--rad);padding:13px 17px;box-shadow:var(--sh);min-width:148px}
@media(max-width:620px){
  .mstamp{margin:-6px 0 12px}
  .card,a.tile,.tiles>div.tile,.row,.fcard,div.own,.board,table.t,.twrap,#md{border-radius:16px}
  .tiles>div.tile{min-width:0;padding:10px 12px}
  h1{font-size:26px;line-height:1.2}
  h2{margin-top:28px}
}

\u2026`, `2026-05-30_iter-02\u2026`, `2026-08-24_iter-03\u2026` e `2026-09-30_iter-04-text-de-DE-name-subtitle-keywords/`\n- `AG/` = `~/.claude/agents/`\n\n**Classes:** `dado` (o insumo est\u00e1 errado ou falta) \u00b7 `processo` (a ordem ou o gate da cadeia permite o erro) \u00b7 `agente` (o prompt manda fazer errado, ou o agente violou o pr\u00f3prio contrato) \u00b7 `script` (bug ou lacuna em c\u00f3digo) \u00b7 `medi\u00e7\u00e3o` (o resultado n\u00e3o pode ser lido).\n\n## Tabela-resumo por est\u00e1gio\n\n| Est\u00e1gio | Falhas | dado | processo | agente | script | medi\u00e7\u00e3o |\n|---|---|---:|---:|---:|---:|---:|\n| S0 Coordenador / bootstrap / template | F01\u2013F07 | 0 | 3 | 0 | 4 | 0 |\n| S1 aso-extractor | F08\u2013F14 | 2 | 0 | 1 | 4 | 0 |\n| S2 aso-longtail-miner | F15\u2013F16 | 0 | 0 | 2 | 0 | 0 |\n| S3 aso-fit-checker | F17, F18, F37, F38 | 0 | 3 | 1 | 0 | 0 |\n| S4 aso-serp-analyst | F19\u2013F20 | 0 | 1 | 1 | 0 | 0 |\n| S5 aso-field-composer | F21\u2013F23 | 0 | 1 | 1 | 1 | 0 |\n| S6 aso-reporter | F24\u2013F26 | 0 | 2 | 1 | 0 | 0 |\n| S7 aso-deployer | F27\u2013F29 | 0 | 1 | 1 | 0 | 1 |\n| S8 deploy-verifier | F30 | 0 | 0 | 1 | 0 | 0 |\n| S9 aso-checkpoint / medi\u00e7\u00e3o | F31\u2013F35 | 1 | 0 | 0 | 1 | 3 |\n| Transversal (evals) | F36 | 0 | 0 | 1 | 0 | 0 |\n| **Total (38)** | | **3** | **11** | **10** | **10** | **4** |\n\nA leitura transversal:\n1. **Nada fecha o ciclo.** Nenhuma das 4 itera\u00e7\u00f5es foi medida (F31). O detector n\u00e3o v\u00ea o meta fora do schema (F32). A m\u00e9trica prim\u00e1ria da iter-04 n\u00e3o tem script (F33).\n2. **Os artefatos n\u00e3o s\u00e3o verificados entre si.** Isso vale pra `current/` \u00d7 live (F08), `locales.json` \u00d7 invent\u00e1rio (F09), meta \u00d7 baselines (F13, F24) e vers\u00e3o nova \u00d7 vers\u00e3o live (F27, F30). O \u00fanico verificador de consist\u00eancia \u00e9 o reporter, lendo.\n3. **O learning n\u00e3o vira c\u00f3digo nem prompt.** Isso aconteceu com o promo n\u00e3o herdado (F27, 5 semanas antes), com a tool que derruba o Astro (F15), com o `--pull` (F10), com o fix do macOS fora do template (F07) e com o rating-first (F03).\n4. **O escopo da cadeia \u00e9 estreito demais.** Description (F18), paywall (F38) e whatsNew (F28) n\u00e3o t\u00eam dono, e foi neles que estavam os defeitos de maior risco de review.\n\n### As 10 de maior impacto\n| # | Falha | Por qu\u00ea |\n|---|---|---|\n| F31 | 0 de 4 itera\u00e7\u00f5es medidas | o pipeline n\u00e3o sabe se algum texto funcionou |\n| F18 | description sem dono | lixo de chat no locale prim\u00e1rio e \"100% gr\u00e1tis\" com paywall ficaram no ar por 3 itera\u00e7\u00f5es |\n| F17 | \"casal\" no ar sem a feature | 40 posi\u00e7\u00f5es de inten\u00e7\u00e3o errada no \u00fanico storefront com avalia\u00e7\u00f5es, com risco 2.3.1 |\n| F08 | `current/` era a listagem do macOS | achado falso atravessou 6 est\u00e1gios, e o template ainda tem o bug |\n| F02 | gates sem modo app-pequeno | a resposta padr\u00e3o \u00e9 \"pare\", e o override produz itera\u00e7\u00e3o imensur\u00e1vel |\n| F27 | promo n\u00e3o herdado em 16 locales | learning de 26/08 nunca virou check |\n| F30 | verificador \"232/232 ok\" cego a regress\u00e3o | a garantia de deploy \u00e9 falsa pra campo n\u00e3o tocado |\n| F11 | nenhuma 2\u00aa fonte de volume | a regra de 2\u00aa fonte \u00e9 insatisfaz\u00edvel, e 1.601/1.601 termos s\u00e3o s\u00f3-Astro |\n| F33 | m\u00e9trica prim\u00e1ria sem script | a iter-04 vai ser fechada \u00e0 m\u00e3o, o que a regra 5 pro\u00edbe |\n| F28 | deploy \"feito\" em vers\u00e3o n\u00e3o submet\u00edvel | whatsNew vazio nos 29 e build travado, sem gate |\n\n---\n\n## S0 \u2014 Coordenador, bootstrap e template\n\n### F01 \u00b7 O coordenador escreveu premissas erradas no brief (13 locales, pt-BR prim\u00e1rio), e elas chegaram ao meta.json e ao now.json \u00b7 `processo`\n- **Evid\u00eancia:**\n  - `I4/research/locales.json:2` diz *\"Corrected from 13 after stage 1 read the real ASC state\"*.\n  - `locales.json:144-145` (`corrections_from_stage1`): *\"App PRIMARY locale is en-US, not pt-BR \u2026 the 'Portuguese fallback' finding from the brief is WRONG\"*.\n  - `I4/meta.json:130` (`scope_note`).\n  - Causa-raiz: `MG/README.md:5` diz `Primary locale: pt-BR`, gerado pelo default `PRIMARY_LOCALE=\"pt-BR\"` de `TPL/init.sh:23` e nunca conferido. `I4/research/asc_state.json` diz `\"primaryLocale\": \"en-US\"`.\n- **Impacto:** o achado falso \"GB/IE/LK veem portugu\u00eas, gap de maior valor\" (`locales.json:99`) entrou no artefato can\u00f4nico de locales e quase foi pro relat\u00f3rio. O escopo real (29 locales) s\u00f3 apareceu no est\u00e1gio 1, depois de a premissa j\u00e1 estar gravada.\n- *Corrigiria:* o Passo 0 l\u00ea `primaryLocale` e a lista de localizations da ASC antes de escrever o brief, e n\u00e3o usa o README do app.\n\n### F02 \u00b7 Os dois gates reprovam praticamente todo app do lab e a \u00fanica resposta \u00e9 \"pare\". N\u00e3o existe modo para app pequeno \u00b7 `processo`\n- **Evid\u00eancia:**\n  - `I4/meta.json:132-162` (`gates_overridden`): piso de 100 inst/30d com DE 25, BR 45 e US 9; rating-first com DE 2.\n  - A skill `start-aso-pipeline` (Passo 0) diz: *\"Reprovou \u2192 responder 'alavanca \u00e9 ratings/prints/produto' e n\u00e3o abrir a itera\u00e7\u00e3o\"*.\n  - `reports/2026-09-27_results-audit/aso_efficacy.md` (O que mudar, item 4) registra que 9 das 16 itera\u00e7\u00f5es estariam bloqueadas.\n- **Impacto:** o Jo\u00e3o fez override, a cadeia rodou sem regra para esse caso e a itera\u00e7\u00e3o nasceu declaradamente imensur\u00e1vel (`meta.json:162`, `measurement_caveat`). A m\u00e9trica prim\u00e1ria foi trocada \u00e0 m\u00e3o para posi\u00e7\u00e3o Astro (`meta.json:16`), sem script que a me\u00e7a (ver F33).\n- *Corrigiria:* um modo app-pequeno formal, medido por posi\u00e7\u00e3o em termos-alvo e com r\u00e9gua pr\u00f3pria.\n\n### F03 \u00b7 O gate rating-first s\u00f3 existe no papel \u00b7 `script`\n- **Evid\u00eancia:**\n  - `grep -n rating TPL/scripts/pull_analytics.py` s\u00f3 encontra o texto de `lever` (l.401). N\u00e3o existe subcomando que leia ratings.\n  - O `AG/aso-deployer.md`, nas Preconditions (l.9-16), checa piso e quarentena, mas n\u00e3o ratings.\n  - Na skill, o Passo 0 executa s\u00f3 o `floor`.\n- **Impacto:** o gate \"<25 ratings = ratings antes de ASO\" (RULES) n\u00e3o bloqueia nada por c\u00f3digo. Na iter-04 ele reprovou com DE 2 (`locales.json:130-138`), e quem notou foi um agente lendo, n\u00e3o um exit code.\n\n### F04 \u00b7 A quarentena foi derrubada por um PPO que atravessa a janela inteira de medi\u00e7\u00e3o \u00b7 `processo`\n- **Evid\u00eancia:**\n  - `I4/meta.json:471` (`ppo_overlap`): *\"O PPO 9570de85 roda at\u00e9 2026-11-27 e atravessa toda a janela de medi\u00e7\u00e3o\"*.\n  - `I4/meta.json:193` (`quarantine_override`) registra a quarentena com exit 3 e override.\n  - A auditoria de 27/09 (`REPORT.md`, decis\u00e3o 8) j\u00e1 recomendava parar esse PPO por falta de poder estat\u00edstico (542 semanas para +15%).\n- **Impacto:** a regra 3 do aso_efficacy, criada justamente porque 11 de 16 itera\u00e7\u00f5es tinham PPO ou release na janela, foi contornada na primeira itera\u00e7\u00e3o depois de existir. N\u00e3o h\u00e1 passo que resolva o conflito (parar o PPO ou adiar o texto) antes de pedir override.\n\n### F05 \u00b7 `init.sh` e o README gerado apontam pra paths mortos e pra chave errada \u00b7 `script`\n- **Evid\u00eancia:**\n  - `TPL/init.sh:59` usa `KEY_PATH = \"[chave]\"`, que n\u00e3o \u00e9 o path da chave do lab.\n  - `TPL/scripts/deploy.sh:94` repete o mesmo default.\n  - `TPL/init.sh:131-132` gera um README que aponta pra `aso-pipeline-template/README.md` e `aso_cross_project_learnings.md`, e nenhum dos dois existe. O resultado est\u00e1 em `MG/README.md:9-10`.\n  - O quick-start do mesmo README (`init.sh:136-145`) manda rodar `./scripts/deploy.sh`.\n- **Impacto:** a auto-resolu\u00e7\u00e3o de SKU l\u00ea a chave do lugar errado, e todo app novo nasce com um README que leva pra lugar nenhum e recomenda o caminho proibido (fastlane, ver F06).\n\n### F06 \u00b7 Os scripts legados do template continuam copiados pra todo app e quebrados \u00b7 `script`\n- **Evid\u00eancia:**\n  - `TPL/scripts/deploy.sh:95` roda `fastlane sync_metadata`, que o LEARNINGS #13 e o COMMANDS 5.2 pro\u00edbem. As l.104-106 gravam `status: running` + `deploy_timestamp` no dia do PATCH (D0 errado, regra 1 do aso_efficacy).\n  - `TPL/scripts/promote_winner.sh:64` faz `w.setdefault('history',[])`, mas o `registry/winners.json` nasce `[]` (`init.sh:118`). Simulado em `MG/registry/winners.json`: `AttributeError: 'list' object has no attribute 'setdefault'`. A l.41 manda fazer o rollback via fastlane.\n  - `TPL/scripts/new_iteration.sh:124` semeia `research/keyword_candidates.md` com *\"popularity \u2265 30, difficulty \u2264 50\"*, um filtro que contradiz o playbook \u00a74.\n- **Impacto:**\n  - A iter-01 foi deployada por fastlane empurrando 13 locales pra mudar s\u00f3 o pt-BR (`I1/meta.json:123`).\n  - Fechar qualquer itera\u00e7\u00e3o com `promote_winner.sh` crasha, e por isso `winners.json` est\u00e1 vazio desde 25/05.\n  - A iter-03 tem dois `keyword_candidates.md`: o real na raiz e o stub do template, nunca preenchido, em `I3/research/`.\n\n### F07 \u00b7 O fix n\u00e3o volta pro template, as c\u00f3pias por app viram fork e o meta.json n\u00e3o tem schema obrigat\u00f3rio \u00b7 `script`\n- **Evid\u00eancia:**\n  - O fix de plataforma existe s\u00f3 na c\u00f3pia do app (`MG/scripts/sync_current_from_asc.py:62-65`). O template continua sem filtro (`TPL/scripts/sync_current_from_asc.py:53-54`).\n  - `verify_current.py:49` n\u00e3o tem filtro nem no template nem no app.\n  - O `astro_mcp.py` do app tem `serp/suggestions/competitors`, que o template n\u00e3o tem, e o template tem `call`, que o app n\u00e3o tem.\n  - `TPL/README.md:61` admite: *\"As c\u00f3pias de 27/09/2026 nos ge1`) dizem que cai em en-US. As duas se\u00e7\u00f5es convivem no mesmo arquivo.\n  - Os Tier C aparecem com `astro_pulled: false` (l.150-246), mas `inventory.md:27-42` e os arquivos `astro_vn.json`, `astro_ru.json` etc. mostram que todos foram puxados.\n  - As instala\u00e7\u00f5es divergem entre `locales.json` e `inventory.md:9-42`:\n\n    | locale | `locales.json` | `inventory.md` |\n    |---|---:|---:|\n    | ru | 6 | 3 |\n    | nl-NL | 4 | 3 |\n    | es-MX | 10 | 9 |\n    | en-US | 19 | 18 |\n\n  - O arquivo n\u00e3o \u00e9 o output de `top_locales.py --json`, que o `AG/aso-extractor.md:20` manda gravar. \u00c9 um JSON escrito \u00e0 m\u00e3o com tiers.\n- **Impacto:** o artefato que a skill declara como \"os locales de toda a cadeia\" tem duas verdades. O relat\u00f3rio cita en-US 19 e o invent\u00e1rio cita 18, e o pr\u00f3ximo leitor n\u00e3o sabe qual vale.\n\n### F10 \u00b7 O prompt do extractor manda rodar um comando que n\u00e3o existe \u00b7 `agente`\n- **Evid\u00eancia:**\n  - `AG/aso-extractor.md:18` manda rodar `verify_current.py --pull`.\n  - `I4/research/inventory.md:146`: *\"`--pull` does not exist, not in this app's copy nor in the lab template\"*.\n  - Est\u00e1 no backlog desde maio (`aso/learnings.md:171`, \"verify_current.sh --pull\") e nunca foi implementado.\n- **Impacto:** o passo 1 do est\u00e1gio 1 falha em toda execu\u00e7\u00e3o, e cada agente improvisa o substituto (usou o `sync_current`, que era o bugado, F08).\n\n### F11 \u00b7 N\u00e3o existe 2\u00aa fonte de volume pra este app, e a cadeia exige uma \u00b7 `dado`\n- **Evid\u00eancia:**\n  - `I3/research/baselines.md` (Method D) registra o report App Store Search Terms como *\"absent, not pending\"* entre 156 reports.\n  - `I4/research/inventory.md:110-117` registra *\"no campaigns for this app\"* no Apple Ads e *\"No per-query volume exists from any source\"*.\n  - As 1.601 linhas dos 29 `serp_winnability_*.csv` t\u00eam `pop nao confiavel`.\n  - O `AG/aso-serp-analyst.md:15` e a regra 10 do `AG/aso-field-composer.md` exigem a 2\u00aa fonte para gastar name/subtitle.\n- **Impacto:** a regra est\u00e1 estruturalmente insatisfaz\u00edvel no app. A iter-04 inventou uma \"2\u00aa fonte\" ad hoc, a posi\u00e7\u00e3o observada em outras storefronts (`keyword_candidates.md:177`), que n\u00e3o est\u00e1 definida em playbook nenhum. Os ~1.924 termos Astro-only vieram de uma escala congelada desde out/2025.\n\n### F12 \u00b7 O cron de search terms aponta pra um diret\u00f3rio que n\u00e3o existe e procura um report que n\u00e3o existe \u00b7 `script`\n- **Evid\u00eancia:**\n  - `crontab -l` tem a linha `53 21 * * * \u2026/Apps/recovery/flutter/Controle-de-gastos/aso-pipeline/scripts/cron_pull_search_terms.sh # meus_gastos_search_terms`. O app foi movido pra `Apps/intermediate/` e o path antigo d\u00e1 `No such file or directory`.\n  - O script (`MG/scripts/cron_pull_search_terms.sh:11`) s\u00f3 se auto-remove quando acha \"Top search terms\", e o report n\u00e3o existe no cat\u00e1logo (F11).\n- **Impacto:** um job di\u00e1rio falha em sil\u00eancio pra sempre. A esperan\u00e7a de \"o volume real chega quando o snapshot processar\" (maio) nunca foi encerrada.\n\n### F13 \u00b7 Um dos dois m\u00e9todos de baseline estava errado havia um m\u00eas, e o meta.json ficou \"unresolved\" \u00b7 `script`\n- **Evid\u00eancia:**\n  - O `AG/aso-extractor.md:26` exige os dois n\u00fameros (`kill_or_scale.py` + `pull_analytics.py`).\n  - `I4/research/baselines.json:32-45`:\n\n    | m\u00e9todo | instala\u00e7\u00f5es 45d | atualiza\u00e7\u00f5es 7* |\n    |---|---:|---:|\n    | `kill_or_scale` | 187 | 0 |\n    | recomputo do mesmo cache | 256 | 434 |\n\n  - `baselines.json:441` (`divergence_resolved`): o teste de prefixo `startswith('7')` n\u00e3o casa `F7`, e `startswith('1')` perde os 73 `F1` (LEARNINGS #100).\n  - `I4/meta.json:206` (`open_data_conflict`) ficou aberto at\u00e9 o reporter cruzar os artefatos.\n- **Impacto:** o veredito WATCH e a taxa de 4,2/dia vieram de uma conta errada. O reporter achou o `meta.json` dizendo \"unresolved\" enquanto o `baselines.json` j\u00e1 tinha resolvido. A regra de \"2 m\u00e9todos\" n\u00e3o define qual vence nem o que fazer com a diverg\u00eancia.\n\n### F14 \u00b7 O Astro \u00e9 inst\u00e1vel e cada agente o trata com driver ad hoc. O cliente do lab acredita em contador que mente \u00b7 `script`\n- **Evid\u00eancia:**\n  - `I4/research/inventory.md:147-149`:\n    - o MCP estava indispon\u00edvel;\n    - o `astro_mcp.py` foi estendido com 6 subcomandos;\n    - deu 500 repetido, com 2-3 restarts por store;\n    - `extract_competitors_keywords` *\"Never succeeded, any store\"*.\n  - O `AG/aso-extractor.md:22` manda reiniciar e \"retry once\".\n  - `TPL/scripts/astro_mcp.py:193-202` soma `data.get(\"added\")`, que o LEARNINGS #99 mediu como mentira (`added: 0` com os termos entrando).\n  - `cmd_pull` (l.209-214) n\u00e3o valida se o payload \u00e9 do app pedido (j\u00e1 aconteceu, `aso/learnings.md:337`).\n- **Impacto:** com agentes paralelos, uma chamada de concorrente derruba o servidor de todos. As extens\u00f5es do driver ficaram s\u00f3 na c\u00f3pia do app (F07). Uma leitura de outro app pode virar dado sem alarme.\n\n---\n\n## S2 \u2014 aso-longtail-miner\n\n### F15 \u00b7 Os prompts ainda mandam usar a tool que derruba o Astro \u00b7 `agente`\n- **Evid\u00eancia:**\n  - `AG/aso-longtail-miner.md:19` manda usar `extract_competitors_keywords` *\"on tracked terms containing the word\"*.\n  - `AG/aso-copywriter.md:21` manda usar `extract_competitors_keywords` *\"on top 3\"*.\n  - O LEARNINGS #99 mediu 7 de 7 falhas, com o servidor caindo por cerca de 60 s. Na iter-04 foram 0 sucessos em 29 stores (`inventory.md:149`).\n  - O pr\u00f3prio `TPL/scripts/astro_mcp.py:22-24` documenta o teto de 1 tentativa, mas os prompts n\u00e3o.\n- **Impacto:** o learning ficou no doc e no docstring, n\u00e3o no agente. Cada execu\u00e7\u00e3o paralela do miner tira o Astro do ar pros outros est\u00e1gios.\n\n### F16 \u00b7 O output dos est\u00e1gios n\u00e3o segue o contrato de colunas, e nada valida isso \u00b7 `agente`\n- **Evid\u00eancia:**\n  - `I4/research/longtails_de.csv:1` tem o header `long_tail,core_word,source,popularity,difficulty,our_rank,note`. Faltam a coluna `Volume Source` que o `AG/aso-longtail-miner.md:24-25` exige e a data no nome do arquivo.\n  - `serp_winnability_br.csv:1` n\u00e3o tem `Volume Source`, `CPP Candidate` nem `Top3 Owner`, que o `AG/aso-serp-analyst.md:34` exige.\n  - `grep -c astro-only` d\u00e1 0 nos 58 CSVs, porque a flag foi pra texto livre em `rationale`.\n- **Impacto:** o checkpoint e o composer n\u00e3o conseguem filtrar mecanicamente \"aposta s\u00f3-Astro\". A regra 10 do composer depende de um campo que n\u00e3o existe.\n\n---\n\n## S3 \u2014 aso-fit-checker\n\n### F17 \u00b7 A promessa \"casal\" ficou 4 meses na loja sem o app ter a feature, e continua no ar \u00b7 `processo`\n- **Evid\u00eancia:**\n  - `I2/meta.json` (`approach_rationale`) p\u00f4s `casal` no name e no subtitle em 30/05 com a premissa *\"App supports it (login+cloud sync = couple shares one account)\"*.\n  - A iter-03 provou no source que n\u00e3o h\u00e1 pagador nem participante (`I3/keyword_candidates.md:7-14`: `CardModel` sem pessoa, Firestore `.collection(userId)`).\n  - O subtitle aplicado na iter-04 continua `Finan\u00e7as do casal e pessoais` (`I4/proposed/metadata/pt-BR/subtitle.txt`, variante A).\n  - O relat\u00f3rio registra o risco 2.3.1 (`I4/research/keyword_candidates.md:44`).\n- **Impacto:** 40 posi\u00e7\u00f5es \u2264#50 dependem de uma inten\u00e7\u00e3o que o produto n\u00e3o atende, no \u00fanico storefront com massa de avalia\u00e7\u00e3o (BR, 18). O fit-checker s\u00f3 nasceu em 18/08. Nada reavalia retroativamente o texto que j\u00e1 estava no ar, e a decis\u00e3o de manter ficou sem gatilho mensur\u00e1vel de reabertura (s\u00f3 a condi\u00e7\u00e3o da l.46).\n\n### F18 \u00b7 A description n\u00e3o pertence a est\u00e1gio nenhum, e os defeitos dela passaram por 3 itera\u00e7\u00f5es \u00b7 `processo`\n- **Evid\u00eancia:**\n  - A regra 9 do `AG/aso-field-composer.md` diz que s\u00f3 os 4 campos indexam e que a description est\u00e1 fora. O fit-checker s\u00f3 *l\u00ea* a description (`AG/aso-fit-checker.md:13`).\n  - A description viva do en-US termina com `\u2026stdeula/Tentar novamenteO Claude pode cometer erros. Confira sempre as respostas.` (`MG/current/metadata/en-US/description.txt:18`). Esse \u00e9 o locale prim\u00e1rio, que toda storefront sem listing pr\u00f3prio v\u00ea.\n  - `I4/research/keyword_candidates.md:208` lista \"100% gr\u00e1tis\" com paywall em 12 locales.\n  - `I4/research/keyword_candidates.md:209` lista promessa de notifica\u00e7\u00e3o (o app n\u00e3o tem notifica\u00e7\u00e3o) em 5 locales.\n- **Impacto:** lixo de UI de chat e alega\u00e7\u00f5es falsas de pre\u00e7o e de feature ficaram ao vivo durante as iter-01/02/03. Foram achados por acaso no est\u00e1gio 6 da iter-04 e corrigidos no deploy sem um est\u00e1gio dono, sem checklist e sem eval.\n\n---\n\n## S4 \u2014 aso-serp-analyst\n\n### F19 \u00b7 84% das notas de winnability n\u00e3o olharam o SERP \u00b7 `agente`\n- **Evid\u00eancia:** 1.341 das 1.601 linhas dos 29 `I4/research/serp_winnability_*.csv` dizem `SERP nao medida \u2026 classificado por heranca de categoria`. Ainda assim recebem LOTTERY, UNWINNABLE ou CLIMB (ex.: `serp_winnability_br.csv:2-5`).\n- **Impacto:** o est\u00e1gio cuja raz\u00e3o de existir \u00e9 \"quem \u00e9 dono do SERP\" pontua a grande maioria dos termos sem SERP. O composer n\u00e3o distingue nota medida de nota herdada.\n\n### F20 \u00b7 Quando um est\u00e1gio falha, a cadeia segue e o coordenador faz o trabalho do agente \u00b7 `processo`\n- **Evid\u00eancia:**\n  - `I3/meta.json:53`: *\"stage 4 (SERP/winnability) failed three times, so no winnability scoring exists\"*.\n  - `I3/meta.json` (`confidence_limits`): *\"protection map was assembled by the coordinator\"*.\n  - A skill diz: *\"N\u00c3O fazer an\u00e1lise voc\u00ea mesmo\"*.\n- **Impacto:** a iter-03 foi deployada sem posi\u00e7\u00e3o-alvo por termo, ent\u00e3o n\u00e3o havia o que conferir num checkpoint. O mapa de prote\u00e7\u00e3o foi feito fora do agente que tem a regra. N\u00e3o existe condi\u00e7\u00e3o de parada nem de retry por est\u00e1gio.\n\n---\n\n## S5 \u2014 aso-field-composer\n\n### F21 \u00b7 A composi\u00e7\u00e3o alternativa n\u00e3o \u00e9 versionada: a variante A sumiu do disco quando foi preciso reverter \u00b7 `processo`\n- **Evid\u00eancia:**\n  - `I4/research/composition_rationale.md:101`: o est\u00e1gio 5 *\"comp\u00f4s a variante B e apagou a variante A do disco\"*. O Jo\u00e3o reverteu no mesmo dia e o deployer reconstruiu a A a partir das restri\u00e7\u00f5es do rationale.\n  - Hoje a B vive como `I4/proposed/metadata/pt-BR__sem-casal/`, dentro da \u00e1rvore que o deployer l\u00ea.\n  - `TPL/scripts/validate_proposed.py:149` itera *todo* diret\u00f3rio de `proposed/metadata/` e valida `pt-BR__sem-casal` como se fosse um locale.\n- **Impacto:**\n  - O texto aplicado foi reconstru\u00eddo, n\u00e3o recuperado.\n  - Um deploy ing\u00eanuo que iterasse `proposed/metadata/*` tentaria PATCH num \"locale\" inexistente.\n  - A contagem de `excel` deu 16 locales em vez de 15 (F24).\n\n### F22 \u00b7 O composer viola as pr\u00f3prias regras duras sem bloqueio (apostas acima do teto e termos fora da pesquisa) \u00b7 `agente`\n- **Evid\u00eancia:**\n  - `I3/research/composition_rationale.md:45` declara um \"Desvio de regra\": 4 tokens novos no pt-BR, contra o \"max ~3\" da regra 3.\n  - Na iter-04, tr\u00eas tokens novos de Tier C aparecem em **0** arquivos de pesquisa daquele store (candidates, longtails, current_pool e astro_*.json, verificado por grep): `faste` (da), `\u03c0\u03b1\u03b3\u03b9\u03b1` (el) e `dagliga` (sv). Isso fere o *\"never invent terms that aren't in the research files\"* (`AG/aso-field-composer.md:7`).\n  - `excel`, marca registrada, entrou em 15 locales e s\u00f3 virou risco 5.2.5 depois, no relat\u00f3rio (`I4/meta.json:444`).\n- **Impacto:** as apostas desses locales n\u00e3o t\u00eam pop, rank nem fonte, e o checkpoint n\u00e3o tem baseline pra elas. Nenhum check impede, e o eval de artefato do composer s\u00f3 cobre acento.\n\n### F23 \u00b7 `validate_proposed.py` produz ru\u00eddo e n\u00e3o checa o que importa \u00b7 `script`\n- **Evid\u00eancia:**\n  - Rodado em `I4`: 0 blockers e **99 warnings**. A maioria \u00e9 \"fill the budget\", `pdf` marcado como truncado, tokens CJK curtos como \"truncados\" e a stopword `e` no subtitle pt-BR.\n  - O pr\u00f3prio meta registra *\"96 warnings em 4 fam\u00edlias conhecidas e justificadas\"* (`I4/meta.json:129`).\n  - O script n\u00e3o checa:\n    - acento em token novo;\n    - o token `app`;\n    - termos fora da pesquisa;\n    - description e promo com alega\u00e7\u00e3o proibida;\n    - se o diret\u00f3rio \u00e9 um locale de verdade.\n- **Impacto:** um warning que sempre dispara \u00e9 ignorado (o mesmo diagn\u00f3stico do LEARNINGS #63 sobre eval que grita \u00e0 toa), e os defeitos reais de F18, F21 e F22 passaram com \"exit 0\".\n\n---\n\n## S6 \u2014 aso-reporter\n\n### F24 \u00b7 Os artefatos de est\u00e1gios diferentes discordam entre si, e ningu\u00e9m cruza antes do relat\u00f3rio \u00b7 `processo`\n- **Evid\u00eancia:**\n  - `I4/meta.json:172` registra *\"CORRECAO AO BRIEF\"*: o brief dizia 10 DOMINATE e `serp_winnability_de.csv` tem 11.\n  - `excel` aparece em 16 diret\u00f3rios de `proposed/` (15 locales + `pt-BR__sem-casal`), e o meta cita 15 (l.444).\n  - O meta afirmou \"promotionalText null em todos os 29\", e isso foi desmentido depois (l.166/269).\n  - `open_data_conflict` (l.206) ficou \"unresolved\" no meta enquanto `baselines.json:441` j\u00e1 tinha resolvido (F13).\n- **Impacto:** o reporter vira o primeiro e \u00fanico verificador de consist\u00eancia, por leitura humana, no \u00faltimo est\u00e1gio antes do deploy. Cada inconsist\u00eancia que ele n\u00e3o pega vira fato no `meta.json`.\n\n### F25 \u00b7 O prompt do reporter obriga a inventar probabilidades \u00b7 `agente`\n- **Evid\u00eancia:**\n  - `AG/aso-reporter.md:22` exige *\"probabilities of hitting conservador/bold\"*.\n  - Resultado: `I4/research/keyword_candidates.md:321` diz *\"conservador ~45% \u2026 bold ~25%. As duas s\u00e3o estimativas sobre uma base que n\u00e3o permite teste de hip\u00f3tese\"*, e `I4/meta.json:92,101` grava `probability_pct: 45/25`.\n- **Impacto:** n\u00fameros sem m\u00e9todo entram no artefato can\u00f4nico como se fossem dado, justo na itera\u00e7\u00e3o que o pr\u00f3prio relat\u00f3rio declara imensur\u00e1vel (F02).\n\n### F26 \u00b7 O template e o GOLD contradizem o playbook e o pr\u00f3prio reporter \u00b7 `processo`\n- **Evid\u00eancia:**\n  - `TPL/TEMPLATE_keyword_candidates.md:11` diz *\"pop=5 = PISO do Astro (ru\u00eddo)\"*, e a l.12 traz um filtro quadrante por pop/diff. O playbook \u00a74 diz *\"Pop=5 \u00e9 'desconhecido', n\u00e3o piso \u2026 nunca ganha char s\u00f3 por pop\"*.\n  - O template (l.21-33) e o `aso/reference/README.md` (itens 1-3) exigem cabe\u00e7alho com Data, Source, Filtro, tabela de pesos e Princ\u00edpio. O `AG/aso-reporter.md:11` pro\u00edbe exatamente isso.\n  - O relat\u00f3rio da iter-04 ainda diz *\"pop=5 / diff=5 \u00e9 o PISO da escala\"* (`keyword_candidates.md:11`).\n- **Impacto:** tr\u00eas documentos can\u00f4nicos d\u00e3o tr\u00eas instru\u00e7\u00f5es diferentes sobre o mesmo n\u00famero. O agente escolhe, e a terminologia errada continua circulando.\n\n---\n\n## S7 \u2014 aso-deployer\n\n### F27 \u00b7 `promotionalText` n\u00e3o herdou em 16 locales ao criar a 45.4.0 por API, e o learning de agosto nunca virou check \u00b7 `agente`\n- **Evid\u00eancia:**\n  - `I4/research/promotional_text_not_inherited.json` lista 16 locales (cs, da, el, fi, he, hi, hu, ms, nl-NL, no, pl, ru, sv, th, uk, vi) com promo na 45.3.1 e `null` na 45.4.0.\n  - `I4/meta.json:166/269` corrige o fato anterior, *\"null em todos os 29\"*.\n  - O mesmo comportamento est\u00e1 documentado desde 26/08 em `aso/learnings.md:332-335` (Hair Schedule): *\"toda vers\u00e3o criada por POST /v1/appStoreVersions \u2192 conferir promotionalText \u2026 ANTES de qualquer PATCH\"*.\n  - O `AG/aso-deployer.md` cita promo s\u00f3 como campo PATCH\u00e1vel (l.21). N\u00e3o tem passo de heran\u00e7a.\n- **Impacto:** se a 45.4.0 subir como est\u00e1, 16 storefronts perdem a linha promocional. A viola\u00e7\u00e3o do LEARNINGS #62 (learning com \"conferir\" precisa nascer com check) se repetiu num caso j\u00e1 vivido 5 semanas antes.\n\n### F28 \u00b7 O deploy declara \"feito\" uma vers\u00e3o que n\u00e3o pode ser submetida: whatsNew vazio nos 29 e build travado \u00b7 `processo`\n- **Evid\u00eancia:**\n  - `I4/meta.json:881` registra *\"whatsNew est\u00e1 VAZIO nos 29 locales da 45.4.0 \u2026 obrigat\u00f3rio a partir da 1.0.1 \u2014 a submiss\u00e3o fica bloqueada sem ele\"*.\n  - O `now.json` (item `meusgastos-45-4-0-submit`) registra o build iOS travado no `verify-analytics.py --strict` (2 eventos).\n  - O COMMANDS \u00a79 j\u00e1 lista *\"whatsNew \u2026 em CADA locale\"* como causa de bloqueio. O `AG/aso-deployer.md` n\u00e3o tem gate de \"vers\u00e3o submet\u00edvel\".\n- **Impacto:** o texto foi marcado como aplicado (`now.json` done de 01/10) numa vers\u00e3o que n\u00e3o chega \u00e0 review sem trabalho adicional do Jo\u00e3o. A data de `live_at` (estimada em 06/10, `meta.json:417`) n\u00e3o tem base.\n\n### F29 \u00b7 Deployar numa vers\u00e3o rejeitada e chamar de \"deployed\" apaga o D0 \u00b7 `medi\u00e7\u00e3o`\n- **Evid\u00eancia:**\n  - `I3/meta.json` (`deployed_to`) registra `versionString 45.3.0`, `state_at_deploy: DEVELOPER_REJECTED`, com `deployed: true` e `status: running`.\n  - N\u00e3o existe `live_at`, e o texto s\u00f3 chegou ao usu\u00e1rio com a 45.3.1 (`I4/meta.json`, `previous_iteration_note`), numa data que nenhum artefato da iter-03 registra.\n  - As datas D7/14/28 (`I3/meta.json:84`) contam do PATCH (25/08).\n- **Impacto:** a itera\u00e7\u00e3o ficou com uma janela de medi\u00e7\u00e3o sem \u00e2ncora. A auditoria de 27/09 teve de reconstruir o live (28/08) pelo pico de updates 7* (`aso_efficacy.md`, linha Meus Gastos iter-03).\n\n---\n\n## S8 \u2014 deploy-verifier\n\n### F30 \u00b7 O verificador compara o que foi aplicado com o arquivo local, n\u00e3o com a vers\u00e3o anterior, e procura no path errado \u00b7 `agente`\n- **Evid\u00eancia:**\n  - `I4/meta.json:876` registra *\"232/232 asserts, 0 diverg\u00eancias, 0 corre\u00e7\u00f5es\"*. Nesse mesmo deploy, 16 promos sumiram e os 29 whatsNew estavam vazios (F27/F28), e o verificador n\u00e3o acusou nenhum dos dois.\n  - `AG/deploy-verifier.md:20` faz o diff contra `fastlane/metadata/<locale>/*.txt`, um path que n\u00e3o existe no `aso-pipeline` (o proposto vive em `proposed/metadata/`).\n  - A frase *\"checks the fields you did NOT touch stayed intact\"* (`AG/aso-deployer.md:26`) n\u00e3o tem procedimento que a cumpra.\n- **Impacto:** \"0 diverg\u00eancias\" virou garantia falsa. A regress\u00e3o de campo n\u00e3o tocado, que \u00e9 exatamente a classe do LEARNINGS #13/#27, passa verde.\n\n---\n\n## S9 \u2014 aso-checkpoint e medi\u00e7\u00e3o\n\n### F31 \u00b7 Nenhuma das 4 itera\u00e7\u00f5es do Meus Gastos foi medida \u00b7 `medi\u00e7\u00e3o`\n- **Evid\u00eancia:**\n  - `MG/registry/keywords_tested.json` tem `\"result\": null` em todas as 31 entradas.\n  - `I1/meta.json:112-119` tem baseline `\"pending\"`, `checkpoints: []` e `final: null`.\n  - A iter-02 n\u00e3o tem pasta `metrics/` nem `research/`.\n  - `I3/metrics/` est\u00e1 vazio, com D7 em 01/09, D14 em 08/09 e D28 em 22/09 vencidos (`I3/meta.json:84`).\n  - `reports/2026-09-27_results-audit/aso.md:20` registra *\"iter-03 'running' desde 25/08, 0 checkpoints\"*.\n- **Impacto:** a iter-04 recomp\u00f4s 29 locales sem saber se a iter-03 ganhou ou perdeu. Pela auditoria externa, a iter-03 n\u00e3o mudou nada no alvo: BR+DE 76\u219268, RR 0,89 (`aso_efficacy.md`).\n\n### F32 \u00b7 O scan n\u00e3o enxerga os checkpoints da iter-03, porque o meta.json saiu do schema \u00b7 `script`\n- **Evid\u00eancia:**\n  - `orchestrator/scan.py:303-330` (`check_aso_checkpoints`) l\u00ea s\u00f3 `m[\"cadence\"][\"checkpoints\"]` e pula entradas que n\u00e3o s\u00e3o dict.\n  - `I3/meta.json` n\u00e3o tem `cadence`: tem `\"checkpoints\": [\"D7\",\"D14\",\"D28\"]` (strings) e `checkpoint_dates` (l.84). Conferido: `'cadence' in m == False`.\n- **Impacto:** 3 checkpoints vencidos (01/09 \u2192 22/09) n\u00e3o geraram nenhum alerta na fila do lab. \u00c9 o \"sil\u00eancio de detector\" que o pr\u00f3prio coment\u00e1rio do scan.py (l.324-329) diz ser pior que barulho.\n\n### F33 \u00b7 A m\u00e9trica prim\u00e1ria da iter-04 \u00e9 posi\u00e7\u00e3o Astro, e nenhum script a mede \u00b7 `medi\u00e7\u00e3o`\n- **Evid\u00eancia:**\n  - `I4/meta.json:16` define `primary_metric: keyword_rank_dominate_de`.\n  - Os checkpoints `pull_analytics.py checkpoint/final` s\u00f3 calculam instala\u00e7\u00f5es 1* por pa\u00eds (`TPL/scripts/pull_analytics.py:354-395`).\n  - As datas dos checkpoints s\u00e3o literais n\u00e3o-ISO, como `\"live_at+7 (estimativa 2026-10-13)\"` (`I4/meta.json:417`).\n  - O hist\u00f3rico Astro come\u00e7a no dia em que o termo foi trackeado (`aso_efficacy.md`, M\u00e9todo), ent\u00e3o n\u00e3o existe \"antes\" para termos novos.\n- **Impacto:** o `gate`/`final` vai fechar a itera\u00e7\u00e3o por uma m\u00e9trica que ela mesma declarou n\u00e3o ser a prim\u00e1ria, e a prim\u00e1ria ser\u00e1 lida \u00e0 m\u00e3o. \u00c9 a condi\u00e7\u00e3o que a regra 5 do aso_efficacy pro\u00edbe.\n\n### F34 \u00b7 O estado gravado no meta.json mente sobre o que foi pro ar \u00b7 `dado`\n- **Evid\u00eancia:**\n  - `I2/meta.json:37` (`correction_2026-08-25`) diz *\"meta.json said deployed:false, but \u2026 all three fields shipped in version 45.2.0. The record was simply never updated\"*.\n  - A iter-01 ficou `superseded` 6 dias depois do deploy (`I1/meta.json:16,124`).\n  - A iter-02 subiu no mesmo build que o widget de quick-add (`aso_efficacy.md`).\n  - O `registry/keywords_tested.json` n\u00e3o tem nenhuma entrada da iter-01 nem da iter-02, e o `winners.json` \u00e9 `[]` (F06).\n- **Impacto:** o hist\u00f3rico de \"o que j\u00e1 testamos\" do app come\u00e7a em agosto. As decis\u00f5es de name/subtitle de maio, inclusive o `casal` (F17), n\u00e3o t\u00eam registro consult\u00e1vel de resultado.\n\n### F35 \u00b7 N\u00e3o existe baseline de impress\u00f5es anterior a 17/08 \u00b7 `medi\u00e7\u00e3o`\n- **Evid\u00eancia:**\n  - `I1/meta.json:37-40` tem impressions, CVR e top-30 todos `\"TBD \u2014 capturar \u2026 no Day 0\"`, e nunca foram capturados.\n  - A auditoria registra que o request ONGOING de App Analytics s\u00f3 nasceu em 28/08, com backfill de 1 semana (`aso_efficacy.md`, M\u00e9todo).\n  - Hoje `I4/research/asc_impressions_by_source_90d.csv` cobre 17/08 \u2192 14/09.\n- **Impacto:** as iter-01/02/03 n\u00e3o t\u00eam \"antes\" de impress\u00e3o. Mesmo a iter-04 tem s\u00f3 4 semanas de s\u00e9rie, pra um teste cujo efeito o pr\u00f3prio relat\u00f3rio projeta em +11% de impress\u00f5es (`I4/meta.json:91`).\n\n---\n\n## Transversal \u2014 evals\n\n### F36 \u00b7 Os evals da camada de ASO s\u00f3 cobrem o contrato do prompt e travam uma regra obsoleta \u00b7 `agente`\n- **Evid\u00eancia:**\n  - Por `cases/*.json`, a cobertura \u00e9:\n\n    | caso | contract | artifact | behavior |\n    |---|---:|---:|---:|\n    | `aso-extractor` | 10 | 0 | 0 |\n    | `aso-longtail-miner` | 8 | 0 | 0 |\n    | `aso-fit-checker` | 6 | 0 | 0 |\n    | `aso-serp-analyst` | 12 | 0 | 0 |\n    | `aso-reporter` | 8 | 0 | 0 |\n    | `aso-deployer` | 22 | 0 | 0 |\n    | `aso-checkpoint` | 20 | 0 | 0 |\n    | `deploy-verifier` | 7 | 0 | 0 |\n    | `aso-field-composer` | 19 | s\u00f3 acento | 1 |\n\n  - No `aso-field-composer`, os artefatos s\u00e3o s\u00f3 os `known_debt` de BLW e Hair (`cases/aso-field-composer.json:106-128`).\n  - Nenhuma asser\u00e7\u00e3o cobre:\n    - schema de CSV (F16);\n    - consist\u00eancia entre artefatos (F24);\n    - termos fora da pesquisa (F22);\n    - heran\u00e7a de campo (F27).\n  - `evals/cases/competitor-scout.json:12` exige `\"launch free\"`, e o `AG/competitor-scout.md:15` diz *\"GambitStudio apps launch free\"*. Isso contradiz a regra de monetiza\u00e7\u00e3o desde a v1 (RULES, 27/09).\n- **Impacto:** o eval verde garante que a regra est\u00e1 *escrita*, n\u00e3o que o agente a cumpre. Os 3 artefatos reais da iter-04 que violam o contrato (F16, F19, F22) passam, e o eval impede a corre\u00e7\u00e3o de uma regra revogada.\n\n---\n\n## S3 \u2014 aso-fit-checker (adendo: achado do release-runner lendo o source, 01/10)\n\n### F37 \u00b7 O invent\u00e1rio de features prova que algo existe por \"a classe est\u00e1 declarada\", n\u00e3o por \"d\u00e1 pra chegar nela a partir de uma tela\" \u00b7 `agente`\n- **Evid\u00eancia:**\n  - `I4/research/app_feature_inventory.md:72` afirma *\"Period filter: day / week / month / year / custom range with start+end date (`ViewComponents/PeriodType.dart:8` enum + `:240-276` the picker)\"*.\n  - A l.220 transforma isso em diferencial: *\"Custom period filter \u2026 absent from all 29. Nobody sells it.\"*\n  - No source, `PeriodSelector`, `PeriodNavigator` e `CustomPeriodModal` (`meus_gastos/lib/controllers/Transactions/ViewComponents/PeriodType.dart:17/92/164`) nunca s\u00e3o instanciados. `grep -rn --include='*.dart' -E \"PeriodSelector\\(|PeriodNavigator\\(|CustomPeriodModal\\(\"` fora do pr\u00f3prio arquivo d\u00e1 exit 1. O \u00fanico filtro real \u00e9 a troca de m\u00eas no dashboard (`DashboardScreenRefatore.dart:62`).\n  - \u00c9 o mesmo erro que o pr\u00f3prio fit-checker pegou na iter-03 (`CustomCalendarScreen` morto, citado em `I3/research/app_feature_inventory.md:43`). O `AG/aso-fit-checker.md:11-12` manda inventariar \"screens/tabs\" sem exigir alcan\u00e7abilidade.\n- **Impacto:** desta vez n\u00e3o chegou a campo aplicado nem a description: o release-runner conferiu, e nenhuma linha de `term_fit_*.csv` cita a se\u00e7\u00e3o 1.4. Mas o invent\u00e1rio \u00e9 a base de toda verdict FIT/MISMATCH, e um diferencial de posicionamento (\"ningu\u00e9m vende isso\") foi registrado em cima de c\u00f3digo morto. O mesmo mecanismo produziu a promessa falsa de notifica\u00e7\u00e3o (F18).\n- *Corrigiria:* toda linha do invent\u00e1rio cita a cadeia de chamada a partir de uma rota/tela, e n\u00e3o s\u00f3 o arquivo da classe.\n\n### F38 \u00b7 O paywall promete 3 benef\u00edcios e s\u00f3 1 existe. O fit-checker anotou e nenhum est\u00e1gio \u00e9 dono do texto do paywall \u00b7 `processo`\n- **Evid\u00eancia:**\n  - `I4/research/app_feature_inventory.md:125`: *\"Paywall advertises three benefits (`ProModal.dart:300-308`): Export to Excel or PDF \u00b7 Cloud Backup \u00b7 Ad-free. Of these, only Cloud Backup is act[ual]\"*.\n  - Export n\u00e3o \u00e9 gateado (l.99, `grep isPro` zero em `exportExcel/`).\n  - \"Sem an\u00fancios\" \u00e9 benef\u00edcio num app sem SDK de an\u00fancio (N15, l.157).\n  - `meus_gastos/lib/controllers/Purchase/ProModal.dart:294` ainda tem `title: l.exportToExcelOrPdf`.\n  - N\u00e3o h\u00e1 est\u00e1gio na cadeia de 9 (`start-aso-pipeline` SKILL, tabela) nem no checklist do deployer que leia, julgue ou corrija o paywall ou a metadata de IAP.\n- **Impacto:** a promessa falsa fica no funil de compra (o paywall abre logo depois do onboarding, l.124) e alimenta o risco 3.1.2/2.3.1 junto com o \"100% gr\u00e1tis\" das descriptions (F18). O achado morre no invent\u00e1rio sem virar a\u00e7\u00e3o.\n\n---\n"];</script><script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script><script>document.querySelectorAll("#md .mdpart").forEach(function(el){var R=RAWS[+el.dataset.i]||"";el.innerHTML=window.marked?marked.parse(R):"<pre>"+R.replace(/</g,"
