<body><div class="wrap"><p class="sub" style="font-size:12px;margin:0 0 14px">Exportado em 2026-10-01 10:38 · fonte: Lab Hub local</p><p class="sub"><a href="../index.html">← hub</a> · <code>_GambitStudio/.claude/skills/lab-orchestrate/SKILL.md</code></p><div id="md"></div><script>const RAW="---\nname: lab-orchestrate\ndescription: Executa uma tarefa GRANDE ou VAGA at\u00e9 o fim \u2014 decomp\u00f5e em work order com crit\u00e9rio de pronto por item, roda em ondas dimensionadas pelo trabalho (sem cap \u2014 Jo\u00e3o 02/09), revisa cada retorno contra o crit\u00e9rio (item s\u00f3 fecha com evid\u00eancia verific\u00e1vel) e faz loop at\u00e9 a fila zerar. Tamb\u00e9m executa os work orders que o scan do lab enfileirou sozinho. Use quando o Jo\u00e3o pedir algo amplo (\"pesquisa os apps de editor de foto do mercado e aplica no meu app\", \"melhora o iPhotos\"), quando disser \"roda a fila / o que tem pra fazer\", ou passar um id de work order.\n---\n\n# Lab Orchestrate\n\nDecompor e delegar \u00e9 o comportamento esperado aqui \u2014 a regra que exigia pedido expl\u00edcito\npra fan-out caiu em 2026-08-31. O teto de 4 subagentes simult\u00e2neos foi DELETADO pelo Jo\u00e3o (02/09, \"deleta qualquer regra de limita\u00e7\u00e3o de tokens\"; o hook `limit-parallel-agents.sh` est\u00e1 desativado) \u2014 a onda se dimensiona pelo trabalho: unidades independentes rodam juntas, dependentes esperam a anterior. O que continua valendo \u00e9 o limite F\u00cdSICO da m\u00e1quina: 2 simuladores (fila `tools/sim-pool`, RULES 12/09) e disco em builds paralelos (`-clonedSourcePackagesDirPath` compartilhado + `COMPILER_INDEX_STORE_ENABLE=NO`, LEARNINGS #91).\n\n## O problema que isto resolve\n\nTarefa vaga n\u00e3o tem crit\u00e9rio de pronto. Sem crit\u00e9rio, quem executa faz o que cabe no\ncontexto e declara feito \u2014 o \"faz um pouco e para\". A corre\u00e7\u00e3o n\u00e3o \u00e9 esfor\u00e7o, \u00e9\nestrutura: **o crit\u00e9rio de pronto de cada peda\u00e7o \u00e9 escrito ANTES de executar, e o\nestado mora em disco, n\u00e3o na mem\u00f3ria da sess\u00e3o.**\n\n```bash\nWO=_GambitStudio/orchestrator/wo.py\npython3 $WO list                  # a fila\npython3 $WO show <id>             # itens, crit\u00e9rios, evid\u00eancias\npython3 $WO wave <id>             # o que pode rodar em paralelo agora (sem cap por default; --cap N s\u00f3 quando um recurso f\u00edsico obriga)\n```\n\n## Fase 1 \u2014 Decompor (no seu contexto, \u00e9 o c\u00e9rebro)\n\nSe veio um id de work order, pule para a Fase 2. Se veio uma tarefa em linguagem\nnatural:\n\n1. **Reformule o pedido como um resultado observ\u00e1vel.** \"Pesquisa os editores de foto e\n   aplica no meu app\" n\u00e3o \u00e9 execut\u00e1vel; \"o iPhotos ganha as 3 features table-stake que\n   todos os l\u00edderes t\u00eam e que ele n\u00e3o tem, e cada uma compila e roda\" \u00e9.\n2. **Quebre em itens independentes**, cada um com:\n   - `task` \u2014 o que fazer, espec\u00edfico o bastante pra um agente executar sem explorar.\n   - `done_when` \u2014 **como se PROVA que acabou**. Tem que ser verific\u00e1vel por comando ou\n     por arquivo: \"`preflight.py` sai 0\", \"`GAPS.md` existe com as 5 se\u00e7\u00f5es\", \"o build\n     passa e a tela aparece no simulador\". *\"Pesquisa feita\", \"c\u00f3digo melhorado\" e\n     \"revisado\" n\u00e3o s\u00e3o crit\u00e9rios* \u2014 se voc\u00ea n\u00e3o sabe qual comando prova, o item ainda\n     est\u00e1 vago demais.\n   - `agent` \u2014 o subagente do lab que faz isso (`competitor-scout`, `screen-builder`,\n     `aso-checkpoint`, `polish-reviewer`, `analytics-instrumentor`\u2026) ou vazio pra inline.\n   - `depends_on` \u2014 ids dos itens que precisam fechar antes.\n3. **Grave**: `wo.py new` + um `wo.py add` por item. A partir daqui o estado \u00e9 o arquivo.\n4. Mostre a decomposi\u00e7\u00e3o ao Jo\u00e3o em 5-10 linhas e **siga** \u2014 n\u00e3o pe\u00e7a aprova\u00e7\u00e3o\n   (autonomia total, RULES). Se um item for irrevers\u00edvel ou tocar a loja, marque-o como\n   dependente de aprova\u00e7\u00e3o no `notes` e deixe-o por \u00faltimo.\n\nRegra de tamanho: item que n\u00e3o cabe num brief denso de subagente est\u00e1 grande demais \u2014\nquebre. Item cujo `done_when` depende de opini\u00e3o est\u00e1 mal formulado \u2014 reescreva.\n\n## Fase 2 \u2014 Executar em ondas\n\nRepita at\u00e9 n\u00e3o sobrar item execut\u00e1vel:\n\n1. `wo.py wave <id>` \u2192 todos os itens sem depend\u00eancia aberta (sem teto imposto \u2014 o default do `wo.py` \u00e9 sem cap; `--cap N` existe como op\u00e7\u00e3o s\u00f3 quando um recurso f\u00edsico obriga, ex. itens que disputam simulador).\n2. Para cada um: `wo.py set <id> <item> --status doing` e dispare o subagente **numa s\u00f3\n   mensagem com todas as chamadas** (\u00e9 o que faz rodarem em paralelo). Brief denso: todos\n   os paths, assinaturas, paleta, e **o `done_when` literal dentro do prompt** \u2014 o agente\n   precisa saber contra o que ser\u00e1 medido.\n3. **O tamanho da onda \u00e9 o trabalho, n\u00e3o um n\u00famero** (Jo\u00e3o 02/09). Os \u00fanicos limites s\u00e3o f\u00edsicos: 2 simuladores \u2014 todo agente pede pela fila `tools/sim-pool` (RULES 12/09) \u2014 e disco em builds paralelos (checkout de pacotes compartilhado + `COMPILER_INDEX_STORE_ENABLE=NO`, `df -h /` antes de >5 builds \u2014 LEARNINGS #91). Itens que disputam esses recursos v\u00e3o em ondas; o resto roda junto.\n4. Voc\u00ea ret\u00e9m s\u00f3 o retorno compacto de cada agente. N\u00e3o releia os arquivos que ele\n   escreveu, exceto se a verifica\u00e7\u00e3o apontar pra eles.\n\n## Fase 3 \u2014 Revisar (\u00e9 aqui que o loop fecha)\n\nPara cada item que voltou, **verifique o `done_when` voc\u00ea mesmo** \u2014 rode o comando, abra\no arquivo, confira o n\u00famero. O relato do agente n\u00e3o \u00e9 evid\u00eancia; o comando \u00e9.\n\n- Passou \u2192 `wo.py set <id> <item> --status done --evidence \"<o comando e o resultado>\"`.\n  O `wo.py` **recusa** fechar sem evid\u00eancia: se voc\u00ea n\u00e3o tem o que escrever ali, o item\n  n\u00e3o est\u00e1 pronto.\n- N\u00e3o passou \u2192 `--status todo --notes \"faltou X\"`. Ele volta pra pr\u00f3xima onda com a nota\n  no brief. Na 3\u00aa tentativa o `wo.py` bloqueia sozinho e escala.\n- Imposs\u00edvel (falta chave, gate humano, decis\u00e3o do Jo\u00e3o) \u2192 `--status blocked --notes\n  \"<o que destrava>\"` e siga. Um item bloqueado nunca justifica parar os outros.\n\nDepois de cada onda, uma linha de progresso pro Jo\u00e3o: `[k/n] \u00b7 o que fechou \u00b7 o que\nvoltou \u00b7 o que bloqueou`. Sem narrar o meio.\n\n## Fase 4 \u2014 Fechar\n\n`wo.py close <id>` (recusa se sobrou item aberto). Ent\u00e3o, no mesmo turno:\n- `now.json`: entrada em `done` com o resultado; remova os itens `do` que este work order\n  resolveu; nunca deixe item stale.\n- Se apareceu bug/regra nova: `LEARNINGS.md`. Se virou regra do lab: `RULES.md`.\n- Se o trabalho gerou um or\u00e1culo novo (\"SEMPRE verificar X\"), escreva o check em\n  `scripts/verify/` \u2014 learning sem check \u00e9 lembrete (LEARNINGS #62).\n- Commit no repo certo.\n\n## Quando o contexto acabar no meio\n\nN\u00e3o tem problema: o estado est\u00e1 no JSON. A sess\u00e3o seguinte roda `wo.py show <id>`, v\u00ea o\nque est\u00e1 `doing`/`todo` e continua. **\u00c9 por isso que o estado n\u00e3o pode viver s\u00f3 no seu\ncontexto** \u2014 o modo de falha que esta skill existe pra corrigir \u00e9 exatamente esse.\n\n## Fila de rotina\n\n`orchestrator/scan.py` roda por launchd e enfileira o trabalho rotineiro vencido\n(checkpoint ASO, PPO parado, rating-first, reviews, gap de analytics). \"Roda a fila\" /\n\"o que tem pra fazer\" \u2192 `wo.py list`, pegue o de menor urg\u00eancia num\u00e9rica e execute como\nacima. O scan **detecta e enfileira; nunca executa** \u2014 e nada que toque a App Store sai\nsem o Jo\u00e3o dizer.\n";</script><script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script><script>document.getElementById("md").innerHTML=window.marked?marked.parse(RAW):"<pre>"+RAW.replace(/</g,"&lt;")+"</pre>";</script></div><script>(function(){try{var k="lh.scroll:"+location.pathname;var v=sessionStorage.getItem(k);if(v!==null){sessionStorage.removeItem(k);window.scrollTo(0,parseInt(v,10)||0);}document.addEventListener("submit",function(e){var f=e.target;if(f&&f.method&&f.method.toLowerCase()==="post"){sessionStorage.setItem(k,String(window.scrollY));}},true);}catch(e){}})();</script></body></html>
