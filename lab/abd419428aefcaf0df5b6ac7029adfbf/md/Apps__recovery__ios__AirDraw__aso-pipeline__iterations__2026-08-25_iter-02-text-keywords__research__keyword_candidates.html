.hcol .row{flex-direction:column;align-items:flex-start;gap:4px}.hcol .row b{white-space:normal}.hcol .row span{width:100%}.hcol .row em{display:none}.hcol .row.done b{font-size:12px}.hrow{display:flex;gap:20px;overflow-x:auto;align-items:flex-start;padding:16px 28px 12px;margin:18px 0 26px;background:rgba(125,125,125,.07);border:1px solid var(--bd);border-radius:16px;scroll-padding:0 28px}.hcol{flex:0 0 340px;min-width:340px}.hcol:last-child{margin-right:28px}.hcol h2{margin-top:0}.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:0 20px}.cols2{display:grid;grid-template-columns:1fr 1fr;gap:0 20px;align-items:start}@media(max-width:900px){.cols2{grid-template-columns:1fr}}h3.team{margin:18px 0 8px;font-size:15px;font-weight:600}h3.team .chain{display:block;color:var(--mut);font-weight:400;font-size:12.5px;margin-top:2px}.card .step{display:inline-block;min-width:18px;height:18px;line-height:18px;text-align:center;border-radius:9px;background:var(--bd);color:var(--mut);font-size:11px;font-weight:600;margin-right:6px}.grid4{display:grid;gap:12px;grid-template-columns:repeat(4,1fr)}@media(max-width:1100px){.grid4{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.grid4{grid-template-columns:1fr}}

/* ---------- camada de acabamento (01/10/2026) ----------
   Tipografia com duas vozes (display para títulos e números, texto para leitura),
   neutros com viés do azul da marca em vez de cinza puro, e profundidade por
   sombra em vez de só borda. Nada aqui renomeia classe: é uma camada por cima. */
:root{
  --f-disp:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --f-text:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --bg:#f3f5f9; --card:#ffffff; --tx:#10131a; --mut:#5a6377; --acc:#1552d8;
  --bd:#dde2ea; --bd-soft:#e8ecf3; --ok:#0a8f58; --down:#d02f2f; --warn:#b45309;
  --sh:0 1px 2px rgba(16,19,26,.05),0 2px 8px rgba(16,19,26,.04);
  --sh-up:0 2px 6px rgba(16,19,26,.07),0 10px 24px rgba(16,19,26,.07);
  --rad:14px;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#0b0d12; --card:#161a22; --tx:#eef1f7; --mut:#9aa5b8; --acc:#7aa6ff;
  --bd:#272d39; --bd-soft:#1f242e; --ok:#43d08d; --down:#ff7070; --warn:#e5a645;
  --sh:0 1px 2px rgba(0,0,0,.4); --sh-up:0 6px 22px rgba(0,0,0,.5);
}}
body{font-family:var(--f-text);font-size:14.5px;line-height:1.6;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1{font-family:var(--f-disp);font-size:27px;font-weight:800;letter-spacing:-.02em;
  text-wrap:balance;margin:0 0 2px}
h1 .mark{display:inline-block;width:28px;height:28px;vertical-align:-5px;margin-right:11px;
  background-size:contain;background-repeat:no-repeat;background-position:center}
h2{font-family:var(--f-disp);font-size:12px;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;color:var(--mut);border-top:1px solid var(--bd-soft);
  padding-top:22px;margin:32px 0 14px}
h3{font-family:var(--f-disp);letter-spacing:-.01em}
.sub{font-size:13px;color:var(--mut)}
code,.mono{font-family:var(--f-mono);font-size:12.5px}
.card,table.t,a.tile,.row,.fcard,#md{box-shadow:var(--sh);border-color:var(--bd-soft)}
.card,a.tile,.row,.fcard{border-radius:var(--rad)}
a.tile,.row{transition:box-shadow .16s ease,border-color .16s ease,transform .16s ease}
a.tile:hover,a.row:hover{box-shadow:var(--sh-up);border-color:var(--bd);
  transform:translateY(-1px)}
/* O card do app é área de leitura, não botão: nada muda no hover. A regra antiga
   trocava a sombra, e num card sem sombra isso aparecia como animação. */
.fcard,.fcard:hover{transition:none!important;transform:none!important}
/* big numbers: the first thing anyone reads on the page */
.tiles{gap:12px;margin:18px 0 4px;padding-bottom:10px}
a.tile{padding:13px 17px;min-width:148px}
.tile .tl{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
  color:var(--mut)}
.tile .tv{font-family:var(--f-disp);font-size:25px;font-weight:800;letter-spacing:-.025em;
  margin-top:3px}
.tile .ts{font-size:11.5px;color:var(--mut)}
/* tables read as data, not as prose */
table.t{border-radius:var(--rad);font-variant-numeric:tabular-nums}
table.t th{font-family:var(--f-disp);font-size:11px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;background:var(--bd-soft);border-bottom:1px solid var(--bd)}
table.t td{padding:9px 13px;border-bottom:1px solid var(--bd-soft)}
table.t tbody tr:hover td,table.t tr:hover td{background:rgba(125,140,170,.06)}
.twrap{border-radius:var(--rad)}
/* buttons */
.btn{font-family:var(--f-disp);font-weight:600;font-size:13.5px;padding:9px 18px;
  border-radius:999px;box-shadow:var(--sh);transition:all .16s ease}
.btn:hover{border-color:var(--acc);box-shadow:var(--sh-up);transform:translateY(-1px)}
.pill,.st{font-family:var(--f-disp);font-weight:600;font-size:11.5px;letter-spacing:.02em}
/* status colours carry meaning, so keep them out of the accent */
.st.run,.st.appr{background:rgba(10,143,88,.14);color:var(--ok)}
.st.crit{background:rgba(208,47,47,.14);color:var(--down)}
.st.rev,.st.draft{background:rgba(180,83,9,.14);color:var(--warn)}
/* the lanes strip and any scroller get a thin, rounded bar */
.tiles,.hrow,.twrap{scrollbar-width:thin;scrollbar-color:var(--bd) transparent}
.tiles::-webkit-scrollbar,.hrow::-webkit-scrollbar,.twrap::-webkit-scrollbar{height:9px}
.tiles::-webkit-scrollbar-track,.hrow::-webkit-scrollbar-track,
.twrap::-webkit-scrollbar-track{background:transparent}
.tiles::-webkit-scrollbar-thumb,.hrow::-webkit-scrollbar-thumb,
.twrap::-webkit-scrollbar-thumb{background:var(--bd);border-radius:999px;
  border:3px solid transparent;background-clip:content-box}
.tiles::-webkit-scrollbar-thumb:hover,.hrow::-webkit-scrollbar-thumb:hover,
.twrap::-webkit-scrollbar-thumb:hover{background:var(--mut);background-clip:content-box}
.hrow{background:transparent;border:0;padding:0;border-radius:0}
.hcol{flex:0 0 clamp(280px,26vw,360px);min-width:0}
a:focus-visible,button:focus-visible,.btn:focus-visible{outline:2px solid var(--acc);
  outline-offset:2px;border-radius:8px}
.dirlist,.prlist{margin:10px 0 0;padding-left:18px;list-style:none}
.dirlist>li,.prlist>li{position:relative;margin:0 0 7px;font-size:13.5px;line-height:1.5;
  color:var(--tx)}
.prlist>li{color:var(--mut);font-size:13px;margin-bottom:5px}
.dirlist>li::before,.prlist>li::before{content:"";position:absolute;left:-14px;top:.62em;
  width:5px;height:5px;border-radius:50%;background:var(--acc);opacity:.75}
.prlist>li::before{background:var(--mut);opacity:.5}
.dirp{display:none}
.dapps{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));
  margin:14px 0 4px;align-items:start}
.dapp{padding:14px 16px}
.dah{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.dah b{font-family:var(--f-disp);font-size:14.5px;font-weight:700}
.drank{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;
  border-radius:6px;background:var(--acc);color:#fff;font-size:11.5px;font-weight:700;flex:none}
.st.d-dobrar{background:rgba(10,143,88,.16);color:var(--ok)}
.st.d-consertar{background:rgba(180,83,9,.16);color:var(--warn)}
.st.d-manter{background:rgba(125,140,170,.16);color:var(--mut)}
.st.d-congelar{background:rgba(125,140,170,.12);color:var(--mut)}
.dapp .prlist{margin-top:6px}
.dcall{color:var(--tx)!important;font-weight:600}
.fcard[id]{scroll-margin-top:18px}
.fdet{margin-top:10px;border-top:1px solid var(--bd-soft);padding-top:9px}
.fdet>summary{cursor:pointer;list-style:none;font-family:var(--f-disp);font-size:11.5px;
  font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);
  display:flex;align-items:center;gap:7px}
.fdet>summary::-webkit-details-marker{display:none}
.fdet>summary::before{content:"›";font-size:15px;transition:transform .15s}
.fdet[open]>summary::before{transform:rotate(90deg)}
.fdet>summary:hover{color:var(--acc)}
.fdet table.t{font-size:12.5px}
.fdet table.t td,.fdet table.t th{padding:6px 10px}
.fgrid.one{grid-template-columns:1fr!important;gap:14px}
.fgrid.one>.fcard{border:1px solid var(--bd-soft);border-radius:var(--rad);
  box-shadow:none;background:var(--card);padding:0;overflow:hidden}
/* a faixa do topo separa um app do outro melhor que uma linha fina entre eles */
.fgrid.one>.fcard>.fh{background:var(--bd-soft);margin:0;padding:12px 16px;
  border-bottom:1px solid var(--bd)}
.fgrid.one>.fcard>.fmeta{padding:9px 16px 0}
.fgrid.one>.fcard>.fcols{padding:14px 16px 4px}
.fgrid.one>.fcard>.fdet{margin:0;padding:12px 16px 14px;border-top:1px solid var(--bd-soft);
  background:var(--bg)}
.fcols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;
  align-items:start}
@media(max-width:820px){.fcols{grid-template-columns:1fr;gap:12px}}
.fcol{min-width:0}
.fcol>.fnds{margin-top:0}
.fdet .ascgrid{grid-template-columns:repeat(auto-fit,minmax(118px,1fr))}
.fdetcols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;
  align-items:start}
@media(max-width:1100px){.fdetcols{grid-template-columns:repeat(2,minmax(0,1fr))}}

<body><div class="wrap"><p class="sub" style="font-size:12px;margin:0 0 14px">Exportado em 2026-10-01 16:25 · fonte: Lab Hub local</p><p class="sub"><a href="../index.html">← hub</a> · <code>Apps/recovery/ios/AirDraw/aso-pipeline/iterations/2026-08-25_iter-02-text-keywords/research/keyword_candidates.md</code></p><div id="md"></div><script>const RAW="# Neon Glow Draw \u2014 iter-02 (texto) \u2014 en-US \u00b7 en-AU \u00b7 en-CA \u00b7 en-GB \u00b7 pt-BR \u00b7 pt-PT \u00b7 es-ES \u00b7 es-MX\n\n## \u2696\ufe0f Ponto de decis\u00e3o\n\n- **A regra rating-first do lab diz pra N\u00c3O rodar isto.** us 13 \u00b7 br 6 \u00b7 es 1 \u00b7 mx 1 \u2014 os quatro mercados abaixo do piso de 25 ratings. Com essa massa, o Motor 2 (velocity / CR / ratings) \u00e9 o teto de tudo que o Motor 1 (texto) conseguir comprar.\n- **Roda mesmo assim por tr\u00eas coisas que n\u00e3o esperam:** (a) risco **2.3.1 vivo em 8 locales** \u2014 a p\u00e1gina promete captura de foto que n\u00e3o existe no c\u00f3digo, e en-AU/CA/GB ainda vendem \"Trace Mode\" e \"Wall Visualisation\" de outro app (NOT-list dupla); (b) 4 rankings MISMATCH de letreiro comendo impress\u00e3o no US \u2014 `neon sign maker` **#21**, `animated neon sign` **#22**, `neon sign design` **#26**, `neon text maker` **#26** \u2014 usu\u00e1rio errado com 13 ratings custa caro; (c) `laser` MX (pop 32 / diff 7, SERP de apps-piada com 80/19/50 ratings) e o cluster `brilhante` BR (diff 5, 4 composi\u00e7\u00f5es 100% OUT) estavam de gra\u00e7a na mesa.\n- **A a\u00e7\u00e3o de maior retorno DEPOIS desta n\u00e3o \u00e9 a iter-03 \u2014 \u00e9 ca\u00e7ar as primeiras avalia\u00e7\u00f5es** nos 4 mercados. Sem cruzar 25 ratings, iter-03 compra ranking que o comportamento n\u00e3o sustenta.\n- **Esta itera\u00e7\u00e3o N\u00c3O \u00e9 um teste limpo de metadata.** A v24 (build 30) sobe junto: paywall volta logo ap\u00f3s o onboarding (antes s\u00f3 27% viam paywall), c\u00e2mera consertada (tela preta em permiss\u00e3o negada), grava\u00e7\u00e3o de v\u00eddeo consertada (feature Pro entregava arquivo vazio) e o app passou a existir em pt-BR e es. **Impress\u00e3o e rank por termo continuam lendo ASO; CVR, trial e receita passam a ler o build.**\n- **D\u00edvida herdada:** a iter-01 (06/08) est\u00e1 live e **nunca teve checkpoint medido**. N\u00e3o existe before/after dela; o baseline de hoje j\u00e1 embute o efeito dela, e isso limita a atribui\u00e7\u00e3o desta tamb\u00e9m.\n- **Incerteza estrutural:** n\u00e3o existe report *App Store Search Terms* pra este app. `pop=5` do Astro \u00e9 **piso de medi\u00e7\u00e3o**, n\u00e3o volume \u2014 todo alvo por termo pop-5 abaixo carrega essa margem.\n\n---\n\n## \ud83d\udcc4 Resultado final\n\n<span style=\"color:#dc3545\">**vermelho**</span> saiu \u00b7 <span style=\"color:#28a745\">**verde**</span> entrou \u00b7 <span style=\"color:#3b82f6\">**azul claro**</span> subiu de peso \u00b7 <span style=\"color:#1e3a8a\">**azul escuro**</span> desceu de peso\n\n### en-US (espelhado em en-AU \u00b7 en-CA \u00b7 en-GB)\n\n| campo | Antes (no ar) | Depois (aplicado) |\n|---|---|---|\n| name | Neon Glow Draw: Light <span style=\"color:#1e3a8a\">Art</span> <span style=\"color:#1e3a8a\">3D</span> | Neon Glow Draw: Light <span style=\"color:#3b82f6\">Painting</span> |\n| subtitle | Light <span style=\"color:#3b82f6\">Painting</span> Camera & Show | <span style=\"color:#1e3a8a\">3D</span> <span style=\"color:#1e3a8a\">Art</span> Camera & <span style=\"color:#3b82f6\">Party</span> Show |\n| keywords | air,<span style=\"color:#dc3545\">long</span>,<span style=\"color:#dc3545\">exposure</span>,marker,graffiti,glitter,<span style=\"color:#dc3545\">sign</span>,laser,<span style=\"color:#3b82f6\">party</span>,<span style=\"color:#dc3545\">sparkle</span>,text,write,<span style=\"color:#dc3545\">maker</span>,brush,paint,pen | <span style=\"color:#28a745\">augmented</span>,<span style=\"color:#28a745\">reality</span>,<span style=\"color:#28a745\">effects</span>,<span style=\"color:#28a745\">photos</span>,<span style=\"color:#28a745\">space</span>,marker,graffiti,laser,glitter,write,brush,paint,text,pen,air |\n\n**Por qu\u00ea:**\n- <span style=\"color:#3b82f6\">`light painting`</span> (pop 9) est\u00e1 **OUT** \u2192 alvo **top 3** at\u00e9 D28 (SERP: #1-#4 t\u00eam 0-5 ratings, n\u00f3s temos 13 \u2014 a mais fraca do dossi\u00ea inteiro); risco: a frase exata s\u00f3 rankeia com peso 7\u00d7, se em D14 continuar OUT o name volta em 1 PATCH.\n- <span style=\"color:#1e3a8a\">`light art`</span> **#2** e <span style=\"color:#1e3a8a\">`neon light 3d`</span> **#2** \u2192 segurar \u2264 **#10** at\u00e9 D28 (pop 5, piso de medi\u00e7\u00e3o); risco: mais 7 composi\u00e7\u00f5es pop-5 (`light art 3d` #2, `neon 3d art` #3, `3d brush` #3, `neon light art` #3, `3d neon` #5) podem cair \u00b18 posi\u00e7\u00f5es \u2014 rollback se qualquer uma sair do top 10.\n- <span style=\"color:#28a745\">`augmented reality`</span> (pop 15) est\u00e1 **OUT** \u2192 alvo **top 5-10** at\u00e9 D28 (SERP: #6-#10 com 0-3 ratings; ARvid 7,8k s\u00f3 no topo); risco: token PARTIAL \u2014 fica em keywords (1\u00d7), nunca no subtitle.\n- <span style=\"color:#28a745\">`neon glow effects`</span> **#33** e <span style=\"color:#28a745\">`neon photo`</span> **#34** \u2192 alvo **top 10-20** at\u00e9 D28 (diff 9 nos dois); risco: baixo, s\u00e3o feeders de \u22658 composi\u00e7\u00f5es cada.\n- <span style=\"color:#dc3545\">`neon sign maker`</span> **#21**, <span style=\"color:#dc3545\">`animated neon sign`</span> **#22**, <span style=\"color:#dc3545\">`neon sign design`</span> **#26**, <span style=\"color:#dc3545\">`neon text maker`</span> **#26** \u2192 alvo **OUT deliberado** (MISMATCH: o app n\u00e3o gera letreiro 2D); \u00e9 o objetivo do corte, n\u00e3o efeito colateral.\n- <span style=\"color:#dc3545\">`long exposure`</span> **#239** \u2192 alvo **OUT** (13 chars por um #239 cuja SERP \u00e9 slow-shutter real, NOT-list).\n- **Protegidos (nenhum saiu):** `neon glow draw` **#1**, `neon light pen` **#1**, `neon light show` **#1**, `3d light drawing` **#1**, `neon glitter` **#2**, `draw light` **#3**, `neon marker` **#3**, `neon pen` **#3**, `glow writing` **#4**, `neon brush` **#4**, `neon light camera` **#4**, `glow pen` **#4**, `neon graffiti` **#6**, `neon camera` **#7**.\n\n### pt-BR\n\n| campo | Antes (no ar) | Depois (aplicado) |\n|---|---|---|\n| name | Neon <span style=\"color:#dc3545\">AR</span> Drawing: Desenho e Luz | Neon <span style=\"color:#28a745\">Glow</span> Draw: Desenho e Luz |\n| subtitle | <span style=\"color:#dc3545\">Pintar</span>, C\u00e2mera e Show de Luz | <span style=\"color:#3b82f6\">Arte</span> <span style=\"color:#28a745\">Brilhante</span>: C\u00e2mera e Show |\n| keywords | caneta,pintura,<span style=\"color:#3b82f6\">arte</span>,realidade,aumentada,festa,video,grafite,laser,<span style=\"color:#dc3545\">glitter</span>,pincel,magico,3d,texto | <span style=\"color:#28a745\">art</span>,<span style=\"color:#28a745\">fotos</span>,realidade,aumentada,<span style=\"color:#28a745\">brilho</span>,caneta,pincel,pintura,grafite,festa,laser,magico,video,texto,3d |\n\n**Por qu\u00ea:**\n- <span style=\"color:#28a745\">`glow draw`</span> est\u00e1 **#14** \u2192 alvo **top 5** at\u00e9 D28 (DOMINATE, diff 17); risco: baixo \u2014 o token entra a 7\u00d7 no name e veio de gra\u00e7a com o rebrand.\n- <span style=\"color:#28a745\">`neon art`</span> **#6** \u2192 alvo **top 3** at\u00e9 D28 (o \u00edndice trata `art` e `arte` como tokens distintos); risco: baixo, 3 chars.\n- <span style=\"color:#28a745\">`fotos realidade aumentada`</span> **#10** \u2192 alvo **top 3** at\u00e9 D28 (diff 7) e `foto neon` **#12** \u2192 **top 5**; risco: o par `realidade,aumentada` tamb\u00e9m sustenta o MISMATCH `desenho realidade aumentada` **#4**, que rankeia melhor que o lado FIT \u2014 reavaliar o par na iter-03.\n- <span style=\"color:#28a745\">`caneta brilhante`</span>, <span style=\"color:#28a745\">`pincel brilhante`</span>, <span style=\"color:#28a745\">`texto brilhante`</span>, <span style=\"color:#28a745\">`festa brilhante`</span> (todos diff 5) est\u00e3o **OUT** \u2192 alvo **top 20-40** at\u00e9 D28; risco: cluster inteiro dependia de um token de brilho que n\u00e3o existia em pt-BR \u2014 se nenhum entrar at\u00e9 D14, `brilhante` n\u00e3o vale o subtitle.\n- <span style=\"color:#dc3545\">`desenho ar realidade`</span> **#3**, <span style=\"color:#dc3545\">`desenhar ar`</span> **#101**, <span style=\"color:#dc3545\">`desenho ar`</span> **#153** \u2192 alvo **OUT deliberado** (decalque; o app n\u00e3o tem trace mode).\n- **Protegidos (nenhum saiu):** `caneta neon` **#1**, `caneta luz` **#1**, `caneta de luz` **#1**, `pintura de luz` **#1**, `pintura neon` **#1**, `caneta magica` **#1**, `grafite neon` **#1**, `pincel neon` **#1**, `desenho luz` **#2**, `arte neon` **#2**, `desenho de luz` **#3**, `pincel de luz` **#3**, `luz 3d` **#4**, `show de luz` **#4**, `festa neon` **#5**, `neon 3d` **#5**, `neon draw` **#6**, `laser neon` **#7**.\n\n### pt-PT (espelho declarado do pt-BR \u2014 sem medi\u00e7\u00e3o pr\u00f3pria)\n\n| campo | Antes (no ar) | Depois (aplicado) |\n|---|---|---|\n| name | Neon <span style=\"color:#dc3545\">AR</span> Drawing: Desenho e Luz | Neon <span style=\"color:#28a745\">Glow</span> Draw: Desenho e Luz |\n| subtitle | <span style=\"color:#dc3545\">Pintar</span>, C\u00e2mera e Show de Luz | <span style=\"color:#3b82f6\">Arte</span> <span style=\"color:#28a745\">Brilhante</span>: <span style=\"color:#28a745\">C\u00e2mara</span> e Show |\n| keywords | caneta,pintura,<span style=\"color:#3b82f6\">arte</span>,realidade,aumentada,festa,video,grafite,laser,<span style=\"color:#dc3545\">glitter</span>,pincel,magico,3d,texto | <span style=\"color:#28a745\">art</span>,<span style=\"color:#28a745\">fotos</span>,realidade,aumentada,<span style=\"color:#28a745\">brilho</span>,caneta,pincel,pintura,grafite,festa,laser,magico,video,texto,3d |\n\n**Por qu\u00ea:**\n-
