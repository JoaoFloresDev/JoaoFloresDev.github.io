len(d.get('apps', [])), 'apps')\nf = json.load(open(base + 'firebase.json'))\nprint('firebase: ', f.get('generated_at'), '\u00b7', len(f.get('apps', [])), 'apps medidos,',\n      len(f.get('untracked', [])), 'sem tracking')\n\"\n```\n\n5. Publicar o site (export est\u00e1tico do hub na pasta com hash do GitHub Pages \u2014 o Jo\u00e3o acompanha de fora do Mac por l\u00e1):\n\n```bash\nbash _GambitStudio/tools/lab-hub/publish_site.sh\n```\n\nImprime a URL final e o c\u00f3digo HTTP. Se o export abortar por \"vazamento\" ou \"link quebrado\", a pasta publicada anterior fica intacta \u2014 corrigir o `export_static.py` antes de repetir. NUNCA colar a URL/hash em arquivo do repo do site nem em mensagem de commit.\n\n## Relato\n\nResponder curto: hor\u00e1rio da coleta, n\u00ba de apps, e 1-2 destaques se saltarem (queda/alta forte de downloads, review nova ruim). O Jo\u00e3o confere o resto no site.\n\n## Se a coleta falhar\n\n- `firebase_snapshot.py` sem property nenhuma: ele agora **aborta sem gravar** (property vazia \u00e9 leitura que falhou, n\u00e3o lab sem telemetria). Causa: a service account `ga-admin` perdeu acesso \u00e0 conta GA [conta GA] (key em `keys/ga_admin_sa.json`) ou est\u00e1 em 401/429 por concorr\u00eancia \u2014 conferir com `ga4_pull.py properties` e repetir.\n- `firebase_snapshot.py` saindo com **exit 2** e \"property compartilhada sendo lida SEM filtro de stream\": \u00e9 o guarda do LEARNINGS #81. Um projeto Firebase passou a hospedar mais de um app e o agrupamento n\u00e3o isolou por `streamId` \u2014 snapshot N\u00c3O \u00e9 gravado de prop\u00f3sito (n\u00famero somando dois apps \u00e9 pior que n\u00famero velho). Rodar `python3 scripts/analytics/test_stream_isolation.py` pra ver o que quebrou.\n- Ver stderr do `pull_data.py` \u2014 causas comuns: JWT ASC expirado (regenera sozinho), rede, relat\u00f3rio ONGOING ainda n\u00e3o provisionado pela Apple (ignora, entra sozinho).\n- N\u00c3O deixar o `dashboard.json` truncado: o script escreve at\u00f4mico; se falhou no meio, o arquivo antigo continua v\u00e1lido \u2014 s\u00f3 reportar o erro.\n";</script><script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script><script>document.getElementById("md").innerHTML=window.marked?marked.parse(RAW):"<pre>"+RAW.replace(/</g,"&lt;")+"</pre>";</script></div><script>(function(){try{var k="lh.scroll:"+location.pathname;var v=sessionStorage.getItem(k);if(v!==null){sessionStorage.removeItem(k);window.scrollTo(0,parseInt(v,10)||0);}document.addEventListener("submit",function(e){var f=e.target;if(f&&f.method&&f.method.toLowerCase()==="post"){sessionStorage.setItem(k,String(window.scrollY));}},true);}catch(e){}})();</script></body></html>
