r `fileSize` + `fileName`.\n\n## 95. Upgrade do lab guiado por pesquisa: o que s\u00f3 apareceu fazendo (27/09/2026)\nUm dia de auditoria + pesquisa 2026 + aplica\u00e7\u00e3o em playbooks/skills/agentes/kits, com 14 agentes em paralelo. Quatro coisas que valem como regra:\n1. **Doc sempre-carregado \u00e9 custo por sess\u00e3o, n\u00e3o por edi\u00e7\u00e3o.** 309 KB de contexto fixo (221 KB s\u00f3 de LEARNINGS) viraram 109 KB trocando o arquivo pelo \u00edndice (uma regra por item) + detector no `scan.py` que acusa item sem linha no \u00edndice. Quem precisa da hist\u00f3ria l\u00ea sob demanda; quem precisa da regra j\u00e1 a tem. Corol\u00e1rio: aprendizado novo sem linha no `LEARNINGS-INDEX.md` n\u00e3o existe pra pr\u00f3xima sess\u00e3o.\n2. **Agentes em paralelo no mesmo repo precisam de OWNERSHIP por arquivo no brief**, n\u00e3o s\u00f3 de \"n\u00e3o commite\" (#93). Tr\u00eas agentes queriam editar `spec/pre-release-checklist.md`, dois queriam `INDEX.md`, e `RULES.md`/`CLAUDE.md` estavam nas m\u00e3os do agente do \u00edndice enquanto eu tinha uma regra nova pra escrever neles. O que evitou sobrescrita: cada brief lista os arquivos que PODE tocar e os que N\u00c3O pode, e o coordenador guarda pra si os arquivos que dois agentes precisariam. Editar `now.json` enquanto o agente de limpeza o reescrevia foi o erro do dia (s\u00f3 o `updated` se perdeu, por sorte).\n3. **Pesquisa s\u00f3 vale aplicada com o n\u00famero do achado ao lado da regra.** Seis afirma\u00e7\u00f5es dos playbooks estavam erradas ou sem fonte (\"captions s\u00e3o indexadas\", \"seven-day cliff\", \"\u00edcone +22,8%\", \"r\u00e9gua 42-56%\", \"pop=5 \u00e9 piso\", \"at\u00e9 3 tratamentos\"). A corre\u00e7\u00e3o em linha cita \"achado N\" do arquivo de pesquisa; sem isso a pr\u00f3xima edi\u00e7\u00e3o apaga a corre\u00e7\u00e3o com a mesma confian\u00e7a com que a errada foi escrita. E cada regra nova em agente nasce com asser\u00e7\u00e3o no eval e `why` \u2014 40 asser\u00e7\u00f5es novas, 0 inertes.\n4. **Or\u00e1culo de tr\u00e1fego antes de teste A/B.** 42 experimentos de PPO no lab, 12 vencedores promovidos com \u2264 3 dias e nenhum resultado salvo em disco; s\u00f3 2 apps t\u00eam impress\u00f5es pra fechar +20% em 90 dias. O `upload_ppo.py --power-check` recusa o teste que n\u00e3o tem como responder; app abaixo do piso publica a arte direto. Corol\u00e1rio do #35/#57: o check `asc.screenshot_sizes` no preflight pega o set de 6,5\" divergente do 6,9\" \u2014 o bug estava registrado desde agosto e vivo no Calc+ at\u00e9 hoje porque a regra dependia de mem\u00f3ria (#62).\nB\u00f4nus de API (27/09): In-App Event exige `deepLink` pra submeter (#94); nomination de featuring sai por `POST /v1/nominations` (`scripts/asc/nominate.py`); CPP por keyword \u00e9 `appCustomProductPageLocalizations/{id}/relationships/searchKeywords` (POST n\u00e3o exercido ainda).\n**Adendo do smoke ponta a ponta (mesma noite):** rodar o `/create-ios-app` de verdade num fixture (`evals/e2e/`) achou em 31 minutos o que meses de uso n\u00e3o acharam: a Fase 4 mandava \"merge das keys via script\" e o script n\u00e3o existia; o scaffold sa\u00eda com 1 pergunta de onboarding quando o spec pede 2-3; o `verify-analytics --strict` aprovava esqueleto sem tela (literal no helper do wrapper contava como logado); o template de Settings tinha alvo de 30pt. **Skill sem execu\u00e7\u00e3o real \u00e9 hip\u00f3tese** \u2014 o eval de contrato prova que a regra est\u00e1 escrita, o smoke prova que o pipeline a cumpre. Regra: mudou o pipeline de cria\u00e7\u00e3o, roda `evals/e2e/create_ios_app_smoke.py --runbook`.\n\n## 96. Simulador headless faz o \u00e1udio do Mac chiar: callservicesd segura o alto-falante (28/09/2026)\nJo\u00e3o ouviu \"zuada\" no som do Mac enquanto agentes trabalhavam \u2014 mesmo sem janela de simulador na tela. Diagn\u00f3stico: os 2 sims do pool estavam bootados **headless** (sem Simulator.app, invis\u00edveis), e `pmset -g assertions` mostrou o `coreaudiod` com um `iOSSimulatorAudioDevice \u2026 audio-out BuiltInSpeakerDevice` aberto h\u00e1 46 min. O dono era o **`callservicesd`** (telefonia) de dentro do sim iOS 18.5 \u2014 ele abre um stream de sa\u00edda ocioso no boot e nunca solta; no Mac Intel sob carga, qualquer stream ativo do sim faz o `coreaudiod` estalar/chiar o \u00e1udio do host inteiro.\n**Fix:** `simctl spawn <udid> launchctl disable system/com.apple.callservicesd` (persiste no launchd do device entre boots) + kill da inst\u00e2ncia viva. QA nunca precisa de telefonia. O `simpool.py boot()` agora re-aplica isso a cada boot (`mute_sim_audio`), ent\u00e3o vale at\u00e9 pra device recriado/erased.\n**Diagn\u00f3stico can\u00f4nico:** `pmset -g assertions | grep -i audio` aponta o PID exato que segura o alto-falante \u2014 n\u00e3o adivinhar pelo Simulator.app, que nem estava rodando. O plist de roteamento (`data/var/run/simulatoraudio/`) \u00e9 recriado a cada boot: n\u00e3o \u00e9 caminho de config dur\u00e1vel.\n\n**Adendo 29/09:** voltou a chiar com um simulador ligado por outra sess\u00e3o fora do `simpool.py boot()`. O mute agora tamb\u00e9m \u00e9 um hook PostToolUse (`Bash|mcp__sim-mcp__.*` \u2192 `~/.claude/hooks/sim-audio-guard.sh`, async): se existe `callservicesd` de simruntime vivo, desliga e mata o servi\u00e7o em todo simulador ligado. Sem simulador, custa um `pgrep`.\n\n## 97. \"Gen\u00e9rico e fraco\" tem causa estrutural, n\u00e3o de gosto: o pipeline media conformidade, ningu\u00e9m olhava o resultado (27-28/09/2026)\nJo\u00e3o, sobre o que o lab produz sozinho: apps gen\u00e9ricos e fracos, prints feios e mal recortados (Truco), ASO sem ganho percept\u00edvel, crash simples que o QA deixou passar. Quatro auditorias com dados deram a mesma resposta: cada etapa cumpria regra e ningu\u00e9m julgava o resultado.\n1. **ASO: 15 de 16 itera\u00e7\u00f5es sem ganho verific\u00e1vel.** N\u00e3o porque o texto fosse ruim, mas porque nada era medido: 0/16 com checkpoint D7, todo texto ia ao ar dentro de uma release (11/16 com PPO ou 2\u00aa release nos 30 dias), 9/16 com < 50 instala\u00e7\u00f5es no pa\u00eds-alvo. O \u00fanico ganho real (BLW, 1,5 \u2192 5,3 inst/dia) s\u00f3 apareceu isolando o pa\u00eds-alvo e descontando o controle. Regra: baseline autom\u00e1tica no dia live (`d00_baseline.json`, 1* por pa\u00eds), checkpoint com alvo \u00d7 outros pa\u00edses \u00d7 controle (RR + IC), quarentena de 14 dias sem PPO/release em volta do texto, piso de 100 instala\u00e7\u00f5es/30d no pa\u00eds-alvo pra sequer abrir itera\u00e7\u00e3o, e `closed` s\u00f3 com `results.final` calculado (`pull_analytics.py`). \"Ganhou\" sem esses n\u00fameros \u00e9 sensa\u00e7\u00e3o.\n2. **Prints: recorte de bitmap corta componente e duplica conte\u00fado.** O breakout por `cropY/breakoutCenterY` (#87b) cortava o placar do Truco ao meio e deixava o original vis\u00edvel embaixo; um formul\u00e1rio de sistema ocupava um slot. O kit passou a renderizar o breakout como a VIEW do componente (`Breakout` + `.breakoutSource()`, posi\u00e7\u00e3o derivada), e o upload s\u00f3 acontece depois de um gate em que o agente L\u00ca cada PNG com 8 crit\u00e9rios \u2014 inclusive \"5 prints = 5 telas diferentes\", que o primeiro gate n\u00e3o tinha e o fixture provou necess\u00e1rio (5 prints em 2 telas passaram nos 7 crit\u00e9rios de defeito).\n3. **QA: ramo condicional n\u00e3o se testa abrindo o app.** O crash do \"gostando do app?\" (#85) s\u00f3 aparecia ap\u00f3s 3 eventos positivos; o QA validava launch. `qa-runner` ganhou 8 cen\u00e1rios que FOR\u00c7AM ramos (review semeado no plist do container, compra/restore, permiss\u00e3o, deep link, relaunch no meio, vazio \u00d7 populado, esquema oposto) com grep de crash no console ap\u00f3s cada um. No fixture, o ramo do review rodou de verdade e o QA achou bug real (Restaurar sem feedback) \u2014 e uma restri\u00e7\u00e3o de ferramenta: Maestro \u00e9 uma inst\u00e2ncia por Mac.\n4. **UX: n\u00e3o havia PM nem designer, s\u00f3 executor.** A Fase 1 era um spec inline em minutos; o `screen-builder` executava bem o que estava l\u00e1. Nasceu o `product-designer` (JTBD, teardown dos prints REAIS dos concorrentes, fluxos com toques at\u00e9 o `core_action`, spec por tela com uma a\u00e7\u00e3o prim\u00e1ria e todos os estados, 3 momentos-assinatura, \"o que n\u00e3o fazer\") e o `polish-reviewer` ganhou o passo visual (screenshots pontuados com 14 crit\u00e9rios contra refer\u00eancias do nicho). No fixture, o spec decidiu tema escuro e o build continuava claro \u2014 a captura no modo oposto pegou o build n\u00e3o seguindo o spec.\n5. **Um esquema de cor por app** (Jo\u00e3o 27/09): claro OU escuro, decidido pelo nicho e pelos tops da categoria, `preferredColorScheme` fixo, sem toggle, sem variante Dark no cat\u00e1logo. Suportar os dois era metade do trabalho de design pra um resultado meio-termo.\n**Regra geral:** conformidade \u00e9 o piso; resultado se julga olhando (print, tela, n\u00famero). Toda etapa que produz algo vis\u00edvel ou mensur\u00e1vel termina com algu\u00e9m olhando ou medindo, e o crit\u00e9rio fica escrito.\n\n## 98. A regra do #53 estava no doc e n\u00e3o no c\u00f3digo: kill_or_scale somava update em \"downloads\" (30/09/2026 iPhotos)\n\n**Sintoma.** `kill_or_scale.py --app-id 1517929511 --days 45` devolveu **SCALE, 340,8 downloads/dia** pro iPhotos. O mesmo app tem **5,6 instala\u00e7\u00f5es/dia** (250 em 45 dias). A diferen\u00e7a eram as 14.717 atualiza\u00e7\u00f5es da janela.\n\n**Causa.** O loop somava `downloads += units` pra toda row do app, sem olhar `Product Type Identifier`. O LEARNINGS #53 (de 27/08) j\u00e1 dizia que `1*` \u00e9 instala\u00e7\u00e3o e `7*` \u00e9 atualiza\u00e7\u00e3o, e o `pull_data.py` do dashboard respeita isso \u2014 mas o `kill_or_scale.py` nunca foi corrigido junto. Um m\u00eas de vereditos KILL/WATCH/SCALE saiu inflado por qualquer app com base instalada grande: o iPhotos, que est\u00e1 em queda e a US$66/m\u00eas de run-rate, aparecia como o app pra \"dobrar o investimento\".\n\n**Fix.** `ptype.startswith(\"7\")` vai pra `updates`, `startswith(\"1\")` pra `downloads`, e o relat\u00f3rio imprime as duas linhas (atualiza\u00e7\u00f5es com a cita\u00e7\u00e3o do #53 ao lado, pra ningu\u00e9m somar de novo). Veredito do iPhotos virou WATCH.\n\n**A regra.** Learning que descreve uma conta \u00e9 regra de C\u00d3DIGO, n\u00e3o de documento \u2014 enquanto existir um script que faz a conta errada, o learning n\u00e3o est\u00e1 aplicado, est\u00e1 anotado. Quando um item do LEARNINGS define como um n\u00famero se calcula (#53 instala\u00e7\u00e3o vs update, #54 crash-free por vers\u00e3o, #81 property vs stream), o fechamento dele \u00e9 `grep` em TODOS os scripts que produzem esse n\u00famero, n\u00e3o s\u00f3 no que motivou o item. Dois sintomas de que isso aconteceu: um veredito que n\u00e3o combina com o run-rate de receita do mesmo app, e um n\u00famero de downloads que n\u00e3o cai quando o app est\u00e1 obviamente morrendo.\n\n## 99. Astro MCP: a tool de concorrente derruba o servidor, `add_keywords` mente no contador e o seeding duplica o pool (01/10/2026 iPhotos)\n\nRodando a iter-02 do iPhotos em 13 stores (3 agentes em paralelo), tr\u00eas comportamentos do Astro Desktop apareceram com n\u00fameros:\n\n**1. `extract_competitors_keywords` mata o servidor MCP.** 7 chamadas, 7 falhas: `connection refused` DURANTE a chamada, e o servidor volta sozinho em ~60 s. Com agentes em paralelo o custo n\u00e3o \u00e9 local \u2014 cada tentativa tira o Astro do ar pros outros. Teto de 1 tentativa por store. Substituto que entrega o mesmo prop\u00f3sito: derivar o carregamento dos concorrentes dos SERPs j\u00e1 puxados (tokens de name + subtitle dos top-10, com contagem de apps por token). Cobre name/subtitle e **n\u00e3o** cobre o keyword field dos concorrentes \u2014 dizer isso no arquivo em vez de deixar parecer completo.\n\n**2. `add_keywords` responde `added: 0 / skipped: N / \"Already tracked\"` e os termos ENTRAM.** O contador da resposta n\u00e3o \u00e9 estado. \u00danico or\u00e1culo \u00e9 o `get_app_keywords` seguinte. Quem acredita na resposta re-adiciona e cai no item 3.\n\n**3. O seeding cria linhas DUPLICADAS no pool** (11 em fr, 3 em de, 14 em it numa rodada). Duplicata n\u00e3o \u00e9 cosm\u00e9tica: o Astro passa a responder `Keyword 'X' matches 2 tracked entries` e **quebra outras chamadas** naquele store. Limpar com `remove_keywords` + re-add e conferir o pool antes de gerar qualquer CSV.\n\n**4. SERP vazio na 1\u00aa tentativa \u00e9 transiente.** 4 de 50 consultas voltaram vazias e as 4 funcionaram na segunda. Vazio sem retry vira \"termo sem concorr\u00eancia\" no relat\u00f3rio \u2014 falso achado.\n\n**A regra.** Quando o MCP do Astro n\u00e3o conecta na sess\u00e3o (as tools `mcp__astro__*` simplesmente n\u00e3o existem), o Astro Desktop continua servindo em `127.0.0.1:8089/mcp`: `aso-pipeline/scripts/astro_mcp.py call <tool> '<json>'` fala com qualquer tool dele por Bash, e \u00e9 por a\u00ed que a cadeia inteira roda nessa situa\u00e7\u00e3o. Mas servidor local de app desktop n\u00e3o \u00e9 API: mede-se o comportamento dele (quantas chamadas, quantas falhas, o que a resposta mente) e trata-se retry e verifica\u00e7\u00e3o como parte do uso, n\u00e3o como exce\u00e7\u00e3o. Toda ferramenta do fluxo tem tr\u00eas estados \u2014 passou, falhou, n\u00e3o consegui verificar (#80b) \u2014 e o contador de `add_keywords` \u00e9 o caso em que \"passou\" e \"falhou\" s\u00e3o a mesma resposta.\n\n## 100. O fix do #98 era um teste de PREFIXO e o lab emite as formas com F: \"0 updates\" era artefato (01/10/2026 Meus Gastos)\n\n**Sintoma.** Dois baselines do mesmo app discordando na mesma janela: `kill_or_scale.py --app-id 6502218501 --days 45` dizia **187 instala\u00e7\u00f5es e 0 atualiza\u00e7\u00f5es**; o mesmo cache de Sales recomputado dizia **256 instala\u00e7\u00f5es e 434 atualiza\u00e7\u00f5es**. \"Zero atualiza\u00e7\u00e3o em 45 dias\" num app com 20 mil instala\u00e7\u00f5es de base \u00e9 imposs\u00edvel \u2014 era o n\u00famero imposs\u00edvel que denunciou o mecanismo (#87).\n\n**Causa.** O fix do #98, de um dia antes, trocou \"somar tudo\" por `ptype.startswith(\"7\")` \u2192 update e `startswith(\"1\")` \u2192 download. S\u00f3 que o Product Type Identifier deste lab vem nas formas com **F**: a janela de 45 dias do Meus Gastos tem `1F`=183, `F1`=73, `F7`=434, `F3`=25 e **nada** come\u00e7ando com `7`. Resultado: `startswith(\"7\")` casa zero linhas (da\u00ed o \"0 updates\") e `startswith(\"1\")` pega `1F` mas perde `F1` \u2014 instala\u00e7\u00e3o subcontada em 29%. O `tools/lab-dashboard/pull_data.py` nunca teve o bug porque usa pertin\u00eancia exata nos conjuntos `{\"1\",\"1F\",\"1T\",\"F1\"}` / `{\"7\",\"7F\",\"7T\",\"F7\"}` / `{\"3\",\"3F\",\"3T\",\"F3\"}`.\n\n**Fix.** As tr\u00eas fam\u00edlias como constantes em `kill_or_scale.py`, pertin\u00eancia exata igual \u00e0 do dashboard, e `redownloads` (3*) contado \u00e0 parte em vez de cair no sil\u00eancio do `else`. Veredito do Meus Gastos: WATCH, 5,7 instala\u00e7\u00f5es/dia, 256 em 45d \u2014 agora id\u00eantico ao recomputo independente. Or\u00e1culo em `scripts/asc/test_kill_or_scale.py`, com a contra-prova do bug (o conjunto real `1F/F1/F7/F3` tem que dar 256/434, e o teste de prefixo tem que ERRAR) mais os negativos de IAP (`IA1`, `IA9`, `IAY`, `FI1` nunca viram download).\n\n**A regra.** O `*` da nota\u00e7\u00e3o `1*`/`7*` do #53 \u00e9 curinga dos **dois lados** \u2014 `F7` \u00e9 update tanto quanto `7F`. Fix de classifica\u00e7\u00e3o por `startswith` \u00e9 a armadilha exata dessa nota\u00e7\u00e3o, e passa despercebido porque produz zero em vez de erro. Dois corol\u00e1rios: (1) o fechamento de um item do LEARNINGS que define uma conta (#98) exige rodar o script no dado REAL e conferir contra um segundo m\u00e9todo, n\u00e3o s\u00f3 ler o diff \u2014 o #98 foi dado por fechado sem isso e durou um dia; (2) **duas fontes do mesmo n\u00famero divergindo \u00e9 achado, n\u00e3o ru\u00eddo de coleta**: aqui foi o que achou o bug, e a resposta certa do agente foi gravar as duas e dizer que estava em aberto, nunca escolher a mais bonita.\n\n## 101. Pre\u00e7o do portf\u00f3lio: a leitura por `include` devolve meio territ\u00f3rio e o default do lab \u00e9 cobrar barato (01/10/2026 lab inteiro)\n\n**Contexto.** Primeira auditoria de pre\u00e7o de todos os apps: `scripts/asc/pricing_audit.py` l\u00ea, por app, toda assinatura e todo IAP com pre\u00e7o em 10 territ\u00f3rios; `pricing_analysis.py` julga contra o `monetization-playbook.md`; `pricing_report.py` publica a p\u00e1gina.\n\n**O que a leitura mostrou.** 8 dos 12 apps mex\u00edveis t\u00eam pelo menos um plano abaixo do piso do lab (Sunrise: semanal US$ 0,29 e anual US$ 2,99, 17\u00d7 e 10\u00d7 abaixo); o trial quase nunca est\u00e1 no plano-her\u00f3i (trial nos dois planos no BLW, Meus Gastos e Neon; 3 dias no anual em 4 apps \u2014 a pior c\u00e9lula medida); nenhum app tem precifica\u00e7\u00e3o por pa\u00eds, e como a equaliza\u00e7\u00e3o da Apple embute imposto, BR/MX/IN pagam ACIMA do americano em d\u00f3lar. 90,8% da receita est\u00e1 nos dois congelados, ent\u00e3o o pre\u00e7o errado est\u00e1 justamente onde consertar \u00e9 barato.\n\n**Os tr\u00eas muros da API.**\n1. `GET /v2/inAppPurchases/{id}/iapPriceSchedule?include=manualPrices,automaticPrices` tem teto de 50 por include e N\u00c3O pagina pelo `links.next` da relationship: volta a cabe\u00e7a alfab\u00e9tica dos 175 territ\u00f3rios (AFG\u2026DEU) e nada de MEX/IND. Isso n\u00e3o vira erro \u2014 vira um relat\u00f3rio afirmando \"IAP sem pre\u00e7o no M\u00e9xico\", que \u00e9 o or\u00e1culo respondendo LIBERADO sem conseguir ler (#80b). O caminho certo \u00e9 a relationship com filtro: `GET /v1/inAppPurchasePriceSchedules/{id}/{manualPrices|automaticPrices}?limit=200&filter[territory]=USA,BRA,\u2026`.\n2. `inAppPurchasePricePoints` n\u00e3o tem GET pr\u00f3prio (403 \"no allowed operations\"). O pre\u00e7o sai casando o tier: o id de todo price/price-point \u00e9 base64 de `{\"s\":<produto>,\"t\":<territ\u00f3rio>,\"p\":<tier>}`, e o tier \u00e9 global \u2014 decodificar o id do schedule e procurar o mesmo `p` em `/v2/inAppPurchases/{id}/pricePoints?filter[territory]=\u2026`.\n3. Em `/v1/subscriptions/{id}/prices`, sem `include=territory` a relationship `territory` simplesmente n\u00e3o vem no `data` \u2014 o parse casa zero linhas e o app aparece sem pre\u00e7o nenhum. E o endpoint devolve o HIST\u00d3RICO por territ\u00f3rio (startDate null = original): o pre\u00e7o vigente \u00e9 a entrada mais recente com `startDate <= hoje`, nunca a primeira nem a \u00faltima da lista.\n\n**Regra.** Auditoria de pre\u00e7o se l\u00ea por territ\u00f3rio expl\u00edcito e por schedule vigente, nunca pelo que o `include` couber. Todo n\u00famero do relat\u00f3rio que \u00e9 convers\u00e3o para d\u00f3lar sai com o c\u00e2mbio e a data ao lado \u2014 o que a Apple cobra \u00e9 sempre o pre\u00e7o local. E o piso de pre\u00e7o do lab (semanal US$ 4,99-5,99, anual US$ 29,99-39,99) agora tem or\u00e1culo: `pricing_analysis.py` acusa app abaixo do piso, trial nos dois planos, trial \u2264 4 d no anual, semanal \u2265 mensal e anual com menos de 8 semanas de desconto.\n\n## 102. Duas linhas de vers\u00e3o no mesmo app: o altool compara o short version do BUILD, n\u00e3o a vers\u00e3o da LOJA (01/10/2026 iPhotos)\n\n**Sintoma.** `altool --upload-app` recusou a 1.10.0 com 409: *\"The value for key CFBundleShortVersionString [1.10.0] must contain a higher version than that of the previously approved version [29]\"* \u2014 e, na mesma resposta, *\"the build with the version 9 can't be imported\"*. A ASC mostrava 1.9.0 READY_FOR_SALE e o iTunes lookup tamb\u00e9m dizia 1.9.0. Nada no `pbxproj` falava de 29: ele estava em `MARKETING_VERSION = 29` desde um rebrand, e eu tinha acabado de trocar por `1.10.0` justamente por achar que o pbxproj estava stale.\n\n**Causa.** O app carrega **duas numera\u00e7\u00f5es paralelas**: a de marketing, que \u00e9 o `versionString` do `appStoreVersion` e \u00e9 o que a loja exibe (1.7.0 \u2192 1.8.0 \u2192 1.9.0), e a **num\u00e9rica do bin\u00e1rio**, que \u00e9 o `CFBundleShortVersionString` (\u202627, 28, 29). A prova est\u00e1 na API: `GET /v1/appStoreVersions/{id}/build` da 1.9.0 devolve o build 33, e `GET /v1/builds/33/preReleaseVersion` devolve **version = 29**. O altool compara contra essa, n\u00e3o contra o `versionString`. E compara **componente a componente**: \"1.10.0\" vira (1,10,0) e 1 < 29, da\u00ed tamb\u00e9m o \"version 9\" no texto do erro (ele isola o maior componente).\n\n**Fix.** Bin\u00e1rio vai como **30** (`MARKETING_VERSION = 30`, `CURRENT_PROJECT_VERSION = 34`) e o `appStoreVersion` continua **1.10.0** \u2014 exatamente o arranjo da 1.9.0 \u2190 build short 29. Upload aceito, build 34 `VALID`.\n\n**A regra.** Antes de escolher o n\u00famero de uma vers\u00e3o, ler o short version do BUILD da \u00faltima vers\u00e3o aprovada (`appStoreVersions/{id}/build` \u2192 `builds/{id}/preReleaseVersion`), nunca o `versionString` da loja nem o `pbxproj`. Em app legado herdado as duas linhas divergem silenciosamente, e o `pbxproj` com um n\u00famero \"errado\" pode ser o \u00fanico lugar que guarda a linha verdadeira \u2014 o #0b j\u00e1 dizia \"maior que a vers\u00e3o da LOJA, n\u00e3o a do pbxproj\", e a leitura certa dessa frase \u00e9: a \"vers\u00e3o da loja\" que importa \u00e9 a do BIN\u00c1RIO. Corol\u00e1rio de processo: esse 409 chega **depois** de archive + export (~20 min cada), ent\u00e3o a confer\u00eancia \u00e9 de 2 requests e vem ANTES do archive. Vale tamb\u00e9m um aviso de que o erro mente na apar\u00eancia: ele cita \"version 9\" e a vers\u00e3o rejeitada \u00e9 1.10.0.\n";</script><script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script><script>document.getElementById("md").innerHTML=window.marked?marked.parse(RAW):"<pre>"+RAW.
