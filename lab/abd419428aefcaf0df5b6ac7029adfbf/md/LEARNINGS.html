dentifierPrefix)$(CFBundleIdentifier)`). Bundle id diferente no Mac = **balde diferente, sem erro, sem log, sem exce\u00e7\u00e3o** \u2014 s\u00f3 um app que sempre mostra zero. Declarar \u00e0 m\u00e3o o identifier do OUTRO app n\u00e3o passa no provisioning (o perfil traz o valor derivado do bundle id do target; \u00e9 o #2 de novo). O caminho que funciona \u00e9 o Mac usar o **MESMO bundle id** do iOS (registrar/usar o bundleId como `UNIVERSAL`, que \u00e9 o mecanismo de universal purchase) \u2014 a\u00ed o entitlement expande sozinho pro balde certo. Provar SEMPRE lendo o entitlement do bin\u00e1rio assinado (`codesign -d --entitlements :-`) e, em runtime, `SecTaskCopyValueForEntitlement` \u2014 a falha n\u00e3o tem mensagem, ent\u00e3o o app precisa mostrar o valor.\n2. **Device MAC_OS tem que estar registrado na conta** ou o archive/build assinado falha com \"Device ... isn't registered\". Sai por API: `POST /v1/devices` com `platform: MAC_OS` e o **Provisioning UDID** (`system_profiler SPHardwareDataType`; em Apple Silicon \u00e9 igual ao Hardware UUID).\n3. **A regra \"nuvem vazia nunca apaga disco cheio\" torna imposs\u00edvel propagar a exclus\u00e3o da \u00daLTIMA tarefa.** Apagar de 4 pra 1 atravessa normal; apagar a 1 restante escreve um snapshot com `taskCount: 0`, que o outro lado l\u00ea como \"ainda n\u00e3o sincronizou\" e responde **re-semeando com o que ele tem**. \u00c9 o trade correto (nunca perder dado), mas \u00e9 uma consequ\u00eancia de produto que precisa ser dita, n\u00e3o descoberta pelo usu\u00e1rio. Quem quiser exclus\u00e3o total atravessando precisa de um marcador expl\u00edcito (tombstone/`clearedAt`) \u2014 n\u00e3o de afrouxar a regra.\n**B\u00f4nus de m\u00e9todo \u2014 duas sess\u00f5es no mesmo app s\u00e3o uma condi\u00e7\u00e3o de corrida real.** Duas sess\u00f5es Claude trabalhando no mesmo diret\u00f3rio e dirigindo o MESMO app (mesmo bundle id = mesmo container = mesmo balde) produziram: uma tarefa que \"mudou de quadrante sozinha\" (era a outra sess\u00e3o testando drag), contador de ids queimado, e um commit meu que capturou a implementa\u00e7\u00e3o de drag da outra. O que resolveu foi **instrumentar**: toda muta\u00e7\u00e3o (`add`/`move`/`delete`/`rename`/`toggle`) loga o que vai fazer ANTES de fazer. \"Uma tarefa mudou de quadrante e ningu\u00e9m sabe por qu\u00ea\" \u00e9 o \u00fanico bug que um app de tarefas precisa saber responder, e muta\u00e7\u00e3o sem rastro n\u00e3o responde.\n**Drag dentro de `List` no macOS:** o c\u00f3digo que ficou usa `.onDrag` com `NSItemProvider` (visibility `.ownProcess`) + `.onDrop`, e ESSE eu verifiquei na tela (arrastei nos dois sentidos, com o log registrando cada `move` e o iPhone lendo a mudan\u00e7a de quadrante). O diagn\u00f3stico de que `.draggable`/`.dropDestination` (Transferable) n\u00e3o abre sess\u00e3o de drag dentro de um `List` \u2014 porque o `NSTableView` \u00e9 dono do mouse-down \u2014 veio da outra sess\u00e3o e est\u00e1 registrado no now.json; eu n\u00e3o o reproduzi isolado, ent\u00e3o trate como a raz\u00e3o declarada da troca, n\u00e3o como medi\u00e7\u00e3o minha.\n\n## 76. Link da store morre enquanto o app dorme na loja \u2014 e s\u00f3 a review exerce ele (04/09/2026 Cronos)\nO Cronos 1.2.0 foi rejeitado com `privacyPolicyUrl = http://twixar.me/dykT` nos 3 locales \u2014 um **encurtador que morreu** (HTTP 522, origem fora do ar; DNS resolve, Cloudflare responde, back-end n\u00e3o). O link estava l\u00e1 desde 2020 e **funcionava** na \u00faltima review (1.1.4, mai/2024). Ningu\u00e9m percebe porque o link s\u00f3 \u00e9 exercido quando algu\u00e9m revisa: dois anos parado na loja = dois anos sem ningu\u00e9m clicar.\n**A evid\u00eancia que fecha o diagn\u00f3stico \u00e9 DIFERENCIAL, n\u00e3o absoluta.** A 1.2.0 saiu num lote de 4 apps com a MESMA feature (lembrete di\u00e1rio + primer 5.1.1(iv)) submetidos na mesma janela: philos e DevLingo **aprovados**, Bible e Cronos rejeitados. Logo a feature n\u00e3o \u00e9 a causa. Dos 4, s\u00f3 o Cronos tinha link morto (philos `gambitstudiotech.com` 200, DevLingo/Bible Drive 200). Quando um lote padronizado se divide, **procure o que \u00e9 \u00fanico do reprovado** \u2014 a hip\u00f3tese que explica os 4 ao mesmo tempo \u00e9 a \u00fanica que vale.\n**Regra:** encurtador (twixar/bit.ly/tinyurl) NUNCA em campo de metadata da store \u2014 o link vive mais que o servi\u00e7o. Usar o Drive do lab ou `gambitstudiotech.com`.\n**Check:** `preflight.py --app-id N` agora tem `asc.urls` \u2014 testa `privacyPolicyUrl` (de `appInfoLocalizations`) + `supportUrl`/`marketingUrl` (de `appStoreVersionLocalizations`), 1 request por URL distinta. Calibragem que evita or\u00e1culo falso: 401/403/405/429 contam como VIVO (anti-bot do Drive/Cloudflare abre no browser), e um **can\u00e1rio** (`apple.com`) separa \"link morto\" de \"minha rede caiu\" \u2014 se o can\u00e1rio cai junto, vira WARN. Casos negativos e positivos em `test_preflight.py`.\n**Corol\u00e1rio de forense:** antes de culpar o c\u00f3digo do release, confira o que o build submetido REALMENTE continha. A tag `release/15` do Cronos \u00e9 de 02/09 22:46; o redesign dark, a remo\u00e7\u00e3o do AdMob e a do badge s\u00e3o de 03/09 10:55 em diante \u2014 ou seja, o revisor viu o app ROXO com AdMob 7.69.0 e badge, e o `whatsNew`/`advertising: true` estavam CERTOS naquele momento. Diagnosticar contra o HEAD em vez de contra a tag inverte o sinal de metade das hip\u00f3teses.\n\n## 77. Age rating incoerente com o que o app MOSTRA \u2014 o preflight passava verde na exata coisa que a review v\u00ea primeiro (04/09, lote de rejei\u00e7\u00f5es 02-03/09)\nA Sueca 42.0.0 subiu um baralho chamado **\"Never Have I Ever 18+\"** com cartas de striptease e sexting (`deck.eununca.card.18`, `.12`) enquanto o `ageRatingDeclaration` dizia `sexualContentOrNudity: NONE`. O `preflight.py --only asc` rodou **7 checks, 0 FAIL**: conferia keywords, subtitle, l\u00e9xico 2.5.14 e prints duplicados, e era cego pra incoer\u00eancia entre o conte\u00fado e a declara\u00e7\u00e3o. No mesmo lote o Cronos 1.2.0 declarava `advertising: true` \u2014 e a forense mostrou que naquele momento a declara\u00e7\u00e3o estava CERTA: a tag `release/15` aponta pro commit de 02/09 22:46, e a remo\u00e7\u00e3o do AdMob s\u00f3 veio em 03/09 13:37. O revisor viu o app antigo, com AdMob. A incoer\u00eancia era **latente**: ficaria falsa no build seguinte. Isso \u00e9 o alerta de m\u00e9todo: diagnosticar contra o HEAD em vez de contra **o commit que a tag aponta** inverte o sinal da hip\u00f3tese e faz perder tempo consertando o que n\u00e3o estava quebrado. Sempre `git show <tag>:<arquivo>` antes de acusar o build.\n**Regra nova (`checks/age_rating.py`, grupo `--only rating`)** \u2014 l\u00ea os `.strings`/`.xcstrings`/`.arb` do projeto e cruza com a declara\u00e7\u00e3o do appInfo EDIT\u00c1VEL (#65b):\n- `rating.sexual` **FAIL**: vocabul\u00e1rio de ATO sexual (striptease, threesome, sexting, nudes, transar, hook up\u2026) com `sexualContentOrNudity=NONE`. Insinua\u00e7\u00e3o (beijo, crush, flerte) fica de fora de prop\u00f3sito.\n- `rating.alcohol` **FAIL**: **3 ou mais bebidas DISTINTAS** (cerveja/shot/vodka/tequila/vinho/cacha\u00e7a\u2026) com \u00e1lcool `NONE`. O piso de variedade \u00e9 o que separa jogo de beber de app de beber \u00e1gua \u2014 \"drink 2L of water\" e \"evite \u00e1lcool\" n\u00e3o podem disparar.\n- `rating.ads` **FAIL** se h\u00e1 SDK de an\u00fancio no Podfile/project.yml/pubspec e `advertising=false`; **WARN** no inverso (declarado sem SDK no projeto \u2014 o estado em que o Cronos ficou depois de tirar o AdMob).\n- `rating.adult` **WARN** (n\u00e3o FAIL): marcador \"+18\"/\"18+\" com sexual E mature ambos NONE. \u00c9 WARN porque \"R$ 18 + taxa\" num app de finan\u00e7as casaria \u2014 falso positivo aqui custa mais do que o achado vale (#62/#63).\n**A camada de artefato pagou na hora**: rodando contra os 9 apps de recovery, 8 limpos e **1 FAIL real** \u2014 o **Foguetinho** tem `pod 'Google-Mobile-Ads-SDK'` no Podfile e declara `advertising: false`, num app que est\u00e1 **LIVE** (12.0.1). Como o app s\u00f3 tem o appInfo `READY_FOR_SALE`, a corre\u00e7\u00e3o s\u00f3 entra numa vers\u00e3o nova.\n**Corol\u00e1rio de m\u00e9todo**: app legado sem `.strings` (o Cronos hardcoda tudo) tinha que sair cedo do check e n\u00e3o sair \u2014 a regra de an\u00fancio l\u00ea o Podfile, n\u00e3o o texto. Sair antes dela era o check perdendo justamente o caso que o originou.\n\n## 77b. Adendo \u2014 \"Sex\" \u00e9 sexta-feira: o `rating.sexual` reprovava um app de faltas (11/09/2026 College)\nO `(?<![\\w.])sex(?![\\w.])` do `SEXUAL_ACT` casou `\"weekdayFri\" = \"Sex\";` (pt-BR e pt-PT) e o preflight deu BLOQUEADO no College, que n\u00e3o tem nada adulto. Iria negar o pr\u00f3ximo export dele pelo hook. Fix no `checks/age_rating.py`: antes de casar, `_drop_weekday_sex` tira s\u00f3 dois formatos \u2014 valor de cat\u00e1logo que \u00e9 exatamente \"Sex\"/\"Sex.\", e \"Sex\" numa fileira com \u2265 2 outras abrevia\u00e7\u00f5es de dia (Seg/Ter/Qua/Qui/S\u00e1b/Dom). Frase com \"sex\" continua FAIL. Tr\u00eas negativos e uma contra-prova no `test_preflight.py`; com o filtro mutado para identidade, os negativos reprovam. Mesma fam\u00edlia do romeno \"porne\u0219te\" (WTMP): **palavra curta de um idioma \u00e9 palavra comum em outro** \u2014 app com calend\u00e1rio em portugu\u00eas sempre vai ter \"Sex\".\n\n## 78. Rejei\u00e7\u00e3o: o Resolution Center N\u00c3O tem API, mas print de vers\u00e3o REJECTED continua mut\u00e1vel (04/09)\nDois fatos apurados sondando as 4 rejei\u00e7\u00f5es do lote de 02-03/09 (Sueca 42.0.0, Cronos 1.2.0, Bible 1.2.2, SafeDoc 1.1.0):\n1. **N\u00e3o existe endpoint de Resolution Center.** `/v1/appStoreVersions/{id}/resolutionCenterMessages`, `.../appStoreReviewRejections` e `/v1/resolutionCenterThreads?filter[app]=` d\u00e3o **404 PATH_ERROR**; `/v1/apps/{id}/reviewSubmissions?include=items` d\u00e1 **400 PARAMETER_ERROR**. O que a API entrega \u00e9 s\u00f3 o estado: `reviewSubmissions.state = UNRESOLVED_ISSUES` e `appStoreVersion.appStoreState = REJECTED`. O motivo chega **por e-mail** \u2014 ent\u00e3o, sem acesso ao e-mail, a sess\u00e3o fica cega e depende do Jo\u00e3o colar o texto. Sondar \u00e9 seguro (GET n\u00e3o suja nada, diferente do `POST /v1/reviewSubmissions` do #1).\n2. **Screenshot de vers\u00e3o `REJECTED` \u00e9 edit\u00e1vel** \u2014 DELETE, upload e PATCH de ordem passam normalmente. Isso **n\u00e3o contradiz o #73**, delimita: o congelamento vale pra vers\u00e3o `READY_FOR_SALE`. Refresh de print numa vers\u00e3o rejeitada N\u00c3O custa vers\u00e3o nova; numa publicada, custa.\n**Como diagnosticar sem o texto \u2014 o diferencial de lote.** As 4 rejei\u00e7\u00f5es sa\u00edram de work orders que aplicaram a MESMA mudan\u00e7a padronizada em v\u00e1rios apps na mesma noite. Bible e Cronos receberam a mesma feature (lembrete di\u00e1rio + primer 5.1.1(iv)) que o philos e o DevLingo, e **philos e DevLingo foram APROVADOS na mesma janela de review** \u2014 o que elimina a feature como causa e for\u00e7a o diagn\u00f3stico pra o que \u00e9 espec\u00edfico de cada app. Quando um lote padronizado tem aprovados e rejeitados, **os aprovados s\u00e3o o grupo de controle**: comparar contra eles vale mais que qualquer hip\u00f3tese solta.\n\n## 79. Permiss\u00e3o chamada no c\u00f3digo sem a `NS*UsageDescription` \u2014 o RULES j\u00e1 mandava e ningu\u00e9m executava (04/09/2026 Bible + philos)\nO RULES diz \"Permiss\u00e3o sempre com `NS*UsageDescription` (sen\u00e3o crash)\" desde sempre. Em 04/09 o lab tinha **dois** apps Flutter chamando a c\u00e2mera sem a chave: **Bible Pills** (rejeitado) e **philos** (**aprovado no mesmo lote**, em 02/09). Nos dois, cinco toques a partir da home chegam em `_pickImage(ImageSource.camera)`; o plugin cai em `[AVCaptureDevice requestAccessForMediaType:]`, e o iOS mata o processo quando a usage description n\u00e3o existe. \u00c9 SIGABRT determin\u00edstico em qualquer aparelho.\n**Por que o simulador n\u00e3o pega:** sem c\u00e2mera, `authorizationStatusForMediaType` nunca fica `NotDetermined` e o `image_picker` entra no ramo `else` de `showCamera` \u2014 a tela mostra \"Camera not available\" em vez do prompt. Testar c\u00e2mera no simulador prova nada; a prova \u00e9 est\u00e1tica (caminho da UI alcan\u00e7\u00e1vel + chave ausente no plist **do commit que a tag aponta** + API que exige a chave).\n**O philos ter passado \u00e9 o dado que importa mais que o crash**: prova que isso \u00e9 bug real de usu\u00e1rio nos dois apps, mas **n\u00e3o \u00e9 o diferencial** que explica um rejeitado e outro aprovado. Confounder, n\u00e3o causa \u2014 o revisor do philos simplesmente n\u00e3o tocou ali.\n**Virou check** (`checks/permissions.py`, grupo `--only perms`): mapeia API \u2192 chave exigida e reprova quem usa sem declarar. Precis\u00e3o vem de duas decis\u00f5es: (a) **galeria por PHPicker N\u00c3O exige a chave** \u2014 no iOS 14+ o `pickImage` de galeria do image_picker roteia por `launchPHPickerWithContext` e nunca toca `PHPhotoLibrary`, ent\u00e3o exigir ali acusaria app correto; (b) a chave conta como declarada se estiver no `Info.plist`, no `project.yml` do xcodegen **ou** no `InfoPlist.xcstrings` \u2014 ler s\u00f3 o plist reprova todo app xcodegen. Chave declarada sem uso vira WARN (o Cronos carregava uma `NSPhotoLibraryUsageDescription` herdada de outro app).\n**Corol\u00e1rio de m\u00e9todo (o mesmo do #77):** dois relat\u00f3rios diferentes hoje quase erraram por diagnosticar contra o HEAD. O que vale \u00e9 `git show <tag>:<arquivo>` \u2014 no Cronos, a tag apontava pra um commit ANTES de todo o redesign, e o revisor viu o app antigo.\n\n## 79b. Adendo \u2014 coment\u00e1rio lido como c\u00f3digo transforma o or\u00e1culo em acusador de quem documenta (04/09/2026)\nDuas passagens do check do #79 na estreia, e as duas s\u00e3o sobre a mesma coisa:\n- **Falso positivo**: o Bible Pills tem um coment\u00e1rio de 7 linhas explicando POR QUE n\u00e3o precisa de `NSPhotoLibraryUsageDescription` (o `requestFullMetadata: false` mant\u00e9m a galeria no PHPicker). O regex casou `PHPhotoLibrary.requestAuthorization` **dentro da explica\u00e7\u00e3o** e reprovou o app. Um or\u00e1culo que l\u00ea coment\u00e1rio como c\u00f3digo pune exatamente quem documentou o cuidado.\n- **Falso positivo #2, e maior**: no Truco o check acusou c\u00e2mera em `CustomModalViewController.swift:155` \u2014 o bloco inteiro est\u00e1 **comentado**, c\u00f3digo morto de uma feature abandonada. O Truco estava EM REVIEW naquele momento; reportar isso como crash teria mandado a sess\u00e3o consertar o que n\u00e3o existe, num app que n\u00e3o podia receber build novo.\n**Fix**: tirar `//` e `/* */` antes de casar, com lookbehind de `:` pra n\u00e3o estra\u00e7alhar `https://` dentro de string. E a verifica\u00e7\u00e3o que fecha o ciclo: depois do fix, conferir MANUALMENTE a linha que sumiu \u2014 se o hit some porque virou coment\u00e1rio, \u00f3timo; se some porque o strip comeu c\u00f3digo real, o check acabou de virar falso NEGATIVO, que \u00e9 pior. No Truco a linha 155 \u00e9 `//        picker.sourceType = .camera` \u2014 coment\u00e1rio mesmo.\n**Regra geral pra todo check por grep**: c\u00f3digo morto comentado \u00e9 a maior fonte de ru\u00eddo em app legado, e legado \u00e9 justamente onde o check mais precisa acertar.\n\n## 79c. Adendo \u2014 as quatro maneiras de um grep acusar app inocente (04/09/2026)\nO check do #79 rodou tr\u00eas vezes no portf\u00f3lio antes de virar confi\u00e1vel. Em seis apps acusados, **quatro eram erro do verificador**, e cada um \u00e9 uma classe distinta que vale pra QUALQUER check por grep:\n1. **Coment\u00e1rio lido como c\u00f3digo** \u2014 Bible (o coment\u00e1rio que explicava a aus\u00eancia da chave) e Truco (bloco inteiro de c\u00e2mera comentado, feature abandonada). Fix: tirar `//` e `/* */` antes de casar, com lookbehind de `:` pra preservar `https://`.\n2. **API que CONSULTA vs API que PEDE** \u2014 `canEvaluatePolicy` n\u00e3o abre prompt nenhum (quem abre \u00e9 `evaluatePolicy`); instanciar `CMMotionActivityManager`, `CNContactStore`, `EKEventStore`, `SFSpeechRecognizer` ou `HKHealthStore` tamb\u00e9m n\u00e3o. Casar o construtor acusa app que s\u00f3 declarou uma vari\u00e1vel.\n3. **Fonte no disco, fora do target** \u2014 o iPhotos carrega o `TZImagePickerController` inteiro (com `requestWhenInUseAuthorization`) desde que ele saiu do target no fix do AssetsLibrary (#0b). Fix: s\u00f3 conta arquivo que aparece numa fase `Sources` de algum `.pbxproj`; sem `.xcodeproj` n\u00e3o filtra nada (melhor falso positivo que falso negativo), e `.dart` nunca entra no pbxproj.\n4. **Compilado mas que ningu\u00e9m chama** \u2014 o WTMP tem `BiometricService.swift` chamando `evaluatePolicy` sem `NSFaceIDUsageDescription`, no target, e **nenhum outro arquivo do app referencia o tipo**. Hoje n\u00e3o roda. Nem FAIL (mandaria consertar o que n\u00e3o quebra) nem sil\u00eancio (a bomba fica armada pro dia em que o servi\u00e7o for plugado): virou `perms.dormant`, um WARN que diz exatamente isso. Se qualquer arquivo passar a citar o tipo, volta a ser FAIL \u2014 e h\u00e1 teste pros dois lados.\n**A regra que sai daqui**: app legado tem as quatro coisas ao mesmo tempo, e legado \u00e9 justamente onde o check mais precisa acertar. O custo de calibrar \u00e9 alto e \u00e9 o trabalho \u2014 um or\u00e1culo que grita por nada \u00e9 ignorado em duas semanas, e a\u00ed o buraco real passa junto.\n\n## 80. O juiz da meta l\u00ea Sales Report e n\u00e3o enxerga an\u00fancio \u2014 mas antes de estimar o buraco, conferir quem SERVE an\u00fancio e n\u00e3o quem LINKA o SDK (05/09/2026)\nO mandato de setembro \u00e9 julgado por \"US$200 do conjunto\", e o n\u00famero vem do `revenue_usd` do dashboard \u2014 que \u00e9 a soma de `Developer Proceeds` do **Sales Report da Apple** (`pull_data.py:88`). Sales Report cont\u00e9m IAP e app pago. **N\u00e3o cont\u00e9m receita de an\u00fancio.** Quatro dos dez apps carregam `Google-Mobile-Ads-SDK` \u2014 Sueca (130 instala\u00e7\u00f5es/30d), Neon (82), Truco (66) e Foguetinho (11) \u2014 e **tr\u00eas deles apresentam an\u00fancio de verdade** (todos menos a Sueca; a tabela abaixo tem a evid\u00eancia por app, e a segunda corre\u00e7\u00e3o explica por que a primeira contagem saiu errada). Ou seja, a m\u00e9trica que decide sucesso ou fracasso do m\u00eas \u00e9 cega para o canal de monetiza\u00e7\u00e3o de tr\u00eas dos quatro apps de maior tr\u00e1fego do conjunto.\n**N\u00e3o \u00e9 hip\u00f3tese, \u00e9 aritm\u00e9tica do pipeline:** o conjunto marca US$ 6,44 em 30 dias, e esses US$ 6,44 s\u00e3o IAP da Sueca. Quanto o AdMob rendeu no mesmo per\u00edodo \u00e9 desconhecido \u2014 nada no lab sabe dizer.\n\n**CORRE\u00c7\u00c3O no mesmo dia, e \u00e9 a parte que mais importa:** a primeira vers\u00e3o desta li\u00e7\u00e3o dizia \"4 dos 10 apps monetizam com AdMob\", contando quem tem o pod no Podfile. Est\u00e1 errado \u2014 **linkar o SDK n\u00e3o \u00e9 servir an\u00fancio**. Varrendo o c\u00f3digo de verdade (`GADInterstitialAd` / `GADBannerView` / `GADRequest` / `adUnitID`, fora de `Pods/`):\n| App | SDK linkado | Serve an\u00fancio? | Evid\u00eancia |\n|---|---|---|---|\n| Foguetinho | sim | **SIM** | `GameViewController.swift:19` \u2014 `GADInterstitial(adUnitID: \"ca-app-pub-\u2026/1816921732\")` |\n| Neon | sim | **SIM** | `ViewController.swift:564` \u2014 `GADInterstitialAd.load(...)` com `GADRequest()` |\n| Sueca | sim | **N\u00c3O** | s\u00f3 `GADMobileAds.sharedInstance().start()` no AppDelegate + stubs de delegate que d\u00e3o `print` |\n| Truco | sim (7.69.0) | **SIM** | `AppDelegate.swift:20` \u2014 `GADMobileAds.sharedInstance().start()`; `TrucoViewController.swift:104` \u2014 `GADInterstitial(adUnitID: \"ca-app-pub-\u2026/1816921732\")`, `:106` `load(GADRequest())`, `:608` `present(fromRootViewController:)` a cada 2\u00ba rein\u00edcio de partida |\nOu seja: 3 dos 4 servem an\u00fancio; o SDK mudo \u00e9 s\u00f3 o da Sueca. A receita de AdMob do conjunto continua **desconhecida** \u2014 o buraco de medi\u00e7\u00e3o \u00e9 real e precisa ser fechado \u2014, mas n\u00e3o d\u00e1 pra afirmar que \u00e9 ~zero: Truco (66 instala\u00e7\u00f5es/30d) e Foguetinho apresentam interstitial de verdade.\n\n**SEGUNDA corre\u00e7\u00e3o, no mesmo dia, e a li\u00e7\u00e3o de m\u00e9todo est\u00e1 nela.** A linha do Truco acima dizia \"zero ocorr\u00eancia de qualquer s\u00edmbolo do SDK; nem `start()` \u00e9 chamado\" \u2014 falso, como as 4 refer\u00eancias provam. O erro veio do pr\u00f3prio grep que a li\u00e7\u00e3o prescreve: o conjunto de padr\u00f5es era `GADInterstitialAd` / `GADBannerView` / `GADRequest` / `adUnitID`, e **`GADInterstitialAd` \u00e9 a classe do SDK v8+; o Truco usa a v7 (`GADInterstitial`, sem o sufixo `Ad`)**. Buscar o nome moderno num app de 2020 devolve vazio com toda a confian\u00e7a do mundo. Some a isso o diret\u00f3rio do app se chamar `Truco marcador/` **com espa\u00e7o**, que come path n\u00e3o citado em varredura de shell. Ou seja: a mesma armadilha do #79c, um n\u00edvel acima \u2014 l\u00e1 o grep lia o que n\u00e3o conta (coment\u00e1rio, fonte fora do target), aqui ele **n\u00e3o l\u00ea o que conta** porque o vocabul\u00e1rio do padr\u00e3o \u00e9 de outra era da API. Regra que fica: grep de aus\u00eancia (\"n\u00e3o existe X\") s\u00f3 vale com o vocabul\u00e1rio da VERS\u00c3O que o app usa \u2014 confira no `Podfile.lock` qual major est\u00e1 pinado ANTES de escolher os s\u00edmbolos, e trate `0 ocorr\u00eancias` num app legado como suspeita de padr\u00e3o errado, n\u00e3o como prova. Aus\u00eancia \u00e9 a afirma\u00e7\u00e3o mais cara de fazer com grep.\n\nDetalhe colateral: **Truco e Foguetinho usam o MESMO ad unit** (`[ad unit]`), ent\u00e3o receita de AdMob n\u00e3o \u00e9 atribu\u00edvel por app pelo unit id.\n**A alavanca parada existe, mas \u00e9 s\u00f3 a Sueca.** Ela paga o custo INTEIRO do AdMob \u2014 peso do SDK e o `advertising` do age rating (\u00e9 esse o FAIL confirmado do Foguetinho no #77) \u2014 faturando zero: ou liga an\u00fancio de verdade, ou tira o pod; linkado e mudo \u00e9 o pior dos tr\u00eas estados. No Truco o `advertising: true` da declara\u00e7\u00e3o est\u00e1 **coerente** com o que o app faz. O que sobra nele \u00e9 o SDK de 2020 sem privacy manifest (risco de ITMS-91061, #33) \u2014 d\u00edvida real, mas *n\u00e3o* explica a rejei\u00e7\u00e3o da 52: `Podfile`, `Podfile.lock` e os 3 `PrivacyInfo.xcprivacy` da \u00e1rvore s\u00e3o **byte a byte iguais** entre a 51 (aprovada em 03/09) e a 52 (rejeitada em 04/09), ent\u00e3o o SDK n\u00e3o distingue uma da outra. \u00c9 confounder, n\u00e3o causa \u2014 mesmo desfecho da c\u00e2mera do Bible no #79.\n**Tamb\u00e9m n\u00e3o d\u00e1 pra estimar por dentro do GA4 hoje.** Varredura das 11 properties: nenhuma emite `ad_impression` (o evento que carrega `value` quando AdMob e Firebase est\u00e3o vinculados). O College tem `ad_interstitial_shown`/`ad_interstitial_failed`, que s\u00e3o eventos caseiros de contagem \u2014 provam que o an\u00fancio apareceu, n\u00e3o quanto pagou. Sem o v\u00ednculo AdMob\u2194Firebase, receita de an\u00fancio n\u00e3o existe em lugar nenhum que a sess\u00e3o alcance.\n**O que fazer (e o que s\u00f3 o Jo\u00e3o faz):** o v\u00ednculo AdMob\u2194Firebase \u00e9 feito no console do AdMob, com a conta dona \u2014 n\u00e3o sai por service account nem pela chave da ASC. Feito o v\u00ednculo, o `ad_impression` com `value` passa a chegar no GA4 e o lab l\u00ea pela mesma rota que j\u00e1 usa (`ga4_pull.py`), **sem build novo**. Enquanto isso n\u00e3o existir, todo relat\u00f3rio do lab que disser \"receita\" tem que dizer *receita de IAP*, e o checkpoint de 02/10 tem que declarar o buraco em vez de somar zero e chamar de fracasso.\n**As duas regras gerais:** (1) antes de eleger uma m\u00e9trica como juiz de uma meta, conferir se ela ENXERGA o canal onde o dinheiro entra; (2) presen\u00e7a de depend\u00eancia n\u00e3o \u00e9 uso de depend\u00eancia \u2014 contar Podfile e chamar de monetiza\u00e7\u00e3o \u00e9 o mesmo erro de m\u00e9todo do #79c (fonte no disco mas fora do target, c\u00f3digo compilado que ningu\u00e9m chama). Grep de manifesto responde \"est\u00e1 instalado\"; s\u00f3 grep de chamada responde \"est\u00e1 funcionando\". \u00c9 a mesma fam\u00edlia do #53 (somar update com instala\u00e7\u00e3o inflava tudo) e do #54 (crash-free agregado misturava TestFlight com produ\u00e7\u00e3o): o n\u00famero existia e estava certo \u2014 s\u00f3 n\u00e3o media a coisa que a decis\u00e3o precisava.\n\n## 80b. Or\u00e1culo que n\u00e3o consegue LER n\u00e3o pode responder LIBERADO (05/09/2026 Foguetinho)\nCom seis agentes usando a mesma `[chave]` numa madrugada, o `GET /v1/appInfos/{id}/ageRatingDeclaration` passou a devolver **401 NOT_AUTHORIZED espor\u00e1dico** \u2014 n\u00e3o por credencial inv\u00e1lida (o token \u00e9 assinado a cada request), mas por concorr\u00eancia na chave. O `age_rating.py` tratava a resposta de erro como \"n\u00e3o veio declara\u00e7\u00e3o\", ca\u00eda no ramo `nenhum ageRatingDeclaration encontrado`, emitia **WARN** e o preflight fechava **LIBERADO** \u2014 no Foguetinho, que \u00e9 exatamente o app com `Google-Mobile-Ads-SDK` no Podfile e `advertising: false` na declara\u00e7\u00e3o. O check escrito para pegar essa incoer\u00eancia (#77) ficava verde por cegueira.\n**Fix em duas camadas:** (a) `api_client.request` ganhou retry com backoff em 401/429/5xx e `URLError`, com token novo a cada tentativa \u2014 isso sozinho faz o 401 sumir na pr\u00e1tica; (b) `age_rating.py` passou a distinguir **\"n\u00e3o consegui ler\"** de **\"n\u00e3o existe\"**: se a listagem de `appInfos` responde (logo a chave \u00e9 v\u00e1lida e a rede est\u00e1 de p\u00e9) mas a leitura da declara\u00e7\u00e3o falha, \u00e9 erro de leitura e vira **FAIL**, n\u00e3o WARN. Aus\u00eancia de verdade (app sem `appInfo`) continua WARN \u2014 sen\u00e3o todo app sem declara\u00e7\u00e3o vira alarme e o check \u00e9 ignorado em duas semanas (#63).\n**O que faz o conserto valer:** tr\u00eas casos novos em `test_preflight.py`, incluindo o negativo obrigat\u00f3rio, e o **meta-teste por muta\u00e7\u00e3o** \u2014 trocando o FAIL de volta por WARN, os dois casos positivos reprovam. Asser\u00e7\u00e3o que sobrevive \u00e0 pr\u00f3pria muta\u00e7\u00e3o \u00e9 inerte e n\u00e3o protege nada (#63).\n**A regra:** todo check que depende de I/O externo precisa de um terceiro estado. N\u00e3o \u00e9 \"passou / reprovou\", \u00e9 \"passou / reprovou / **n\u00e3o consegui verificar**\" \u2014 e o terceiro NUNCA pode ser renderizado como o primeiro. Aus\u00eancia de evid\u00eancia sendo tratada como evid\u00eancia de aus\u00eancia \u00e9 o mesmo erro do #55 (declarar n\u00e3o \u00e9 logar) visto do outro lado do tubo.\n\n## 80c. Resposta de avalia\u00e7\u00e3o n\u00e3o se EDITA: `customerReviewResponses` recusa UPDATE, quem substitui \u00e9 o POST (05/09/2026 Neon)\n`PATCH /v1/customerReviewResponses/{id}` devolve **403 FORBIDDEN \u2014 \"does not allow UPDATE. Allowed: CREATE, DELETE, GET_INSTANCE\"**. Para trocar o texto de uma resposta j\u00e1 publicada, o caminho \u00e9 `POST /v1/customerReviewResponses` na MESMA review: retorna 201 com id novo, state `PENDING_PUBLISH`, e substitui a anterior. O POST re-notifica o autor \u2014 que \u00e9 justamente o efeito desejado.\n**Por que isso \u00e9 alavanca de rating e n\u00e3o cortesia:** \u00e9 a \u00fanica a\u00e7\u00e3o que age sobre avalia\u00e7\u00e3o que J\u00c1 existe. Cinco apps do lab est\u00e3o abaixo do piso de 25 ratings, e esperar avalia\u00e7\u00e3o nova \u00e9 lento; um 3\u2605 que vira 5\u2605 num app com 14 avalia\u00e7\u00f5es move a m\u00e9dia de verdade.\n**O crit\u00e9rio que impede o abuso** (usado na varredura de 05/09): s\u00f3 substituir resposta publicada quando a promessa feita NELA j\u00e1 foi cumprida por uma vers\u00e3o que est\u00e1 **no ar** \u2014 nunca pra reescrever tom, nunca pra prometer de novo. Das 10 candidatas do recovery, s\u00f3 1 passou (Neon: a resposta de 18/07 prometeu deixar o app iPad-friendly, o fix saiu em 19/08 e a v28 est\u00e1 live desde 04/09).\n**O achado colateral vale mais que o PATCH:** as outras 5 promessas continuam **n\u00e3o cumpridas e p\u00fablicas** \u2014 c\u00e2mera frontal do Neon (1\u2605 US, usu\u00e1rio que pagou US$1,99 esperando), fundos/pinc\u00e9is antigos do Neon (4\u2605 CL), drift de objeto no Neon (4\u2605 US), tamanho de texto no Cronos (5\u2605 DE) e foguete travando no canto no Foguetinho (5\u2605 BR). Promessa na loja \u00e9 d\u00edvida de produto com juros: fica vis\u00edvel pra todo comprador futuro.\n**E um caso que refor\u00e7a o #77:** no Cronos, ler o HEAD mostraria redesign, \u00edcone novo e AdMob removido \u2014 e a conclus\u00e3o seria \"cumprimos\". A loja est\u00e1 em **1.1.4 de ago/2024**: nada disso foi publicado. Sempre confrontar a promessa com a vers\u00e3o LIVE, nunca com o reposit\u00f3rio.\n\n## 81. Um projeto Firebase pode hospedar V\u00c1RIOS apps \u2014 e todos caem na mesma property GA4 (06/09/2026 DevLingo/Sunrise + philos)\nO projeto `devlingo-gambitstudio` tinha dois apps iOS registrados (`com.gambitstudio.devlingo` e `com.gambitstudio.soninho`), e o GA4 junta os dois na property **549968658**. As ferramentas do lab liam **por property**, ent\u00e3o somavam apps diferentes e creditavam tudo ao primeiro bundle que resolvesse: o DevLingo aparecia no painel com **163% de cobertura** (35 usu\u00e1rios novos do GA4 contra 23 instala\u00e7\u00f5es da loja) \u2014 n\u00famero imposs\u00edvel, tomando decis\u00e3o sobre um app que n\u00e3o existe.\n**A separa\u00e7\u00e3o existe e \u00e9 barata:** cada app Firebase vira um **data stream** da property, e a dimens\u00e3o **`streamId`** filtra em `runReport`, `runRealtimeReport`, `runFunnelReport` e em relat\u00f3rio de **cohort** (todos testados). `ga4_pull.py` ganhou `--stream` (id \u00fanico \u2192 `stringFilter EXACT`; v\u00e1rios ids do MESMO app \u2192 `inListFilter`), propagado por events/daily/engagement/retention/funnel/breakdown/screens/param/realtime. Resultado medido: property 549968658 = 39 novos, DevLingo = 25, Sunrise = 14; **cobertura do DevLingo 163% \u2192 92,4%**.\n**Filtrar n\u00e3o \u00e9 destrutivo** \u2014 em 4 properties de stream \u00fanico (blw, walk, iphotos, college) e no meus_gastos (5 streams, s\u00f3 o iOS vivo) o resultado filtrado \u00e9 **id\u00eantico** ao n\u00e3o filtrado. Ainda assim o filtro s\u00f3 entra quando a property \u00e9 COMPARTILHADA, pra property exclusiva seguir lendo exatamente como lia.\n**O mapa app \u2192 (property, stream) n\u00e3o \u00e9 tabela \u00e0 m\u00e3o** \u2014 sai da Admin API a cada rodada (o `dataStream` carrega o bundle id) e \u00e9 materializado em `firebase.json > stream_map`. Tabela mantida \u00e0 m\u00e3o apodrece; mapa derivado n\u00e3o.\n**A unidade de an\u00e1lise deixou de ser a property e passou a ser o APP.** `firebase_snapshot.py` agrupa por app da ASC (bundle), calcula `shared_property` comparando os streams do app com os da property, e `stream_isolation_report()` **NEGA o snapshot** (exit 2, arquivo n\u00e3o \u00e9 gravado) se alguma unidade de property compartilhada for lida sem filtro. N\u00e3o conseguir LER os streams conta como compartilhada (#80b): aus\u00eancia de leitura n\u00e3o pode virar aus\u00eancia de vizinho.\n**A consequ\u00eancia de produto \u00e9 maior que o bug:** com leitura por stream, **hospedar N apps num projeto Firebase vira o caminho normal**. A conta Google est\u00e1 com a cota de projetos GCP em 12/12, e isso deixava app novo sem telemetria at\u00e9 o Jo\u00e3o pedir aumento de cota. Agora n\u00e3o trava mais \u2014 o philos (70 instala\u00e7\u00f5es/30d, o 3\u00ba maior do recovery, sem Firebase nenhum) foi instrumentado dentro de um projeto que j\u00e1 existia.\n**Dois or\u00e1culos que estavam cegos apareceram no caminho, os dois da fam\u00edlia \"n\u00e3o consegui ler virou n\u00e3o existe\" (#80b):**\n1. `g.properties()` devolveu `{}` num 401/429 transit\u00f3rio da service account compartilhada (seis agentes na mesma chave) e o snapshot **gravou \"0 apps medidos, 21 sem tracking\"** \u2014 ou seja, publicaria no site que o lab inteiro perdeu telemetria de uma vez. Agora `call()` re-tenta 401/429/5xx com backoff e re-minta o token, e property vazia **aborta sem gravar**.\n2. `repo_firebase_map()` rodava `find Apps -name GoogleService-Info.plist -not -path \"*/build/*\"` \u2014 **`-not -path` n\u00e3o poda, o find DESCE em `build/`, `DerivedData/`, `Pods/`, `.git/` de 20 apps** e estourava o timeout de 90s; o `except` devolvia `{}` calado. Efeito: o cruzamento GA4 \u00d7 c\u00f3digo (#55, o que separa \"n\u00e3o instrumentado\" de \"instrumentado e ningu\u00e9m fez\") estava **desligado pra TODOS os apps**, sem nenhum sinal. Com `-prune` de verdade: 90s+ \u2192 **6,4s**, 0 \u2192 **15 bundles** resolvidos. \u00c9 o mesmo bug do #64, no mesmo lugar do reposit\u00f3rio, de novo.\n3. De quebra, `_app_root()` n\u00e3o conhecia `Apps/intermediate/` \u2014 **9 dos 16 plists do workspace moram l\u00e1**, ent\u00e3o mesmo com o find consertado esses apps ficariam sem auditoria de c\u00f3digo. \u00c9 o #69 outra vez: categoria que existe em disco e nenhuma ferramenta conhece.\n**Evals:** `scripts/analytics/test_stream_isolation.py` (guarda com positivos e negativos \u2014 property de 1 stream N\u00c3O pode virar viola\u00e7\u00e3o, app dono dos dois streams N\u00c3O \u00e9 mistura, filtro pr\u00e9-existente tem que sobreviver num `andGroup`) + `test_stream_isolation_meta.py`, que apaga cada prote\u00e7\u00e3o do c\u00f3digo e exige que o eval reprove (6 muta\u00e7\u00f5es, 0 asser\u00e7\u00f5es inertes \u2014 #63).\n\n## 85. `UserDefaults.set` com ArraySlice matou 6 apps no melhor momento da sess\u00e3o \u2014 e eu n\u00e3o testei o ramo (07-08/09/2026 WTMP + kit)\nA Apple recusou o WTMP build 12 com *\"the app crashed after the initial launch\"* \u2014 **mensagem autom\u00e1tica**, n\u00e3o revisor humano: o scan roda o app logo depois do upload. O crash estava no `RatingGate` do **GambitCoreKit**, uma linha:\n```swift\ndefaults.set(dates.suffix(10), forKey: nativePromptDatesKey)   // ArraySlice, n\u00e3o Array\n```\n`suffix()` devolve `ArraySlice`, que **n\u00e3o \u00e9 property-list**. `UserDefaults.set` responde com `NSInvalidArgumentException` (\"Attempt to insert non-property list object ArraySlice(...)\") \u2014 exce\u00e7\u00e3o ObjC, que em Swift \u00e9 morte imediata, sem catch poss\u00edvel. Ela roda **logo depois** de o usu\u00e1rio responder \"sim\" no gate e o prompt nativo ser pedido: o app se mata no segundo em que o usu\u00e1rio ia dar 5 estrelas.\n\n**Como o crash foi encontrado sem o stack trace da Apple** (a rejei\u00e7\u00e3o n\u00e3o traz nenhum): o app tem Crashlytics, que manda `app_exception` pro GA4. Um `runReport` na property achou **1 crash, EUA, iPhone 15 Pro Max, iOS 26.6.1, 06/09 23:32** \u2014 8 minutos depois da submiss\u00e3o (23:24). A trilha de eventos da sess\u00e3o, minuto a minuto, deu o resto:\n```\n23:30 core_action \u2192 protection_armed \u2192 protection_disarmed\n23:31 core_action \u00d72 \u2192 protection_armed \u00d72 \u2192 rating_gate_shown \u2192 rating_gate_yes\n23:32 app_exception\n```\n**Regra de m\u00e9todo:** rejei\u00e7\u00e3o por crash sem stack n\u00e3o \u00e9 beco sem sa\u00edda \u2014 `app_exception` + a trilha de eventos por `dateHourMinute` localizam o ramo exato. Vale pra qualquer app com Crashlytics ligado ao GA4.\n\n**O alcance \u00e9 o que importa mais que o bug.** O kit \u00e9 usado por 6 apps; o `git log` do kit datou o bug em **d1e8712 (19/08)**, vivo por 19 dias. Cruzando `rating_gate_yes` \u00d7 `app_exception` em 30 dias:\n| app | Crashlytics | \"sim\" | crashes |\n|---|---|---|---|\n| Walk | tem | 3 | **3** |\n| Hair Schedule | tem | 2 | **2** |\n| PeptideCalc | tem | 1 | **1** |\n| WTMP | tem | 1 | **1** |\n| College | **N\u00c3O tem** | **36** | 0 (invis\u00edvel) |\n| DevLingo | n\u00e3o tem | 0 | \u2014 |\nCorrespond\u00eancia **1:1** em todos que enxergam. O College est\u00e1 pinado em `2fbe61d` (com o bug), a 1.7.0 \u00e9 posterior, e sem Crashlytics **36 prov\u00e1veis crashes n\u00e3o deixaram rastro** \u2014 \u00e9 o #55 outra vez (\"declarar n\u00e3o \u00e9 logar\") do lado do crash: app sem Crashlytics n\u00e3o \u00e9 app sem crash, \u00e9 app cego. O Sunrise escapou porque tem c\u00f3pia local do servi\u00e7o, j\u00e1 com `Array(...)`.\n\n**Por que passou por 5 builds:** o gate exige 3 eventos positivos + cooldown, ent\u00e3o nunca aparece num smoke test de launch. Eu validei \"o app abre\" e chamei de testado. **Feature nova com gatilho condicional n\u00e3o \u00e9 validada abrindo o app \u2014 \u00e9 validada FOR\u00c7ANDO cada ramo.** Semear o contador no plist do container (`gck.gate.positiveCount`) e dirigir por Maestro leva 2 minutos e teria pego isso no dia 19/08.\n\n**Os dois checks que ficaram** (learning sem check \u00e9 lembrete \u2014 #62):\n1. `preflight.py --only code` ganhou `rules.plist_storage`: acusa `UserDefaults.set` com `.suffix/.prefix/.dropFirst/.dropLast/.reversed/.keys/.values/Set(` sem `Array(...)`/`String(...)` na raiz. Casos negativos obrigat\u00f3rios no `test_preflight.py`: o pr\u00f3prio fix, `map`/`filter` (que devolvem Array), slice fora do `set`, e a linha comentada (#79b).\n2. O kit ganhou **test target** (`GambitCoreKitTests`) com o or\u00e1culo do round-trip. Validado por muta\u00e7\u00e3o (#63): restaurando a linha original, os 2 testes reprovam com a exce\u00e7\u00e3o real.\n**FECHADO em 17/09/2026:** o `rules.plist_storage` agora varre tamb\u00e9m os kits DO LAB (checkout resolvido do app, com fallback pro repo local), acusa helper que recebe `Any` e repassa pro `UserDefaults`, e responde **\"n\u00e3o verificado\"** quando n\u00e3o acha nem checkout nem repo \u2014 tr\u00eas casos novos em `test_preflight.py`, incluindo o negativo (a mesma linha dentro do checkout do Firebase N\u00c3O acusa, sen\u00e3o o check vira ru\u00eddo). O primeiro patch passou verde sem ler nada, porque `app_sources()` pula `SourcePackages` de prop\u00f3sito e eu a reaproveitei: **foi o caso de teste que pegou**, n\u00e3o a revis\u00e3o. **Buraco que o check ainda tem, e \u00e9 o que deixou o bug passar:** o preflight varre o SOURCE DO APP, e o bug vivia numa DEPEND\u00caNCIA. Rodei o check \u00e0 m\u00e3o nos 4 kits (limpos). O fecho de verdade \u00e9 comparar o commit pinado no `Package.resolved` do app com o HEAD do kit \u2014 o College prova a necessidade: kit local corrigido e app pinado no bug continuam sendo duas coisas diferentes.\n\n\n## 86. \"Crash-free 100%\" em app sem Crashlytics \u00e9 CEGUEIRA, e o painel do lab pintava isso de verde (08/09/2026)\nVarredura de crash de todos os apps depois do #85. O que o GA4 mostrava e o que era verdade:\n- **Meus Gastos, crash-free 88,8%** (34 crashes, 10 usu\u00e1rios) \u2014 parecia o pior app do conjunto. Quebrando por device: **31 crashes em `x86_64` = SIMULADOR** (dev, 18-24/08) e 3 num iPhone real em 25/08, tr\u00eas dias ANTES de a 45.3.1 ser publicada. Desde que a vers\u00e3o est\u00e1 na loja: **10 usu\u00e1rios iniciaram compra, 0 crash**. N\u00e3o havia incidente nenhum. \u00c9 o #54 de novo, agora com o device como eixo: `deviceModel` em `x86_64`/`arm64` \u00e9 simulador e **nunca** entra em conta de produ\u00e7\u00e3o. O macOS do mesmo app tinha 26 crashes \u2014 24 deles do MacBook do pr\u00f3prio Jo\u00e3o desenvolvendo a 45.4.0 no dia anterior.\n- **iPhotos (460 ativos), College (376) e blw (294): \"100% crash-free\"** \u2014 e nenhum dos tr\u00eas linka Crashlytics. N\u00e3o \u00e9 sa\u00fade, \u00e9 aus\u00eancia de sensor: **1.159 usu\u00e1rios ativos rodando apps que n\u00e3o conseguem reportar um crash sequer**. O College \u00e9 o caso agudo: 36 pessoas responderam \"sim\" no rating gate com o kit bugado do #85, e nenhum desses crashes existe em lugar nenhum.\n- Os 6 crashes REAIS do conjunto eram todos o #85, todos em device real e na vers\u00e3o publicada: Walk 3 (\u00cdndia, Tail\u00e2ndia, Canad\u00e1), Hair Schedule 2 (Col\u00f4mbia, Brasil), PeptideCalc 1 (\u00c1ustria) \u2014 em 5 dias, acelerando conforme as vers\u00f5es com o kit sa\u00edam.\n\n**Fix:** `firebase_snapshot.py` ganhou `has_crashlytics(app_root)`; app sem o SDK tem `crash_free`/`crash_users` zerados para `None` e marcados com `crash_instrumented: false`, ent\u00e3o o painel mostra \"sem dados\" em vez de um verde que ningu\u00e9m pode confiar. Pasta que n\u00e3o d\u00e1 pra ler devolve `None` \u2014 \"n\u00e3o sei\" nunca vira \"est\u00e1 tudo bem\" (#80b).\n\n**As duas regras:** (1) toda leitura de crash come\u00e7a separando simulador de device e build de dev de vers\u00e3o live \u2014 sem isso o n\u00famero mede o desenvolvedor, n\u00e3o o usu\u00e1rio; (2) m\u00e9trica de sa\u00fade s\u00f3 vale acompanhada da prova de que o sensor existe. Um app sem Crashlytics n\u00e3o tem 100% de crash-free: ele n\u00e3o tem informa\u00e7\u00e3o, e a diferen\u00e7a entre as duas coisas \u00e9 a decis\u00e3o inteira.\n\n\n## 87. O n\u00famero que n\u00e3o fecha \u00c9 o achado: 36 \"sim\" em 30 dias num gate com intervalo de 60 dias (08/09/2026 College)\nNo #85 eu montei a tabela de `rating_gate_yes` \u00d7 `app_exception` e escrevi que o College tinha **36 \"sim\" em 30 dias**, contra 1-3 dos outros apps. Usei o n\u00famero pra dizer que o College era o pior caso de crash invis\u00edvel \u2014 e n\u00e3o perguntei por que ele era **doze vezes** maior que o de apps com tr\u00e1fego parecido. O `RatingGateConfig` tem `cooldownDays = 60`: com 376 usu\u00e1rios ativos, 36 exibi\u00e7\u00f5es em 30 dias \u00e9 aritmeticamente imposs\u00edvel se o cooldown estivesse valendo. **O n\u00famero j\u00e1 denunciava o segundo bug, e eu tratei ele como medida de gravidade do primeiro.**\n\n**A causa:** os dois pontos de chamada usavam `RatingGateService.shared.present(trigger:)`, que **pula `isEligible` inteiro** \u2014 sem m\u00ednimo de eventos positivos, sem intervalo entre exibi\u00e7\u00f5es, sem teto anual de prompt nativo. `present` s\u00f3 existe pra fluxo que o usu\u00e1rio pediu explicitamente (linha \"Avaliar o app\" em Settings). O caminho normal \u00e9 `recordPositiveEvent(trigger:)`.\n- `SubjectTableController`: `if launchCount >= 5 && launchCount <= 10 { requestAppReview() }` \u2192 o modal em **seis aberturas seguidas**.\n- `CalendarViewController`: contador pr\u00f3prio (`appReviewLaunchCount`) que s\u00f3 cresce, `guard updatedCount >= 3` \u2192 a partir do 3\u00ba evento criado, **todo evento criado** reabria o modal.\nE at\u00e9 08/09 cada \"sim\" matava o app (#85). O usu\u00e1rio criava um evento, o app perguntava se ele estava gostando, ele dizia que sim, e o app fechava. De novo no pr\u00f3ximo evento.\n\n**A ironia que vale como regra:** o coment\u00e1rio em cima de uma das chamadas dizia *\"the service enforces the cooldowns and Apple's yearly cap\"*. Estava certo sobre o servi\u00e7o e errado sobre o m\u00e9todo \u2014 `present` \u00e9 exatamente o que n\u00e3o aplica nada disso. **Coment\u00e1rio que afirma o que o c\u00f3digo faz n\u00e3o \u00e9 evid\u00eancia; o que vale \u00e9 qual m\u00e9todo \u00e9 chamado.** O doc do kit dizia s\u00f3 \"Force-present the gate\", que l\u00ea como nuance em vez de aviso \u2014 agora diz o que pula, e por qu\u00ea.\n\n**Medi\u00e7\u00e3o do fix** (instala\u00e7\u00e3o limpa, 12 aberturas): 1 exibi\u00e7\u00e3o, e `gck.gate.lastShown` n\u00e3o se move nas aberturas seguintes. Antes, s\u00f3 a janela do `SubjectTable` valia 6.\n\n**Check:** `preflight.py --only code` ganhou `rules.rating_gate` \u2014 acusa `RatingGateService.shared.present(` no source de app. Negativos obrigat\u00f3rios no eval: `recordPositiveEvent`, o `present(vc, animated:)` do UIKit (que \u00e9 outra coisa com o mesmo nome), `self.present`, e a linha comentada (#79b).\n\n**A regra geral, que \u00e9 sobre leitura de dados e n\u00e3o sobre rating gate:** quando uma m\u00e9trica fica muito fora da faixa dos vizinhos, a primeira hip\u00f3tese \u00e9 que **o mecanismo por tr\u00e1s dela est\u00e1 quebrado**, n\u00e3o que aquele app \u00e9 especial. Foi assim no #53 (download inflado por update), no #54 (crash-free contaminado por simulador) e no #81 (cobertura de 163%). Aqui o n\u00famero estava num relat\u00f3rio meu, com destaque, e passou \u2014 porque servia \u00e0 hist\u00f3ria que eu j\u00e1 estava contando.\n\n\n## 82. Preflight s\u00f3 conhecia bundle de iOS \u2014 e o hook NEGOU o export de um archive de Mac correto (06/09/2026 Cronos Mac)\nPrimeiro archive de macOS do lab passando pelo `archive-preflight.sh`: o export foi **bloqueado** por dois FAILs, e os dois eram do verificador, n\u00e3o do build.\n1. **`Info.plist ileg\u00edvel`** \u2014 em iOS o plist \u00e9 `<App>.app/Info.plist`; em macOS \u00e9 `<App>.app/Contents/Info.plist`. O check lia o caminho de iOS, n\u00e3o achava nada e reprovava. Fix: `Context.is_macos_bundle` (existe `Contents/Info.plist`?) + `bundle_root` e `resources_root`, porque `Assets.car` e o `GoogleService-Info.plist` tamb\u00e9m mudam de lugar (`Contents/Resources/`).\n2. **`UILaunchStoryboardName ausente`** \u2014 chave **exclusiva de iOS**. App de Mac n\u00e3o tem launch storyboard, e exigir uma reprova todo archive de macOS que existir. Vira SKIP quando o bundle \u00e9 macOS; iOS sem a chave **continua FAIL** (\u00e9 o caso negativo do teste, e sem ele o fix viraria um buraco).\n**A li\u00e7\u00e3o n\u00e3o \u00e9 \"faltou suporte a macOS\"** \u2014 \u00e9 a mesma do #80b com outra roupa: um or\u00e1culo que n\u00e3o entende o que est\u00e1 olhando **n\u00e3o pode ser o que bloqueia o release**. Aqui foi pior que o #80b, porque l\u00e1 o check dizia LIBERADO por cegueira e aqui ele disse BLOQUEADO por cegueira; os dois erros v\u00eam de tratar \"n\u00e3o sei ler isso\" como se fosse um veredito.\n**Receita de archive macOS pra Mac App Store** (o resto funcionou de primeira): `-destination 'generic/platform=macOS'`, cloud signing com a ASC key igual ao iOS, `CODE_SIGN_IDENTITY=\"Apple Development\"` na linha de comando (o `-exportArchive` com method `app-store` re-assina com distribution sozinho \u2014 #70), export gera um **`.pkg`** (n\u00e3o `.ipa`) e o upload \u00e9 `altool --upload-app -t macos`. No plist COMPILADO conferir, al\u00e9m do checklist do #52: **`LSApplicationCategoryType`** (sem ele a valida\u00e7\u00e3o da Mac App Store recusa) e `ITSAppUsesNonExemptEncryption`.\n**\u00cdcone de macOS n\u00e3o \u00e9 o de iOS redimensionado**: iOS \u00e9 full-bleed, macOS \u00e9 um squircle de 824px dentro de um canvas de 1024 com margem transparente e sombra. Reaproveitar o PNG do iPhone direto deixa o \u00edcone maior que os vizinhos no Dock e com a quina errada. O `Contents.json` pede 16/32/128/256/512 em 1x e 2x.\n**E um achado de produto no caminho:** o Cronos Mac mostrava um selo de diagn\u00f3stico no toolbar do build **Release** \u2014 \"iCloud \u00b7 wrong bucket\", \"iCloud \u00b7 signed out\" ou a contagem crua de objetos. Jarg\u00e3o de desenvolvedor no \u00fanico chrome que o usu\u00e1rio sempre v\u00ea, e que ia aparecer no print da loja. Virou \"Sincronizado\"/\"iCloud desligado\", com o detalhe t\u00e9cnico no tooltip e no DEBUG. Regra: **antes de tirar print de loja, olhar o app com olhos de usu\u00e1rio** \u2014 o que \u00e9 instrumenta\u00e7\u00e3o e o que \u00e9 produto se confundem depressa quando quem construiu \u00e9 quem fotografa.\n\n## 83. App Group: d\u00e1 pra criar o identifier e o PERFIL por API \u2014 e o perfil volta com o grupo VAZIO (07/09/2026 Cronos widget)\nO #1 j\u00e1 dizia \"atribuir App Group ao Bundle ID = web UI\". Faltava a prova de qual parte exatamente a API faz, e ela importa porque a extens\u00e3o de widget tem **bundle id pr\u00f3prio** (`com.joao.HighPerformance.CronosWidget`) \u2014 criar o widget n\u00e3o \u00e9 1 passo de portal, s\u00e3o 2 identifiers.\nO que a API FAZ: `POST /v1/bundleIds` (registra o identifier da extens\u00e3o), `POST /v1/bundleIdCapabilities` com `APP_GROUPS` (201, liga a capacidade) e **`POST /v1/profiles`** com bundleId + certificates + devices \u2014 o perfil sai `ACTIVE` normalmente.\nO que ela N\u00c3O faz, com evid\u00eancia: decodificando o `profileContent` do perfil rec\u00e9m-criado, os entitlements v\u00eam\n```\ncom.apple.security.application-groups = []      \u2190 VAZIO\napplication-identifier = [team].com.joao.HighPerformance.CronosWidget\n```\nOu seja: a capacidade ligada sem grupo escolhido gera um perfil que concede **array vazio**, e o app cujo `.entitlements` pede `group.com.joao.HighPerformance` falha no install por mismatch. Sondagem final: `GET /v1/bundleIdCapabilities/<id>` mostra `relationships` s\u00f3 com `bundleId`; `/appGroups` d\u00e1 404 e `?include=appGroups` d\u00e1 403. N\u00e3o existe rota.\n**Regra pro fluxo de widget:** o portal \u00e9 2 cliques, n\u00e3o 1 \u2014 criar o grupo E marc\u00e1-lo no identifier do APP **e** no identifier da EXTENS\u00c3O. Registrar a extens\u00e3o e ligar a capacidade por API antecipa metade do trabalho (o identifier j\u00e1 aparece na lista do Jo\u00e3o), mas o \"Configure \u2192 marcar o grupo\" fica com ele nos dois.\n**E limpar o perfil depois de sondar:** um perfil `ACTIVE` com grupos vazios fica no pool e o `-allowProvisioningUpdates` pode escolh\u00ea-lo, produzindo uma falha confusa depois que o grupo for atribu\u00eddo. `DELETE /v1/profiles/{id}` (204) ao terminar o teste.\n\n## 83b. Adendo \u2014 quando o portal vira bloqueio recorrente, TROQUE o canal (07/09/2026 Cronos widget)\nO #83 mediu o buraco; este \u00e9 o que fazer com ele. O widget do Cronos ficou dois dias sem chegar no iPhone do Jo\u00e3o porque cada build precisava de um clique dele no portal que n\u00e3o vinha \u2014 e eu entreguei DUAS instala\u00e7\u00f5es sem a extens\u00e3o, cada uma acompanhada de \"falta um clique seu\". Do lado dele o app simplesmente n\u00e3o tinha widget.\n**A sa\u00edda n\u00e3o era insistir no pedido, era remover a depend\u00eancia.** O snapshot app\u2192widget virou um item de **keychain com access group sob o prefixo do time** (`TEAM.com.joao.HighPerformance`). O provisioning profile j\u00e1 concede `keychain-access-groups = TEAM.*` **automaticamente**, sem nada configurado \u2014 ent\u00e3o app e extens\u00e3o compartilham na hora, e o portal sai do caminho pra sempre. Depois da troca o `xcodebuild` pro device passou de dois erros pra `BUILD SUCCEEDED` **sem tocar em mais nada**, com `CronosWidget.appex` embutido e o bin\u00e1rio assinado carregando o grupo certo.\n**Quando essa troca \u00e9 leg\u00edtima e quando n\u00e3o \u00e9:** o payload aqui n\u00e3o \u00e9 segredo, tem centenas de bytes e \u00e9 reescrito a cada muta\u00e7\u00e3o \u2014 keychain como CANAL, n\u00e3o como cofre. Para dado grande, bin\u00e1rio, ou que precise de `FileManager`, o App Group continua sendo o desenho certo e o clique \u00e9 inevit\u00e1vel. Usar `kSecAttrAccessibleAfterFirstUnlock`: o sistema redesenha widget com o aparelho bloqueado, e o padr\u00e3o `WhenUnlocked` faria a leitura falhar exatamente a\u00ed.\n**O pre\u00e7o tem que ser pago junto, n\u00e3o depois:** item de keychain **sobrevive ao uninstall** (#30), ent\u00e3o o `AppDelegate` limpa no primeiro launch de instala\u00e7\u00e3o nova. Sem isso, quem reinstala v\u00ea o widget com a lista anterior at\u00e9 a primeira edi\u00e7\u00e3o \u2014 um bug que s\u00f3 aparece semanas depois, no aparelho de outra pessoa.\n**A regra de m\u00e9todo:** quando a mesma depend\u00eancia manual bloqueia a entrega pela terceira vez, ela deixou de ser \"passo pendente\" e virou parte do problema a resolver. Perguntar de novo \u00e9 mais barato pra mim e mais caro pra ele.\n\n## 84. QA de app macOS: clique por coordenada N\u00c3O aciona `NSButton`, e build de QA compartilha o Keychain de produ\u00e7\u00e3o (07/09/2026 Calc+ Mac)\nPrimeira bateria de QA dirigido num app AppKit. Quatro paredes, todas de FERRAMENTA \u2014 o app estava certo nas quatro, e em duas eu quase \"consertei\" c\u00f3digo que n\u00e3o tinha defeito.\n1. **`cliclick c:x,y` em cima de um `NSButton` n\u00e3o dispara a action.** O hover acontece (a tracking area recebe o mouse, o bot\u00e3o clareia), ent\u00e3o tudo indica que o clique chegou \u2014 mas o alvo nunca \u00e9 chamado. Cliquei duas vezes no bot\u00e3o de Ajustes, nada abriu, e passei a instrumentar o `RightOptionsHeaderView` procurando bug de layout/delegate. **O que funciona \u00e9 o AXPress**: `osascript -e 'tell application \"System Events\" to tell process \"<App>\" to click (first button of window 1 whose description is \"<label>\")'` \u2014 a tela abriu de primeira. \u00c9 o #66 do iOS com outra roupa: **tap por ponto reporta sucesso sem ter testado**, e a corre\u00e7\u00e3o \u00e9 falar com a \u00e1rvore de acessibilidade. Corol\u00e1rio barato: `buttons of window 1` com `description`/`name` lista tudo com posi\u00e7\u00e3o e tamanho \u2014 serve de or\u00e1culo de layout (foi assim que provei que o ponto em que eu clicava estava DENTRO do bot\u00e3o) e for\u00e7a o app a expor `setAccessibilityLabel`, que \u00e9 o mesmo trabalho que serve pro VoiceOver.\n2. **`log` \u00e9 builtin do zsh.** `log show --predicate ...` responde `(eval):log:1: too many arguments` e some com o diagn\u00f3stico inteiro \u2014 passei tr\u00eas rodadas achando que o `NSLog` do app n\u00e3o sa\u00eda. Sempre `/usr/bin/log`.\n3. **Build de QA com bundle id pr\u00f3prio ainda divide o Keychain com o app real**, porque `KeychainService` usa um `service` fixo (`com.gambitstudio.calc`) e o que isola de verdade \u00e9 o *access group*, que vem da assinatura. Assinatura ad-hoc (`CODE_SIGN_IDENTITY=\"-\"`) muda a cada build, ent\u00e3o cada rebuild vira um di\u00e1logo modal *\"Calc+ deseja usar as informa\u00e7\u00f5es confidenciais\u2026\"* \u2014 que **trava o app antes de abrir a janela** e faz parecer que o app n\u00e3o lan\u00e7a. Pior: a sa\u00edda \u00f3bvia (apagar o item) arrisca apagar a senha do cofre REAL do Jo\u00e3o (#74). O que resolveu sem tocar em nada dele: `service` continua o hist\u00f3rico em produ\u00e7\u00e3o \u2014 **troc\u00e1-lo deixaria todo usu\u00e1rio existente trancado fora** \u2014 e um build DEBUG aponta pra outro com `-QAKeychainService <nome>` no launch. Padr\u00e3o igual ao `-CronosCloudStubPath` do #75. Provado com `security find-generic-password -s <nome-de-qa>`.\n4. **`preflight.py` exige Python 3.10+**: rodado com `/usr/bin/python3` (3.9) morre em `Path | None` no import de `checks/common.py`, antes de qualquer check. Usar `/usr/local/bin/python3`.\n**E o achado de produto que o QA visual entregou** (o motivo de insistir na tela em vez de parar no \"compila\"): a primeira visita ao cofre mostrava um ret\u00e2ngulo cinza vazio, com a seta \"voltar\" ativa na RAIZ \u2014 um clique levava o usu\u00e1rio pra fora do cofre, dentro do Application Support. Causa \u00fanica: `fetchSavedFiles` falhava porque a pasta `.Vault` s\u00f3 \u00e9 criada no primeiro import, e o `case .failure` fazia `return` sem tocar na UI \u2014 ent\u00e3o o bot\u00e3o ficava no estado em que nasceu (vis\u00edvel) e o empty state no dele (escondido). Nenhum teste unit\u00e1rio pegaria isso, e o app \"funcionava\" em toda m\u00e1quina que j\u00e1 tinha guardado um arquivo. Regra: **`case .failure` que faz `return` seco numa tela \u00e9 sempre suspeito** \u2014 pastas somem, permiss\u00f5es mudam, e o usu\u00e1rio fica olhando um estado inicial que ningu\u00e9m desenhou.\n\n## 85b. Preflight l\u00ea a vers\u00e3o edit\u00e1vel do app SEM olhar a plataforma \u2014 num app universal ele julga a vers\u00e3o errada (08/09/2026 Calc+ Mac)\nAo submeter a 1.5.0 de **macOS** do Calc+, o `preflight.py --app-id` respondeu **BLOQUEADO com 2 FAIL** \u2014 e os dois eram da vers\u00e3o **iOS** 1.5.0, que est\u00e1 `DEVELOPER_REJECTED` desde out/2025 no mesmo app record (universal purchase, um `app` da ASC com vers\u00f5es das duas plataformas): l\u00e9xico 2.5.14 em `id`/`zh-Hans` (locales que s\u00f3 existem no iOS) e print duplicado em `APP_IPHONE_67` (display type que a vers\u00e3o de Mac nem tem). A vers\u00e3o de Mac, conferida \u00e0 m\u00e3o, estava limpa: 5 prints por locale, checksums batendo, ordem 01..05, whatsNew nos 6 locales.\n**Regra:** `GET /v1/apps/{id}/appStoreVersions` devolve as duas plataformas; todo check que procura \"a vers\u00e3o edit\u00e1vel\" tem que filtrar `attributes.platform` pela plataforma do bundle que est\u00e1 sendo verificado (o `Context` j\u00e1 sabe se \u00e9 macOS pelo `Contents/Info.plist`, #82). Sem isso, num app universal o or\u00e1culo bloqueia release bom e \u2014 pior \u2014 pode aprovar release ruim, porque olhou o registro errado. \u00c9 a fam\u00edlia do #80b/#82: um verificador que n\u00e3o sabe o que est\u00e1 olhando n\u00e3o pode ser quem decide.\n**E um falso positivo de conte\u00fado que vale calibrar:** o mesmo run acusou `secret` na description e nas keywords. O app **se chama** \"Secret Gallery Vault Photo\", est\u00e1 publicado com esse nome e essa metadata desde 2024 e nunca levou 2.5.14. A guideline \u00e9 sobre CAPTURA oculta (o caso do WTMP, #40), n\u00e3o sobre a palavra em si num cofre. Trocar metadata viva por causa do check seria mexer em ASO aprovado para consertar o que n\u00e3o est\u00e1 quebrado \u2014 a decis\u00e3o \u00e9 do lado humano da regra, e o l\u00e9xico precisa de uma exce\u00e7\u00e3o por app (o nome registrado) para n\u00e3o gritar em todo release do Calc+.\n**Receita macOS que funcionou de ponta a ponta** (complementa o #82): archive com `-destination 'generic/platform=macOS'` + `-allowProvisioningUpdates` + a chave da ASC, **sem** `CODE_SIGN_IDENTITY` na linha de comando \u2014 pass\u00e1-lo vaza para os targets dos pacotes SPM e o archive morre em *\"Signing for SnapKit_SnapKit requires a development team\"*. O export (`method: app-store`, hoje avisando que virou `app-store-connect`) gera um **.pkg**, o upload \u00e9 `altool --upload-app -t macos` com a chave em `~/private_keys/[chave]<KEYID>[chave]`, e o build aparece na ASC como `VALID` em poucos minutos \u2014 o Delivery UUID do altool \u00e9 o pr\u00f3prio id do build.\n\n## 87b. Print de loja: crop e posi\u00e7\u00e3o do breakout como n\u00fameros independentes viram duplicata \u2014 e captura de locale tem que sair do build NAQUELE idioma (08/09/2026 Cronos)\nO Jo\u00e3o olhou os prints publicados e disse \"mal recortado, sem gra\u00e7a, podre\". Estava certo, e um dos defeitos n\u00e3o era gosto.\n**iOS \u2014 o breakout duplicava.** No `make_config.py` cada slot trazia `cropY` (o que ampliar) e `breakoutCenterY` (onde colar) como campos SEPARADOS. No print 1 o crop era a linha de CIMA da matriz (`0.188`) e a posi\u00e7\u00e3o era `0.66` \u2014 metade de baixo. O resultado ampliava \"Fazer/Agendar\" e colava por cima de \"Delegar/Depois\": o print mostrava dois quadrantes duas vezes e escondia os outros dois, que s\u00e3o a ideia inteira de uma matriz de Eisenhower. O coment\u00e1rio no c\u00f3digo dizia que a inten\u00e7\u00e3o era \"cobrir espa\u00e7o morto\"; o efeito era cobrir conte\u00fado. **Fix: a posi\u00e7\u00e3o deixa de ser um n\u00famero e passa a ser derivada \u2014 `breakoutCenterY = cropY + cropH/2`.** O breakout vira lupa sobre a pr\u00f3pria se\u00e7\u00e3o: amplia sem duplicar e sem esconder outra coisa. Dois n\u00fameros que precisam concordar e podem divergir sempre divergem; um derivado do outro n\u00e3o tem como.\n**As alturas de crop t\u00eam que ser MEDIDAS, n\u00e3o estimadas.** As quatro fatiavam uma linha ao meio. O que resolveu foi um utilit\u00e1rio de 15 linhas (`crop.swift`) que recorta e grava o recorte pra eu OLHAR antes de gastar um render \u2014 4 itera\u00e7\u00f5es de 20 segundos em vez de adivinhar. \u00c9 a mesma li\u00e7\u00e3o do `widget-preview` (#83b): quando existe um jeito barato de ver, projetar \u00e0s cegas \u00e9 escolha, n\u00e3o limita\u00e7\u00e3o.\n**Composi\u00e7\u00e3o, tr\u00eas medidas que valem pra qualquer print da casa:** (a) fundo com contraste REAL contra o app \u2014 o navy `#06284F` era quase a cor do pr\u00f3prio Cronos e o aparelho preto sumia; (b) aparelho maior (0.755 \u2192 0.80 da largura) quando o rodap\u00e9 da tela do app \u00e9 vazio, pra sangrar o espa\u00e7o morto pra fora do canvas em vez de fotograf\u00e1-lo; (c) o breakout transborda o APARELHO, nunca a borda do print \u2014 passando da margem do canvas ele perde os cantos arredondados e o glow lateral, que s\u00e3o exatamente o que cria o pop-out. Limitar em `min(deviceW * scale, W * 0.93)`.\n**macOS \u2014 o print do en-US estava em PORTUGU\u00caS.** A p\u00e1gina americana do Cronos Mac mostra \"Nova tarefa\", \"Fazer\", \"Enviar a proposta ao cliente\". A captura foi tirada do app rodando na l\u00edngua da m\u00e1quina e reusada como se fosse neutra. **Regra: captura de um locale sai do app LAN\u00c7ADO naquele locale** (`simctl launch -AppleLanguages \"(<loc>)\"`), e isso vale para o widget tamb\u00e9m \u2014 o `widget-preview` passou a carregar os `.lproj` COMPILADOS do app pro lado do bin\u00e1rio, ent\u00e3o o chrome do widget no print fala o idioma do print. Um print em outro idioma n\u00e3o \u00e9 detalhe est\u00e9tico: \u00e9 a p\u00e1gina inteira dizendo ao comprador que o app n\u00e3o \u00e9 para ele.\n**E o custo de descobrir tarde:** print de vers\u00e3o `READY_FOR_SALE` \u00e9 imut\u00e1vel (#73). O do Mac s\u00f3 se conserta com uma vers\u00e3o nova do app de Mac \u2014 o defeito de 2 dias virou um release. Olhar o print com olhos de usu\u00e1rio ANTES de submeter \u00e9 mais barato que qualquer outra ordem de fazer isso (#82).\n\n## 88. Pr\u00e9-prompt de avalia\u00e7\u00e3o foi erro grave \u2014 s\u00f3 o prompt nativo, direto num aha-moment escolhido (11/09/2026, lab inteiro)\nO Jo\u00e3o, textual: *\"joga fora essa ideia do bottom sheet antes do review, esse neg\u00f3cio foi um erro grave, esquece ele, s\u00f3 mostra direto o request review em momento aha moment, tem que pensar bem onde \u00e9 ele, arranca dos apps onde tem isso\"*. O RatingGate (GambitCoreKit + `rating_gate.dart`) era um sheet \"Curtindo o app?\": sim abria o prompt nativo, n\u00e3o abria um feedback interno. Era regra do RULES e estava em 13 apps.\n\n**Os dados j\u00e1 condenavam o gate, e ningu\u00e9m leu assim.** No College, 109 pessoas viram a pergunta: 50 responderam \"Nem tanto\", 45 fecharam e **s\u00f3 14 chegaram ao prompt nativo**. Num app com nota 4,73, o gate entregava ao StoreKit 13% de quem estava eleg\u00edvel; o pedido direto entrega 100% (o iOS decide se desenha). Somam-se a guideline 5.6.1 (\"we will disallow custom review prompts\"; filtrar quem avalia \u00e9 review gating) e o hist\u00f3rico: os dois bugs mais caros do pipeline moravam nele, o crash no \"sim\" (#85) e o pedido em toda abertura via `present()` (#87).\n\n**O que ficou:** `ReviewService` do kit (0e95ebd) e `templates/flutter/review_prompt.dart`. O throttle mora no servi\u00e7o (\u2265 3 aha-moments, 90 dias entre pedidos, \u2264 3 por ano, 1 por vers\u00e3o, s\u00f3 em foreground, ~1 s depois do sucesso). Evento `review_prompt_requested`. O hist\u00f3rico do gate migra uma vez, sen\u00e3o quem viu o sheet m\u00eas passado recebe o prompt no primeiro launch do build novo. Pr\u00e9-gate no source reprova o preflight (`rules.review_pregate`). Os testes do kit pegam as 4 muta\u00e7\u00f5es (ArraySlice, cooldown, 1 por vers\u00e3o, migra\u00e7\u00e3o).\n\n**O que a varredura achou \u2014 vale pra qualquer auditoria de pedido de review:**\n1. **Pr\u00e9-prompt se esconde com outro nome.** Grep por \"RatingGate\" n\u00e3o pega. O Meus Gastos tinha um segundo di\u00e1logo \"Avaliar o app?\" no 4\u00ba build do Dashboard (`constructReview.dart`). O iPhotos tinha um alerta morto, em chin\u00eas, pedindo nota pra OUTRO app. Procure pelo comportamento: qualquer alert/sheet cujo bot\u00e3o leva a `requestReview` ou \u00e0 URL da loja.\n2. **`core_action` n\u00e3o \u00e9 automaticamente aha.** O Meus Gastos disparava em recorrente inserido no `build` da aba e no insert pendente do widget na abertura. O Sunrise pedia ao ARMAR o alarme, que \u00e9 setup, logo depois do prompt de notifica\u00e7\u00e3o e com o sheet do editor aberto. O BLW perguntava at\u00e9 com rea\u00e7\u00e3o al\u00e9rgica registrada. O Philos contava favoritos, que v\u00eam em rajada (3 em 2 min na 1\u00aa sess\u00e3o). O `disarm()` do WTMP contava cancelar a contagem regressiva e at\u00e9 DESLIGAR A SIRENE. A regra do College (`currentMiss < maxMiss`) disparava com 1 falta sobrando, justamente o momento mais ansioso do semestre. O aha precisa de filtro de contexto no call site: no Meus Gastos, \u2265 3 dias com lan\u00e7amento e dentro do or\u00e7amento; no BLW, s\u00f3 rea\u00e7\u00e3o positiva; no Sunrise, noite medida com fases e nota \u2260 poor; no WTMP, sess\u00e3o protegida \u2265 120 s sem alarme e sem senha errada; no College, no m\u00e1ximo metade do limite usado, 1 momento por dia e \u2264 2 por semana, ent\u00e3o os 3 momentos ficam espalhados por pelo menos 2 semanas (o College tem reten\u00e7\u00e3o com picos a cada 7 dias). O contador do kit mede eventos, n\u00e3o retorno. Quando o evento vem em rajada, o call site precisa espa\u00e7ar por dia ou semana.\n3. **Call site que contorna o wrapper.** A aba Di\u00e1rio do Philos abria o sheet de reflex\u00e3o sem passar pelo `show`, ent\u00e3o reflex\u00e3o salva ali nunca contou.\n4. **Evento de produto pendurado no hook de uma feature.** O Bible logava `feature_used`/`permission_result` pelo `RatingGate.instance.onEvent`, que nunca foi atribu\u00eddo: esses eventos nunca foram a lugar nenhum.\n5. **\"J\u00e1 pede o prompt nativo direto\" n\u00e3o quer dizer que pede na hora certa.** Sueca e Neon n\u00e3o tinham pr\u00e9-prompt e estavam marcados como corretos desde 02/09, mas os dois pediam no meio do uso. A Sueca pedia na 10\u00aa carta, com o celular passando de m\u00e3o em m\u00e3o na roda. O Neon pedia no 5\u00ba tra\u00e7o, inclusive durante a grava\u00e7\u00e3o, e registrava o pedido mesmo quando n\u00e3o pedia. Os dois mudaram: a Sueca pede ao sair da partida, o Neon ao salvar o desenho ou exportar o v\u00eddeo. Auditar review \u00e9 auditar o MOMENTO, n\u00e3o s\u00f3 a aus\u00eancia de sheet.\n6. **Outra coisa na tela no mesmo instante.** No Hair Schedule, o toque que conclui o tratamento tamb\u00e9m contava o intersticial (1 a cada 3); agora o an\u00fancio n\u00e3o conta quando o pedido foi agendado. No Walk, a Home pode estar coberta pelo paywall de abertura ou pelo sheet do Health, ent\u00e3o s\u00f3 conta com as m\u00e9tricas vis\u00edveis e sem nada por cima, no m\u00e1ximo 1 vez por dia. No Cronos, uma tela morta (`ChecklistViewController`, nunca instanciada) ainda chamava `requestReview`: seria um segundo caminho autom\u00e1tico no dia em que algu\u00e9m a religasse.\n\n**Orquestra\u00e7\u00e3o:** subagente que espera build em background encerra o turno e pode n\u00e3o acordar. O brief precisa mandar esperar em foreground e s\u00f3 encerrar com o relat\u00f3rio.\n\n**Check:** o `rules.rating_gate` do #87, que acusava `present()`, virou `rules.review_pregate`. Ele reprova qualquer resto de pr\u00e9-gate no source (`RatingGateService`, `.ratingGate(`, `rating_gate_yes/no/feedback/dismissed/shown`) e ignora coment\u00e1rios (#79b), com positivos e negativos em `test_preflight.py`. O `verify-analytics` trata `rating_gate_*` como nome legado a remover, e os evals do `polish-reviewer` e do `analytics-instrumentor` reprovam o agente que voltar a mandar ligar o gate.\n\n## 89. \"Launched application\" n\u00e3o quer dizer que o app ficou aberto \u2014 o crash chegou no iPhone do Jo\u00e3o (11/09/2026 College)\nNuma sequ\u00eancia de ajustes visuais pedidos um atr\u00e1s do outro, com o Jo\u00e3o dizendo \"deixa testes pra depois\", instalei cada build com `devicectl install` + `process launch` e respondi \"instalado\". O `launch` imprime `Launched application` e sai; o app pode morrer 200 ms depois. Um desses builds fazia `updateEmptyState()` (chamado dentro de `setupTableView()`, ANTES de o banner entrar na tela) chamar `updateOtherAppsPromo()`, que refaz uma constraint contra o banner \u2192 `NSGenericException: Unable to activate constraint ... because they have no common ancestor` em toda abertura com mat\u00e9ria cadastrada. Quem descobriu foi o Jo\u00e3o, no aparelho dele.\nNo mesmo trecho, um `Edit` com `replace_all` que tirava uma frase do fim de um coment\u00e1rio `///` comeu a quebra de linha e grudou o coment\u00e1rio no `func` \u2014 e eu **commitei antes de compilar**, ent\u00e3o o reposit\u00f3rio ficou um commit quebrado.\n**Regras:**\n1. \"Sem testes\" (sem Maestro, sem archive) n\u00e3o \u00e9 \"sem verifica\u00e7\u00e3o\". Depois de TODO install no device: `xcrun devicectl device process launch --device <id> --console --terminate-existing <bundle>` em background por ~20 s e `grep -E \"Terminating|uncaught exception|signal|Fatal error\"`. S\u00f3 dizer \"instalado\" com o console limpo.\n2. Commit s\u00f3 depois do `BUILD SUCCEEDED` daquela \u00e1rvore \u2014 nunca \"commito e depois compilo\".\n3. Fun\u00e7\u00e3o de \"update\" que cria/refaz constraint entre views irm\u00e3s come\u00e7a com `guard viewA.superview != nil, viewB.superview != nil else { return }`: a ordem de setup muda com o tempo e quem chama a fun\u00e7\u00e3o n\u00e3o sabe dessa depend\u00eancia.\n4. O console do `devicectl` j\u00e1 d\u00e1 a causa exata (a mensagem do NSException com os dois anchors) \u2014 capturar ANTES de chutar o fix.\n\n\n## 90. SPM com `from:` + `Package.resolved` fora do git = o build novo puxa SDK que ningu\u00e9m validou \u2014 Firebase 12.19 crasha em device (12/09/2026 Hair Schedule)\nQA no simulador do Hair Schedule 1.2.0: SIGSEGV em 2 de 5 aberturas, 1-3 min depois do launch, na thread `com.google.fira.worker` (`-[APMMeasurement networkRemoteConfigFetchCompletionHandler:]`), com `-[APMMeasurement fetchSBT]: unrecognized selector` logado em TODA abertura. N\u00e3o era simulador: o GoogleAppMeasurement 12.19.0 (publicado 09/09) p\u00f5e `fetchSBT` numa category separada (`APMMeasurement+SBT.o`) que nenhum s\u00edmbolo referencia, e sem `-ObjC` o linker descarta \u2014 igual em Debug/Release e device (firebase-ios-sdk #16634, relatos em iOS 26.x f\u00edsico; fix prometido na 12.19.2). `nm` no bin\u00e1rio compilado: zero `fetchSBT`.\n**Como entrou sem ningu\u00e9m mexer:** `project.yml` com `Firebase: from: \"12.18.0\"` e o `Package.resolved` ignorado pelo `.gitignore` (regra `*.xcodeproj`). Cada resolu\u00e7\u00e3o nova puxa a \u00faltima vers\u00e3o compat\u00edvel \u2014 o build de 31/08 resolveu 12.18.0, o de 12/09 resolveu 12.19.1. A 1.1.0 na loja nunca teve o problema; a 1.2.0 teria levado.\n**Regras:** (1) quando QA achar crash em SDK de terceiro, antes de chamar de \"ru\u00eddo de simulador\" (#86) confira a vers\u00e3o RESOLVIDA hoje contra a que foi na \u00faltima vers\u00e3o live \u2014 SDK que mudou entre as duas \u00e9 o suspeito n\u00ba 1; (2) Firebase/Ads num app `intermediate`/`important` fica com `exactVersion` e sobe de vers\u00e3o de prop\u00f3sito, testado; (3) mesmo quadro no PeptideCalc (resolvido em 12.19.0, sem `-ObjC`) \u2014 travar antes do pr\u00f3ximo archive.\n\n## 91. Onda de screen-builders em paralelo enche o disco: cada DerivedData pr\u00f3prio baixa o Firebase de novo (12/09/2026, 4 apps novos)\nCom ~15 agentes compilando ao mesmo tempo, cada um com `-derivedDataPath` pr\u00f3prio (pra n\u00e3o disputar lock), o disco foi de ~20 GB livres a **118 MB** em minutos: cada pasta leva ~2,3\u20132,5 GB, quase tudo `SourcePackages` (checkout do firebase-ios-sdk) + index store. Os builds passaram a morrer em `No space left on device` no link/lipo/checkout, e agentes gastaram rodadas esperando \"erro em arquivo de outro\" que era s\u00f3 disco. Somava-se 80 GB de `~/Library/Developer/Xcode/DerivedData` antiga.\n**Receita que resolveu:** (1) cada agente usa derived data pr\u00f3prio MAS aponta os pacotes pra um checkout \u00fanico j\u00e1 resolvido: `-clonedSourcePackagesDirPath <app>/build/DD/SourcePackages` + `COMPILER_INDEX_STORE_ENABLE=NO` (cai de ~2,4 GB pra algumas centenas de MB por agente); (2) o coordenador compila o esqueleto uma vez ANTES de soltar a onda, pra esse checkout existir; (3) apagar a pasta do agente assim que ele termina; (4) `find ~/Library/Developer/Xcode/DerivedData -mindepth 1 -maxdepth 1 -mtime +2 -exec rm -rf {} +` libera o grosso sem quebrar sess\u00e3o que esteja compilando agora. Conferir `df -h /` antes de soltar mais de ~5 builds simult\u00e2neos.\n**Dois efeitos colaterais da mesma onda:** `xcodegen generate` rodado por um agente no meio do build de outro faz o clang falhar com \"failed to determine current working directory\" (retry resolve; s\u00f3 regenerar quando os pr\u00f3prios arquivos ainda n\u00e3o est\u00e3o no projeto). E subagente que espera build/monitor em background encerra o turno e n\u00e3o acorda (#88): o brief precisa mandar compilar em primeiro plano e nunca esperar monitor.\n\n## 92. Traduzir o texto DENTRO das telas de uma panorama de IA, em 10 idiomas, sem gerar de novo (14/09/2026 Cronos)\nExtens\u00e3o do #58, que apagava por linha e re-renderizava: aqui foram 113 textos por tela nas 5 telas, 9 idiomas e 100 prints de iPhone. Pipeline em `Cronos/ppo-pipeline/experiments/2026-09-14_default-page_panorama/tools` (README l\u00e1 dentro). O que s\u00f3 apareceu fazendo:\n1. **Invent\u00e1rio antes de traduzir.** OCR do Vision (imagem ampliada 3x, porque a UI de uma panorama de 1903 px tem texto de 8 a 20 px) \u2192 `inventory_en.json` com caixa, cor por segmento (split no \"\u00b7\": \"Do \u00b7 09/07\" tem data vermelha), peso, alinhamento e rota\u00e7\u00e3o. **As caixas por palavra do Vision \u00e0s vezes voltam iguais \u00e0 caixa da linha**, ent\u00e3o tarefa e hora alinhada \u00e0 direita chegam coladas e n\u00e3o separam por palavra: separar pelo maior v\u00e3o de colunas sem tinta.\n2. **Apagar por difus\u00e3o, n\u00e3o por interpola\u00e7\u00e3o de linha.** A interpola\u00e7\u00e3o linha a linha deixa riscos e arrasta a cor de quem est\u00e1 do lado: a bolinha vermelha antes de \"High priority\" virou uma faixa vermelha. O que funcionou foi difus\u00e3o harm\u00f4nica sobre a m\u00e1scara de todas as caixas, com os pixels da borda que destoam da mediana do entorno trocados pela mediana s\u00f3 no guia (a imagem mant\u00e9m o \u00edcone). Margem de 2 px deixa a haste antialiasada da primeira mai\u00fascula como um risco; 3 px resolve. A borda de um elemento vizinho cai dentro da caixa ampliada e escurece (ex.: o topo dos blocos logo abaixo de \"Urgent\"): encurtar essa caixa.\n3. **Calibrar re-renderizando o INGL\u00caS primeiro** e comparar lado a lado com o original. O tamanho sai do ingl\u00eas ajustado \u00e0 largura da caixa, e o peso body do modelo de imagem \u00e9 medium, n\u00e3o regular. S\u00f3 depois disso trocar o idioma.\n4. **O espa\u00e7o do texto \u00e9 o CONTAINER, n\u00e3o o pr\u00f3ximo texto que o OCR viu.** Tarefa da coluna esquerda da matriz invadia o card da direita; t\u00edtulo do quadrante passava por cima da contagem \"3\" (n\u00famero filtrado do invent\u00e1rio); linha de card batia no chevron. Limites por coluna/card + override expl\u00edcito onde h\u00e1 elemento que o OCR n\u00e3o leu.\n5. **Encolher tem piso.** Abaixo de 80% o nome some (\"\u041e\u0442\u043f\u0440\u0430\u0432\u0438\u0442\u044c \u043f\u0440\u0435\u0434\u043b\u043e\u0436\u0435\u043d\u0438\u0435\" chegou a 41%). Forma curta por idioma nas linhas estreitas (\"\u041a\u041f \u043a\u043b\u0438\u0435\u043d\u0442\u0443\", \"Preventivo\", \"Devis\", \"La matrice\"), aplicada s\u00f3 quando a completa n\u00e3o cabe. Texto em outro idioma sai do cat\u00e1logo do app (`Localizable.xcstrings`) sempre que existir: o print fala o que o app fala.\n6. **Panorama com N aparelhos em p\u00e9 n\u00e3o cabe em 21:9 se o aparelho \u00e9 iPad.** Cinco iPads 3:4 somam 3,75:1; o ChatGPT resolveu esticando (propor\u00e7\u00e3o 1,62-1,73 em vez de 1,33) e encostando um no outro. iPad = duas imagens (3 aparelhos em 21:9, 2 em 3:2) ou code-driven.\n7. Tr\u00eas bugs de ferramenta que custaram rodadas: padding de borda (`np.pad mode=edge`) contado como cena repetiu a linha 0 pra cima e virou listras verticais no espa\u00e7o do t\u00edtulo; inteiros do numpy n\u00e3o serializam em JSON; `NSColor.white` est\u00e1 em espa\u00e7o de cinza e `redComponent` lan\u00e7a exce\u00e7\u00e3o (converter pra sRGB antes).\n\n\n## 93. Agentes em paralelo no mesmo repo compartilham o \u00cdNDICE do git \u2014 s\u00f3 o coordenador commita (17/09/2026 Hair Schedule)\nTr\u00eas agentes corrigindo \u00e1reas diferentes do mesmo app, cada um instru\u00eddo a \"commitar s\u00f3 os seus arquivos\". O `git add` de um cruzou com o `git commit` do outro duas vezes: os dois commits sa\u00edram com arquivos misturados, e cada agente, tentando consertar, deu `git reset HEAD~1` e recommitou \u2014 em cima do trabalho do outro. Nada se perdeu (os resets s\u00e3o mistos, o conte\u00fado fica na \u00e1rvore, e o reflog tem tudo), mas o hist\u00f3rico ficou com mudan\u00e7a de identifier dentro de um commit chamado \"quiz destrutivo\" e a sess\u00e3o gastou uma rodada reconstruindo o que era de quem.\n**A causa n\u00e3o \u00e9 o agente: `git add <paths>` + `git commit` n\u00e3o \u00e9 at\u00f4mico, e o \u00edndice \u00e9 um arquivo \u00fanico do reposit\u00f3rio.** Dois processos no mesmo `.git` n\u00e3o t\u00eam como commitar \"s\u00f3 o seu\" com seguran\u00e7a.\n**Regra:** em onda de agentes no MESMO repo, o brief manda **deixar a mudan\u00e7a na \u00e1rvore e reportar** (`git status --short` + `git diff --stat` no relat\u00f3rio); quem commita \u00e9 o coordenador, uma vez, depois de conferir a \u00e1rvore e buildar. Se um agente precisa de commit pr\u00f3prio (release, tag), ele roda **sozinho** na onda. Alternativa quando paralelismo com commit \u00e9 inevit\u00e1vel: worktree por agente (`git worktree add`), que d\u00e1 \u00edndice separado \u2014 mas a\u00ed o build de cada worktree baixa os pacotes de novo (#91).\n**O que salvou:** `git reflog` tinha os quatro estados, e `git diff` entre a \u00e1rvore e o HEAD saiu vazio, o que PROVA que nada foi perdido. Antes de acusar perda num repo mexido por v\u00e1rios agentes, comparar \u00e1rvore \u00d7 HEAD e ler o reflog \u2014 o p\u00e2nico custa mais que o conserto.\n\n## 94. In-App Event exige deep link pro conte\u00fado DENTRO do app \u2014 conferir o URL scheme antes de montar o evento (27/09/2026 Cronos)\nMontei o evento inteiro por API (`appEvents` + 10 `appEventLocalizations` + 20 `appEventScreenshots`, badge `MAJOR_UPDATE`), e o `POST reviewSubmissionItems` com a relationship `appEvent` voltou **409 \"You must provide a value for the attribute 'deepLink'\"**. O rascunho aceita `deepLink: null`; o envio n\u00e3o aceita. Pela doc da Apple, o link tem que abrir o conte\u00fado do evento no app (universal link ou URL scheme pr\u00f3prio), e link da App Store n\u00e3o serve. O Cronos (legado) n\u00e3o tem `CFBundleURLTypes` nem universal link, ent\u00e3o o evento depende de um build novo.\n**Regras:** (1) antes de criar um evento, `PlistBuddy -c \"Print :CFBundleURLTypes\"` no Info.plist **compilado da vers\u00e3o live**; sem esquema, o primeiro passo \u00e9 um release que adicione um; (2) o `POST /v1/reviewSubmissions` roda antes do item e, se o item falhar, deixa uma submiss\u00e3o vazia que n\u00e3o se apaga por API (#1). Validar o item primeiro, ou anotar o id da submiss\u00e3o vazia e reaproveitar. **Detalhe de API:** `appEventScreenshots` n\u00e3o tem `sourceFileChecksum`; confirmar a troca de imagem po
