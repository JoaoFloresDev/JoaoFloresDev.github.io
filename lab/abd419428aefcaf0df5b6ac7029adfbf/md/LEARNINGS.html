Walk/mockSteps)\nPra popular o simulador com dados de Health (passos/dist\u00e2ncia/calorias) via `#if DEBUG` no primeiro launch:\n1. **`CODE_SIGNING_ALLOWED=NO` REMOVE os entitlements do bin\u00e1rio de simulador** \u2192 `requestAuthorization` falha com `Code=4 \"Missing com.apple.developer.healthkit entitlement\"` e o app INTEIRO se comporta como permiss\u00e3o negada. Build de sim com HealthKit = assinar normal (sem esse flag).\n2. **Pedir auth em `didFinishLaunching` \u00e9 cedo demais** \u2014 sem janela pra apresentar, o pedido falha silencioso (e logo ap\u00f3s um `simctl erase`, healthd ainda subindo d\u00e1 `Code=100 \"Authorization session timed out\"`). Pedir em `sceneDidBecomeActive` (guard de re-entrada) e logar com `NSLog` (print n\u00e3o aparece no `log show`).\n3. **O sheet de permiss\u00e3o do Health \u00e9 processo separado \u2014 tap do idb/sim-mcp N\u00c3O chega nele** (mesma fam\u00edlia do UISwitch do LEARNING #19). Funciona: clique de mouse REAL na janela do Simulator via `cliclick` \u2014 calibrar com `screencapture -x` + crop da janela (bounds via System Events; screen_pt = win_origin + crop_px/2), clicar \"Ativar Tudo\" e depois \"Permitir\". `osascript click at` pode ser bloqueado por acessibilidade; cliclick j\u00e1 tem grant.\nB\u00f4nus: erros de escrita \u2014 `appleExerciseTime` N\u00c3O \u00e9 grav\u00e1vel (seedar steps/distance/activeEnergy/basalEnergy); \"tempo\" da UI vem de exercise time, fica menor que o real. Uma vez negado o sheet, s\u00f3 `simctl erase` reseta (uninstall n\u00e3o limpa auth de Health).\n\n## 43. Storyboard com view em fixedFrame = tela quebrada S\u00d3 no iPad (rejei\u00e7\u00e3o 2.1b/2.3.8 AirDraw, 19/08/2026)\nApp legado (storyboard) rejeitado no iPad Air 11\": a ARSCNView principal tinha `fixedFrame=\"YES\"` no storyboard (sem constraints de borda) \u2014 no iPhone parecia OK (frame do IB coincidia), mas no iPad ficava um ret\u00e2ngulo de iPhone no canto superior esquerdo com o resto da tela BRANCA. Efeito colateral pior: bot\u00e3o branco (ellipsis \"\u2022\u2022\u2022\" que leva ao paywall) sobre fundo branco = invis\u00edvel \u2192 reviewer n\u00e3o achou as IAPs (rejei\u00e7\u00e3o 2.1(b) \"cannot locate the In-App Purchases\") al\u00e9m da Guideline 4 est\u00e9tica.\n**Fix m\u00ednimo em c\u00f3digo** (sem mexer no storyboard XML): no setup da view, `translatesAutoresizingMaskIntoConstraints = true` + `frame = view.bounds` + `autoresizingMask = [.flexibleWidth, .flexibleHeight]` + `view.backgroundColor = .black`.\n**Regras:** (1) `grep 'fixedFrame=\"YES\"' *.storyboard` em todo app legado que suporte iPad (TARGETED_DEVICE_FAMILY \"1,2\") \u2014 cada hit \u00e9 uma tela potencialmente quebrada no iPad; (2) extens\u00e3o do LEARNING #37: a Apple TESTA em iPad e o caminho at\u00e9 a compra precisa estar VIS\u00cdVEL l\u00e1 \u2014 layout quebrado vira rejei\u00e7\u00e3o 2.1(b) de IAP, n\u00e3o s\u00f3 est\u00e9tica. (3) B\u00f4nus 2.3.8: device name vem de CFBundleDisplayName (fallback CFBundleName/PRODUCT_NAME) \u2014 tem que parecer com o nome da loja; conferir com PlistBuddy no .app compilado.\n\n## 44. 1\u00ba grupo de assinaturas cai do pacote ao cancelar/re-submeter a vers\u00e3o via API \u2014 e a vers\u00e3o aprova SEM as subs (20/08/2026 AirDraw)\nA v22 foi submetida junto com as 2 subs (web UI). Apple rejeitou a vers\u00e3o. Pra re-submeter via API (LEARNING #37: cancel da submission `UNRESOLVED_ISSUES` + nova `reviewSubmission` s\u00f3 com a `appStoreVersion`), os itens de subscription/subscriptionGroup ficaram `REMOVED` na submission antiga e a nova N\u00c3O os tinha (API n\u00e3o aceita sub como item). Resultado: a vers\u00e3o foi **aprovada sozinha** e virou `READY_FOR_SALE`; as subs voltaram a `READY_TO_SUBMIT` e agora a ASC recusa o envio: *\"Seu primeiro grupo de assinaturas deve ser enviado com uma nova vers\u00e3o do app\"* \u2014 o 1\u00ba grupo S\u00d3 entra em review junto de uma vers\u00e3o ainda N\u00c3O live. Custo: mais uma vers\u00e3o + build novo (build j\u00e1 associado \u00e0 vers\u00e3o lan\u00e7ada n\u00e3o reaproveita).\n**Regra:** se a vers\u00e3o rejeitada carregava o 1\u00ba grupo de subs, a re-submiss\u00e3o tem que ser pelo **web UI** (p\u00e1gina da vers\u00e3o \u2192 \"Compras dentro do app e assinaturas\" \u2192 + subs \u2192 Enviar), OU, se cancelou via API, **re-adicionar as subs no web UI ANTES do PATCH `submitted:true`** \u2014 nunca submeter a vers\u00e3o sozinha. Conferir nos `reviewSubmissionItems` que existem itens tipo 18 (subscription) e 19 (subscriptionGroup) al\u00e9m do 6 (appStoreVersion) antes de enviar.\n\n## 45. Liquid Glass HABILITADO no Walk (stepsSwiftUI) por pedido expl\u00edcito do Jo\u00e3o \u2014 exce\u00e7\u00e3o \u00e0 regra (21/08/2026)\nRULES.md manda `UIDesignRequiresCompatibility = YES` em todo app, mas o Jo\u00e3o pediu \"habilita o liquid glass no app e usa ele bastante\" no Walk. Flag virou `false` nos 3 targets (app, widget, `Walk/Info.plist`). Pra manter deployment target 17 com SDK 26, o app ganhou `UISettings/LiquidGlass.swift`: `.glassSurface(cornerRadius:tint:interactive:)`, `.glassCapsule(...)`, `.glassButton()` e `GlassContainer` \u2014 todos com `if #available(iOS 26, *)` \u2192 `glassEffect`/`.buttonStyle(.glass)`/`GlassEffectContainer`, sen\u00e3o o card flat antigo. Gotcha: dentro de `@ViewBuilder body` N\u00c3O d\u00e1 pra montar o `Glass` com `var g = .regular; if ... { g = g.tint() }` (erro \"type '()' cannot conform to 'View'\") \u2014 mover pra uma computed property `@available(iOS 26.0, *)`. Settings em `List`: glass por linha via `.listRowBackground(Color.clear.glassEffect(.regular, in: .rect))`. Outros apps continuam com a regra padr\u00e3o (compat YES) at\u00e9 o Jo\u00e3o pedir o contr\u00e1rio app a app.\n\n## 46. Lab Hub ([Lab Hub local]) morto com exit 2 = python do LaunchAgent sem permiss\u00e3o TCC pra ~/Documents (22/08/2026)\nSintoma: `launchctl list | grep labhub` mostra `-  2`, log `/tmp/lab-hub.log` repete `python3: can't open file '.../hub.py': [Errno 1] Operation not permitted`. Causa: o plist chamava `/usr/bin/python3` (shim) que resolve pro python do Xcode ativo \u2014 `xcode-select` passou a apontar pro `~/Downloads/Xcode 2.app`, cujo python N\u00c3O tem grant de \"Arquivos e Pastas \u2192 Documentos\"; sob launchd o TCC nega na hora (sem prompt). O python de `/Applications/Xcode.app` tamb\u00e9m falhou.\n**Fix:** plist `~/Library/LaunchAgents/com.gambitstudio.labhub.plist` agora usa `/usr/local/bin/python3` (homebrew 3.14, \u00e9 um .app bundle \u2192 TCC MOSTRA o prompt \"python3.14 deseja acesso a Documentos\"; processo fica bloqueado em `open()` at\u00e9 clicar). Clicar \"Permitir\" (cliclick em coords de pontos = screenshot_px \u00d7 1792/largura_do_png) \u2192 sobe na hora e o grant persiste. Diagn\u00f3stico r\u00e1pido: `sample <pid> 1` travado em `__open` = prompt TCC pendente, procurar o di\u00e1logo com `screencapture -x`.\n\n## 47. Liquid Glass em app UIKit legado + automa\u00e7\u00e3o de sim iOS 26 (22/08/2026 College)\nReceita UIKit (College, storyboard + CocoaPods, deployment 16): `UIGuide/LiquidGlass.swift` = `UIGlassEffect` em `UIVisualEffectView` (`cornerConfiguration = .corners(radius: .fixed(r))`, inserido no index 0 do card, `isUserInteractionEnabled = false`), `UIButton.Configuration.glass()/.prominentGlass()` (titulo via `attributedTitle`, `titleLabel.font` e `setTitle` sao ignorados \u2014 override `setTitle` nas subclasses), bars SEM `UINavigationBarAppearance`/`UITabBarAppearance` no iOS 26 (so `tintColor`; `configureWithOpaqueBackground` mata o vidro), `tabBarMinimizeBehavior = .onScrollDown`, bar item custom com `hidesSharedBackground = true`. Tudo atras de `#available(iOS 26, *)` com fallback blur escuro. Gotchas visuais: tint do `UIGlassEffect` com cor alpha 1 vira bloco SOLIDO (usar alpha ~0.35); `plus.circle.fill` num botao glass vira disco branco (usar `plus`); collection views com `backgroundColor = .background` viram faixas escuras sobre o backdrop (deixar `.clear`); vidro so aparece com algo colorido atras \u2014 `GlassBackdropView` (blobs radiais na paleta) no index 0 de cada tela. Arquivo novo em projeto SEM xcodegen: adicionar via gem `xcodeproj` (`group.new_file` + `target.add_file_references`), nunca pbxproj a mao.\nAutomacao no sim iOS 26.1 (Xcode 26.1 em `/Applications/Xcode 2.app`; `xcode-select` aponta pro CLT \u2192 usar `DEVELOPER_DIR=\".../Xcode 2.app/Contents/Developer\"` em todo xcodebuild/simctl):\n- **idb NAO enxerga runtime iOS 26** (\"Cannot spawn companion ... no matching target\") e o shebang de `~/Library/Python/3.9/bin/idb` aponta pro python do `/Applications/Xcode.app` (inexistente). sim-mcp (ui_tap/ui_describe) volta vazio. **Usar Maestro** (`~/.maestro/bin/maestro --udid <UDID> test flow.yaml`, `JAVA_HOME=/usr/local/opt/openjdk`): tap por texto funciona em labels/botoes do app (inclusive `attributedTitle`), tabs da tab bar glass NAO (usar `point: \"60%,94%\"`), `optional: true` pra steps condicionais; screenshots em `~/.maestro/tests/<data>/<flow>/takeScreenshot/`.\n- **Card de review (SKStoreReviewController) nao recebe tap sintetico e fica PENDENTE no `StoreKitUIService` do sim**: reaparece a cada relaunch do app. Fix: `kill -9` do pid de `StoreKitUIService` (via `simctl spawn <UDID> launchctl list`) + terminate/launch do app. Prevenir ajustando os contadores do app ANTES.\n- **`simctl spawn <UDID> defaults write <bundle>` escreve no plist GLOBAL do sim, nao no do container do app** (o app le `.../Containers/Data/Application/<id>/Library/Preferences/<bundle>.plist`). Pra mudar UserDefaults: app terminado \u2192 `plutil -replace` nesse plist \u2192 `kill -9` do `cfprefsd` do sim \u2192 launch.\n- Seed de dados NSKeyedArchiver sem UI: script Swift macOS com classe espelho + `archiver.setClassName(\"<Modulo>.<Classe>\", for:)` \u2192 copiar pro `Documents/` do container (`simctl get_app_container <UDID> <bundle> data`).\n- `open -a Simulator` falha com Xcode renomeado \u2014 abrir pelo path `.../Xcode 2.app/Contents/Developer/Applications/Simulator.app`. Ao abrir, o Simulator.app RE-BOOTA o ultimo device usado (voltou o iPhone 12 mini que eu tinha desligado) \u2014 nao interpretar como outra sessao ativa.\n\n## 46b. Liquid Glass HABILITADO no iPhotos por pedido expl\u00edcito do Jo\u00e3o \u2014 2\u00aa exce\u00e7\u00e3o \u00e0 regra (22/08/2026)\nIgual ao Walk (LEARNING #45), o Jo\u00e3o pediu \"aplica o liquid glass no app tamb\u00e9m\" pro iPhotos. `UIDesignRequiresCompatibility = false` no `Info.plist` \u2192 opt-in no redesign iOS 26: o chrome do sistema (PHPicker, nav bars, sheets, alerts) adota Liquid Glass sozinho. Como o app \u00e9 UIKit+storyboard+SwiftUI h\u00edbrido com deployment target iOS 15, as superf\u00edcies SwiftUI novas ganharam `UI/GlassKit.swift` (helpers gated `if #available(iOS 26, *)` com fallback flat-dark pra 15-25): `glassSurface`/`glassCapsule`/`prominentGlassCapsule`/`glassButton`/`GlassContainerView`. Aplicado no PhotoEditor (dock+tabs, Save CTA, X, Rotate tile, ratio chips), Composer/Carousel (headers, save CTA, pain\u00e9is, chips) e LayoutGallery. Gotchas: (1) `glassEffect`/`.buttonStyle(.glass)`/`Glass`/`GlassEffectContainer` exigem SDK iOS 26 (Xcode 26) mas compilam com target 15 sob o gate; (2) pra VER o glass precisa sim iOS 26 (o 18.5 n\u00e3o renderiza) \u2014 criar device iOS-26.1 dedicado; (3) glass sobre fundo preto do editor fica sutil (pouco a refratar) \u2014 fica n\u00edtido onde a superf\u00edcie transborda a foto (chips do Crop). Arquivo novo entra no target via gem `xcodeproj` (projeto n\u00e3o usa grupos sincronizados). Regra geral do lab continua compat=YES; exce\u00e7\u00f5es s\u00f3 quando o Jo\u00e3o pede app a app (Walk, iPhotos).\n- **QA por Maestro no iOS 26 \u2014 o que funciona**: alertas de sistema (permissao de notificacao, login sandbox do StoreKit) SAO tocaveis por texto (diferente do card de review); `hideKeyboard` FALHA em number/decimal pad (sem return) \u2014 o app precisa de toolbar \"OK\" (`UITextField.addDoneToolbar()` em UIView+Extension) ou o flow toca num label do conteudo; `launchApp stopApp:true` NAO mata o processo de verdade (estado e card de review persistem) \u2014 terminar via `simctl terminate` e relan\u00e7ar por fora; `tapOn` por texto acha `attributedTitle` de botoes configurados, mas NAO os itens da tab bar glass (usar ponto). \"Restaurar Compras\" no sim abre o login sandbox da Apple \u2014 e o comportamento esperado, nao bug.\n- **Bug classico de lista + detalhe (College)**: `viewWillAppear` que so faz `reloadData()` quando a CONTAGEM mudou deixa edicoes (max de faltas, nome) stale ao voltar. Sempre recarregar \u2014 lista pequena, custo zero.\n\n## 48. `subscriptionAvailabilities` \u00e9 IMUT\u00c1VEL \u2014 os 175 territ\u00f3rios t\u00eam que ir no POST de cria\u00e7\u00e3o (25/08/2026 Hair Schedule)\nO LEARNING #1 manda mandar availability \"em batches (4-50 ok)\" pra fugir do 500. **Isso deixa a sub presa nos territ\u00f3rios do primeiro batch**: `POST /v1/subscriptionAvailabilities/{id}/relationships/availableTerritories` \u2192 **403** (\"relationship does not allow CREATE\"), `DELETE /v1/subscriptionAvailabilities/{id}` \u2192 **403** (\"does not allow DELETE\"), e n\u00e3o h\u00e1 PATCH. Criei com 40 territ\u00f3rios (ordem da API = alfab\u00e9tica por id: ABW, AFG, AGO\u2026) e a sub ficou SEM USA/ESP/MEX \u2014 inutiliz\u00e1vel.\n- **Os 175 de uma vez FUNCIONAM** (201) no POST de cria\u00e7\u00e3o. Fazer sempre assim: `GET /v1/territories?limit=200` \u2192 um \u00fanico POST com a lista inteira + `availableInNewTerritories: true`.\n- **Consertar exige recriar a subscription** (`DELETE /v1/subscriptions/{id}` \u2192 204 funciona enquanto nunca foi submetida). **Mas o productId e o `name` ficam QUEIMADOS pra sempre** \u2014 o POST novo d\u00e1 409 \"This product ID has already been used\". Escolher IDs novos (foi de `.premium.weekly/.yearly` pra `.premium.week/.year`) e lembrar de atualizar o app e o `.storekit`.\n- Ordem que funcionou 100% por API: group \u2192 subscription + localizations \u2192 **availability com TODOS os territ\u00f3rios** \u2192 pre\u00e7os (price point USA + `equalizations` \u2192 1 POST por territ\u00f3rio, 175/175) \u2192 intro offer (1 POST por territ\u00f3rio; ~10 d\u00e3o 500 espor\u00e1dico, retry resolve) \u2192 review screenshot (reserve \u2192 PUT \u2192 commit) \u2192 **PATCH no-op** (`reviewNote`) que tira do MISSING_METADATA \u2192 READY_TO_SUBMIT.\n\n## 49. PaywallKit rotulava semanal como \"Daily Plan\" \u2014 StoreKit reporta P1W como `.day` \u00d7 7 (25/08/2026)\n`Product.subscription.subscriptionPeriod` de um produto semanal chega como **unit `.day`, value 7** (visto com StoreKit config no simulador). O `PurchasePlan` do kit fazia switch direto no unit \u2192 card \"Daily Plan / $4.99 per day\" num plano semanal. Al\u00e9m disso todo o wording de per\u00edodo era ingl\u00eas hardcoded (quebra o paywall PT/ES).\nCorrigido no kit (commits `20ad1cf` + `76f021a`): `PurchasePeriod.normalised(unit:value:)` colapsa dia-7\u2192semana, dia-30/31\u2192m\u00eas, dia-365/m\u00eas-12\u2192ano; `PurchasePeriodNames` (closures planName/unitName/trialName) deixa o app passar o wording localizado; e a sele\u00e7\u00e3o do plano padr\u00e3o passou a rodar tamb\u00e9m no `onChange(of: store.products)` \u2014 antes, se o paywall aparecia antes do StoreKit responder, **nenhum plano ficava selecionado** e o CTA ca\u00eda no gen\u00e9rico. Todo app que usa `PurchaseScaffold` precisa passar `periodNames` (s\u00f3 o default `.english` mant\u00e9m o comportamento antigo).\n\n## 50. Simulador APLICA o `.storekit` do scheme mesmo via `simctl launch` (25/08/2026)\nO LEARNING #23 diz que \"simctl launch N\u00c3O aplica a StoreKit config \u2014 s\u00f3 Xcode Run ou SKTestSession\". Com Xcode 26.1 + `scheme: storeKitConfiguration:` no project.yml (xcodegen 2.44), o `xcrun simctl launch` **carregou os produtos normalmente** (paywall renderizou pre\u00e7o, trial e save %). Vale testar antes de montar harness de SKTestSession pra QA visual de paywall.\n\n## 48b. Permiss\u00e3o que o iOS NUNCA pergunta = tela preta eterna; e como provar que o problema \u00e9 o aparelho (25/08/2026 Neon/AirDraw)\nUsu\u00e1rio (o pr\u00f3prio Jo\u00e3o) baixou o app da loja e caiu numa **tela preta sem nenhum prompt de c\u00e2mera**. Diagn\u00f3stico levou v\u00e1rias rodadas porque o sintoma parece bug de app e n\u00e3o era s\u00f3 isso.\n\n**Como instrumentar (rota que funcionou, device via `devicectl ... --console`):**\n- `NSLog` (n\u00e3o `print`) do `AVCaptureDevice.authorizationStatus(for:.video).rawValue` (0=notDetermined, 1=restricted, 2=denied, 3=authorized) + `ARWorldTrackingConfiguration.isSupported` + `UIApplication.shared.applicationState.rawValue`.\n- **Truque pra saber se o di\u00e1logo do sistema APARECEU**: alerta de permiss\u00e3o faz o app **resignar active**. Se `willResignActiveNotification` n\u00e3o chegar em ~3s depois do `requestAccess`, o iOS **n\u00e3o desenhou o prompt** (diferente de \"est\u00e1 esperando o usu\u00e1rio responder\"). Esse \u00e9 o sinal que separa \"app n\u00e3o pediu\" de \"sistema engoliu\".\n- **Isolar app \u00d7 aparelho**: rebuildar com **PRODUCT_BUNDLE_IDENTIFIER novo** (TCC zerado, sem hist\u00f3rico) e pedir de novo. Mesmo resultado = \u00e9 o device. \u26a0\ufe0f N\u00c3O passar o bundle id novo na linha de comando do `xcodebuild` (vaza pros frameworks do CocoaPods e o install falha com \"Found bundle at .../FirebaseCore.framework with the same identifier\"): editar s\u00f3 as 2 linhas do target no pbxproj, buildar, e restaurar.\n- **Sonda de um segundo servi\u00e7o TCC** (ex: `AVAudioSession.requestRecordPermission`): se microfone TAMB\u00c9M n\u00e3o aparece, \u00e9 bloqueio geral, n\u00e3o algo espec\u00edfico da c\u00e2mera.\n- Causa real no caso: **Tempo de Uso \u2192 Conte\u00fado e Privacidade \u2192 PRIVACIDADE \u2192 C\u00e2mera = \"N\u00e3o Permitir Altera\u00e7\u00f5es\"**. Nesse modo nenhum app novo ganha acesso, nenhum prompt aparece e o app **n\u00e3o entra na lista** de Ajustes \u2192 Privacidade \u2192 C\u00e2mera (status fica notDetermined pra sempre). A se\u00e7\u00e3o PRIVACIDADE s\u00f3 existe quando \"Conte\u00fado e Privacidade\" est\u00e1 LIGADO \u2014 por isso o usu\u00e1rio \"n\u00e3o acha a op\u00e7\u00e3o\". Reiniciar o aparelho depois de liberar destravou.\n\n**Regras pro c\u00f3digo (valem pra TODO app com permiss\u00e3o):**\n1. **Nunca deixar permiss\u00e3o ausente virar tela preta.** ARKit/c\u00e2mera falham em SIL\u00caNCIO quando n\u00e3o autorizados. Pedir explicitamente com `AVCaptureDevice.requestAccess` antes de `session.run`, tratar negado com alerta + `openSettingsURLString`, implementar `session(_:didFailWithError:)` e re-tentar no `didBecomeActive` (o usu\u00e1rio pode ter liberado nos Ajustes).\n2. **Um pedido s\u00f3.** `viewWillAppear` + callback de onboarding disparavam dois `requestAccess` com 180ms de diferen\u00e7a. Single-flight.\n3. **N\u00e3o pedir durante transi\u00e7\u00e3o de janela.** O onboarding trocava `window.rootViewController` com `UIView.transition` (0,35s); alerta pedido nesse intervalo pode ser descartado. Esperar a janela assentar (~0,6s) antes de pedir.\n4. **Fallback quando o sistema n\u00e3o desenha**: usando o truque do resign-active, mostrar alerta explicando (aponte pro Tempo de Uso) em vez de sil\u00eancio.\n\n## 49b. `pod install --repo-update` no CI com Pods committados = release ref\u00e9m do CDN da CocoaPods (25/08/2026)\nRelease falhou em 35s: `CDN: trunk URL couldn't be downloaded ... Response: 429 rate-limited`. O repo committa `Pods/` (1.278 arquivos, em sinc com o Podfile.lock) \u2014 o `pod install` do workflow era puro risco: depend\u00eancia de rede de terceiro, e ainda por cima podia sobrescrever patch in-place de Pod (LEARNINGS #0b). **Remover o passo**: o checkout j\u00e1 traz o que o build precisa, e o runner passa a compilar exatamente o que foi validado local. Fix de workflow = novo commit + re-tag (`git push --delete origin release/X` + tag de novo), diferente de fix de infra que s\u00f3 precisa de `gh run rerun`.\n\n## 50b. `AVAssetWriter` com input duplicado no init = v\u00eddeo vazio / finishWriting travado (25/08/2026 Neon)\n`MetalVideoRecorder.init` criava input+adaptor, adicionava ao writer, e AINDA chamava um `setupVideoInput(size:)` que criava OUTRO `AVAssetWriterInput` e adicionava tamb\u00e9m. O segundo virava a propriedade; o primeiro nunca recebia sample nem `markAsFinished` \u2192 `finishWriting` entrega arquivo de 0 byte e o save nas Fotos falha com \"Error saving video\" (era o comportamento em produ\u00e7\u00e3o, na feature Pro \"HD video export\"). Outros dois defeitos na mesma trilha: (a) `recordVideoFrame()` disparava `DispatchQueue.global().async` **por frame renderizado**, v\u00e1rias threads disputando `metalLayer.nextDrawable()` (que pode bloquear 1s) enquanto o renderer desenhava; (b) a trava \"frame em voo\" como `Bool` escrito na fila de encode e lido na thread de render, sem sincroniza\u00e7\u00e3o \u2014 em device pode grudar em \"ocupado\" e descartar todo frame (use `DispatchSemaphore(value:1)` com `wait(timeout:.now())`). B\u00f4nus de robustez: contar frames escritos e, se for 0, avisar em vez de pedir acesso \u00e0s Fotos pra falhar num arquivo vazio. Valida\u00e7\u00e3o no device: `[REC] frames=69 noDrawable=0` + v\u00eddeo na fototeca.\n\n## 51. 1\u00ba grupo de assinaturas: `subscriptionSubmissions` TAMB\u00c9M recusa \u2014 \u00e9 web UI, ponto final (27/08/2026 Hair Schedule)\nO LEARNING #44 dizia que `reviewSubmissionItems` n\u00e3o aceita `subscription` como item. Faltava testar o endpoint **dedicado**, que existe e que o lab n\u00e3o conhecia:\n- `GET /v1/subscriptionSubmissions` \u2192 403 *\"does not allow 'GET_COLLECTION'. Allowed operation is: **CREATE**\"* \u2014 ou seja, o endpoint \u00e9 real (idem `inAppPurchaseSubmissions` e `subscriptionGroupSubmissions`).\n- `POST /v1/subscriptionSubmissions` com relationship `subscription` \u2192 **409 \"This subscription is not in a valid state.: This subscription cannot be reviewed, please check associated errors.\"**\n- E n\u00e3o era metadata faltando: as duas subs estavam `READY_TO_SUBMIT` com **175 territ\u00f3rios, 175 pre\u00e7os, review screenshot COMPLETE, 3 localizations, reviewNote** e (na anual) 175 intro offers. Auditado campo a campo antes de concluir.\n**Conclus\u00e3o:** pro **1\u00ba grupo de assinaturas** de um app, NENHUMA rota de API submete \u2014 nem `reviewSubmissionItems`, nem `subscriptionSubmissions`. S\u00f3 a web UI (p\u00e1gina da vers\u00e3o \u2192 *Compras dentro do app e assinaturas* \u2192 **+**). Bom: o 409 \u00e9 limpo e **n\u00e3o cria submission-fantasma**, ent\u00e3o sondar esse endpoint \u00e9 seguro (diferente de `POST /v1/reviewSubmissions`, que suja \u2014 LEARNING #1).\nDepois do 1\u00ba grupo aprovado, `subscriptionSubmissions` provavelmente passa a servir pra submeter sub nova sozinha \u2014 n\u00e3o testado ainda.\n\n## 52. Ao arquivar LOCAL, checar `CFBundleIconName` no Info.plist COMPILADO antes de subir (27/08/2026 Hair Schedule)\nRefor\u00e7o pr\u00e1tico do LEARNING #22, agora com o caso pego a tempo. Archive local com Xcode 26.1: o `actool` escreveu `CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName = AppIcon` mas **N\u00c3O** escreveu o `CFBundleIconName` da **raiz**. Nesse estado o `exportArchive` sobe com \"Upload succeeded\" e o build **nunca materializa na ASC**.\nFix: `PlistBuddy -c \"Add :CFBundleIconName string AppIcon\"` no Info.plist FONTE, `xcodegen generate`, re-arquivar. Depois disso o build apareceu e virou VALID normalmente.\n**Checklist pr\u00e9-upload de archive local** (rodar no `.xcarchive/Products/Applications/<App>.app/Info.plist`, n\u00e3o na fonte): `CFBundleIconName` (raiz E aninhado), `CFBundleShortVersionString`/`CFBundleVersion`, `ITSAppUsesNonExemptEncryption`, `UILaunchStoryboardName`, e `xcrun assetutil --info Assets.car` pra conferir case dos nomes contra o c\u00f3digo (LEARNING #32).\nB\u00f4nus: quando o CI n\u00e3o roda, os dSYMs n\u00e3o sobem sozinhos \u2014 mandar \u00e0 m\u00e3o com `SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/upload-symbols -gsp <GoogleService-Info.plist> -p ios <archive>/dSYMs`.\n\n## 53. \"Downloads\" do Sales Report inclui UPDATE \u2014 69% do lab era atualiza\u00e7\u00e3o, n\u00e3o instala\u00e7\u00e3o (27/08/2026)\nO `pull_data.py` somava `Units` de toda row do app sem olhar o **Product Type Identifier**. No relat\u00f3rio da Apple, `1`/`1F`/`1T`/`F1` = instala\u00e7\u00e3o nova e `7`/`7F`/`7T`/`F7` = **atualiza\u00e7\u00e3o**. Somando os dois, o lab \"fazia\" 25.330 downloads/m\u00eas quando fazia **7.363 instala\u00e7\u00f5es** \u2014 o resto era a base antiga atualizando.\n**O que isso contaminava:** ARPD (receita/download), tend\u00eancia 7d, run-rate e principalmente o **veredito KILL/WATCH/SCALE**, que roda em downloads/dia. R\u00f3tulos ficaram invertidos: o iPhotos aparecia com 10.371 downloads e +588% (eram 161 instala\u00e7\u00f5es e tr\u00eas releases empurrando update para a base); o Neon Glow Draw aparecia SCALE e \u00e9 KILL (85 instala\u00e7\u00f5es reais, US$ 0).\n**Sintoma que denuncia:** cobertura de GA4 absurdamente baixa (novos usu\u00e1rios \u00f7 \"downloads\" na casa de 1%) sem nenhum bug de SDK. Se a conta n\u00e3o fecha por 10\u00d7 ou mais, desconfie do denominador antes do Firebase.\n**Fix:** `collect_sales` separa `downloads` (1*) de `updates` (7*), e `compute_verdict` s\u00f3 usa instala\u00e7\u00e3o. Conferir no cru: agrupar um dia por `Product Type Identifier` antes de acreditar em qualquer salto de download.\n\n## 54. Crash-free agregado mistura TestFlight com produ\u00e7\u00e3o \u2014 cruzar sempre com a vers\u00e3o da loja (27/08/2026)\nMeus Gastos aparecia com crash-free de 50% \u2014 n\u00famero que manda \"hotfix antes de tudo\". Quebrando por `appVersion`: 45.3.0 com 47% (9 usu\u00e1rios), 45.3.1 com 67% (1), e **45.2.0, que \u00e9 a vers\u00e3o publicada, com 100%**. Os crashes eram de build de desenvolvimento entre 18 e 25/08 e pararam no dia do build final. N\u00e3o havia nada pra corrigir.\n**Regra:** `crashFreeUsersRate` agregado n\u00e3o \u00e9 acion\u00e1vel. Puxar `crashAffectedUsers`/`crashFreeUsersRate` por `appVersion` e cruzar com a vers\u00e3o live (iTunes lookup `version`) \u2014 o `pull_data.py` agora guarda `live_version`/`live_released` por app. Se o GA4 reporta build number (`28`) e a loja mostra short version (`1.9.0`), o cruzamento \u00e9 imposs\u00edvel: dizer isso em vez de concluir.\n\n## 55. Declarar o nome do evento n\u00e3o \u00e9 logar \u2014 e o GA4 sozinho n\u00e3o distingue as duas coisas (27/08/2026)\nO College tinha `static let purchaseSuccess = \"purchase_success\"` num enum de eventos e o GA4 nunca recebeu o evento. Duas leituras poss\u00edveis e opostas: (a) n\u00e3o est\u00e1 instrumentado, (b) est\u00e1 instrumentado e ningu\u00e9m comprou na janela. **S\u00f3 o source resolve** \u2014 e a resposta era (b): a chamada existe em `PurchaseViewController.swift:574`, a receita do m\u00eas veio de renova\u00e7\u00e3o, n\u00e3o de compra nova.\nO caso inverso tamb\u00e9m existe: iPhotos loga `core_action`, `rating_gate_shown` e `permission_result` no c\u00f3digo e nenhum chegou ao GA4, porque a vers\u00e3o que os introduziu saiu **depois** do fim da janela de dados.\n**Fix estrutural:** `scripts/analytics/verify-analytics.py` l\u00ea o c\u00f3digo (literais + constantes + uso das constantes) e o `firebase_snapshot.py` cruza com o GA4, classificando em tr\u00eas: *n\u00e3o instrumentado* / *instrumentado e mudo* / *instrumentado e novo demais pra medir*. Nunca acusar gap de instrumenta\u00e7\u00e3o s\u00f3 com o GA4 na m\u00e3o.\n\n## 56. `GoogleService-Info.plist` na pasta mas fora do TARGET = app publicado sem telemetria (27/08/2026)\nSintoma: property GA4 existe, `FirebaseApp.configure()` est\u00e1 no `init` do `@main`, o app tem milhares de instala\u00e7\u00f5es e o GA4 registra ~zero usu\u00e1rio. Causa: o plist est\u00e1 no diret\u00f3rio mas n\u00e3o \u00e9 membro do target no Xcode, ent\u00e3o n\u00e3o vai pro bundle e o `configure()` n\u00e3o acha config nenhuma.\n**Diagn\u00f3stico em um comando:** `grep -c \"GoogleService-Info.plist\" <App>.xcodeproj/project.pbxproj` \u2014 zero em projeto sem xcodegen significa fora do target (em app xcodegen isso \u00e9 falso positivo, porque a inclus\u00e3o \u00e9 por pasta no `project.yml`).\nEntrou no pr\u00e9-release checklist junto do resto da instrumenta\u00e7\u00e3o.\n\n## 57. Upload longo na ASC morre com 401 no meio \u2014 token JWT s\u00f3 vale 20 min (28/08/2026 Calc+)\nUm upload de PPO grande (288 screenshots: 3 tratamentos \u00d7 12 idiomas \u00d7 2 display types) leva bem mais que os 20 min de validade do token. Os scripts do lab mintavam o JWT **uma vez** no in\u00edcio e passavam o header adiante \u2014 no meio do 2\u00ba tratamento veio `PATCH /v1/appScreenshots/{id} -> 401 NOT_AUTHORIZED` e o run abortou com o experimento j\u00e1 criado e meio populado.\n**Fix (aplicar em todo script de upload/deploy):** o token vira cache global re-emitido sob demanda (`if exp - now < 300: re-mint`) e **cada request injeta o header fresco** (`headers={**headers, **auth()}` dentro do `_send`/`delete`), em vez de receber um dict de auth pronto.\n**CORRE\u00c7\u00c3O 28/08/2026 (Walk):** esse caso virou, na pr\u00e1tica, uma regra de \"upload em massa \u00e9 sequencial\" \u2014 e isso est\u00e1 ERRADO. Serializar os 41 locales do Walk (205 prints de ~2,7 MB) daria ~100 min; com `ThreadPoolExecutor` de 10 workers levou **2 min, zero falha**. O que protege n\u00e3o \u00e9 a fila: \u00e9 (a) `retry` com backoff exponencial que s\u00f3 re-tenta transit\u00f3rio (429, 5xx, connection/timeout), (b) re-mint do token a cada request e (c) reconcilia\u00e7\u00e3o por `sourceFileChecksum`, que faz re-rodar custar um GET no que j\u00e1 subiu. Paralelizar pela unidade independente (1 locale = 1 set), medir num lote pequeno, coletar falhas por unidade em vez de abortar tudo. Refer\u00eancia: `Apps/recovery/ios/stepsSwiftUI/ppo-pipeline/scripts/push_default_page.py`.\n\n**Retomada sem duplicar:** o script precisa de `--resume <experiment_id>` + find-or-create de tratamento (por `name`) e de localization (por `locale`), com cada set reconciliado por **checksum** (prune do que n\u00e3o \u00e9 nosso \u2192 reusa o que j\u00e1 bate \u2192 sobe s\u00f3 o que falta). Assim re-rodar \u00e9 idempotente e barato. Refer\u00eancia: `Apps/important/Calculator-/Calculator++/fastlane/upload_ppo_order.py`.\n**B\u00f4nus do mesmo caso \u2014 promover um tratamento de PPO N\u00c3O cobre todos os display types:** o vencedor do \"Vault Green A/B\" foi promovido em 12/08 mas s\u00f3 existia em `APP_IPHONE_65`; o `APP_IPHONE_67` da default page continuou com os prints antigos de 2022. Ou seja, o A/B foi decidido com tr\u00e1fego de iPhone velho e a maioria dos usu\u00e1rios nunca viu o vencedor. Ao ler resultado de PPO, conferir SEMPRE em quais display types o tratamento realmente existia (extens\u00e3o do LEARNINGS #35 UPDATE 2).\n\n## 57b. Adicionar 36 locales de metadata via API \u2014 4 c\u00f3digos s\u00e3o regionais, e o POST de vers\u00e3o auto-cria o appInfoLocalization (28/08/2026 Hair Schedule)\nPra cobrir os 39 locales da App Store por API (`POST /v1/appStoreVersionLocalizations` + name/subtitle em `appInfoLocalizations`):\n1. **Quatro locales N\u00c3O aceitam o c\u00f3digo curto**: `ar`\u2192`ar-SA`, `de`\u2192`de-DE`, `fr`\u2192`fr-FR`, `nl`\u2192`nl-NL` (409 \"is not a valid locale\" / \"language not listed for localization\"). Os outros s\u00e3o curtos (`ca, cs, da, el, fi, he, hi, hr, hu, id, it, ja, ko, ms, no, pl, ro, ru, sk, sv, th, tr, uk, vi, zh-Hans, zh-Hant`) ou j\u00e1 regionais (`en-AU/CA/GB/US, es-ES/MX, fr-CA, pt-BR/PT`).\n2. **Criar o `appStoreVersionLocalization` j\u00e1 cria o `appInfoLocalization` do mesmo locale** \u2014 o POST em `appInfoLocalizations` devolve `ATTRIBUTE.INVALID.DUPLICATE`. Fluxo certo: POST version-loc \u2192 GET `appInfos/{id}/appInfoLocalizations` \u2192 PATCH name/subtitle/privacyPolicyUrl. Usar o appInfo N\u00c3O-live (o que acompanha a vers\u00e3o em prepara\u00e7\u00e3o).\n3. Locales novos ficam SEM `appScreenshotSets` \u2014 a ASC usa os prints do idioma prim\u00e1rio como fallback; a submiss\u00e3o passa.\n4. Cancelar uma submission (`PATCH canceled:true`) deixa a vers\u00e3o em **`DEVELOPER_REJECTED`** (n\u00e3o `PREPARE_FOR_SUBMISSION`); ainda \u00e9 edit\u00e1vel por API. Ao recriar a submission, o 1\u00ba `POST reviewSubmissionItems` com a vers\u00e3o pode dar **500 UNEXPECTED_ERROR transiente** \u2014 retry ap\u00f3s 5s passa (vers\u00e3o vira READY_FOR_REVIEW). E vale o #44: se a submission cancelada tinha o 1\u00ba grupo de subs, eles S\u00d3 voltam pelo web UI antes de submeter.\n\n## 57c. PPO em 41 locales: recriar prints sem a arte original + upload PARALELO (28/08/2026 Walk)\nTeste de ORDEM das telas com cobertura total de idiomas quando s\u00f3 existiam os PNGs live (en/pt/es, headline baked) e a imagem panor\u00e2mica original tinha sido apagada:\n- **Arte sem texto reconstru\u00edda a partir das variantes localizadas** (`stepsSwiftUI/ppo-pipeline/scripts/reconstruct_base.py`): pra cada pixel, pega o valor de um locale onde ele N\u00c3O est\u00e1 sob texto (m\u00e1scara = glifos brancos dilatados pelo alcance da sombra; entre candidatos limpos, o MAIS CLARO \u2014 sombra s\u00f3 escurece); onde os 3 textos se cruzam, difus\u00e3o harm\u00f4nica multi-escala (c\u00e9u bokeh n\u00e3o denuncia). Pegadinhas: (a) diff entre locales N\u00c3O serve pra palavra id\u00eantica nos 3 (WIDGETS); (b) preenchimento por coluna vira \"cortina\" \u2014 usar difus\u00e3o 2D; (c) detector de branco pega folhas ao sol \u2192 abertura morfol\u00f3gica 9px, MAS acentos (\u00cd, \u00ca) s\u00e3o pequenos e somem \u2192 manter branco cru a \u226441px de um tra\u00e7o.\n- **Headlines por CoreText** (`render_headlines.swift`, `NSFont.systemFont(weight: .black)` + `kCTLanguageAttributeName`): shaping e fallback corretos pra \u00e1rabe/hebraico/devan\u00e1gari/bengali/gurmukhi/tailand\u00eas/CJK sem libraqm \u2014 Pillow do sistema n\u00e3o tem raqm. Calibrar tamanho medindo a altura de caixa-alta do print live (Walk 6.9\": 230pt/88pt, baselines 288/394, sombra blur 14 \u03b1.75 dy 6). Escala menor pra CJK (0.78) e \u00edndico/tailand\u00eas (0.85).\n- **Upload serial = ~1 set/min** (3 requests por print + create localization/set). 123 sets = 2h. Com `parallel_upload.py` (ThreadPool 8, token por thread, retry em 429/5xx, idempotente por checksum \u2014 reconcilia o que j\u00e1 est\u00e1 na ASC e s\u00f3 envia o que falta, depois PATCH da ordem) 31 sets levaram ~3 min sem nenhum 429. Padr\u00e3o pra qualquer upload de PPO/prints: paralelizar por locale, nunca serializar.\n- Submiss\u00e3o e estado: `POST reviewSubmissions` + item `appStoreVersionExperiment` + `submitted:true` \u2192 WAITING_FOR_REVIEW em 3 chamadas (confirma o LEARNING #39).\n\n## 57d. ASC API: cota de 3600 requests/HORA por CHAVE (compartilhada entre sess\u00f5es) \u2014 paralelizar n\u00e3o aumenta throughput, s\u00f3 estoura mais cedo (28/08/2026 Meus Gastos)\nUpload de PPO com 8 threads morreu em `429 Too Many Requests` depois de ~26 sets. N\u00e3o era concorr\u00eancia: toda resposta da ASC traz `X-Rate-Limit: user-hour-lim:3600;user-hour-rem:N;` \u2014 **3600 requests por hora por API key**, contando TODOS os processos e sess\u00f5es que usam a mesma `[chave]` (no mesmo dia Walk, iPhotos e AppLock tinham subido ~1.200 prints pela mesma chave). Conta de um PPO: cada set de 5 prints \u2248 11-16 requests (GET sets + DELETE dos clones + 5\u00d7(POST reserve + PATCH commit); o PUT dos bytes vai pra outro host e n\u00e3o conta) \u2192 184 sets \u2248 2.500 requests, quase a hora inteira.\n**Regra:** (1) o `upload_ppo.py` do template agora l\u00ea o header em toda resposta (`_govern`) e PAUSA 5 min quando `user-hour-rem` \u2264 40, al\u00e9m de retry em 429 \u2014 todo script que importa o template herda isso; (2) concorr\u00eancia boa = 4-6 workers (ganho \u00e9 s\u00f3 lat\u00eancia do PUT), nunca mais que isso; (3) antes de um upload grande, conferir a cota: `GET /v1/apps/<id>` e ler `X-Rate-Limit` \u2014 se `rem` < (sets \u00d7 14), esperar a virada da hora ou rodar em duas levas; (4) n\u00e3o rodar dois uploads grandes em sess\u00f5es paralelas na mesma hora.\n## 58. Localizar uma panorama de prints gerada por IA sem regenerar: apagar o texto por linha e re-renderizar com CoreText (28/08/2026 Sueca)\nO ChatGPT devolve a panorama com o texto da UI baked (e s\u00f3 num idioma, ~1691\u00d7930). Pra 12 locales sem 12 gera\u00e7\u00f5es: (1) apagar CADA texto com m\u00e1scara de branco dilatada (5px) + lerp por LINHA entre os vizinhos reais do run + blur s\u00f3 na \u00e1rea \u2014 mediana da regi\u00e3o ou amostra fora da regi\u00e3o pega borda de card/bezel/estrela e deixa faixa clara (4 itera\u00e7\u00f5es perdidas); texto colorido = lerp na caixa inteira; (2) cortar por \"colunas que n\u00e3o s\u00e3o o fundo\" (colunas escuras falham em tela colorida), janela = 1 spacing entre phones; (3) renderizar copy + headline por locale com CoreText (`NSFont.systemFont` + `kCTLanguageAttributeName` \u2192 fallback PingFang/Hiragino/Apple SD Gothic sozinho; `singleLine` pra pill/tab/nome; `\\n` manual nas perguntas CJK). Scripts em `SuecaDrink/ppo-pipeline/{experiments/2026-08-28_panorama-pt/tools,scripts/render_texts.swift}`. Prints em 5.5\" (1242\u00d72208, 16:9) = escalar pela altura e preencher as laterais com a coluna da borda, NUNCA esticar. Regra do #35 vale: subir tamb\u00e9m no 5.5\" se a default page do locale tem esse set.\n\n## 58b. Flutter `build ios` local com `xcode-select` no CLT: hook do `objective_c` morre com \"Bad state: No element\" \u2014 shim de `xcrun` no PATH resolve (30/08/2026 BLW)\nCom o `xcode-select -p` apontando pro CommandLineTools (Xcode fica em `/Applications/Xcode 2.app`), `flutter build ios` falha em \"Building assets for package:objective_c failed / Bad state: No element\". O hook (`objective_c/hook/build.dart`) roda `xcrun --show-sdk-path --sdk iphoneos`, e o CLT n\u00e3o tem SDK de iPhone \u2192 stdout vazio \u2192 `.first` explode. **Exportar `DEVELOPER_DIR` n\u00e3o adianta**: o `hooks_runner` do Flutter passa pro hook um env FILTRADO (s\u00f3 `PATH`, `HOME`, `TMPDIR`\u2026 \u2014 `includeHookEnvironmentVariable` em `hooks_runner/lib/src/build_runner/build_runner.dart`), ent\u00e3o a vari\u00e1vel nunca chega. E `xcode-select -s` exige sudo.\n**Fix sem sudo:** shim de `xcrun` na frente do PATH que injeta o DEVELOPER_DIR e delega pro `/usr/bin/xcrun`:\n```sh\nmkdir -p /tmp/shim && printf '#!/bin/sh\\nexport DEVELOPER_DIR=\"/Applications/Xcode 2.app/Contents/Developer\"\\nexec /usr/bin/xcrun \"$@\"\\n' > /tmp/shim/xcrun && chmod +x /tmp/shim/xcrun\nPATH=\"/tmp/shim:$PATH\" DEVELOPER_DIR=\"/Applications/Xcode 2.app/Contents/Developer\" flutter build ios --release --no-codesign --no-tree-shake-icons\n```\nManter o shim no PATH tamb\u00e9m no `xcodebuild archive` (a script phase do Flutter re-roda o hook). No CI isso n\u00e3o aparece porque o runner tem o Xcode selecionado. B\u00f4nus do mesmo release: GitHub Actions recusou o job por **billing da conta** (\"account is locked due to a billing issue\") \u2014 \u00e9 da conta inteira, n\u00e3o do repo; o archive local com Xcode 26.1 + cloud signing pela API key (LEARNINGS #52, conferir `CFBundleIconName` na raiz do plist compilado) \u00e9 o fallback que funcionou.\n\n## 60. iOS 26: item custom com glass no leading da nav bar faz MORPH com o bot\u00e3o back no push/pop (30/08/2026 College)\nSintoma (visto em frames de v\u00eddeo do sim): no push, a pill \"PRO\" (`UIBarButtonItem(customView:)` com `prominentGlass` + `hidesSharedBackground`) perde o vidro, o texto flutua fantasma e um blob de vidro vira o \"Voltar\"; no pop, o \"Voltar\" vira um borr\u00e3o que se estica num blob azul at\u00e9 virar \"PRO\". Trocar por `UIBarButtonItem(title:style:.prominent)` deixa o morph \"bonito\" (crossfade dentro da pill), mas continua sendo um morph entre PRO e back \u2014 o Jo\u00e3o n\u00e3o quis anima\u00e7\u00e3o nenhuma ali.\n**Fix que ficou:** tirar o item da nav bar. A pill vive em `navigationController.view` (acima da barra, ent\u00e3o recebe toque), ancorada em `centerY` da `navigationBar` + leading 16, e s\u00f3 faz **fade junto da transi\u00e7\u00e3o** via `transitionCoordinator.animate(alongsideTransition:)` em `viewWillAppear`/`viewWillDisappear` (restaurar alpha se `context.isCancelled`, pop interativo). Helpers gen\u00e9ricos: `LiquidGlass.installLeadingPill(_:over:)` + `LiquidGlass.fade(_:to:alongside:)`. O back volta a ser o do sistema, sem par pra morphar.\nFerramenta pra ver isso: `simctl io recordVideo` em background + Maestro fazendo push/pop + extrair frames a 20 fps com `AVAssetImageGenerator` (script swift, sem ffmpeg) e montar contact sheet s\u00f3 da faixa da nav bar.\n\n## 61. Run do GitHub Actions em `startup_failure` sem nenhum job = billing/limite de gasto, n\u00e3o c\u00f3digo (30/08/2026 College)\n`gh run list` mostra a tag `release/26` como `completed / startup_failure` e `gh run view --json jobs` devolve `jobs: []` \u2014 o runner nem foi alocado. Mesmo workflow tinha passado 8 dias antes. N\u00e3o adianta re-taggear nem `gh run rerun`. Fallback que funcionou (mesma receita do Hair Schedule, LEARNINGS #52): archive LOCAL com o Xcode 26.1 (`/Applications/Xcode 2.app`), assinatura via ASC API key (`-allowProvisioningUpdates -authenticationKeyPath/-authenticationKeyID/-authenticationKeyIssuerID`, porque esse Xcode n\u00e3o tem conta Apple ID), checklist do Info.plist COMPILADO + `assetutil` no Assets.car, upload com API key \u2014 build VALID em ~6 min. Antes de subir: `CFBundleIconName` expl\u00edcito no Info.plist fonte evita o ingest silencioso (#22/#52). A\u00e7\u00e3o de longo prazo continua sendo regularizar o billing (a pipeline \u00e9 o caminho padr\u00e3o, #0).\n\n## 62. Regra que depende de eu lembrar n\u00e3o \u00e9 regra \u2014 os \"SEMPRE verificar\" viraram c\u00f3digo (31/08/2026)\nBoa parte deste arquivo \u00e9 da forma *\"SEMPRE verificar X via API depois de Y\"* (#13 sync no-op, #26 prints duplicados, #27 subtitle pulado, #35 re-clone de PPO, #52 checklist pr\u00e9-upload). Todas eram lidas por mim no come\u00e7o da sess\u00e3o e aplicadas por mem\u00f3ria \u2014 ou seja, probabil\u00edsticas. O #33 \u00e9 a prova do custo: tr\u00eas builds \"sumidos\" diagnosticados como ingest silencioso quando o CI \u00e9 que tinha falhado, porque ningu\u00e9m *executou* a verifica\u00e7\u00e3o.\n**O que mudou:** `scripts/verify/preflight.py` roda esses or\u00e1culos com exit code, e o hook `~/.claude/hooks/archive-preflight.sh` (PreToolUse/Bash) **nega** um `-exportArchive` cujo `.app` compilado reprove \u2014 o build que sumiria no ingest n\u00e3o chega a ser exportado. `--only code` cobre as regras duras do RULES (`.foregroundColor`, `#Preview`, shadow colorida, 600 linhas); `--only asc` l\u00ea o estado LIVE (subtitle nulo por locale, keywords > 100, l\u00e9xico 2.5.14 multil\u00edngue, prints duplicados) respeitando a cota de 3600 req/h da chave.\n**O detalhe que faz funcionar:** `test_preflight.py` alimenta o verificador com os bugs REAIS j\u00e1 vividos (os 11 locales que passaram batido na 2\u00aa rejei\u00e7\u00e3o do WTMP, o plist do Calc+, o `.storyboard` no `UILaunchStoryboardName`) e exige que cada um seja pego, junto dos falsos positivos que N\u00c3O podem disparar (`Gizlilik Politikas\u0131`, `mode senyap`, `\ube44\ubc00\ubc88\ud638`). Verificador sem teste negativo s\u00f3 sabe dizer \"ok\" \u2014 e um or\u00e1culo falso \u00e9 pior que nenhum.\n**Achados na estreia** (archive do Walk de 22/08, dados reais): `CFBundleIconName` ausente na raiz do plist compilado e `GoogleService-Info.plist` fora do bundle. Nenhum dos dois aparece em build local, teste ou log \u2014 s\u00f3 no sil\u00eancio da ASC horas depois.\n**Regra daqui pra frente:** todo learning novo que contiver \"SEMPRE verificar\" nasce com o check correspondente em `scripts/verify/` e um caso no eval. Learning sem check \u00e9 lembrete; com check \u00e9 garantia.\n\n## 65. Splash antiga persiste: o snapshot da launch screen vive FORA do container do app (31/08/2026 Sunrise)\nTroquei o `LaunchIcon` no Assets.xcassets, o `Assets.car` do bundle instalado j\u00e1 tinha a imagem nova (confirmado por `xcrun assetutil --info`, digest mudou), e a splash continuou mostrando a arte ANTIGA. Sobreviveu a `simctl uninstall` + `install`, e a `shutdown` + `boot` do simulador.\n**Onde est\u00e1:** `<device>/data/Containers/Data/Application/<uuid>/Library/SplashBoard/Snapshots/<bundle-id>*`. Apagar essa pasta ANTES do install resolve \u2014 mas o caminho \u00e9 por container, ent\u00e3o depois de reinstalar o app ganha container novo e o cache velho pode ressurgir de outro lugar. O que funcionou de forma definitiva foi `simctl erase`.\n\u26a0\ufe0f **`simctl erase` reseta o device inteiro** \u2014 apaga todos os outros apps e dados do simulador. Se houver outros apps do lab instalados ali, criar/clonar um simulador dedicado antes (`simctl clone`) em vez de apagar o que est\u00e1 em uso.\n**Diagn\u00f3stico r\u00e1pido pra separar cache de build errado:** `xcrun assetutil --info <App>.app/Assets.car` e comparar o `SHA1Digest` da imagem entre dois builds. Digest diferente = o bundle tem a arte nova, ent\u00e3o o que est\u00e1 na tela \u00e9 cache.\n\n## 66. QA no simulador iOS 26: Maestro por accessibilityIdentifier, nunca por coordenada (31/08/2026 Sunrise)\nRefor\u00e7o pr\u00e1tico do LEARNINGS #47. No iOS 26 o **idb (Meta) n\u00e3o enxerga o runtime** e o sim-mcp (`ui_tap`/`ui_describe`) volta vazio \u2014 Maestro \u00e9 a \u00fanica ferramenta que dirige. Mas **tap por ponto \u00e9 fr\u00e1gil**: um `Toggle` com `.labelsHidden()` n\u00e3o exp\u00f5e nada, ent\u00e3o s\u00f3 resta coordenada, e um Y errado por 12% \"passa\" (COMPLETED) sem fazer nada \u2014 o teste d\u00e1 verde e n\u00e3o testou.\n**Regra:** quando um controle n\u00e3o for alcan\u00e7\u00e1vel por texto, a corre\u00e7\u00e3o \u00e9 **no app, n\u00e3o no flow** \u2014 `.accessibilityIdentifier(\"dominio.acao\")` + `.accessibilityLabel(...)`. Serve pro QA e pro VoiceOver ao mesmo tempo. Depois o flow usa `tapOn: id:` / `assertVisible: id:`, que falha de verdade quando o elemento n\u00e3o est\u00e1 l\u00e1.\nSemear estado direto no plist do container (`Library/Preferences/<bundle>.plist` + `kill -9 cfprefsd`) evita dirigir wheel pickers: seed do alarme DESLIGADO e ligar pelo toggle testa permiss\u00e3o + agendamento + toque de uma vez.\n\n## 67. Smart alarm que \"toca sempre no hor\u00e1rio m\u00ednimo\": olhar o que est\u00e1 AGENDADO antes de culpar a detec\u00e7\u00e3o (31/08/2026 Sunrise)\nSintoma: o despertador inteligente disparava no primeiro minuto da janela, toda noite. A suspeita natural \u00e9 a detec\u00e7\u00e3o de sono leve \u2014 e ela tinha problemas reais \u2014, mas a causa prim\u00e1ria era outra: `scheduleAlarm` plantava uma `UNNotificationRequest` **no in\u00edcio da janela**, com o som cheio do alarme e `interruptionLevel: .timeSensitive`, incondicionalmente. Nenhuma l\u00f3gica de fase impedia isso.\n**Regra:** num alarme inteligente, a janela \u00e9 or\u00e7amento, n\u00e3o gatilho \u2014 **n\u00e3o pode existir nada agendado no come\u00e7o dela**. O toque antecipado s\u00f3 pode vir do monitor de movimento; o fallback \u00e9 o hor\u00e1rio real.\nAprendizados da reescrita da detec\u00e7\u00e3o (`SleepStagingEngine.swift`):\n- **Actigrafia separa sono de vig\u00edlia, n\u00e3o deep/REM/light** (npj Digital Medicine 2023). Derivar fase do rel\u00f3gio (modelo de ciclo de 90 min como *primary driver*) \u00e9 fic\u00e7\u00e3o \u2014 foi o que o app fazia.\n- **Cole-Kripke**: usar o KERNEL de pesos (suaviza cada minuto contra os vizinhos, mata o pico isolado de uma virada na cama), n\u00e3o a constante publicada \u2014 ela \u00e9 calibrada pra counts de pulso do ActiGraph, n\u00e3o pra celular no colch\u00e3o.\n- **Auto-calibrar** os limiares como m\u00faltiplos do movimento t\u00edpico DAQUELA noite. Constante fixa n\u00e3o absorve varia\u00e7\u00e3o de celular/colch\u00e3o/posi\u00e7\u00e3o.\n- Gatilho com barra que **decai ao longo da janela** (exige quase-vig\u00edlia no come\u00e7o, aceita sono leve perto do hor\u00e1rio) + confirma\u00e7\u00e3o de 2 minutos. Validar com simula\u00e7\u00e3o de cen\u00e1rios antes de esperar uma noite real.\n\n## 63. Prompt de agente n\u00e3o tem teste \u2014 e por isso regride em sil\u00eancio (31/08/2026)\nO lab tem 20 agentes em `~/.claude/agents/`. Cada um carrega regras que custaram caro pra descobrir: \"todo token do protection map FICA\" (`aso-field-composer`, dire\u00e7\u00e3o do Jo\u00e3o 18/08), \"PATCH, never deliver\" (`aso-deployer`, #13), \"NEVER edit shared files\" (`screen-builder`, sen\u00e3o o merge do coordenador corrompe), \"never leave \u2b1c\" (`qa-runner`, o hook de Stop depende disso). Nada garantia que uma edi\u00e7\u00e3o no `.md` n\u00e3o apagasse uma dessas \u2014 e a regress\u00e3o n\u00e3o aparece na hora: aparece meses depois, num campo de keywords com um token rankeado a menos.\n**`_GambitStudio/evals/`** resolve em tr\u00eas camadas: **contract** (a regra ainda est\u00e1 no prompt, com o `why` que a originou), **artifact** (os outputs REAIS que o agente j\u00e1 produziu no lab respeitam essas regras) e **behavior** (`--live`, roda o agente num fixture). Mais as invariantes que valem pros 20: frontmatter coerente, constantes do lab corretas (Key ID/Issuer/Team ID/path da `[chave]` \u2014 uma divergente manda o agente pra credencial errada) e lab auto-contido. 202 checks, cobertura 20/20.\n**O que faz o eval valer alguma coisa \u00e9 o meta-teste.** `test_evals.py` faz **muta\u00e7\u00e3o**: apaga do prompt exatamente o que cada asser\u00e7\u00e3o exige e verifica que o eval reprova. Asser\u00e7\u00e3o que sobrevive \u00e0 pr\u00f3pria muta\u00e7\u00e3o \u00e9 INERTE \u2014 passa sempre e protege nada. 136 asser\u00e7\u00f5es, 0 inertes. Sem esse passo, um eval verde \u00e9 indistingu\u00edvel de um eval quebrado (mesma li\u00e7\u00e3o do #62).\n**O `why` de cada asser\u00e7\u00e3o n\u00e3o \u00e9 coment\u00e1rio** \u2014 \u00e9 o que sobrevive \u00e0 pr\u00f3xima edi\u00e7\u00e3o. Quem for mexer na regra l\u00ea antes por que ela existe.\n**Hook `agent-eval-guard.sh`** (PostToolUse/Edit|Write): editou `~/.claude/agents/<x>.md`, o eval daquele agente roda na hora e o FAIL volta pro modelo no mesmo turno.\n**Achado da estreia \u2014 a camada de artefato vale mais que a de contrato:** o `aso-field-composer` escreveu 8 `keywords.txt` desde que suas hard rules foram fixadas e **5 t\u00eam acento, enquanto a regra 5 dele diz \"no accents\"**. O prompt manda uma coisa, o output faz outra. Como o iOS normaliza acento na busca, deixei como warn (viola\u00e7\u00e3o que custa ranking \u2014 >100 chars, dup, token `app` \u2014 continua FAIL) e a decis\u00e3o de qual lado ceder est\u00e1 no now.json. Regra geral: eval que grita por algo de impacto nulo vira ru\u00eddo e \u00e9 ignorado; calibrar severidade \u00e9 parte do trabalho, n\u00e3o detalhe.\n\n## 63b. Adendo \u2014 a decis\u00e3o do acento, e por que o eval de artefato vale mais que o de contrato (31/08/2026)\nO eval acusou 5 `keywords.txt` com acento contra a regra 5 do pr\u00f3prio `aso-field-composer` (\"no accents\"). A tenta\u00e7\u00e3o era escolher entre \"o agente est\u00e1 errado\" e \"a regra est\u00e1 errada\" no abstrato. **O portf\u00f3lio respondeu:** `stepsSwiftUI` (`diaria`, `grafico`, `exercicio`), `Controle-de-gastos` (`orcamento`, `diario`), `philos_app` (`sabiduria`, `reflexao`), `AirDraw` (`magico`, `lapiz`) escrevem normalizado, e o BLW passou a escrever sem acento no iter-04/05 \u2014 um dia depois do iter-03 acusado. Era regra seguida, com 2 fugas.\n**A regra ficou, mas ganhou o porqu\u00ea dentro do prompt** \u2014 porque uma regra sem motivo \u00e9 a que a pr\u00f3xima edi\u00e7\u00e3o apaga. O ganho N\u00c3O \u00e9 ranking (o iOS normaliza diacr\u00edticos; a regra 4 j\u00e1 dizia isso e a 5 parecia prometer o que n\u00e3o entrega): \u00e9 (a) **dup hygiene** \u2014 uma grafia por palavra faz `porosidade`+`porosidad` aparecer num check de string em vez de se esconder no campo; (b) **aposta assim\u00e9trica** \u2014 usu\u00e1rio mobile digita sem acento com frequ\u00eancia, ent\u00e3o se a normaliza\u00e7\u00e3o falhar em algum termo, a forma sem acento \u00e9 a que ainda casa. Empata no melhor caso, ganha no pior.\n**D\u00edvida vira baseline expl\u00edcito, n\u00e3o exce\u00e7\u00e3o silenciosa.** Acento virou FAIL; os 5 hist\u00f3ricos entraram em `known_debt` com motivo e data (BLW iter-03 superado pelo iter-04/05; Hair Schedule j\u00e1 submetido na 1.1.0 \u2014 n\u00e3o se mexe em metadata de app em review por ganho de ranking nulo). Arquivo NOVO com acento reprova. E o baseline **apodrece sozinho**: quitada a d\u00edvida, o eval manda remover a entrada \u2014 sen\u00e3o a lista velha vira esconderijo de regress\u00e3o nova.\n**Corol\u00e1rio de m\u00e9todo:** a camada de CONTRATO s\u00f3 prova que a regra est\u00e1 escrita; a de ARTEFATO prova o que o agente realmente faz. Foi ela que exp\u00f4s a diverg\u00eancia entre prompt e output \u2014 e a diverg\u00eancia \u00e9 o achado, independente de qual lado cede.\n**Achados colaterais** (o eval se corrigindo): `aso-extractor` mandava portar `verify_current.py --pull` \"do pipeline do Walk\" quando o template do lab j\u00e1 tem, e `aso-reporter` apontava pro meta.json do Walk como schema can\u00f4nico \u2014 as duas violam \"lab auto-contido\" (RULES). Agora apontam pro template, que ganhou `iterations/_reference/meta.json`. A invariante que devia pegar isso tinha dois buracos: o regex s\u00f3 via `Apps/\u2026` (n\u00e3o `stepsSwiftUI/\u2026` solto) e depois passou a acusar path de EXEMPLO com placeholder `<App>`; ambos cobertos por caso no meta-teste. E o falso positivo final denunciou uma pasta `aso-pipeline` vazia e \u00f3rf\u00e3 em `Apps/recovery/flutter/`, res\u00edduo de um `init.sh` rodado no diret\u00f3rio errado \u2014 removida.\n\n## 68. AlarmKit (iOS 26) N\u00c3O exige entitlement \u2014 s\u00f3 `NSAlarmKitUsageDescription` (31/08/2026 Sunrise)\nH\u00e1 relato circulando (blogs, coment\u00e1rios) de que o AlarmKit precisaria do entitlement `com.apple.developer.alarm` pedido \u00e0 Apple. **N\u00e3o precisa** \u2014 era artefato de beta. Verifica\u00e7\u00e3o decisiva feita localmente:\n- Framework presente no SDK: `.../iPhoneOS.sdk/System/Library/Frameworks/AlarmKit.framework` (`@available(iOS 26.0, *)`, module version 2303.x).\n- `grep` no Xcode 26 inteiro por `com.apple.developer.alarm` \u2192 **nada**; n\u00e3o existe capability de AlarmKit.\n- Build **Release assinado** com `generic/platform=iOS` + cloud signing pela ASC key passa, e `codesign -d --entitlements :-` no `.app` mostra s\u00f3 `application-identifier`, `aps-environment`, `team-identifier`, `get-ta[redigido]`.\n- No simulador o prompt do sistema aparece normalmente (\"agende alarmes e timers que podem reproduzir sons e aparecer na tela mesmo se um Foco estiver ativado\").\n**Receita m\u00ednima:** `NSAlarmKitUsageDescription` no Info.plist (**localizar no `InfoPlist.xcstrings`** \u2014 a string aparece DENTRO do alerta do sistema, abaixo do texto da Apple) + `AlarmManager.shared.requestAuthorization()` + `AlarmManager.shared.schedule(id:configuration:)`.\n**Duas armadilhas de integra\u00e7\u00e3o:**\n1. **O alerta do AlarmKit s\u00f3 tem Stop e Snooze.** Num app cujo diferencial \u00e9 a miss\u00e3o anti-soneca, isso deixa o user desligar sem enfrentar nada. Usar `stopIntent:` (um `LiveActivityIntent` com `openAppWhenRun = true`) pra abrir o app e RETOMAR o fluxo em vez de encerrar.\n2. **Alarme repetido tem que ser `.relative(Relative(time:repeats:.weekly([...])))`, n\u00e3o `.fixed(date)`.** Fixed cobre s\u00f3 a pr\u00f3xima ocorr\u00eancia e o alarme emudece no dia seguinte. `Locale.Weekday` \u00e9 o enum esperado (converter do Calendar-style 1=domingo).\nVale a migra\u00e7\u00e3o: a alternativa (rajada de UNNotification a cada 30s) \u00e9 silenciada por Foco e pelo bot\u00e3o de silencioso \u2014 justamente os dois estados do celular de quem est\u00e1 dormindo.\n\n## 64. \"Faz um pouco e para\" \u00e9 falta de crit\u00e9rio de pronto, n\u00e3o falta de esfor\u00e7o (31/08/2026)\nPedido amplo (\"pesquisa os apps de editor de foto do mercado e aplica no meu app\") n\u00e3o tem crit\u00e9rio de pronto. Sem crit\u00e9rio, quem executa faz o que cabe no contexto e declara feito \u2014 e o estado morre junto com a sess\u00e3o. Tr\u00eas causas, todas estruturais: (1) a tarefa nunca virou lista com `done_when` por item; (2) o estado vivia no meu contexto, n\u00e3o em disco; (3) a regra do `CLAUDE.md` que pro\u00edbe fan-out sem pedido expl\u00edcito me fazia conservar justamente onde decompor era o certo.\n**`_GambitStudio/orchestrator/`** ataca as tr\u00eas. `wo.py` guarda o work order em JSON e faz cumprir o que antes era disciplina: **`done` exige `--evidence`** (sem a prova do `done_when`, o item n\u00e3o fecha), `close` recusa com item aberto, 3 tentativas bloqueiam o item sozinho, `depends_on` ordena sem barreira global. A skill `/lab-orchestrate` decomp\u00f5e \u2192 roda em ondas de \u22644 \u2192 **verifica o `done_when` rodando o comando, n\u00e3o lendo o relato do agente** \u2192 devolve pra fila o que n\u00e3o passou. Invocar a skill \u00c9 o pedido expl\u00edcito de fan-out, contratado ali dentro em vez de reinterpretado a cada onda.\n**Rotina \u00e9 o mesmo problema com outro rel\u00f3gio.** `scan.py` roda por LaunchAgent e enfileira o que venceu, lendo s\u00f3 o que j\u00e1 est\u00e1 em disco \u2014 n\u00e3o executa, n\u00e3o chama a ASC, n\u00e3o decide produto. Na estreia achou 15: 3 checkpoints D7 vencidos, 5 apps abaixo do piso de 25 ratings, 3 itera\u00e7\u00f5es de ASO abertas desde maio sem nunca fechar, 2 apps com ASO parado h\u00e1 100 dias.\n**N\u00e3o d\u00e1 pra rodar Claude por launchd neste ambiente** \u2014 n\u00e3o existe CLI `claude` instalado (s\u00f3 a extens\u00e3o do VSCode). Por isso o desenho \u00e9 detectar-e-enfileirar, n\u00e3o executar sozinho; e \u00e9 bom que seja: o que toca a App Store continua passando pelo Jo\u00e3o.\n**Dois bugs que s\u00f3 apareceram quando rodou de verdade:** (a) `APPS.glob(\"**/aso-pipeline/...\")` varria `build/`, `DerivedData/`, `Pods/` e `SourcePackages/` de 20 apps \u2014 o job ficou em `STAT U`, sem exit, e eu quase diagnostiquei como prompt TCC (#46); `sample <pid>` mostrou `__opendir2`, n\u00e3o `tccd`. Trocado por enumera\u00e7\u00e3o expl\u00edcita: de travado indefinidamente para 0,41s. (b) `parents[3]` dava \"Dispensado\" e \"sueca\" como nome de app quando o pipeline est\u00e1 aninhado. Os dois viraram guard no teste.\n**E uma li\u00e7\u00e3o de fila:** a primeira vers\u00e3o empurrou os 15 achados pro `now.json` e o site foi de 13 pra 28 itens \u2014 fila que ningu\u00e9m l\u00ea. Agora s\u00f3 urg\u00eancia \u22643 vira item (teto 5), o resto \u00e9 uma linha de resumo, e `reviews` nunca vira item porque a coluna do Hub j\u00e1 \u00e9 essa fila. **Detector que fala demais \u00e9 ignorado igual eval que grita por nada (#62/#63).**\n\n## 69. Autonomia noturna + a revis\u00e3o que s\u00f3 o dogfooding pega (31/08/2026)\nO Jo\u00e3o pediu autonomia real e revis\u00e3o geral. O que ficou e o que apareceu:\n**Night run:** CLI `claude` instalado (`npm i -g @anthropic-ai/claude-code`); `orchestrator/night_run.sh` (LaunchAgent 3h23) executa UM work order da fila por noite via `claude -p`. As guardas valem por constru\u00e7\u00e3o, n\u00e3o por instru\u00e7\u00e3o: `--max-budget-usd` (teto de gasto), watchdog de 90 min, lock file, apps important filtrados na sele\u00e7\u00e3o, e \u2014 o mais importante \u2014 **os hooks do usu\u00e1rio valem em headless**: o release-guard responde \"ask\", e em `-p` \"ask\" = negado. Nada archive/deploya de madrugada mesmo que o prompt mande. Smoke test com budget $2 falhou de prop\u00f3sito e ensinou: **s\u00f3 o load do contexto do lab custa ~$2 por invoca\u00e7\u00e3o fria** \u2014 budget noturno \u00fatil come\u00e7a em ~$10.\n**Decomposi\u00e7\u00e3o autom\u00e1tica:** o hook `ta[redigido].sh` (UserPromptSubmit) detecta pedido amplo sem lista (\"pesquisa X e aplica no meu app\") e injeta a instru\u00e7\u00e3o de decompor em work order ANTES de executar. Calibrado com frases reais (7 que disparam, 13 que n\u00e3o podem) em `test_decompose_guard.py` \u2014 falso positivo em hook de prompt \u00e9 atrito em TODA mensagem.\n**Colis\u00e3o de numera\u00e7\u00e3o NESTE arquivo:** duas sess\u00f5es de 31/08 escreveram `## 62-65` ao mesmo tempo. Renumerei (Sunrise \u2192 65-68, hist\u00f3ricos com sufixo b/c/d mantendo o n\u00famero-base que as refer\u00eancias usam) e o scan ganhou o detector `learnings_dup`. Corol\u00e1rio: **arquivo append-only compartilhado entre sess\u00f5es concorrentes precisa de detector de colis\u00e3o, n\u00e3o de conven\u00e7\u00e3o.**\n**A revis\u00e3o em si (work order `2026-08-31_revis\u00e3o-geral-do-lab`, executada com o pr\u00f3prio fluxo):** (a) 21 refer\u00eancias quebradas nos docs sempre-carregados \u2014 paths `searchads/` que viraram `apple-ads/`, `asc_api.py` que virou `asc/api_client.py`, skills `/verify` e `/review` que n\u00e3o existem mais, `_archive/` deletado, \"AppCreator\" fantasma; (b) **`Apps/intermediate/` existia em disco com 3 apps (Cronogram-Capilar, WTMP, blw) e NENHUM doc conhecia a categoria** \u2014 nem o scan varria, ent\u00e3o checkpoint vencido do blw era invis\u00edvel pra rotina. Docs, `scan.py` e `evals` atualizados. (c) settings.json: 51\u219233 permissions (3 perigosas com wildcard no meio \u2014 o pr\u00f3prio CLI avisou \u2014 e 15 mortas de sess\u00f5es antigas), 4 `additionalDirectories` inexistentes. **Regra que fica: doc sempre-carregado desatualizado \u00e9 pior que ausente** \u2014 vai pro contexto de TODA sess\u00e3o afirmando coisa errada com autoridade.\n\n## 65b. appStoreVersion criada por API: age rating 2026 (8 campos novos) e localizations que n\u00e3o herdam (01/09/2026 Truco)\nSubmeter uma vers\u00e3o criada via `POST /v1/appStoreVersions` num app cuja \u00faltima review \u00e9 antiga esbarra em DUAS coisas que o web UI esconde:\n1. **O question\u00e1rio de age rating ganhou 8 campos obrigat\u00f3rios** (2026): `ageAssurance`, `messagingAndChat`, `userGeneratedContent`, `healthOrWellnessTopics`, `advertising`, `lootBox`, `parentalControls` (BOOLEAN) e `gunsOrOtherWeapons` (ENUM \"NONE\"/...). Sem eles o `POST reviewSubmissionItems` d\u00e1 409 com associatedErrors apontando `/v1/ageRatingDeclarations/<id-da-VERS\u00c3O>` \u2014 **mas esse id \u00e9 enganoso**: o PATCH real \u00e9 no `ageRatingDeclaration` do **appInfo edit\u00e1vel** (`GET /v1/appInfos/{id}/ageRatingDeclaration` \u2192 PATCH nesse id). Pegadinha dupla: o erro de TIPO (409) valida antes da resolu\u00e7\u00e3o do id \u2014 d\u00e1 pra \"acertar\" os tipos num recurso que nem existe; e o GET do subrecurso da vers\u00e3o devolve data null.\n2. **A vers\u00e3o nova N\u00c3O herda todas as localizations** \u2014 o Truco 47 nasceu com 3 de 7 (s\u00f3 as que tinham keywords? pt-BR/es). As `en-*` precisaram de POST, e localization criada por POST exige `description` + `supportUrl` no corpo (ou a submiss\u00e3o reprova com \"You must provide a value\") \u2014 copiar da vers\u00e3o live.\nB\u00f4nus do mesmo ciclo: **substituir uma submiss\u00e3o WAITING_FOR_REVIEW por um build melhor \u00e9 limpo** enquanto a review n\u00e3o come\u00e7ou: PATCH `canceled:true` (estado CANCELING\u2192 vers\u00e3o volta edit\u00e1vel em ~20s) \u2192 PATCH versionString+build \u2192 nova reviewSubmission+item+submitted. A metadata (keywords/notes/age rating) vive na VERS\u00c3O e sobrevive \u00e0 troca.\n\n## 70. Archive de app CocoaPods legado (Pods committados, pbxproj de CI antigo) \u2014 3 muros em sequ\u00eancia (02/09/2026 Foguetinho)\nPadr\u00e3o #0b de novo: cada fix destrava o muro seguinte. Ordem real no Foguetinho 12.0.1:\n1. **Arquivo no disco fora do target.** Sess\u00e3o antiga de prints editou o `AppDelegate.swift` (committado) referenciando `ScreenshotMode.swift` que ficou untracked e NUNCA entrou no pbxproj \u2014 o repo n\u00e3o builda desde ent\u00e3o. Em projeto sem xcodegen, adicionar via gem `xcodeproj` (`group.new_file` + `target.add_file_references`). Regra: **sanity build ANTES de mexer em vers\u00e3o/archive** \u2014 o muro aparece em 2 min em vez de no meio do release.\n2. **Signing Manual pinado do CI morto.** `CODE_SIGN_STYLE = Manual` + `PROVISIONING_PROFILE_SPECIFIER = \"... CI ...\"` + identity \"Apple Distribution\" no Release \u2192 archive local falha com \"No signing certificate iOS Distribution found\" mesmo com `-allowProvisioningUpdates`. Fix SEM editar o pbxproj: sobrescrever na linha de comando `CODE_SIGN_STYLE=Automatic PROVISIONING_PROFILE_SPECIFIER= CODE_SIGN_IDENTITY=\"Apple Development\"` \u2014 o exportArchive app-store re-assina com distribution via cloud signing normalmente.\n3. **Embed frameworks: `rsync ... (l)stat: No such file or directory` num framework de Pod.** CocoaPods 1.11 + Xcode 26: o framework em `BUILT_PRODUCTS_DIR/<Pod>/<Pod>.framework` durante archive \u00e9 um **symlink RELATIVO** pra `IntermediateBuildFilesPath/UninstalledProducts/iphoneos/...`, e o `install_framework()` do `Pods-<App>-frameworks.sh` faz `source=\"$(readlink \"${source}\")\"` cru \u2014 o path relativo n\u00e3o resolve do cwd do script e o rsync morre. N\u00c3O \u00e9 race (clean/re-run n\u00e3o muda). **Fix: `readlink -f`** na linha do `source=` (patch in-place no script committado, mesma fam\u00edlia de patches de Pods do #0b). O framework EXISTIR no UninstalledProducts com o erro dizendo que n\u00e3o existe \u00e9 a assinatura do bug.\n\n## 71. Notifica\u00e7\u00e3o local em FOREGROUND no iOS 14+: sem `presentBanner`/`presentList` o sistema posta com destinations VAZIO \u2014 e tap na cover sheet do sim \u00e9 inalcan\u00e7\u00e1vel por driver sint\u00e9tico (02/09/2026 philos)\nFeature de cita\u00e7\u00e3o di\u00e1ria (flutter_local_notifications 18): a notifica\u00e7\u00e3o agendada disparava (syslog do SpringBoard: \"Posting notification ... section com.gambitstudio.philos\") mas **nenhum banner aparecia com o app em foreground** \u2014 a linha do log mostra `destinations: [ ]` vazio. Causa: no iOS 14+ a apresenta\u00e7\u00e3o em foreground usa `.banner`/`.list`; `DarwinNotificationDetails(presentAlert: true)` sozinho \u00e9 o par DEPRECATED e vira op\u00e7\u00e3o nenhuma. **Sempre setar `presentBanner: true, presentList: true` al\u00e9m do presentAlert** no details de cada notifica\u00e7\u00e3o. Com o app em BACKGROUND o sistema apresenta sem consultar o app \u2014 por isso o bug s\u00f3 aparece em foreground (e o QA que s\u00f3 testa com app fechado n\u00e3o pega).\n**Diagn\u00f3stico que funciona:** `simctl spawn <UD> log stream --predicate 'eventMessage CONTAINS[c] \"<bundle>\"'` \u2014 a linha `Posting notification ... destinations: [...]` diz exatamente onde o iOS ia desenhar. E \"Load N pending notification dictionaries\" confirma a fila (45 agendadas \u2192 44 ap\u00f3s o disparo).\n**Tap na notifica\u00e7\u00e3o (cover sheet/banner do SpringBoard) no sim iOS 18.5: NENHUM driver sint\u00e9tico alcan\u00e7a** \u2014 Maestro n\u00e3o v\u00ea o texto (hierarquia do SpringBoard invis\u00edvel), tap por ponto do Maestro e do idb n\u00e3o abrem, e at\u00e9 cliclick na janela do Simulator falhou nesta sess\u00e3o. Validar o deep-link do lado do APP com um QA hook `kDebugMode` (pref `debug_tap_quote` semeada no plist do container \u2192 init trata como payload de launch \u2192 mesma rota do tap real); o transporte do tap \u00e9 do plugin/OS. Padr\u00e3o de seed de prefs Flutter: keys com prefixo `flutter.` e PlistBuddy exige escapar o ponto (`:flutter\\.notification_hour`), depois `kill -9` no cfprefsd do sim.\n\n## 72. Cota de modelo estourada mata a noite inteira em 2 minutos \u2014 sem `--model` e sem detec\u00e7\u00e3o, o loop roda a seco (03/09/2026)\nPrimeira madrugada do regime de ondas (6h30, 4 planners): o log mostrou `2 work order(s), 4 planner(s)` \u2014 parecia trabalho. N\u00e3o foi: **toda** invoca\u00e7\u00e3o do `claude -p` respondeu `You've reached your Fable 5 limit` em ~30s e retornou 0. O loop interpretou \"terminou sem progresso\", aplicou a skip-list, gastou os 4 planners em 2 minutos e encerrou \u00e0s 01h34. Nada foi tocado; o release do Peptide 1.1.2 que estava `doing` morreu no meio.\n**Tr\u00eas defeitos somados:** (1) o `claude -p` n\u00e3o passava `--model`, ent\u00e3o usava o default da conta \u2014 justamente o que estourou; (2) exit code 0 numa invoca\u00e7\u00e3o que n\u00e3o fez nada \u00e9 indistingu\u00edvel de trabalho leg\u00edtimo, e o anti-loop por progresso \"puniu\" o work order com skip; (3) n\u00e3o havia sinal nenhum de manh\u00e3 \u2014 o Jo\u00e3o veria o log dizendo \"2 work orders\" e acreditaria.\n**Fix:** `NIGHT_MODELS=\"opus sonnet\"` com fallback em cascata; `run_claude` marca a posi\u00e7\u00e3o no log ANTES da invoca\u00e7\u00e3o e faz `grep -qi \"reached your .* limit\\|usage limit reached\"` s\u00f3 no trecho novo, retornando 42; o loop com 42 **n\u00e3o** conta tentativa nem planner e re-tenta o MESMO alvo no modelo seguinte; se todos esgotarem, a noite aborta e escreve item no `now.json` (o site \u00e9 a fila do Jo\u00e3o, log n\u00e3o \u00e9).\n**Bug que o teste pegou na hora:** `before_lines=$(wc -l < \"$LOG\")` no macOS devolve com espa\u00e7os e `tail -n +0` \u00e9 inv\u00e1lido (`illegal offset`) \u2014 a detec\u00e7\u00e3o jamais dispararia e o fix seria placebo. Correto: `$(( $(wc -l < \"$LOG\") + 1 ))`, que trima e garante offset \u22651.\n**Regra geral:** detector de falha externa precisa de **caso negativo no teste** \u2014 \"Rate limit do ASC: user-hour-rem 3200\", \"atingiu o limite de 5 tentativas\" e \"preflight LIBERADO\" N\u00c3O podem casar, sen\u00e3o um falso positivo aborta a madrugada inteira (mesma fam\u00edlia do #62/#63: or\u00e1culo falso \u00e9 pior que nenhum).\n\n## 73. Screenshot de vers\u00e3o PUBLICADA \u00e9 IMUT\u00c1VEL \u2014 refresh de prints exige SEMPRE uma vers\u00e3o edit\u00e1vel (03/09/2026 Neon)\nTentei trocar os 5 prints da p\u00e1gina padr\u00e3o do Neon (v26, `READY_FOR_SALE` desde a manh\u00e3) e **todo `DELETE /v1/appScreenshots/{id}` respondeu 409**:\n```\n\"code\" : \"STATE_ERROR\",\n\"detail\" : \"Can't Delete Screenshot After Submit for review appScreenshots\"\n```\nVale pra TODOS os sets da vers\u00e3o, em todos os locales e display types \u2014 a Apple congela os assets no momento em que a vers\u00e3o \u00e9 submetida, e o congelamento n\u00e3o \u00e9 liberado quando ela \u00e9 aprovada. N\u00e3o existe rota de API pra editar print de vers\u00e3o viva (nem PATCH, nem recriar o set: o `appScreenshotSet` da vers\u00e3o publicada tamb\u00e9m n\u00e3o aceita write).\n\n**Consequ\u00eancia pr\u00e1tica \u2014 planejar \"os prints sobem quando a vers\u00e3o X aprovar\" \u00e9 imposs\u00edvel por constru\u00e7\u00e3o.** Foi exatamente o plano que uma sess\u00e3o anterior deixou registrado no relat\u00f3rio do Neon (\"prints code-driven renderizados, sobem quando a 26 aprovar\"): no instante em que a 26 aprova, os prints dela ficam imut\u00e1veis. O refresh de prints **sempre** entra numa vers\u00e3o NOVA, e o ciclo \u00e9 o da review \u2014 n\u00e3o d\u00e1 pra tratar print como metadata quente (keywords/description, que tamb\u00e9m vivem na vers\u00e3o, mas ao menos s\u00e3o edit\u00e1veis enquanto a vers\u00e3o est\u00e1 em prepara\u00e7\u00e3o).\n\n**Fluxo correto pra trocar prints de app que j\u00e1 est\u00e1 na loja:**\n1. `POST /v1/appStoreVersions` (versionString novo) \u2192 nasce `PREPARE_FOR_SUBMISSION` e **herda as 39 localizations e os sets da vers\u00e3o anterior** (com os prints ANTIGOS clonados dentro \u2014 reconciliar por `sourceFileChecksum`, LEARNINGS #26/#35).\n2. Reconciliar cada set na vers\u00e3o nova: deletar o que n\u00e3o bate o md5 local, subir o que falta, PATCH da ordem 01..05.\n3. A vers\u00e3o nova precisa de **build novo** pra ser submetida (build j\u00e1 associado a vers\u00e3o lan\u00e7ada n\u00e3o reaproveita \u2014 LEARNINGS #44). Ou seja: **print novo custa um release**, sempre.\n4. S\u00f3 quando essa vers\u00e3o for aprovada os prints entram no ar.\n\n**Corol\u00e1rio de leitura de dados:** medir efeito de print novo contra o PV/imp anterior s\u00f3 faz sentido a partir do dia em que a vers\u00e3o que os carrega fica `READY_FOR_SALE` \u2014 antes disso a p\u00e1gina viva ainda \u00e9 a antiga e qualquer varia\u00e7\u00e3o \u00e9 ru\u00eddo.\n\n**Detec\u00e7\u00e3o barata (fazer ANTES de renderizar 80 PNGs):** `GET /v1/apps/{id}/appStoreVersions` e procurar vers\u00e3o cujo `appStoreState` N\u00c3O esteja em `{READY_FOR_SALE, REPLACED_WITH_NEW_VERSION, PENDING_APPLE_RELEASE, PENDING_DEVELOPER_RELEASE}`. N\u00e3o existindo, o upload vai falhar \u2014 crie a vers\u00e3o primeiro. Implementado em `Apps/recovery/ios/AirDraw/AirDraw/screenshots-tool/tools/stage_version.py` (`--create`) e o `upload_prints.py` do mesmo diret\u00f3rio j\u00e1 mira a vers\u00e3o edit\u00e1vel e recusa rodar sem ela, com a mensagem apontando o script.\n\n**B\u00f4nus do mesmo ciclo \u2014 quais locales realmente precisam de print:** s\u00f3 os que T\u00caM `appScreenshotSets` pr\u00f3prios; os demais herdam o prim\u00e1rio. No Neon eram 8 de 39 (en-US/GB/AU/CA, pt-BR/PT, es-ES/MX) \u00d7 `APP_IPHONE_67` + `APP_IPHONE_65`. Renderizar os 39 seria 5\u00d7 trabalho jogado fora \u2014 e cobrir s\u00f3 o 6.9\" deixaria o 6.5\" (o tamanho que a UI da ASC mostra no preview) com a arte velha, LEARNINGS #35 UPDATE 2.\n\n## 74. NUNCA desinstalar app do device do Jo\u00e3o \u2014 apaga os dados dele junto (03/09/2026 Cronos)\nTroquei o \u00edcone do Cronos e, pra \"garantir\" que o \u00edcone novo aparecesse, rodei `devicectl device uninstall app` antes de reinstalar \u2014 duas vezes. **O uninstall apaga o container inteiro**, e o Cronos guarda as tarefas em `Documents/Checklists.plist`. O Jo\u00e3o perdeu tudo que tinha cadastrado, no aparelho dele, em app que ele usa de verdade.\n**O pior: era desnecess\u00e1rio.** O cache teimoso do iOS \u00e9 o da LAUNCH SCREEN (`SplashBoard/Snapshots`, LEARNINGS #65) \u2014 **\u00edcone atualiza normalmente com install por cima**. Apliquei a receita do problema errado e paguei com dado de usu\u00e1rio.\n**Regra dura:** em device F\u00cdSICO do Jo\u00e3o, `install` por cima, sempre. `uninstall`/`simctl erase`/apagar container s\u00f3 em SIMULADOR, ou no device com autoriza\u00e7\u00e3o expl\u00edcita dele para aquele app naquele momento. Se um cache realmente exigir estado limpo no device, o caminho \u00e9: (a) confirmar que \u00e9 cache de splash e n\u00e3o de \u00edcone; (b) pedir autoriza\u00e7\u00e3o dizendo QUE DADOS ser\u00e3o perdidos; (c) exportar os dados antes, se o app tiver export.\n**Corol\u00e1rio de produto:** um app de tarefas sem backup nenhum transforma qualquer reinstala\u00e7\u00e3o (minha, ou do pr\u00f3prio usu\u00e1rio trocando de aparelho) em perda total. Todo app do lab que guarda dado do usu\u00e1rio s\u00f3 em `Documents/` precisa de rota de recupera\u00e7\u00e3o \u2014 export/import no m\u00ednimo, iCloud KV quando o dado for pequeno (`NSUbiquitousKeyValueStore` sobrevive ao uninstall, ao contr\u00e1rio de `Documents/` e de `UserDefaults`).\n\n## 75. iCloud KV Store \u00e9 a rota barata de backup (sem container, sem portal) \u2014 e o simulador N\u00c3O consegue prov\u00e1-la (03/09/2026 Cronos)\nResposta ao corol\u00e1rio do #74. `NSUbiquitousKeyValueStore` sobrevive ao uninstall e custa quase nada \u2014 mas tr\u00eas coisas s\u00f3 apareceram fazendo:\n1. **N\u00e3o precisa de container, e a API resolve 100%.** O LEARNINGS #3 (\"iCloud no v1 n\u00e3o vale a pena\") \u00e9 sobre **CloudKit container + App Group**, que a API n\u00e3o cria. O KV Store usa s\u00f3 `com.apple.developer.ubiquity-kvstore-identifier = $(TeamIdentifierPrefix)$(CFBundleIdentifier)`. `POST /v1/bundleIdCapabilities` com `ICLOUD` **cru d\u00e1 409** (`cannot have the CloudkitVersion 'null'`); com `settings:[{key:\"ICLOUD_VERSION\",options:[{key:\"XCODE_6\"}]}]` passa (201). Depois disso o perfil vem com `ubiquity-container-identifiers` = **array VAZIO** e `ubiquity-kvstore-identifier` = `TEAM.*` \u2014 confirmando que n\u00e3o h\u00e1 container pra criar no portal.\n2. **Sem conta iCloud logada, o KV store ACEITA a escrita e a joga fora \u2014 silenciosamente.** No simulador (nenhuma conta) `set` + `synchronize()` retornam normal e a leitura de volta vem **0 bytes**; no iPhone com conta, `read back` == bytes escritos. Ou seja **\"escrevi N bytes\" n\u00e3o prova nada**: logar a leitura de volta (`store.data(forKey:)?.count`) + `FileManager.default.ubiquityIdentityToken != nil` \u00e9 o que separa mirror vivo de mirror morto. Consequ\u00eancia de m\u00e9todo: o ciclo desinstalar\u2192reinstalar no simulador prova a L\u00d3GICA, nunca o TRANSPORTE. Pra provar a l\u00f3gica sem conta, abstrair o store atr\u00e1s de um protocolo e injetar um stub em arquivo FORA do container (`-CronosCloudStubPath`, `#if DEBUG`) \u2014 o app do simulador escreve em path do host sem problema de sandbox.\n3. **Regras de dados que o desenho tem que ter** (o app de tarefas \u00e9 o caso, mas vale pra qualquer espelho): nuvem vazia NUNCA apaga disco cheio (as duas hip\u00f3teses \u2014 \"nada foi espelhado ainda\" e \"o usu\u00e1rio apagou tudo\" \u2014 s\u00e3o indistingu\u00edveis do lado do leitor); conflito por `updatedAt` que o APP escreve (n\u00e3o timestamp de servidor), sen\u00e3o o eco da pr\u00f3pria escrita volta parecendo mais novo; `updatedAt` local em `UserDefaults` **de prop\u00f3sito**, porque some no uninstall e faz a nuvem ganhar sozinha no reinstall; escrever o carimbo **por \u00faltimo** (chaves chegam independentes: payload novo com stamp velho \u00e9 ignorado, o inverso adota lixo); e conferir o teto de 1 MB **antes** de gravar, mantendo o \u00faltimo snapshot bom em vez de apag\u00e1-lo.\n**Formato do payload: JSON versionado, NUNCA o blob do `NSKeyedArchiver`.** O keyed archive carrega o nome do M\u00d3DULO nas classes (`Cronos.Checklist`), ent\u00e3o outro cliente \u2014 o app de Mac que o Jo\u00e3o quer, ou o pr\u00f3prio app depois de um rename (este j\u00e1 foi `Eisenhower`) \u2014 precisa redeclarar as classes com o mesmo m\u00f3dulo pra ler (a dor do `setClassName` do #47). Com `schemaVersion` no topo e a regra \"schema MAIOR n\u00e3o \u00e9 adotado nem sobrescrito\", o lado velho n\u00e3o apaga o novo em sil\u00eancio; guardar os campos desconhecidos (topo e por item) e devolv\u00ea-los na pr\u00f3xima escrita fecha o resto.\n**Pegadinha de projeto legado:** este `.xcodeproj` n\u00e3o tinha `SWIFT_ACTIVE_COMPILATION_CONDITIONS`, ent\u00e3o **`#if DEBUG` era sempre falso em Swift** e todo o harness de teste sumia do bin\u00e1rio compilando verde. Sintoma: o flag de launch n\u00e3o fazia nada e nenhum log aparecia. Conferir `grep SWIFT_ACTIVE_COMPILATION_CONDITIONS project.pbxproj` antes de confiar em qualquer `#if DEBUG` em app antigo.\n\n## 75b. Segundo cliente de um espelho iCloud KVS: o balde \u00e9 derivado do bundle id, e uma nuvem VAZIA nunca propaga um \"apaguei tudo\" (03/09/2026 Cronos Mac)\nConstruir o app de Mac do Cronos contra o mesmo `NSUbiquitousKeyValueStore` que o iPhone j\u00e1 escrevia (#75) exp\u00f4s tr\u00eas coisas que valem pra qualquer par iOS+macOS:\n1. **`com.apple.developer.ubiquity-kvstore-identifier` \u00e9 derivado do bundle id** (`$(TeamI
