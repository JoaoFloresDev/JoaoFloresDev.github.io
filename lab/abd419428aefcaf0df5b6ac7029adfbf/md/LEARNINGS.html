<body><div class="wrap"><p class="sub" style="font-size:12px;margin:0 0 14px">Exportado em 2026-10-01 10:08 · fonte: Lab Hub local</p><p class="sub"><a href="../index.html">← hub</a> · <code>_GambitStudio/LEARNINGS.md</code></p><div id="md"></div><script>const RAW="# LEARNINGS \u2014 Coisas que j\u00e1 machucaram, N\u00c3O repetir\n\n> **Este arquivo N\u00c3O \u00e9 mais auto-loaded** (220 KB). O que carrega em toda sess\u00e3o \u00e9 o `LEARNINGS-INDEX.md` (1 linha por item); aqui se l\u00ea sob demanda com `grep -n '^## N'` + Read com offset/limit.\n> **Ao adicionar um item aqui, adicione a linha dele no `LEARNINGS-INDEX.md` no mesmo edit** \u2014 o detector `learnings_index` do `orchestrator/scan.py` acusa heading sem linha.\n\n> Cada item aqui representa horas de tempo perdido em sess\u00f5es anteriores. Leia ANTES de cada app novo. Quando o user pedir algo que est\u00e1 aqui, v\u00e1 direto pra solu\u00e7\u00e3o conhecida.\n\n---\n\n## 0. ARCHIVE \u2014 padr\u00e3o atual (2026-08-30): LOCAL com Xcode 26.x + ASC API key \u26a0\ufe0f\n\n**Decis\u00e3o do Jo\u00e3o (30/08/2026): \"segue com archive local, n\u00e3o vou pagar o git.\"** O billing do GitHub Actions travou (runs em `startup_failure`, LEARNINGS #61) e n\u00e3o vai ser regularizado. Padr\u00e3o de release do lab a partir daqui:\n1. `xcodebuild archive` com o Xcode mais novo instalado (`DEVELOPER_DIR=\"/Applications/Xcode 2.app/Contents/Developer\"`, 26.1 hoje \u2014 a Apple exige SDK atual, por isso o Xcode N\u00c3O pode ficar velho), `-destination 'generic/platform=iOS'`, assinatura por **cloud signing com a API key**: `-allowProvisioningUpdates -authenticationKeyPath [chave] -authenticationKeyID [key id] -authenticationKeyIssuerID [issuer]` (esse Xcode n\u00e3o tem conta Apple ID logada).\n2. **Checklist no Info.plist COMPILADO** (`<archive>/Products/Applications/<App>.app/Info.plist`, LEARNINGS #52): `CFBundleIconName` raiz E aninhado, `CFBundleShortVersionString`/`CFBundleVersion` na conven\u00e7\u00e3o do app, `ITSAppUsesNonExemptEncryption`, `UILaunchStoryboardName`; `xcrun assetutil --info Assets.car` com o AppIcon (LEARNINGS #32).\n3. `xcodebuild -exportArchive` m\u00e9todo app-store com a mesma API key (destination upload) ou `altool --upload-app --apiKey [key id] --apiIssuer ...`. dSYMs do Crashlytics \u00e0 m\u00e3o se o app tiver.\n4. Confirmar materializa\u00e7\u00e3o: `GET /v1/builds?filter[app]=<id>&sort=-uploadedDate` at\u00e9 `VALID` (~5-15 min). A\u00ed anexar \u00e0 vers\u00e3o e submeter via API.\n5. Tag `release/N` continua sendo criada e pushada (hist\u00f3rico), mas ningu\u00e9m espera o run.\nRefer\u00eancias vivas: College 1.7.0 (30/08), Hair Schedule 1.1.0 (27/08), BLW 1.5.3 (30/08). O texto abaixo \u00e9 o padr\u00e3o ANTIGO (pipeline), mantido pelo contexto dos outros learnings.\n\n### (antigo) Archive via GitHub Actions pipeline\n\n> **UPDATE 30/08/2026:** GitHub Actions da conta est\u00e1 TRAVADO por billing e o Jo\u00e3o decidiu N\u00c3O pagar. Enquanto isso, **archive = LOCAL com Xcode 26.1** (`/Applications/Xcode 2.app`, cloud signing pela API key) \u2014 funcionou no Hair Schedule e no BLW 1.5.3. Checklist obrigat\u00f3rio pr\u00e9-upload no LEARNINGS #52 (CFBundleIconName na raiz do plist COMPILADO). O texto abaixo continua v\u00e1lido se o billing voltar um dia.\n\n**NUNCA rode `xcodebuild archive` localmente pra subir pro App Store Connect.** Sempre via pipeline GitHub Actions (`.github/workflows/archive-upload.yml`), tag `release/X.Y.Z`.\n\n**Por qu\u00ea:**\n- Apple sobe a barra do SDK frequentemente (ex: 2026 exige Xcode 26 / iOS 26 SDK). Xcode local desatualiza, runner `macos-15` da GitHub Actions sempre tem o Xcode mais recente.\n- Tentar arquivar local com Xcode 16 \u2192 upload retorna `STATE_ERROR.VALIDATION_ERROR: SDK version issue`.\n- Pipeline j\u00e1 tem todos os secrets configurados (`APP_STORE_CONNECT_ISSUER_ID`, `KEY_ID`, `PRIVATE_KEY`) e roda `archive` + `exportArchive` + upload automaticamente.\n\n**Fluxo correto sempre:**\n1. C\u00f3digo pronto, build local OK pra sanity check\n2. `git push origin main`\n3. `git tag release/X.Y.Z && git push origin release/X.Y.Z`\n4. Pipeline triggera, archive + upload em ~10min\n5. Build aparece em ASC \"Processing\"\n\n**Quando setar isso:** Phase 3 (Foundation) do `/create-ios-app` J\u00c1 tem `.github/workflows/archive-upload.yml` no template. Sempre criar GitHub repo + secrets + workflow na fase 3.\n\nSe cair num projeto sem pipeline: `gh repo create` + criar workflow + `gh secret set` antes de tentar archive.\n\n### SPM packages \u2014 SEMPRE apontar pro repo remoto, NUNCA path local\n\n**Regra:** `project.yml` de TODO app aponta pros pacotes via `url:` + `branch: main`, N\u00c3O via `path:`.\n\n```yaml\npackages:\n  GambitCoreKit:\n    url: https://github.com/JoaoFloresDev/GambitCoreKit.git\n    branch: main\n  OnboardingKit:\n    url: https://github.com/JoaoFloresDev/OnboardingKit.git\n    branch: main\n  PaywallKit:\n    url: https://github.com/JoaoFloresDev/PaywallKit.git\n    branch: main\n```\n\n**Por qu\u00ea:** garante que o build que o dev testa local \u00e9 **id\u00eantico** ao build que vai pro App Store. Path local resolve pra HEAD do monorepo (estado n\u00e3o commitado, work-in-progress), mas o CI clona s\u00f3 o app \u2014 diverg\u00eancia silenciosa entre o que dev validou e o que sobe. Apontando ambos pro remoto branch `main`, single source of truth.\n\n**Fluxo pra evoluir um pacote shared:**\n1. Mexer em `_GambitStudio/packages/<Kit>/` local\n2. `cd _GambitStudio/packages/<Kit> && git add . && git commit && git push origin main`\n3. Em cada app: `File \u2192 Packages \u2192 Update to Latest Package Versions` no Xcode (ou `xcodebuild -resolvePackageDependencies`) pra refresh\n\nPacotes precisam ser repos GitHub **P\u00daBLICOS** (SPM sem auth no CI). Atuais: GambitCoreKit, OnboardingKit, PaywallKit (criados 2026-05 via `gh repo create`). Adicionar pacote novo: cria repo, push tag, push `main`, referencia via URL no project.yml.\n\n---\n\n## 0b. App legado (CocoaPods) \u2192 archive via pipeline: 3 muros que aparecem em sequ\u00eancia\n\nAo arquivar um app legado (ex: iPhotos, CocoaPods, repo pr\u00f3prio) pela pipeline com runner Xcode 26 / iOS 26 SDK, os erros aparecem **um de cada vez** (cada fix destrava o pr\u00f3ximo). Ordem real (iPhotos, jun/2026):\n\n1. **Compila\u00e7\u00e3o \u2014 `AssetsLibrary` removido no SDK iOS 26.** Qualquer `import AssetsLibrary` / `#import <AssetsLibrary/AssetsLibrary.h>` / `ALAsset*` quebra com \"'ALAssetsLibrary' is unavailable\" + \"failed to build module 'AssetsLibrary'\". Compila local no Xcode 16 (ainda tem o framework) mas quebra no runner. Fix: achar TODOS os imports reais (`grep -rn \"import AssetsLibrary\\|<AssetsLibrary\\|ALAsset\"`), e: (a) remover import solto; (b) trocar save antigo `ALAssetsLibrary writeImageDataToSavedPhotosAlbum` \u2192 `PHPhotoLibrary performChanges` + `PHAssetCreationRequest addResourceWithType:`; (c) libs mortas (ex: TZImagePickerController) \u2192 remover do target via gem `xcodeproj` (n\u00e3o basta remover o import; o .m usa AL inteiro); (d) tirar import morto do bridging header. Confirmar qual bridging header \u00e9 o ATIVO (`grep SWIFT_OBJC_BRIDGING_HEADER` no pbxproj) \u2014 pode ter v\u00e1rios, s\u00f3 1 conta.\n\n2. **Archive \u2014 \"maximum number of certificates\".** `-allowProvisioningUpdates` n\u00e3o cria cert novo porque a conta atingiu o limite de Development certs (CI antigos acumulam certs \"Created via API\"). Fix: listar `GET /v1/certificates`, **revogar os \"Created via API\" Development** (DELETE /v1/certificates/{id}) \u2014 manter os nomeados do Mac do dev + o IOS_DISTRIBUTION. Libera slots pro cloud-signing. (Scripts: `/tmp/list_certs.py`, `/tmp/revoke_certs.py`, JWT ES256 com a [chave].)\n\n3. **Upload \u2014 valida\u00e7\u00e3o.** Dois cl\u00e1ssicos: (a) **`UILaunchStoryboardName` com `.storyboard` no valor** (\"LaunchScreen.storyboard\" em vez de \"LaunchScreen\") \u2192 \"Because your app supports Multitasking on iPad, you need to include the LaunchScreen.storyboard\". Fix: `PlistBuddy -c \"Set :UILaunchStoryboardName LaunchScreen\"`. (b) **CFBundleShortVersionString n\u00e3o maior que a vers\u00e3o aprovada** \u2014 o `MARKETING_VERSION` do repo pode estar DEFASADO vs a App Store (repo dizia 20, store j\u00e1 tinha 26). O erro diz a vers\u00e3o aprovada: subir acima dela. Sempre conferir a vers\u00e3o real na store, n\u00e3o confiar no pbxproj.\n\n**Workflow CocoaPods (sem `pod install` no CI):** se `Pods/` \u00e9 committado (gitignore com `# Pods/` comentado), N\u00c3O rodar `pod install` no runner \u2014 checkout usa os Pods committados e **preserva patches in-place de Pods** (ex: CLImageEditor). Workflow: checkout \u2192 select Xcode 26 \u2192 write API key \u2192 `xcodebuild archive -workspace X.xcworkspace -scheme X` (scheme tem que estar SHARED em xcshareddata) \u2192 exportArchive app-store. Repo root = pasta do app (sem working-directory). Re-rodar mesmo commit ap\u00f3s fix de infra (ex: revogar cert): `gh run rerun <id>` (n\u00e3o precisa novo tag); fix de c\u00f3digo precisa novo commit + tag.\n\n---\n\n## 1. App Store Connect API \u2014 o que ELA N\u00c3O FAZ\n\nApple deliberadamente bloqueia certas opera\u00e7\u00f5es via API p\u00fablica. **N\u00c3O desperdice tempo tentando contornar.**\n\n| Opera\u00e7\u00e3o | API permite? | Solu\u00e7\u00e3o |\n|---|---|---|\n| `POST /v1/bundleIds` (registrar Bundle ID) | \u2705 SIM | Use `register-bundle-id.py` |\n| `POST /v1/bundleIdCapabilities` (ativar HEALTHKIT/APP_GROUPS/etc.) | \u2705 SIM | Use `enable-bundle-capability.py` |\n| `POST /v1/appGroups` (criar App Group resource) | \u274c N\u00c3O (404) | **Portal manual:** developer.apple.com/account/resources/identifiers/applicationGroup/add |\n| `POST /v1/cloudContainers` (criar iCloud Container) | \u274c N\u00c3O (404) | **Portal manual:** developer.apple.com/account/resources/identifiers/cloudContainer/add |\n| `POST /v1/apps` (criar app no ASC) | \u274c N\u00c3O (403 FORBIDDEN) | **Web UI manual:** appstoreconnect.apple.com/apps \u2192 + App |\n| Atribuir App Group ao Bundle ID (Configure) | \u274c N\u00c3O | Web UI: clica no Bundle ID \u2192 Capabilities \u2192 App Groups \u2192 Configure |\n| Atribuir iCloud Container ao Bundle ID | \u274c N\u00c3O | Mesma coisa via web UI |\n| `fastlane deliver` em PPO (Product Page Optimization) | \u274c N\u00c3O | Use Python direto via ASC REST API (`upload_ppo.py`) |\n| Submit for Review final | \u26a0\ufe0f \u00c0S VEZES | Quase sempre deixar pro web UI \u2014 manual approval gates |\n| `App Privacy questionnaire` | \u274c N\u00c3O | Web UI obrigat\u00f3rio antes do submit |\n| `Pricing tier` | \u274c N\u00c3O | Web UI: Pricing and Availability |\n| `Content rights checkbox` | \u274c N\u00c3O | Web UI |\n| `POST /v1/subscriptions` (criar subscription shell) | \u2705 SIM | Cria com state `MISSING_METADATA`. Funciona: name, productId, subscriptionPeriod, group |\n| `POST /v1/subscriptionPromotionalOffers` (oferta promocional) | \u2705 SIM | Aceita os ~175 `winBackOfferPrices`/prices inline num \u00daNICO request (refs `${p0}` + included com territory + subscriptionPricePoint via equalizations). Sem review. Mas s\u00f3 compra com assinatura JWS in-app (In-App Purchase Key) \u2014 in\u00fatil sem c\u00f3digo no paywall |\n| `POST /v1/winBackOffers` (win-back offer, iOS 18+) | \u2705 SIM | Mesmo padr\u00e3o inline de prices. Attrs: offerId, duration, offerMode, periodCount, customerEligibilityPaidSubscriptionDurationInMonths, customerEligibilityTimeSinceLastSubscribedInMonths {min,max}, startDate, priority, promotionIntent. App Store promove sozinha pra ex-assinantes SEM build |\n| Submeter win-back offer pra review | \u274c N\u00c3O | `winBackOffer`/`winBackOffers` N\u00c3O \u00e9 relationship de `reviewSubmissionItems` (409 RELATIONSHIP.UNKNOWN, confirmado 2026-08-13) \u2014 submit s\u00f3 no web UI (p\u00e1gina da oferta na assinatura). N\u00c3O sondar criando reviewSubmission: a vazia fica presa (n\u00e3o cancela nem deleta por API) |\n| `POST /v1/subscriptionLocalizations` (display name/desc) | \u2705 SIM | Funciona normal |\n| **Availability de sub nova** (`POST /v1/subscriptionAvailabilities`) | \u2705 SIM | **FAZER ISSO PRIMEIRO** (destrava pre\u00e7o+trial). `availableInNewTerritories:true` + relationship `availableTerritories` com a lista de territ\u00f3rios. \u26a0\ufe0f N\u00c3O mandar os 175 de uma vez \u2192 500 UNEXPECTED_ERROR. Mandar em batches (4-50 ok). |\n| **Pre\u00e7o INICIAL de subscription nova** (`POST /v1/subscriptionPrices`) | \u2705 SIM (depois da availability) | **Funciona desde que a availability esteja setada antes.** Sem availability \u2192 price points v\u00eam vazios e d\u00e1 erro. Com availability: GET `/v1/subscriptions/{id}/pricePoints?filter[territory]=USA` \u2192 escolher o id do customerPrice desejado \u2192 POST com `subscriptionPricePoint` + `preserveCurrentPrice:false`. (O 409 `RELATIONSHIP.INVALID` antigo era por faltar availability \u2014 corrigido 2026-06-13 no blw.) |\n| **Free trial / intro offer de sub nova** (`POST /v1/subscriptionIntroductoryOffers`) | \u2705 SIM (depois de availability+pre\u00e7o) | \u00c9 **per-territ\u00f3rio** \u2014 exige relationship `territory` (id tipo `USA`/`BRA`/`ESP`/`MEX`). Attrs: `duration:\"THREE_DAYS\"`, `offerMode:\"FREE_TRIAL\"`, `numberOfPeriods:1`. Erros que guiam a ordem: sem territory \u2192 \"relationship 'territory' required\"; sem availability/pre\u00e7o \u2192 \"You need to set up availabilities first\". Fazer 1 POST por territ\u00f3rio. |\n\n**ORDEM CORRETA pra montar subscription nova 100% via API (sem web UI):**\n1. `POST /v1/subscriptionGroups` (grupo) + `POST /v1/subscriptionGroupLocalizations` (nome do grupo por locale)\n2. `POST /v1/subscriptions` (productId, subscriptionPeriod `ONE_WEEK`/`ONE_YEAR`, familySharable) + `POST /v1/subscriptionLocalizations` (display name + description por locale)\n3. `POST /v1/subscriptionAvailabilities` (territ\u00f3rios \u2014 em batches, N\u00c3O 175 de uma vez). Pra ALCANCE MUNDIAL: setar \"All Countries\" \u00e9 mais f\u00e1cil no web UI (1 clique); via API o `POST .../relationships/availableTerritories` pode dar **403 FORBIDDEN**. E availability ampla exige **pre\u00e7o em TODOS os territ\u00f3rios dispon\u00edveis** (passo 4) sen\u00e3o fica MISSING_METADATA.\n4. `POST /v1/subscriptionPrices` \u2014 **pre\u00e7o em TODOS os territ\u00f3rios dispon\u00edveis, n\u00e3o s\u00f3 1**. API N\u00c3O auto-equaliza globalmente (web UI sim). Pra cobrir todos: pega o price point base USA \u2192 `GET /v1/subscriptionPricePoints/{id}/equalizations?include=territory&limit=200` (retorna o equivalente por territ\u00f3rio) \u2192 1 POST de `subscriptionPrices` por territ\u00f3rio (~174). Faltar pre\u00e7o em qualquer territ\u00f3rio dispon\u00edvel = MISSING_METADATA.\n5. `POST /v1/subscriptionIntroductoryOffers` (free trial 3 dias) \u2014 **1 POST por territ\u00f3rio**, cobrir TODOS os dispon\u00edveis. Exige relationship `territory`.\n6. **Review screenshot** (`subscriptionAppStoreReviewScreenshots`, protocolo 3 passos reserve\u2192PUT\u2192commit) \u2014 obrigat\u00f3rio.\n\nScripts de refer\u00eancia (sess\u00e3o blw jun/2026): `/tmp/create_subs.py`, `/tmp/finish_subs.py`, `/tmp/price_all.py` (equaliza\u00e7\u00e3o global), `/tmp/trial_all.py`.\n\n### \ud83d\udea8 Subscription fica em MISSING_METADATA mesmo com TUDO preenchido \u2192 STATE STALE, force recompute com um PATCH\n**Causa #1 real (confirmado blw jun/2026):** depois de completar pre\u00e7o/trial/etc via API em massa, o ASC **N\u00c3O recalcula o state sozinho** \u2014 fica preso em `MISSING_METADATA` mesmo com tudo completo (pre\u00e7o 175, trial 175, screenshot COMPLETE, localizations, review note). **Fix: fazer 1 write qualquer na subscription** (ex. `PATCH /v1/subscriptions/{id}` re-salvando `reviewNote`) \u2192 o ASC reavalia na hora e vira `READY_TO_SUBMIT`. Sintoma cl\u00e1ssico: duas subs id\u00eanticas, uma READY e outra MISSING \u2014 a que ficou foi s\u00f3 a que n\u00e3o recebeu o \u00faltimo write. SEMPRE dar um PATCH no-op por sub no fim e re-checar o state.\n\n**Causa #2 (se o PATCH n\u00e3o resolver):** **Paid Applications Agreement** n\u00e3o ativo (ASC \u2192 Business / Agreements, Tax, and Banking \u2192 Paid Apps + Banking + Tax). A\u00ed NENHUMA IAP da conta sai de MISSING_METADATA. Como descartar r\u00e1pido: ver se OUTRO app da mesma conta tem sub submet\u00edvel (`GET /v1/subscriptions/{id}` de um app que j\u00e1 vende) \u2014 se tem, o agreement est\u00e1 ativo e o problema \u00e9 o state stale (causa #1).\n\n### \ud83d\udea8 Subscription REJEITADA (state DEVELOPER_ACTION_NEEDED + localization REJECTED) \u2192 recriar localizations, mas o STATE s\u00f3 limpa re-submetendo com vers\u00e3o nova\nQuando a App Review rejeita as IAPs (app pode at\u00e9 ficar `READY_FOR_SALE` mas os subs ficam `DEVELOPER_ACTION_NEEDED` com cada `subscriptionLocalization`/`subscriptionGroupLocalization` em `REJECTED`):\n- **N\u00c3O d\u00e1 pra PATCH numa localization REJECTED** \u2192 409 `ENTITY_ERROR.ATTRIBUTE.INVALID.UNMODIFIABLE` (\"Cannot edit SubscriptionLocalization when it is in REJECTED state\").\n- **DELETE tamb\u00e9m d\u00e1 409** na localization REJECTED.\n- **MAS um POST de nova `subscriptionLocalization` pro mesmo locale FUNCIONA (201)** e SUBSTITUI a rejeitada \u2014 a nova nasce em `PREPARE_FOR_SUBMISSION` (limpa, edit\u00e1vel). Mesma coisa pra `subscriptionGroupLocalizations`. Esse \u00e9 o jeito de \"des-rejeitar\" a metadata via API.\n- **POR\u00c9M o `state` do subscription continua `DEVELOPER_ACTION_NEEDED`** por mais que toda a metadata fique completa (175 pre\u00e7os, 175 territ\u00f3rios, review screenshot COMPLETE, localizations limpas) \u2014 nenhum PATCH no-op/edit recomputa pra `READY_TO_SUBMIT`. Esse res\u00edduo da rejei\u00e7\u00e3o **s\u00f3 limpa re-submetendo os subs junto de uma vers\u00e3o nova no web UI** (a API `reviewSubmissionItems` n\u00e3o aceita subscription como item). Fluxo: nova vers\u00e3o (build novo) \u2192 p\u00e1gina da vers\u00e3o \u2192 \"In-App Purchases and Subscriptions\" \u2192 adiciona os subs \u2192 submete junto.\n- **Causa comum da rejei\u00e7\u00e3o de IAP**: o paywall n\u00e3o bloqueia NENHUMA feature de fato (Apple guideline 2.1/3.1.1 \u2014 \"purchase doesn't unlock anything\"). Fix de produto = gate real atr\u00e1s da assinatura antes de re-submeter. (AirDraw jun/2026: subs rejeitadas, app live sem monetiza\u00e7\u00e3o \u2192 gate de undo/clear adicionado pra v20.)\n- **N\u00c3O adianta re-recriar a localization rejeitada por API** \u2014 ela volta pra REJECTED sozinha (o ASC reconcilia a localization contra o `state` rejeitado do subscription; o `PREPARE_FOR_SUBMISSION` que aparece logo ap\u00f3s o POST \u00e9 TRANSIENTE, some em minutos). \u00danico fix real = anexar os subs \u00e0 vers\u00e3o e submeter no web UI.\n- **N\u00c3O sondar via `POST /v1/reviewSubmissions`** pra tentar incluir o sub: `reviewSubmissionItems` rejeita a relationship `subscription` (`ENTITY_ERROR.RELATIONSHIP.UNKNOWN \u2014 'subscription' is not a relationship`), confirmando que \u00e9 web-UI-only. PIOR: a reviewSubmission de teste que voc\u00ea cria fica presa em `READY_FOR_REVIEW` e **n\u00e3o d\u00e1 pra deletar nem cancelar por API** (DELETE 403, PATCH `canceled:true` \u2192 409 \"not in cancellable state\") \u2014 vira lixo que s\u00f3 some no web UI. Adicionar a appStoreVersion a uma reviewSubmission tamb\u00e9m trava a vers\u00e3o em `READY_FOR_REVIEW` (sai de edit\u00e1vel); pra reverter, DELETE o `reviewSubmissionItem` (204) \u2192 vers\u00e3o volta a `PREPARE_FOR_SUBMISSION`. Resumo: N\u00c3O mexer em reviewSubmissions por API pra subs; deixar 100% pro web UI.\n\n### Primeira assinatura submete JUNTO com uma vers\u00e3o\nA 1\u00aa subscription do app N\u00c3O pode ser submetida sozinha \u2014 vai na MESMA review de uma vers\u00e3o do app: p\u00e1gina da vers\u00e3o \u2192 se\u00e7\u00e3o **\"Compras dentro do app e assinaturas\"** \u2192 \"+\" \u2192 seleciona as subs \u2192 submete. Essa se\u00e7\u00e3o s\u00f3 aparece quando: vers\u00e3o edit\u00e1vel (`PREPARE_FOR_SUBMISSION`, n\u00e3o `DEVELOPER_REJECTED`) + build anexado + sub em \"Ready to Submit\". `reviewSubmissionItems` da API N\u00c3O aceita subscription como item (s\u00f3 appStoreVersion/appEvent/etc) \u2014 o v\u00ednculo IAP\u2194vers\u00e3o \u00e9 web UI.\n\n**Padr\u00e3o de mensagem ao user:** \"Bundle ID criei via API. App Group precisa ser criado manualmente em developer.apple.com \u2014 link: [...]. Avisa quando terminar.\"\n\n---\n\n## 2. Provisioning profile mismatch \u2014 diagn\u00f3stico r\u00e1pido\n\n**Sintoma:** `xcodebuild ... error: Provisioning profile \"iOS Team Provisioning Profile: com.gambitstudio.xxx\" doesn't match the entitlements file's value for the X entitlement.`\n\n**Por qu\u00ea:** O profile atual n\u00e3o tem essa capability/group assignment.\n\n**Sequ\u00eancia de fix:**\n1. Verificar se entitlements file tem o que voc\u00ea espera:\n   ```bash\n   cat <App>/<App>.entitlements\n   ```\n2. Verificar se Bundle ID tem a capability via API (`get-bundle-capabilities.py <bundleId>`).\n3. Se capability t\u00e1 enabled mas erro persiste \u2192 o RESOURCE (App Group, iCloud Container) n\u00e3o t\u00e1 criado/atribu\u00eddo no portal. Vai para portal web.\n4. Ap\u00f3s criar no portal, **limpar cache de profiles local** pra for\u00e7ar re-fetch:\n   ```bash\n   rm -f ~/Library/Developer/Xcode/UserData/Provisioning\\ Profiles/*.mobileprovision\n   ```\n5. Build novamente com `-allowProvisioningUpdates`.\n\n**Se ainda quebrar:** \u00daltima cartada \u2192 temporariamente remover a entitlement do `project.yml` + `.entitlements` pra desbloquear build/teste. Religar quando portal estiver 100%. (Aconteceu no PeptideCalc com App Group + iCloud.)\n\n---\n\n## 3. iCloud no v1 \u2014 N\u00c3O VALE A PENA\n\n**Por qu\u00ea:** No app PeptideCalc, iCloud capability:\n- Bloqueou o build de device por horas\n- Exigiu 4 cliques no portal (criar Container + atribuir aos 3 Bundle IDs)\n- A API n\u00e3o cria nem atribui\n- O entitlement `com.apple.developer.icloud-services` + `com.apple.developer.icloud-container-identifiers` + `com.apple.developer.ubiquity-kvstore-identifier` cria 3 pontos de falha\n\n**Recomenda\u00e7\u00e3o default:** Tirar iCloud do v1 sempre. Adicionar em v1.x quando o usu\u00e1rio pedir explicitamente.\n\n**Onde olhar pra remover iCloud completamente:**\n1. `<App>/<App>.entitlements` \u2014 remover keys icloud-*\n2. `project.yml` \u2192 entitlements properties \u2014 remover keys icloud-*\n3. `Localizable.xcstrings` \u2014 qualquer texto mencionando \"iCloud\" (especialmente `settings.privacy.body`, `onboarding.privacy.subtitle`)\n4. `SettingsView.swift` \u2014 toggle iCloud Sync (se existir)\n5. `StorageKeys.swift` + `FeatureFlags.swift` \u2014 chaves iCloud-related\n\nScript dispon\u00edvel: `scripts/remove-icloud.sh`.\n\n---\n\n## 4. HealthKit \u2014 s\u00f3 pedir se for USAR na UI\n\nApp Review **rejeita** apps que pedem HealthKit sem mostrar uso vis\u00edvel dos dados.\n\n**Wiring m\u00ednimo:**\n1. `HealthKitService.swift` com `requestAuthorization()`\n2. Fun\u00e7\u00e3o que processa dados (ex: `impactSummary(for: protocol)`)\n3. **UI que mostra esses dados** \u2014 sem isso \u00e9 redflag\n\nNo PeptideCalc, depois de horas perdidas com o toggle do Settings autorizando mas dados nunca aparecendo, virou um card \"Body impact\" dentro de Protocol Detail mostrando deltas de peso/RHR/HRV. **Sempre fa\u00e7a esse \u00faltimo passo.**\n\nAdo\u00e7\u00e3o de equipamentos:\n- `bodyMass` \u2014 alta (smart scales + manual)\n- `restingHeartRate`, `HRV` \u2014 s\u00f3 com Apple Watch (~50% no p\u00fablico GambitStudio)\n- `stepCount` \u2014 universal (iPhone tem motion coprocessor)\n\n### \ud83d\udea8 Entitlement cl\u00ednico (`health-records`) MATA o prompt de autoriza\u00e7\u00e3o do HealthKit\nSintoma (soninho, jun/2026): o modal de permiss\u00e3o do Apple Sa\u00fade **nunca aparece** e o bot\u00e3o \"Conectar\" n\u00e3o faz nada \u2014 `requestAuthorization` falha silencioso (erro engolido no catch). Causa: o `.entitlements` tinha\n```xml\n<key>com.apple.developer.healthkit.access</key>\n<array><string>health-records</string></array>\n```\n`com.apple.developer.healthkit.access = [health-records]` \u00e9 o entitlement de **Clinical Health Records** \u2014 entitlement RESTRITO (precisa aprova\u00e7\u00e3o especial da Apple no portal) + exige `NSHealthClinicalHealthRecordsShareUsageDescription` pr\u00f3pria. Pra ler sono/HR/passos (HealthKit normal) voc\u00ea **N\u00c3O** usa esse key. T\u00ea-lo declarado sem aprova\u00e7\u00e3o/usage-string faz a autoriza\u00e7\u00e3o quebrar. **Fix: deixar s\u00f3 `com.apple.developer.healthkit = true`** (remover o `.access` inteiro). Reassinar com `-allowProvisioningUpdates`.\n\n### Prompt do HealthKit s\u00f3 dispara 1\u00d7 \u2014 pedir no CONTEXTO, n\u00e3o s\u00f3 no onboarding\n`HKHealthStore.requestAuthorization` s\u00f3 mostra o sheet enquanto o status \u00e9 \"n\u00e3o determinado\". Se o app s\u00f3 pede no onboarding e o onboarding j\u00e1 foi conclu\u00eddo (ou o user negou), o sheet **nunca mais aparece**. Pedir tamb\u00e9m na tela que consome os dados (ex: ao abrir a aba que mostra sono do Apple), guardado por flag pra n\u00e3o repetir toda hora. E como Apple esconde o status de leitura, o bot\u00e3o \"Conectar\" deve ter fallback: depois de pedir, se ainda vazio \u2192 `UIApplication.open(openSettingsURLString)` pra o user habilitar manual em Ajustes.\n\n---\n\n## 5. xcstrings \u2014 pegadinhas cr\u00edticas\n\n**Formato:** JSON com `sourceLanguage`, `version: \"1.0\"`, `strings: { \"key\": { \"localizations\": { \"loc\": { \"stringUnit\": { \"state\": \"translated\", \"value\": \"...\" } } } } }`\n\n**Interpola\u00e7\u00e3o:**\n- `String(localized: \"key.X \\(string)\")` \u2192 chave usa `%@`\n- `String(localized: \"key.X \\(int)\")` \u2192 chave usa `%lld`\n- **NUNCA** use `\\(var)` direto dentro do `String(localized:)` raw \u2014 quebra extra\u00e7\u00e3o\n\n**App Store iOS locales (39 oficiais):**\n```\nar, ca, zh-Hans, zh-Hant, hr, cs, da, nl, en-AU, en-CA, en-GB, en-US,\nfi, fr, fr-CA, de, el, he, hi, hu, id, it, ja, ko, ms, no, pl,\npt-BR, pt-PT, ro, ru, sk, es-MX, es-ES, sv, th, tr, uk, vi\n```\n\n**Para traduzir em massa:** use `scripts/translate-xcstrings.py` \u2014 paralelaliza via agents em grupos (CJK+Indic+Arabic / Slavic+European / Nordic+Iberian+SEA).\n\n**InfoPlist tamb\u00e9m precisa de InfoPlist.xcstrings:** `CFBundleDisplayName`, `CFBundleName`, todas `NS*UsageDescription`. Sem isso, app name aparece em ingl\u00eas independente do device.\n\n**Char limits do ASC (cuidado com UTF-8):**\n- name \u2264 30, subtitle \u2264 30, keywords \u2264 100, promotional \u2264 170, description \u2264 4000\n- Verificar com Python (`print(len(open('subtitle.txt').read().strip()))`), N\u00c3O com `wc -c`.\n\n**Strings hardcoded silenciosas:** Se voc\u00ea adicionar `Text(\"Foo\")` ao inv\u00e9s de `Text(String(localized: \"key\"))`, aparece em ingl\u00eas pros 39 idiomas. Use `scripts/verify-localization.py` pra auditar.\n\n---\n\n## 6. NavigationStack + TabView \u2014 padr\u00e3o exato\n\n**Antes (errado):** `NavigationStack { HomeView() }` em todas tabs com custom header \u2192 nav bar fantasma.\n\n**Agora (correto):** Cada tab \u00e9 wrappada em NavigationStack. As Views usam `.navigationTitle()` + `.navigationBarTitleDisplayMode(.large)`. Bot\u00f5es em `.toolbar { ToolbarItem(placement: .topBarTrailing) }`. Sem custom HStack header.\n\n**Background:**\n- Listas: `.background(AppColors.background.ignoresSafeArea())` no List\n- ScrollViews: `ZStack { AppColors.background.ignoresSafeArea(); ScrollView { ... } }`\n\n**Nav bar opaco global** (no App init):\n```swift\nlet nav = UINavigationBarAppearance()\nnav.configureWithOpaqueBackground()\nnav.backgroundColor = UIColor { trait in\n    trait.userInterfaceStyle == .dark\n        ? UIColor(red: 0x1A/255, green: 0x1A/255, blue: 0x1A/255, alpha: 1)\n        : UIColor(red: 0xFF/255, green: 0xFF/255, blue: 0xFF/255, alpha: 1)\n}\nnav.shadowColor = .clear\nUINavigationBar.appearance().standardAppearance = nav\nUINavigationBar.appearance().scrollEdgeAppearance = nav\n```\n\n---\n\n## 7. Modal vs Push \u2014 regra definitiva\n\n> \"Se a UI CRIA/EDITA algo: **modal**. Se mostra DETALHES de algo existente: **push**.\"\n\n- **Modal** (`.sheet`): NewProtocolSheet, NewInjectionSheet, NewLabSheet, PeptidePickerSheet, DisclaimerSheet, ActivityShareSheet\n- **Push** (`NavigationLink` + `.navigationDestination`): Protocol Detail, Injection Detail, Lab Detail, \"How to use\" pages\n\nPadr\u00e3o pra detail screen: NavigationLink em ForEach \u2192 `.navigationDestination(for: Entity.self)` no parent. Funciona dentro de List, ScrollView, qualquer container.\n\n---\n\n## 8. Watch app embed bug (Xcode 26)\n\n**Sintoma:** `Failed to build project ...: This scheme builds an embedded Apple Watch app. watchOS 11.5 must be installed in order to run the scheme`\n\nMesmo com watchOS 11.5 simulator instalado.\n\n**Workaround:** Remove `embed: true` da dependency da watch app no `project.yml` temporariamente. O target continua buildando standalone, mas n\u00e3o \u00e9 embutido no IPA do iOS. Adicione `embed: true` de volta apenas pra build de archive de produ\u00e7\u00e3o.\n\nBug do Xcode quando destination \u00e9 `generic/platform=iOS`. Sumiria com paired watchOS sim, mas isso requer config absurda.\n\n---\n\n## 9. xcodegen \u2014 quando regenerar\n\n**SEMPRE regenerar quando:**\n- Adicionar/remover arquivo Swift\n- Mudar entitlements properties\n- Mudar dependencies entre targets\n- Trocar Info.plist path\n- Adicionar target novo\n\n**Comando:** `xcodegen generate` (do mesmo diret\u00f3rio do `project.yml`)\n\n**Nunca mexer manualmente em `project.pbxproj`** \u2014 formato \u00e9 hostil, qualquer edit quebra resolu\u00e7\u00e3o de paths.\n\n---\n\n## 10. Calculator UX (padr\u00e3o validado no PeptideCalc)\n\n- **Row inteira tappable** (n\u00e3o s\u00f3 TextField) \u2014 `.contentShape(Rectangle())` + `.onTapGesture { focusedField = .X }`\n- **Keyboard chain** \u2014 `@FocusState private var focusedField: Field?` com enum, toolbar mostra \"Next\" se h\u00e1 pr\u00f3ximo, \"Done\" se \u00e9 \u00faltimo\n- **Labels compactos** com `.font(AppFonts.subheadline)` + `.minimumScaleFactor(0.7)` \u2014 encolhe ao inv\u00e9s de truncar\n- **TextField com `.fixedSize(horizontal: true)`** \u2014 n\u00e3o esmaga conforme digita\n\n---\n\n## 11. Shadows \u2014 APENAS preto\n\n`Core/Extensions/View+Extensions.swift` tem 2 modificadores:\n- `.softShadow()` = `.black.opacity(0.05), radius: 6, y: 2` \u2014 pra cards inline\n- `.elevatedShadow()` = `.black.opacity(0.08), radius: 10, y: 4` \u2014 pra hero cards\n\n**PROIBIDO:** `.shadow(color: AppColors.primary.opacity(...))` ou qualquer cor n\u00e3o-preta. Quebra premium feel em dark mode.\n\n---\n\n## 12. Light mode default\n\nApp **sempre inicia em Light** (`@AppStorage appearanceMode = \"light\"`). Settings tem s\u00f3 toggle Light/Dark (sem \"System\").\n\nBackground light: `Color(light: 0xF2F2F7, dark: 0x000000)` \u2014 soft gray, N\u00c3O branco puro. Cards s\u00e3o `Color(light: 0xFFFFFF, dark: 0x1A1A1A)`.\n\n---\n\n## 13. Fastlane sync_metadata \u2014 gotchas\n\n**LC_ALL obrigat\u00f3rio** ou quebra com `invalid byte sequence in US-ASCII`:\n```bash\nLC_ALL=en_US.UTF-8 LANG=en_US.UTF-8 fastlane sync_metadata\n```\n\n**Novos locales:** Cada folder novo precisa de TODOS estes arquivos ou ASC bloqueia submit:\n1. `name.txt` 2. `subtitle.txt` 3. `keywords.txt` 4. `description.txt` 5. `promotional_text.txt` 6. `release_notes.txt` 7. `support_url.txt`\n\nSem `release_notes.txt` em algum locale \u2192 bloqueio \"Este campo \u00e9 obrigat\u00f3rio\".\n\n**whatsNew N\u00c3O pode ser editado em v1.0** \u2014 quando primeira submission, omitir. Adicionar a partir de v1.0.1.\n\n**\u26a0\ufe0f `fastlane sync_metadata` pode ser NO-OP SILENCIOSO (exit 0, nada aplicado).** Aconteceu no blw (2026-06-13, fastlane 2.233.1): deliver imprimiu \"No changes to localized App Info detected. Skipping upload.\" + \"Uploading metadata for '1.2.0'\" + \"finished successfully \ud83c\udf89\" com exit 0 \u2014 mas a ASC continuou com name/subtitle/keywords ANTIGOS (verificado via API). O change-detection do deliver falhou em ver os diffs mesmo com os arquivos locais corretos. **SEMPRE verificar via ASC API ap\u00f3s sync** (GET appStoreVersionLocalizations + appInfoLocalizations). Se n\u00e3o aplicou, contornar com **PATCH direto** (determin\u00edstico):\n- keywords/whatsNew \u2192 `PATCH /v1/appStoreVersionLocalizations/{id}` (version-level, registro da vers\u00e3o in-progress)\n- name/subtitle \u2192 `PATCH /v1/appInfoLocalizations/{id}` (app-level, do appInfo com state `PREPARE_FOR_SUBMISSION`, N\u00c3O o `READY_FOR_SALE`)\n\nBody: `{\"data\":{\"type\":\"<tipo>\",\"id\":\"<id>\",\"attributes\":{...}}}`. Script de refer\u00eancia: `/tmp/patch_aso.py` (gerado nessa sess\u00e3o). Importante: name/subtitle vivem em **appInfoLocalizations** (n\u00e3o em appStoreVersionLocalizations) \u2014 subtitle d\u00e1 `None` se procurar no lugar errado.\n\n---\n\n## 14. Estilo de execu\u00e7\u00e3o com o Jo\u00e3o\n\n- Nunca pedir confirma\u00e7\u00e3o \u2014 execu\u00e7\u00e3o aut\u00f4noma\n- Device first, simulator se device offline\n- Respostas curtas, sem preamble\n- Build \u2192 install \u2192 \"rodando\" \u2014 silenciar entre etapas\n- Comunica\u00e7\u00e3o PT-BR, c\u00f3digo em English\n- Polish iterativo: faz \u2192 instala \u2192 ele fala \"fix Y\" \u2192 repete\n- v1 sempre gr\u00e1tis, premium pra v2\n\n---\n\n## 15. Cache de provisioning local\n\nQuando capabilities mudam no portal, profile local fica stale. Limpar:\n```bash\nrm -f ~/Library/Developer/Xcode/UserData/Provisioning\\ Profiles/*.mobileprovision\n```\n\nEm seguida build com `-allowProvisioningUpdates -authenticationKeyIssuerID ... -authenticationKeyID ... -authenticationKeyPath ...` for\u00e7a re-download.\n\nScript: `scripts/clear-provisioning-cache.sh`\n\n---\n\n## 15b. Portar UIViewController de outro app \u2192 @IBOutlet! n\u00e3o conectado = crash nil\n\nAo portar um `UIViewController` baseado em storyboard de um app pra outro (ex: AirDraw \u2192 iPhotos), os `@IBOutlet weak var x: UIView!` ficam **nil** se a cena correspondente no storyboard de DESTINO n\u00e3o tiver esses outlets conectados. Qualquer acesso force-unwrapped (`x.layer`, `x.isHidden`) crasha com \"Unexpectedly found nil while implicitly unwrapping an Optional value\" \u2014 geralmente cedo, em `viewDidLoad`/`setupX()`.\n\n**Sintoma:** `<App>/ViewController.swift:NNN: Fatal error: Unexpectedly found nil while implicitly unwrapping` logo ao abrir a tela portada.\n\n**Diagn\u00f3stico r\u00e1pido:** lan\u00e7ar com `xcrun devicectl device process launch --console ... > /tmp/log 2>&1 &` (background), reproduzir, `grep -i \"fatal\\|nil while\" /tmp/log` \u2192 d\u00e1 o arquivo:linha exato.\n\n**Fix:** tornar TODOS os acessos a outlets n\u00e3o-essenciais opcionais (`outlet?.`), OU recriar as conex\u00f5es no storyboard de destino. Outlets essenciais (ex: `sceneView` do AR, a view principal) precisam mesmo estar conectados \u2014 esses n\u00e3o d\u00e1 pra s\u00f3 `?.`. Auditar: `grep -n \"@IBOutlet\" VC.swift` e checar cada um por acesso sem `?`.\n\n(Aconteceu no iPhotos AR port 2026-06-15: `buyProButton`/`tutorialAsset`/`tutorialImage` vinham do storyboard do AirDraw, n\u00e3o existiam na cena do iPhotos \u2192 nil \u2192 crash em `setupBuyProButton()`.)\n\n---\n\n## 15c. GPT image-gen como ferramenta de DESIGN offline (n\u00e3o runtime)\n\nToken OpenAI em `_GambitStudio/keys/openai.env` (`OPENAI_API_KEY=[redigido]\u2026`, adicionado pelo Jo\u00e3o 2026-06-15). Uso = **gerar assets de refer\u00eancia/fill em DEV**, NUNCA chamar em runtime (custo, lat\u00eancia, vaza a chave, App Review).\n\n**Pipeline validada (iPhotos OrganicGrid, 2026-06-15):**\n1. Gerar imagens via `POST https://api.openai.com/v1/images/generations`, model `gpt-image-1`, `size:\"1024x1024\"`. Resposta vem em `data[0].b64_json` (base64 \u2192 decode \u2192 PNG). Auth `Bearer $OPENAI_API_KEY`. Script Python stdlib (urllib), sem deps. Roda em background (6-7 imagens ~2min).\n2. **Visualizar** os PNGs com a Read tool (eu enxergo imagem) pra avaliar.\n3. **Tra\u00e7ar pra vetor**: para layouts (collage grids), prompt = \"minimalist black-and-white blueprint, thick black dividing lines on white, NO photos/color/text, each line crosses any other at most once, gentle organic curves, flat 2D straight-on\". A\u00ed tra\u00e7o os pontos de controle normalizados (0\u20131) e construo `UIBezierPath` (regi\u00f5es fechadas seguindo as curvas + bordas do canvas). \n4. **VALIDAR OFFLINE antes de subir pro device**: portar a geometria (SmoothCurve Catmull-Rom\u2192bezier) pra um script `swift` macOS usando CoreGraphics (`CGMutablePath`, `CGContext` cinza, `CGImageDestination`\u2192PNG), renderizar cada regi\u00e3o num cinza distinto, e Read pra conferir que as c\u00e9lulas n\u00e3o se sobrep\u00f5em e cobrem o canvas. Pega bug de close/append antes de gastar round-trip de device.\n5. **Fills bonitos pra thumbnails**: gerar fotos-amostra (paleta coerente), bundlar em `Assets.xcassets/<name>.imageset/` (PNG + Contents.json `{\"images\":[{\"idiom\":\"universal\",\"filename\":\"x.png\"}],\"info\":{...}}`), e preencher as c\u00e9lulas do preview (clip por regi\u00e3o + `img.draw(in: aspectFillRect)`) em vez de wireframe. Vira collage real.\n\n**Aprendizado-chave:** o que destrava \"ficou feio\" n\u00e3o \u00e9 a imagem em si \u2014 \u00e9 eu VER a refer\u00eancia e codificar a forma (ex: divis\u00f3rias elegantes = onda-S `sin(t\u00b72\u03c0)`, uma crista+um vale, N\u00c3O corcunda `sin(t\u00b7\u03c0)`). GPT \u00e9 o moodboard; o c\u00f3digo \u00e9 meu.\n\nScripts de refer\u00eancia: `/tmp/gen_organic_refs.py`, `/tmp/gen_round2.py` (gera\u00e7\u00e3o), `/tmp/validate_organic.swift`, `/tmp/validate2.swift` (valida\u00e7\u00e3o CoreGraphics).\n\n---\n\n## 16. devicectl idioms\n\n```bash\n# Listar\nxcrun devicectl list devices\n\n# Install\nxcrun devicectl device install app --device <UDID> /path/to/App.app\n\n# Launch\nxcrun devicectl device process launch --device <UDID> com.bundle.id\n\n# Kill \u2014 n\u00e3o tem terminate direto via UDID. Use installation reinstall pra recycle.\n```\n\nQuando \"Launched application\" aparece mas app n\u00e3o roda no device \u2192 app foi desinstalado. Reinstalar.\n\n**`devicectl process launch` \u2192 `Launchd job spawn failed (NSPOSIXErrorDomain error 85)` num build Debug:** \u00e9 o **debug dylib** do Xcode 16+ (`<App>.debug.dylib` + `__preview.dylib` dentro do `.app`). Esse dylib separado s\u00f3 d\u00e1 spawn quando lan\u00e7ado PELO Xcode \u2014 via `devicectl` fora do Xcode falha com POSIX 85. **Fix: rebuildar com `ENABLE_DEBUG_DYLIB=NO`** no `xcodebuild` \u2192 bin\u00e1rio standalone \u2192 instala e abre normal por devicectl.\n```bash\nxcodebuild -workspace App.xcworkspace -scheme App -configuration Debug \\\n  -destination 'platform=iOS,id=<UDID>' -allowProvisioningUpdates \\\n  ENABLE_DEBUG_DYLIB=NO build\n```\n(Confere com `ls <App>.app | grep -i \"debug.dylib\\|preview\"` \u2014 deve sumir.) Erro gen\u00e9rico anterior \"device was not unlocked / RequestDenied\" = device travado; desbloquear. Os dois erros parecem o mesmo (10002 / RequestDenied) mas a causa raiz \u00e9 diferente \u2014 olhar a linha final (POSIX 85 = dylib; Locked = travado).\n\n---\n\n## 17. Templates de protocolo (PeptideCalc espec\u00edfico mas pattern geral)\n\nTemplates \"pre-built\" em `<App>/Resources/CycleTemplates.json` ou similar s\u00e3o gigante diferencial. PeptideCalc tem 24. Inclua sempre os mainstream + niche pra cobrir 90% dos casos sem o usu\u00e1rio ter que pensar.\n\nPattern: load via service singleton, expor no NewProtocolSheet como lista clic\u00e1vel de cards.\n\n---\n\n## 18. Hub workflow ideal pra pr\u00f3ximo app\n\nQuando user diz \"create app de X\":\n1. Ler `HUB.md` (este folder)\n2. Ler este `LEARNINGS.md`\n3. Ler skill `~/.claude/skills/create-ios-app/SKILL.md`\n4. Executar 6 fases sem pausar\n5. Quando hit em problema NOVO (n\u00e3o listado aqui), DOCUMENTAR aqui antes de prosseguir\n\n---\n\n## 19. QA dirigido no simulador \u2014 harness, hook e or\u00e1culo de nuvem (jul/2026, Calc+)\n\nInfra reutiliz\u00e1vel criada na bateria pesada do Calc+ (vibe-code de QA num app cr\u00edtico):\n- **Harness `_GambitStudio/tools/sim-qa/`** (`sim.sh` + `markqa.sh`): dirige o sim via idb+simctl. idb usa PONTOS (393\u00d7852), n\u00e3o pixels de screenshot \u2014 nav bar ~y=76, tab bar ~y=797. **Long-press pra edit mode de UICollectionView**: `idb ui tap --duration 1.2 x y` (tap normal n\u00e3o seleciona, abre o viewer).\n- **Stop hook anti-parada** (`~/.claude/hooks/qa-stop-guard.sh` + `~/.claude/qa-active-checklist`): bloqueia encerrar o turno enquanto houver `\u2b1c` na checklist. Montado porque eu (Claude) tendia a chamar \"batch\" de \"tudo\" e parar cedo. Ativar apontando o arquivo pra checklist; apagar pra desligar.\n- **gsutil como or\u00e1culo de backup** (via gcloud, ver `keys/gcloud-access.md`): `gsutil ls gs://<bucket>/<uid>/Photos/ | grep -c xor` prova upload/delete/restore de verdade, MUITO melhor que inspecionar UI. Foi o que destravou provar resili\u00eancia (0 perda) e o achado de delete-privacidade.\n\n### Gotchas do simulador (custaram tempo)\n- **Sim N\u00c3O aplica jetsam** (`memorystatus_control: Operation not permitted`) \u2192 **OOM \u00e9 device-only**, n\u00e3o reproduz no sim. Al\u00e9m disso, seeds sint\u00e9ticos (`-SeedPhotos`) s\u00e3o imagens min\u00fasculas \u2192 n\u00e3o estressam mem\u00f3ria. Pra OOM real precisa device + biblioteca real.\n- **Firebase Auth N\u00c3O persiste ao trocar de build** (instalar build B por cima do A, mesmo bundle): a sess\u00e3o de login some. N\u00e3o d\u00e1 pra \"herdar\" login de um build pro outro.\n- **idb n\u00e3o registra tap em UISwitch** de forma confi\u00e1vel (o toggle de Settings n\u00e3o flipa). Precisa passe manual ou outra abordagem.\n- **DebugLogin falha com \"keychain error\"** em build `CODE_SIGNING_ALLOWED=NO` \u2014 Firebase Auth precisa de keychain access group v\u00e1lido. Buildar com assinatura ad-hoc normal resolve.\n- **cfprefsd cacheia o plist**: pra for\u00e7ar mudan\u00e7a de pref (ex: `Mode`) com efeito no launch, **desligar o sim** (`simctl shutdown`) antes do `plutil -replace`, depois `boot`.\n\n## 20. Calc+ backup \u2014 arquitetura de nomes UUID \u00e9 a raiz de 3 problemas (jul/2026)\n\nO upload salva cada foto na nuvem com nome `{UUID}xor.jpg` ALEAT\u00d3RIO, sem mapear pro nome local (`@<timestamp>.png` das importadas). Isso causa TR\u00caS coisas, todas mesma raiz:\n1. **Restore duplica** fotos importadas (dedup por nome falha: local `@...` \u2260 nuvem UUID).\n2. **Restore achata pastas** (o nome UUID n\u00e3o carrega o path `@pasta@`; provado: 0 objetos com `@` na nuvem).\n3. **Delete n\u00e3o remove foto importada da nuvem** (PRIVACIDADE): `deleteImage(@nome)` \u2192 objectNotFound \u2192 objeto UUID fica. S\u00f3 fotos RESTAURADAS (nome=UUID) s\u00e3o removidas.\n\nTentei \"resolver\" embutindo o nome no filename da nuvem \u2014 **Jo\u00e3o mandou reverter** (risco alto num app-cofre de produ\u00e7\u00e3o, ganho parecia baixo). Com privacidade entrando na conta o ganho subiu; re-avaliar como `/develop-task` dedicado, N\u00c3O no impulso.\n\n**Crash de campo \"app fecha sozinho\" = prov\u00e1vel OOM no RESTORE**, n\u00e3o s\u00f3 galeria. `fetchFirebaseMediaItems` baixava TODOS os itens pra mem\u00f3ria como UIImage decodificado antes de salvar (~6GB com 1000+ fotos reais). **Fix commitado (`d4a37c65`)**: segurar como Data comprimido, decodificar 1 por vez no save. Validado E2E (1270 fotos, 0 perda). O fix da galeria (downsample+NSCache) j\u00e1 existia; esse \u00e9 o do restore.\n\n**Delete na nuvem s\u00f3 funciona com nome que casa o objeto** (confirmado gsutil: 1270\u21921269). Bug#1 fix (objectNotFound\u2192drena) parou o \"Erro\" eterno mas n\u00e3o removeu objetos \u00f3rf\u00e3os (\u00e9 a arquitetura, n\u00e3o regress\u00e3o).\n\n## 21. Maestro pra QA de simulador (19/07/2026)\nTap por coordenada (idb) causou v\u00e1rios mis-taps na regress\u00e3o do Calc+ (banner de ad roubava o tap; unlock do calc2 completa no 4\u00ba d\u00edgito e o tap \"extra\" ca\u00eda na galeria). **Maestro (mobile.dev) resolve a classe**: seletores por texto + auto-wait + asserts. Integrado: flows base em `_GambitStudio/tools/sim-qa/maestro/`, tools `maestro_flow` + `ui_longpress` no sim-mcp (`tools/sim-mcp/server.js`). Precisa `JAVA_HOME=/usr/local/opt/openjdk` (brew openjdk). Regra pr\u00e1tica: jornada roteiriz\u00e1vel \u2192 Maestro; explora\u00e7\u00e3o/elemento sem label \u2192 idb.\n\n## 22. Build \"aceito mas nunca aparece na ASC\" = CFBundleIconName ausente (Xcode 26 actool) \u2014 21/07/2026 Calc+\nSintoma: `xcodebuild -exportArchive` + `altool --upload-app` retornam SUCESSO (valida\u00e7\u00e3o altool passa), mas o build NUNCA materializa na ASC (some no ingest ass\u00edncrono da Apple; causa s\u00f3 vai por email ITMS-90713). Aconteceu com Calc+ builds 202-211 (todos descartados).\n**Causa raiz:** Info.plist com `CFBundleIcons` contendo S\u00d3 `CFBundleAlternateIcons` (sem `CFBundlePrimaryIcon`). O actool do **Xcode 26** N\u00c3O injeta `CFBundleIconName` automaticamente quando `CFBundleIcons` j\u00e1 existe parcialmente (o Xcode 16 injetava \u2014 por isso a 1.4.0 passou e os builds novos n\u00e3o). Bin\u00e1rio final sem `CFBundleIconName` \u2192 Apple rejeita no ingest, invis\u00edvel na ASC.\n**Fix determin\u00edstico (n\u00e3o depende do email):** baixar o IPA do artifact do CI (`gh run download <id> -n <artifact>`), `unzip`, `PlistBuddy -c \"Print :CFBundleIconName\" App.app/Info.plist` \u2192 se AUSENTE, adicionar no Info.plist SOURCE:\n- `:CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName = AppIcon` (+ CFBundleIconFiles array com AppIcon60x60)\n- `:CFBundleIconName = AppIcon` (raiz)\n- b\u00f4nus: `:ITSAppUsesNonExemptEncryption = false` (evita o gate \"Missing Compliance\").\n**Diagn\u00f3stico geral de ingest silencioso:** SEMPRE inspecionar o Info.plist do IPA compilado (n\u00e3o o source) \u2014 o actool injeta/omite keys no build. Comparar com um build que materializou.\n\n## 23. Testar compra StoreKit REAL headless (free\u2192premium) num app CocoaPods \u2014 22/07/2026 Calc+\nD\u00e1 pra provar a troca de estado free\u2192premium por uma transa\u00e7\u00e3o StoreKit **real** (n\u00e3o fake UserDefaults) sem Apple ID sandbox e sem Xcode UI, via `SKTestSession` (StoreKitTest.framework) num unit test target rodado por `xcodebuild test`. `simctl launch` N\u00c3O aplica a StoreKit config (retorna \"0 products, N invalid identifiers\") \u2014 s\u00f3 Xcode Run ou SKTestSession em XCTest aplicam.\n\n**Receita (validada Calc+, 20 testes verdes):**\n1. **Test target via gem `xcodeproj`** (nunca pbxproj \u00e0 m\u00e3o): `project.new_target(:unit_test_bundle, ...)`, host app via `TEST_HOST`+`BUNDLE_LOADER`, `add_system_framework('StoreKitTest')`, `add_dependency(app)`, add o `.storekit` como resource do bundle de teste. Adicionar o target ao `TestAction` do scheme via `Xcodeproj::XCScheme`. **Sempre `LC_ALL=en_US.UTF-8` no ruby** (sen\u00e3o `invalid byte sequence in US-ASCII` lendo o pbxproj \u2014 LEARNING #13).\n2. **CocoaPods + `@testable import`**: o m\u00f3dulo do app puxa Firebase transitivo \u2192 `error: missing required module 'Firebase'`. `pod install` N\u00c3O \u00e9 op\u00e7\u00e3o se o projeto est\u00e1 em `objectVersion 70` (CocoaPods 1.16.2 n\u00e3o l\u00ea: \"Unable to find compatibility version string for object version `70`\"). Fix sem pod install: gerar um xcconfig com s\u00f3 os **search-paths** do xcconfig do app (`FRAMEWORK_SEARCH_PATHS`/`HEADER_SEARCH_PATHS`/`OTHER_SWIFT_FLAGS`/`GCC_PREPROCESSOR_DEFINITIONS`/vars `PODS_*` \u2014 **NADA de `OTHER_LDFLAGS`**, o host j\u00e1 linka) e apontar o `base_configuration_reference` do test target pra ele. Versionar o xcconfig no dir de teste (Pods costuma ser gitignored).\n3. **Isolamento de singleton**: `IAPHelper`/`PremiumService` s\u00e3o singletons que vivem o processo de teste inteiro \u2014 a compra de um teste vaza pro `setUp` do pr\u00f3ximo (precondi\u00e7\u00e3o \"come\u00e7a free\" falha). `SKTestSession.clearTransactions()` + remover UserDefaults N\u00c3O limpa o Set em mem\u00f3ria de recibos nem o `isPremium` cacheado. Adicionar resets `#if DEBUG` (`resetPurchasedCacheForTesting`, `resetForTesting`) \u2014 exclu\u00eddos do Release \u2014 e chamar no `setUp`.\n4. **Datas em teste**: comparar `timeIntervalSince1970` com `accuracy:` \u2014 `dateComponents([.day])` trunca (now+9d medido de um now posterior = 8 dias).\n\nRodar: `xcodebuild test -workspace X.xcworkspace -scheme S -only-testing:TestTarget -destination 'platform=iOS Simulator,name=iPhone 16 Pro' CODE_SIGNING_ALLOWED=NO`. Os `SKTestSession(configurationFileNamed:)` acha o `.storekit` no bundle de teste. Ru\u00eddo de log esperado (coretelephony XPC, keychain -34018, Crashlytics signal handlers) N\u00c3O \u00e9 falha.\n\n---\n\n## 24. Xcode Cloud \u2014 a API N\u00c3O cria o produto; 1\u00ba workflow \u00e9 GUI-only (jul/2026, WTMP)\n\nAo tentar disparar archive via **Xcode Cloud** por API (alternativa ao GitHub Actions quando o billing trava):\n- `POST /v1/ciProducts` \u2192 **403 FORBIDDEN**: *\"The resource 'ciProducts' does not allow 'CREATE'. Allowed operations are: DELETE, GET_COLLECTION, GET_INSTANCE\"*. Ou seja, **criar o produto Xcode Cloud de um app \u00e9 imposs\u00edvel por API** (mesma categoria do `POST /v1/apps`). A API s\u00f3 GET/DELETE produtos e gerencia workflows/builds de produtos **j\u00e1 existentes**.\n- `GET /v1/scmProviders/{id}/repositories` s\u00f3 lista os repos **j\u00e1 onboarded** (que t\u00eam produto), N\u00c3O todos os repos que o GitHub App concede. Mesmo com a instala\u00e7\u00e3o GitHub em \"All repositories\", um repo novo (sem produto) **n\u00e3o aparece** \u2014 logo n\u00e3o d\u00e1 pra referenciar em `primaryRepositories`.\n- **Conclus\u00e3o:** o 1\u00ba produto/workflow de um repo novo **precisa da UI do Xcode** (`Integrate \u2192 Create Workflow`, ou o bot\u00e3o \"Open Xcode\" na aba Xcode Cloud do app no ASC). S\u00d3 DEPOIS disso o repo aparece na API e d\u00e1 pra criar workflows extras / disparar `POST /v1/ciBuildRuns` por API.\n- **Pr\u00e9-requisito pra o \"Create Workflow\" achar o scheme:** apps **xcodegen** t\u00eam o `.xcodeproj` gitignored \u2192 o Xcode n\u00e3o acha o scheme. Solu\u00e7\u00e3o (padr\u00e3o do Calc+/iOS no lab): **committar o `.xcodeproj` + `xcshareddata/xcschemes` gerado** (un-ignore no `.gitignore`). Apps CocoaPods (Calc+) j\u00e1 committam o projeto naturalmente; por isso onboardaram f\u00e1cil. O `ci_scripts/ci_post_clone.sh` (xcodegen generate) fica como refresh no runner.\n- **Regra pr\u00e1tica:** se o billing do GitHub Actions travar, o caminho mais r\u00e1pido continua sendo **regularizar o billing** (pipeline j\u00e1 pronto) \u2014 n\u00e3o o Xcode Cloud, cujo onboarding exige 1 clique GUI de qualquer forma.\n\n## 31. Xcode Cloud via ASC API \u2014 rota de archive/upload sem GitHub Actions (23/07/2026 Calc+)\nQuando o billing do GitHub Actions trava, d\u00e1 pra buildar+entregar pela **API do Xcode Cloud** (mesma `[chave]`). Script pronto: `scripts/asc/xcode_cloud.py` (list/build/watch/deliver). Todo app criado p\u00f3s-2023 costuma ter um ciProduct + workflow \"Default\" (auto-criado, ARCHIVE em `master`), mesmo que nunca tenha sido usado.\n\n**Fluxo:** `GET /v1/ciProducts` \u2192 workflow + repo \u2192 `POST /v1/ciBuildRuns` (branch) \u2192 baixar artifact \u2192 altool.\n\n**5 muros que aparecem em sequ\u00eancia (cada fix destrava o pr\u00f3ximo):**\n1. **Trigger em branch de feature** \u2192 409 \"branch not associated with the workflow\". A start condition s\u00f3 tem os branches configurados. Fix: `PATCH /v1/ciWorkflows/{id}` adicionando o branch, dispara, e **reverte**. O PATCH de `branchStartCondition` exige o objeto COMPLETO (`source` + `filesAndFoldersRule` + `autoCancel`) \u2014 mandar s\u00f3 `source` d\u00e1 **500 UNEXPECTED_ERROR**.\n2. **SPM** \u2192 \"a resolved file is required when automatic dependency resolution is disabled\". Xcode Cloud desabilita resolu\u00e7\u00e3o autom\u00e1tica (seguran\u00e7a); o `xcodebuild` do GitHub Actions resolvia na hora. Fix: committar o `Package.resolved` **do `.xcworkspace`** (`App.xcworkspace/xcshareddata/swiftpm/Package.resolved`) \u2014 N\u00c3O s\u00f3 o do `.xcodeproj`. Costuma estar untracked (n\u00e3o gitignored, s\u00f3 esquecido).\n3. **Scheme** \u2192 \"Scheme X is not currently configured for the archive action\". O workflow \"Default\" pode apontar pra uma scheme n\u00e3o-arquiv\u00e1vel. Fix: `PATCH` `actions[].scheme` pra a scheme SHARED que o archive local usa (no Calc+: `Calculator Notes 1`, n\u00e3o `Calculator Notes`).\n4. **Entrega** \u2192 o ARCHIVE com `destination: None` **N\u00c3O sobe pra ASC** \u2014 s\u00f3 gera o artifact `ARCHIVE_EXPORT \"<App> <ver> app-store.zip\"`. Baixar via `downloadUrl` do `ciArtifact` e subir por `altool --upload-app`. (Alternativa permanente: adicionar um deploy post-action de TestFlight/App Store no workflow.)\n5. **Vers\u00e3o** \u2192 o Xcode Cloud **sobrescreve o CFBundleVersion** pelo n\u00famero do build run. O `CFBundleShortVersionString` vem do projeto. **CONFERIR A CONVEN\u00c7\u00c3O DO APP antes**: o Calc+ usa `CFBundleShortVersionString` **NUM\u00c9RICO por build** (build 213 = vers\u00e3o \"213\", anexado \u00e0 appStoreVersion p\u00fablica \"1.5.0\"). Subir \"1.5.0\" foi REJEITADO \u2014 a Apple compara \"1.5.0\" < \"201\" (1 < 201, \"previously approved version\"). Regra: subir n\u00famero **maior que o \u00faltimo build** (216 > 215 > 213), n\u00e3o a vers\u00e3o sem\u00e2ntica. Confirmar via `GET /v1/builds/{id}/preReleaseVersion` (o `.version` \u00e9 o CFBundleShortVersionString real de cada build).\n\n**Cloud signing** \u00e9 gerenciado pela Apple (mais f\u00e1cil que local \u2014 n\u00e3o esbarra no limite de certs do LEARNING #0b). **Pods committados** = builda sem `pod install` (mesmo esquema do GitHub Actions).\n\n---\n\n## 25. Torch/lanterna N\u00c3O liga em background/tela bloqueada (iOS) \u2014 23/07/2026 WTMP\n\n`AVCaptureDevice.torchMode = .on` retorna **sem erro** mas `device.isTorchActive` fica `false` quando o app est\u00e1 em **background ou com a tela bloqueada**. A lanterna faz parte do subsistema de c\u00e2mera, que o iOS bloqueia em background \u2014 mesma raz\u00e3o de a c\u00e2mera n\u00e3o capturar em bg. Sintoma cl\u00e1ssico do usu\u00e1rio: **\"s\u00f3 o barulho toca, a lanterna n\u00e3o acende\"**.\n\n**Diagn\u00f3stico:** instrumentar com `NSLog(\"...isOn=\\(device.isTorchActive)\")` logo ap\u00f3s setar o torch, e ler via `xcrun devicectl device process launch --console`. O `isTorchActive=false` prova que o iOS recusou silenciosamente.\n\n**Fix real (n\u00e3o d\u00e1 pra furar o bloqueio do iOS):** a solu\u00e7\u00e3o \u00e9 de PRODUTO \u2014 um **modo furtivo de tela preta**. O app fica em **foreground** mostrando uma tela 100% preta com brilho zerado (`UIScreen.main.brightness = 0`); parece desligado, mas mant\u00e9m c\u00e2mera + torch + sensores vivos. A\u00ed o torch/strobe funciona porque o app nunca vai pra background.\n\n**Extra (strobe):** usar `DispatchSourceTimer` pro strobe, **n\u00e3o** `Timer.scheduledTimer` (este depende do run loop e engasga). E limpar a flag `strobing` **ANTES** do `.cancel()` do timer \u2014 sen\u00e3o um tick j\u00e1 em voo reacende o torch depois de voc\u00ea achar que desligou.\n\n## 26. `fastlane deliver` DUPLICA screenshots no re-upload \u2014 23/07/2026 WTMP\n\nSubir screenshots de novo com `overwrite_screenshots: true` \u00e0s vezes deixa **2+ c\u00f3pias do mesmo arquivo** no set (visto no WTMP: contagens de 7/8/10 em vez de 5). O overwrite n\u00e3o \u00e9 confi\u00e1vel.\n\n**Fix determin\u00edstico via ASC API:** pra cada `appScreenshotSet`, `GET` os `appScreenshots`, deletar duplicatas por `fileName` (`DELETE`), depois `PATCH` o set com a relationship `appScreenshots` **reordenada** (01..05).\n- Pegadinha do cliente Python: `DELETE` retorna **204 sem body** \u2192 `json.loads` quebra. Envolver em `try/except JSONDecodeError`.\n\n**Regra:** SEMPRE verificar a contagem de screenshots via API depois de rodar o `deliver` \u2014 nunca confiar que ficaram 5.\n\n## 27. `fastlane deliver` pula subtitle em alguns locales (silencioso) \u2014 23/07/2026 WTMP\n\nNo WTMP o `deliver` aplicou name/keywords/description mas deixou o `subtitle` **NULL em pt-BR e es-ES** \u2014 s\u00f3 o en-US entrou. Silencioso, exit 0.\n\n**Fix:** `PATCH` direto em `/v1/appInfoLocalizations/{id}` com `attributes.subtitle`. Lembrar que **name/subtitle vivem em `appInfoLocalizations`, n\u00e3o em `appStoreVersionLocalizations`** (j\u00e1 detalhado no LEARNING #13 \u2014 usar o `appInfo` com state `PREPARE_FOR_SUBMISSION`, n\u00e3o o `READY_FOR_SALE`).\n\n**Regra:** SEMPRE conferir name + subtitle de TODOS os locales via API depois do sync \u2014 o deliver mente por omiss\u00e3o (ver tamb\u00e9m LEARNING #13, no-op silencioso).\n\n## 28. Cert-limit trava o archive normal no CI (n\u00e3o s\u00f3 Distribution) \u2014 23/07/2026 WTMP\n\n`xcodebuild archive` com `-allowProvisioningUpdates` falha com **\"Your account has reached the maximum number of certificates\"** quando CIs antigos acumulam **Development** certs \"Created via API\". O LEARNING #0b j\u00e1 cobre isso pra Distribution certs \u2014 refor\u00e7o que **vale pro archive normal tamb\u00e9m** (o cloud-signing precisa de slot livre de Development tamb\u00e9m).\n\n**Fix:** `GET /v1/certificates` \u2192 `DELETE` os de tipo `DEVELOPMENT` cujo nome cont\u00e9m **\"Created via API\"** (manter os nomeados do Mac do dev + o `IOS_DISTRIBUTION`). No WTMP isso liberou 10 slots.\n\n**Re-rodar:** fix de INFRA (revogar cert) n\u00e3o precisa de novo commit/tag \u2192 `gh run rerun <id>`.\n\n## 29. `PrivacyInfo.xcprivacy` \u00e9 OBRIGAT\u00d3RIO com Firebase (ou qualquer required-reason API) \u2014 23/07/2026 WTMP\n\nSem o `PrivacyInfo.xcprivacy`, a Apple manda o aviso **ITMS-91053** e pode **bloquear** o app (Firebase Analytics/Crashlytics usam required-reason APIs). Vai em `Resources/PrivacyInfo.xcprivacy`, bundlado no **root do `.app`** \u2014 conferir com `ls App.app/PrivacyInfo.xcprivacy`.\n\n**Conte\u00fado pra app com Firebase Analytics + Crashlytics + UserDefaults:**\n- `NSPrivacyTracking = false`\n- `NSPrivacyCollectedDataTypes`: DeviceID (Analytics), ProductInteraction (Analytics), CrashData (AppFunctionality), PerformanceData (AppFunctionality) \u2014 TODOS `not-linked` + `not-tracking`.\n- `NSPrivacyAccessedAPITypes`: UserDefaults com reason `CA92.1`.\n\n## 30. Keychain SOBREVIVE ao uninstall do app (iOS) \u2014 senha/segredo \"fantasma\" no fresh install \u2014 23/07/2026 WTMP\n\nSintoma: usu\u00e1rio baixa o app \"do zero\", N\u00c3O cadastra senha, mas o fluxo que \u00e9 gated por senha (disarm/unlock/lock) pede senha mesmo assim. Causa: no iOS o **Keychain N\u00c3O \u00e9 apagado quando o app \u00e9 desinstalado** \u2014 um segredo salvo por um install anterior (ex: build de teste) persiste, ent\u00e3o `PasscodeService.isSet` (que l\u00ea o Keychain) volta `true` num install \"novo\". `UserDefaults`, ao contr\u00e1rio, \u00c9 apagado no uninstall.\n\n**Fix (gen\u00e9rico p/ qualquer app com segredo no Keychain):** no `init` do `@main App`, detectar fresh install por uma flag em `UserDefaults` (`hasLaunchedBefore`) e, se ausente, limpar os itens de Keychain do app antes do primeiro uso:\n```swift\nlet d = UserDefaults.standard\nif !d.bool(forKey: \"app.hasLaunchedBefore\") {\n    KeychainService.removeAll()   // ou PasscodeService.shared.remove()\n    d.set(true, forKey: \"app.hasLaunchedBefore\")\n}\n```\nRegra: **todo segredo em Keychain precisa de um \"reset no fresh install\"** \u2014 sen\u00e3o QA em device (reinstalar builds por cima) e usu\u00e1rios que reinstalam herdam estado fantasma. Vale pra senha, tokens, flags de compra guardadas em Keychain, etc.\n\n## 32. Asset some SO no build de nuvem = case do git != case do disco (27/07/2026 Calc+)\nSintoma: `UIImage(named:)` funciona em TODO build local mas retorna nil no build de CI/Xcode Cloud (placeholder/imagem some no TestFlight). Causa: macOS e case-INsensitive \u2014 rename que so muda maiuscula/minuscula (Finder/Xcode) NAO registra no git (`core.ignorecase=true`, default do Mac). O checkout de CI (case-sensitive) compila o Assets.car com o nome ANTIGO do git; o build local compila com o nome do disco. **Lookup de asset catalog em runtime e CASE-SENSITIVE** \u2014 s\u00f3 um dos dois mundos acha a imagem.\n- **Diagnostico**: `xcrun assetutil --info App.app/Assets.car` no IPA do CI vs `git ls-files | grep -i <asset>` vs `ls` local. Se os tres divergem em case, e isso.\n- **Fix**: alinhar GIT ao DISCO com rename case-only em 2 passos: `git mv Nome.imageset __tmp && git mv __tmp nome.imageset`. NAO \"consertar\" mudando o codigo pro case do git \u2014 inverte o bug (quebra os builds locais).\n- **NAO setar `core.ignorecase=false`** em FS case-insensitive (a doc do git desaconselha; gera arquivos fantasma). Prevencao: renames SEMPRE via `git mv`; em release, inspecionar o Assets.car do IPA de CI contra os nomes usados no codigo (o pipeline do Calc+ faz esse check antes do altool).\n- Cuidado com literais indiretos: strings de asset passadas como PARAMETRO (`cell.configure(emptyIconName: \"...\")`) escapam de grep por `UIImage(named: \"`. Auditar todo literal de string vs nomes do car.\n\n## 33. Build \"sumiu\" mas o CI tinha FALHADO \u2014 sempre verificar a CONCLUS\u00c3O do run certo (28/07/2026 AirDraw)\n3 builds seguidos \"nunca apareceram na ASC\" e o diagn\u00f3stico correu pro LEARNING #22 (ingest silencioso)... mas os runs do GitHub Actions tinham FALHADO no exportArchive \u2014 os IPAs nunca foram enviados. O watcher (`gh run list --limit 1` ~20s ap\u00f3s o push da tag) pegou o run ANTERIOR (o novo ainda n\u00e3o tinha registrado) e o \"success\" lido era do run velho.\n**Regras:**\n1. Antes de diagnosticar ingest silencioso, `gh run list` e conferir a CONCLUS\u00c3O do run DA TAG (`gh run list -b release/X.Y.Z` ou conferir o displayTitle) \u2014 nunca `--limit 1` logo ap\u00f3s o push.\n2. **Portrait-only + iPad = valida\u00e7\u00e3o falha**: app com suporte a iPad que restringe `UISupportedInterfaceOrientations` pra portrait precisa de `UIRequiresFullScreen = YES` (opt-out do multitasking), sen\u00e3o o exportArchive falha com \"you need to include all orientations to support iPad multitasking\".\n3. (Colateral \u00fatil da investiga\u00e7\u00e3o: SDK velho sem PrivacyInfo.xcprivacy \u2014 ex. Firebase 6.x \u2014 est\u00e1 na lista de required-manifest da Apple e AI SIM causa rejei\u00e7\u00e3o de ingest ITMS-91061 por email. Ao adicionar SDK em app legado, usar vers\u00e3o moderna com manifest: Ads SDK ~> 11 larga o pin do GoogleAppMeasurement e destrava Firebase ~> 11; migra\u00e7\u00e3o do interstitial v7\u2192v11 \u00e9 pequena.)\n\n## 34. Persona FREE no simulador exige limpar o storeUser.db do StoreKit \u2014 uninstall N\u00c3O basta (31/07/2026 Calc+)\nSintoma: fresh install no simulador abre como \"Voc\u00ea \u00e9 Premium\" e invalida QA de paywall (flows Maestro paywall-* falham vendo modal de backup em vez de paywall). Causa: assinatura de teste StoreKit fica num DB a N\u00cdVEL DE DEVICE \u2014 `~/Library/Developer/CoreSimulator/Devices/<UDID>/data/Containers/Shared/AppGroup/<...>/Library/Caches/storeUser.db`, tabela `iap_subscription_status` \u2014 que sobrevive a `simctl uninstall` (\u00e9 o mesmo mecanismo que faz o plano ser recuperado num reinstall real, commit 848ea210 do Calc+).\n**Regra**: persona FREE = uninstall + limpar `iap_subscription_status` do storeUser.db do AppGroup do StoreKit (ou usar um simulador rec\u00e9m-criado/erase). Checar com o app: se Settings mostra \"Seja Premium\", a persona t\u00e1 limpa.\n\n## 35. PPO: ASC re-clona os screenshots herdados DEPOIS do clear \u2014 dedup por sourceFileChecksum, n\u00e3o por fileName (03/08/2026 Cloak)\nAo criar treatment novo, o ASC clona os screenshots da default page pro set do treatment de forma ASS\u00cdNCRONA. O `clear_screenshots_in_set` do upload_ppo.py pode rodar ANTES do clone terminar \u2192 o set acaba com 10 (5 herdados + 5 novos), e como os herdados t\u00eam os MESMOS fileNames dos novos (mesma conven\u00e7\u00e3o 01..05), dedup por nome n\u00e3o funciona. **Fix:** comparar `sourceFileChecksum` (md5) de cada appScreenshot com o md5 do PNG local; deletar os que n\u00e3o batem; depois PATCH da relationship com a ordem 01..05. SEMPRE verificar contagem via API ap\u00f3s o upload (extens\u00e3o do LEARNING #26). Nota: sets de iPad herdados nos treatments s\u00e3o OK (iPad fica igual ao controle, sem varia\u00e7\u00e3o).\nB\u00f4nus: **parar um experimento RODANDO via API funciona** \u2014 `PATCH /v2/appStoreVersionExperiments/{id}` com `{\"attributes\":{\"started\":false}}` \u2192 state STOPPED (resultados preservados). Necess\u00e1rio porque \"Cannot create new experiment because another experiment is running\" bloqueia at\u00e9 o draft.\n**UPDATE 10/08/2026 (Meus Gastos):** o re-clone pode chegar HORAS depois \u2014 um dedup 60s p\u00f3s-upload que passa \"limpo\" N\u00c3O garante nada. Regra: verificar checksums de novo ~1h ap\u00f3s o upload E **sempre re-verificar imediatamente ANTES do PATCH `started:true`** (p\u00f3s-aprova\u00e7\u00e3o). Nunca dar Start sem essa confer\u00eancia.\n**UPDATE 2 (10/08/2026, a causa real do \"t\u00e1 com os prints antigos\"):** subir os prints do treatment S\u00d3 no display type principal (ex. `APP_IPHONE_67`) deixa os sets herdados dos OUTROS display types de iPhone (`APP_IPHONE_65`, `APP_IPHONE_55`) com os prints antigos da default page \u2014 e \u00e9 o 6.5\" que a UI da ASC mostra no preview do treatment, ent\u00e3o o experimento \"parece\" estar com os prints velhos (e devices menores realmente veem os velhos). **Regra: subir os prints novos em TODOS os display types de iPhone que a default page tem** (resize 1320\u00d72868 \u2192 1242\u00d72688 via `sips --resampleWidth 1242 -c 2688 1242`); iPad pode ficar herdado. B\u00f4nus: **DELETE de experimento draft nunca-rodado FUNCIONA via API** (`DELETE /v2/appStoreVersionExperiments/{id}` \u2192 204) depois de cancelar a reviewSubmission (PATCH `canceled:true`) \u2014 o limite de delete (mem\u00f3ria \"PPO experiment delete limit\") vale pra drafts j\u00e1 em READY_FOR_REVIEW/completados.\n\n## 36. Rebrand de app morto na loja sem release pr\u00e9via + prints via Nano (03/08/2026 soninho)\nRebrand completo (name/subtitle/keywords/description/prints) SEM build novo: `POST /v1/appStoreVersions` cria a 1.2.0 edit\u00e1vel \u2192 appInfo entra em PREPARE_FOR_SUBMISSION \u2192 name/subtitle destravam via PATCH em appInfoLocalizations. S\u00f3 o \u00cdCONE exige bin\u00e1rio novo. Prints por IA: skill `/nano-prints` (arquitetura definitiva: arte SEM texto + headline por c\u00f3digo \u2014 margem/alinhamento determin\u00edsticos, 5 gera\u00e7\u00f5es/set; texto baked pela IA = 41 gera\u00e7\u00f5es e headline cortado/desalinhado, N\u00c3O repetir).\n- **Screenshots de concorrente**: iTunes lookup API retorna `screenshotUrls` VAZIO pra apps modernos. Raspar o JSON `<script id=\"serialized-server-data\">` da p\u00e1gina apps.apple.com (filtrar mzstatic sem `Placeholder.mill`/AppIcon, template `{w}x{h}{c}.{f}`). Script: `scripts/aso/competitor_intel.py` (baixa meta+description+prints+\u00edcone; agora \u00e9 a Fase 0.5 do /create-ios-app).\n- **ASO**: \"smart alarm\" US = pop 7/diff 51 (armadilha: soa bom, \u00e9 ruim nos 2 eixos). A brecha real era \"sunrise alarm clock\" \u2014 pop 26-27, diff 13-15 TAMB\u00c9M em BR e ES (usu\u00e1rio latino busca o termo EM INGL\u00caS; sempre checar `get_keyword_suggestions` com store=br/es pra termos ingleses antes de descartar).\n- `edit_image` do Gemini devolve meia resolu\u00e7\u00e3o \u2014 regenerar com refer\u00eancia em vez de editar.\n\n## 37. Rejei\u00e7\u00e3o tripla do WTMP: primer de permiss\u00e3o, \"stealth marketing\" e iPad compat (04/08/2026)\nApp Review (testando num iPad Air 11\" M3) rejeitou o WTMP com 3 problemas de PADR\u00c3O do lab \u2014 valem pra todo app:\n1. **5.1.1(iv) \u2014 primer de permiss\u00e3o N\u00c3O pode ter bot\u00e3o \"Permitir acesso \u00e0 c\u00e2mera\" nem \"Agora n\u00e3o\".** A tela custom antes do prompt do sistema s\u00f3 pode explicar o porqu\u00ea e ter UM bot\u00e3o neutro (\"Continuar\"/\"Avan\u00e7ar\") que SEMPRE leva ao di\u00e1logo do sistema. Bot\u00e3o de adiar = rejei\u00e7\u00e3o. O OnboardingActionStep agora aceita secondary opcional \u2014 usar sem secondary em steps de permiss\u00e3o.\n2. **2.5.14 \u2014 nicho anti-theft/intruder N\u00c3O pode usar \"silent/stealth/spy/secret\" em NENHUM lugar**: UI (40 locales do xcstrings), NSCameraUsageDescription, e metadata dos 39 locales (description/promo/keywords \u2014 incluindo os equivalentes localizados: espi\u00e3o, \u30b9\u30d1\u30a4, \uc2a4\ud30c\uc774, \u0448\u043f\u0438\u043e\u043d, \u062a\u062c\u0633\u0633, \u05e8\u05d9\u05d2\u05d5\u05dc, \u0e2a\u0e2d\u0e14\u0e41\u0e19\u0e21, heimlich, furtivo...). Trocar por \"autom\u00e1tico\". \"Modo furtivo\" \u2192 \"Modo tela preta\". A defesa pro \"means to indicate recording\": a captura s\u00f3 ocorre no instante do alarme (sirene + flash + strobe) + green dot do iOS \u2014 nada desativ\u00e1vel.\n3. **Guideline 4 \u2014 app iPhone-only TAMB\u00c9M \u00e9 testado no iPad (compat canvas ~375pt) e reprova se quebrar.** Dois bugs de layout cl\u00e1ssicos: (a) VStack pinado a `geo.size.height` (Home) clipou o ring no topo e os \u00faltimos toggles embaixo \u2014 fix: envolver em ScrollView com `.frame(minHeight: geo.size.height)` (scrolla s\u00f3 quando n\u00e3o cabe); (b) Texts do OnboardingFeaturePager truncavam com \"\u2026\" sob compress\u00e3o vertical (hero fixo 250pt espremia) \u2014 fix no KIT (4cd86cb): `.fixedSize(horizontal: false, vertical: true)` nos texts + hero com `maxWidth/maxHeight` em vez de frame fixo. Testar todo app novo no sim de iPad ANTES de submeter.\n- Pin de SPM branch N\u00c3O atualiza sozinho: depois de push num kit, `rm Package.resolved + build/DD/SourcePackages` e `xcodebuild -resolvePackageDependencies` pra puxar o novo commit local (CI resolve fresh sempre).\n- **Re-submeter vers\u00e3o REJEITADA via API**: a vers\u00e3o fica presa na reviewSubmission rejeitada (`UNRESOLVED_ISSUES`) \u2014 POST de submission nova + item d\u00e1 `ITEM_PART_OF_ANOTHER_SUBMISSION`, e o PATCH `submitted:true` na antiga fica em \"Version is not ready to be submitted yet\" pra sempre se existir OUTRA submission aberta (a nova vazia n\u00e3o cancela: 409/403). Fix: PATCH `canceled:true` na submission ANTIGA (funciona mesmo com item dentro; estado CANCELING\u2192COMPLETE em ~30s, vers\u00e3o volta a PREPARE_FOR_SUBMISSION) \u2192 a\u00ed o POST do item na submission nova + `submitted:true` passam (WAITING_FOR_REVIEW). Antes de submeter: anexar build via PATCH relationship, e o `appStoreReviewDetails` PATCH exige contactFirstName/LastName/Phone/Email juntos (pegar o phone de outro app da conta via GET).\n\n## 38. Firebase project criado SEM Google Analytics vinculado = analytics silenciosamente descartado (06/08/2026 blw)\nSintoma: app com FirebaseAnalytics integrado e eventos logando, mas NENHUM dado aparece \u2014 o projeto Firebase foi criado no console sem marcar \"Enable Google Analytics\". Sem GA property/stream, os uploads do SDK s\u00e3o descartados (irrecuper\u00e1vel; n\u00e3o h\u00e1 backfill). Detectar via API: `GET https://firebase.googleapis.com/v1beta1/projects/<id>/analyticsDetails` \u2192 404 = n\u00e3o vinculado. Tamb\u00e9m d\u00e1 pra suspeitar pelo `GoogleService-Info.plist` com `IS_ANALYTICS_ENABLED=0` (flag legacy, informacional \u2014 n\u00e3o gate o SDK, mas denuncia que o GA n\u00e3o existia quando o config foi gerado).\n**Fix via API (sem console):** token da conta dona (refresh token do firebase-tools em `~/.config/configstore/firebase-tools.json`, conta `[email]`) \u2192 `POST /v1beta1/projects/<id>:addGoogleAnalytics` body `{\"analyticsAccountId\":\"[conta GA]\"}` (account GA do gambitstudio.tech, o mesmo do meus-gastos). Cria property + stream por app registrado; dados fluem dali em diante SEM build novo. \u26a0\ufe0f zsh: `$p:addGoogleAnalytics` vira modificador `:a` \u2014 usar `${p}:addGoogleAnalytics`.\n**Regra:** todo app novo com Firebase \u2192 conferir `analyticsDetails` logo ap\u00f3s criar o projeto (blw, applock e wtmp foram criados sem GA; corrigidos 06/08/2026 \u2014 properties 548962650 / 549011418 / 548987545, account [conta GA]).\n**Leitura program\u00e1tica de GA4 \u2014 RESOLVIDO 06/08/2026 com service account:** OAuth com escopo analytics est\u00e1 BLOQUEADO nos clients p\u00fablicos (gcloud \u2192 \"app blocked\"; firebase-tools \u2192 403 restricted_client), e a heran\u00e7a de permiss\u00e3o Firebase\u2192GA N\u00c3O vale pra service accounts. O que funciona: SA **`[email]`** (key: `_GambitStudio/keys/ga_admin_sa.json`), adicionado como **Administrador na CONTA GA [conta GA]** (1 clique manual do Jo\u00e3o no GA web UI \u2014 cobre todas as properties, inclusive futuras). Com JWT grant do SA (RS256 \u2192 oauth2.googleapis.com/token) e escopo `analytics.readonly`/`analytics.edit`, d\u00e1 pra: runReport/runRealtimeReport (funil por CLI, sem lag do BigQuery), criar bigQueryLinks (`POST analyticsadmin v1alpha /properties/{id}/bigQueryLinks`), e qualquer Admin API. Lembrar de habilitar `analyticsdata.googleapis.com`/`analyticsadmin.googleapis.com` no projeto (quota).\n**BigQuery export (ativado 06/08/2026 nos 3):** links criados via API \u2014 daily export, location US, datasets `analytics_<propertyId>` (blw 548962650, applock 549011418, wtmp 548987545). Pr\u00e9-requisitos feitos por API: enable `bigquery.googleapis.com` + role BigQuery User pro `[email]` em cada projeto. \u26a0\ufe0f Billing OFF nos 3 \u2192 BigQuery sandbox: gr\u00e1tis mas tabelas expiram em 60 dias e sem streaming; ligar billing se quiser reten\u00e7\u00e3o.\n\n## 39. PPO experiment PODE ser submetido pra review E iniciado via API (07/08/2026 Bible Pills)\nDiferente de subscriptions (web-UI-only), o `reviewSubmissionItems` ACEITA a relationship **`appStoreVersionExperiment`**. Fluxo 100% API: `POST /v1/reviewSubmissions` (platform IOS + app) \u2192 `POST /v1/reviewSubmissionItems` com relationship `appStoreVersionExperiment` \u2192 `PATCH reviewSubmissions {submitted:true}` \u2192 WAITING_FOR_REVIEW. Tentar `PATCH /v2/appStoreVersionExperiments/{id} {started:true}` ANTES da aprova\u00e7\u00e3o d\u00e1 409 \"Can't start experiment, must be reviewed!\" \u2014 depois da aprova\u00e7\u00e3o o mesmo PATCH inicia o teste (`started:false` para, LEARNING #35). Ou seja: o \"Start manual na ASC\" dos PPOs antigos era desnecess\u00e1rio \u2014 d\u00e1 pra automatizar submit e start.\n\n## 39b. `started` de PPO vem NULO mesmo com o teste RODANDO \u2014 ler o `startDate` (30/08/2026 Walk/iPhotos/Calc+)\n`GET /v2/appStoreVersionExperiments/{id}` devolve `\"started\": null` para experimento que est\u00e1 **no ar coletando dados**. O sinal confi\u00e1vel \u00e9 `startDate` preenchido (com `endDate` ~90 dias \u00e0 frente) e `state: APPROVED`; confirmando, o `PATCH started:true` responde **409 \"Can't start experiment, it's already running\"**.\nIsso me fez ler cinco experimentos (Walk, iPhotos, Meus Gastos, Cloak, Calc+) como \"aprovados esperando Start\" quando os cinco j\u00e1 rodavam desde 28-29/08 \u2014 e registrar no now.json uma recomenda\u00e7\u00e3o de \"s\u00f3 dar Start depois\" que j\u00e1 n\u00e3o fazia sentido. **Regra: nunca concluir que um PPO est\u00e1 parado pelo campo `started`; olhar `startDate`.** (O `started:false` do PATCH continua servindo pra PARAR \u2014 LEARNINGS #35.)\nCorol\u00e1rio de m\u00e9todo: um experimento de ordem cujo CONTROLE \u00e9 a p\u00e1gina padr\u00e3o s\u00f3 isola a ordem se a p\u00e1gina padr\u00e3o estiver no mesmo idioma dos tratamentos. Subir print localizado numa vers\u00e3o **em prepara\u00e7\u00e3o** n\u00e3o muda o controle \u2014 a p\u00e1gina viva continua a da vers\u00e3o publicada. Localizar a default page ANTES de submeter o experimento, n\u00e3o depois.\n\n## 40. 2.5.14 \"spy/stealth\" \u2014 limpar TODOS os 39 locales com l\u00e9xico multil\u00edngue, n\u00e3o s\u00f3 o wording \u00f3bvio (13/08/2026 WTMP)\nO WTMP foi rejeitado 2.5.14 pela SEGUNDA vez: a limpeza de 04/08 (LEARNING #37) removeu \"silent/stealth/spy/secret\" do en-US, do app e dos equivalentes mais \u00f3bvios \u2014 mas ficaram **equivalentes locais de \"espi\u00e3o/espiar escondido\" em keywords e descriptions de 11 locales**: tr `casus`, el `\u03ba\u03b1\u03c4\u03ac\u03c3\u03ba\u03bf\u03c0\u03bf\u03c2`, hi `\u091c\u093e\u0938\u0942\u0938`/`\u0924\u093e\u0915-\u091d\u093e\u0902\u0915`, ja `\u306e\u305e\u304d\u898b` (keyword E description), ms `pengintip`, id `pengintip`, zh-Hans `\u9632\u5077\u770b`/`\u76d1\u63a7`, zh-Hant `\u5077\u62cd\u6293\u8cca`/`\u76e3\u8996`/`\u5077\u770b`, ko `\ubab0\ub798 \ubcf4\ub294`, th `\u0e41\u0e2d\u0e1a\u0e14\u0e39`. Mesmo palavras descrevendo o INTRUSO (\"pega quem espia escondido\") contam \u2014 trocar por \"intruso/invasor\" neutro.\n**Regra:** ao limpar 2.5.14 (ou qualquer wording banido), varrer a metadata LIVE via API (n\u00e3o os arquivos locais \u2014 s\u00f3 3 locales existem em disco) com um l\u00e9xico multil\u00edngue que inclua tamb\u00e9m os verbos de \"espiar/bisbilhotar \u00e0s escondidas\": spy/stealth/secret/covert/hidden + casus, \u03ba\u03b1\u03c4\u03ac\u03c3\u03ba\u03bf\u03c0, \u091c\u093e\u0938\u0942\u0938, \u091d\u093e\u0902\u0915, \u306e\u305e\u304d|\u8997, \u5077\u770b|\u5077\u62cd|\u76e3\u8996|\u76d1\u63a7|\u7aa5, \ubab0\ub798|\uc2a4\ud30c\uc774, \u0e41\u0e2d\u0e1a|\u0e2a\u0e2d\u0e14\u0e41\u0e19\u0e21, pengintip|mata-mata, gizli(ce), esp\u00eda|espion|espi\u00e3o, \u0448\u043f\u0438\u043e\u043d|\u043f\u043e\u0434\u0433\u043b\u044f\u0434|\u0441\u043a\u0440\u044b\u0442, \u062a\u062c\u0633\u0633|\u062e\u0641\u064a, \u05e8\u05d9\u05d2\u05d5\u05dc|\u05d7\u05e9\u05d0\u05d9, gi\u00e1n \u0111i\u1ec7p|l\u00e9n. Cuidado com falsos positivos leg\u00edtimos: \"Gizlilik Politikas\u0131\" (=Pol\u00edtica de Privacidade, tr), \"mode senyap\" (=modo silencioso, id/ms), \"\ube44\ubc00\ubc88\ud638\" (=senha, ko).\nFix 100% via PATCH em `appStoreVersionLocalizations` (keywords \u2264100 chars \u2014 validar com `len()` Python) + re-submiss\u00e3o: cancelar a submission UNRESOLVED_ISSUES (PATCH canceled:true), POST reviewSubmission nova + item com a appStoreVersion (funciona mesmo com a vers\u00e3o exibindo state REJECTED) + PATCH submitted:true.\n\n## 41. Simulador com m\u00faltiplas sess\u00f5es Claude \u2014 NUNCA usar \"booted\", sempre UDID expl\u00edcito (18/08/2026)\nCom mais de uma sess\u00e3o Claude automatizando simuladores ao mesmo tempo, `simctl`/`idb`/sim-mcp com target `booted` cai no simulador da OUTRA sess\u00e3o (ex.: Meus Gastos abriu por cima do QA do Walk num iPhone 16 alheio). **Regra: todo comando de simulador (boot, install, launch, tap, screenshot, maestro) passa o UDID expl\u00edcito do SEU device** \u2014 capturar o UDID no in\u00edcio da sess\u00e3o (`xcrun simctl list devices | grep Booted` ou criar/bootar um pr\u00f3prio) e usar sempre. Se precisar de um device dedicado, `simctl clone`/create em vez de reutilizar o que j\u00e1 est\u00e1 booted.\n\n## 42. Seeder DEBUG de HealthKit no simulador \u2014 3 muros em sequ\u00eancia (18/08/2026
