der><div class="wrap"><div class=mstamp>atualizado 25/10 03:53</div><style>.dh{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px;margin:4px 0 18px}.dh-back{font:600 14px -apple-system,system-ui,sans-serif;padding:8px 16px;border-radius:999px;border:0;background:#111;color:#fff;cursor:pointer}.dh-mon{display:flex;align-items:center;gap:10px;padding:6px 14px 6px 6px;border:1px solid var(--bd);border-radius:14px;background:var(--card)}.dh-mon>div{display:flex;flex-direction:column}.dh-mon b{font-size:16px}.dh-mon span{font-size:12.5px;color:var(--mut);max-width:34ch}</style><div class=dh><button class=dh-back type=button onclick="history.back()">← voltar</button></div><p class="sub"><code>_GambitStudio/reports/baby-english-2026-09/research/risks.md</code></p><div id="md"><div class=mdpart data-i="0"></div></div><script>const RAWS=["# Baby English \u2014 Pesquisa de risco e viabilidade\n\n**Ideia avaliada:** app de \u00e1udio em ingl\u00eas para beb\u00eas 0-3 anos (m\u00fasica, hist\u00f3rias, vocabul\u00e1rio falado), consumo passivo, possivelmente sem tela. \"Duolingo para beb\u00eas\".\n**Data da pesquisa:** 2026-09-17\n**Regra deste documento:** toda afirma\u00e7\u00e3o carrega fonte (link + ano). Onde n\u00e3o houve dado, est\u00e1 escrito \"n\u00e3o encontrado\". Nenhum n\u00famero foi estimado ou inferido.\n\n---\n\n## BLOCO 1 \u2014 A premissa funciona? (evid\u00eancia cient\u00edfica)\n\n### 1.1 O estudo-\u00e2ncora: Kuhl, Tsao & Liu (2003), PNAS\n\n**Refer\u00eancia:** Kuhl, P. K., Tsao, F.-M., & Liu, H.-M. (2003). *Foreign-language experience in infancy: Effects of short-term exposure and social interaction on phonetic learning.* PNAS 100(15), 9096-9101. https://www.pnas.org/doi/10.1073/pnas.1532872100\n\n**Desenho:** beb\u00eas americanos de 9 meses receberam 12 sess\u00f5es de exposi\u00e7\u00e3o ao mandarim. Grupo controle recebeu as mesmas 12 sess\u00f5es em ingl\u00eas. No **Experimento 2**, outros beb\u00eas receberam **exatamente o mesmo material e os mesmos falantes**, mas em grava\u00e7\u00e3o **audiovisual (DVD)** ou em **\u00e1udio puro**.\n\n**Resultado:**\n- Exposi\u00e7\u00e3o **ao vivo** reverteu o decl\u00ednio natural da discrimina\u00e7\u00e3o de fonemas n\u00e3o-nativos que ocorre entre 6 e 12 meses.\n- Exposi\u00e7\u00e3o **audiovisual e \u00e1udio-only: efeito zero.** Os beb\u00eas dos grupos AV e A **n\u00e3o se diferenciaram do grupo controle que nunca ouviu mandarim**.\n- Formula\u00e7\u00e3o dos autores: entre 9 e 10 meses, beb\u00eas aprendem fon\u00e9tica \"a partir de exposi\u00e7\u00e3o ao vivo, mas n\u00e3o pr\u00e9-gravada\" (\"from live, but not prerecorded, exposure to a foreign language\"), num processo \"enhanced by social interaction\".\n\n**Isto \u00e9 o teste direto da premissa do app, e ele deu negativo.** O produto proposto \u00e9 literalmente o bra\u00e7o experimental que falhou \u2014 mesmo conte\u00fado, mesma l\u00edngua, mesma faixa et\u00e1ria, entregue por grava\u00e7\u00e3o.\n\nConfirma\u00e7\u00e3o secund\u00e1ria do mesmo achado, com os n\u00fameros do bra\u00e7o AV/A: https://www.pnas.org/doi/10.1073/pnas.1611621115 (Roseberry/PNAS 2018, que cita o bra\u00e7o nulo de Kuhl 2003) e a revis\u00e3o de Kuhl (2007) *Is speech learning 'gated' by the social brain?* http://life-slc.org/docs/LSLCpk_2007_Kuhl_Dev_Sci.pdf\n\n---\n\n### 1.2 O que veio depois: \"video deficit\" / \"transfer deficit\"\n\n| Estudo | Ano | Achado |\n|---|---|---|\n| **Anderson & Pempek** \u2014 cunham o termo *video deficit* | 2005 | Crian\u00e7as pequenas aprendem menos de v\u00eddeo do que da mesma experi\u00eancia ao vivo |\n| **Zimmerman, Christakis & Meltzoff**, *J. Pediatrics* | 2007 | Cada hora/dia de DVD/v\u00eddeo \"para beb\u00eas\" em beb\u00eas de **8-16 meses** associada a **6-8 palavras A MENOS** compreendidas. Autor: \"no clear evidence of a benefit... and there is some suggestion of harm\". https://www.sciencedaily.com/releases/2007/08/070808082039.htm |\n| **DeLoache et al.**, *Psychological Science* 21 | 2010 | 96 fam\u00edlias, beb\u00eas 12-18 meses, DVD educativo best-seller v\u00e1rias vezes/semana por 4 semanas. **Nenhuma palavra a mais que o controle**, com ou sem o pai junto. O maior aprendizado foi no grupo **sem v\u00eddeo**, em que os pais ensinavam as mesmas palavras no dia a dia. Pais que gostavam do DVD **superestimavam** o quanto o filho tinha aprendido. https://pubmed.ncbi.nlm.nih.gov/20855901/ |\n| **Strouse & Samson**, *Child Development* 92(1) \u2014 meta-an\u00e1lise | 2021 | 122 tamanhos de efeito, 59 relatos, 0-6 anos. D\u00e9ficit m\u00e9dio de **~0,5 desvio-padr\u00e3o** ao aprender de v\u00eddeo vs presencial. Diminui com a idade; **n\u00e3o h\u00e1 diferen\u00e7a entre v\u00eddeo ao vivo e pr\u00e9-gravado**. Os autores alertam para poss\u00edvel vi\u00e9s de publica\u00e7\u00e3o superestimando o efeito. https://pubmed.ncbi.nlm.nih.gov/33491209/ |\n| **Korres et al.**, *Cureus*, scoping review | 2024 | 21 artigos. Uso n\u00e3o supervisionado: **6,25\u00d7** mais risco de escore de comunica\u00e7\u00e3o baixo vs visualiza\u00e7\u00e3o dirigida por adulto. TV iniciada antes dos 12 meses com 2h+/dia: **4-6\u00d7** mais chance de atraso de linguagem. https://pmc.ncbi.nlm.nih.gov/articles/PMC11026032/ |\n| **Silva Junior et al.**, *Child: Care, Health and Development* \u2014 revis\u00e3o sistem\u00e1tica | 2025 | 17 estudos, 6 meses-6 anos. Associa\u00e7\u00e3o majoritariamente **negativa** entre tempo de tela excessivo e linguagem, sobretudo expressiva e vocabul\u00e1rio. https://pubmed.ncbi.nlm.nih.gov/41235618/ |\n\n**Nota de calibragem:** a meta-an\u00e1lise de 2021 mostra que o d\u00e9ficit **\u00e9 menor para tarefas de linguagem** do que para imita\u00e7\u00e3o ou recupera\u00e7\u00e3o de objeto \u2014 mas continua **significativo**. E o dado mais duro contra a vers\u00e3o \"\u00e1udio \u00e9 diferente de v\u00eddeo\": para **fon\u00e9tica aos 9 meses**, \u00e1udio puro foi t\u00e3o nulo quanto o v\u00eddeo (Kuhl 2003).\n\n---\n\n### 1.3 O risco espec\u00edfico do formato \"deixa tocando ao fundo\"\n\nEste \u00e9 o achado mais desconfort\u00e1vel para o produto proposto, porque n\u00e3o \u00e9 sobre tela \u2014 \u00e9 sobre **som ambiente**.\n\n**Christakis et al. (2009)**, *Archives of Pediatrics & Adolescent Medicine*, n=329 crian\u00e7as de 2 a 48 meses, grava\u00e7\u00e3o de dia inteiro com LENA:\n> cada hora de **televis\u00e3o aud\u00edvel** associada a redu\u00e7\u00e3o significativa de vocaliza\u00e7\u00f5es da crian\u00e7a, dura\u00e7\u00e3o das vocaliza\u00e7\u00f5es e **turnos conversacionais**; e a **~770 palavras a menos** ditas por um adulto para a crian\u00e7a naquela sess\u00e3o (faixa de 500-1.000 palavras/hora).\nhttps://pubmed.ncbi.nlm.nih.gov/19487612/\n\nOu seja: **m\u00eddia aud\u00edvel de fundo desloca a fala do cuidador** \u2014 que \u00e9 justamente o \u00fanico insumo que a literatura mostra funcionar. Um app cuja proposta de valor \u00e9 \"deixe tocando em ingl\u00eas enquanto o beb\u00ea brinca\" reproduz exatamente a condi\u00e7\u00e3o medida aqui. O mecanismo de dano n\u00e3o depende de a crian\u00e7a olhar para uma tela.\n\n---\n\n### 1.4 Existe evid\u00eancia POSITIVA de \u00e1udio passivo? Sim, mas n\u00e3o \u00e9 a que o app venderia\n\nAqui est\u00e1 a parte honesta: exposi\u00e7\u00e3o auditiva passiva **n\u00e3o \u00e9 inerte**. Ela faz coisas reais \u2014 s\u00f3 n\u00e3o faz \"aprender ingl\u00eas\".\n\n**(a) Aprendizado estat\u00edstico \u2014 funciona, e r\u00e1pido**\nSaffran, Aslin & Newport (1996), *Science* 274. Beb\u00eas de **8 meses** segmentaram palavras de um fluxo cont\u00ednuo de fala sint\u00e9tica **ap\u00f3s apenas 2 minutos de escuta passiva**, usando s\u00f3 probabilidades de transi\u00e7\u00e3o entre s\u00edlabas. https://www.science.org/doi/10.1126/science.274.5294.1926\n\u2192 Prova que o c\u00e9rebro do beb\u00ea extrai regularidade de \u00e1udio gravado sem intera\u00e7\u00e3o. Mas o que ele extrai \u00e9 **estrutura distribucional**, n\u00e3o vocabul\u00e1rio nem significado.\n\n**(b) Mem\u00f3ria fon\u00e9tica pr\u00e9-natal \u2014 \u00e1udio puro, sem nenhuma intera\u00e7\u00e3o**\nMoon, Lagercrantz & Kuhl (2013), *Acta Paediatrica*. 80 rec\u00e9m-nascidos (Su\u00e9cia e EUA, m\u00e9dia de **33 horas de vida**) discriminaram vogais nativas de n\u00e3o-nativas em paradigma de suc\u00e7\u00e3o. Primeira demonstra\u00e7\u00e3o de que o feto aprende sobre os sons da l\u00edngua materna antes de nascer. https://pubmed.ncbi.nlm.nih.gov/23173548/\n\u2192 \u00c1udio passivo **deixa tra\u00e7o fon\u00e9tico**. Mas o insumo aqui s\u00e3o meses de fala materna cont\u00ednua, n\u00e3o 20 min/dia de playlist.\n\n**(c) Sotaque: o achado mais favor\u00e1vel ao produto**\nAu, Knightly, Jun & Oh (2002), *Psychological Science* 13, 238-243, \"Overhearing a Language During Childhood\". Adultos que **apenas ouviram** espanhol na inf\u00e2ncia (sem falar) tinham, ao reaprender o idioma adulto, **pron\u00fancia mais nativa** \u2014 medidas fon\u00e9ticas de consoantes oclusivas e avalia\u00e7\u00e3o de sotaque por nativos \u2014 **mas nenhuma vantagem em morfossintaxe**. https://pubmed.ncbi.nlm.nih.gov/12009044/ ; produ\u00e7\u00e3o: Knightly, Jun, Oh & Au (2003), *JASA* 114(1), 465. https://pubs.aip.org/asa/jasa/article-abstract/114/1/465/543664\n\u2192 **Este \u00e9 o \u00fanico benef\u00edcio da premissa com respaldo forte.** Mas aten\u00e7\u00e3o ao que foi medido: \"overhearing\" = anos de fala humana real, ao vivo, no ambiente dom\u00e9stico (av\u00f3s, parentes), n\u00e3o \u00e1udio gravado. E o benef\u00edcio aparece **anos depois, e s\u00f3 quando a pessoa vai de fato aprender o idioma**.\n\n**(d) Exposi\u00e7\u00e3o auditiva passiva estruturada muda o c\u00e9rebro, mas n\u00e3o o escore de linguagem**\nOrtiz-Mantilla, Roesler, Realpe-Bonilla & Benasich (2023), *Cerebral Cortex* 33(12), 7595. Beb\u00eas de 4 meses, 6 semanas de exposi\u00e7\u00e3o passiva (1\u00d7/semana) a pares de sons **n\u00e3o-fala** durante brincadeira livre. Resultado: mudan\u00e7a em sincronia de fase theta no c\u00f3rtex auditivo. **Sem diferen\u00e7a significativa em medidas padronizadas de linguagem (PLS-4, CDI) aos 12-18 meses** \u2014 as m\u00e9dias do grupo exposto foram \"consistentemente mais altas\", sem atingir signific\u00e2ncia. https://academic.oup.com/cercor/article/33/12/7595/7086052\n\u2192 Neuroplasticidade mensur\u00e1vel \u2260 benef\u00edcio de linguagem mensur\u00e1vel. Este estudo \u00e9 frequentemente citado como prova de que \"\u00e1udio passivo funciona\"; lido inteiro, ele diz o contr\u00e1rio no desfecho que interessa ao pai.\n\n**(e) M\u00fasica e can\u00e7\u00e3o**\nSnijders, Benders & Fikkert (2020), *Brain Sciences* 10(1), 39 \u2014 beb\u00eas holandeses de 10 meses segmentaram palavras de **can\u00e7\u00f5es** (efeito ERP de familiaridade). https://doi.org/10.3390/brainsci10010039\nRevis\u00e3o sistem\u00e1tica de interven\u00e7\u00f5es com can\u00e7\u00f5es para ensino de L2 (Sistematic review, *System*, 2024) descreve suporte **equ\u00edvoco** para pr\u00e9-escolares aprenderem vocabul\u00e1rio ou consci\u00eancia fonol\u00f3gica em ingl\u00eas por can\u00e7\u00f5es. https://www.sciencedirect.com/science/article/pii/S0346251X24001325\n\u2192 Can\u00e7\u00e3o ajuda a segmenta\u00e7\u00e3o e a pros\u00f3dia. N\u00e3o h\u00e1 evid\u00eancia de que produza aquisi\u00e7\u00e3o de um segundo idioma em 0-3.\n\n**(f) M\u00eddia em geral, por idade \u2014 a linha de corte \u00e9 ~3 anos**\nSun & Yin (2020), *Frontiers in Psychology*, \"Multimedia Input and Bilingual Children's Language Learning\". https://pmc.ncbi.nlm.nih.gov/articles/PMC7438791/\n- **Abaixo de ~3 anos: nulo.** Taylor et al. (2018), 131 crian\u00e7as brit\u00e2nicas 6-36 meses \u2014 nenhum efeito de tempo de tela sobre vocabul\u00e1rio. Alloway et al. (2014), 30 toddlers \u2014 nenhum efeito. Patterson (2002) \u2014 TV n\u00e3o previu tamanho de vocabul\u00e1rio em toddlers bil\u00edngues (~2 anos). Scheele et al. (2010) \u2014 nenhuma correla\u00e7\u00e3o entre TV educativa na l\u00edngua de heran\u00e7a e vocabul\u00e1rio em crian\u00e7as de 3 anos.\n- **Acima de 3 anos: positivo.** Rice et al. (1990) \u2014 telespectadores frequentes de *Sesame Street* com vocabul\u00e1rio significativamente melhor aos 5. Singer & Singer (1998) \u2014 ganho de vocabul\u00e1rio com *Barney*.\n\n---\n\n### 1.5 O contrafactual: o que a literatura mostra que FUNCIONA, e a que custo\n\nFerjan Ram\u00edrez & Kuhl (2017), *Mind, Brain and Education*, \"Bilingual Baby: Foreign Language Intervention in Madrid's Infant Education Centers\". https://onlinelibrary.wiley.com/doi/10.1111/mbe.12144\n- 126 crian\u00e7as na interven\u00e7\u00e3o (280 matriculadas), **7 a 33,5 meses** \u2014 exatamente a faixa do app.\n- **1 hora por dia, 18 semanas**, em grupo, com **tutores nativos ao vivo** (16 tutores), m\u00e9todo baseado em intera\u00e7\u00e3o social e \"parentese\".\n- Resultado: ao final, as crian\u00e7as da interven\u00e7\u00e3o produziam **74 palavras/frases em ingl\u00eas por crian\u00e7a por hora**, contra **13** no grupo controle. Ganhos **mantidos 18 semanas depois**. https://neurosciencenews.com/infant-learning-foreign-language-7098/\n\n**A leitura comercial disto \u00e9 dura:** a dose que produz resultado documentado \u00e9 ~90 horas de **intera\u00e7\u00e3o humana ao vivo** por crian\u00e7a. Nenhum app de \u00e1udio entrega isso, e o bra\u00e7o que tentou entregar por grava\u00e7\u00e3o (Kuhl 2003) deu zero.\n\n---\n\n### 1.6 Conclus\u00e3o honesta do Bloco 1\n\n**A promessa \"deixe seu beb\u00ea escutando e ele aprende ingl\u00eas\" \u00e9 contradita pela evid\u00eancia direta.** N\u00e3o \u00e9 uma \u00e1rea de incerteza: existe um experimento que testou exatamente essa condi\u00e7\u00e3o, na faixa et\u00e1ria certa, com o conte\u00fado certo, e o efeito foi **indistingu\u00edvel de zero** (Kuhl, Tsao & Liu, 2003).\n\nO que a evid\u00eancia sustenta, com honestidade:\n\n| Promessa | Sustent\u00e1vel? | Evid\u00eancia |\n|---|---|---|\n| \"Beb\u00ea aprende ingl\u00eas / vocabul\u00e1rio ouvindo\" | **N\u00c3O** | Kuhl 2003 (nulo); DeLoache 2010 (nulo); Patterson 2002, Scheele 2010, Taylor 2018 (nulo <3 anos) |\n| \"Ajuda a acostumar o ouvido / discrimina\u00e7\u00e3o fon\u00e9tica\" | **N\u00c3O, para \u00e1udio gravado** | Kuhl 2003 testou exatamente isto e falhou. O bra\u00e7o positivo era ao vivo. |\n| \"Deixa tra\u00e7o de sotaque para o futuro\" | **Parcial \u2014 plaus\u00edvel, n\u00e3o provado para \u00e1udio gravado** | Au et al. 2002 / Knightly et al. 2003 mostram benef\u00edcio de sotaque, mas com *overhearing* de fala humana real ao longo de anos |\n| \"Exposi\u00e7\u00e3o \u00e0 pros\u00f3dia/musicalidade da l\u00edngua\" | **Sim, fracamente** | Saffran 1996 (aprendizado estat\u00edstico passivo); Snijders 2020 (segmenta\u00e7\u00e3o em can\u00e7\u00f5es); Moon 2013 (tra\u00e7o fon\u00e9tico pr\u00e9-natal) |\n| \"\u00c9 inofensivo, no pior caso n\u00e3o faz nada\" | **N\u00c3O \u2014 h\u00e1 risco documentado** | Christakis 2009: m\u00eddia aud\u00edvel reduz ~770 palavras de adulto/hora e turnos conversacionais |\n\n**Veredito:** a premissa central n\u00e3o passa. Um app constru\u00eddo sobre ela ou (a) faz uma alega\u00e7\u00e3o que a ci\u00eancia contradiz \u2014 com risco de metadata review e de backlash \u2014, ou (b) recua para uma promessa honesta (\"ritual de m\u00fasica e hist\u00f3rias em ingl\u00eas para voc\u00eas DOIS\") que deixa de ser \"Duolingo para beb\u00eas\" e vira um app de conte\u00fado infantil competindo com YouTube de gra\u00e7a.\n\n---\n\n## BLOCO 2 \u2014 Risco regulat\u00f3rio e de App Review\n\n### 2.1 Apple \u2014 Guideline 1.3 (Kids Category), texto literal\n\nFonte: https://developer.apple.com/app-store/review/guidelines/ (consultada em 2026-09-17)\n\n> **1.3 Kids Category**\n> \"The Kids Category is a great way for people to easily find apps that are designed for children. If you want to participate in the Kids Category, you should focus on creating a great experience specifically for younger users. **These apps must not include links out of the app, purchasing opportunities, or other distractions to kids unless reserved for a designated area behind a parental gate.** Keep in mind that once customers expect your app to follow the Kids Category requirements, **it will need to continue to meet these guidelines in subsequent updates, even if you decide to deselect the category.**\"\n>\n> \"You must comply with applicable privacy laws around the world relating to the collection of data from children online. [...] In addition, **Kids Category apps may not send personally identifiable information or device information to third parties. Apps in the Kids Category should not include third-party analytics or third-party advertising.** This provides a safer experience for kids. **In limited cases, third-party analytics may be permitted provided that the services do not collect or transmit the IDFA or any identifiable information about children** (such as name, date of birth, email address), **their location, or their devices.** This includes any device, network, or other information that could be used directly or combined with other information to identify users and their devices. **Third-party contextual advertising may also be permitted in limited cases** provided that the services have publicly documented practices and policies for Kids Category apps that include human review of ad creatives for age appropriateness.\"\n\n**O que isso obriga, na pr\u00e1tica, para este app:**\n\n| Exig\u00eancia | Consequ\u00eancia para o produto |\n|---|---|\n| **Parental gate** obrigat\u00f3rio antes de qualquer link externo, compra ou \"distra\u00e7\u00e3o\" | Toda IAP/assinatura, todo link (privacy policy, suporte, avalia\u00e7\u00e3o na loja) fica atr\u00e1s de gate. Onboarding com CTA de assinatura na frente = rejei\u00e7\u00e3o. |\n| **Sem PII nem device info para terceiros** | Nenhum SDK que envie identificador. |\n| **Sem analytics de terceiros** (exce\u00e7\u00e3o estreita: sem IDFA, sem nada identific\u00e1vel de crian\u00e7a/dispositivo) | **Firebase Analytics do jeito que o lab usa hoje \u00e9 incompat\u00edvel.** Ver 2.3. |\n| **Sem publicidade de terceiros** (exce\u00e7\u00e3o: contextual, com pol\u00edtica p\u00fablica e revis\u00e3o humana de criativos) | **AdMob padr\u00e3o est\u00e1 fora.** Zero receita de an\u00fancio. |\n| **Irrevers\u00edvel na pr\u00e1tica** | Escolheu Kids Category, o app fica preso \u00e0s regras **mesmo se desmarcar a categoria depois**. N\u00e3o d\u00e1 para \"come\u00e7ar Kids e virar normal\". |\n\n### 2.2 Apple \u2014 Guideline 5.1.4 (Kids), texto literal\n\n> **5.1.4 Kids** \u2014 **(a)** \"For many reasons, it is critical to use care when dealing with personal data from kids, and we encourage you to carefully review all the requirements for complying with laws like the Children's Online Privacy Protection Act (\"COPPA\"), the European Union's General Data Protection Regulation (\"GDPR\"), and any other applicable regulations or laws.\n> Apps may ask for birthdate and parental contact information **only for the purpose of complying with these statutes**, but must include some useful functionality or entertainment value regardless of a person's age.\n> **Apps intended primarily for kids should not include third-party analytics or third-party advertising.** This provides a safer experience for kids.\"\n>\n> **(b)** \"In limited cases, third-party analytics and third-party advertising may be permitted provided that the services adhere to the same terms set forth in Guideline 1.3.\n> Moreover, **apps in the Kids Category or those that collect, transmit, or have the capability to share personal information** (e.g. name, address, email, location, photos, videos, drawings, the ability to chat, other personal data, **or persistent identifiers used in combination with any of the above**) **from a minor must include a privacy policy** and must comply with all applicable children's privacy statutes. For the sake of clarity, **the parental gate requirement for the Kid's Category is generally not the same as securing parental consent** to collect personal data under these privacy statutes.\"\n\n**Aten\u00e7\u00e3o \u00e0 frase \"apps intended primarily for kids\"** \u2014 a regra 5.1.4 **n\u00e3o depende de o app estar na Kids Category**. Um app cujo p\u00fablico-alvo declarado \u00e9 beb\u00ea de 0-3 anos \u00e9 \"intended primarily for kids\" mesmo que o Jo\u00e3o escolha uma categoria de Educa\u00e7\u00e3o comum. **N\u00e3o existe rota de fuga por categoria.**\n\n### 2.3 Apple \u2014 Guideline 2.3.8 (armadilha de ASO, achado colateral)\n\nCitada dentro da pr\u00f3pria 5.1.4:\n> \"As a reminder, **Guideline 2.3.8 requires that use of terms like \"For Kids\" and \"For Children\" in app metadata is reserved for the Kids Category.** Apps not in the Kids Category cannot include any terms in app name, subtitle, icon, screenshots or description that imply the main audience for the app is children.\"\n\n**Consequ\u00eancia direta para o naming/ASO:** um nome tipo \"English for Babies / Ingl\u00eas para Beb\u00eas\", \u00edcone de beb\u00ea, ou prints com crian\u00e7a **implicam que o p\u00fablico principal \u00e9 crian\u00e7a** \u2192 ou o app entra na Kids Category (e herda 1.3 inteira), ou a metadata \u00e9 rejeitada. N\u00e3o d\u00e1 para ter o ASO de app infantil e a liberdade t\u00e9cnica de app adulto.\n\n### 2.4 Recomenda\u00e7\u00e3o pedi\u00e1trica atual \u2014 e o ponto onde \u00c1UDIO \u00e9 tratado diferente\n\n**AAP, pol\u00edtica VIGENTE (substitui \"Media and Young Minds\", 2016):**\n*Digital Ecosystems, Children, and Adolescents: Policy Statement.* **Pediatrics 157(2):e2025075320, fevereiro de 2026.** https://publications.aap.org/pediatrics/article/157/2/e2025075320/206129 \u00b7 texto integral: https://pmc.ncbi.nlm.nih.gov/articles/PMC13122503/\n- Abandona o limite por minutos e adota o framework dos **\"5 C's\"** (Child, Content, Calm, Crowding out, Communication). https://www.aap.org/en/patient-care/media-and-children/center-of-excellence-on-social-media-and-youth-mental-health/5cs-of-media-use/\n- Sobre beb\u00eas, verbatim: *\"Infants under 18 months struggle to transfer information from a screen to the real world because of immature cognitive processing.\"* \u2014 \u00e9 o \"video deficit\" do Bloco 1 escrito em pol\u00edtica pedi\u00e1trica.\n- A recomenda\u00e7\u00e3o operacional mantida pela AAP para **<18 meses**: nada de telas exceto **videochamada com um adulto** (porque tem turno conversacional e intera\u00e7\u00e3o de duas vias); **18-24 meses**: s\u00f3 conte\u00fado educativo **com o cuidador junto**; **2-5 anos**: ~1h de conte\u00fado de qualidade com co-visualiza\u00e7\u00e3o. https://www.aap.org/en/patient-care/media-and-children/center-of-excellence-on-social-media-and-youth-mental-health/qa-portal/qa-portal-library/qa-portal-library-questions/screen-time-for-infants/ (atualizada 02/01/2024)\n\n**\u00c1UDIO conta como screen time? \u2014 resposta apurada: N\u00c3O, e essa \u00e9 a melhor not\u00edcia do dossi\u00ea.**\n- A pol\u00edtica de 2026 da AAP **n\u00e3o trata \u00e1udio** em nenhum ponto relevante. A \u00fanica men\u00e7\u00e3o a \u00e1udio no documento inteiro \u00e9 no contexto de sono: *\"For children who watch videos to fall asleep, consider meditation apps, sound machines, or quiet music.\"* \u2014 ou seja, \u00e1udio aparece como a **alternativa recomendada** \u00e0 tela, n\u00e3o como algo a limitar.\n- A AAP tem uma p\u00e1gina dedicada, *Audiobooks, Audio Players, and Child Development*, **atualizada em 21/04/2026**, que discute audiolivros e players (Yoto/Tonies) como **\"screen-free devices\"**. https://www.aap.org/en/patient-care/media-and-children/center-of-excellence-on-social-media-and-youth-mental-health/qa-portal/qa-portal-library/qa-portal-library-questions/audiobooks-audio-players-and-child-development/\n  **Por\u00e9m \u2014 e isto limita o uso da p\u00e1gina como argumento de marketing \u2014 a evid\u00eancia citada \u00e9 toda de 3 anos para cima**: Dore et al. (2018) com crian\u00e7as de 4-5 anos; Singh & Alexander (2022), revis\u00e3o sistem\u00e1tica de jardim de inf\u00e2ncia \u00e0 6\u00aa s\u00e9rie; National Literacy Trust (2024) com 8-18 anos; Olson et al. (2026) com 3\u00aa-4\u00aa s\u00e9rie. **A AAP n\u00e3o d\u00e1 orienta\u00e7\u00e3o espec\u00edfica de \u00e1udio para menores de 2 anos.** O achado central que ela reporta \u00e9: *\"children comprehended content from e-books far better when audio narration was used than when it was not, but their greatest comprehension was when a parent read the story with them.\"* \u2014 de novo o adulto ganhando da m\u00eddia sozinha.\n- **OMS (2019)**, *Guidelines on physical activity, sedentary behaviour and sleep for children under 5 years of age*: a restri\u00e7\u00e3o \u00e9 explicitamente sobre **\"sedentary SCREEN time\"** \u2014 zero para 1-2 anos, m\u00e1ximo 1h aos 2-4 anos. \u00c1udio n\u00e3o est\u00e1 no escopo. E a diretriz diz que, quando sedent\u00e1ria, a crian\u00e7a deve estar **\"engaging in reading and storytelling with a caregiver\"**. https://www.ncbi.nlm.nih.gov/books/NBK541173/ \u00b7 https://www.who.int/news/item/24-04-2019-to-grow-up-healthy-children-need-to-sit-less-and-play-more\n\n**Leitura estrat\u00e9gica:** \u00e1udio sem tela est\u00e1 num v\u00e1cuo regulat\u00f3rio-pedi\u00e1trico favor\u00e1vel \u2014 nenhuma entidade o pro\u00edbe para beb\u00eas, e a OMS/AAP recomendam explicitamente a alternativa \"hist\u00f3ria contada por um cuidador\". **O posicionamento defens\u00e1vel \u00e9 \"\u00e1udio sem tela, para ouvirem juntos\", n\u00e3o \"coloque para o beb\u00ea ouvir sozinho\".** A segunda formula\u00e7\u00e3o colide com o Christakis 2009 do Bloco 1.3 (m\u00eddia aud\u00edvel de fundo derruba ~770 palavras de adulto/hora).\n\n### 2.5 Precedente de enforcement \u2014 o risco que n\u00e3o \u00e9 da Apple, \u00e9 da FTC\n\nEste \u00e9 o risco mais subestimado da ideia, porque n\u00e3o aparece em nenhuma guideline de loja.\n\n| Caso | Ano | Desfecho |\n|---|---|---|\n| **Disney / Baby Einstein** | 2009 | Sob amea\u00e7a de a\u00e7\u00e3o coletiva por pr\u00e1tica enganosa movida pela Campaign for a Commercial-Free Childhood, a Disney ofereceu **reembolso integral** a todos que compraram os v\u00eddeos desde 2004. https://www.consumeraffairs.com/news04/2009/10/baby_einstein.html |\n| **FTC v. \"Your Baby Can Read\"** | 2012-2014 | FTC acusou de propaganda falsa por prometer ensinar beb\u00eas de 9 meses a ler e alegar que \"estudos cient\u00edficos comprovavam\". Julgamento de **US$ 185 milh\u00f5es** (= faturamento bruto desde jan/2008), suspenso ap\u00f3s pagamento de US$500 mil por insolv\u00eancia. A empresa fechou. https://www.ftc.gov/news-events/news/press-releases/2012/08/ads-touting-your-baby-can-read-were-deceptive-ftc-complaint-alleges \u00b7 https://www.ftc.gov/news-events/news/press-releases/2014/08/defendants-settle-ftc-charges-related-your-baby-can-read-program |\n| **Queixa \u00e0 FTC contra APPS para beb\u00eas** | 2013 | A mesma CCFC peticionou a FTC contra apps de beb\u00ea vendidos como educativos \u2014 nominalmente **Fisher-Price \"Laugh & Learn\"** e **Open Solutions (\"Baby Hear and Read\", \"Baby First Puzzle\")** \u2014, alegando que o marketing educativo enganava pais. Susan Linn, diretora: *\"Everything we know about brain research and child development points away from using screens to educate babies.\"* https://www.csmonitor.com/The-Culture/Family/2013/0808/Baby-apps-claiming-to-educate-mislead-consumers-group-tells-FTC |\n\n**O padr\u00e3o \u00e9 claro e se aplica ponto a ponto:** o vetor de ataque n\u00e3o \u00e9 a Apple, \u00e9 uma alega\u00e7\u00e3o de efic\u00e1cia sem respaldo em produto de m\u00eddia para beb\u00ea. E o Bloco 1 mostra que a alega\u00e7\u00e3o \"seu beb\u00ea aprende ingl\u00eas ouvindo\" \u00e9 exatamente a categoria de alega\u00e7\u00e3o que a literatura contradiz. Marketing desse app tem que ser escrito por essa lente: **descrever o que o app \u00c9 (m\u00fasica e hist\u00f3rias em ingl\u00eas), nunca o que ele FAZ no c\u00e9rebro do beb\u00ea.** Nada de \"acostuma o ouvido\", \"ativa janela cr\u00edtica\", \"aprende ingl\u00eas naturalmente\", \"comprovado cientificamente\".\n\n### 2.6 COPPA (EUA) \u2014 regra revisada, conformidade j\u00e1 vencida\n\n**Fontes prim\u00e1rias:** [Federal Register, 22/04/2025](https://www.federalregister.gov/documents/2025/04/22/2025-05904/childrens-online-privacy-protection-rule) \u00b7 [FTC, 16/01/2025](https://www.ftc.gov/news-events/news/press-releases/2025/01/ftc-finalizes-changes-childrens-privacy-rule-limiting-companies-ability-monetize-kids-data) \u00b7 [FTC COPPA FAQ](https://www.ftc.gov/business-guidance/resources/complying-coppa-frequently-asked-questions)\n\nPrimeira revis\u00e3o desde 2013. **Efetiva em 23/06/2025; prazo de conformidade geral em 22/04/2026 \u2014 j\u00e1 vencido.** O que mudou e importa aqui:\n\n1. **\"Mixed audience\" ganhou defini\u00e7\u00e3o pr\u00f3pria** \u2014 servi\u00e7o de p\u00fablico geral com uma parte dirigida a crian\u00e7as, sem t\u00ea-las como p\u00fablico prim\u00e1rio. **Um app de \u00e1udio para 0-3 anos N\u00c3O \u00e9 mixed audience: \u00e9 child-directed puro**, o regime mais restritivo. Entre os fatores que a FTC usa para classificar \"directed to children\" est\u00e3o explicitamente **\"m\u00fasica, conte\u00fado de \u00e1udio\"**, personagens animados e caracter\u00edsticas de linguagem.\n2. **Consentimento parental separado para divulga\u00e7\u00e3o a terceiros** (\u00a7312.5(a)(2)). Mandar dado para Firebase/AdMob exige consentimento **adicional e espec\u00edfico**, n\u00e3o o mesmo do uso do app.\n3. **Proibi\u00e7\u00e3o de reten\u00e7\u00e3o indefinida** + pol\u00edtica de reten\u00e7\u00e3o escrita e publicada no aviso online.\n4. **Aviso p\u00fablico obrigat\u00f3rio** para quem usa a exce\u00e7\u00e3o de \"support for internal operations\": precisa declarar quais opera\u00e7\u00f5es justificam o identificador persistente.\n5. **Voz da crian\u00e7a \u00e9 dado pessoal.** A defini\u00e7\u00e3o da FTC inclui *\"a photograph, video, or audio file, where such file contains a child's image or voice\"*. \u26a0\ufe0f Um app de \"vocabul\u00e1rio falado\" \u00e9 candidato natural a ganhar uma feature de \"repita a palavra\" \u2014 e essa feature cruza a linha sozinha.\n6. **O operador responde pelo SDK de terceiro**: a FTC considera o operador respons\u00e1vel pela coleta que ocorre \"on or through\" o servi\u00e7o, independentemente de quem coleta.\n\n**Exce\u00e7\u00e3o de internal operations:** permite identificador persistente sem consentimento parental verific\u00e1vel se nada mais for coletado e o uso for s\u00f3 operacional. **Publicidade comportamental e constru\u00e7\u00e3o de perfil N\u00c3O qualificam.**\n\n### 2.7 Firebase Analytics e AdMob s\u00e3o utiliz\u00e1veis? \u2014 a resposta que muda o custo do projeto\n\n**Sob COPPA, com configura\u00e7\u00e3o: talvez. Sob a regra 1.3 da Apple, na pr\u00e1tica: N\u00c3O.**\n\n- **Firebase:** o Google documenta como desabilitar IDFA (n\u00e3o incluir o AdSupport framework) e `GOOGLE_ANALYTICS_DEFAULT_ALLOW_AD_PERSONALIZATION_SIGNALS = NO` ([docs](https://firebase.google.com/docs/analytics/configure-data-collection)), e existe o pod `Firebase/AnalyticsWithoutAdIdSupport`. **Mas n\u00e3o existe declara\u00e7\u00e3o oficial do Google de que Firebase Analytics \u00e9 compat\u00edvel com a Kids Category da Apple \u2014 n\u00e3o encontrado.** E o Firebase Analytics envia `app_instance_id` + modelo de aparelho/OS/pa\u00eds, que \u00e9 literalmente o *\"any device, network, or other information\"* que a 1.3 pro\u00edbe mandar a terceiros.\n- **Evid\u00eancia de rejei\u00e7\u00e3o real:** Apple Developer Forums [thread 746490](https://developer.apple.com/forums/thread/746490) (fev/2024) \u2014 rejei\u00e7\u00e3o sob 1.3 com o texto exato da guideline, pedindo solu\u00e7\u00e3o para Firebase Analytics; **zero respostas**. Mesmo padr\u00e3o em [thread 130863](https://developer.apple.com/forums/thread/130863) e em issues do react-native-firebase (#4021, #4494, #4072).\n- **AdMob:** `tagForChildDirectedTreatment` impede a transmiss\u00e3o do IDFA ([docs](https://developers.google.com/admob/ios/targeting)) \u2014 **mas a propriedade est\u00e1 deprecated**, e n\u00e3o existe documento p\u00fablico do Google prometendo **revis\u00e3o humana de criativos para a Kids Category da Apple**, que \u00e9 a condi\u00e7\u00e3o literal da exce\u00e7\u00e3o da 1.3. **N\u00e3o encontrado = assume-se que n\u00e3o passa.**\n\n**Consequ\u00eancia para o lab, em uma frase:** este app seria constru\u00eddo **sem Firebase Analytics, sem AdMob e sem Crashlytics de terceiro**. Isso apaga a instrumenta\u00e7\u00e3o can\u00f4nica inteira (`core_action`, funil de onboarding, cohorts de reten\u00e7\u00e3o, `review_prompt_requested`) \u2014 e o LEARNINGS #86 do pr\u00f3prio lab diz que app sem Crashlytics **n\u00e3o \u00e9 app sem crash, \u00e9 app cego**. Ou se constr\u00f3i analytics first-party, ou se voa sem telemetria.\n\n### 2.8 Brasil \u2014 LGPD e o ECA Digital (o maior risco regulat\u00f3rio j\u00e1 enfrentado pelo lab)\n\n**LGPD Art. 14 \u00a71\u00ba** (Lei 13.709/2018): *\"O tratamento de dados pessoais de crian\u00e7as dever\u00e1 ser realizado com o consentimento espec\u00edfico e em destaque dado por pelo menos um dos pais ou pelo respons\u00e1vel legal.\"* \u00a75\u00ba exige \"todos os esfor\u00e7os razo\u00e1veis para verificar\" que o consentimento veio do respons\u00e1vel. Crian\u00e7a = menor de 12 anos.\n\n**ANPD, Enunciado CD/ANPD n\u00ba 1, de 22/05/2023:** o tratamento de dados de crian\u00e7as pode se apoiar em **qualquer** base legal dos arts. 7\u00ba e 11, desde que respeitado o **melhor interesse** da crian\u00e7a. [gov.br](https://www.gov.br/anpd/pt-br/assuntos/noticias/anpd-divulga-enunciado-sobre-o-tratamento-de-dados-pessoais-de-criancas-e-adolescentes) \u2014 ou seja, funcionamento b\u00e1sico pode n\u00e3o exigir consentimento parental, mas **analytics de terceiro e publicidade n\u00e3o sobrevivem ao teste do melhor interesse**. Resolu\u00e7\u00e3o espec\u00edfica da ANPD sobre crian\u00e7as publicada em 2025-2026: **n\u00e3o encontrada** (s\u00f3 o Enunciado de 2023 e o novo papel sob o ECA Digital).\n\n**ECA Digital \u2014 Lei 15.211/2025: EXISTE e J\u00c1 EST\u00c1 EM VIGOR.**\n- Sancionada em setembro de 2025, **em vigor desde 17/03/2026**. [Machado Meyer](https://www.machadomeyer.com.br/pt/inteligencia-juridica/publicacoes-ij/direito-digital/estatuto-digital-da-crianca-e-do-adolescente-lei-n-15-211-2025-entra-em-vigor-em-17-de-marco-de-2026) \u00b7 [Data Privacy Brasil](https://www.dataprivacybr.org/eca-digital-entra-em-vigor-o-que-a-lei-preve-e-o-que-ainda-falta-regulamentar/)\n- **Escopo:** produtos/servi\u00e7os de TI dirigidos ao p\u00fablico infantojuvenil **ou com acesso prov\u00e1vel por esse p\u00fablico** no Brasil, **inclusive de empresas sediadas no exterior** \u2014 apps inclu\u00eddos nominalmente.\n- **Obriga\u00e7\u00f5es:** verifica\u00e7\u00e3o de idade confi\u00e1vel (**autodeclara\u00e7\u00e3o vedada**), supervis\u00e3o parental, regras de publicidade digital, transpar\u00eancia e \u2014 o item mais pesado \u2014 **configura\u00e7\u00e3o no modelo mais protetivo \"desde a concep\u00e7\u00e3o\"**: safety by design como obriga\u00e7\u00e3o legal, n\u00e3o recomenda\u00e7\u00e3o.\n- **Autoridade e san\u00e7\u00e3o:** Decreto 12.622/2025 designou a **ANPD**; san\u00e7\u00f5es de **at\u00e9 R$ 50 milh\u00f5es por infra\u00e7\u00e3o**, al\u00e9m de suspens\u00e3o da atividade. [Planalto](https://www.planalto.gov.br/ccivil_03/_ato2023-2026/2025/decreto/d12622.htm) \u00b7 [IBDTec](https://www.ibdtec.com.br/post/eca-digital-lei-15211-2025-obrigacoes-prazos)\n- **Fiscaliza\u00e7\u00e3o j\u00e1 rodando:** a ANPD come\u00e7ou em **10/06/2026** monitorando lojas e sistemas operacionais (Apple, Google, Microsoft) quanto \u00e0 aferi\u00e7\u00e3o de idade; a **etapa II, alcan\u00e7ando os demais setores (apps), estava prevista para agosto de 2026**. [Leonardi Advogados](https://www.leonardi.adv.br/insights/anpd-monitora-apple-google-e-microsoft-para-verificar-conformidade-com-obrigacoes-de-afericao-de-idade-do-eca-digital/)\n\n\u26a0\ufe0f **Ressalva de m\u00e9todo:** todas as fontes sobre o ECA Digital acima s\u00e3o **secund\u00e1rias** (escrit\u00f3rios e institutos). O texto legal consolidado n\u00e3o foi lido na \u00edntegra nesta rodada. **Antes de publicar no Brasil, ler a lei no Planalto.**\n\n### 2.9 Age assurance \u2014 trabalho novo obrigat\u00f3rio em 2026\n\n- **Novo sistema de age ratings da Apple** (24/07/2025): adiciona 13+/16+/18+, remove 12+/17+; novas perguntas obrigat\u00f3rias; prazo de resposta ao question\u00e1rio foi **31/01/2026** (j\u00e1 vencido \u2014 app novo responde o question\u00e1rio novo de sa\u00edda). https://developer.apple.com/news/?id=ks775ehf\n- **Declared Age Range API** (24/02/2026): no **Brasil**, \"developers distributing apps in Brazil can use the updated Declared Age Range API to obtain a user's age category\". Tamb\u00e9m **Utah (06/05/2026)** e **Louisiana (01/07/2026)**. Apple: *\"Developers may have separate obligations under local laws to independently confirm that users are adults.\"* https://developer.apple.com/news/?id=f5zj08ey\n- **Texas App Store Accountability Act (SB 2420):** injun\u00e7\u00e3o suspensa pelo 5\u00ba Circuito em 28/05/2026, lei em vigor, Apple confirmou requisitos ativos em **04/06/2026**. https://developer.apple.com/news/?id=btkirlj8 \u00b7 [Morrison Foerster](https://www.mofo.com/resources/insights/251111-texas-targets-app-stores-with-new-accountability-law)\n\nO app de beb\u00ea n\u00e3o \u00e9 atingido pelos bloqueios 18+, mas **\u00e9 atingido pela obriga\u00e7\u00e3o de consumir o sinal de idade** \u2014 integra\u00e7\u00e3o nova, que n\u00e3o existe em nenhum app do lab hoje.\n\n### 2.10 Parental gate \u2014 trabalho de UI que o lab n\u00e3o tem\n\nDe [developer.apple.com/kids](https://developer.apple.com/kids/) (consultada 2026-09-17), literal:\n> \"**Select an age band in App Store Connect:** Choose whether your app or game is appropriate for ages 5 and under, 6-8, or 9-11.\"\n> \"**Provide parental gates:** These are adult-level tasks that must be completed in order to continue using your app or game. [\u2026] **If your app is intended for pre-literate children, consider using a voiceover prompt** to help kids know that they need to involve their parent.\"\n> \"Kids apps should not transmit personally identifiable information or device information to third parties \u2014 **even in sections intended for adults** \u2014 unless the parent explicitly consents.\"\n\nE a [Apple Developer News de 12/09/2019](https://developer.apple.com/news/?id=091202019a) amplia o escopo do gate al\u00e9m do texto atual da 1.3:\n> \"\u2026require a parental gate in order to **link out of the app, request permissions, or present purchasing opportunities**.\"\n\n\u2192 **Pedir permiss\u00e3o (notifica\u00e7\u00f5es, por exemplo) tamb\u00e9m exige gate.** Para 0-3 anos o age band \u00e9 \"5 and under\" e a nota de voiceover se aplica. O `OnboardingKit` do lab n\u00e3o tem nada disso.\n\n**Mecanismos aceit\u00e1veis de gate:** a Apple mostra exemplos visuais (tarefa matem\u00e1tica / pergunta de n\u00edvel adulto) mas **n\u00e3o publica lista normativa \u2014 n\u00e3o encontrado**.\n\n### 2.11 Backlash e rejei\u00e7\u00f5es \u2014 o que foi confirmado e o que n\u00e3o foi\n\n- **Rejei\u00e7\u00e3o por \"n\u00e3o parece desenhado para crian\u00e7as\": confirmada.** Texto relatado: *\"You have selected the Kids category for your app, but your app does not appear to be designed specifically for kids aged 11 and under.\"* ([BuddyBoss](https://buddyboss.com/docs/app-store-guideline-1-3-safety-kids-category/); Apple Developer Forums 746068, 816277, 682386, 717365). H\u00e1 tamb\u00e9m relatos de apps que **n\u00e3o conseguem sair** da Kids Category depois de entrar \u2014 coerente com o efeito-catraca do texto da 1.3.\n- **Rejei\u00e7\u00e3o 1.3 por SDK de analytics: confirmada** (ver 2.7).\n- **Remo\u00e7\u00e3o em massa ou campanha da Apple contra apps de m\u00eddia para beb\u00eas: N\u00c3O ENCONTRADO.** N\u00e3o h\u00e1 evid\u00eancia de que a Apple persiga a categoria em si.\n- **Backlash de pais:** difuso, n\u00e3o dirigido a apps espec\u00edficos. O risco reputacional real \u00e9 o app ser lido como **\"chupeta digital\"**, n\u00e3o como app infantil.\n\n---\n\n## BLOCO 3 \u2014 Mercado fora da App Store\n\n### 3.1 O consumo j\u00e1 acontece, de gra\u00e7a, e est\u00e1 CRESCENDO\n\n| Canal YouTube | Inscritos | Views totais | Fonte |\n|---|---|---|---|\n| **Cocomelon \u2013 Nursery Rhymes** | ~202 mi | **~225,8 bi** | [vidIQ](https://vidiq.com/youtube-stats/channel/@cocomelon/) (tracker, 09/2026); 3\u00ba canal mais inscrito e 2\u00ba mais visto do mundo \u2014 [Epidemic Sound, abr/2026](https://www.epidemicsound.com/blog/most-subscribed-and-viewed-youtube-channels/) |\n| **Little Baby Bum** (Moonbug) | ~195 mi | ~206 bi | [Wikipedia, dado de 23/03/2024](https://en.wikipedia.org/wiki/Little_Baby_Bum) \u2014 n\u00famero de 2026 n\u00e3o encontrado |\n| **Super Simple Songs** | 70 mi+ (fam\u00edlia de canais) | 90 bi+ | [YouTube Official Blog, 27/08/2026](https://blog.youtube/creator-and-artist-stories/super-simple-songs-20th-anniversary-youtube/) \u2014 fonte prim\u00e1ria. Trackers d\u00e3o 46,8 mi / 63,7 bi para o canal isolado |\n| **Ms Rachel \u2013 Songs for Littles** | 20 mi+ | 16 bi+ | [Wikipedia, 2026](https://en.wikipedia.org/wiki/Ms._Rachel) |\n| **Dave and Ava** | ~15,9 mi | n\u00e3o encontrado | [vidIQ, 2026](https://vidiq.com/youtube-stats/channel/UC6zhI71atP7YLoZyIyCIGNw/) \u2014 uma fonte divergente citou 57,8 mi; n\u00e3o confirmado |\n\n**Streaming de \u00e1udio:** \"Baby Shark\" (Pinkfong) passou **1 bilh\u00e3o de streams no Spotify** \u2014 primeiro IP infantil a chegar l\u00e1 \u2014 com **137 mi de streams nos \u00faltimos 12 meses** (~400 mil/dia). [Korea JoongAng Daily, 22/05/2026](https://www.koreajoongangdaily.com/lifestyle/baby-shark-surpasses-1-billion-streams-on-spotify-a-first-for-character-ip/12555225). **Spotify Kids segue ativo em 2026** ([Variety, 2026](https://variety.com/2026/music/news/spotify-exclude-kids-family-music-recommendations-1236861534/)). Audi\u00eancia de playlists de nursery rhymes por playlist: **n\u00e3o encontrado** (n\u00e3o \u00e9 publicado).\n\n**TV/streaming:** *Ms. Rachel* estreou na Netflix em **27/01/2025**, fez **53,4 mi de views** e foi a **temporada de s\u00e9rie infantil mais vista do 1\u00ba semestre de 2025**, 22 semanas no top 10 global; T2 em 01/09/2025 ([Variety, 2025](https://variety.com/2025/tv/news/ms-rachel-netflix-streaming-1236273967/), [Deadline, 08/2025](https://deadline.com/2025/08/netflix-sesame-street-ms-rachel-season-2-premiere-1236497343/)). *Cocomelon Lane* est\u00e1 na **6\u00aa temporada** (S6 em 01/12/2025). Produto equivalente no Disney+ posicionado como exposi\u00e7\u00e3o a idioma para 0-3: **n\u00e3o encontrado**.\n\n**Podcasts infantis:** 46% das crian\u00e7as **6-12 anos** nos EUA j\u00e1 ouviram podcast, 29% no \u00faltimo m\u00eas, **68% ouvem junto com os pais** \u2014 [Kids Podcast Listener Report, Edison Research + Kids Listen](https://www.edisonresearch.com/solutions/the-kids-podcast-listener-report/). Audi\u00eancia de podcast na faixa **0-3: n\u00e3o encontrado**. Downloads de Sleep Tight Stories / Circle Round / Koo Koo Kanga Roo: **n\u00e3o encontrado**.\n\n### 3.2 O achado mais importante do bloco: o dinheiro de \"\u00e1udio infantil sem tela\" est\u00e1 em HARDWARE\n\n| Player | Receita | Ano | Fonte |\n|---|---|---|---|\n| **Tonies SE** (listada em Frankfurt, auditado) | **\u20ac630 mi** (+31% YoY; era \u20ac481 mi em 2024). **11,8 mi de Tonieboxes ativadas**, **43 mi de figurinas vendidas s\u00f3 em 2025**. Am\u00e9rica do Norte = \u20ac276 mi. EBITDA aj. 8,6% | FY2025 | [EQS News / tonies](https://www.eqs-news.com/news/corporate/tonies-continues-profitable-growth-with-record-results-in-2025-expects-strong-momentum-for-full-year-2026-expansion-of-ecosystem-around-toniebox-2-proves-a-global-success/b94d3519-0bdf-4b06-8664-ee5066fcc297_en) |\n| **Yoto** (privada, UK) | **\u00a394,8 mi (~US$127 mi)**, **+86%** sobre 2023. **Preju\u00edzo** de \u00a38,4 mi (recall de bateria pesou \u00a37 mi) | FY2024 | [Music Ally, 27/08/2025](https://musically.com/2025/08/27/childrens-speakers-startup-yoto-saw-sales-grow-by-86-in-2024/) |\n| Mercado global de players de \u00e1udio infantil | **US$1,43 bi** | 2026 | [Forbes, 18/08/2026](https://www.forbes.com/sites/sharonedelson/2026/08/18/yoto-is-making-a-mark-in-the-143-billion-global-kids-audio-player-market/) |\n\n**Leitura:** existe demanda enorme e paga por \"\u00e1udio infantil sem tela\" \u2014 mas o pai paga por uma **caixinha f\u00edsica** (~US$100 + US$10-15/card), n\u00e3o por um app de \u00e1udio. Tonies e Yoto s\u00e3o os concorrentes diretos reais da ideia, e ambos vendem objeto. Os dois j\u00e1 t\u00eam **cards de idioma**: Yoto tem cards bil\u00edngues EN/ES com bot\u00e3o que troca o idioma, \"My First 100 Words\" em 5 idiomas e a s\u00e9rie Ladybird Language Stories ([Yoto USA](https://us.yotoplay.com/blogs/yoto-journal/how-to-use-bilingual-yoto-cards)). Pre\u00e7o unit\u00e1rio dos cards de idioma e dos packs de idioma da Tonies: **n\u00e3o encontrado**.\n\n### 3.3 Produtos pagos que vendem exatamente \"idioma para crian\u00e7a pequena\"\n\n| Produto | Vivo em 2026? | Pre\u00e7o (17/09/2026) | Formato |\n|---|---|---|---|\n| **Lingokids** | SIM \u2014 **o incumbente** | N\u00e3o exposto no site (paywall in-app); **n\u00e3o encontrado** | Freemium/assinatura, sem ads, COPPA Plus |\n| **Dino Lingo** | SIM | US$19/m\u00eas ou **US$199/ano**, trial 7d | 50 idiomas, 2-14 anos, app+web |\n| **Muzzy BBC / Muzzy Club** | SIM | **US$99/ano** (English); US$69/6 meses; trial 30d com reembolso | V\u00eddeo/streaming por assinatura |\n| **Little Pim** | **SIM \u2014 N\u00c3O morreu** | US$9,99/m\u00eas ou **US$69,99/ano** | V\u00eddeo, 12 idiomas, \"Babies, Toddlers, Pre-K\". **Adquirida pela Mango Languages em mar\u00e7o/2023** ([Tracxn](https://tracxn.com/d/companies/little-pim/__CPiqcmwKBuaFLW0QHNjHezWtJbDZMtfdb33Bz-wmLW0)) |\n| **Studycat** (Fun English) | SIM | Assinatura, trial 7d; valor **n\u00e3o encontrado** | 2-8 anos; \"14 mi de fam\u00edlias\", 1.000 escolas em 80 pa\u00edses |\n| **Monkey Junior** | SIM | Gr\u00e1tis + IAP; lifetime existe, pre\u00e7o **n\u00e3o encontrado** | 0-11 anos, \"15 mi de fam\u00edlias\". Reviews relatam cobran\u00e7a p\u00f3s-trial e perda de lifetime pago |\n| **Gus on the Go** | SIM, mas **virou GR\u00c1TIS** (era US$3,99/idioma) | Gr\u00e1tis, 30 idiomas | Modelo de neg\u00f3cio atual **n\u00e3o encontrado** \u2014 sinal de que compra \u00fanica por idioma n\u00e3o sustentou |\n| **Duolingo ABC** | SIM | **Gr\u00e1tis** | Alfabetiza\u00e7\u00e3o em ingl\u00eas (letramento), **n\u00e3o** segundo idioma |\n| **\"Duolingo Kids\"** | **NUNCA EXISTIU** como produto | \u2014 | Quem busca cai no Duolingo ABC |\n| **Babbel Kids** | **N\u00c3O EXISTE** | \u2014 | Babbel \u00e9 texto-pesado, invi\u00e1vel para pr\u00e9-alfabetizado |\n| **PlayShifu** | SIM | **n\u00e3o encontrado** | Hardware + app AR |\n\n**O incumbente define o teto competitivo \u2014 Lingokids:**\n- **185 mi+ downloads / 10 mi MAU** declarados (2025); o site hoje diz 200 mi ([lingokids.com](https://lingokids.com/), 2026)\n- **US$120 mi levantados em setembro de 2025** ([press release](https://lingokids.com/press/linogkids-raises-120m-in-funding-to-expand-its-position))\n- Receita iOS EUA no pico: ~US$409 mil/**semana** (fev/2025); downloads iOS EUA 48-64 mil/semana \u2014 estimativas [Sensor Tower Q1 2025](https://sensortower.com/blog/2025-q1-ios-top-5-educational%20games-revenue-us-642f2824e1714cfff1ed8590)\n- **651.823 avalia\u00e7\u00f5es na App Store US** (consulta 17/09/2026) \u2014 massa de rating inalcan\u00e7\u00e1vel organicamente. Pela regra rating-first do lab, isso \u00e9 um SERP fechado.\n\n**Pinkfong/Baby Shark \u2014 o IP mais forte do mundo infantil, e mesmo assim:** receita 2024 KRW 97,4 bi (~US$67 mi); 1\u00ba semestre de 2025 **caiu 2,4%**, lucro l\u00edquido **-67%**; IPO no KOSDAQ em 18/11/2025 avaliando a empresa em **~US$372 mi**, contra **>KRW 1 tri em 2021** (queda de ~2/3). [Music Ally, 18/11/2025](https://musically.com/2025/11/18/baby-shark-creator-pinkfong-goes-public-with-372m-valuation/) \u00b7 [Forbes, 18/11/2025](https://www.forbes.com/sites/zinnialee/2025/11/18/baby-shark-creator-pinkfong-rises-in-south-korea-ipo-debut/). **Conte\u00fado infantil de m\u00fasica tem alcance gigante e monetiza\u00e7\u00e3o fraca.**\n\n### 3.4 Tamanho e tend\u00eancia do mercado (as fontes divergem \u2014 usar como ordem de grandeza)\n\n| Escopo | Tamanho | Proje\u00e7\u00e3o | CAGR | Fonte |\n|---|---|---|---|---|\n| Online language learning | US$22,1 bi (2024) | US$54,8 bi (2030) | 16,6% | [Grand View Research](https://www.grandviewresearch.com/industry-analysis/online-language-learning-market-report) |\n| Language learning **apps** | US$7,36 bi (2025) | US$28,33 bi (2034) | 16,15% | [Straits Research](https://straitsresearch.com/press-release/language-learning-apps-market-size) |\n| Language learning apps | US$7,9 bi (2025) | US$26,0 bi (2032) | 18,5% | Stratistics MRC |\n| EdTech for Early Childhood | US$13,4 bi (2024) | US$55,6 bi (2034) | 15,3% | [Market.us](https://market.us/report/edtech-for-early-childhood-market/) |\n| Kids Educational Apps | US$7,8 bi (2024) | US$24,6 bi (2033) | 13,7% | [MarketIntelo](https://marketintelo.com/report/kids-educational-apps-market) |\n\n\u26a0\ufe0f Os tr\u00eas \u00faltimos s\u00e3o relat\u00f3rios de agregador com paywall, n\u00e3o auditados.\n\n**Demanda declarada por bilinguismo \u00e9 alt\u00edssima \u2014 e \u00e9 o melhor argumento a favor da ideia:**\n- EUA: **74,1 mi de pessoas (23% dos 5+) falam outro idioma em casa** \u2014 [ACS 2024 via USAFacts](https://usafacts.org/answers/how-many-people-speak-a-language-other-than-english-at-home/country/united-states/)\n- **88% dos pais latinos nos EUA querem filhos bil\u00edngues** (survey 2025, ~1.400 pais; 90% em 2024); **84%** dos pais da Calif\u00f3rnia querem imers\u00e3o dual-language (2024) \u2014 [The Century Foundation](https://tcf.org/content/report/what-families-want-new-data-on-public-demand-for-bilingual-education/)\n- Google Trends para \"bilingual parenting\": **n\u00e3o encontrado**\n- Estat\u00edsticas de fam\u00edlias bil\u00edngues no Brasil / % de brasileiros que falam ingl\u00eas: **n\u00e3o encontrado** nesta rodada\n\n**Benchmarks de monetiza\u00e7\u00e3o (Educa\u00e7\u00e3o, 2025):** pre\u00e7os medianos **US$7,48/semana \u00b7 US$12,99/m\u00eas \u00b7 US$38,42/ano**; **semanal = 52% da receita** da categoria (anual 22%, mensal 9%, one-time 17%). Trial longo converte 45,7% vs 26,8% em trial curto. Reten\u00e7\u00e3o D30 de apps de assinatura \u224814%. [RevenueCat State of Subscription Apps 2025](https://www.revenuecat.com/state-of-subscription-apps-2025) \u00b7 [Adapty](https://adapty.io/blog/education-app-subscription-benchmarks/) \u00b7 [Business of Apps 2026](https://www.businessofapps.com/data/education-app-benchmarks/). **ARPU espec\u00edfico de apps infantis (separado de \"education\"): n\u00e3o encontrado** \u2014 nenhuma fonte p\u00fablica separa.\n\n**Duolingo ABC:** 18 mi de downloads acumulados, ~360 mil nos \u00faltimos 30 dias ([AppBrain](https://www.appbrain.com/app/learn-to-read-duolingo-abc/com.duolingo.literacy), 2025) \u2014 **\u00e9 gr\u00e1tis e n\u00e3o monetiza**. A Duolingo fez US$1 bi de receita em 2025 ([Business of Apps](https://www.businessofapps.com/data/duolingo-statistics/), 2026) e **nada disso vem do ABC**. O pr\u00f3prio nome da ideia (\"Duolingo para beb\u00eas\") aponta para um produto que a Duolingo construiu e escolheu **n\u00e3o monetizar**.\n\n### 3.5 Pais pagam, ou ligam o YouTube de gra\u00e7a?\n\n**Common Sense Census 2025, crian\u00e7as de 0-8 anos** ([relat\u00f3rio PDF](https://www.commonsensemedia.org/sites/default/files/research/report/2025-common-sense-census-web-2.pdf) \u00b7 [p\u00e1gina](https://www.commonsensemedia.org/research/the-2025-common-sense-census-media-use-by-kids-zero-to-eight)):\n- Tempo de tela 0-8: **2h27min/dia**\n- **Uso de YouTube entre menores de 2 anos: 45% (2020) \u2192 62% (2025)**\n- **40% das crian\u00e7as t\u00eam tablet aos 2 anos**\n- 62% dos pais \u00e0s vezes assistem YouTube junto com o filho\n- O t\u00edtulo do press release da pr\u00f3pria Common Sense: **\"Digital childhood starts at age two\"** ([2025](https://www.commonsensemedia.org/press-releases/digital-childhood-starts-at-age-two-landmark-study-shows-evolution-of-young-childrens-media-use))\n\n**Tradu\u00e7\u00e3o:** o comportamento-padr\u00e3o da m\u00e3e de beb\u00ea j\u00e1 \u00e9 ligar o YouTube \u2014 e est\u00e1 **crescendo**, n\u00e3o encolhendo. 72% dos pais de 2-8 anos usaram apps educativos no ver\u00e3o de 2025 (era 66%) segundo [ABCmouse](https://www.abcmouse.com/learn/advice/education-app-statistics-every-parent-should-know/77938) \u26a0\ufe0f (fonte \u00e9 concorrente, vi\u00e9s comercial). **Gasto anual m\u00e9dio de uma fam\u00edlia com apps educativos: n\u00e3o encontrado** em fonte p\u00fablica.\n\n### 3.6 Sinal de busca na App Store \u2014 coletado nesta pesquisa (Astro, 17/09/2026)\n\n| Termo | Store | Popularidade | Dificuldade |\n|---|---|---|---|\n| `english for babies` | US | **5** (piso da escala) | 11 |\n| `bilingual baby` | US | **5** | 21 |\n| `baby songs` | US | **5** | 43 |\n| `english for kids` | US | 17 | 36 |\n| `nursery rhymes` | US | 25 | 13 |\n| `ingles para bebes` | BR | **5** | 35 |\n| `ingles para criancas` | BR | **5** | 56 |\n| `ingles para ni\u00f1os` | ES | **5** | 46 |\n\nA SERP de `english for babies` nos EUA \u00e9 vazia de qualidade \u2014 os 4 primeiros t\u00eam **1, 5, 76 e 1 avalia\u00e7\u00f5es**. Ningu\u00e9m rankeia porque **ningu\u00e9m busca**. Em BR e ES todos os termos est\u00e3o no piso de popularidade **com dificuldade 35-56**: h\u00e1 competidores disputando demanda que n\u00e3o existe.\n\nO \u00fanico termo com demanda real \u00e9 `nursery rhymes` (pop 25, diff 13) \u2014 **m\u00fasica infantil, n\u00e3o m\u00e9todo de idioma**. E os termos de alta popularidade da vertical s\u00e3o `youtube kids` (76), `kids games` (69), `pbs kids` (68): a busca do pai na App Store \u00e9 por **entretenimento e marca conhecida**.\n\n\n---\n\n## S\u00cdNTESE \u2014 os tr\u00eas blocos cruzados\n\n### O que cada bloco diz, em uma linha\n1. **Ci\u00eancia:** existe um experimento que testou exatamente esta ideia \u2014 mesmo conte\u00fado, mesma idade, entregue por grava\u00e7\u00e3o de \u00e1udio \u2014 e o efeito foi **zero** (Kuhl, Tsao & Liu, 2003, PNAS). N\u00e3o \u00e9 \u00e1rea cinzenta.\n2. **Regula\u00e7\u00e3o:** a Kids Category \u00e9 praticamente obrigat\u00f3ria (sen\u00e3o a 2.3.8 pro\u00edbe o vocabul\u00e1rio do nicho no ASO), e ela custa **Firebase Analytics, AdMob e Crashlytics** \u2014 mais parental gate, COPPA child-directed puro e o ECA Digital brasileiro com san\u00e7\u00e3o de at\u00e9 R$ 50 mi.\n3. **Mercado:** a demanda de busca na App Store est\u00e1 no **piso** (`english for babies` pop 5 em US, BR e ES), o incumbente tem **651 mil ratings** e US$120 mi de funding, o consumo j\u00e1 \u00e9 gr\u00e1tis e **crescendo** (YouTube em menores de 2 anos: 45% \u2192 62% entre 2020 e 2025), e o dinheiro real da categoria \"\u00e1udio infantil sem tela\" est\u00e1 em **hardware** (Tonies \u20ac630 mi, Yoto US$127 mi).\n\n### Matriz de risco\n\n| Risco | Severidade | Base |\n|---|---|---|\n| Premissa central refutada por experimento direto | **Cr\u00edtica** | Kuhl 2003; DeLoache 2010; nulo <3 anos em Patterson 2002 / Scheele 2010 / Taylor 2018 |\n| Perda total da instrumenta\u00e7\u00e3o do lab (sem Firebase/Crashlytics) | **Cr\u00edtica** | Apple 1.3 + 5.1.4(a); rejei\u00e7\u00f5es documentadas |\n| Zero demanda de busca na loja | **Cr\u00edtica** | Astro 17/09/2026: pop 5 em US/BR/ES |\n| Enforcement por claim de efic\u00e1cia (FTC/CCFC) | **Alta** | US$185 mi em \"Your Baby Can Read\" (2012); reembolso Baby Einstein (2009); queixa contra apps de beb\u00ea (2013) |\n| ECA Digital / ANPD (Brasil) | **Alta** | Lei 15.211/2025 em vigor desde 17/03/2026; fiscaliza\u00e7\u00e3o de apps prevista para ago/2026; at\u00e9 R$ 50 mi |\n| Decis\u00e3o irrevers\u00edvel da Kids Category | **Alta** | Texto literal da 1.3 (\"even if you decide to deselect the category\") |\n| 4.3 spam (categoria saturada) | **M\u00e9dia** | M\u00fasica/hist\u00f3rias para beb\u00ea \u00e9 nicho lotado |\n| Monetiza\u00e7\u00e3o fraca mesmo com alcance enorme | **M\u00e9dia** | Pinkfong: IPO a US$372 mi contra >KRW 1 tri em 2021; Duolingo ABC \u00e9 gr\u00e1tis e n\u00e3o monetiza |\n| Backlash pedi\u00e1trico direto | **Baixa** | AAP trata \u00e1udio como **screen-free**; OMS restringe \"sedentary *screen* time\". Nenhuma entidade pro\u00edbe \u00e1udio para beb\u00ea |\n\n### O \u00fanico \u00e2ngulo defens\u00e1vel, se o Jo\u00e3o quiser insistir\n\u00c1udio sem tela est\u00e1 num **v\u00e1cuo favor\u00e1vel**: a pol\u00edtica vigente da AAP (Pediatrics, fev/2026) n\u00e3o trata \u00e1udio, e a \u00fanica men\u00e7\u00e3o o coloca como **alternativa recomendada** \u00e0 tela; a AAP chama audio players de \"screen-free devices\" (p\u00e1gina atualizada em 21/04/2026); a OMS restringe explicitamente \"sedentary **screen** time\" e **encoraja** \"reading and storytelling **with a caregiver**\".\n\nIsso sustenta exatamente um posicionamento, e n\u00e3o o da ideia original:\n- **Sim:** \"ritual de m\u00fasica e hist\u00f3rias em ingl\u00eas para voc\u00eas ouvirem **juntos**, com a tela apagada\" \u2014 playback em background, sem UI que prenda o beb\u00ea, com o cuidador como usu\u00e1rio.\n- **N\u00e3o:** \"deixe seu beb\u00ea escutando e ele vai aprendendo ingl\u00eas\" \u2014 refutado por Kuhl 2003, e a m\u00eddia aud\u00edvel de fundo **derruba ~770 palavras de adulto por hora** (Christakis 2009), que \u00e9 o insumo que de fato funciona.\n\n\u26a0\ufe0f Mesmo o \u00e2ngulo defens\u00e1vel \u00e9 **enquadramento, n\u00e3o isen\u00e7\u00e3o**: **n\u00e3o existe declara\u00e7\u00e3o literal da AAP ou da OMS dizendo que \u00e1udio n\u00e3o conta como screen time** \u2014 e um app de iPhone tem tela. A defesa s\u00f3 se sustenta se o produto for constru\u00eddo para tocar com a tela apagada.\n\n### Lacunas honestas desta pesquisa\n- Texto literal dos artigos do ECA Digital aplic\u00e1veis a app infantil \u2014 **n\u00e3o lido na fonte prim\u00e1ria** (s\u00f3 fontes secund\u00e1rias).\n- Texto integral da pol\u00edtica da AAP de fev/2026 sobre menores de 2 anos \u2014 **paywall/403**; usado o resumo oficial da pr\u00f3pria AAP (HealthyChildren) e o texto integral no PMC.\n- Pre\u00e7o da assinatura do Lingokids, ARPU espec\u00edfico de apps infantis (separado de \"education\"), gasto anual m\u00e9dio de fam\u00edlias com apps educativos, dados brasileiros de bilinguismo, audi\u00eancia de podcast na faixa 0-3 \u2014 **n\u00e3o encontrados** em fonte p\u00fablica confi\u00e1vel.\n- Lista normativa de mecanismos aceit\u00e1veis de parental gate \u2014 **n\u00e3o publicada pela Apple**.\n"];</script><script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script><script>document.querySelectorAll("#md .mdpart").forEach(function(el){var R=RAWS[+el.dataset.i]||"";el.innerHTML=window.marked?marked.parse(R):"<pre>"+R.replace(/</g,"&lt;")+"</pre>";});doc
