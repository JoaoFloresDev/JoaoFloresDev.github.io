<style>

#md img{max-width:100%}
.hcol .row{flex-direction:column;align-items:flex-start;gap:4px}.hcol .row b{white-space:normal}.hcol .row span{width:100%}.hcol .row em{display:none}.hcol .row.done b{font-size:12px}.hrow{display:flex;gap:20px;overflow-x:auto;align-items:flex-start;padding:16px 28px 12px;margin:18px 0 26px;background:rgba(125,125,125,.07);border:1px solid var(--bd);border-radius:16px;scroll-padding:0 28px}.hcol{flex:0 0 340px;min-width:340px}.hcol:last-child{margin-right:28px}.hcol h2{margin-top:0}.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:0 20px}.cols2{display:grid;grid-template-columns:1fr 1fr;gap:0 20px;align-items:start}@media(max-width:900px){.cols2{grid-template-columns:1fr}}h3.team{margin:18px 0 8px;font-size:15px;font-weight:600}h3.team .chain{display:block;color:var(--mut);font-weight:400;font-size:12.5px;margin-top:2px}.card .step{display:inline-block;min-width:18px;height:18px;line-height:18px;text-align:center;border-radius:9px;background:var(--bd);color:var(--mut);font-size:11px;font-weight:600;margin-right:6px}.grid4{display:grid;gap:12px;grid-template-columns:repeat(4,1fr)}@media(max-width:1100px){.grid4{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.grid4{grid-template-columns:1fr}}
.rows{display:flex;flex-direction:column;gap:8px}

a.row:hover{border-color:var(--acc);text-decoration:none}
.row b{white-space:nowrap}.row span{flex:1;color:var(--mut)}.row em{color:var(--mut);font-style:normal;font-size:18px}

.tiles{display:flex;gap:10px;flex-wrap:nowrap;overflow-x:auto;margin:14px 0 6px;padding-bottom:4px}

.gallery img{height:460px;max-height:72vh}

.st.run{background:rgba(13,150,104,.16);color:var(--ok)}
.st.appr{background:rgba(201,147,10,.16);color:#c9930a}

.st.draft{background:rgba(139,92,246,.15);color:#8b5cf6}

.st.crit{background:rgba(200,34,34,.15);color:var(--down)}
.rowwrap{position:relative}

.delf{position:absolute;top:0;right:0;bottom:0;display:flex;align-items:center;margin:0}
.del{background:none;border:none;color:var(--mut);font-size:17px;line-height:1;padding:6px 12px;cursor:pointer;border-radius:8px;opacity:.45}
.rowwrap:hover .del{opacity:1}
.del:hover{color:var(--down);background:rgba(200,34,34,.08)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(430px,1fr));gap:12px;margin-top:12px}
@media(max-width:520px){.fgrid{grid-template-columns:1fr}}
.fcard{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:13px 15px}
.fcard .fh{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:8px}
.fcard .fh b{font-size:14.5px}.fcard .fh span{font-size:12.5px;color:var(--mut);white-space:nowrap}
.fs{display:flex;align-items:center;gap:8px;margin:3px 0;font-size:13px}

.rrow{display:flex;gap:8px;margin:10px 0 4px}
.rc{flex:1;background:rgba(125,125,125,.09);border-radius:9px;padding:6px 9px}
.rc b{display:block;font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.rc .rv{display:block;font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.25}
.rc .rb{display:block;font-size:11px;color:var(--mut)}
.fnds{list-style:none;margin:10px 0 0;padding:0}
.fnds li{position:relative;padding:2px 0 2px 16px;font-size:13px;color:var(--tx)}
.fnds li:before{content:"";position:absolute;left:0;top:9px;width:7px;height:7px;border-radius:50%}
.fnds li.crit:before{background:var(--down)}.fnds li.warn:before{background:#c9930a}.fnds li.ok:before{background:var(--ok)}
.nxt{margin-top:11px;background:var(--hl);border:1px solid var(--bd);border-radius:10px;padding:9px 12px}
.nxt .nxl{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
.nxt b{font-size:14px}.nxt p{margin:3px 0 0;font-size:13px;color:var(--mut)}
.fh .st{margin-left:8px}
.dirbox{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:20px 24px;margin:20px 0 8px}
.dirlab{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--mut)}
.dirh{font-size:19px;line-height:1.35;margin:4px 0 12px;text-transform:none;letter-spacing:0;color:var(--tx)}
.dirp{margin:0 0 9px;font-size:14px;line-height:1.6;color:var(--tx)}
.prio{display:flex;gap:13px;padding:11px 0;border-top:1px solid var(--bd)}

.prc{flex:1;min-width:0}

.vgrid{display:flex;flex-direction:column;gap:6px}

.vrow span:last-child{flex:1;min-width:220px;color:var(--mut)}

.fnote{font-size:11.5px;color:var(--mut);margin:4px 0 0 176px;line-height:1.35}

/* ---------- camada de acabamento (01/10/2026) ----------
   Tipografia com duas vozes (display para títulos e números, texto para leitura),
   neutros com viés do azul da marca em vez de cinza puro, e profundidade por
   sombra em vez de só borda. Nada aqui renomeia classe: é uma camada por cima. */
:root{
  --f-disp:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --f-text:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --bg:#f3f5f9; --card:#ffffff; --tx:#10131a; --mut:#5a6377; --acc:#1552d8;
  --bd:#dde2ea; --bd-soft:#e8ecf3; --ok:#0a8f58; --down:#d02f2f; --warn:#b45309;
  --sh:0 1px 2px rgba(16,19,26,.05),0 2px 8px rgba(16,19,26,.04);
  --sh-up:0 2px 6px rgba(16,19,26,.07),0 10px 24px rgba(16,19,26,.07);
  --rad:14px;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#0b0d12; --card:#161a22; --tx:#eef1f7; --mut:#9aa5b8; --acc:#7aa6ff;
  --bd:#272d39; --bd-soft:#1f242e; --ok:#43d08d; --down:#ff7070; --warn:#e5a645;
  --sh:0 1px 2px rgba(0,0,0,.4); --sh-up:0 6px 22px rgba(0,0,0,.5);
}}
body{font-family:var(--f-text);font-size:14.5px;line-height:1.6;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1{font-family:var(--f-disp);font-size:27px;font-weight:800;letter-spacing:-.02em;
  text-wrap:balance;margin:0 0 2px}
h1 .mark{display:inline-block;width:28px;height:28px;vertical-align:-5px;margin-right:11px;
  background-size:contain;background-repeat:no-repeat;background-position:center}
h2{font-family:var(--f-disp);font-size:12px;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;color:var(--mut);border-top:1px solid var(--bd-soft);
  padding-top:22px;margin:32px 0 14px}
h3{font-family:var(--f-disp);letter-spacing:-.01em}
.sub{font-size:13px;color:var(--mut)}
code,.mono{font-family:var(--f-mono);font-size:12.5px}
.card,table.t,a.tile,.row,.fcard,#md{box-shadow:var(--sh);border-color:var(--bd-soft)}
.card,a.tile,.row,.fcard{border-radius:var(--rad);
  transition:box-shadow .16s ease,border-color .16s ease,transform .16s ease}
a.tile:hover,a.row:hover,.fcard:hover{box-shadow:var(--sh-up);border-color:var(--bd);
  transform:translateY(-1px)}
/* big numbers: the first thing anyone reads on the page */
.tiles{gap:12px;margin:18px 0 4px;padding-bottom:10px}
a.tile{padding:13px 17px;min-width:148px}
.tile .tl{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
  color:var(--mut)}
.tile .tv{font-family:var(--f-disp);font-size:25px;font-weight:800;letter-spacing:-.025em;
  margin-top:3px}
.tile .ts{font-size:11.5px;color:var(--mut)}
/* tables read as data, not as prose */
table.t{border-radius:var(--rad);font-variant-numeric:tabular-nums}
table.t th{font-family:var(--f-disp);font-size:11px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;background:var(--bd-soft);border-bottom:1px solid var(--bd)}
table.t td{padding:9px 13px;border-bottom:1px solid var(--bd-soft)}
table.t tbody tr:hover td,table.t tr:hover td{background:rgba(125,140,170,.06)}
.twrap{border-radius:var(--rad)}
/* buttons */
.btn{font-family:var(--f-disp);font-weight:600;font-size:13.5px;padding:9px 18px;
  border-radius:999px;box-shadow:var(--sh);transition:all .16s ease}
.btn:hover{border-color:var(--acc);box-shadow:var(--sh-up);transform:translateY(-1px)}
.pill,.st{font-family:var(--f-disp);font-weight:600;font-size:11.5px;letter-spacing:.02em}
/* status colours carry meaning, so keep them out of the accent */
.st.run,.st.appr{background:rgba(10,143,88,.14);color:var(--ok)}
.st.crit{background:rgba(208,47,47,.14);color:var(--down)}
.st.rev,.st.draft{background:rgba(180,83,9,.14);color:var(--warn)}
/* the lanes strip and any scroller get a thin, rounded bar */
.tiles,.hrow,.twrap{scrollbar-width:thin;scrollbar-color:var(--bd) transparent}
.tiles::-webkit-scrollbar,.hrow::-webkit-scrollbar,.twrap::-webkit-scrollbar{height:9px}
.tiles::-webkit-scrollbar-track,.hrow::-webkit-scrollbar-track,
.twrap::-webkit-scrollbar-track{background:transparent}
.tiles::-webkit-scrollbar-thumb,.hrow::-webkit-scrollbar-thumb,
.twrap::-webkit-scrollbar-thumb{background:var(--bd);border-radius:999px;
  border:3px solid transparent;background-clip:content-box}
.tiles::-webkit-scrollbar-thumb:hover,.hrow::-webkit-scrollbar-thumb:hover,
.twrap::-webkit-scrollbar-thumb:hover{background:var(--mut);background-clip:content-box}
.hrow{background:transparent;border:0;padding:0;border-radius:0}
.hcol{flex:0 0 clamp(280px,26vw,360px);min-width:0}
a:focus-visible,button:focus-visible,.btn:focus-visible{outline:2px solid var(--acc);
  outline-offset:2px;border-radius:8px}
.dirlist,.prlist{margin:10px 0 0;padding-left:18px;list-style:none}
.dirlist>li,.prlist>li{position:relative;margin:0 0 7px;font-size:13.5px;line-height:1.5;
  color:var(--tx)}
.prlist>li{color:var(--mut);font-size:13px;margin-bottom:5px}
.dirlist>li::before,.prlist>li::before{content:"";position:absolute;left:-14px;top:.62em;
  width:5px;height:5px;border-radius:50%;background:var(--acc);opacity:.75}
.prlist>li::before{background:var(--mut);opacity:.5}
.dirp{display:none}
.dapps{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));
  margin:14px 0 4px;align-items:start}
.dapp{padding:14px 16px}
.dah{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.dah b{font-family:var(--f-disp);font-size:14.5px;font-weight:700}
.drank{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;
  border-radius:6px;background:var(--acc);color:#fff;font-size:11.5px;font-weight:700;flex:none}
.st.d-dobrar{background:rgba(10,143,88,.16);color:var(--ok)}
.st.d-consertar{background:rgba(180,83,9,.16);color:var(--warn)}
.st.d-manter{background:rgba(125,140,170,.16);color:var(--mut)}
.st.d-congelar{background:rgba(125,140,170,.12);color:var(--mut)}
.dapp .prlist{margin-top:6px}
.dcall{color:var(--tx)!important;font-weight:600}
.fcard[id]{scroll-margin-top:18px}
.fdet{margin-top:10px;border-top:1px solid var(--bd-soft);padding-top:9px}
.fdet>summary{cursor:pointer;list-style:none;font-family:var(--f-disp);font-size:11.5px;
  font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);
  display:flex;align-items:center;gap:7px}
.fdet>summary::-webkit-details-marker{display:none}
.fdet>summary::before{content:"›";font-size:15px;transition:transform .15s}
.fdet[open]>summary::before{transform:rotate(90deg)}
.fdet>summary:hover{color:var(--acc)}
.fdet table.t{font-size:12.5px}
.fdet table.t td,.fdet table.t th{padding:6px 10px}
.fgrid.one{grid-template-columns:1fr!important}
.fcols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;
  align-items:start}
@media(max-width:820px){.fcols{grid-template-columns:1fr;gap:12px}}
.fcol{min-width:0}
.fcol>.fnds{margin-top:0}
.fdet .ascgrid{grid-template-columns:repeat(auto-fit,minmax(118px,1fr))}
.fdetcols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;
  align-items:start}
@media(max-width:1100px){.fdetcols{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:760px){.fdetcols{grid-template-columns:1fr}}
.fdetcols>div{min-width:0;display:flex;flex-direction:column;gap:14px}
.rawbox{background:var(--bg);border:1px solid var(--bd-soft);border-radius:11px;
  padding:11px 13px;min-width:0}
.rawbox h4,.rawbox h3.team{margin:0 0 8px;font-family:var(--f-disp);font-size:10.5px;
  font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--mut)}
.rawbox h3.team .chain{text-transform:none;letter-spacing:0;font-size:11px}
.rawbox table.t{border:0;box-shadow:none;background:transparent}
.rawbox table.t th{background:transparent;border-bottom:1px solid var(--bd)}
.rawbox table.t td{border-bottom:1px solid var(--bd-soft)}
.rawbox .twrap{border-radius:0}
.rawbox .ascgrid{margin-bottom:0}
.rawbox .ascgrid>div{background:var(--card)}

<body><div class="wrap"><p class="sub" style="font-size:12px;margin:0 0 14px">Exportado em 2026-10-01 16:14 · fonte: Lab Hub local</p><p class="sub"><a href="../index.html">← hub</a> · <code>Apps/intermediate/Controle-de-gastos/aso-pipeline/iterations/2026-05-23_iter-01-text-pt-BR-keywords/research/keyword_candidates.md</code></p><div id="md"></div><script>const RAW="# Keyword analysis & proposal \u2014 iter-01 (pt-BR)\n\n**Data**: 2026-05-23\n**Source**: Astro export (`data.csv` = 194 termos trackeados na store BR \u2014 puxado via MCP `astro-mcp-server v2026.11.1`)\n**Filtro decis\u00e3o**: intent-match first, depois quadrante:\n- \ud83e\udd47 diff \u2264 20 (any pop) \u2014 gold\n- \ud83e\udd48 diff 21-40 + pop \u2265 10 \u2014 sweet spot\n- \ud83e\udd49 diff 41-60 + pop \u2265 25 \u2014 apostas moderadas\n- \ud83d\udd25 pop \u2265 40 + rank \u2264 50 \u2014 near-miss (push to top-30)\n- \ud83d\udee1 rank \u2264 30 \u2014 defenders (proteger composi\u00e7\u00f5es)\n- \ud83d\udeab cortar mesmo se quadrante bom \u2014 intent-mismatch destr\u00f3i CVR\n\n## Estado atual (live ASC)\n\n```\nName      (29/30): Minhas Despesas Gastos Contas\nSubtitle  (30/30): Controle financeiro de despesa\nKeywords (100/100): finan\u00e7as,financeiro,gest\u00e3o,dinheiro,or\u00e7amento,poupan\u00e7a,despesas,controle,planejamento,gerenci,custos\n```\n\n## Tabela de pesos ASO\n\n| Campo       | Peso indexa\u00e7\u00e3o | Estrat\u00e9gia                                                           |\n|-------------|---------------:|----------------------------------------------------------------------|\n| Name        | 7\u00d7             | N\u00c3O MEXER nesta iter \u2014 j\u00e1 cobre 3 head: despesas, gastos, contas    |\n| Subtitle    | 3\u00d7             | Reescrever pra cobrir cluster `controle financeiro` + `receitas`     |\n| Keywords    | 1\u00d7             | Cortar dups com name/subtitle (~25 chars), redirecionar pra near-miss e personas |\n| Description | 0\u00d7 (~)         | Mant\u00e9m \u2014 n\u00e3o muda nesta iter                                         |\n\n## Princ\u00edpio operacional\n\n**N\u00e3o duplicar termos entre campos** (Apple indexa cada token na maior weight position). Cada char no keywords field s\u00f3 vale se N\u00c3O est\u00e1 no name/subtitle. Stem matching: `despesa`/`despesas`, `finan\u00e7a`/`finan\u00e7as`/`financeiro` contam como mesmo stem.\n\n## Caveat Astro pop=5\n\nAstro reporta `popularity=5` como piso (n\u00e3o distingue volume abaixo desse threshold). Termos pop=5 podem ser tudo de 0 buscas/dia a ~10 buscas/dia. Por isso PROTEGEMOS os termos top-30 com pop=5 (eles podem estar drivando trickle real) e tomamos cuidado ao apostar em termos novos s\u00f3 com pop=5 (incerteza alta).\n\n## \ud83d\udeab Cortes por intent-mismatch (decis\u00e3o cr\u00edtica)\n\nRemovidos do pool de considera\u00e7\u00e3o mesmo quando quadrante seria gold/sweet \u2014 porque a **intent natural da busca n\u00e3o match com o produto**. Esses pareciam tentadores no Astro pelo pop+diff, mas instalar baseado em intent errada gera review 1-star, churn alto, e Apple penaliza o app no algoritmo de recomenda\u00e7\u00e3o. (Ver memory `feedback-aso-search-intent`.)\n\n| Termo cortado            | Pop | Diff | Rank | Raz\u00e3o de corte                                                              |\n|--------------------------|----:|-----:|-----:|-----------------------------------------------------------------------------|\n| `cofrinho`               |  51 |   17 |   23 | Savings-gamification niche (Caixinha, Mealheiro) \u2014 quem busca espera cofre virtual gamificado, n\u00e3o registro manual. CVR baixa, churn alto. |\n| `cofrinho digital`       |   5 |   34 |   26 | Mesmo motivo                                                                |\n| `caixinha`               |   5 |   39 |    \u2014 | Savings-gamification                                                        |\n| `poupar dinheiro`        |   5 |   23 |    \u2014 | Intent \"guardar\" (cofrinho) vs trackear                                     |\n| `economia dom\u00e9stica`     |   5 |    8 |    \u2014 | Educa\u00e7\u00e3o financeira / dicas \u2014 conte\u00fado, n\u00e3o app                            |\n| `pix`                    |  65 |   91 |    \u2014 | Quer transferir, n\u00e3o trackear                                               |\n| `calculadora`            |  72 |   57 |    \u2014 | Utility cross \u2014 quer calculadora, n\u00e3o finance manager                      |\n| `mei contador`           |   5 |    5 |    \u2014 | B2B contabilidade \u2014 outro nicho                                             |\n| `contabilidade simples`  |   5 |    5 |    \u2014 | B2B                                                                         |\n| `lucro preju\u00edzo`         |   5 |    5 |    \u2014 | B2B                                                                         |\n| `balan\u00e7o financeiro`     |   5 |    5 |    \u2014 | B2B                                                                         |\n| `mobills`                |  65 |   50 |    \u2014 | Competitor brand search \u2014 usu\u00e1rio quer aquele app espec\u00edfico               |\n| `minhas economias`       |  61 |   53 |   30 | Competitor brand search                                                     |\n| `minhas financas`        |  57 |   58 |   26 | Variant de competitor brand                                                 |\n| `fleur` / `fleur gastos` |   8 |   52 |    \u2014 | Competitor brand                                                            |\n| `organizze`              |  61 |    \u2014 |    \u2014 | Competitor brand                                                            |\n| `despezzas` / `pierre`   |   \u2014 |    \u2014 |    \u2014 | Competitor brand                                                            |\n| `planilha`               |  60 |   63 |    \u2014 | Quem busca quer planilha, n\u00e3o app alternativo                              |\n| `face id` / `widget` / `icloud` / `senha` / `backup` |  9-69 | 49-74 | \u2014 | Feature secund\u00e1ria isolada \u2014 intent fraca como query prim\u00e1ria              |\n| `caixa` / `casa` / `mercado` / `alimenta\u00e7\u00e3o` |  60-85 | 66-87 | \u2014 | Single-word generic \u2014 diff alta + intent amb\u00edgua                  |\n\n**Net char savings de cortes**: liberamos ~50% do char budget original do keywords field pra redirecionar.\n\n---\n\n## \ud83d\udcd0 Diff visual \u2014 antes / depois\n\nLegenda:\n- <span style=\"color:#dc3545\">\ud83d\udd34 Vermelho</span> = saiu completamente\n- <span style=\"color:#28a745\">\ud83d\udfe2 Verde</span> = entrou totalmente novo\n- <span style=\"color:#3b82f6\">\ud83d\udd35 Azul claro</span> = mudou pra peso MAIOR (kw 1\u00d7 \u2192 subtitle 3\u00d7)\n- <span style=\"color:#1e3a8a\">\ud83d\udd35 Azul escuro</span> = mudou pra peso MENOR (subtitle 3\u00d7 \u2192 kw 1\u00d7)\n- Preto = mant\u00e9m posi\u00e7\u00e3o\n\n### \ud83c\udff7 Name\n\n| Antes (29/30)                                                                  | Depois (29/30)                                                                |\n|--------------------------------------------------------------------------------|-------------------------------------------------------------------------------|\n| Minhas Despesas Gastos Contas                                                  | Minhas Despesas Gastos Contas <span style=\"color:gray\">(unchanged)</span>     |\n\n### \ud83c\udff7 Subtitle\n\n| Antes (30/30)                                                                                                 | Depois (30/30)                                                                                                |\n|---------------------------------------------------------------------------------------------------------------|---------------------------------------------------------------------------------------------------------------|\n| Controle financeiro de <span style=\"color:#dc3545\">despesa</span>                                              | Controle financeiro e <span style=\"color:#28a745\">receitas</span>                                              |\n\n### \ud83d\udd11 Keywords field\n\n| Antes (100/100)                                                                                                              | Depois (98/100)                                                                                                                                                                                                                                                                                                            |\n|------------------------------------------------------------------------------------------------------------------------------|----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|\n| <span style=\"color:#dc3545\">finan\u00e7as</span>, <span style=\"color:#dc3545\">financeiro</span>, gest\u00e3o, dinheiro, <span style=\"color:#dc3545\">or\u00e7amento</span>, <span style=\"color:#dc3545\">poupan\u00e7a</span>, <span style=\"color:#dc3545\">despesas</span>, <span style=\"color:#dc3545\">controle</span>, planejamento, <span style=\"color:#dc3545\">gerenci</span>, <span style=\"color:#dc3545\">custos</span> | <span style=\"color:#28a745\">controle de gastos</span>, <span style=\"color:#28a745\">personal</span>, <span style=\"color:#28a745\">casal</span>, <span style=\"color:#28a745\">money</span>, <span style=\"color:#28a745\">expenses</span>, <span style=\"color:#28a745\">budget</span>, <span style=\"color:#28a745\">gerenciador</span>, dinheiro, gest\u00e3o, <span style=\"color:#28a745\">pessoal</span>, <span style=\"color:#28a745\">mensal</span> |\n\n---\n\n## \ud83c\udff7 NAME (palavra-por-palavra \u2014 sem mudan\u00e7a nesta iter)\n\n| Palavra   | Pop | Diff | Rank atual | Decis\u00e3o                                                                          |\n|-----------|----:|-----:|-----------:|----------------------------------------------------------------------------------|\n| Minhas    |   \u2014 |    \u2014 |          \u2014 | Branding modifier \u2014 compose com \"Minhas Despesas\" (rank 31), \"Minhas Contas\" (rank 17) |\n| Despesas  |  52 |   53 |         33 | Head \u2014 rank 33, near top-30. Manter peso 7\u00d7.                                     |\n| Gastos    |  34 |   63 |         40 | Head \u2014 rank 40, pr\u00f3ximo top-30. Manter peso 7\u00d7.                                  |\n| Contas    |  55 |   79 |         96 | Head \u2014 rank 96, mas dups \"minhas contas\" rank 17, \"gastos contas\" rank 3.       |\n\n**Decis\u00e3o**: Name fica intocado. Mexer no name custaria reset de rank-protection nas composi\u00e7\u00f5es j\u00e1 estabelecidas (`contas despesas` #4, `gastos contas` #3, `despesas gastos` #6).\n\n---\n\n## \ud83c\udff7 SUBTITLE (decis\u00e3o palavra-por-palavra)\n\n### SAIU\n\n| Termo         | Pop | Diff | Rank | Por qu\u00ea removeu                                                                |\n|---------------|----:|-----:|-----:|--------------------------------------------------------------------------------|\n| `despesa`     |   \u2014 |    \u2014 |    \u2014 | Singular dup com `Despesas` no name (Apple stems). Peso 3\u00d7 desperdi\u00e7ado. \u26a0\ufe0f    |\n| `de`          |   \u2014 |    \u2014 |    \u2014 | Stopword PT \u2014 Apple ignora. Liberou 2 chars + 1 espa\u00e7o.                       |\n\n### ENTROU\n\n| Termo       | Pop | Diff | Rank | Por qu\u00ea entrou                                                                  |\n|-------------|----:|-----:|-----:|---------------------------------------------------------------------------------|\n| `receitas`  |  50 |   42 |    \u2014 | \ud83e\udd49 Melhor moderate intent-OK do pool. Par universal \"receitas e despesas\" (5/6 competitors). Mover pra peso 3\u00d7 \u00e9 GAIN puro. |\n\n### MANT\u00c9M\n\n| Termo         | Pop | Diff | Rank | Por qu\u00ea manteve                                                                  |\n|---------------|----:|-----:|-----:|----------------------------------------------------------------------------------|\n| `Controle`   |  69 |   65 |    \u2014 | Mant\u00e9m peso 3\u00d7 \u2192 compose com name pra `controle de despesas`, `controle de gastos`, `controle de contas`. Stem ESSENCIAL. |\n| `financeiro` |  30 |   61 |  229 | Mant\u00e9m peso 3\u00d7 \u2192 compose `controle financeiro` (pop 54, atual rank 164 \u2192 target \u2191) e stem cross com `finan\u00e7as`. |\n| `e`          |   \u2014 |    \u2014 |    \u2014 | Stopword Apple ignora \u2014 economia visual.                                        |\n\n**Subtitle nova**: `Controle financeiro e receitas` (30/30 chars exato)\n\n---\n\n## \ud83d\udd11 KEYWORDS FIELD (decis\u00e3o palavra-por-palavra)\n\n### SAIU\n\n| Termo         | Pop | Diff | Rank | Por qu\u00ea removeu (chars liberados)                                                |\n|---------------|----:|-----:|-----:|----------------------------------------------------------------------------------|\n| `finan\u00e7as`    |  52 |   55 |    \u2014 | Stem dup com `financeiro` no subtitle peso 3\u00d7 \u2014 liberou 9 chars.                |\n| `financeiro`  |  30 |   61 |  229 | Dup com subtitle peso 3\u00d7 \u2014 liberou 10 chars.                                    |\n| `or\u00e7amento`   |   5 |    \u2014 |    \u2014 | Termo universal mas pop=5 (floor). N\u00e3o rankeia. Liberou 9 chars.                |\n| `poupan\u00e7a`    |   5 |    \u2014 |    \u2014 | Intent amb\u00edguo (savings vs cofrinho niche). Liberou 8 chars.                    |\n| `despesas`    |  52 |   53 |   33 | Stem dup com `Despesas` no name peso 7\u00d7. Liberou 9 chars.                       |\n| `controle`    |  69 |   65 |    \u2014 | Stem dup com `Controle` no subtitle peso 3\u00d7. Liberou 8 chars.                   |\n| `gerenci`     |   \u2014 |    \u2014 |    \u2014 | \u274c TOKEN TRUNCADO (bug). Substitu\u00eddo por `gerenciador` (pop 46 diff 54). +4 chars net. |\n| `custos`      |   \u2014 |    \u2014 |    \u2014 | Synonym de `despesas` que j\u00e1 est\u00e1 no name peso 7\u00d7. Liberou 6 chars.             |\n\n**Net chars liberados**: ~58 chars (de 100 \u2192 consumo livre)\n\n### ENTROU\n\nFront-loaded por valor descendente (high-pop + high-leverage primeiro):\n\n| #  | Termo                | Pop | Diff | Rank | Por qu\u00ea entrou                                                                   |\n|----|----------------------|----:|-----:|-----:|----------------------------------------------------------------------------------|\n| 1  | `controle de gastos` |  53 |   61 |   48 | \ud83d\udd25 NEAR-MISS \u2014 \u00fanico termo high-pop a 1 p\u00e1gina do top-30. Head do nicho ocupado por Mobills+Fleur. Push prim\u00e1rio. 18 chars. |\n| 2  | `personal`           |  48 |   58 |   41 | \ud83d\udee1 RANK-PROTECT \u2014 J\u00c1 rankeia 41 em EN-cross. Pop 48. 8 chars.                    |\n| 3  | `casal`              |  54 |   55 |    \u2014 | \ud83e\udd49 Persona gap zero-competition. Mobills/Fleur n\u00e3o cobrem. Pop 54 unranked. 5 chars. |\n| 4  | `money`              |  55 |   60 |    \u2014 | \ud83e\udd49 EN-cross \u2014 Wallet/MoneyNote/Mobills cobrem em desc. Pop 55. 5 chars.         |\n| 5  | `expenses`           |  30 |   45 |   39 | \ud83d\udee1 RANK-PROTECT \u2014 J\u00c1 rankeia 39 (EN-cross). 8 chars.                            |\n| 6  | `budget`             |  43 |   49 |    \u2014 | \ud83e\udd49 EN-cross sweet (diff 49). 6 chars.                                           |\n| 7  | `gerenciador`        |  46 |   54 |    \u2014 | Fix do bug `gerenci` truncado + compose com `gerenciador de gastos` (Mobills desc). 11 chars. |\n| 8  | `pessoal`            |   \u2014 |    \u2014 |    \u2014 | PT cross-stem \u2014 compose `finan\u00e7as pessoais` (pop 59), `gastos pessoais`, `despesas pessoais`. 7 chars. |\n| 9  | `mensal`             |   \u2014 |    \u2014 |    \u2014 | Period modifier \u2014 compose `gastos mensais`, `controle mensal`, `or\u00e7amento mensal`. 6 chars. |\n\n### MANT\u00c9M\n\n| Termo          | Pop | Diff | Rank | Por qu\u00ea mant\u00e9m                                                                  |\n|----------------|----:|-----:|-----:|----------------------------------------------------------------------------------|\n| `dinheiro`     |  53 |   68 |    \u2014 | High-pop head \u2014 embora unranked, intent perfeita. 8 chars.                       |\n| `gest\u00e3o`       |   \u2014 |    \u2014 |    \u2014 | Abstract head \u2014 compose `gest\u00e3o financeira` (Minhas Economias). 6 chars.        |\n\n### CASE-FIX\n\nN\u00e3o h\u00e1 case-fix nesse field (j\u00e1 lowercase).\n\n---\n\n## \ud83d\udcc4 Resultado final\n\n```\nName      (29/30): Minhas Despesas Gastos Contas              \u2190 unchanged\nSubtitle  (30/30): Controle financeiro e receitas             \u2190 changed\nKeywords  (98/100): controle de gastos,personal,casal,money,expenses,budget,gerenciador,dinheiro,gest\u00e3o,pessoal,mensal   \u2190 changed\n```\n\n## \ud83d\udccb Ordena\u00e7\u00e3o dos keywords (front-loading)\n\n| Pos | Termo                | Pop | Diff | Rank | Bucket                  |\n|----:|----------------------|----:|-----:|-----:|-------------------------|\n|   1 | controle de gastos   |  53 |   61 |   48 | \ud83d\udd25 near-miss (push)     |\n|   2 | personal             |  48 |   58 |   41 | \ud83d\udee1 rank-protect          |\n|   3 | casal                |  54 |   55 |    \u2014 | \ud83e\udd49 persona gap          |\n|   4 | money                |  55 |   60 |    \u2014 | \ud83e\udd49 EN cross             |\n|   5 | expenses             |  30 |   45 |   39 | \ud83d\udee1 rank-protect          |\n|   6 | budget               |  43 |   49 |    \u2014 | \ud83e\udd49 EN sweet             |\n|   7 | gerenciador          |  46 |   54 |    \u2014 | bug-fix + intent        |\n|   8 | dinheiro             |  53 |   68 |    \u2014 | head retention          |\n|   9 | gest\u00e3o               |   \u2014 |    \u2014 |    \u2014 | abstract head           |\n|  10 | pessoal              |   \u2014 |    \u2014 |    \u2014 | persona composition     |\n|  11 | mensal               |   \u2014 |    \u2014 |    \u2014 | period modifier         |\n\nL\u00f3gica: o termo mais alto-valor \u00e9 o \"push to top-30\" (`controle de gastos`), seguido dos rank-protects pra defender ganhos existentes, depois moderates pop alto unranked (territory exploration), depois compositions modifiers (mensal/pessoal comp\u00f5em m\u00faltiplas frases).\n\n---\n\n## Cobertura por cluster (peso composto: name 7\u00d7 + sub 3\u00d7 + kw 1\u00d7)\n\n| Cluster                              | Name 7\u00d7                  | Subtitle 3\u00d7                    | Keywords 1\u00d7                                                 | Peso total |\n|--------------------------------------|--------------------------|--------------------------------|-------------------------------------------------------------|-----------:|\n| **Controle (head verbo)**            |                          | Controle                       | controle de gastos                                          | 3+1 = **4** |\n| **Despesas / gastos (head noun)**    | Despesas, Gastos         | (compose via stems)            | expenses                                                    | 7+7+1 = **15** |\n| **Contas (head noun)**               | Contas                   |                                |                                                             | 7         |\n| **Financeiro (head adj)**            |                          | financeiro                     |                                                             | 3         |\n| **Receitas (income side)**           |                          | receitas                       |                                                             | 3         |\n| **Persona casal**                    |                          |                                | casal                                                       | 1         |\n| **Persona pessoal**                  |                          |                                | personal, pessoal                                           | 2         |\n| **Period mensal**                    |                          |                                | mensal                                                      | 1         |\n| **Dinheiro/money (head universal)**  |                          |                                | dinheiro, money                                             | 2         |\n| **Budget/gest\u00e3o (head abstract)**    |                          |                                | budget, gest\u00e3o, gerenciador                                 | 3         |\n\n---\n\n## \ud83d\udee1 Termos protegidos (verificar p\u00f3s-deploy)\n\nEsses j\u00e1 rankeiam top-30 \u2014 confirmar que continuam ap\u00f3s mudan\u00e7a:\n\n| Termo                | Pop | Rank atual | Mecanismo de rank                                              |\n|----------------------|----:|-----------:|----------------------------------------------------------------|\n| `gastos contas`      |   5 |          3 | Compose name (Gastos+Contas)                                   |\n| `contas despesas`    |   5 |          4 | Compose name (Contas+Despesas)                                 |\n| `despesas gastos`    |   5 |          6 | Compose name (Despesas+Gastos)                                 |\n| `minhas contas`      |   5 |         17 | Compose name (Minhas+Contas) ersonal`/`money`/`budget`/`expenses`) podem ter CVR menor que PT-BR puros** \u2014 usu\u00e1rios BR buscando em ingl\u00eas s\u00e3o minoria. Compensado pelo fato de `personal` e `expenses` J\u00c1 rankearem 41/39 (defending existing).\n4. **`gerenci` \u2192 `gerenciador` pode n\u00e3o compor com queries `gerenciamento`** \u2014 Apple stem matching pode n\u00e3o atravessar `gerenciador` \u2194 `gerenciamento`. Tradeoff aceit\u00e1vel pelo gain em `gerenciador de gastos`.\n5. **Cold-start cap**: app c/ 1.5 dl/dia tem Apple algorithm signals fracos. Mesmo rank top-10 pode n\u00e3o converter linearmente em downloads \u2014 pode precisar de iter-02 atacando descri\u00e7\u00e3o + screenshots se downloads n\u00e3o saltarem ap\u00f3s 14d.\n6. **Apple ASC review** improv\u00e1vel mas poss\u00edvel rejei\u00e7\u00e3o de `Controle financeiro e receitas` por trademark conflict \u2014 risco baixo, mitiga\u00e7\u00e3o = manter pronto fallback `Gastos, contas e receitas` (29/30).\n";</script><script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script><script>document.getElementById("md").innerHTML=window.marked?marked.parse(RAW):"<pre>"+RAW.replace(/</g,"&lt;")+"</pre>";</script></div><script>(function(){try{var k="lh.scroll:"+location.pathname;var v=sessionStorage.getItem(k);if(v!==null){sessionStorage.removeItem(k);window.scrollTo(0,parseInt(v,10)||0);}document.addEventListener("submit",function(e){var f=e.target;if(f&&f.method&&f.method.toLowerCase()==="post"){sessionStorage.setItem(k,String(window.scrollY));}},true);}catch(e){}})();</script></body></html>
