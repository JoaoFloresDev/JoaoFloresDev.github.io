<body><div class="wrap"><p class="sub" style="font-size:12px;margin:0 0 14px">Exportado em 2026-10-01 08:56 · fonte: Lab Hub local</p><p class="sub"><a href="../index.html">← hub</a> · <code>_GambitStudio/aso/reference/aso-ranking-playbook.md</code></p><div id="md"></div><script>const RAW="# ASO Ranking Playbook \u2014 como apps pequenos come\u00e7am a rankear (2025-2026)\n\n> **Fonte da verdade compartilhada** entre `/research-aso-keywords` (pr\u00e9-launch) e `/start-aso-pipeline` (p\u00f3s-launch).\n> Compilado de varredura web 2026-08-07 (fontes no rodap\u00e9) + learnings internos do lab; **corrigido em 2026-09-27** contra a varredura `research-2026-09-aso.md` (23 achados com fonte e tag de confian\u00e7a \u2014 os n\u00fameros de achado citados abaixo s\u00e3o os de l\u00e1).\n> **As duas skills DEVEM ler este arquivo antes de propor qualquer metadata.**\n\n---\n\n## Atualiza\u00e7\u00e3o 2026-09-27 (pesquisa)\n\nO que MUDOU neste playbook em rela\u00e7\u00e3o ao texto de 2026-08-07, com o achado da pesquisa que motivou cada troca:\n\n- **Campos indexados s\u00e3o 4, n\u00e3o 3: name, subtitle, keywords e categoria prim\u00e1ria. Description N\u00c3O entra no \u00edndice** (achado 1, Apple oficial). O texto antigo dizia \"s\u00f3 3 campos\" e ignorava a categoria.\n- **Captions de screenshot N\u00c3O s\u00e3o indexadas \u2014 evid\u00eancia fraca, sem confirma\u00e7\u00e3o da Apple** (achado 6). \u00a71, \u00a73, \u00a75 e \u00a78 afirmavam o contr\u00e1rio; o termo-alvo na headline fica s\u00f3 por convers\u00e3o.\n- **\"Seven-day cliff\" \u00e9 boost de LAN\u00c7AMENTO (Sensor Tower, 2014, 2 apps), n\u00e3o penalidade p\u00f3s-troca de metadata** (achado 18). \u00a72 e \u00a76 tratavam toda troca como \"reset\". Re-indexa\u00e7\u00e3o de metadata: 3-7 dias t\u00edpico, 48 h em app de tr\u00e1fego alto, 10-14 dias em app novo \u2014 observa\u00e7\u00e3o de vendor, sem dado p\u00fablico. Leitura D7 continua; oscila\u00e7\u00e3o pr\u00e9-D7 n\u00e3o se chama \"cliff\".\n- **A escala de popularidade do Apple Ads quebrou em 29/09-03/10/2025** \u2014 keywords com pop >5 nos EUA ca\u00edram 77% em 4 dias; a Astro serve backup de out/2025 + \"Monthly Search Term Rank Report\" da Apple (achado 14). \u00a74 agora exige **2\u00aa fonte de volume** antes de gastar char de name/subtitle, e pop=5 passa de \"piso\" a \"desconhecido\".\n- **CPPs ligadas a keywords aparecem na busca org\u00e2nica desde 30/07/2025; at\u00e9 70 por app; keywords v\u00eam s\u00f3 do keyword field da \u00faltima vers\u00e3o aprovada; sem review para atribuir** (achados 4-5). Ganhou procedimento pr\u00f3prio (\u00a79), com o que a ASC API exp\u00f5e (verificado read-only em 27/09).\n- **Apple Ads vira \"fase 0\" da itera\u00e7\u00e3o** (achados 15-16): o valor comprov\u00e1vel \u00e9 o DADO (queries reais + convers\u00e3o por termo via Search Match), n\u00e3o o uplift org\u00e2nico \u2014 que ningu\u00e9m mediu. \u00a73 reescrito com benchmarks de CPI por storefront e o gate de dinheiro (\u00e9 o Jo\u00e3o quem autoriza gasto).\n- **In-App Events s\u00e3o indexados na busca** (card pesquis\u00e1vel pelo nome do evento), exigem deep link e s\u00f3 t\u00eam efeito enquanto o evento est\u00e1 ao vivo (achado 17). Entrou no \u00a75.\n- **Cross-storefront confirmado com tabela** (achado 13): o keyword field de pt-BR, es-MX, fr, ru, zh-Hans/Hant, ar, ko e vi indexa nos EUA; en-GB \u00e9 o 2\u00ba \u00edndice de BR/MX/ES/DE/FR/KR/PT/AR. Tabela em \u00a710.\n- **Ratings: nota \u00e9 por territ\u00f3rio; resumo por LLM s\u00f3 em US/UK/CA/AU/IN/IE/NZ/SG/ZA (BR/ES/MX fora); 4,0 \u00e9 penhasco de convers\u00e3o; responder review move +0,3-0,5\u2605 em 3 meses** (achados 9, 11, 12). \u00a711 novo; o rating-first ganha o storefront-alvo como unidade.\n- **Header (Creative Asset) no iOS 27** (achado 8, Apple Newsroom/WWDC26): no outono/2026 a busca mostra 1 imagem/v\u00eddeo no lugar dos 3 prints para quem subir header; PPO passa a testar o header. Registrado em \u00a75; a execu\u00e7\u00e3o vive em `/code-driven-prints`.\n- **2\u00ba slot de an\u00fancio dentro dos resultados de busca desde 03/03/2026** (achado 3): org\u00e2nico desce uma posi\u00e7\u00e3o; #1-2 vale ainda mais, #3+ ainda menos. \u00a74.\n- **F\u00f3rmula do \u00a71**: Apple nomeia \"downloads, ratings and reviews, and more\" (achado 1). Reten\u00e7\u00e3o como fator de ranking \u00e9 infer\u00eancia de vendor \u2014 o playbook passa a dizer isso em vez de afirmar.\n- **Nome de IAP promovida indexado**: \u00fanico teste \u00e9 de 2019 (achado 19) \u2014 vai para \"Incerto\" (\u00a712), n\u00e3o vira regra.\n\n---\n\n## 1. O modelo mental: dois motores multiplicativos\n\n```\nranking \u2248 relevance \u00d7 velocity \u00d7 conversion \u00d7 (retention?)\n```\n\n- **Motor 1 \u2014 Relev\u00e2ncia de metadata**: te coloca na disputa. **4 campos indexados no iOS: Name (peso m\u00e1ximo) > Subtitle > Keywords field > categoria prim\u00e1ria** (achado 1, Apple oficial). Description N\u00c3O \u00e9 indexada \u2014 mas alimenta as **Tags** geradas por LLM (achado 7; anunciadas na WWDC25, sem confirma\u00e7\u00e3o de lan\u00e7amento p\u00fablico at\u00e9 set/2026) e o resumo que a IA faz do app: escrever a description com as features nomeadas nos primeiros par\u00e1grafos custa nada e serve \u00e0 IA, n\u00e3o ao \u00edndice. **Custom Product Pages rankeiam organicamente pelas keywords atribu\u00eddas** (desde jul/2025, achado 4) \u2014 ver \u00a79. **Captions de screenshot: N\u00c3O h\u00e1 evid\u00eancia de indexa\u00e7\u00e3o** (achado 6: 64 frases testadas, 36 n\u00e3o rankearam, 27 j\u00e1 estavam nos campos, 1 anomalia); n\u00e3o contar com elas como cobertura de \u00edndice.\n- **Motor 2 \u2014 Sinais comportamentais**: decide se voc\u00ea FICA. A Apple nomeia **downloads, ratings e reviews, \"and more\"** (achado 1). A ordem abaixo \u00e9 heur\u00edstica do lab (vendors), n\u00e3o confirma\u00e7\u00e3o da Apple:\n  1. **Install velocity relativa ao baseline da categoria** (n\u00e3o absoluta \u2014 app pequeno numa categoria pequena compete de igual)\n  2. **Conversion rate impression\u2192install** (+3-5% de CR j\u00e1 move ranking de forma material)\n  3. **Ratings** (nota + contagem + velocidade de reviews novas) \u2014 o \u00fanico sinal comportamental que a Apple NOMEIA\n  4. **Retention/engagement** (D7 > 15% = healthy band) \u2014 **n\u00e3o confirmado como fator direto**; o que \u00e9 fato: redownloads s\u00e3o 2,2\u00d7 os downloads (achado 2) e as Personalized Collections usam uso p\u00f3s-install para recomendar (achado 23). O p\u00f3s-install alimenta a descoberta FORA da busca mesmo que n\u00e3o pese no ranking.\n\n**Consequ\u00eancia pro app pequeno:** um app com ratings s\u00f3lidos e convers\u00e3o acima da categoria SUPERA um app maior com metadata melhor e sinais piores. O caminho do pequeno n\u00e3o \u00e9 brigar por head term \u2014 \u00e9 ser o melhor sinal comportamental num nicho estreito. E busca \u00e9 ~65% dos downloads (achado 2): \u00e9 o canal, n\u00e3o um canal.\n\n## 2. Boost de lan\u00e7amento e re-indexa\u00e7\u00e3o (o que o \"seven-day cliff\" \u00e9 \u2014 e o que n\u00e3o \u00e9)\n\n- Apps novos ganham **boost de ranking nos primeiros ~7 dias** e depois caem \u2014 \u00e9 isso que o artigo da Sensor Tower (2014, **2 apps**) chamou de \"Seven Day Cliff\" (achado 18). \u00c9 **observa\u00e7\u00e3o de LAN\u00c7AMENTO**, n\u00e3o uma penalidade que se repete a cada troca de metadata. Visibilidade residual por ~30-60 dias \u00e9 relato de vendor.\n- **Re-indexa\u00e7\u00e3o de metadata** (troca de name/subtitle/keywords numa vers\u00e3o j\u00e1 publicada): 3-7 dias t\u00edpico, 48 h em app de tr\u00e1fego alto, 10-14 dias em app novo com pouca velocity (achado 18 \u2014 SEM Nexus, observa\u00e7\u00e3o de clientes, sem dado p\u00fablico). Trocar metadata n\u00e3o \"reseta\" nada al\u00e9m do prazo de re-index; o que custa \u00e9 medir antes de a nova indexa\u00e7\u00e3o assentar.\n- **Sazonal**: metadata no ar 2-3 semanas antes do pico (achado 18, AppTweak).\n- A metadata do **day one** \u00e9 indexada imediatamente \u2014 trocar Name/Subtitle cedo joga fora o boost inicial que estava rankeando aquele conjunto. **Name/Subtitle ficam est\u00e1veis no primeiro m\u00eas** (isso continua valendo, pelo boost, n\u00e3o por \"cliff\").\n- **Estrat\u00e9gia do segundo set**: preparar ANTES do launch um segundo conjunto para o keywords field com o **menor difficulty poss\u00edvel**, para trocar depois que o boost passa (~day 7-14). Durante o boost voc\u00ea rankeia acima do teto natural; depois dele, s\u00f3 diff baixo segura posi\u00e7\u00e3o.\n- **Primeiras 72h** = janela cr\u00edtica de sinais. Tudo que gera install/review nos dias 1-3 vale dobrado.\n\n## 3. Checklist de launch do app pequeno (ordem importa)\n\n1. **Lan\u00e7ar seg-qua** (weekday > weekend pros sinais iniciais \u2014 heur\u00edstica de vendor).\n2. **Metadata day-one completa** \u2014 name/subtitle/keywords nos 30/30/100 chars, categoria prim\u00e1ria certa (\u00e9 \u00edndice, achado 1), en-GB preenchido (\u00a710), description com features nomeadas cedo (para as Tags por LLM). Headlines dos prints com o termo-alvo **por convers\u00e3o**, n\u00e3o por \u00edndice (achado 6).\n3. **15-20 reviews org\u00e2nicas nas primeiras 4 semanas** (rede pessoal, comunidades do nicho) \u2014 priorizar as primeiras 5 nas 72h, **na storefront-alvo** (a nota \u00e9 por territ\u00f3rio, achado 9). Ratings cedo = requisito, n\u00e3o vaidade: 4,0 \u00e9 o penhasco de convers\u00e3o (achado 12).\n4. **Apple Ads como FASE 0 (opcional, gasto = decis\u00e3o do Jo\u00e3o)** \u2014 14 dias de **Search Match** (a Apple casa queries pela metadata + apps do g\u00eanero + dados de busca) a US$5-10/dia. O que ela devolve com certeza \u00e9 o **dado**: as queries reais que geram tap/install e a convers\u00e3o por termo (achado 16) \u2014 a 2\u00aa fonte de volume que o \u00a74 exige. Benchmarks 2025 (achado 15): CPI mediano US$1,80; **US US$4,06 \u00b7 BR US$1,05 \u00b7 MX US$1,10 \u00b7 ES US$1,43**; CPT mediano US$0,92; TTR 7,4%. Conta nova tem US$100 de cr\u00e9dito (cobre a 1\u00aa rodada). **Uplift org\u00e2nico direto N\u00c3O est\u00e1 provado** (achado 16: o artigo da AppTweak admite n\u00e3o ter medi\u00e7\u00e3o) \u2014 o retorno \u00e9 informa\u00e7\u00e3o e, em BR/MX, installs a ~US$1. Bid nos termos onde j\u00e1 rankeia \u00e9 racioc\u00ednio de velocity/convers\u00e3o, n\u00e3o linha do algoritmo.\n5. **Day 7-14: trocar o keywords field** pro segundo set low-diff (manter name/subtitle) \u2014 a leitura da 1\u00aa rodada s\u00f3 vale depois da re-indexa\u00e7\u00e3o (3-7 d).\n6. **Iterar metadata a cada 2-4 semanas** dali em diante \u2014 nunca ler antes de D7 de cada mudan\u00e7a (pr\u00e9-D7 \u00e9 ru\u00eddo de re-index, n\u00e3o \"cliff\").\n\n## 4. Sele\u00e7\u00e3o de keyword pro cold-start (regras duras)\n\n- **A r\u00e9gua de popularidade est\u00e1 quebrada desde out/2025** (achado 14): o Apple Ads passou a classificar em vez de contar, keywords com pop >5 nos EUA ca\u00edram 77% em 4 dias, e cada tool (Astro backup de out/2025 + rank report da Apple, AppTweak estimativa pr\u00f3pria desde ago/2026, Appfigures \"m\u00e9todo alternativo\") mostra um n\u00famero diferente para a mesma keyword. **Consequ\u00eancias como regra:**\n  - **Pop=5 \u00e9 \"desconhecido\"**, n\u00e3o piso nem prova de volume zero \u2014 nem descartar, nem promover. Entra no keywords field (1\u00d7) como palavra \u00fanica barata se a inten\u00e7\u00e3o bater; **nunca ganha char de name/subtitle s\u00f3 por pop de uma tool**.\n  - **2\u00aa fonte de volume obrigat\u00f3ria antes de gastar name/subtitle num termo**: (a) relat\u00f3rio de search terms do Apple Ads (queries reais com impress\u00f5es/taps/installs \u2014 `scripts/apple-ads/pull_search_terms.py`, exige campanha rodando \u2014 \u00a73 item 4), ou (b) report \"App Store Search Terms\" do App Analytics (impress\u00f5es reais por query do NOSSO app \u2014 o extractor j\u00e1 puxa), ou (c) o \"Monthly Search Term Rank Report\" da Apple (rank mensal por termo, o que a Astro incorporou). Termo com pop s\u00f3 da Astro recebe a flag **`pop n\u00e3o confi\u00e1vel`** na pesquisa e no `meta.json` (`volume_source` por aposta).\n  - **Compara\u00e7\u00e3o entre tools e com hist\u00f3rico pr\u00e9-out/2025 n\u00e3o vale.** Um \"pop 38 em jul/2025\" e um \"pop 12 hoje\" n\u00e3o medem a mesma coisa.\n- **Sweet spot (com a ressalva acima)**: pop 6-30 + diff \u2264 15 \u2192 vi\u00e1vel TOP 4 sem base de downloads. Concentrar em **4-5 termos ganh\u00e1veis**, n\u00e3o dispersar em 20.\n- **O penhasco da SERP muda o alvo**: TTR m\u00e9dio por posi\u00e7\u00e3o = #1 28,4% / #2 6,2% / #3 2,7% (store-page playbook \u00a70). **#1-2 \u00e9 o pr\u00eamio real; #3-4 vale uma fra\u00e7\u00e3o; >10 quase nada.** E desde 03/03/2026 h\u00e1 um **2\u00ba an\u00fancio dentro dos resultados** (achado 3): o org\u00e2nico desce uma posi\u00e7\u00e3o \u2014 #1-2 vale ainda mais, #3+ ainda menos. Consolidar #1 num termo que j\u00e1 est\u00e1 #3 > abrir frente em termo novo.\n- **Inten\u00e7\u00e3o > volume**: keyword desalinhada = install\u2192uninstall\u2192rating ruim\u2192ranking despenca. Teste mental: \"quem busca isso espera achar NOSSO tipo de app?\"\n- **Armadilha do diff baixo**: palavra poliss\u00eamica tem diff baixo porque o nicho n\u00e3o disputa ela (ex: `contador` pt-BR). Diff baixo sem inten\u00e7\u00e3o alinhada = valor zero como alvo solo; no m\u00e1ximo feeder de composi\u00e7\u00e3o.\n- **Apple comp\u00f5e combina\u00e7\u00f5es** entre name/subtitle/keywords \u2014 keywords field s\u00f3 palavras \u00fanicas, sem duplicar campos, lowercase, sem espa\u00e7os, ~95-100 chars. **Guia oficial e 2.3.7** (achado 20): sem plurais, sem \"app\"/\"game\", sem filler, sem nome de concorrente, sem pre\u00e7o; \"Apple may modify inappropriate keywords at any time\".\n- **Front-loading**: primeiras 2-3 posi\u00e7\u00f5es do keywords field pesam mais \u2014 ordenar por valor esperado descendente.\n- **Conjunto \u00fanico por CPP** (achado 4): uma keyword do field pode ficar ligada a UMA p\u00e1gina; ao compor o field, j\u00e1 marcar quais tokens v\u00e3o para qual CPP (\u00a79).\n\n## 5. Convers\u00e3o \u00e9 metade do ranking (n\u00e3o um detalhe)\n\nPro algoritmo, CR de busca \u00e9 input direto. Pro app pequeno \u00e9 O multiplicador acess\u00edvel (n\u00e3o d\u00e1 pra comprar velocity, d\u00e1 pra dobrar CR):\n\n- **3 primeiros screenshots decidem** \u2014 aparecem na lista de resultados antes do tap (padr\u00e3o da casa: `/code-driven-prints`, killer feature no print 1). **A partir do iOS 27 (outono/2026)** quem subir o **Header** (Creative Asset \u2014 1 imagem/v\u00eddeo) ganha o slot inteiro dos resultados no lugar dos 3 prints; quem n\u00e3o subir continua com prints (achado 8, Apple oficial). Asset Library aprova sem build; PPO passa a testar o header. Propor\u00e7\u00e3o do header a confirmar quando a ASC abrir o upload.\n- **Captions de screenshot N\u00c3O s\u00e3o cobertura de \u00edndice** (achado 6) \u2014 termo-alvo na headline serve para o usu\u00e1rio reconhecer que achou o que buscou (convers\u00e3o), s\u00f3 isso.\n- **CPP por inten\u00e7\u00e3o** (\u00a79): o print certo pra query certa \u2014 evid\u00eancia de lift \u00e9 correlacional (+5,9% CVR nos top-1000 com CPP, achado 5); esperar 3-6%, n\u00e3o milagre.\n- **\u00cdcone coerente com o nicho** (paleta por nicho de RULES.md existe por isso).\n- **Subtitle \u00e9 copy al\u00e9m de \u00edndice** \u2014 precisa vender o wedge, n\u00e3o s\u00f3 empilhar keywords.\n- **Nota**: 95% dos apps featured t\u00eam \u22654,0 e 65% \u22654,6 (achado 12, AppTweak); cair de 4,0 pra 3,9 custa 15-20% de convers\u00e3o (curva de vendor, sem metodologia). Detalhe em \u00a711.\n- **In-App Events** (achado 17): aparecem na busca como card pesquis\u00e1vel pelo nome do evento, na product page e nas abas Today/Apps; m\u00e1x. 15 aprovados/10 publicados, at\u00e9 31 dias, **deep link obrigat\u00f3rio**, Apple recusa evento repetitivo ou s\u00f3 de pre\u00e7o; o \u00fanico estudo (Phiture, 2021, n=1) viu +~50% de impress\u00f5es **s\u00f3 enquanto o evento est\u00e1 ao vivo**. S\u00f3 onde h\u00e1 evento real (feriado, Major Update); expectativa modesta.\n- PPO/A-B cont\u00ednuo depois que houver volume (skills `/generate-a-b-test*`) \u2014 65% dos top apps n\u00e3o testam prints (achado 22); o lab j\u00e1 roda mais teste que a m\u00e9dia.\n\n## 6. O que N\u00c3O funciona (n\u00e3o gastar itera\u00e7\u00e3o nisso)\n\n- Brigar por head terms saturados (diff>60, incumbentes 100k+ reviews) sem wedge \u2014 mesmo no name.\n- Trocar metadata toda semana \u2014 cada troca abre um prazo de re-index de 3-7 dias (achado 18); an\u00e1lise antes de D7 \u00e9 ru\u00eddo, e duas trocas no mesmo prazo tornam o resultado ileg\u00edvel. N\u00e3o \u00e9 \"reset\" \u2014 \u00e9 medi\u00e7\u00e3o imposs\u00edvel.\n- Encher keywords field de long-tails compostos (Apple j\u00e1 comp\u00f5e).\n- Keyword stuffing no name \u2014 name \u00e9 o sinal mais forte, mas CR cai se o nome parecer spam; padr\u00e3o: `Marca: fun\u00e7\u00e3o + fun\u00e7\u00e3o` leg\u00edvel. E 2.3.7 (achado 20): nome de concorrente, pre\u00e7o ou termo irrelevante no name/subtitle \u00e9 rejei\u00e7\u00e3o.\n- Contar com caption de print, description ou promo text como \u00edndice \u2014 nenhum dos tr\u00eas entra na relev\u00e2ncia textual (achados 1 e 6).\n- Otimizar visibilidade com produto que n\u00e3o ret\u00e9m \u2014 velocity sem reten\u00e7\u00e3o = pico e queda. (Reten\u00e7\u00e3o como fator direto n\u00e3o est\u00e1 confirmada, mas redownload e Collections dependem do p\u00f3s-install \u2014 achados 2 e 23.)\n- Esperar que Apple Ads \"compre\" ranking direto \u2014 ningu\u00e9m mediu esse efeito (achado 16); o retorno certo \u00e9 o dado de convers\u00e3o por termo.\n- Decidir por pop de uma tool s\u00f3, ou comparar pop de hoje com pop de antes de out/2025 (achado 14).\n\n## 7. R\u00e9gua de expectativa pro app pequeno (calibrar frustra\u00e7\u00e3o)\n\n- Resultado ASO composto \u00e9 de **meses, n\u00e3o dias**: caso documentado t\u00edpico \u2014 6 meses de itera\u00e7\u00e3o pra sair de zero \u2192 top 5 em 12 keywords \u2192 400+ dl/dia org\u00e2nico. As primeiras 2-3 itera\u00e7\u00f5es costumam mover RANKING (termo entra top 50-100) antes de mover DOWNLOADS. N\u00e3o confundir \"iter-01 n\u00e3o dobrou downloads\" com \"ASO n\u00e3o funciona\".\n- Boost por peso de campo (heur\u00edstica do lab): kw field 1\u00d7 \u2248 10-30% de melhora de rank; subtitle 3\u00d7 \u2248 30-50%; name 7\u00d7 \u2248 70%+.\n- Rollback s\u00f3 com queda \u226530% sustentada por 7 dias \u2014 flutua\u00e7\u00e3o di\u00e1ria \u00e9 ru\u00eddo; queda nos primeiros 3-7 dias pode ser s\u00f3 a re-indexa\u00e7\u00e3o em curso (achado 18).\n- **O teto do app pequeno em 2026 \u00e9 monetiza\u00e7\u00e3o, n\u00e3o visibilidade** (achado 21, RevenueCat): hard paywall rende US$3,09/install em D60 contra US$0,38 freemium; trial de 17-32 d converte 42,5% vs 25,5% em <4 d. Isso \u00e9 decis\u00e3o de produto do Jo\u00e3o (RULES: apps gr\u00e1tis na v1), n\u00e3o do pipeline \u2014 mas o checkpoint de receita tem que saber que busca sozinha n\u00e3o entrega receita.\n\n### Medi\u00e7\u00e3o (aso_efficacy 27/09/2026 \u2014 o que separa \"ganhou\" de \"parece que ganhou\")\n\nA auditoria de 27/09 re-mediu as 16 itera\u00e7\u00f5es de texto publicadas desde maio: **1 ganhou de forma verific\u00e1vel** (BLW ago/26: pa\u00eds-alvo 1,47 \u2192 5,30/d em 10 dias, impress\u00f5es +56%, ~35 composi\u00e7\u00f5es novas no top 30), 2 provavelmente ajudaram mas sa\u00edram grudadas numa feature/print, 7 n\u00e3o mudaram, 2 pioraram no alvo, 4 n\u00e3o d\u00e3o pra saber. Os tr\u00eas \"+75% POSITIVE\" gravados \u00e0 m\u00e3o ca\u00edram quando a janela virou 30 dias corridos e o pa\u00eds-alvo foi isolado. O que o pipeline comprovadamente entrega \u00e9 RANKING (Walk, BLW, Hair: termos apostados sobem como previsto); o que ele n\u00e3o entrega na maioria dos apps \u00e9 INSTALA\u00c7\u00c3O \u2014 termo pop-5 rankeado em #3 rende zero, e a Apple confirma nas impress\u00f5es flat. R\u00e9gua de medi\u00e7\u00e3o, executada por `pipeline-template/scripts/pull_analytics.py` (README do template, se\u00e7\u00e3o Medi\u00e7\u00e3o):\n\n1. **D0 = dia LIVE** (vers\u00e3o portadora READY_FOR_SALE), n\u00e3o o dia do PATCH \u2014 o texto viaja na vers\u00e3o e a diferen\u00e7a foi de 5-14 dias em 4 itera\u00e7\u00f5es. Nesse dia nasce `metrics/d00_baseline.json` (30d de instala\u00e7\u00f5es 1* por pa\u00eds, r15 por territ\u00f3rio, snapshot Astro). O request ONGOING de App Analytics tem que existir ANTES da itera\u00e7\u00e3o (backfill de 1 semana s\u00f3).\n2. **Tr\u00eas n\u00fameros, sempre:** delta no pa\u00eds-alvo (storefronts cujo campo mudou), delta nos outros pa\u00edses do app, mediana de \u22653 apps-controle na mesma janela (sem release/PPO/texto). \"Ganhou\" = IC 95% do alvo exclui 1,0 E RR acima do controle. Ganho s\u00f3 fora do alvo = \"n\u00e3o \u00e9 do texto\". Instala\u00e7\u00e3o = Product Type 1* apenas (LEARNINGS #53).\n3. **Quarentena de 14 dias** antes e depois do live: sem PPO iniciado/parado, sem release de feature. Build que carrega texto \u00e9 s\u00f3 texto (Peptide 1.1.2 fez certo; Hair 1.1.0 com 39 idiomas + assinaturas e iPhotos 1.9.0 com panorama n\u00e3o s\u00e3o mensur\u00e1veis).\n4. **Piso de tr\u00e1fego:** \u2265 100 instala\u00e7\u00f5es 1*/30d no pa\u00eds-alvo, sen\u00e3o o IC vai de \"caiu pela metade\" a \"dobrou\" e a alavanca \u00e9 ratings/prints/produto \u2014 a itera\u00e7\u00e3o n\u00e3o abre. 9 das 16 estariam bloqueadas, e s\u00e3o as 9 sem resposta.\n5. **Fechar com o n\u00famero do script** (`results.final` = alvo antes/depois, RR, IC, mediana do controle, n_alvo), janelas de 30 dias corridos, nunca retroativo com janela \u00e0 m\u00e3o; `deployed` s\u00f3 com a vers\u00e3o portadora READY_FOR_SALE (Sueca iter-02 e Truco iter-02 estavam \"deployed\" com a vers\u00e3o rejeitada).\n\nR\u00e9gua de leitura: ranking subiu e impress\u00e3o n\u00e3o = o termo n\u00e3o tem volume (trocar de alvo, n\u00e3o de campo); impress\u00e3o subiu e instala\u00e7\u00e3o n\u00e3o = p\u00e1gina n\u00e3o converte (prints/ratings, \u00a75); instala\u00e7\u00e3o subiu s\u00f3 fora do alvo = outra coisa mudou (release, idiomas novos, sazonalidade). Relat\u00f3rio completo: `_GambitStudio/reports/2026-09-27_results-audit/aso_efficacy.md`.\n\n## 8. Mapa de aplica\u00e7\u00e3o por fase\n\n| Fase | Skill | O que este playbook muda l\u00e1 |\n|------|-------|------------------------------|\n| Ideia/nicho | `/research-aso-keywords` | Viability Gate + sweet spots com 2\u00aa fonte de volume + wedge (\u00a71, \u00a74) |\n| Pr\u00e9-launch | `/create-ios-app` Phase 2 (aso-copywriter) | metadata day-one (4 campos + en-GB + description para as Tags) + segundo set preparado (\u00a72, \u00a73, \u00a710) |\n| Launch | coordenador | checklist \u00a73 (dia da semana, reviews 72h na storefront-alvo, Apple Ads fase 0 se autorizado) |\n| P\u00f3s-launch | `/start-aso-pipeline` | Apple Ads/search terms como 2\u00aa fonte, troca p\u00f3s-boost, cad\u00eancia D7/14/21/28, CPP por inten\u00e7\u00e3o (\u00a73, \u00a74, \u00a77, \u00a79) |\n| CVR | `/code-driven-prints`, `/generate-a-b-test*` | 3 primeiros prints (header no iOS 27), CPP com o print certo pra query certa (\u00a75, \u00a79) |\n| Ratings | `review-responder`, `ReviewService` | por storefront-alvo, resposta em toda review, piso 4,0 (\u00a711) |\n\n## 9. Custom Product Pages por keyword \u2014 procedimento\n\n**O que \u00e9** (achado 4, Apple oficial): uma CPP ligada a keywords \u00e9 mostrada **no lugar da p\u00e1gina padr\u00e3o nos resultados de busca org\u00e2nica** para as queries atribu\u00eddas \u2014 desde 30/07/2025, at\u00e9 70 p\u00e1ginas por app. Regras da Apple: as keywords dispon\u00edveis v\u00eam **s\u00f3 do keyword field da \u00faltima vers\u00e3o aprovada** (name/subtitle n\u00e3o contam); a sele\u00e7\u00e3o \u00e9 **por idioma**; **atribuir keyword n\u00e3o passa por review** (a p\u00e1gina em si precisa estar aprovada e vis\u00edvel); cada keyword fica em UMA p\u00e1gina (conjuntos \u00fanicos); deep link opcional (iOS 18+); o App Analytics reporta \"search traffic per custom product page\". 61% dos top-1000 apps ainda n\u00e3o usam (achado 5).\n\n**Quando usar**\n- App LIVE com **\u22652 inten\u00e7\u00f5es de busca** distintas \u2014 clusters do `aso-serp-analyst` (DOMINATE/CLIMB) cujo intent difere do que os 3 primeiros prints da p\u00e1gina padr\u00e3o vendem (ex.: achado por \"X tracker\", prints vendem \"Y\"). Se toda inten\u00e7\u00e3o casa com a default page, n\u00e3o h\u00e1 CPP a fazer.\n- Tr\u00e1fego de busca mensur\u00e1vel (refer\u00eancia: \u22651.000 impress\u00f5es de busca/m\u00eas na storefront-alvo) \u2014 abaixo disso o CVR por p\u00e1gina n\u00e3o sai do piso de privacidade do App Analytics e o teste n\u00e3o fecha.\n- N\u00e3o \u00e9 bloqueada pelo rating-first (n\u00e3o \u00e9 itera\u00e7\u00e3o agressiva de keyword: a p\u00e1gina padr\u00e3o continua a mesma), mas prova social ausente limita qualquer CVR \u2014 o prompt nativo vem antes.\n\n**Quantas e o que cada uma mostra**\n- 1 p\u00e1gina por inten\u00e7\u00e3o; **m\u00e1ximo 3 na primeira rodada** por app (o limite da Apple \u00e9 70, o limite do lab \u00e9 o que d\u00e1 pra medir).\n- Cada p\u00e1gina: os **3 primeiros prints** (o slot que aparece nos resultados) mostram a feature que responde \u00e0quela inten\u00e7\u00e3o, no look da casa (`/code-driven-prints`, mesmo mockup/headline verb-split), print 1 = a feature buscada; prints 4-5 podem repetir a default page; promo text da p\u00e1gina pode nomear a inten\u00e7\u00e3o; deep link s\u00f3 se a feature tem rota pr\u00f3pria.\n- Keyword set \u00fanico por p\u00e1gina (achado 4): os termos do cluster que J\u00c1 est\u00e3o no keywords field daquele locale. Termo que n\u00e3o est\u00e1 no field precisa entrar no field numa vers\u00e3o aprovada ANTES de poder ser ligado \u2014 por isso o `aso-field-composer` j\u00e1 marca o destino (`cpp: <nome>`) de cada token ao compor.\n\n**Como ligar as keywords \u2014 o que a ASC API exp\u00f5e (verificado read-only em 2026-09-27, 10 GETs, num app do portf\u00f3lio com 1 CPP existente)**\n1. `GET /v1/apps/{appId}/appCustomProductPages` \u2192 p\u00e1ginas (`name`, `url` com `?ppid=`, `visible`); relationship `appCustomProductPageVersions`.\n2. `GET /v1/appCustomProductPages/{pageId}/appCustomProductPageVersions` \u2192 `version`, `state` (APPROVED\u2026), `deepLink`; relationship `appCustomProductPageLocalizations`.\n3. `GET /v1/appCustomProductPageVersions/{versionId}/appCustomProductPageLocalizations` \u2192 por locale: `locale`, `promotionalText`; relationships `appScreenshotSets`, `appPreviewSets` e **`searchKeywords`**.\n4. `GET /v1/appCustomProductPageLocalizations/{locId}/searchKeywords` \u2192 as keywords ligadas \u00e0quele locale da p\u00e1gina. Na sondagem veio **vazio**: a p\u00e1gina existia h\u00e1 meses sem nenhuma keyword ligada \u2014 CPP criada para link de campanha n\u00e3o rankeia sozinha na busca.\n5. Os ids de keyword v\u00eam de `GET /v1/apps/{appId}/searchKeywords?filter[locale]=<locale>&filter[platform]=IOS` \u2014 o endpoint existe e **exige os dois filtros** (400 `Filter 'locale' is required` / `Filter 'platform' is required` sem eles). \u00c9 a materializa\u00e7\u00e3o do keyword field da vers\u00e3o aprovada, por locale.\n6. Ligar = `POST /v1/appCustomProductPageLocalizations/{locId}/relationships/searchKeywords` com `{\"data\":[{\"type\":\"searchKeywords\",\"id\":\"<id>\"}, \u2026]}` (DELETE no mesmo path desliga). **Forma JSON:API padr\u00e3o, N\u00c3O exercida nesta verifica\u00e7\u00e3o (sem write)** \u2014 no primeiro uso real: ligar, `GET` de read-back (passo 4), e conferir na ASC web. Se o POST responder 403/405, o v\u00ednculo \u00e9 web-only e o caminho \u00e9: ASC \u2192 app \u2192 **Custom Product Pages** \u2192 p\u00e1gina \u2192 vers\u00e3o \u2192 localiza\u00e7\u00e3o \u2192 se\u00e7\u00e3o de keywords (a mesma lista do keyword field).\n- Criar a p\u00e1gina do zero tamb\u00e9m \u00e9 API (`POST /v1/appCustomProductPages` \u2192 version \u2192 localizations \u2192 screenshot sets com o protocolo reserve/PUT/commit dos prints) \u2014 a p\u00e1gina nova vai a review junto com a pr\u00f3xima submiss\u00e3o; s\u00f3 o v\u00ednculo de keyword \u00e9 que n\u00e3o passa por review.\n\n**Como medir**\n- App Analytics \u2192 Custom Product Pages: impress\u00f5es, page views, CVR e \"search traffic per CPP\" por p\u00e1gina; via API, o report **App Store Discovery and Engagement** (`analyticsReportRequests`, ONGOING) traz `Page Type = Custom Product Page` e `Page Title = <nome da p\u00e1gina>` \u2014 o `aso-checkpoint` l\u00ea isso quando a itera\u00e7\u00e3o tiver CPP.\n- Compara\u00e7\u00e3o certa: CVR da CPP vs CVR da p\u00e1gina padr\u00e3o **na mesma keyword/cluster**, sequencial (antes/depois da liga\u00e7\u00e3o), 14 dias de cada lado. Expectativa honesta: +3-6% de CVR no cluster (achado 5: +5,9% correlacional no painel AppTweak; o \"156%\" da Apple \u00e9 de referral/ads). Nenhum estudo isola lift org\u00e2nico \u2014 a 1\u00aa CPP do lab \u00e9 o experimento.\n- Bookkeeping: cada CPP entra no `meta.json` da itera\u00e7\u00e3o (`cpp: [{name, locale, keywords, page_id, linked_at}]`) e na pasta `ppo-pipeline/` do app (prints s\u00e3o asset-base como qualquer experimento).\n\n## 10. Cross-storefront \u2014 qual locale indexa onde\n\nTeste com keywords falsas (AppTweak/Phiture, atualizado 2025-11-21, achado 13). Cada storefront l\u00ea o campo do locale prim\u00e1rio **mais** os secund\u00e1rios:\n\n| Storefront | Locales indexados |\n|---|---|\n| **US** | en-US + **es-MX, pt-BR, fr, ru, zh-Hans, zh-Hant, ar, ko, vi** |\n| **BR** | pt-BR + en-GB |\n| **MX** | es-MX + en-GB |\n| **ES** | es-ES + en-GB + ca |\n| UK | en-GB + en-AU |\n| CA | en-CA + fr-CA |\n| AU | en-AU + en-GB |\n| DE | de + en-GB |\n| FR | fr + en-GB |\n| JP | ja + en-US |\n| KR | ko + en-GB |\n| PT | pt-PT + en-GB |\n| AR | es-MX + en-GB |\n\nRegras que saem daqui:\n- **en-GB preenchido em todo app** \u2014 \u00e9 o 2\u00ba \u00edndice de 8 storefronts que importam para o lab. N\u00e3o \u00e9 c\u00f3pia do en-US: \u00e9 or\u00e7amento extra (tokens diferentes, sem dup contra o en-US quando o storefront l\u00ea os dois \u2014 UK e AU).\n- **Os secund\u00e1rios dos EUA s\u00e3o or\u00e7amento americano**: o keyword field de pt-BR/es-MX/fr/ru/zh/ar/ko/vi conta na loja US \u2014 termos com inten\u00e7\u00e3o americana que n\u00e3o couberam no en-US podem viver ali sem duplicar.\n- O inverso tamb\u00e9m vale: **es-MX \u00e9 o \u00edndice da loja US e de AR** al\u00e9m do MX \u2014 um app sem es-MX perde tr\u00eas storefronts de uma vez.\n- A ASC passou a 50 locales em 31/03/2026 (+11 l\u00ednguas indianas e esloveno). N\u00e3o vale esfor\u00e7o para o portf\u00f3lio atual.\n\n### 10.1 Locales: base 3 + top-2 por instala\u00e7\u00f5es 90d (Jo\u00e3o 28/09)\n\nToda itera\u00e7\u00e3o de ASO cobre **en-US, es-ES e pt-BR** MAIS os **dois locales da App Store com mais instala\u00e7\u00f5es novas do app nos \u00faltimos 90 dias**. A regra existe porque o crescimento vinha de fora dos 3 locales trabalhados (o fechamento de refer\u00eancia em `_reference/meta.json` diz \"o crescimento veio de fora dos 4 locales (\u00cdndia)\") e o campo desses pa\u00edses nunca era tocado.\n\n- **Medida = Sales Report, Product Type `1*` apenas** (1, 1F, 1T, F1). Update (`7*`) e redownload (`3*`) nunca contam \u2014 LEARNINGS #53. Script: `_GambitStudio/scripts/asc/top_locales.py --app-id <id> --days 90 [--json]`; o `aso-extractor` grava o JSON em `research/locales.json` e a cadeia inteira (miner \u2192 fit \u2192 SERP \u2192 composer \u2192 reporter \u2192 deployer) trabalha nos 5.\n- **Pa\u00eds \u2192 locale que a storefront indexa** (tabela \u00a710), n\u00e3o \"idioma do pa\u00eds\": MX/AR/CO/CL\u2026 somam em **es-MX**, que n\u00e3o \u00e9 es-ES \u2014 por isso es-MX pode ser um top-2 leg\u00edtimo. IN soma em **hi** (a \u00cdndia l\u00ea hi + en-GB; `en-IN` n\u00e3o existe como locale). GB/IE/SG/ZA \u2192 en-GB; AU/NZ \u2192 en-AU; CA \u2192 en-CA (o report n\u00e3o traz idioma; fr-CA fica como nota). DE/AT/CH \u2192 de-DE; FR \u2192 fr-FR; NL \u2192 nl-NL; SA/AE/EG\u2026 \u2192 ar-SA \u2014 os quatro regionais que a API exige (LEARNINGS #57b); o resto \u00e9 c\u00f3digo curto (it, ja, ko, ru, tr, id, pl, sv, th, vi, zh-Hans, zh-Hant\u2026).\n- **Exclus\u00e3o s\u00f3 por locale**: um pa\u00eds sai da disputa apenas se o locale que ele indexa est\u00e1 na base (`--exclude`, default en-US,es-ES,pt-BR). PH indexa en-US \u2192 coberto; MX indexa es-MX \u2192 eleg\u00edvel.\n- **Piso: 30 instala\u00e7\u00f5es no locale na janela.** Abaixo disso o slot sai como `sem tr\u00e1fego suficiente` e fica vazio \u2014 compor campo pra 12 instala\u00e7\u00f5es n\u00e3o mede nada (mesma l\u00f3gica do piso de 100/30d por pa\u00eds do deployer, que continua valendo pro pa\u00eds-alvo da hip\u00f3tese).\n- **Pr\u00e9-launch n\u00e3o tem Sales Report**: o `/research-aso-keywords` prop\u00f5e s\u00f3 os mercados escolhidos \u00e0 m\u00e3o; o top-2 entra na 1\u00aa itera\u00e7\u00e3o p\u00f3s-launch com 90 dias de dado (antes disso o script pode devolver dois slots vazios \u2014 a itera\u00e7\u00e3o roda nos 3 e o meta.json anota).\n- O `meta.json` da itera\u00e7\u00e3o grava `locales.top2_by_installs_90d` com os n\u00fameros (locale, pa\u00edses, instala\u00e7\u00f5es, share, janela) \u2014 o checkpoint l\u00ea dali, sem rerodar.\n\n## 11. Ratings \u2014 por territ\u00f3rio, com resumo por LLM\n\n- **A nota \u00e9 por storefront** e o **resumo de reviews por LLM** existe s\u00f3 em US, UK, CA, AU, IN, IE, NZ, SG e ZA \u2014 BR/ES/MX ainda fora (achado 9, Apple oficial). O rating-first do lab (<25 ratings = ratings antes de ASO agressivo) conta na **storefront-alvo**, n\u00e3o no agregado.\n- **4,0 \u00e9 penhasco**: 95% dos apps featured t\u00eam \u22654,0 e 65% \u22654,6 (achado 12). As curvas \"4,7 converte 15-25% mais\" s\u00e3o de vendor, sem metodologia \u2014 o piso 4,0 \u00e9 o dado.\n- **Responder move a nota j\u00e1 dada** (achado 11, AppFollow, 92,9 M reviews): taxa m\u00e9dia de resposta 24%, Productivity 12%; fechar 10 pp de gap \u2248 +0,3-0,5\u2605; +1,39\u2605 em 3 meses em Health & Sports. A resposta do dev notifica o autor, que pode editar a nota (achado 10). Nos storefronts com resumo por LLM, o texto da resposta entra no material que o resumo l\u00ea \u2014 prioridade do `review-responder`.\n- **Prompt nativo**: at\u00e9 3\u00d7/365 dias, direto no aha, sem pr\u00e9-gate (5.6.1: filtrar quem avalia \u00e9 manipula\u00e7\u00e3o \u2014 achado 10; LEARNINGS #88). Reset de nota na vers\u00e3o nova existe (\"use sparingly\"; reviews antigas ficam).\n- Instala\u00e7\u00f5es sem ratings (centenas de installs e 0-1 rating) n\u00e3o \u00e9 problema de texto: \u00e9 o prompt que n\u00e3o dispara ou o aha mal escolhido \u2014 auditar o `ReviewService` antes de qualquer itera\u00e7\u00e3o.\n\n## 12. Incerto ou controverso (n\u00e3o afirmar como regra)\n\n- **Captions de screenshot**: Appfigures diz que h\u00e1 OCR desde jun/2025; ConsultMyApp (64 frases) e AppTweak dizem que n\u00e3o h\u00e1 evid\u00eancia; Apple nunca confirmou. Sinal marginal, nunca estrat\u00e9gia.\n- **Reten\u00e7\u00e3o como fator de ranking**: vendors afirmam; Apple s\u00f3 diz \"and more\".\n- **Seven-day cliff e prazos de re-indexa\u00e7\u00e3o**: cliff \u00e9 de 2014 em 2 apps de lan\u00e7amento; \"3-7 dias\" \u00e9 experi\u00eancia de ag\u00eancia sem dado p\u00fablico.\n- **Ads \u2192 ranking org\u00e2nico**: nenhuma medi\u00e7\u00e3o; o que existe \u00e9 racioc\u00ednio de velocity/convers\u00e3o e um caso aned\u00f3tico misturando ads com troca de metadata.\n- **Lift de CPP org\u00e2nica**: s\u00f3 correla\u00e7\u00e3o em painel (+5,9% CVR) e n\u00fameros de ads.\n- **Escala de popularidade**: cada tool mostra um n\u00famero diferente desde out/2025; compara\u00e7\u00f5es entre tools e com hist\u00f3rico n\u00e3o valem.\n- **Tags p\u00fablicas**: anunciadas em jun/2025, \"beta\" nas fontes de 2025, sem confirma\u00e7\u00e3o de lan\u00e7amento geral at\u00e9 set/2026.\n- **Nome de IAP promovida indexado**: \u00fanico teste \u00e9 de 2019 (achado 19); a Apple confirma s\u00f3 que IAPs promovidas aparecem na busca. Nomear a IAP com um termo do nicho custa nada \u2014 mas n\u00e3o conta como cobertura.\n- **Curvas de convers\u00e3o por nota** (\"4,7\u2605 converte 15-25% mais\"): vendor sem metodologia; o dado \u00e9 o piso 4,0 e o efeito de responder.\n\n---\n\n## Fontes\n\n**Varredura 2026-09-27** \u2014 `research-2026-09-aso.md` (mesma pasta): 23 achados com link, data e tag de confian\u00e7a. \u00c9 a fonte de tudo que est\u00e1 marcado com \"achado N\" acima.\n\n**Varredura 2026-08-07** (mantidas pelo que ainda vale; o que foi contradito est\u00e1 marcado no corpo):\n- [ASO World \u2014 App Store Search Algorithm: what decides keyword ranking](https://asoworld.com/insight/app-store-search-algorithm-2026-what-actually-decides-your-keyword-ranking/) \u2014 velocity relativa \u00e0 categoria, CR como 2\u00ba sinal\n- [AppFollow \u2014 ASO Ranking Factors](https://appfollow.io/blog/aso-ranking-factors) \u2014 campos indexados, CPP keyword linking (a parte sobre captions foi contradita pelo achado 6)\n- [Sensor Tower \u2014 Why rankings drop seven days after launch](https://sensortower.com/blog/why-app-store-keyword-rankings-drop-dramatically-seven-days-after-launch) \u2014 boost de LAN\u00c7AMENTO (2014, 2 apps) + segundo set low-diff; n\u00e3o trata de troca de metadata\n- [SEM Nexus \u2014 30-Day Metadata Foundation](https://semnexus.com/aso-for-new-app-launches-30-day-metadata-foundation) \u2014 custo de trocar metadata day-one\n- [Apptweak \u2014 How Search Ads boost organic rankings](https://www.apptweak.com/en/aso-blog/how-search-ads-can-boost-your-apps-organic-keyword-rankings) \u2014 mecanismo te\u00f3rico; o pr\u00f3prio artigo admite n\u00e3o ter medi\u00e7\u00e3o (achado 16)\n- [Branch \u2014 Do ASA influence rankings](https://www.branch.io/resources/blog/does-running-apple-search-ads-influence-app-rankings-3-ways-to-optimize/) \u2014 bid em termos j\u00e1 rankeados\n- [SplitMetrics \u2014 App Store Ranking Factors 2025](https://splitmetrics.com/blog/apple-app-store-ranking-factors/) \u2014 p\u00f3s-install quality supera metadata (infer\u00eancia de vendor)\n- [Nextige \u2014 ASO Guide](https://nextige.com/blog/app-store-optimization-aso-guide-2026/) \u2014 title pattern Marca+fun\u00e7\u00e3o, CR +3-5%\n- [AppTweak \u2014 ASO strategy framework](https://www.apptweak.com/en/aso-blog/aso-strategy) \u2014 long-tail first pra cold-start\n";</script><script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script><script>document.getElementById("md").innerHTML=window.marked?marked.parse(RAW):"<pre>"+RAW.replace(/</g,"&lt;")+"</pre>";</script></div><script>(function(){try{var k="lh.scroll:"+location.pathname;var v=sessionStorage.getItem(k);if(v!==null){sessionStorage.removeItem(k);window.scrollTo(0,parseInt(v,10)||0);}document.addEventListener("submit",function(e){var f=e.target;if(f&&f.method&&f.method.toLowerCase()==="post"){sessionStorage.setItem(k,String(window.scrollY));}},true);}catch(e){}})();</script></body></html>
