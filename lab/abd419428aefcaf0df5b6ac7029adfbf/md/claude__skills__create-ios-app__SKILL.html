<style>
:root{--bg:#f4f5f8;--card:#fff;--tx:#0e1015;--mut:#4a5160;--acc:#2b3340;--ok:#0d9668;--down:#c22;--bd:#c9cfda;--hl:#fff7e0}

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.55 -apple-system,system-ui,sans-serif}

  background-repeat:no-repeat;background-position:center;border-radius:0}

.board{margin:18px 0 10px;padding:16px 18px 18px;border-radius:var(--rad);

.iid:hover{color:var(--tx);border-color:var(--mut)}

.rhead{display:grid;grid-template-columns:20px minmax(0,1fr) auto;align-items:center;gap:8px}
.rhead .ico{margin-right:0;width:20px;height:20px}

.rows>.rowwrap>.row,.rows>.row{display:flex;flex-direction:column}
.board .hcol>h2{margin-top:0;border-top:0;padding-top:0}
@media(max-width:620px){.stamp{margin-left:0;flex-basis:100%}}
.wrap{width:min(1680px,94vw);margin:0 auto;padding:24px 0 80px}@media(max-width:860px){.wrap{width:calc(100vw - 28px)}}.ico{width:20px;height:20px;border-radius:5px;vertical-align:-5px;margin-right:7px;background:var(--bd);object-fit:cover}.ico.big{width:30px;height:30px;border-radius:7px;vertical-align:-9px}h2{border-top:1px solid var(--bd);padding-top:20px;margin-top:30px}section,.twrap{min-width:0}h2:first-of-type{border-top:0;padding-top:0}h1+h2,.sub+h2{border-top:0;padding-top:0}
h1{font-size:22px;margin:0 0 4px}h2{font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:34px 0 12px}
.sub{color:var(--mut);margin:0 0 8px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px 16px}
.card b{font-size:14.5px}.card p{margin:5px 0 0;color:var(--mut);font-size:13.5px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px}
.up{background:var(--ok)}.dn{background:var(--down)}
a{color:var(--acc);text-decoration:none}a:hover{text-decoration:underline}
code{background:rgba(125,125,125,.13);padding:1px 6px;border-radius:5px;font-size:12.5px}
.pill{display:inline-block;background:rgba(125,125,125,.12);border-radius:99px;padding:1px 10px;margin:2px 3px 2px 0;font-size:12.5px}
table.t{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--bd);border-radius:12px;overflow:hidden}
table.t td,table.t th{padding:7px 12px;border-bottom:1px solid var(--bd);font-size:13.5px;text-align:left;vertical-align:top}
table.t th{color:var(--mut);font-weight:600}table.t tr:last-child td{border-bottom:0}
.twrap{overflow-x:auto;border-radius:12px}
.imgs{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.imgs img{width:100%;border-radius:8px;border:1px solid var(--bd)}
#md{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:22px 26px}
#md pre{overflow-x:auto;background:rgba(125,125,125,.1);padding:10px;border-radius:8px}
#md table{border-collapse:collapse}#md td,#md th{border:1px solid var(--bd);padding:4px 9px;font-size:13.5px}
#md img{max-width:100%}
.hcol .row{flex-direction:column;align-items:flex-start;gap:4px}.hcol .row b{white-space:normal}.hcol .row span{width:100%}.hcol .row em{display:none}.hcol .row.done b{font-size:12px}.hrow{display:flex;gap:20px;overflow-x:auto;align-items:flex-start;padding:16px 28px 12px;margin:18px 0 26px;background:rgba(125,125,125,.07);border:1px solid var(--bd);border-radius:16px;scroll-padding:0 28px}.hcol{flex:0 0 340px;min-width:340px}.hcol:last-child{margin-right:28px}.hcol h2{margin-top:0}.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:0 20px}.cols2{display:grid;grid-template-columns:1fr 1fr;gap:0 20px;align-items:start}@media(max-width:900px){.cols2{grid-template-columns:1fr}}h3.team{margin:18px 0 8px;font-size:15px;font-weight:600}h3.team .chain{display:block;color:var(--mut);font-weight:400;font-size:12.5px;margin-top:2px}.card .step{display:inline-block;min-width:18px;height:18px;line-height:18px;text-align:center;border-radius:9px;background:var(--bd);color:var(--mut);font-size:11px;font-weight:600;margin-right:6px}.grid4{display:grid;gap:12px;grid-template-columns:repeat(4,1fr)}@media(max-width:1100px){.grid4{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.grid4{grid-template-columns:1fr}}
.rows{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;color:var(--tx);font-size:14.5px}
a.row:hover{border-color:var(--acc);text-decoration:none}
.row span{flex:1;color:var(--mut)}.row em{color:var(--mut);font-style:normal;font-size:18px}
.row.done b{color:var(--mut);font-weight:500;font-size:12.5px}.row.done span b{color:var(--tx)}.row.done span{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;line-height:1.35}
.hdr{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:6px}
.hdr h1{margin:0}.hdr .sub{margin:2px 0 0}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 22px;font-size:14.5px;color:var(--acc)}
.btn:hover{border-color:var(--acc);text-decoration:none}
.tiles{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(152px,1fr));margin:14px 0 6px}
a.tile{display:block;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 14px;color:var(--tx);min-width:128px}
a.tile:hover{border-color:var(--acc);text-decoration:none}
.tile .tl{font-size:12px;color:var(--mut);white-space:nowrap}
.tile .tv{font-size:21px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px;white-space:nowrap}
.tile .ts{font-size:11.5px;color:var(--mut);margin-top:1px;white-space:nowrap}
.tv.up{color:var(--ok);background:none}.tv.dn{color:var(--down);background:none}
.vd{font-size:15px;font-weight:700;margin-right:10px;white-space:nowrap}
.vd.s{color:var(--ok)}.vd.w{color:#c9930a}.vd.k{color:var(--down)}
.shots{display:flex;gap:8px;overflow-x:auto;padding:4px 0}
.shots img{height:210px;border-radius:10px;border:1px solid var(--bd);flex:0 0 auto}
.gallery img{height:460px;max-height:72vh}
.st{display:inline-block;border-radius:99px;padding:1px 10px;font-size:12px;font-weight:600;margin-left:8px;white-space:nowrap;vertical-align:1px}
.st.run{background:rgba(13,150,104,.16);color:var(--ok)}
.st.appr{background:rgba(201,147,10,.16);color:#c9930a}
.st.rev{background:rgba(125,140,170,.14);color:var(--mut)}
.st.draft{background:rgba(139,92,246,.15);color:#8b5cf6}
.st.mut{background:rgba(125,125,125,.16);color:var(--mut)}
.st.crit{background:rgba(200,34,34,.15);color:var(--down)}
.rowwrap{position:relative}
.rowwrap .row{padding-right:38px}
.delf{position:absolute;top:0;right:0;bottom:0;display:flex;align-items:center;margin:0}
.del{background:none;border:none;color:var(--mut);font-size:17px;line-height:1;padding:6px 12px;cursor:pointer;border-radius:8px;opacity:.45}
.rowwrap:hover .del{opacity:1}
.del:hover{color:var(--down);background:rgba(200,34,34,.08)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(430px,1fr));gap:12px;margin-top:12px}
@media(max-width:520px){.fgrid{grid-template-columns:1fr}}
.fcard{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:13px 15px}
.fcard .fh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.fcard .fh b{font-size:14.5px}.fcard .fh span{font-size:12.5px;color:var(--mut);white-space:nowrap}
.fs{display:flex;align-items:center;gap:8px;margin:3px 0;font-size:13px}
.fs .fl{flex:0 0 188px;color:var(--tx)}
.fs .fb{flex:1;height:13px}

.fs .fb i.alt{background:var(--ok)}

.fs.tot .fl,.fs.tot .fn{font-weight:700}

.fmeta{font-size:12.5px;color:var(--mut);margin:-3px 0 9px}
.rrow{margin:0}
.rc{display:grid;grid-template-columns:34px 72px minmax(0,1fr);align-items:baseline;gap:10px;padding:7px 0;border-top:1px solid var(--bd-soft)}
.rc b{display:block;font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.rc .rv{display:block;font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.25}
.rc .rb{display:block;font-size:11px;color:var(--mut)}
.fnds{list-style:none;margin:10px 0 0;padding:0}
.fnds li{position:relative;padding:2px 0 2px 16px;font-size:13px;color:var(--tx)}
.fnds li:before{content:"";position:absolute;left:0;top:9px;width:7px;height:7px;border-radius:50%}
.fnds li:before{background:var(--bd)}.fnds li.crit:before{background:var(--down)}.fnds li.warn:before{background:#c9930a}.fnds li.ok:before{background:var(--ok)}
.nxt .nxl{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
.nxt b{font-size:14px}.nxt p{margin:3px 0 0;font-size:13px;color:var(--mut)}
.fh .st{margin-left:8px}
.dirbox{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:20px 24px;margin:20px 0 8px}
.dirlab{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--mut)}
.dirh{font-size:19px;line-height:1.35;margin:4px 0 12px;text-transform:none;letter-spacing:0;color:var(--tx)}
.dirp{margin:0 0 9px;font-size:14px;line-height:1.6;color:var(--tx)}
.prio{display:flex;gap:13px;padding:11px 0;border-top:1px solid var(--bd)}
.prn{flex:0 0 26px;height:26px;line-height:26px;text-align:center;border-radius:13px;background:var(--acc);color:var(--card);font-weight:700;font-size:13px}
.prc{flex:1;min-width:0}
.prt{font-size:15px;font-weight:600;margin-bottom:3px}
.prw{margin:0 0 5px;font-size:13.5px;color:var(--tx)}
.pre{margin:0 0 4px;font-size:13px;color:var(--mut);line-height:1.55}
.pre b{color:var(--tx);font-weight:600}
.prp{margin:4px 0 0;font-size:13px;color:var(--tx);border-left:2px solid var(--acc);padding-left:9px}
.vgrid{display:flex;flex-direction:column;gap:6px}
.vrow{display:flex;align-items:baseline;gap:9px;font-size:13.5px;flex-wrap:wrap}
.vrow .st{flex:0 0 auto;margin:0}
.vrow b{flex:0 0 auto;min-width:118px}
.vrow span:last-child{flex:1;min-width:220px;color:var(--mut)}
.nots{margin:0;padding-left:18px}
.nots li{font-size:13.5px;color:var(--tx);margin-bottom:5px;line-height:1.55}

@media(max-width:700px){.vrow b{min-width:0}}
.fnote{font-size:11.5px;color:var(--mut);margin:4px 0 0 176px;line-height:1.35}

/* ---------- camada de acabamento (01/10/2026) ----------
   Tipografia com duas vozes (display para títulos e números, texto para leitura),
   neutros com viés do azul da marca em vez de cinza puro, e profundidade por
   sombra em vez de só borda. Nada aqui renomeia classe: é uma camada por cima. */
:root{
  --f-disp:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --f-text:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --bg:#eef1f7; --card:#ffffff; --tx:#0a0d14; --mut:#4b5567; --acc:#2b3340;
  --bd:#cbd3e0; --bd-soft:#dfe5ee; --ok:#07804e; --down:#c42121; --warn:#9a4408;
  --sh:0 1px 2px rgba(16,19,26,.05),0 2px 8px rgba(16,19,26,.04);
  --sh-up:0 2px 6px rgba(16,19,26,.07),0 10px 24px rgba(16,19,26,.07);
  --boardtop:#ffffff; --boardbot:#f3f6fb;
  --bar:#2563eb; --bar2:#60a5fa;
  --rad:14px;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#07090d; --card:#141922; --tx:#f7f9fc; --mut:#b2bdd0; --acc:#ccd6e6;
  --bd:#333c4c; --bd-soft:#232a36; --ok:#55e39d; --down:#ff8585; --warn:#ffbb55;
  --sh:0 1px 2px rgba(0,0,0,.4); --sh-up:0 6px 22px rgba(0,0,0,.5);
  --boardtop:#161c26; --boardbot:#101620;
  --bar:#5b9bff; --bar2:#9dc4ff;
}}
body{font-family:var(--f-text);font-size:14.5px;line-height:1.6;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1{font-family:var(--f-disp);font-size:27px;font-weight:800;letter-spacing:-.02em;
  text-wrap:balance;margin:0 0 2px}
h1 .mark{display:inline-block;width:28px;height:28px;vertical-align:-5px;margin-right:11px;
  background-size:contain;background-repeat:no-repeat;background-position:center}
h2{font-family:var(--f-disp);font-size:12px;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;color:var(--mut);border-top:1px solid var(--bd-soft);
  padding-top:22px;margin:32px 0 14px}
h3{font-family:var(--f-disp);letter-spacing:-.01em}
.sub{font-size:13px;color:var(--mut)}
code,.mono{font-family:var(--f-mono);font-size:12.5px}
.card,table.t,a.tile,.row,.fcard,#md{box-shadow:var(--sh);border-color:var(--bd-soft)}
.card,a.tile,.row,.fcard{border-radius:var(--rad)}
a.tile,.row{transition:box-shadow .16s ease,border-color .16s ease,transform .16s ease}
a.tile:hover,a.row:hover{box-shadow:var(--sh-up);border-color:var(--bd);
  transform:translateY(-1px)}
/* O card do app é área de leitura, não botão: nada muda no hover. A regra antiga
   trocava a sombra, e num card sem sombra isso aparecia como animação. */
.fcard,.fcard:hover{transition:none!important;transform:none!important}
/* big numbers: the first thing anyone reads on the page */
.tiles{gap:12px;margin:18px 0 4px}
a.tile{padding:13px 17px;min-width:148px}
.tile .tl{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
  color:var(--mut)}
.tile .tv{font-family:var(--f-disp);font-size:25px;font-weight:800;letter-spacing:-.025em;
  margin-top:3px}
.tile .ts{font-size:11.5px;color:var(--mut)}
/* tables read as data, not as prose */
table.t{border-radius:var(--rad);font-variant-numeric:tabular-nums}
table.t th{font-family:var(--f-disp);font-size:11px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;background:var(--bd-soft);border-bottom:1px solid var(--bd)}
table.t td{padding:9px 13px;border-bottom:1px solid var(--bd-soft)}
table.t tbody tr:hover td,table.t tr:hover td{background:rgba(125,140,170,.06)}
.twrap{border-radius:var(--rad)}
/* buttons */
.btn{font-family:var(--f-disp);font-weight:600;font-size:13.5px;padding:9px 18px;
  border-radius:999px;box-shadow:var(--sh);transition:all .16s ease}
.btn:hover{border-color:var(--acc);box-shadow:var(--sh-up);transform:translateY(-1px)}
.pill,.st{font-family:var(--f-disp);font-weight:600;font-size:11.5px;letter-spacing:.02em}
/* status colours carry meaning, so keep them out of the accent */
.st.run,.st.appr{background:rgba(10,143,88,.14);color:var(--ok)}
.st.crit{background:rgba(208,47,47,.14);color:var(--down)}
.st.rev,.st.draft{background:rgba(180,83,9,.14);color:var(--warn)}
/* the lanes strip and any scroller get a thin, rounded bar */
.hrow,.twrap{scrollbar-width:thin;scrollbar-color:var(--bd) transparent}
.hrow::-webkit-scrollbar,.twrap::-webkit-scrollbar{height:9px}
.hrow::-webkit-scrollbar-track,
.twrap::-webkit-scrollbar-track{background:transparent}
.hrow::-webkit-scrollbar-thumb,
.twrap::-webkit-scrollbar-thumb{background:var(--bd);border-radius:999px;
  border:3px solid transparent;background-clip:content-box}
.hrow::-webkit-scrollbar-thumb:hover,
.twrap::-webkit-scrollbar-thumb:hover{background:var(--mut);background-clip:content-box}
.hrow{background:transparent;border:0;padding:0;border-radius:0}
.hcol{flex:0 0 clamp(280px,26vw,360px);min-width:0}
a:focus-visible,button:focus-visible,.btn:focus-visible{outline:2px solid var(--acc);
  outline-offset:2px;border-radius:8px}
.dirlist,.prlist{margin:10px 0 0;padding-left:18px;list-style:none}
.dirlist>li,.prlist>li{position:relative;margin:0 0 7px;font-size:13.5px;line-height:1.5;
  color:var(--tx)}
.prlist>li{color:var(--mut);font-size:13px;margin-bottom:5px}
.dirlist>li::before,.prlist>li::before{content:"";position:absolute;left:-14px;top:.62em;
  width:5px;height:5px;border-radius:50%;background:var(--acc);opacity:.75}
.prlist>li::before{background:var(--mut);opacity:.5}
.dirp{display:none}
.dapps{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));
  margin:14px 0 4px;align-items:start}
.dapp{padding:14px 16px}
.dah{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.dah b{font-family:var(--f-disp);font-size:14.5px;font-weight:700}
.drank{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;
  border-radius:6px;background:var(--acc);color:var(--card);font-size:11.5px;font-weight:700;flex:none}
.st.d-dobrar{background:rgba(10,143,88,.16);color:var(--ok)}
.st.d-consertar{background:rgba(180,83,9,.16);color:var(--warn)}
.st.d-manter{background:rgba(125,140,170,.16);color:var(--mut)}
.st.d-congelar{background:rgba(125,140,170,.12);color:var(--mut)}
.dapp .prlist{margin-top:6px}
.dcall{color:var(--tx)!important;font-weight:600}
.fcard[id]{scroll-margin-top:18px}
.fdet{margin-top:10px;border-top:1px solid var(--bd-soft);padding-top:9px}
.fdet>summary{cursor:pointer;list-style:none;font-family:var(--f-disp);font-size:11.5px;
  font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);
  display:flex;align-items:center;gap:7px}
.fdet>summary::-webkit-details-marker{display:none}
.fdet>summary::before{content:"›";font-size:15px;transition:transform .15s}
.fdet[open]>summary::before{transform:rotate(90deg)}
.fdet>summary:hover{color:var(--acc)}
.fdet table.t{font-size:12.5px}
.fdet table.t td,.fdet table.t th{padding:6px 10px}
.fgrid.one{grid-template-columns:1fr!important;gap:18px}
/* Cada app é um painel com profundidade: a luz entra por cima, o corpo escurece
   até a base e a borda clareia só na primeira linha. É o que separa um app do
   outro sem precisar de moldura dura. */
.fgrid.one>.fcard{position:relative;padding:0;overflow:hidden;border-radius:16px;
  border:1px solid var(--bd-soft);
  background:linear-gradient(180deg,
    color-mix(in srgb, var(--acc) 5%, var(--card)) 0%,
    var(--card) 26%,
    color-mix(in srgb, #000 7%, var(--card)) 100%);
  box-shadow:0 1px 2px rgba(0,0,0,.05), 0 10px 26px -14px rgba(0,0,0,.28)}
@media(prefers-color-scheme:dark){.fgrid.one>.fcard{
  background:linear-gradient(180deg,
    color-mix(in srgb, var(--acc) 9%, var(--card)) 0%,
    var(--card) 30%,
    #0a0c10 100%);
  box-shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 18px 40px -22px rgba(0,0,0,.9)}}
.fgrid.one>.fcard::before{content:"";position:absolute;inset:0 0 auto;height:1px;
  background:linear-gradient(90deg, transparent,
    color-mix(in srgb, var(--acc) 45%, transparent), transparent)}
.fgrid.one>.fcard>.fh{background:transparent;margin:0;padding:15px 18px 12px;
  border-bottom:1px solid var(--bd-soft)}
.fgrid.one>.fcard>.fstats{padding:12px 18px 0}
.fgrid.one>.fcard>.fcols{padding:16px 18px 6px}
.fgrid.one>.fcard>.fdet{margin:0;padding:13px 18px 16px;border-top:1px solid var(--bd-soft);
  background:color-mix(in srgb, #000 4%, transparent)}
@media(prefers-color-scheme:dark){.fgrid.one>.fcard>.fdet{
  background:rgba(0,0,0,.25)}}
.fgrid.one>.fcard>.fh b{font-size:16px;letter-spacing:-.01em}
.fgrid.one>.fcard>.fh>span{font-size:12.5px;color:var(--tx);opacity:.78;
  font-variant-numeric:tabular-nums;font-weight:500}
/* a luz no topo do painel, um pouco mais presente */
.fgrid.one>.fcard::before{height:2px;
  background:linear-gradient(90deg, transparent, var(--acc), transparent);opacity:.5}
.fcard .fmeta{font-size:12px;color:var(--mut)}
/* funil: rótulo legível, número com peso, barra com corpo */
.fs{display:grid;grid-template-columns:150px 1fr auto;align-items:center;gap:12px;
  padding:5px 0}
.fs .fl{font-size:12.5px;color:var(--tx)}
.fs .fn{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;min-width:74px;
  text-align:right}
.fb{height:9px;border-radius:999px;background:var(--bd-soft);overflow:hidden}
.fb i{display:block;height:100%;border-radius:999px}
/* retenção com leitura imediata */
.rrow{margin:0}
.rc:first-child{border-top:0;padding-top:0}
/* o rótulo é legenda; quem salta é o número, na cor da régua */
.rc b{display:block;font-family:var(--f-disp);font-size:10px;font-weight:700;
  letter-spacing:.09em;text-transform:uppercase;color:var(--mut);margin:0}
.rc .rv{display:block;font-family:var(--f-disp);font-size:21px;font-weight:800;
  letter-spacing:-.025em;line-height:1.15;margin:3px 0 2px;font-variant-numeric:tabular-nums}
.rc>b{font-family:var(--f-disp);font-size:12px;font-weight:700;letter-spacing:.04em;
  color:var(--mut)}
.rc .rv{font-family:var(--f-disp);font-size:19px;font-weight:800;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums}
.rc .rb{display:block;font-size:11.5px;color:var(--mut)}
/* achados: mais ar e marcador claro */
.fnds li{font-size:12.5px;line-height:1.5;padding:4px 0 4px 16px}
.fnds li:before{width:6px;height:6px;top:.72em}
/* o detalhe convida a abrir */
.fdet>summary{font-size:11px;color:var(--acc);padding:3px 0}
.fdet>summary:hover{opacity:.82}
.fcols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;
  align-items:start}
@media(max-width:820px){.fcols{grid-template-columns:1fr;gap:12px}}
.fcol{min-width:0}
.fcol>.fnds{margin-top:0}
/* Régua de contexto do app: instalações, ativos, novos, crash-free. Antes isso
   era uma linha de texto corrido ("187 downloads/30d · WATCH · crash-free
   100%") que ninguém comparava entre cards; como números rotulados, dá pra
   varrer a coluna de cima a baixo. */
.fstats{display:flex;flex-wrap:wrap;gap:10px 26px;align-items:baseline}
.fst{display:flex;align-items:baseline;gap:7px;min-width:0}
.fstl{font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:var(--mut)}
.fst b{font-family:var(--f-disp);font-size:15px;font-weight:700;letter-spacing:-.015em;
  font-variant-numeric:tabular-nums}
.fstd{font-size:12px;font-weight:600}
.st.vd{background:rgba(125,140,170,.14);color:var(--mut)}
.fh .noasc{font-size:11.5px;font-weight:400;color:var(--warn)}
/* Cada metade do card diz o que é antes de mostrar número. */
.fgrp{margin-bottom:16px}
.fgrp:last-child{margin-bottom:0}
.fgl{display:block;font-family:var(--f-disp);font-size:10.5px;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;color:var(--mut);
  padding-bottom:7px;margin-bottom:10px;border-bottom:1px solid var(--bd-soft)}
.fcol>.fgrp>.fnds{margin-top:0}
.instrl{list-style:none;margin:9px 0 0;padding:0}
.instrl li{font-size:12.5px;line-height:1.55;color:var(--mut);padding:3px 0 3px 14px;
  position:relative;overflow-wrap:anywhere}
/* Coluna de leitura: linhas rotuladas, sem caixa. As caixas coloridas (funil
   verde, ação amarela) e o bloco expansível empilhavam quatro objetos de forma
   diferente num espaço estreito; rótulo à esquerda e texto à direita, separados
   por uma régua fina, lê de cima a baixo sem nada competindo (João, 02/10). */
.rline{display:grid;grid-template-columns:116px minmax(0,1fr);gap:16px;
  padding:12px 0;border-top:1px solid var(--bd-soft)}
.rline:first-child{border-top:0;padding-top:0}
.rlab{font-family:var(--f-disp);font-size:10.5px;font-weight:700;letter-spacing:.07em;
  text-transform:uppercase;color:var(--mut);padding-top:2px}
.rbody{min-width:0}
.rbody>b{display:block;font-family:var(--f-disp);font-size:14px;font-weight:700;
  letter-spacing:-.01em;line-height:1.35}
.rnum{display:block;margin-top:3px;font-size:12px;font-weight:600;color:var(--tx);
  font-variant-numeric:tabular-nums}
.rbody>p{margin:5px 0 0;font-size:12.5px;line-height:1.55;color:var(--mut)}
.rline.act .rlab{color:var(--tx)}
.rline.mut .rlab,.rline.mut .instrl li{color:var(--mut)}
.rbody>.fnds{margin:0}
@media(max-width:1180px){.rline{grid-template-columns:1fr;gap:6px}
  .rline .rlab{padding-top:0}}
.instrl{list-style:none;margin:0;padding:0}
.instrl li{font-size:12.5px;line-height:1.55;color:var(--mut);padding:2px 0 2px 14px;
  position:relative;overflow-wrap:anywhere}
.instrl li::before{content:"";position:absolute;left:0;top:.72em;width:5px;height:5px;
  border-radius:50%;background:var(--bd)}
/* Os passos de loja vêm de outra fonte que os de dentro do app: barra em tom
   mais surdo pra o olho ver onde a medição troca de sistema. */
.fs .fb i.store{background:linear-gradient(90deg,
  color-mix(in srgb, var(--bar) 45%, transparent),
  color-mix(in srgb, var(--bar) 70%, transparent))}
.fsub{display:block;font-size:10.5px;font-weight:600;letter-spacing:.07em;
  text-transform:uppercase;color:var(--mut);margin-bottom:6px}
.fsub.gap2{margin-top:14px}
.lchip{font-size:10px;color:var(--mut);background:var(--bd-soft);border-radius:999px;
  padding:1px 7px;cursor:help;white-space:nowrap}
.fcols{position:relative}
@media(min-width:821px){.fcols::before{content:"";position:absolute;top:0;bottom:0;
  left:50%;width:1px;background:var(--bd-soft)}}
.fdet .ascgrid{grid-template-columns:repeat(auto-fit,minmax(118px,1fr))}
.fdetcols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;
  align-items:start}
@media(max-width:1100px){.fdetcols{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:760px){.fdetcols{grid-template-columns:1fr}}
.fdetcols>div{min-width:0;display:flex;flex-direction:column;gap:14px}
.rawbox{background:var(--bg);border:1px solid var(--bd-soft);border-radius:11px;
  padding:11px 13px;min-width:0}
.rawbox h4,.rawbox h3.team{margin:0 0 8px;font-family:var(--f-disp);font-size:10.5px;
  font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--mut)}
.rawbox h3.team .chain{text-transform:none;letter-spacing:0;font-size:11px}
.rawbox table.t{border:0;box-shadow:none;background:transparent}
.rawbox table.t th{background:transparent;border-bottom:1px solid var(--bd)}
.rawbox table.t td{border-bottom:1px solid var(--bd-soft)}
.rawbox .twrap{border-radius:0}
.rawbox .ascgrid{margin-bottom:0;grid-template-columns:repeat(auto-fit,minmax(104px,1fr))}
.rawbox .ascgrid b{font-size:14px}
.srct{float:right;font-size:9px;font-weight:700;letter-spacing:.06em;padding:2px 7px;
  border-radius:999px;background:var(--bd);color:var(--mut);text-transform:uppercase}
.s-asc{background:rgba(125,140,170,.16);color:var(--tx)}
.s-firebase{background:rgba(180,83,9,.14);color:var(--warn)}
.noasc{background:rgba(180,83,9,.14);color:var(--warn);border-radius:999px;padding:1px 8px;
  font-size:10.5px;font-weight:600}
.convwhy{display:block;font-size:10.5px;color:var(--mut);margin-top:1px}
.rawbox .rate{padding:1px 7px;border-radius:999px;font-size:12.5px}
.featname{display:block;font-family:var(--f-mono);font-size:11.5px;margin-bottom:3px}
.featbar{display:block;height:4px;border-radius:999px;background:var(--bd-soft);overflow:hidden}
.featbar i{display:block;height:100%;border-radius:999px;
  background:linear-gradient(90deg, color-mix(in srgb, var(--acc) 70%, transparent), var(--acc))}
.legacyp{margin:8px 0 0;font-size:12px;color:var(--mut);line-height:1.7}
.legacyp code{font-size:11px}
.rawbox .ascgrid>div{background:var(--card)}
.fdet{margin-top:14px;border-top:1px solid var(--bd);padding-top:12px}
.fdet[open]>summary{margin-bottom:12px;color:var(--acc)}
.t .thsub{font-size:9.5px;font-weight:600;letter-spacing:.03em;color:var(--mut);
  text-transform:none}
.t .rate{padding:1px 8px;border-radius:999px;font-variant-numeric:tabular-nums}
.t .rate.good{background:rgba(10,143,88,.16);color:var(--ok)}
.t .rate.mid{background:rgba(180,83,9,.14);color:var(--warn)}
.t .rate.low{background:rgba(208,47,47,.13);color:var(--down)}
.thin{font-size:10.5px;color:var(--mut);background:var(--bd-soft);border-radius:999px;
  padding:1px 7px;cursor:help;white-space:nowrap}
.sbx{font-size:12px;color:var(--warn);background:rgba(180,83,9,.12);border-radius:999px;
  padding:1px 8px;cursor:help;white-space:nowrap}
.sbxnote{font-size:11.5px;color:var(--warn);background:rgba(180,83,9,.10);
  border:1px solid rgba(180,83,9,.25);border-radius:9px;padding:7px 10px;margin:0 0 10px}
.actv{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 9px;margin:0 0 10px;
  padding:8px 11px;border-radius:10px;background:var(--bd-soft)}
.actvt{font-family:var(--f-disp);font-size:10px;font-weight:800;letter-spacing:.09em;
  text-transform:uppercase;color:var(--mut)}
.actv b{font-family:var(--f-disp);font-size:15px;font-variant-numeric:tabular-nums}
.actvw{flex-basis:100%;font-size:11px;color:var(--mut)}
.fover{font-size:10.5px;color:var(--warn);background:rgba(180,83,9,.12);border-radius:999px;
  padding:1px 7px;cursor:help;white-space:nowrap}
.hspan{display:inline-block;margin-left:10px;font-size:10.5px;font-weight:600;letter-spacing:.04em;
  text-transform:none;color:var(--mut);background:var(--bd-soft);padding:2px 9px;border-radius:999px;
  vertical-align:2px}
.ascspan{font-size:11px;color:var(--mut);margin:2px 0 7px}
.ascgrid{display:grid;gap:7px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
  margin-bottom:10px}
.ascgrid>div{background:var(--bd-soft);border-radius:9px;padding:7px 10px;min-width:0}
.ascgrid span{display:block;font-size:10px;color:var(--mut);text-transform:uppercase;
  letter-spacing:.04em}
.ascgrid b{font-family:var(--f-disp);font-size:15px;font-variant-numeric:tabular-nums}
.fcard[id]:target{border-color:var(--acc);box-shadow:0 0 0 2px rgba(125,140,170,.3),var(--sh-up)}
/* ---------- acabamento: luz e profundidade (01/10) ----------
   Gradiente é usado onde tem função: a luz no topo dá direção à página, a barra
   do funil ganha volume, e o cabeçalho de cada app se separa do conteúdo. Fundo
   chapado em tudo o resto, para os números seguirem sendo o que salta. */
body{background:
  radial-gradient(1100px 420px at 12% -8%, color-mix(in srgb, var(--acc) 11%, transparent), transparent 70%),
  radial-gradient(900px 360px at 88% -4%, color-mix(in srgb, var(--ok) 7%, transparent), transparent 72%),
  var(--bg);
  background-attachment:fixed}
h1{background:linear-gradient(100deg, var(--tx) 30%, color-mix(in srgb, var(--acc) 72%, var(--tx)));

<body><header class=top><div class=topin><a class=brand href="../index.html"><span class=mark></span>GambitStudio</a><nav class=navs><a class="nav" href="../index.html">Agora</a><a class="nav" href="../business.html">Business Analysis</a><a class="nav" href="../aso.html">ASO</a><a class="nav" href="../vendas.html">Seller</a></nav><span class=stamp>atualizado 02/10 11:25</span></div></header><div class="wrap"><p class="sub"><code>_GambitStudio/.claude/skills/create-ios-app/SKILL.md</code></p><div id="md"></div><script>const RAW="---\nname: create-ios-app\ndescription: Scaffold a brand-new iOS app from scratch \u2014 runs the GambitStudio workflow (Viability \u2192 competitor intel \u2192 Product/Design spec \u2192 ASO metadata \u2192 Foundation \u2192 Development \u2192 Polish \u2192 Screenshots \u2192 Archive) end-to-end without stopping for approval, acting as a LEAN COORDINATOR that delegates every heavy or independent step to subagents (competitor-scout, product-designer, aso-copywriter, screen-builder, polish-reviewer, qa-runner). Use when the user types `/create-ios-app <description>` or asks to create/build a new iOS app.\n---\n\n# Create iOS App \u2014 Lean Coordinator\n\nTriggered by `/create-ios-app <short description>` (e.g. `/create-ios-app <descri\u00e7\u00e3o do nicho>`).\n\n## Autoridade\nAutonomia total \u2014 N\u00c3O pedir aprova\u00e7\u00e3o entre fases. O Jo\u00e3o quer um app pronto, n\u00e3o resumos de fase. As DUAS \u00fanicas paradas leg\u00edtimas s\u00e3o: (a) o veredito **NO-GO** da Fase 0, e (b) o **Gate Report** da Fase 3 quando um gate humano bloqueia o archive (a\u00ed voc\u00ea oferece o plano B e segue).\n\n## Voc\u00ea \u00e9 o COORDENADOR \u2014 princ\u00edpio central\nSeu contexto guarda s\u00f3 **o c\u00e9rebro**: o spec do app, o estado das fases, as decis\u00f5es, e os **resultados compactos** de cada subagent. Todo trabalho pesado OU independente \u00e9 empurrado pra um subagent com **brief denso** e volta como **retorno estruturado**. O processo do subagent (arquivos que ele leu, c\u00f3digo que ele escreveu, screenshots de QA) fica no contexto DELE e \u00e9 descartado \u2014 voc\u00ea ret\u00e9m s\u00f3 o veredito.\n\n**Contrato de toda delega\u00e7\u00e3o:**\n- **INPUT (brief denso)**: TODOS os paths, assinaturas, hex da paleta, decis\u00f5es \u2014 o agent NUNCA explora o projeto.\n- **OUTPUT (retorno estruturado)**: lista de arquivos + keys de localiza\u00e7\u00e3o + needs/bugs. NUNCA dump de c\u00f3digo.\n- **Voc\u00ea ret\u00e9m**: s\u00f3 o OUTPUT compacto. N\u00e3o re-leia arquivos que um agent escreveu, exceto se um erro de build apontar pra eles.\n\n**Regras inviol\u00e1veis do padr\u00e3o:**\n- **Arquivos compartilhados s\u00e3o S\u00d3 seus**: apenas o coordenador toca `Localizable.xcstrings`, `InfoPlist.xcstrings`, `project.yml`, `Info.plist`. Agents pedem mudan\u00e7as no retorno e voc\u00ea faz o merge (xcstrings via script, NUNCA Read do arquivo inteiro).\n- **A onda se dimensiona pelo trabalho** (Jo\u00e3o 02/09/2026 \u2014 sem cap de simult\u00e2neos nem teto de tokens): 1 unidade independente = 1 subagente; dispara a onda, faz merge, dispara a pr\u00f3xima quando houver depend\u00eancia. Antes de uma onda grande, `df -h /` e o esqueleto j\u00e1 compilado com o checkout \u00fanico de pacotes (LEARNINGS #91).\n- **Spec em fatias**: leia S\u00d3 a fatia de `_GambitStudio/spec/` que a fase pede (mapa em `_GambitStudio/CLAUDE.md`). NUNCA leia o spec todo.\n- **Gen\u00e9rico**: nada neste fluxo assume um nicho. Onde precisar de exemplo use placeholder (`<Feature A>`, `<Tela X>`, `<Model Y>`).\n\n---\n\n## Checklist de estado (o \"continue\" retoma daqui)\nMantenha este bloco atualizado no seu contexto durante toda a execu\u00e7\u00e3o. Ao ser interrompido: termine o arquivo que est\u00e1 escrevendo, ent\u00e3o retome pela primeira linha n\u00e3o-\u2705.\n\n```\n[ ] F0 Viabilidade ...... GO/NO-GO + markets + Name/Subtitle/KW\n[ ] F1 Produto+Design ... product-designer \u2192 PRODUCT-SPEC.md (JTBD, teardown dos prints, fluxos \u22643 toques, spec por tela, 3 momentos-assinatura, esquema de cor light|dark, MONETIZA\u00c7\u00c3O com motivo, perguntas de onboarding, briefs da se\u00e7\u00e3o 9)\n[ ] F2 ASO Metadata ..... metadata/{pt-BR,en-US,es-ES}.txt + metadata/iap/ (bg agent)\n[ ] F3 Foundation ....... design system, repo/CI, bundle+caps, PaywallKit+.storekit, URL scheme, ARCHITECTURE-BRIEF.md, GATE REPORT\n[ ] F4 Dev .............. shared ground + N telas (ondas de screen-builder, dimensionadas pelo trabalho)\n[ ] F5 Polish+QA+Audit .. polish-reviewer + qa-runner + auditoria adversarial\n[ ] F6 Screenshots ...... 5 prints Treatment A (delega /code-driven-prints)\n[ ] F7 Archive prep ..... resolve/desacopla gates \u2192 tag release \u2192 submit prep\n```\n\n---\n\n## Modo E2E (smoke sem servi\u00e7os externos)\nAtivado quando o coordenador \u00e9 invocado com `GAMBIT_E2E=1` no ambiente **ou** o prompt diz \"modo E2E\". \u00c9 o smoke test do pipeline (`_GambitStudio/evals/e2e/`, gap 7 da auditoria de 27/09/2026): prova que a coordena\u00e7\u00e3o inteira produz um app que compila e passa nos verificadores do lab, sem tocar em nada fora da m\u00e1quina.\n- **Alvo**: `_GambitStudio/evals/e2e/work/<AppName>/` (gitignored). NUNCA `Apps/`.\n- **Pula**: Fase 0 e 0.5 (research/competitor-scout), Fase 2 (`aso-copywriter` \u2014 escreve 3 stubs `metadata/{pt-BR,en-US,es-ES}.txt` com Name/Subtitle/Keywords/Description placeholder), registro de bundle id, `gh`, Firebase, qualquer chamada \u00e0 ASC/Astro/Apple Ads, Fase 6 (screenshots) e Fase 7 (archive). Sem Firebase, `Core/Services/AnalyticsService.swift` mant\u00e9m a MESMA API (`Analytics.log/screen/coreAction/\u2026`) escrevendo em `os_log` \u2014 trocar o corpo por `FirebaseAnalytics` \u00e9 o \u00fanico delta pro app real.\n- **Roda de verdade**: Fase 1 com o `product-designer` de verdade (a Fase 0.5 foi pulada, ent\u00e3o ele trabalha da ideia + os refs que existirem em `_GambitStudio/evals/e2e/work/refs/` \u2014 prints/descriptions j\u00e1 baixados de concorrentes do nicho do fixture, mesmo layout do `competitor-intel/` \u2014 e escreve o `PRODUCT-SPEC.md` completo, com `## 7. Monetiza\u00e7\u00e3o` e as perguntas de onboarding; sem refs, trabalha s\u00f3 da ideia e diz isso no retorno), Fase 3 (Foundation completa: `project.yml` com os kits via `url:`, `Info.plist` com `UIDesignRequiresCompatibility=YES` + `CFBundleURLTypes`, LaunchScreen, xcstrings nos 3 locales, `GambitOnboardingPreset` + `GambitPaywallPreset` (modelo padr\u00e3o de `spec/paywall-onboarding-template.md`, copy de `templates/copy/`; `Products.storekit` semanal + anual com trial s\u00f3 no plano-her\u00f3i), `.onOpenURL` + `DeepLink`, Settings do template, eventos can\u00f4nicos, `ARCHITECTURE-BRIEF.md`), `xcodegen generate` + build do esqueleto ANTES da onda (LEARNINGS #91), Fase 4 limitada a **2 telas** por `screen-builder` em paralelo com brief denso, merge das keys via script, build, Fase 5 s\u00f3 `polish-reviewer` (sem `qa-runner`, sem `analytics-instrumentor`).\n- **Build**: simulador, Xcode mais novo (`DEVELOPER_DIR=\"/Applications/Xcode 2.app/Contents/Developer\"`), `-destination 'generic/platform=iOS Simulator'`, `-derivedDataPath <work>/dd -clonedSourcePackagesDirPath <work>/dd/SourcePackages COMPILER_INDEX_STORE_ENABLE=NO`; simulador s\u00f3 pela fila `tools/sim-pool` (owner `e2e-smoke`), release ao terminar.\n- **Pronto quando** `evals/e2e/create_ios_app_smoke.py --verify <app-dir>` passa. O relat\u00f3rio lista toda falha que o run real encontrou (spec/kit/skill) \u2014 \u00e9 esse o valor do smoke; `--runbook` imprime o prompt exato pra repetir.\n\n## Fase 0 \u2014 Viabilidade (delega \u2192 skill `research-aso-keywords`)\nRoda a skill `research-aso-keywords` com a descri\u00e7\u00e3o do nicho. Ela j\u00e1 faz o benchmark de features/naming/dores dos concorrentes + sweet spots de keyword e devolve veredito.\n- **Voc\u00ea ret\u00e9m**: veredito **GO/NO-GO**, markets-alvo (ex. US / BR / ES), e o rascunho de **Name / Subtitle / Keywords field**.\n- **NO-GO \u2192 PARE** e reporte ao Jo\u00e3o (\u00fanica parada de decis\u00e3o al\u00e9m do Gate Report). GO \u2192 segue.\n\n## Fase 0.5 \u2014 Competitor Intel: brechas (delega \u2192 `competitor-scout`)\nDepois do GO, ANTES do PM Spec. Dispare o agent `competitor-scout` com: termo(s) principal(is), markets da Fase 0, e `<app-dir>` como output. Ele roda o `competitor_intel.py` por market, L\u00ca os prints/descriptions/reviews no contexto DELE e escreve `competitor-intel/GAPS.md`.\n- Nota: o subtitle raspado da p\u00e1gina pode ser tagline promocional \u2014 o subtitle ASC real vem do Astro (`search_app_store`).\n- **Voc\u00ea ret\u00e9m**: s\u00f3 o report compacto (table stakes, wedges, naming, padr\u00f5es visuais, dores\u2192diferenciais). O material em disco (`competitor-intel/`) \u00e9 a entrada do `product-designer` na Fase 1; o report alimenta os textos da Fase 2 e os prints da Fase 6. N\u00c3O leia as imagens voc\u00ea mesmo.\n\n## Fase 1 \u2014 Produto + Design (delega \u2192 `product-designer`; voc\u00ea s\u00f3 CONSOME o spec)\nDiagn\u00f3stico do Jo\u00e3o (27/09/2026): \"ux n\u00e3o sai muito boa\u2026 ficam uns apps muito gen\u00e9ricos e fracos\u2026 fica bom se eu ir tela por tela falando o que fazer certinho, como se n\u00e3o tivesse um bom pm e designer\". A causa era esta fase feita inline, em minutos, por voc\u00ea: o `screen-builder` executa o que o brief diz, e o brief era raso. Agora a Fase 1 \u00e9 um agente com tempo e olhos.\n\n1. **Dispare o `product-designer`** com: a ideia (palavras do Jo\u00e3o), `<app-dir>`, markets e o rascunho Name/Subtitle/KW da Fase 0, e o path de `<app-dir>/competitor-intel/` (sa\u00edda da Fase 0.5 \u2014 ele USA os prints/descriptions/GAPS.md, n\u00e3o baixa de novo). Ele L\u00ca os prints dos concorrentes e escreve `<app-dir>/PRODUCT-SPEC.md` no template `_GambitStudio/spec/product-spec-template.md`: (1) jobs to be done na boca do usu\u00e1rio, (2) teardown de UX dos concorrentes (table stakes / gen\u00e9rico / wedge) + **esquema de cor light|dark** decidido pelo nicho e pelos tops da categoria, (3) os 3 fluxos com a contagem de toques at\u00e9 o `core_action` (alvo \u2264 3), (4) spec por tela (UMA a\u00e7\u00e3o prim\u00e1ria, hierarquia, estados vazio/carregando/erro/sucesso com copy, micro-intera\u00e7\u00f5es, edge cases, accessibility ids, o que faz a tela n\u00e3o ser gen\u00e9rica), (5) 3 momentos-assinatura, (6) o que N\u00c3O fazer, (7) monetiza\u00e7\u00e3o, (8) perguntas de personaliza\u00e7\u00e3o, (9) o brief pronto por tela.\n2. **Voc\u00ea ret\u00e9m** (do retorno estruturado dele \u2014 n\u00e3o releia o arquivo inteiro): telas + navega\u00e7\u00e3o (TabView; push vs modal por tela \u2014 regra do LEARNINGS), **esquema de cor** (light OU dark \u2014 um s\u00f3) + paleta do nicho com hex (RULES.md \"Paleta por nicho\"; entra na Foundation), decis\u00e3o de monetiza\u00e7\u00e3o, as perguntas de personaliza\u00e7\u00e3o (cada uma com a `@AppStorage` key e o que muda), `core_action` + aha do review, os 3 momentos-assinatura e as alavancas opcionais (widget / App Intent \u00fanico / Live Activity, playbook \u00a77 \u2014 s\u00f3 se o job \u00e9 \"olhar r\u00e1pido\" um estado).\n3. **Regras que o spec TEM que respeitar** \u2014 retorno que viola uma delas **volta pro agente citando a regra** (voc\u00ea n\u00e3o conserta inline):\n   - **Monetiza\u00e7\u00e3o (decis\u00e3o obrigat\u00f3ria \u2014 Jo\u00e3o 27/09/2026; `spec/product-playbook.md` \u00a73):** o app tem um *gate natural* (capacidade que um usu\u00e1rio engajado repete e pagaria: hist\u00f3rico ilimitado, export, 2\u00ba perfil, widget, tema)? O `## 7. Monetiza\u00e7\u00e3o` do spec traz a decis\u00e3o E uma linha de motivo, nos dois sentidos.\n     - **Com gate (default):** paywall SOFT como \u00faltimo step do onboarding via `PaywallKit` (`PurchaseScaffold`) + StoreKit 2 nativo (nunca RevenueCat), planos **semanal + anual**, **plano-her\u00f3i declarado no spec e trial S\u00d3 nele, com a dura\u00e7\u00e3o da regra** (`spec/product-playbook.md` \"Atualiza\u00e7\u00e3o 2026-09-28\", pesquisa achados 1-3): utilit\u00e1rio de impulso = her\u00f3i semanal + **3 dias** (anual direto); h\u00e1bito/sa\u00fade/educa\u00e7\u00e3o/fam\u00edlia = her\u00f3i anual + **7 dias** (semanal direto); produtividade/festa = sem trial ou one-time; **nunca \u2264 4 dias no anual, nunca trial nos dois planos, nunca toggle de trial** (Apple 3.1.2, jan/2026). Plano-her\u00f3i pr\u00e9-selecionado, **step de preview de valor** antes do paywall (o resultado do app com o dado das perguntas \u2014 \"valor antes do paywall\" \u00e9 a maior queda do funil, achado 11), **tela p\u00f3s-compra** com o pr\u00f3ximo passo e o pedido de push, e a lista das features gated (\u2265 1 real \u2014 IAP que n\u00e3o destrava nada \u00e9 rejeitada). Product IDs `com.gambitstudio.<app>.pro.weekly` / `.pro.yearly`. O `heroPlan` do `GambitPaywallPreset` e o copy de paywall/onboarding saem daqui: o designer preenche os `{placeholders}` de `_GambitStudio/templates/copy/{onboarding,paywall}.<locale>.json` e s\u00f3 mexe nos bot\u00f5es permitidos por `spec/paywall-onboarding-template.md`.\n     - **Sem gate:** fica gr\u00e1tis e o spec diz por qu\u00ea (app de festa/uso \u00fanico; AdMob servindo de verdade). Gr\u00e1tis \u00e9 decis\u00e3o registrada, n\u00e3o default.\n   - **Onboarding personalizado** (`spec/product-playbook.md` \u00a71): 2-3 perguntas (objetivo, frequ\u00eancia, n\u00edvel) e o que cada resposta MUDA no app (default da home, plano, lembrete). Se o app tem lembrete/notifica\u00e7\u00e3o, o hor\u00e1rio \u00e9 configurado dentro do onboarding e a permiss\u00e3o pedida ali. Pergunta sem uso n\u00e3o entra.\n   - **Toques at\u00e9 o `core_action` contados** em cada fluxo (alvo \u2264 3); **UMA a\u00e7\u00e3o prim\u00e1ria + 4 estados por tela**; **3 momentos-assinatura**; **sem streak** (Jo\u00e3o 27/09 \u2014 nunca, nem como op\u00e7\u00e3o secund\u00e1ria); **esquema de cor \u00fanico** (light OU dark, nunca os dois \u2014 `spec/design-system.md` \"Visual Style\").\n4. O `PRODUCT-SPEC.md` fica em disco e \u00e9 a fonte de todo brief: na Fase 4 os briefs dos screen-builders s\u00e3o **COPIADOS da se\u00e7\u00e3o 9**, n\u00e3o reescritos por voc\u00ea; na Fase 5 o `polish-reviewer` recebe os 3 momentos-assinatura pra conferir na tela capturada.\n- Avulso: \"repensa o produto do app X\" = o mesmo agente sobre um app vivo (app dir + `competitor-intel/`), sem o resto do pipeline.\n\n## Fase 2 \u2014 ASO Metadata (delega \u2192 `aso-copywriter`, background)\nIndependente da Fase 3 \u2192 dispare em background e siga. Brief: nicho, app dir, markets da Fase 0, feature list da Fase 1, o rascunho Name/Subtitle/KW, **e a decis\u00e3o de monetiza\u00e7\u00e3o da Fase 1** (planos, trial, features gated) \u2014 se o app monetiza, o agent tamb\u00e9m escreve `metadata/iap/<locale>.txt` (display name \u2264 30 e description \u2264 45 chars por produto, igual nos 3 locales de estrutura; \u00e9 o que aparece na ASC, no Promoted IAP e na busca) e o copy do paywall (t\u00edtulo, 3 benef\u00edcios, CTA, rodap\u00e9 legal) em `metadata/paywall/<locale>.txt`, que vira as keys `paywall.*` do xcstrings \u2014 **partindo de `_GambitStudio/templates/copy/paywall.<locale>.json`** (padr\u00f5es com o achado de cada chave; o agent preenche os `{placeholders}` com o resultado do app, n\u00e3o inventa estrutura nova).\n- Agent faz Astro research + escreve `metadata/{pt-BR,en-US,es-ES}.txt` + snapshot de research, TUDO no contexto dele.\n- **Voc\u00ea ret\u00e9m**: s\u00f3 o resumo (quais arquivos ficaram prontos). N\u00e3o leia o metadata inteiro.\n\n## Fase 3 \u2014 Foundation + GATE REPORT (COORDENADOR, inline)\nLeia as fatias conforme precisar: `spec/workflow.md`, `spec/xcode-project.md`, `spec/platform.md`, `spec/launch-screen.md`, `spec/gitignore.md`, `spec/git-ci-cd.md`.\n\n**3a. Scaffold:**\n- Folder MVVM, Design System (GambitCoreKit + paleta do PRODUCT-SPEC **no esquema de cor decidido l\u00e1**: `.preferredColorScheme(.light|.dark)` FIXO no `@main`, Asset Catalog sem variante Dark, sem toggle de Appearance em Settings, sem `@AppStorage(\"appearanceMode\")` \u2014 Jo\u00e3o 27/09/2026, `spec/design-system.md` \"Visual Style\"), skeletons `Localizable.xcstrings` + `InfoPlist.xcstrings`, core Models/Services, `.gitignore`, Info.plist (`UIDesignRequiresCompatibility=YES` \u2014 MANDATORY, desabilita o Liquid Glass do iOS 26; a Apple remove o opt-out no Xcode 27, ~abr/2027 \u2014 decis\u00e3o pendente do Jo\u00e3o, `spec/product-playbook.md` \u00a713; n\u00e3o flipar por conta pr\u00f3pria), LaunchScreen.storyboard, `project.yml` (packages via `url:`+`branch:main`, NUNCA path local) \u2192 `xcodegen generate`.\n- **URL scheme (obrigat\u00f3rio, LEARNINGS #94, `spec/mandatory-features.md` \u00a710):** no `project.yml` \u2192 `info.properties` \u2192 `CFBundleURLTypes: [{CFBundleURLName: com.gambitstudio.<app>, CFBundleURLSchemes: [\"<app>\"]}]` (scheme = sufixo do bundle id, min\u00fasculas). No `@main`, `.onOpenURL { url in appState.handle(DeepLink(url)) }` na `WindowGroup`: `<app>://home` (ou host vazio) abre a tela principal; um host por feature se houver (`widget`, `event`). Sem isso n\u00e3o existe In-App Event nem deep link de widget, e adicionar depois custa um release.\n- **Monetiza\u00e7\u00e3o (se a Fase 1 decidiu paywall):** `PaywallKit` no `packages:` + `dependencies:` do target; `Products.storekit` na raiz com o grupo `\"<App> Premium\"` e os produtos `com.gambitstudio.<app>.pro.weekly` (P1W) e `.pro.yearly` (P1Y), **intro offer free S\u00d3 no plano-her\u00f3i do PRODUCT-SPEC com a dura\u00e7\u00e3o da regra** (her\u00f3i semanal \u2192 **P3D** no weekly, yearly sem oferta; her\u00f3i anual \u2192 **P7D** no yearly, weekly sem oferta; sem trial \u2192 nenhuma), **sem toggle de trial** (cards, `GambitPaywallPreset` \u2192 `PurchaseScaffold`); `scheme: storeKitConfiguration: Products.storekit` no target; `StoreKitManager.shared.configure(weekly:yearly:)` no `init` do `@main`; `PaywallAnalytics.onEvent` ligado ao wrapper. **Paywall + onboarding = os presets do lab (Jo\u00e3o 28/09: \"modelo padr\u00e3o de paywall/onboarding baseado em dados\"):** `GambitOnboardingPreset` (OnboardingKit) e `GambitPaywallPreset(heroPlan: .weeklyHero(trialDays: 3) | .annualHero(trialDays: 7) | .noTrial(preselect:))` (PaywallKit), na ordem e com as travas de `_GambitStudio/spec/paywall-onboarding-template.md` \u2014 o spec s\u00f3 mexe nos bot\u00f5es listados l\u00e1; `OnboardingAnalytics.onEvent` ligado no `@main` junto do `PaywallAnalytics.onEvent`. O que o preset j\u00e1 entrega (pesquisa 28/09, achados 6-8): `TrialTimelineView` acima do CTA quando o plano selecionado tem trial (\"Hoje: acesso total \u2192 Dia N-2: lembrete \u2192 Dia N: cobran\u00e7a\"), CTA com dura\u00e7\u00e3o e pre\u00e7o p\u00f3s-trial, `TrialReminderService` (local: 6 h, T-2 d, \u00faltimo dia; evento `trial_reminder_scheduled(kind)`) com o pedido de push na `PostPurchaseView` (`post_purchase_shown`), `plan_selected(period, trial)` no toque do card, `days_since_install` em `paywall_shown`/`purchase_*`, barra de progresso no onboarding e o step de preview de valor antes do paywall. Exit offer (`ExitOfferSheet`, `exit_offer_shown`) s\u00f3 se o spec decidiu e com intro offer real na ASC. Na ASC (via API, LEARNINGS #1/#48): subscription group + 2 subs + availability com os 175 territ\u00f3rios NUM POST s\u00f3 + pre\u00e7o por tier (BR/MX \u2248 0,5; IN \u2248 0,2 do USA \u2014 `spec/product-playbook.md` \u00a73) + **intro offer no plano-her\u00f3i, com a dura\u00e7\u00e3o da tabela, por territ\u00f3rio** + review screenshot + PATCH no-op. Retention Messaging e win-back ficam pro p\u00f3s-launch. App gr\u00e1tis: nada disso, e o spec j\u00e1 disse por qu\u00ea.\n- `git init` + `gh repo create` (repo privado, hist\u00f3rico/tag s\u00f3). **Sem workflow do GitHub Actions e sem secrets no repo**: o lab N\u00c3O usa mais o CI (Jo\u00e3o 2026-08-30, LEARNINGS #0) \u2014 o archive \u00e9 LOCAL com o Xcode mais novo assinado pela ASC API key, executado pelo `release-runner` e s\u00f3 quando o Jo\u00e3o pede. dSYM do Crashlytics sobe \u00e0 m\u00e3o no release (LEARNINGS #52).\n- **Analytics desde o dia 1** (`spec/mandatory-features.md` \u00a79): `AnalyticsService` wrapper + eventos can\u00f4nicos de `_GambitStudio/analytics/event-taxonomy.md`; o `ARCHITECTURE-BRIEF.md` declara o **`core_action`** (a\u00e7\u00e3o de valor = ativa\u00e7\u00e3o) e o **aha-moment do prompt nativo de review** \u2014 qual m\u00e9todo do ViewModel chama `ReviewService.shared.recordPositiveEvent(trigger:)` e por que aquele \u00e9 o momento (crit\u00e9rios em `spec/mandatory-features.md` \u00a72; NUNCA pr\u00e9-prompt) \u2014 e cada screen-builder recebe no brief quais eventos a tela loga. **Crashlytics junto** (`FirebaseCrashlytics`; dSYM sobe no archive local via `upload-symbols`, LEARNINGS #52 \u2014 o `postBuildScripts` de Release do `project.yml` j\u00e1 faz isso; taxonomia \u00a76). Hooks dos kits conectados no `@main`: `ReviewService.shared.onEvent`, `PaywallAnalytics.onEvent` (se paywall), `onStepShown:` no OnboardingKit. Firebase project (com GA vinculado) + `GoogleService-Info.plist` = gate humano \u2192 entra no Gate Report (n\u00e3o bloqueia archive; sem ele o wrapper fica no-op).\n- Bundle ID via API (`POST /v1/bundleIds`); capabilities API-settable via `bundleIdCapabilities`. App record no ASC = **web-UI-only** (POST /v1/apps \u00e9 403 \u2192 entra no Gate Report).\n\n**3b. GATE REPORT (fazer CEDO, n\u00e3o no fim \u2014 anti-padr\u00e3o: descobrir bloqueio de entitlement s\u00f3 na hora do archive).**\nVarra o spec da Fase 1 e liste JUNTOS, agora, TODO gate humano/fora-da-API que o app vai precisar. Classifique cada um:\n\n| Gate | Tipo | API-settable? | Bloqueia archive? |\n|---|---|---|---|\n| App record no ASC (`POST /v1/apps`) | web-UI-only | \u274c | n\u00e3o (mas bloqueia submit) |\n| Entitlement RESTRITO (grant/approval da Apple: Family Controls, HealthKit cl\u00ednico, CarPlay, etc.) | portal + approval | \u274c | **SIM** |\n| App Group / iCloud Container (resource) | portal manual | \u274c | SIM se entitlement usado |\n| Paid Apps Agreement (app com paywall \u2014 decis\u00e3o da Fase 1) | web-UI (Business \u2192 Agreements, Tax, Banking) | \u274c | n\u00e3o (bloqueia submit: subs ficam MISSING_METADATA sem ele, LEARNINGS #1) |\n| 1\u00ba grupo de assinaturas anexado \u00e0 vers\u00e3o | web-UI-only (API n\u00e3o aceita sub como item \u2014 LEARNINGS #44/#51) | \u274c | n\u00e3o (bloqueia submit da v1 com IAP) |\n| Xcode mais novo instalado + ASC API key v\u00e1lida (archive \u00e9 LOCAL, LEARNINGS #0) | m\u00e1quina do Jo\u00e3o | \u274c | **SIM** (SDK velho = upload rejeitado) |\n| Pricing / App Privacy / Content Rights | web-UI-only | \u274c | n\u00e3o (bloqueia submit) |\n\nRegra de detalhe: consultar LEARNINGS \u00a71 (o que a API N\u00c3O faz) e \u00a73/\u00a74 (iCloud/HealthKit) pra classificar certo.\n\n**Plano B (decis\u00e3o consciente):** se um gate bloqueia o archive mas o RESTO do app est\u00e1 pronto, ofere\u00e7a desacoplar a feature bloqueada pra uma **v1.x** e publicar o resto agora. Ex.: entitlement restrito sem grant \u2192 remover a feature dependente do target v1 (`spec/platform.md` + `.entitlements` + `project.yml` + qualquer string), arquivar o n\u00facleo, religar quando o grant sair. Apresente ao Jo\u00e3o como escolha (publicar n\u00facleo agora vs esperar o gate), n\u00e3o como bloqueio silencioso.\n\n**3c. ARCHITECTURE-BRIEF.md** (raiz do app, \u2264150 linhas): hex da paleta + nomes AppColors, tokens AppFonts/AppSpacing, cada Model com seus campos, cada Service/Manager com assinaturas p\u00fablicas, mapa de navega\u00e7\u00e3o (tab, push vs modal), conven\u00e7\u00e3o de naming das keys de localiza\u00e7\u00e3o, folder layout, **se\u00e7\u00e3o `## Monetiza\u00e7\u00e3o`** (paywall ou gr\u00e1tis + motivo; product IDs; features gated e como o gate se apresenta \u2014 `PaywallProPromptSheet` com `source = \"gate_<feature>\"`), **se\u00e7\u00e3o `## Onboarding`** (steps de feature, as perguntas de personaliza\u00e7\u00e3o e a `@AppStorage` key de cada resposta, permiss\u00e3o configurada no fluxo, paywall como \u00faltimo step), **se\u00e7\u00e3o `## Deep links`** (scheme e hosts), **se\u00e7\u00e3o `## Analytics`: o `core_action` do app (kind + em qual m\u00e9todo do ViewModel dispara) e a tabela tela \u2192 eventos can\u00f4nicos que ela loga (`feature_used` names, `screen_name`, `empty_state_viewed`, `error_shown`) \u2014 nomes S\u00d3 de `_GambitStudio/analytics/event-taxonomy.md`**. **\u00c9 o \u00fanico arquivo de contexto que todo `screen-builder` l\u00ea** \u2014 mantenha completo e atual.\n\n- **Voc\u00ea ret\u00e9m**: paths do repo, Bundle ID, o Gate Report (com status por gate), e o ARCHITECTURE-BRIEF (que fica em disco).\n\n## Fase 4 \u2014 Development (delega \u2192 `screen-builder` em ondas dimensionadas pelo trabalho)\n1. **Coordenador faz o ch\u00e3o compartilhado primeiro**: Models, Services, MockDataProvider, shell de navega\u00e7\u00e3o (TabView + routing + `DeepLink` do `.onOpenURL`). Onboarding = `GambitOnboardingPreset` (features \u2192 perguntas \u2192 **preview de valor** \u2192 permiss\u00e3o de 1 bot\u00e3o \u2192 paywall, com barra de progresso, `spec/paywall-onboarding-template.md`); strings = `templates/copy/onboarding.<locale>.json` com os `{placeholders}` preenchidos pelo `product-designer` no PRODUCT-SPEC; Settings = template (bloco Premium + Restore s\u00f3 se o app monetiza) \u2014 mec\u00e2nicos, fa\u00e7a inline ou d\u00ea a 1 screen-builder.\n2. **1 `screen-builder` por tela independente, todos em paralelo** (sem cap \u2014 a onda \u00e9 do tamanho do trabalho). Telas com forte interdepend\u00eancia v\u00e3o no mesmo agent. Brief de cada um = o bloco `SCREEN:` daquela tela **COPIADO da se\u00e7\u00e3o 9 do `PRODUCT-SPEC.md`** (verbatim \u2014 voc\u00ea n\u00e3o resume nem reescreve; bloco incompleto volta pro `product-designer`) + path do `ARCHITECTURE-BRIEF.md` + folder-alvo exato. O agent **nunca** toca arquivo compartilhado \u2014 devolve as keys de localiza\u00e7\u00e3o no retorno. Se o app monetiza, 1 screen-builder recebe o **step de paywall + tela p\u00f3s-compra** (`GambitPaywallPreset` com o `heroPlan` do spec, nunca custom; copy de `metadata/paywall/`, que partiu de `templates/copy/paywall.<locale>.json`) com as decis\u00f5es ESCRITAS no brief \u2014 plano-her\u00f3i, dura\u00e7\u00e3o do trial, timeline do trial, lembretes, exit offer sim/n\u00e3o, lifetime sim/n\u00e3o, prova social (nota e n\u00ba de usu\u00e1rios reais) \u2014 e o brief das telas com feature gated diz qual gate elas mostram (`PaywallProPromptSheet`, `premium_gate_hit`).\n3. **Merge (s\u00f3 coordenador)**: junta as keys no `Localizable.xcstrings` com `_GambitStudio/scripts/localization/xcstrings_merge.py --report <retorno-do-builder>` (nunca Read do arquivo inteiro), aplica mudan\u00e7as pedidas no `project.yml`, `xcodegen generate`, build. Erro pequeno conserta voc\u00ea; erro grande volta pra um agent fresco com o erro. Itera at\u00e9 0 erros / 0 warnings.\n- **Voc\u00ea ret\u00e9m**: lista de telas prontas + keys mergeadas. Descarta o processo dos agents.\n\n## Fase 5 \u2014 Polish + QA + Bug Audit adversarial (delega \u2192 `polish-reviewer`, `qa-runner`)\n1. `polish-reviewer` com o app dir \u2192 aplica os NEEDS WORK (voc\u00ea, ou screen-builder pros grandes). Ele percorre `spec/pre-release-checklist.md` inteiro (Gate 0 preflight, rating pipeline, analytics, \"If Purchases Enabled\", URL scheme) \u2014 passe no brief a decis\u00e3o de monetiza\u00e7\u00e3o, o scheme esperado **e os 3 momentos-assinatura da se\u00e7\u00e3o 5 do `PRODUCT-SPEC.md`** (cada um com a tela): ele confere no visual pass que cada momento EXISTE na tela capturada; momento ausente ou irreconhec\u00edvel = NEEDS WORK.\n2. Build + install no simulador \u2192 `qa-runner` com bundle id + checklist derivado das business rules da Fase 1 **+ o cen\u00e1rio de paywall/trial se o app monetiza** (onboarding passa pelo preview de valor e termina no paywall, semanal + anual vis\u00edveis, trial S\u00d3 no plano-her\u00f3i com dura\u00e7\u00e3o e pre\u00e7o p\u00f3s-trial no CTA e a timeline acima dele, sem toggle, fecha ap\u00f3s o cooldown, compra no `.storekit` vira premium + tela p\u00f3s-compra com pedido de push, restore em Settings, gate abre o `PaywallProPromptSheet`) **+ o cen\u00e1rio de deep link** (`xcrun simctl openurl <udid> <app>://home` abre a tela principal). Corrige \ud83d\udc1b, re-roda cen\u00e1rios que falharam.\n3. **Auditoria adversarial** das features que entraram **ad-hoc / fora do plano original** (add-ons durante o dev, features desacopladas/religadas do Gate Report): \u00e9 a\u00ed que bugs de integra\u00e7\u00e3o se escondem. Passe essas features espec\u00edficas por um `qa-runner`/`polish-reviewer` com brief hostil (\"tente quebrar X integrando com Y\").\n4. **Instrumenta\u00e7\u00e3o**: `analytics-instrumentor` com o app dir + \"full canonical set\" + a defini\u00e7\u00e3o do core_action \u2192 confirma no realtime do GA4 que `first_open`, `onboarding_completed` e `core_action` chegam, e que `review_prompt_requested` sai quando o ramo \u00e9 for\u00e7ado (contador `gck.review.positiveCount` semeado no plist do container \u2014 gatilho condicional s\u00f3 se valida for\u00e7ando o ramo, LEARNINGS #85). Sem isso o app nasce cego (ativa\u00e7\u00e3o/reten\u00e7\u00e3o imensur\u00e1veis) \u2014 e a Apple rankeia por esses sinais desde 2026.\n- S\u00f3 avan\u00e7a quando polish = READY, QA sem \ud83d\udc1b aberto e `spec/pre-release-checklist.md` sem item aberto (\u00e9 o mesmo checklist que a Fase 7 exige antes do archive \u2014 n\u00e3o deixe pra descobrir l\u00e1).\n- **Voc\u00ea ret\u00e9m**: veredito READY + lista de bugs fechados.\n\n## Fase 6 \u2014 Screenshots (delega \u2192 skill `code-driven-prints`)\nApp novo = s\u00f3 Treatment A (A/B \u00e9 post-launch via `/generate-a-b-test`). Invoque a skill `code-driven-prints` apontando pro app; ela faz o scaffold do tool self-contained, recria as 5 telas de marketing como SwiftUI puro, renderiza por locale via ImageRenderer e sobe pra default product page. Segue o LOOK can\u00f4nico do RULES.\n- **Voc\u00ea ret\u00e9m**: confirma\u00e7\u00e3o dos 5 PNGs por locale + upload.\n\n## Fase 7 \u2014 Archive & Submit prep (COORDENADOR, inline)\n1. **Percorra o Gate Report da Fase 3** e o `spec/pre-release-checklist.md` (Gate 0 = `preflight.py`): cada gate que bloqueia archive tem que estar resolvido OU desacoplado (plano B) antes de arquivar.\n1b. **Featuring nomination \u2014 OPCIONAL, n\u00e3o rotina** (Jo\u00e3o 27/09: testar uma primeiro; `spec/product-playbook.md` \u00a710): se o app tem argumento nos 7 crit\u00e9rios da Apple (UX, UI, inova\u00e7\u00e3o, unicidade, acessibilidade, localiza\u00e7\u00e3o, product page), ofere\u00e7a ao Jo\u00e3o rodar `scripts/asc/nominate.py --app-id N --name ... --description-file ...` (rascunho; `--submit` envia) com 2 semanas a 3 meses de anteced\u00eancia. N\u00e3o crie nem envie sem ele pedir.\n2. **Archive = LOCAL, via agente `release-runner`, S\u00d3 quando o Jo\u00e3o pede** (LEARNINGS #0, decis\u00e3o de 30/08/2026 \u2014 o lab n\u00e3o paga GitHub Actions): Xcode mais novo (`/Applications/Xcode 2.app`), cloud signing pela ASC API key, checklist do plist COMPILADO (`CFBundleIconName` raiz, LEARNINGS #52) e `preflight.py` antes do export; a tag `release/N` \u00e9 s\u00f3 hist\u00f3rico. Build aparece na ASC como VALID em ~5-15 min. Nunca arquive por iniciativa pr\u00f3pria (hook release-guard).\n3. **Checklist final API vs web-UI-only** (do Gate Report): anexar build \u00e0 v1.0, Pricing, App Privacy questionnaire, Content Rights = **web-UI, manual pelo Jo\u00e3o** \u2192 liste juntos como o que falta. Bundle ID / capabilities / metadata / screenshots = j\u00e1 feitos via API.\n4. **Launch playbook** (entregar junto com a lista manual \u2014 fonte: `_GambitStudio/aso/reference/aso-ranking-playbook.md` \u00a72-3, a janela dos primeiros 7 dias n\u00e3o volta):\n   - Release **seg-qua** (n\u00e3o fim de semana).\n   - **Primeiras 5 reviews nas 72h** (rede/comunidades do nicho); 15-20 em 4 semanas.\n   - **ASA Discovery $5-15/dia na semana 1** \u2014 gera conversion data por keyword + velocity.\n   - **Day 7-14**: rotacionar o keywords field pro segundo set low-diff que a Fase 2 deixou pronto (`metadata/_research/keywords_round2_<locale>.txt`); name/subtitle N\u00c3O mudam no primeiro m\u00eas.\n   - Depois disso, ASO cont\u00ednuo = `/start-aso-pipeline`.\n- **Voc\u00ea ret\u00e9m**: status do archive + a lista final de a\u00e7\u00f5es manuais pro Jo\u00e3o.\n\n---\n\n## Environment (antes da Fase 6/7)\n```bash\nAPP_STORE_CONNECT_KEY_ID\nAPP_STORE_CONNECT_ISSUER_ID\nAPP_STORE_CONNECT_KEY_PATH\n```\n\n## Hard rules (mais violadas \u2014 set completo em `_GambitStudio/spec/` e RULES.md)\n- Todo c\u00f3digo em ingl\u00eas; s\u00f3 conte\u00fado `.xcstrings` \u00e9 traduzido.\n- M\u00e1x. 300 linhas/arquivo Swift; MARK obrigat\u00f3rio; sem `#Preview`.\n- Esquema de cor \u00daNICO decidido no PRODUCT-SPEC (light OU dark): `.preferredColorScheme` fixo no @main, Asset Catalog sem variante Dark, sem toggle em Settings, sem `@AppStorage(\"appearanceMode\")` (Jo\u00e3o 27/09/2026 \u2014 RULES.md + `spec/design-system.md` \"Visual Style\"); shadows s\u00f3 `.black`; backgrounds via ZStack; touch targets \u226544\u00d744pt.\n- Bot\u00e3o que dispara permission prompt (c\u00e2mera/Health/notifica\u00e7\u00f5es/Family Controls) ou StoreKit (compra/restore) \u2192 estado de loading no tap at\u00e9 a completion (spinner no lugar do CTA + `.disabled`, reset em todos os caminhos). Regra em `spec/design-system.md` \u2192 Async system requests.\n- Monetiza\u00e7\u00e3o \u00e9 decis\u00e3o da Fase 1, registrada no spec com motivo (Jo\u00e3o 27/09/2026 \u2014 v1 pode monetizar). Com paywall: `PaywallKit` + StoreKit 2 (nunca RevenueCat, nunca `PurchaseService` custom), soft no fim do onboarding, semanal + anual, **trial em UM plano decidido pelo plano-her\u00f3i** (utilit\u00e1rio: semanal 3 d; h\u00e1bito: anual 7 d; nunca \u2264 4 d no anual, nunca toggle de trial), timeline do trial + lembretes, tela p\u00f3s-compra, Restore em Settings. Sem paywall: gr\u00e1tis com o motivo escrito. Nunca `FeatureFlags.premiumEnabled`; mock s\u00f3 no `screenshots-tool/`.\n- Todo app registra `CFBundleURLTypes` (`<app>://`) e trata `.onOpenURL` abrindo o conte\u00fado principal (LEARNINGS #94).\n- Onboarding = features \u2192 2-3 perguntas de personaliza\u00e7\u00e3o \u2192 preview de valor \u2192 dados/permiss\u00e3o configurada no fluxo (primer de 1 bot\u00e3o) \u2192 paywall (se houver), com barra de progresso. Prompt de review s\u00f3 nativo, no aha (RULES).\n- SEMPRE xcodegen, nunca editar `project.pbxproj` \u00e0 m\u00e3o; packages via `url:`+`branch:main`.\n- Device f\u00edsico primeiro (`xcrun xctrace list devices`), fallback simulador.\n- Description termina com o footer padr\u00e3o Privacy + Terms em todo locale.\n";</script><script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script><script>document.getElementById("md").innerHTML=window.marked?marked.parse(RAW):"<pre>"+RAW.replace(/</g,"&lt;")+"</pre>";</script></div><script>
