/* ---------- camada de acabamento (01/10/2026) ----------
   Tipografia com duas vozes (display para títulos e números, texto para leitura),
   neutros com viés do azul da marca em vez de cinza puro, e profundidade por
   sombra em vez de só borda. Nada aqui renomeia classe: é uma camada por cima. */
:root{
  --f-disp:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --f-text:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --bg:#eef1f7; --card:#ffffff; --tx:#0a0d14; --mut:#4b5567; --acc:#2b3340;
  --bd:#cbd3e0; --bd-soft:#dfe5ee; --ok:#07804e; --down:#c42121; --warn:#9a4408;
  --sh:0 1px 2px rgba(16,19,26,.05),0 2px 8px rgba(16,19,26,.04);
  --sh-up:0 2px 6px rgba(16,19,26,.07),0 10px 24px rgba(16,19,26,.07);
  --bar:#2563eb; --bar2:#60a5fa;
  --rad:14px;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#07090d; --card:#141922; --tx:#f7f9fc; --mut:#b2bdd0; --acc:#ccd6e6;
  --bd:#333c4c; --bd-soft:#232a36; --ok:#55e39d; --down:#ff8585; --warn:#ffbb55;
  --sh:0 1px 2px rgba(0,0,0,.4); --sh-up:0 6px 22px rgba(0,0,0,.5);
  --bar:#5b9bff; --bar2:#9dc4ff;
}}
body{font-family:var(--f-text);font-size:14.5px;line-height:1.6;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1{font-family:var(--f-disp);font-size:27px;font-weight:800;letter-spacing:-.02em;
  text-wrap:balance;margin:0 0 2px}
h1 .mark{display:inline-block;width:28px;height:28px;vertical-align:-5px;margin-right:11px;
  background-size:contain;background-repeat:no-repeat;background-position:center}
h2{font-family:var(--f-disp);font-size:12px;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;color:var(--mut);border-top:1px solid var(--bd-soft);
  padding-top:22px;margin:32px 0 14px}
h3{font-family:var(--f-disp);letter-spacing:-.01em}
.sub{font-size:13px;color:var(--mut)}
code,.mono{font-family:var(--f-mono);font-size:12.5px}
.card,table.t,a.tile,.row,.fcard,#md{box-shadow:var(--sh);border-color:var(--bd-soft)}
.card,a.tile,.row,.fcard{border-radius:var(--rad)}
a.tile,.row{transition:box-shadow .16s ease,border-color .16s ease,transform .16s ease}
a.tile:hover,a.row:hover{box-shadow:var(--sh-up);border-color:var(--bd);
  transform:translateY(-1px)}
/* O card do app é área de leitura, não botão: nada muda no hover. A regra antiga
   trocava a sombra, e num card sem sombra isso aparecia como animação. */
.fcard,.fcard:hover{transition:none!important;transform:none!important}
/* big numbers: the first thing anyone reads on the page */
.tiles{gap:12px;margin:18px 0 4px}
a.tile{padding:13px 17px;min-width:148px}
.tile .tl{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
  color:var(--mut)}
.tile .tv{font-family:var(--f-disp);font-size:25px;font-weight:800;letter-spacing:-.025em;
  margin-top:3px}
.tile .ts{font-size:11.5px;color:var(--mut)}
/* tables read as data, not as prose */
table.t{border-radius:var(--rad);font-variant-numeric:tabular-nums}
table.t th{font-family:var(--f-disp);font-size:11px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;background:var(--bd-soft);border-bottom:1px solid var(--bd)}
table.t td{padding:9px 13px;border-bottom:1px solid var(--bd-soft)}
table.t tbody tr:hover td,table.t tr:hover td{background:rgba(125,140,170,.06)}
.twrap{border-radius:var(--rad)}
/* buttons */
.btn{font-family:var(--f-disp);font-weight:600;font-size:13.5px;padding:9px 18px;
  border-radius:999px;box-shadow:var(--sh);transition:all .16s ease}
.btn:hover{border-color:var(--acc);box-shadow:var(--sh-up);transform:translateY(-1px)}
.pill,.st{font-family:var(--f-disp);font-weight:600;font-size:11.5px;letter-spacing:.02em}
/* status colours carry meaning, so keep them out of the accent */
.st.run,.st.appr{background:rgba(10,143,88,.14);color:var(--ok)}
.st.crit{background:rgba(208,47,47,.14);color:var(--down)}
.st.rev,.st.draft{background:rgba(180,83,9,.14);color:var(--warn)}
/* the lanes strip and any scroller get a thin, rounded bar */
.hrow,.twrap{scrollbar-width:thin;scrollbar-color:var(--bd) transparent}
.hrow::-webkit-scrollbar,.twrap::-webkit-scrollbar{height:9px}
.hrow::-webkit-scrollbar-track,
.twrap::-webkit-scrollbar-track{background:transparent}
.hrow::-webkit-scrollbar-thumb,
.twrap::-webkit-scrollbar-thumb{background:var(--bd);border-radius:999px;
  border:3px solid transparent;background-clip:content-box}
.hrow::-webkit-scrollbar-thumb:hover,
.twrap::-webkit-scrollbar-thumb:hover{background:var(--mut);background-clip:content-box}
.hrow{background:transparent;border:0;padding:0;border-radius:0}
.hcol{flex:0 0 clamp(280px,26vw,360px);min-width:0}
a:focus-visible,button:focus-visible,.btn:focus-visible{outline:2px solid var(--acc);
  outline-offset:2px;border-radius:8px}
.dirlist,.prlist{margin:10px 0 0;padding-left:18px;list-style:none}
.dirlist>li,.prlist>li{position:relative;margin:0 0 7px;font-size:13.5px;line-height:1.5;
  color:var(--tx)}
.prlist>li{color:var(--mut);font-size:13px;margin-bottom:5px}
.dirlist>li::before,.prlist>li::before{content:"";position:absolute;left:-14px;top:.62em;
  width:5px;height:5px;border-radius:50%;background:var(--acc);opacity:.75}
.prlist>li::before{background:var(--mut);opacity:.5}
.dirp{display:none}
.dapps{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));
  margin:14px 0 4px;align-items:start}
.dapp{padding:14px 16px}
.dah{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.dah b{font-family:var(--f-disp);font-size:14.5px;font-weight:700}
.drank{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;
  border-radius:6px;background:var(--acc);color:var(--card);font-size:11.5px;font-weight:700;flex:none}
.st.d-dobrar{background:rgba(10,143,88,.16);color:var(--ok)}
.st.d-consertar{background:rgba(180,83,9,.16);color:var(--warn)}
.st.d-manter{background:rgba(125,140,170,.16);color:var(--mut)}
.st.d-congelar{background:rgba(125,140,170,.12);color:var(--mut)}
.dapp .prlist{margin-top:6px}
.dcall{color:var(--tx)!important;font-weight:600}
.fcard[id]{scroll-margin-top:18px}
.fdet{margin-top:10px;border-top:1px solid var(--bd-soft);padding-top:9px}
.fdet>summary{cursor:pointer;list-style:none;font-family:var(--f-disp);font-size:11.5px;
  font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);
  display:flex;align-items:center;gap:7px}
.fdet>summary::-webkit-details-marker{display:none}
.fdet>summary::before{content:"›";font-size:15px;transition:transform .15s}
.fdet[open]>summary::before{transform:rotate(90deg)}
.fdet>summary:hover{color:var(--acc)}
.fdet table.t{font-size:12.5px}
.fdet table.t td,.fdet table.t th{padding:6px 10px}
.fgrid.one{grid-template-columns:1fr!important;gap:18px}
/* Cada app é um painel com profundidade: a luz entra por cima, o corpo escurece
   até a base e a borda clareia só na primeira linha. É o que separa um app do
   outro sem precisar de moldura dura. */
.fgrid.one>.fcard{position:relative;padding:0;overflow:hidden;border-radius:16px;
  border:1px solid var(--bd-soft);
  background:linear-gradient(180deg,
    color-mix(in srgb, var(--acc) 5%, var(--card)) 0%,
    var(--card) 26%,
    color-mix(in srgb, #000 7%, var(--card)) 100%);
  box-shadow:0 1px 2px rgba(0,0,0,.05), 0 10px 26px -14px rgba(0,0,0,.28)}
@media(prefers-color-scheme:dark){.fgrid.one>.fcard{
  background:linear-gradient(180deg,
    color-mix(in srgb, var(--acc) 9%, var(--card)) 0%,
    var(--card) 30%,
    #0a0c10 100%);
  box-shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 18px 40px -22px rgba(0,0,0,.9)}}
.fgrid.one>.fcard::before{content:"";position:absolute;inset:0 0 auto;height:1px;
  background:linear-gradient(90deg, transparent,
    color-mix(in srgb, var(--acc) 45%, transparent), transparent)}
.fgrid.one>.fcard>.fh{background:transparent;margin:0;padding:15px 18px 12px;
  border-bottom:1px solid var(--bd-soft)}
.fgrid.one>.fcard>.fstats{padding:12px 18px 0}
.fgrid.one>.fcard>.fcols{padding:16px 18px 6px}
.fgrid.one>.fcard>.fdet{margin:0;padding:13px 18px 16px;border-top:1px solid var(--bd-soft);
  background:color-mix(in srgb, #000 4%, transparent)}
@media(prefers-color-scheme:dark){.fgrid.one>.fcard>.fdet{
  background:rgba(0,0,0,.25)}}
.fgrid.one>.fcard>.fh b{font-size:16px;letter-spacing:-.01em}
.fgrid.one>.fcard>.fh>span{font-size:12.5px;color:var(--tx);opacity:.78;
  font-variant-numeric:tabular-nums;font-weight:500}
/* a luz no topo do painel, um pouco mais presente */
.fgrid.one>.fcard::before{height:2px;
  background:linear-gradient(90deg, transparent, var(--acc), transparent);opacity:.5}
.fcard .fmeta{font-size:12px;color:var(--mut)}
/* funil: rótulo legível, número com peso, barra com corpo */
.fs{display:grid;grid-template-columns:150px 1fr auto;align-items:center;gap:12px;
  padding:5px 0}
.fs .fl{font-size:12.5px;color:var(--tx)}
.fs .fn{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;min-width:74px;
  text-align:right}
.fb{height:9px;border-radius:999px;background:var(--bd-soft);overflow:hidden}
.fb i{display:block;height:100%;border-radius:999px}
/* retenção com leitura imediata */
.rrow{margin:0}
.rc:first-child{border-top:0;padding-top:0}
/* o rótulo é legenda; quem salta é o número, na cor da régua */
.rc b{display:block;font-family:var(--f-disp);font-size:10px;font-weight:700;
  letter-spacing:.09em;text-transform:uppercase;color:var(--mut);margin:0}
.rc .rv{display:block;font-family:var(--f-disp);font-size:21px;font-weight:800;
  letter-spacing:-.025em;line-height:1.15;margin:3px 0 2px;font-variant-numeric:tabular-nums}
.rc>b{font-family:var(--f-disp);font-size:12px;font-weight:700;letter-spacing:.04em;
  color:var(--mut)}
.rc .rv{font-family:var(--f-disp);font-size:19px;font-weight:800;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums}
.rc .rb{display:block;font-size:11.5px;color:var(--mut)}
/* achados: mais ar e marcador claro */
.fnds li{font-size:12.5px;line-height:1.5;padding:4px 0 4px 16px}
.fnds li:before{width:6px;height:6px;top:.72em}
/* o detalhe convida a abrir */
.fdet>summary{font-size:11px;color:var(--acc);padding:3px 0}
.fdet>summary:hover{opacity:.82}
.fcols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;
  align-items:start}
@media(max-width:820px){.fcols{grid-template-columns:1fr;gap:12px}}
.fcol{min-width:0}
.fcol>.fnds{margin-top:0}
/* Régua de contexto do app: instalações, ativos, novos, crash-free. Antes isso
   era uma linha de texto corrido ("187 downloads/30d · WATCH · crash-free
   100%") que ninguém comparava entre cards; como números rotulados, dá pra
   varrer a coluna de cima a baixo. */
.fstats{display:flex;flex-wrap:wrap;gap:10px 26px;align-items:baseline}
.fst{display:flex;align-items:baseline;gap:7px;min-width:0}
.fstl{font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:var(--mut)}
.fst b{font-family:var(--f-disp);font-size:15px;font-weight:700;letter-spacing:-.015em;
  font-variant-numeric:tabular-nums}
.fstd{font-size:12px;font-weight:600}
.st.vd{background:rgba(125,140,170,.14);color:var(--mut)}
.fh .noasc{font-size:11.5px;font-weight:400;color:var(--warn)}
/* Cada metade do card diz o que é antes de mostrar número. */
.fgrp{margin-bottom:16px}
.fgrp:last-child{margin-bottom:0}
.fgl{display:block;font-family:var(--f-disp);font-size:10.5px;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;color:var(--mut);
  padding-bottom:7px;margin-bottom:10px;border-bottom:1px solid var(--bd-soft)}
.fcol>.fgrp>.fnds{margin-top:0}
.instrl{list-style:none;margin:9px 0 0;padding:0}
.instrl li{font-size:12.5px;line-height:1.55;color:var(--mut);padding:3px 0 3px 14px;
  position:relative;overflow-wrap:anywhere}
/* Coluna de leitura: linhas rotuladas, sem caixa. As caixas coloridas (funil
   verde, ação amarela) e o bloco expansível empilhavam quatro objetos de forma
   diferente num espaço estreito; rótulo à esquerda e texto à direita, separados
   por uma régua fina, lê de cima a baixo sem nada competindo (João, 02/10). */
.rline{display:grid;grid-template-columns:116px minmax(0,1fr);gap:16px;
  padding:12px 0;border-top:1px solid var(--bd-soft)}
.rline:first-child{border-top:0;padding-top:0}
.rlab{font-family:var(--f-disp);font-size:10.5px;font-weight:700;letter-spacing:.07em;
  text-transform:uppercase;color:var(--mut);padding-top:2px}
.rbody{min-width:0}
.rbody>b{display:block;font-family:var(--f-disp);font-size:14px;font-weight:700;
  letter-spacing:-.01em;line-height:1.35}
.rnum{display:block;margin-top:3px;font-size:12px;font-weight:600;color:var(--tx);
  font-variant-numeric:tabular-nums}
.rbody>p{margin:5px 0 0;font-size:12.5px;line-height:1.55;color:var(--mut)}
.rline.act .rlab{color:var(--tx)}
.rline.mut .rlab,.rline.mut .instrl li{color:var(--mut)}
.rbody>.fnds{margin:0}
@media(max-width:1180px){.rline{grid-template-columns:1fr;gap:6px}
  .rline .rlab{padding-top:0}}
.instrl{list-style:none;margin:0;padding:0}
.instrl li{font-size:12.5px;line-height:1.55;color:var(--mut);padding:2px 0 2px 14px;
  position:relative;overflow-wrap:anywhere}
.instrl li::before{content:"";position:absolute;left:0;top:.72em;width:5px;height:5px;
  border-radius:50%;background:var(--bd)}
/* Os passos de loja vêm de outra fonte que os de dentro do app: barra em tom
   mais surdo pra o olho ver onde a medição troca de sistema. */
.fs .fb i.store{background:linear-gradient(90deg,
  color-mix(in srgb, var(--bar) 45%, transparent),
  color-mix(in srgb, var(--bar) 70%, transparent))}
.fsub{display:block;font-size:10.5px;font-weight:600;letter-spacing:.07em;
  text-transform:uppercase;color:var(--mut);margin-bottom:6px}
.fsub.gap2{margin-top:14px}
.lchip{font-size:10px;color:var(--mut);background:var(--bd-soft);border-radius:999px;
  padding:1px 7px;cursor:help;white-space:nowrap}
.fcols{position:relative}
@media(min-width:821px){.fcols::before{content:"";position:absolute;top:0;bottom:0;
  left:50%;width:1px;background:var(--bd-soft)}}
.fdet .ascgrid{grid-template-columns:repeat(auto-fit,minmax(118px,1fr))}
.fdetcols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;
  align-items:start}
@media(max-width:1100px){.fdetcols{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:760px){.fdetcols{grid-template-columns:1fr}}
.fdetcols>div{min-width:0;display:flex;flex-direction:column;gap:14px}
.rawbox{background:var(--bg);border:1px solid var(--bd-soft);border-radius:11px;
  padding:11px 13px;min-width:0}
.rawbox h4,.rawbox h3.team{margin:0 0 8px;font-family:var(--f-disp);font-size:10.5px;
  font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--mut)}
.rawbox h3.team .chain{text-transform:none;letter-spacing:0;font-size:11px}
.rawbox table.t{border:0;box-shadow:none;background:transparent}
.rawbox table.t th{background:transparent;border-bottom:1px solid var(--bd)}
.rawbox table.t td{border-bottom:1px solid var(--bd-soft)}
.rawbox .twrap{border-radius:0}
.rawbox .ascgrid{margin-bottom:0;grid-template-columns:repeat(auto-fit,minmax(104px,1fr))}
.rawbox .ascgrid b{font-size:14px}
.srct{float:right;font-size:9px;font-weight:700;letter-spacing:.06em;padding:2px 7px;
  border-radius:999px;background:var(--bd);color:var(--mut);text-transform:uppercase}
.s-asc{background:rgba(125,140,170,.16);color:var(--tx)}
.s-firebase{background:rgba(180,83,9,.14);color:var(--warn)}
.noasc{background:rgba(180,83,9,.14);color:var(--warn);border-radius:999px;padding:1px 8px;
  font-size:10.5px;font-weight:600}
.convwhy{display:block;font-size:10.5px;color:var(--mut);margin-top:1px}
.rawbox .rate{padding:1px 7px;border-radius:999px;font-size:12.5px}
.featname{display:block;font-family:var(--f-mono);font-size:11.5px;margin-bottom:3px}
.featbar{display:block;height:4px;border-radius:999px;background:var(--bd-soft);overflow:hidden}
.featbar i{display:block;height:100%;border-radius:999px;
  background:linear-gradient(90deg, color-mix(in srgb, var(--acc) 70%, transparent), var(--acc))}
.legacyp{margin:8px 0 0;font-size:12px;color:var(--mut);line-height:1.7}
.legacyp code{font-size:11px}
.rawbox .ascgrid>div{background:var(--card)}
.fdet{margin-top:14px;border-top:1px solid var(--bd);padding-top:12px}
.fdet[open]>summary{margin-bottom:12px;color:var(--acc)}
.t .thsub{font-size:9.5px;font-weight:600;letter-spacing:.03em;color:var(--mut);
  text-transform:none}
.t .rate{padding:1px 8px;border-radius:999px;font-variant-numeric:tabular-nums}
.t .rate.good{background:rgba(10,143,88,.16);color:var(--ok)}
.t .rate.mid{background:rgba(180,83,9,.14);color:var(--warn)}
.t .rate.low{background:rgba(208,47,47,.13);color:var(--down)}
.thin{font-size:10.5px;color:var(--mut);background:var(--bd-soft);border-radius:999px;
  padding:1px 7px;cursor:help;white-space:nowrap}
.sbx{font-size:12px;color:var(--warn);background:rgba(180,83,9,.12);border-radius:999px;
  padding:1px 8px;cursor:help;white-space:nowrap}
.sbxnote{font-size:11.5px;color:var(--warn);background:rgba(180,83,9,.10);
  border:1px solid rgba(180,83,9,.25);border-radius:9px;padding:7px 10px;margin:0 0 10px}
.actv{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 9px;margin:0 0 10px;
  padding:8px 11px;border-radius:10px;background:var(--bd-soft)}
.actvt{font-family:var(--f-disp);font-size:10px;font-weight:800;letter-spacing:.09em;
  text-transform:uppercase;color:var(--mut)}
.actv b{font-family:var(--f-disp);font-size:15px;font-variant-numeric:tabular-nums}
.actvw{flex-basis:100%;font-size:11px;color:var(--mut)}
.fover{font-size:10.5px;color:var(--warn);background:rgba(180,83,9,.12);border-radius:999px;
  padding:1px 7px;cursor:help;white-space:nowrap}
.hspan{display:inline-block;margin-left:10px;font-size:10.5px;font-weight:600;letter-spacing:.04em;
  text-transform:none;color:var(--mut);background:var(--bd-soft);padding:2px 9px;border-radius:999px;
  vertical-align:2px}
.ascspan{font-size:11px;color:var(--mut);margin:2px 0 7px}
.ascgrid{display:grid;gap:7px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
  margin-bottom:10px}
.ascgrid>div{background:var(--bd-soft);border-radius:9px;padding:7px 10px;min-width:0}
.ascgrid span{display:block;font-size:10px;color:var(--mut);text-transform:uppercase;
  letter-spacing:.04em}
.ascgrid b{font-family:var(--f-disp);font-size:15px;font-variant-numeric:tabular-nums}
.fcard[id]:target{border-color:var(--acc);box-shadow:0 0 0 2px rgba(125,140,170,.3),var(--sh-up)}
/* ---------- acabamento: luz e profundidade (01/10) ----------

<body><header class=top><div class=topin><a class=brand href="../index.html"><span class=mark></span>GambitStudio</a><nav class=navs><a class="nav" href="../index.html">Agora</a><a class="nav" href="../business.html">Business Analysis</a><a class="nav" href="../aso.html">ASO</a><a class="nav" href="../vendas.html">Seller</a></nav><span class=stamp>atualizado 02/10 03:13</span></div></header><div class="wrap"><p class="sub"><code>_GambitStudio/aso/reference/store-page-playbook.md</code></p><div id="md"></div><script>const RAW="# Store Page Playbook \u2014 a camada App Store (antes de entrar no app)\n\n> Funil que este arquivo cobre: **impress\u00e3o na busca \u2192 tap \u2192 product page \u2192 install**.\n> Compilado de varredura web 2026-08-07 e corrigido pela pesquisa de 2026-09-27\n> (`research-2026-09-conversion.md`, 22 achados com fonte e tag de evid\u00eancia \u2014 onde este\n> arquivo e a pesquisa divergirem, vale a pesquisa). Irm\u00e3o do `aso-ranking-playbook.md`\n> (aquele = ser ENCONTRADO; este = CONVERTER quem te achou).\n> CR de impress\u00e3o t\u00edpica no iOS: 3-8% (AppTweak EUA 2025: 3,8% impress\u00e3o\u2192download,\n> 8,56% page view\u2192download); a r\u00e9gua que vale \u00e9 o peer group do pr\u00f3prio app no ASC (\u00a77).\n> Leitura obrigat\u00f3ria de `/code-driven-prints`, `/panorama-prints` e de quem prop\u00f5e Name/\u00edcone.\n\n## Atualiza\u00e7\u00e3o 2026-09-27 (pesquisa)\n\nO que mudou neste arquivo, com o achado que motivou (#N = `research-2026-09-conversion.md`):\n\n- **\u00cdcone: uplift corrigido (#3).** O \"22,8% m\u00e9dio\" saiu \u2014 a fonte citada (AppTweak) n\u00e3o traz\n  esse n\u00famero e a SplitMetrics n\u00e3o publica amostra. R\u00e9gua nova: **3-6% de mediana no iOS** em\n  teste de \u00edcone; caso raro 20%+ e s\u00f3 com mudan\u00e7a \"bold\". \u00cdcone custa um release e vem DEPOIS\n  de prints e nota (\u00a72).\n- **Captions N\u00c3O s\u00e3o indexadas como fato (#8).** Teste controlado da ConsultMyApp (64 frases\n  de 8 apps): nenhuma evid\u00eancia forte; a Apple nunca confirmou. A keyword entra no print 1 por\n  **message match**, n\u00e3o por ranking (\u00a73).\n- **V\u00eddeo continua \"n\u00e3o\" para utilit\u00e1rios (#10).** Vendors: utilities/produtividade \"usually\n  do not\" ganham; v\u00eddeo fraco custa 10-15%; zero estudo controlado por categoria (\u00a74).\n- **A r\u00e9gua de CVR era uma defini\u00e7\u00e3o errada (#16).** \"33,4% tap\u2192install / 42-56% top quartil\"\n  \u00e9 agrega\u00e7\u00e3o de vendor sobre page views. A CR da Apple \u00e9 **downloads \u00f7 impress\u00f5es \u00fanicas**,\n  e a r\u00e9gua que vale \u00e9 o **p25/p50/p75 do peer group** no ASC App Analytics (web-only) \u2014\n  passo 0 do \u00a77.\n- **PPO ganha gate de poder (#1, #2).** Tabela de impress\u00f5es por bra\u00e7o para +10%/+20%/+30% a\n  3/5/8% de CR, procedimento de decis\u00e3o por faixa de tr\u00e1fego, \"nunca promover com < 14 dias\n  / < n por bra\u00e7o\", resultados do ASC web salvos em `results/` no dia do stop, e **apps abaixo\n  do piso publicam a arte direto em vez de testar** (\u00a73b). `templates/fastlane/upload_ppo.py\n  --power-check` (default ON) recusa experimento que n\u00e3o fecha +20% em 90 dias. Contexto: a\n  auditoria de 27/09 achou 42 experimentos, **0 resultados em disco** e 12 vencedores\n  promovidos com \u2264 3 dias de dados \u2014 s\u00f3 2 dos 20 apps t\u00eam tr\u00e1fego para medir alguma coisa.\n- **\"At\u00e9 3 treatments\" virou \"1 treatment, swing grande\" (#2).** Com `trafficProportion 50`,\n  3 treatments recebem 16,7% cada: o mesmo teste demora 3\u00d7 (\u00a73b).\n- **CPP por keyword org\u00e2nica (#12).** iOS 26: at\u00e9 70 p\u00e1ginas por app, keyword atribu\u00edda sem\n  review (a metadata da p\u00e1gina passa por review, independente de build). S\u00f3 o print 1 muda,\n  headline = a query literal; medir sequencial antes/depois, **nunca CPP \u00d7 default** (\u00a78).\n- **IAP promovido (#18).** At\u00e9 20, aparece na busca, imagem 1024 pr\u00f3pria, nome com a dura\u00e7\u00e3o.\n  Obrigat\u00f3rio em app com assinatura (\u00a79).\n- **In-App Events (#14).** Para quem j\u00e1 tem o app, o card substitui os prints na busca; quem\n  n\u00e3o tem continua vendo prints. Re-engajamento e anexo de nomination, n\u00e3o aquisi\u00e7\u00e3o (\u00a710).\n- **Header / Creative Asset do iOS 27 (#13).** WWDC26: imagem ou v\u00eddeo no topo da p\u00e1gina E na\n  busca, selecion\u00e1vel por keyword, us\u00e1vel em CPP/PPO/Ads. Estado: **preparar**, n\u00e3o apostar (\u00a711).\n- **Promotional text \u00e9 alavanca de convers\u00e3o gr\u00e1tis (#17).** Sem review, sem build, primeira\n  linha vis\u00edvel da p\u00e1gina \u2014 e estava **vazio em 13 apps do lab** (auditoria 27/09) (\u00a75).\n- **3 primeiros prints, refor\u00e7ado com n\u00famero (#4, #7).** A SERP mostra 3 portrait (1 se o\n  primeiro asset for landscape/v\u00eddeo); 50% decidem na 1\u00aa impress\u00e3o e **60% n\u00e3o rolam al\u00e9m do\n  fold** (Storemaven, 500 M sess\u00f5es, 2021 \u2014 dado antigo, o \u00fanico com amostra). Benefit-first\n  por default; **feature-first + sinal de confian\u00e7a no print 1** em privacidade/seguran\u00e7a/\n  finan\u00e7a (#6). Caption \u2264 7 palavras, 3-5 em destaque (#5) (\u00a73).\n- **Rating (#15).** Responder review em \u2264 72 h (Health & Fitness: +1,39\u2605 ap\u00f3s resposta,\n  AppFollow 2026); nunca resetar a nota com vers\u00e3o nova (\u00a76).\n- **Incerto, sem dado: dark \u00d7 light nos prints, nota real dentro do print (#9), lift de\n  localiza\u00e7\u00e3o (#22), efeito da CPP na busca org\u00e2nica (#12).** Ficam como hip\u00f3tese de\n  treatment, nunca como regra (\u00a712).\n\n**O que N\u00c3O mudou:** o LOOK can\u00f4nico dos prints (fundo s\u00f3lido de marca, verb-split, breakout\ncom glow na paleta do app, app real dentro do mockup, 5 prints distintos) fica inteiro. Nenhum\nachado traz DADO contra ele \u2014 o que existe \u00e9 opini\u00e3o de vendor sobre frame \u00d7 frameless (#6, o\npr\u00f3prio autor admite \"working hypotheses\"); \"app real dentro do mockup\" \u00e9 o que a Apple pede\n(asset best practices: \"show the app in use\", conte\u00fado populado bate mockup vazio).\n\n## O estilo GambitStudio (calibra tudo abaixo)\n\nApps de **uso individual**, achados por **busca** na App Store, em **nichos com brecha de termos**.\nConsequ\u00eancias pr\u00e1ticas:\n\n- **100% do funil \u00e9 a SERP do termo-alvo.** N\u00e3o existe tr\u00e1fego de marca/social \u2014 o \"marketing\"\n  do lab \u00c9 a p\u00e1gina da loja. Todo investimento de arte/copy se mede em CR da busca.\n- **Name = keyword-first, marca como sufixo curto.** Ningu\u00e9m vai buscar a marca; ela existe pra\n  ser pronunci\u00e1vel e memor\u00e1vel DEPOIS do install. `Fun\u00e7\u00e3o Fun\u00e7\u00e3o: Marca` ou `Marca: fun\u00e7\u00e3o fun\u00e7\u00e3o`\n  com marca de 1 palavra \u2014 o peso 7\u00d7 vai todo pras palavras do nicho.\n- **Message match com a query**: quem busca \"sunrise alarm\" precisa ver o print 1 falando de\n  sunrise alarm \u2014 n\u00e3o um benef\u00edcio gen\u00e9rico de dormir melhor. O headline do print 1 responde\n  literalmente \u00e0 busca que trouxe o usu\u00e1rio. \u00c9 por ISSO que a keyword-alvo entra na caption\n  (convers\u00e3o), n\u00e3o por indexa\u00e7\u00e3o (#8) \u2014 e \u00e9 a premissa da CPP por keyword (\u00a78).\n- **A r\u00e9gua \u00e9 o nicho, n\u00e3o a App Store inteira.** Em nicho fragmentado/junky (o tipo de brecha\n  que a gente escolhe), o padr\u00e3o de prints da casa j\u00e1 supera a m\u00e9dia \u2014 o diferencial vem de\n  (a) responder a inten\u00e7\u00e3o melhor que o l\u00edder e (b) nota \u2265 a dele. O competitor-scout d\u00e1 a r\u00e9gua.\n- **Nota pesa dobrado**: usu\u00e1rio de nicho compara 3-4 apps lado a lado na mesma busca; a nota \u00e9\n  o desempate mais vis\u00edvel da SERP.\n\n## 0. A SERP em n\u00fameros (o que decide o jogo antes do tap)\n\n**Por que ela \u00e9 tudo:** busca = **65% da descoberta no iOS** (>70% dos visitantes da App Store\nusam busca; browse = 18%, referrer = 12%, ads = 5%). No modelo GambitStudio, arredonda pra 100%.\n(Personalized Collections/App Notes do iOS 26 (#13) podem reduzir essa fatia com o tempo \u2014 sem\nn\u00famero ainda; a alavanca continua sendo reten\u00e7\u00e3o + nota.)\n\n**O penhasco de posi\u00e7\u00e3o (TTR m\u00e9dio por rank na busca):**\n\n| Posi\u00e7\u00e3o | TTR (tap/impress\u00e3o) |\n|---------|---------------------|\n| #1 | **28,4%** |\n| #2 | 6,2% |\n| #3 | 2,7% |\n| #8-15 | top-3 gera **4,6\u00d7** os installs dessa faixa |\n| >30 | <4% dos installs do termo |\n\n**Consequ\u00eancia estrat\u00e9gica (muda a r\u00e9gua do lab):** a dist\u00e2ncia entre #1 e #2 \u00e9 4,5\u00d7 \u2014 n\u00e3o \u00e9\nlinear. **TOP 1-2 em pouqu\u00edssimos termos ganh\u00e1veis vale mais que TOP 5-10 em muitos.** Na d\u00favida\nentre atacar mais um termo ou consolidar #1 num termo que j\u00e1 est\u00e1 #3, consolidar ganha. (E o slot\nde Apple Ads fica ACIMA do #1 org\u00e2nico \u2014 em termo com brecha, $ m\u00ednimo de ASA no pr\u00f3prio termo\nprotege a posi\u00e7\u00e3o, ver ranking playbook \u00a73.)\n\n**O que aparece na SERP por resultado:** \u00edcone + nome + subtitle + nota + **os 3 primeiros prints\nportrait** (iPad mostra 2; landscape ou v\u00eddeo landscape mostraria s\u00f3 1 \u2014 **portrait sempre**,\nregra da casa mantida, #4). O TTR \u00e9 fun\u00e7\u00e3o desses elementos, de nada mais. Os prints aparecem a\n**~40% do tamanho (\u2248 \u00bc da \u00e1rea)** \u2014 headline de 2-3 palavras em fonte grande, no TOPO (o\nverb-split da casa existe por isso, #5). **50% decidem na 1\u00aa impress\u00e3o, 60% n\u00e3o rolam al\u00e9m do\nfold (#7)**: slots 1-3 s\u00e3o o produto; 4-5 s\u00e3o apoio.\n\n**Prioridade de teste por lift (iOS):** 1\u00ba screenshots (vendors: 10-25%; indies auto-reportam\n+5-12 pp trocando o print 1 de nome-de-feature para benef\u00edcio, #6 [anedota]) \u2192 2\u00ba \u00edcone\n(**3-6% de mediana**, #3 \u2014 s\u00f3 com mudan\u00e7a bold, e custa release) \u2192 3\u00ba name/subtitle copy \u2192\n4\u00ba description. Promotional text (\u00a75) e IAP promovido (\u00a79) entram antes do \u00edcone porque custam\nzero release.\n\n## 1. Naming (30 chars, peso ASO 7\u00d7)\n\nPadr\u00e3o vencedor: **`Marca curta: fun\u00e7\u00e3o + fun\u00e7\u00e3o`** (ex: \"Calm: Sleep & Meditation\").\nApple 2025+ flagra nome-an\u00fancio (promocional demais) \u2014 nome \u00e9 produto, n\u00e3o slogan.\n\nO nome precisa passar em **3 testes ao mesmo tempo**:\n1. **Clareza** \u2014 diz o que o app faz em 1 leitura (sem wordplay abstrato; usu\u00e1rio n\u00e3o adivinha).\n2. **Ranking** \u2014 cada palavra al\u00e9m da marca rankeia (peso m\u00e1ximo do \u00edndice; app novo sem marca\n   pode inverter: keyword primeiro, marca depois).\n3. **Memor\u00e1vel/fal\u00e1vel** \u2014 a marca \u00e9 1 palavra curta pronunci\u00e1vel (boca-a-boca e busca por marca).\n\nRegras da casa que continuam valendo: casar com o **naming pattern do nicho** (competitor-scout)\nsem clonar o l\u00edder; nunca trademark (Apple Watch); zero duplica\u00e7\u00e3o com subtitle; **localizar o\nnome** quando o mercado busca em PT/ES (`InfoPlist.xcstrings`); subtitle = copy que vende o wedge,\nn\u00e3o segundo saco de keywords \u2014 e sem \"unverifiable product claims\" (2.3.7, #9).\n\n## 2. \u00cdcone (prioridade 2 \u2014 mediana 3-6% no iOS, #3)\n\n- **1 elemento dominante**, leg\u00edvel a 60px. Minimalismo com profundidade sutil (soft shadow /\n  gradiente leve). Sem texto, sem composi\u00e7\u00e3o complexa.\n- **Contraste com a SERP do nicho**: olhar os \u00edcones dos top 10 (competitor-scout baixa) \u2014 se\n  todos s\u00e3o azuis, testar o accent da nossa paleta. Diferencia\u00e7\u00e3o na lista > beleza absoluta.\n- Coer\u00eancia \u00edcone \u2194 prints \u2194 LaunchScreen (paleta por nicho de RULES.md).\n- **iOS 26 (#11):** Icon Composer, 6 modos (default/dark/clear/tinted \u00d7 light/dark), template\n  \u00fanico 1024, m\u00e1scara arredondada \u2014 manter o essencial nos **70% centrais**. Clear/tinted apagam\n  a cor de marca: a **silhueta** tem que se sustentar sozinha. Nenhum dado de convers\u00e3o por\n  variante existe.\n- **Quando testar:** s\u00f3 por PPO, s\u00f3 com mudan\u00e7a bold (a Apple exige todas as variantes no\n  bin\u00e1rio publicado \u2014 custa um release), e **s\u00f3 depois** de prints + nota. Tom de azul n\u00e3o\n  fecha nunca (#2); espere 3-6%, n\u00e3o 20%.\n\n## 3. Screenshots (a maior alavanca da p\u00e1gina)\n\nO LOOK can\u00f4nico da casa (verb-split, breakout com glow, 5 prints distintos, 3 primeiros = main\nfeatures \u2014 detalhe em `/code-driven-prints`) cobre a forma. Sobre o CONTE\u00daDO:\n\n- **Benefit framing por default** \u2014 headline diz o que o usu\u00e1rio GANHA (\"Nunca mais perca X\"),\n  n\u00e3o o que o app tem (\"Alarme com sensor\"). Value first, features second. **Exce\u00e7\u00e3o por nicho\n  (#6):** privacidade/seguran\u00e7a/finan\u00e7a preferem **feature-first + sinal de confian\u00e7a** no\n  print 1 (o que o app faz, literalmente, mais um sinal verific\u00e1vel \u2014 criptografia, biometria,\n  \"sem conta\"); o device frame ajuda nesses nichos. Frameless venceu em fitness/food/social/\n  produtividade \u2014 opini\u00e3o de vendor, sem teste controlado: vira hip\u00f3tese de treatment, n\u00e3o regra.\n- **Caption \u2264 7 palavras, 3-5 em destaque, no TOPO (#5)** \u2014 a \u00bc do tamanho na SERP, mais que\n  isso n\u00e3o se l\u00ea. O budget por chars do `/code-driven-prints` continua valendo; o de palavras\n  entra em cima.\n- **Captions: message match, n\u00e3o indexa\u00e7\u00e3o (#8).** A keyword-alvo entra no print 1 porque o\n  usu\u00e1rio precisa reconhecer a query que digitou \u2014 a indexa\u00e7\u00e3o do texto do print \u00e9 evid\u00eancia\n  fraca (Appfigures diz sim, ConsultMyApp testou e n\u00e3o achou). Custo zero, ganho de ranking n\u00e3o\n  comprovado: **n\u00e3o desenhar print para rankear.**\n- **O que a Apple pro\u00edbe no print (#9):** pre\u00e7o, desconto, URL, s\u00edmbolo de copyright, pr\u00eamios\n  e reconhecimentos n\u00e3o verific\u00e1veis, Editor's Choice/App of the Day/ADA (j\u00e1 aparecem sozinhos),\n  e \"usar o asset inteiro para acolada geral ou call-to-action\". Nota real (\"4,8 \u2605\") \u00e9\n  verific\u00e1vel, mas \u00e9 \"accolade\" e envelhece \u2014 ver \u00a712.\n- **O vencedor costuma ser o framing \"n\u00e3o-\u00f3bvio\"**: o angle que parece certo internamente perde\n  com frequ\u00eancia pra um benefit framing que n\u00e3o shippar\u00edamos sem teste. Em todo PPO, o treatment\n  \u00e9 uma tese DIFERENTE (medo vs aspira\u00e7\u00e3o, social proof vs feature), n\u00e3o troca de cor.\n- **\"Aut\u00eantico\" pode ganhar de polido** em nicho consumer \u2014 1 treatment estilo raw/user-generated\n  vale o slot quando o polido estagnar (o panorama por IA \u00e9 esse treatment, n\u00e3o o default).\n- **PPO: 1 treatment + controle, swing grande, 90 dias max, 1 vari\u00e1vel clara** \u2014 e s\u00f3 depois\n  do gate de poder (\u00a73b). Texto de name/subtitle/promo N\u00c3O se testa por PPO (#17): testa-se\n  via print 1 ou sequencialmente.\n\n### 3c. Gate visual \u2014 o que reprova um print antes de subir (27/09/2026)\n\nCinco prints code-driven chegaram na loja com o breakout cortando componente ao meio e\nmostrando o mesmo placar duas vezes, mais um slot ocupado por um formul\u00e1rio de configura\u00e7\u00e3o\n(\"uma parte focada muito mal recortada, n\u00e3o profissional\"). A causa era estrutural, n\u00e3o do\napp: o breakout era recorte por n\u00famero da IMAGEM da tela, e ningu\u00e9m olhava o PNG antes do\nupload \u2014 a \u00fanica verifica\u00e7\u00e3o era dimens\u00e3o e contagem. Tr\u00eas regras, execut\u00e1veis no\n`/code-driven-prints`:\n\n- **Breakout = view do componente, nunca recorte de bitmap.** O pop-out \u00e9 o componente REAL\n  renderizado sozinho, em escala, com borda + glow na cor prim\u00e1ria; a tela marca esse mesmo\n  componente (`.breakoutSource()`) e o kit posiciona o card sobre a pr\u00f3pria regi\u00e3o dele e\n  escurece o que fica embaixo \u2014 lupa sobre a pr\u00f3pria se\u00e7\u00e3o: nada cortado, nada duas vezes\n  (LEARNINGS #87b). Posi\u00e7\u00e3o derivada do componente, nunca n\u00famero escolhido \u00e0 m\u00e3o.\n- **Formul\u00e1rio de sistema nunca ocupa um slot.** Tela de configura\u00e7\u00e3o com campos de texto ou\n  Form padr\u00e3o do iOS n\u00e3o vende nada e parece prot\u00f3tipo. O slot 5 \"utilidade\" s\u00f3 entra como\n  utilidade com cara de produto (widget, atalho, resumo); se o app n\u00e3o tem uma, o slot vira a\n  5\u00aa feature.\n- **Gate visual antes do upload, obrigat\u00f3rio.** O agente abre cada PNG renderizado (a sheet e\n  os thumbs a 110 px de `tools/prints/gate_sheet.py` \u2014 o tamanho do print na lista de busca) e\n  pontua o checklist: componente cortado pela borda do breakout, duplicata sob o breakout, UI\n  n\u00e3o relacionada coberta, formul\u00e1rio de sistema, headline ileg\u00edvel a 110 px, drift da tela\n  real, cor fora da paleta. O veredito por print fica em `screenshots-tool/out/visual-gate.md`\n  e `gate_sheet.py --check` trava o upload enquanto houver FAIL ou crit\u00e9rio sem resposta.\n\n## 3b. PPO \u2014 procedimento de decis\u00e3o (gate de poder, #1, #2)\n\n**0. O que a Apple mede.** CR = **downloads \u00f7 impress\u00f5es \u00fanicas de device** (n\u00e3o page views).\n\"Performing Better/Worse\" s\u00f3 aparece com **\u2265 90% de confian\u00e7a** (bayesiano, atualizado\ndiariamente); \"Likely to be Inconclusive\" quando o tr\u00e1fego n\u00e3o chega l\u00e1 em 90 dias; o teste s\u00f3\naparece no Analytics com \u2265 5 first-time downloads atribu\u00eddos. Apple: lift de 30% fecha em\npoucas semanas; de 1-5% pode nunca fechar. O lift por tratamento s\u00f3 existe no **ASC web** (a\nAPI d\u00e1 CVR de p\u00e1gina, n\u00e3o por bra\u00e7o).\n\n**1. Amostra por bra\u00e7o** (teste de duas propor\u00e7\u00f5es, 90% de confian\u00e7a unilateral, 80% de poder \u2014\n\u00e9 a tabela do #2; `upload_ppo.py` reproduz):\n\n| CR base (impress\u00e3o) | +10% | +20% | +30% |\n|---|---|---|---|\n| 3% | 30.561 | 7.991 | 3.707 |\n| 5% | 17.939 | 4.686 | 2.171 |\n| 8% | 10.839 | 2.826 | 1.307 |\n\n**Dias = n \u00f7 (impress\u00f5es \u00fanicas/dia \u00d7 fatia do bra\u00e7o menor).** Com `trafficProportion 50`:\n1 treatment = 50% por bra\u00e7o; 2 = 25% cada; 3 = 16,7% cada \u2014 **3 treatments custam 3\u00d7 o tempo\ndo mesmo teste**. `templates/fastlane/upload_ppo.py --power-check` (default ON; `--no-power-check`\navisa e ignora) faz essa conta com o funil de 28 d do `tools/lab-dashboard/data/dashboard.json`\n(app ausente \u2192 \"sem dados de impress\u00e3o \u2014 n\u00e3o verificado\" e segue) e **recusa (exit 2) quando\n+20% n\u00e3o fecha em 90 dias**. Rodar `/refresh-lab-data` antes se o dashboard estiver velho.\n\n**2. Faixa de tr\u00e1fego \u2192 o que fazer** (1 treatment a 50%, CR de impress\u00e3o 3-6%):\n\n| impress\u00f5es \u00fanicas/dia | +20% fecha em | +10% fecha em | decis\u00e3o |\n|---|---|---|---|\n| \u2265 1.000 | ~1 semana | ~4 semanas | PPO normal: 1 treatment, tese n\u00e3o-\u00f3bvia; m\u00ednimo 14 dias; d\u00e1 pra ler +10% |\n| 200-1.000 | 3-10 semanas | > 90 dias | PPO s\u00f3 com swing grande (+20-30%): hero/arte do print 1, nunca ordem ou tom; 1 treatment |\n| < 200 | > 90 dias | nunca | **N\u00c3O testar.** Publicar a arte no LOOK can\u00f4nico direto na default page (custa vers\u00e3o nova, LEARNINGS #73) e comparar CR de impress\u00e3o antes/depois em janelas de 4 semanas no ASC |\n\nNa auditoria de 27/09, 2 dos 20 apps do lab est\u00e3o na 1\u00aa faixa, 1 na 2\u00aa e os outros 17 abaixo\ndo piso \u2014 e foi assim que 12 \"vencedores\" sa\u00edram de testes de \u2264 3 dias: PPO usado como canal de\npublica\u00e7\u00e3o sem release, chamado de teste.\n\n**3. Runtime m\u00ednimo e promo\u00e7\u00e3o.** Nunca promover com **< 14 dias** (2 ciclos de semana) NEM com\n**menos impress\u00f5es \u00fanicas por bra\u00e7o do que a linha da tabela** para o lift que se est\u00e1\nreivindicando \u2014 e s\u00f3 com \"Performing Better\" da pr\u00f3pria Apple (\u2265 90%). Sem os tr\u00eas, o resultado\n\u00e9 ru\u00eddo. Se mesmo assim for promover (app abaixo do piso usando o PPO para publicar sem\nrelease), escrever `mode: publish` no `meta.json` do experimento e n\u00e3o chamar de vencedor.\n\n**4. No dia do stop, salvar o ASC web em `results/`.** Copiar no mesmo dia para\n`ppo-pipeline/experiments/<exp>/results/asc_web_<data>.json`: por bra\u00e7o, impress\u00f5es \u00fanicas, CR,\nlift %, confian\u00e7a/label da Apple e `startDate`/`endDate`; `winner` + `mode` no `meta.json`.\nExperimento sem `results/` n\u00e3o conta como aprendizado \u2014 a pr\u00f3xima rodada repete hip\u00f3tese j\u00e1\nderrubada (0 de 42 tinham, 27/09).\n\n**5. Abaixo do piso, o teste \u00e9 de p\u00e1gina, n\u00e3o de PPO:** trocar \u2192 esperar a vers\u00e3o ir ao ar \u2192\n4 semanas \u2192 comparar CR de impress\u00e3o (e a posi\u00e7\u00e3o contra o p50 do peer group, \u00a77 passo 0) com\nas 4 semanas anteriores. Registrar do mesmo jeito em `results/` da pasta do experimento.\n\n## 4. Preview video \u2014 default: N\u00c3O fazer (#10)\n\nVendors: +20-40% em apps visuais/complexos; **utilities, dev tools e produtividade \"usually do\nnot\" ganham**; v\u00eddeo fraco custa 10-15%; 2 previews curtos > 1 de 30 s. Zero estudo controlado\npor categoria. Apple s\u00f3 pede \"compelling visuals in the first few seconds\" e poster frame forte\n(trocar o poster = resubmiss\u00e3o). Preview portrait ocupa o **slot 1 da SERP** com autoplay mudo\n(#4) \u2014 ou seja, um v\u00eddeo fraco custa o print mais importante.\n**Regra GambitStudio: sem video por padr\u00e3o**; considerar s\u00f3 em app visualmente espetacular\n(ex: AR) e SEMPRE via PPO com o gate do \u00a73b, nunca direto na default page.\n\n## 5. Description + promotional text\n\n- Description n\u00e3o indexa no iOS \u2014 \u00e9 **copy de convers\u00e3o** pra quem expande: 1\u00ba par\u00e1grafo = pitch\n  completo (o resto quase ningu\u00e9m l\u00ea). Benefit-led, espec\u00edfico, termina no footer padr\u00e3o.\n- **Promotional text (170) \u00e9 alavanca de convers\u00e3o GR\u00c1TIS (#17):** muda **sem review e sem\n  build** na vers\u00e3o live, \u00e9 a primeira linha vis\u00edvel da p\u00e1gina, ~70 chars vis\u00edveis no mobile.\n  N\u00e3o indexa (n\u00e3o move ranking) \u2014 o efeito \u00e9 marginal por app, o custo \u00e9 zero, e estava vazio\n  em 13 apps do lab (auditoria 27/09, ~40 mil impress\u00f5es/m\u00eas somadas). Regra: **preencher em\n  TODOS os locales com metadata pr\u00f3pria**, benef\u00edcio + prova em \u2264 70 chars na frente; o\n  `/code-driven-prints` escreve por locale na hora do upload; item do pre-release checklist.\n  Texto da ASC \u00e9 decis\u00e3o do Jo\u00e3o (mem\u00f3ria 08/09) \u2014 propor, ele aprova.\n- **Dono (01/10/2026, reforma da camada de ASO, FAILURES F18):** description, promotional text e\n  whatsNew de app publicado s\u00e3o do est\u00e1gio 5b, agente `aso-listing-writer`. Ele escreve em\n  `proposed/listing/<locale>/{description,promotional_text,whats_new}.txt` pra TODO locale com\n  metadata pr\u00f3pria e s\u00f3 entrega com `scripts/verify/listing_check.py` exit 0; quem aplica \u00e9 o\n  `aso-deployer`, com autoriza\u00e7\u00e3o. App novo: `aso-copywriter`, mesma r\u00e9gua. R\u00e9gua (C1-C9 de\n  `conversion-benchmarks-2026.md` \u00a73):\n  - **1\u00aa frase \u2264 170 chars vendendo o ganho ou a dor** (s\u00f3 ela \u00e9 lida sem \"mais\"; 0/6 l\u00edderes\n    abrem com nome de feature).\n  - **\"Gr\u00e1tis\" sempre com o que \u00e9 pago no mesmo texto** em app com IAP; nunca \"100%/totalmente\n    gr\u00e1tis\" (2.3.2; 3/3 l\u00edderes qualificam). Era \"100% gr\u00e1tis\" com paywall em 12 locales.\n  - **S\u00f3 feature alcan\u00e7\u00e1vel de uma tela** (`scripts/aso/reachability.py`, Swift e Dart) \u2014\n    \"a classe existe\" n\u00e3o \u00e9 prova (F37: filtro de per\u00edodo e calend\u00e1rio eram c\u00f3digo morto).\n  - **Feature-chave dos prints 1-3 citada em 100% dos locales** (o widget faltava em 20 de 29).\n  - **whatsNew nunca vazio** a partir da 1.0.1 (bloqueia a submiss\u00e3o, F28), do que mudou de\n    verdade no build, no estilo `/release-notes-style`.\n  - **en-US com p\u00fablico + resultado + encaixe nos primeiros par\u00e1grafos** \u2014 alimenta as Tags e\n    as respostas de LLM externo, e \u00e9 a p\u00e1gina de toda storefront sem listing pr\u00f3prio.\n  - Promo que existe no ar nunca some na vers\u00e3o nova (F27: 16 locales perderam).\n  - **Paywall que promete o que o app n\u00e3o entrega \u00e9 c\u00f3digo do app**, n\u00e3o ASO: vira\n    `paywall_findings.md` + item `do` (F38: 3 benef\u00edcios prometidos, 1 existe).\n- **Prints, lado determin\u00edstico:** `scripts/aso/print_audit.py <set-dir>` \u2014 sem alpha (Apple\n  pro\u00edbe desde 08/07/2026), headline no ter\u00e7o superior do print 1 leg\u00edvel no thumbnail e no\n  idioma do locale (C11), prints 1-5 distintos por dHash e sem palavra de paywall/onboarding nos\n  1-3 (C12), sem outra loja/pre\u00e7o (C8). O julgamento \"vende ganho, n\u00e3o nome de feature\" (C13)\n  continua com o `print-copywriter`.\n\n## 6. Rating (aparece na SERP; <4.0 mata a CR)\n\n- Pedir review no **momento de sucesso** (ReviewService do GambitCoreKit), nunca no launch.\n  `requestReview` at\u00e9 3\u00d7 por 365 dias (#15).\n- Primeiras 5 estrelas nas 72h do launch (rede) \u2014 ver ranking playbook \u00a73.\n- **Responder reviews em \u2264 72 h (#15):** a Apple notifica o autor, que pode editar a nota;\n  AppFollow 2026 (92,9 M reviews): reply rate m\u00e9dia 24,2%, **Health & Fitness +1,39\u2605 ap\u00f3s\n  resposta**, janela \u00fatil 72 h. A resposta tamb\u00e9m \u00e9 p\u00fablica e converte quem l\u00ea.\n- **Nunca resetar a nota** com vers\u00e3o nova \u2014 a Apple desaconselha e nossos apps t\u00eam poucas.\n- Limiares: 3,6\u21924,2 \u2248 +60% de convers\u00e3o (AppTweak 2025); \u22120,3\u2605 = +19% de CPI em games.\n  \"< 500 ratings: volume primeiro\" \u00e9 opini\u00e3o de vendor \u2014 a regra do lab (rating-first < 25) fica.\n\n## 7. Checklist de diagn\u00f3stico quando a CR est\u00e1 ruim\n\n**Passo 0 \u2014 a r\u00e9gua \u00e9 o peer group do pr\u00f3prio app (#16).** No ASC App Analytics \u2192 Benchmarks:\nCR = downloads \u00f7 impress\u00f5es \u00fanicas, percentis 25/50/75 do peer group (categoria + modelo de\nneg\u00f3cio + faixa de downloads), semanal, **web-only**. S\u00f3 abre trabalho de p\u00e1gina em app\n**abaixo do p50** da pr\u00f3pria categoria; acima do p75, a alavanca \u00e9 ranking, n\u00e3o convers\u00e3o.\nLer mensalmente nos apps com receita. N\u00e3o existe r\u00e9gua externa: 3,8% (impress\u00e3o), 8,56%\n(page view), 25-33% (agregadores) e 47-66% (Apple Ads) descrevem coisas diferentes.\n\n1. Impressions OK mas taps baixos \u2192 problema de **SERP**: \u00edcone/nome/3 primeiros prints/nota.\n2. Taps OK mas installs baixos \u2192 problema de **p\u00e1gina**: prints 4-5, promo text, description,\n   IAP promovido, pre\u00e7o do nicho.\n3. Nota <4.2 \u2192 prioridade absoluta \u00e9 a nota, n\u00e3o os prints (nada compensa nota vermelha).\n4. Tudo OK e CR parada \u2192 trocar a p\u00e1gina (abaixo do piso) ou PPO com tese n\u00e3o-\u00f3bvia (\u00a73, \u00a73b);\n   \u00edcone por \u00faltimo (\u00a72).\n5. Termo-alvo com tr\u00e1fego e CR fraca \u2192 CPP por keyword (\u00a78), medida sequencial.\n\n## 8. Custom Product Pages por keyword org\u00e2nica (#12)\n\nDesde 30/07/2025 (vis\u00edvel a usu\u00e1rios iOS 26+): at\u00e9 **70 CPPs por app**, cada keyword atribu\u00edda\na UMA p\u00e1gina, e a keyword tem que estar no campo keywords da vers\u00e3o. Atribuir keyword **n\u00e3o\npassa por review**; a metadata da p\u00e1gina passa (independente de build). Apple: \"+2,5 pp /\n156% sobre a CR m\u00e9dia de 1,6%\" \u2014 \u00e9 tr\u00e1fego REFERIDO (ads/links), n\u00e3o busca org\u00e2nica. AppTweak:\n+5,9% CVR em apps n\u00e3o-game que usam CPP, sem isolar o canal.\n\nRegra do lab:\n- **S\u00f3 o print 1 muda** \u2014 headline = a query literal (message match), prints 2-5, \u00edcone e LOOK\n  iguais. `/code-driven-prints --variant <keyword>` re-renderiza s\u00f3 o print 1;\n  `/panorama-prints` re-legenda s\u00f3 o painel 1 da mesma arte.\n- 2-3 termos-alvo por app pagador, os que **j\u00e1 rankeiam** (protection map da ASO) \u2014 CPP n\u00e3o\n  cria ranking, aproveita o que existe.\n- **Medir sequencial**: CR de impress\u00e3o do termo antes/depois (4 semanas), **nunca CPP \u00d7 default**\n  (o tr\u00e1fego \u00e9 diferente \u2014 AppTweak CPP Framework).\n- Deploy e verifica\u00e7\u00e3o via API (`appCustomProductPages` + vers\u00e3o + localizations + sets +\n  `PATCH` da keyword), upload com reconcilia\u00e7\u00e3o por checksum (LEARNINGS #57c). S\u00f3 quando o\n  Jo\u00e3o pedir; registrar keyword \u2192 p\u00e1gina \u2192 data no `ppo-pipeline/` do app.\n\n## 9. IAP promovido (#18) \u2014 obrigat\u00f3rio em app com assinatura\n\nAt\u00e9 **20 por app**; aparece na p\u00e1gina, \"can display in search results\" e pode ser destacado na\nToday. Exige **imagem 1024\u00d71024 pr\u00f3pria** (n\u00e3o \u00e9 print: arte flat na paleta do app, sem pre\u00e7o,\nsem texto que envelhe\u00e7a), nome \u2264 30 com a **dura\u00e7\u00e3o** (\"Premium anual\"), descri\u00e7\u00e3o \u2264 45;\nconsum\u00edvel n\u00e3o entra na busca. Conferir via API que est\u00e1 `APPROVED` e ordenado (anual\nprimeiro). Entra no pre-release checklist (`spec/pre-release-checklist.md`) e o\n`/code-driven-prints` gera a imagem no mesmo LOOK. Offer codes cobrem tamb\u00e9m consum\u00edveis/\nn\u00e3o-consum\u00edveis (WWDC25) \u2014 ferramenta de reten\u00e7\u00e3o, n\u00e3o de p\u00e1gina.\n\n## 10. In-App Events (#14) \u2014 fora da pipeline de aquisi\u00e7\u00e3o\n\nAparecem na p\u00e1gina, na busca e nas abas Today/Apps; at\u00e9 10 publicados, 31 dias, promovido 14\ndias antes; t\u00edtulo (30) e short description (50) indexados. **Para quem J\u00c1 tem o app, o card\ndo evento substitui os prints na busca; quem n\u00e3o tem continua vendo prints** \u2014 logo o efeito\nem aquisi\u00e7\u00e3o \u00e9 nulo por constru\u00e7\u00e3o. Nenhum benchmark de convers\u00e3o por categoria existe. Uso no\nlab: re-engajamento (conte\u00fado novo, desafio) e **anexo de nomination de featuring** (#20). N\u00e3o\nabrir IAE \"para converter\".\n\n## 11. Header / Creative Asset do iOS 27 (#13) \u2014 preparar, n\u00e3o apostar\n\nWWDC26: (a) **Creative Assets / \"Header\"** (ex-Feature Banner) para todos: imagem ou v\u00eddeo no\ntopo da p\u00e1gina **e nos resultados de busca**, selecion\u00e1vel por keyword, us\u00e1vel em CPP, PPO e\nApple Ads \u2014 **n\u00e3o substitui** os prints da busca, \u00e9 asset adicional; (b) **Asset Library**:\nprints/previews/headers com review independente de build (muda o fluxo de LEARNINGS #73 \u2014\natualizar quando a ASC liberar); (c) Product Page Preview no ASC; (d) submiss\u00e3o agrupada\nIAP + IAE + CPP + PPO. Propor\u00e7\u00e3o, review e placements por keyword s\u00f3 ficam claros no outono.\nO que o lab faz agora: `/code-driven-prints` e `/panorama-prints` sabem gerar um **frame\n\"header\"** no mesmo LOOK (fundo s\u00f3lido + verb-split + breakout, propor\u00e7\u00e3o a confirmar), guardado\nem `source/` do experimento e **n\u00e3o enviado**. Primeiro uso = 1 treatment de PPO com header,\ns\u00f3 em app que passe no gate do \u00a73b.\n\n## 12. Incerto \u2014 hip\u00f3teses de treatment, nunca regra\n\n- **Indexa\u00e7\u00e3o do texto dos prints (#8):** Appfigures diz sim, ConsultMyApp n\u00e3o achou, Apple\n  nunca confirmou. N\u00e3o desenhar print para ranking.\n- **Lifts de \u00edcone e de localiza\u00e7\u00e3o (#3, #22):** os n\u00fameros mais repetidos (22,8%; 15-25%;\n  35-50%) n\u00e3o t\u00eam amostra publicada ou v\u00eam de p\u00e1gina comprometida. Ordem de grandeza\n  plaus\u00edvel, precis\u00e3o nula. Localizar prints continua regra da casa por message match, n\u00e3o\n  pelo n\u00famero.\n- **Nota real dentro do print (\"4,8 \u2605 \u00b7 1.200 avalia\u00e7\u00f5es\"):** verific\u00e1vel, logo n\u00e3o \u00e9\n  \"unverifiable claim\", mas 2.3.7 e a asset guidance desencorajam \"accolades\"; zero dado em\n  nicho pequeno. Se testar, s\u00f3 via PPO (com gate) e nunca com n\u00famero que vai envelhecer.\n- **Dark \u00d7 light nos prints:** zero dado controlado; vendors s\u00f3 dizem \"teste nos dois fundos da\n  loja\". O fundo s\u00f3lido de marca da casa fica; testar o outro modo \u00e9 treatment.\n- **Frame \u00d7 frameless (#6):** vendor, sem teste controlado. O mockup da casa fica.\n- **CPP em busca org\u00e2nica (#12):** o 156% da Apple \u00e9 tr\u00e1fego referido; sem n\u00famero p\u00fablico para\n  org\u00e2nico.\n- **Review summaries (#15):** s\u00f3 ingl\u00eas, EUA + 8 storefronts, s\u00f3 apps com muitas reviews \u2014 sem\n  efeito medido; irrelevante para pt/es por ora.\n- **iPhone Duo (#21):** display novo na classe 6.9\" com upload \"later this year\" \u2014 pode exigir\n  set pr\u00f3prio.\n\n---\n\n## Fontes\n\nVarredura 2026-09-27: `research-2026-09-conversion.md` (22 achados, cada um com link, data e\ntag [Apple oficial] / [estudo com dados] / [opini\u00e3o de vendor] / [anedota] / [c\u00e1lculo pr\u00f3prio]).\n\nVarredura 2026-08-07 (mantidas onde a pesquisa n\u00e3o contradiz):\n\n- [ASOMobile \u2014 Screenshots 2025 complete guide](https://asomobile.net/en/blog/screenshots-for-app-store-and-google-play-in-2025-a-complete-guide/) \u2014 CR +20-35% via prints; 1\u00ba print move 15-30% [opini\u00e3o de vendor]\n- [LaunchShots \u2014 Do screenshot A/B tests work](https://launchshots.app/blog/app-store-screenshot-ab-testing) \u2014 prints > \u00edcone+t\u00edtulo+descri\u00e7\u00e3o somados; vencedor n\u00e3o-\u00f3bvio [opini\u00e3o de vendor]\n- [Strataigize \u2014 What improves conversion 2026](https://www.strataigize.com/blog/app-store-conversion-rate-optimization) \u2014 prioridade iOS: screenshots 10-25% > \u00edcone (mediana 3-6%); video negativo em finance\n- [Apptweak \u2014 App icon design](https://www.apptweak.com/en/aso-blog/how-to-design-an-app-icon) \u2014 1 elemento dominante; caso AppQuantum +21,5% (anedota \u2014 N\u00c3O traz o \"22,8%\" antes atribu\u00eddo a ela)\n- [AppFollow \u2014 ASO Title Playbook](https://appfollow.io/blog/app-store-optimization-title) \u2014 Marca: fun\u00e7\u00e3o+fun\u00e7\u00e3o; app novo keyword-first\n- [MobileAction \u2014 How to name an app](https://www.mobileaction.co/blog/how-to-name-an-app/) \u2014 clareza > wordplay; nome-an\u00fancio flagrado\n- [ASOMobile \u2014 Icon trends 2025](https://asomobile.net/en/blog/app-icon-trends-and-best-practices-2025/) \u2014 minimalismo, legibilidade em tamanho m\u00ednimo\n- [yellowHEAD \u2014 PPO guide](https://www.yellowhead.com/blog/product-page-optimization-and-ios-a-b-testing/) \u2014 mec\u00e2nica (3 treatments, 90 dias); a REGRA do lab \u00e9 1 treatment (\u00a73b)\n- [SplitMetrics \u2014 TTR por posi\u00e7\u00e3o na busca](https://splitmetrics.com/blog/app-store-search-benchmarks-and-tips-on-improving-ranking/) \u2014 #1 28,4% / #2 6,2% / #3 2,7%\n- [DigitalApplied \u2014 ASO statistics](https://www.digitalapplied.com/blog/app-store-optimization-aso-statistics-2026-data) \u2014 busca 65% da descoberta iOS; top-3 = 4,6\u00d7 vs rank 8-15; >30 = <4%\n- [Sensor Tower \u2014 download sources](https://sensortower.com/blog/app-store-download-sources-report-2021) \u2014 ~60% dos downloads globais via busca\n- [SplitMetrics \u2014 screenshot guide](https://splitmetrics.com/blog/app-store-screenshots-aso-guide/) \u2014 SERP mostra 3 prints portrait (2 no iPad) / 1 landscape\n";</script><script
