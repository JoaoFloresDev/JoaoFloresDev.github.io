/* ---------- camada de acabamento (01/10/2026) ----------
   Tipografia com duas vozes (display para títulos e números, texto para leitura),
   neutros com viés do azul da marca em vez de cinza puro, e profundidade por
   sombra em vez de só borda. Nada aqui renomeia classe: é uma camada por cima. */
:root{

  --sh:0 1px 2px rgba(16,19,26,.05),0 2px 8px rgba(16,19,26,.04);
  --sh-up:0 2px 6px rgba(16,19,26,.07),0 10px 24px rgba(16,19,26,.07);
  --cardup:#ffffff; --bdup:#b9c3d4;
  --boardtop:#e9edf5; --boardbot:#e3e8f1;
  --bar:#2563eb; --bar2:#60a5fa;

}
@media(prefers-color-scheme:dark){:root{
  --bg:#07090d; --card:#141922; --tx:#f7f9fc; --mut:#b2bdd0; --acc:#ccd6e6;
  --bd:#333c4c; --bd-soft:#232a36; --ok:#55e39d; --down:#ff8585; --warn:#ffbb55;
  --sh:0 1px 2px rgba(0,0,0,.4); --sh-up:0 6px 22px rgba(0,0,0,.5);
  --cardup:#1d2430; --bdup:#3d4859;
  --boardtop:#0d1218; --boardbot:#090d13;
  --bar:#5b9bff; --bar2:#9dc4ff;
}}

body{background:

h2{position:relative}
h2::after{content:"";position:absolute;left:0;top:0;width:44px;height:2px;
  background:linear-gradient(90deg, var(--acc), transparent)}
h2:first-of-type::after,h1+h2::after,.sub+h2::after{display:none}
a.tile{background:linear-gradient(170deg, color-mix(in srgb, var(--card) 100%, transparent),
  color-mix(in srgb, var(--acc) 5%, var(--card)))}
.fb i,.fs .fb i{background:linear-gradient(90deg,var(--bar),var(--bar2))}
.fgrid.one>.fcard>.fh{background:linear-gradient(180deg,
  color-mix(in srgb, var(--acc) 7%, var(--card)), var(--bd-soft))}
.ascgrid b,.tile .tv{background:linear-gradient(180deg, var(--tx), color-mix(in srgb, var(--tx) 72%, var(--mut)));
  -webkit-background-clip:text;background-clip:text;color:transparent}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
/* ---------- celular (14/10) ----------
   No iPhone a página nunca rola de lado: grade cede a largura pros filhos, tabela
   rola dentro do .twrap, o menu rola dentro da própria faixa. Quadro e big numbers
   seguem numa linha só com rolagem horizontal, em qualquer largura (João, 14/10). */
.cols>*,.cols2>*,.grid>*,.grid4>*,.dapps>*,.fgrid>*{min-width:0}
.board .hrow,.tiles{flex-wrap:nowrap!important;overflow-x:auto}
#md table{display:block;max-width:100%;overflow-x:auto}
#md p,#md li,#md :not(pre)>code{overflow-wrap:anywhere}
img,video{max-width:100%}
@media(max-width:860px){
  .topin{width:calc(100vw - 28px)}
}
@media(max-width:620px){
  /* header do celular (24/10): UMA linha de 52 px — cavalo + abas que rolam de
     lado com encaixe; a data sai do header fixo e vira a 1ª linha da página. */
  .topin{flex-wrap:nowrap;gap:2px;padding:4px 0;
    padding-left:env(safe-area-inset-left,0px)}
  a.brand{flex:none;min-width:44px;min-height:44px;justify-content:center;gap:0}
  a.brand .mark{width:24px;height:24px}
  a.brand .bname{display:none}
  .stamp{display:none}
  .navs{flex:1 1 auto;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;
    -webkit-overflow-scrolling:touch;scroll-snap-type:x proximity;overscroll-behavior-x:contain;
    margin-right:-14px;padding:0 max(14px,env(safe-area-inset-right,0px)) 0 2px;gap:2px;
    -webkit-ma[redigido]:linear-gradient(90deg,#000 calc(100% - 28px),transparent);
    ma[redigido]:linear-gradient(90deg,#000 calc(100% - 28px),transparent)}
  .navs::-webkit-scrollbar{display:none}
  a.nav{flex:none;scroll-snap-align:start;min-height:44px;padding:0 12px;gap:6px;font-size:14px}
  a.nav .flw-mon{width:24px;height:24px}
  .mstamp{display:block;margin:-10px 0 10px;font-family:var(--f-disp);font-size:15px;font-weight:700;color:var(--tx)}
  .mstamp+style+h2,.mstamp+h2{margin-top:6px}
  div.own{padding:6px 12px;margin:0 0 12px;gap:10px}
  div.own img.flw-mon{width:40px;height:40px}
  details.pk-legend{padding:0 14px;margin-bottom:12px}
  details.pk-legend>summary{min-height:44px;padding:11px 0}
  body{font-size:15px;overflow-wrap:break-word}
  h1{font-size:24px}
  .sub,.card p,.row,.dirp,.prw,.nots li,.dirlist>li{font-size:14px}
  table.t td,table.t th{font-size:13.5px}
  table.t td:first-child,table.t th:first-child{min-width:148px}
  #md{padding:16px 14px}
  .board{padding:12px 0 14px;margin-left:0;margin-right:0}
  .boardh{padding:0 14px}
  .board .hrow{padding:12px 14px 12px;scroll-padding:0 14px}
  a.more,.btn{display:inline-flex;align-items:center;min-height:44px}
  .row{min-height:44px}
  .del{min-width:44px;min-height:44px;opacity:.7}
  .iid{position:relative}
  .iid::after{content:"";position:absolute;inset:-12px -8px}
  .fdet>summary,details>summary{min-height:44px}
  .fs{grid-template-columns:minmax(0,118px) minmax(0,1fr) auto}
  .leak,.fnote{margin-left:0}
  /* quadro no celular: rolagem lateral, como quadro (João 14/10, e de novo 25/10: "deixa como quadro que eu
     consigo fazer scroll horizontal, ficou muito extenso na vertical" — o empilhamento de 25/10 saiu).
     Fazer abre o quadro, com o item em trabalho no topo; Backlog fica por último. */
  .board .hcol{order:3}.board .hcol.k-do{order:1}.board .hcol.k-wait{order:2}.board .hcol.k-backlog{order:4}
  .row.working .vwork{flex-wrap:wrap}
  .row .sub{white-space:normal}
  /* big numbers em grade de 2 no celular: nada cortado */
  .tiles{display:grid!important;grid-template-columns:1fr 1fr;overflow-x:visible!important}
  .tiles>.tile,a.tile{min-width:0!important;padding:10px 12px}
  .tile .tv{font-size:clamp(17px,5.4vw,22px)!important;white-space:normal}
}

}

v class=mstamp>atualizado 27/11 15:21</div><style>.dh{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px;margin:4px 0 18px}.dh-back{font:600 14px -apple-system,system-ui,sans-serif;padding:8px 16px;border-radius:999px;border:0;background:#111;color:#fff;cursor:pointer}.dh-mon{display:flex;align-items:center;gap:10px;padding:6px 14px 6px 6px;border:1px solid var(--bd);border-radius:14px;background:var(--card)}.dh-mon>div{display:flex;flex-direction:column}.dh-mon b{font-size:16px}.dh-mon span{font-size:12.5px;color:var(--mut);max-width:34ch}</style><div class=dh><button class=dh-back type=button onclick="history.back()">← voltar</button></div><p class="sub"><code>_GambitStudio/reports/licitacoes/2026-11_SEMAE-Mogi.md</code></p><div id="md"><div class=mdpart data-i="0"></div></div><script>const RAWS=["# Parecer \u2014 SEMAE Mogi das Cruzes \u00b7 Dispensa Eletr\u00f4nica 51/2026 (site institucional, 60 anos)\n\nFeito em 27/11/2026 (sexta, madrugada). Empresa: **Joao Victor Flores da Costa LTDA (Gambit Studio), CNPJ [CNPJ]**: ME, Simples desde 03/08/2026, aberta em 31/07/2026, capital de R$ 1.000. CNAE principal 62.03-1-00, secund\u00e1rio 62.01-5-01. Sede em S\u00e3o Paulo/SP.\n\nFontes: os 14 arquivos do PNCP (compra 2026/247) est\u00e3o em `arquivos/` (PDF + .txt). A errata v\u00e1lida \u00e9 o arquivo 12 (`AVISO_ERRATA_ASSINADA_CORRETO`). Ela s\u00f3 corrige o cabe\u00e7alho dos questionamentos 1-22, que diziam \"Dispensa 79/2026\". **Todas as respostas 1-26 valem para esta dispensa.**\n\n---\n\n## Resumo em 6 linhas\n\n- **Veredito: GO com riscos.** Vale tentar porque tentar custa pouco: o cadastro na BBMNET serve para as pr\u00f3ximas disputas, os documentos que faltam saem hoje online e o lance m\u00ednimo protege o lucro.\n- O maior risco \u00e9 o **atestado de capacidade t\u00e9cnica**. O Aviso pede s\u00f3 portf\u00f3lio, mas o SEMAE respondeu duas vezes que exige \"ambos\" (portf\u00f3lio + atestado). A empresa n\u00e3o tem atestado. Se ficarmos em 1\u00ba, a chance de inabilita\u00e7\u00e3o \u00e9 alta.\n- **O \u00fanico bloqueio de verdade \u00e9 o credenciamento na BBMNET.** Ele precisa estar ativo antes de **segunda 30/11 \u00e0s 08:00**, e s\u00f3 d\u00e1 para resolver em hor\u00e1rio comercial **hoje (sexta)**.\n- **Lance m\u00ednimo: R$ 32.300,00 no global de 12 meses** (R$ 2.691,67/m\u00eas). Abaixo disso n\u00e3o paga as horas com lucro.\n- O lance vencedor prov\u00e1vel fica entre R$ 25 e 34 mil. D\u00e1 para ganhar, mas n\u00e3o \u00e9 garantido.\n\n---\n\n## 1. Onde e como disputar\n\n| Item | O que diz o Aviso |\n|---|---|\n| Plataforma | **BBMNET Licita\u00e7\u00f5es** (Bolsa Brasileira de Mercadorias): `www.novobbmnet.com.br`. Tamb\u00e9m est\u00e1 no portal da Prefeitura e no PNCP (Aviso item 2.1) |\n| Envio da proposta | de 23/11/2026 08:00 at\u00e9 **30/11/2026 (segunda) \u00e0s 08:00**, hor\u00e1rio de Bras\u00edlia |\n| Sess\u00e3o de lances | **30/11/2026, das 08:30 \u00e0s 14:30** |\n| Modo de disputa | **Aberto e sem prorroga\u00e7\u00e3o.** Fecha pontualmente \u00e0s 14:30, sem tempo aleat\u00f3rio (item 4.7.1) |\n| Intervalo m\u00ednimo | **R$ 0,01**, valendo tanto para cobrir o melhor lance quanto para lances intermedi\u00e1rios (4.3.2) |\n| Regras de lance | S\u00f3 \u00e9 poss\u00edvel baixar o pr\u00f3prio \u00faltimo lance (4.3). Valem lances intermedi\u00e1rios. Lance empatado: ganha quem registrou primeiro (4.4). Quem n\u00e3o der lance concorre com o valor da proposta (4.5) |\n| Depois dos lances | Convocado o 1\u00ba colocado: **1 hora** para enviar a proposta ajustada (5.5) e **1 hora** para enviar os documentos de habilita\u00e7\u00e3o (6.1). Quem perder o prazo \u00e9 desclassificado |\n| Exclusividade | \"Dispensa com itens destinados **exclusivamente \u00e0s ME e EPP**\". A empresa \u00e9 ME, ent\u00e3o pode participar |\n| Crit\u00e9rio | Menor pre\u00e7o. Validade da proposta: 60 dias. Sem garantia contratual (7.8) |\n| Valor da proposta \u00d7 lance | Questionamento 24: a **proposta inicial \u00e9 o valor MENSAL**, e o **lance \u00e9 sobre o valor GLOBAL** de 12 meses. Na BBMNET o item deve aparecer com quantidade 12. Tenha os dois n\u00fameros prontos e preencha o que o campo pedir |\n| Custo da plataforma | O licitante paga a BBM pelo uso (2.1.2): plano avulso (um edital) ou peri\u00f3dico. **O pre\u00e7o n\u00e3o \u00e9 p\u00fablico.** Confira no site antes de pagar |\n\n**Cadastro na BBMNET (\u00e9 o bloqueio).** O cadastro \u00e9 feito pelo pr\u00f3prio fornecedor: \"Cadastre-se\" \u2192 \"Licitante (Fornecedor)\" \u2192 CPF do respons\u00e1vel vira o login \u2192 vincular o CNPJ \u2192 escolher o plano \u2192 pagar. Depois disso a pessoa j\u00e1 opera sozinha, sem corretora (guia da Effecti; a BBMNET n\u00e3o publica prazo de aprova\u00e7\u00e3o). A conta s\u00f3 funciona depois que o pagamento compensa: **PIX ou cart\u00e3o = no mesmo dia; boleto = 1 a 3 dias \u00fateis, o que n\u00e3o chega a tempo.** A central de atendimento (e-mail, WhatsApp, telefone, chat em `bbmnet.com.br`) s\u00f3 funciona em hor\u00e1rio comercial, ent\u00e3o **sexta \u00e9 o \u00fanico dia \u00fatil antes do prazo**. Ligue e confirme que a conta est\u00e1 ativa e que a Dispensa 51/2026 do SEMAE aparece para voc\u00ea.\n\n---\n\n## 2. Habilita\u00e7\u00e3o: o que pedem, o que temos e como resolver\n\nO Aviso **n\u00e3o pede** qualifica\u00e7\u00e3o econ\u00f4mico-financeira: nada de balan\u00e7o, \u00edndice de liquidez, capital m\u00ednimo ou patrim\u00f4nio l\u00edquido. Conferi o Aviso, o TR, a minuta e as 26 respostas. Tamb\u00e9m **n\u00e3o pede certid\u00e3o de fal\u00eancia** como documento: \"em processo de fal\u00eancia\" aparece s\u00f3 como condi\u00e7\u00e3o de participa\u00e7\u00e3o (2.2.5).\n\nClassifica\u00e7\u00e3o usada (orienta\u00e7\u00e3o do Jo\u00e3o):\n- **1 = RESOLVE AT\u00c9 O PRAZO** (sai antes de 30/11).\n- **2 = TENTA ASSIM MESMO** (h\u00e1 lacuna, mas o pior caso \u00e9 o SEMAE recusar).\n- **3 = BLOQUEIO** (impede com certeza e n\u00e3o h\u00e1 contorno).\n\n| # | Exig\u00eancia (item do Aviso) | Temos? (`documentos-empresa/`) | Classe | Como resolver e quanto tempo leva |\n|---|---|---|---|---|\n| 0 | Credenciamento na BBMNET (2.1) | N\u00e3o | **1, ou 3 se n\u00e3o ativar** | Cadastro + plano pago por PIX ou cart\u00e3o **na sexta**, com a central confirmando (30-60 min + compensa\u00e7\u00e3o). Se n\u00e3o estiver ativo at\u00e9 segunda 07:30, \u00e9 o \u00fanico bloqueio real |\n| 1 | Contrato social consolidado e altera\u00e7\u00f5es registradas (6.10.2 / 6.10.6) | **N\u00e3o** | 1 | Baixar no portal ou app da Contabilizei (documentos da empresa, registro na JUCESP). Leva minutos. Se n\u00e3o estiver l\u00e1, chamado na Contabilizei na sexta |\n| 2 | Inscri\u00e7\u00e3o no CNPJ (6.11.1) | Sim, `Cartao_CNPJ_emitido-2026-10-30.pdf` | 1 | Serve. Melhor emitir um novo na Receita no pr\u00f3prio dia 30/11 (1 min). Os dados p\u00fablicos batem: ATIVA, ME, Simples, 62.03/62.01 |\n| 3 | Inscri\u00e7\u00e3o municipal/estadual \"se houver\", pertinente \u00e0 atividade (6.11.5) | **N\u00e3o** | 1 | **Municipal:** Ficha de Dados Cadastrais (FDC) do CCM, no site da Prefeitura de SP (online), ou pedir \u00e0 Contabilizei. **Estadual:** a empresa s\u00f3 presta servi\u00e7o e n\u00e3o tem IE. Juntar a consulta Cadesp/Sintegra \"sem IE\" ou uma declara\u00e7\u00e3o de n\u00e3o contribuinte do ICMS |\n| 4 | CND federal RFB/PGFN (6.11.6) | **Sim**, v\u00e1lida at\u00e9 28/04/2027 | ok | Nada a fazer |\n| 5 | CRF do FGTS (6.11.7) | **N\u00e3o** | 1, sen\u00e3o 2 | `consulta-crf.caixa.gov.br`, na hora. **Aten\u00e7\u00e3o:** empresa nova sem empregado pode receber \"informa\u00e7\u00f5es insuficientes\". Se acontecer, abrir chamado na Contabilizei ou na Caixa na sexta. Sem o CRF, entregar a tela da consulta e pedir o prazo da ME (**LC 123 art. 43 \u00a71\u00ba: 5 dias \u00fateis, prorrog\u00e1veis**) |\n| 6 | CNDT trabalhista (6.11.8) | **Sim**, v\u00e1lida at\u00e9 28/04/2027 | ok | Nada a fazer |\n| 7 | Regularidade estadual SP (6.11.9) | **N\u00e3o** | 1 | Duas certid\u00f5es online e na hora. (a) **SEFAZ-SP**: Certid\u00e3o de D\u00e9bitos Tribut\u00e1rios **N\u00e3o Inscritos**, por CNPJ (Posto Fiscal Eletr\u00f4nico). (b) **PGE-SP**: Certid\u00e3o de d\u00e9bitos **inscritos em d\u00edvida ativa** (`dividaativa.pge.sp.gov.br`). Juntar as duas |\n| 8 | Regularidade municipal SP (6.11.10) | **N\u00e3o** | 1 | **Certid\u00e3o Conjunta de D\u00e9bitos de Tributos Mobili\u00e1rios** da Prefeitura de SP (portal de certid\u00f5es, na hora). Se der positiva: art. 43 da LC 123 (classe 2) |\n| 9 | Restri\u00e7\u00e3o fiscal de ME (6.12) | \u2014 | 2 | A ME **tem que apresentar** todos os documentos fiscais, mesmo com restri\u00e7\u00e3o. Ganha 5 dias \u00fateis para regularizar (LC 123 art. 43). Isso cobre certid\u00e3o **positiva**, n\u00e3o documento ausente |\n| 10 | Portf\u00f3lio: \"no m\u00ednimo, 01 (um) projeto de desenvolvimento ou reformula\u00e7\u00e3o de website institucional compat\u00edvel com o objeto\" (6.13.1) | **Em parte** | 2 | Montar um PDF com **gambitstudiotech.com**: site institucional do est\u00fadio, no ar, feito por n\u00f3s, com p\u00e1ginas e guias. Os apps iOS entram s\u00f3 como complemento, porque n\u00e3o s\u00e3o \"website\". Veja a se\u00e7\u00e3o 3 |\n| 11 | **Atestado de capacidade t\u00e9cnica** (TR 4.5.1 e 10.3; respostas 17 e 22) | **N\u00e3o** | **2** | Veja a se\u00e7\u00e3o 3. S\u00f3 vale atestado **verdadeiro**, de pessoa jur\u00eddica que tenha recebido servi\u00e7o real de site ou software |\n| 12 | Declara\u00e7\u00f5es marcadas no sistema (3.8.1-3.8.6) | \u2014 | 1 | Marcar \"sim\" na BBMNET. A 3.8.6 (ME/LC 123) \u00e9 verdadeira: a empresa \u00e9 ME e n\u00e3o tem contratos p\u00fablicos que estourem o limite |\n| 13 | Declara\u00e7\u00f5es do Anexo II + \"equipe t\u00e9cnica apta\" e \"ci\u00eancia do TR\" (TR 4.5.3 / 4.5.4) + declara\u00e7\u00e3o de custos trabalhistas na proposta (3.2.1) | \u2014 | 1 | Preparar num PDF s\u00f3 e assinar pelo gov.br. Assinatura digital \u00e9 aceita (10.11). Leva 1 h |\n| 14 | Proposta (Anexo I) com dados banc\u00e1rios | \u2014 | 1 | Modelo pronto no Aviso. A proposta readequada vai em 1 h depois dos lances |\n| \u2014 | Fal\u00eancia TJSP de PJ | N\u00e3o (o `x_` \u00e9 de pessoa f\u00edsica) | n\u00e3o exigido | N\u00e3o precisa. Se quiser ter para o futuro, o pedido no e-SAJ leva at\u00e9 5 dias |\n| \u2014 | Capital social ou balan\u00e7o | \u2014 | n\u00e3o exigido | Os R$ 1.000 de capital **n\u00e3o atrapalham**. Se um dia algum edital pedir balan\u00e7o: empresa criada no exerc\u00edcio pode apresentar o **balan\u00e7o de abertura** no lugar das demonstra\u00e7\u00f5es (Lei 14.133 **art. 65 \u00a71\u00ba**), assinado pelo s\u00f3cio e pelo contador com CRC (a Contabilizei gera). N\u00e3o precisa aumentar capital agora |\n| \u2014 | No pagamento (n\u00e3o na habilita\u00e7\u00e3o) | \u2014 | depois | Declara\u00e7\u00e3o do Anexo IV da IN RFB 1.234/2012 (optante do Simples), para n\u00e3o sofrer reten\u00e7\u00e3o de IR. CND federal e CRF v\u00e1lidos a cada nota |\n\n**CNAE n\u00e3o \u00e9 bloqueio.** A resposta 26 mostra que o SEMAE confere o CNAE: eles recusaram um MEI com CNAE 95.11 (conserto de computador). O nosso secund\u00e1rio **62.01-5-01, \"Desenvolvimento de programas de computador sob encomenda\"**, j\u00e1 cobre desenvolvimento e manuten\u00e7\u00e3o de site. N\u00e3o precisa alterar nada. Incluir o 62.09-1-00 (suporte t\u00e9cnico em TI) seria um refor\u00e7o opcional para o futuro, mas \u00e9 uma altera\u00e7\u00e3o na JUCESP que leva dias e n\u00e3o muda esta disputa.\n\n**Benef\u00edcios de ME.** A disputa j\u00e1 \u00e9 s\u00f3 entre ME/EPP, ent\u00e3o o empate ficto de 5% (LC 123 art. 44) praticamente n\u00e3o muda nada. O que ajuda de fato \u00e9 a **regularidade fiscal tardia (art. 43)**.\n\n---\n\n## 3. Qualifica\u00e7\u00e3o t\u00e9cnica: o atestado\n\n**O texto que decide:**\n\n- Aviso 6.13.1 (s\u00f3 portf\u00f3lio): *\"A empresa dever\u00e1 apresentar portf\u00f3lio contendo, no m\u00ednimo, 01 (um) projeto de desenvolvimento ou reformula\u00e7\u00e3o de website institucional compat\u00edvel com o objeto da presente contrata\u00e7\u00e3o.\"*\n- TR 4.5.1: *\"A licitante dever\u00e1 apresentar atestado de capacidade t\u00e9cnica demonstrando experi\u00eancia compat\u00edvel com o objeto.\"*\n- TR 10.3: *\"...comprova\u00e7\u00e3o de capacidade t\u00e9cnica mediante apresenta\u00e7\u00e3o de, no m\u00ednimo, 01 (um) atestado de capacidade t\u00e9cnica emitido por pessoa jur\u00eddica de direito p\u00fablico ou privado.\"*\n- TR 4.5.2: *\"Poder\u00e1 ser exigido portf\u00f3lio ou rela\u00e7\u00e3o de sites desenvolvidos, modernizados, mantidos ou hospedados.\"*\n- **Questionamento 17** perguntou se o portf\u00f3lio basta, conforme o Aviso. Resposta: **\"Precisa ser apresentado ambos.\"**\n- **Questionamento 22** perguntou se basta o portf\u00f3lio ou se tamb\u00e9m se exige o atestado. Resposta: **\"Ambos.\"**\n- A favor de tentar: Aviso 10.10, *\"Em caso de diverg\u00eancia entre disposi\u00e7\u00f5es deste Aviso de Dispensa Eletr\u00f4nica e de seus anexos [...] prevalecer\u00e1 as deste aviso\"*. E Aviso 10.8: as regras *\"ser\u00e3o sempre interpretadas em favor da amplia\u00e7\u00e3o da disputa\"*.\n- **A errata n\u00e3o mexe nisso.** Ela s\u00f3 troca o n\u00famero da dispensa no cabe\u00e7alho das respostas.\n\n**O que conta e o que n\u00e3o conta:**\n\n- **gambitstudiotech.com conta como portf\u00f3lio** (item 6.13.1). \u00c9 um projeto de desenvolvimento de site institucional e est\u00e1 no ar. O ponto fraco \u00e9 a \"compatibilidade\": \u00e9 um site gerado por script, sem CMS e sem \u00e1rea de not\u00edcias ou documentos com login. Vale descrever no PDF o que o site tem (p\u00e1ginas, guias, publica\u00e7\u00e3o, dom\u00ednio, HTTPS).\n- **Os apps iOS n\u00e3o contam** como \"website institucional\". Entram como prova de que a empresa desenvolve software.\n- **Nenhum dos dois \u00e9 atestado.** Atestado \u00e9 um documento emitido **por terceiro** (pessoa jur\u00eddica) que recebeu o servi\u00e7o. A empresa n\u00e3o pode emitir para si mesma.\n\n**Classifica\u00e7\u00e3o: TENTA ASSIM MESMO (2), com estas op\u00e7\u00f5es:**\n\n1. **Atestado verdadeiro de terceiro.** Se alguma empresa (cliente PJ, ex-empregador, ag\u00eancia) j\u00e1 recebeu de voc\u00ea trabalho real de site, sistema ou app, pe\u00e7a hoje um atestado com o que foi feito, o per\u00edodo e o CNPJ e assinatura do emissor. O TR 10.3 n\u00e3o diz que o atestado tem que estar no nome da licitante. Um atestado em nome do s\u00f3cio \u00e9 discut\u00edvel, mas defens\u00e1vel. **Nunca atestado de favor ou de servi\u00e7o que n\u00e3o existiu**: isso \u00e9 declara\u00e7\u00e3o falsa (art. 155 VIII), com risco de inidoneidade nacional.\n2. **Sem atestado:** mande o portf\u00f3lio e cite os itens 6.13.1 e 10.10 do Aviso por escrito, no envio dos documentos. Se o SEMAE inabilitar, manifeste **na hora** a inten\u00e7\u00e3o de recorrer e mande o recurso em 3 dias \u00fateis (art. 165, I, \"c\"), com base no 10.10 e no 10.8. A chance de reverter \u00e9 **baixa**, porque o pr\u00f3prio SEMAE publicou \"ambos\" duas vezes e o prazo de impugna\u00e7\u00e3o (3 dias \u00fateis antes da abertura, art. 164) j\u00e1 passou.\n3. **Dilig\u00eancia (art. 64).** Depois de entregues os documentos, s\u00f3 cabe completar informa\u00e7\u00e3o ou atualizar documento vencido. Pela linha do TCU (Ac\u00f3rd\u00e3o 1211/2021-Plen\u00e1rio), d\u00e1 para juntar depois um documento que prove uma condi\u00e7\u00e3o **que j\u00e1 existia** em 30/11. Ent\u00e3o, se um atestado verdadeiro s\u00f3 chegar na semana seguinte, ainda pode entrar.\n\n**Custo do pior caso** (calculado, n\u00e3o chute): o Aviso pune *\"a empresa que estiver impedida de firmar o ajuste pela n\u00e3o apresenta\u00e7\u00e3o dos documentos necess\u00e1rios\"* (9.4.1.3) com **multa de at\u00e9 20% do ajuste e impedimento de at\u00e9 3 anos com o SEMAE/Mogi**. Para um lance de R$ 32,3 mil, a multa seria de at\u00e9 ~R$ 6,5 mil. S\u00f3 que isso exige um processo com ampla defesa e dosimetria. Quem entregou portf\u00f3lio e citou o 10.10 de boa-f\u00e9 tem uma defesa razo\u00e1vel, e \u00e9 raro aplicarem san\u00e7\u00e3o a inabilitado de boa-f\u00e9 em dispensa. Estimativa grosseira: 80% de inabilita\u00e7\u00e3o (se formos 1\u00ba) \u00d7 ~5-10% de virar san\u00e7\u00e3o \u00d7 R$ 3-6,5 mil \u2248 **perda esperada de R$ 150-500**. \u00c9 o mesmo tamanho do teto de R$ 300 da Regra de risco. Ou seja: aceit\u00e1vel para um contrato estrat\u00e9gico, mas \u00e9 um risco real.\n\n---\n\n## 4. Escopo e esfor\u00e7o\n\n**O que entregar** (TR itens 1.2, 3.2 e 4, mais as respostas):\n\n- **Plataforma:** o site atual \u00e9 **WordPress** (confirmado: `semae.sp.gov.br` mostra WordPress 7.1.x; as respostas falam em 7.14) numa VM do Google Cloud do SEMAE (e2-small, Debian 13). **O ideal \u00e9 continuar no WordPress**, porque o jornalista j\u00e1 usa. Outro CMS s\u00f3 com treinamento e migra\u00e7\u00e3o total (resposta 1).\n- **J\u00e1 existe uma pr\u00e9via do site novo**, criada pelo SEMAE. O trabalho \u00e9 avaliar, ajustar e publicar (respostas 5, 12, 13 e 19). **A arte e os banners s\u00e3o do SEMAE** (at\u00e9 50 por ano). N\u00f3s s\u00f3 fazemos sob pedido avaliado pela TI (respostas 3 e 18).\n- **Funcionalidades:** site responsivo, painel com perfis de usu\u00e1rio, menus e submenus, busca interna, not\u00edcias e comunicados, \u00e1rea de documentos (PDF/DOCX/XLSX), se\u00e7\u00e3o \"SEMAE 60 anos\", banners.\n- **Acessibilidade:** contraste, texto alternativo, estrutura sem\u00e2ntica, leitor de tela, e Libras \"quando tecnicamente vi\u00e1vel\" (o VLibras do gov.br \u00e9 gratuito). O TR n\u00e3o cita o e-MAG pelo nome, mas segui-lo \u00e9 a forma de \"indicar os recursos\" (4.3.2).\n- **Seguran\u00e7a e LGPD:** manter tudo atualizado, controlar permiss\u00f5es, backup peri\u00f3dico, comunicar incidentes e seguir a LGPD. A minuta 9.27.3 exige **dados armazenados no Brasil**, ent\u00e3o o backup externo tem que ficar em regi\u00e3o BR.\n- **Hospedagem e dom\u00ednio N\u00c3O entram** (TR 9.2 e 11.6). A VM \u00e9 do SEMAE, e n\u00f3s recebemos o acesso. Configurar o SSL faz parte da fase 3. A resposta 2 diz que a indisponibilidade por causa da hospedagem \u00e9 \"de responsabilidade da contratada da hospedagem\".\n- **Migra\u00e7\u00e3o:** s\u00f3 os posts e a se\u00e7\u00e3o \"An\u00e1lise e Qualidade da \u00c1gua\", de um total de **15 GB** (resposta 7).\n- **Treinamento e manual simplificado, documenta\u00e7\u00e3o t\u00e9cnica, mecanismo de exporta\u00e7\u00e3o** e entrega de tudo no fim do contrato (20.1-20.3).\n- **Cont\u00ednuo por 12 meses:** **no m\u00ednimo 16 h de suporte por m\u00eas, sem acumular** (resposta 16), manuten\u00e7\u00e3o corretiva, preventiva, adaptativa e evolutiva, backup, monitoramento e **relat\u00f3rio mensal**.\n- **SLA (TR 15):**\n\n| Prioridade | In\u00edcio do atendimento | Solu\u00e7\u00e3o |\n|---|---|---|\n| Cr\u00edtica | at\u00e9 4 h \u00fateis | at\u00e9 8 h \u00fateis |\n| Alta | at\u00e9 8 h \u00fateis | at\u00e9 2 dias \u00fateis |\n| M\u00e9dia | at\u00e9 2 dias \u00fateis | at\u00e9 5 dias \u00fateis |\n| Baixa | at\u00e9 5 dias \u00fateis | conforme cronograma |\n\n- **Tudo remoto:** kickoff, treinamento, homologa\u00e7\u00e3o e suporte (respostas 4, 8, 10, 11, 14 e 20). Uniforme, crach\u00e1 e preposto no local da minuta n\u00e3o se aplicam na pr\u00e1tica.\n- **Prazos:**\n  - In\u00edcio em at\u00e9 5 dias \u00fateis ap\u00f3s a OS (kickoff).\n  - Site publicado **\"ainda este ano\"**. Se n\u00e3o der, valem **60 dias corridos** (respostas 5, 9 e 13).\n  - O cronograma anexo (de agosto, com 60 dias \u00fateis de homologa\u00e7\u00e3o) \u00e9 s\u00f3 refer\u00eancia e foi superado pelas respostas.\n  - Sendo realista: contrato assinado l\u00e1 por 10-15/12, o que deixa umas 2-3 semanas para publicar at\u00e9 31/12. Depois disso, o limite firme \u00e9 de 60 dias.\n- **Pagamento:** 12 parcelas mensais iguais, com a implanta\u00e7\u00e3o dilu\u00edda nelas (respostas 6 e 9). A primeira parcela entra ap\u00f3s o in\u00edcio da execu\u00e7\u00e3o (resposta 25). Prazo: at\u00e9 10 dias \u00fateis para o recebimento definitivo + 10 dias corridos (Aviso 8.2). A minuta pede destaque de \"reten\u00e7\u00e3o para o ISS\" na nota. Como a empresa \u00e9 do Simples e de SP, combine com a Contabilizei.\n- **Multas:**\n  - 1% ao dia de atraso sobre a parcela, por at\u00e9 30 dias, e depois vira inexecu\u00e7\u00e3o.\n  - 20% por inexecu\u00e7\u00e3o total ou parcial.\n  - 2% por descumprir outras obriga\u00e7\u00f5es (SLA entra aqui).\n  - 5% por entrega fora da especifica\u00e7\u00e3o.\n  - 20% + impedimento de at\u00e9 3 anos se recusar a assinar ou n\u00e3o entregar os documentos.\n\n**Horas estimadas (Jo\u00e3o sozinho):**\n\n| Bloco | Horas |\n|---|---|\n| Kickoff, diagn\u00f3stico e arquitetura da informa\u00e7\u00e3o | 12 |\n| Avaliar e ajustar a pr\u00e9via, tema WordPress e se\u00e7\u00e3o 60 anos | 45-60 |\n| CMS: perfis, menus, busca, not\u00edcias, documentos | 12 |\n| Migra\u00e7\u00e3o (posts + Qualidade da \u00c1gua, 15 GB) | 10-16 |\n| Acessibilidade (contraste, alt, sem\u00e2ntica, VLibras, testes com leitor de tela) | 12-16 |\n| Seguran\u00e7a, SSL, backup externo BR, monitoramento | 8 |\n| Testes, homologa\u00e7\u00e3o e ajustes da fiscaliza\u00e7\u00e3o | 12 |\n| Treinamento, manual, documenta\u00e7\u00e3o e exporta\u00e7\u00e3o | 12 |\n| **Implanta\u00e7\u00e3o** | **~125-150 h** |\n| Suporte mensal (uso real ~10 h, 16 h de reserva) + relat\u00f3rio, \u00d7 12 meses | 130-200 h |\n| **Total no contrato** | **~260-350 h (base de c\u00e1lculo: 300 h)** |\n\n**Custos do pr\u00f3prio bolso (12 meses):**\n\n| Item | Valor |\n|---|---|\n| Plano BBMNET (pre\u00e7o n\u00e3o publicado; estimativa, conferir) | ~R$ 600 |\n| Plugins ou licen\u00e7as (backup/seguran\u00e7a; em USD, com +5% de c\u00e2mbio) | ~R$ 600 |\n| Armazenamento de backup no Brasil | ~R$ 300 |\n| Reserva para uma multa de SLA ou atraso | ~R$ 500 |\n| **Total** | **\u2248 R$ 2.000** |\n\n**Ponto de aten\u00e7\u00e3o na execu\u00e7\u00e3o:** \u00e9 trabalho de ag\u00eancia WordPress, com **plant\u00e3o de 4 h \u00fateis**, e o Jo\u00e3o est\u00e1 sozinho. D\u00e1 para fazer, mas compete com os apps durante 12 meses.\n\n---\n\n## 5. Pre\u00e7o\n\n**Estimativa do SEMAE** (arquivo 5, cota\u00e7\u00e3o 6359 de 31/07/2026, valores mensais \u00d7 12):\n\n| Fornecedor | Mensal | 12 meses |\n|---|---|---|\n| YPB Servi\u00e7os de Internet ([CNPJ]) | R$ 2.900,00 | R$ 34.800,00 |\n| Better Times Ahead Creative ([CNPJ]) | R$ 5.368,34 | **R$ 64.420,08** (mediana, usada como estimativa) |\n| Oxbrand Tecnologia e Marketing ([CNPJ]) | R$ 5.748,34 | R$ 68.980,08 |\n\nM\u00e9dia: R$ 4.672,23/m\u00eas (R$ 56.066,76 no ano). Coeficiente de varia\u00e7\u00e3o: 27%. Refer\u00eancia hist\u00f3rica (TR 11.2): o contrato anterior, com escopo menor, custava em m\u00e9dia **R$ 2.981/m\u00eas (\u2248 R$ 35,8 mil/ano)**.\n\n**Lance vencedor prov\u00e1vel:**\n\n- A disputa \u00e9 aberta, s\u00f3 entre ME/EPP, dura 6 horas e fecha seco \u00e0s 14:30. Isso favorece lance de \u00faltima hora.\n- A YPB j\u00e1 cotou R$ 34,8 mil, e o pre\u00e7o hist\u00f3rico \u00e9 ~R$ 35,8 mil. Uma empresa que j\u00e1 conhece o site vai abaixo disso sem dificuldade.\n- O mercado de manuten\u00e7\u00e3o de site municipal tem mediana de ~R$ 11 mil/ano (MAPA.md), s\u00f3 que com escopo bem menor.\n- **Expectativa: o vencedor fica entre R$ 25 e 34 mil.** Abaixo de ~**R$ 32.210** (50% da estimativa), \u00e9 comum o \u00f3rg\u00e3o pedir prova de que o pre\u00e7o \u00e9 exequ\u00edvel (Aviso 5.7 e 5.9). Isso \u00e9 f\u00e1cil de provar com a planilha de horas.\n\n**Lance m\u00ednimo pela Regra de risco** (Simples a 15,5%, que \u00e9 o pior caso: Anexo V). Se o pr\u00f3-labore levar ao fator R \u2265 28%, o Anexo III a 6% melhora bastante a margem.\n\nF\u00f3rmula: `lance \u00d7 (1 \u2212 0,155) \u2212 R$ 2.000 de custos = valor das 300 h`\n\n| Valor da hora do Jo\u00e3o | Lance global m\u00ednimo | Por m\u00eas |\n|---|---|---|\n| R$ 60/h | R$ 23.670 | R$ 1.972 |\n| R$ 66/h (piso \"estrat\u00e9gico\") | **R$ 26.000** | R$ 2.167 |\n| **R$ 84/h (piso recomendado)** | **R$ 32.300** | **R$ 2.691,67** |\n| R$ 100/h | R$ 37.870 | R$ 3.156 |\n\n- **Piso recomendado: R$ 32.300,00.** Fica logo acima da linha dos 50%, evita a dilig\u00eancia de exequibilidade e paga ~R$ 84/h depois do imposto.\n- **Exce\u00e7\u00e3o estrat\u00e9gica:** s\u00f3 se o Jo\u00e3o decidir que o atestado de site (Degrau 1 do MAPA) vale mais que a hora. Nesse caso, desce at\u00e9 **R$ 26.000** (~R$ 66/h). Continua com lucro em caixa, sem violar a regra, mas paga mal a hora. **N\u00e3o ir abaixo disso.**\n- **Proposta inicial** (valor mensal, cadastrada at\u00e9 08:00): R$ 4.990,00/m\u00eas (R$ 59.880). Fica abaixo da estimativa e n\u00e3o entrega o piso. Os lances fazem o resto.\n\n---\n\n## 6. Veredito: **GO com riscos**\n\nTentar custa pouco: o plano BBMNET (que serve para as pr\u00f3ximas disputas de SP), ~6 h de prepara\u00e7\u00e3o e um risco pequeno de san\u00e7\u00e3o. Com o piso de R$ 32.300, ganhar d\u00e1 lucro. Perder n\u00e3o custa quase nada.\n\n**Os 3 maiores riscos:**\n\n1. **Atestado.** O SEMAE disse \"Ambos\" (respostas 17 e 22). Sem atestado verdadeiro de terceiro, a inabilita\u00e7\u00e3o \u00e9 prov\u00e1vel se formos 1\u00ba. H\u00e1 uma pequena chance de virar processo de multa e impedimento local (perda esperada de ~R$ 150-500, se\u00e7\u00e3o 3). Para reduzir: conseguir hoje um atestado verdadeiro, ou entregar o portf\u00f3lio citando o 10.10 de forma transparente.\n2. **Prazo da BBMNET.** Se o cadastro e o pagamento n\u00e3o estiverem ativos at\u00e9 segunda 07:30, n\u00e3o tem como disputar. Para reduzir: resolver **sexta de manh\u00e3**, com PIX ou cart\u00e3o e confirma\u00e7\u00e3o da central.\n3. **Execu\u00e7\u00e3o e pre\u00e7o.** Escopo de ag\u00eancia WordPress com SLA de 4 h \u00fateis, um dev sozinho, publica\u00e7\u00e3o \"ainda este ano\" e multas de 1% ao dia e 2% por SLA. A concorr\u00eancia provavelmente vai abaixo de R$ 32 mil. Para reduzir: n\u00e3o baixar do piso, e s\u00f3 aceitar o piso estrat\u00e9gico se o Jo\u00e3o decidir explicitamente.\n\n**Checklist at\u00e9 o prazo** (hoje \u00e9 sexta, 27/11):\n\n| Quando | O qu\u00ea | Tempo |\n|---|---|---|\n| **Sex 27/11, 09:00** | BBMNET: cadastro como Licitante (Fornecedor), vincular o CNPJ, escolher o plano (avulso ou peri\u00f3dico, ver o pre\u00e7o) e **pagar por PIX ou cart\u00e3o**. Ligar ou mandar WhatsApp para a central e confirmar que a conta est\u00e1 ativa e que a Dispensa 51/2026 do SEMAE aparece. **Se o plano custar muito acima de ~R$ 600, reavaliar** | 30-60 min |\n| Sex 09:30 | Pedir um **atestado verdadeiro** a quem j\u00e1 recebeu servi\u00e7o de site ou software seu (o que foi feito, per\u00edodo, CNPJ e assinatura do emissor) | 15 min |\n| Sex 10:00 | Emitir CRF FGTS, SEFAZ-SP (n\u00e3o inscritos), PGE-SP (d\u00edvida ativa), Certid\u00e3o Conjunta Mobili\u00e1ria SP, FDC/CCM e consulta Cadesp \"sem IE\". Baixar o contrato social na Contabilizei. **Se o CRF ou o contrato falharem, abrir chamado na Contabilizei na hora** | 45-60 min |\n| Sex, manh\u00e3 | Montar o **portf\u00f3lio em PDF**: gambitstudiotech.com (prints, URL, o que foi constru\u00eddo, publica\u00e7\u00e3o, HTTPS) + apps iOS como complemento | 1-2 h |\n| Sex, tarde | Proposta (Anexo I, valor mensal + dados banc\u00e1rios), declara\u00e7\u00f5es do Anexo II + equipe apta/ci\u00eancia do TR (TR 4.5.3/4.5.4) + custos trabalhistas (3.2.1). Assinar pelo gov.br. Deixar tudo numa pasta s\u00f3, pronto para enviar | 1,5 h |\n| S\u00e1b/dom | Testar o login na BBMNET e achar a tela de lances. Revisar a se\u00e7\u00e3o 3 e decidir o piso (R$ 32.300 ou o estrat\u00e9gico R$ 26.000) | 30 min |\n| **Seg 30/11, at\u00e9 07:30** | **Cadastrar a proposta** (R$ 4.990,00/m\u00eas) e marcar as declara\u00e7\u00f5es da 3.8. Prazo final: **08:00** | 20 min |\n| Seg 07:30 | Emitir um cart\u00e3o CNPJ novo e conferir as validades | 5 min |\n| **Seg 08:30-14:30** | Lances: n\u00e3o abrir cedo. Acompanhar o menor lance. **\u00daltimos 10 min**: descer em degraus at\u00e9 no m\u00e1ximo o piso. **Sem prorroga\u00e7\u00e3o: o \u00faltimo lance tem que estar registrado antes de 14:30:00** (conte com a lat\u00eancia e mande at\u00e9 ~14:29:30) | o dia, com aten\u00e7\u00e3o nos \u00faltimos 30 min |\n| Seg, depois de 14:30 | Ficar online. Convocado: **1 h** para a proposta readequada e **1 h** para os documentos de habilita\u00e7\u00e3o (incluindo portf\u00f3lio e atestado, se houver). Sem atestado: escrever que a qualifica\u00e7\u00e3o t\u00e9cnica \u00e9 atendida pelo 6.13.1, que prevalece pelo 10.10 | 2 h de prontid\u00e3o |\n| Se inabilitado | Manifestar **imediatamente** a inten\u00e7\u00e3o de recorrer. Recurso em 3 dias \u00fateis (art. 165 I), com base no 10.10 e no 10.8 | \u2014 |\n\n**N\u00e3o fiz nada externo:** n\u00e3o contatei o SEMAE, n\u00e3o me cadastrei em nenhum lugar e n\u00e3o enviei nada.\n\n---\n\n### Fontes externas\n- [Effecti: como funciona a BBMNET](https://effecti.com.br/bbmnet-licitacoes): passos do cadastro e planos avulso e peri\u00f3dico; n\u00e3o informa pre\u00e7o nem prazo de aprova\u00e7\u00e3o.\n- [Manual do \u00f3rg\u00e3o promotor BBMNET](https://bbmnet.com.br/wp-content/uploads/2025/07/MANUAL-ORGAO-PROMOTOR-COMPLETO-1.pdf).\n- [BrasilAPI: CNPJ [CNPJ]](https://brasilapi.com.br/api/cnpj/v1/68351187000101): dados p\u00fablicos da Receita (ativa, ME, Simples desde 03/08/2026, capital R$ 1.000, CNAE 6203100 + 6201501).\n"];</script><script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script><script>document.querySelectorAll("#md .mdpart").forEach(function(el){var R=RAWS[+el.dataset.i]||"";el.innerHTML=window.marked?marked.par
