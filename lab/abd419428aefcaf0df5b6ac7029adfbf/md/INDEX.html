<body><div class="wrap"><p class="sub" style="font-size:12px;margin:0 0 14px">Exportado em 2026-09-28 16:42 · fonte: Lab Hub local</p><p class="sub"><a href="../index.html">← hub</a> · <code>_GambitStudio/INDEX.md</code></p><div id="md"></div><script>const RAW="# GambitStudio \u2014 Index (onde achar o qu\u00ea)\n\n> Auto-loaded em toda sess\u00e3o. Aponta pra onde est\u00e1 cada coisa. N\u00e3o duplica conte\u00fado \u2014 s\u00f3 direciona.\n\n## Sempre-loaded (j\u00e1 no contexto, n\u00e3o precisa abrir)\n- **RULES.md** \u2014 regras imut\u00e1veis de execu\u00e7\u00e3o (autonomia, paleta por nicho, paths, IDs, padr\u00f5es inviol\u00e1veis)\n- **COMMANDS.md** \u2014 pipeline completa de dev + improve, manual operacional\n- **LEARNINGS-INDEX.md** \u2014 bugs j\u00e1 vividos, 1 linha (a regra) por item, NUNCA repetir. O texto completo (`LEARNINGS.md`, 220 KB) N\u00c3O carrega: ler sob demanda com `grep -n '^## N' LEARNINGS.md` \u2192 Read com offset/limit\n\n## Read on-demand (abrir quando precisar do t\u00f3pico)\n\n### Conven\u00e7\u00f5es de c\u00f3digo + arquitetura\n- Pattern b\u00edblia **fatiada em `_GambitStudio/spec/`** \u2014 mapa completo (qual fatia, quem l\u00ea) em `_GambitStudio/CLAUDE.md`. Ler S\u00d3 a fatia do t\u00f3pico:\n  - `mvvm.md` / `code-standards.md` \u2014 MVVM folder structure, MARK, naming, 300 linhas\n  - `design-system.md` \u2014 tema \u00fanico por app (AppColors sem variante Dark), ZStack bg, animations, shadows, shimmer\n  - `localization.md` \u2014 Localizable.xcstrings + InfoPlist.xcstrings formato JSON\n  - `feature-flags.md` \u2014 FeatureFlags + MockDataProvider\n  - `platform.md` \u2014 Info.plist permissions table + entitlements\n  - `launch-screen.md` / `gitignore.md` / `git-ci-cd.md` \u2014 templates LaunchScreen XML, .gitignore, CI YAML + git conventions\n  - `storekit-extensions.md` \u2014 StoreKit 2, Widget, Live Activity, App Groups\n  - `security-background.md` \u2014 Keychain, Biometric, BGTaskScheduler\n  - `app-store.md` \u2014 App Store metadata + ASC review-blocking fields\n  - `screenshots.md` \u2014 screenshots pipeline + MarketingTheme + hard-won lessons\n  - `pre-release-checklist.md` / `packages-naming.md` / `lessons-ios.md` / `workflow.md` / `xcode-project.md`\n\n### Coordenadores (skills que ORQUESTRAM agentes \u2014 n\u00e3o executam o trabalho pesado)\n| Coordenador | Invoca | Cadeia de agentes |\n|-------------|--------|-------------------|\n| `/create-ios-app <descri\u00e7\u00e3o>` | criar app novo do zero (6 fases) | competitor-scout (fase 0.5) \u2192 aso-copywriter (fase 2) \u2192 screen-builder \u00d7N em paralelo (fase 4) \u2192 polish-reviewer (fase 5) \u2192 qa-runner (fase 5) |\n| `/start-aso-pipeline` | update de ASO de app j\u00e1 publicado | aso-extractor \u2192 aso-longtail-miner \u2192 aso-fit-checker \u2192 aso-serp-analyst \u2192 aso-field-composer \u2192 aso-reporter \u2192 [com autoriza\u00e7\u00e3o] aso-deployer \u2192 deploy-verifier; checkpoints via aso-checkpoint |\n| `/panorama-prints` | prints via imagem panor\u00e2mica IA | panorama-prompter (prepara refs + prompt; processa a imagem quando volta) |\n\nRegra dos coordenadores: contexto DENSO no prompt de cada agente, encadear outputs, nunca duplicar a an\u00e1lise do agente no pr\u00f3prio contexto. Est\u00e1gio violou regra dura \u2192 devolver PRO AGENTE citando a regra.\n\n### Subagentes do lab (`~/.claude/agents/`) \u2014 usar via Agent tool\n- `screen-builder` \u2014 implementa 1 tela a partir de brief denso + `ARCHITECTURE-BRIEF.md` do app; paraleliz\u00e1vel (Phase 4). NUNCA toca arquivos compartilhados (xcstrings/project.yml) \u2014 devolve as keys pro coordenador mergear.\n- `aso-copywriter` \u2014 Phase 2 inteira: research Astro + escreve `metadata/` 3 locales fora do contexto principal.\n- `polish-reviewer` \u2014 Phase 5: review fresh-eyes contra o spec; corrige o mec\u00e2nico, reporta o estrutural.\n- `qa-runner` \u2014 dirige o simulador (sim-mcp / sim-qa harness) e devolve s\u00f3 o checklist \u2705/\ud83d\udc1b (screenshots ficam no contexto dele).\n- `competitor-scout` \u2014 baixa e L\u00ca os prints/descriptions/reviews dos concorrentes de um nicho e devolve s\u00f3 o gap analysis (table stakes, wedges, padr\u00f5es visuais, dores). Fase 0.5 do create / Step 2.5 do research-aso.\n- `aso-checkpoint` \u2014 roda checkpoint D7/14/21/28 de uma itera\u00e7\u00e3o ASO (analytics + Astro vs targets do meta.json) e devolve veredito + pr\u00f3xima a\u00e7\u00e3o.\n- **Cadeia de update de ASO** (9 est\u00e1gios, encadeados pelo coordenador `/start-aso-pipeline` \u2014 invocar avulso via Agent tool passando iter dir + ids):\n  - `aso-extractor` \u2014 1. COLETA bruta: sync do live, Astro por store, SERP, baselines (2 m\u00e9todos), search-terms reais do ASC, CSVs. Zero an\u00e1lise.\n  - `aso-longtail-miner` \u2014 2. LONG TAILS por palavra-core (suggestions + competitor extraction + queries naturais), cada uma com fonte rastre\u00e1vel, medida no Astro.\n  - `aso-fit-checker` \u2014 3. FIT termo-a-termo contra o que o app ENTREGA (invent\u00e1rio do source + NOT-list) \u2192 FIT/PARTIAL/MISMATCH.\n  - `aso-serp-analyst` \u2014 4. SERP/winnability por termo (DOMINATE/CLIMB/LOTTERY/UNWINNABLE) + mapa de prote\u00e7\u00e3o (composi\u00e7\u00e3o rankeada \u2192 token que a protege).\n  - `aso-field-composer` \u2014 5. COMP\u00d5E os campos por locale (token protegido NUNCA sai; OUT sem retorno sai; \u22643 apostas novas; dup check por locale; front-loading).\n  - `aso-reporter` \u2014 6. RELAT\u00d3RIO de decis\u00e3o (keyword_candidates.md SEM cabe\u00e7alho did\u00e1tico + meta.json can\u00f4nico) + link mdview.\n  - `aso-deployer` \u2014 7. DEPLOY verificado: PATCH direto na API (nunca fastlane), read-back, spawna deploy-verifier, bookkeeping (meta/registry/now.json/git). S\u00d3 com autoriza\u00e7\u00e3o do Jo\u00e3o.\n- `deploy-verifier` \u2014 depois de todo sync_metadata/upload de screenshots, confere via ASC API o que REALMENTE aplicou (deliver mente por omiss\u00e3o \u2014 LEARNINGS #13/#26/#27/#35), corrige com PATCH e devolve o diff.\n- `print-copywriter` \u2014 escreve os t\u00edtulos dos prints (2 linhas iguais, benef\u00edcio e n\u00e3o recurso, base nos l\u00edderes da categoria + boas pr\u00e1ticas pesquisadas na web, message match nos prints 1-3). Rodar ANTES de renderizar prints (panorama ou code-driven).\n- `panorama-prompter` \u2014 dono do fluxo panorama-prints: prepara refs + specs e escreve o PROMPT da imagem panor\u00e2mica pro Jo\u00e3o colar no ChatGPT/Nano Banana; quando a imagem volta, processa (corte, headlines, locales, PPO + verifica\u00e7\u00e3o).\n- **Analytics (Firebase/GA4) \u2014 cadeia `/firebase-insights`**: `analytics-extractor` (coleta bruta via `scripts/analytics/ga4_pull.py`: eventos, cohorts D1/D7/D30, funil, engajamento, vers\u00f5es/crash) \u2192 `analytics-analyst` (report com ativa\u00e7\u00e3o, reten\u00e7\u00e3o vs benchmarks, monetiza\u00e7\u00e3o, ratings, gaps \u2014 conhecimento consolidado 2026 dentro do agente) \u2192 `analytics-instrumentor` (implementa os eventos can\u00f4nicos de `_GambitStudio/analytics/event-taxonomy.md`).\n- `review-responder` \u2014 limpa o backlog de avalia\u00e7\u00f5es sem resposta via ASC API (rascunho na l\u00edngua do review, POST customerReviewResponses, refresh do dashboard).\n- `release-runner` \u2014 roda \"gere uma versao\" de ponta a ponta QUANDO pedido explicitamente (bump \u2192 tag \u2192 watch do run certo \u2192 build materializado na ASC \u2192 passos manuais restantes). Nunca por iniciativa pr\u00f3pria.\n\n### Templates de c\u00f3digo (copiar e adaptar)\n- Settings: `_GambitStudio/templates/settings/SettingsView.swift.template`\n- Paywall: usa `PaywallKit` (drop-in) \u2014 template antigo deprecated\n- Fastlane: `_GambitStudio/templates/fastlane/`\n- Screenshots tool: `_GambitStudio/templates/screenshots-tool/`\n\n### Swift Packages (SPM, importar por path)\n- `_GambitStudio/packages/GambitCoreKit/` \u2014 **base de todo app**: GambitPalette (configur\u00e1vel por nicho) + AppColors + AppFonts + AppSpacing + HapticManager + **ReviewService** (\u00fanico caminho de review: prompt NATIVO direto no aha-moment, com throttle, evento `review_prompt_requested`; sem pr\u00e9-prompt \u2014 RatingGate removido em 11/09/2026, LEARNINGS #88; Flutter usa `templates/flutter/review_prompt.dart`) + KeychainService + `.pressAnimation()` + `.shimmer()` + `SkeletonView`\n- `_GambitStudio/packages/OnboardingKit/` \u2014 `OnboardingFeaturePager` (multi-step padr\u00e3o) + `OnboardingScaffold` (single-screen hero) + `CinematicOnboardingScaffold` (N-step animado, hero frame, `CinematicTestimonialCarousel` + `CinematicSymbolHero`, asset-free)\n- `_GambitStudio/packages/PaywallKit/` \u2014 `StoreKitManager` (singleton) + `PaywallScaffold` + `PurchaseScaffold` (high-converting: shake hero, cooldown, save %, trial detection)\n- `_GambitStudio/packages/GambitScreenshotKit/` \u2014 render de screenshots (DeviceFrame, MarketingTheme, ImageRenderer)\n\n### Scripts compartilhados (rodar quando precisar)\n- **Lab Hub** (`/usr/bin/python3 _GambitStudio/tools/lab-hub/hub.py` \u2192 `[Lab Hub local]`): home = p\u00e1gina \"Agora\" minimal (Fazer / Decidir / Esperando, cada item clic\u00e1vel com detalhe + hist\u00f3rico), alimentada por **`_GambitStudio/now.json`** \u2014 **TODA sess\u00e3o que mudar estado de projeto (subiu PPO, submeteu vers\u00e3o, resolveu a\u00e7\u00e3o manual) DEVE atualizar o now.json** (add/remover item + campo `updated`). Invent\u00e1rio completo (skills, agents, docs, reports, atividade git, pipelines ASO) fica em `/all`.\n  - **Lab Hub p\u00fablico (export est\u00e1tico)** \u2014 `bash tools/lab-hub/publish_site.sh` exporta o hub (`export_static.py`) pra `JoaoFloresDev.github.io/lab/<hash>/` (hash em `keys/lab_site_path.txt`, noindex, sem link da home; a URL sai s\u00f3 no stdout \u2014 nunca em arquivo ou commit). Roda no fim do `/refresh-lab-data`. N\u00e3o exporta conversas (#32), LaunchScreen (#0b), PrivacyInfo/GoogleService no bundle (#29/#56), regras de c\u00f3digo do RULES, e metadata LIVE na ASC (subtitle nulo #27, keywords >100 #13, l\u00e9xico 2.5.14 #40, prints duplicados #26). Hook `archive-preflight.sh` NEGA `-exportArchive` que reprovaria: `scripts/verify/preflight.py <app-dir> [--archive auto] [--app-id N]` \u00b7 eval em `scripts/verify/test_preflight.py`\n- **Verificador de analytics** (l\u00ea o SOURCE do app e acusa can\u00f4nico faltando, nome fora da taxonomia e evento declarado-mas-nunca-chamado; obrigat\u00f3rio no pr\u00e9-release): `scripts/analytics/verify-analytics.py <app-dir> --strict`\n- **Custo por agente** (telemetria dos subagentes lida dos transcripts do Claude Code em `~/.claude/projects/`: execu\u00e7\u00f5es, tokens, USD estimado pela tabela `PRICING`, mediana/total de dura\u00e7\u00e3o e \u00faltimas 10 execu\u00e7\u00f5es \u2014 por `subagent_type` e, no general-purpose, por descri\u00e7\u00e3o; s\u00f3 metadado, nunca texto de prompt; sem usage \u2192 `n\u00e3o verificado` exit 3; se\u00e7\u00e3o \"Custo por agente\" no `/all` do hub): `orchestrator/agent_costs.py --days 7 [--json] [--project <slug>]` \u00b7 teste em `orchestrator/test_agent_costs.py`\n- **Firebase/GA4 do lab** (p\u00e1gina `/firebase` do hub: quem est\u00e1 medindo, funil + reten\u00e7\u00e3o vs benchmark por app, gaps de instrumenta\u00e7\u00e3o, para onde ir, e os apps sem tracking nenhum): `scripts/analytics/firebase_snapshot.py` escreve `tools/lab-dashboard/data/firebase.json` (roda junto no `/refresh-lab-data`)\n- **Um projeto Firebase pode hospedar V\u00c1RIOS apps** \u2014 e todos caem na MESMA property GA4, ent\u00e3o ler por property soma apps diferentes (LEARNINGS #81). A unidade de leitura \u00e9 o **data stream**: `ga4_pull.py --stream <id>` (e `ga4_pull.py streams --property <id>` pra ver quem divide). O mapa app \u2192 (property, stream) \u00e9 derivado da Admin API a cada rodada e materializado em `firebase.json > stream_map`; o `firebase_snapshot.py` **recusa gravar** o snapshot se uma property compartilhada for lida sem filtro. Evals: `scripts/analytics/test_stream_isolation.py` + `test_stream_isolation_meta.py` (muta\u00e7\u00e3o)\n- **Lab Dashboard** (sales/receita R$/tend\u00eancia/veredito/reviews/testes A/B de todos os apps): skill `/lab-dashboard` \u2192 `tools/lab-dashboard/` \u2192 `http://localhost:8767/`\n- **mdview** (qualquer .md vira p\u00e1gina no browser com auto-reload \u2014 usar SEMPRE que for apresentar um .md pro Jo\u00e3o): `/usr/bin/python3 _GambitStudio/scripts/mdview/mdview.py <arquivo.md>` \u2192 `http://localhost:8768/view?path=...`\n- **Preview Kit** (visualizar imagens geradas estilo App Store Connect): `_GambitStudio/scripts/preview/preview <app-dir>` \u2192 registra o app, sobe o server \u00fanico (porta 8765), imprime o link `http://localhost:8765/?app=<id>`. Auto-refresh a cada 4s; sidebar treatment/locale; cards arredondados (sem mock de celular). Mandar o link pro Jo\u00e3o conferir \u2014 ele n\u00e3o navega pastas. README em `scripts/preview/README.md`.\n- **Fila de simuladores (OBRIGAT\u00d3RIA, m\u00e1x 2 no Mac Intel)**: `tools/sim-pool/simpool.py acquire|poll|heartbeat|release|status --owner <quem>` \u2014 toda sess\u00e3o/agente pede o simulador por aqui, recebe o UDID ou entra na fila e segue trabalhando; libera ao terminar. Pool em `tools/sim-pool/pool.json`, log em `pool.log`.\n- **QA no simulador** (harness idb+simctl, Stop hook anti-parada, gsutil or\u00e1culo de backup): `_GambitStudio/tools/sim-qa/` (ver README) + `keys/gcloud-access.md`\n- **Visual review \u2014 a tela parece boa?** crit\u00e9rios 0-2 por screenshot em `spec/visual-review.md` (tela passa com \u2265 80% e nenhum 0; um app = UM esquema light ou dark, sem toggle \u2014 Jo\u00e3o 27/09); capturas reproduz\u00edveis por rota \u00d7 locale no esquema do app, com `--prove-opposite` pra provar que nada muda com o sistema no oposto: `tools/sim-qa/visual_capture.py --app-dir <app> --bundle-id <id> --routes <routes.json> --prove-opposite` (sim do pool, Maestro por id/ponto, di\u00e1logo \"abrir com\" do `openurl` no iOS 26 tratado, `screens/manifest.json` + `contact_sheet.png`); quem executa \u00e9 o `polish-reviewer` (se\u00e7\u00e3o *Visual pass*), com a r\u00e9gua do nicho vinda do `competitor_intel.py`\n- **Competitor intel** (baixa TUDO dos concorrentes: meta, description, todos os prints, \u00edcone + INDEX resumo \u2014 passo entre keyword research e PM spec; brechas \u2192 features): `_GambitStudio/scripts/aso/competitor_intel.py --term \"<nicho>\" --country us --top 5 --out <dir>`\n- ASC API client: `_GambitStudio/scripts/asc/api_client.py`\n- Kill-or-scale (veredito KILL/WATCH/SCALE por app via downloads+receita): `_GambitStudio/scripts/asc/kill_or_scale.py --app-id <id> --days 45`\n- **Assinaturas ASC \u2014 trial\u2192pago, trials expirados, renova\u00e7\u00f5es, churn, refund e USD por app e por produto** (relat\u00f3rios `SUBSCRIPTION_EVENT` 1_4 + `SUBSCRIBER` 1_3 do Sales and Trends; o GA4 N\u00c3O v\u00ea nada disso \u2014 pesquisa 2026-09-onboarding achados 17-18; cache di\u00e1rio em `tools/lab-dashboard/data/subscriptions/`, resumo em `data/subscriptions.json`; 2 requests por dia ainda n\u00e3o cacheado, quota 3600/h compartilhada): `_GambitStudio/scripts/asc/subscription_events.py --days 14 [--json] [--app <id>] [--no-fetch]` \u00b7 testes `test_subscription_events.py`. Lido pelo `analytics-extractor` (\u2192 `raw/subscriptions.json`) e pelo `analytics-analyst` \u00a74b; m\u00e9tricas semanais e fonte de cada uma em `analytics/event-taxonomy.md` \u00a77\n- Sweep 6.9\" vs 6.5\" (locale cujos sets `APP_IPHONE_67`/`APP_IPHONE_65` mostram arte DIFERENTE \u2014 vencedor de PPO promovido num tamanho s\u00f3, LEARNINGS #35/#57; s\u00f3 GET, ~1 request por locale, usar `--apps` pra n\u00e3o gastar a cota): `_GambitStudio/scripts/asc/sweep_screenshot_sets.py --apps <id,id>` \u00b7 mesmo or\u00e1culo do preflight `asc.screenshot_sizes`\n- Build + install device: `_GambitStudio/scripts/ios-dev/install-on-device.sh`\n- Clear provisioning cache: `_GambitStudio/scripts/ios-dev/clear-provisioning-cache.sh`\n- Bulk translate xcstrings: `_GambitStudio/scripts/localization/translate-xcstrings.py`\n- Merge de keys no String Catalog a partir do retorno de um `screen-builder` (`--report`, `--json`, `--check`, `--used`): `_GambitStudio/scripts/localization/xcstrings_merge.py`\n- Detect hardcoded strings: `_GambitStudio/scripts/localization/verify-localization.py`\n- Apple Ads (search terms, campaigns): `_GambitStudio/scripts/apple-ads/`\n\n### ASO pipeline (post-launch text optimization)\n- **Ranking playbook (como apps pequenos rankeiam \u2014 base OBRIGAT\u00d3RIA das skills ASO)**: `_GambitStudio/aso/reference/aso-ranking-playbook.md` (varredura web 2026-08-07: dois motores, seven-day cliff, segundo set, convers\u00e3o)\n- **Store page playbook (converter a busca: naming, \u00edcone, prints, video, rating \u2014 camada da loja)**: `_GambitStudio/aso/reference/store-page-playbook.md` \u2014 calibrado pro estilo do lab (apps de nicho achados por busca); leitura obrigat\u00f3ria de /code-driven-prints \n- Template clonado por app: `_GambitStudio/aso/pipeline-template/`\n- **Monetization playbook (paywall soft p\u00f3s-onboarding, trial pelo plano-her\u00f3i \u2014 utilit\u00e1rio semanal 3d / h\u00e1bito anual 7d \u2014, ordem dos experimentos, pre\u00e7o por pa\u00eds \u2014 atualizado 2026-09-28)**: `_GambitStudio/aso/reference/monetization-playbook.md`\n- **Product playbook (onboarding, ativa\u00e7\u00e3o, reten\u00e7\u00e3o, monetiza\u00e7\u00e3o desde a v1, App Review 2026, decis\u00f5es pendentes)**: `_GambitStudio/spec/product-playbook.md`\n- **Pesquisas 2026-09 com fontes (ler quando for revisar uma regra)**: `aso/reference/research-2026-09-aso.md` \u00b7 `aso/reference/research-2026-09-conversion.md` \u00b7 `spec/research-2026-09-product.md` \u00b7 `spec/research-2026-09-onboarding-payw
