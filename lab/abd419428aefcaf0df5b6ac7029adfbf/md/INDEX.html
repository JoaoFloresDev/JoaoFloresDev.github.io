.hcol .row{flex-direction:column;align-items:flex-start;gap:4px}.hcol .row b{white-space:normal}.hcol .row span{width:100%}.hcol .row em{display:none}.hcol .row.done b{font-size:12px}.hrow{display:flex;gap:20px;overflow-x:auto;align-items:flex-start;padding:16px 28px 12px;margin:18px 0 26px;background:rgba(125,125,125,.07);border:1px solid var(--bd);border-radius:16px;scroll-padding:0 28px}.hcol{flex:0 0 340px;min-width:340px}.hcol:last-child{margin-right:28px}.hcol h2{margin-top:0}.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:0 20px}.cols2{display:grid;grid-template-columns:1fr 1fr;gap:0 20px;align-items:start}@media(max-width:900px){.cols2{grid-template-columns:1fr}}h3.team{margin:18px 0 8px;font-size:15px;font-weight:600}h3.team .chain{display:block;color:var(--mut);font-weight:400;font-size:12.5px;margin-top:2px}.card .step{display:inline-block;min-width:18px;height:18px;line-height:18px;text-align:center;border-radius:9px;background:var(--bd);color:var(--mut);font-size:11px;font-weight:600;margin-right:6px}.grid4{display:grid;gap:12px;grid-template-columns:repeat(4,1fr)}@media(max-width:1100px){.grid4{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.grid4{grid-template-columns:1fr}}

.del:hover{color:var(--down);background:rgba(200,34,34,.08)}

.fcard{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:13px 15px}

.fnds li.crit:before{background:var(--down)}.fnds li.warn:before{background:#c9930a}.fnds li.ok:before{background:var(--ok)}

.fh .st{margin-left:8px}

/* ---------- camada de acabamento (01/10/2026) ----------
   Tipografia com duas vozes (display para títulos e números, texto para leitura),
   neutros com viés do azul da marca em vez de cinza puro, e profundidade por
   sombra em vez de só borda. Nada aqui renomeia classe: é uma camada por cima. */
:root{
  --f-disp:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --f-text:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --bg:#f3f5f9; --card:#ffffff; --tx:#10131a; --mut:#5a6377; --acc:#1552d8;
  --bd:#dde2ea; --bd-soft:#e8ecf3; --ok:#0a8f58; --down:#d02f2f; --warn:#b45309;
  --sh:0 1px 2px rgba(16,19,26,.05),0 2px 8px rgba(16,19,26,.04);
  --sh-up:0 2px 6px rgba(16,19,26,.07),0 10px 24px rgba(16,19,26,.07);
  --rad:14px;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#0b0d12; --card:#161a22; --tx:#eef1f7; --mut:#9aa5b8; --acc:#7aa6ff;
  --bd:#272d39; --bd-soft:#1f242e; --ok:#43d08d; --down:#ff7070; --warn:#e5a645;
  --sh:0 1px 2px rgba(0,0,0,.4); --sh-up:0 6px 22px rgba(0,0,0,.5);
}}
body{font-family:var(--f-text);font-size:14.5px;line-height:1.6;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1{font-family:var(--f-disp);font-size:27px;font-weight:800;letter-spacing:-.02em;
  text-wrap:balance;margin:0 0 2px}
h1 .mark{display:inline-block;width:28px;height:28px;vertical-align:-5px;margin-right:11px;
  background-size:contain;background-repeat:no-repeat;background-position:center}
h2{font-family:var(--f-disp);font-size:12px;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;color:var(--mut);border-top:1px solid var(--bd-soft);
  padding-top:22px;margin:32px 0 14px}
h3{font-family:var(--f-disp);letter-spacing:-.01em}
.sub{font-size:13px;color:var(--mut)}
code,.mono{font-family:var(--f-mono);font-size:12.5px}
.card,table.t,a.tile,.row,.fcard,#md{box-shadow:var(--sh);border-color:var(--bd-soft)}
.card,a.tile,.row,.fcard{border-radius:var(--rad)}
a.tile,.row{transition:box-shadow .16s ease,border-color .16s ease,transform .16s ease}
a.tile:hover,a.row:hover{box-shadow:var(--sh-up);border-color:var(--bd);
  transform:translateY(-1px)}
/* o card do app não se mexe: é área de leitura, não botão */
.fcard{transition:none}
.fcard:hover{box-shadow:var(--sh);border-color:var(--bd-soft);transform:none}
/* big numbers: the first thing anyone reads on the page */
.tiles{gap:12px;margin:18px 0 4px;padding-bottom:10px}
a.tile{padding:13px 17px;min-width:148px}
.tile .tl{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
  color:var(--mut)}
.tile .tv{font-family:var(--f-disp);font-size:25px;font-weight:800;letter-spacing:-.025em;
  margin-top:3px}
.tile .ts{font-size:11.5px;color:var(--mut)}
/* tables read as data, not as prose */
table.t{border-radius:var(--rad);font-variant-numeric:tabular-nums}
table.t th{font-family:var(--f-disp);font-size:11px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;background:var(--bd-soft);border-bottom:1px solid var(--bd)}
table.t td{padding:9px 13px;border-bottom:1px solid var(--bd-soft)}
table.t tbody tr:hover td,table.t tr:hover td{background:rgba(125,140,170,.06)}
.twrap{border-radius:var(--rad)}
/* buttons */
.btn{font-family:var(--f-disp);font-weight:600;font-size:13.5px;padding:9px 18px;
  border-radius:999px;box-shadow:var(--sh);transition:all .16s ease}
.btn:hover{border-color:var(--acc);box-shadow:var(--sh-up);transform:translateY(-1px)}
.pill,.st{font-family:var(--f-disp);font-weight:600;font-size:11.5px;letter-spacing:.02em}
/* status colours carry meaning, so keep them out of the accent */
.st.run,.st.appr{background:rgba(10,143,88,.14);color:var(--ok)}
.st.crit{background:rgba(208,47,47,.14);color:var(--down)}
.st.rev,.st.draft{background:rgba(180,83,9,.14);color:var(--warn)}
/* the lanes strip and any scroller get a thin, rounded bar */
.tiles,.hrow,.twrap{scrollbar-width:thin;scrollbar-color:var(--bd) transparent}
.tiles::-webkit-scrollbar,.hrow::-webkit-scrollbar,.twrap::-webkit-scrollbar{height:9px}
.tiles::-webkit-scrollbar-track,.hrow::-webkit-scrollbar-track,
.twrap::-webkit-scrollbar-track{background:transparent}
.tiles::-webkit-scrollbar-thumb,.hrow::-webkit-scrollbar-thumb,
.twrap::-webkit-scrollbar-thumb{background:var(--bd);border-radius:999px;
  border:3px solid transparent;background-clip:content-box}
.tiles::-webkit-scrollbar-thumb:hover,.hrow::-webkit-scrollbar-thumb:hover,
.twrap::-webkit-scrollbar-thumb:hover{background:var(--mut);background-clip:content-box}
.hrow{background:transparent;border:0;padding:0;border-radius:0}
.hcol{flex:0 0 clamp(280px,26vw,360px);min-width:0}
a:focus-visible,button:focus-visible,.btn:focus-visible{outline:2px solid var(--acc);
  outline-offset:2px;border-radius:8px}
.dirlist,.prlist{margin:10px 0 0;padding-left:18px;list-style:none}
.dirlist>li,.prlist>li{position:relative;margin:0 0 7px;font-size:13.5px;line-height:1.5;
  color:var(--tx)}
.prlist>li{color:var(--mut);font-size:13px;margin-bottom:5px}
.dirlist>li::before,.prlist>li::before{content:"";position:absolute;left:-14px;top:.62em;
  width:5px;height:5px;border-radius:50%;background:var(--acc);opacity:.75}
.prlist>li::before{background:var(--mut);opacity:.5}
.dirp{display:none}
.dapps{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));
  margin:14px 0 4px;align-items:start}
.dapp{padding:14px 16px}
.dah{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.dah b{font-family:var(--f-disp);font-size:14.5px;font-weight:700}
.drank{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;
  border-radius:6px;background:var(--acc);color:#fff;font-size:11.5px;font-weight:700;flex:none}
.st.d-dobrar{background:rgba(10,143,88,.16);color:var(--ok)}
.st.d-consertar{background:rgba(180,83,9,.16);color:var(--warn)}
.st.d-manter{background:rgba(125,140,170,.16);color:var(--mut)}
.st.d-congelar{background:rgba(125,140,170,.12);color:var(--mut)}
.dapp .prlist{margin-top:6px}
.dcall{color:var(--tx)!important;font-weight:600}
.fcard[id]{scroll-margin-top:18px}
.fdet{margin-top:10px;border-top:1px solid var(--bd-soft);padding-top:9px}
.fdet>summary{cursor:pointer;list-style:none;font-family:var(--f-disp);font-size:11.5px;
  font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);
  display:flex;align-items:center;gap:7px}
.fdet>summary::-webkit-details-marker{display:none}
.fdet>summary::before{content:"›";font-size:15px;transition:transform .15s}
.fdet[open]>summary::before{transform:rotate(90deg)}
.fdet>summary:hover{color:var(--acc)}
.fdet table.t{font-size:12.5px}
.fdet table.t td,.fdet table.t th{padding:6px 10px}
.fgrid.one{grid-template-columns:1fr!important;gap:0}
.fgrid.one>.fcard{border:0;border-radius:0;box-shadow:none;background:transparent;
  padding:22px 0 24px;border-bottom:1px solid var(--bd)}
.fgrid.one>.fcard:last-child{border-bottom:0}
.fgrid.one>.fcard:first-child{padding-top:4px}
.fcols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;
  align-items:start}
@media(max-width:820px){.fcols{grid-template-columns:1fr;gap:12px}}
.fcol{min-width:0}
.fcol>.fnds{margin-top:0}
.fdet .ascgrid{grid-template-columns:repeat(auto-fit,minmax(118px,1fr))}
.fdetcols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;
  align-items:start}
@media(max-width:1100px){.fdetcols{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:760px){.fdetcols{grid-template-columns:1fr}}
.fdetcols>div{min-width:0;display:flex;flex-direction:column;gap:14px}
.rawbox{background:var(--bg);border:1px solid var(--bd-soft);border-radius:11px;
  padding:11px 13px;min-width:0}
.rawbox h4,.rawbox h3.team{margin:0 0 8px;font-family:var(--f-disp);font-size:10.5px;
  font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--mut)}

.rawbox table.t{border:0;box-shadow:none;background:transparent}

<body><div class="wrap"><p class="sub" style="font-size:12px;margin:0 0 14px">Exportado em 2026-10-01 16:15 · fonte: Lab Hub local</p><p class="sub"><a href="../index.html">← hub</a> · <code>_GambitStudio/INDEX.md</code></p><div id="md"></div><script>const RAW="# GambitStudio \u2014 Index (onde achar o qu\u00ea)\n\n> Auto-loaded em toda sess\u00e3o. Aponta pra onde est\u00e1 cada coisa. N\u00e3o duplica conte\u00fado \u2014 s\u00f3 direciona.\n\n## Sempre-loaded (j\u00e1 no contexto, n\u00e3o precisa abrir)\n- **RULES.md** \u2014 regras imut\u00e1veis de execu\u00e7\u00e3o (autonomia, paleta por nicho, paths, IDs, padr\u00f5es inviol\u00e1veis)\n- **COMMANDS.md** \u2014 pipeline completa de dev + improve, manual operacional\n- **LEARNINGS-INDEX.md** \u2014 bugs j\u00e1 vividos, 1 linha (a regra) por item, NUNCA repetir. O texto completo (`LEARNINGS.md`, 220 KB) N\u00c3O carrega: ler sob demanda com `grep -n '^## N' LEARNINGS.md` \u2192 Read com offset/limit\n\n## Read on-demand (abrir quando precisar do t\u00f3pico)\n\n### Conven\u00e7\u00f5es de c\u00f3digo + arquitetura\n- Pattern b\u00edblia **fatiada em `_GambitStudio/spec/`** \u2014 mapa completo (qual fatia, quem l\u00ea) em `_GambitStudio/CLAUDE.md`. Ler S\u00d3 a fatia do t\u00f3pico:\n  - `mvvm.md` / `code-standards.md` \u2014 MVVM folder structure, MARK, naming, 300 linhas\n  - `design-system.md` \u2014 tema \u00fanico por app (AppColors sem variante Dark), ZStack bg, animations, shadows, shimmer\n  - `localization.md` \u2014 Localizable.xcstrings + InfoPlist.xcstrings formato JSON\n  - `feature-flags.md` \u2014 FeatureFlags + MockDataProvider\n  - `platform.md` \u2014 Info.plist permissions table + entitlements\n  - `launch-screen.md` / `gitignore.md` / `git-ci-cd.md` \u2014 templates LaunchScreen XML, .gitignore, CI YAML + git conventions\n  - `storekit-extensions.md` \u2014 StoreKit 2, Widget, Live Activity, App Groups\n  - `security-background.md` \u2014 Keychain, Biometric, BGTaskScheduler\n  - `app-store.md` \u2014 App Store metadata + ASC review-blocking fields\n  - `screenshots.md` \u2014 screenshots pipeline + MarketingTheme + hard-won lessons\n  - `pre-release-checklist.md` / `packages-naming.md` / `lessons-ios.md` / `workflow.md` / `xcode-project.md`\n\n### Coordenadores (skills que ORQUESTRAM agentes \u2014 n\u00e3o executam o trabalho pesado)\n| Coordenador | Invoca | Cadeia de agentes |\n|-------------|--------|-------------------|\n| `/create-ios-app <descri\u00e7\u00e3o>` | criar app novo do zero (6 fases) | competitor-scout (fase 0.5) \u2192 aso-copywriter (fase 2) \u2192 screen-builder \u00d7N em paralelo (fase 4) \u2192 polish-reviewer (fase 5) \u2192 qa-runner (fase 5) |\n| `/start-aso-pipeline` | update de ASO de app j\u00e1 publicado | P0 (gates por script) \u2192 aso-extractor \u2192 aso-longtail-miner \u2192 aso-fit-checker \u2192 aso-serp-analyst \u2192 aso-field-composer \u2192 aso-listing-writer \u2192 aso-reporter \u2192 [com autoriza\u00e7\u00e3o] aso-deployer \u2192 gate G \u2192 deploy-verifier; checkpoints D7/D14/D28 via aso-checkpoint |\n| `/panorama-prints` | prints via imagem panor\u00e2mica IA | panorama-prompter (prepara refs + prompt; processa a imagem quando volta) |\n\nRegra dos coordenadores: contexto DENSO no prompt de cada agente, encadear outputs, nunca duplicar a an\u00e1lise do agente no pr\u00f3prio contexto. Est\u00e1gio violou regra dura \u2192 devolver PRO AGENTE citando a regra.\n\n### Subagentes do lab (`~/.claude/agents/`) \u2014 usar via Agent tool\n- `screen-builder` \u2014 implementa 1 tela a partir de brief denso + `ARCHITECTURE-BRIEF.md` do app; paraleliz\u00e1vel (Phase 4). NUNCA toca arquivos compartilhados (xcstrings/project.yml) \u2014 devolve as keys pro coordenador mergear.\n- `aso-copywriter` \u2014 Phase 2 inteira: research Astro + escreve `metadata/` 3 locales fora do contexto principal.\n- `polish-reviewer` \u2014 Phase 5: review fresh-eyes contra o spec; corrige o mec\u00e2nico, reporta o estrutural.\n- `qa-runner` \u2014 dirige o simulador (sim-mcp / sim-qa harness) e devolve s\u00f3 o checklist \u2705/\ud83d\udc1b (screenshots ficam no contexto dele).\n- `competitor-scout` \u2014 baixa e L\u00ca os prints/descriptions/reviews dos concorrentes de um nicho e devolve s\u00f3 o gap analysis (table stakes, wedges, padr\u00f5es visuais, dores). Fase 0.5 do create / Step 2.5 do research-aso.\n- `aso-checkpoint` \u2014 roda checkpoint D7/14/21/28 de uma itera\u00e7\u00e3o ASO (analytics + Astro vs targets do meta.json) e devolve veredito + pr\u00f3xima a\u00e7\u00e3o.\n- **Cadeia de update de ASO** (reformada 01/10/2026 \u2014 `reports/2026-10-01_aso-layer-audit/DESIGN.md`; encadeados pelo coordenador `/start-aso-pipeline` \u2014 invocar avulso via Agent tool passando iter dir + ids):\n  - `aso-extractor` \u2014 1. COLETA bruta: `current/asc_app.json`, volume oficial (`volume.py`), ratings por store, baselines `--compare`, Astro, mercado (`market_intel.py`), auditoria da listing live. Zero an\u00e1lise.\n  - `aso-longtail-miner` \u2014 2. LONG TAILS por palavra-core (suggestions + competitor extraction + queries naturais), cada uma com fonte rastre\u00e1vel, medida no Astro.\n  - `aso-fit-checker` \u2014 3. FIT termo-a-termo contra o que o app ENTREGA (invent\u00e1rio do source + NOT-list) \u2192 FIT/PARTIAL/MISMATCH.\n  - `aso-serp-analyst` \u2014 4. SERP/winnability por termo (DOMINATE/CLIMB/LOTTERY/UNWINNABLE) + mapa de prote\u00e7\u00e3o (composi\u00e7\u00e3o rankeada \u2192 token que a protege).\n  - `aso-field-composer` \u2014 5. COMP\u00d5E os campos por locale (token protegido NUNCA sai; OUT sem retorno sai; \u22643 apostas novas; dup check por locale; front-loading).\n  - `aso-listing-writer` \u2014 5b. TEXTO QUE CONVERTE (description/promo/whatsNew) contra os C1-C9 do `listing_check.py`; s\u00f3 feature `reachable`; aplica s\u00f3 com OK do Jo\u00e3o.\n  - `aso-reporter` \u2014 6. RELAT\u00d3RIO de decis\u00e3o (keyword_candidates.md SEM cabe\u00e7alho did\u00e1tico + meta.json can\u00f4nico) + link mdview.\n  - `aso-deployer` \u2014 7. DEPLOY verificado: `version_diff.py` antes do 1\u00ba PATCH, PATCH direto (nunca fastlane), read-back, **gate G** (`listing_check.py --only submittable` \u2192 `staged`/`blocked`), D0 no dia live. S\u00d3 com autoriza\u00e7\u00e3o do Jo\u00e3o.\n- `deploy-verifier` \u2014 depois de todo sync_metadata/upload de screenshots, confere via ASC API o que REALMENTE aplicou (deliver mente por omiss\u00e3o \u2014 LEARNINGS #13/#26/#27/#35), corrige com PATCH e devolve o diff.\n- `print-copywriter` \u2014 escreve os t\u00edtulos dos prints (2 linhas iguais, benef\u00edcio e n\u00e3o recurso, base nos l\u00edderes da categoria + boas pr\u00e1ticas pesquisadas na web, message match nos prints 1-3). Rodar ANTES de renderizar prints (panorama ou code-driven).\n- `panorama-prompter` \u2014 dono do fluxo panorama-prints: prepara refs + specs e escreve o PROMPT da imagem panor\u00e2mica pro Jo\u00e3o colar no ChatGPT/Nano Banana; quando a imagem volta, processa (corte, headlines, locales, PPO + verifica\u00e7\u00e3o).\n- **Analytics (Firebase/GA4) \u2014 cadeia `/firebase-insights`**: `analytics-extractor` (coleta bruta via `scripts/analytics/ga4_pull.py`: eventos, cohorts D1/D7/D30, funil, engajamento, vers\u00f5es/crash) \u2192 `analytics-analyst` (report com ativa\u00e7\u00e3o, reten\u00e7\u00e3o vs benchmarks, monetiza\u00e7\u00e3o, ratings, gaps \u2014 conhecimento consolidado 2026 dentro do agente) \u2192 `analytics-instrumentor` (implementa os eventos can\u00f4nicos de `_GambitStudio/analytics/event-taxonomy.md`).\n- `review-responder` \u2014 limpa o backlog de avalia\u00e7\u00f5es sem resposta via ASC API (rascunho na l\u00edngua do review, POST customerReviewResponses, refresh do dashboard).\n- `release-runner` \u2014 roda \"gere uma versao\" de ponta a ponta QUANDO pedido explicitamente (bump \u2192 tag \u2192 watch do run certo \u2192 build materializado na ASC \u2192 passos manuais restantes). Nunca por iniciativa pr\u00f3pria.\n\n### Templates de c\u00f3digo (copiar e adaptar)\n- Settings: `_GambitStudio/templates/settings/SettingsView.swift.template`\n- Paywall: usa `PaywallKit` (drop-in) \u2014 template antigo deprecated\n- Fastlane: `_GambitStudio/templates/fastlane/`\n- Screenshots tool: `_GambitStudio/templates/screenshots-tool/`\n\n### Swift Packages (SPM, importar por path)\n- `_GambitStudio/packages/GambitCoreKit/` \u2014 **base de todo app**: GambitPalette (configur\u00e1vel por nicho) + AppColors + AppFonts + AppSpacing + HapticManager + **ReviewService** (\u00fanico caminho de review: prompt NATIVO direto no aha-moment, com throttle, evento `review_prompt_requested`; sem pr\u00e9-prompt \u2014 RatingGate removido em 11/09/2026, LEARNINGS #88; Flutter usa `templates/flutter/review_prompt.dart`) + KeychainService + `.pressAnimation()` + `.shimmer()` + `SkeletonView`\n- `_GambitStudio/packages/OnboardingKit/` \u2014 `OnboardingFeaturePager` (multi-step padr\u00e3o) + `OnboardingScaffold` (single-screen hero) + `CinematicOnboardingScaffold` (N-step animado, hero frame, `CinematicTestimonialCarousel` + `CinematicSymbolHero`, asset-free)\n- `_GambitStudio/packages/PaywallKit/` \u2014 `StoreKitManager` (singleton) + `PaywallScaffold` + `PurchaseScaffold` (high-converting: shake hero, cooldown, save %, trial detection)\n- `_GambitStudio/packages/GambitScreenshotKit/` \u2014 render de screenshots (DeviceFrame, MarketingTheme, ImageRenderer)\n\n### Scripts compartilhados (rodar quando precisar)\n- **Lab Hub** (site OFICIAL = o **artifact privado no claude.ai** desde 01/10/2026; o export no GitHub Pages fica no ar como volta, parado e desatualizado, e o hook est\u00e1 renomeado pra `.DESLIGADO`; `/usr/bin/python3 _GambitStudio/tools/lab-hub/hub.py` \u2192 `[Lab Hub local]` \u00e9 s\u00f3 pr\u00e9-visualiza\u00e7\u00e3o local): home = p\u00e1gina \"Agora\" minimal (Fazer / Decidir / Esperando, cada item clic\u00e1vel com detalhe + hist\u00f3rico), alimentada por **`_GambitStudio/now.json`** \u2014 **TODA sess\u00e3o que mudar estado de projeto (subiu PPO, submeteu vers\u00e3o, resolveu a\u00e7\u00e3o manual) DEVE atualizar o now.json** (add/remover item + campo `updated`). Invent\u00e1rio completo (skills, agents, docs, reports, atividade git, pipelines ASO) fica em `/all`.\n  - **Publicar o hub** \u2014 `bash tools/lab-hub/publish_artifact.sh` monta a pasta (export + a home da fila + separa relat\u00f3rio pesado) e a tool Artifact publica no artifact do lab. A fila vive na cole\u00e7\u00e3o `queue` do banco do artifact e se l\u00ea/escreve com `ArtifactData`. O `publish_site.sh` (GitHub Pages) fica parado, n\u00e3o apagado \u2014 \u00e9 a volta. Detalhe em `tools/lab-hub/README.md`.\n- **Orchestrator (fila do lab + tarefa grande at\u00e9 o fim)** \u2014 `orchestrator/scan.py` roda por LaunchAgent (8h47) e enfileira o trabalho rotineiro VENCIDO lendo s\u00f3 o que est\u00e1 em disco (checkpoint ASO, PPO parado, rating-first, reviews, gap de analytics, colis\u00e3o de numera\u00e7\u00e3o no LEARNINGS); nunca chama a ASC. **A execu\u00e7\u00e3o noturna est\u00e1 DESLIGADA desde 06/09/2026, por decis\u00e3o do Jo\u00e3o** \u2014 o LaunchAgent `com.gambitstudio.orchestrator.night` foi removido do launchd e o plist renomeado pra `.DESLIGADO`. O `night_run.sh` continua no repo como hist\u00f3rico; n\u00e3o religar sem pedido expl\u00edcito dele. `/lab-orchestrate <tarefa|id>` decomp\u00f5e em work order com `done_when` por item, roda em ondas dimensionadas pelo trabalho (sem cap de simult\u00e2neos) e revisa cada retorno \u2014 `wo.py` RECUSA fechar item sem evid\u00eancia e work order com item aberto, e bloqueia sozinho ap\u00f3s 3 tentativas. Estado em disco: sess\u00e3o nova retoma. `orchestrator/README.md`\n- **Evals dos agentes** \u2014 os 20 agentes s\u00e3o prompts; o eval garante que uma edi\u00e7\u00e3o n\u00e3o apagou uma regra inviol\u00e1vel (protection map do `aso-field-composer`, \"PATCH never deliver\" do `aso-deployer`, \"NEVER edit shared files\" do `screen-builder`\u2026). Cada asser\u00e7\u00e3o carrega o `why` que a originou. Camadas: contract (prompt) \u00b7 artifact (outputs reais do agente) \u00b7 behavior (`--live`) + invariantes cross-agent (constantes do lab, lab auto-contido). Hook `agent-eval-guard.sh` roda o eval ao editar `~/.claude/agents/<x>.md`. `evals/run_evals.py` \u00b7 meta-teste por muta\u00e7\u00e3o em `evals/test_evals.py`\n- **Preflight (or\u00e1culos execut\u00e1veis do LEARNINGS)** \u2014 roda os checks determin\u00edsticos que antes dependiam de eu lembrar: `CFBundleIconName` na raiz do plist COMPILADO (#22/#52), case do Assets.car (#32), LaunchScreen (#0b), PrivacyInfo/GoogleService no bundle (#29/#56), regras de c\u00f3digo do RULES, e metadata LIVE na ASC (subtitle nulo #27, keywords >100 #13, l\u00e9xico 2.5.14 #40, prints duplicados #26). Hook `archive-preflight.sh` NEGA `-exportArchive` que reprovaria: `scripts/verify/preflight.py <app-dir> [--archive auto] [--app-id N]` \u00b7 eval em `scripts/verify/test_preflight.py`\n- **Verificador de analytics** (l\u00ea o SOURCE do app e acusa can\u00f4nico faltando, nome fora da taxonomia e evento declarado-mas-nunca-chamado; obrigat\u00f3rio no pr\u00e9-release): `scripts/analytics/verify-analytics.py <app-dir> --strict`\n- **Custo por agente** (telemetria dos subagentes lida dos transcripts do Claude Code em `~/.claude/projects/`: execu\u00e7\u00f5es, tokens, USD estimado pela tabela `PRICING`, mediana/total de dura\u00e7\u00e3o e \u00faltimas 10 execu\u00e7\u00f5es \u2014 por `subagent_type` e, no general-purpose, por descri\u00e7\u00e3o; s\u00f3 metadado, nunca texto de prompt; sem usage \u2192 `n\u00e3o verificado` exit 3; se\u00e7\u00e3o \"Custo por agente\" no `/all` do hub): `orchestrator/agent_costs.py --days 7 [--json] [--project <slug>]` \u00b7 teste em `orchestrator/test_agent_costs.py`\n- **Firebase/GA4 do lab** (p\u00e1gina `/firebase` do hub: quem est\u00e1 medindo, funil + reten\u00e7\u00e3o vs benchmark por app, gaps de instrumenta\u00e7\u00e3o, para onde ir, e os apps sem tracking nenhum): `scripts/analytics/firebase_snapshot.py` escreve `tools/lab-dashboard/data/firebase.json` (roda junto no `/refresh-lab-data`)\n- **Um projeto Firebase pode hospedar V\u00c1RIOS apps** \u2014 e todos caem na MESMA property GA4, ent\u00e3o ler por property soma apps diferentes (LEARNINGS #81). A unidade de leitura \u00e9 o **data stream**: `ga4_pull.py --stream <id>` (e `ga4_pull.py streams --property <id>` pra ver quem divide). O mapa app \u2192 (property, stream) \u00e9 derivado da Admin API a cada rodada e materializado em `firebase.json > stream_map`; o `firebase_snapshot.py` **recusa gravar** o snapshot se uma property compartilhada for lida sem filtro. Evals: `scripts/analytics/test_stream_isolation.py` + `test_stream_isolation_meta.py` (muta\u00e7\u00e3o)\n- **Lab Dashboard** (sales/receita R$/tend\u00eancia/veredito/reviews/testes A/B de todos os apps): skill `/lab-dashboard` \u2192 `tools/lab-dashboard/` \u2192 `http://localhost:8767/`\n- **mdview** (qualquer .md vira p\u00e1gina no browser com auto-reload \u2014 usar SEMPRE que for apresentar um .md pro Jo\u00e3o): `/usr/bin/python3 _GambitStudio/scripts/mdview/mdview.py <arquivo.md>` \u2192 `http://localhost:8768/view?path=...`\n- **Relat\u00f3rio de vers\u00e3o (PADR\u00c3O pra aprovar toda vers\u00e3o nova \u2014 Jo\u00e3o 28/09/2026)**: `/usr/local/bin/python3 scripts/preview/version_report.py --app <nome> --version <x.y.z> --slug <app>-<vers\u00e3o> --prints <pasta <locale>/<APP_IPHONE_67|65>/NN.png> --aso <iter>/research/keyword_candidates.md [--aso <outra iter> ...] --summary <resumo.md>` \u2192 uma p\u00e1gina com abas **Resumo** (o que entra, o que decidir, como enviar) \u00b7 **Prints** (layout do Preview Kit) \u00b7 **ASO** (keyword_candidates no padr\u00e3o GOLD). Fica em `reports/versions/<slug>/`, o Hub serve em `/versions/<slug>/` e o `publish_site.sh` publica no site. Lig
