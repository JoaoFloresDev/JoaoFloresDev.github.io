/* ---------- camada de acabamento (01/10/2026) ----------
   Tipografia com duas vozes (display para títulos e números, texto para leitura),
   neutros com viés do azul da marca em vez de cinza puro, e profundidade por
   sombra em vez de só borda. Nada aqui renomeia classe: é uma camada por cima. */
:root{
  --f-disp:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --f-text:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --bg:#eef1f7; --card:#ffffff; --tx:#0a0d14; --mut:#4b5567; --acc:#2b3340;
  --bd:#cbd3e0; --bd-soft:#dfe5ee; --ok:#07804e; --down:#c42121; --warn:#9a4408;
  --sh:0 1px 2px rgba(16,19,26,.05),0 2px 8px rgba(16,19,26,.04);
  --sh-up:0 2px 6px rgba(16,19,26,.07),0 10px 24px rgba(16,19,26,.07);
  --cardup:#ffffff; --bdup:#b9c3d4;
  --boardtop:#e9edf5; --boardbot:#e3e8f1;
  --bar:#2563eb; --bar2:#60a5fa;
  --rad:14px;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#07090d; --card:#141922; --tx:#f7f9fc; --mut:#b2bdd0; --acc:#ccd6e6;
  --bd:#333c4c; --bd-soft:#232a36; --ok:#55e39d; --down:#ff8585; --warn:#ffbb55;
  --sh:0 1px 2px rgba(0,0,0,.4); --sh-up:0 6px 22px rgba(0,0,0,.5);
  --cardup:#1d2430; --bdup:#3d4859;
  --boardtop:#0d1218; --boardbot:#090d13;
  --bar:#5b9bff; --bar2:#9dc4ff;
}}
body{font-family:var(--f-text);font-size:14.5px;line-height:1.6;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1{font-family:var(--f-disp);font-size:27px;font-weight:800;letter-spacing:-.02em;
  text-wrap:balance;margin:0 0 2px}
h1 .mark{display:inline-block;width:28px;height:28px;vertical-align:-5px;margin-right:11px;
  background-size:contain;background-repeat:no-repeat;background-position:center}
h2{font-family:var(--f-disp);font-size:12px;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;color:var(--mut);border-top:1px solid var(--bd-soft);
  padding-top:22px;margin:32px 0 14px}
h3{font-family:var(--f-disp);letter-spacing:-.01em}
.sub{font-size:13px;color:var(--mut)}
code,.mono{font-family:var(--f-mono);font-size:12.5px}
.card,table.t,a.tile,.row,.fcard,#md{box-shadow:var(--sh);border-color:var(--bd-soft)}
.card,a.tile,.row,.fcard{border-radius:var(--rad)}
a.tile,.row{transition:box-shadow .16s ease,border-color .16s ease,transform .16s ease}
a.tile:hover,a.row:hover{box-shadow:var(--sh-up);border-color:var(--bd);
  transform:translateY(-1px)}
/* O card do app é área de leitura, não botão: nada muda no hover. A regra antiga
   trocava a sombra, e num card sem sombra isso aparecia como animação. */
.fcard,.fcard:hover{transition:none!important;transform:none!important}
/* big numbers: the first thing anyone reads on the page */
.tiles{gap:12px;margin:18px 0 4px}
a.tile{padding:13px 17px;min-width:148px}
.tile .tl{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
  color:var(--mut)}
.tile .tv{font-family:var(--f-disp);font-size:25px;font-weight:800;letter-spacing:-.025em;
  margin-top:3px}
.tile .ts{font-size:11.5px;color:var(--mut)}
.tile .tvd{font-family:var(--f-text);font-size:13px;font-weight:600;letter-spacing:0;white-space:nowrap}
/* tables read as data, not as prose */
table.t{border-radius:var(--rad);font-variant-numeric:tabular-nums}
table.t th{font-family:var(--f-disp);font-size:11px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;background:var(--bd-soft);border-bottom:1px solid var(--bd)}
table.t td{padding:9px 13px;border-bottom:1px solid var(--bd-soft)}
table.t tbody tr:hover td,table.t tr:hover td{background:rgba(125,140,170,.06)}
.twrap{border-radius:var(--rad)}
/* buttons */
.btn{font-family:var(--f-disp);font-weight:600;font-size:13.5px;padding:9px 18px;
  border-radius:999px;box-shadow:var(--sh);transition:all .16s ease}
.btn:hover{border-color:var(--acc);box-shadow:var(--sh-up);transform:translateY(-1px)}
.pill,.st{font-family:var(--f-disp);font-weight:600;font-size:11.5px;letter-spacing:.02em}
/* status colours carry meaning, so keep them out of the accent */
.st.run,.st.appr{background:rgba(10,143,88,.14);color:var(--ok)}
.st.crit{background:rgba(208,47,47,.14);color:var(--down)}
.st.rev,.st.draft{background:rgba(180,83,9,.14);color:var(--warn)}
/* the lanes strip and any scroller get a thin, rounded bar */
.hrow,.twrap,.tiles{scrollbar-width:thin;scrollbar-color:var(--bd) transparent}
.hrow::-webkit-scrollbar,.twrap::-webkit-scrollbar,.tiles::-webkit-scrollbar{height:9px}
.hrow::-webkit-scrollbar-track,
.twrap::-webkit-scrollbar-track,
.tiles::-webkit-scrollbar-track{background:transparent}
.hrow::-webkit-scrollbar-thumb,
.twrap::-webkit-scrollbar-thumb,
.tiles::-webkit-scrollbar-thumb{background:var(--bd);border-radius:999px;
  border:3px solid transparent;background-clip:content-box}
.hrow::-webkit-scrollbar-thumb:hover,
.twrap::-webkit-scrollbar-thumb:hover,
.tiles::-webkit-scrollbar-thumb:hover{background:var(--mut);background-clip:content-box}
.hrow{background:transparent;border:0;padding:0;border-radius:0}
.hcol{flex:0 0 clamp(280px,26vw,360px);min-width:0}
a:focus-visible,button:focus-visible,.btn:focus-visible{outline:2px solid var(--acc);
  outline-offset:2px;border-radius:8px}
.dirlist,.prlist{margin:10px 0 0;padding-left:18px;list-style:none}
.dirlist>li,.prlist>li{position:relative;margin:0 0 7px;font-size:13.5px;line-height:1.5;
  color:var(--tx)}
.prlist>li{color:var(--mut);font-size:13px;margin-bottom:5px}
.dirlist>li::before,.prlist>li::before{content:"";position:absolute;left:-14px;top:.62em;
  width:5px;height:5px;border-radius:50%;background:var(--acc);opacity:.75}
.prlist>li::before{background:var(--mut);opacity:.5}
.dirp{display:none}
.dapps{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));
  margin:14px 0 4px;align-items:start}
.dapp{padding:14px 16px}
.dah{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.dah b{font-family:var(--f-disp);font-size:14.5px;font-weight:700}
.drank{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;
  border-radius:6px;background:var(--acc);color:var(--card);font-size:11.5px;font-weight:700;flex:none}
.st.d-dobrar{background:rgba(10,143,88,.16);color:var(--ok)}
.st.d-consertar{background:rgba(180,83,9,.16);color:var(--warn)}
.st.d-manter{background:rgba(125,140,170,.16);color:var(--mut)}
.st.d-congelar{background:rgba(125,140,170,.12);color:var(--mut)}
.dapp .prlist{margin-top:6px}
.dcall{color:var(--tx)!important;font-weight:600}
.fcard[id]{scroll-margin-top:18px}
.fdet{margin-top:10px;border-top:1px solid var(--bd-soft);padding-top:9px}
.fdet>summary{cursor:pointer;list-style:none;font-family:var(--f-disp);font-size:11.5px;
  font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);
  display:flex;align-items:center;gap:7px}
.fdet>summary::-webkit-details-marker{display:none}
.fdet>summary::before{content:"›";font-size:15px;transition:transform .15s}
.fdet[open]>summary::before{transform:rotate(90deg)}
.fdet>summary:hover{color:var(--acc)}
.fdet table.t{font-size:12.5px}
.fdet table.t td,.fdet table.t th{padding:6px 10px}
.fgrid.one{grid-template-columns:1fr!important;gap:18px}
/* Cada app é um painel com profundidade: a luz entra por cima, o corpo escurece
   até a base e a borda clareia só na primeira linha. É o que separa um app do
   outro sem precisar de moldura dura. */
.fgrid.one>.fcard{position:relative;padding:0;overflow:hidden;border-radius:16px;
  border:1px solid var(--bd-soft);
  background:linear-gradient(180deg,
    color-mix(in srgb, var(--acc) 5%, var(--card)) 0%,
    var(--card) 26%,
    color-mix(in srgb, #000 7%, var(--card)) 100%);
  box-shadow:0 1px 2px rgba(0,0,0,.05), 0 10px 26px -14px rgba(0,0,0,.28)}
@media(prefers-color-scheme:dark){.fgrid.one>.fcard{
  background:linear-gradient(180deg,
    color-mix(in srgb, var(--acc) 9%, var(--card)) 0%,
    var(--card) 30%,
    #0a0c10 100%);
  box-shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 18px 40px -22px rgba(0,0,0,.9)}}
.fgrid.one>.fcard::before{content:"";position:absolute;inset:0 0 auto;height:1px;
  background:linear-gradient(90deg, transparent,
    color-mix(in srgb, var(--acc) 45%, transparent), transparent)}
.fgrid.one>.fcard>.fh{background:transparent;margin:0;padding:15px 18px 12px;
  border-bottom:1px solid var(--bd-soft)}
.fgrid.one>.fcard>.fstats{padding:12px 18px 0}
.fgrid.one>.fcard>.fcols{padding:16px 18px 6px}
.fgrid.one>.fcard>.fdet{margin:0;padding:13px 18px 16px;border-top:1px solid var(--bd-soft);
  background:color-mix(in srgb, #000 4%, transparent)}
@media(prefers-color-scheme:dark){.fgrid.one>.fcard>.fdet{
  background:rgba(0,0,0,.25)}}
.fgrid.one>.fcard>.fh b{font-size:16px;letter-spacing:-.01em}
.fgrid.one>.fcard>.fh>span{font-size:12.5px;color:var(--tx);opacity:.78;
  font-variant-numeric:tabular-nums;font-weight:500}
/* a luz no topo do painel, um pouco mais presente */
.fgrid.one>.fcard::before{height:2px;
  background:linear-gradient(90deg, transparent, var(--acc), transparent);opacity:.5}
.fcard .fmeta{font-size:12px;color:var(--mut)}
/* funil: rótulo legível, número com peso, barra com corpo */
.fs{display:grid;grid-template-columns:150px 1fr auto;align-items:center;gap:12px;
  padding:5px 0}
.fs .fl{font-size:12.5px;color:var(--tx)}
.fs .fn{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;min-width:74px;
  text-align:right}
.fb{height:9px;border-radius:999px;background:var(--bd-soft);overflow:hidden}
.fb i{display:block;height:100%;border-radius:999px}
/* retenção com leitura imediata */
.rrow{margin:0}
.rc:first-child{border-top:0;padding-top:0}
/* o rótulo é legenda; quem salta é o número, na cor da régua */
.rc b{display:block;font-family:var(--f-disp);font-size:10px;font-weight:700;
  letter-spacing:.09em;text-transform:uppercase;color:var(--mut);margin:0}
.rc .rv{display:block;font-family:var(--f-disp);font-size:21px;font-weight:800;
  letter-spacing:-.025em;line-height:1.15;margin:3px 0 2px;font-variant-numeric:tabular-nums}
.rc>b{font-family:var(--f-disp);font-size:12px;font-weight:700;letter-spacing:.04em;
  color:var(--mut)}
.rc .rv{font-family:var(--f-disp);font-size:19px;font-weight:800;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums}
.rc .rb{display:block;font-size:11.5px;color:var(--mut)}
/* achados: mais ar e marcador claro */
.fnds li{font-size:12.5px;line-height:1.5;padding:4px 0 4px 16px}
.fnds li:before{width:6px;height:6px;top:.72em}
/* o detalhe convida a abrir */
.fdet>summary{font-size:11px;color:var(--acc);padding:3px 0}
.fdet>summary:hover{opacity:.82}
.fcols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;
  align-items:start}
@media(max-width:820px){.fcols{grid-template-columns:1fr;gap:12px}}
.fcol{min-width:0}
.fcol>.fnds{margin-top:0}
/* Régua de contexto do app: instalações, ativos, novos, crash-free. Antes isso
   era uma linha de texto corrido ("187 downloads/30d · WATCH · crash-free
   100%") que ninguém comparava entre cards; como números rotulados, dá pra
   varrer a coluna de cima a baixo. */
.fstats{display:flex;flex-wrap:wrap;gap:10px 26px;align-items:baseline}
.fst{display:flex;align-items:baseline;gap:7px;min-width:0}
.fstl{font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:var(--mut)}
.fst b{font-family:var(--f-disp);font-size:15px;font-weight:700;letter-spacing:-.015em;
  font-variant-numeric:tabular-nums}
.fstd{font-size:12px;font-weight:600}
.st.vd{background:rgba(125,140,170,.14);color:var(--mut)}
.fh .noasc{font-size:11.5px;font-weight:400;color:var(--warn)}
/* Cada metade do card diz o que é antes de mostrar número. */
.fgrp{margin-bottom:16px}
.fgrp:last-child{margin-bottom:0}
.fgl{display:block;font-family:var(--f-disp);font-size:10.5px;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;color:var(--mut);
  padding-bottom:7px;margin-bottom:10px;border-bottom:1px solid var(--bd-soft)}
.fcol>.fgrp>.fnds{margin-top:0}
.instrl{list-style:none;margin:9px 0 0;padding:0}
.instrl li{font-size:12.5px;line-height:1.55;color:var(--mut);padding:3px 0 3px 14px;
  position:relative;overflow-wrap:anywhere}
/* Coluna de leitura: linhas rotuladas, sem caixa. As caixas coloridas (funil
   verde, ação amarela) e o bloco expansível empilhavam quatro objetos de forma
   diferente num espaço estreito; rótulo à esquerda e texto à direita, separados
   por uma régua fina, lê de cima a baixo sem nada competindo (João, 02/10). */
.rline{display:grid;grid-template-columns:116px minmax(0,1fr);gap:16px;
  padding:12px 0;border-top:1px solid var(--bd-soft)}
.rline:first-child{border-top:0;padding-top:0}
.rlab{font-family:var(--f-disp);font-size:10.5px;font-weight:700;letter-spacing:.07em;
  text-transform:uppercase;color:var(--mut);padding-top:2px}
.rbody{min-width:0}
.rbody>b{display:block;font-family:var(--f-disp);font-size:14px;font-weight:700;
  letter-spacing:-.01em;line-height:1.35}
.rnum{display:block;margin-top:3px;font-size:12px;font-weight:600;color:var(--tx);
  font-variant-numeric:tabular-nums}
.rbody>p{margin:5px 0 0;font-size:12.5px;line-height:1.55;color:var(--mut)}
.rline.act .rlab{color:var(--tx)}
.rline.mut .rlab,.rline.mut .instrl li{color:var(--mut)}
.rbody>.fnds{margin:0}
@media(max-width:1180px){.rline{grid-template-columns:1fr;gap:6px}
  .rline .rlab{padding-top:0}}
.instrl{list-style:none;margin:0;padding:0}
.instrl li{font-size:12.5px;line-height:1.55;color:var(--mut);padding:2px 0 2px 14px;
  position:relative;overflow-wrap:anywhere}
.instrl li::before{content:"";position:absolute;left:0;top:.72em;width:5px;height:5px;
  border-radius:50%;background:var(--bd)}
/* Os passos de loja vêm de outra fonte que os de dentro do app: barra em tom
   mais surdo pra o olho ver onde a medição troca de sistema. */
.fs .fb i.store{background:linear-gradient(90deg,
  color-mix(in srgb, var(--bar) 45%, transparent),
  color-mix(in srgb, var(--bar) 70%, transparent))}
.fsub{display:block;font-size:10.5px;font-weight:600;letter-spacing:.07em;
  text-transform:uppercase;color:var(--mut);margin-bottom:6px}
.fsub.gap2{margin-top:14px}
.lchip{font-size:10px;color:var(--mut);background:var(--bd-soft);border-radius:999px;
  padding:1px 7px;cursor:help;white-space:nowrap}
.fcols{position:relative}
@media(min-width:821px){.fcols::before{content:"";position:absolute;top:0;bottom:0;
  left:50%;width:1px;background:var(--bd-soft)}}
.fdet .ascgrid{grid-template-columns:repeat(auto-fit,minmax(118px,1fr))}
.fdetcols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;
  align-items:start}
@media(max-width:1100px){.fdetcols{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:760px){.fdetcols{grid-template-columns:1fr}}
.fdetcols>div{min-width:0;display:flex;flex-direction:column;gap:14px}
.rawbox{background:var(--bg);border:1px solid var(--bd-soft);border-radius:11px;
  padding:11px 13px;min-width:0}
.rawbox h4,.rawbox h3.team{margin:0 0 8px;font-family:var(--f-disp);font-size:10.5px;
  font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--mut)}
.rawbox h3.team .chain{text-transform:none;letter-spacing:0;font-size:11px}
.rawbox table.t{border:0;box-shadow:none;background:transparent}
.rawbox table.t th{background:transparent;border-bottom:1px solid var(--bd)}
.rawbox table.t td{border-bottom:1px solid var(--bd-soft)}
.rawbox .twrap{border-radius:0}
.rawbox .ascgrid{margin-bottom:0;grid-template-columns:repeat(auto-fit,minmax(104px,1fr))}
.rawbox .ascgrid b{font-size:14px}
.srct{float:right;font-size:9px;font-weight:700;letter-spacing:.06em;padding:2px 7px;
  border-radius:999px;background:var(--bd);color:var(--mut);text-transform:uppercase}
.s-asc{background:rgba(125,140,170,.16);color:var(--tx)}
.s-firebase{background:rgba(180,83,9,.14);color:var(--warn)}
.noasc{background:rgba(180,83,9,.14);color:var(--warn);border-radius:999px;padding:1px 8px;
  font-size:10.5px;font-weight:600}
.convwhy{display:block;font-size:10.5px;color:var(--mut);margin-top:1px}
.rawbox .rate{padding:1px 7px;border-radius:999px;font-size:12.5px}
.featname{display:block;font-family:var(--f-mono);font-size:11.5px;margin-bottom:3px}
.featbar{display:block;height:4px;border-radius:999px;background:var(--bd-soft);overflow:hidden}
.featbar i{display:block;height:100%;border-radius:999px;
  background:linear-gradient(90deg, color-mix(in srgb, var(--acc) 70%, transparent), var(--acc))}
.legacyp{margin:8px 0 0;font-size:12px;color:var(--mut);line-height:1.7}
.legacyp code{font-size:11px}
.rawbox .ascgrid>div{background:var(--card)}
.fdet{margin-top:14px;border-top:1px solid var(--bd);padding-top:12px}
.fdet[open]>summary{margin-bottom:12px;color:var(--acc)}
.t .thsub{font-size:9.5px;font-weight:600;letter-spacing:.03em;color:var(--mut);
  text-transform:none}
.t .rate{padding:1px 8px;border-radius:999px;font-variant-numeric:tabular-nums}
.t .rate.good{background:rgba(10,143,88,.16);color:var(--ok)}
.t .rate.mid{background:rgba(180,83,9,.14);color:var(--warn)}
.t .rate.low{background:rgba(208,47,47,.13);color:var(--down)}
.thin{font-size:10.5px;color:var(--mut);background:var(--bd-soft);border-radius:999px;
  padding:1px 7px;cursor:help;white-space:nowrap}
.sbx{font-size:12px;color:var(--warn);background:rgba(180,83,9,.12);border-radius:999px;
  padding:1px 8px;cursor:help;white-space:nowrap}
.sbxnote{font-size:11.5px;color:var(--warn);background:rgba(180,83,9,.10);
  border:1px solid rgba(180,83,9,.25);border-radius:9px;padding:7px 10px;margin:0 0 10px}
.actv{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 9px;margin:0 0 10px;
  padding:8px 11px;border-radius:10px;background:var(--bd-soft)}
.actvt{font-family:var(--f-disp);font-size:10px;font-weight:800;letter-spacing:.09em;
  text-transform:uppercase;color:var(--mut)}
.actv b{font-family:var(--f-disp);font-size:15px;font-variant-numeric:tabular-nums}
.actvw{flex-basis:100%;font-size:11px;color:var(--mut)}
.fover{font-size:10.5px;color:var(--warn);background:rgba(180,83,9,.12);border-radius:999px;
  padding:1px 7px;cursor:help;white-space:nowrap}
.hspan{display:inline-block;margin-left:10px;font-size:10.5px;font-weight:600;letter-spacing:.04em;
  text-transform:none;color:var(--mut);background:var(--bd-soft);padding:2px 9px;border-radius:999px;
  vertical-align:2px}
.ascspan{font-size:11px;color:var(--mut);margin:2px 0 7px}
.ascgrid{display:grid;gap:7px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
  margin-bottom:10px}
.ascgrid>div{background:var(--bd-soft);border-radius:9px;padding:7px 10px;min-width:0}
.ascgrid span{display:block;font-size:10px;color:var(--mut);text-transform:uppercase;
  letter-spacing:.04em}
.ascgrid b{font-family:var(--f-disp);font-size:15px;font-variant-numeric:tabular-nums}
.fcard[id]:target{border-color:var(--acc);box-shadow:0 0 0 2px rgba(125,140,170,.3),var(--sh-up)}
/* ---------- acabamento: luz e profundidade (01/10) ----------
   Gradiente é usado onde tem função: a luz no topo dá direção à página, a barra
   do funil ganha volume, e o cabeçalho de cada app se separa do conteúdo. Fundo
   chapado em tudo o resto, para os números seguirem sendo o que salta. */
body{background:
  radial-gradient(1100px 420px at 12% -8%, color-mix(in srgb, var(--acc) 11%, transparent), transparent 70%),
  radial-gradient(900px 360px at 88% -4%, color-mix(in srgb, var(--ok) 7%, transparent), transparent 72%),
  var(--bg);
  background-attachment:fixed}

  -webkit-background-clip:text;background-clip:text;color:transparent}

h2{position:relative}
h2::after{content:"";position:absolute;left:0;top:0;width:44px;height:2px;
  background:linear-gradient(90deg, var(--acc), transparent)}
h2:first-of-type::after,h1+h2::after,.sub+h2::after{display:none}
a.tile{background:linear-gradient(170deg, color-mix(in srgb, var(--card) 100%, transparent),
  color-mix(in srgb, var(--acc) 5%, var(--card)))}
.fb i,.fs .fb i{background:linear-gradient(90deg,var(--bar),var(--bar2))}
.fgrid.one>.fcard>.fh{background:linear-gradient(180deg,
  color-mix(in srgb, var(--acc) 7%, var(--card)), var(--bd-soft))}
.ascgrid b,.tile .tv{background:linear-gradient(180deg, var(--tx), color-mix(in srgb, var(--tx) 72%, var(--mut)));
  -webkit-background-clip:text;background-clip:text;color:transparent}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
/* ---------- celular (14/10) ----------
   No iPhone a página nunca rola de lado: grade cede a largura pros filhos, tabela
   rola dentro do .twrap, o menu rola dentro da própria faixa. Quadro e big numbers
   seguem numa linha só com rolagem horizontal, em qualquer largura (João, 14/10). */
.cols>*,.cols2>*,.grid>*,.grid4>*,.dapps>*,.fgrid>*{min-width:0}
.board .hrow,.tiles{flex-wrap:nowrap!important;overflow-x:auto}
#md table{display:block;max-width:100%;overflow-x:auto}
#md p,#md li,#md :not(pre)>code{overflow-wrap:anywhere}
img,video{max-width:100%}
@media(max-width:860px){
  .topin{width:calc(100vw - 28px)}
}
@media(max-width:620px){
  /* header do celular (24/10): UMA linha de 52 px — cavalo + abas que rolam de
     lado com encaixe; a data sai do header fixo e vira a 1ª linha da página. */
  .topin{flex-wrap:nowrap;gap:2px;padding:4px 0;
    padding-left:env(safe-area-inset-left,0px)}
  a.brand{flex:none;min-width:44px;min-height:44px;justify-content:center;gap:0}
  a.brand .mark{width:24px;height:24px}
  a.brand .bname{display:none}
  .stamp{display:none}
  .navs{flex:1 1 auto;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;
    -webkit-overflow-scrolling:touch;scroll-snap-type:x proximity;overscroll-behavior-x:contain;
    margin-right:-14px;padding:0 max(14px,env(safe-area-inset-right,0px)) 0 2px;gap:2px;
    -webkit-ma[redigido]:linear-gradient(90deg,#000 calc(100% - 28px),transparent);
    ma[redigido]:linear-gradient(90deg,#000 calc(100% - 28px),transparent)}
  .navs::-webkit-scrollbar{display:none}
  a.nav{flex:none;scroll-snap-align:start;min-height:44px;padding:0 12px;gap:6px;font-size:14px}
  a.nav .flw-mon{width:24px;height:24px}
  .mstamp{display:block;margin:-10px 0 10px;font-size:11.5px;color:var(--mut)}
  .mstamp+style+h2,.mstamp+h2{margin-top:6px}
  div.own{padding:6px 12px;margin:0 0 12px;gap:10px}
  div.own img.flw-mon{width:40px;height:40px}
  details.pk-legend{padding:0 14px;margin-bottom:12px}
  details.pk-legend>summary{min-height:44px;padding:11px 0}
  body{font-size:15px;overflow-wrap:break-word}
  h1{font-size:24px}
  .sub,.card p,.row,.dirp,.prw,.nots li,.dirlist>li{font-size:14px}
  table.t td,table.t th{font-size:13.5px}
  table.t td:first-child,table.t th:first-child{min-width:148px}
  #md{padding:16px 14px}
  .board{padding:12px 0 14px;margin-left:0;margin-right:0}
  .boardh{padding:0 14px}
  .board .hrow{padding:12px 14px 12px;scroll-padding:0 14px}
  a.more,.btn{display:inline-flex;align-items:center;min-height:44px}
  .row{min-height:44px}
  .del{min-width:44px;min-height:44px;opacity:.7}
  .iid{position:relative}
  .iid::after{content:"";position:absolute;inset:-12px -8px}
  .fdet>summary,details>summary{min-height:44px}
  .fs{grid-template-columns:minmax(0,118px) minmax(0,1fr) auto}
  .leak,.fnote{margin-left:0}
  /* quadro no celular: rolagem lateral, como quadro (João 14/10, e de novo 25/10: "deixa como quadro que eu
     consigo fazer scroll horizontal, ficou muito extenso na vertical" — o empilhamento de 25/10 saiu).
     Fazer abre o quadro, com o item em trabalho no topo; Backlog fica por último. */
  .board .hcol{order:3}.board .hcol.k-do{order:1}.board .hcol.k-wait{order:2}.board .hcol.k-backlog{order:4}
  .row.working .vwork{flex-wrap:wrap}
  .row .sub{white-space:normal}
  /* big numbers em grade de 2 no celular: nada cortado */
  .tiles{display:grid!important;grid-template-columns:1fr 1fr;overflow-x:visible!important}
  .tiles>.tile,a.tile{min-width:0!important;padding:10px 12px}
  .tile .tv{font-size:clamp(17px,5.4vw,22px)!important;white-space:normal}
}

html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
a.nav.on{background:color-mix(in srgb,var(--bar) 13%,transparent);color:var(--tx);
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--bar) 22%,transparent)}
a.nav .flw-mon{transition:transform .18s ease}

/* dono da seção: legenda calma ao lado do título, não mais um segundo título em caixa alta */
h2 .ownb,h3 .ownb{text-transform:none;letter-spacing:0;font-family:var(--f-text);font-size:12.5px;font-weight:500;vertical-align:middle}
h2 .ownb .ownp b,h3 .ownb .ownp b{font-weight:700}
div.own{border-color:var(--bd-soft);box-shadow:var(--sh);border-radius:var(--rad)}

/* big numbers que não são link (Seller) ganham o mesmo cartão dos da home */
.tiles>div.tile{background:linear-gradient(170deg,var(--card),color-mix(in srgb,var(--acc) 5%,var(--card)));
  border:1px solid var(--bd-soft);border-radius:var(--rad);padding:13px 17px;box-shadow:var(--sh);min-width:148px}
@media(max-width:620px){
  .mstamp{margin:-6px 0 12px}
  .card,a.tile,.tiles>div.tile,.row,.fcard,div.own,.board,table.t,.twrap,#md{border-radius:16px}
  .tiles>div.tile{min-width:0;padding:10px 12px}
  h1{font-size:26px;line-height:1.2}
  h2{margin-top:28px}
}

o 30/10 16:56</div><style>.dh{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px;margin:4px 0 18px}.dh-back{font:600 14px -apple-system,system-ui,sans-serif;padding:8px 16px;border-radius:999px;border:0;background:#111;color:#fff;cursor:pointer}.dh-mon{display:flex;align-items:center;gap:10px;padding:6px 14px 6px 6px;border:1px solid var(--bd);border-radius:14px;background:var(--card)}.dh-mon>div{display:flex;flex-direction:column}.dh-mon b{font-size:16px}.dh-mon span{font-size:12.5px;color:var(--mut);max-width:34ch}</style><div class=dh><button class=dh-back type=button onclick="history.back()">← voltar</button></div><p class="sub"><code>_GambitStudio/INDEX.md</code></p><div id="md"><div class=mdpart data-i="0"></div></div><script>const RAWS=["# GambitStudio \u2014 Index (onde achar o qu\u00ea)\n\n> Auto-loaded em toda sess\u00e3o. Aponta pra onde est\u00e1 cada coisa. N\u00e3o duplica conte\u00fado \u2014 s\u00f3 direciona.\n\n## Sempre-loaded (j\u00e1 no contexto, n\u00e3o precisa abrir)\n- **RULES.md** \u2014 regras imut\u00e1veis de execu\u00e7\u00e3o (autonomia, paleta por nicho, paths, IDs, padr\u00f5es inviol\u00e1veis)\n- **COMMANDS.md** \u2014 pipeline completa de dev + improve, manual operacional\n- **LEARNINGS-INDEX.md** \u2014 bugs j\u00e1 vividos, 1 linha (a regra) por item, NUNCA repetir. O texto completo (`LEARNINGS.md`, 220 KB) N\u00c3O carrega: ler sob demanda com `grep -n '^## N' LEARNINGS.md` \u2192 Read com offset/limit\n\n## Read on-demand (abrir quando precisar do t\u00f3pico)\n\n### Conven\u00e7\u00f5es de c\u00f3digo + arquitetura\n- Pattern b\u00edblia **fatiada em `_GambitStudio/spec/`** \u2014 mapa completo (qual fatia, quem l\u00ea) em `_GambitStudio/CLAUDE.md`. Ler S\u00d3 a fatia do t\u00f3pico:\n  - `mvvm.md` / `code-standards.md` \u2014 MVVM folder structure, MARK, naming, 600 linhas\n  - `design-system.md` \u2014 tema \u00fanico por app (AppColors sem variante Dark), ZStack bg, animations, shadows, shimmer\n  - `localization.md` \u2014 Localizable.xcstrings + InfoPlist.xcstrings formato JSON\n  - `feature-flags.md` \u2014 FeatureFlags + MockDataProvider\n  - `platform.md` \u2014 Info.plist permissions table + entitlements\n  - `launch-screen.md` / `gitignore.md` / `git-ci-cd.md` \u2014 templates LaunchScreen XML, .gitignore, CI YAML + git conventions\n  - `storekit-extensions.md` \u2014 StoreKit 2, Widget, Live Activity, App Groups\n  - `security-background.md` \u2014 Keychain, Biometric, BGTaskScheduler\n  - `app-store.md` \u2014 App Store metadata + ASC review-blocking fields\n  - `screenshots.md` \u2014 screenshots pipeline + MarketingTheme + hard-won lessons\n  - `video-playbook.md` \u2014 v\u00eddeos TikTok/Reels: regras R1-R12 com o porqu\u00ea, 6 formatos, voz, m\u00fasica, zonas seguras, legendas SEO, checklist de quadros\n  - `pre-release-checklist.md` / `packages-naming.md` / `lessons-ios.md` / `workflow.md` / `xcode-project.md`\n\n### Coordenadores (skills que ORQUESTRAM agentes \u2014 n\u00e3o executam o trabalho pesado)\n| Coordenador | Invoca | Cadeia de agentes |\n|-------------|--------|-------------------|\n| `/create-ios-app <descri\u00e7\u00e3o>` | criar app novo do zero (6 fases) | competitor-scout (fase 0.5) \u2192 aso-copywriter (fase 2) \u2192 app-artist icon (fase 3) \u2192 screen-builder \u00d7N em paralelo \u2192 app-artist illustrations (fase 4) \u2192 polish-reviewer (fase 5) \u2192 qa-runner (fase 5) |\n| `/start-aso-pipeline` | update de ASO de app j\u00e1 publicado | P0 (gates por script) \u2192 aso-extractor \u2192 aso-longtail-miner \u2192 aso-fit-checker \u2192 aso-serp-analyst \u2192 aso-field-composer \u2192 aso-listing-writer \u2192 aso-reporter \u2192 [com autoriza\u00e7\u00e3o] aso-deployer \u2192 gate G \u2192 deploy-verifier; checkpoints D7/D14/D28 via aso-checkpoint |\n| `/panorama-ppo` | PPO A/B/C por panorama IA de ponta a ponta \u2014 fluxo NOVO em teste (20/10), ao lado do antigo | print-copywriter + um agente de tradu\u00e7\u00e3o por tratamento; o GPT s\u00f3 gera a panorama |\n| `/panorama-prints` | prints via imagem panor\u00e2mica IA | panorama-prompter (prepara refs + prompt; processa a imagem quando volta) |\n| `/app-videos` | v\u00eddeos TikTok/Reels de um app (HyperFrames 1080\u00d71920) | telas reais (raw screens) \u2192 video-hook-researcher (obrigat\u00f3rio) \u2192 video-builder \u00d7N em paralelo \u2192 render SERIAL + revis\u00e3o de quadros/capa (`publish_video.py`) \u2192 video-caption-writer \u2192 aba V\u00eddeos do site + aprova\u00e7\u00e3o por ID |\n\nRegra dos coordenadores: contexto DENSO no prompt de cada agente, encadear outputs, nunca duplicar a an\u00e1lise do agente no pr\u00f3prio contexto. Est\u00e1gio violou regra dura \u2192 devolver PRO AGENTE citando a regra.\n\n<!-- cast:start (gerado por tools/lab-hub/flows.py cast_markdown; test_flows.py cobra) -->\n**Elenco Pok\u00e9mon** \u2014 o Jo\u00e3o chama agentes, fluxos e etapas pelo Pok\u00e9mon (\"o Mew t\u00e1 demorando\" = product-designer). Toda mensagem de andamento no chat COME\u00c7A com a miniatura + nome de quem est\u00e1 trabalhando: `/usr/local/bin/python3 _GambitStudio/tools/lab-hub/chat_icon.py <pok\u00e9mon|agente> \"<etapa>\"` imprime `![Mew](data:image/png;base64,...) **Mew \u00b7 etapa**` pra colar no come\u00e7o (o chat s\u00f3 desenha imagem embutida; link externo vira \"mostrar imagem\"). Agente gen\u00e9rico dentro de um fluxo = o coordenador do fluxo. Jo\u00e3o = Treinador Flowers (pok\u00e9bola).\n- Coordenadores (fluxo): \ud83d\udd2eMew = /create-ios-app <ideia> \u00b7 \ud83d\udd2eLugia = /start-aso-pipeline \u00b7 \ud83d\udd25Entei = /panorama-ppo \u00b7 \u2b50Jirachi = /gpt-refs \u2192 /panorama-prints \u00b7 \u26f0\ufe0fGroudon = /code-driven-prints \u00b7 \ud83d\udd25Moltres = /app-videos \u00b7 \ud83d\udd2eMewtwo = /firebase-insights \u00b7 \u26a1Zapdos = /release <app> \u00b7 \u26a1Raikou = /develop-task \u00b7 \ud83d\udca7Articuno = /polish <app> \u00b7 \ud83d\udca7Suicune = /reviews \u00b7 \ud83d\udc09Rayquaza = /lab-orchestrate \u00b7 \u2b50Arceus = /general-director \u00b7 \ud83d\udca7Kyogre = /refresh-lab-data \u00b7 \ud83c\udf43Celebi = /research-aso-keywords \u00b7 \ud83d\udca7Manaphy = /gpt-refs \u00b7 \ud83d\udd2eCresselia = /panorama-prints \u00b7 \ud83c\udf11Darkrai = servidor <horas>\n- Agentes: \ud83d\udd25Charizard = product-strategist \u00b7 \ud83c\udf43Venusaur = monetization-planner \u00b7 \ud83d\udd25Ninetales = screen-designer \u00b7 \ud83d\udca7Magikarp = product-designer \u00b7 \u26f0\ufe0fGolem = aso-deploy-gate \u00b7 \u26a1Raichu = cpp-builder \u00b7 \ud83e\udeb6Pidgeot = aso-d0-recorder \u00b7 \u26f0\ufe0fDugtrio = niche-keyword-miner \u00b7 \u26f0\ufe0fNidoking = store-setup \u00b7 \ud83d\udca7Golduck = gate-reporter \u00b7 \ud83e\udd4aMachamp = screen-builder \u00b7 \ud83d\udd2eGardevoir = polish-reviewer \u00b7 \ud83d\udc7bGengar = competitor-scout \u00b7 \ud83d\udd2eAlakazam = aso-serp-analyst \u00b7 \ud83d\udd2eEspeon = aso-fit-checker \u00b7 \ud83d\udca7Vaporeon = aso-field-composer \u00b7 \u26a1Jolteon = aso-listing-writer \u00b7 \ud83d\udc1eScizor = aso-deployer \u00b7 \ud83c\udf11Umbreon = aso-reporter \u00b7 \ud83e\udd4aHitmonlee = release-runner \u00b7 \ud83d\udd25Blaziken = video-builder \u00b7 \u2699\ufe0fMetagross = analytics-analyst \u00b7 \u26a1Electivire = analytics-instrumentor \u00b7 \u2b50Smeargle = panorama-prompter \u00b7 \ud83d\udd25Typhlosion = ppo-prompt-writer \u00b7 \ud83d\udc1eHeracross = bug-fixer \u00b7 \ud83c\udf43Torterra = print-screen-builder \u00b7 \ud83d\udd2eHypno = print-visual-gate \u00b7 \ud83c\udf11Absol = niche-viability \u00b7 \ud83d\udc09Garchomp = foundation-builder \u00b7 \u2b50Kecleon = app-artist \u00b7 \u2728Togetic = moments-designer \u00b7 \ud83d\udca7Wartortle = onboarding-planner \u00b7 \ud83d\udc1eAriados = qa-planner \u00b7 \ud83d\udd25Quilava = ppo-checkpoint \u00b7 \ud83d\udc1eScyther = qa-runner \u00b7 \ud83d\udd2eKirlia = aso-copywriter \u00b7 \ud83d\udd25Charmeleon = ppo-adjuster \u00b7 \ud83d\udc7bHaunter = video-hook-researcher \u00b7 \ud83d\udd25Combusken = video-brief-planner \u00b7 \ud83d\udd25Monferno = bug-reproducer \u00b7 \ud83d\udc1ePinsir = fix-verifier \u00b7 \ud83d\udd25Flareon = aso-longtail-miner \u00b7 \ud83d\udd2eAbra = ppo-localizer \u00b7 \u2b50Eevee = review-drafter \u00b7 \u2b50Blissey = review-responder \u00b7 \ud83c\udf43Turtwig = aso-checkpoint \u00b7 \ud83d\udd25Torchic = video-caption-writer \u00b7 \ud83e\udeb6Chatot = video-copywriter \u00b7 \u26f0\ufe0fAerodactyl = print-copywriter \u00b7 \ud83d\udd25Charmander = print-text-fitter \u00b7 \ud83d\udd25Growlithe = deploy-verifier \u00b7 \ud83d\udca7Totodile = analytics-extractor \u00b7 \ud83d\udca7Buizel = aso-extractor\n- Outros: Ditto = gera\u00e7\u00e3o paga no GPT \u00b7 Magnemite = script \u00b7 Piplup = /release-notes-style \u00b7 Butterfree = /swiftui-design \u00b7 Hitmonchan = /build-ios\n<!-- cast:end -->\n\n### Subagentes do lab (`.claude/agents/` deste repo, linkado em `~/.claude/agents`; mapa da pasta em `.claude/README.md`) \u2014 usar via Agent tool\n- `screen-builder` \u2014 implementa 1 tela a partir de brief denso + `ARCHITECTURE-BRIEF.md` do app; paraleliz\u00e1vel (Phase 4). NUNCA toca arquivos compartilhados (xcstrings/project.yml) \u2014 devolve as keys pro coordenador mergear.\n- `aso-copywriter` \u2014 Phase 2 inteira: research Astro + escreve `metadata/` 3 locales fora do contexto principal.\n- `app-artist` \u2014 arte pr\u00f3pria do app nova (29/10/2026): modo `icon` na onda da Fase 3 (\u00edcones dos l\u00edderes \u2265 5k como r\u00e9gua, 2-3 candidatos GPT, gate a 60 px na fileira da busca, arte da splash no `LaunchLogo`) e modo `illustrations` na Fase 4 (8-12 ilustra\u00e7\u00f5es GPT num estilo s\u00f3, na paleta, sem texto, em `<app>/art/<data>_custom/`, ligadas nas telas).\n- `polish-reviewer` \u2014 Phase 5: review fresh-eyes contra o spec; corrige o mec\u00e2nico, reporta o estrutural; escreve `docs/<data>_pro-review.md` (l\u00edderes \u2265 5k \u00d7 n\u00f3s em design e funcionalidades) e l\u00ea cada print atr\u00e1s de defeito.\n- `qa-planner` \u2014 ANTES do qa-runner (Jo\u00e3o 21/10/2026): l\u00ea o c\u00f3digo do app (telas, StoreKit, permiss\u00f5es, deep links, eventos chamados, gatilho do review) e escreve `<app>/qa/<data>_plan.md` \u2014 cen\u00e1rios por ramo for\u00e7ado, seed, passos por `accessibilityIdentifier`, prova esperada (id + evento) e prioridade.\n- `qa-runner` \u2014 EXECUTA o plano do qa-planner no simulador (sim-mcp / sim-qa harness; sem plano ele recusa) e devolve s\u00f3 o checklist \u2705/\ud83d\udc1b/\u23ed\ufe0f numerado (screenshots ficam no contexto dele).\n- `competitor-scout` \u2014 baixa e L\u00ca os prints/descriptions/reviews dos concorrentes de um nicho e devolve s\u00f3 o gap analysis (table stakes, wedges, padr\u00f5es visuais, dores). Fase 0.5 do create / Step 2.5 do research-aso.\n- `aso-checkpoint` \u2014 roda checkpoint D7/14/21/28 de uma itera\u00e7\u00e3o ASO (analytics + Astro vs targets do meta.json) e devolve veredito + pr\u00f3xima a\u00e7\u00e3o.\n- `ppo-checkpoint` \u2014 leitura D7/D14/D28 de um PPO rodando (Jo\u00e3o 21/10/2026): estado/datas/tratamentos pela API (`scripts/asc/ppo_reading.py`), contexto da p\u00e1gina com n, resultado por bra\u00e7o S\u00d3 do que o Jo\u00e3o colar do ASC web (`results/web_<data>.json`), `results/<data>_reading.md` + se\u00e7\u00e3o Leituras da p\u00e1gina do teste no site. Agendado por `ppo_reading.py schedule --write-meta` no Start; o `scan.py` enfileira a vencida (kind `ppo_reading`).\n- **Cadeia de update de ASO** (reformada 01/10/2026 \u2014 `reports/2026-10-01_aso-layer-audit/DESIGN.md`; encadeados pelo coordenador `/start-aso-pipeline` \u2014 invocar avulso via Agent tool passando iter dir + ids):\n  - `aso-extractor` \u2014 1. COLETA bruta: `current/asc_app.json`, volume oficial (`volume.py`), ratings por store, baselines `--compare`, Astro, mercado (`market_intel.py`), auditoria da listing live. Zero an\u00e1lise.\n  - `aso-longtail-miner` \u2014 2. LONG TAILS por palavra-core (suggestions + competitor extraction + queries naturais), cada uma com fonte rastre\u00e1vel, medida no Astro.\n  - `aso-fit-checker` \u2014 3. FIT termo-a-termo: \"\u00e9 esperado que um app desse nicho fa\u00e7a isso?\" (Jo\u00e3o 21/10/2026) \u2192 FIT (entrega, com cadeia de alcance) / EXPECTED (l\u00edderes do nicho com \u2265 5k ratings fazem, a gente n\u00e3o \u2014 entra nos campos, feature vai pro `research/feature_backlog.md`) / PARTIAL (poliss\u00eamico) / MISMATCH (fora). Description/promo/whatsNew s\u00f3 falam do que \u00e9 FIT.\n  - `aso-serp-analyst` \u2014 4. SERP/winnability por termo (DOMINATE/CLIMB/LOTTERY/UNWINNABLE) + mapa de prote\u00e7\u00e3o (composi\u00e7\u00e3o rankeada \u2192 token que a protege).\n  - `aso-field-composer` \u2014 5. COMP\u00d5E os campos por locale (token protegido NUNCA sai; OUT sem retorno sai; \u22643 apostas novas; dup check por locale; front-loading).\n  - `aso-listing-writer` \u2014 5b. TEXTO QUE CONVERTE (description/promo/whatsNew) contra os C1-C9 do `listing_check.py`; s\u00f3 feature `reachable`; aplica s\u00f3 com OK do Jo\u00e3o.\n  - `aso-reporter` \u2014 6. RELAT\u00d3RIO de decis\u00e3o (keyword_candidates.md SEM cabe\u00e7alho did\u00e1tico + meta.json can\u00f4nico) + link mdview.\n  - `aso-deployer` \u2014 7. DEPLOY verificado: `version_diff.py` antes do 1\u00ba PATCH, PATCH direto (nunca fastlane), read-back, **gate G** (`listing_check.py --only submittable` \u2192 `staged`/`blocked`), D0 no dia live. S\u00d3 com autoriza\u00e7\u00e3o do Jo\u00e3o.\n- `deploy-verifier` \u2014 depois de todo sync_metadata/upload de screenshots, confere via ASC API o que REALMENTE aplicou (deliver mente por omiss\u00e3o \u2014 LEARNINGS #13/#26/#27/#35), corrige com PATCH e devolve o diff.\n- `print-copywriter` \u2014 escreve os t\u00edtulos dos prints (2 linhas iguais, benef\u00edcio e n\u00e3o recurso, base nos l\u00edderes da categoria + boas pr\u00e1ticas pesquisadas na web, message match nos prints 1-3). Rodar ANTES de renderizar prints (panorama ou code-driven).\n- `panorama-prompter` \u2014 dono do fluxo panorama-prints: prepara refs + specs e escreve o PROMPT da imagem panor\u00e2mica pro Jo\u00e3o colar no ChatGPT/Nano Banana; quando a imagem volta, processa (corte, headlines, locales, PPO + verifica\u00e7\u00e3o).\n- **Analytics (Firebase/GA4) \u2014 cadeia `/firebase-insights`**: `analytics-extractor` (coleta bruta via `scripts/analytics/ga4_pull.py`: eventos, cohorts D1/D7/D30, funil, engajamento, vers\u00f5es/crash) \u2192 `analytics-analyst` (report com ativa\u00e7\u00e3o, reten\u00e7\u00e3o vs benchmarks, monetiza\u00e7\u00e3o, ratings, gaps \u2014 conhecimento consolidado 2026 dentro do agente) \u2192 `analytics-instrumentor` (implementa os eventos can\u00f4nicos de `_GambitStudio/analytics/event-taxonomy.md`).\n- `review-responder` \u2014 limpa o backlog de avalia\u00e7\u00f5es sem resposta via ASC API (rascunho na l\u00edngua do review, POST customerReviewResponses, refresh do dashboard).\n- **V\u00eddeo (cadeia `/app-videos`, 14/10/2026 \u2014 regras em `spec/video-playbook.md`)**: `video-hook-researcher` (obrigat\u00f3rio em toda leva, Jo\u00e3o 21/10; N conceitos com formato/arte diferentes, cada um com fonte) \u2192 `video-builder` (UM v\u00eddeo por agente, paraleliz\u00e1vel; kit + template + `tts.py` + `build_from_timing.py`, `check` + snapshot lido, devolve `cover_t`; N\u00c3O renderiza) \u2192 `video-caption-writer` (legenda TikTok/Instagram + 5 hashtags + keywords com fonte do Google/YouTube Suggest em `captions.json`).\n- `release-runner` \u2014 roda \"gere uma versao\" de ponta a ponta QUANDO pedido explicitamente (bump \u2192 tag \u2192 watch do run certo \u2192 build materializado na ASC \u2192 passos manuais restantes). Nunca por iniciativa pr\u00f3pria.\n\n### Ferramentas de terceiros instaladas (14/10/2026 \u2014 lidas antes, auto-update desligado)\n- **V\u00eddeo:** plugin `hyperframes` (HeyGen; v\u00eddeo em HTML, `npx [email] \u2026`, render local testado no Intel: 10 s em 30 s; projetos de cada app em `<app>/video-pipeline/` \u2014 no lab s\u00f3 `video/_kit/`) \u00b7 plugin `goldie` (App Preview a partir do simulador, MCP `argent`) \u00b7 plugin `postiz` + CLI `postiz` (rascunhos TikTok/Instagram; precisa de conta/API key do Jo\u00e3o). ffmpeg/ffprobe = bin\u00e1rios Intel do npm (`~/.local/share/ffmpeg-static`), porque o brew no Intel compila do zero e esbarra no CLT.\n- **Dev/QA:** MCP `mobilebuild` (MobileBuildMCP 2.7.1, telemetria Sentry desligada) \u00b7 plugins `app-store-review` e `greenlight` + bin\u00e1rio `greenlight` 0.2.0 (`greenlight preflight .` antes do archive).\n- **Produto/design:** MCP `reddit` (reddit-mcp-buddy 1.1.14, s\u00f3 leitura) \u00b7 skill `swiftui-design` (vendored em `.claude/skills/swiftui-design`) \u00b7 plugin `refactoring-ui-skills`.\n- Relat\u00f3rio da varredura: `reports/2026-10-14_github-tools-scan/`.\n\n### Templates de c\u00f3digo (copiar e adaptar)\n- Settings: `_GambitStudio/templates/settings/SettingsView.swift.template`\n- Paywall: usa `PaywallKit` (drop-in) \u2014 template antigo deprecated\n- Fastlane: `_GambitStudio/templates/fastlane/`\n- Screenshots tool: `_GambitStudio/templates/screenshots-tool/`\n\n### Swift Packages (SPM, importar por path)\n- `_GambitStudio/packages/GambitCoreKit/` \u2014 **base de todo app**: GambitPalette (configur\u00e1vel por nicho) + AppColors + AppFonts + AppSpacing + HapticManager + **ReviewService** (\u00fanico caminho de review: prompt NATIVO direto no aha-moment, com throttle, evento `review_prompt_requested`; sem pr\u00e9-prompt \u2014 RatingGate removido em 11/09/2026, LEARNINGS #88; Flutter usa `templates/flutter/review_prompt.dart`) + KeychainService + `.pressAnimation()` + `.shimmer()` + `SkeletonView`\n- `_GambitStudio/packages/OnboardingKit/` \u2014 `OnboardingFeaturePager` (multi-step padr\u00e3o) + `OnboardingScaffold` (single-screen hero) + `CinematicOnboardingScaffold` (N-step animado, hero frame, `CinematicTestimonialCarousel` + `CinematicSymbolHero`, asset-free)\n- `_GambitStudio/packages/PaywallKit/` \u2014 `StoreKitManager` (singleton) + `PaywallScaffold` + `PurchaseScaffold` (high-converting: shake hero, cooldown, save %, trial detection)\n- `_GambitStudio/packages/GambitScreenshotKit/` \u2014 render de screenshots (DeviceFrame, MarketingTheme, ImageRenderer)\n\n### Scripts compartilhados (rodar quando precisar)\n- **Lab Hub** (site OFICIAL = o export no **GitHub Pages** \u2014 o artifact do claude.ai foi testado e descartado em 01/10/2026, ver RULES \"Site do lab\"; publicar com `tools/lab-hub/publish_site.sh`; `/usr/bin/python3 _GambitStudio/tools/lab-hub/hub.py` \u2192 `[Lab Hub local]` \u00e9 s\u00f3 pr\u00e9-visualiza\u00e7\u00e3o local): home = p\u00e1gina \"Agora\" minimal (Fazer / Decidir / Esperando, cada item clic\u00e1vel com detalhe + hist\u00f3rico), alimentada por **`_GambitStudio/now.json`** \u2014 **TODA sess\u00e3o que mudar estado de projeto (subiu PPO, submeteu vers\u00e3o, resolveu a\u00e7\u00e3o manual) DEVE atualizar o now.json** (add/remover item + campo `updated`). Invent\u00e1rio completo (skills, agents, docs, reports, atividade git, pipelines ASO) fica em `/all`.\n  - **Publicar o hub** \u2014 `bash tools/lab-hub/publish_artifact.sh` monta a pasta (export + a home da fila + separa relat\u00f3rio pesado) e a tool Artifact publica no artifact do lab. A fila vive na cole\u00e7\u00e3o `queue` do banco do artifact e se l\u00ea/escreve com `ArtifactData`. O `publish_site.sh` (GitHub Pages) fica parado, n\u00e3o apagado \u2014 \u00e9 a volta. Detalhe em `tools/lab-hub/README.md`.\n- **Orchestrator (fila do lab + tarefa grande at\u00e9 o fim)** \u2014 `orchestrator/scan.py` roda dentro do `/refresh-lab-data` (o LaunchAgent das 8h47 foi desligado em 21/10/2026) e enfileira o trabalho rotineiro VENCIDO lendo s\u00f3 o que est\u00e1 em disco (checkpoint ASO, PPO parado, rating-first, reviews, gap de analytics, colis\u00e3o de numera\u00e7\u00e3o no LEARNINGS); nunca chama a ASC. **A execu\u00e7\u00e3o noturna est\u00e1 DESLIGADA desde 06/09/2026, por decis\u00e3o do Jo\u00e3o** \u2014 o LaunchAgent `com.gambitstudio.orchestrator.night` foi removido do launchd e o plist renomeado pra `.DESLIGADO`. O `night_run.sh` continua no repo como hist\u00f3rico; n\u00e3o religar sem pedido expl\u00edcito dele. `/lab-orchestrate <tarefa|id>` decomp\u00f5e em work order com `done_when` por item, roda em ondas dimensionadas pelo trabalho (sem cap de simult\u00e2neos) e revisa cada retorno \u2014 `wo.py` RECUSA fechar item sem evid\u00eancia e work order com item aberto, e bloqueia sozinho ap\u00f3s 3 tentativas. Estado em disco: sess\u00e3o nova retoma. `orchestrator/README.md`\n- **Evals dos agentes** \u2014 os 20 agentes s\u00e3o prompts; o eval garante que uma edi\u00e7\u00e3o n\u00e3o apagou uma regra inviol\u00e1vel (protection map do `aso-field-composer`, \"PATCH never deliver\" do `aso-deployer`, \"NEVER edit shared files\" do `screen-builder`\u2026). Cada asser\u00e7\u00e3o carrega o `why` que a originou. Camadas: contract (prompt) \u00b7 artifact (outputs reais do agente) \u00b7 behavior (`--live`) + invariantes cross-agent (constantes do lab, lab auto-contido). Hook `agent-eval-guard.sh` roda o eval ao editar `.claude/agents/<x>.md`. `evals/run_evals.py` \u00b7 meta-teste por muta\u00e7\u00e3o em `evals/test_evals.py`\n- **Preflight (or\u00e1culos execut\u00e1veis do LEARNINGS)** \u2014 roda os checks determin\u00edsticos que antes dependiam de eu lembrar: `CFBundleIconName` na raiz do plist COMPILADO (#22/#52), case do Assets.car (#32), LaunchScreen (#0b), PrivacyInfo/GoogleService no bundle (#29/#56), regras de c\u00f3digo do RULES, e metadata LIVE na ASC (subtitle nulo #27, keywords >100 #13, l\u00e9xico 2.5.14 #40, prints duplicados #26). Hook `archive-preflight.sh` NEGA `-exportArchive` que reprovaria: `scripts/verify/preflight.py <app-dir> [--archive auto] [--app-id N]` \u00b7 eval em `scripts/verify/test_preflight.py`\n- **Verificador de analytics** (l\u00ea o SOURCE do app e acusa can\u00f4nico faltando, nome fora da taxonomia e evento declarado-mas-nunca-chamado; obrigat\u00f3rio no pr\u00e9-release): `scripts/analytics/verify-analytics.py <app-dir> --strict`\n- **Custo por agente** (telemetria dos subagentes lida dos transcripts do Claude Code em `~/.claude/projects/`: execu\u00e7\u00f5es, tokens, USD estimado pela tabela `PRICING`, mediana/total de dura\u00e7\u00e3o e \u00faltimas 10 execu\u00e7\u00f5es \u2014 por `subagent_type` e, no general-purpose, por descri\u00e7\u00e3o; s\u00f3 metadado, nunca texto de prompt; sem usage \u2192 `n\u00e3o verificado` exit 3; se\u00e7\u00e3o \"Custo por agente\" no `/all` do hub): `orchestrator/agent_costs.py --days 7 [--json] [--project <slug>]` \u00b7 teste em `orchestrator/test_agent_costs.py`\n- **Firebase/GA4 do lab** (p\u00e1gina `/firebase` do hub: quem est\u00e1 medindo, funil + reten\u00e7\u00e3o vs benchmark por app, gaps de instrumenta\u00e7\u00e3o, para onde ir, e os apps sem tracking nenhum): `scripts/analytics/firebase_snapshot.py` escreve `tools/lab-dashboard/data/firebase.json` (roda junto no `/refresh-lab-data`)\n- **Um projeto Firebase pode hospedar V\u00c1RIOS apps** \u2014 e todos caem na MESMA property GA4, ent\u00e3o ler por property soma apps diferentes (LEARNINGS #81). A unidade de leitura \u00e9 o **data stream**: `ga4_pull.py --stream <id>` (e `ga4_pull.py streams --property <id>` pra ver quem divide). O mapa app \u2192 (property, stream) \u00e9 derivado da Admin API a cada rodada e materializado em `firebase.json > stream_map`; o `firebase_snapshot.py` **recusa gravar** o snapshot se uma property compartilhada for lida sem filtro. Evals: `scripts/analytics/test_stream_isolation.py` + `test_stream_isolation_meta.py` (muta\u00e7\u00e3o)\n- **Dados do site** (sales/receita/tend\u00eancia/veredito/reviews/testes A/B de todos os apps): `/refresh-lab-data` coleta em `tools/lab-dashboard/data/` e publica; a skill `/lab-dashboard` (painel local :8767) foi apagada em 21/10/2026 por duplicar o site\n- **mdview** (qualquer .md vira p\u00e1gina no browser com auto-reload \u2014 usar SEMPRE que for apresentar um .md pro Jo\u00e3o): `/usr/bin/python3 _GambitStudio/scripts/mdview/mdview.py <arquivo.md>` \u2192 `http://localhost:8768/view?path=...`\n- **Relat\u00f3rio de vers\u00e3o (PADR\u00c3O pra aprovar toda vers\u00e3o nova \u2014 Jo\u00e3o 28/09/2026)**: `/usr/local/bin/python3 scripts/preview/version_report.py --app <nome> --version <x.y.z> --slug <app>-<vers\u00e3o> --prints <pasta <locale>/<APP_IPHONE_67|65>/NN.png> --aso <iter>/research/keyword_candidates.md [--aso <outra iter> ...] --summary <resumo.md>` \u2192 uma p\u00e1gina com abas **Resumo** (o que entra, o que decidir, como enviar) \u00b7 **Prints** (layout do Preview Kit) \u00b7 **ASO** (keyword_candidates no padr\u00e3o GOLD). Fica em `reports/versions/<slug>/`, o Hub serve em `/versions/<slug>/` e o `publish_site.sh` publica no site. Ligar ao item do now.json com `\"report\": \"<slug>\"` (bot\u00e3o \"Relat\u00f3rio da vers\u00e3o\") e `\"page\": \"<slug>\"` (endere\u00e7o fixo no site). Preview Kit continua sendo o de aprova\u00e7\u00e3o de prints de A/B; a p\u00e1gina A/B do Hub \u00e9 pra teste rodando.\n- **Preview Kit** (visualizar imagens geradas estilo App Store Connect): `_GambitStudio/scripts/preview/preview <app-dir>` \u2192 registra o app, sobe o server \u00fanico (porta 8765), imprime o link `http://localhost:8765/?app=<id>`. Auto-refresh a cada 4s; sidebar treatment/locale; cards arredondados (sem mock de celular). Mandar o link pro Jo\u00e3o conferir \u2014 ele n\u00e3o navega pastas. README em `scripts/preview/README.md`.\n- **V\u00eddeo TikTok/Reels** (`spec/video-playbook.md`): kit gen\u00e9rico `video/_kit/` (sfx, fontes, selo, \u00edcones, `make_beat.py`) \u00b7 composi\u00e7\u00e3o modelo `temp   e.preventDefault();
  var t=b.dataset.ref||b.textContent, done=function(ok){
    var old=b.textContent; b.textContent=ok?"copiado":t; b.classList.toggle("ok",ok);
    setTimeout(function(){b.textContent=t;b.classList.remove("ok");},1100);
  };
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(function(){done(true);},function(){done(false);});
  } else {
    var ta=document.createElement("textarea"); ta.value=t; document.body.appendChild(ta);
    ta.select(); var ok=false; try{ok=document.execCommand("copy");}catch(err){}
    document.body.removeChild(ta); done(ok);
  }
});
