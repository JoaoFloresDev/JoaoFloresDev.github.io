<style>

.hcol .row{flex-direction:column;align-items:flex-start;gap:4px}.hcol .row b{white-space:normal}.hcol .row span{width:100%}.hcol .row em{display:none}.hcol .row.done b{font-size:12px}.hrow{display:flex;gap:20px;overflow-x:auto;align-items:flex-start;padding:16px 28px 12px;margin:18px 0 26px;background:rgba(125,125,125,.07);border:1px solid var(--bd);border-radius:16px;scroll-padding:0 28px}.hcol{flex:0 0 340px;min-width:340px}.hcol:last-child{margin-right:28px}.hcol h2{margin-top:0}.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:0 20px}.cols2{display:grid;grid-template-columns:1fr 1fr;gap:0 20px;align-items:start}@media(max-width:900px){.cols2{grid-template-columns:1fr}}h3.team{margin:18px 0 8px;font-size:15px;font-weight:600}h3.team .chain{display:block;color:var(--mut);font-weight:400;font-size:12.5px;margin-top:2px}.card .step{display:inline-block;min-width:18px;height:18px;line-height:18px;text-align:center;border-radius:9px;background:var(--bd);color:var(--mut);font-size:11px;font-weight:600;margin-right:6px}.grid4{display:grid;gap:12px;grid-template-columns:repeat(4,1fr)}@media(max-width:1100px){.grid4{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.grid4{grid-template-columns:1fr}}

.fcard{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:13px 15px}

/* ---------- camada de acabamento (01/10/2026) ----------
   Tipografia com duas vozes (display para títulos e números, texto para leitura),
   neutros com viés do azul da marca em vez de cinza puro, e profundidade por
   sombra em vez de só borda. Nada aqui renomeia classe: é uma camada por cima. */
:root{
  --f-disp:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --f-text:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --bg:#f3f5f9; --card:#ffffff; --tx:#10131a; --mut:#5a6377; --acc:#1552d8;
  --bd:#dde2ea; --bd-soft:#e8ecf3; --ok:#0a8f58; --down:#d02f2f; --warn:#b45309;
  --sh:0 1px 2px rgba(16,19,26,.05),0 2px 8px rgba(16,19,26,.04);
  --sh-up:0 2px 6px rgba(16,19,26,.07),0 10px 24px rgba(16,19,26,.07);
  --rad:14px;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#0b0d12; --card:#161a22; --tx:#eef1f7; --mut:#9aa5b8; --acc:#7aa6ff;
  --bd:#272d39; --bd-soft:#1f242e; --ok:#43d08d; --down:#ff7070; --warn:#e5a645;
  --sh:0 1px 2px rgba(0,0,0,.4); --sh-up:0 6px 22px rgba(0,0,0,.5);
}}
body{font-family:var(--f-text);font-size:14.5px;line-height:1.6;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1{font-family:var(--f-disp);font-size:27px;font-weight:800;letter-spacing:-.02em;
  text-wrap:balance;margin:0 0 2px}
h1 .mark{display:inline-block;width:28px;height:28px;vertical-align:-5px;margin-right:11px;
  background-size:contain;background-repeat:no-repeat;background-position:center}
h2{font-family:var(--f-disp);font-size:12px;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;color:var(--mut);border-top:1px solid var(--bd-soft);
  padding-top:22px;margin:32px 0 14px}
h3{font-family:var(--f-disp);letter-spacing:-.01em}
.sub{font-size:13px;color:var(--mut)}
code,.mono{font-family:var(--f-mono);font-size:12.5px}
.card,table.t,a.tile,.row,.fcard,#md{box-shadow:var(--sh);border-color:var(--bd-soft)}
.card,a.tile,.row,.fcard{border-radius:var(--rad);
  transition:box-shadow .16s ease,border-color .16s ease,transform .16s ease}
a.tile:hover,a.row:hover,.fcard:hover{box-shadow:var(--sh-up);border-color:var(--bd);
  transform:translateY(-1px)}
/* big numbers: the first thing anyone reads on the page */
.tiles{gap:12px;margin:18px 0 4px;padding-bottom:10px}
a.tile{padding:13px 17px;min-width:148px}
.tile .tl{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
  color:var(--mut)}
.tile .tv{font-family:var(--f-disp);font-size:25px;font-weight:800;letter-spacing:-.025em;
  margin-top:3px}
.tile .ts{font-size:11.5px;color:var(--mut)}
/* tables read as data, not as prose */
table.t{border-radius:var(--rad);font-variant-numeric:tabular-nums}
table.t th{font-family:var(--f-disp);font-size:11px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;background:var(--bd-soft);border-bottom:1px solid var(--bd)}
table.t td{padding:9px 13px;border-bottom:1px solid var(--bd-soft)}
table.t tbody tr:hover td,table.t tr:hover td{background:rgba(125,140,170,.06)}
.twrap{border-radius:var(--rad)}
/* buttons */
.btn{font-family:var(--f-disp);font-weight:600;font-size:13.5px;padding:9px 18px;
  border-radius:999px;box-shadow:var(--sh);transition:all .16s ease}
.btn:hover{border-color:var(--acc);box-shadow:var(--sh-up);transform:translateY(-1px)}
.pill,.st{font-family:var(--f-disp);font-weight:600;font-size:11.5px;letter-spacing:.02em}
/* status colours carry meaning, so keep them out of the accent */
.st.run,.st.appr{background:rgba(10,143,88,.14);color:var(--ok)}
.st.crit{background:rgba(208,47,47,.14);color:var(--down)}
.st.rev,.st.draft{background:rgba(180,83,9,.14);color:var(--warn)}
/* the lanes strip and any scroller get a thin, rounded bar */
.tiles,.hrow,.twrap{scrollbar-width:thin;scrollbar-color:var(--bd) transparent}
.tiles::-webkit-scrollbar,.hrow::-webkit-scrollbar,.twrap::-webkit-scrollbar{height:9px}
.tiles::-webkit-scrollbar-track,.hrow::-webkit-scrollbar-track,
.twrap::-webkit-scrollbar-track{background:transparent}
.tiles::-webkit-scrollbar-thumb,.hrow::-webkit-scrollbar-thumb,
.twrap::-webkit-scrollbar-thumb{background:var(--bd);border-radius:999px;
  border:3px solid transparent;background-clip:content-box}
.tiles::-webkit-scrollbar-thumb:hover,.hrow::-webkit-scrollbar-thumb:hover,
.twrap::-webkit-scrollbar-thumb:hover{background:var(--mut);background-clip:content-box}
.hrow{background:transparent;border:0;padding:0;border-radius:0}
.hcol{flex:0 0 clamp(280px,26vw,360px);min-width:0}
a:focus-visible,button:focus-visible,.btn:focus-visible{outline:2px solid var(--acc);
  outline-offset:2px;border-radius:8px}
.dirlist,.prlist{margin:10px 0 0;padding-left:18px;list-style:none}
.dirlist>li,.prlist>li{position:relative;margin:0 0 7px;font-size:13.5px;line-height:1.5;
  color:var(--tx)}
.prlist>li{color:var(--mut);font-size:13px;margin-bottom:5px}
.dirlist>li::before,.prlist>li::before{content:"";position:absolute;left:-14px;top:.62em;
  width:5px;height:5px;border-radius:50%;background:var(--acc);opacity:.75}
.prlist>li::before{background:var(--mut);opacity:.5}
.dirp{display:none}
.dapps{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));
  margin:14px 0 4px;align-items:start}
.dapp{padding:14px 16px}
.dah{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.dah b{font-family:var(--f-disp);font-size:14.5px;font-weight:700}
.drank{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;
  border-radius:6px;background:var(--acc);color:#fff;font-size:11.5px;font-weight:700;flex:none}
.st.d-dobrar{background:rgba(10,143,88,.16);color:var(--ok)}
.st.d-consertar{background:rgba(180,83,9,.16);color:var(--warn)}
.st.d-manter{background:rgba(125,140,170,.16);color:var(--mut)}
.st.d-congelar{background:rgba(125,140,170,.12);color:var(--mut)}
.dapp .prlist{margin-top:6px}
.dcall{color:var(--tx)!important;font-weight:600}
.fcard[id]{scroll-margin-top:18px}
.fdet{margin-top:10px;border-top:1px solid var(--bd-soft);padding-top:9px}
.fdet>summary{cursor:pointer;list-style:none;font-family:var(--f-disp);font-size:11.5px;
  font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);
  display:flex;align-items:center;gap:7px}
.fdet>summary::-webkit-details-marker{display:none}
.fdet>summary::before{content:"›";font-size:15px;transition:transform .15s}
.fdet[open]>summary::before{transform:rotate(90deg)}
.fdet>summary:hover{color:var(--acc)}
.fdet table.t{font-size:12.5px}
.fdet table.t td,.fdet table.t th{padding:6px 10px}
.fgrid.one{grid-template-columns:1fr!important}
.fcols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;
  align-items:start}
@media(max-width:820px){.fcols{grid-template-columns:1fr;gap:12px}}
.fcol{min-width:0}
.fcol>.fnds{margin-top:0}
.fdet .ascgrid{grid-template-columns:repeat(auto-fit,minmax(118px,1fr))}
.fdetcols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;
  align-items:start}
@media(max-width:820px){.fdetcols{grid-template-columns:1fr}}
.thin{font-size:10.5px;color:var(--mut);background:var(--bd-soft);border-radius:999px;
  padding:1px 7px;cursor:help;white-space:nowrap}
.thinnote{font-size:11.5px;color:var(--mut);background:var(--bd-soft);border-radius:9px;
  padding:7px 10px;margin:0 0 10px}
.sbx{font-size:12px;color:var(--warn);background:rgba(180,83,9,.12);border-radius:999px;
  padding:1px 8px;cursor:help;white-space:nowrap}
.sbxnote{font-size:11.5px;color:var(--warn);background:rgba(180,83,9,.10);
  border:1px solid rgba(180,83,9,.25);border-radius:9px;padding:7px 10px;margin:0 0 10px}
.actv{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 9px;margin:0 0 10px;
  padding:8px 11px;border-radius:10px;background:var(--bd-soft)}
.actvt{font-family:var(--f-disp);font-size:10px;font-weight:800;letter-spacing:.09em;

<body><div class="wrap"><p class="sub" style="font-size:12px;margin:0 0 14px">Exportado em 2026-10-01 16:07 · fonte: Lab Hub local</p><p class="sub"><a href="../index.html">← hub</a> · <code>Apps/recovery/ios/AirDraw/aso-pipeline/iterations/2026-08-06_iter-01-text-en-US-keywords/research/keyword_candidates.md</code></p><div id="md"></div><script>const RAW="# Keyword candidates \u2014 Neon Glow Draw (en-US) \u2014 iter-01\n\n**Data:** 2026-08-06\n**Source:** Astro MCP (`add_keywords`/`get_app_keywords` \u2014 233 termos trackeados us; 116 desta iter em `current_pool_en-US.csv` + `candidates_en-US.csv`)\n**Filtro decis\u00e3o (quadrante):** diff \u2264 20 = gold \u00b7 diff 21-40 + pop \u2265 10 = sweet \u00b7 diff 41-60 + pop \u2265 25 ou rank < 100 = aposta moderada \u00b7 diff > 60 s\u00f3 com pop \u2265 40 no name\n\n## Peso ASO por campo\n\n| Campo | Peso | Estrat\u00e9gia |\n|---|---|---|\n| name | 7\u00d7 | N\u00c3O mexer nesta iter \u2014 brand \"Neon Glow Draw: Light Art 3D\" j\u00e1 rankeia r=1 no pr\u00f3prio nicho (neon glow draw, light art 3d) |\n| subtitle | 3\u00d7 | Trocar termos fracos (graffiti/glitter) pelos confirmados (light painting, camera, show) |\n| keywords | 1\u00d7 | Cortar peso morto (diff 68-85 OUT), entrar air + confirmados + composi\u00e7\u00f5es de feature |\n\n**Princ\u00edpio:** n\u00e3o duplicar termos entre campos \u2014 Apple indexa na primeira ocorr\u00eancia. (Exce\u00e7\u00e3o deliberada nesta iter: `light` repete no subtitle pela tese de adjac\u00eancia \u2014 ver Riscos #1.)\n\n**Caveat Astro pop=5:** `5` \u00e9 o PISO do Astro (volume n\u00e3o detect\u00e1vel com confian\u00e7a). Termo pop=5 pode ter volume real 0 ou 5-15/dia. Tratar como incerteza, n\u00e3o como zero.\n\n## \ud83d\udcd0 Diff visual \u2014 antes/depois\n\nLegenda: <span style=\"color:#dc3545\">\ud83d\udd34 saiu</span> \u00b7 <span style=\"color:#28a745\">\ud83d\udfe2 entrou novo</span> \u00b7 <span style=\"color:#3b82f6\">\ud83d\udd35 subiu de peso</span> \u00b7 <span style=\"color:#1e3a8a\">\ud83d\udd35 desceu de peso</span> \u00b7 preto = mant\u00e9m\n\n| Campo | Antes | Depois |\n|---|---|---|\n| Name | Neon Glow Draw: Light Art 3D | Neon Glow Draw: Light Art 3D *(inalterado)* |\n| Subtitle | Painting, <span style=\"color:#1e3a8a\">Graffiti</span> & <span style=\"color:#1e3a8a\">Glitter</span> | <span style=\"color:#28a745\">Light</span> Painting <span style=\"color:#3b82f6\">Camera</span> & <span style=\"color:#3b82f6\">Show</span> |\n| Keywords | <span style=\"color:#dc3545\">doodle</span>,<span style=\"color:#dc3545\">sketch</span>,paint,laser,sparkle,<span style=\"color:#dc3545\">trippy</span>,<span style=\"color:#3b82f6\">show</span>,sign,marker,party,<span style=\"color:#dc3545\">kids</span>,<span style=\"color:#dc3545\">spray</span>,<span style=\"color:#dc3545\">fluid</span>,<span style=\"color:#dc3545\">magic</span>,<span style=\"color:#3b82f6\">camera</span> | <span style=\"color:#28a745\">air</span>,<span style=\"color:#28a745\">long</span>,<span style=\"color:#28a745\">exposure</span>,marker,<span style=\"color:#1e3a8a\">graffiti</span>,<span style=\"color:#1e3a8a\">glitter</span>,sign,laser,party,sparkle,<span style=\"color:#28a745\">text</span>,<span style=\"color:#28a745\">write</span>,<span style=\"color:#28a745\">maker</span>,<span style=\"color:#28a745\">brush</span>,paint,<span style=\"color:#28a745\">pen</span> |\n\n(camera e show SOBEM de peso 1\u00d7\u21923\u00d7; graffiti e glitter DESCEM 3\u00d7\u21921\u00d7 mas seguem indexados.)\n\n## \ud83c\udff7 NAME (inalterado \u2014 28/30)\n\n| Palavra | Pop | Diff | Rank atual | Decis\u00e3o |\n|---|---|---|---|---|\n| `neon` | 58 | 54 | OUT (solo) | \u2705 mant\u00e9m \u2014 \u00e2ncora do nicho; comp\u00f5e 15+ termos que rankeiam |\n| `glow` | 53 | 52 | OUT (solo) | \u2705 mant\u00e9m \u2014 glow draw r=20, glow drawing r=25 |\n| `draw` | 65 | 81 | OUT (solo) | \u2705 mant\u00e9m \u2014 verbo do produto; comp\u00f5e tudo |\n| `light` | \u2014 | \u2014 | light art r=10 | \u2705 mant\u00e9m \u2014 light art 3d r=1 |\n| `art` | \u2014 | \u2014 | (composto) | \u2705 mant\u00e9m |\n| `3d` | \u2014 | \u2014 | 3d neon r=10 | \u2705 mant\u00e9m \u2014 neon 3d art r=4 |\n\nHead-terms solo (neon/glow/draw pop 53-65) est\u00e3o OUT \u2014 esperado, diff 52-81 contra apps de 50k+ ratings. O valor do name est\u00e1 nas COMPOSI\u00c7\u00d5ES, que rankeiam bem.\n\n## \ud83c\udff7 SUBTITLE\n\nAtual: `Painting, Graffiti & Glitter` (28/30) \u2192 Proposto: `Light Painting Camera & Show` (28/30)\n\n| Palavra atual | Pop | Diff | Rank | Decis\u00e3o |\n|---|---|---|---|---|\n| `painting` | 8 | 82 | OUT solo | mant\u00e9m (vira \u00e2ncora de \"light painting\") |\n| `graffiti` | 7 | 17 | OUT | \ud83d\udd3d desce pra keywords (1\u00d7) \u2014 pop baixo n\u00e3o paga 3\u00d7 |\n| `glitter` | 5 | 15 | glitter drawing r=30 | \ud83d\udd3d desce pra keywords (1\u00d7) |\n\n### ENTROU\n\n| Termo | Pop | Diff | Rank atual | Por qu\u00ea |\n|---|---|---|---|---|\n| `light painting` (bigram adjacente) | 9 | 15 | OUT | \ud83e\udd47 TESE CENTRAL: comp\u00f5e cross-field hoje e est\u00e1 OUT; verbatim adjacente a 3\u00d7 deve destravar. Top-10 do nicho fraqu\u00edssimo (<110 ratings) |\n| `camera` (1\u00d7\u21923\u00d7) | 69 | 70 | OUT | \ud83e\udd48 `light painting camera` r=25 vira trigram verbatim \u2192 top-10 esperado |\n| `show` (1\u00d7\u21923\u00d7) | 7 | 80 | OUT | `light show` (pop 20, diff 23 \ud83e\udd48) comp\u00f5e DENTRO do subtitle; `laser show` (diff 11) comp\u00f5e com kw laser |\n\n### SAIU (desceu de peso)\n\n| Termo | Pop | Diff | Rank | Mitiga\u00e7\u00e3o |\n|---|---|---|---|---|\n| `graffiti` | 7 | 17 | OUT | segue indexado a 1\u00d7; graffiti drawing (diff 17) preservado |\n| `glitter` | 5 | 15 | glitter drawing r=30 | segue a 1\u00d7; rank-protect monitorado |\n\n## \ud83d\udd11 KEYWORDS FIELD\n\nAtual (94/100): `doodle,sketch,paint,laser,sparkle,trippy,show,sign,marker,party,kids,spray,fluid,magic,camera`\nProposto (99/100): `air,long,exposure,marker,graffiti,glitter,sign,laser,party,sparkle,text,write,maker,brush,paint,pen`\n\n### ENTROU\n\n| Termo | Pop | Diff | Rank hoje | Por qu\u00ea |\n|---|---|---|---|---|\n| `air` | \u2014 | \u2014 | draw in air **r=1**, drawing in the air r=13 | \ud83e\udd47 token AUSENTE de todos os campos; ranks atuais s\u00e3o res\u00edduo da marca antiga \"Air Draw\" \u2014 o token segura o cluster inteiro do produto (5 termos compostos) |\n| `long`+`exposure` | 9 | 19 | OUT | \ud83e\udd48 pop confirmado; cluster foto com top fraco |\n| `text` | 5 | 17 | OUT | neon text (17), 3d text (21) \u2014 feature real (print WOW) |\n| `write` | 5 | 11 | OUT | write with light (11), write in the air (21) \u2014 feature real |\n| `maker` | 5 | 5 | neon sign maker r=143 | diff 5 (!) \u2014 comp\u00f5e com sign que j\u00e1 est\u00e1 no campo |\n| `brush` | 5 | 13 | neon brush r=157 | rainbow brush (print 3) |\n| `pen` | 5 | 17 | glitter pen r=117 | comp\u00f5e com glitter/light/3d |\n\n### SAIU\n\n| Termo | Pop | Diff | Rank | Por qu\u00ea |\n|---|---|---|---|---|\n| `kids` | 59 | 85 | OUT | \u274c diff 85 \u2014 nunca rankeia a 1\u00d7 |\n| `magic` | 55 | 76 | OUT | \u274c idem |\n| `doodle` | 47 | 68 | OUT | \u274c composi\u00e7\u00f5es fracas (neon doodle r=201) |\n| `sketch` | 52 | 70 | OUT | \u274c cluster dos trace-apps 50k+ ratings |\n| `spray` | 10 | 47 | OUT | spray paint n\u00e3o rankeia |\n| `fluid` | 6 | 44 | OUT | sem composi\u00e7\u00e3o \u00fatil |\n| `trippy` | 16 | 40 | r=111 | \u26a0\ufe0f \u00fanica sa\u00edda com rank; r=111 \u2248 zero impressions pr\u00e1ticas |\n\n### MANT\u00c9M\n\n| Termo | Pop | Diff | Rank | Raz\u00e3o |\n|---|---|---|---|---|\n| `marker` | 17 | 21 | OUT | \ud83e\udd48 sweet solo; barato |\n| `sign` | 46 | 55 | (neon sign) | neon sign maker diff 5 com maker novo |\n| `laser` | 8 | 38 | \u2014 | laser show diff 11 (show no subtitle) |\n| `party` | 48 | 60 | glow party r=29 | rank-protect |\n| `sparkle` | 5 | 41 | sparkle drawing r=34 | rank-protect |\n| `paint` | 61 | 72 | glow paint r=99 | \u00e2ncora de composi\u00e7\u00f5es; \"painting\" \u2260 \"paint\" pro tokenizer \u2014 n\u00e3o confiar em stemming |\n\n### CASE-FIX\nNenhum \u2014 atual e proposto j\u00e1 lowercase, sem espa\u00e7os, sem dups.\n\n## \ud83d\udccb Ordena\u00e7\u00e3o dos keywords (front-loading)\n\n| Pos | Termo | Pop | Diff | Bucket |\n|---|---|---|---|---|\n| 1 | air | \u2014 | \u2014 | cluster do produto (r=1 a proteger) |\n| 2-3 | long, exposure | 9 | 19 | confirmed-pop |\n| 4 | marker | 17 | 21 | confirmed-pop |\n| 5-6 | graffiti, glitter | 7/5 | 17/15 | rank-protect (desceram do subtitle) |\n| 7-10 | sign, laser, party, sparkle | 46/8/48/5 | \u2014 | rank-protect de composi\u00e7\u00f5es |\n| 11-14 | text, write, maker, brush | 5 | 5-21 | speculation gold (diff baix\u00edssimo) |\n| 15-16 | paint, pen | 61/5 | 72/17 | \u00e2ncora de composi\u00e7\u00e3o + speculation |\n\n## \ud83d\udcc4 Resultado final\n\n```\nname:      Neon Glow Draw: Light Art 3D                            (28/30)\nsubtitle:  Light Painting Camera & Show                            (28/30)\nkeywords:  air,long,exposure,marker,graffiti,glitter,sign,laser,party,sparkle,text,write,maker,brush,paint,pen  (99/100)\n```\n\n## Cobertura por cluster (peso composto)\n\n| Cluster | name 7\u00d7 | subtitle 3\u00d7 | keywords 1\u00d7 | Total |\n|---|---|---|---|---|\n| neon/glow (neon draw, neon painting, neon sign...) | neon, glow | \u2014 | sign, maker, brush, paint, text | forte |\n| produto air-draw (draw in air, write in the air) | draw | \u2014 | air, write | forte (novo) |\n| light painting (light painting camera, light paint) | light | painting, camera | long, exposure | forte (novo) |\n| show (light show, laser show) | light | show | laser | m\u00e9dio (novo) |\n| 3d/art (3d neon r=10, neon 3d art r=4) | 3d, art | \u2014 | \u2014 | mantido |\n| fun (glitter drawing, sparkle, party, pen) | \u2014 | \u2014 | glitter, sparkle, party, pen, marker | mantido |\n| PERDIDO: kids/magic/doodle/sketch/trippy | \u2014 | \u2014 | \u2014 | aceito (tudo OUT hoje) |\n\n## Termos protegidos (verificar p\u00f3s-deploy)\n\n| Termo | Rank hoje | Alerta se |\n|---|---|---|\n| neon glow draw | 1 | sair do top 3 |\n| draw in air | 1 | sair do top 5 (tese do token air \u00e9 REFOR\u00c7AR) |\n| light art 3d | 1 | sair do top 3 |\n| neon 3d art | 4 | sair do top 10 |\n| 3d neon | 10 | sair do top 20 |\n| drawing in the air | 13 | sair do top 25 |\n| neon light drawing | 15 | sair do top 30 |\n| glow draw | 20 | sair do top 40 |\n| neon glow / neon drawing / draw neon / light painting camera / glow drawing / neon painting / neon draw / neon art / glow art | 21-27 | queda > 15 posi\u00e7\u00f5es |\n| glow party | 29 | queda > 15 posi\u00e7\u00f5es |\n| glitter drawing | 30 | queda > 15 posi\u00e7\u00f5es (glitter desceu pra 1\u00d7) |\n| sparkle drawing | 34 | queda > 15 posi\u00e7\u00f5es |\n\n## \ud83c\udfaf Hip\u00f3tese formal pra meta.json\n\n> **If we change** subtitle de \"Painting, Graffiti & Glitter\" pra \"Light Painting Camera & Show\" **e** keywords pra \"air,long,exposure,marker,graffiti,glitter,sign,laser,party,sparkle,text,write,maker,brush,paint,pen\",\n> **then we expect** impressions di\u00e1rias \u2191 \u2265 25% e downloads di\u00e1rios \u2191 \u2265 25% (target bold: +50%) em 30 dias,\n> **because** (a) \"light painting\" verbatim adjacente a 3\u00d7 destrava um termo confirmado pop9/diff15 em que estamos OUT apesar da composi\u00e7\u00e3o cross-field; (b) \"light show\" (pop 20, diff 23) passa a compor dentro do subtitle; (c) o token \"air\" \u2014 hoje ausente \u2014 consolida o cluster do produto que rankeia por res\u00edduo de marca (draw in air r=1, drawing in the air r=13); (d) 6 tokens mortos (diff 68-85, todos OUT) deixam de pagar aluguel a 1\u00d7 e cedem lugar a 7 termos diff \u2264 21.\n\n## \u26a0\ufe0f Riscos identificados\n\n1. **Dup `light` (name + subtitle)** \u2014 5 chars do subtitle \"desperdi\u00e7ados\" se a tese da adjac\u00eancia for falsa. Mitiga\u00e7\u00e3o: \u00e9 exatamente o que o teste mede; rollback f\u00e1cil.\n2. **Perder rank em composi\u00e7\u00f5es de graffiti/glitter** (3\u00d7\u21921\u00d7): glitter drawing r=30. Mitiga\u00e7\u00e3o: termos seguem indexados; monitorar Day 7.\n3. **`paint` vs `painting`** \u2014 se a Apple stemmizasse, \"paint\" liberaria 6 chars. N\u00e3o confiar; mantido.\n4. **PPO \"Nano Real Scenes\" rodando em paralelo** \u2014 subtitle novo muda a p\u00e1gina pros DOIS bra\u00e7os (n\u00e3o invalida a compara\u00e7\u00e3o interna, mas soma ru\u00eddo na CVR). Pior: texto s\u00f3 entra com release de vers\u00e3o e release pode ENCERRAR o experimento. **Sequenciar: rodar o PPO primeiro (2-4 sem), deployar o texto depois** \u2014 ou aceitar encerrar o PPO.\n5. **Ranks r=1 atuais s\u00e3o de termos pop=5** \u2014 upside absoluto do nicho pr\u00f3prio \u00e9 limitado; o crescimento real depende de light show/marker/long exposure (pop 9-20).\n\n## \u23f1 Timeline + tempo de an\u00e1lise do dev\n\n| Fase | Janela |\n|---|---|\n| Apple Review | D0-D3 |\n| Index propagation | D3-D5 |\n| Initial stabilization | D5-D7 |\n| First reliable signal | D7-D14 |\n| Statistically significant | D14-D21 |\n| Decision day | D28 |\n\n| Checkpoint | Tempo do dev | A\u00e7\u00e3o |\n|---|---|---|\n| Day 0 | ~10 min | pull_analytics.py (baseline snapshot) |\n| Day 7 | ~15 min | rank-protect + early signal (N\u00c3O decidir antes \u2014 ru\u00eddo pre-effect) |\n| Day 14 | ~30-45 min | tend\u00eancia real vs proje\u00e7\u00e3o |\n| Day 21 | ~30 min | rascunho iter-02 |\n| Day 28 | ~1-2 h | decision day |\n| **Total** | **~3-4 h em 28 dias** | |\n\n## \ud83d\udcc8 Proje\u00e7\u00e3o quantitativa do teste\n\n**Premissas:** baseline 42,3 dl/dia (ASC Sales 45d, capturado 2026-08-06, tend\u00eancia \u2193) \u00b7 CR assumida 4% \u00b7 impressions baseline derivada \u2248 1.050/dia \u00b7 heur\u00edstica `impr/dia \u2248 pop \u00d7 (10 \u2588\u2588\u2588\u2588\u2588\u2588\u2588\u2591\u2591  (target conservador)\n```\n\n**Sinais por checkpoint:**\n\n| Dia | SUCESSO (continuar/escalar) | FALHA (aten\u00e7\u00e3o/rollback) |\n|---|---|---|\n| 7 | light painting entrou (\u2264 200); protegidos est\u00e1veis | protegidos r 1-15 ca\u00edram > 15 posi\u00e7\u00f5es |\n| 14 | light painting \u2264 50; light show \u2264 80; impressions \u2191 \u2265 10% | light painting ainda OUT (tese falhou); dl \u2193 \u2265 20% |\n| 21 | dl/dia \u2265 47; light show subindo | dl/dia < 40 sustentado |\n| 28 | dl/dia \u2265 53 \u2192 promote + iter-02 ousado (name?) | dl/dia < 45 \u2192 reformular; < 30 \u2192 rollback |\n\n## \ud83c\udfb2 Confidence breakdown\n\n| Premissa | Confidence | Impacto se errada |\n|---|---|---|\n| Adjac\u00eancia verbatim > composi\u00e7\u00e3o cross-field (light painting) | 60% | Perde a tese central; subtitle vira s\u00f3 camera+show (ainda positivo) |\n| \"air\" refor\u00e7a (n\u00e3o perturba) o cluster r=1-46 | 85% | Cluster j\u00e1 rankeia; token s\u00f3 adiciona sinal |\n| Rank-protect segura graffiti/glitter a 1\u00d7 | 75% | Perda de 2 composi\u00e7\u00f5es r~30 (impacto pequeno) |\n| light show (pop 20) alcan\u00e7a top-40 com subtitle 3\u00d7 | 55% | Maior fonte de upside; sem ela, cen\u00e1rio pessimista |\n| CR est\u00e1vel ~4% com subtitle novo | 80% | \"Camera & Show\" \u00e9 mais descritivo; n\u00e3o deve piorar CVR |\n| Termos pop=5 t\u00eam volume real > 0 | 50% | Upside do nicho pr\u00f3prio menor que projetado |\n\n**Confidence agregada: ~65% de resultado \u2265 conservador.**\n\n---\n\n# ADENDO 2026-08-06 (2): pt-BR e es-ES (mesma iter, deploy conjunto)\n\nPesquisa via Astro MCP stores `br` e `es` (~48 termos novos cada + pool pr\u00e9-existente). CSVs de auditoria: dados nos pulls do Astro (233+ termos/app). Nomes ficam intocados nos 2 locales; es-MX espelha es-ES, pt-PT espelha pt-BR.\n\n## \ud83c\udde7\ud83c\uddf7 pt-BR\n\n**Achados:** o app \u00e9 DONO do nicho de luz
