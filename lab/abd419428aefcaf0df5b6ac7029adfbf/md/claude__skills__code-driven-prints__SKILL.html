<body><div class="wrap"><p class="sub" style="font-size:12px;margin:0 0 14px">Exportado em 2026-10-01 15:37 · fonte: Lab Hub local</p><p class="sub"><a href="../index.html">← hub</a> · <code>_GambitStudio/.claude/skills/code-driven-prints/SKILL.md</code></p><div id="md"></div><script>const RAW="---\nname: code-driven-prints\ndescription: Render the 5 initial App Store screenshots in code \u2014 real app screens recreated in SwiftUI and rendered via GambitScreenshotKit (house LOOK - solid brand background, verb-split headline, whole-section breakout as the REAL component view with glow in the app's palette), passed through a mandatory visual gate (the agent reads every PNG), then localized, uploaded to the default product page and verified via ASC API. Use when the user types `/code-driven-prints` or picks the code-driven path for initial prints.\n---\n\n# Code-Driven Prints (App Store screenshots, refined flow)\n\n> **Antes de desenhar qualquer print**: Read `_GambitStudio/aso/reference/store-page-playbook.md` (atualiza\u00e7\u00e3o 2026-09-27) \u2014 message match com a query do nicho (\u00a7 estilo), benefit framing com a exce\u00e7\u00e3o feature-first + confian\u00e7a em privacidade/seguran\u00e7a/finan\u00e7a (\u00a73), caption \u2264 7 palavras (\u00a73), indexa\u00e7\u00e3o de caption N\u00c3O comprovada (\u00a73/\u00a712), gate visual e o que nunca ocupa um slot (\u00a73c), gate de poder antes de todo PPO (\u00a73b), promotional text (\u00a75), CPP por keyword (\u00a78), IAP promovido (\u00a79), header iOS 27 (\u00a711). O LOOK \u00e9 o da casa; o CONTE\u00daDO segue o playbook.\n\nTriggered by `/code-driven-prints` from the root of an iOS app. This is the **evolved, definitive** GambitStudio print flow: the 5 App Store screenshots are **built in code** (real app screens recreated in SwiftUI, rendered via `GambitScreenshotKit` + `ImageRenderer`), NOT generated wholesale by an image model. At most the *background* comes from Nano Banana \u2014 everything else is code.\n\n> There are TWO paths for initial App Store prints (this replaced the older `/generate-print` \u2014 do not look for that one). **When Jo\u00e3o asks for prints without naming a skill, ASK which path to use** before starting:\n>\n> ```\n> Prints built in SwiftUI, pixel-perfect canonical  \u2192 /code-driven-prints (THIS skill)\n> Prints from ONE AI panorama image (ChatGPT/Nano)  \u2192 /panorama-prints (art by AI, headlines by code)\n> App LIVE, PPO treatment                            \u2192 same render (abtest mode) + upload_ppo.py --power-check (playbook \u00a73b: 1 treatment, only above the traffic floor)\n> App LIVE, CPP for a target keyword                 \u2192 this skill, --variant <keyword> (only print 1 changes, see \"Modes beyond the default page\")\n> ```\n> All share the same render math + fastlane/ASC upload protocol; only the input source + treatment count differ.\n\n---\n\n## Golden rule \u2014 code, not generation\n\nThe user installs the app and sees these screens for real. The prints must match the SHIPPED build.\n- **Recreate the production screens** in `screenshots-tool/Sources/<App>Screenshots/Screens/` \u2014 same components, grid, tiles, nav. Re-read the real `View` source; drift is the #1 bug.\n- **The image model (Nano Banana / Gemini) is allowed ONLY for the flat background** (and mascots/illustrations already in the app). Never for the screen content itself.\n- Mock the DATA, not the UI.\n\n---\n\n## The LOOK (house style \u2014 only brand color + real screens + copy change)\n\n1. **Solid brand-color background** (deep, saturated; dark works well for security/privacy niches). No blobs/rays/gradient. In the kit: `MarketingTheme(baseColor:\u2026, every atmospheric field .clear, headlineWeight: .black)`.\n2. **Verb-split headline** (`splitFirstWord: true`, `highlightWord: nil`): first word BIG alone on line 1, the rest smaller on line 2. White, SF Pro Black, uppercase. **\u2264 7 words per caption** (playbook \u00a73 \u2014 the SERP shows the print at ~40% size; the char budgets below sit on top of this word budget).\n3. **Real app inside a faithful device mock.** The kit's `DeviceFrame` carries ambient drop shadow + screen gloss + titanium edge specular for realism \u2014 keep those.\n4. **One WHOLE section breaks out over the device**, scaled up **wider than the phone** (overhangs BOTH bezels), with a **border + soft GLOW**. The glow color is the app's **primary**, and it MUST be the **same color on all 5 prints** (palette cohesion \u2014 never let it vary per print). The section is the REAL component view (next section \u2014 `breakout:` + `.breakoutSource()`), never a crop of the screen image. The breakout is **optional per print**: a strong standalone screen (e.g. a full-bleed hero/stealth state) can skip it \u2014 `breakout: nil` in the slot config and let the device screen own the canvas.\n5. **5 DISTINCT prints** \u2014 never repeat a screen or focused component. **First 3 = the main features** (they show as search-result thumbnails). Slots 4-5 secondary. Widget print ONLY if the app ships a widget. **NEVER an onboarding or paywall print** in any of the 5 slots (RULES Screenshots: onboarding wastes the slot and is redundant; paywall wastes it AND App Review can flag it as a monetization push). Slots show value in USE \u2014 home / killer feature 1 / 2 / 3 / alt home or a product-looking utility (rules below).\n\n---\n\n## Breakout = view do componente, nunca recorte de bitmap\n\nCinco prints chegaram na loja com o breakout cortando o cabe\u00e7alho de um placar ao meio e com o mesmo placar aparecendo duas vezes (o recorte colado por cima do original) \u2014 \"mal recortado, n\u00e3o profissional\" (27/09/2026). A causa n\u00e3o era do app: o breakout era um **recorte por n\u00famero da IMAGEM da tela** (`crop` + `scaleEffect` sobre o bitmap) colado numa **posi\u00e7\u00e3o escolhida \u00e0 m\u00e3o**. Cortar por n\u00famero corta componente; colar em outra posi\u00e7\u00e3o duplica o que est\u00e1 embaixo (LEARNINGS #87b). **Recorte de bitmap \u00e9 proibido em trabalho novo.**\n\nO jeito certo \u00e9 estrutural, e o kit faz o trabalho (`GambitScreenshotKit/Breakout.swift`):\n\n1. A tela recriada marca o componente que o print amplia com **`.breakoutSource()`** \u2014 o componente REAL, no lugar dele no layout (ex.: `ScoreboardCard(...).breakoutSource()`).\n2. O slot passa o MESMO componente como pop-out: `MarketingScreen(..., breakout: Breakout(style: MockTheme.breakoutStyle) { ScoreboardCard(...) }, content: { Screen(...) })`.\n3. O kit l\u00ea a regi\u00e3o do componente marcado (anchor preference, j\u00e1 no espa\u00e7o do canvas), **deriva a posi\u00e7\u00e3o** do card do centro dessa regi\u00e3o (lupa sobre a pr\u00f3pria se\u00e7\u00e3o \u2014 nunca um n\u00famero \u00e0 m\u00e3o), escala o card uniformemente at\u00e9 transbordar as DUAS bordas do aparelho (`widthRatio`, default 0.96 do canvas, piso que garante o transbordo), desenha borda + glow na `style.glow` (= primary do app, igual nos 5) e **escurece o componente embaixo** (`underlay: .dim`, default) ou esconde mantendo o frame (`.hidden`). Nunca o componente duas vezes.\n4. `BreakoutStyle(glow: <primary>, background: <fundo da tela do app>)` \u2014 o card \u00e9 um peda\u00e7o levantado do app, n\u00e3o um painel estranho. `BreakoutGeometry.resolve(...)` \u00e9 a conta p\u00fablica, se voc\u00ea quiser imprimir onde o card cai.\n5. Sem `.breakoutSource()` na tela o kit desenha um aviso vermelho no print em vez de falhar em sil\u00eancio \u2014 o gate pega.\n\nO que continua existindo: `foreground:` do `MarketingScreen` (mascote na frente, chips). Tools antigos que montam o pop-out ali com posi\u00e7\u00e3o \u00e0 m\u00e3o seguem compilando, mas esse caminho est\u00e1 **deprecado** no doc do kit e n\u00e3o entra em trabalho novo. Escolha a se\u00e7\u00e3o pelo tamanho: um componente quase quadrado vira um card alto \u2014 se cobre o aparelho inteiro, marque a se\u00e7\u00e3o inteira (ex.: chips + anel), n\u00e3o s\u00f3 o miolo.\n\n---\n\n## O que nunca ocupa um slot\n\n- **Formul\u00e1rio de sistema nunca ocupa um slot.** Tela de configura\u00e7\u00e3o/ajustes com campos de texto, `Form`, `TextField` ou `List` padr\u00e3o do iOS n\u00e3o vende nada e parece prot\u00f3tipo dentro do print (slot 4 do caso de 27/09: tr\u00eas caixas brancas sobre a textura do app, cobrindo o \"Voltar\").\n- **Slot 5 \"utilidade\" s\u00f3 entra como utilidade com cara de produto** \u2014 widget da home (s\u00f3 se o app tem widget), atalho/quick action, resumo/estat\u00edstica, um estado alternativo real (ex.: modo escuro). Se o app n\u00e3o tem uma, o slot 5 vira a **5\u00aa feature** em uso.\n- Onboarding e paywall continuam proibidos (LOOK #5).\n\n---\n\n## CHARACTER BUDGETS \u2014 fixed sizes, measured, hold in EVERY locale\n\nText renders at **fixed sizes** (first line bigger). Do **NOT** rely on `minimumScaleFactor` to shrink per-language \u2014 that makes sizes inconsistent between locales and prints. Instead **budget the character count** so every language fits at the SAME fixed size. Measure, don't guess.\n\n**Headline** (kit, iPhone 6.9\" / 1320 canvas, column = 1320 \u2212 80\u00b72 = 1160pt):\n- **Line 1** (first word) = `headlineFontSize\u00b71.12` = **161pt**. Fits full-size up to **~10 wide-uppercase chars** (BLOQUEANDO/10 \u2248 1135pt). **Keep \u2264 8** for a safe side margin. First words are short verbs \u2014 easy.\n- **Line 2** (the rest) = `headlineFontSize\u00b70.52` = **75pt**, `lineLimit(1)`, `minimumScaleFactor(1.0)` (no shrink). **\u2264 24 chars.**\n\n**In-screen text** (device content authored ~440pt wide; with `.padding(.horizontal, 52)` \u2192 **336pt column**):\n- Pick fixed sizes (e.g. title 34pt / subtitle 26pt / pill 22pt), `lineLimit(1)`, NO `minimumScaleFactor`.\n- **Shorten the pt/es strings** so they fit at the same fixed size the longest language needs. Two-word pills side-by-side rarely fit in half a column \u2014 use concise single words, or measure.\n\n**Measure with AppKit before committing copy** (`swift /tmp/measure.swift`):\n```swift\nimport AppKit\nlet column = 1160.0                 // headline column (or 336 for in-screen)\nlet size   = 144.0 * 1.12           // line-1 fixed size (or 144*0.52 for line-2)\nfunc w(_ t:String)->Int{Int((t.uppercased() as NSString)\n  .size(withAttributes:[.font:NSFont.systemFont(ofSize:size,weight:.black)]).width)}\nfor t in [\"CATCH\",\"ATRAPA\",\"BLOQUEANDO\",\"who touches your phone\",\"a quien toca tu tel\u00e9fono\"] {\n    let x = w(t); print(\"\\(t)  \\(t.count)ch  \\(x)pt  \\(Double(x)<=column ? \"OK\":\"OVER\")\")\n}\n```\nRun it for line 1, line 2, and each in-screen string across en/pt/es. Fix anything `OVER` by shortening the string (never by shrinking the font). Document the budgets in `Headlines.swift`.\n\n---\n\n## Flow\n\n### 1. Scaffold (if missing)\nIf `<App>/screenshots-tool/` doesn't exist, run `_GambitStudio/scripts/scaffold/screenshots-tool.sh --app-name \u2026 --bundle-id \u2026 --target-dir \u2026`. The template renders into `screenshots-tool/out/<locale>/` (the gate reads there); the fastlane folder only receives PNGs through the gate (step 7).\n\n### 2. Read production views + propose the 5 screens (USER APPROVES)\nOpen the real `View` files first. Present the 5-screen table (slot / screen / breakout component / why), first 3 = main features, no onboarding or paywall slot (RULES Screenshots), no system-form screen, slot 5 = product-looking utility or the 5th feature (\"O que nunca ocupa um slot\"). Name the component each print breaks out \u2014 it must be a real component of that screen. Wait for `ok`.\n\n### 3. Propose headlines (USER APPROVES)\nSource the app's ASO keywords (`fastlane/metadata/<locale>/*`). **Keyword-aware captions = message match, not indexing:** each of the 5 headlines carries ONE target term from name/subtitle/keywords \u2014 prints 1-3 get the 3 strongest terms \u2014 phrased naturally (never a list) so the user recognizes the query they typed. Indexing of print text is NOT proven (playbook \u00a73, research #8: ConsultMyApp tested 64 captions, no strong evidence) \u2014 never design a print to rank; record term\u2192print in `Headlines.swift` anyway so a CPP variant (below) can reuse the mapping. Benefit-first by default; **feature-first + a verifiable trust signal on print 1 for privacy/security/finance niches** (playbook \u00a73). Write Treatment A only, verb-led, native per locale, \u2264 7 words and within the char budgets above. Present the table with the word + char counts. Wait for `ok`.\n\n### 4. Build the screens + breakouts + slots\n- `Screens/` = faithful device recreations (fixed-size text, budgeted strings). Each screen's magnified component is a named view marked with `.breakoutSource()` in its real place in the layout.\n- `Breakouts.swift` = one `Breakout` per print returning the SAME component view (glow = app primary, same on all; `background` = the app's screen background).\n- `main.swift` slot config: `screen` + `breakout` closures per slot (`breakout: nil` for a standalone print). No width/position numbers per slot \u2014 the kit derives them from the marked component.\n- `MockTheme.marketing` = solid brand background (`MarketingTheme` with every atmospheric field `.clear`, `headlineWeight: .black`); `MockTheme.breakoutStyle` = `BreakoutStyle(glow: primary, background: screen background)`.\n\n### 5. TWO-PASS render\n- **Pass 1** \u2014 `let locales = [\"en-US\"]` (or the primary market), `swift run <App>Screenshots initial` \u2192 `out/<locale>/01\u202605.png`. Run the gate (step 6) on this pass and iterate until every print passes.\n- **Pass 2** \u2014 restore `[\"en-US\",\"pt-BR\",\"es-ES\"]` (+ any big markets you localize), render, gate again for every locale (a sheet per locale takes one Read). The longest language (es is usually widest) is where clipping shows \u2014 the gate row for it is not optional.\n\n### 6. Gate visual \u2014 OBRIGAT\u00d3RIO, antes do upload\nNingu\u00e9m olhava o print antes de subir; a \u00fanica verifica\u00e7\u00e3o do pipeline era dimens\u00e3o e contagem. Agora o agente OLHA \u2014 e o upload s\u00f3 existe depois disso.\n\n```bash\npython3 _GambitStudio/tools/prints/gate_sheet.py screenshots-tool/out\n#  \u2192 out/_gate/<locale>_sheet.png (5 prints lado a lado + thumbs) e out/_gate/<locale>_thumbs110.png\n#  \u2192 out/visual-gate.md (esqueleto: uma tabela por PNG, veredito \"?\")\n```\n1. **Read** cada `<locale>_sheet.png` E cada `<locale>_thumbs110.png` (110 px de largura = o tamanho do print na lista de busca; a headline tem que se ler A\u00cd, n\u00e3o na sheet). Em d\u00favida num print, Read o PNG inteiro.\n2. Pontue, por print, os 8 crit\u00e9rios da tabela (PASS / FAIL / N/A quando n\u00e3o h\u00e1 breakout): nenhum componente cortado pela borda do breakout \u00b7 nada duplicado sob o breakout \u00b7 nenhuma UI n\u00e3o relacionada coberta \u00b7 sem formul\u00e1rio de sistema \u00b7 headline leg\u00edvel a 110 px \u00b7 conte\u00fado do aparelho \u00e9 a tela real do app (paridade com o build) \u00b7 cores da paleta do app (fundo s\u00f3lido de marca, glow = primary, o mesmo nos 5) \u00b7 **distin\u00e7\u00e3o: os 5 prints mostram 5 telas/componentes DIFERENTES** \u2014 dois prints com a mesma tela e o mesmo componente em destaque (ex.: anel do timer duas vezes, hist\u00f3rico duas vezes) reprovam o SET, n\u00e3o s\u00f3 um print (RULES Screenshots \"5 prints DISTINTOS\"; o fixture Pomodoro de 28/09 passou nos 7 crit\u00e9rios de defeito e ainda era 5 prints pra 2 telas).\n3. **Qualquer FAIL \u2192 corrige a tela/o breakout/a copy, re-renderiza, reavalia.** N\u00e3o existe \"sobe assim e ajusta depois\": print de vers\u00e3o publicada \u00e9 imut\u00e1vel (LEARNINGS #73).\n4. O veredito por print fica salvo em **`screenshots-tool/out/visual-gate.md`** (o esqueleto j\u00e1 tem a tabela; preencha os `?` e a linha `**Veredito:**`). Escreva a nota do que voc\u00ea VIU, n\u00e3o do que esperava.\n5. `python3 \u2026/gate_sheet.py screenshots-tool/out --check` tem que responder `GATE VISUAL OK` \u2014 ele reprova com PNG sem se\u00e7\u00e3o, crit\u00e9rio `?` ou qualquer FAIL. S\u00f3 ent\u00e3o o passo 7.\n\n### 7. Upload + PURGE/DEDUPE (verify via API \u2014 deliver lies)\n```bash\npython3 _GambitStudio/tools/prints/gate_sheet.py screenshots-tool/out \\\n  --check --promote fastlane/screenshots/initial      # copia os PNGs S\u00d3 com o gate verde\nLC_ALL=en_US.UTF-8 LANG=en_US.UTF-8 \\\nAPP_STORE_CONNECT_KEY_ID=\u2026 ISSUER_ID=\u2026 KEY_PATH=\[chave] \\\nfastlane sync_screenshots_initial   # background; 6.9\" PNGs \u2192 APP_IPHONE_67\n```\nGotchas (all seen live):\n- **`deliver` validates `fastlane/metadata` even for a screenshots-only run** \u2192 an invalid locale folder (e.g. `nl` instead of `nl-NL`) aborts it. Fix the folder name.\n- **`deliver` prints success even when it did nothing / left stale sets.** ALWAYS verify via the ASC API afterward: for each `appStoreVersionLocalization` \u2192 `appScreenshotSets` \u2192 `appScreenshots`, assert **5 per localized locale, 0 dupes**.\n- **PURGE old sets in every NON-primary locale** you don't localize (leftover art from a prior run \u2014 often a different display type or a dup count like 6/10). `DELETE /v1/appScreenshotSets/{id}` for those so they **fall back to the primary (en-US)** prints. End state: only your localized locales carry sets (e.g. en/pt/es \u00d7 5 = 15); the other ~36 inherit en-US.\n- Display type for 6.9\" is **`APP_IPHONE_67`** (no `APP_IPHONE_69`); Apple auto-scales down.\n\n### 8. Promotional text \u2014 write it per locale at upload time (playbook \u00a75)\nIt is a free conversion lever: 170 chars, no review, no build, the first visible line of the page, ~70 chars visible on mobile \u2014 and it was EMPTY in 13 lab apps on 2026-09-27. For every locale you upload prints for, draft the `promotional_text.txt` (benefit + proof in the first 70 chars, no price, nothing that ages) and present it with the headlines table. Store text is Jo\u00e3o's call (memory 2026-09-08): propose here, deploy only after his `ok` \u2014 via `PATCH /v1/appStoreVersionLocalizations/{id}` (`promotionalText`), never `deliver`, and read it back.\n\n---\n\n## Modes beyond the default page (playbook \u00a78, \u00a79, \u00a711)\n\n- **`--variant <keyword>` \u2014 Custom Product Page for one target keyword (playbook \u00a78).** Re-render **only print 1** with the headline = the literal search query (same LOOK, same slot config, same breakout; prints 2-5, icon and everything else identical to the default page). Output goes to `out/variant_<keyword>/<locale>/01_*.png` next to copies of 02-05 from the default set; the gate (step 6) runs on it like any other set before it is promoted. One keyword \u2192 one page; the keyword must already be in the version's keywords field. Deploy only when Jo\u00e3o asks (`appCustomProductPages` + version + localizations + sets + keyword `PATCH`, checksum-reconciled upload as in LEARNINGS #57c) and **measure sequentially** (before/after on the term) \u2014 never CPP CVR against the default page. Register keyword \u2192 page \u2192 date in the app's `ppo-pipeline/`.\n- **Promoted IAP image \u2014 when the app has subscriptions (playbook \u00a79).** Render a **1024\u00d71024** image in the same LOOK (solid brand bg, one flat symbol or the plan's hero, no price, no text that ages) per promoted product, `fastlane/screenshots/promoted_iap/<product-id>.png`. Name \u2264 30 chars WITH the duration (\"Premium anual\"), description \u2264 45. It shows in search results; confirm `APPROVED` and order via API. Pre-release checklist item.\n- **Header frame for iOS 27 (playbook \u00a711) \u2014 prepare, never upload.** Add an optional `header` slot to the tool (same LOOK: solid bg + verb-split + breakout; aspect ratio to be confirmed when the ASC spec lands) so the asset exists in `source/` of the app's `ppo-pipeline/` the day Creative Assets open. First real use = one PPO treatment with the header, only in apps that pass the power gate (playbook \u00a73b).\n- **PPO treatment (abtest mode).** Before any `upload_ppo.py` run, the power gate decides: `--power-check` is on by default and refuses experiments the traffic cannot decide (+20% in 90 days). Below the floor, publish the art on the default page instead and compare before/after (playbook \u00a73b). The visual gate (step 6) applies to every treatment set (`out/treatment_X/<locale>/`) before the upload. On the day an experiment stops, save the ASC web numbers to `results/`.\n\n---\n\n## Definition of done\n5 distinct code-driven prints, cohesive brand bg + single-color glow, every breakout a component view placed by the kit (no bitmap crop, nothing cut, nothing duplicated), no system-form slot, fixed-size headlines (\u2264 7 words) & in-screen text with measured per-language budgets, rendered for your localized locales, **visual gate PASS on every PNG with the verdicts in `screenshots-tool/out/visual-gate.md` and `gate_sheet.py --check` green**, uploaded to `APP_IPHONE_67`, **verified via API** (5 each, no dupes), old/other-locale sets purged so the rest fall back to primary, promotional text drafted per locale (deployed after Jo\u00e3o's ok), and \u2014 if the app sells subscriptions \u2014 the 1024\u00d71024 promoted-IAP image rendered.\n";</script><script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script><script>document.getElementById("md").innerHTML=window.marked?marked.parse(RAW):"<pre>"+RAW.replace(/</g,"&lt;")+"</pre>";</script></div><script>(function(){try{var k="lh.scroll:"+location.pathname;var v=sessionStorage.getItem(k);if(v!==null){sessionStorage.removeItem(k);window.scrollTo(0,parseInt(v,10)||0);}document.addEventListener("submit",function(e){var f=e.target;if(f&&f.method&&f.method.toLowerCase()==="post"){sessionStorage.setItem(k,String(window.scrollY));}},true);}catch(e){}})();</script></body>
