/* ---------- camada de acabamento (01/10/2026) ----------
   Tipografia com duas vozes (display para títulos e números, texto para leitura),
   neutros com viés do azul da marca em vez de cinza puro, e profundidade por
   sombra em vez de só borda. Nada aqui renomeia classe: é uma camada por cima. */
:root{
  --f-disp:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --f-text:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;

  --bg:#eef1f7; --card:#ffffff; --tx:#0a0d14; --mut:#4b5567; --acc:#2b3340;
  --bd:#cbd3e0; --bd-soft:#dfe5ee; --ok:#07804e; --down:#c42121; --warn:#9a4408;
  --sh:0 1px 2px rgba(16,19,26,.05),0 2px 8px rgba(16,19,26,.04);
  --sh-up:0 2px 6px rgba(16,19,26,.07),0 10px 24px rgba(16,19,26,.07);
  --cardup:#ffffff; --bdup:#b9c3d4;
  --boardtop:#e9edf5; --boardbot:#e3e8f1;
  --bar:#2563eb; --bar2:#60a5fa;
  --rad:14px;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#07090d; --card:#141922; --tx:#f7f9fc; --mut:#b2bdd0; --acc:#ccd6e6;
  --bd:#333c4c; --bd-soft:#232a36; --ok:#55e39d; --down:#ff8585; --warn:#ffbb55;
  --sh:0 1px 2px rgba(0,0,0,.4); --sh-up:0 6px 22px rgba(0,0,0,.5);
  --cardup:#1d2430; --bdup:#3d4859;
  --boardtop:#0d1218; --boardbot:#090d13;
  --bar:#5b9bff; --bar2:#9dc4ff;
}}
body{font-family:var(--f-text);font-size:14.5px;line-height:1.6;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1{font-family:var(--f-disp);font-size:27px;font-weight:800;letter-spacing:-.02em;
  text-wrap:balance;margin:0 0 2px}
h1 .mark{display:inline-block;width:28px;height:28px;vertical-align:-5px;margin-right:11px;
  background-size:contain;background-repeat:no-repeat;background-position:center}
h2{font-family:var(--f-disp);font-size:12px;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;color:var(--mut);border-top:1px solid var(--bd-soft);
  padding-top:22px;margin:32px 0 14px}
h3{font-family:var(--f-disp);letter-spacing:-.01em}
.sub{font-size:13px;color:var(--mut)}
code,.mono{font-family:var(--f-mono);font-size:12.5px}
.card,table.t,a.tile,.row,.fcard,#md{box-shadow:var(--sh);border-color:var(--bd-soft)}
.card,a.tile,.row,.fcard{border-radius:var(--rad)}
a.tile,.row{transition:box-shadow .16s ease,border-color .16s ease,transform .16s ease}
a.tile:hover,a.row:hover{box-shadow:var(--sh-up);border-color:var(--bd);
  transform:translateY(-1px)}
/* O card do app é área de leitura, não botão: nada muda no hover. A regra antiga
   trocava a sombra, e num card sem sombra isso aparecia como animação. */
.fcard,.fcard:hover{transition:none!important;transform:none!important}
/* big numbers: the first thing anyone reads on the page */
.tiles{gap:12px;margin:18px 0 4px}
a.tile{padding:13px 17px;min-width:148px}
.tile .tl{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
  color:var(--mut)}
.tile .tv{font-family:var(--f-disp);font-size:25px;font-weight:800;letter-spacing:-.025em;
  margin-top:3px}
.tile .ts{font-size:11.5px;color:var(--mut)}
.tile .tvd{font-family:var(--f-text);font-size:13px;font-weight:600;letter-spacing:0;white-space:nowrap}
/* tables read as data, not as prose */
table.t{border-radius:var(--rad);font-variant-numeric:tabular-nums}
table.t th{font-family:var(--f-disp);font-size:11px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;background:var(--bd-soft);border-bottom:1px solid var(--bd)}
table.t td{padding:9px 13px;border-bottom:1px solid var(--bd-soft)}
table.t tbody tr:hover td,table.t tr:hover td{background:rgba(125,140,170,.06)}
.twrap{border-radius:var(--rad)}
/* buttons */
.btn{font-family:var(--f-disp);font-weight:600;font-size:13.5px;padding:9px 18px;
  border-radius:999px;box-shadow:var(--sh);transition:all .16s ease}
.btn:hover{border-color:var(--acc);box-shadow:var(--sh-up);transform:translateY(-1px)}
.pill,.st{font-family:var(--f-disp);font-weight:600;font-size:11.5px;letter-spacing:.02em}
/* status colours carry meaning, so keep them out of the accent */
.st.run,.st.appr{background:rgba(10,143,88,.14);color:var(--ok)}
.st.crit{background:rgba(208,47,47,.14);color:var(--down)}
.st.rev,.st.draft{background:rgba(180,83,9,.14);color:var(--warn)}
/* the lanes strip and any scroller get a thin, rounded bar */
.hrow,.twrap,.tiles{scrollbar-width:thin;scrollbar-color:var(--bd) transparent}
.hrow::-webkit-scrollbar,.twrap::-webkit-scrollbar,.tiles::-webkit-scrollbar{height:9px}
.hrow::-webkit-scrollbar-track,
.twrap::-webkit-scrollbar-track,
.tiles::-webkit-scrollbar-track{background:transparent}
.hrow::-webkit-scrollbar-thumb,
.twrap::-webkit-scrollbar-thumb,
.tiles::-webkit-scrollbar-thumb{background:var(--bd);border-radius:999px;
  border:3px solid transparent;background-clip:content-box}
.hrow::-webkit-scrollbar-thumb:hover,
.twrap::-webkit-scrollbar-thumb:hover,
.tiles::-webkit-scrollbar-thumb:hover{background:var(--mut);background-clip:content-box}
.hrow{background:transparent;border:0;padding:0;border-radius:0}
.hcol{flex:0 0 clamp(280px,26vw,360px);min-width:0}
a:focus-visible,button:focus-visible,.btn:focus-visible{outline:2px solid var(--acc);
  outline-offset:2px;border-radius:8px}
.dirlist,.prlist{margin:10px 0 0;padding-left:18px;list-style:none}
.dirlist>li,.prlist>li{position:relative;margin:0 0 7px;font-size:13.5px;line-height:1.5;
  color:var(--tx)}
.prlist>li{color:var(--mut);font-size:13px;margin-bottom:5px}
.dirlist>li::before,.prlist>li::before{content:"";position:absolute;left:-14px;top:.62em;
  width:5px;height:5px;border-radius:50%;background:var(--acc);opacity:.75}
.prlist>li::before{background:var(--mut);opacity:.5}
.dirp{display:none}
.dapps{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));
  margin:14px 0 4px;align-items:start}
.dapp{padding:14px 16px}
.dah{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.dah b{font-family:var(--f-disp);font-size:14.5px;font-weight:700}
.drank{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;
  border-radius:6px;background:var(--acc);color:var(--card);font-size:11.5px;font-weight:700;flex:none}
.st.d-dobrar{background:rgba(10,143,88,.16);color:var(--ok)}
.st.d-consertar{background:rgba(180,83,9,.16);color:var(--warn)}
.st.d-manter{background:rgba(125,140,170,.16);color:var(--mut)}
.st.d-congelar{background:rgba(125,140,170,.12);color:var(--mut)}
.dapp .prlist{margin-top:6px}
.dcall{color:var(--tx)!important;font-weight:600}
.fcard[id]{scroll-margin-top:18px}
.fdet{margin-top:10px;border-top:1px solid var(--bd-soft);padding-top:9px}
.fdet>summary{cursor:pointer;list-style:none;font-family:var(--f-disp);font-size:11.5px;
  font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);
  display:flex;align-items:center;gap:7px}
.fdet>summary::-webkit-details-marker{display:none}
.fdet>summary::before{content:"›";font-size:15px;transition:transform .15s}
.fdet[open]>summary::before{transform:rotate(90deg)}
.fdet>summary:hover{color:var(--acc)}
.fdet table.t{font-size:12.5px}
.fdet table.t td,.fdet table.t th{padding:6px 10px}
.fgrid.one{grid-template-columns:1fr!important;gap:18px}
/* Cada app é um painel com profundidade: a luz entra por cima, o corpo escurece
   até a base e a borda clareia só na primeira linha. É o que separa um app do
   outro sem precisar de moldura dura. */
.fgrid.one>.fcard{position:relative;padding:0;overflow:hidden;border-radius:16px;
  border:1px solid var(--bd-soft);
  background:linear-gradient(180deg,
    color-mix(in srgb, var(--acc) 5%, var(--card)) 0%,
    var(--card) 26%,
    color-mix(in srgb, #000 7%, var(--card)) 100%);
  box-shadow:0 1px 2px rgba(0,0,0,.05), 0 10px 26px -14px rgba(0,0,0,.28)}
@media(prefers-color-scheme:dark){.fgrid.one>.fcard{
  background:linear-gradient(180deg,
    color-mix(in srgb, var(--acc) 9%, var(--card)) 0%,
    var(--card) 30%,
    #0a0c10 100%);
  box-shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 18px 40px -22px rgba(0,0,0,.9)}}
.fgrid.one>.fcard::before{content:"";position:absolute;inset:0 0 auto;height:1px;
  background:linear-gradient(90deg, transparent,
    color-mix(in srgb, var(--acc) 45%, transparent), transparent)}
.fgrid.one>.fcard>.fh{background:transparent;margin:0;padding:15px 18px 12px;
  border-bottom:1px solid var(--bd-soft)}
.fgrid.one>.fcard>.fstats{padding:12px 18px 0}
.fgrid.one>.fcard>.fcols{padding:16px 18px 6px}
.fgrid.one>.fcard>.fdet{margin:0;padding:13px 18px 16px;border-top:1px solid var(--bd-soft);
  background:color-mix(in srgb, #000 4%, transparent)}
@media(prefers-color-scheme:dark){.fgrid.one>.fcard>.fdet{
  background:rgba(0,0,0,.25)}}
.fgrid.one>.fcard>.fh b{font-size:16px;letter-spacing:-.01em}
.fgrid.one>.fcard>.fh>span{font-size:12.5px;color:var(--tx);opacity:.78;
  font-variant-numeric:tabular-nums;font-weight:500}
/* a luz no topo do painel, um pouco mais presente */
.fgrid.one>.fcard::before{height:2px;
  background:linear-gradient(90deg, transparent, var(--acc), transparent);opacity:.5}
.fcard .fmeta{font-size:12px;color:var(--mut)}
/* funil: rótulo legível, número com peso, barra com corpo */
.fs{display:grid;grid-template-columns:150px 1fr auto;align-items:center;gap:12px;
  padding:5px 0}
.fs .fl{font-size:12.5px;color:var(--tx)}
.fs .fn{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;min-width:74px;
  text-align:right}
.fb{height:9px;border-radius:999px;background:var(--bd-soft);overflow:hidden}
.fb i{display:block;height:100%;border-radius:999px}
/* retenção com leitura imediata */
.rrow{margin:0}
.rc:first-child{border-top:0;padding-top:0}
/* o rótulo é legenda; quem salta é o número, na cor da régua */
.rc b{display:block;font-family:var(--f-disp);font-size:10px;font-weight:700;
  letter-spacing:.09em;text-transform:uppercase;color:var(--mut);margin:0}
.rc .rv{display:block;font-family:var(--f-disp);font-size:21px;font-weight:800;
  letter-spacing:-.025em;line-height:1.15;margin:3px 0 2px;font-variant-numeric:tabular-nums}
.rc>b{font-family:var(--f-disp);font-size:12px;font-weight:700;letter-spacing:.04em;
  color:var(--mut)}
.rc .rv{font-family:var(--f-disp);font-size:19px;font-weight:800;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums}
.rc .rb{display:block;font-size:11.5px;color:var(--mut)}
/* achados: mais ar e marcador claro */
.fnds li{font-size:12.5px;line-height:1.5;padding:4px 0 4px 16px}
.fnds li:before{width:6px;height:6px;top:.72em}
/* o detalhe convida a abrir */
.fdet>summary{font-size:11px;color:var(--acc);padding:3px 0}
.fdet>summary:hover{opacity:.82}
.fcols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;
  align-items:start}
@media(max-width:820px){.fcols{grid-template-columns:1fr;gap:12px}}
.fcol{min-width:0}
.fcol>.fnds{margin-top:0}
/* Régua de contexto do app: instalações, ativos, novos, crash-free. Antes isso
   era uma linha de texto corrido ("187 downloads/30d · WATCH · crash-free
   100%") que ninguém comparava entre cards; como números rotulados, dá pra
   varrer a coluna de cima a baixo. */
.fstats{display:flex;flex-wrap:wrap;gap:10px 26px;align-items:baseline}
.fst{display:flex;align-items:baseline;gap:7px;min-width:0}
.fstl{font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:var(--mut)}
.fst b{font-family:var(--f-disp);font-size:15px;font-weight:700;letter-spacing:-.015em;
  font-variant-numeric:tabular-nums}
.fstd{font-size:12px;font-weight:600}
.st.vd{background:rgba(125,140,170,.14);color:var(--mut)}
.fh .noasc{font-size:11.5px;font-weight:400;color:var(--warn)}
/* Cada metade do card diz o que é antes de mostrar número. */
.fgrp{margin-bottom:16px}
.fgrp:last-child{margin-bottom:0}
.fgl{display:block;font-family:var(--f-disp);font-size:10.5px;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;color:var(--mut);
  padding-bottom:7px;margin-bottom:10px;border-bottom:1px solid var(--bd-soft)}
.fcol>.fgrp>.fnds{margin-top:0}
.instrl{list-style:none;margin:9px 0 0;padding:0}
.instrl li{font-size:12.5px;line-height:1.55;color:var(--mut);padding:3px 0 3px 14px;
  position:relative;overflow-wrap:anywhere}
/* Coluna de leitura: linhas rotuladas, sem caixa. As caixas coloridas (funil
   verde, ação amarela) e o bloco expansível empilhavam quatro objetos de forma
   diferente num espaço estreito; rótulo à esquerda e texto à direita, separados
   por uma régua fina, lê de cima a baixo sem nada competindo (João, 02/10). */
.rline{display:grid;grid-template-columns:116px minmax(0,1fr);gap:16px;
  padding:12px 0;border-top:1px solid var(--bd-soft)}
.rline:first-child{border-top:0;padding-top:0}
.rlab{font-family:var(--f-disp);font-size:10.5px;font-weight:700;letter-spacing:.07em;
  text-transform:uppercase;color:var(--mut);padding-top:2px}
.rbody{min-width:0}
.rbody>b{display:block;font-family:var(--f-disp);font-size:14px;font-weight:700;
  letter-spacing:-.01em;line-height:1.35}
.rnum{display:block;margin-top:3px;font-size:12px;font-weight:600;color:var(--tx);
  font-variant-numeric:tabular-nums}
.rbody>p{margin:5px 0 0;font-size:12.5px;line-height:1.55;color:var(--mut)}
.rline.act .rlab{color:var(--tx)}
.rline.mut .rlab,.rline.mut .instrl li{color:var(--mut)}
.rbody>.fnds{margin:0}
@media(max-width:1180px){.rline{grid-template-columns:1fr;gap:6px}
  .rline .rlab{padding-top:0}}
.instrl{list-style:none;margin:0;padding:0}
.instrl li{font-size:12.5px;line-height:1.55;color:var(--mut);padding:2px 0 2px 14px;
  position:relative;overflow-wrap:anywhere}
.instrl li::before{content:"";position:absolute;left:0;top:.72em;width:5px;height:5px;
  border-radius:50%;background:var(--bd)}
/* Os passos de loja vêm de outra fonte que os de dentro do app: barra em tom
   mais surdo pra o olho ver onde a medição troca de sistema. */
.fs .fb i.store{background:linear-gradient(90deg,
  color-mix(in srgb, var(--bar) 45%, transparent),
  color-mix(in srgb, var(--bar) 70%, transparent))}
.fsub{display:block;font-size:10.5px;font-weight:600;letter-spacing:.07em;
  text-transform:uppercase;color:var(--mut);margin-bottom:6px}
.fsub.gap2{margin-top:14px}
.lchip{font-size:10px;color:var(--mut);background:var(--bd-soft);border-radius:999px;
  padding:1px 7px;cursor:help;white-space:nowrap}
.fcols{position:relative}
@media(min-width:821px){.fcols::before{content:"";position:absolute;top:0;bottom:0;
  left:50%;width:1px;background:var(--bd-soft)}}
.fdet .ascgrid{grid-template-columns:repeat(auto-fit,minmax(118px,1fr))}
.fdetcols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;
  align-items:start}
@media(max-width:1100px){.fdetcols{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:760px){.fdetcols{grid-template-columns:1fr}}
.fdetcols>div{min-width:0;display:flex;flex-direction:column;gap:14px}
.rawbox{background:var(--bg);border:1px solid var(--bd-soft);border-radius:11px;
  padding:11px 13px;min-width:0}
.rawbox h4,.rawbox h3.team{margin:0 0 8px;font-family:var(--f-disp);font-size:10.5px;
  font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--mut)}
.rawbox h3.team .chain{text-transform:none;letter-spacing:0;font-size:11px}
.rawbox table.t{border:0;box-shadow:none;background:transparent}
.rawbox table.t th{background:transparent;border-bottom:1px solid var(--bd)}
.rawbox table.t td{border-bottom:1px solid var(--bd-soft)}
.rawbox .twrap{border-radius:0}
.rawbox .ascgrid{margin-bottom:0;grid-template-columns:repeat(auto-fit,minmax(104px,1fr))}
.rawbox .ascgrid b{font-size:14px}
.srct{float:right;font-size:9px;font-weight:700;letter-spacing:.06em;padding:2px 7px;
  border-radius:999px;background:var(--bd);color:var(--mut);text-transform:uppercase}
.s-asc{background:rgba(125,140,170,.16);color:var(--tx)}
.s-firebase{background:rgba(180,83,9,.14);color:var(--warn)}
.noasc{background:rgba(180,83,9,.14);color:var(--warn);border-radius:999px;padding:1px 8px;
  font-size:10.5px;font-weight:600}
.convwhy{display:block;font-size:10.5px;color:var(--mut);margin-top:1px}
.rawbox .rate{padding:1px 7px;border-radius:999px;font-size:12.5px}
.featname{display:block;font-family:var(--f-mono);font-size:11.5px;margin-bottom:3px}
.featbar{display:block;height:4px;border-radius:999px;background:var(--bd-soft);overflow:hidden}
.featbar i{display:block;height:100%;border-radius:999px;
  background:linear-gradient(90deg, color-mix(in srgb, var(--acc) 70%, transparent), var(--acc))}
.legacyp{margin:8px 0 0;font-size:12px;color:var(--mut);line-height:1.7}
.legacyp code{font-size:11px}
.rawbox .ascgrid>div{background:var(--card)}
.fdet{margin-top:14px;border-top:1px solid var(--bd);padding-top:12px}
.fdet[open]>summary{margin-bottom:12px;color:var(--acc)}
.t .thsub{font-size:9.5px;font-weight:600;letter-spacing:.03em;color:var(--mut);
  text-transform:none}
.t .rate{padding:1px 8px;border-radius:999px;font-variant-numeric:tabular-nums}
.t .rate.good{background:rgba(10,143,88,.16);color:var(--ok)}
.t .rate.mid{background:rgba(180,83,9,.14);color:var(--warn)}
.t .rate.low{background:rgba(208,47,47,.13);color:var(--down)}
.thin{font-size:10.5px;color:var(--mut);background:var(--bd-soft);border-radius:999px;
  padding:1px 7px;cursor:help;white-space:nowrap}
.sbx{font-size:12px;color:var(--warn);background:rgba(180,83,9,.12);border-radius:999px;
  padding:1px 8px;cursor:help;white-space:nowrap}
.sbxnote{font-size:11.5px;color:var(--warn);background:rgba(180,83,9,.10);
  border:1px solid rgba(180,83,9,.25);border-radius:9px;padding:7px 10px;margin:0 0 10px}
.actv{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 9px;margin:0 0 10px;
  padding:8px 11px;border-radius:10px;background:var(--bd-soft)}
.actvt{font-family:var(--f-disp);font-size:10px;font-weight:800;letter-spacing:.09em;
  text-transform:uppercase;color:var(--mut)}
.actv b{font-family:var(--f-disp);font-size:15px;font-variant-numeric:tabular-nums}
.actvw{flex-basis:100%;font-size:11px;color:var(--mut)}
.fover{font-size:10.5px;color:var(--warn);background:rgba(180,83,9,.12);border-radius:999px;
  padding:1px 7px;cursor:help;white-space:nowrap}
.hspan{display:inline-block;margin-left:10px;font-size:10.5px;font-weight:600;letter-spacing:.04em;
  text-transform:none;color:var(--mut);background:var(--bd-soft);padding:2px 9px;border-radius:999px;
  vertical-align:2px}
.ascspan{font-size:11px;color:var(--mut);margin:2px 0 7px}
.ascgrid{display:grid;gap:7px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
  margin-bottom:10px}
.ascgrid>div{background:var(--bd-soft);border-radius:9px;padding:7px 10px;min-width:0}
.ascgrid span{display:block;font-size:10px;color:var(--mut);text-transform:uppercase;
  letter-spacing:.04em}
.ascgrid b{font-family:var(--f-disp);font-size:15px;font-variant-numeric:tabular-nums}
.fcard[id]:target{border-color:var(--acc);box-shadow:0 0 0 2px rgba(125,140,170,.3),var(--sh-up)}
/* ---------- acabamento: luz e profundidade (01/10) ----------
   Gradiente é usado onde tem função: a luz no topo dá direção à página, a barra
   do funil ganha volume, e o cabeçalho de cada app se separa do conteúdo. Fundo
   chapado em tudo o resto, para os números seguirem sendo o que salta. */
body{background:
  radial-gradient(1100px 420px at 12% -8%, color-mix(in srgb, var(--acc) 11%, transparent), transparent 70%),
  radial-gradient(900px 360px at 88% -4%, color-mix(in srgb, var(--ok) 7%, transparent), transparent 72%),
  var(--bg);
  background-attachment:fixed}

h2{position:relative}
h2::after{content:"";position:absolute;left:0;top:0;width:44px;height:2px;
  background:linear-gradient(90deg, var(--acc), transparent)}
h2:first-of-type::after,h1+h2::after,.sub+h2::after{display:none}
a.tile{background:linear-gradient(170deg, color-mix(in srgb, var(--card) 100%, transparent),
  color-mix(in srgb, var(--acc) 5%, var(--card)))}
.fb i,.fs .fb i{background:linear-gradient(90deg,var(--bar),var(--bar2))}
.fgrid.one>.fcard>.fh{background:linear-gradient(180deg,
  color-mix(in srgb, var(--acc) 7%, var(--card)), var(--bd-soft))}
.ascgrid b,.tile .tv{background:linear-gradient(180deg, var(--tx), color-mix(in srgb, var(--tx) 72%, var(--mut)));
  -webkit-background-clip:text;background-clip:text;color:transparent}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
/* ---------- celular (14/10) ----------
   No iPhone a página nunca rola de lado: grade cede a largura pros filhos, tabela
   rola dentro do .twrap, o menu rola dentro da própria faixa. Quadro e big numbers
   seguem numa linha só com rolagem horizontal, em qualquer largura (João, 14/10). */
.cols>*,.cols2>*,.grid>*,.grid4>*,.dapps>*,.fgrid>*{min-width:0}
.board .hrow,.tiles{flex-wrap:nowrap!important;overflow-x:auto}
#md table{display:block;max-width:100%;overflow-x:auto}
#md p,#md li,#md :not(pre)>code{overflow-wrap:anywhere}
img,video{max-width:100%}
@media(max-width:860px){
  .topin{width:calc(100vw - 28px)}
}
@media(max-width:620px){
  /* header do celular (24/10): UMA linha de 52 px — cavalo + abas que rolam de
     lado com encaixe; a data sai do header fixo e vira a 1ª linha da página. */
  .topin{flex-wrap:nowrap;gap:2px;padding:4px 0;
    padding-left:env(safe-area-inset-left,0px)}
  a.brand{flex:none;min-width:44px;min-height:44px;justify-content:center;gap:0}
  a.brand .mark{width:24px;height:24px}
  a.brand .bname{display:none}
  .stamp{display:none}
  .navs{flex:1 1 auto;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;
    -webkit-overflow-scrolling:touch;scroll-snap-type:x proximity;overscroll-behavior-x:contain;
    margin-right:-14px;padding:0 max(14px,env(safe-area-inset-right,0px)) 0 2px;gap:2px;
    -webkit-ma[redigido]:linear-gradient(90deg,#000 calc(100% - 28px),transparent);
    ma[redigido]:linear-gradient(90deg,#000 calc(100% - 28px),transparent)}
  .navs::-webkit-scrollbar{display:none}
  a.nav{flex:none;scroll-snap-align:start;min-height:44px;padding:0 12px;gap:6px;font-size:14px}
  a.nav .flw-mon{width:24px;height:24px}
  .mstamp{display:block;margin:-10px 0 10px;font-size:11.5px;color:var(--mut)}
  .mstamp+style+h2,.mstamp+h2{margin-top:6px}
  div.own{padding:6px 12px;margin:0 0 12px;gap:10px}
  div.own img.flw-mon{width:40px;height:40px}
  details.pk-legend{padding:0 14px;margin-bottom:12px}
  details.pk-legend>summary{min-height:44px;padding:11px 0}
  body{font-size:15px;overflow-wrap:break-word}
  h1{font-size:24px}
  .sub,.card p,.row,.dirp,.prw,.nots li,.dirlist>li{font-size:14px}
  table.t td,table.t th{font-size:13.5px}
  table.t td:first-child,table.t th:first-child{min-width:148px}
  #md{padding:16px 14px}
  .board{padding:12px 0 14px;margin-left:0;margin-right:0}
  .boardh{padding:0 14px}
  .board .hrow{padding:12px 14px 12px;scroll-padding:0 14px}
  a.more,.btn{display:inline-flex;align-items:center;min-height:44px}
  .row{min-height:44px}
  .del{min-width:44px;min-height:44px;opacity:.7}
  .iid{position:relative}
  .iid::after{content:"";position:absolute;inset:-12px -8px}
  .fdet>summary,details>summary{min-height:44px}
  .fs{grid-template-columns:minmax(0,118px) minmax(0,1fr) auto}
  .leak,.fnote{margin-left:0}
  /* quadro no celular (25/10): João "o item em trabalho no quadro não tá responsivo no celular …
     dá uma repaginada pra ficar melhor de ver no celular" — no celular as colunas EMPILHAM (revoga a
     rolagem lateral de 14/10 só no celular): Fazer primeiro, com o item em trabalho no topo; Backlog por último. */
  .board .hrow{flex-direction:column!important;flex-wrap:nowrap!important;overflow-x:visible!important;gap:16px;padding:8px 14px 4px}
  .board .hcol{flex:none!important;min-width:0!important;width:100%}
  .board .hcol{order:3}.board .hcol.k-do{order:1}.board .hcol.k-wait{order:2}.board .hcol.k-backlog{order:4}
  .row.working .vwork{flex-wrap:wrap}
  .row .sub{white-space:normal}
  /* big numbers em grade de 2 no celular: nada cortado */
  .tiles{display:grid!important;grid-template-columns:1fr 1fr;overflow-x:visible!important}
  .tiles>.tile,a.tile{min-width:0!important;padding:10px 12px}
  .tile .tv{font-size:clamp(17px,5.4vw,22px)!important;white-space:normal}
}

html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}

/* dono da seção: legenda calma ao lado do título, não mais um segundo título em caixa alta */
h2 .ownb,h3 .ownb{text-transform:none;letter-spacing:0;font-family:var(--f-text);font-size:12.5px;font-weight:500;vertical-align:middle}

.tiles>div.tile{background:linear-gradient(170deg,var(--card),color-mix(in srgb,var(--acc) 5%,var(--card)));
  border:1px solid var(--bd-soft);border-radius:var(--rad);padding:13px 17px;box-shadow:var(--sh);min-width:148px}
@media(max-width:620px){
  .mstamp{margin:-6px 0 12px}

  .tiles>div.tile{min-width:0;padding:10px 12px}

  h2{margin-top:28px}
}

der><div class="wrap"><div class=mstamp>atualizado 25/10 16:45</div><style>.dh{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px;margin:4px 0 18px}.dh-back{font:600 14px -apple-system,system-ui,sans-serif;padding:8px 16px;border-radius:999px;border:0;background:#111;color:#fff;cursor:pointer}.dh-mon{display:flex;align-items:center;gap:10px;padding:6px 14px 6px 6px;border:1px solid var(--bd);border-radius:14px;background:var(--card)}.dh-mon>div{display:flex;flex-direction:column}.dh-mon b{font-size:16px}.dh-mon span{font-size:12.5px;color:var(--mut);max-width:34ch}</style><div class=dh><button class=dh-back type=button onclick="history.back()">← voltar</button><div class=dh-mon><img class=flw-mon src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/383.png" width="96" height="96" loading="lazy" alt="Groudon" title="Groudon: ergue continentes: monta as telas reais em código, insumo do A/B"><div><b>Groudon</b><span>monta as telas reais em código, insumo do A/B</span></div></div><div class=dh-mon><img class=flw-mon src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/120.png" width="96" height="96" loading="lazy" alt="Staryu" title="Staryu: núcleo que reflete: copia a tela real"><div><b>Staryu</b><span>copia a tela real</span></div></div></div><p class="sub"><code>_GambitStudio/.claude/skills/code-driven-prints/SKILL.md</code></p><div id="md"><div class=mdpart data-i="0"></div></div><script>const RAWS=["---\nname: code-driven-prints\ndescription: Gera os INSUMOS de tela real pro fluxo de prints por panorama \u2014 as 5 telas reais do app recriadas em SwiftUI e renderizadas pelo GambitScreenshotKit no LOOK da casa (fundo s\u00f3lido de marca, t\u00edtulo em 2 linhas iguais, breakout = view REAL do componente com glow na cor do app), s\u00f3 en-US e s\u00f3 6,9\", passando pelo gate visual obrigat\u00f3rio (o agente l\u00ea cada PNG), e salva o set como refer\u00eancia pro /panorama-ppo (source/drive-gpt/ do experimento, ou <app>/ppo-pipeline/inputs/<data>_code-driven/). N\u00c3O traduz e N\u00c3O sobe nada na loja \u2014 o caminho antigo de print final na loja foi aposentado em 21/10/2026. Use quando o Jo\u00e3o digitar /code-driven-prints, pedir \"insumos de tela real pro GPT\", \"prints code-driven pro A/B\" ou escolher o caminho code-driven antes de um /panorama-ppo.\n---\n\n# Code-Driven Prints \u2014 insumos de tela real pro /panorama-ppo\n\n> **O que mudou em 21/10/2026** (Jo\u00e3o: \"a gente percebeu que voc\u00ea criando print final n\u00e3o d\u00e1 certo, ent\u00e3o isso\n> aqui n\u00e3o precisa de tradu\u00e7\u00e3o nem subir na loja, s\u00f3 criar insumos que depois v\u00e3o passar pro fluxo de dar pro GPT\n> criar e depois isso ir pra loja \u2026 voc\u00ea cria os code driven pra eu alimentar numa maior que usa o mesmo fluxo do\n> A/B\"). Esta skill **n\u00e3o produz mais print final**: produz o set de telas reais en-US que entra como refer\u00eancia\n> no `/panorama-ppo`, e \u00e9 aquele fluxo (GPT gera a panorama, o resto por c\u00f3digo, duas valida\u00e7\u00f5es no site) que\n> traduz, gera os tamanhos e sobe. **O caminho antigo est\u00e1 aposentado**: localizar em v\u00e1rios idiomas, promover pro\n> `fastlane/screenshots/`, `sync_screenshots_initial`, purge de sets, promotional text, CPP `--variant`, PPO em\n> abtest mode e imagem de IAP promovido sa\u00edram daqui \u2014 os prints que esse caminho subiu passavam em todo check e\n> o Jo\u00e3o os reprovou na loja (LEARNINGS #120). Nada desta skill chega na App Store.\n\n> **Antes de desenhar**: Read `_GambitStudio/aso/reference/store-page-playbook.md` (\u00a73\n> benefit framing + exce\u00e7\u00e3o feature-first em privacidade/seguran\u00e7a/finan\u00e7a, caption \u2264 7 palavras, \u00a73c gate visual\n> e o que nunca ocupa um slot). O LOOK \u00e9 o da casa; o CONTE\u00daDO segue o playbook \u2014 o insumo mostra pro GPT o que\n> cada painel vende.\n\nTriggered by `/code-driven-prints` from the root of an iOS app, or by `/panorama-ppo` Fase 0 when Jo\u00e3o wants\nreal-screen references. The 5 screens are **built in code** (real app screens recreated in SwiftUI, rendered via\n`GambitScreenshotKit` + `ImageRenderer`) \u2014 what the GPT then gets is the truth about the app, not its guess.\n\n> When Jo\u00e3o asks for prints without naming a path, ASK which one:\n>\n> ```\n> Real-screen inputs (this skill)  \u2192 then /panorama-ppo with them as references (the store path)\n> A/B/C by AI panorama              \u2192 /panorama-ppo directly (live prints + app art as references)\n> Old panorama flow                 \u2192 /gpt-refs + /panorama-prints (kept as fallback)\n> ```\n\n---\n\n## Golden rule \u2014 code, not generation\n\nThe user installs the app and sees these screens for real; the inputs are what keeps the GPT honest.\n- **Recreate the production screens** in `screenshots-tool/Sources/<App>Screenshots/Screens/` \u2014 same components, grid, tiles, nav. Re-read the real `View` source; drift is the #1 bug.\n- **The image model is allowed ONLY for the flat background** (and mascots/illustrations already in the app). Never for the screen content itself.\n- Mock the DATA, not the UI.\n\n---\n\n## The LOOK (house style \u2014 only brand color + real screens + copy change)\n\n1. **Solid brand-color background** (deep, saturated; dark works well for security/privacy niches). No blobs/rays/gradient. In the kit: `MarketingTheme(baseColor:\u2026, every atmospheric field .clear, headlineWeight: .black)`.\n2. **Two-line headline, both lines the SAME size** (Jo\u00e3o 28/09/2026 \u2014 replaces the old verb-split big-first-word look: its small second line was 5% of the print width, unreadable at the ~120pt search thumbnail; the category leaders run equal lines at 8-14%). In the kit: **`splitFirstWord: false`** (the uniform path \u2014 one font size, `lineLimit(2)`), `highlightWord: nil`, and the headline passed as `\"LINE 1\\nLINE 2\"` already uppercased (that path does not uppercase and breaks only at the `\\n`). Never `splitFirstWord: true`, never a subheadline, **never 3 lines, never a tiny second line**: if the phrase doesn't fit, shorten the phrase, never the type. White, SF Pro Black, uppercase. **\u2264 7 words per caption** (playbook \u00a73 \u2014 the SERP shows the print at ~40% size; the char budgets below sit on top of this word budget).\n3. **Real app inside a faithful device mock.** The kit's `DeviceFrame` carries ambient drop shadow + screen gloss + titanium edge specular for realism \u2014 keep those. The phone stays upright and large: `deviceTilt` = 0 and `deviceScaleMultiplier` = 1.0 on every slot, never a tilted/3D or shrunken device (Jo\u00e3o 18/10/2026: \"nao quero telefone torto, sempre reto\").\n4. **One WHOLE section breaks out over the device**, scaled up **wider than the phone** (overhangs BOTH bezels), with a **border + soft GLOW**. The glow color is the app's **primary**, and it MUST be the **same color on all 5 prints** (palette cohesion \u2014 never let it vary per print). The section is the REAL component view (next section \u2014 `breakout:` + `.breakoutSource()`), never a crop of the screen image. The breakout is **optional per print**: a strong standalone screen (e.g. a full-bleed hero/stealth state) can skip it \u2014 `breakout: nil` in the slot config and let the device screen own the canvas.\n5. **5 DISTINCT prints** \u2014 never repeat a screen or focused component. **First 3 = the main features** (they show as search-result thumbnails). Slots 4-5 secondary. Widget print ONLY if the app ships a widget. **NEVER an onboarding or paywall print** in any of the 5 slots (RULES Screenshots: onboarding wastes the slot and is redundant; paywall wastes it AND App Review can flag it as a monetization push). **No print sells the purchase either** (Jo\u00e3o 20/10/2026: \"isso nunca pode ser uma feature\"): \"Premium\", subscribe, one-time payment, \"no ads\", a price or plan benefits are never a print's message or headline \u2014 each print sells something the person DOES. Showing a feature that happens to be paid is fine; a small Premium badge that is part of a real screen is tolerated only if it is not the subject. Slots show value in USE \u2014 home / killer feature 1 / 2 / 3 / alt home or a product-looking utility (rules below).\n\n---\n\n## Breakout = view do componente, nunca recorte de bitmap\n\nCinco prints chegaram na loja com o breakout cortando o cabe\u00e7alho de um placar ao meio e com o mesmo placar aparecendo duas vezes (o recorte colado por cima do original) \u2014 \"mal recortado, n\u00e3o profissional\" (27/09/2026). A causa n\u00e3o era do app: o breakout era um **recorte por n\u00famero da IMAGEM da tela** (`crop` + `scaleEffect` sobre o bitmap) colado numa **posi\u00e7\u00e3o escolhida \u00e0 m\u00e3o**. Cortar por n\u00famero corta componente; colar em outra posi\u00e7\u00e3o duplica o que est\u00e1 embaixo (LEARNINGS #87b). **Recorte de bitmap \u00e9 proibido em trabalho novo.**\n\nO jeito certo \u00e9 estrutural, e o kit faz o trabalho (`GambitScreenshotKit/Breakout.swift`):\n\n1. A tela recriada marca o componente que o print amplia com **`.breakoutSource()`** \u2014 o componente REAL, no lugar dele no layout (ex.: `ScoreboardCard(...).breakoutSource()`).\n2. O slot passa o MESMO componente como pop-out: `MarketingScreen(..., breakout: Breakout(style: MockTheme.breakoutStyle) { ScoreboardCard(...) }, content: { Screen(...) })`.\n3. O kit l\u00ea a regi\u00e3o do componente marcado (anchor preference, j\u00e1 no espa\u00e7o do canvas), **deriva a posi\u00e7\u00e3o** do card do centro dessa regi\u00e3o (lupa sobre a pr\u00f3pria se\u00e7\u00e3o \u2014 nunca um n\u00famero \u00e0 m\u00e3o), escala o card uniformemente at\u00e9 transbordar as DUAS bordas do aparelho (`widthRatio`, default 0.96 do canvas, piso que garante o transbordo), desenha borda + glow na `style.glow` (= primary do app, igual nos 5) e **escurece o componente embaixo** (`underlay: .dim`, default) ou esconde mantendo o frame (`.hidden`). Nunca o componente duas vezes.\n4. `BreakoutStyle(glow: <primary>, background: <fundo da tela do app>)` \u2014 o card \u00e9 um peda\u00e7o levantado do app, n\u00e3o um painel estranho. `BreakoutGeometry.resolve(...)` \u00e9 a conta p\u00fablica, se voc\u00ea quiser imprimir onde o card cai.\n5. Sem `.breakoutSource()` na tela o kit desenha um aviso vermelho no print em vez de falhar em sil\u00eancio \u2014 o gate pega.\n\nO que continua existindo: `foreground:` do `MarketingScreen` (mascote na frente, chips). Tools antigos que montam o pop-out ali com posi\u00e7\u00e3o \u00e0 m\u00e3o seguem compilando, mas esse caminho est\u00e1 **deprecado** no doc do kit e n\u00e3o entra em trabalho novo. Escolha a se\u00e7\u00e3o pelo tamanho: um componente quase quadrado vira um card alto \u2014 se cobre o aparelho inteiro, marque a se\u00e7\u00e3o inteira (ex.: chips + anel), n\u00e3o s\u00f3 o miolo.\n\n---\n\n## O que nunca ocupa um slot\n\n- **Formul\u00e1rio de sistema nunca ocupa um slot.** Tela de configura\u00e7\u00e3o/ajustes com campos de texto, `Form`, `TextField` ou `List` padr\u00e3o do iOS n\u00e3o vende nada e parece prot\u00f3tipo dentro do print (slot 4 do caso de 27/09: tr\u00eas caixas brancas sobre a textura do app, cobrindo o \"Voltar\").\n- **Slot 5 \"utilidade\" s\u00f3 entra como utilidade com cara de produto** \u2014 widget da home (s\u00f3 se o app tem widget), atalho/quick action, resumo/estat\u00edstica, um estado alternativo real (ex.: modo escuro). Se o app n\u00e3o tem uma, o slot 5 vira a **5\u00aa feature** em uso.\n- Onboarding e paywall continuam proibidos (LOOK #5).\n\n---\n\n## CHARACTER BUDGETS \u2014 fixed sizes, measured (en-US)\n\nText renders at **fixed sizes** (both headline lines the same size). Do **NOT** rely on `minimumScaleFactor` to shrink \u2014 that makes sizes inconsistent between prints. **Budget the character count** so every line fits at the SAME fixed size. Measure, don't guess. Only en-US is rendered (inputs, not store prints); the other locales are translated later by `/panorama-ppo`, by code.\n\n**Headline** (kit, iPhone 6.9\" / 1320 canvas, column = 1320 \u2212 80\u00b72 = 1160pt):\n- **Both lines** = `headlineFontSize` = **144pt** (10.9% of the 1320 width \u2014 inside the 8-11% rule). Fits up to **~12 wide-uppercase chars per line** (measured 21/10: NEVER SNOOZE 1107pt, SEM ESQUECER 1109pt, TU CALENDARIO 1158pt). Use the same size on all 5 prints of a locale so they line up.\n- **Gap in the kit (no option to turn it off):** the uniform path has `minimumScaleFactor(0.6)` and `lineSpacing(-12)`. A line over 1160pt does not fail \u2014 it silently shrinks that print's whole headline (or wraps into a 3rd line), so EVERY line must measure \u2264 1160pt.\n\n**In-screen text** (device content authored ~440pt wide; with `.padding(.horizontal, 52)` \u2192 **336pt column**):\n- Pick fixed sizes (e.g. title 34pt / subtitle 26pt / pill 22pt), `lineLimit(1)`, NO `minimumScaleFactor`.\n- Two-word pills side-by-side rarely fit in half a column \u2014 use concise single words, or measure.\n\n**Measure with AppKit before committing copy** (`swift /tmp/measure.swift`):\n```swift\nimport AppKit\nlet column = 1160.0                 // headline column (or 336 for in-screen)\nlet size   = 144.0                  // headline size, both lines (or the in-screen size)\nfunc w(_ t:String)->Int{Int((t.uppercased() as NSString)\n  .size(withAttributes:[.font:NSFont.systemFont(ofSize:size,weight:.black)]).width)}\nfor t in [\"NEVER SNOOZE\",\"AGAIN\",\"SEM ESQUECER\",\"TU CALENDARIO\",\"BLOQUEANDO\"] {\n    let x = w(t); print(\"\\(t)  \\(t.count)ch  \\(x)pt  \\(Double(x)<=column ? \"OK\":\"OVER\")\")\n}\n```\nRun it for both headline lines and each in-screen string. Fix anything `OVER` by shortening the string (never by shrinking the font). Document the budgets in `Headlines.swift`.\n\n---\n\n## Flow\n\n### 1. Scaffold (if missing)\nIf `<App>/screenshots-tool/` doesn't exist, run `_GambitStudio/scripts/scaffold/screenshots-tool.sh --app-name \u2026 --bundle-id \u2026 --target-dir \u2026`. The template renders into `screenshots-tool/out/<locale>/` (the gate reads there).\n\n### 2. Read production views + propose the 5 screens (USER APPROVES)\nOpen the real `View` files first. Present the 5-screen table (slot / screen / breakout component / why), first 3 = main features, no onboarding or paywall slot (RULES Screenshots), no system-form screen, slot 5 = product-looking utility or the 5th feature (\"O que nunca ocupa um slot\"). Name the component each print breaks out \u2014 it must be a real component of that screen. Wait for `ok`.\n\n### 3. Headlines, en-US only (USER APPROVES)\nEach headline tells the GPT (and Jo\u00e3o) what the panel sells; the final store titles are written again in `/panorama-ppo` Fase 3 by the same two agents. Keyword-aware = message match, not indexing (playbook \u00a73, research #8). Benefit-first by default; feature-first + a trust signal on print 1 for privacy/security/finance niches. Treatment A only, in two agents (Jo\u00e3o 21/10/2026 \u2014 market and ASO analysis picks the text, then a typesetter fits it):\n- **(a) Message \u2192 agent `print-copywriter`**: market analysis (leaders' print headlines, \u2265 5k ratings) + the live ASO terms \u2192 one benefit-led message per slot in en-US (alternatives, rationale) in `copy/messages.json`, \u2264 7 words, plain words (no niche jargon \u2014 \"low poo\" was rejected, Jo\u00e3o 18/10/2026), never about the purchase. Wait for `ok`.\n- **(b) Fit \u2192 agent `print-text-fitter`** on the approved messages, **en-US only**: 2 lines of equal size, measured with the AppKit snippet until every line is `OK`, written to `Headlines.swift` as `\"LINE 1\\nLINE 2\"`. `copy/messages.json` is reused by `/panorama-ppo` Fase 3 \u2014 do not throw it away.\n\n### 4. Build the screens + breakouts + slots \u2192 agent `print-screen-builder`\nSpawn **`print-screen-builder`** with: the app source dir, the `screenshots-tool/` dir, the approved 5-slot table (slot / screen / breakout component / real `View` file), the approved en-US headlines (step 3), the palette (brand background, primary, screen background) and `locales = [\"en-US\"]`. It re-reads the real component source and writes `Screens/`, `Breakouts.swift`, the `main.swift` slot config and `MockTheme`, then `swift build`. Coordinator checks: 5 slots match the approved table, glow is one color, build green, no `GAPS` left open \u2014 otherwise re-spawn with the gap. On a gate FAIL (step 6), re-spawn it with the gate's FAIL list.\n\n### 5. Render \u2014 en-US, one size\n`let locales = [\"en-US\"]`, 6.9\" canvas (1320\u00d72868) only, `swift run <App>Screenshots initial` \u2192 `out/en-US/01\u202605.png`. No other locale and no other size: `/panorama-ppo` translates and cuts every iPhone size from the approved panorama, by code.\n\n### 6. Gate visual \u2014 OBRIGAT\u00d3RIO, antes de entregar o insumo \u2192 agente `print-visual-gate`\nUm insumo ruim vira panorama ruim: o GPT copia o que v\u00ea. O gate continua igual.\n\n1. Spawn **`print-visual-gate`** com: o out dir (`screenshots-tool/out`), locale `en-US`, a tabela de slots aprovada (slot / tela / componente do breakout / `View` real), a paleta (fundo de marca, primary) e a pasta de prints dos concorrentes do `competitor_intel.py` (sem ela o crit\u00e9rio 12 reprova). Ele roda `gate_sheet.py`, l\u00ea cada sheet, cada thumbs110 e o PNG inteiro na d\u00favida, e pontua por print os crit\u00e9rios de defeito + **distin\u00e7\u00e3o: os 5 prints mostram 5 telas/componentes DIFERENTES** (mesma tela com o mesmo componente em destaque reprova o SET; RULES Screenshots \"5 prints DISTINTOS\") \u2014 mais texto truncado, e os 4 de venda (LEARNINGS #120).\n2. Ele devolve PASS/FAIL por print, cada FAIL com o que viu, o fix e o dono, e a \u00faltima linha do `--check`. O veredito por print fica salvo em **`screenshots-tool/out/visual-gate.md`**.\n3. **Qualquer FAIL \u2192 coordenador manda o fix pro dono (passo 4 re-spawn / copy do passo 3), re-renderiza (passo 5), re-spawna o gate.** Loop at\u00e9 zero FAIL.\n4. O coordenador confere o pr\u00f3prio `python3 \u2026/gate_sheet.py screenshots-tool/out --check` \u2014 tem que responder `GATE VISUAL OK`. S\u00f3 ent\u00e3o o passo 7.\n\n### 7. Salvar como insumo (nunca na loja)\nO `--promote` do gate s\u00f3 copia com o gate verde:\n```bash\nGS=_GambitStudio/tools/prints/gate_sheet.py\n# experimento do /panorama-ppo j\u00e1 montado \u2192 direto nas refs dele\npython3 $GS screenshots-tool/out --check --promote <exp>/source/drive-gpt/code-driven\n# sem experimento ainda \u2192 pasta de insumos do app (RULES: asset nunca fora da pasta do app)\npython3 $GS screenshots-tool/out --check --promote <app>/ppo-pipeline/inputs/<AAAA-MM-DD>_code-driven\n```\nJunto do set: `copy/messages.json` (as mensagens aprovadas) e um `README.md` de 5 linhas (slot \u2192 tela \u2192 componente \u2192 mensagem). Nada vai pra `fastlane/screenshots/`, nada de `deliver`, nenhuma chamada \u00e0 ASC.\n\n### 8. Entregar pro /panorama-ppo\nRelato ao Jo\u00e3o: a pasta do insumo, a tabela dos 5 slots e o comando da pr\u00f3xima etapa \u2014 `/panorama-ppo` com\n`new_experiment.py --code-driven <pasta do insumo>` (copia o set pra `source/drive-gpt/` como `ref-code-driven-NN.png`).\nDa\u00ed em diante \u00e9 o fluxo do A/B: prompts, panorama pela API, valida\u00e7\u00e3o 1 em pt-BR no site, tradu\u00e7\u00e3o por c\u00f3digo, upload s\u00f3 com o OK\nda valida\u00e7\u00e3o 2.\n\n---\n\n## Definition of done\n5 distinct code-driven prints of the real app in en-US at 6.9\", cohesive brand bg + single-color glow, every breakout a component view placed by the kit (no bitmap crop, nothing cut, nothing duplicated), no system-form slot, fixed-size headlines in 2 lines of equal size (\u2264 7 words) with measured budgets, **visual gate PASS on every PNG with the verdicts in `screenshots-tool/out/visual-gate.md` and `gate_sheet.py --check` green**, promoted ONLY to `<exp>/source/drive-gpt/code-driven/` or `<app>/ppo-pipeline/inputs/<date>_code-driven/` with `messages.json` + README, and the `/panorama-ppo` next step handed to Jo\u00e3o. Zero locales beyond en-US, zero uploads.\n"];</script><script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script><script>document.querySelectorAll("#md .mdpart").forEach(function(el){var R=RAWS[+el.dataset.i]||"";el.innerHTML=window.marked?marked.parse(R):"<pre>"+R.replace(/</g,"&lt;")+"</pre>";});document.querySelectorAll("#md h1,#md h2,#md h3").forEach(function(h){if(h.id)return;h.id=h.textContent.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"");});if(location.hash){var t=document.getElementById(decodeURIComponent(location.hash.slice(1)));if(t)t.scrollIntoView();}</script></div><script>
// chip #N: copia a referência do item pra conversa. clipboard pode ser negado
// (http, permissão), então cai pra seleção manual em vez de mentir "copiado".
document.addEventListener("click",function(e){
  var b=e.target.closest&&e.target.closest(".iid"); if(!b) return;
  e.preventDefault();
  var t=b.dataset.ref||b.textContent, done=function(ok){
    var old=b.textContent; b.textContent=ok?"copiado":t; b.classList.toggle("ok",ok);
    setTimeout(function(){b.textContent=t;b.classList.remove("ok");},1100);
