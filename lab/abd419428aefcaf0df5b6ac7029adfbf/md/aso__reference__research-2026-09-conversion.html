/* ---------- camada de acabamento (01/10/2026) ----------
   Tipografia com duas vozes (display para títulos e números, texto para leitura),
   neutros com viés do azul da marca em vez de cinza puro, e profundidade por
   sombra em vez de só borda. Nada aqui renomeia classe: é uma camada por cima. */
:root{
  --f-disp:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --f-text:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --bg:#eef1f7; --card:#ffffff; --tx:#0a0d14; --mut:#4b5567; --acc:#1246c8;
  --bd:#cbd3e0; --bd-soft:#dfe5ee; --ok:#07804e; --down:#c42121; --warn:#9a4408;
  --sh:0 1px 2px rgba(16,19,26,.05),0 2px 8px rgba(16,19,26,.04);
  --sh-up:0 2px 6px rgba(16,19,26,.07),0 10px 24px rgba(16,19,26,.07);
  --rad:14px;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#07090d; --card:#141922; --tx:#f7f9fc; --mut:#b2bdd0; --acc:#8ab4ff;
  --bd:#333c4c; --bd-soft:#232a36; --ok:#55e39d; --down:#ff8585; --warn:#ffbb55;
  --sh:0 1px 2px rgba(0,0,0,.4); --sh-up:0 6px 22px rgba(0,0,0,.5);
}}
body{font-family:var(--f-text);font-size:14.5px;line-height:1.6;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1{font-family:var(--f-disp);font-size:27px;font-weight:800;letter-spacing:-.02em;
  text-wrap:balance;margin:0 0 2px}
h1 .mark{display:inline-block;width:28px;height:28px;vertical-align:-5px;margin-right:11px;
  background-size:contain;background-repeat:no-repeat;background-position:center}
h2{font-family:var(--f-disp);font-size:12px;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;color:var(--mut);border-top:1px solid var(--bd-soft);
  padding-top:22px;margin:32px 0 14px}
h3{font-family:var(--f-disp);letter-spacing:-.01em}
.sub{font-size:13px;color:var(--mut)}
code,.mono{font-family:var(--f-mono);font-size:12.5px}
.card,table.t,a.tile,.row,.fcard,#md{box-shadow:var(--sh);border-color:var(--bd-soft)}
.card,a.tile,.row,.fcard{border-radius:var(--rad)}
a.tile,.row{transition:box-shadow .16s ease,border-color .16s ease,transform .16s ease}
a.tile:hover,a.row:hover{box-shadow:var(--sh-up);border-color:var(--bd);
  transform:translateY(-1px)}
/* O card do app é área de leitura, não botão: nada muda no hover. A regra antiga
   trocava a sombra, e num card sem sombra isso aparecia como animação. */
.fcard,.fcard:hover{transition:none!important;transform:none!important}
/* big numbers: the first thing anyone reads on the page */
.tiles{gap:12px;margin:18px 0 4px;padding-bottom:10px}
a.tile{padding:13px 17px;min-width:148px}
.tile .tl{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
  color:var(--mut)}
.tile .tv{font-family:var(--f-disp);font-size:25px;font-weight:800;letter-spacing:-.025em;
  margin-top:3px}
.tile .ts{font-size:11.5px;color:var(--mut)}
/* tables read as data, not as prose */
table.t{border-radius:var(--rad);font-variant-numeric:tabular-nums}
table.t th{font-family:var(--f-disp);font-size:11px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;background:var(--bd-soft);border-bottom:1px solid var(--bd)}
table.t td{padding:9px 13px;border-bottom:1px solid var(--bd-soft)}
table.t tbody tr:hover td,table.t tr:hover td{background:rgba(125,140,170,.06)}
.twrap{border-radius:var(--rad)}
/* buttons */
.btn{font-family:var(--f-disp);font-weight:600;font-size:13.5px;padding:9px 18px;
  border-radius:999px;box-shadow:var(--sh);transition:all .16s ease}
.btn:hover{border-color:var(--acc);box-shadow:var(--sh-up);transform:translateY(-1px)}
.pill,.st{font-family:var(--f-disp);font-weight:600;font-size:11.5px;letter-spacing:.02em}
/* status colours carry meaning, so keep them out of the accent */
.st.run,.st.appr{background:rgba(10,143,88,.14);color:var(--ok)}
.st.crit{background:rgba(208,47,47,.14);color:var(--down)}
.st.rev,.st.draft{background:rgba(180,83,9,.14);color:var(--warn)}
/* the lanes strip and any scroller get a thin, rounded bar */
.tiles,.hrow,.twrap{scrollbar-width:thin;scrollbar-color:var(--bd) transparent}
.tiles::-webkit-scrollbar,.hrow::-webkit-scrollbar,.twrap::-webkit-scrollbar{height:9px}
.tiles::-webkit-scrollbar-track,.hrow::-webkit-scrollbar-track,
.twrap::-webkit-scrollbar-track{background:transparent}
.tiles::-webkit-scrollbar-thumb,.hrow::-webkit-scrollbar-thumb,
.twrap::-webkit-scrollbar-thumb{background:var(--bd);border-radius:999px;
  border:3px solid transparent;background-clip:content-box}
.tiles::-webkit-scrollbar-thumb:hover,.hrow::-webkit-scrollbar-thumb:hover,
.twrap::-webkit-scrollbar-thumb:hover{background:var(--mut);background-clip:content-box}
.hrow{background:transparent;border:0;padding:0;border-radius:0}
.hcol{flex:0 0 clamp(280px,26vw,360px);min-width:0}
a:focus-visible,button:focus-visible,.btn:focus-visible{outline:2px solid var(--acc);
  outline-offset:2px;border-radius:8px}
.dirlist,.prlist{margin:10px 0 0;padding-left:18px;list-style:none}
.dirlist>li,.prlist>li{position:relative;margin:0 0 7px;font-size:13.5px;line-height:1.5;
  color:var(--tx)}
.prlist>li{color:var(--mut);font-size:13px;margin-bottom:5px}
.dirlist>li::before,.prlist>li::before{content:"";position:absolute;left:-14px;top:.62em;
  width:5px;height:5px;border-radius:50%;background:var(--acc);opacity:.75}
.prlist>li::before{background:var(--mut);opacity:.5}
.dirp{display:none}
.dapps{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));
  margin:14px 0 4px;align-items:start}
.dapp{padding:14px 16px}
.dah{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.dah b{font-family:var(--f-disp);font-size:14.5px;font-weight:700}
.drank{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;
  border-radius:6px;background:var(--acc);color:#fff;font-size:11.5px;font-weight:700;flex:none}
.st.d-dobrar{background:rgba(10,143,88,.16);color:var(--ok)}
.st.d-consertar{background:rgba(180,83,9,.16);color:var(--warn)}
.st.d-manter{background:rgba(125,140,170,.16);color:var(--mut)}
.st.d-congelar{background:rgba(125,140,170,.12);color:var(--mut)}
.dapp .prlist{margin-top:6px}
.dcall{color:var(--tx)!important;font-weight:600}
.fcard[id]{scroll-margin-top:18px}
.fdet{margin-top:10px;border-top:1px solid var(--bd-soft);padding-top:9px}
.fdet>summary{cursor:pointer;list-style:none;font-family:var(--f-disp);font-size:11.5px;
  font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);
  display:flex;align-items:center;gap:7px}
.fdet>summary::-webkit-details-marker{display:none}
.fdet>summary::before{content:"›";font-size:15px;transition:transform .15s}
.fdet[open]>summary::before{transform:rotate(90deg)}
.fdet>summary:hover{color:var(--acc)}
.fdet table.t{font-size:12.5px}
.fdet table.t td,.fdet table.t th{padding:6px 10px}
.fgrid.one{grid-template-columns:1fr!important;gap:18px}
/* Cada app é um painel com profundidade: a luz entra por cima, o corpo escurece
   até a base e a borda clareia só na primeira linha. É o que separa um app do
   outro sem precisar de moldura dura. */
.fgrid.one>.fcard{position:relative;padding:0;overflow:hidden;border-radius:16px;
  border:1px solid var(--bd-soft);
  background:linear-gradient(180deg,
    color-mix(in srgb, var(--acc) 5%, var(--card)) 0%,
    var(--card) 26%,
    color-mix(in srgb, #000 7%, var(--card)) 100%);
  box-shadow:0 1px 2px rgba(0,0,0,.05), 0 10px 26px -14px rgba(0,0,0,.28)}
@media(prefers-color-scheme:dark){.fgrid.one>.fcard{
  background:linear-gradient(180deg,
    color-mix(in srgb, var(--acc) 9%, var(--card)) 0%,
    var(--card) 30%,
    #0a0c10 100%);
  box-shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 18px 40px -22px rgba(0,0,0,.9)}}
.fgrid.one>.fcard::before{content:"";position:absolute;inset:0 0 auto;height:1px;
  background:linear-gradient(90deg, transparent,
    color-mix(in srgb, var(--acc) 45%, transparent), transparent)}
.fgrid.one>.fcard>.fh{background:transparent;margin:0;padding:15px 18px 12px;
  border-bottom:1px solid var(--bd-soft)}
.fgrid.one>.fcard>.fmeta{padding:10px 18px 0}
.fgrid.one>.fcard>.fcols{padding:16px 18px 6px}

<body><div class="wrap"><p class="sub" style="font-size:12px;margin:0 0 14px">Exportado em 2026-10-01 16:48 · fonte: Lab Hub local</p><p class="sub"><a href="../index.html">← hub</a> · <code>_GambitStudio/aso/reference/research-2026-09-conversion.md</code></p><div id="md"></div><script>const RAW="# Convers\u00e3o da p\u00e1gina da App Store \u2014 varredura 2026-09-27\n\n> Impress\u00e3o \u2192 page view \u2192 install (e p\u00e1gina \u2192 compra) para o modelo GambitStudio: ~20 apps de nicho achados por busca, 1 dev, meta US$4k/m\u00eas em dez/2027. Corrige e estende o `store-page-playbook.md` (2026-08-07); onde divergem, vale este. Tags: [Apple oficial] \u00b7 [estudo com dados] \u00b7 [opini\u00e3o de vendor] \u00b7 [anedota] \u00b7 [c\u00e1lculo pr\u00f3prio].\n\n## Achados\n\n**1. PPO \u2014 mec\u00e2nica oficial.** At\u00e9 3 treatments, 90 dias ou parada manual, propor\u00e7\u00e3o de tr\u00e1fego escolhida (40% com 2 treatments = 20% cada), testa \u00edcone / screenshots / previews e NADA de texto. \u00cdcone alternativo exige todas as variantes no bin\u00e1rio publicado; sem \u00edcone, o teste vai pra review independente de vers\u00e3o. Resultado: \"Performing Better/Worse\" s\u00f3 com **\u2265 90% de confian\u00e7a** (bayesiano, atualizado diariamente), estado \"Likely to be Inconclusive\" quando o tr\u00e1fego n\u00e3o chega l\u00e1 em 90 dias, e o teste s\u00f3 aparece no Analytics com **\u2265 5 first-time downloads** atribu\u00eddos. Apple: lift de 30% precisa de poucas semanas, de 1-5% pode nunca fechar. [Apple oficial] \u2014 [PPO](https://developer.apple.com/app-store/product-page-optimization/) \u00b7 [Ver resultados](https://developer.apple.com/help/app-store-connect/view-app-analytics/view-product-page-optimization-results/) (help, lido 2026-09-27).\n\n**2. PPO a tr\u00e1fego baixo \u2014 o n\u00famero que decide se vale abrir o teste.** A CR da Apple \u00e9 **downloads \u00f7 impress\u00f5es \u00fanicas de device** (n\u00e3o page views \u2014 ver #16). Amostra por bra\u00e7o para detectar o lift com 90% de confian\u00e7a e 80% de poder (teste de duas propor\u00e7\u00f5es; aproxima o bayesiano da Apple): [c\u00e1lculo pr\u00f3prio]\n\n| CR base (impress\u00e3o) | +10% | +20% | +30% |\n|---|---|---|---|\n| 3% | 30.560 | 7.991 | 3.707 |\n| 5% | 17.938 | 4.685 | 2.171 |\n| 8% | 10.838 | 2.826 | 1.307 |\n| 25% (page view) | 2.792 | 718 | 327 |\n\nLeitura: app com 300 impress\u00f5es/dia e 1 treatment a 50% leva ~50 dias para ver +20% e **n\u00e3o fecha +10% em 90 dias**. Vendors: \"1.000-2.000 visitantes por treatment\", \"swings grandes, n\u00e3o tom de azul\" [opini\u00e3o de vendor] \u2014 [DEV/Shotlingo PPO 2026](https://dev.to/shotlingo/apple-product-page-optimization-ppo-guide-for-2026-4a4p) \u00b7 [MobileAction PPO](https://www.mobileaction.co/blog/product-page-optimization/) (2026).\n\n**3. Ordem do que testar e o tamanho real do \u00edcone.** Screenshots continuam a alavanca #1. Para \u00edcone, o \"uplift m\u00e9dio 22,8%\" do playbook atual vem da SplitMetrics **sem amostra publicada** ([guia de \u00edcones](https://splitmetrics.com/blog/guide-to-mobile-icons/), 2025-08-05) e a AppTweak, que o playbook citava como fonte, **n\u00e3o traz esse n\u00famero** \u2014 s\u00f3 um caso AppQuantum +21,5% ([AppTweak icon](https://www.apptweak.com/en/aso-blog/how-to-design-an-app-icon), 2026-01-21) [anedota]. Estimativas mais s\u00f3brias: iOS mediana **3-6%** em testes de \u00edcone ([Strataigize](https://www.strataigize.com/blog/app-store-conversion-rate-optimization), 2026) [opini\u00e3o de vendor]; REPLUG +7,3% em 7-10 dias ([REPLUG](https://www.rplg.io/blog/icon-ab-testing), 2025) [anedota]. \u00cdcone custa um release (bin\u00e1rio) e s\u00f3 vence com mudan\u00e7a \"bold\" (SplitMetrics). O que vence: 1 objeto, contraste com a SERP do nicho, sem texto [opini\u00e3o de vendor, consenso].\n\n**4. SERP: 3 prints portrait, ou 1 se o primeiro asset for landscape/v\u00eddeo landscape; preview portrait ocupa o slot 1 e autoplay MUDO tamb\u00e9m na busca.** [Apple oficial] [App Previews](https://developer.apple.com/app-store/app-previews/) (\"display and autoplay on your product page and within search results\"; \"play with the sound muted\"; at\u00e9 3 por idioma, \u2264 30 s; trocar poster frame = resubmiss\u00e3o) \u00b7 [SplitMetrics screenshots](https://splitmetrics.com/blog/app-store-screenshots-aso-guide/) (2025-08-11) [opini\u00e3o de vendor].\n\n**5. Prints na SERP aparecem a ~40% (\u2248 \u00bc da \u00e1rea) do tamanho; caption \u2264 7 palavras, 3-5 palavras em negrito; headline no TOPO.** A afirma\u00e7\u00e3o \"headline top-stacked < 30 chars bate caption embaixo em 15-25%\" circula atribu\u00edda \u00e0 SplitMetrics mas **n\u00e3o consegui confirmar na fonte** \u2014 tratar como [opini\u00e3o de vendor]. [AppScreenshotStudio](https://appscreenshotstudio.com/app-store-screenshot-best-practices) (2026) \u00b7 [Moburst](https://www.moburst.com/blog/app-screenshots/) (2026).\n\n**6. Benefit-first vence em 6 de 8 categorias; finance e healthcare preferem feature-first + sinais de confian\u00e7a (badges, logos) e device frame.** Frameless venceu em fitness/food/social/produtividade/on-demand; conte\u00fado POPULADO sempre bate mockup vazio; 5-7 prints. O autor admite que **n\u00e3o \u00e9 estudo controlado** (\"strong working hypotheses\" de engajamentos + casos p\u00fablicos). [opini\u00e3o de vendor] \u2014 [SEM Nexus, 8 categorias](https://semnexus.com/app-store-screenshot-design-ab-test-results-8-categories) (2026-06-29). Complemento: indies auto-reportam +5-12 pp de page-view\u2192install ao trocar print 1 de nome-de-feature para benef\u00edcio ([ScreenFast via Strataigize](https://www.strataigize.com/blog/app-store-screenshot-design-guide), 2026) [anedota]. Ningu\u00e9m publicou teste controlado frame \u00d7 frameless.\n\n**7. Quantos prints o usu\u00e1rio v\u00ea.** 50% decidem na primeira impress\u00e3o e **60% n\u00e3o rolam al\u00e9m do fold** (Storemaven, 500M sess\u00f5es, 2021 \u2014 dado antigo mas o \u00fanico com amostra) [estudo com dados] \u2014 [Storemaven via Business of Apps](https://www.businessofapps.com/marketplace/app-store-optimization/research/app-store-optimization-statistics/). Apple permite 1-10 por display; o que importa \u00e9 1-3.\n\n**8. Texto de screenshot indexado na busca \u2014 evid\u00eancia FRACA.** Appfigures anunciou em jun/2025 que a Apple l\u00ea o texto dos prints (\"n\u00e3o tenho como provar ainda\") \u2014 [Appfigures](https://appfigures.com/resources/guides/app-store-algorithm-update-2025) (2025-06) [anedota]. Teste controlado da ConsultMyApp: 64 frases de prints de 8 apps grandes \u2192 **36 n\u00e3o rankearam, 27 rankearam mas j\u00e1 estavam em name/subtitle/keywords, 1 anomalia** \u2192 \"no strong evidence\" \u2014 [ConsultMyApp](https://www.consultmyapp.com/blog/-is-apple-now-indexing-screenshot-titles-on-the-app-store) (2025-06-16) [estudo com dados]. O playbook \u00a73 afirma \"captions s\u00e3o indexadas\" como fato: rebaixar para \"talvez, custo zero\".\n\n**9. Social proof em print: o que a Apple pro\u00edbe.** \"Don't include specific pricing, discounts, website URLs, copyright symbols\"; \"Avoid claims that can't be verified, such as awards or recognition\"; nada de Editor's Choice / App of the Day / ADA (j\u00e1 aparecem sozinhos); \"avoid using the entire asset to highlight general accolades or call-to-action statements\". Guideline 2.3.7: metadata (inclusive prints) sem pre\u00e7os/termos; subt\u00edtulo sem \"unverifiable product claims\". [Apple oficial] \u2014 [Asset best practices](https://developer.apple.com/app-store/asset-best-practices/) \u00b7 [Review Guidelines 2.3](https://developer.apple.com/app-store/review/guidelines/). Nota real (ex. \"4,8 \u2605\") \u00e9 verific\u00e1vel, mas nenhuma fonte com dados mediu seu efeito em nicho pequeno (ver Incerto).\n\n**10. V\u00eddeo: default \"n\u00e3o\" continua certo para utilit\u00e1rios.** Apple s\u00f3 diz \"compelling visuals in the first few seconds\", poster frame impactante, hist\u00f3ria com come\u00e7o/meio/fim [Apple oficial, asset best practices]. Vendors: +20-40% em apps visuais/complexos; **utilities, dev tools e produtividade \"usually do not\" ganham**; v\u00eddeo fraco custa 10-15%; 2 previews curtos > 1 de 30 s \u2014 [SplitMetrics preview](https://splitmetrics.com/blog/create-app-preview-video-app-store-ios/) (2025) \u00b7 [AppScreenStudio](https://www.appscreenstudio.com/en/blog/app-preview-video-vs-screenshots) (2026) [opini\u00e3o de vendor]. Zero estudo controlado por categoria.\n\n**11. \u00cdcone iOS 26: Liquid Glass, Icon Composer, 6 modos (default/dark/clear/tinted \u00d7 light/dark), template \u00fanico 1024, m\u00e1scara arredondada (manter o essencial nos 70% centrais).** Clear/tinted **apagam a cor de marca** \u2014 sobra a silhueta. Nenhuma fonte tem dado de convers\u00e3o por variante nem diz qual variante a loja mostra. [Apple oficial via vendor] \u2014 [MobileAction Liquid Glass](https://www.mobileaction.co/blog/apple-liquid-glass-design/) (2025-10-31) \u00b7 [SplitMetrics icons](https://splitmetrics.com/blog/guide-to-mobile-icons/) (2025-08-05).\n\n**12. Custom Product Pages na BUSCA ORG\u00c2NICA (desde 30/07/2025, vis\u00edvel a usu\u00e1rios iOS 26+): at\u00e9 70 CPPs por app; keyword atribu\u00edda a uma CPP tem que estar no campo keywords da vers\u00e3o; 1 keyword \u2192 1 p\u00e1gina; atribui\u00e7\u00e3o de keyword sem review, metadata da p\u00e1gina com review (independente de build).** Apple: \"+2,5 pp em m\u00e9dia ao referir pessoas a uma CPP; 156% sobre a CR m\u00e9dia de 1,6% das p\u00e1ginas default\" \u2014 **\u00e9 tr\u00e1fego referido (ads/links), n\u00e3o busca org\u00e2nica**. [Apple oficial] \u2014 [CPP](https://developer.apple.com/app-store/custom-product-pages/) \u00b7 [MobileAction CPP org\u00e2nica](https://www.mobileaction.co/blog/custom-product-pages-meet-organic-search/) (2025-08-01). AppTweak (benchmark 2025): apps com CPP **+5,9% CVR (n\u00e3o-games), +3,5% games**, m\u00e9dia +3,2% no guia 2026 \u2014 [AppTweak CPP guide](https://www.apptweak.com/en/aso-blog/guide-to-custom-product-pages-cpp) (2026-02-01) [estudo com dados]. Apple Ads 2025 (MobileAction): CPP CR 47,6% (2024: 55,9%), CPA US$3,07 (2024: US$4,58), 15,8 bi impress\u00f5es \u2014 [MobileAction Ads 2026](https://www.mobileaction.co/report/apple-ads-2026-benchmark-report/ad-variations-using-custom-product-pages/) [estudo com dados]. AppTweak alerta: **n\u00e3o comparar CVR da CPP com a default** (tr\u00e1fego diferente); medir sequencial antes/depois no mesmo segmento \u2014 [CPP Framework](https://www.apptweak.com/en/aso-blog/cpp-framework) (2025-12-04).\n\n**13. WWDC26 (8-12/06/2026) \u2014 o que muda na p\u00e1gina no outono (iOS 27):** (a) **Creative Assets / \"Header\"** (ex-Feature Banner, antes s\u00f3 para convidados) para todos: imagem ou v\u00eddeo no topo da p\u00e1gina **e nos resultados de busca**, selecion\u00e1vel por keyword, us\u00e1vel em CPP, PPO e Apple Ads; (b) **Asset Library**: prints/previews/headers com review **independente de build**, aprovados antes, reusados; (c) Product Page Preview no ASC; (d) **Personalized Collections + App Notes** (recomenda\u00e7\u00e3o por uso, com \"porque est\u00e1 aqui\"), em ingl\u00eas nos EUA desde 09/06/2026; (e) submiss\u00e3o agrupada IAP + IAE + CPP + PPO; (f) Retention Messaging no cancelamento; (g) bundles entre desenvolvedores. [Apple oficial] \u2014 [WWDC26 App Store guide](https://developer.apple.com/wwdc26/guides/app-store/) \u00b7 [Newsroom 06/2026](https://www.apple.com/newsroom/2026/06/apple-expands-app-store-capabilities-to-help-developers-grow-and-reach-new-users/) \u00b7 [Phiture WWDC26](https://phiture.com/blog/wwdc26-updates/) (2026-06-09) \u00b7 [SplitMetrics WWDC 2026](https://splitmetrics.com/blog/wwdc-2026-what-latest-changes-mean-for-you/) (2026-06-29): header **n\u00e3o substitui** os prints da busca \u2014 \u00e9 asset adicional.\n\n**14. In-App Events: para quem J\u00c1 tem o app o card do evento substitui os prints na busca; quem n\u00e3o tem continua vendo prints.** Aparecem na p\u00e1gina, na busca e nas abas Today/Apps; at\u00e9 10 publicados, 31 dias, promovido 14 dias antes; t\u00edtulo (30) e short description (50) indexados, long description n\u00e3o. Nenhum benchmark de convers\u00e3o por categoria existe (yellowHEAD). [Apple oficial] \u2014 [In-App Events](https://developer.apple.com/app-store/in-app-events/) \u00b7 [AppTweak IAE](https://www.apptweak.com/en/aso-blog/what-are-in-app-events-how-do-they-impact-aso) (2024-09-18) \u00b7 [yellowHEAD](https://www.yellowhead.com/blog/boost-your-browse-traffic-with-in-app-events/) (2025-07-01). Para o lab = ferramenta de re-engajamento e de anexo em nomination, n\u00e3o de aquisi\u00e7\u00e3o.\n\n**15. Ratings: o que \u00e9 oficial.** Nota \u00e9 por territ\u00f3rio, aparece na p\u00e1gina e na busca; `requestReview` at\u00e9 3\u00d7 por 365 dias; ao responder \"the reviewer is notified and has the option to update their review\"; reset da nota com vers\u00e3o nova \u00e9 poss\u00edvel mas \"having few ratings may discourage potential users\". **Review summaries** (LLM, iOS 18.4+) s\u00f3 em ingl\u00eas, EUA + 8 storefronts (AU/CA/IN/IE/NZ/SG/ZA/UK), s\u00f3 apps \"with a sufficient number of reviews\" \u2014 nossos apps em pt/es e com < 100 reviews ficam fora por enquanto. [Apple oficial] \u2014 [Ratings, reviews, responses](https://developer.apple.com/app-store/ratings-and-reviews/). Dados: AppFollow (92,9 M reviews, 20,7 k apps, jul/2025-jul/2026): reply rate m\u00e9dia 24,2%, **Health & Sports +1,39 estrela ap\u00f3s resposta**, Education \u22120,58, janela \u00fatil **72 h** \u2014 [AppFollow 2026](https://appfollow.io/blog/app-review-reply-rate-benchmarks-2026) (2026-09-13) [estudo com dados]. Limiares: \"96% consideram app 4\u2605 vs 50% 3\u2605\" \u00e9 pesquisa de inten\u00e7\u00e3o da Apptentive (2015, n=350); AppTweak jul/2025: 3,6\u21924,2 \u2248 +60% convers\u00e3o; Coinis 2026 (28 games): \u22120,3\u2605 = +19% CPI \u2014 via [ScreenFast](https://screenfast.app/blog/app-rating-impact-on-downloads) (2026) [estudo com dados / anedota]. Regra de volume \"< 500 ratings: volume primeiro; passar de 100 r\u00e1pido\" \u00e9 [opini\u00e3o de vendor].\n\n**16. Benchmarks \u2014 duas defini\u00e7\u00f5es que n\u00e3o se somam.** Apple (Benchmarks no ASC): CR = **downloads \u00f7 impress\u00f5es \u00fanicas**, percentis 25/50/75 do peer group (categoria + modelo de neg\u00f3cio + faixa de downloads), semanal, web-only \u2014 [Peer group benchmarks](https://developer.apple.com/help/app-store-connect-analytics/benchmarks/peer-group-benchmarks) [Apple oficial]. AppTweak EUA 2025: **8,56% page-view\u2192download**, **3,8% impress\u00e3o\u2192download**; extremos 5,2% (Games-Trivia) a 52,8% (Food & Drink); install rate 7,8% (Medical) a 0,6% (Games-Board) \u2014 [AppTweak por categoria](https://www.apptweak.com/en/aso-blog/average-app-conversion-rate-per-category) (2026-05-18) [estudo com dados]; utilities/health/produtividade s\u00f3 na plataforma paga. Os \"33,4% tap\u2192install iOS\" do playbook \u00a77 e \"Utilities 36% / Finance 18%\" s\u00e3o agrega\u00e7\u00f5es de vendor sobre page views [opini\u00e3o de vendor]. **A r\u00e9gua que vale \u00e9 o percentil 50/75 do pr\u00f3prio app no ASC.**\n\n**17. PPO n\u00e3o testa nome/subt\u00edtulo/promo text \u2014 texto se testa via print 1.** Promotional text (170) muda sem review nem build; ~70 chars vis\u00edveis no mobile [opini\u00e3o de vendor]; \"at\u00e9 +25%\" de vendor sem amostra \u2014 [ASOMobile](https://asomobile.net/en/blog/app-store-promotional-text-and-aso-small-field-big-impact/) (2025). [Apple oficial] para o que PPO cobre (#1).\n\n**18. IAP promovido e trial na p\u00e1gina.** At\u00e9 **20 IAPs promovidos**; aparecem na p\u00e1gina, \"can display in search results\" e podem ser destacados na Today; exigem imagem 1024 pr\u00f3pria (n\u00e3o screenshot), nome \u2264 30 chars (\"include the duration\" em assinatura), descri\u00e7\u00e3o \u2264 45; consum\u00edveis n\u00e3o entram na busca \u2014 [Promoting IAP](https://developer.apple.com/app-store/promoting-in-app-purchases/) [Apple oficial]. Offer codes agora cobrem consum\u00edveis/n\u00e3o-consum\u00edveis/n\u00e3o-renov\u00e1veis (WWDC25) [Apple oficial via Phiture](https://phiture.com/blog/relevant-updates-from-apples-wwdc25/) (2025-06).\n\n**19. P\u00e1gina \u2192 compra (RevenueCat 2026, 115 k apps, US$16 bi):** download\u2192trial D30 7,1% (NA); trial\u2192paid 34,2% (NA); hard paywall 10,7% vs freemium 2,1% em D35 (5\u00d7); receita/install D60 US$0,34 global, US$0,55 NA; **apps lan\u00e7ados em 2025+ = 3% da receita de assinatura**; 55% dos cancelamentos de trial no dia 0 e ~50% das convers\u00f5es pagas imediatas; trial 17-32 d converte 70% melhor; medianas semanal US$5,99 / mensal US$10 / anual US$34,80 \u2014 [RevenueCat 2026](https://www.revenuecat.com/state-of-subscription-apps) \u00b7 [trial length, 17 k apps](https://www.revenuecat.com/blog/growth/free-trial-length) (2026-09-28) [estudo com dados].\n\n**20. Featuring: crit\u00e9rios oficiais e prazo.** Editores avaliam UX, UI design, inova\u00e7\u00e3o, unicidade, **acessibilidade, localiza\u00e7\u00e3o** e \"compelling screenshots, app previews, and descriptions, as well as positive ratings and reviews\"; nomination com \u2265 2-3 semanas, at\u00e9 3 meses; tipos New Content / App Enhancements / App Launch; campos: descri\u00e7\u00e3o detalhada, data, plataformas, pa\u00edses, IAE anexado, at\u00e9 5 URLs (inclusive TestFlight), \"helpful details\" (acessibilidade, inclus\u00e3o) \u2014 [Getting featured](https://developer.apple.com/app-store/getting-featured/) \u00b7 [Nominate](https://developer.apple.com/help/app-store-connect/manage-featuring-nominations/nominate-your-app-for-featuring/) [Apple oficial]. Accessibility Nutrition Labels (WWDC25) s\u00e3o volunt\u00e1rias hoje e **v\u00e3o virar obrigat\u00f3rias** ([Apple Support](https://support.apple.com/en-us/123073)). Impacto: 95% dos apps destacados t\u00eam \u2265 4,0\u2605; Train Station 2 +470% installs org\u00e2nicos com Game of the Day \u2014 [AppTweak featured](https://www.apptweak.com/en/aso-blog/how-to-get-your-app-featured-on-the-app-store) (2026-01-25) [anedota]; para indie a onda dura ~1 semana, grosso nos 2 primeiros dias, e n\u00e3o segura o app sozinha \u2014 [Vendredi](https://vendredi-app.fr/blog/featured-by-apple/) [anedota].\n\n**21. Specs 2026: 6.9\" obrigat\u00f3rio (1320\u00d72868 / 1290\u00d72796 / 1260\u00d72736), 6.5\" s\u00f3 como fallback, 1-10 por display, sem alpha, escala autom\u00e1tica para baixo; iPhone 17/18 Pro Max, Air e \"iPhone Duo (outer)\" na classe 6.9\", com upload para o Duo \"later this year\".** [Apple oficial] \u2014 [Screenshot specifications](https://developer.apple.com/help/app-store-connect/reference/app-information/screenshot-specifications/).\n\n**22. Localiza\u00e7\u00e3o de prints: lift citado 15-25% (Tier 1) e \"5,1-24,6%\" (Storemaven, 500 M usu\u00e1rios, ~2019)** \u2014 a p\u00e1gina da Storemaven hoje est\u00e1 sequestrada (conte\u00fado de cassino), ent\u00e3o o n\u00famero fica como [opini\u00e3o de vendor] via [AppTweak screenshots](https://www.apptweak.com/en/aso-blog/how-to-optimize-your-app-screenshots) (2026). Apple: \"You can localize your metadata, including images and videos\" [Apple oficial].\n\n## O que o lab j\u00e1 faz certo\n\n- **6.9\" only + escala autom\u00e1tica** (#21): correto; o \u00fanico risco \u00e9 set 6.5\" pr\u00e9-existente que N\u00c3O herda (LEARNINGS #35), j\u00e1 coberto.\n- **Portrait sempre, 3 primeiros prints = main features, killer feature no print 1** (#4, #7): \u00e9 exatamente onde 60% da decis\u00e3o acontece; a SERP mostra 3.\n- **Verb-split gigante (1\u00aa palavra enorme) em fundo s\u00f3lido de marca** (#5): resolve a legibilidade a \u00bc do tamanho; \u2264 7 palavras j\u00e1 \u00e9 a pr\u00e1tica da casa.\n- **App real dentro do mockup + breakout de uma se\u00e7\u00e3o inteira** (#6, 2.3.3): \"show the app in use\" e \"populated content beats empty mockup\" \u2014 o breakout amplia UI real, n\u00e3o ilustra\u00e7\u00e3o.\n- **Sem onboarding, sem paywall, sem badges de pr\u00eamio nos prints** (#9): alinhado \u00e0 asset guidance da Apple.\n- **Sem v\u00eddeo por padr\u00e3o** (#10): confirmado para utilit\u00e1rios; exce\u00e7\u00e3o s\u00f3 via PPO.\n- **PPO via API, 1 vari\u00e1vel por treatment, tese n\u00e3o-\u00f3bvia** (#1): certo \u2014 falta s\u00f3 o gate de poder (#2).\n- **Rating-first (< 25 ratings = ratings antes de ASO) + review-responder** (#15): a Apple confirma que resposta notifica e permite editar; o dado 2026 d\u00e1 o tamanho do efeito.\n- **Panorama por IA como alternativa** (#6): \"authentic pode ganhar de polido\" segue hip\u00f3tese v\u00e1lida de treatment, n\u00e3o default.\n- **Message match (print 1 responde \u00e0 query)**: \u00e9 a premissa de CPP por keyword (#12) \u2014 o lab j\u00e1 pensa assim, s\u00f3 n\u00e3o materializou em p\u00e1ginas.\n\n## O que muda no lab (ordem por impacto esperado em RECEITA)\n\n1. **Gate de poder antes de todo PPO (#1, #2).** `templates/fastlane/upload_ppo.py` (e c\u00f3pias em `ppo-pipeline/scripts/`) ganha `--power-check`: l\u00ea impress\u00f5es/dia dos \u00faltimos 28 d (App Analytics API, j\u00e1 usado pelo `pull_data.py`) e a CR de impress\u00e3o do app, calcula a amostra da tabela do #2 e **recusa criar experimento que n\u00e3o fecha +20% em 90 dias**; imprime \"1 treatment a 50%\" como default (3 treatments triplicam o custo). Apps abaixo do piso: trocar na default page direto (medir antes/depois no Analytics) em vez de PPO. Playbook \u00a73: substituir \"at\u00e9 3 treatments\" por \"1 treatment, swing grande\". Aplicar primeiro nos apps com receita (Calc+, AppLock, Hair, Walk, BLW, Meus Gastos).\n2. **Ler o percentil 50/75 do peer group no ASC para os apps com receita, mensalmente (#16).** \u00c9 web-only: entra como item recorrente no `orchestrator/scan.py` (lembrete) e no `store-page-playbook.md` \u00a77 como passo 0 \u2014 s\u00f3 abre trabalho de p\u00e1gina em app **abaixo do p50** da pr\u00f3pria categoria/modelo. Apagar do \u00a77 a r\u00e9gua \"33,4% / 42-56%\" (defini\u00e7\u00e3o errada).\n3. **CPP por keyword nos 2-3 termos-alvo de cada app pagador (#12).** Novo script `_GambitStudio/aso/pipeline-template/scripts/cpp_keyword_pages.py` (POST `appCustomProductPages` + vers\u00e3o + localizations + screenshotSets + `PATCH` keyword assignment; reuso do upload paralelo por checksum de LEARNINGS #57c). Skill `code-driven-prints` ganha modo `--variant <keyword>`: s\u00f3 o print 1 muda (headline = a query literal), prints 2-5 iguais. `aso-field-composer` passa a devolver, junto dos campos, o mapa keyword\u2192CPP. Medir sequencial (AppTweak), nunca CPP \u00d7 default.\n4. **IAP promovido em todo app com assinatura (#18, #19).** Pre-release checklist (`spec/pre-release-checklist.md`) + `release-runner`: imagem 1024 pr\u00f3pria na paleta do app, nome com dura\u00e7\u00e3o (\"Premium anual\"), descri\u00e7\u00e3o \u2264 45; conferir via API que est\u00e1 `APPROVED` e ordenado. Preflight (`scripts/verify/preflight.py --only asc`) acusa app com sub e zero IAP promovido.\n5. **Preparar o Header/Creative Asset de cada app para o outono (#13).** `code-driven-prints` ganha `render header` (mesmo look: fundo s\u00f3lido + verb-split + breakout, propor\u00e7\u00e3o a confirmar quando a spec sair); `panorama-prompter` pede um frame extra \"header\" na mesma panorama. Primeiro uso = 1 treatment de PPO com header, nos apps que passarem no gate do item 1. Asset Library tamb\u00e9m muda o fluxo de LEARNINGS #73 (print sem vers\u00e3o nova) \u2014 atualizar o learning quando a ASC liberar.\n6. **Resposta a review em \u2264 72 h (#15).** `review-responder`: SLA 72 h e prioridade Health & Fitness (efeito +1,39\u2605). `scan.py` j\u00e1 enfileira reviews; passar a marcar as com > 48 h. Nunca resetar nota (Apple desaconselha; nossos apps t\u00eam poucas).\n7. **Captions e framing por categoria (#5, #6, #8).** Playbook \u00a73: (a) \"captions s\u00e3o indexadas\" vira \"talvez indexadas; custo zero, ganho n\u00e3o comprovado \u2014 a keyword entra no print 1 por message match, n\u00e3o por ranking\"; (b) benefit-first como default, **feature-first + sinal de confian\u00e7a no print 1 para apps de privacidade/seguran\u00e7a/finan\u00e7a** (AppLock, Calc+, Meus Gastos); (c) budget de \u2264 7 palavras por caption vira regra do `code-driven-prints` (hoje \u00e9 budget por chars).\n8. **Nomination de featuring em todo release relevante de app polido (#20).** `release-runner` cria item `do` no now.json 3+ semanas antes com o texto da nomination (narrativa, acessibilidade, 39 idiomas \u2014 \u00e9 crit\u00e9rio oficial e o lab j\u00e1 tem); preencher Accessibility Nutrition Labels em todos os apps ASC antes de virar obrigat\u00f3rio (item de backlog do lab). Expectativa realista: 1 semana de pico, n\u00e3o sustenta\u00e7\u00e3o.\n9. **\u00cdcone: s\u00f3 PPO com mudan\u00e7a bold, e s\u00f3 depois de prints + rating (#3, #11).** Playbook \u00a72: remover \"22,8%\" (sem fonte), trocar por \"3-6% mediana iOS; caso raro 20%+\"; `create-ios-app` Fase 3: \u00edcone nasce como `.icon` do Icon Composer com silhueta leg\u00edvel em clear/tinted (apps com Liquid Glass habilitado: Walk, iPhotos, College, Cronos).\n10. **IAE s\u00f3 como anexo de nomination ou re-engajamento (#14)** \u2014 fora da pipeline de aquisi\u00e7\u00e3o. **Personalized Collections/App Notes (#13)**: fora do controle; alavanca \u00e9 a de sempre (reten\u00e7\u00e3o D1/D7 e nota); s\u00f3 conferir/curar as App Tags no ASC por app (1\u00d7).\n\n## Incerto ou controverso\n\n- **Indexa\u00e7\u00e3o do texto dos prints (#8):** Appfigures diz sim, ConsultMyApp n\u00e3o achou; a Apple nunca confirmou. N\u00e3o desenhar print para ranking.\n- **Lifts de \u00edcone e de localiza\u00e7\u00e3o (#3, #22):** os n\u00fameros mais repetidos (22,8%; 15-25%; 35-50%) n\u00e3o t\u00eam amostra publicada ou v\u00eam de p\u00e1gina comprometida. Ordem de grandeza plaus\u00edvel, precis\u00e3o nula.\n- **Nota real dentro do print (\"4,8 \u2605 \u00b7 1.200 avalia\u00e7\u00f5es\"):** verific\u00e1vel, logo n\u00e3o \u00e9 \"unverifiable claim\", mas 2.3.7 e a asset guidance desencorajam \"accolades\"; nenhum dado em nicho pequeno. Se testar, s\u00f3 via PPO e nunca com n\u00famero que vai envelhecer.\n- **Dark \u00d7 light nos prints:** zero dado controlado; vendors s\u00f3 dizem \"teste nos dois fundos da loja\".\n- **Benchmarks de CVR (#16):** 3,8% (impress\u00e3o), 8,56% (page view), 25-33% (agregadores) e 47-66% (Apple Ads) descrevem coisas diferentes; qualquer compara\u00e7\u00e3o cruzada \u00e9 ru\u00eddo. S\u00f3 o ASC do pr\u00f3prio app vale.\n- **156% da Apple para CPP (#12)** \u00e9 tr\u00e1fego referido; o efeito em busca org\u00e2nica ainda n\u00e3o tem n\u00famero p\u00fablico (AppTweak d\u00e1 +5,9% para \"apps que usam CPP\", sem isolar o canal).\n- **Review summaries (#15):** sem qualquer dado de efeito em convers\u00e3o; irrelevante para pt/es por ora.\n- **Header/Creative Assets (#13):** propor\u00e7\u00f5es, review e quais placements mostram por keyword s\u00f3 ficam claros quando a ASC abrir no outono; o plano do item 5 \u00e9 prepara\u00e7\u00e3o, n\u00e3o aposta.\n- **Personalized Collections (#13):** se crescer, reduz a fatia da busca (~65-70% da descoberta iOS, dado de vendor); sem n\u00famero.\n- **iPhone Duo (#21):** display novo na classe 6.9\" com upload \"later this year\" \u2014 pode exigir set pr\u00f3prio.\n";</script><script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script><script>document.getElementById("md").innerHTML=window.marked?marked.parse(RAW):"<pre>"+RAW.replace(/</g,"&lt;")+"</pre>";</script></div><script>(function(){try{var k="lh.scroll:"+location.pathname;var v
