/* ---------- camada de acabamento (01/10/2026) ----------
   Tipografia com duas vozes (display para títulos e números, texto para leitura),
   neutros com viés do azul da marca em vez de cinza puro, e profundidade por
   sombra em vez de só borda. Nada aqui renomeia classe: é uma camada por cima. */
:root{
  --f-disp:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --f-text:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --bg:#eef1f7; --card:#ffffff; --tx:#0a0d14; --mut:#4b5567; --acc:#2b3340;
  --bd:#cbd3e0; --bd-soft:#dfe5ee; --ok:#07804e; --down:#c42121; --warn:#9a4408;
  --sh:0 1px 2px rgba(16,19,26,.05),0 2px 8px rgba(16,19,26,.04);
  --sh-up:0 2px 6px rgba(16,19,26,.07),0 10px 24px rgba(16,19,26,.07);
  --cardup:#ffffff; --bdup:#b9c3d4;
  --boardtop:#e9edf5; --boardbot:#e3e8f1;
  --bar:#2563eb; --bar2:#60a5fa;
  --rad:14px;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#07090d; --card:#141922; --tx:#f7f9fc; --mut:#b2bdd0; --acc:#ccd6e6;
  --bd:#333c4c; --bd-soft:#232a36; --ok:#55e39d; --down:#ff8585; --warn:#ffbb55;
  --sh:0 1px 2px rgba(0,0,0,.4); --sh-up:0 6px 22px rgba(0,0,0,.5);
  --cardup:#1d2430; --bdup:#3d4859;
  --boardtop:#0d1218; --boardbot:#090d13;
  --bar:#5b9bff; --bar2:#9dc4ff;
}}
body{font-family:var(--f-text);font-size:14.5px;line-height:1.6;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1{font-family:var(--f-disp);font-size:27px;font-weight:800;letter-spacing:-.02em;
  text-wrap:balance;margin:0 0 2px}
h1 .mark{display:inline-block;width:28px;height:28px;vertical-align:-5px;margin-right:11px;
  background-size:contain;background-repeat:no-repeat;background-position:center}
h2{font-family:var(--f-disp);font-size:12px;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;color:var(--mut);border-top:1px solid var(--bd-soft);
  padding-top:22px;margin:32px 0 14px}
h3{font-family:var(--f-disp);letter-spacing:-.01em}
.sub{font-size:13px;color:var(--mut)}
code,.mono{font-family:var(--f-mono);font-size:12.5px}
.card,table.t,a.tile,.row,.fcard,#md{box-shadow:var(--sh);border-color:var(--bd-soft)}
.card,a.tile,.row,.fcard{border-radius:var(--rad)}
a.tile,.row{transition:box-shadow .16s ease,border-color .16s ease,transform .16s ease}
a.tile:hover,a.row:hover{box-shadow:var(--sh-up);border-color:var(--bd);
  transform:translateY(-1px)}
/* O card do app é área de leitura, não botão: nada muda no hover. A regra antiga
   trocava a sombra, e num card sem sombra isso aparecia como animação. */
.fcard,.fcard:hover{transition:none!important;transform:none!important}
/* big numbers: the first thing anyone reads on the page */
.tiles{gap:12px;margin:18px 0 4px}
a.tile{padding:13px 17px;min-width:148px}
.tile .tl{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
  color:var(--mut)}
.tile .tv{font-family:var(--f-disp);font-size:25px;font-weight:800;letter-spacing:-.025em;
  margin-top:3px}
.tile .ts{font-size:11.5px;color:var(--mut)}
.tile .tvd{font-family:var(--f-text);font-size:13px;font-weight:600;letter-spacing:0;white-space:nowrap}
/* tables read as data, not as prose */
table.t{border-radius:var(--rad);font-variant-numeric:tabular-nums}
table.t th{font-family:var(--f-disp);font-size:11px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;background:var(--bd-soft);border-bottom:1px solid var(--bd)}
table.t td{padding:9px 13px;border-bottom:1px solid var(--bd-soft)}
table.t tbody tr:hover td,table.t tr:hover td{background:rgba(125,140,170,.06)}
.twrap{border-radius:var(--rad)}
/* buttons */
.btn{font-family:var(--f-disp);font-weight:600;font-size:13.5px;padding:9px 18px;
  border-radius:999px;box-shadow:var(--sh);transition:all .16s ease}
.btn:hover{border-color:var(--acc);box-shadow:var(--sh-up);transform:translateY(-1px)}
.pill,.st{font-family:var(--f-disp);font-weight:600;font-size:11.5px;letter-spacing:.02em}
/* status colours carry meaning, so keep them out of the accent */
.st.run,.st.appr{background:rgba(10,143,88,.14);color:var(--ok)}
.st.crit{background:rgba(208,47,47,.14);color:var(--down)}
.st.rev,.st.draft{background:rgba(180,83,9,.14);color:var(--warn)}
/* the lanes strip and any scroller get a thin, rounded bar */
.hrow,.twrap,.tiles{scrollbar-width:thin;scrollbar-color:var(--bd) transparent}
.hrow::-webkit-scrollbar,.twrap::-webkit-scrollbar,.tiles::-webkit-scrollbar{height:9px}
.hrow::-webkit-scrollbar-track,
.twrap::-webkit-scrollbar-track,
.tiles::-webkit-scrollbar-track{background:transparent}
.hrow::-webkit-scrollbar-thumb,
.twrap::-webkit-scrollbar-thumb,
.tiles::-webkit-scrollbar-thumb{background:var(--bd);border-radius:999px;
  border:3px solid transparent;background-clip:content-box}
.hrow::-webkit-scrollbar-thumb:hover,
.twrap::-webkit-scrollbar-thumb:hover,
.tiles::-webkit-scrollbar-thumb:hover{background:var(--mut);background-clip:content-box}
.hrow{background:transparent;border:0;padding:0;border-radius:0}
.hcol{flex:0 0 clamp(280px,26vw,360px);min-width:0}
a:focus-visible,button:focus-visible,.btn:focus-visible{outline:2px solid var(--acc);
  outline-offset:2px;border-radius:8px}
.dirlist,.prlist{margin:10px 0 0;padding-left:18px;list-style:none}
.dirlist>li,.prlist>li{position:relative;margin:0 0 7px;font-size:13.5px;line-height:1.5;
  color:var(--tx)}
.prlist>li{color:var(--mut);font-size:13px;margin-bottom:5px}
.dirlist>li::before,.prlist>li::before{content:"";position:absolute;left:-14px;top:.62em;
  width:5px;height:5px;border-radius:50%;background:var(--acc);opacity:.75}
.prlist>li::before{background:var(--mut);opacity:.5}
.dirp{display:none}
.dapps{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));
  margin:14px 0 4px;align-items:start}
.dapp{padding:14px 16px}
.dah{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.dah b{font-family:var(--f-disp);font-size:14.5px;font-weight:700}
.drank{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;
  border-radius:6px;background:var(--acc);color:var(--card);font-size:11.5px;font-weight:700;flex:none}
.st.d-dobrar{background:rgba(10,143,88,.16);color:var(--ok)}
.st.d-consertar{background:rgba(180,83,9,.16);color:var(--warn)}
.st.d-manter{background:rgba(125,140,170,.16);color:var(--mut)}
.st.d-congelar{background:rgba(125,140,170,.12);color:var(--mut)}
.dapp .prlist{margin-top:6px}
.dcall{color:var(--tx)!important;font-weight:600}
.fcard[id]{scroll-margin-top:18px}
.fdet{margin-top:10px;border-top:1px solid var(--bd-soft);padding-top:9px}
.fdet>summary{cursor:pointer;list-style:none;font-family:var(--f-disp);font-size:11.5px;
  font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);
  display:flex;align-items:center;gap:7px}
.fdet>summary::-webkit-details-marker{display:none}
.fdet>summary::before{content:"›";font-size:15px;transition:transform .15s}
.fdet[open]>summary::before{transform:rotate(90deg)}
.fdet>summary:hover{color:var(--acc)}
.fdet table.t{font-size:12.5px}
.fdet table.t td,.fdet table.t th{padding:6px 10px}
.fgrid.one{grid-template-columns:1fr!important;gap:18px}
/* Cada app é um painel com profundidade: a luz entra por cima, o corpo escurece
   até a base e a borda clareia só na primeira linha. É o que separa um app do
   outro sem precisar de moldura dura. */
.fgrid.one>.fcard{position:relative;padding:0;overflow:hidden;border-radius:16px;
  border:1px solid var(--bd-soft);
  background:linear-gradient(180deg,
    color-mix(in srgb, var(--acc) 5%, var(--card)) 0%,
    var(--card) 26%,
    color-mix(in srgb, #000 7%, var(--card)) 100%);
  box-shadow:0 1px 2px rgba(0,0,0,.05), 0 10px 26px -14px rgba(0,0,0,.28)}
@media(prefers-color-scheme:dark){.fgrid.one>.fcard{
  background:linear-gradient(180deg,
    color-mix(in srgb, var(--acc) 9%, var(--card)) 0%,
    var(--card) 30%,
    #0a0c10 100%);
  box-shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 18px 40px -22px rgba(0,0,0,.9)}}
.fgrid.one>.fcard::before{content:"";position:absolute;inset:0 0 auto;height:1px;
  background:linear-gradient(90deg, transparent,
    color-mix(in srgb, var(--acc) 45%, transparent), transparent)}
.fgrid.one>.fcard>.fh{background:transparent;margin:0;padding:15px 18px 12px;
  border-bottom:1px solid var(--bd-soft)}
.fgrid.one>.fcard>.fstats{padding:12px 18px 0}
.fgrid.one>.fcard>.fcols{padding:16px 18px 6px}
.fgrid.one>.fcard>.fdet{margin:0;padding:13px 18px 16px;border-top:1px solid var(--bd-soft);
  background:color-mix(in srgb, #000 4%, transparent)}
@media(prefers-color-scheme:dark){.fgrid.one>.fcard>.fdet{
  background:rgba(0,0,0,.25)}}
.fgrid.one>.fcard>.fh b{font-size:16px;letter-spacing:-.01em}
.fgrid.one>.fcard>.fh>span{font-size:12.5px;color:var(--tx);opacity:.78;
  font-variant-numeric:tabular-nums;font-weight:500}
/* a luz no topo do painel, um pouco mais presente */
.fgrid.one>.fcard::before{height:2px;
  background:linear-gradient(90deg, transparent, var(--acc), transparent);opacity:.5}
.fcard .fmeta{font-size:12px;color:var(--mut)}
/* funil: rótulo legível, número com peso, barra com corpo */
.fs{display:grid;grid-template-columns:150px 1fr auto;align-items:center;gap:12px;
  padding:5px 0}
.fs .fl{font-size:12.5px;color:var(--tx)}
.fs .fn{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;min-width:74px;
  text-align:right}
.fb{height:9px;border-radius:999px;background:var(--bd-soft);overflow:hidden}
.fb i{display:block;height:100%;border-radius:999px}
/* retenção com leitura imediata */
.rrow{margin:0}
.rc:first-child{border-top:0;padding-top:0}
/* o rótulo é legenda; quem salta é o número, na cor da régua */
.rc b{display:block;font-family:var(--f-disp);font-size:10px;font-weight:700;
  letter-spacing:.09em;text-transform:uppercase;color:var(--mut);margin:0}
.rc .rv{display:block;font-family:var(--f-disp);font-size:21px;font-weight:800;
  letter-spacing:-.025em;line-height:1.15;margin:3px 0 2px;font-variant-numeric:tabular-nums}
.rc>b{font-family:var(--f-disp);font-size:12px;font-weight:700;letter-spacing:.04em;
  color:var(--mut)}
.rc .rv{font-family:var(--f-disp);font-size:19px;font-weight:800;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums}
.rc .rb{display:block;font-size:11.5px;color:var(--mut)}
/* achados: mais ar e marcador claro */
.fnds li{font-size:12.5px;line-height:1.5;padding:4px 0 4px 16px}
.fnds li:before{width:6px;height:6px;top:.72em}
/* o detalhe convida a abrir */
.fdet>summary{font-size:11px;color:var(--acc);padding:3px 0}
.fdet>summary:hover{opacity:.82}
.fcols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;
  align-items:start}
@media(max-width:820px){.fcols{grid-template-columns:1fr;gap:12px}}
.fcol{min-width:0}
.fcol>.fnds{margin-top:0}
/* Régua de contexto do app: instalações, ativos, novos, crash-free. Antes isso
   era uma linha de texto corrido ("187 downloads/30d · WATCH · crash-free
   100%") que ninguém comparava entre cards; como números rotulados, dá pra
   varrer a coluna de cima a baixo. */
.fstats{display:flex;flex-wrap:wrap;gap:10px 26px;align-items:baseline}
.fst{display:flex;align-items:baseline;gap:7px;min-width:0}
.fstl{font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:var(--mut)}
.fst b{font-family:var(--f-disp);font-size:15px;font-weight:700;letter-spacing:-.015em;
  font-variant-numeric:tabular-nums}
.fstd{font-size:12px;font-weight:600}
.st.vd{background:rgba(125,140,170,.14);color:var(--mut)}
.fh .noasc{font-size:11.5px;font-weight:400;color:var(--warn)}
/* Cada metade do card diz o que é antes de mostrar número. */
.fgrp{margin-bottom:16px}
.fgrp:last-child{margin-bottom:0}
.fgl{display:block;font-family:var(--f-disp);font-size:10.5px;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;color:var(--mut);
  padding-bottom:7px;margin-bottom:10px;border-bottom:1px solid var(--bd-soft)}
.fcol>.fgrp>.fnds{margin-top:0}
.instrl{list-style:none;margin:9px 0 0;padding:0}
.instrl li{font-size:12.5px;line-height:1.55;color:var(--mut);padding:3px 0 3px 14px;
  position:relative;overflow-wrap:anywhere}
/* Coluna de leitura: linhas rotuladas, sem caixa. As caixas coloridas (funil
   verde, ação amarela) e o bloco expansível empilhavam quatro objetos de forma
   diferente num espaço estreito; rótulo à esquerda e texto à direita, separados
   por uma régua fina, lê de cima a baixo sem nada competindo (João, 02/10). */
.rline{display:grid;grid-template-columns:116px minmax(0,1fr);gap:16px;
  padding:12px 0;border-top:1px solid var(--bd-soft)}
.rline:first-child{border-top:0;padding-top:0}
.rlab{font-family:var(--f-disp);font-size:10.5px;font-weight:700;letter-spacing:.07em;
  text-transform:uppercase;color:var(--mut);padding-top:2px}
.rbody{min-width:0}
.rbody>b{display:block;font-family:var(--f-disp);font-size:14px;font-weight:700;
  letter-spacing:-.01em;line-height:1.35}
.rnum{display:block;margin-top:3px;font-size:12px;font-weight:600;color:var(--tx);
  font-variant-numeric:tabular-nums}
.rbody>p{margin:5px 0 0;font-size:12.5px;line-height:1.55;color:var(--mut)}
.rline.act .rlab{color:var(--tx)}
.rline.mut .rlab,.rline.mut .instrl li{color:var(--mut)}
.rbody>.fnds{margin:0}
@media(max-width:1180px){.rline{grid-template-columns:1fr;gap:6px}
  .rline .rlab{padding-top:0}}
.instrl{list-style:none;margin:0;padding:0}
.instrl li{font-size:12.5px;line-height:1.55;color:var(--mut);padding:2px 0 2px 14px;
  position:relative;overflow-wrap:anywhere}
.instrl li::before{content:"";position:absolute;left:0;top:.72em;width:5px;height:5px;
  border-radius:50%;background:var(--bd)}
/* Os passos de loja vêm de outra fonte que os de dentro do app: barra em tom
   mais surdo pra o olho ver onde a medição troca de sistema. */
.fs .fb i.store{background:linear-gradient(90deg,
  color-mix(in srgb, var(--bar) 45%, transparent),
  color-mix(in srgb, var(--bar) 70%, transparent))}
.fsub{display:block;font-size:10.5px;font-weight:600;letter-spacing:.07em;
  text-transform:uppercase;color:var(--mut);margin-bottom:6px}
.fsub.gap2{margin-top:14px}
.lchip{font-size:10px;color:var(--mut);background:var(--bd-soft);border-radius:999px;
  padding:1px 7px;cursor:help;white-space:nowrap}
.fcols{position:relative}
@media(min-width:821px){.fcols::before{content:"";position:absolute;top:0;bottom:0;
  left:50%;width:1px;background:var(--bd-soft)}}
.fdet .ascgrid{grid-template-columns:repeat(auto-fit,minmax(118px,1fr))}
.fdetcols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;
  align-items:start}
@media(max-width:1100px){.fdetcols{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:760px){.fdetcols{grid-template-columns:1fr}}
.fdetcols>div{min-width:0;display:flex;flex-direction:column;gap:14px}
.rawbox{background:var(--bg);border:1px solid var(--bd-soft);border-radius:11px;
  padding:11px 13px;min-width:0}
.rawbox h4,.rawbox h3.team{margin:0 0 8px;font-family:var(--f-disp);font-size:10.5px;
  font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--mut)}
.rawbox h3.team .chain{text-transform:none;letter-spacing:0;font-size:11px}
.rawbox table.t{border:0;box-shadow:none;background:transparent}
.rawbox table.t th{background:transparent;border-bottom:1px solid var(--bd)}
.rawbox table.t td{border-bottom:1px solid var(--bd-soft)}
.rawbox .twrap{border-radius:0}
.rawbox .ascgrid{margin-bottom:0;grid-template-columns:repeat(auto-fit,minmax(104px,1fr))}
.rawbox .ascgrid b{font-size:14px}
.srct{float:right;font-size:9px;font-weight:700;letter-spacing:.06em;padding:2px 7px;
  border-radius:999px;background:var(--bd);color:var(--mut);text-transform:uppercase}
.s-asc{background:rgba(125,140,170,.16);color:var(--tx)}
.s-firebase{background:rgba(180,83,9,.14);color:var(--warn)}
.noasc{background:rgba(180,83,9,.14);color:var(--warn);border-radius:999px;padding:1px 8px;
  font-size:10.5px;font-weight:600}
.convwhy{display:block;font-size:10.5px;color:var(--mut);margin-top:1px}
.rawbox .rate{padding:1px 7px;border-radius:999px;font-size:12.5px}
.featname{display:block;font-family:var(--f-mono);font-size:11.5px;margin-bottom:3px}
.featbar{display:block;height:4px;border-radius:999px;background:var(--bd-soft);overflow:hidden}
.featbar i{display:block;height:100%;border-radius:999px;
  background:linear-gradient(90deg, color-mix(in srgb, var(--acc) 70%, transparent), var(--acc))}
.legacyp{margin:8px 0 0;font-size:12px;color:var(--mut);line-height:1.7}
.legacyp code{font-size:11px}
.rawbox .ascgrid>div{background:var(--card)}
.fdet{margin-top:14px;border-top:1px solid var(--bd);padding-top:12px}
.fdet[open]>summary{margin-bottom:12px;color:var(--acc)}
.t .thsub{font-size:9.5px;font-weight:600;letter-spacing:.03em;color:var(--mut);
  text-transform:none}
.t .rate{padding:1px 8px;border-radius:999px;font-variant-numeric:tabular-nums}
.t .rate.good{background:rgba(10,143,88,.16);color:var(--ok)}
.t .rate.mid{background:rgba(180,83,9,.14);color:var(--warn)}
.t .rate.low{background:rgba(208,47,47,.13);color:var(--down)}
.thin{font-size:10.5px;color:var(--mut);background:var(--bd-soft);border-radius:999px;
  padding:1px 7px;cursor:help;white-space:nowrap}
.sbx{font-size:12px;color:var(--warn);background:rgba(180,83,9,.12);border-radius:999px;
  padding:1px 8px;cursor:help;white-space:nowrap}
.sbxnote{font-size:11.5px;color:var(--warn);background:rgba(180,83,9,.10);
  border:1px solid rgba(180,83,9,.25);border-radius:9px;padding:7px 10px;margin:0 0 10px}
.actv{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 9px;margin:0 0 10px;
  padding:8px 11px;border-radius:10px;background:var(--bd-soft)}
.actvt{font-family:var(--f-disp);font-size:10px;font-weight:800;letter-spacing:.09em;
  text-transform:uppercase;color:var(--mut)}
.actv b{font-family:var(--f-disp);font-size:15px;font-variant-numeric:tabular-nums}
.actvw{flex-basis:100%;font-size:11px;color:var(--mut)}
.fover{font-size:10.5px;color:var(--warn);background:rgba(180,83,9,.12);border-radius:999px;
  padding:1px 7px;cursor:help;white-space:nowrap}
.hspan{display:inline-block;margin-left:10px;font-size:10.5px;font-weight:600;letter-spacing:.04em;
  text-transform:none;color:var(--mut);background:var(--bd-soft);padding:2px 9px;border-radius:999px;
  vertical-align:2px}
.ascspan{font-size:11px;color:var(--mut);margin:2px 0 7px}
.ascgrid{display:grid;gap:7px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
  margin-bottom:10px}
.ascgrid>div{background:var(--bd-soft);border-radius:9px;padding:7px 10px;min-width:0}
.ascgrid span{display:block;font-size:10px;color:var(--mut);text-transform:uppercase;
  letter-spacing:.04em}
.ascgrid b{font-family:var(--f-disp);font-size:15px;font-variant-numeric:tabular-nums}
.fcard[id]:target{border-color:var(--acc);box-shadow:0 0 0 2px rgba(125,140,170,.3),var(--sh-up)}
/* ---------- acabamento: luz e profundidade (01/10) ----------
   Gradiente é usado onde tem função: a luz no topo dá direção à página, a barra
   do funil ganha volume, e o cabeçalho de cada app se separa do conteúdo. Fundo
   chapado em tudo o resto, para os números seguirem sendo o que salta. */
body{background:
  radial-gradient(1100px 420px at 12% -8%, color-mix(in srgb, var(--acc) 11%, transparent), transparent 70%),
  radial-gradient(900px 360px at 88% -4%, color-mix(in srgb, var(--ok) 7%, transparent), transparent 72%),
  var(--bg);
  background-attachment:fixed}

| 0 |\n| US | baby songs english | 10 | 3 | 0 | 6 |\n| US | nursery rhymes | 10 | **6** | 1 | 5 |\n| US | learn english for kids | 10 | 5 | 2 | 3 |\n| BR | ingles para bebes | 7 | 2 | 2 | 2 |\n| BR | ingles infantil | 9 | 0 | **5** | 1 |\n| BR | musica infantil ingles | 7 | **6** | 0 | 3 |\n| ES | ingles para bebes | 9 | 4 | 1 | 2 |\n| ES | ingles para ninos | 10 | 3 | 2 | 0 |\n\n**Leitura:** os termos com a palavra **\"beb\u00ea\" s\u00e3o os mais podres** \u2014 `baby english` (US) tem 8 de 10 resultados com menos de 100 avalia\u00e7\u00f5es e 7 sem atualiza\u00e7\u00e3o desde 2024; `musica infantil ingles` (BR) tem 6 de 7 abandonados. J\u00e1 `ingles infantil` (BR) \u00e9 o oposto: **5 de 9 t\u00eam mais de 10 mil avalia\u00e7\u00f5es** \u2014 \u00e9 um SERP de guerra (Buddy.ai 25.690, Lingokids 86.932, Duolingo 1.143.383, Falou 185.903, Simpler 13.702).\n\n### 1c. Os tr\u00eas achados que mais importam desta varredura\n\n1. **O #1 de `english for babies` e de `baby english` no US \u00e9 um app de ingl\u00eas PARA ADULTO.** \"10 Minute English\" (CLEVER APPS, 12.298 avalia\u00e7\u00f5es) \u2014 os prints dele falam em *boarding pass*, *business trip*, *office building*, \"Vocabulary for travel, career, and life\", e a biblioteca \u00e9 Alice no Pa\u00eds das Maravilhas / Tom Sawyer. Ele rankeia em `english for babies`, `baby english`, `toddler english`, `english immersion for toddlers`, `screen free english` e `learn english listening kids`. Ou seja: **ningu\u00e9m que \u00e9 de fato do nicho ocupa esses termos \u2014 quem ocupa \u00e9 keyword stuffing de um app adulto com massa.**\n2. **Nenhum app do nicho \u00e9 \u00e1udio-first.** Ver se\u00e7\u00e3o 3.\n3. **O termo com volume real n\u00e3o \u00e9 \"ingl\u00eas\", \u00e9 \"m\u00fasica\".** `nursery rhymes` (US) mede **popularidade 25 / dificuldade 13** no Astro \u2014 enquanto `english for babies` mede **pop 5 / diff 11**, `baby english` **pop 5 / diff 5**, `ingles para bebes` (BR) **pop 5 / diff 35**, `ingles infantil` (BR) **pop 5 / diff 57**, `ingles para ni\u00f1os` (ES) **pop 5 / diff 46**. Pop 5 \u00e9 o piso da escala Astro = **sem volume mensur\u00e1vel**.\n\n---\n\n## 2. Tabela por mercado \u2014 os que importam\n\n### US\n\n| App | ratingCount | nota | subtitle | promessa | monetiza\u00e7\u00e3o |\n|---|---|---|---|---|---|\n| **Lingokids: Games & Shows** | **651.823** | 4.27 | Everything kids love! | \"4000+ fun activities\" \u2014 playlearning 2-8a, jogos + desenhos pr\u00f3prios | Assinatura + tier **Plus** (upsell em cima de quem j\u00e1 assina) |\n| **Khan Academy Kids** | **130.541** | 4.80 | Reading & Math Learning Games | Curr\u00edculo 2-8a com Kodi o urso; storybooks + fon\u00e9tica | **100% gr\u00e1tis, sem ads, sem assinatura** (nonprofit) |\n| **Speech Blubs: Language Therapy** | **55.961** | 4.62 | For Kids and Toddlers aged 1-8 | Terapia de fala por imita\u00e7\u00e3o de v\u00eddeo de crian\u00e7as reais | Assinatura ~US$14,99/m\u00eas |\n| **Yoto: Music, Stories, Sleep** | **28.642** | 4.76 | Audio entertainment for kids | \"A world of audio for curious kids\" \u2014 stories, podcasts, r\u00e1dio, sleep sounds | Gr\u00e1tis (companion do player f\u00edsico ~US$100-130) |\n| **Learn Spanish \u2013 Studycat** | 16.078 | 4.48 | Learning Games for Kids | Idioma por jogo, 500+ palavras, feedback de pron\u00fancia | Assinatura (~US$35 citado em review) |\n| **Kids Puzzles Puzzingo** | 13.674 | 4.63 | \u2014 | Quebra-cabe\u00e7as educativos | Assinatura |\n| **10 Minute English** | 12.298 | 4.69 | Learn English easily and fast! | **App adulto** \u2014 500 palavras no 1\u00ba m\u00eas, viagem/carreira | Assinatura (reviews acusam cobran\u00e7a sem trial) |\n| **Super Simple - Kids Songs** | 10.912 | 4.54 | Nursery Rhymes,Early Learning | O cat\u00e1logo de nursery rhymes mais forte da loja | Assinatura ~US$6-7/m\u00eas ou ~US$50/ano; s\u00f3 ~3-5 m\u00fasicas gr\u00e1tis |\n| **tonies** | 7.814 | 4.58 | For Tonies, Tonieboxes & more. | Companion da cai c/ano em review) |\n| **Buddy.ai: Ingles para Ni\u00f1os** | 4.913 | 4.72 | \u2014 | Tutor de IA | Assinatura |\n| **Bibi Pintar para Ni\u00f1os 2+** | 4.491 | 4.28 | Juegos de dibujar para beb\u00e9s | Desenho/pintura (n\u00e3o \u00e9 ingl\u00eas) | Assinatura |\n| **Simpler: aprender ingl\u00e9s** | 2.755 | 4.72 | \u2014 | Curso gamificado | Assinatura |\n| **Globo Pop para Beb\u00e9s y Ni\u00f1os** | 1.997 | 4.18 | Aprenda letras y n\u00fameros | Estourar bal\u00f5es, letras/n\u00fameros | Assinatura |\n| **Juegos para ni\u00f1os de 3 a\u00f1os (Kidlo)** | 1.219 | 4.24 | ABC Kids Games: Bebes 2-4 | Minigames | Assinatura |\n| **Aprende Ingl\u00e9s \u2013 Studycat** | 1.024 | 4.47 | \u2014 | Ingl\u00eas por jogo | Assinatura |\n| **EASY peasy: ingl\u00e9s para ni\u00f1os** | 465 | 4.36 | \u2014 | Ingl\u00eas para crian\u00e7as (DE) | Assinatura |\n| **Nominis - Ingl\u00e9s para Ni\u00f1os** | 138 | 4.47 | \u2014 | Ingl\u00eas para crian\u00e7as | Assinatura |\n| **Ingl\u00e9s para Ni\u00f1os - ABC (VKIDS)** | 74 | 4.30 | Juegos Educativos en Ingl\u00e9s 2+ | ABC em ingl\u00eas | Assinatura |\n\n---\n\n## 3. Table stakes \u2014 o que TODO mundo tem\n\nLido nos prints e nas descriptions dos 35 apps baixados:\n\n1. **Mascote antropom\u00f3rfico pr\u00f3prio** em 100% dos apps de tra\u00e7\u00e3o \u2014 Lingokids (Elliot/Cowy/panda), Studycat (gato amarelo de chap\u00e9u), Khan Academy (Kodi o urso), Canticos (os pintinhos), Keiki (pitaya), Papumba (menino ruivo), Little Stories (urso/gato/coelho 3D).\n2. **Jogo com TELA como unidade de produto.** Toque, arrastar, estourar, tra\u00e7ar letra, quiz, memory game. Nenhum app do nicho entrega valor com o aparelho no bolso.\n3. **Assinatura auto-renov\u00e1vel com trial de 7 dias.** \u00danico desvio relevante: Khan Academy Kids (gr\u00e1tis, nonprofit), Duolingo ABC (gr\u00e1tis), Unuhi (compra por livro) e o Gus on the Go (pago US$3,99, modelo de 2013).\n4. **Paywall no primeiro minuto** \u2014 \"s\u00f3 3-5 m\u00fasicas gr\u00e1tis\" (Super Simple), \"precisa assinar pra jogar qualquer coisa\" (Canticos), conta criada antes de revelar o pre\u00e7o.\n5. **Faixa et\u00e1ria larga (2-8 anos), nunca 0-3.** Speech Blubs assume \"1-8\", Lingokids \"2-8\", Khan \"2-8\", Studycat \"3-8\". A crian\u00e7a de 0-2 \u00e9 atendida de rasp\u00e3o.\n6. **Cobertura de vocabul\u00e1rio como prova social**: \"500+ words & phrases\" (Studycat), \"+4000 phonics lessons\" (Monkey Junior), \"4000+ fun activities\" (Lingokids), \"500 words in the first month\" (10 Minute English).\n7. **Selo de seguran\u00e7a**: sem an\u00fancios, COPPA, kidSAFE, parent gate.\n8. **Print 1 = mascote + headline de benef\u00edcio em caixa colorida.** Fundo chapado saturado (rosa, azul, laranja, roxo), tipografia arredondada pesada, 2-3 linhas. Keiki e Lingokids usam roxo/rosa; Studycat azul/verde/laranja; Canticos azul-marinho com selo \"AWARD WINNING\".\n\n---\n\n## 4. Brechas \u2014 com evid\u00eancia, n\u00e3o achismo\n\n### Brecha 1 (a central): N\u00c3O EXISTE app de ingl\u00eas para beb\u00ea que seja \u00e1udio-first / screen-free\n**Evid\u00eancia direta.** Grep de `screen-free | no screen | audio-only | background audio | lock screen | CarPlay | AirPlay | listen while` nas 35 descriptions baixadas:\n- **Zero ocorr\u00eancias** em TODOS os apps de ingl\u00eas-para-crian\u00e7a: 10 Minute English, Studycat, Lingokids (US e BR), Monkey Junior, Papumba, Duolingo ABC, Speech Blubs, Baby Flash Cards, Keiki, Bimi Boo, Kidlo, Super Simple Songs, Baby Shark, British Council Playtime, Gus on the Go, Unuhi.\n- As **\u00fanicas** ocorr\u00eancias no corpus inteiro v\u00eam de apps que **n\u00e3o ensinam ingl\u00eas**: Yoto (\"connect via CarPlay\"), Muky (\"CarPlay Support\", \"AirPlay, auto-stop timers for bedtime\"), Pinna (\"screen-free content\" \u2014 e \u00e9 linha de venda B2B pra escola), Canticos (**uma linha**: \"A parents' section with music playlists for screen-free time\") e Khan Academy (\"make screen time more meaningful\" \u2014 o oposto da promessa).\n- Super Simple Songs, que \u00e9 o maior cat\u00e1logo de nursery rhymes da loja (10.912 avalia\u00e7\u00f5es), menciona playlist **uma vez** e n\u00e3o promete \u00e1udio de fundo em lugar nenhum. Um review de 4\u2605 pede exatamente isso: *\"it's not very airplane friendly\"*.\n\n**Prova pelo lado da busca:** buscar `screen free english`, `english audio for babies`, `ingles ouvindo bebe`, `ingles sem tela`, `ingles escuchando bebe` devolve (a) apps de ingl\u00eas adulto, (b) o Yoto/tonies, ou (c) resultados com **0-3 avalia\u00e7\u00f5es**. `imersao ingles crianca` (BR) e `inmersion ingles ninos audio` (ES) devolvem **zero resultados**. Ningu\u00e9m est\u00e1 posicionado ali \u2014 e ningu\u00e9m est\u00e1 buscando ali (ver ressalva na se\u00e7\u00e3o 6).\n\n### Brecha 2: a faixa 0-2 anos \u00e9 \u00f3rf\u00e3 de posicionamento\nO \u00fanico app do conjunto que p\u00f5e \"beb\u00eas\" no nome COM tra\u00e7\u00e3o \u00e9 o **Papumba \"Aprenda Ingl\u00eas para Beb\u00eas\"** (4.179 avalia\u00e7\u00f5es no BR, 318 no US) \u2014 e ele **n\u00e3o recebe update desde novembro de 2021**, com prints em estilo 2014. Todo o resto assume pr\u00e9-escolar que j\u00e1 toca, arrasta e responde quiz. Reviews confirmam o desencaixe: *\"She doesn't understand the games yet but she loves the coloring feature\"* (Canticos, m\u00e3e de 20 meses, 5\u2605).\n\n### Brecha 3: ningu\u00e9m vende \"rotina de exposi\u00e7\u00e3o\" \u2014 todos vendem \"atividade\"\nA m\u00e9trica de todos \u00e9 conte\u00fado acumulado (4000 atividades, 500 palavras). Nenhum vende **minutos de exposi\u00e7\u00e3o por dia**, sequ\u00eancia di\u00e1ria, ou \"quanto ingl\u00eas seu beb\u00ea ouviu essa semana\". O mais perto \u00e9 o \"10 Minute English\" \u2014 que \u00e9 adulto. Um app que mostre \u00e0 m\u00e3e *a dose* (streak de escuta, minutos/dia, rotina soneca-banho-carro) n\u00e3o tem concorrente.\n\n### Brecha 4: o pre\u00e7o \u00e9 uma ferida aberta, e a alternativa gr\u00e1tis \u00e9 rara\nAssinatura \u00e9 universal, e **\u00e9 a reclama\u00e7\u00e3o n\u00ba 1 em todos os tr\u00eas mercados** (ver se\u00e7\u00e3o 5). Os \u00fanicos gr\u00e1tis de verdade s\u00e3o Khan Academy Kids e Duolingo ABC \u2014 nenhum dos dois faz ingl\u00eas-como-segunda-l\u00edngua para beb\u00ea. Um app gr\u00e1tis nesse nicho entra num campo onde a insatisfa\u00e7\u00e3o com cobran\u00e7a \u00e9 a maior fonte de 1\u2605.\n\n### Brecha 5: nenhum player de \u00e1udio infantil resolve ingl\u00eas; nenhum app de ingl\u00eas resolve \u00e1udio\nYoto (28.642) e tonies (7.814) provam que existe demanda forte por \u00e1udio infantil \u2014 mas s\u00e3o **companion de hardware de US$100+**, e o conte\u00fado \u00e9 entretenimento (Harry Potter, Peppa, Beatles), n\u00e3o exposi\u00e7\u00e3o a idioma. Muky (12 avalia\u00e7\u00f5es) \u00e9 a prova de que um player de \u00e1udio infantil *s\u00f3 de software* existe e n\u00e3o pegou tra\u00e7\u00e3o \u2014 porque player vazio n\u00e3o \u00e9 produto: quem entrega valor \u00e9 o **cat\u00e1logo**.\n\n---\n\n## 5. Dores dos reviews \u2014 cita\u00e7\u00f5es reais\n\nAmostra: 1.600+ reviews mais recentes via RSS da App Store (`reviews_raw.json`). Nota m\u00e9dia das \u00faltimas ~98 avalia\u00e7\u00f5es \u00e9 MUITO pior que a m\u00e9dia hist\u00f3rica em quase todos: Lingokids US 3,55 (hist\u00f3rico 4,27), Lingokids ES 3,35, Keiki BR 3,34, 10 Minute English 2,48.\n\n### 5.1 Cobran\u00e7a/assinatura \u2014 a dor n\u00ba 1, disparada\n49 das 98 \u00faltimas avalia\u00e7\u00f5es do 10 Minute English mencionam cobran\u00e7a; 30 de 98 no Keiki BR; 25 de 98 no Lingokids ES; 28 de 98 no Super Simple.\n- *\"$7 a month to listen to songs \u2014 There is absolutely no reason why an app for children requires a monthly subscription to listen to nursery songs. You only get like 5 free songs.\"* \u2014 Super Simple Songs, 1\u2605\n- *\"Le di a la prueba gratuita de 1 semana y a los 2 d\u00edas lo cancel\u00e9 y me han cobrado 1 a\u00f1o entero, 89,99\u20ac.\"* \u2014 Lingokids ES, 1\u2605\n- *\"Pega todos seus dados e do seu filho para depois no final pra ter o per\u00edodo teste tem q fazer a assinatura. 79 reais por m\u00eas. Muito caro.\"* \u2014 Keiki BR, 1\u2605\n- *\"Inventaram uma assinatura Plus para arrecadar mais. J\u00e1 assinava para meu filho e agora tem limite de tempo de uso para for\u00e7ar o upgrade.\"* \u2014 Lingokids BR, 1\u2605\n- *\"Cute app, but teases you \u2014 it requires a subscription to play it at all. It teases you by letting you create an account before it states that you need a subscription.\"* \u2014 Canticos, 2\u2605\n- *\"The app is NOT worth the price. Review from a toddler mom and primary school Dual Language Educator. The bulk of it is videos. I do not want to pay for my child to sit and watch videos.\"* \u2014 Canticos, 2\u2605\n\n### 5.2 Tela/superest\u00edmulo \u2014 dor menor em volume, mas \u00e9 a que abre a porta do \u00e1udio\n- *\"Bom, mas muito estimulante \u2014 O P\u00ea gosta do app, mas eu achei muito estimulante, acaba deixando-o meio agitado sem necessidade. Poderia ter menos est\u00edmulos e ser mais calmante.\"* \u2014 Keiki BR, 4\u2605\n- *\"So much fun! This app keeps my kid entertained for whole afternoons. **But without the screen guilt**, because the whole time he was interacting and responding in spanish!\"* \u2014 Canticos, 5\u2605\n- *\"I'm glad there is an option like Lingokids that make me **feel less guilty about screen time** as he is learning while playing.\"* \u2014 Lingokids ES, 5\u2605\n- *\"It's also **not overstimulating** for our little one on the spectrum who also has ADHD.\"* \u2014 Super Simple Songs, 4\u2605\n- *\"Helped me stop my addictions to my iPad and iPhone.\"* \u2014 Yoto, 5\u2605\n> Padr\u00e3o: a m\u00e3e **j\u00e1 sente culpa de tela e verbaliza isso num review de 5 estrelas**. Ela agradece quando o app a faz sentir menos culpa. Nenhum app hoje oferece a sa\u00edda \u00f3bvia \u2014 desligar a tela.\n\n### 5.3 Offline / carro / avi\u00e3o \u2014 pedido expl\u00edcito e recorrente\n- *\"Recent update is a big problem \u2014 You have to get online to use this app now. While on the road we don't have internet, you cannot use this app.\"* \u2014 Monkey Junior, 1\u2605\n- *\"That being said the reason why I didn't give it 5 stars is **it's not very airplane friendly**. It's so hard to keep our little one seated for flights.\"* \u2014 Super Simple Songs, 4\u2605\n- *\"It's been a lifesaver during long road trips and flights.\"* \u2014 Khan Academy Kids, 5\u2605\n- *\"Cog\u00ed la prueba para ver si merec\u00eda la pena y **se pod\u00eda jugar offline y no se puede**\u2026 o sea que no me sirve para nada.\"* \u2014 Lingokids ES, 1\u2605\n- *\"We got this for a road trip for our kids. Nothing plays on it. Says it's 'offline'.\"* \u2014 Yoto, 1\u2605\n\n### 5.4 Idade errada / conte\u00fado raso\n- *\"She doesn't understand the games yet but she loves the coloring feature.\"* \u2014 Canticos, m\u00e3e de 20 meses, 5\u2605\n- *\"Vira coisa de crian\u00e7inha beb\u00ea de 5 anos\"* \u2014 Lingokids BR, 1\u2605 (reclamando do lado oposto: filho cresceu)\n- *\"This app is more of a game for kids than a learning tool\u2026 I'm curious about your research basis, company educational background, and the learning outcomes users can expect? There is nothing about this on your app page.\"* \u2014 Studycat, 1\u2605\n- *\"If not, the game gets repetitive.\"* \u2014 Studycat ES, 4\u2605\n- *\"good - are there ever gonna be any new stories? if not, why TF is it a monthly subscription\"* \u2014 Little Stories, 2\u2605\n\n### 5.5 Bugs e suporte\nYoto 13/98, Monkey Junior 10/98, Duolingo ABC 8/98, Canticos 6/98 men\u00e7\u00f5es a crash/travamento. Suporte ausente \u00e9 tema recorrente em BR/ES (*\"n\u00e3o consigo contato com o suporte\"*).\n\n---\n\n## 6. Veredito de espa\u00e7o\n\n### D\u00e1 pra entrar por busca?\n**Sim nos termos com \"beb\u00ea\" \u2014 mas eles n\u00e3o t\u00eam volume.** As duas metades da resposta:\n\n**(a) O SERP dos termos-alvo \u00e9 fraco, n\u00e3o dominado.**\n`baby english` (US): 8 dos 10 resultados t\u00eam <100 avalia\u00e7\u00f5es e 7 n\u00e3o recebem update desde 2024 \u2014 incluindo apps parados em 2014 e 2016. `english for babies`: 5 de 9 com <100. `musica infantil ingles` (BR): 6 de 7 com <100. O #1 desses termos \u00e9 um app de ingl\u00eas adulto que s\u00f3 est\u00e1 ali por massa de download. **N\u00e3o h\u00e1 incumbente defendendo o territ\u00f3rio.** Um app novo, bem feito, com metadata correta, ranqueia top-3 nesses termos sem esfor\u00e7o extraordin\u00e1rio.\n\n**(b) E \u00e9 justamente por isso que eles est\u00e3o vazios: n\u00e3o h\u00e1 demanda medida.**\nAstro, hoje: `english for babies` **pop 5 / diff 11**, `baby english` **pop 5 / diff 5**, `ingles para bebes` BR **pop 5 / diff 35**, `ingles infantil` BR **pop 5 / diff 57**, `ingles para ni\u00f1os` ES **pop 5 / diff 46**. **Pop 5 \u00e9 o ch\u00e3o da escala \u2014 significa \"sem volume mensur\u00e1vel\".** Ganhar 100% de um termo de pop 5 \u00e9 ganhar quase nada. (Os termos `toddler english`, `bilingual baby`, `baby songs english` e `learn english for kids` n\u00e3o estavam trackeados no Astro no momento da varredura; a sess\u00e3o paralela de `/research-aso-keywords` \u00e9 dona da tabela completa.)\n\n**(c) Onde h\u00e1 volume, h\u00e1 guerra.**\nO \u00fanico termo do conjunto com popularidade real \u00e9 **`nursery rhymes` (US): pop 25 / diff 13** \u2014 e varia\u00e7\u00f5es (`kids nursery rhymes` pop 17). Diff 13 com pop 25 \u00e9 um sweet spot de verdade pelos crit\u00e9rios do lab. S\u00f3 que o campo ali n\u00e3o \u00e9 \"ingl\u00eas\", \u00e9 **m\u00fasica infantil**, e o dono \u00e9 o Super Simple Songs (10.912 avalia\u00e7\u00f5es, US$6-7/m\u00eas, cat\u00e1logo licenciado do YouTube). `ingles infantil` (BR) tem 5 apps acima de 10 mil avalia\u00e7\u00f5es \u2014 SERP invi\u00e1vel para app novo. `ingles para ni\u00f1os` (ES) tem Duolingo (352.895) e Lingokids (26.884) no topo.\n\n### Conclus\u00e3o\nO nicho tem **brecha de produto real e brecha de busca aparente, mas n\u00e3o tem demanda de busca comprovada nos termos que descrevem a ideia**. A combina\u00e7\u00e3o certa para um GO \u00e9:\n- **posicionar pelo termo que tem volume** (nursery rhymes / kids songs / m\u00fasicas infantis em ingl\u00eas, pop 25 / diff 13 no US) \u2014 e n\u00e3o por \"english for babies\", que n\u00e3o \u00e9 buscado;\n- **diferenciar pelo que ningu\u00e9m tem**: modo s\u00f3-\u00e1udio, background audio com tela apagada, lock screen/CarPlay, offline, timer de soneca, rotina de exposi\u00e7\u00e3o di\u00e1ria em minutos;\n- **atacar a ferida universal**: gr\u00e1tis, sem assinatura, sem an\u00fancio \u2014 em um nicho onde cobran\u00e7a \u00e9 a fonte n\u00ba 1 de 1\u2605 nos tr\u00eas mercados (regra do lab: v1 sempre gr\u00e1tis, o que aqui vira diferencial de marketing e n\u00e3o concess\u00e3o);\n- **aceitar que o risco real n\u00e3o \u00e9 competitivo, \u00e9 de demanda** \u2014 a m\u00e3e que quer isso hoje abre o YouTube ou o Spotify, n\u00e3o a App Store. Um teste barato de inten\u00e7\u00e3o (Apple Ads nos termos de m\u00fasica infantil em ingl\u00eas) vale mais que qualquer outra evid\u00eancia antes de escrever c\u00f3digo.\n\n**Risco de categoria a considerar antes do GO:** app de categoria Kids na App Store exige compliance extra (Kids Category, sem links externos, sem analytics de terceiros sem consentimento, parent gate). Isso muda o padr\u00e3o de Firebase do lab.\n\n---\n\n## 7. Arquivos desta varredura\n- `serp_raw.json` \u2014 top 10 por termo, 12 termos \u00d7 3 stores, com ratingCount/nota/dev/data de update\n- `serp_incumbents.json` \u2014 checagem nominal dos incumbentes (Lingokids, Khan, Gus on the Go, Studycat, Duolingo ABC, Babbel, Pinkfong, Cocomelon, Super Simple) + 9 sondas de \"audio-first\"\n- `serp_audiofirst.json` \u2014 13 sondas de termos screen-free/\u00e1udio nos 3 stores\n- `reviews_raw.json` \u2014 1.600+ reviews recentes de 18 apps (US/BR/ES)\n- `competitor-intel/{us,br,es}/<app>/` \u2014 meta.json, description.txt, \u00edcone e TODOS os prints de 35 apps\n"];</script><script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script><script>document.querySelectorAll("#md .mdpart").forEach(function(el){var R=RAWS[+el.dataset.i]||"";el.innerHTML=window.marked?marked.parse(R):"<pre>"+R.replace(/</g,"&lt;")+"</pre>";});document.querySelectorAll("#md h1,#md h2,#md h3").forEach(function(h){if(h.id)return;h.id=h.textContent.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"");});if(location.hash){var t=document.getElementById(decodeURIComponent(location.hash.slice(1)));if(t)t.scrollIntoView();}</script></div><script>
