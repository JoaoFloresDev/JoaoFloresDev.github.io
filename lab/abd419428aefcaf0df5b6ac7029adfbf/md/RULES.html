sendo propor-e-esperar-aval at\u00e9 pra editar, buildar ou instalar.\n\n- **`Apps/important/`** (Calculator-, Calc-MacOS, AppLock): produ\u00e7\u00e3o com receita. Cautela m\u00e1xima, s\u00f3 com aval. Testar antes de tocar, sem refactor agressivo.\n  - **Cloak (AppLock) e Calc+ est\u00e3o CONGELADOS desde 27/09/2026** (\"nao \u00e9 pra mexer neles, eles ficam congelador\"): nenhuma mudan\u00e7a de c\u00f3digo, metadata, prints, PPO ou analytics \u2014 nem proposta. Achados sobre eles v\u00e3o em nota \"congelado\", sem a\u00e7\u00e3o. Reabrir s\u00f3 com pedido dele.\n- **`Apps/intermediate/`** (stepsSwiftUI/Walk, WTMP, CollegeSchoolControl, iPhotosEditor, soninho_ios/Sunrise, Postura, Cronogram-Capilar, blw): tra\u00e7\u00e3o real, **supervisionados** \u2014 n\u00e3o iterar sozinho.\n- **`Apps/recovery/ios/`** e **`Apps/recovery/flutter/`**: liberdade pra iterar em c\u00f3digo **quando o Jo\u00e3o pede**. Gerar vers\u00e3o, arquivar e submeter pra review **n\u00e3o** s\u00e3o mais aut\u00f4nomos (autoriza\u00e7\u00e3o de 31/08 revogada em 06/09) \u2014 precisam de pedido expl\u00edcito dele na conversa, com preflight obrigat\u00f3rio antes de todo archive.\n\n## Paths cr\u00edticos (memorizar)\n| Recurso | Path |\n|---------|------|\n| ASC API key | `[chave]` |\n| Apple Ads .env | `_GambitStudio/keys/apple_ads.env` |\n| GambitScreenshotKit (absolute) | `_GambitStudio/packages/GambitScreenshotKit` |\n| Scripts compartilhados | `_GambitStudio/scripts/` |\n| Templates (onboarding, settings, screenshots-tool, fastlane) | `_GambitStudio/templates/` |\n\n## IDs constantes\n- Team ID: `[team]`\n- ASC Issuer: `[issuer]`\n- ASC Key ID: `[key id]`\n- Vendor #: `[vendor]`\n- Bundle prefix: `com.gambitstudio.[appname]`\n- Email contact: `[email]`\n- Support URL padr\u00e3o: `https://gambitstudiotech.com/`\n- Privacy Policy: `https://drive.google.com/file/d/147xkp4cekrxhrBYZnzV-J4PzCSqkix7t/view?usp=sharing`\n- Terms: `https://www.apple.com/legal/internet-services/itunes/dev/stdeula/`\n\n## Paleta por nicho (MANDATORY)\n**Cada app GambitStudio recebe uma paleta \u00fanica num \u00daNICO esquema (claro ou escuro), coerente com seu nicho e com os tops da categoria.** Define ANTES de criar Foundation (Phase 3) e respeita em:\n- `AppColors` (background / surface / textPrimary / etc. \u2014 Asset Catalog entries, s\u00f3 no esquema escolhido)\n- App icon (cores principais)\n- LaunchScreen (mesma fam\u00edlia)\n- MarketingTheme dos screenshots\n\nSugest\u00f5es por nicho (ponto de partida, N\u00c3O regra fixa):\n| Nicho | Background | Primary | Acento |\n|-------|------------|---------|--------|\n| Health/Fitness | off-white verde-claro (#F7FBF8) | verde sa\u00fade (#0A9B5C) | laranja energia (#FF8A3D) |\n| Finance/Calc | branco neutro (#FAFAFB) | azul confian\u00e7a (#0F62FE) | dourado (#F1B73A) |\n| Productivity/Notes | off-white (#FAFAFA) | \u00edndigo focus (#4B5FE1) | coral (#FF6B6B) |\n| Privacy/Security | branco frio (#F5F7FA) | roxo confidencial (#5B3AB4) | verde lock (#10B981) |\n| Kids/Family | creme (#FFF8EE) | turquesa (#1FBAB3) | amarelo (#FFD33D) |\n| Habit/Routine | bege (#FAF6F0) | terracotta (#D17F5E) | sage (#789C7B) |\n\nRegra: **NUNCA usar deepPurple gen\u00e9rico** \u2014 escolher cores que evocam o dom\u00ednio. Nicho coerente = melhor convers\u00e3o na App Store.\n\n## Reglas inquebr\u00e1veis de c\u00f3digo\n- **Liquid Glass SEMPRE desabilitado** \u2014 `UIDesignRequiresCompatibility = YES` no Info.plist de TODO app (opt-out do redesign iOS 26; mant\u00e9m o design system controlado).\n- **Lab auto-contido** \u2014 `_GambitStudio` (kits, templates, skills, ASO refs) NUNCA referencia path/nome de app. Tudo que \u00e9 padr\u00e3o tem c\u00f3pia pr\u00f3pria aqui; apontar pra c\u00f3pia, n\u00e3o pro app.\n- **Onboarding = sempre o `OnboardingKit`**. N\u00e3o reimplementar custom; evoluir = editar o kit. Passo de paywall no fim = `PaywallKit` quando o app monetiza (regra de monetiza\u00e7\u00e3o abaixo).\n- **Um esquema de cor por app** (Jo\u00e3o 27/09/2026): claro OU escuro, decidido na Fase 1 pelo nicho e pelos tops da categoria, registrado no PRODUCT-SPEC. `preferredColorScheme` fixo no `@main`, paleta s\u00f3 desse esquema, sem toggle de Apar\u00eancia em Settings, sem `@AppStorage(\"appearanceMode\")`. Nunca suportar os dois. Apps publicados mant\u00eam o que t\u00eam at\u00e9 uma vers\u00e3o com alavanca.\n- **MVVM estrito**, max 600 linhas por arquivo, MARK em todos.\n- **Sem `#Preview` blocks.** Sem `.foregroundColor` (usar `.foregroundStyle`).\n- **Shadows s\u00f3 preto** (`.black.opacity(0.X)`). Nunca colored.\n- **Strings hardcoded s\u00e3o bug** \u2014 sempre `String(localized: \"key\")` + adicionar no xcstrings.\n- **`xcodegen generate` sempre** ap\u00f3s adicionar/remover arquivos. NUNCA editar `project.pbxproj` \u00e0 m\u00e3o.\n- **Background full-screen via ZStack**, nunca via `.background()` sozinho.\n- **NavigationStack s\u00f3 em tabs que t\u00eam push** \u2014 wrap tab com header customizado causa nav bar fantasma.\n- **Monetiza\u00e7\u00e3o pode entrar desde a v1** (Jo\u00e3o, 27/09/2026: \"pode parar de ter v1 inteira gratis entao\" \u2014 revoga a regra antiga de v1 inteira gr\u00e1tis). A decis\u00e3o \u00e9 da Fase 1 do `/create-ios-app`: app com gate natural nasce com `PaywallKit` + StoreKit 2 (soft paywall no fim do onboarding, anual com trial de 7 dias + semanal, tela p\u00f3s-compra; nunca RevenueCat); app sem gate fica gr\u00e1tis com o motivo registrado no PM spec. Regras em `spec/product-playbook.md` e `aso/reference/monetization-playbook.md`. App j\u00e1 publicado: app a app, nunca release magra. Mock de screenshots continua no `screenshots-tool/`, n\u00e3o numa flag de produ\u00e7\u00e3o.\n\n## Padr\u00f5es de feature compartilhados (use templates, N\u00c3O reinvente)\n- **Onboarding \u2014 usar `OnboardingKit`** (`_GambitStudio/packages/OnboardingKit`, padr\u00e3o self-contained do lab), pra TODOS os apps GambitStudio. Fluxo: 2-3 features \u2192 2-3 perguntas de personaliza\u00e7\u00e3o (`OnboardingQuestionStep`, kit \u2265 27/09/2026) \u2192 step de dados (se o app precisar) \u2192 permiss\u00e3o (se precisar) \u2192 paywall soft (se monetiza):\n  - Step 1, 2, 3 = 3 main features (hero + t\u00edtulo + descri\u00e7\u00e3o cada)\n  - **Hero de onboarding (`heroImage`) = ilustra\u00e7\u00e3o FLAT 2D, fundo TRANSPARENTE (alpha real, PNG), na PALETA DO APP** \u2014 nunca 3D glossy nem imagem com fundo (vira ret\u00e2ngulo colado no gradiente). Encaixe org\u00e2nico. Receita: Nano Banana (`mcp__gemini__generate_image`, `nano-banana-pro-preview`) com prompt \"flat 2D vector, flat colors only, [hexes da paleta do app], subject centered com margem generosa, solid uniform pure white background, subject n\u00e3o toca as bordas\" \u2192 o Gemini salva **JPEG (sem alpha)**, ent\u00e3o SEMPRE remover o fundo com flood-fill das bordas \u2192 alpha (script `scripts/ai/key.py`, Pillow, thresh~48, sentinel magenta\u2192transparente) \u2192 PNG no imageset. Detalhe em `scripts/ai/README.md`.\n  - \u00daltimo step = dados/permiss\u00e3o que o app precise; depois dele, o paywall soft do `PaywallKit` quando o app monetiza (nunca ANTES do valor)\n  - Persistir `hasSeenOnboarding=true` ao terminar o \u00faltimo step\n  - **N\u00c3O usar hero single-screen** (padr\u00e3o antigo deprecated)\n- **LaunchScreen \u2014 logo BRANCO sobre fundo da paleta primary do app** (igual primeira tela de onboarding). N\u00c3O usar fundo bege/neutro com logo colorido. Visual coerente com a hero do onboarding.\n- **Safe index access** \u2014 JAMAIS `array[someIndex]` direto em arrays runtime. Sempre `array[safe: i] ?? fallback` (extension `subscript(safe:)`) OU `guard !array.isEmpty, idx >= 0, idx < array.count else { return ... }`. Index unsafe causa crash SIGILL dif\u00edcil de debugar \u2014 bug recorrente.\n- **Todo controle interativo exp\u00f5e `accessibilityIdentifier` + `accessibilityLabel`** \u2014 bot\u00e3o, toggle, row-bot\u00e3o, chip, tab. Sem isso o QA s\u00f3 consegue tocar por COORDENADA, e tap por ponto errado no Maestro reporta `COMPLETED` sem fazer nada: o teste passa verde sem ter testado (Sunrise, 31/08 \u2014 um `Toggle` com `.labelsHidden()` n\u00e3o expunha nada). Conven\u00e7\u00e3o do id: `dominio.acao` (`alarm.toggle.<id>`, `alarm.save`, `alarm.dismiss`). O label \u00e9 a string localizada que o VoiceOver l\u00ea \u2014 a mesma mudan\u00e7a resolve QA e acessibilidade. Flows do Maestro usam `tapOn: id:` / `assertVisible: id:`; tap por ponto s\u00f3 quando n\u00e3o houver alternativa, e a\u00ed a corre\u00e7\u00e3o certa \u00e9 adicionar o id no app. Detalhe em LEARNINGS #66.\n- **Simulador: no m\u00e1ximo 2, sempre pela fila `tools/sim-pool`** (Jo\u00e3o, 12/09/2026: \"o m\u00e1ximo de simuladores abertos \u00e9 2 \u2026 o mac n\u00e3o aguenta, \u00e9 um intel\"). NUNCA criar, clonar ou bootar simulador fora do pool, nem um por agente. Antes de usar: `python3 _GambitStudio/tools/sim-pool/simpool.py acquire --owner <sess\u00e3o/agente> --purpose \"<o qu\u00ea>\"` \u2192 `GRANTED <udid>` (usa esse UDID expl\u00edcito) ou `QUEUED <pos>`. Na fila, **n\u00e3o ficar parado**: seguir com outro trabalho (c\u00f3digo, build gen\u00e9rico, revis\u00e3o) e rodar `poll` a cada poucos minutos. Tarefa longa: `heartbeat` a cada ~15 min (lease sem heartbeat por 30 min \u00e9 recolhido). Terminou: `release` na hora \u2014 outra inst\u00e2ncia est\u00e1 esperando. Device f\u00edsico do Jo\u00e3o continua preferido quando conectado. `simpool.py status` mostra quem est\u00e1 com cada um.\n- **Texto NUNCA trunca** (Jo\u00e3o, 12/09/2026: \"coloca como regra que n\u00e3o pode ficar truncando texto\") \u2014 t\u00edtulo, label, bot\u00e3o, chip ou card: se n\u00e3o cabe, quebra em 2+ linhas (`.fixedSize(horizontal: false, vertical: true)` + `.multilineTextAlignment`), e a tela rola se precisar. Proibido `.lineLimit(1)` em texto de conte\u00fado, `\u2026` e `.minimumScaleFactor` que deixe ileg\u00edvel. Validar em pt/es (mais longos) e num iPhone pequeno antes de dar a tela como pronta. Detalhe em `spec/design-system.md` (Text never truncates).\n- **\u00c1rea de toque m\u00ednima 44pt** \u2014 todo elemento clic\u00e1vel (bot\u00e3o, row-bot\u00e3o, pill, chip) tem `minHeight: 44` (e `minWidth: 44` se for s\u00f3 \u00edcone) + `.contentShape`. Detalhe em `spec/design-system.md` (Tappable size).\n- **Loading em request de sistema** \u2014 todo bot\u00e3o que dispara permission prompt (c\u00e2mera, Health, notifica\u00e7\u00f5es, Family Controls\u2026) ou StoreKit (compra/restore) entra em **estado de loading no tap** (spinner no lugar do CTA + `.disabled`) e s\u00f3 volta quando a completion chegar \u2014 em TODOS os caminhos (concedido/negado/erro/cancel). Opt-in gated por permiss\u00e3o continua deslig\u00e1vel no app depois de concedido. Detalhe em `spec/design-system.md` (Async system requests).\n- **Settings**: `templates/settings/SettingsView.swift.template` \u2014 Language \u00b7 Rate \u00b7 Privacy \u00b7 Terms, mais o card Premium + Restore quando o app monetiza (o template j\u00e1 traz). **Sem Appearance (esquema \u00fanico), Notifications, Share, Feedback.**\n\n## Analytics \u2014 instrumenta\u00e7\u00e3o \u00e9 parte do app, n\u00e3o extra\n- **Todo app loga o conjunto can\u00f4nico** de `analytics/event-taxonomy.md`: `core_action` (o aha, obrigat\u00f3rio), `onboarding_step_viewed`/`onboarding_completed`, `screen_view` com `screen_name`, `feature_used`, `review_prompt_requested`, `permission_result` \u2014 e, se tiver paywall, `paywall_shown` + `purchase_started` + `purchase_success`. **Nome fora da taxonomia \u00e9 bug** (`paywall_view`, `purchase_tap`, `onboarding_complete`, `rating_gate_*` s\u00e3o legados a migrar).\n- **Antes de todo release**: `python3 scripts/analytics/verify-analytics.py <app-dir> --strict`. Ele l\u00ea o SOURCE e acusa can\u00f4nico faltando, nome fora da taxonomia e evento declarado mas nunca chamado. Falhou = n\u00e3o arquiva.\n- **Declarar n\u00e3o \u00e9 logar.** Constante de evento num enum que ningu\u00e9m chama nunca chega no GA4 \u2014 foi assim que o College passou meses sem `core_action` parecendo instrumentado.\n- **GA4 diz o que aconteceu; o c\u00f3digo diz o que o app \u00e9 capaz de dizer.** Evento ausente no GA4 e presente no c\u00f3digo = ningu\u00e9m passou por ali (ou o release \u00e9 novo demais), N\u00c3O gap de instrumenta\u00e7\u00e3o. Nunca acusar gap sem olhar o source.\n- **Projeto Firebase sempre com GA vinculado** (LEARNINGS #38) e o **`GoogleService-Info.plist` no TARGET**, n\u00e3o s\u00f3 na pasta \u2014 plist fora do target = app publicado sem telemetria nenhuma.\n- Ler os n\u00fameros de um app com **cobertura < 25%** (novos no GA4 \u00f7 instala\u00e7\u00f5es reais) \u00e9 ler uma amostra enviesada. Conferir a cobertura antes de qualquer conclus\u00e3o de produto.\n\n## M\u00e9tricas \u2014 o que o n\u00famero significa\n- **Download \u2260 update.** No Sales Report, Product Type `1*` \u00e9 instala\u00e7\u00e3o nova e `7*` \u00e9 atualiza\u00e7\u00e3o. Somar os dois infla tudo (69% do lab em ago/2026 era update) e contamina ARPD, tend\u00eancia e o veredito KILL/WATCH/SCALE. O `pull_data.py` j\u00e1 separa; qualquer an\u00e1lise nova tem que respeitar isso.\n- **Crash s\u00f3 \u00e9 incidente na vers\u00e3o que est\u00e1 NA LOJA.** Crash-free agregado mistura build de dev/TestFlight com produ\u00e7\u00e3o \u2014 cruzar sempre com a vers\u00e3o live (iTunes lookup) antes de chamar de hotfix.\n- **% sem n n\u00e3o vale.** Toda taxa reportada sai com o denominador ao lado; cohort com n < 30 \u00e9 direcional, n\u00e3o conclus\u00e3o.\n\n## Pipeline de ratings (massa de avalia\u00e7\u00e3o \u00e9 gargalo #1 \u2014 tratar como o ASO)\n- **S\u00f3 o prompt NATIVO, direto no aha-moment. NUNCA pr\u00e9-prompt** \u2014 nada de sheet/alerta \"curtindo o app?\", pergunta, card ou formul\u00e1rio de feedback antes ou no lugar do pedido. O lab teve um (RatingGate) e o Jo\u00e3o mandou arrancar de tudo em 11/09/2026: \"esse neg\u00f3cio foi um erro grave\". Era uma pergunta a mais entre o usu\u00e1rio e a avalia\u00e7\u00e3o, filtrava quem chegava a avaliar (App Review 5.6.1 n\u00e3o permite prompt de review customizado) e foi onde nasceram os bugs #85 e #87 \u2014 LEARNINGS #88. N\u00e3o trazer de volta com outro nome. Swift = `ReviewService.shared.recordPositiveEvent(trigger:)` do GambitCoreKit; Flutter = `templates/flutter/review_prompt.dart`. Hook `onEvent` \u2192 `review_prompt_requested` SEMPRE ligado no analytics. Pr\u00e9-gate no source reprova o preflight (`rules.review_pregate`).\n- **O aha-moment \u00e9 escolhido, n\u00e3o chutado**: o instante logo DEPOIS de o usu\u00e1rio obter o valor do app com sucesso vis\u00edvel (salvou, concluiu, atingiu, viu o resultado que veio buscar), num evento que ele repete. Nunca na abertura nem por contagem de aberturas, nunca no meio de um fluxo (sheet aberto, teclado, partida/grava\u00e7\u00e3o rodando), nunca logo depois de erro, permiss\u00e3o, paywall ou compra, nunca em contexto negativo (limite estourado, alarme tocando). 1 ponto de disparo, no m\u00e1ximo 2. Quem implementa escreve por que aquele \u00e9 o momento; o funil GA4 confirma quando houver dados.\n- **Throttle \u00e9 do servi\u00e7o, n\u00e3o do call site**: \u2265 3 aha-moments antes do 1\u00ba pedido (2 quando o aha acontece no m\u00e1ximo 1\u00d7 por dia \u2014 uso di\u00e1rio ou semanal \u2014, sen\u00e3o o 1\u00ba pedido demora semanas), \u2265 90 dias entre pedidos, \u2264 3 por ano, 1 por vers\u00e3o, s\u00f3 com o app em foreground, ~1 s depois do sucesso. Quem chama s\u00f3 escolhe o momento.\n- **Rating-first**: app com **<25 ratings na store-alvo** n\u00e3o roda itera\u00e7\u00e3o ASO agressiva \u2014 primeiro ratings (prompt nativo no aha + primeiras 5 avalia\u00e7\u00f5es via rede/comunidade nas 72h p\u00f3s-launch), depois keywords. O aso-checkpoint reporta o delta de ratings junto das m\u00e9tricas.\n- **Medi\u00e7\u00e3o**: coluna Ratings (\u03947d) no Lab Dashboard (iTunes lookup us/br/es/mx, hist\u00f3rico em `tools/lab-dashboard/data/ratings_history.json`). Review sem resposta = usar o agent `review-responder` (resposta do dev notifica o autor, que pode editar a nota).\n\n## Screenshots \u2014 regras inviol\u00e1veis\n- **NUNCA incluir onboarding nos 5 prints** \u2014 desperdi\u00e7a slot, redundante.\n- **NUNCA incluir paywall nos 5 prints** \u2014 desperdi\u00e7a slot, e Apple Review pode flaggar como push de monetiza\u00e7\u00e3o.\n- **NUNCA usar system tokens** (FamilyActivitySelection / MapKit / WidgetKit) \u2014 n\u00e3o renderizam em macOS ImageRenderer.\n- **5 slots = home / killer feature 1 / killer feature 2 / killer feature 3 / home alternativa ou settings utilidade**. Sempre showcasing valor de USO, n\u00e3o monetiza\u00e7\u00e3o ou onboarding.\n- LaunchScreen background segue paleta do app/nicho (definida em RULES \u2014 Paleta por nicho), n\u00e3o obrigat\u00f3rio dark.\n- **LOOK CAN\u00d4NICO dos prints (padr\u00e3o da casa, N\u00c3O reinventar por app)** \u2014 detalhe completo em `code-driven-prints` SKILL.md (\"The GambitStudio print LOOK\"):\n  1. **Fundo cor s\u00f3lida de marca** (sem blobs/rays/glow/gradiente) \u2014 tom fundo saturado pra contraste com texto branco.\n  2. **Headline verb-split adamlyttle** \u2014 1\u00aa palavra GRANDE sozinha na linha 1, resto menor na linha 2, branco SF Pro Black uppercase (`splitFirstWord: true`, sem underline/subheadline).\n  3. **App real DENTRO do mockup, fiel ao build publicado** (reler source do componente; drift \u00e9 o bug #1). **Isso vale s\u00f3 aqui, no code-driven** \u2014 no panorama por IA a arte \u00e9 interpreta\u00e7\u00e3o por design e se avalia por convers\u00e3o e coer\u00eancia de marca, n\u00e3o por paridade de layout.\n  4. **1 SE\u00c7\u00c3O INTEIRA do app em breakout** sobre o mockup, ampliada com ratio preservado (`scaleEffect` uniforme). **SEMPRE mais largo que o mockup \u2014 transborda as DUAS bordas do device** (nunca acompanhar a largura da tela; \u00e9 o transbordo que cria o efeito \"pop-out\"). **Borda + GLOW na cor prim\u00e1ria/de marca do app** (glow, n\u00e3o sombra preta) + cantos arredondados. A cor segue a PALETA do app \u2014 Walk \u00e9 azul porque Walk \u00e9 app azul; app verde/laranja/roxo usa o pr\u00f3prio primary.\n  5. **5 prints DISTINTOS** \u2014 nunca repetir tela/componente. **Os 3 PRIMEIROS s\u00e3o os principais: t\u00eam que mostrar as MAIN features** (killer feature mais forte no print 1) \u2014 s\u00e3o os que aparecem na LISTA de resultados de busca da App Store (thumbnails), ent\u00e3o convertem antes do user abrir a p\u00e1gina. Slots 4-5 = secund\u00e1rios. **Se (e s\u00f3 se) o app tiver widget**, 1 print mostra o WIDGET da home (small + medium juntos) numa home iOS realista (wallpaper com profundidade, \u00edcones SF Symbols, dock, page dots), fiel \u00e0s views reais do WidgetKit. App sem widget = 5 telas in-app distintas, N\u00c3O inventar widget.\n- **Display type 6.9\" = `APP_IPHONE_67`** (n\u00e3o existe `APP_IPHONE_69` na API); Apple escala pra telas menores. Vencedor de treatment vai direto na p\u00e1gina da vers\u00e3o (n\u00e3o PPO) quando o Jo\u00e3o escolher.\n\n## Site do lab (Lab Hub) \u2014 manter SEMPRE atualizado\n**Toda mudan\u00e7a de estado de projeto vai pro `_GambitStudio/now.json`** (fonte da home do Lab Hub, [Lab Hub local]) \u2014 no MESMO turno em que a mudan\u00e7a acontece, sem o Jo\u00e3o pedir:\n- Concluiu algo (subiu PPO, submeteu vers\u00e3o, deployou metadata, corrigiu bug relevante) \u2192 entrada em `done` (topo) + remover/mover o item correspondente de `items`.\n- Criou a\u00e7\u00e3o manual pro Jo\u00e3o (Start de experimento, resposta na ASC, decis\u00e3o) \u2192 item `t:\"do\"` com `detail` dizendo o passo exato.\n- Algo entrou em espera (review da Apple, processing, prazo) \u2192 item `t:\"wait\"`.\n- Sempre atualizar o campo `updated`. Estados que o Jo\u00e3o corrigir de boca (ex. \"t\u00e1 em review\") \u2192 corrigir no now.json E na mem\u00f3ria do projeto.\n- **NUNCA criar item sobre \"responder avalia\u00e7\u00f5es\"** \u2014 a coluna \"Avalia\u00e7\u00f5es sem resposta\" da home j\u00e1 \u00e9 essa fila (vem do dashboard.json); item no now.json vira duplicata.\n- **NUNCA duplicar**: antes de adicionar, procurar item existente do MESMO app/assunto e ATUALIZAR/mover ele (do\u2192wait, wait\u2192done) em vez de criar outro. Quando a a\u00e7\u00e3o de um item `do` for feita (por voc\u00ea ou pelo Jo\u00e3o) ou mudar de estado (ex. entrou em an\u00e1lise), o item DEVE mudar no mesmo turno \u2014 item stale no Fazer \u00e9 bug.\nO relato no chat N\u00c3O substitui o site \u2014 o Jo\u00e3o acompanha pelo site.\n\n## Quando achar que pode pular uma regra\nVoc\u00ea n\u00e3o pode. Se o caso parece exce\u00e7\u00e3o, releia esta lista. Se ainda parece exce\u00e7\u00e3o, prossiga e adicione o aprendizado em `LEARNINGS.md` \u2014 com a linha correspondente em `LEARNINGS-INDEX.md` (\u00e9 o \u00edndice que carrega em toda sess\u00e3o).\n\n## Pasta PPO por app (obrigat\u00f3ria) \u2014 hist\u00f3rico + assets-base de TODO teste A/B\nTodo app tem `<app>/ppo-pipeline/` (template: `_GambitStudio/aso/pipeline-template/` + `Apps/important/AppLock/App Locker/ppo-pipeline/` como refer\u00eancia viva). Cada experimento = `experiments/<data>_ppo-NN_<slug>/` com:\n- `meta.json` (hip\u00f3tese, tratamentos, locales, display type, ids da ASC, vencedor) \u00b7 `post_mortem.md`\n- `source/` \u2014 **TODOS os assets-base**: imagem IA original SEM texto (panorama do ChatGPT/Nano), bases text-free, JSON de headlines por locale, prints baixados da default page no dia\n- `tools/` \u2014 o script que gerou os prints (render/corte), pra regenerar em qualquer idioma\n- `treatments/<T>/<locale>/NN_slug.png` \u2014 exatamente o que subiu pra ASC\n- `results/` \u2014 n\u00fameros do ASC web (CVR/lift) quando sa\u00edrem\n**Nunca deixar asset s\u00f3 no Desktop/Downloads/scratchpad** (os panoramas do Cloak de 07/08 quase se perderam). Sem a pasta = experimento n\u00e3o rastre\u00e1vel = n\u00e3o sobe.\n";</script><script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script><script>document.getElementById("md").innerHTML=window.marked?marked.parse(RAW):"<pre>"+RAW.replace(/</g,"&lt;")+"</pre>";</script></div><script>(function(){try{var k="lh.scroll:"+location.pathname;var v=sessionStorage.getItem(k);if(v!==null){sessionStorage.removeItem(k);window.scrollTo(0,parseInt(v,10)||0);}document.addEventListener("submit",function(e){var f=e.target;if(f&&f.method&&f.method.toLowerCase()==="post"){sessionStorage.setItem(k,String(window.scrollY));}},true);}catch(e){}})();</script></body></html>
