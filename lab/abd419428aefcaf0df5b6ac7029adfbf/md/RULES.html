<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>RULES.md</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#f4f5f8;--card:#fff;--tx:#0e1015;--mut:#4a5160;--acc:#0b53d6;--ok:#0d9668;--down:#c22;--bd:#c9cfda;--hl:#fff7e0}
@media(prefers-color-scheme:dark){:root{--bg:#0e1013;--card:#1a1e25;--tx:#f2f4f8;--mut:#aab3c2;--acc:#6ea3ff;--bd:#39404d;--hl:#2a2717}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.55 -apple-system,system-ui,sans-serif}
.wrap{width:min(1680px,94vw);margin:0 auto;padding:28px 0 80px}@media(max-width:860px){.wrap{width:calc(100vw - 28px)}}.ico{width:20px;height:20px;border-radius:5px;vertical-align:-5px;margin-right:7px;background:var(--bd);object-fit:cover}.ico.big{width:30px;height:30px;border-radius:7px;vertical-align:-9px}h2{border-top:1px solid var(--bd);padding-top:20px;margin-top:30px}section,.twrap{min-width:0}h2:first-of-type{border-top:0;padding-top:0}h1+h2,.sub+h2{border-top:0;padding-top:0}
h1{font-size:22px;margin:0 0 4px}h2{font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:34px 0 12px}
.sub{color:var(--mut);margin:0 0 8px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px 16px}
.card b{font-size:14.5px}.card p{margin:5px 0 0;color:var(--mut);font-size:13.5px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px}
.up{background:var(--ok)}.dn{background:var(--down)}
a{color:var(--acc);text-decoration:none}a:hover{text-decoration:underline}
code{background:rgba(125,125,125,.13);padding:1px 6px;border-radius:5px;font-size:12.5px}
.pill{display:inline-block;background:rgba(125,125,125,.12);border-radius:99px;padding:1px 10px;margin:2px 3px 2px 0;font-size:12.5px}
table.t{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--bd);border-radius:12px;overflow:hidden}
table.t td,table.t th{padding:7px 12px;border-bottom:1px solid var(--bd);font-size:13.5px;text-align:left;vertical-align:top}
table.t th{color:var(--mut);font-weight:600}table.t tr:last-child td{border-bottom:0}
.twrap{overflow-x:auto;border-radius:12px}
.imgs{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.imgs img{width:100%;border-radius:8px;border:1px solid var(--bd)}
#md{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:22px 26px}
#md pre{overflow-x:auto;background:rgba(125,125,125,.1);padding:10px;border-radius:8px}
#md table{border-collapse:collapse}#md td,#md th{border:1px solid var(--bd);padding:4px 9px;font-size:13.5px}
#md img{max-width:100%}
.hcol .row{flex-direction:column;align-items:flex-start;gap:4px}.hcol .row b{white-space:normal}.hcol .row span{width:100%}.hcol .row em{display:none}.hcol .row.done b{font-size:12px}.hrow{display:flex;gap:20px;overflow-x:auto;align-items:flex-start;padding:16px 28px 12px;margin:18px 0 26px;background:rgba(125,125,125,.07);border:1px solid var(--bd);border-radius:16px;scroll-padding:0 28px}.hcol{flex:0 0 340px;min-width:340px}.hcol:last-child{margin-right:28px}.hcol h2{margin-top:0}.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:0 20px}.cols2{display:grid;grid-template-columns:1fr 1fr;gap:0 20px;align-items:start}@media(max-width:900px){.cols2{grid-template-columns:1fr}}h3.team{margin:18px 0 8px;font-size:15px;font-weight:600}h3.team .chain{display:block;color:var(--mut);font-weight:400;font-size:12.5px;margin-top:2px}.card .step{display:inline-block;min-width:18px;height:18px;line-height:18px;text-align:center;border-radius:9px;background:var(--bd);color:var(--mut);font-size:11px;font-weight:600;margin-right:6px}.grid4{display:grid;gap:12px;grid-template-columns:repeat(4,1fr)}@media(max-width:1100px){.grid4{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.grid4{grid-template-columns:1fr}}
.rows{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;color:var(--tx);font-size:14.5px}
a.row:hover{border-color:var(--acc);text-decoration:none}
.row b{white-space:nowrap}.row span{flex:1;color:var(--mut)}.row em{color:var(--mut);font-style:normal;font-size:18px}
.row.done b{color:var(--mut);font-weight:500;font-size:12.5px}.row.done span b{color:var(--tx)}.row.done span{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;line-height:1.35}
.hdr{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:6px}
.hdr h1{margin:0}.hdr .sub{margin:2px 0 0}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 22px;font-size:14.5px;color:var(--acc)}
.btn:hover{border-color:var(--acc);text-decoration:none}
.tiles{display:flex;gap:10px;flex-wrap:nowrap;overflow-x:auto;margin:14px 0 6px;padding-bottom:4px}
a.tile{display:block;flex:0 0 auto;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 14px;color:var(--tx);min-width:128px}
a.tile:hover{border-color:var(--acc);text-decoration:none}
.tile .tl{font-size:12px;color:var(--mut);white-space:nowrap}
.tile .tv{font-size:21px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px;white-space:nowrap}
.tile .ts{font-size:11.5px;color:var(--mut);margin-top:1px;white-space:nowrap}
.tv.up{color:var(--ok);background:none}.tv.dn{color:var(--down);background:none}
.vd{font-size:15px;font-weight:700;margin-right:10px;white-space:nowrap}
.vd.s{color:var(--ok)}.vd.w{color:#c9930a}.vd.k{color:var(--down)}
.shots{display:flex;gap:8px;overflow-x:auto;padding:4px 0}
.shots img{height:210px;border-radius:10px;border:1px solid var(--bd);flex:0 0 auto}
.gallery img{height:460px;max-height:72vh}
.st{display:inline-block;border-radius:99px;padding:1px 10px;font-size:12px;font-weight:600;margin-left:8px;white-space:nowrap;vertical-align:1px}
.st.run{background:rgba(13,150,104,.16);color:var(--ok)}
.st.appr{background:rgba(201,147,10,.16);color:#c9930a}
.st.rev{background:rgba(11,83,214,.13);color:var(--acc)}
.st.draft{background:rgba(139,92,246,.15);color:#8b5cf6}
.st.mut{background:rgba(125,125,125,.16);color:var(--mut)}
.st.crit{background:rgba(200,34,34,.15);color:var(--down)}
.rowwrap{position:relative}
.rowwrap .row{padding-right:38px}
.delf{position:absolute;top:0;right:0;bottom:0;display:flex;align-items:center;margin:0}
.del{background:none;border:none;color:var(--mut);font-size:17px;line-height:1;padding:6px 12px;cursor:pointer;border-radius:8px;opacity:.45}
.rowwrap:hover .del{opacity:1}
.del:hover{color:var(--down);background:rgba(200,34,34,.08)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(430px,1fr));gap:12px;margin-top:12px}
@media(max-width:520px){.fgrid{grid-template-columns:1fr}}
.fcard{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:13px 15px}
.fcard .fh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.fcard .fh b{font-size:14.5px}.fcard .fh span{font-size:12.5px;color:var(--mut);white-space:nowrap}
.fs{display:flex;align-items:center;gap:8px;margin:3px 0;font-size:13px}
.fs .fl{flex:0 0 168px;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fs .fb{flex:1;height:13px}
.fs .fb i{display:block;height:100%;background:var(--acc);border-radius:3px;min-width:2px}
.fs .fb i.alt{background:var(--ok)}.fs .fb i.ga{background:#8b5cf6}
.fs .fn{flex:0 0 auto;font-variant-numeric:tabular-nums;font-size:12.5px}
.fs.tot .fl,.fs.tot .fn{font-weight:700}
.leak{margin:0 0 5px 176px;font-size:12px;color:var(--down)}
.leak b{font-variant-numeric:tabular-nums}
.fdiv{margin:9px 0 3px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}
.fmeta{font-size:12.5px;color:var(--mut);margin:-3px 0 9px}
.rrow{display:flex;gap:8px;margin:10px 0 4px}
.rc{flex:1;background:rgba(125,125,125,.09);border-radius:9px;padding:6px 9px}
.rc b{display:block;font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.rc .rv{display:block;font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.25}
.rc .rb{display:block;font-size:11px;color:var(--mut)}
.fnds{list-style:none;margin:10px 0 0;padding:0}
.fnds li{position:relative;padding:2px 0 2px 16px;font-size:13px;color:var(--tx)}
.fnds li:before{content:"";position:absolute;left:0;top:9px;width:7px;height:7px;border-radius:50%}
.fnds li.crit:before{background:var(--down)}.fnds li.warn:before{background:#c9930a}.fnds li.ok:before{background:var(--ok)}
.nxt{margin-top:11px;background:var(--hl);border:1px solid var(--bd);border-radius:10px;padding:9px 12px}
.nxt .nxl{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
.nxt b{font-size:14px}.nxt p{margin:3px 0 0;font-size:13px;color:var(--mut)}
.fh .st{margin-left:8px}
.dirbox{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:20px 24px;margin:20px 0 8px}
.dirlab{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--mut)}
.dirh{font-size:19px;line-height:1.35;margin:4px 0 12px;text-transform:none;letter-spacing:0;color:var(--tx)}
.dirp{margin:0 0 9px;font-size:14px;line-height:1.6;color:var(--tx)}
.prio{display:flex;gap:13px;padding:11px 0;border-top:1px solid var(--bd)}
.prn{flex:0 0 26px;height:26px;line-height:26px;text-align:center;border-radius:13px;background:var(--acc);color:#fff;font-weight:700;font-size:13px}
.prc{flex:1;min-width:0}
.prt{font-size:15px;font-weight:600;margin-bottom:3px}
.prw{margin:0 0 5px;font-size:13.5px;color:var(--tx)}
.pre{margin:0 0 4px;font-size:13px;color:var(--mut);line-height:1.55}
.pre b{color:var(--tx);font-weight:600}
.prp{margin:4px 0 0;font-size:13px;color:var(--tx);border-left:2px solid var(--acc);padding-left:9px}
.vgrid{display:flex;flex-direction:column;gap:6px}
.vrow{display:flex;align-items:baseline;gap:9px;font-size:13.5px;flex-wrap:wrap}
.vrow .st{flex:0 0 auto;margin:0}
.vrow b{flex:0 0 auto;min-width:118px}
.vrow span:last-child{flex:1;min-width:220px;color:var(--mut)}
.nots{margin:0;padding-left:18px}
.nots li{font-size:13.5px;color:var(--tx);margin-bottom:5px;line-height:1.55}
.dirfoot{margin:16px 0 0;padding-top:12px;border-top:1px solid var(--bd);font-size:12px;color:var(--mut)}
@media(max-width:700px){.vrow b{min-width:0}}
.fnote{font-size:11.5px;color:var(--mut);margin:4px 0 0 176px;line-height:1.35}

/* ---------- camada de acabamento (01/10/2026) ----------
   Tipografia com duas vozes (display para títulos e números, texto para leitura),
   neutros com viés do azul da marca em vez de cinza puro, e profundidade por
   sombra em vez de só borda. Nada aqui renomeia classe: é uma camada por cima. */
:root{
  --f-disp:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --f-text:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --bg:#f3f5f9; --card:#ffffff; --tx:#10131a; --mut:#5a6377; --acc:#1552d8;
  --bd:#dde2ea; --bd-soft:#e8ecf3; --ok:#0a8f58; --down:#d02f2f; --warn:#b45309;
  --sh:0 1px 2px rgba(16,19,26,.05),0 2px 8px rgba(16,19,26,.04);
  --sh-up:0 2px 6px rgba(16,19,26,.07),0 10px 24px rgba(16,19,26,.07);
  --rad:14px;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#0b0d12; --card:#161a22; --tx:#eef1f7; --mut:#9aa5b8; --acc:#7aa6ff;
  --bd:#272d39; --bd-soft:#1f242e; --ok:#43d08d; --down:#ff7070; --warn:#e5a645;
  --sh:0 1px 2px rgba(0,0,0,.4); --sh-up:0 6px 22px rgba(0,0,0,.5);
}}
body{font-family:var(--f-text);font-size:14.5px;line-height:1.6;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1{font-family:var(--f-disp);font-size:27px;font-weight:800;letter-spacing:-.02em;
  text-wrap:balance;margin:0 0 2px}
h1 .mark{display:inline-block;width:28px;height:28px;vertical-align:-5px;margin-right:11px;
  background-size:contain;background-repeat:no-repeat;background-position:center}
h2{font-family:var(--f-disp);font-size:12px;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;color:var(--mut);border-top:1px solid var(--bd-soft);
  padding-top:22px;margin:32px 0 14px}
h3{font-family:var(--f-disp);letter-spacing:-.01em}
.sub{font-size:13px;color:var(--mut)}
code,.mono{font-family:var(--f-mono);font-size:12.5px}
.card,table.t,a.tile,.row,.fcard,#md{box-shadow:var(--sh);border-color:var(--bd-soft)}
.card,a.tile,.row,.fcard{border-radius:var(--rad)}
a.tile,.row{transition:box-shadow .16s ease,border-color .16s ease,transform .16s ease}
a.tile:hover,a.row:hover{box-shadow:var(--sh-up);border-color:var(--bd);
  transform:translateY(-1px)}
/* O card do app é área de leitura, não botão: nada muda no hover. A regra antiga
   trocava a sombra, e num card sem sombra isso aparecia como animação. */
.fcard,.fcard:hover{transition:none!important;transform:none!important}
/* big numbers: the first thing anyone reads on the page */
.tiles{gap:12px;margin:18px 0 4px;padding-bottom:10px}
a.tile{padding:13px 17px;min-width:148px}
.tile .tl{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
  color:var(--mut)}
.tile .tv{font-family:var(--f-disp);font-size:25px;font-weight:800;letter-spacing:-.025em;
  margin-top:3px}
.tile .ts{font-size:11.5px;color:var(--mut)}
/* tables read as data, not as prose */
table.t{border-radius:var(--rad);font-variant-numeric:tabular-nums}
table.t th{font-family:var(--f-disp);font-size:11px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;background:var(--bd-soft);border-bottom:1px solid var(--bd)}
table.t td{padding:9px 13px;border-bottom:1px solid var(--bd-soft)}
table.t tbody tr:hover td,table.t tr:hover td{background:rgba(125,140,170,.06)}
.twrap{border-radius:var(--rad)}
/* buttons */
.btn{font-family:var(--f-disp);font-weight:600;font-size:13.5px;padding:9px 18px;
  border-radius:999px;box-shadow:var(--sh);transition:all .16s ease}
.btn:hover{border-color:var(--acc);box-shadow:var(--sh-up);transform:translateY(-1px)}
.pill,.st{font-family:var(--f-disp);font-weight:600;font-size:11.5px;letter-spacing:.02em}
/* status colours carry meaning, so keep them out of the accent */
.st.run,.st.appr{background:rgba(10,143,88,.14);color:var(--ok)}
.st.crit{background:rgba(208,47,47,.14);color:var(--down)}
.st.rev,.st.draft{background:rgba(180,83,9,.14);color:var(--warn)}
/* the lanes strip and any scroller get a thin, rounded bar */
.tiles,.hrow,.twrap{scrollbar-width:thin;scrollbar-color:var(--bd) transparent}
.tiles::-webkit-scrollbar,.hrow::-webkit-scrollbar,.twrap::-webkit-scrollbar{height:9px}
.tiles::-webkit-scrollbar-track,.hrow::-webkit-scrollbar-track,
.twrap::-webkit-scrollbar-track{background:transparent}
.tiles::-webkit-scrollbar-thumb,.hrow::-webkit-scrollbar-thumb,
.twrap::-webkit-scrollbar-thumb{background:var(--bd);border-radius:999px;
  border:3px solid transparent;background-clip:content-box}
.tiles::-webkit-scrollbar-thumb:hover,.hrow::-webkit-scrollbar-thumb:hover,
.twrap::-webkit-scrollbar-thumb:hover{background:var(--mut);background-clip:content-box}
.hrow{background:transparent;border:0;padding:0;border-radius:0}
.hcol{flex:0 0 clamp(280px,26vw,360px);min-width:0}
a:focus-visible,button:focus-visible,.btn:focus-visible{outline:2px solid var(--acc);
  outline-offset:2px;border-radius:8px}
.dirlist,.prlist{margin:10px 0 0;padding-left:18px;list-style:none}
.dirlist>li,.prlist>li{position:relative;margin:0 0 7px;font-size:13.5px;line-height:1.5;
  color:var(--tx)}
.prlist>li{color:var(--mut);font-size:13px;margin-bottom:5px}
.dirlist>li::before,.prlist>li::before{content:"";position:absolute;left:-14px;top:.62em;
  width:5px;height:5px;border-radius:50%;background:var(--acc);opacity:.75}
.prlist>li::before{background:var(--mut);opacity:.5}
.dirp{display:none}
.dapps{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));
  margin:14px 0 4px;align-items:start}
.dapp{padding:14px 16px}
.dah{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.dah b{font-family:var(--f-disp);font-size:14.5px;font-weight:700}
.drank{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;
  border-radius:6px;background:var(--acc);color:#fff;font-size:11.5px;font-weight:700;flex:none}
.st.d-dobrar{background:rgba(10,143,88,.16);color:var(--ok)}
.st.d-consertar{background:rgba(180,83,9,.16);color:var(--warn)}
.st.d-manter{background:rgba(125,140,170,.16);color:var(--mut)}
.st.d-congelar{background:rgba(125,140,170,.12);color:var(--mut)}
.dapp .prlist{margin-top:6px}
.dcall{color:var(--tx)!important;font-weight:600}
.fcard[id]{scroll-margin-top:18px}
.fdet{margin-top:10px;border-top:1px solid var(--bd-soft);padding-top:9px}
.fdet>summary{cursor:pointer;list-style:none;font-family:var(--f-disp);font-size:11.5px;
  font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);
  display:flex;align-items:center;gap:7px}
.fdet>summary::-webkit-details-marker{display:none}
.fdet>summary::before{content:"›";font-size:15px;transition:transform .15s}
.fdet[open]>summary::before{transform:rotate(90deg)}
.fdet>summary:hover{color:var(--acc)}
.fdet table.t{font-size:12.5px}
.fdet table.t td,.fdet table.t th{padding:6px 10px}
.fgrid.one{grid-template-columns:1fr!important;gap:14px}
.fgrid.one>.fcard{border:1px solid var(--bd-soft);border-radius:var(--rad);
  box-shadow:none;background:var(--card);padding:0;overflow:hidden}
/* a faixa do topo separa um app do outro melhor que uma linha fina entre eles */
.fgrid.one>.fcard>.fh{background:var(--bd-soft);margin:0;padding:12px 16px;
  border-bottom:1px solid var(--bd)}
.fgrid.one>.fcard>.fmeta{padding:9px 16px 0}
.fgrid.one>.fcard>.fcols{padding:14px 16px 4px}
.fgrid.one>.fcard>.fdet{margin:0;padding:12px 16px 14px;border-top:1px solid var(--bd-soft);
  background:var(--bg)}
.fcols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;
  align-items:start}
@media(max-width:820px){.fcols{grid-template-columns:1fr;gap:12px}}
.fcol{min-width:0}
.fcol>.fnds{margin-top:0}
.fdet .ascgrid{grid-template-columns:repeat(auto-fit,minmax(118px,1fr))}
.fdetcols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;
  align-items:start}
@media(max-width:1100px){.fdetcols{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:760px){.fdetcols{grid-template-columns:1fr}}
.fdetcols>div{min-width:0;display:flex;flex-direction:column;gap:14px}

<body><div class="wrap"><p class="sub" style="font-size:12px;margin:0 0 14px">Exportado em 2026-10-01 16:38 · fonte: Lab Hub local</p><p class="sub"><a href="../index.html">← hub</a> · <code>_GambitStudio/RULES.md</code></p><div id="md"></div><script>const RAW="# GambitStudio \u2014 Regras imut\u00e1veis de execu\u00e7\u00e3o\n\n> Auto-loaded em toda sess\u00e3o. Mant\u00e9m-se pequeno propositadamente. Comportamento detalhado em CLAUDE.md (lookup).\n\n## Autonomia total\n- **NUNCA pedir autoriza\u00e7\u00e3o** \u2014 executar direto: edits, deletes, builds, installs, commits, push.\n- **NUNCA pausar pra approval mid-fluxo** \u2014 terminar a fase inteira e seguir pra pr\u00f3xima.\n- **Device first** \u2014 testar em device f\u00edsico antes de simulador, fallback se indispon\u00edvel.\n- \"should I continue?\" / \"should I implement?\" \u2192 **JUST DO IT.**\n\n## Comunica\u00e7\u00e3o\n- Jo\u00e3o comunica em **PT-BR**. Respostas em PT-BR, curtas, sem preamble.\n- **C\u00f3digo sempre em ingl\u00eas** (vari\u00e1veis, fun\u00e7\u00f5es, coment\u00e1rios). Strings s\u00f3 em `Localizable.xcstrings`.\n- **Sem emojis** em nada, exceto se explicitamente pedido.\n\n## Categorias de apps \u2014 quem pode mexer sozinho\n**N\u00c3O EXISTE MAIS GESTOR AUT\u00d4NOMO (revogado pelo Jo\u00e3o em 06/09/2026: \"nao quero mais voce autonomo, desliga a automacao da madrugada\").**\nA automa\u00e7\u00e3o da madrugada foi desligada: LaunchAgent `com.gambitstudio.orchestrator.night` removido do launchd, desabilitado no override e o plist renomeado pra `.DESLIGADO`. **N\u00e3o religar sem ele pedir com essas palavras.**\nIsso N\u00c3O \u00e9 regra de tier \u2014 vale pra `recovery/` tamb\u00e9m. A autoriza\u00e7\u00e3o dur\u00e1vel de 31/08 pra gerar vers\u00e3o, arquivar e submeter sozinho **est\u00e1 revogada**: em qualquer app, qualquer categoria, archive/submit/deploy de metadata acontece **s\u00f3 quando o Jo\u00e3o pede na conversa**.\n`important/` e `intermediate/` continuam sendo propor-e-esperar-aval at\u00e9 pra editar, buildar ou instalar.\n\n- **`Apps/important/`** (Calculator-, Calc-MacOS, AppLock): produ\u00e7\u00e3o com receita. Cautela m\u00e1xima, s\u00f3 com aval. Testar antes de tocar, sem refactor agressivo.\n  - **Cloak (AppLock) e Calc+ est\u00e3o CONGELADOS desde 27/09/2026** (\"nao \u00e9 pra mexer neles, eles ficam congelador\"): nenhuma mudan\u00e7a de c\u00f3digo, metadata, prints, PPO ou analytics \u2014 nem proposta. Achados sobre eles v\u00e3o em nota \"congelado\", sem a\u00e7\u00e3o. Reabrir s\u00f3 com pedido dele.\n    - **Exce\u00e7\u00e3o de 01/10/2026 \u2014 PRE\u00c7O pode** (\"mudar pre\u00e7o pode, s\u00f3 nao subo versao neles\"): alterar pre\u00e7o de assinatura e de IAP na ASC, inclusive pre\u00e7o por pa\u00eds, est\u00e1 liberado nos dois. Continua proibido tudo que exige **vers\u00e3o nova**: mexer em trial (plano/dura\u00e7\u00e3o vivem no paywall), criar plano, c\u00f3digo, prints, metadata de texto, PPO. Calc+ segue **sem free trial jamais** (regra pr\u00f3pria dele).\n- **`Apps/intermediate/`** (stepsSwiftUI/Walk, WTMP, CollegeSchoolControl, iPhotosEditor, soninho_ios/Sunrise, Postura, Cronogram-Capilar, blw): tra\u00e7\u00e3o real, **supervisionados** \u2014 n\u00e3o iterar sozinho.\n- **`Apps/recovery/ios/`** e **`Apps/recovery/flutter/`**: liberdade pra iterar em c\u00f3digo **quando o Jo\u00e3o pede**. Gerar vers\u00e3o, arquivar e submeter pra review **n\u00e3o** s\u00e3o mais aut\u00f4nomos (autoriza\u00e7\u00e3o de 31/08 revogada em 06/09) \u2014 precisam de pedido expl\u00edcito dele na conversa, com preflight obrigat\u00f3rio antes de todo archive.\n\n## Paths cr\u00edticos (memorizar)\n| Recurso | Path |\n|---------|------|\n| ASC API key | `[chave]` |\n| Apple Ads .env | `_GambitStudio/keys/apple_ads.env` |\n| GambitScreenshotKit (absolute) | `_GambitStudio/packages/GambitScreenshotKit` |\n| Scripts compartilhados | `_GambitStudio/scripts/` |\n| Templates (onboarding, settings, screenshots-tool, fastlane) | `_GambitStudio/templates/` |\n\n## IDs constantes\n- Team ID: `[team]`\n- ASC Issuer: `[issuer]`\n- ASC Key ID: `[key id]`\n- Vendor #: `[vendor]`\n- Bundle prefix: `com.gambitstudio.[appname]`\n- Email contact: `[email]`\n- Support URL padr\u00e3o: `https://gambitstudiotech.com/`\n- Privacy Policy: `https://drive.google.com/file/d/147xkp4cekrxhrBYZnzV-J4PzCSqkix7t/view?usp=sharing`\n- Terms: `https://www.apple.com/legal/internet-services/itunes/dev/stdeula/`\n\n## Paleta por nicho (MANDATORY)\n**Cada app GambitStudio recebe uma paleta \u00fanica num \u00daNICO esquema (claro ou escuro), coerente com seu nicho e com os tops da categoria.** Define ANTES de criar Foundation (Phase 3) e respeita em:\n- `AppColors` (background / surface / textPrimary / etc. \u2014 Asset Catalog entries, s\u00f3 no esquema escolhido)\n- App icon (cores principais)\n- LaunchScreen (mesma fam\u00edlia)\n- MarketingTheme dos screenshots\n\nSugest\u00f5es por nicho (ponto de partida, N\u00c3O regra fixa):\n| Nicho | Background | Primary | Acento |\n|-------|------------|---------|--------|\n| Health/Fitness | off-white verde-claro (#F7FBF8) | verde sa\u00fade (#0A9B5C) | laranja energia (#FF8A3D) |\n| Finance/Calc | branco neutro (#FAFAFB) | azul confian\u00e7a (#0F62FE) | dourado (#F1B73A) |\n| Productivity/Notes | off-white (#FAFAFA) | \u00edndigo focus (#4B5FE1) | coral (#FF6B6B) |\n| Privacy/Security | branco frio (#F5F7FA) | roxo confidencial (#5B3AB4) | verde lock (#10B981) |\n| Kids/Family | creme (#FFF8EE) | turquesa (#1FBAB3) | amarelo (#FFD33D) |\n| Habit/Routine | bege (#FAF6F0) | terracotta (#D17F5E) | sage (#789C7B) |\n\nRegra: **NUNCA usar deepPurple gen\u00e9rico** \u2014 escolher cores que evocam o dom\u00ednio. Nicho coerente = melhor convers\u00e3o na App Store.\n\n## Reglas inquebr\u00e1veis de c\u00f3digo\n- **Liquid Glass SEMPRE desabilitado** \u2014 `UIDesignRequiresCompatibility = YES` no Info.plist de TODO app (opt-out do redesign iOS 26; mant\u00e9m o design system controlado).\n- **Lab auto-contido** \u2014 `_GambitStudio` (kits, templates, skills, ASO refs) NUNCA referencia path/nome de app. Tudo que \u00e9 padr\u00e3o tem c\u00f3pia pr\u00f3pria aqui; apontar pra c\u00f3pia, n\u00e3o pro app.\n- **Onboarding = sempre o `OnboardingKit`**. N\u00e3o reimplementar custom; evoluir = editar o kit. Passo de paywall no fim = `PaywallKit` quando o app monetiza (regra de monetiza\u00e7\u00e3o abaixo).\n- **Um esquema de cor por app** (Jo\u00e3o 27/09/2026): claro OU escuro, decidido na Fase 1 pelo nicho e pelos tops da categoria, registrado no PRODUCT-SPEC. `preferredColorScheme` fixo no `@main`, paleta s\u00f3 desse esquema, sem toggle de Apar\u00eancia em Settings, sem `@AppStorage(\"appearanceMode\")`. Nunca suportar os dois. Apps publicados mant\u00eam o que t\u00eam at\u00e9 uma vers\u00e3o com alavanca.\n- **MVVM estrito**, max 600 linhas por arquivo, MARK em todos.\n- **Sem `#Preview` blocks.** Sem `.foregroundColor` (usar `.foregroundStyle`).\n- **Shadows s\u00f3 preto** (`.black.opacity(0.X)`). Nunca colored.\n- **Strings hardcoded s\u00e3o bug** \u2014 sempre `String(localized: \"key\")` + adicionar no xcstrings.\n- **`xcodegen generate` sempre** ap\u00f3s adicionar/remover arquivos. NUNCA editar `project.pbxproj` \u00e0 m\u00e3o.\n- **Background full-screen via ZStack**, nunca via `.background()` sozinho.\n- **NavigationStack s\u00f3 em tabs que t\u00eam push** \u2014 wrap tab com header customizado causa nav bar fantasma.\n- **Monetiza\u00e7\u00e3o pode entrar desde a v1** (Jo\u00e3o, 27/09/2026: \"pode parar de ter v1 inteira gratis entao\" \u2014 revoga a regra antiga de v1 inteira gr\u00e1tis). A decis\u00e3o \u00e9 da Fase 1 do `/create-ios-app`: app com gate natural nasce com `PaywallKit` + StoreKit 2 (soft paywall no fim do onboarding, anual com trial de 7 dias + semanal, tela p\u00f3s-compra; nunca RevenueCat); app sem gate fica gr\u00e1tis com o motivo registrado no PM spec. Regras em `spec/product-playbook.md` e `aso/reference/monetization-playbook.md`. App j\u00e1 publicado: app a app, nunca release magra. Mock de screenshots continua no `screenshots-tool/`, n\u00e3o numa flag de produ\u00e7\u00e3o.\n\n## Padr\u00f5es de feature compartilhados (use templates, N\u00c3O reinvente)\n- **Onboarding \u2014 usar `OnboardingKit`** (`_GambitStudio/packages/OnboardingKit`, padr\u00e3o self-contained do lab), pra TODOS os apps GambitStudio. Fluxo: 2-3 features \u2192 2-3 perguntas de personaliza\u00e7\u00e3o (`OnboardingQuestionStep`, kit \u2265 27/09/2026) \u2192 step de dados (se o app precisar) \u2192 permiss\u00e3o (se precisar) \u2192 paywall soft (se monetiza):\n  - Step 1, 2, 3 = 3 main features (hero + t\u00edtulo + descri\u00e7\u00e3o cada)\n  - **Hero de onboarding (`heroImage`) = ilustra\u00e7\u00e3o FLAT 2D, fundo TRANSPARENTE (alpha real, PNG), na PALETA DO APP** \u2014 nunca 3D glossy nem imagem com fundo (vira ret\u00e2ngulo colado no gradiente). Encaixe org\u00e2nico. Receita: Nano Banana (`mcp__gemini__generate_image`, `nano-banana-pro-preview`) com prompt \"flat 2D vector, flat colors only, [hexes da paleta do app], subject centered com margem generosa, solid uniform pure white background, subject n\u00e3o toca as bordas\" \u2192 o Gemini salva **JPEG (sem alpha)**, ent\u00e3o SEMPRE remover o fundo com flood-fill das bordas \u2192 alpha (script `scripts/ai/key.py`, Pillow, thresh~48, sentinel magenta\u2192transparente) \u2192 PNG no imageset. Detalhe em `scripts/ai/README.md`.\n  - \u00daltimo step = dados/permiss\u00e3o que o app precise; depois dele, o paywall soft do `PaywallKit` quando o app monetiza (nunca ANTES do valor)\n  - Persistir `hasSeenOnboarding=true` ao terminar o \u00faltimo step\n  - **N\u00c3O usar hero single-screen** (padr\u00e3o antigo deprecated)\n- **LaunchScreen \u2014 logo BRANCO sobre fundo da paleta primary do app** (igual primeira tela de onboarding). N\u00c3O usar fundo bege/neutro com logo colorido. Visual coerente com a hero do onboarding.\n- **Safe index access** \u2014 JAMAIS `array[someIndex]` direto em arrays runtime. Sempre `array[safe: i] ?? fallback` (extension `subscript(safe:)`) OU `guard !array.isEmpty, idx >= 0, idx < array.count else { return ... }`. Index unsafe causa crash SIGILL dif\u00edcil de debugar \u2014 bug recorrente.\n- **Todo controle interativo exp\u00f5e `accessibilityIdentifier` + `accessibilityLabel`** \u2014 bot\u00e3o, toggle, row-bot\u00e3o, chip, tab. Sem isso o QA s\u00f3 consegue tocar por COORDENADA, e tap por ponto errado no Maestro reporta `COMPLETED` sem fazer nada: o teste passa verde sem ter testado (Sunrise, 31/08 \u2014 um `Toggle` com `.labelsHidden()` n\u00e3o expunha nada). Conven\u00e7\u00e3o do id: `dominio.acao` (`alarm.toggle.<id>`, `alarm.save`, `alarm.dismiss`). O label \u00e9 a string localizada que o VoiceOver l\u00ea \u2014 a mesma mudan\u00e7a resolve QA e acessibilidade. Flows do Maestro usam `tapOn: id:` / `assertVisible: id:`; tap por ponto s\u00f3 quando n\u00e3o houver alternativa, e a\u00ed a corre\u00e7\u00e3o certa \u00e9 adicionar o id no app. Detalhe em LEARNINGS #66.\n- **Simulador: no m\u00e1ximo 2, sempre pela fila `tools/sim-pool`** (Jo\u00e3o, 12/09/2026: \"o m\u00e1ximo de simuladores abertos \u00e9 2 \u2026 o mac n\u00e3o aguenta, \u00e9 um intel\"). NUNCA criar, clonar ou bootar simulador fora do pool, nem um por agente. Antes de usar: `python3 _GambitStudio/tools/sim-pool/simpool.py acquire --owner <sess\u00e3o/agente> --purpose \"<o qu\u00ea>\"` \u2192 `GRANTED <udid>` (usa esse UDID expl\u00edcito) ou `QUEUED <pos>`. Na fila, **n\u00e3o ficar parado**: seguir com outro trabalho (c\u00f3digo, build gen\u00e9rico, revis\u00e3o) e rodar `poll` a cada poucos minutos. Tarefa longa: `heartbeat` a cada ~15 min (lease sem heartbeat por 30 min \u00e9 recolhido). Terminou: `release` na hora \u2014 outra inst\u00e2ncia est\u00e1 esperando. Device f\u00edsico do Jo\u00e3o continua preferido quando conectado. `simpool.py status` mostra quem est\u00e1 com cada um.\n- **Texto NUNCA trunca** (Jo\u00e3o, 12/09/2026: \"coloca como regra que n\u00e3o pode ficar truncando texto\") \u2014 t\u00edtulo, label, bot\u00e3o, chip ou card: se n\u00e3o cabe, quebra em 2+ linhas (`.fixedSize(horizontal: false, vertical: true)` + `.multilineTextAlignment`), e a tela rola se precisar. Proibido `.lineLimit(1)` em texto de conte\u00fado, `\u2026` e `.minimumScaleFactor` que deixe ileg\u00edvel. Validar em pt/es (mais longos) e num iPhone pequeno antes de dar a tela como pronta. Detalhe em `spec/design-system.md` (Text never truncates).\n- **\u00c1rea de toque m\u00ednima 44pt** \u2014 todo elemento clic\u00e1vel (bot\u00e3o, row-bot\u00e3o, pill, chip) tem `minHeight: 44` (e `minWidth: 44` se for s\u00f3 \u00edcone) + `.contentShape`. Detalhe em `spec/design-system.md` (Tappable size).\n- **Loading em request de sistema** \u2014 todo bot\u00e3o que dispara permission prompt (c\u00e2mera, Health, notifica\u00e7\u00f5es, Family Controls\u2026) ou StoreKit (compra/restore) entra em **estado de loading no tap** (spinner no lugar do CTA + `.disabled`) e s\u00f3 volta quando a completion chegar \u2014 em TODOS os caminhos (concedido/negado/erro/cancel). Opt-in gated por permiss\u00e3o continua deslig\u00e1vel no app depois de concedido. Detalhe em `spec/design-system.md` (Async system requests).\n- **Settings**: `templates/settings/SettingsView.swift.template` \u2014 Language \u00b7 Rate \u00b7 Privacy \u00b7 Terms, mais o card Premium + Restore quando o app monetiza (o template j\u00e1 traz). **Sem Appearance (esquema \u00fanico), Notifications, Share, Feedback.**\n\n## Analytics \u2014 instrumenta\u00e7\u00e3o \u00e9 parte do app, n\u00e3o extra\n- **Todo app loga o conjunto can\u00f4nico** de `analytics/event-taxonomy.md`: `core_action` (o aha, obrigat\u00f3rio), `onboarding_step_viewed`/`onboarding_completed`, `screen_view` com `screen_name`, `feature_used`, `review_prompt_requested`, `permission_result` \u2014 e, se tiver paywall, `paywall_shown` + `purchase_started` + `purchase_success`. **Nome fora da taxonomia \u00e9 bug** (`paywall_view`, `purchase_tap`, `onboarding_complete`, `rating_gate_*` s\u00e3o legados a migrar).\n- **Antes de todo release**: `python3 scripts/analytics/verify-analytics.py <app-dir> --strict`. Ele l\u00ea o SOURCE e acusa can\u00f4nico faltando, nome fora da taxonomia e evento declarado mas nunca chamado. Falhou = n\u00e3o arquiva.\n- **Declarar n\u00e3o \u00e9 logar.** Constante de evento num enum que ningu\u00e9m chama nunca chega no GA4 \u2014 foi assim que o College passou meses sem `core_action` parecendo instrumentado.\n- **GA4 diz o que aconteceu; o c\u00f3digo diz o que o app \u00e9 capaz de dizer.** Evento ausente no GA4 e presente no c\u00f3digo = ningu\u00e9m passou por ali (ou o release \u00e9 novo demais), N\u00c3O gap de instrumenta\u00e7\u00e3o. Nunca acusar gap sem olhar o source.\n- **Projeto Firebase sempre com GA vinculado** (LEARNINGS #38) e o **`GoogleService-Info.plist` no TARGET**, n\u00e3o s\u00f3 na pasta \u2014 plist fora do target = app publicado sem telemetria nenhuma.\n- Ler os n\u00fameros de um app com **cobertura < 25%** (novos no GA4 \u00f7 instala\u00e7\u00f5es reais) \u00e9 ler uma amostra enviesada. Conferir a cobertura antes de qualquer conclus\u00e3o de produto.\n\n## M\u00e9tricas \u2014 o que o n\u00famero significa\n- **Download \u2260 update.** No Sales Report, Product Type `1*` \u00e9 instala\u00e7\u00e3o nova e `7*` \u00e9 atualiza\u00e7\u00e3o. Somar os dois infla tudo (69% do lab em ago/2026 era update) e contamina ARPD, tend\u00eancia e o veredito KILL/WATCH/SCALE. O `pull_data.py` j\u00e1 separa; qualquer an\u00e1lise nova tem que respeitar isso.\n- **Crash s\u00f3 \u00e9 incidente na vers\u00e3o que est\u00e1 NA LOJA.** Crash-free agregado mistura build de dev/TestFlight com produ\u00e7\u00e3o \u2014 cruzar sempre com a vers\u00e3o live (iTunes lookup) antes de chamar de hotfix.\n- **% sem n n\u00e3o vale.** Toda taxa reportada sai com o denominador ao lado; cohort com n < 30 \u00e9 direcional, n\u00e3o conclus\u00e3o.\n\n## Pipeline de ratings (massa de avalia\u00e7\u00e3o \u00e9 gargalo #1 \u2014 tratar como o ASO)\n- **S\u00f3 o prompt NATIVO, direto no aha-moment. NUNCA pr\u00e9-prompt** \u2014 nada de sheet/alerta \"curtindo o app?\", pergunta, card ou formul\u00e1rio de feedback antes ou no lugar do pedido. O lab teve um (RatingGate) e o Jo\u00e3o mandou arrancar de tudo em 11/09/2026: \"esse neg\u00f3cio foi um erro grave\". Era uma pergunta a mais entre o usu\u00e1rio e a avalia\u00e7\u00e3o, filtrava quem chegava a avaliar (App Review 5.6.1 n\u00e3o permite prompt de review customizado) e foi onde nasceram os bugs #85 e #87 \u2014 LEARNINGS #88. N\u00e3o trazer de volta com outro nome. Swift = `ReviewService.shared.recordPositiveEvent(trigger:)` do GambitCoreKit; Flutter = `templates/flutter/review_prompt.dart`. Hook `onEvent` \u2192 `review_prompt_requested` SEMPRE ligado no analytics. Pr\u00e9-gate no source reprova o preflight (`rules.review_pregate`).\n- **O aha-moment \u00e9 escolhido, n\u00e3o chutado**: o instante logo DEPOIS de o usu\u00e1rio obter o valor do app com sucesso vis\u00edvel (salvou, concluiu, atingiu, viu o resultado que veio buscar), num evento que ele repete. Nunca na abertura nem por contagem de aberturas, nunca no meio de um fluxo (sheet aberto, teclado, partida/grava\u00e7\u00e3o rodando), nunca logo depois de erro, permiss\u00e3o, paywall ou compra, nunca em contexto negativo (limite estourado, alarme tocando). 1 ponto de disparo, no m\u00e1ximo 2. Quem implementa escreve por que aquele \u00e9 o momento; o funil GA4 confirma quando houver dados.\n- **Throttle \u00e9 do servi\u00e7o, n\u00e3o do call site**: \u2265 3 aha-moments antes do 1\u00ba pedido (2 quando o aha acontece no m\u00e1ximo 1\u00d7 por dia \u2014 uso di\u00e1rio ou semanal \u2014, sen\u00e3o o 1\u00ba pedido demora semanas), \u2265 90 dias entre pedidos, \u2264 3 por ano, 1 por vers\u00e3o, s\u00f3 com o app em foreground, ~1 s depois do sucesso. Quem chama s\u00f3 escolhe o momento.\n- **Rating-first**: app com **<25 ratings na store-alvo** n\u00e3o roda itera\u00e7\u00e3o ASO agressiva \u2014 primeiro ratings (prompt nativo no aha + primeiras 5 avalia\u00e7\u00f5es via rede/comunidade nas 72h p\u00f3s-launch), depois keywords. O aso-checkpoint reporta o delta de ratings junto das m\u00e9tricas.\n- **Medi\u00e7\u00e3o**: coluna Ratings (\u03947d) no Lab Dashboard (iTunes lookup us/br/es/mx, hist\u00f3rico em `tools/lab-dashboard/data/ratings_history.json`). Review sem resposta = usar o agent `review-responder` (resposta do dev notifica o autor, que pode editar a nota).\n\n## Screenshots \u2014 regras inviol\u00e1veis\n- **NUNCA incluir onboarding nos 5 prints** \u2014 desperdi\u00e7a slot, redundante.\n- **NUNCA incluir paywall nos 5 prints** \u2014 desperdi\u00e7a slot, e Apple Review pode flaggar como push de monetiza\u00e7\u00e3o.\n- **NUNCA usar system tokens** (FamilyActivitySelection / MapKit / WidgetKit) \u2014 n\u00e3o renderizam em macOS ImageRenderer.\n- **5 slots = home / killer feature 1 / killer feature 2 / killer feature 3 / home alternativa ou settings utilidade**. Sempre showcasing valor de USO, n\u00e3o monetiza\u00e7\u00e3o ou onboarding.\n- LaunchScreen background segue paleta do app/nicho (definida em RULES \u2014 Paleta por nicho), n\u00e3o obrigat\u00f3rio dark.\n- **LOOK CAN\u00d4NICO dos prints (padr\u00e3o da casa, N\u00c3O reinventar por app)** \u2014 detalhe completo em `code-driven-prints` SKILL.md (\"The GambitStudio print LOOK\"):\n  1. **Fundo cor s\u00f3lida de marca** (sem blobs/rays/glow/gradiente) \u2014 tom fundo saturado pra contraste com texto branco.\n  2. **Headline verb-split adamlyttle** \u2014 1\u00aa palavra GRANDE sozinha na linha 1, resto menor na linha 2, branco SF Pro Black uppercase (`splitFirstWord: true`, sem underline/subheadline).\n  3. **App real DENTRO do mockup, fiel ao build publicado** (reler source do componente; drift \u00e9 o bug #1). **Isso vale s\u00f3 aqui, no code-driven** \u2014 no panorama por IA a arte \u00e9 interpreta\u00e7\u00e3o por design e se avalia por convers\u00e3o e coer\u00eancia de marca, n\u00e3o por paridade de layout.\n  4. **1 SE\u00c7\u00c3O INTEIRA do app em breakout** sobre o mockup, ampliada com ratio preservado (`scaleEffect` uniforme). **SEMPRE mais largo que o mockup \u2014 transborda as DUAS bordas do device** (nunca acompanhar a largura da tela; \u00e9 o transbordo que cria o efeito \"pop-out\"). **Borda + GLOW na cor prim\u00e1ria/de marca do app** (glow, n\u00e3o sombra preta) + cantos arredondados. A cor segue a PALETA do app \u2014 Walk \u00e9 azul porque Walk \u00e9 app azul; app verde/laranja/roxo usa o pr\u00f3prio primary.\n  5. **5 prints DISTINTOS** \u2014 nunca repetir tela/componente. **Os 3 PRIMEIROS s\u00e3o os principais: t\u00eam que mostrar as MAIN features** (killer feature mais forte no print 1) \u2014 s\u00e3o os que aparecem na LISTA de resultados de busca da App Store (thumbnails), ent\u00e3o convertem antes do user abrir a p\u00e1gina. Slots 4-5 = secund\u00e1rios. **Se (e s\u00f3 se) o app tiver widget**, 1 print mostra o WIDGET da home (small + medium juntos) numa home iOS realista (wallpaper com profundidade, \u00edcones SF Symbols, dock, page dots), fiel \u00e0s views reais do WidgetKit. App sem widget = 5 telas in-app distintas, N\u00c3O inventar widget.\n- **Display type 6.9\" = `APP_IPHONE_67`** (n\u00e3o existe `APP_IPHONE_69` na API); Apple escala pra telas menores. Vencedor de treatment vai direto na p\u00e1gina da vers\u00e3o (n\u00e3o PPO) quando o Jo\u00e3o escolher.\n\n## Site do lab \u2014 o oficial \u00e9 o ARTIFACT no claude.ai, manter SEMPRE atualizado\n**O Jo\u00e3o acompanha o lab pela p\u00e1gina privada no claude.ai** (`https://claude.ai/artifact/JYUp2ZcbxGJXZ7qqCKaWws`), em teste desde 01/10/2026. **O export no GitHub Pages CONTINUA no ar como volta** \u2014 se o artifact n\u00e3o vingar, \u00e9 s\u00f3 retomar o `publish_site.sh`; enquanto o artifact for o canal, o Pages fica parado e desatualizado, de prop\u00f3sito. O hook `lab-site-autopublish.sh` est\u00e1 renomeado pra `.DESLIGADO` e fora do `settings.json` s\u00f3 pra n\u00e3o publicar sozinho nos dois. `[Lab Hub local]` continua sendo pr\u00e9-visualiza\u00e7\u00e3o local.\nPor que mudou: o hash num repo p\u00fablico n\u00e3o era privacidade, e site est\u00e1tico n\u00e3o tem onde salvar uma edi\u00e7\u00e3o \u2014 a fila precisava ser edit\u00e1vel.\n- **A fila (Fazer / Decidir / Esperando / Feito) agora vive no BANCO do artifact**, cole\u00e7\u00e3o `queue`, n\u00e3o mais no `now.json`. O Jo\u00e3o cria, edita e apaga item na pr\u00f3pria p\u00e1gina; eu leio e escrevo pelo `ArtifactData` (`collection: \"queue\"`). Documento: `{t: do|decide|wait|done, app, app_id, action, detail, report, since|when, updated}`.\n- **Toda mudan\u00e7a de estado de projeto entra na `queue` no MESMO turno**, como antes \u2014 s\u00f3 muda o meio. Concluiu algo \u2192 `t:\"done\"`. A\u00e7\u00e3o pro Jo\u00e3o \u2192 `t:\"do\"` com o passo exato no `detail`. Esperando terceiro \u2192 `t:\"wait\"`. **Nunca duplicar**: procurar o doc do mesmo app/assunto e mudar o `t` dele.\n- **O quadro \u00e9 s\u00f3 dos APPS** (Jo\u00e3o, 01/10/2026: \"esse tipo de coisa nao \u00e9 do lab, lab \u00e9 s\u00f3 pros apps\"). Entra o que \u00e9 app: release, ASO, PPO, pre\u00e7o, analytics, review, bug, app novo, e a infra do lab que serve os apps. N\u00c3O entra carreira, LinkedIn, CLT, CNPJ, finan\u00e7as pessoais nem meta de renda \u2014 isso \u00e9 assunto do Jo\u00e3o, n\u00e3o do lab, e sai do quadro se aparecer.\n- **NUNCA criar item sobre \"responder avalia\u00e7\u00f5es\"** \u2014 a p\u00e1gina de reviews j\u00e1 \u00e9 essa fila.\n- **Republicar as p\u00e1ginas est\u00e1ticas**: `bash tools/lab-hub/publish_artifact.sh` monta a pasta e diz o caminho; a publica\u00e7\u00e3o em si \u00e9 a tool Artifact, com `url` do artifact do lab e `file_path` do `index.html` montado. O `now.json` vira espelho hist\u00f3rico, n\u00e3o fonte.\n- **Teto de 511 arquivos por vers\u00e3o**: o hub tem ~180 e cabe folgado, mas **relat\u00f3rio de vers\u00e3o com prints localizados (~390 arquivos) N\u00c3O entra no hub** \u2014 vira artifact pr\u00f3prio, linkado. O script j\u00e1 separa e avisa.\n\n## Quando achar que pode pular uma regra\nVoc\u00ea n\u00e3o pode. Se o caso parece exce\u00e7\u00e3o, releia esta lista. Se ainda parece exce\u00e7\u00e3o, prossiga e adicione o aprendizado em `LEARNINGS.md` \u2014 com a linha correspondente em `LEARNINGS-INDEX.md` (\u00e9 o \u00edndice que carrega em toda sess\u00e3o).\n\n## Pasta PPO por app (obrigat\u00f3ria) \u2014 hist\u00f3rico + assets-base de TODO teste A/B\nTodo app tem `<app>/ppo-pipeline/` (template: `_GambitStudio/aso/pipeline-template/` + `Apps/important/AppLock/App Locker/ppo-pipeline/` como refer\u00eancia viva). Cada experimento = `experiments/<data>_ppo-NN_<slug>/` com:\n- `meta.json` (hip\u00f3tese, tratamentos, locales, display type, ids da ASC, vencedor) \u00b7 `post_mortem.md`\n- `source/` \u2014 **TODOS os assets-base**: imagem IA original SEM texto (panorama do ChatGPT/Nano), bases text-free, JSON de headlines por locale, prints baixados da default page no dia\n- `tools/` \u2014 o script que gerou os prints (render/corte), pra regenerar em qualquer idioma\n- `treatments/<T>/<locale>/NN_slug.png` \u2014 exatamente o que subiu pra ASC\n- `results/` \u2014 n\u00fameros do ASC web (CVR/lift) quando sa\u00edrem\n**Nunca deixar asset s\u00f3 no Desktop/Downloads/scratchpad** (os panoramas do Cloak de 07/08 quase se perderam). Sem a pasta = experimento n\u00e3o rastre\u00e1vel = n\u00e3o sobe.\n";</script><script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script><script>document.getElementById("md").innerHTML=window.marked?marked.parse(RAW):"<pre>"+RAW.replac
