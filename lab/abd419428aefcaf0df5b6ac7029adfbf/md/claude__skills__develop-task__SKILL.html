<body><div class="wrap"><p class="sub" style="font-size:12px;margin:0 0 14px">Exportado em 2026-10-01 10:39 · fonte: Lab Hub local</p><p class="sub"><a href="../index.html">← hub</a> · <code>_GambitStudio/.claude/skills/develop-task/SKILL.md</code></p><div id="md"></div><script>const RAW="---\nname: develop-task\ndescription: Three-branch workflow for fixing a bug or task. Phase 1 \u2014 create a repro branch that deterministically reproduces the bug; pause for the user to confirm. Phase 2 \u2014 create the task branch with the clean fix, update the epic .md, open a PR. Phase 3 \u2014 create a post-fix repro branch (cherry-pick repro on top of fix) so the user can verify on the same conditions that the bug is gone. Triggered by `/develop-task <ta[redigido]>` or \"fazer tarefa X / desenvolver task X / vamos atacar a T-N.M\".\n---\n\n# Develop Task \u2014 Three-Branch Workflow\n\nThe user maintains a roadmap of bugs/tasks inside `docs/tech/epics/epic-*.md` files. Each task has an ID like `T-1.1`, a file/line target, a hypothesized fix, and an acceptance criterion. This skill codifies the way Jo\u00e3o wants to deliver each one safely on production apps with paying users.\n\n## Why three branches and not one\n\nTasks are touching apps with thousands of users \u2014 sometimes paying. The user wants **strong evidence** before merging anything to the epic branch:\n\n1. **Repro branch** proves the bug exists (and that we understand it).\n2. **Fix branch** contains the clean fix only \u2014 no debug code, mergeable.\n3. **Post-fix repro branch** proves the same conditions that triggered the crash no longer do \u2014 same trigger, same input, fix on top.\n\nIf you skip step 1, the fix is theoretical. If you skip step 3, you don't know the fix actually helped \u2014 you just know the app no longer crashes when you don't try to crash it.\n\n## When this skill runs\n\nTrigger when the user says any of:\n- `/develop-task <ta[redigido]>` (e.g. `/develop-task T-1.3`)\n- \"vamos atacar a T-N.M\" / \"vamos come\u00e7ar a T-N.M\"\n- \"desenvolve a tarefa X\"\n- \"fazer a pr\u00f3xima tarefa do epic-N\"\n\nLook up the task in `docs/tech/epics/epic-*.md`. The task entry has all you need: target files, lines, crash signature, hypothesized fix, acceptance test.\n\n## Phase 1 \u2014 Repro branch (then PAUSE)\n\nGoal: produce a branch where the user can hit a button (or shake the phone, or run a command) and **deterministically** trigger the bug the task is supposed to fix.\n\n### Steps\n\n1. **Resolve the epic branch** for this task. If the task is `T-1.1`, the epic branch is `epic-1-crashes` (read `docs/tech/epics/epic-1-*.md` filename). Never name a branch identical to a directory used by another branch \u2014 git refs are filesystem-backed, so `epic-1` as a branch conflicts with `epic-1/T-...` as a branch. Use distinct names like `epic-1-crashes` for the epic and `epic-1/T-1-1-thumbnail-main-thread` for the task.\n2. **Make sure the epic branch exists locally and is up to date** (`git fetch origin && git checkout epic-N-<name>`). If it doesn't exist yet, branch from `master` or whatever the project's default branch is.\n3. **Create the repro branch:**\n   ```bash\n   git checkout -b repro/<ta[redigido]>-<short-descriptor> <epic-branch>\n   ```\n   Example: `repro/T-1-1-thumbnail-crash` from `epic-1-crashes`.\n4. **Add minimal code that triggers the bug.** Three patterns to combine:\n   - **Trigger function** with `_debugRepro` prefix on the suspect code path (visibility convention \u2014 underscore = internal/debug-only). Mark it with `// MARK: - DEBUG REPRO (T-X.Y) \u2014 REMOVE BEFORE MERGING TO <epic>`.\n   - **UI invocation** the user can hit on a real device: shake gesture (`motionBegan`), a debug button hidden behind a feature flag, a long-press, etc. Whatever fits the app. On iOS, shake gesture via `motionBegan` is the cleanest because it works without modifying any production view hierarchy.\n   - **Amplify the failure conditions.** Real-world crashes are race conditions / pressure-based. Bump concurrency multipliers, inflate payload sizes, hammer in a tight loop. Example from T-1.1: bumped `maxConcurrentOperationCount` from 2 \u2192 10, fired 100 saves of a 4000\u00d74000 image in rapid succession.\n5. **Commit** with conventional format:\n   ```\n   debug(repro): add shake-to-trigger <bug-name> repro for T-X.Y\n   ```\n   Body: explain the trigger, the expected crash signature (matching production), and which files to revert before merging.\n6. **Push** the branch.\n7. **PAUSE.** Give the user concrete steps to test:\n   - Which branch to check out\n   - How to invoke the trigger (shake / button / cmd)\n   - The exact stack trace pattern to look for (top 3-5 frames from the production crash log)\n   - Where to confirm (Xcode Organizer \u2192 Crashes for iOS, Sentry/Crashlytics for backend, etc.)\n\n**Do NOT proceed to Phase 2 until the user explicitly confirms they reproduced the crash.** A wrong diagnosis at this stage means the fix in Phase 2 is fixing the wrong thing.\n\n### If repro fails\n\nIf the user reports they couldn't reproduce, **do not blindly amplify harder** \u2014 that often means the hypothesis is wrong. Re-read the production stack trace, check the code path more carefully, and propose a different repro before committing again. The user's signal of \"didn't crash\" is data, not a request to try again.\n\n## Phase 2 \u2014 Task branch + PR (after user confirms repro)\n\nGoal: a clean, mergeable branch with **only the fix**. No debug code, no repro hooks.\n\n### Steps\n\n1. **Create the task branch from the epic branch:**\n   ```bash\n   git checkout -b epic-N/T-X-Y-<descriptor> <epic-branch>\n   ```\n   Example: `epic-1/T-1-1-thumbnail-main-thread` from `epic-1-crashes`.\n\n   This is independent from the repro branch \u2014 the task branch must NOT inherit the debug code. Branch directly from the epic.\n\n2. **Apply the real fix.** Often this is simpler than the original plan in the .md \u2014 that's normal. The plan is a hypothesis; the fix is what works. If the actual fix differs from what the .md described, note that in the commit body and update the .md (see step 5).\n\n3. **Validate via build** if possible (on iOS, `xcodebuild` or open in Xcode and Cmd+B). Catch syntax issues before they become PR rounds.\n\n4. **Commit** with conventional format:\n   ```\n   fix(<scope>): <one-line subject>\n\n   <Why the bug happens \u2014 root cause, not symptom.>\n   <The stack trace pointing at the offending line/function.>\n   <What the fix changes and why it's correct.>\n   <Compatibility analysis: what versions / paths could regress.>\n\n   Co-Authored-By: Claude Opus 4.7 (1M context) <[email]>\n   ```\n\n5. **Update the epic .md** to mark the task as resolved:\n   - Change heading to `### T-X.Y \u2014 <subject> \u2705`\n   - Replace the planned checklist with `[x] Refator aplicado` + post-merge validation items\n   - Link the repro branch (where the user confirmed the bug)\n   - If the actual fix differed from the planned approach, add a \"**Fix real:**\" line explaining why the simpler/different path was correct\n   - Leave a placeholder for the PR URL (filled in step 7)\n\n6. **Push** both branches if not yet on remote:\n   ```bash\n   git push -u origin <epic-branch>          # only if not pushed yet\n   git push -u origin epic-N/T-X-Y-<desc>\n   ```\n\n7. **Open the PR via `gh pr create`:**\n   ```bash\n   gh pr create --base <epic-branch> --head epic-N/T-X-Y-<desc> \\\n     --title \"fix(T-X.Y): <subject>\" \\\n     --body \"$(cat <<'EOF'\n   ## Resumo\n   <one paragraph \u2014 what crashes / how, and what the fix does>\n\n   ## Stack trace original\n   ```\n   <top 5-10 frames>\n   ```\n\n   ## Fix\n   <what changed in 2-3 sentences, with file:line refs>\n\n   ## Compatibilidade\n   | iOS | Antes | Depois |\n   |---|---|---|\n   <version compat matrix>\n\n   ## Test plan\n   - [x] Repro confirmado (`repro/T-X-Y-<desc>` branch)\n   - [ ] Validar fix no device (`repro/T-X-Y-<desc>-fixed` branch \u2014 n\u00e3o crasha)\n   - [ ] Smoke test funcional na feature afetada\n   EOF\n   )\"\n   ```\n\n   **If `gh pr create` fails** with `Post \"https://api.github.com/graphql\": dial tcp ...: i/o timeout`, the user's network blocks api.github.com (this happens to Jo\u00e3o regularly on his current network \u2014 DNS resolves but TCP 443 to Azure IPs is filtered).\n\n   **Do not retry endlessly.** Instead:\n   - Give the user the compare URL: `https://github.com/<owner>/<repo>/compare/<epic>...epic-N/T-X-Y-<desc>?expand=1`\n   - Print the ready-to-paste title and body as fenced markdown blocks so the user can paste them into the GitHub web form.\n   - Ask the user to share the resulting PR number/URL so you can update the epic .md.\n\n8. **Update the epic .md** PR URL once the user provides it. Commit on the task branch:\n   ```\n   docs(epic-N): link T-X.Y PR\n   ```\n\n## Phase 3 \u2014 Post-fix repro branch\n\nGoal: prove the fix works under the *same* stress that broke production. Same trigger, same input, just the fix on top.\n\n### Steps\n\n1. **Create the verification branch from the task branch** (which has the fix):\n   ```bash\n   git checkout -b repro/T-X-Y-<desc>-fixed epic-N/T-X-Y-<desc>\n   ```\n\n2. **Cherry-pick the repro commit(s)** from the original repro branch:\n   ```bash\n   git cherry-pick <repro-commit-hash>\n   ```\n   Find the commit hash with `git log repro/T-X-Y-<desc>` \u2014 usually one or two commits (the repro code + any CI workflow added for testing).\n\n   Conflicts: rare if the fix only modifies internal logic of the function the repro calls. If a conflict happens, resolve in favor of keeping BOTH (the fix's new implementation + the repro's amplifications like `maxConcurrentOperationCount = 10`). The amplifications should not undo the fix.\n\n3. **Verify state.** Run a quick `grep` to confirm:\n   - The fix is present (e.g. the new function call replaced the old one)\n   - The amplifications are present (e.g. queue concurrency is 10, not 2)\n   - The trigger UI is wired (e.g. `motionBegan` handler exists)\n\n4. **Push** the branch.\n\n5. **Tell the user how to verify:**\n   - Switch Xcode (or build tool) to this branch\n   - Run on the device that previously crashed\n   - Invoke the exact same trigger from Phase 1\n   - Expected: no crash. Optional: log line in console showing the trigger fired (so the user knows it actually ran).\n\n6. **Wait for confirmation.** When the user reports success, this task is done. The epic .md should be updated to mark the post-merge validation items as complete.\n\n## Branch naming reference\n\n| Branch | Pattern | Lives where |\n|---|---|---|\n| Epic | `epic-N-<short-name>` (e.g. `epic-1-crashes`) | Long-lived; PRs merge into it |\n| Task | `epic-N/T-X-Y-<descriptor>` (e.g. `epic-1/T-1-1-thumbnail-main-thread`) | PR'd into the epic |\n| Repro (pre-fix) | `repro/T-X-Y-<short-descriptor>` (e.g. `repro/T-1-1-thumbnail-crash`) | Throwaway, never merged |\n| Repro (post-fix) | `repro/T-X-Y-<descriptor>-fixed` | Throwaway, never merged |\n\n**Critical:** never name a branch identical to a path segment used by another branch. `epic-1` (branch) collides with `epic-1/T-...` (branch) because git stores refs as files. Always add a `-<noun>` suffix to the epic branch.\n\n## Conventions\n\n- **Commit format:** conventional commits scoped by area. `fix(scope):` for bug fixes, `debug(repro):` for repro code, `docs(epic-N):` for .md updates, `ci:` for workflows.\n- **Co-author trailer:** always include `Co-Authored-By: Claude Opus 4.7 (1M context) <[email]>` on commits you author.\n- **Comment markers** on debug-only code: `// MARK: - DEBUG REPRO (T-X.Y) \u2014 REMOVE BEFORE MERGING TO <epic>`. Makes it trivial to grep for stale repro code if a branch accidentally gets included in a PR.\n- **One PR per task.** Do not bundle two tasks into one branch even if they touch adjacent code \u2014 the .md plan is the contract.\n\n## Hard-won lessons\n\n- **Repro on physical device, not simulator.** Most production crashes are GPU/Metal/IOKit/thread-pressure related \u2014 the simulator runs against a host-process Metal that doesn't reproduce these issues faithfully. The user's iPhone is the ground truth.\n- **Match the production stack trace top-to-bottom.** When confirming repro, compare at least the top 3 frames. A crash with a different top frame is a different bug, even if the type of failure looks similar.\n- **The plan in the .md is a hypothesis, not a contract.** When the real fix turns out to be simpler (or different) than what the .md described, that's a *good* outcome \u2014 document it. Future Claude reads these .md files and will trust them; outdated plans waste future iterations.\n- **gh CLI fails silently on network issues.** Jo\u00e3o's home/office network has consistent timeouts to `api.github.com` (4.228.0.0/16 Azure subnet). SSH push works (port 22), HTTPS push to github.com works (Fastly CDN), but `api.github.com` is filtered. Don't waste cycles retrying \u2014 fall back to compare URL + paste-ready PR body.\n- **Working tree pollution.** Jo\u00e3o often has uncommitted docs/refactoring carried across branches. Don't try to commit it as part of the task \u2014 stash/ignore it. The task PR must touch only the bug's files.\n- **Don't delete the pre-fix repro branch.** Keep it around \u2014 useful for regression checks if the same crash signature reappears in a future iOS / SDK update.\n- **Stress-test the fix at scale before merging, even tiny fixes.** T-1.3 was a one-line change (`isPrefetchingEnabled = false`) that passed build + smoke test, but a stress branch saving 600 photos through the real flow revealed a visible freeze on every gallery open \u2014 a regression worse than the bug being fixed (5 rare iOS-18.2 crashes vs. UX hit for every user on every iOS). Before opening Phase 2 PR, ship a stress branch that exercises the fix at 10\u00d7-100\u00d7 normal usage scale, using the real production flow (not mocks). If the freeze/regression shows up there, abandon the fix BEFORE the merge \u2014 document the empirical finding in the epic .md so future Claude doesn't re-litigate the same hypothesis.\n- **The .md plan can be wrong on diagnosis, not just on fix approach.** T-1.3's hypothesis (\"setupConstraints called multiple times\") was completely wrong \u2014 the actual cause was NSISEngine init failing during iOS 18.2's prefetch idle cycle. Always read the FULL stack trace before trusting the .md description; the .md is a starting hypothesis, the stack trace is ground truth.";</script><script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script><script>document.getElementById("md").innerHTML=window.marked?marked.parse(RAW):"<pre>"+RAW.replace(/</g,"&lt;")+"</pre>";</script></div><script>(function(){try{var k="lh.scroll:"+location.pathname;var v=sessionStorage.getItem(k);if(v!==null){sessionStorage.removeItem(k);window.scrollTo(0,parseInt(v,10)||0);}document.addEventListener("submit",function(e){var f=e.target;if(f&&f.method&&f.method.toLowerCase()==="post"){sessionStorage.setItem(k,String(window.scrollY));}},true);}catch(e){}})();</script></body></html>
