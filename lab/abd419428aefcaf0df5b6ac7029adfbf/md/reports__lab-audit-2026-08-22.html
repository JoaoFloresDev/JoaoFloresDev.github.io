<body><div class="wrap"><p class="sub" style="font-size:12px;margin:0 0 14px">Exportado em 2026-10-01 10:29 · fonte: Lab Hub local</p><p class="sub"><a href="../index.html">← hub</a> · <code>_GambitStudio/reports/lab-audit-2026-08-22.md</code></p><div id="md"></div><script>const RAW="# Auditoria do lab vs boas pr\u00e1ticas indie \u2014 2026-08-22\n\nVarredura web (RevenueCat SoSA 2026, Adapty 2026, ASO World/AppFollow/Phiture 2026, UXCam/Adjust/Pushwoosh retention, Apple/SwiftLee ratings, Applyra/AppLaunchFlow indie playbooks, GA4 Data API docs) cruzada com RULES/COMMANDS/spec/agents/skills do `_GambitStudio`. Veredito geral: **o lab est\u00e1 acima da m\u00e9dia indie em ASO de texto, prints, ratings e release; o buraco era medir o p\u00f3s-install** (ativa\u00e7\u00e3o/reten\u00e7\u00e3o/funil) \u2014 que em 2026 virou sinal de ranking da Apple. Corrigido nesta sess\u00e3o.\n\n## 1. O que j\u00e1 est\u00e1 certo (n\u00e3o mexer)\n| \u00c1rea | Pr\u00e1tica 2026 | Lab |\n|---|---|---|\n| Keyword strategy | long-tail, inten\u00e7\u00e3o > volume, sem duplicar name/subtitle/KW, 2\u00ba set no D7-14 | `aso-ranking-playbook` \u00a74, cadeia de 9 agentes, `keywords_round2` |\n| Prints | 3 primeiros convertem na SERP, benef\u00edcio em texto grande, 1\u00ba print = killer feature | RULES \"Screenshots\", `code-driven-prints` |\n| Ratings | prompt nativo s\u00f3 ap\u00f3s momento de valor, pr\u00e9-gate, responder reviews (70% dos autores revisam a nota ap\u00f3s resposta) | `RatingGate`, `review-responder`, regra rating-first (<25) |\n| Launch | seg-qua, 5 reviews em 72h, ASA discovery semana 1, n\u00e3o mexer name/subtitle no 1\u00ba m\u00eas | create-ios-app Fase 7 |\n| Release | CI (Xcode mais novo), PrivacyInfo, compliance | LEARNINGS #0/#22/#29 |\n| Portfolio | \"portfolio mode pra descobrir, focus mode pra escalar\" | `kill_or_scale.py`, dashboard |\n| Deploy verificado | deliver mente por omiss\u00e3o | `deploy-verifier` |\n\n## 2. Gaps encontrados \u2192 o que foi feito\n| # | Gap | Evid\u00eancia | A\u00e7\u00e3o (feita hoje) |\n|---|---|---|---|\n| 1 | **Analytics n\u00e3o era obrigat\u00f3rio** \u2014 `create-ios-app` e `mandatory-features.md` n\u00e3o citavam Firebase; eventos ad hoc e nomes divergentes entre apps (`paywall_view` vs `paywall_shown`, `onboarding_step` vs `_step_viewed`); nenhum app loga um evento de ATIVA\u00c7\u00c3O | invent\u00e1rio GA4 de 8 apps via dashboard | `analytics/event-taxonomy.md` (can\u00f4nico, com `core_action` = aha), \u00a79 em `mandatory-features`, passo em Fase 3/5 do create, `analytics-instrumentor` implementa |\n| 2 | **Reten\u00e7\u00e3o/ativa\u00e7\u00e3o nunca eram lidas** \u2014 s\u00f3 downloads/receita/ranking | Apple 2026: reten\u00e7\u00e3o + engajamento s\u00e3o sinais de busca (paper mar/2026); D1>35%/D7>15% \"healthy\"; crash >2% derruba visibilidade | `ga4_pull.py` (cohorts, funil, engagement, vers\u00f5es), skill `/firebase-insights` + `analytics-extractor/analyst`, `aso-checkpoint` agora l\u00ea D1/D7 + crash, `kill_or_scale.py --property` pondera reten\u00e7\u00e3o |\n| 3 | **Legendas dos prints sem keyword** \u2014 headline verb-split puro | Apple OCR-indexa texto dos prints desde jun/2025; \"keyword-aware captions\" sobem ranking | regra em `code-driven-prints` e `panorama-prompter`: cada print carrega 1 termo-alvo dos campos ASO |\n| 4 | **Custom Product Pages ignoradas** | CPP rankeia org\u00e2nico desde jul/2025 (keyword-linked, 70/app); s\u00f3 31% dos apps usam; CR 42\u219256% nos adotantes | `aso-serp-analyst` + `aso-reporter` prop\u00f5em CPP por cluster de inten\u00e7\u00e3o divergente da default page |\n| 5 | **Coer\u00eancia sem\u00e2ntica** \u2014 composer otimizava tokens, n\u00e3o frase | Apple usa relev\u00e2ncia LLM: listing \"keyword-stuffed\" perde pra listing semanticamente alinhado | regra em `aso-field-composer` |\n| 6 | **Sem playbook de monetiza\u00e7\u00e3o** pros apps que T\u00caM paywall (Cloak, BLW, AirDraw, iPhotos) | Adapty 2026: testes visuais/copy t\u00eam a MENOR taxa de vit\u00f3ria (34,6%); localiza\u00e7\u00e3o/estrutura de trial/dura\u00e7\u00e3o de plano ganham (58-62%); 90% dos trials no Day 0; trial PREJUDICA LTV em Productivity/Graphics; desconto s\u00f3 p\u00f3s-dismiss | `aso/reference/monetization-playbook.md` + \u00a74 do `analytics-analyst` |\n| 7 | **\"Feito recentemente\" ileg\u00edvel** no Lab Hub | pedido do Jo\u00e3o | clamp 3 linhas |\n\n## 3. Decis\u00f5es pro Jo\u00e3o (n\u00e3o mudei sozinho)\n1. **OnboardingKit: step de micro-compromisso** (escolha de objetivo / slider / mini-quiz antes do \u00faltimo step). Dado: micro-commitments antes do paywall/CTA sobem convers\u00e3o; multi-page 12,4% vs single 9,1%. Hoje o kit \u00e9 pager de 3 features. Vale virar op\u00e7\u00e3o do kit?\n2. **Trial do Cloak (7d anual) e BLW** \u2014 Adapty 2026: em Productivity/Lifestyle/Graphics, comprador direto tem LTV maior que trial; RevenueCat: trials 17-32d convertem 42% vs 25% os <4d. Dados conflitam \u2192 testar estrutura de trial (A/B), N\u00c3O copy. Quer rodar?\n3. **CPP piloto**: 1 Custom Product Page por app SCALE (Calc+, Cloak) ligada ao cluster de keyword n\u00ba 2. Cria\u00e7\u00e3o \u00e9 API-settable (`appCustomProductPages`); prints podem reaproveitar os do PPO perdedor.\n4. **Apps gr\u00e1tis na v1** continua sendo a regra (RULES). Nota: dados 2026 dizem que 44,5% das compras e 90% dos trials acontecem no Day 0 \u2014 se um dia um app for monetizar, o paywall no onboarding (soft, com \"continuar gr\u00e1tis\") \u00e9 o default a testar, n\u00e3o \"premium na v2\".\n\n## 4. Benchmarks adotados pelo lab (agora nos agentes)\n- iOS medianas: D1 25-27% \u00b7 D7 8-14% \u00b7 D30 4-8%. Forte: D1 30-40 / D7 10-15 / D30 5-8. Productivity D1 40-50 / D7 22-28 / D30 12-18; Health 35-45 / 15-22 / 8-12; ferramentas \"use-once\" estruturalmente mais baixas \u2014 julgar pelo job do app.\n- Antes de pagar aquisi\u00e7\u00e3o: D1 > 40%, D7 > 20%, D30 > 10%.\n- Ativa\u00e7\u00e3o (core_action na 1\u00aa sess\u00e3o) = m\u00e9trica mais preditiva de D30.\n- Loja: tap\u2192install iOS m\u00e9dia 33,4%, top quartil 42-56%. Crash-free \u2265 99,5%.\n- Subscription: install\u2192pago D35 mediana 1,9-2,6% (top 8,5%); paywall\u2192trial 5-15%; trial\u2192pago 18-50%; churn 1\u00aa renova\u00e7\u00e3o weekly 30-50%, monthly 15-40%; anual 35% churn no m\u00eas 1.\n- Amostra: n\u00b7p e n\u00b7(1-p) \u2265 10 pra confiar num percentual (Wilson); < 100 novos users = s\u00f3 instrumenta\u00e7\u00e3o \u00e9 acion\u00e1vel.\n\n## 5. Fontes\nRevenueCat [SoSA 2026](https://www.revenuecat.com/blog/growth/subscription-app-trends-benchmarks-2026) \u00b7 Adapty [paywall 2026](https://adapty.io/blog/high-performing-paywall-2026/) \u00b7 ASO World [ranking 2026](https://asoworld.com/insight/app-store-ranking-in-2026-why-retention-and-engagement-now-matter-more-than-keywords/) \u00b7 [AppFollow ASO news](https://appfollow.io/blog/aso-news) \u00b7 UXCam [retention benchmarks](https://uxcam.com/blog/mobile-app-retention-benchmarks/) \u00b7 [Adjust via getpanto](https://www.getpanto.ai/blog/mobile-app-retention-statistics) \u00b7 Applyra [ASO indie](https://www.applyra.io/blog/complete-aso-guide-indie-developers) \u00b7 [AppLaunchFlow](https://www.applaunchflow.com/blog/app-launch-strategy-2026) \u00b7 Superwall [multi-page](https://superwall.com/blog/new-postmulti-page-onboarding-paywalls-convert-37-better-than-single-page-heres-why) \u00b7 SwiftLee [SKStoreReviewController](https://www.avanderlee.com/swift/skstorereviewcontroller-app-ratings/) \u00b7 BrandBastion [replies](https://blog.brandbastion.com/impact-of-replying-to-app-reviews/) \u00b7 Amplitude [retention curve](https://amplitude.com/explore/analytics/retention-curve) \u00b7 Sequoia [Retention](https://articles.sequoiacap.com/retention) \u00b7 GA4 [Data API advanced](https://developers.google.com/analytics/devguides/reporting/data/v1/advanced) \u00b7 dev.to [GA4 mobile](https://dev.to/dainyjose/mastering-ga4-for-mob
