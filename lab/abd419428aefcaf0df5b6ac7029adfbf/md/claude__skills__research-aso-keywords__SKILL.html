<body><div class="wrap"><p class="sub" style="font-size:12px;margin:0 0 14px">Exportado em 2026-10-01 10:28 · fonte: Lab Hub local</p><p class="sub"><a href="../index.html">← hub</a> · <code>_GambitStudio/.claude/skills/research-aso-keywords/SKILL.md</code></p><div id="md"></div><script>const RAW="---\nname: research-aso-keywords\ndescription: Pesquisa profunda de keywords ASO pr\u00e9-launch via Astro MCP \u2014 descobre sweet spots (pop>5, diff<15), aplica lente de inten\u00e7\u00e3o de busca, e prop\u00f5e Name/Subtitle/Keywords field otimizados pros 3-5 mercados-alvo. Use quando o user diz \"pesquisa keywords pra app de X\", \"research ASO pro app de [nicho]\", \"valida keywords pra app novo\", ou ANTES de rodar `/create-ios-app` num nicho que ainda n\u00e3o foi pesquisado. N\u00c3O use pra apps j\u00e1 publicados \u2014 use `/start-aso-pipeline` em vez.\n---\n\n# Research ASO Keywords \u2014 pr\u00e9-launch\n\nPesquisa profunda de keywords pra apps **ainda n\u00e3o publicados** na App Store. Identifica sweet spots (pop+diff ideais), aplica lente de inten\u00e7\u00e3o de busca, prop\u00f5e Name/Subtitle/Keywords field otimizados pros mercados-alvo com foco em **TOP 4 em poucos termos** (n\u00e3o dispers\u00e3o em long-tails).\n\n## Quando usar\n\nUser digitou `/research-aso-keywords` ou disse algo como:\n- \"pesquisa keywords pra um app de [nicho]\"\n- \"research ASO pra app novo de [nicho]\"\n- \"valida keywords pra [esporte / categoria / tipo de app]\"\n- \"qual o tamanho do mercado pra app de [X]?\"\n- **ANTES** de rodar `/create-ios-app` num nicho novo (rodar essa pesquisa primeiro pra validar viabilidade)\n\n**N\u00c3O usar pra apps publicados** \u2014 use `/start-aso-pipeline` (essa skill pesquisa pr\u00e9-launch; aquela bootstrappa pipeline de itera\u00e7\u00e3o post-launch).\n\n## Pr\u00e9-requisitos\n\n- **Astro MCP rodando** (`mcp__astro__*` tools dispon\u00edveis \u2014 confirmar via list_apps)\n- **Nicho/categoria do app** definido pelo user\n- **Mercados-alvo** definidos (ou skill pergunta \u2014 default: US + BR + ES + IT pra apps internacionais; s\u00f3 BR pra Brasil-only)\n- **Conhecimento do app**: o que ele faz (tracker? scoreboard? calculator? coach?) \u2014 define a lente de inten\u00e7\u00e3o\n\n## Background \u2014 princ\u00edpios ASO 2026 (incorporados nessa skill)\n\n> **Fonte da verdade compartilhada**: `_GambitStudio/aso/reference/aso-ranking-playbook.md` \u2014 ler antes de propor metadata. Este Background \u00e9 o resumo; o playbook tem o detalhe (checklist de launch, rota\u00e7\u00e3o de segundo set, r\u00e9gua de expectativa, fontes) e \u00e9 atualizado a cada varredura web.\n\n### Apple algoritmo = two-engine system\n1. **Engine 1 \u2014 Metadata Relevance** (te coloca em considera\u00e7\u00e3o \u2014 onde keywords matter)\n2. **Engine 2 \u2014 Behavioral Quality** (decide se voc\u00ea fica \u2014 retention + conversion)\n\nF\u00f3rmula: `ranking = relevance \u00d7 velocity \u00d7 conversion \u00d7 retention` (cada fator multiplica os outros).\n\n### Boost de lan\u00e7amento (n\u00e3o \"penalidade\") + re-indexa\u00e7\u00e3o\n- Apps novos t\u00eam boost de ranking nos primeiros ~7 dias e depois caem \u2014 o \"Seven Day Cliff\" \u00e9 observa\u00e7\u00e3o de LAN\u00c7AMENTO (Sensor Tower, 2014, 2 apps), N\u00c3O uma penalidade que se repete a cada troca de metadata (playbook \u00a72; research-2026-09-aso achado 18)\n- Re-indexa\u00e7\u00e3o de metadata: 3-7 dias t\u00edpico (observa\u00e7\u00e3o de vendor, sem dado p\u00fablico) \u2014 ler antes disso \u00e9 ler a indexa\u00e7\u00e3o em curso\n- Primeiras **72 horas** = janela cr\u00edtica de signals (velocity, conversion, ratings)\n- **Day 7 retention > 15%** = \"healthy band\" (reten\u00e7\u00e3o como fator de ranking N\u00c3O \u00e9 confirmada pela Apple \u2014 \u00e9 infer\u00eancia de vendor; o que a Apple nomeia \u00e9 downloads, ratings e reviews)\n\n### Apple combina palavras automaticamente (Cartesiano)\n- Apple tokeniza Name + Subtitle + Keywords field como pool \u00fanico\n- Gera todas combos cartesianas pra queries multi-palavra\n- **Long-tail composto no keywords field = desperd\u00edcio** (`padel scoreboard` j\u00e1 \u00e9 coberto se `padel` + `scoreboard` est\u00e3o separados)\n- Keywords field = APENAS palavras \u00fanicas, single-word, n\u00e3o-redundantes com Name/Subtitle\n- Comma-separated, NO spaces, all lowercase, max ~95-100 chars\n\n### Pop & diff (Astro popularity score 5-100) \u2014 a r\u00e9gua quebrou em out/2025\n- **A escala de popularidade do Apple Ads quebrou em 29/09-03/10/2025** (keywords com pop >5 nos EUA ca\u00edram 77% em 4 dias); a Astro serve um BACKUP de out/2025 + o rank report mensal da Apple (playbook \u00a74; research-2026-09-aso achado 14). O pop que voc\u00ea v\u00ea \u00e9 classifica\u00e7\u00e3o congelada, n\u00e3o contagem.\n- **Pop = 5 \u00e9 DESCONHECIDO** (nem piso, nem prova de zero buscas) \u2014 nem descartar, nem promover s\u00f3 por isso\n- Sweet spot pra app cold-start continua pop 6-30 + diff \u2264 15 (TOP 4 vi\u00e1vel sem downloads) \u2014 **mas exige 2\u00aa fonte de volume antes de ganhar char de Name/Subtitle**: search terms do Apple Ads (`_GambitStudio/scripts/apple-ads/pull_search_terms.py`, se houver campanha) ou o rank report mensal da Apple. Pr\u00e9-launch n\u00e3o tem o report de search terms da ASC (o app n\u00e3o existe); a 2\u00aa fonte \u00e9 o Apple Ads de um app irm\u00e3o do nicho ou o rank report.\n- Termo com pop s\u00f3 da Astro recebe a flag **`pop n\u00e3o confi\u00e1vel`** na tabela e no `keyword_candidates.md`, e entra no m\u00e1ximo no keywords field (1\u00d7)\n- **Nunca comparar pop de tools diferentes nem com hist\u00f3rico pr\u00e9-out/2025** \u2014 n\u00e3o medem a mesma coisa\n- Pop 90 \u2248 3\u00d7 as impress\u00f5es de pop 60 (escala n\u00e3o-linear \u2014 heur\u00edstica anterior \u00e0 quebra, usar s\u00f3 como ordem de grandeza)\n\n### Inten\u00e7\u00e3o de busca > volume bruto\nKeyword com inten\u00e7\u00e3o desalinhada = install + uninstall + rating ruim \u2192 Apple penaliza retention \u2192 ranking despenca.\n\n**Teste mental:** \"se eu busco essa palavra, espero achar nosso tipo de app?\"\n\nCategorias cl\u00e1ssicas que falham pra apps de tracker/scoreboard/calculator:\n- `coach`, `drills`, `training`, `treino`, `t\u00e9cnica` \u2192 quer aulas/tutoriais\n- `partner`, `pareja`, `parceiro` \u2192 quer matchmaking\n- `club`, `pista`, `quadra`, `cancha`, `reserva` \u2192 quer booking\n- `ranking oficial`, `wpt`, `atp`, `premier` \u2192 quer ver torneio na TV\n- brand competitor (`playtomic`, etc) \u2192 quer A marca espec\u00edfica\n- brand equipamento (`bullpadel`, `head`, `adidas`) \u2192 quer comprar gear\n\n### \u26a0\ufe0f Armadilha do diff baixo (FALSO sweet spot)\n**Diff baixo N\u00c3O \u00e9 sweet spot se a inten\u00e7\u00e3o n\u00e3o bate com o app.** Difficulty mede competi\u00e7\u00e3o \u2014 palavra gen\u00e9rica/poliss\u00eamica tem diff baixo justamente porque apps do SEU nicho n\u00e3o disputam ela. SEMPRE cruzar diff baixo com o teste de inten\u00e7\u00e3o antes de marcar \ud83e\udd47.\n\nExemplo real (Walk, pt-BR): `contador` pop=38 **diff=21** parecia o \u00fanico quase-sweet-spot do nicho ped\u00f4metro. Mas `contador` solo em pt-BR = **contabilidade / contador gen\u00e9rico** \u2014 quem busca n\u00e3o quer app de passos; o diff \u00e9 baixo porque ped\u00f4metros n\u00e3o competem nessa query. Valor como alvo solo: **zero**. S\u00f3 serve de feeder de composi\u00e7\u00e3o (`contador de passos`, `contador de calorias`). Regra: palavra poliss\u00eamica entra no m\u00e1ximo como feeder de bigram, nunca como alvo isolado celebrado.\n\n## \ud83d\udea6 Viability Gate (GO / NO-GO) \u2014 rodar ANTES de propor metadata ou sugerir build\n\nEsta skill N\u00c3O \u00e9 s\u00f3 \"propor keywords\" \u2014 \u00e9 um **port\u00e3o de viabilidade**. Produ\u00e7\u00e3o n\u00e3o \u00e9 o gargalo do indie; sele\u00e7\u00e3o de nicho \u00e9. Construir bonito num nicho saturado = app na pasta `recovery/`. Ent\u00e3o, depois da pesquisa de mercado (steps 2-5), emitir um **veredito expl\u00edcito** antes de qualquer proposta de metadata:\n\n**Sinais (computados dos dados Astro j\u00e1 puxados):**\n- **Oxig\u00eanio de ASO**: existem \u22653 termos com **pop\u22656 + diff\u226420 + inten\u00e7\u00e3o alinhada** (passando no teste de inten\u00e7\u00e3o, N\u00c3O falsos sweet spots)?\n- **Satura\u00e7\u00e3o dos heads**: os termos-cabe\u00e7a do nicho t\u00eam diff>60 E incumbentes com **>100k reviews**?\n- **Wedge**: d\u00e1 pra responder \"pra QUEM isso faz O QU\u00ca melhor que o l\u00edder\" em 1 frase? **Sustentado pelo benchmark do Step 2.5** (features-gap + dores de review), N\u00c3O por intui\u00e7\u00e3o \u2014 o wedge s\u00f3 conta se sai de uma feature que o nicho n\u00e3o ships OU de uma dor recorrente do l\u00edder.\n- **\ud83d\udcb0 Dinheiro no nicho \u2014 \"o l\u00edder fatura quanto?\"** (li\u00e7\u00e3o do portf\u00f3lio 2026-08: Sueca/Truco/Foguetineo = brechas REAIS de busca em mercados de R$ 0; brecha ganh\u00e1vel \u2260 vale ganhar). Proxy barato via iTunes lookup + p\u00e1gina dos l\u00edderes:\n  - **Ratings velocity**: ratings do l\u00edder \u00f7 meses desde o release (`userRatingCount` + `releaseDate` do lookup). L\u00edder novo (<2 anos) com **\u2265100 ratings/m\u00eas** = nicho com volume pagante (ex. peptide: apps de <1 ano com 1.3k-3.6k ratings). L\u00edderes velhos com <10 ratings/m\u00eas = nicho morto.\n  - **Monetiza\u00e7\u00e3o shipada**: os top 3-5 t\u00eam subscription/IAP vis\u00edvel (se\u00e7\u00e3o \"In-App Purchases\" do lookup, faixa de pre\u00e7o do Step 2.5d)? Se os l\u00edderes s\u00e3o todos gr\u00e1tis-sem-IAP, ningu\u00e9m est\u00e1 conseguindo cobrar \u2014 o nicho n\u00e3o paga.\n  - Regra: **nicho sem dinheiro rebaixa o veredito em 1 n\u00edvel** (GO\u2192RISKY, RISKY\u2192NO-GO), por melhor que a brecha de keyword seja.\n\n**Veredito:**\n| Resultado | Crit\u00e9rio | A\u00e7\u00e3o |\n|-----------|----------|------|\n| \ud83d\udfe2 **GO** | \u22653 sweet spots reais (inten\u00e7\u00e3o alinhada) E/OU wedge claro num sub-nicho, **E nicho com dinheiro** (ratings velocity + monetiza\u00e7\u00e3o shipada) | Seguir \u2014 propor Name/Subtitle/Keywords |\n| \ud83d\udfe1 **RISKY** | 1-2 sweet spots OU heads saturados mas h\u00e1 long-tail/wedge defens\u00e1vel | Seguir S\u00d3 se o wedge for forte; sen\u00e3o estreitar o nicho |\n| \ud83d\udd34 **NO-GO** | 0 sweet spots reais, heads todos diff>60 + incumbentes 100k+ reviews, sem wedge, **OU nicho sem dinheiro** (l\u00edderes sem IAP/ratings velocity) | **N\u00c3O construir.** Recomendar estreitar o nicho ou trocar de ideia. Dizer isso explicitamente \u2014 taxa de \"n\u00e3o\" alta \u00e9 sa\u00fade, n\u00e3o fracasso. |\n\n**Nicho sem dinheiro rebaixa 1 n\u00edvel** mesmo com keywords perfeitas \u2014 o output DEVE reportar a linha \"\ud83d\udcb0 L\u00edder fatura: <proxy>\" no veredito.\n\n**Regra dura:** se NO-GO, N\u00c3O partir pro `/create-ios-app`. O caso Walk (ped\u00f4metro: 0 sweet spots reais, `step counter`/`pedometer` diff 81/75 com incumbentes de 280k+ reviews) \u00e9 o exemplo de algo que N\u00c3O deveria ter ido a build sem um wedge afiado. Apresentar o veredito no topo do output, antes da proposta de metadata.\n\n> **App J\u00c1 publicado?** N\u00e3o \u00e9 caso desta skill (decis\u00e3o de build j\u00e1 foi feita). Use `_GambitStudio/scripts/asc/kill_or_scale.py --app-id <id> --days 45` pra decidir **continuar ou arquivar** com base em downloads/receita reais (KILL / WATCH / SCALE).\n\n## Steps\n\n### 1. Coletar contexto do app\n\nPergunta ao user (ou inferir do prompt):\n- **NICHE** (ex: padel, tennis, fitness, calculadora financeira)\n- **APP_TYPE** (tracker / scoreboard / coach / calculator / lifestyle / etc) \u2014 define inten\u00e7\u00e3o\n- **MERCADOS-ALVO** (default: US, BR, ES, IT \u2014 ajustar conforme nicho)\n- **KILLER FEATURE** (watch app? AI? offline? local pra BR?) \u2014 gera modifiers \u00fanicos\n\n### 2. Pesquisa de mercado inicial\n\nPra cada mercado-alvo, rodar em paralelo:\n\n```\nmcp__astro__search_app_store(keyword=<NICHE>, store=<MARKET>, limit=15)\n```\n\nAn\u00e1lisar top apps:\n- Quantos jogos vs utility/tracker\n- Top concorrente direto (rating count = proxy de downloads \u2014 regra: 50-200 dl/rating)\n- Tamanho do mercado (totalResults)\n- Identificar brand keywords competidoras (pra evitar listar)\n\n### 2.5. Benchmark competitivo profundo (features / naming / monetiza\u00e7\u00e3o / dores de review)\n\n> **Por que existe este passo:** a sess\u00e3o do WTMP (anti-furto, jul/2026) provou que **s\u00f3 pesquisar keyword N\u00c3O basta**. O que definiu o produto e o wedge foi o benchmark de features/naming/monetiza\u00e7\u00e3o/dores de review dos l\u00edderes. Keyword diz SE d\u00e1 pra ser achado; o benchmark diz O QUE construir pra converter e onde o l\u00edder deixa buraco. Rodar SEMPRE, alimenta o Viability Gate (sinal \"wedge\") com dados, n\u00e3o intui\u00e7\u00e3o.\n\nPros top 3-5 concorrentes identificados no Step 2, pra cada um:\n\n**a) Baixar e VER os prints (n\u00e3o adivinhar \u2014 olhar):**\n```bash\ncurl -s \"https://itunes.apple.com/lookup?id=<APP_STORE_ID>&country=us\"\n# \u2192 campo screenshotUrls (array). Baixar em resolu\u00e7\u00e3o leg\u00edvel:\n# na URL, trocar o segmento .../392x696bb.png por .../600x1067bb.png (ou maior)\n```\nBaixar os PNGs e usar a **Read tool pra VER cada imagem** (eu enxergo imagem). Dos prints + do campo `description` do mesmo lookup, extrair:\n- **Naming pattern do nicho** \u2014 como os l\u00edderes nomeiam (ex anti-furto: `Don't Touch My Phone` / `WTMP` / `Who Unlocked My Phone` + sufixos `Anti-Theft` / `AntiSpy` / `Alarm`). O padr\u00e3o dominante tem peso ASO.\n- **Lista de FEATURES que o nicho ships** \u2014 tudo que aparece nos prints e na description (ex WTMP: intruder selfie, motion/pocket alarm, charger-removal alarm, wrong-passcode photo).\n- **Estilo visual dominante** (dark/neon security vs light/friendly, mock de celular, etc) \u2014 insumo pra paleta e prints.\n\n**b) Features gap (tabela obrigat\u00f3ria no output):** montar\n| Feature | L\u00edder A | L\u00edder B | L\u00edder C | N\u00f3s |\n|---------|:------:|:------:|:------:|:---:|\n| intruder selfie | \u2705 | \u2705 | \u2705 | \u2705 |\n| motion alarm | \u2705 | \u274c | \u2705 | \u2705 |\n| alarme de conectividade/airplane | \u274c | \u274c | \u274c | \u2705 \u2190 **wedge** |\n| modo furtivo | \u274c | \u2705 | \u274c | \u2705 |\n\nAchar **1-2 features que d\u00e3o wedge** (o que o nicho N\u00c3O ships ou ships mal). No WTMP foram: alarme de conectividade/airplane-mode, modo furtivo, App Lock integrado.\n\n**c) Naming pattern:** confirmar que o Name proposto **casa com o padr\u00e3o dominante** do nicho (peso ASO) **sem ser c\u00f3pia** do l\u00edder. Se o Name proposto destoa do padr\u00e3o, ou \u00e9 index\u00e1vel fraco ou \u00e9 clone \u2014 ajustar.\n\n**d) Monetiza\u00e7\u00e3o (refer\u00eancia, mesmo nascendo gr\u00e1tis):** ler os IAP/pre\u00e7os dos l\u00edderes \u2014 a `description` e a busca `\"in-app purchases\"` no JSON do lookup mostram os produtos e faixas. Registrar o range do nicho (ex freemium: weekly $2.99-9.99 / yearly $17.99-39.99). GambitStudio nasce gr\u00e1tis, mas registrar serve de baseline se o app pedir monetiza\u00e7\u00e3o depois.\n\n**e) Dores de review = WEDGE (o passo mais valioso):** puxar reviews recentes dos l\u00edderes:\n```\nmcp__astro__get_app_ratings(app_id=<APP_STORE_ID>)   # se dispon\u00edvel\n```\nSe a tool n\u00e3o estiver dispon\u00edvel, ler as reclama\u00e7\u00f5es recorrentes do nicho na p\u00e1gina de reviews. Extrair as **queixas recorrentes dos l\u00edderes** \u2014 CADA dor recorrente \u00e9 um diferencial pro app novo. Exemplos reais WTMP:\n- \"ads demais / n\u00e3o silencia o alarme\" \u2192 n\u00f3s: sem ad intrusivo, alarme control\u00e1vel\n- \"foto do intruso quebrada/sumida\" \u2192 n\u00f3s: captura confi\u00e1vel, foto sempre salva\n- \"\u00e9 prank tool, n\u00e3o seguran\u00e7a real\" \u2192 n\u00f3s: posicionar como seguran\u00e7a de verdade\n\nOutput: lista **dor recorrente do l\u00edder \u2192 diferencial nosso**. Isso alimenta diretamente o wedge do Viability Gate.\n\n**Sa\u00edda deste step (entra no output final e no VEREDITO):**\n1. Tabela features-gap (nicho vs n\u00f3s) com o(s) wedge(s) marcado(s)\n2. Naming pattern do nicho + valida\u00e7\u00e3o do Name proposto\n3. Faixa de monetiza\u00e7\u00e3o do nicho (refer\u00eancia)\n4. Lista `dor do l\u00edder \u2192 diferencial nosso`\n\n### 3. Tracking do app concorrente l\u00edder\n\nAdicionar 1 concorrente forte ao Astro (prefer\u00eancia: app multi-market pra cobrir todos mercados):\n\n```\nmcp__astro__add_app(appStoreId=<COMPETITOR_ID>, platform=iphone)\n```\n\n### 4. Gera\u00e7\u00e3o e tracking de keywords candidatas\n\nPra cada mercado, gerar batch de 30-60 keywords seguindo o padr\u00e3o (todas com inten\u00e7\u00e3o alinhada com APP_TYPE):\n\n**Head terms:**\n- `<niche>` (o esporte/categoria)\n- `<niche> app`\n- Varia\u00e7\u00f5es localizadas (PT: `t\u00eanis`/`tenis`, ES: `p\u00e1del`/`padel`, IT: cognatos)\n\n**Action-oriented (alinhar com APP_TYPE):**\n- Pra TRACKER: `<niche> tracker`, `<niche> stats`, `<niche> match tracker`, `<niche> history`\n- Pra SCOREBOARD: `<niche> score`, `<niche> scoreboard`, `<niche> scorer`, `<niche> placar/marcador/punteggio`\n- Pra COACH: `<niche> drills`, `<niche> training`, `<niche> tips`\n- Pra CALCULATOR: `<niche> calculator`, `<niche> calc`, `<niche> formula`\n\n**Watch keywords** (cross-locale gold \u2014 `padel watch IT pop 44/diff 13` foi a maior joia da sess\u00e3o Padel):\n- `<niche> watch`, `apple watch <niche>` (apenas keywords field \u2014 Apple Watch proibido em Name/Subtitle)\n\n**Modifiers nativos por idioma:**\n- PT-BR: `placar`, `marcador`, `contador`, `pontos`, `partida`, `jogos`, `pulso`\n- ES: `marcador`, `contador`, `puntos`, `partido`, `set`, `juego`, `mu\u00f1eca`\n- IT: `segnapunti`, `marcatore`, `punteggio`, `punti`, `partita`, `polso`\n\n**Action features** (se app tem):\n- Formatos espec\u00edficos do esporte (ex: `americano padel` BR/ES/IT diff 5-9 = gold)\n\n**Long-tails geo-target** (low pop mas low diff, opcional):\n- `<niche> brasil`, `<niche> m\u00e9xico`, `<niche> italia` \u2014 autoinfere pela loja\n\n```\nmcp__astro__add_keywords(appId=<COMPETITOR_ID>, store=<MARKET>, keywords=[<batch>])\n```\n\n### 5. An\u00e1lise de pop/diff retornados\n\nPra cada keyword, classificar:\n\n| Categoria | Crit\u00e9rio | A\u00e7\u00e3o |\n|-----------|----------|------|\n| \ud83e\udd47 **JOIA** | pop \u2265 15 + diff \u2264 15 | Slot priorit\u00e1rio no NAME |\n| \ud83d\udfe2 **SWEET SPOT** | pop 6-14 + diff \u2264 15 | NAME ou SUBTITLE |\n| \ud83d\udfe1 **VI\u00c1VEL** | pop 6-30 + diff 16-25 | SUBTITLE ou KW field |\n| \ud83d\udd35 **DESCONHECIDO** | pop = 5 + diff \u2264 15 | Single word no KW field (combos autom\u00e1ticos); pop=5 n\u00e3o \u00e9 zero nem piso (achado 14) |\n| \u26a0\ufe0f **DESCARTAR** | diff > 25 OU inten\u00e7\u00e3o desalinhada | N\u00e3o usar (mesmo se pop alta) |\n| \ud83d\udeab **HEAD SATURADO** | pop alta + diff > 40 | N\u00e3o no Name (jogos dominam); s\u00f3 palavra \u00fanica no KW field |\n\n**Coluna obrigat\u00f3ria `Fonte de volume`** em toda tabela de keyword: `apple-ads` / `rank-report` / `astro-only`. JOIA e SWEET SPOT s\u00f3 ganham slot de Name/Subtitle com fonte diferente de `astro-only`; sen\u00e3o descem um n\u00edvel e levam a flag **`pop n\u00e3o confi\u00e1vel`**.\n\n### 6. Propor Name + Subtitle + Keywords field por mercado\n\n**Princ\u00edpios:**\n- **NAME (30 chars, peso 7\u00d7)**: 3-4 palavras-chave pesadas (JOIA + SWEET SPOTS). Nada de \"Pro\", \"App\", conectivos vazios. Cada palavra precisa rankear.\n- **SUBTITLE (30 chars, peso 3\u00d7)**: 2-3 palavras complementares que N\u00c3O repetem o Name (Apple n\u00e3o cumulativa peso).\n- **KEYWORDS FIELD (100 chars, peso 1\u00d7)**: palavras \u00fanicas, single-word, sem duplicar Name/Subtitle. Pack at\u00e9 ~95-100 chars (Apple d\u00e1 esse slot gr\u00e1tis \u2014 desperdi\u00e7ar \u00e9 deixar ASO na mesa). Lowercase, comma-separated, no spaces.\n- **NUNCA \"Apple Watch\"** no Name/Subtitle (trademark restrito). Usar s\u00f3 `Watch`.\n- **NUNCA brand competitor** no Name. KW field \u00e9 risco baixo mas convers\u00e3o ~1%.\n\n### 7. Tabela de cobertura esperada (output principal pro user)\n\nPra cada mercado, tabela mostrando:\n- Cada keyword-alvo, sua pop+diff, onde aparece (N/S/K), e ranking esperado (TOP 1-3, 5-10, 10-20, etc)\n\nFoco em mostrar **4-5 termos onde vamos GANHAR (TOP 4)**, n\u00e3o dispersar.\n\n### 8. Recomenda\u00e7\u00e3o estrat\u00e9gica final\n\nOutput deve responder:\n- **Qual o melhor mercado** pra atacar primeiro (maior volume agregado de pop>5)\n- **Quais 4-5 termos** s\u00e3o os alvos priorit\u00e1rios\n- **Receita estimada** 6/12 meses (conservador/realista/otimista) baseado em:\n  - Volume agregado de pop dos termos onde vamos rankear top 5\n  - Convers\u00e3o tap\u2192install esperada (alta se inten\u00e7\u00e3o alinhada: 30-40%)\n  - ARPU t\u00edpico GambitStudio: $5-10/ano em 2-4% conversion\n- **Risco** (alto/m\u00e9dio/baixo) \u2014 baseado em diff m\u00e9dio, # competidores fortes, maturity do mercado\n\n### 9. Estrat\u00e9gia p\u00f3s-launch (incorporar nos pr\u00f3ximos passos)\n\nMencionar pra o user que p\u00f3s-launch deve:\n1. **Lan\u00e7ar Mon-Wed** (n\u00e3o weekend \u2014 heur\u00edstica de vendor)\n2. **Apple Ads como fase 0 (opcional, gasto = decis\u00e3o do Jo\u00e3o)** \u2014 14 dias de Search Match a $5-10/dia: o retorno certo \u00e9 o DADO (queries reais + convers\u00e3o por termo = a 2\u00aa fonte de volume); uplift org\u00e2nico direto N\u00c3O est\u00e1 provado (playbook \u00a73; achados 15-16). Benchmarks CPI: BR ~$1, MX ~$1,1, ES ~$1,4, US $2,5-4\n3. **15-20 reviews org\u00e2nicas** em 4 semanas (rede pessoal, comunidades), as primeiras 5 nas 72h e **na storefront-alvo** (nota \u00e9 por territ\u00f3rio; 4,0 \u00e9 penhasco de convers\u00e3o \u2014 achados 9 e 12)\n4. **Day 7 retention > 15%** = healthy band (fator de ranking n\u00e3o confirmado pela Apple; alimenta redownload e Collections)\n5. **Captions de screenshot N\u00c3O s\u00e3o indexadas** (evid\u00eancia fraca, sem confirma\u00e7\u00e3o da Apple \u2014 achado 6) \u2014 termo-alvo na headline s\u00f3 por convers\u00e3o, nunca como cobertura de \u00edndice\n6. **Segundo set de keywords PRONTO antes do launch** \u2014 set alternativo com o MENOR diff poss\u00edvel pra trocar no keywords field depois que o boost de lan\u00e7amento passa (day 7-14); name/subtitle ficam est\u00e1veis no primeiro m\u00eas (trocar joga fora o boost que estava rankeando aquele conjunto)\n7. **Custom Product Pages rankeiam organicamente** pelas keywords atribu\u00eddas (jul 2025+) \u2014 s\u00f3 termos do keywords field da vers\u00e3o aprovada podem ser ligados, conjunto \u00fanico por p\u00e1gina; CPP por inten\u00e7\u00e3o quando o app tem \u22652 inten\u00e7\u00f5es de busca (playbook \u00a79)\n8. **Iterar metadata a cada 2-4 semanas** baseado em ranking data \u2014 nunca analisar antes de D7 de cada mudan\u00e7a (re-index leva 3-7 dias; queda pr\u00e9-D7 n\u00e3o \u00e9 \"cliff\")\n9. **en-GB preenchido desde o day one** \u2014 \u00e9 o 2\u00ba \u00edndice de BR/MX/ES/DE/FR/KR/PT/AR; e pt-BR/es-MX/fr/ru/zh/ar/ko/vi indexam nos EUA (tabela cross-storefront, playbook \u00a710)\n10. **Top-2 locales por instala\u00e7\u00f5es entram na 1\u00aa itera\u00e7\u00e3o p\u00f3s-launch (regra do Jo\u00e3o, 28/09/2026)** \u2014 pr\u00e9-launch n\u00e3o existe Sales Report, ent\u00e3o esta skill prop\u00f5e s\u00f3 os mercados-alvo escolhidos \u00e0 m\u00e3o. Depois de 90 dias na loja, toda itera\u00e7\u00e3o do `/start-aso-pipeline` cobre en-US/es-ES/pt-BR MAIS os dois locales com mais instala\u00e7\u00f5es novas (Product Type `1*`, nunca update `7*` \u2014 LEARNINGS #53), medidos por `_GambitStudio/scripts/asc/top_locales.py --app-id <ID>`; o pa\u00eds vira o locale que a storefront indexa (MX \u2192 es-MX, IN \u2192 hi + en-GB, playbook \u00a710). Deixar isso anotado no relat\u00f3rio como pr\u00f3ximo passo, n\u00e3o como locale desta pesquisa.\n\n### 10. Confirmar pr\u00f3ximo passo\n\nPerguntar se user quer:\n- **A**: scaffold com `/create-ios-app <descri\u00e7\u00e3o>` agora (cria Bundle ID + repo + projeto Swift)\n- **B**: ajustar algo do spec antes (paleta, killer features, name)\n- **C**: rodar pesquisa em mercados adicionais\n\n## Output esperado\n\n**FORMATO OBRIGAT\u00d3RIO:** seguir o GOLD STANDARD (path est\u00e1vel, n\u00e3o move)\n`_GambitStudio/aso/reference/keyword_candidates.GOLD.md`\n(c\u00f3pia auto-contida no _GambitStudio \u2014 formato confirmado pelo Jo\u00e3o). LER ANTES de escrever e preencher TODAS as se\u00e7\u00f5es.\nSalvar como `keyword_candidates.md`.\n\nSe\u00e7\u00f5es obrigat\u00f3rias do template:\n1. **Header** \u2014 Data \u00b7 Source (Astro) \u00b7 Baseline downloads \u00b7 Filtro decis\u00e3o (quadrante)\n2. **Tabela de pesos** dos 3 campos (name 7\u00d7 / subtitle 3\u00d7 / keywords 1\u00d7) + princ\u00edpio anti-dup\n3. **\ud83d\udcd0 Diff visual antes/depois** \u2014 COM CORES via `<span style=\"color:#hex\">`:\n   \ud83d\udd34 `#dc3545` saiu \u00b7 \ud83d\udfe2 `#28a745` entrou novo \u00b7 \ud83d\udd35 `#3b82f6` subiu de peso \u00b7 \ud83d\udd35 `#1e3a8a` desceu de peso \u00b7 preto = mant\u00e9m\n4. **NAME / SUBTITLE / KEYWORDS** \u2014 an\u00e1lise palavra-por-palavra + blocos \ud83d\udd34SAIU / \ud83d\udfe2ENTROU / \ud83d\udd04MUDOU\n5. **\ud83d\udcc4 Resultado final** \u2014 bloco com os 3 campos + char counts validados via Python `len()`\n6. **Cobertura por cluster** (peso composto: name\u00d77 + subtitle\u00d73 + keywords\u00d71)\n7. **\ud83c\udfaf Hip\u00f3tese formal** (If we change\u2026 then\u2026 because\u2026) + **\u26a0\ufe0f Riscos identificados**\n8. **\ud83c\udf0e Resumo cross-locale** \u2014 tabela consolidada + baselines + padr\u00f5es + pr\u00f3ximos passos\n9. **\ud83e\udd4a Benchmark competitivo** (do Step 2.5) \u2014 (a) **tabela features-gap** nicho vs n\u00f3s com wedge(s) marcado(s); (b) **naming pattern** do nicho + valida\u00e7\u00e3o do Name proposto; (c) **faixa de monetiza\u00e7\u00e3o** do nicho (refer\u00eancia); (d) **lista `dor do l\u00edder \u2192 diferencial nosso`** que sustenta o wedge do Viability Gate\n\n**Pr\u00e9-launch** (sem app live): rank atual/baseline = \"\u2014\"; focar pop/diff/inten\u00e7\u00e3o + cobertura ESPERADA + receita estimada 6/12 meses.\n**P\u00f3s-launch**: preencher rank atual de cada termo via `get_app_keywords` + baseline downloads via ASC Sales.\n\n## Hard-won lessons (N\u00c3O repetir)\n\n- **N\u00c3O listar long-tails compostos** no keywords field (`padel scoreboard` desperdi\u00e7a chars \u2014 Apple combina `padel` + `scoreboard` automaticamente)\n- **N\u00c3O duplicar palavras** entre Name/Subtitle/Keywords field (Apple n\u00e3o cumulativa peso)\n- **N\u00c3O otimizar pra pop=5** (\u00e9 \"desconhecido\" desde out/2025, n\u00e3o volume real \u2014 e N\u00c3O descartar por isso; sem 2\u00aa fonte de volume o termo leva a flag `pop n\u00e3o confi\u00e1vel` e fica fora de Name/Subtitle)\n- **N\u00c3O gastar Name/Subtitle num termo cujo volume s\u00f3 a Astro mediu** (achado 14 \u2014 a r\u00e9gua est\u00e1 congelada; exigir Apple Ads search terms ou rank report antes)\n- **N\u00c3O incluir keywords cuja inten\u00e7\u00e3o n\u00e3o casa** com app (coach pra scoreboard, brand pra substituto, etc) \u2014 gera uninstall + rating ruim\n- **N\u00c3O usar \"Apple Watch\"** em Name/Subtitle (trademark restrito da Apple)\n- **N\u00c3O dispersar em 20+ termos** \"alvos\" \u2014 app cold-start precisa de relevance m\u00e1xima em 4-5 termos\n- **N\u00c3O esquecer mercados n\u00e3o-\u00f3bvios** (sess\u00e3o Padel: IT foi #1 com `padel watch` pop 44 que nem ES/BR tinham)\n- **N\u00c3O rodar pra apps j\u00e1 publicados** \u2014 usar `/start-aso-pipeline` (essa skill \u00e9 pr\u00e9-launch only)\n- **N\u00c3O parar em keyword** \u2014 sem o benchmark do Step 2.5 (features/naming/monetiza\u00e7\u00e3o/dores de review) voc\u00ea n\u00e3o sabe O QUE construir nem onde est\u00e1 o wedge. WTMP (jul/2026): a keyword era s\u00f3 \ud83d\udfe1; o que definiu o produto foi o benchmark (features-gap \u2192 alarme de conectividade/modo furtivo/App Lock; dores dos l\u00edderes \u2192 ads/foto quebrada/\"\u00e9 prank\"). Keyword sem benchmark = app gen\u00e9rico bem-indexado que ningu\u00e9m baixa.\n\n## Tools usados\n\n- `mcp__astro__search_app_store` \u2014 top apps + competition mapping\n- `mcp__astro__add_app` \u2014 adicionar concorrente ao tracking\n- `mcp__astro__add_keywords` \u2014 batch tracking (max 100 por call) + retorna pop+diff\n- `mcp__astro__get_keyword_suggestions` \u2014 s\u00f3 pra apps tracked (n\u00e3o funciona pra nicho novo)\n- `mcp__astro__extract_competitors_keywords` \u2014 s\u00f3 pra keywords tracked\n\n## Refer\u00eancias externas\n\n- [App Store Ranking Factors 2026 \u2014 ASO World](https://asoworld.com/insight/app-store-ranking-in-2026-why-retention-and-engagement-now-matter-more-than-keywords/)\n- [iOS Keyword Field Strategy \u2014 Apptweak](https://www.apptweak.com/en/aso-blog/app-store-keyword-research-aso)\n- [New App Honeymoon Period \u2014 App Genie](https://appg.co/blog/app-store-algorithm-changes-2024-developer-guide)\n- [Indie Developer ASO $0 Budget \u2014 AppDrift](https://appdrift.co/blog/aso-for-indie-developers)\n- [Apple Search Ads + ASO synergy \u2014 SplitMetrics](https://splitmetrics.com/blog/app-store-optimization-aso-apple-search-ads-synergy/)\n- [Soft Launch Strategy \u2014 MobileAction](https://www.mobileaction.co/blog/soft-launch-marketing-strategy/)\n\n## Reference learnings\n\n- Cross-project ASO knowledge: `_GambitStudio/aso/learnings.md` (se\u00e7\u00e3o \"LEARNINGS PR\u00c9-LAUNCH\")\n- Memory persistente: `feedback_aso_keyword_strategy.md`\n";</script><script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script><script>document.getElementById("md").innerHTML=window.marked?marked.parse(RAW):"<pre>"+RAW.replace(/</g,"&lt;")+"</pre>";</script></div><script>(function(){try{var k="lh.scroll:"+location.pathname;var v=sessionStorage.getItem(k);if(v!==null){sessionStorage.removeItem(k);window.scrollTo(0,parseInt(v,10)||0);}document.addEventListener("submit",function(e){var f=e.target;if(f&&f.method&&f.method.toLowerCase()==="post"){sessionStorage.setItem(k,String(window.scrollY));}},true);}catch(e){}})();</script></body></html>
