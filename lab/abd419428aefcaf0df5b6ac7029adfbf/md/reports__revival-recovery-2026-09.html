<body><div class="wrap"><p class="sub" style="font-size:12px;margin:0 0 14px">Exportado em 2026-09-28 18:35 · fonte: Lab Hub local</p><p class="sub"><a href="../index.html">← hub</a> · <code>_GambitStudio/reports/revival-recovery-2026-09.md</code></p><div id="md"></div><script>const RAW="# Plano de Ressurrei\u00e7\u00e3o \u2014 Apps Recovery (set/2026)\n\n> N\u00fameros = instala\u00e7\u00f5es NOVAS reais (Product Type 1*, LEARNINGS #53), n\u00e3o o agregado\n> com updates. Cada app tem: estado \u2192 tese \u2192 design \u2192 funcionalidades \u2192 ASO \u2192 PPO \u2192\n> sequ\u00eancia \u2192 gatilho de decis\u00e3o. Execu\u00e7\u00e3o via work orders (tier recovery, noturno\n> eleg\u00edvel). Regra de ouro do portf\u00f3lio: rank a gente j\u00e1 sabe fazer \u2014 o que\n> ressuscita app \u00e9 CONVERS\u00c3O (prova social + p\u00e1gina) e RETEN\u00c7\u00c3O (produto).\n\n---\n\n## TIER A \u2014 apostar de verdade\n\n### 1. Truco Marcador \u2014 6,9/d \u00b7 458 ratings 4.7 \u00b7 trend +59%\n**A maior massa de prova social do recovery. Acabou de ganhar corpo (49 no ar).**\n- **Tese**: o app j\u00e1 converte quem chega (458 ratings com prompt MORTO anos). Com gate religado + campos en/es preenchidos, \u00e9 escalar aquisi\u00e7\u00e3o no nicho que ele domina.\n- **Design**: feito (02/09) \u2014 mesa+giz nas 5 telas. Falta: **prints da loja mostram o app antigo** \u2192 refresh code-driven ap\u00f3s D7.\n- **Funcionalidades** (ordem de valor):\n  1. Placar de \"m\u00e3o de onze\" / indicador de m\u00e3o de ferro (regra real do truco que marcadores concorrentes n\u00e3o t\u00eam)\n  2. Hist\u00f3rico de partidas (quem ganhou a noite) \u2014 vira motivo de reter o app entre encontros\n  3. Modo \"melhor de 3/5\" com placar de s\u00e9rie\n- **ASO**: iter em voo (D7 08/09). Aposta central: `marcador de truco` #45\u2192top10 (nossa massa 4.7\u00d7446 > donos do #4-#10). Pr\u00f3ximo: keywords AR/UY (`anotador` j\u00e1 entrou).\n- **PPO**: ap\u00f3s D7 e prints novos \u2014 testar print 1 \"placar na mesa real\" vs atual.\n- **Sequ\u00eancia**: D7 (08/09) \u2192 prints refresh \u2192 feature 1 \u2192 PPO.\n- **Gatilho**: se D28 n\u00e3o mostrar `marcador de truco` \u2264 #20, o teto \u00e9 org\u00e2nico BR \u2014 a\u00ed \u00e9 Apple Ads BR barato (termo exato) ou aceitar patamar.\n\n### 2. Sueca Drink \u2014 5,3/d \u00b7 160 ratings 4.66 \u00b7 WATCH\n**Nicho pr\u00f3prio (jogos de beber BR), +75% comprovado na iter-01, PPO de ordem RODANDO.**\n- **Tese**: p\u00e1gina que j\u00e1 converte + massa razo\u00e1vel; o produto \u00e9 raso (viewer de cartas) \u2014 reter \u00e9 imposs\u00edvel, ent\u00e3o a jogada \u00e9 MAXIMIZAR aquisi\u00e7\u00e3o por rodada social.\n- **Design**: 41 no ar. Cartas/tipografia ok. Falta: onboarding de 3s (o que \u00e9 o jogo) \u2014 hoje cai direto na tela de regras.\n- **Funcionalidades**:\n  1. **Mais baralhos tem\u00e1ticos** (Eu Nunca +18, modo casais, modo rep\u00fablica) \u2014 \u00e9 o que os l\u00edderes (2-3k ratings) todos t\u00eam e n\u00f3s n\u00e3o; alimenta `eu nunca` (pop 54!)\n  2. Roleta de castigos (\u0442\u0430\u0431le-stake do nicho)\n  3. Compartilhar carta no stories (aquisi\u00e7\u00e3o viral \u2014 o p\u00fablico \u00e9 festa)\n- **ASO**: iter-02 COMPOSTA (93 chars, esquenta/confraternizacao/18) \u2014 deploy quando o PPO fechar (~14d de dados). Depois: iter-03 mirando `eu nunca` composi\u00e7\u00f5es via baralho novo (fit real muda o jogo).\n- **PPO**: rodando (ordem das telas). Pr\u00f3ximo: print 1 com \"modo Eu Nunca\" quando a feature existir.\n- **Sequ\u00eancia**: PPO fecha \u2192 deploy iter-02 \u2192 feature 1 (baralhos) \u2192 iter-03 + PPO de print.\n- **Gatilho**: baralhos novos no ar + iter-03 e installs < 8/d em D28 \u2192 teto do nicho; manter como vaca leiteira de ads.\n\n### 3. Neon Glow Draw \u2014 3,4/d \u00b7 22 ratings \u00b7 subs aprovadas ($0)\n**Monetiza\u00e7\u00e3o rec\u00e9m-instalada nunca exposta a tr\u00e1fego decente.**\n- **Tese**: AR drawing tem p\u00fablico infantil/tween global (US/CN/BR nos installs); as subs (HD export) s\u00f3 pagam se houver volume \u2014 e o funil p\u00e1gina\u2192install \u00e9 o gargalo (CVR baixa com prints antigos).\n- **Design**: telas UIKit datadas (bot\u00f5es 2019). Passe estilo Truco: paleta neon consistente, onboarding AR com permiss\u00e3o bem pedida (LEARNINGS #48b vive aqui!).\n- **Funcionalidades**:\n  1. Galeria de desenhos salvos (hoje o desenho morre ao fechar \u2014 reten\u00e7\u00e3o zero por design)\n  2. Brushes novos (rainbow, fire) \u2014 2 free + resto nas subs (alimenta a monetiza\u00e7\u00e3o real)\n  3. Templates pra seguir (desenhar um cora\u00e7\u00e3o no ar) \u2014 onboarding de valor\n- **ASO**: iter-02 no ar (ar/cam). D7 ~09/09.\n- **PPO**: prioridade ALTA \u2014 os prints atuais n\u00e3o mostram o resultado (v\u00eddeo neon). Panorama IA com hero de v\u00eddeo glow \u00e9 o teste \u00f3bvio.\n- **Sequ\u00eancia**: D7 iter \u2192 PPO prints \u2192 galeria \u2192 brushes premium.\n- **Gatilho**: 90d sem primeira assinatura \u2192 despriorizar monetiza\u00e7\u00e3o, virar volume puro de ads.\n\n### 4. Peptide Log \u2014 ~0,8/d \u00b7 0 ratings \u00b7 nicho GLP-1 EM ALTA\n**Mercado explodindo (GLP-1/peptides), produto novo do lab, zero prova social.**\n- **Tese**: o nicho cresce sozinho; o app precisa existir bem nas buscas certas e converter os primeiros 25 ratings. \u00c9 o \u00fanico recovery onde o MERCADO faz o trabalho pesado.\n- **Design**: j\u00e1 nasce no padr\u00e3o do lab. Rever onboarding com claims seguros (sem medical advice).\n- **Funcionalidades**:\n  1. Lembretes de dose (reten\u00e7\u00e3o di\u00e1ria \u2014 o app \u00e9 de tracking!)\n  2. Export PDF pro m\u00e9dico (feature que gera review espont\u00e2nea)\n  3. Fotos de progresso (peso/medidas j\u00e1 tem?)\n- **ASO**: rodar /research-aso-keywords focado GLP-1 (o vocabul\u00e1rio mudou em 2026: semaglutide/tirzepatide/reta). iter-01 formal p\u00f3s-research.\n- **PPO**: cedo demais; primeiro prints code-driven decentes (5 telas reais).\n- **Sequ\u00eancia**: 1.1.1 aprova \u2192 Firebase (JO\u00c3O: console) \u2192 research ASO \u2192 lembretes \u2192 prints.\n- **Gatilho**: nicho quente n\u00e3o espera \u2014 se em 60d n\u00e3o houver 10 ratings org\u00e2nicos, o problema \u00e9 p\u00e1gina/produto, reavaliar com scout.\n\n## TIER B \u2014 barato e oportunista\n\n### 5. Foguetineo \u2014 0,5/d \u00b7 79 ratings \u00b7 trend up\nJogo arcade com massa decente pro tamanho. **N\u00e3o investir produto**; 1 ciclo de ASO barato (nunca teve pipeline; research + iter-01 em 1 tarde) + prints atuais. Se dobrar installs, reavaliar. Gate j\u00e1 ok.\n\n### 6. SafeDoc (PDF Scanner & Vault) \u2014 1.0 parado desde maio\n**O lab DOMINA o nicho vault** (Calc+ e Cloak = 88% da receita). SafeDoc \u00e9 a mesma tese sem nunca ter recebido esfor\u00e7o: 1 sprint de alinhamento (RatingGate, analytics, iter-01 de keywords com o vocabul\u00e1rio que o lab j\u00e1 minerou em vault/privacy). Potencial de virar o 3\u00ba cavalo do nicho. **Primeiro passo: audit de 1h (estado do c\u00f3digo + n\u00fameros reais).**\n\n## TIER C \u2014 sem kill, sem congelamento (Jo\u00e3o, 02/09: \"todos s\u00e3o plaus\u00edveis de recuperar\")\n\n**Regra que fica: nunca entrega MAGRA** (manuten\u00e7\u00e3o/carona/gate-only) \u2014 todo investimento \u00e9\nsubstantivo, com alavanca de installs/receita/reten\u00e7\u00e3o ligada. Prioridade pelo tamanho da\noportunidade, mas nenhum app est\u00e1 fora do jogo. Rework de 02/09: os 4 que subiram magros\nvoltam com feature de reten\u00e7\u00e3o real (WO rework-releases-magras).\n\n### 7. DevLingo \u2014 streak + lembrete di\u00e1rio (rework 02/09); depois ASO bootstrap quando for a vez.\n### 8. Eisenhower \u2014 lembrete \"planeje o dia\" + badge (rework 02/09).\n### 9. Bible Pills \u2014 vers\u00edculo do dia por notifica\u00e7\u00e3o (rework 02/09).\n### 10. Philos \u2014 cita\u00e7\u00e3o di\u00e1ria por notifica\u00e7\u00e3o (rework 02/09); D28 15/09 \u00e9 MEDI\u00c7\u00c3O que orienta a pr\u00f3xima alavanca \u2014 kill descartado.\n\n---\n\n## Ordem de execu\u00e7\u00e3o global (pr\u00f3ximos 14 dias)\n1. **SafeDoc audit** (destrava ou descarta o Tier B grande) \u2014 execut\u00e1vel J\u00c1\n2. **Peptide research ASO GLP-1** \u2014 execut\u00e1vel J\u00c1 (aprova independente da review)\n3. **Foguetineo bootstrap ASO** \u2014 execut\u00e1vel J\u00c1\n4. Truco D7 (08/09) \u2192 prints refresh \u2192 feature \"m\u00e3o de onze\"\n5. Neon D7 (09/09) \u2192 PPO panorama de prints\n6. Sueca: PPO fecha (~13/09) \u2192 deploy iter-02 \u2192 baralhos tem\u00e1ticos\n7. Peptide: Firebase (Jo\u00e3o) \u2192 lembretes de dose\n\nGates que dependem do Jo\u00e3o: Firebase do Peptide (console), sudo pmset (noturno), College/Hair/Walk (intermediate).\n";</script><script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script><script>document.getElementById("md").innerHTML=window.marked?marked.parse(RAW):"<pre>"+RAW.replace(/</g,"&lt;")+"</pre>";</script></div><script>(function(){try{var k="lh.scroll:"+location.pathname;var v=sessionStorage.getItem(k);if(v!==null){sessionStorage.removeItem(k);window.scrollTo(0,parseInt(v,10)||0);}document.addEventListener("submit",function(e){var f=e.target;if(f&&f.method&&f.method.toLowerCase()==="post"){sessionStorage.setItem(k,String(window.scrollY));}},true);}catch(e){}})();</script></body></html>
