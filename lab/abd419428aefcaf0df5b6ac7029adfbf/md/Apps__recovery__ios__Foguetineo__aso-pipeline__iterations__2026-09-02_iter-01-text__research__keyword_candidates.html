.hcol .row{flex-direction:column;align-items:flex-start;gap:4px}.hcol .row b{white-space:normal}.hcol .row span{width:100%}.hcol .row em{display:none}.hcol .row.done b{font-size:12px}.hrow{display:flex;gap:20px;overflow-x:auto;align-items:flex-start;padding:16px 28px 12px;margin:18px 0 26px;background:rgba(125,125,125,.07);border:1px solid var(--bd);border-radius:16px;scroll-padding:0 28px}.hcol{flex:0 0 340px;min-width:340px}.hcol:last-child{margin-right:28px}.hcol h2{margin-top:0}.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:0 20px}.cols2{display:grid;grid-template-columns:1fr 1fr;gap:0 20px;align-items:start}@media(max-width:900px){.cols2{grid-template-columns:1fr}}h3.team{margin:18px 0 8px;font-size:15px;font-weight:600}h3.team .chain{display:block;color:var(--mut);font-weight:400;font-size:12.5px;margin-top:2px}.card .step{display:inline-block;min-width:18px;height:18px;line-height:18px;text-align:center;border-radius:9px;background:var(--bd);color:var(--mut);font-size:11px;font-weight:600;margin-right:6px}.grid4{display:grid;gap:12px;grid-template-columns:repeat(4,1fr)}@media(max-width:1100px){.grid4{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.grid4{grid-template-columns:1fr}}

/* ---------- camada de acabamento (01/10/2026) ----------
   Tipografia com duas vozes (display para títulos e números, texto para leitura),
   neutros com viés do azul da marca em vez de cinza puro, e profundidade por
   sombra em vez de só borda. Nada aqui renomeia classe: é uma camada por cima. */
:root{
  --f-disp:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --f-text:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --bg:#f3f5f9; --card:#ffffff; --tx:#10131a; --mut:#5a6377; --acc:#1552d8;
  --bd:#dde2ea; --bd-soft:#e8ecf3; --ok:#0a8f58; --down:#d02f2f; --warn:#b45309;
  --sh:0 1px 2px rgba(16,19,26,.05),0 2px 8px rgba(16,19,26,.04);
  --sh-up:0 2px 6px rgba(16,19,26,.07),0 10px 24px rgba(16,19,26,.07);
  --rad:14px;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#0b0d12; --card:#161a22; --tx:#eef1f7; --mut:#9aa5b8; --acc:#7aa6ff;
  --bd:#272d39; --bd-soft:#1f242e; --ok:#43d08d; --down:#ff7070; --warn:#e5a645;
  --sh:0 1px 2px rgba(0,0,0,.4); --sh-up:0 6px 22px rgba(0,0,0,.5);
}}
body{font-family:var(--f-text);font-size:14.5px;line-height:1.6;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1{font-family:var(--f-disp);font-size:27px;font-weight:800;letter-spacing:-.02em;
  text-wrap:balance;margin:0 0 2px}
h1 .mark{display:inline-block;width:28px;height:28px;vertical-align:-5px;margin-right:11px;
  background-size:contain;background-repeat:no-repeat;background-position:center}
h2{font-family:var(--f-disp);font-size:12px;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;color:var(--mut);border-top:1px solid var(--bd-soft);
  padding-top:22px;margin:32px 0 14px}
h3{font-family:var(--f-disp);letter-spacing:-.01em}
.sub{font-size:13px;color:var(--mut)}
code,.mono{font-family:var(--f-mono);font-size:12.5px}
.card,table.t,a.tile,.row,.fcard,#md{box-shadow:var(--sh);border-color:var(--bd-soft)}
.card,a.tile,.row,.fcard{border-radius:var(--rad)}
a.tile,.row{transition:box-shadow .16s ease,border-color .16s ease,transform .16s ease}
a.tile:hover,a.row:hover{box-shadow:var(--sh-up);border-color:var(--bd);
  transform:translateY(-1px)}
/* O card do app é área de leitura, não botão: nada muda no hover. A regra antiga
   trocava a sombra, e num card sem sombra isso aparecia como animação. */
.fcard,.fcard:hover{transition:none!important;transform:none!important}
/* big numbers: the first thing anyone reads on the page */
.tiles{gap:12px;margin:18px 0 4px;padding-bottom:10px}
a.tile{padding:13px 17px;min-width:148px}
.tile .tl{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
  color:var(--mut)}
.tile .tv{font-family:var(--f-disp);font-size:25px;font-weight:800;letter-spacing:-.025em;
  margin-top:3px}
.tile .ts{font-size:11.5px;color:var(--mut)}
/* tables read as data, not as prose */
table.t{border-radius:var(--rad);font-variant-numeric:tabular-nums}
table.t th{font-family:var(--f-disp);font-size:11px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;background:var(--bd-soft);border-bottom:1px solid var(--bd)}
table.t td{padding:9px 13px;border-bottom:1px solid var(--bd-soft)}
table.t tbody tr:hover td,table.t tr:hover td{background:rgba(125,140,170,.06)}
.twrap{border-radius:var(--rad)}
/* buttons */
.btn{font-family:var(--f-disp);font-weight:600;font-size:13.5px;padding:9px 18px;
  border-radius:999px;box-shadow:var(--sh);transition:all .16s ease}
.btn:hover{border-color:var(--acc);box-shadow:var(--sh-up);transform:translateY(-1px)}
.pill,.st{font-family:var(--f-disp);font-weight:600;font-size:11.5px;letter-spacing:.02em}
/* status colours carry meaning, so keep them out of the accent */
.st.run,.st.appr{background:rgba(10,143,88,.14);color:var(--ok)}
.st.crit{background:rgba(208,47,47,.14);color:var(--down)}
.st.rev,.st.draft{background:rgba(180,83,9,.14);color:var(--warn)}
/* the lanes strip and any scroller get a thin, rounded bar */
.tiles,.hrow,.twrap{scrollbar-width:thin;scrollbar-color:var(--bd) transparent}
.tiles::-webkit-scrollbar,.hrow::-webkit-scrollbar,.twrap::-webkit-scrollbar{height:9px}
.tiles::-webkit-scrollbar-track,.hrow::-webkit-scrollbar-track,
.twrap::-webkit-scrollbar-track{background:transparent}
.tiles::-webkit-scrollbar-thumb,.hrow::-webkit-scrollbar-thumb,
.twrap::-webkit-scrollbar-thumb{background:var(--bd);border-radius:999px;
  border:3px solid transparent;background-clip:content-box}
.tiles::-webkit-scrollbar-thumb:hover,.hrow::-webkit-scrollbar-thumb:hover,
.twrap::-webkit-scrollbar-thumb:hover{background:var(--mut);background-clip:content-box}
.hrow{background:transparent;border:0;padding:0;border-radius:0}
.hcol{flex:0 0 clamp(280px,26vw,360px);min-width:0}
a:focus-visible,button:focus-visible,.btn:focus-visible{outline:2px solid var(--acc);
  outline-offset:2px;border-radius:8px}
.dirlist,.prlist{margin:10px 0 0;padding-left:18px;list-style:none}
.dirlist>li,.prlist>li{position:relative;margin:0 0 7px;font-size:13.5px;line-height:1.5;
  color:var(--tx)}
.prlist>li{color:var(--mut);font-size:13px;margin-bottom:5px}
.dirlist>li::before,.prlist>li::before{content:"";position:absolute;left:-14px;top:.62em;
  width:5px;height:5px;border-radius:50%;background:var(--acc);opacity:.75}
.prlist>li::before{background:var(--mut);opacity:.5}
.dirp{display:none}
.dapps{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));
  margin:14px 0 4px;align-items:start}
.dapp{padding:14px 16px}
.dah{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.dah b{font-family:var(--f-disp);font-size:14.5px;font-weight:700}
.drank{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;
  border-radius:6px;background:var(--acc);color:#fff;font-size:11.5px;font-weight:700;flex:none}
.st.d-dobrar{background:rgba(10,143,88,.16);color:var(--ok)}
.st.d-consertar{background:rgba(180,83,9,.16);color:var(--warn)}
.st.d-manter{background:rgba(125,140,170,.16);color:var(--mut)}
.st.d-congelar{background:rgba(125,140,170,.12);color:var(--mut)}
.dapp .prlist{margin-top:6px}
.dcall{color:var(--tx)!important;font-weight:600}
.fcard[id]{scroll-margin-top:18px}
.fdet{margin-top:10px;border-top:1px solid var(--bd-soft);padding-top:9px}
.fdet>summary{cursor:pointer;list-style:none;font-family:var(--f-disp);font-size:11.5px;
  font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);
  display:flex;align-items:center;gap:7px}
.fdet>summary::-webkit-details-marker{display:none}
.fdet>summary::before{content:"›";font-size:15px;transition:transform .15s}
.fdet[open]>summary::before{transform:rotate(90deg)}
.fdet>summary:hover{color:var(--acc)}
.fdet table.t{font-size:12.5px}
.fdet table.t td,.fdet table.t th{padding:6px 10px}
.fgrid.one{grid-template-columns:1fr!important;gap:14px}
.fgrid.one>.fcard{border:1px solid var(--bd-soft);border-radius:var(--rad);
  box-shadow:none;background:var(--card);padding:0;overflow:hidden}
/* a faixa do topo separa um app do outro melhor que uma linha fina entre eles */
.fgrid.one>.fcard>.fh{background:var(--bd-soft);margin:0;padding:12px 16px;
  border-bottom:1px solid var(--bd)}
.fgrid.one>.fcard>.fmeta{padding:9px 16px 0}
.fgrid.one>.fcard>.fcols{padding:14px 16px 4px}
.fgrid.one>.fcard>.fdet{margin:0;padding:12px 16px 14px;border-top:1px solid var(--bd-soft);
  background:var(--bg)}
.fcols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;
  align-items:start}
@media(max-width:820px){.fcols{grid-template-columns:1fr;gap:12px}}
.fcol{min-width:0}
.fcol>.fnds{margin-top:0}
.fdet .ascgrid{grid-template-columns:repeat(auto-fit,minmax(118px,1fr))}
.fdetcols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;
  align-items:start}
@media(max-width:1100px){.fdetcols{grid-template-columns:repeat(2,minmax(0,1fr))}}

<body><div class="wrap"><p class="sub" style="font-size:12px;margin:0 0 14px">Exportado em 2026-10-01 16:27 · fonte: Lab Hub local</p><p class="sub"><a href="../index.html">← hub</a> · <code>Apps/recovery/ios/Foguetineo/aso-pipeline/iterations/2026-09-02_iter-01-text/research/keyword_candidates.md</code></p><div id="md"></div><script>const RAW="# Foguetinho \u2014 iter-01 (texto) \u2014 pt-BR + en-US\n\n## \ud83d\udcc4 Resultado final\n\n### pt-BR (\u00fanica mudan\u00e7a do iter: keywords)\n\n| Campo | Antes (no ar) | Depois (proposto) |\n|---|---|---|\n| name | `Foguetinho: Mire e Lance` (24) | inalterado |\n| subtitle | `Arcade espacial sem fim` (23) | inalterado |\n| keywords | <code>gire,solte,viciante,casual,offline,gratis,<span style=\"color:#d32f2f\">recorde,pontos,relaxar</span>,fisica,criancas,nave,<span style=\"color:#d32f2f\">reflexo</span>,jogo</code> (98) | <code><span style=\"color:#2e7d32\">foguete,brasileiro</span>,jogo,gire,solte,offline,casual,gratis,criancas,nave,fisica,viciante</code> (86) |\n\n**Por qu\u00ea:**\n- <code style=\"color:#2e7d32\">foguete</code> (pop 5) \u2014 fam\u00edlia inteira OUT hoje: `jogo de lan\u00e7ar foguete` OUT \u2192 **#1** at\u00e9 D28 (SERP de 3 apps, 0-8 ratings vs nossos 78) \u00b7 `lan\u00e7ar foguete` OUT \u2192 **#1-2** \u00b7 `jogo de foguete` OUT \u2192 **#5-10** (top 3 = simuladores com 123-3.4k ratings, nenhum usa mirar/lan\u00e7ar) \u00b7 `jogos de foguete` OUT \u2192 **#8-15** \u00b7 `foguete` OUT \u2192 #10-20 \u00b7 `foguete espacial` OUT \u2192 **#5-12**.\n- <code style=\"color:#2e7d32\">brasileiro</code> (pop 5) \u2014 `arcade brasileiro` OUT \u2192 **#1** at\u00e9 D28 (SERP de 7 apps com 0-10 ratings; temos 78).\n- <code style=\"color:#d32f2f\">pontos</code> \u00b7 <code style=\"color:#d32f2f\">recorde</code> \u2014 zero composi\u00e7\u00f5es rankeadas; posi\u00e7\u00e3o perdida no corte: nenhuma (`leaderboard` #77 segue coberto pelo kw en-US cross-locale).\n- <code style=\"color:#d32f2f\">reflexo</code> \u00b7 <code style=\"color:#d32f2f\">relaxar</code> \u2014 todas as composi\u00e7\u00f5es OUT/LOTTERY (diff 54-55 no cluster relax); SERP de reflexo \u00e9 de apps que MEDEM reflexo (NOT-list). Posi\u00e7\u00e3o perdida: nenhuma.\n- Rankings protegidos ficam todos: **#1** `foguetinho` / `jogo de foguetinho` / `mira e lan\u00e7a` / `gire e solte`, **#9** `arcade espacial`, #20 `jogo espacial offline`, #57 `jogo sem fim`, #74/#139 `nave`, #34/#193 `launch`/`rocket`.\n\n### en-US (documentado: fica como est\u00e1)\n\n| Campo | Antes (no ar) | Depois |\n|---|---|---|\n| name | `Rocket Pocket: Aim & Launch` (27) | inalterado |\n| subtitle | `Endless arcade flight fun` (25) | inalterado |\n| keywords | `tap,rotate,casual,addictive,kids,offline,free,space,score,leaderboard,retro,brain,relax,physics` (95) | inalterado |\n\n**Por qu\u00ea:**\n- `aim and launch` **#1**, `rocket launch` #44, `physics launcher` #63 (alvo #15-30 num iter dedicado de US), `rocket game` #125 \u2014 todos protegidos por name/kw que n\u00e3o mudam.\n- Research US rasa de prop\u00f3sito (6 termos na winnability) \u2014 cortar `brain`/`score`/`relax` sem medi\u00e7\u00e3o \u00e9 t\u00e3o especulativo quanto apostar. Mining US = pr\u00f3ximo iter.\n- `leaderboard` fica: protege #77 cross-locale BR; n\u00e3o faltou char (95/100).\n\n## \u26a0\ufe0f Pr\u00e9-requisito de deploy\n\n**N\u00e3o existe vers\u00e3o edit\u00e1vel na ASC** \u2014 12.0.0 est\u00e1 READY_FOR_SALE e keywords vivem em `appStoreVersionLocalizations`. Deploy = criar `appStoreVersion` nova + **build novo + review** (LEARNINGS #36/#44). Consequ\u00eancias:\n1. A cad\u00eancia D7/D14/D28 conta **a partir do dia em que a vers\u00e3o ficar live**, n\u00e3o do submit.\n2. Rollback tamb\u00e9m custa vers\u00e3o + review \u2014 mais uma raz\u00e3o pros cortes serem s\u00f3 de tokens mortos (retorno zero se precisar reverter).\n\n## \ud83d\udcd0 Diff antes/depois por locale\n\n### pt-BR keywords (98 \u2192 86 chars)\n\n| Slot | Antes | Depois |\n|---|---|---|\n| 1-2 | `gire,solte` | <code style=\"color:#2e7d32\">foguete,brasileiro</code> |\n| 3-12 | `viciante,casual,offline,gratis,`<code style=\"color:#d32f2f\">recorde,pontos,relaxar</code>`,fisica,criancas,nave` | `jogo,gire,solte,offline,casual,gratis,criancas,nave,fisica,viciante` |\n| 13-14 | <code style=\"color:#d32f2f\">reflexo</code>`,jogo` | \u2014 |\n\nFront-loading: apostas (`foguete`, `brasileiro`) nas posi\u00e7\u00f5es 1-2; protegidos/feeders atr\u00e1s (rank n\u00e3o depende da posi\u00e7\u00e3o no campo). Budget 86/100 declarado: os candidatos restantes eram mortos (relax/reflexo), MISMATCH (infantil, simulador), UNWINNABLE (internet, wifi) ou LOTTERY de 1 composi\u00e7\u00e3o (navinha, infinito) \u2014 86 honestos > 94 com token morto.\n\n### en-US \u2014 sem diff (name/subtitle/keywords id\u00eanticos ao live). Demais 6 locales live: intocados neste iter.\n\n## Decis\u00e3o por termo \u2014 pt-BR\n\n### SAIU\n\n| Termo | Pop | Diff | Rank | Por qu\u00ea |\n|---|---|---|---|---|\n| `pontos` | 5 | \u2014 | OUT | Zero queries naturais no mining; nenhuma composi\u00e7\u00e3o rankeada \u2014 OUT sem retorno |\n| `recorde` | 5 | \u2014 | OUT | \u00danica long-tail \u00e9 `leaderboard` (EN), j\u00e1 #77 via kw en-US cross-locale; retorno BR zero |\n| `reflexo` | 5 | 15-17 | OUT | SERP = trainers que medem reflexo (NOT-list do fit); todas composi\u00e7\u00f5es OUT/LOTTERY |\n| `relaxar` | 5 | 54-55 | OUT | Cluster relax todo OUT/LOTTERY; NOT-list (\"ca\u00e7a-recorde, n\u00e3o relaxamento\") |\n\n### ENTROU (2 apostas, \u22643 ok)\n\n| Termo | Pop | Diff | Rank | Por qu\u00ea |\n|---|---|---|---|---|\n| `foguete` | 5 | 5-40 | OUT | `jogo de lan\u00e7ar foguete` \u2192 **#1** DOMINATE (3 apps, 0-8 ratings) \u00b7 `lan\u00e7ar foguete` \u2192 **#1-2** \u00b7 `jogo de foguete` \u2192 **#5-10** CLIMB (simuladores no topo, ningu\u00e9m usa mirar/lan\u00e7ar) \u00b7 destrava a fam\u00edlia toda (foguetinho n\u00e3o flexiona pra foguete) |\n| `brasileiro` | 5 | 5 | OUT | `arcade brasileiro` \u2192 **#1** DOMINATE (7 apps, 0-10 ratings vs 78 nossos); comp\u00f5e com `arcade` do subtitle |\n\n3\u00aa aposta descartada: `navinha` (LOTTERY de 1 composi\u00e7\u00e3o, inten\u00e7\u00e3o shmup = churn), `lancamento` (hedge de 11 chars pra flex\u00e3o incerta), `infinito` (n\u00e3o vale slot).\n\n### MANT\u00c9M\n\n| Termo | Pop | Diff | Rank | Por qu\u00ea |\n|---|---|---|---|---|\n| `jogo` | 82 | 81 | feeder | PROTEGIDO \u2014 9 composi\u00e7\u00f5es rankeadas (**#1** jogo de foguetinho, #20, #57, #74, #139, #187\u2026) |\n| `gire`,`solte` | 5 | 5 | **#1** | PROTEGIDOS \u2014 `gire e solte` **#1**, `girar e soltar` **#1** |\n| `offline` | 76 | 68 | #20 | PROTEGIDO \u2014 `jogo espacial offline` #20 (alvo **#4-8** se subir de campo num iter futuro); feeder do CPP-1 |\n| `criancas` | 5 | 50-65 | #209/#234 | PROTEGIDO \u2014 composi\u00e7\u00f5es kids-offline rankeadas (passivas) |\n| `gratis` | 55 | 76 | #196 | PROTEGIDO \u2014 `jogos offline gratis para crian\u00e7as` #196 |\n| `nave` | 5 | 42-52 | #74/#139 | PROTEGIDO \u2014 `jogo de nave espacial` #74, `jogos de nave` #139 |\n| `casual` | 5 | 70 | feeder | `jogo casual offline` CLIMB #10-20 se offline subir; CPP-1 |\n| `fisica` | 5 | 15-19 | feeder | Nota do serp-analyst: manter; f\u00edsica de trajet\u00f3ria \u00e9 core |\n| `viciante` | 5 | 65 | feeder | FIT (ca\u00e7a-recorde \u00c9 a proposta); ancora a leitura sem\u00e2ntica do listing |\n\n## Mapa de prote\u00e7\u00e3o (o que N\u00c3O pode sair \u2014 cobertura final)\n\n### BR\n\n| Composi\u00e7\u00e3o | Rank | Token(s) | Onde |\n|---|---|---|---|\n| `foguetinho` / `jogo de/do foguetinho` | **#1** | Foguetinho, jogo | name + kw |\n| `mira e lan\u00e7a` / `mirar e lan\u00e7ar` / `mire e lance` | **#1/#1/#2** | Mire, Lance | name |\n| `gire e solte` / `girar e soltar` | **#1** | gire, solte | kw |\n| `arcade espacial` | **#9** | arcade espacial (frase literal) | subtitle |\n| `jogo espacial offline` | #20 | espacial, jogo, offline | subtitle + kw |\n| `launch` | #34 | Launch | name en-US |\n| `jogo sem fim` | #57 | sem, fim, jogo | subtitle + kw |\n| `jogo de nave espacial` | #74 | nave, espacial, jogo | kw + subtitle |\n| `leaderboard` | #77 | leaderboard | kw en-US |\n| `jogo de mirar` | #129 | Mire, jogo | name + kw |\n| `jogos de nave` | #139 | nave, jogo | kw |\n| `jogo espacial` | #187 | espacial, jogo | subtitle + kw |\n| `rocket` | #193 | Rocket | name en-US |\n| kids-offline (#196/#209/#234) | passivo | jogo, criancas, offline, gratis | kw |\n\n### US\n\n| Composi\u00e7\u00e3o | Rank | Token(s) |\n|---|---|---|\n| `aim and launch` | **#1** | name `Aim & Launch` |\n| `rocket launch` | #44 | name Rocket + Launch |\n| `physics launcher` | #63 | kw physics + name Launch |\n| `mire` (cross) | #95 | name pt-BR Mire |\n| `rocket game` | #125 | name Rocket |\n\n**Zero tokens do protection map removidos.**\n\n## \ud83d\udcc4 Resultado final (campos completos)\n\n```\npt-BR\nname      Foguetinho: Mire e Lance                    (24/30, inalterado)\nsubtitle  Arcade espacial sem fim                     (23/30, inalterado)\nkeywords  foguete,brasileiro,jogo,gire,solte,offline,casual,gratis,criancas,nave,fisica,viciante  (86/100)\n\nen-US (inalterado)\nname      Rocket Pocket: Aim & Launch                 (27/30)\nsubtitle  Endless arcade flight fun                   (25/30)\nkeywords  tap,rotate,casual,addictive,kids,offline,free,space,score,leaderboard,retro,brain,relax,physics  (95/100)\n\nDemais 6 locales live: intocados.\n```\n\n## CPP (proposta futura \u2014 N\u00c3O faz parte deste iter)\n\n| Cluster | Gap de inten\u00e7\u00e3o vs default page | 3 prints | Efeito esperado |\n|---|---|---|---|\n| \"Sem internet\" (`jogo espacial offline` #20, `jogo casual offline`) \u2014 pt-BR | Default page vende mira+lan\u00e7amento; quem busca offline quer garantia \"funciona sem internet\" e n\u00e3o v\u00ea isso em lugar nenhum | 1) gameplay com selo \"100% offline\" 2) modo avi\u00e3o ligado + jogo rodando 3) \"gr\u00e1tis, sem wifi, sem espera\" | CVR \u2191 no cluster offline (tap \u2192 install), hoje dilu\u00eddo na p\u00e1gina gen\u00e9rica |\n\nCria\u00e7\u00e3o (`appCustomProductPages` via ASC API + prints) s\u00f3 quando Jo\u00e3o escolher.\n\n## \ud83c\udfaf Hip\u00f3tese formal\n\n> **Se** adicionarmos `foguete` + `brasileiro` ao keywords pt-BR e cortarmos os 4 tokens mortos (`pontos`,`recorde`,`reflexo`,`relaxar`), com name/subtitle/en-US intocados,\n> **ent\u00e3o** at\u00e9 D28 (contado do dia live): `jogo de lan\u00e7ar foguete` OUT\u2192**#1**, `lan\u00e7ar foguete` OUT\u2192**#1-2**, `arcade brasileiro` OUT\u2192**#1**, `jogo de foguete` OUT\u2192**#5-10**, `jogos de foguete` OUT\u2192**#8-15**, e downloads (installs 1F) 0,5 \u2192 \u22650,75/dia na m\u00e9dia dos \u00faltimos 14d,\n> **porque** (a) as SERPs DOMINATE t\u00eam 3-9 apps com 0-10 ratings contra nossos 78; (b) a fam\u00edlia `foguete` \u00e9 a palavra que o p\u00fablico realmente digita e hoje n\u00e3o indexamos nada dela (foguetinho n\u00e3o flexiona); (c) os 4 cortes n\u00e3o tinham NENHUMA composi\u00e7\u00e3o rankeada \u2014 custo zero; (d) todo token do protection map permanece.\n\n## \u26a0\ufe0f Riscos\n\n1. **Volume real do pop 5 \u2248 zero** \u2014 pop 5 \u00e9 o piso; rank **#1** sem busca real = zero downloads. Mitiga\u00e7\u00e3o: App Store Search Terms report no D7-D14 valida volume; se ranks vierem e downloads n\u00e3o, a alavanca seguinte \u00e9 convers\u00e3o (CPP/prints), n\u00e3o mais texto.\n2. **Flex\u00e3o incerta**: `lan\u00e7amento de foguete` depende de lan\u00e7amento\u2190lance indexar (marcada INCERTA na winnability). Mitiga\u00e7\u00e3o: afeta s\u00f3 1 composi\u00e7\u00e3o; D7 verifica; iter-02 avalia token `lancamento` se a fam\u00edlia indexar mas essa n\u00e3o.\n3. **Deploy acoplado a release**: keywords s\u00f3 entram com vers\u00e3o nova aprovada \u2014 rejei\u00e7\u00e3o da review atrasa o iter inteiro; rollback custa outra vers\u00e3o+review. Mitiga\u00e7\u00e3o: mudan\u00e7a m\u00ednima (1 campo, 1 locale) e cortes s\u00f3 de tokens mortos \u2014 n\u00e3o h\u00e1 cen\u00e1rio em que reverter seja urgente.\n4. **Tr\u00e1fego de inten\u00e7\u00e3o errada**: `jogo do foguetinho` tamb\u00e9m \u00e9 busca navegacional do jogo de aposta (SERP sem app de aposta hoje \u2014 carona nossa **#1**); `foguete para crian\u00e7as` traz inten\u00e7\u00e3o kids-edu num app com interstitial ads. Mitiga\u00e7\u00e3o: n\u00e3o gastar copy nesses clusters; monitorar delta de ratings nos checkpoints \u2014 queda de rating BR sustentada = sinal de mismatch.\n5. **n min\u00fasculo**: baseline 22 installs/45d \u2014 janela de 14d tem n\u22487-10; leitura de downloads \u00e9 direcional (RULES: % sem n n\u00e3o vale). Mitiga\u00e7\u00e3o: o veredito do iter \u00e9 primeiro por RANK (mensur\u00e1vel j\u00e1 no D7), downloads confirmam no D28+.\n\n## \ud83d\udcc8 Proje\u00e7\u00e3o\n\nHeur\u00edstica do playbook \u00a77: kw field 1\u00d7 \u2248 10-30% de melhora de rank por termo; primeiras itera\u00e7\u00f5es movem RANKING antes de DOWNLOADS.\n\n| Cen\u00e1rio | Premissa | Impressions/dia | Downloads/dia (1F) |\n|---|---|---|---|\n| Baseline | \u2014 | TBD Day 0 | 0,5 |\n| Pessimista (~30%) | fam\u00edlia indexa, volume pop-5 \u2248 0 | +0-10% | 0,5 (flat) |\n| Realista (~50%) | DOMINATEs em **#1** + `jogo de foguete` **#5-10** | +40-80% | 0,75-1,0 |\n| Otimista (~20%) | `jogo de foguete` top 5 + `foguete` #10-15 pegando cauda | +150% | 1,5+ |\n\nProbabilidade de bater **conservador** (\u22650,75/dia): ~55% \u00b7 **bold** (\u22651,0/dia): ~30%.\n\nD0-D28 esperado (D0 = dia live): `D0-D3 \u2581 indexa\u00e7\u00e3o \u00b7 D7 \u2582 ranks DOMINATE vis\u00edveis \u00b7 D14 \u2583 impressions sobem \u00b7 D21 \u2584 \u00b7 D28 \u2585 leitura final`\n\n| Checkpoint | Sucesso | Falha \u2192 a\u00e7\u00e3o |\n|---|---|---|\n| D7 (live+7) | `jogo de lan\u00e7ar foguete`/`lan\u00e7ar foguete`/`arcade brasileiro` INDE
