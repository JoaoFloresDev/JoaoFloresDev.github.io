#md img{max-width:100%}
.hcol .row{flex-direction:column;align-items:flex-start;gap:4px}.hcol .row b{white-space:normal}.hcol .row span{width:100%}.hcol .row em{display:none}.hcol .row.done b{font-size:12px}.hrow{display:flex;gap:20px;overflow-x:auto;align-items:flex-start;padding:16px 28px 12px;margin:18px 0 26px;background:rgba(125,125,125,.07);border:1px solid var(--bd);border-radius:16px;scroll-padding:0 28px}.hcol{flex:0 0 340px;min-width:340px}.hcol:last-child{margin-right:28px}.hcol h2{margin-top:0}.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:0 20px}.cols2{display:grid;grid-template-columns:1fr 1fr;gap:0 20px;align-items:start}@media(max-width:900px){.cols2{grid-template-columns:1fr}}h3.team{margin:18px 0 8px;font-size:15px;font-weight:600}h3.team .chain{display:block;color:var(--mut);font-weight:400;font-size:12.5px;margin-top:2px}.card .step{display:inline-block;min-width:18px;height:18px;line-height:18px;text-align:center;border-radius:9px;background:var(--bd);color:var(--mut);font-size:11px;font-weight:600;margin-right:6px}.grid4{display:grid;gap:12px;grid-template-columns:repeat(4,1fr)}@media(max-width:1100px){.grid4{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.grid4{grid-template-columns:1fr}}
.rows{display:flex;flex-direction:column;gap:8px}

a.row:hover{border-color:var(--acc);text-decoration:none}
.row b{white-space:nowrap}.row span{flex:1;color:var(--mut)}.row em{color:var(--mut);font-style:normal;font-size:18px}
.row.done b{color:var(--mut);font-weight:500;font-size:12.5px}.row.done span b{color:var(--tx)}.row.done span{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;line-height:1.35}

.btn{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 22px;font-size:14.5px;color:var(--acc)}
.btn:hover{border-color:var(--acc);text-decoration:none}
.tiles{display:flex;gap:10px;flex-wrap:nowrap;overflow-x:auto;margin:14px 0 6px;padding-bottom:4px}
a.tile{display:block;flex:0 0 auto;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 14px;color:var(--tx);min-width:128px}

.st.run{background:rgba(13,150,104,.16);color:var(--ok)}
.st.appr{background:rgba(201,147,10,.16);color:#c9930a}
.st.rev{background:rgba(11,83,214,.13);color:var(--acc)}
.st.draft{background:rgba(139,92,246,.15);color:#8b5cf6}
.st.mut{background:rgba(125,125,125,.16);color:var(--mut)}
.st.crit{background:rgba(200,34,34,.15);color:var(--down)}
.rowwrap{position:relative}
.rowwrap .row{padding-right:38px}
.delf{position:absolute;top:0;right:0;bottom:0;display:flex;align-items:center;margin:0}
.del{background:none;border:none;color:var(--mut);font-size:17px;line-height:1;padding:6px 12px;cursor:pointer;border-radius:8px;opacity:.45}
.rowwrap:hover .del{opacity:1}
.del:hover{color:var(--down);background:rgba(200,34,34,.08)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(430px,1fr));gap:12px;margin-top:12px}
@media(max-width:520px){.fgrid{grid-template-columns:1fr}}
.fcard{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:13px 15px}
.fcard .fh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.fcard .fh b{font-size:14.5px}.fcard .fh span{font-size:12.5px;color:var(--mut);white-space:nowrap}
.fs{display:flex;align-items:center;gap:8px;margin:3px 0;font-size:13px}

.fs .fb{flex:1;height:13px}
.fs .fb i{display:block;height:100%;background:var(--acc);border-radius:3px;min-width:2px}
.fs .fb i.alt{background:var(--ok)}.fs .fb i.ga{background:#8b5cf6}
.fs .fn{flex:0 0 auto;font-variant-numeric:tabular-nums;font-size:12.5px}

.leak b{font-variant-numeric:tabular-nums}
.fdiv{margin:9px 0 3px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}

.rrow{display:flex;gap:8px;margin:10px 0 4px}
.rc{flex:1;background:rgba(125,125,125,.09);border-radius:9px;padding:6px 9px}
.rc b{display:block;font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.rc .rv{display:block;font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.25}
.rc .rb{display:block;font-size:11px;color:var(--mut)}
.fnds{list-style:none;margin:10px 0 0;padding:0}
.fnds li{position:relative;padding:2px 0 2px 16px;font-size:13px;color:var(--tx)}
.fnds li:before{content:"";position:absolute;left:0;top:9px;width:7px;height:7px;border-radius:50%}
.fnds li.crit:before{background:var(--down)}.fnds li.warn:before{background:#c9930a}.fnds li.ok:before{background:var(--ok)}
.nxt{margin-top:11px;background:var(--hl);border:1px solid var(--bd);border-radius:10px;padding:9px 12px}
.nxt .nxl{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
.nxt b{font-size:14px}.nxt p{margin:3px 0 0;font-size:13px;color:var(--mut)}
.fh .st{margin-left:8px}
.dirbox{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:20px 24px;margin:20px 0 8px}
.dirlab{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--mut)}
.dirh{font-size:19px;line-height:1.35;margin:4px 0 12px;text-transform:none;letter-spacing:0;color:var(--tx)}
.dirp{margin:0 0 9px;font-size:14px;line-height:1.6;color:var(--tx)}
.prio{display:flex;gap:13px;padding:11px 0;border-top:1px solid var(--bd)}
.prn{flex:0 0 26px;height:26px;line-height:26px;text-align:center;border-radius:13px;background:var(--acc);color:#fff;font-weight:700;font-size:13px}
.prc{flex:1;min-width:0}
.prt{font-size:15px;font-weight:600;margin-bottom:3px}
.prw{margin:0 0 5px;font-size:13.5px;color:var(--tx)}
.pre{margin:0 0 4px;font-size:13px;color:var(--mut);line-height:1.55}
.pre b{color:var(--tx);font-weight:600}
.prp{margin:4px 0 0;font-size:13px;color:var(--tx);border-left:2px solid var(--acc);padding-left:9px}
.vgrid{display:flex;flex-direction:column;gap:6px}
.vrow{display:flex;align-items:baseline;gap:9px;font-size:13.5px;flex-wrap:wrap}
.vrow .st{flex:0 0 auto;margin:0}
.vrow b{flex:0 0 auto;min-width:118px}
.vrow span:last-child{flex:1;min-width:220px;color:var(--mut)}
.nots{margin:0;padding-left:18px}
.nots li{font-size:13.5px;color:var(--tx);margin-bottom:5px;line-height:1.55}
.dirfoot{margin:16px 0 0;padding-top:12px;border-top:1px solid var(--bd);font-size:12px;color:var(--mut)}
@media(max-width:700px){.vrow b{min-width:0}}
.fnote{font-size:11.5px;color:var(--mut);margin:4px 0 0 176px;line-height:1.35}

/* ---------- camada de acabamento (01/10/2026) ----------
   Tipografia com duas vozes (display para títulos e números, texto para leitura),
   neutros com viés do azul da marca em vez de cinza puro, e profundidade por
   sombra em vez de só borda. Nada aqui renomeia classe: é uma camada por cima. */
:root{
  --f-disp:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --f-text:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --bg:#f3f5f9; --card:#ffffff; --tx:#10131a; --mut:#5a6377; --acc:#1552d8;
  --bd:#dde2ea; --bd-soft:#e8ecf3; --ok:#0a8f58; --down:#d02f2f; --warn:#b45309;
  --sh:0 1px 2px rgba(16,19,26,.05),0 2px 8px rgba(16,19,26,.04);
  --sh-up:0 2px 6px rgba(16,19,26,.07),0 10px 24px rgba(16,19,26,.07);
  --rad:14px;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#0b0d12; --card:#161a22; --tx:#eef1f7; --mut:#9aa5b8; --acc:#7aa6ff;
  --bd:#272d39; --bd-soft:#1f242e; --ok:#43d08d; --down:#ff7070; --warn:#e5a645;
  --sh:0 1px 2px rgba(0,0,0,.4); --sh-up:0 6px 22px rgba(0,0,0,.5);
}}
body{font-family:var(--f-text);font-size:14.5px;line-height:1.6;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1{font-family:var(--f-disp);font-size:27px;font-weight:800;letter-spacing:-.02em;
  text-wrap:balance;margin:0 0 2px}
h1 .mark{display:inline-block;width:28px;height:28px;vertical-align:-5px;margin-right:11px;
  background-size:contain;background-repeat:no-repeat;background-position:center}
h2{font-family:var(--f-disp);font-size:12px;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;color:var(--mut);border-top:1px solid var(--bd-soft);
  padding-top:22px;margin:32px 0 14px}
h3{font-family:var(--f-disp);letter-spacing:-.01em}
.sub{font-size:13px;color:var(--mut)}
code,.mono{font-family:var(--f-mono);font-size:12.5px}
.card,table.t,a.tile,.row,.fcard,#md{box-shadow:var(--sh);border-color:var(--bd-soft)}
.card,a.tile,.row,.fcard{border-radius:var(--rad)}
a.tile,.row{transition:box-shadow .16s ease,border-color .16s ease,transform .16s ease}
a.tile:hover,a.row:hover{box-shadow:var(--sh-up);border-color:var(--bd);
  transform:translateY(-1px)}
/* O card do app é área de leitura, não botão: nada muda no hover. A regra antiga
   trocava a sombra, e num card sem sombra isso aparecia como animação. */
.fcard,.fcard:hover{transition:none!important;transform:none!important}
/* big numbers: the first thing anyone reads on the page */
.tiles{gap:12px;margin:18px 0 4px;padding-bottom:10px}
a.tile{padding:13px 17px;min-width:148px}
.tile .tl{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
  color:var(--mut)}
.tile .tv{font-family:var(--f-disp);font-size:25px;font-weight:800;letter-spacing:-.025em;
  margin-top:3px}
.tile .ts{font-size:11.5px;color:var(--mut)}
/* tables read as data, not as prose */
table.t{border-radius:var(--rad);font-variant-numeric:tabular-nums}
table.t th{font-family:var(--f-disp);font-size:11px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;background:var(--bd-soft);border-bottom:1px solid var(--bd)}
table.t td{padding:9px 13px;border-bottom:1px solid var(--bd-soft)}
table.t tbody tr:hover td,table.t tr:hover td{background:rgba(125,140,170,.06)}
.twrap{border-radius:var(--rad)}
/* buttons */
.btn{font-family:var(--f-disp);font-weight:600;font-size:13.5px;padding:9px 18px;
  border-radius:999px;box-shadow:var(--sh);transition:all .16s ease}
.btn:hover{border-color:var(--acc);box-shadow:var(--sh-up);transform:translateY(-1px)}
.pill,.st{font-family:var(--f-disp);font-weight:600;font-size:11.5px;letter-spacing:.02em}
/* status colours carry meaning, so keep them out of the accent */
.st.run,.st.appr{background:rgba(10,143,88,.14);color:var(--ok)}
.st.crit{background:rgba(208,47,47,.14);color:var(--down)}
.st.rev,.st.draft{background:rgba(180,83,9,.14);color:var(--warn)}
/* the lanes strip and any scroller get a thin, rounded bar */
.tiles,.hrow,.twrap{scrollbar-width:thin;scrollbar-color:var(--bd) transparent}
.tiles::-webkit-scrollbar,.hrow::-webkit-scrollbar,.twrap::-webkit-scrollbar{height:9px}
.tiles::-webkit-scrollbar-track,.hrow::-webkit-scrollbar-track,
.twrap::-webkit-scrollbar-track{background:transparent}
.tiles::-webkit-scrollbar-thumb,.hrow::-webkit-scrollbar-thumb,
.twrap::-webkit-scrollbar-thumb{background:var(--bd);border-radius:999px;
  border:3px solid transparent;background-clip:content-box}
.tiles::-webkit-scrollbar-thumb:hover,.hrow::-webkit-scrollbar-thumb:hover,
.twrap::-webkit-scrollbar-thumb:hover{background:var(--mut);background-clip:content-box}
.hrow{background:transparent;border:0;padding:0;border-radius:0}
.hcol{flex:0 0 clamp(280px,26vw,360px);min-width:0}
a:focus-visible,button:focus-visible,.btn:focus-visible{outline:2px solid var(--acc);
  outline-offset:2px;border-radius:8px}
.dirlist,.prlist{margin:10px 0 0;padding-left:18px;list-style:none}
.dirlist>li,.prlist>li{position:relative;margin:0 0 7px;font-size:13.5px;line-height:1.5;
  color:var(--tx)}
.prlist>li{color:var(--mut);font-size:13px;margin-bottom:5px}
.dirlist>li::before,.prlist>li::before{content:"";position:absolute;left:-14px;top:.62em;
  width:5px;height:5px;border-radius:50%;background:var(--acc);opacity:.75}
.prlist>li::before{background:var(--mut);opacity:.5}
.dirp{display:none}
.dapps{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));
  margin:14px 0 4px;align-items:start}
.dapp{padding:14px 16px}
.dah{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.dah b{font-family:var(--f-disp);font-size:14.5px;font-weight:700}
.drank{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;
  border-radius:6px;background:var(--acc);color:#fff;font-size:11.5px;font-weight:700;flex:none}
.st.d-dobrar{background:rgba(10,143,88,.16);color:var(--ok)}
.st.d-consertar{background:rgba(180,83,9,.16);color:var(--warn)}
.st.d-manter{background:rgba(125,140,170,.16);color:var(--mut)}
.st.d-congelar{background:rgba(125,140,170,.12);color:var(--mut)}
.dapp .prlist{margin-top:6px}
.dcall{color:var(--tx)!important;font-weight:600}
.fcard[id]{scroll-margin-top:18px}
.fdet{margin-top:10px;border-top:1px solid var(--bd-soft);padding-top:9px}
.fdet>summary{cursor:pointer;list-style:none;font-family:var(--f-disp);font-size:11.5px;
  font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);
  display:flex;align-items:center;gap:7px}
.fdet>summary::-webkit-details-marker{display:none}
.fdet>summary::before{content:"›";font-size:15px;transition:transform .15s}
.fdet[open]>summary::before{transform:rotate(90deg)}
.fdet>summary:hover{color:var(--acc)}
.fdet table.t{font-size:12.5px}
.fdet table.t td,.fdet table.t th{padding:6px 10px}
.fgrid.one{grid-template-columns:1fr!important;gap:14px}
.fgrid.one>.fcard{border:1px solid var(--bd-soft);border-radius:var(--rad);
  box-shadow:none;background:var(--card);padding:0;overflow:hidden}
/* a faixa do topo separa um app do outro melhor que uma linha fina entre eles */
.fgrid.one>.fcard>.fh{background:var(--bd-soft);margin:0;padding:12px 16px;
  border-bottom:1px solid var(--bd)}
.fgrid.one>.fcard>.fmeta{padding:9px 16px 0}
.fgrid.one>.fcard>.fcols{padding:14px 16px 4px}
.fgrid.one>.fcard>.fdet{margin:0;padding:12px 16px 14px;border-top:1px solid var(--bd-soft);
  background:var(--bg)}
.fcols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;
  align-items:start}
@media(max-width:820px){.fcols{grid-template-columns:1fr;gap:12px}}
.fcol{min-width:0}
.fcol>.fnds{margin-top:0}
.fdet .ascgrid{grid-template-columns:repeat(auto-fit,minmax(118px,1fr))}
.fdetcols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;
  align-items:start}
@media(max-width:1100px){.fdetcols{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:760px){.fdetcols{grid-template-columns:1fr}}
.fdetcols>div{min-width:0;display:flex;flex-direction:column;gap:14px}

<body><div class="wrap"><p class="sub" style="font-size:12px;margin:0 0 14px">Exportado em 2026-10-01 16:35 · fonte: Lab Hub local</p><p class="sub"><a href="../index.html">← hub</a> · <code>_GambitStudio/LEARNINGS-INDEX.md</code></p><div id="md"></div><script>const RAW="# LEARNINGS-INDEX \u2014 mapa compacto do LEARNINGS.md\n\n> Auto-loaded em toda sess\u00e3o, no lugar do `LEARNINGS.md` inteiro (220 KB). Cada linha \u00e9 a REGRA de um item; o texto completo vive em `LEARNINGS.md` e se l\u00ea sob demanda: `grep -n '^## 57' LEARNINGS.md` \u2192 Read com offset/limit s\u00f3 naquele trecho.\n> **Todo item novo em `LEARNINGS.md` ganha a sua linha aqui no MESMO edit.** O detector `learnings_index` do `orchestrator/scan.py` acusa heading sem linha no \u00edndice (e linha sem heading).\n> Formato: `- **#N T\u00edtulo (contexto, data)** \u2014 regra`. O n\u00famero \u00e9 o do heading, com sufixo (`#0b`, `#57d`). Os dois `## 85.` e os dois `## 87.` aparecem ambos, desambiguados entre par\u00eanteses, at\u00e9 a renumera\u00e7\u00e3o.\n\n- **#0 Archive padr\u00e3o atual: LOCAL com Xcode 26.x + ASC API key (lab, 30/08/2026)** \u2014 Archive local com o Xcode mais novo (`/Applications/Xcode 2.app`), `-destination 'generic/platform=iOS'` e cloud signing pela chave (`-allowProvisioningUpdates` + `-authenticationKeyPath/KeyID/IssuerID`). GitHub Actions n\u00e3o \u00e9 pago: tag `release/N` s\u00f3 pra hist\u00f3rico. Conferir plist COMPILADO (#52) e build `VALID` em `GET /v1/builds`. SPM sempre por `url:` + `branch: main`, nunca `path:`.\n- **#0b App legado CocoaPods \u2192 archive: 3 muros em sequ\u00eancia (iPhotos, jun/2026)** \u2014 Com SDK iOS 26: (1) `AssetsLibrary` sumiu \u2014 trocar `ALAsset*` por `PHPhotoLibrary` e tirar libs mortas do target; (2) \"maximum number of certificates\" \u2014 `DELETE /v1/certificates` nos Development \"Created via API\"; (3) `UILaunchStoryboardName` sem `.storyboard` no valor e `CFBundleShortVersionString` maior que a vers\u00e3o da LOJA, n\u00e3o a do pbxproj. Pods committados = sem `pod install` no CI.\n- **#1 ASC API \u2014 o que ela N\u00c3O faz (lab)** \u2014 Por API: bundleId, capabilities e subs inteiras (grupo \u2192 sub \u2192 availability com TODOS os territ\u00f3rios \u2192 pre\u00e7o por `equalizations` \u2192 intro offer por territ\u00f3rio \u2192 screenshot \u2192 PATCH no-op tira do MISSING_METADATA stale). S\u00f3 web UI: criar app, App Group/iCloud container, PPO por deliver, App Privacy, pricing, 1\u00ba grupo de subs (vai JUNTO de uma vers\u00e3o). NUNCA sondar `POST /v1/reviewSubmissions`: submission vazia fica presa pra sempre.\n- **#2 Provisioning profile mismatch \u2014 diagn\u00f3stico (PeptideCalc)** \u2014 \"doesn't match the entitlements file\": conferir o `.entitlements`, a capability via API e se o RESOURCE (App Group/iCloud) existe no portal. Limpar `~/Library/Developer/Xcode/UserData/Provisioning Profiles/*.mobileprovision` e buildar com `-allowProvisioningUpdates`. \u00daltima cartada: tirar a entitlement temporariamente pra destravar o build.\n- **#3 iCloud no v1 n\u00e3o vale a pena (PeptideCalc)** \u2014 CloudKit container + App Group exigem portal manual e bloqueiam o build por horas. Tirar do v1 (entitlements, project.yml, xcstrings, Settings, StorageKeys/FeatureFlags; `scripts/remove-icloud.sh`). Exce\u00e7\u00e3o barata sem container: iCloud KV Store (#75).\n- **#4 HealthKit s\u00f3 se for USAR na UI (PeptideCalc, soninho)** \u2014 Review rejeita HealthKit sem uso vis\u00edvel: sempre uma tela mostrando os dados. Nunca declarar `com.apple.developer.healthkit.access = [health-records]` (entitlement cl\u00ednico restrito, mata o prompt em sil\u00eancio); s\u00f3 `healthkit = true`. O prompt dispara 1\u00d7: pedir tamb\u00e9m na tela que consome, com fallback pra `openSettingsURLString`.\n- **#5 xcstrings \u2014 pegadinhas (lab)** \u2014 `%@` pra String, `%lld` pra Int; nunca `\\(var)` cru dentro de `String(localized:)`. `InfoPlist.xcstrings` pra CFBundleDisplayName e NS*UsageDescription. 39 locales oficiais da loja; `translate-xcstrings.py` pra massa, `verify-localization.py` pra hardcoded. Limites da ASC medidos com `len()` do Python, nunca `wc -c`.\n- **#6 NavigationStack + TabView \u2014 padr\u00e3o (lab)** \u2014 NavigationStack s\u00f3 em tab com push; `.navigationTitle` + `.toolbar`, sem HStack header custom (nav bar fantasma). List: `.background(AppColors.background.ignoresSafeArea())`; ScrollView: ZStack com o background. Nav bar opaca global via `UINavigationBarAppearance` no init do App.\n- **#7 Modal vs Push (lab)** \u2014 UI que CRIA/EDITA = `.sheet`; DETALHE de algo existente = push (`NavigationLink` + `.navigationDestination(for:)` no parent).\n- **#8 Watch app embed bug (Xcode 26)** \u2014 \"watchOS X must be installed\" com destination generic/iOS: remover `embed: true` da dependency da watch no `project.yml` durante o dev; devolver s\u00f3 no archive.\n- **#9 xcodegen \u2014 quando regenerar (lab)** \u2014 `xcodegen generate` SEMPRE ao adicionar/remover arquivo, mudar entitlements, dependencies, Info.plist path ou target. NUNCA editar `project.pbxproj` \u00e0 m\u00e3o.\n- **#10 Calculator UX (PeptideCalc)** \u2014 Row inteira toc\u00e1vel (`.contentShape` + `onTapGesture` focando o campo), `@FocusState` com enum e toolbar Next/Done, labels com `minimumScaleFactor(0.7)`, TextField com `.fixedSize(horizontal: true)`.\n- **#11 Shadows s\u00f3 preto (lab)** \u2014 `.softShadow()` (0.05/6/2) e `.elevatedShadow()` (0.08/10/4). PROIBIDO `.shadow(color: AppColors.primary\u2026)` ou qualquer cor n\u00e3o-preta \u2014 quebra o premium feel no dark.\n- **#12 Light mode default (lab)** \u2014 `@AppStorage(\"appearanceMode\") = \"light\"`. Background light `0xF2F2F7` (n\u00e3o branco puro), cards `0xFFFFFF` / dark `0x1A1A1A`. **SUPERADO 27/09/2026: um esquema por app, sem toggle (RULES).**\n- **#13 fastlane sync_metadata \u2014 gotchas (blw, 13/06/2026)** \u2014 Sempre `LC_ALL=en_US.UTF-8 LANG=en_US.UTF-8`. Locale novo precisa dos 7 arquivos (name, subtitle, keywords, description, promotional_text, release_notes, support_url). O deliver pode ser NO-OP silencioso: SEMPRE verificar via API e corrigir com PATCH direto \u2014 keywords/whatsNew em `appStoreVersionLocalizations`, name/subtitle em `appInfoLocalizations` do appInfo `PREPARE_FOR_SUBMISSION`.\n- **#14 Estilo de execu\u00e7\u00e3o com o Jo\u00e3o (lab)** \u2014 Sem pedir confirma\u00e7\u00e3o, device first, respostas curtas em PT-BR sem pre\u00e2mbulo, c\u00f3digo em ingl\u00eas, sil\u00eancio entre build \u2192 install \u2192 \"rodando\". Polish iterativo: faz \u2192 instala \u2192 ele fala \"fix Y\" \u2192 repete.\n- **#15 Cache de provisioning local (lab)** \u2014 Capability mudou no portal e o build ainda falha: `rm ~/Library/Developer/Xcode/UserData/Provisioning\\ Profiles/*.mobileprovision` e rebuildar com `-allowProvisioningUpdates` + ASC key (`scripts/ios-dev/clear-provisioning-cache.sh`).\n- **#15b @IBOutlet! n\u00e3o conectado = crash nil ao portar VC (iPhotos AR, 15/06/2026)** \u2014 UIViewController de storyboard portado de outro app: outlets sem conex\u00e3o na cena de destino ficam nil e crasham em `viewDidLoad`. Auditar `grep -n \"@IBOutlet\"` e usar `outlet?.` nos n\u00e3o-essenciais; achar a linha com `devicectl \u2026 launch --console` + `grep \"nil while\"`.\n- **#15c GPT image-gen como ferramenta de DESIGN offline (iPhotos, 15/06/2026)** \u2014 Chave em `keys/openai.env`, s\u00f3 pra gerar assets em DEV, nunca em runtime. Gerar refer\u00eancia \u2192 VER com Read \u2192 tra\u00e7ar pra vetor/c\u00f3digo \u2192 validar offline com script CoreGraphics antes de gastar round-trip de device. A IA \u00e9 o moodboard; o c\u00f3digo \u00e9 meu.\n- **#16 devicectl idioms (lab)** \u2014 `xcrun devicectl list devices` / `device install app` / `device process launch`. \"Launched application\" sem app rodando = foi desinstalado. POSIX 85 ao lan\u00e7ar build Debug = debug dylib do Xcode 16+: rebuildar com `ENABLE_DEBUG_DYLIB=NO`. \"device was not unlocked\" = destravar o aparelho.\n- **#17 Templates pr\u00e9-prontos s\u00e3o diferencial (PeptideCalc)** \u2014 Templates embarcados (JSON em Resources, service singleton, cards clic\u00e1veis) cobrem 90% dos casos sem o usu\u00e1rio pensar; incluir mainstream + nicho.\n- **#18 Hub workflow pra pr\u00f3ximo app (lab)** \u2014 \"create app de X\": ler o lab + LEARNINGS + skill `/create-ios-app`, rodar as 6 fases sem pausar, e documentar aqui qualquer problema NOVO antes de prosseguir.\n- **#19 QA dirigido no simulador \u2014 harness e gotchas (Calc+, jul/2026)** \u2014 `tools/sim-qa` (idb em PONTOS 393\u00d7852; long-press `--duration 1.2` pra edit mode), Stop hook anti-parada com checklist `\u2b1c`, gsutil como or\u00e1culo de backup. Sim N\u00c3O aplica jetsam (OOM \u00e9 device-only), Firebase Auth n\u00e3o persiste entre builds, idb n\u00e3o flipa UISwitch, `CODE_SIGNING_ALLOWED=NO` quebra keychain, cfprefsd cacheia o plist.\n- **#20 Calc+ backup \u2014 nomes UUID na nuvem (jul/2026)** \u2014 Upload salva `{UUID}xor.jpg` sem mapear pro nome local: restore duplica importadas, achata pastas e delete n\u00e3o remove da nuvem (privacidade). Jo\u00e3o mandou reverter o fix \u2014 reavaliar como `/develop-task`. \"App fecha sozinho\" = OOM no restore: segurar Data comprimido e decodificar 1 por vez (`d4a37c65`).\n- **#21 Maestro pra QA de simulador (19/07/2026)** \u2014 Tap por coordenada (idb) mis-tapa (banner de ad, unlock no 4\u00ba d\u00edgito). Jornada roteiriz\u00e1vel \u2192 Maestro (`tools/sim-qa/maestro/`, `JAVA_HOME=/usr/local/opt/openjdk`); explora\u00e7\u00e3o sem label \u2192 idb.\n- **#22 Build aceito mas nunca aparece na ASC = CFBundleIconName ausente (Calc+, 21/07/2026)** \u2014 actool do Xcode 26 n\u00e3o injeta `CFBundleIconName` quando `CFBundleIcons` j\u00e1 existe parcial; altool passa, o ingest descarta em sil\u00eancio. Inspecionar o Info.plist do IPA COMPILADO (`PlistBuddy -c \"Print :CFBundleIconName\"`); no fonte, `:CFBundleIconName = AppIcon` na raiz E em `CFBundleIcons:CFBundlePrimaryIcon`, mais `ITSAppUsesNonExemptEncryption = false`.\n- **#23 Compra StoreKit REAL headless em app CocoaPods (Calc+, 22/07/2026)** \u2014 `SKTestSession` num test target criado via gem `xcodeproj` (`LC_ALL=en_US.UTF-8`), xcconfig s\u00f3 com search-paths dos Pods (sem `OTHER_LDFLAGS`), resets `#if DEBUG` nos singletons de IAP no `setUp`, datas por `timeIntervalSince1970` com `accuracy`. Ru\u00eddo de log (coretelephony, keychain) n\u00e3o \u00e9 falha.\n- **#24 Xcode Cloud \u2014 a API N\u00c3O cria o produto (WTMP, jul/2026)** \u2014 `POST /v1/ciProducts` d\u00e1 403; o 1\u00ba workflow de um repo \u00e9 GUI-only (Xcode \u2192 Create Workflow), e app xcodegen precisa committar o `.xcodeproj` + scheme shared pra o Xcode achar. Billing do GitHub travado: regularizar \u00e9 mais r\u00e1pido que onboardar o Xcode Cloud.\n- **#31 Xcode Cloud via ASC API \u2014 archive sem GitHub Actions (Calc+, 23/07/2026)** \u2014 `scripts/asc/xcode_cloud.py`. 5 muros: branch fora da start condition (PATCH do objeto COMPLETO, sen\u00e3o 500); `Package.resolved` do `.xcworkspace` committado; scheme arquiv\u00e1vel no workflow; ARCHIVE sem destination s\u00f3 gera artifact (baixar + altool); o Xcode Cloud sobrescreve `CFBundleVersion` \u2014 conferir a conven\u00e7\u00e3o do app (Calc+ usa short version num\u00e9rica > \u00faltimo build).\n- **#25 Torch/lanterna n\u00e3o liga em background (WTMP, 23/07/2026)** \u2014 `torchMode = .on` sem erro mas `isTorchActive == false` com app em background ou tela bloqueada. Solu\u00e7\u00e3o de PRODUTO: modo tela preta em FOREGROUND (`UIScreen.main.brightness = 0`). Strobe com `DispatchSourceTimer`, limpando a flag ANTES do `cancel()`.\n- **#26 fastlane deliver DUPLICA screenshots no re-upload (WTMP, 23/07/2026)** \u2014 `overwrite_screenshots` n\u00e3o \u00e9 confi\u00e1vel (sets com 7-10 prints). Por `appScreenshotSet`: GET, `DELETE` duplicatas por fileName (204 sem body), `PATCH` a relationship reordenada 01..05. SEMPRE conferir a contagem via API depois do deliver.\n- **#27 fastlane deliver pula subtitle em alguns locales (WTMP, 23/07/2026)** \u2014 Subtitle NULL em pt-BR/es-ES com exit 0. `PATCH /v1/appInfoLocalizations/{id}` (appInfo `PREPARE_FOR_SUBMISSION`). Conferir name + subtitle de TODOS os locales via API depois de qualquer sync.\n- **#28 Cert-limit trava o archive normal no CI (WTMP, 23/07/2026)** \u2014 \"maximum number of certificates\" tamb\u00e9m no archive de Development: `GET /v1/certificates` \u2192 DELETE os `DEVELOPMENT` \"Created via API\". Fix de infra n\u00e3o precisa de commit: `gh run rerun <id>`.\n- **#29 PrivacyInfo.xcprivacy obrigat\u00f3rio com Firebase (WTMP, 23/07/2026)** \u2014 Sem ele, ITMS-91053 e bloqueio. Em `Resources/`, bundlado no ROOT do `.app`. Conte\u00fado: `NSPrivacyTracking = false`, DeviceID/ProductInteraction/CrashData/PerformanceData not-linked, UserDefaults com reason `CA92.1`.\n- **#30 Keychain SOBREVIVE ao uninstall (WTMP, 23/07/2026)** \u2014 Segredo de install anterior faz `isSet` voltar true em fresh install. No `init` do App: flag `hasLaunchedBefore` em UserDefaults ausente \u2192 `KeychainService.removeAll()`. Vale pra senha, token e flag de compra.\n- **#32 Asset some S\u00d3 no build de nuvem = case do git \u2260 disco (Calc+, 27/07/2026)** \u2014 Rename s\u00f3 de mai\u00fascula n\u00e3o entra no git (`core.ignorecase`); lookup de asset catalog \u00e9 case-sensitive. Diagn\u00f3stico: `xcrun assetutil --info Assets.car` do IPA vs `git ls-files` vs `ls`. Fix: `git mv Nome __tmp && git mv __tmp nome`. N\u00c3O setar `core.ignorecase=false`; renames sempre via `git mv`.\n- **#33 Build \"sumiu\" mas o CI tinha FALHADO (AirDraw, 28/07/2026)** \u2014 Antes de diagnosticar ingest silencioso, conferir a CONCLUS\u00c3O do run DA TAG (`gh run list -b release/X`), nunca `--limit 1` logo ap\u00f3s o push. Portrait-only + iPad exige `UIRequiresFullScreen = YES`. SDK velho sem PrivacyInfo (Firebase 6.x) d\u00e1 ITMS-91061.\n- **#34 Persona FREE no simulador exige limpar o storeUser.db (Calc+, 31/07/2026)** \u2014 Assinatura de teste vive no `storeUser.db` do AppGroup do StoreKit (tabela `iap_subscription_status`) e sobrevive ao uninstall. Persona free = uninstall + limpar essa tabela, ou simulador novo/erase.\n- **#35 PPO: ASC re-clona os prints herdados DEPOIS do clear (Cloak/Meus Gastos, 08/2026)** \u2014 Dedup por `sourceFileChecksum` (md5 do PNG local), nunca por fileName; o re-clone chega HORAS depois, ent\u00e3o re-verificar ~1h ap\u00f3s o upload e de novo ANTES do `started:true`. Subir os prints em TODOS os display types de iPhone da default page (o 6.5\" \u00e9 o que a UI mostra). Parar: `PATCH started:false`; draft nunca rodado deleta via API ap\u00f3s cancelar a reviewSubmission.\n- **#36 Rebrand de app morto na loja sem release + prints via IA (soninho, 03/08/2026)** \u2014 `POST /v1/appStoreVersions` cria vers\u00e3o edit\u00e1vel \u2192 name/subtitle destravam via `appInfoLocalizations`; s\u00f3 o \u00cdCONE exige bin\u00e1rio. Prints de concorrente: raspar `serialized-server-data` de apps.apple.com (`competitor_intel.py`). Checar termos ingleses com store=br/es. `edit_image` do Gemini devolve meia resolu\u00e7\u00e3o.\n- **#37 Rejei\u00e7\u00e3o tripla: primer de permiss\u00e3o, stealth, iPad (WTMP, 04/08/2026)** \u2014 5.1.1(iv): primer s\u00f3 com UM bot\u00e3o neutro que leva ao prompt do sistema (sem \"Agora n\u00e3o\"). 2.5.14: nada de silent/stealth/spy/secret em UI, usage description e metadata (39 locales). Guideline 4: app iPhone-only \u00c9 testado no iPad (ScrollView com `minHeight: geo.size.height`, texts `.fixedSize(horizontal: false, vertical: true)`). Re-submiss\u00e3o: `canceled:true` na submission antiga antes da nova.\n- **#38 Firebase sem Google Analytics vinculado = dados descartados (blw, 06/08/2026)** \u2014 `GET \u2026/projects/<id>/analyticsDetails` 404 = n\u00e3o vinculado; `POST :addGoogleAnalytics` com `analyticsAccountId [conta GA]` conserta sem build. GA4 por CLI s\u00f3 via service account `ga-admin` (`keys/ga_admin_sa.json`, Admin na conta GA). BigQuery export via `bigQueryLinks` (sandbox sem billing expira em 60 dias).\n- **#39 PPO submete e inicia via API (Bible Pills, 07/08/2026)** \u2014 `reviewSubmissionItems` ACEITA `appStoreVersionExperiment`: POST reviewSubmission \u2192 item \u2192 `submitted:true`. `started:true` antes da aprova\u00e7\u00e3o d\u00e1 409; depois, o mesmo PATCH inicia o teste.\n- **#39b `started` de PPO vem NULO com o teste rodando (Walk/iPhotos/Calc+, 30/08/2026)** \u2014 Nunca concluir que um PPO est\u00e1 parado pelo campo `started`; o sinal \u00e9 `startDate` preenchido + `state: APPROVED` (o PATCH responde 409 \"already running\"). Localizar a default page ANTES de submeter experimento de ordem, sen\u00e3o o controle n\u00e3o isola a ordem.\n- **#40 2.5.14 spy/stealth em TODOS os 39 locales (WTMP, 13/08/2026)** \u2014 Varrer a metadata LIVE via API com l\u00e9xico multil\u00edngue (casus, \u03ba\u03b1\u03c4\u03ac\u03c3\u03ba\u03bf\u03c0, \u091c\u093e\u0938\u0942\u0938, \u306e\u305e\u304d, \u5077\u770b|\u76e3\u8996, \ubab0\ub798, \u0e41\u0e2d\u0e1a, pengintip, esp\u00eda, \u0448\u043f\u0438\u043e\u043d, \u062a\u062c\u0633\u0633\u2026), inclusive palavras que descrevem o INTRUSO. Falsos positivos: \"Gizlilik Politikas\u0131\", \"mode senyap\", \"\ube44\ubc00\ubc88\ud638\". Fix por PATCH em `appStoreVersionLocalizations` (keywords \u2264100 por `len()`).\n- **#41 Simulador com m\u00faltiplas sess\u00f5es: nunca \"booted\" (18/08/2026)** \u2014 Todo simctl/idb/sim-mcp/maestro passa o UDID expl\u00edcito do SEU device; `booted` cai no simulador da outra sess\u00e3o.\n- **#42 Seeder DEBUG de HealthKit no simulador (Walk, 18/08/2026)** \u2014 `CODE_SIGNING_ALLOWED=NO` remove os entitlements (auth falha Code=4): assinar normal. Pedir auth em `sceneDidBecomeActive`, n\u00e3o em `didFinishLaunching`; logar com `NSLog`. O sheet do Health \u00e9 processo separado: s\u00f3 clique de mouse real (`cliclick`). `appleExerciseTime` n\u00e3o \u00e9 grav\u00e1vel; auth negada s\u00f3 reseta com `simctl erase`.\n- **#43 Storyboard `fixedFrame=\"YES\"` quebra S\u00d3 no iPad (AirDraw, 19/08/2026)** \u2014 Rejei\u00e7\u00e3o 2.1(b)/4: view sem constraints vira ret\u00e2ngulo de iPhone no canto e esconde o caminho at\u00e9 a compra. `grep 'fixedFrame=\"YES\"' *.storyboard` em app legado com iPad; fix em c\u00f3digo (`frame = view.bounds` + autoresizingMask). 2.3.8: `CFBundleDisplayName` parecido com o nome da loja.\n- **#44 1\u00ba grupo de subs cai do pacote ao re-submeter via API (AirDraw, 20/08/2026)** \u2014 Cancelar a submission e recriar s\u00f3 com a vers\u00e3o aprova a vers\u00e3o SEM as subs; o 1\u00ba grupo s\u00f3 entra junto de vers\u00e3o ainda n\u00e3o live (custa vers\u00e3o + build novo). Com 1\u00ba grupo: re-submiss\u00e3o pelo web UI, ou re-adicionar as subs l\u00e1 ANTES do `submitted:true`; conferir itens tipo 18/19 na submission.\n- **#45 Liquid Glass habilitado no Walk \u2014 exce\u00e7\u00e3o \u00e0 regra (21/08/2026)** \u2014 Por pedido expl\u00edcito do Jo\u00e3o: `UIDesignRequiresCompatibility = false` nos 3 targets, helpers `UISettings/LiquidGlass.swift` gated `#available(iOS 26)`. `Glass` condicional dentro de `@ViewBuilder` quebra \u2014 computed property `@available`. Os outros apps seguem compat YES at\u00e9 ele pedir app a app.\n- **#46 Lab Hub morto com exit 2 = TCC do python do LaunchAgent (22/08/2026)** \u2014 `/usr/bin/python3` resolve pro python do Xcode ativo, sem grant pra ~/Documents (nega sem prompt sob launchd). O plist usa `/usr/local/bin/python3` (homebrew, mostra o prompt). `sample <pid>` travado em `__open` = prompt TCC pendente.\n- **#47 Liquid Glass em UIKit legado + automa\u00e7\u00e3o de sim iOS 26 (College, 22/08/2026)** \u2014 `UIGlassEffect` em `UIVisualEffectView`, `UIButton.Configuration.glass()`, sem `configureWithOpaqueBackground` nas bars, backdrop colorido atr\u00e1s. idb N\u00c3O enxerga iOS 26: Maestro por texto (tab bar por ponto). Card de review preso: `kill -9` do `StoreKitUIService`. UserDefaults do sim: `plutil` no plist do container + `kill -9 cfprefsd`. `DEVELOPER_DIR` do Xcode 2.app em tudo.\n- **#46b Liquid Glass habilitado no iPhotos \u2014 2\u00aa exce\u00e7\u00e3o (22/08/2026)** \u2014 `UI/GlassKit.swift` gated iOS 26 com fallback flat; s\u00f3 o sim iOS 26 renderiza; arquivo novo via gem `xcodeproj`. Maestro no iOS 26: alertas de sistema toc\u00e1veis por texto, `hideKeyboard` falha em number pad (toolbar \"OK\"), `stopApp` n\u00e3o mata (`simctl terminate`). `viewWillAppear` que s\u00f3 recarrega se a contagem mudou deixa edi\u00e7\u00e3o stale \u2014 recarregar sempre.\n- **#48 `subscriptionAvailabilities` \u00e9 IMUT\u00c1VEL (Hair Schedule, 25/08/2026)** \u2014 Sem PATCH/DELETE/relationship CREATE (403): os 175 territ\u00f3rios v\u00e3o de uma vez no POST de cria\u00e7\u00e3o (`GET /v1/territories?limit=200` + `availableInNewTerritories: true`). Consertar = recriar a sub com productId NOVO (o antigo fica queimado pra sempre).\n- **#49 PaywallKit rotulava semanal como \"Daily Plan\" (25/08/2026)** \u2014 StoreKit entrega P1W como `.day` \u00d7 7. O kit normaliza (`PurchasePeriod.normalised`), wording de per\u00edodo localizado via `PurchasePeriodNames`, e sele\u00e7\u00e3o do plano tamb\u00e9m no `onChange(of: store.products)`. Todo `PurchaseScaffold` passa `periodNames`.\n- **#50 Simulador APLICA o `.storekit` do scheme via `simctl launch` (25/08/2026)** \u2014 Com Xcode 26.1 + `storeKitConfiguration` no project.yml o paywall carrega produtos sem Xcode Run. Testar antes de montar harness de SKTestSession (#23).\n- **#48b Permiss\u00e3o que o iOS NUNCA pergunta = tela preta (Neon, 25/08/2026)** \u2014 Alerta de permiss\u00e3o faz o app resignar active; sem `willResignActive` em ~3s, o sistema n\u00e3o desenhou o prompt. Isolar app \u00d7 aparelho com bundle id novo (no pbxproj, n\u00e3o na linha de c  Crash-free agregado mistura TestFlight com produ\u00e7\u00e3o (27/08/2026)** \u2014 Puxar `crashFreeUsersRate` por `appVersion` e cruzar com a vers\u00e3o LIVE (iTunes lookup) antes de chamar de hotfix; build de dev crashando n\u00e3o \u00e9 incidente. GA4 com build number e loja com short version = cruzamento imposs\u00edvel, dizer isso.\n- **#55 Declarar o nome do evento n\u00e3o \u00e9 logar (27/08/2026)** \u2014 Constante num enum que ningu\u00e9m chama nunca chega no GA4; evento ausente no GA4 pode ser \"ningu\u00e9m passou por ali\" ou \"release novo demais\". S\u00f3 o source resolve: `verify-analytics.py` l\u00ea literais + usos. Nunca acusar gap s\u00f3 com o GA4.\n- **#56 `GoogleService-Info.plist` na pasta mas fora do TARGET (27/08/2026)** \u2014 Plist fora do target n\u00e3o vai pro bundle: `configure()` n\u00e3o acha config e o app publica sem telemetria. `grep -c \"GoogleService-Info.plist\" project.pbxproj` zero em projeto sem xcodegen = fora do target. Est\u00e1 no pr\u00e9-release checklist.\n- **#57 Upload longo na ASC morre com 401: JWT vale 20 min (Calc+/Walk, 28/08/2026)** \u2014 Token em cache global re-emitido (`exp - now < 300`), header fresco em CADA request. Upload em massa \u00e9 PARALELO (ThreadPool ~10 por locale), retry s\u00f3 em 429/5xx/timeout e reconcilia\u00e7\u00e3o por `sourceFileChecksum` (`--resume`, find-or-create idempotente). Promover tratamento n\u00e3o cobre todos os display types \u2014 conferir onde o vencedor existia.\n- **#57b 36 locales de metadata via API (Hair Schedule, 28/08/2026)** \u2014 C\u00f3digos regionais obrigat\u00f3rios: `ar-SA`, `de-DE`, `fr-FR`, `nl-NL`. POST em `appStoreVersionLocalizations` j\u00e1 cria o `appInfoLocalization` (POST nele d\u00e1 DUPLICATE) \u2192 GET + PATCH name/subtitle. Locale sem prints herda o prim\u00e1rio. Cancelar submission deixa `DEVELOPER_REJECTED` (edit\u00e1vel); 1\u00ba item pode dar 500 transiente, retry.\n- **#57c PPO em 41 locales sem a arte original + upload PARALELO (Walk, 28/08/2026)** \u2014 Reconstruir a base sem texto a partir das variantes localizadas (`reconstruct_base.py`, difus\u00e3o 2D), headlines por CoreText (`render_headlines.swift`, `kCTLanguageAttributeName`, escala menor pra CJK/\u00edndico). `parallel_upload.py` (ThreadPool 8, idempotente por checksum): 31 sets em 3 min.\n- **#57d ASC API: 3600 requests/HORA por CHAVE (Meus Gastos, 28/08/2026)** \u2014 Cota compartilhada entre todas as sess\u00f5es da mesma `[chave]` (header `X-Rate-Limit: user-hour-rem`). Cada set de 5 prints \u2248 14 requests. `upload_ppo.py` pausa 5 min com `rem \u2264 40`; 4-6 workers no m\u00e1ximo; conferir a cota antes de upload grande; nunca dois uploads grandes na mesma hora.\n- **#58 Localizar panorama de IA sem regenerar (Sueca, 28/08/2026)** \u2014 Apagar cada texto com m\u00e1scara dilatada + lerp por LINHA entre vizinhos do run (mediana pega borda e deixa faixa); cortar por colunas que n\u00e3o s\u00e3o fundo; renderizar copy por locale com CoreText. 5.5\" (1242\u00d72208): escalar pela altura e preencher as laterais com a coluna da borda, nunca esticar.\n- **#58b Flutter `build ios` local com `xcode-select` no CLT (BLW, 30/08/2026)** \u2014 Hook do `objective_c` morre em \"Bad state: No element\": `xcrun --show-sdk-path` do CLT vem vazio e o env do hook \u00e9 filtrado (`DEVELOPER_DIR` n\u00e3o chega). Shim de `xcrun` na frente do PATH exportando `DEVELOPER_DIR` do Xcode 2.app; manter tamb\u00e9m no archive.\n- **#60 iOS 26: item glass no leading da nav bar morpha com o back (College, 30/08/2026)** \u2014 `UIBarButtonItem(customView:)` com glass vira blob no push/pop. Tirar da nav bar: pill em `navigationController.view` ancorada na barra, fade com `transitionCoordinator.animate(alongsideTransition:)` (`LiquidGlass.installLeadingPill`/`fade`). Ver com `simctl io recordVideo` + frames.\n- **#61 GitHub Actions `startup_failure` sem job = billing, n\u00e3o c\u00f3digo (College, 30/08/2026)** \u2014 `jobs: []` = runner nem alocado 7\u00c3O: asser\u00e7\u00e3o que sobrevive \u00e0 pr\u00f3pria muta\u00e7\u00e3o \u00e9 inerte. Hook `agent-eval-guard.sh` roda ao editar `~/.claude/agents/*.md`. Eval que grita por nada \u00e9 ignorado.\n- **#63b Acento em keywords: a regra fica, com o porqu\u00ea (31/08/2026)** \u2014 Sem acento = dup hygiene + aposta assim\u00e9trica (usu\u00e1rio digita sem acento), n\u00e3o ranking. D\u00edvida hist\u00f3rica vira `known_debt` datado que apodrece sozinho, nunca exce\u00e7\u00e3o silenciosa. A camada de ARTEFATO exp\u00f5e a diverg\u00eancia prompt \u00d7 output; agentes apontam pro template do lab, nunca pra um app.\n- **#68 AlarmKit (iOS 26) n\u00e3o exige entitlement (Sunrise, 31/08/2026)** \u2014 S\u00f3 `NSAlarmKitUsageDescription` (localizada no `InfoPlist.xcstrings`) + `AlarmManager.shared.requestAuthorization()`/`schedule`. O alerta s\u00f3 tem Stop/Snooze: `stopIntent` (`LiveActivityIntent`, `openAppWhenRun`) pra retomar a miss\u00e3o. Repetido = `.relative(\u2026 repeats: .weekly)`, nunca `.fixed(date)`.\n- **#64 \"Faz um pouco e para\" = falta de crit\u00e9rio de pronto (31/08/2026)** \u2014 Tarefa ampla vira work order (`wo.py`) com `done_when` por item; `done` exige `--evidence`, `close` recusa item aberto. `/lab-orchestrate` decomp\u00f5e \u2192 ondas \u2192 verifica RODANDO o comando, n\u00e3o lendo o relato. `scan.py` s\u00f3 enfileira o vencido (glob em `Apps/**` trava); s\u00f3 urg\u00eancia \u22643 vira item no now.json.\n- **#69 Autonomia noturna + a revis\u00e3o que s\u00f3 o dogfooding pega (31/08/2026)** \u2014 Hooks valem em headless (`-p`: \"ask\" = negado). Load frio do contexto custa ~$2. Hook `ta[redigido].sh` com casos positivos e negativos. Sess\u00f5es concorrentes colidem na numera\u00e7\u00e3o deste arquivo \u2192 detector `learnings_dup`. Doc sempre-carregado desatualizado \u00e9 pior que ausente (21 refs quebradas, `Apps/intermediate/` invis\u00edvel).\n- **#65b appStoreVersion por API: age rating 2026 e localizations que n\u00e3o herdam (Truco, 01/09/2026)** \u2014 8 campos novos obrigat\u00f3rios (`ageAssurance`, `messagingAndChat`, `userGeneratedContent`, `healthOrWellnessTopics`, `advertising`, `lootBox`, `parentalControls`, `gunsOrOtherWeapons`) no `ageRatingDeclaration` do appInfo EDIT\u00c1VEL (n\u00e3o o id que o erro cita). Vers\u00e3o nova N\u00c3O herda todas as localizations: POST exige `description` + `supportUrl`.\n- **#70 Archive CocoaPods legado: 3 muros (Foguetinho, 02/09/2026)** \u2014 (1) arquivo no disco fora do target \u2192 gem `xcodeproj`; sanity build ANTES de mexer em vers\u00e3o. (2) Signing Manual do CI morto \u2192 na linha de comando `CODE_SIGN_STYLE=Automatic PROVISIONING_PROFILE_SPECIFIER= CODE_SIGN_IDENTITY=\"Apple Development\"`. (3) rsync \"No such file\" em framework de Pod = symlink relativo: `readlink -f` no `Pods-<App>-frameworks.sh`.\n- **#71 Notifica\u00e7\u00e3o local em FOREGROUND sem banner (philos, 02/09/2026)** \u2014 iOS 14+: `presentAlert` sozinho \u00e9 deprecated e vira `destinations: [ ]`; sempre `presentBanner: true, presentList: true`. Diagn\u00f3stico: `simctl spawn <UDID> log stream --predicate 'eventMessage CONTAINS \"<bundle>\"'`. Tap na notifica\u00e7\u00e3o do sim \u00e9 inalcan\u00e7\u00e1vel por driver: validar o deep-link com hook `kDebugMode` (pref `flutter.` no plist + `kill -9 cfprefsd`).\n- **#72 Cota de modelo estourada mata a noite em 2 min (03/09/2026)** \u2014 `claude -p` sem `--model` usou o default esgotado; exit 0 com \"reached your limit\" contou como \"sem progresso\". Cascata `NIGHT_MODELS`, grep s\u00f3 do trecho NOVO do log (`$(( $(wc -l < LOG) + 1 ))`, nunca `tail -n +0`), c\u00f3digo 42 n\u00e3o conta tentativa, aborto vai pro now.json. Detector precisa de caso NEGATIVO.\n- **#73 Screenshot de vers\u00e3o PUBLICADA \u00e9 IMUT\u00c1VEL (Neon, 03/09/2026)** \u2014 `DELETE /v1/appScreenshots` d\u00e1 409 \"Can't Delete Screenshot After Submit\". Print novo custa release: `POST /v1/appStoreVersions` (herda sets com prints antigos \u2192 reconciliar por checksum), build novo, aprova\u00e7\u00e3o. Antes de renderizar: precisa existir vers\u00e3o edit\u00e1vel (`stage_version.py --create`). S\u00f3 locales com `appScreenshotSets` pr\u00f3prios precisam de print.\n- **#74 NUNCA desinstalar app do device do Jo\u00e3o (Cronos, 03/09/2026)** \u2014 `devicectl uninstall` apaga o container e os dados dele (perdeu as tarefas). Device f\u00edsico = `install` por cima, sempre; \u00edcone atualiza sem uninstall (o cache teimoso \u00e9 s\u00f3 a splash, #65). Erase/uninstall s\u00f3 em simulador ou com autoriza\u00e7\u00e3o dizendo QUE dados somem. App que guarda dado s\u00f3 em `Documents/` precisa de rota de backup.\n- **#75 iCloud KV Store = backup barato, e o simulador n\u00e3o prova (Cronos, 03/09/2026)** \u2014 Sem container nem portal: capability `ICLOUD` com `ICLOUD_VERSION: XCODE_6`. Sem conta iCloud o `set` aceita e joga fora: provar lendo de volta + `ubiquityIdentityToken`. Nuvem vazia nunca apaga disco cheio; `updatedAt` do app, carimbo por \u00faltimo, teto 1 MB; payload JSON versionado, nunca NSKeyedArchiver. Legado sem `SWIFT_ACTIVE_COMPILATION_CONDITIONS`: `#if DEBUG` sempre falso.\n- **#75b Segundo cliente de um espelho iCloud KVS (Cronos Mac, 03/09/2026)** \u2014 O balde \u00e9 derivado do bundle id: Mac com bundle diferente = balde diferente sem erro. Mesmo bundle id (`UNIVERSAL`) e provar com `codesign -d --entitlements :-`. Device MAC_OS via `POST /v1/devices` (Provisioning UDID). \"Nuvem vazia nunca apaga\" impede propagar a exclus\u00e3o da \u00faltima tarefa \u2014 precisa de tombstone. Duas sess\u00f5es no mesmo app = corrida: logar toda muta\u00e7\u00e3o ANTES de fazer.\n- **#76 Link da store morre enquanto o app dorme na loja (Cronos, 04/09/2026)** \u2014 `privacyPolicyUrl` num encurtador (twixar) deu 522 e rejei\u00e7\u00e3o. Nunca encurtador em metadata; Drive do lab ou `gambitstudiotech.com`. Check `asc.urls` no preflight (401/403/405/429 = vivo; can\u00e1rio o como c\u00f3digo (04/09/2026)** \u2014 Check por grep acusou API dentro de um coment\u00e1rio que explicava a aus\u00eancia da chave, e um bloco inteiro comentado em app EM REVIEW. Tirar `//` e `/* */` antes de casar (lookbehind de `:` pra `https://`), e conferir \u00e0 m\u00e3o a linha que sumiu \u2014 strip que come c\u00f3digo real vira falso negativo, pior.\n- **#79c As quatro maneiras de um grep acusar app inocente (04/09/2026)** \u2014 (1) coment\u00e1rio lido como c\u00f3digo; (2) API que CONSULTA vs que PEDE (`canEvaluatePolicy`, construtores de `CNContactStore`/`HKHealthStore` n\u00e3o abrem prompt); (3) fonte no disco fora do target \u2014 s\u00f3 conta arquivo em fase `Sources` de algum pbxproj; (4) compilado mas nunca chamado \u2192 WARN `perms.dormant`, com teste pros dois lados. Legado tem as quatro ao mesmo tempo.\n- **#80 Sales Report n\u00e3o enxerga an\u00fancio; linkar SDK \u2260 servir an\u00fancio (05/09/2026)** \u2014 `revenue_usd` do dashboard \u00e9 s\u00f3 IAP \u2014 relat\u00f3rio diz \"receita de IAP\"; receita AdMob n\u00e3o existe em lugar que a sess\u00e3o alcance (sem v\u00ednculo AdMob\u2194Firebase). Monetiza\u00e7\u00e3o se conta por grep de CHAMADA, n\u00e3o de Podfile, com o vocabul\u00e1rio da VERS\u00c3O pinada (v7 `GADInterstitial`, v8+ `GADInterstitialAd`); `0 ocorr\u00eancias` em legado \u00e9 suspeita de padr\u00e3o errado.\n- **#80b Or\u00e1culo que n\u00e3o consegue LER n\u00e3o responde LIBERADO (Foguetinho, 05/09/2026)** \u2014 401 espor\u00e1dico na chave compartilhada virou \"sem declara\u00e7\u00e3o\" \u2192 WARN \u2192 preflight verde no app errado. `api_client.request` com retry/backoff e token novo; `age_rating.py` distingue \"n\u00e3o consegui ler\" (FAIL) de \"n\u00e3o existe\" (WARN). Todo check com I/O externo tem 3 estados: passou / reprovou / n\u00e3o consegui verificar \u2014 o terceiro nunca vira o primeiro.\n- **#80c Resposta de avalia\u00e7\u00e3o n\u00e3o se edita: POST substitui (Neon, 05/09/2026)** \u2014 `PATCH /v1/customerReviewResponses` d\u00e1 403; `POST` na mesma review (201, `PENDING_PUBLISH`) substitui e re-notifica o autor. S\u00f3 substituir quando a promessa feita nela foi cumprida por vers\u00e3o NO AR \u2014 confrontar com a vers\u00e3o LIVE, nunca com o reposit\u00f3rio. Promessa na loja n\u00e3o cumprida \u00e9 d\u00edvida p\u00fablica.\n- **#81 Um projeto Firebase hospeda V\u00c1RIOS apps na mesma property GA4 (DevLingo/Sunrise, 06/09/2026)** \u2014 Ler por property soma apps. A unidade \u00e9 o data stream: `ga4_pull.py --stream <id>`; mapa app \u2192 (property, stream) derivado da Admin API em `firebase.json > stream_map`; `firebase_snapshot.py` NEGA gravar se property compartilhada for lida sem filtro. `properties()` vazio por 401/429 aborta sem gravar; `find` com `-prune` (n\u00e3o `-not -path`); varrer `Apps/intermediate/`.\n- **#85 (UserDefaults ArraySlice) `UserDefaults.set` com ArraySlice matou 6 apps (WTMP + kit, 07-08/09/2026)** \u2014 `defaults.set(dates.suffix(10), \u2026)` lan\u00e7a `NSInvalidArgumentException` logo ap\u00f3s o \"sim\" do gate. Sem stack: `app_exception` + trilha por `dateHourMinute` no GA4 acha o ramo. Gatilho condicional se valida FOR\u00c7ANDO o ramo (semear o contador no plist). Check `rules.plist_storage` + testes no kit; conferir o commit pinado no `Package.resolved` vs HEAD do kit.\n- **#86 \"Crash-free 100%\" sem Crashlytics \u00e9 cegueira (08/09/2026)** \u2014 `deviceModel` `x86_64`/`arm64` = simulador, nunca entra em conta de produ\u00e7\u00e3o; separar build de dev da vers\u00e3o live (#54). App sem o SDK n\u00e3o tem 100%, tem aus\u00eancia de sensor: `firebase_snapshot.py` zera pra `None` com `crash_instrumented: false`. M\u00e9trica de sa\u00fade s\u00f3 vale com a prova de que o sensor existe.\n- **#87 (36 \"sim\" no rating gate) O n\u00famero que n\u00e3o fecha \u00c9 o achado (College, 08/09/2026)** \u2014 36 exibi\u00e7\u00f5es em 30 dias num gate com cooldown de 60: `present(trigger:)` pulava `isEligible` inteiro (6 aberturas seguidas, todo evento criado), e cada \"sim\" crashava (#85). Coment\u00e1rio dizendo \"o servi\u00e7o aplica o cooldown\" n\u00e3o \u00e9 evid\u00eancia \u2014 o que vale \u00e9 qual m\u00e9todo \u00e9 chamado. M\u00e9trica muito fora dos vizinhos = mecanismo quebrado, n\u00e3o app especial (#53, #54, #81).\n- **#82 Preflight s\u00f3 conhecia bundle de iOS e NEGOU export de Mac correto (Cronos Mac, 06/09/2026)** \u2014 Plist em `Contents/Info.plist`, `Assets.car` em `Contents/Resources/`, `UILaunchStoryboardName` \u00e9 s\u00f3 iOS (SKIP no macOS). Or\u00e1culo que n\u00e3o entende o que olha n\u00e3o bloqueia release. Archive macOS: `generic/platform=macOS`, export gera `.pkg`, `altool -t macos`, `LSApplicationCategoryType` no plist. Sem jarg\u00e3o de diagn\u00f3stico no chrome do Release.\n- **#83 App Group: API cria identifier e perfil, mas o grupo volta VAZIO (Cronos widget, 07/09/2026)** \u2014 `POST /v1/bundleIds` + `bundleIdCapabilities APP_GROUPS` + `POST /v1/profiles` funcionam, mas o `profileContent` traz `application-groups = []`; n\u00e3o h\u00e1 rota pra atribuir o grupo. Portal = 2 cliques (identifier do app E da extens\u00e3o). `DELETE /v1/profiles/{id}` do perfil sondado, sen\u00e3o o cloud signing o escolhe depois.\n- **#83b Portal bloqueando pela 3\u00aa vez: trocar o canal (Cronos widget, 07/09/2026)** \u2014 Snapshot app\u2192widget via keychain com access group `TEAM.<bundle>` (o perfil concede `keychain-access-groups = TEAM.*` sozinho) em vez de App Group. Leg\u00edtimo pra payload pequeno como CANAL; dado grande continua App Group. `kSecAttrAccessibleAfterFirstUnlock` (widget redesenha bloqueado) e limpar no 1\u00ba launch (keychain sobrevive ao uninstall, #30).\n- **#84 QA de app macOS: clique por coordenada n\u00e3o aciona NSButton (Calc+ Mac, 07/09/2026)** \u2014 `cliclick` faz hover mas n\u00e3o dispara a action: AXPress via `osascript \u2026 click (first button of window 1 whose description is \"\u2026\")`. `log` \u00e9 builtin do zsh \u2192 `/usr/bin/log`. Build de QA ad-hoc divide o Keychain com o app real: `-QAKeychainService <nome>` em DEBUG, nunca trocar o `service` de produ\u00e7\u00e3o. `case .failure` com `return` seco numa tela \u00e9 sempre suspeito.\n- **#85b (preflight plataforma) Preflight l\u00ea a vers\u00e3o edit\u00e1vel sem olhar a plataforma (Calc+ Mac, 08/09/2026)** \u2014 App universal: `GET /v1/apps/{id}/appStoreVersions` devolve iOS e macOS; filtrar `attributes.platform` pela plataforma do bundle, sen\u00e3o bloqueia release bom e aprova ruim. L\u00e9xico 2.5.14: exce\u00e7\u00e3o por app pro NOME registrado. Archive macOS SEM `CODE_SIGN_IDENTITY` na linha de comando (vaza pros pacotes SPM); `.pkg` + `altool -t macos`.\n- **#87b (breakout duplicado) Crop e posi\u00e7\u00e3o do breakout como n\u00fameros independentes viram duplicata (Cronos, 08/09/2026)** \u2014 `breakoutCenterY` derivado (`cropY + cropH/2`), nunca campo separado; alturas de crop MEDIDAS, n\u00e3o estimadas (`crop.swift`). Breakout transborda o APARELHO, n\u00e3o a borda do print (`min(deviceW*scale, W*0.93)`). Captura de locale sai do app LAN\u00c7ADO naquele locale (`-AppleLanguages`), widget inclusive. Olhar com olhos de usu\u00e1rio ANTES de submeter (#73).\n- **#88 Pr\u00e9-prompt de avalia\u00e7\u00e3o foi erro grave \u2014 s\u00f3 o prompt nativo no aha (lab inteiro, 11/09/2026)** \u2014 `ReviewService.shared.recordPositiveEvent(trigger:)` / `review_prompt.dart`, throttle no servi\u00e7o. Auditar o MOMENTO, n\u00e3o s\u00f3 a aus\u00eancia de sheet: pr\u00e9-prompt com outro nome, `core_action` que n\u00e3o \u00e9 aha (setup, rajada, contexto negativo, meio de fluxo), call site que contorna o wrapper, evento pendurado em hook nunca atribu\u00eddo. Check `rules.review_pregate`.\n- **#89 \"Launched application\" n\u00e3o quer dizer que ficou aberto (College, 11/09/2026)** \u2014 Ap\u00f3s TODO install no device: `devicectl device process launch --console --terminate-existing` em background ~20 s + `grep -E \"Terminating|uncaught exception|signal|Fatal error\"`; s\u00f3 dizer \"instalado\" com console limpo. Commit s\u00f3 depois de `BUILD SUCCEEDED`. Fun\u00e7\u00e3o que refaz constraint entre irm\u00e3s come\u00e7a com `guard viewA.superview != nil, viewB.superview != nil`.\n- **#90 SPM `from:` + `Package.resolved` fora do git puxa SDK n\u00e3o validado (Hair Schedule, 12/09/2026)** \u2014 Firebase 12.19 crasha em device (`fetchSBT` unrecognized selector, sem `-ObjC`). Crash em SDK de terceiro: comparar a vers\u00e3o RESOLVIDA hoje com a da \u00faltima vers\u00e3o live antes de chamar de ru\u00eddo. Firebase/Ads em `intermediate`/`important` com `exactVersion`, subindo de prop\u00f3sito e testado.\n- **#91 Onda de screen-builders em paralelo enche o disco (4 apps novos, 12/09/2026)** \u2014 Cada DerivedData pr\u00f3prio baixa o Firebase (~2,4 GB). DD pr\u00f3prio mas `-clonedSourcePackagesDirPath <app>/build/DD/SourcePackages` + `COMPILER_INDEX_STORE_ENABLE=NO`; coordenador compila o esqueleto ANTES da onda; apagar a pasta ao terminar; `df -h /` antes de >5 builds. `xcodegen generate` no meio de build alheio quebra o clang (retry); subagente compila em primeiro plano.\n- **#92 Traduzir texto DENTRO das telas de uma panorama, 10 idiomas (Cronos, 14/09/2026)** \u2014 Invent\u00e1rio por OCR do Vision (3x); apagar por difus\u00e3o harm\u00f4nica (margem 3 px), n\u00e3o interpola\u00e7\u00e3o de linha; calibrar re-renderizando o INGL\u00caS primeiro; limite = o CONTAINER, n\u00e3o o pr\u00f3ximo texto; encolher tem piso 80% \u2192 forma curta por idioma, texto do `Localizable.xcstrings`. iPad em p\u00e9 n\u00e3o cabe em 21:9 (2 imagens ou code-driven).\n- **#93 Agentes em paralelo compartilham o \u00cdNDICE do git \u2014 s\u00f3 o coordenador commita (Hair Schedule, 17/09/2026)** \u2014 `git add` + `commit` n\u00e3o \u00e9 at\u00f4mico; commits sa\u00edram misturados. Em onda no MESMO repo: agente deixa a mudan\u00e7a na \u00e1rvore e reporta `git status --short` + `git diff --stat`; o coordenador commita uma vez, depois de buildar. Commit pr\u00f3prio (release/tag) roda sozinho na onda; ou worktree por agente (#91). Antes de acusar perda: \u00e1rvore \u00d7 HEAD + reflog.\n- **#94 In-App Event exige deep link pro conte\u00fado DENTRO do app (Cronos, 27/09/2026)** \u2014 `reviewSubmissionItems` com `appEvent` d\u00e1 409 \"must provide deepLink\" (rascunho aceita null; link da loja n\u00e3o serve). Antes de montar: `PlistBuddy -c \"Print :CFBundleURLTypes\"` no plist COMPILADO da vers\u00e3o live \u2014 sem esquema, o 1\u00ba passo \u00e9 um release. Validar o item antes do `POST reviewSubmissions` (#1). `appEventScreenshots` sem `sourceFileChecksum`: conferir por `fileSize` + `fileName`.\n- **#95 Upgrade do lab por pesquisa (27/09/2026)** \u2014 doc sempre-carregado custa por sess\u00e3o: \u00edndice auto-loaded (109 KB) + `scan.py learnings_index`, todo learning novo ganha linha aqui; agentes em paralelo recebem OWNERSHIP por arquivo no brief e o coordenador guarda os arquivos disputados; corre\u00e7\u00e3o de playbook cita \"achado N\" da pesquisa e regra nova em agente nasce com asser\u00e7\u00e3o + `why`; `upload_ppo.py --power-check` recusa PPO sem tr\u00e1fego pra responder; `asc.screenshot_sizes` no preflight pega 6,5\" \u2260 6,9\"; nomination via `nominate.py`; CPP\u2194keyword via `searchKeywords`; skill sem execu\u00e7\u00e3o real \u00e9 hip\u00f3tese: mudou o pipeline de cria\u00e7\u00e3o, roda o smoke `evals/e2e/create_ios_app_smoke.py`.\n- **#96 Sim headless chia o \u00e1udio do Mac: callservicesd segura o alto-falante (28/09/2026)** \u2014 Zuada no som com agentes rodando = sim bootado headless com `callservicesd` (telefonia) segurando `audio-out` no speaker; diagnosticar com `pmset -g assertions | grep -i audio` (d\u00e1 o PID). Fix dur\u00e1vel: `simctl spawn <udid> launchctl disable system/com.apple.callservicesd` + kill \u2014 o `simpool.py boot()` re-aplica a cada boot (`mute seeding duplica linhas (11 fr / 3 de / 14 it) e duplicata quebra outras chamadas com `matches 2 tracked entries`; SERP vazio na 1\u00aa tentativa \u00e9 transiente (4/50, todos ok no retry) e sem retry vira falso \"termo sem concorr\u00eancia\". Sess\u00e3o sem as tools `mcp__astro__*` roda a cadeia inteira por `aso-pipeline/scripts/astro_mcp.py call <tool> '<json>'`.\n- **#100 O fix do #98 era teste de PREFIXO e o lab emite as formas com F (Meus Gastos, 01/10/2026)** \u2014 o `*` de `1*`/`7*` do #53 \u00e9 curinga dos DOIS lados: `F7` \u00e9 update e `F1` \u00e9 install. `startswith(\"7\")` casa zero linhas e imprime \"0 updates\" (artefato, n\u00e3o fato); `startswith(\"1\")` perde `F1` e subconta instala\u00e7\u00e3o em 29%. Pertin\u00eancia exata nos conjuntos `{1,1F,1T,F1}`/`{7,7F,7T,F7}`/`{3,3F,3T,F3}`, igual ao `pull_data.py`; or\u00e1culo em `scripts/asc/test_kill_or_scale.py`. Fechar item que define uma conta exige rodar no dado real contra um 2\u00ba m\u00e9todo \u2014 e duas fontes do mesmo n\u00famero divergindo \u00e9 ACHADO, n\u00e3o ru\u00eddo.\n- **#101 Pre\u00e7o do portf\u00f3lio: `include` devolve meio territ\u00f3rio e o default do lab \u00e9 cobrar barato (lab inteiro, 01/10/2026)** \u2014 auditoria de pre\u00e7o se l\u00ea por territ\u00f3rio EXPL\u00cdCITO (`/v1/inAppPurchasePriceSchedules/{id}/{manual|automatic}Prices?filter[territory]=\u2026`), nunca pelo `include` do `iapPriceSchedule` (teto 50, sem pagina\u00e7\u00e3o de relationship: devolve AFG\u2026DEU e some com MEX/IND, virando falso \"produto indispon\u00edvel\" \u2014 #80b). `inAppPurchasePricePoints` n\u00e3o tem GET (403): casar o tier pelo id base64 `{s,t,p}`. Em `/v1/subscriptions/{id}/prices`, sem `include=territory` a relationship n\u00e3o vem (parse casa zero) e o endpoint traz o HIST\u00d3RICO \u2014 vigente = `startDate <= hoje` mais recente. Achado: 8 dos 12 apps mex\u00edveis abaixo do piso (Sunrise 17\u00d7/10\u00d7), trial no plano errado ou nos dois em 6 apps, zero pre
