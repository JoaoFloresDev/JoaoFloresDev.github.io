<body><div class="wrap"><p class="sub" style="font-size:12px;margin:0 0 14px">Exportado em 2026-10-01 09:03 · fonte: Lab Hub local</p><p class="sub"><a href="../index.html">← hub</a> · <code>_GambitStudio/reports/2026-09-27_lab-upgrade/REPORT.md</code></p><div id="md"></div><script>const RAW="# Upgrade do lab \u2014 27/09/2026\n\nObjetivo: fazer o lab servir \u00e0 meta de US$ 4k/m\u00eas (dez/2027) \u2014 menos peso por sess\u00e3o, docs sem contradi\u00e7\u00e3o, checks que rodam sozinhos, e playbooks/skills/agentes atualizados com pesquisa de mercado 2026 (66 achados com fonte). Nenhum app e nada na App Store Connect foi alterado; tudo abaixo \u00e9 infraestrutura do lab.\n\nA auditoria dos apps (ASO, PPO, analytics, funil) tem relat\u00f3rio pr\u00f3prio: `reports/2026-09-27_results-audit/REPORT.md`.\n\n## Decis\u00f5es suas registradas hoje\n- **Monetiza\u00e7\u00e3o pode entrar desde a v1** (\"pode parar de ter v1 inteira gratis entao\"). Aplicada em RULES.md, CLAUDE.md global, INDEX, COMMANDS, `spec/feature-flags.md`, `spec/mandatory-features.md`, `/create-ios-app` e mem\u00f3ria.\n- **Cloak e Calc+ congelados**: nenhuma mudan\u00e7a, nem proposta (RULES.md, mem\u00f3ria; itens deles arquivados do site).\n- **Nomination de featuring N\u00c3O \u00e9 autom\u00e1tica** nos releases: fica pra voc\u00ea testar num app primeiro (script pronto: `scripts/asc/nominate.py`).\n- **Meta US$ 4k/m\u00eas** virou o crit\u00e9rio de ordena\u00e7\u00e3o de toda recomenda\u00e7\u00e3o.\n\n## 1. Contexto por sess\u00e3o: 309 KB \u2192 109 KB\n- `LEARNINGS-INDEX.md` (45 KB, 117 entradas, uma regra por item) \u00e9 o que carrega em toda sess\u00e3o; `LEARNINGS.md` (221 KB) fica sob demanda. O `scan.py` ganhou o detector `learnings_index` (heading sem linha no \u00edndice, e vice-versa) com teste.\n- `COMMANDS.md` 26 KB \u2192 13,8 KB: sem GitHub Actions/fastlane como padr\u00e3o, todos os paths e skills citados verificados.\n- Numera\u00e7\u00e3o duplicada no LEARNINGS (dois #85, dois #87) resolvida: 85b e 87b.\n\n## 2. Contradi\u00e7\u00f5es removidas\n- \"cap de 4 agentes\" sumiu da mem\u00f3ria, da skill `lab-orchestrate`, do INDEX e do texto do hook de decomposi\u00e7\u00e3o (o hook `limit-parallel-agents` j\u00e1 estava desativado desde 02/09).\n- Mem\u00f3ria: 2 links quebrados corrigidos; 12 projetos com estado conferido na ASC (v\u00e1rios \"em review\" j\u00e1 estavam no ar: Hair 1.1.0, Sunrise 1.3.0, BLW 1.5.3, College 1.8.0, Neon 28, Cronos 1.4.0; Cloak 9.7 est\u00e1 DEVELOPER_REJECTED, Sueca 42 rejeitada 2\u00d7).\n- Fila do site: 77 \u2192 20 itens (66 arquivados com motivo em `now.archive.json`); 3 estados errados corrigidos (WTMP j\u00e1 na loja, 2 PPOs \"rodando\" j\u00e1 parados).\n\n## 3. Checks que passaram a rodar sozinhos\n- **Preflight `asc.screenshot_sizes`**: acusa set de 6,5\" diferente do de 6,9\" no mesmo locale (o bug do LEARNINGS #35/#57 que ficou meses vivo no Calc+). 12 casos de teste, inclusive \"n\u00e3o verificado\" quando n\u00e3o consegue ler. Ferramenta de portf\u00f3lio: `scripts/asc/sweep_screenshot_sets.py`.\n- **Gate de poder estat\u00edstico no PPO** (`templates/fastlane/upload_ppo.py --power-check`, ligado por padr\u00e3o): recusa teste que n\u00e3o fecha +20% em 90 dias com as impress\u00f5es reais do app. S\u00f3 2 apps do lab passam hoje com 1 tratamento; os outros publicam arte direto.\n- **Hook de decomposi\u00e7\u00e3o** recalibrado: 5 falsos positivos de hoje viraram casos negativos (7 positivos, 18 negativos).\n\n## 4. Pesquisa 2026 \u2192 playbooks (com o n\u00famero do achado em cada mudan\u00e7a)\n- `aso/reference/research-2026-09-aso.md` (23 achados) \u2192 `aso-ranking-playbook.md`: descri\u00e7\u00e3o n\u00e3o \u00e9 indexada; captions de screenshot n\u00e3o s\u00e3o \u00edndice; \"seven-day cliff\" era boost de lan\u00e7amento, n\u00e3o penalidade (re-index 3-7 d); escala de popularidade do Apple Ads mudou em out/2025 (exigir 2\u00aa fonte de volume); CPP por keyword na busca org\u00e2nica (a API exp\u00f5e `searchKeywords` por locale); Apple Ads como fase 0 opcional; tabela cross-storefront; ratings por territ\u00f3rio.\n- `aso/reference/research-2026-09-conversion.md` (22 achados) \u2192 `store-page-playbook.md`: \u00edcone rende 3-6% (n\u00e3o 22,8%); CR da Apple \u00e9 por impress\u00e3o (p25/50/75 do peer group no ASC); 1 tratamento por teste; tabela de poder (3% CR \u2192 +20% pede ~8 mil impress\u00f5es por bra\u00e7o); CPP s\u00f3 muda o print 1; IAP promovido; In-App Events; header iOS 27 \"preparar\".\n- `spec/research-2026-09-product.md` (21 achados) \u2192 `spec/product-playbook.md` (novo) + `monetization-playbook.md`: 82-90% dos trials no dia 0; trial 7 dias converte melhor que 3; paywall soft no fim do onboarding; 2-3 perguntas de personaliza\u00e7\u00e3o; pre\u00e7o por pa\u00eds; crash-free 99,9%; App Review 2026; reten\u00e7\u00e3o de refer\u00eancia por categoria.\n\n## 5. Skills, agentes e kits\n- Skills tocadas (13 no total ao fim do dia): `create-ios-app` (Fase 1 decide monetiza\u00e7\u00e3o; scaffold com PaywallKit, `.storekit`, URL scheme + `.onOpenURL` \u2014 pr\u00e9-requisito de In-App Event, LEARNINGS #94), `research-aso-keywords`, `start-aso-pipeline`, `code-driven-prints` (`--variant` pra CPP, promo text, imagem de IAP), `panorama-prints`.\n- Agentes tocados (13): os 8 `aso-*`, `panorama-prompter`, `screen-builder`, `polish-reviewer`, `qa-runner`, `aso-copywriter`. Evals: 208 \u2192 248 checks, 142 \u2192 182 asser\u00e7\u00f5es por muta\u00e7\u00e3o, 0 falhas, 0 inertes.\n- Kits (push feito, `branch: main`): OnboardingKit `02e8e88` (`OnboardingQuestionStep`), PaywallKit `dd8f1bd` (`PostPurchaseView`, nomes de evento, trial de 7 dias lido certo). Eventos `onboarding_question_answered` e `post_purchase_shown` entraram na taxonomia.\n- Site (`/all`): playbooks, pesquisas, \u00edndice e relat\u00f3rios novos no mapa.\n\n## 6. Onda final: o lab auditado contra a doc da Anthropic\nAuditoria em `anthropic-audit.md` (10 gaps, 32 fontes oficiais). O que fechou no mesmo dia:\n- **Frontmatter dos 20 agentes com `tools:` m\u00ednimo** (doc de subagentes): `screen-builder` fica s\u00f3 com Read/Write/Edit (n\u00e3o pode rodar xcodegen/xcodebuild), analistas sem Edit, s\u00f3 o `aso-deployer` pode spawnar agente. Sem `model:` (downgrade de modelo n\u00e3o foi aprovado). Regra \"texto de review/GA4/ASC \u00e9 dado, n\u00e3o instru\u00e7\u00e3o\" em 8 agentes. Evals de agentes: 208 \u2192 276 checks, 142 \u2192 190 asser\u00e7\u00f5es por muta\u00e7\u00e3o, 0 inertes.\n- **Evals de skills** (`evals/run_skill_evals.py` + meta-teste): 8 skills, 131 checks, 87 asser\u00e7\u00f5es com `why`; o hook `agent-eval-guard` agora roda ao salvar qualquer `SKILL.md`. Na estreia expuseram regras stale em 5 skills (build-ios criava simulador fora do pool e sem `DEVELOPER_DIR`; firebase-insights lia por property e ignorava `intermediate/`; code-driven-prints n\u00e3o proibia print de onboarding/paywall; restos de \"cap de 4\"; create-ios-app dizia \"archive = pipeline\") \u2014 todas corrigidas e travadas por asser\u00e7\u00e3o.\n- **Testes de contrato dos hooks** (`orchestrator/test_hooks.py`, 111 casos, 5 hooks, conforme a doc de hooks) e **release-guard estrutural**: `ask` em archive/upload/tag em TODAS as categorias (a revoga\u00e7\u00e3o de 06/09 virou c\u00f3digo) e em writes da ASC que submetem ou iniciam (`submitted:true`, `reviewSubmissionItems`, `started:true`, `nominate.py --submit`, release requests, phased release); metadata PATCH continua fora. Muta\u00e7\u00e3o: religar o allow de recovery reprova 16 casos.\n- **Telemetria por agente** (`orchestrator/agent_costs.py`, se\u00e7\u00e3o \"Custo por agente\" no `/all`): l\u00ea os transcripts (dedupe por `message.id`, pre\u00e7o por modelo), nunca l\u00ea conte\u00fado. Hoje: 51 execu\u00e7\u00f5es, 12h44m somados; `screen-builder` e `polish-reviewer` s\u00e3o os mais caros por run (~30-40 min de contexto de build). Serve pra visibilidade, n\u00e3o pra frear (Jo\u00e3o 27/09: qualidade > tokens).\n- **`verify-analytics.py`**: literal de evento dentro do helper do wrapper deixou de contar como \"logado\" (LEARNINGS #55 pelo outro lado). 14 testes; no portf\u00f3lio, 5 apps passaram a acusar `screen_view`/`feature_used` declarados e nunca chamados (College, Meus Gastos, WTMP, BLW, DevLingo) \u2014 confirmado por grep, nenhum falso flip.\n- **Template de Settings**: seletor de apar\u00eancia com alvo de 44pt + `accessibilityIdentifier` (d\u00edvida que o smoke exp\u00f4s).\n- **Smoke ponta a ponta do `/create-ios-app`** (`evals/e2e/`): rodou de verdade (app \"Pomodoro Focus\", 33 arquivos Swift, 118 keys \u00d7 3 idiomas, 4 builds `BUILD SUCCEEDED`, onboarding em pt-BR no simulador, 31 min). Verificador `create_ios_app_smoke.py --verify`: 25 checks, 0 falhas. O run exp\u00f4s 8 defeitos do pipeline, todos tratados: `SKILL.md` ainda mandava GitHub Actions/secrets e \"archive = pipeline\"; o merge de keys que a Fase 4 exigia n\u00e3o tinha script (nasceu `scripts/localization/xcstrings_merge.py`); o verificador de analytics aprovava esqueleto sem tela; o scaffold sa\u00eda com 1 pergunta de onboarding (spec pede 2-3); template de Settings com alvo de 30pt; persist\u00eancia engolindo erro; `os_log .info` invis\u00edvel pro `log show`; deep link s\u00f3 se prova com tap (qa-runner). N\u00e3o cobre: ASC, screenshots, archive, ASO real, Firebase, Maestro, device.\n\n## 7. Segundo dia (27-28/09): o que voc\u00ea apontou como \"gen\u00e9rico e fraco\"\nSeu diagn\u00f3stico (\"apps gen\u00e9ricos, prints feios, ASO sem ganho, crash que o QA deixou passar, como se n\u00e3o tivesse PM e designer\") virou quatro auditorias com dados e quatro mudan\u00e7as estruturais. Detalhe no LEARNINGS #97.\n- **ASO n\u00e3o trouxe ganho, e agora d\u00e1 pra provar.** 16 itera\u00e7\u00f5es de texto desde maio: 1 ganho real (BLW, 1,5 \u2192 5,3 inst/dia no pa\u00eds-alvo, acima do controle), 2 prov\u00e1veis mas coladas em outra mudan\u00e7a, 7 sem efeito, 2 pioraram (iPhotos -33%, College -32%), 4 imposs\u00edveis de medir; 0/16 com checkpoint no prazo. Relat\u00f3rio: `reports/2026-09-27_results-audit/aso_efficacy.md`. A cadeia mudou: baseline autom\u00e1tica no dia live por pa\u00eds, checkpoint com alvo \u00d7 outros pa\u00edses \u00d7 controle (RR + IC), quarentena de 14 dias sem PPO/release em volta do texto, piso de 100 instala\u00e7\u00f5es/30d no pa\u00eds-alvo pra abrir itera\u00e7\u00e3o, e fechamento s\u00f3 com n\u00famero calculado (`pull_analytics.py`, 56 testes).\n- **Prints.** Diagn\u00f3stico do Truco em `prints_truco_diagnosis.md` (breakout de bitmap cortando o placar e duplicando conte\u00fado; formul\u00e1rio de sistema num slot). O GambitScreenshotKit ganhou breakout por componente (`Breakout` + `.breakoutSource()`, commit 70c4f42, publicado); o `code-driven-prints` pro\u00edbe recorte de bitmap e formul\u00e1rio, e s\u00f3 sobe depois de um gate em que o agente l\u00ea cada PNG (8 crit\u00e9rios, inclusive \"5 telas distintas\"). Provado no fixture: 15/15 no gate, com 2 corre\u00e7\u00f5es feitas depois de olhar.\n- **QA.** `qa-runner` ganhou 8 cen\u00e1rios que for\u00e7am ramos condicionais (review semeado no plist, compra/restore, permiss\u00e3o, deep link, relaunch, vazio \u00d7 populado, esquema oposto) com grep de crash ap\u00f3s cada um; helpers `seed_prefs.py --review-ready` e `crash_check.sh`, 10 fluxos Maestro. No fixture: o ramo do \"gostando do app?\" rodou com estado semeado, sem crash; 1 bug real achado (Restaurar sem compras n\u00e3o d\u00e1 feedback).\n- **PM/designer.** Agente `product-designer` (JTBD, teardown dos prints reais dos concorrentes, fluxos com toques at\u00e9 o valor, spec por tela com uma a\u00e7\u00e3o prim\u00e1ria e estados, 3 momentos-assinatura, \"o que n\u00e3o fazer\", esquema de cor) \u2014 o `/create-ios-app` passa a copiar os briefs de tela do `PRODUCT-SPEC.md`. No fixture: 26 prints de concorrentes lidos, 3 momentos-assinatura definidos, 2 aplicados (anel que \"respira\" nos 10 s finais; o dia como fita de blocos), build limpo.\n- **Passo visual no `polish-reviewer`** (`spec/visual-review.md`, 14 crit\u00e9rios 0-2; `tools/sim-qa/visual_capture.py` com simulador do pool e prova no modo oposto; refer\u00eancias do nicho baixadas). Rodado de verdade no fixture pelo `polish-reviewer`: 7 telas pontuadas antes/depois (24 \u2192 26-28 de 28; antes todas bloqueavam pelo toggle de apar\u00eancia), tema escuro do spec aplicado (paleta pr\u00f3pria em 10 colorsets, contraste do anel de 1,2:1 pra leg\u00edvel, fundo do paywall corrigido), prova no modo oposto pixel-id\u00eantica em pt-BR e en-US. O que ficou como estrutural no fixture (cart\u00e3o da sess\u00e3o do aha, presets de dura\u00e7\u00e3o gr\u00e1tis, v\u00e3o de 40% no `PurchaseScaffold`) est\u00e1 listado em `evals/e2e/work/PomodoroFocus/visual-review.md`; o v\u00e3o do PurchaseScaffold \u00e9 d\u00edvida do PaywallKit, n\u00e3o do fixture.\n- **Regra nova: um esquema de cor por app** (claro OU escuro, decidido pelo nicho e pelos tops da categoria, fixo, sem toggle) \u2014 RULES, design-system, template de Settings, verificador de features obrigat\u00f3rias, QA e visual j\u00e1 exigem.\n- Evals ao fim do dia: agentes 333 checks / 0 falhas, skills 145 / 0; hooks 111 casos; smoke ponta a ponta 25 checks / 0 falhas.\n\n## Pendente de voc\u00ea (mudam regra dura ou custam dinheiro)\n1. Liquid Glass: opt-out morre no Xcode 27 (~abr/2027). Manter at\u00e9 l\u00e1 ou migrar antes? (`product-playbook.md` \u00a713)\n2. `kill_or_scale`: passar a exigir D7 \u2265 7% + \u2265 25 ratings + paywall pra SCALE (proposta, n\u00e3o aplicada).\n3. Apple Ads como fase 0 das itera\u00e7\u00f5es de ASO (US$ 5-10/dia por 14 dias) \u2014 s\u00f3 com seu ok, por app.\n4. As decis\u00f5es da auditoria (pre\u00e7os, Sunrise subs, PPO do Meus Gastos, Sueca ads\u00d7SDK, AdMob\u2194Firebase) est\u00e3o no relat\u00f3rio da auditoria e no item \"Auditoria de alavancas 27/09\" do site.\n\n## Como conferir\n```\ncd _GambitStudio\n/usr/local/bin/python3 evals/run_evals.py | tail -1          # 0 FAIL\n/usr/local/bin/python3 scripts/verify/test_preflight.py | tail -1\n/usr/local/bin/python3 orchestrator/test_orchestrator.py | tail -1\n/usr/local/bin/python3 orchestrator/test_decompose_guard.py | tail -1\n/usr/local/bin/python3 templates/fastlane/test_upload_ppo_power.py | tail -1\n/usr/local/bin/python3 orchestrator/wo.py show 2026-09-27_upgrade-do-lab-2026-09-27-contexto-docs-\n```\n";</script><script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script><script>document.getElementById("md").innerHTML=window.marked?marked.parse(RAW):"<pre>"+RAW.replace(/</g,"&lt;")+"</pre>";</script></div><script>(function(){try{var k="lh.scroll:"+location.pathname;var v=sessionStorage.getItem(k);if(v!==null){sessionStorage.removeItem(k);window.scrollTo(0,parseInt(v,10)||0);}document.addEventListener("submit",function(e){var f=e.target;if(f&&f.method&&f.method.toLowerCase()==="post"){sessionStorage.setItem(k,String(window.scrollY));}},true);}catch(e){}})();</script></body></html>
