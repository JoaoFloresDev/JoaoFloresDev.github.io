e3o dele (3 itens)\n\n### (a) O app est\u00e1 100% em ingl\u00eas nos 13 idiomas da loja \u2014 entra na 1.10.0 ou fica pra depois?\n\nOs 9 `Main.strings` localizados t\u00eam **49 strings cada com ZERO caractere non-ASCII** (`ja.lproj`: `\"Gallery\" = \"Gallery\"`), e o c\u00f3digo novo tem **~112 strings de UI em ingl\u00eas hardcoded** (Composer 75, Editor 26, Home 11). Cruzando com o funil de 36 dias:\n\n| store | impress\u00f5es | taps | instala\u00e7\u00f5es 1F/30d | ratings |\n|---|---|---|---|---|\n| ja | 822 | **3** (0,36%) | 0 | **0** |\n| ko | 265 | **0** (0,0%) | 0 | **0** |\n| zh-Hans | 294 | 9 (3,06%) | 1 | **0** |\n| it | 307 | 9 (2,93%) | 2 | **0** |\n| tr | 1.627 | 9 (0,55%) | 1 | 7 \u00b7 **3,86** |\n\nEsta itera\u00e7\u00e3o sobe impress\u00e3o. Sem tradu\u00e7\u00e3o, boa parte dela morre no tap: o texto da loja promete em japon\u00eas uma p\u00e1gina que fala ingl\u00eas. **\u00c9 a alavanca maior que a keyword e cabe na mesma 1.10.0** \u2014 mas \u00e9 escopo de produto, n\u00e3o de ASO, e por isso \u00e9 decis\u00e3o dele. Se ficar pra depois, ja/ko/zh-Hans/it valem como **cobertura de ranking**, n\u00e3o como receita, e o checkpoint deve l\u00ea-los assim.\n\n### (b) Os 3 subtitles trocados \u2014 e o de-DE em especial\n\n| locale | o que muda de posi\u00e7\u00e3o | n\u00famero que sustenta |\n|---|---|---|\n| es-MX | `carrusel` sobe de keywords (1\u00d7) pro subtitle (3\u00d7): `hacer carrusel` **#8 \u2192 #4-6**, `editor de carrusel` #17 \u2192 **#8-12**, `carrusel instagram` #19 \u2192 #10-14, `editor carrusel` #26 \u2192 #13-18, `carrusel de instagram` #27 \u2192 #14-18. `difuminar` desce pro keyword field e **n\u00e3o sai do campo** \u2014 as 5 posi\u00e7\u00f5es dele (#41, #120, #162, #176, #186) continuam com token, 3\u00d7 mais fracas. | `carrusel` sustenta 9 posi\u00e7\u00f5es, 6 no top-30; o cluster `difuminar` \u00e9 LOTTERY (SERP mediana 777 ratings) |\n| de-DE | `erstellen` sobe pro subtitle: `instagram karussell erstellen` **#13 \u2192 #5-8**, `karussell erstellen` #23 \u2192 **#10-14**. O SERP de `instagram karussell erstellen` tem top-3 de **19, 93 e 103 ratings** \u2014 \u00e9 o \u00fanico lugar do grupo EU onde #1-3 n\u00e3o \u00e9 fantasia. **`collage` saiu do subtitle** (3\u00d7) e desceu pras keywords (1\u00d7). | de-DE \u00e9 o store de melhor tap fora do anglo: **7,35%** (35 taps / 476 impress\u00f5es) com **5 ratings** |\n| zh-Hans | `\u5168\u666f` deixa de existir solto (era ele que puxava SERP 10/10 de VR/360/street-view) e passa a existir dentro de `\u5168\u666f\u5207\u7247`. Com isso `\u8f6e\u64ad\u56fe\u7f16\u8f91\u5668` **#30 \u2192 #5-15** fica completo e em 3\u00d7, e `\u5168\u666f\u5207\u7247` (**2 apps no ranking inteiro**) + `\u65e0\u7f1d\u8f6e\u64ad\u56fe` (10 apps) entram DOMINATE **#3-10** de gra\u00e7a. | os 4 termos do subtitle novo medem **pop 5 = piso** (sem afirma\u00e7\u00e3o de volume): \u00e9 corre\u00e7\u00e3o de inten\u00e7\u00e3o, n\u00e3o compra por popularidade |\n\n**O risco a vigiar \u00e9 o de-DE.** `karussell collage` **#22** era carregado por dois tokens de subtitle (`karussell` + `collage`); agora `collage` est\u00e1 a 1\u00d7 e a aposta impl\u00edcita \u00e9 que `Fotocollage` no name (7\u00d7) indexe `collage` por substring. **Essa hip\u00f3tese est\u00e1 medida em CJK, n\u00e3o em alem\u00e3o** \u2014 o pr\u00f3prio compositor a marcou como n\u00e3o testada e manteve `collage` nas keywords como ap\u00f3lice (8 chars que iam ficar ociosos). D7 tem que ler `karussell collage` #22 e `bildcollage` #207; se ca\u00edrem, o rollback \u00e9 devolver `Collage` ao subtitle.\n\n### (c) `\ub124\ucef7` no ko \u2014 o PARTIAL de maior risco do store\n\n`\ub124\ucef7 \ud504\ub808\uc784` \u00e9 o **layout de 4 quadros** (a tira `s-story-strip` existe live), n\u00e3o a cabine fotogr\u00e1fica. O veredito de fit \u00e9 **PARTIAL**: depende de o coreano que digita `\ub124\ucef7 \ud504\ub808\uc784` querer o layout e n\u00e3o a cabine. O termo de cabine ficou fora e **porque** o gargalo medido \u00e9 impress\u00e3o (92% de 34.724 em 36 dias v\u00eam de busca) e n\u00e3o convers\u00e3o de p\u00e1gina (51,4% no US, n=278 page views).\n\n**D7 / D14 / D21 / D28 contados do `live_at`** \u2014 o dia em que a 1.10.0 ficar `READY_FOR_SALE`, **n\u00e3o** do dia do deploy do texto. A data depende da Apple e n\u00e3o est\u00e1 fixada aqui.\n\nO que o checkpoint l\u00ea: **posi\u00e7\u00e3o dos termos da \u00a74 no Astro** + **impress\u00f5es por territ\u00f3rio na ASC**. E a limita\u00e7\u00e3o sem rodeio: ele arrancou a trava do piso de tr\u00e1fego em 30/09 (\"pode arrancar essa trava, isso \u00e9 tentando renascer o app\"), ent\u00e3o **esta itera\u00e7\u00e3o n\u00e3o fecha com `results.final` de risco relativo e IC** \u2014 com 153 instala\u00e7\u00f5es 1F/30d no mundo (US 59) contra um piso de 100 por pa\u00eds, n\u00e3o existe amostra pra isso em 12 dos 13 locales. **Fechar com RR/IC seria inventar n\u00famero.** O fechamento \u00e9 por posi\u00e7\u00e3o + impress\u00e3o, e a leitura de instala\u00e7\u00e3o \u00e9 direcional.\n\nBaseline recomputado em **01/10** por causa do LEARNINGS #100 (o fix anterior testava prefixo e perdia a forma `F1`): o iPhotos s\u00f3 emite `1F`/`7F`/`3F`, ent\u00e3o **o n\u00famero n\u00e3o mudou** \u2014 **153 instala\u00e7\u00f5es 1F em 30 dias no mundo (US 59), 4.694 updates; 413 em 90 dias (US 197)**. Diferen\u00e7a vs o reportado antes: **+0**.\n\nCheckpoints:\n\n| checkpoint | o que decide |\n|---|---|\n| D7 | re-index entrou? `karussell collage` #22 e `bildcollage` #207 no de (rollback = devolver `Collage` ao subtitle) \u00b7 `\u8f6e\u64ad\u56fe\u7f16\u8f91\u5668` #30 e `\u5168\u666f` #177 no cn \u00b7 `panorama b\u00f6lme` **#3** no tr \u00b7 `\u0441\u043a\u0440\u0430\u043f\u0431\u0443\u043a\u0438\u043d\u0433` #56 no ru \u00b7 as 20 posi\u00e7\u00f5es do us intactas \u00b7 a anomalia `iphotos` OUT no de |\n| D14 | as apostas DOMINATE de SERP raso (`grelha de fotos`, `\u0444\u043e\u0442\u043e\u0441\u0435\u0442\u043a\u0438`, `\uc81c\uc791`, `\u62c6\u5206`, `kaydirmali`, `scroll` nos 5 latinos) entraram no alvo? |\n| D21 | impress\u00f5es de busca por territ\u00f3rio vs a janela de 36d do baseline |\n| D28 | posi\u00e7\u00e3o final vs a coluna **alvo D28** da \u00a74, termo por termo; e se o tap rate de ja/ko/zh-Hans/it continuar no ch\u00e3o, a conclus\u00e3o \u00e9 a decis\u00e3o (a), n\u00e3o a keyword |\n\n**CPP**: nenhum candidato a Custom Product Page foi medido nesta itera\u00e7\u00e3o (os 13 `serp_winnability_*.csv` n\u00e3o trazem a coluna), ent\u00e3o nenhum token foi vinculado a p\u00e1gina.\n\n---\n\n## \u26a0\ufe0f 7. Riscos operacionais\n\n1. **zh-Hans: os dois campos t\u00eam que ser aplicados juntos.** `\u8f6e\u64ad` e `\u5168\u666f` sa\u00edram do keyword field porque passaram a viver no subtitle novo. Se s\u00f3 o `keywords.txt` entrar, o store perde `\u8f6e\u64ad` (**6 posi\u00e7\u00f5es**) e `\u5168\u666f` (2 + o cluster) de uma vez. **O read-back do `deploy-verifier` tem que conferir subtitle E keywords nesse locale**, n\u00e3o um dos dois.\n2. **N\u00e3o \u00e9 PATCH num app no ar.** keywords vivem em `appStoreVersionLocalizations` e subtitle em `appInfoLocalizations` do appInfo `PREPARE_FOR_SUBMISSION`; hoje o app s\u00f3 tem a 1.9.0 `READY_FOR_SALE` e um \u00fanico appInfo `READY_FOR_SALE`. Exige a vers\u00e3o nova com build (short `30`, build `34`) e passa por review \u2014 logo o texto s\u00f3 come\u00e7a a contar do `live_at`, depois da aprova\u00e7\u00e3o.\n3. **Duas numera\u00e7\u00f5es paralelas no mesmo app.** A loja exibe 1.9.0, mas o bin\u00e1rio live carrega short version **29**. Pro 1.10.0, `MARKETING_VERSION` e `CURRENT_PROJECT_VERSION` precisam ser setados explicitamente (30 / 34) nos 4 pontos do pbxproj \u2014 errar aqui \u00e9 build recusado no ingest, n\u00e3o bug de ASO.\n4. **Janela de re-index de 3-7 dias.** No en-US, 13 dos 15 tokens ficaram parados de prop\u00f3sito: o churn est\u00e1 concentrado nos 12 locales sem funil a proteger.\n5. **de-DE perdeu peso em `collage`** (3\u00d7 \u2192 1\u00d7). Risco de uma posi\u00e7\u00e3o top-30; mitiga\u00e7\u00e3o j\u00e1 aplicada (token mantido nas keywords) e rollback barato (devolver `Collage` ao subtitle no lugar de `Erstellen`).\n6. **es-MX perdeu `hacer pegatinas` #37** por entrega inexistente, e `difuminar` caiu de 3\u00d7 para 1\u00d7 (5 posi\u00e7\u00f5es, a melhor #41, enfraquecem). Custo declarado e aprovado no est\u00e1gio 4.\n7. **`\u0434\u043b\u044f` no ru (4 chars)**: se a Apple tratar preposi\u00e7\u00e3o como stopword, s\u00e3o 4 chars mortos. \u00c9 o primeiro corte do ru se algum char fizer falta.\n8. **O risco maior n\u00e3o \u00e9 de keyword.** `tr` tem **3,86 em 7 ratings** \u2014 abaixo do penhasco de 4,0 do playbook \u2014 com 1.627 impress\u00f5es e 0,55% de tap. Ranquear mais ali amplifica um funil que j\u00e1 prova n\u00e3o converter: a alavanca do tr \u00e9 nota + tradu\u00e7\u00e3o, e por isso l\u00e1 s\u00f3 foi feito o que \u00e9 quase gr\u00e1tis (dedup de 23 chars + write-off de 19).\n";</script><script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script><script>document.getElementById("md").innerHTML=window.marked?marked.parse(RAW):"<pre>"+RAW.replace(/</g,"&lt;")+"</pre>";</script></div><script>(function(){try{var k="lh.scroll:"+location.pathname;var v=sessionStorage.getItem(k);if(v!==null){sessionStorage.removeItem(k);window.scrollTo(0,parseInt(v,10)||0);}document.addEventListener("submit",function(e){var f=e.target;if(f&&f.method&&f.method.toLowerCase()==="post"){sessionStorage.setItem(k,String(window.scrollY));}},true);}catch(e){}})();</script></body></html>
