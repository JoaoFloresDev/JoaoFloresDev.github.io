<body><div class="wrap"><p class="sub" style="font-size:12px;margin:0 0 14px">Exportado em 2026-10-01 10:29 · fonte: Lab Hub local</p><p class="sub"><a href="../index.html">← hub</a> · <code>_GambitStudio/.claude/skills/release-notes-style/SKILL.md</code></p><div id="md"></div><script>const RAW="---\nname: release-notes-style\ndescription: Style guide pra release notes (whatsNew field) das apps GambitStudio. Sempre 3 linhas curtas, benefit-led, sem exclama\u00e7\u00e3o no fim, com em-dash pra \u00eanfase. Tom casual mas n\u00e3o corporate. Invocar quando o user pedir release notes / whatsNew / \"o que mudou\" pra qualquer app da App Store.\n---\n\nSempre que escrever o campo `release_notes.txt` / `whatsNew` da App Store pras apps do Jo\u00e3o (GambitStudio), seguir EXATAMENTE esta pegada:\n\n## Exemplo can\u00f4nico (escolhido pelo Jo\u00e3o, Dispensado v1.2.0)\n\n```\nAgora estudante do mundo todo pode usar: 10 idiomas dispon\u00edveis.\nVisual do Premium ficou mais limpo e elegante.\nMais r\u00e1pido e est\u00e1vel \u2014 foco no que importa.\n```\n\n## Regras (todas obrigat\u00f3rias)\n\n1. **Exatamente 3 linhas** \u2014 n\u00e3o 2, n\u00e3o 4\n2. **~200 chars no total** (curto, escane\u00e1vel)\n3. **Benefit-led**, n\u00e3o feature-led:\n   - \u274c \"Suporte completo a 10 idiomas: Portugu\u00eas...\"\n   - \u2705 \"Agora estudante do mundo todo pode usar: 10 idiomas dispon\u00edveis\"\n4. **SEM exclama\u00e7\u00e3o (!)** no final de nenhuma linha \u2014 soa corporate/desesperado\n5. **Em-dash (\u2014)** pra \u00eanfase nas linhas que precisam (\"Mais r\u00e1pido e est\u00e1vel \u2014 foco no que importa\")\n6. **Tom casual mas elegante** \u2014 nem t\u00e9cnico corporate, nem g\u00edrias jovens demais\n7. **Linha 1**: a feature/mudan\u00e7a maior, framed como benefit pro user\n8. **Linha 2**: feature secund\u00e1ria ou polish visual\n9. **Linha 3**: performance/estabilidade, mas dita de forma viva (n\u00e3o \"bug fixes and performance improvements\")\n10. **NUNCA** usar template clich\u00ea: \"corre\u00e7\u00f5es de bugs e melhorias de performance\" \u00e9 PROIBIDO\n\n## Por que essa pegada\n\n- App Store BR cheio de release notes corporate/template \u2014 sair disso destaca\n- \"Bug fixes and performance improvements\" \u00e9 mentira-padr\u00e3o que ningu\u00e9m l\u00ea\n- 3 linhas cabe no preview da App Store sem scroll\n- Em-dash d\u00e1 pause de leitura sem usar pontua\u00e7\u00e3o dura\n- Benefit-led aumenta CTR no listing\n\n## Aplica\u00e7\u00e3o\n\nQuando o Jo\u00e3o pedir release notes:\n1. Identificar a mudan\u00e7a maior do release (n\u00e3o \u00e9 sempre a primeira no commit log)\n2. Reformular como BENEFIT do user (n\u00e3o como tarefa de eng)\n3. Pegar 1 outra mudan\u00e7a vis\u00edvel pra linha 2\n4. Linha 3 = performance/estabilidade vivamente\n5. Validar contra as 10 regras acima ANTES de entregar\n\nSe tiver d\u00favida sobre quais mudan\u00e7as destacar, ofere\u00e7a **3 op\u00e7\u00f5es com tons diferentes** (empolgada, direta, benefit-led) \u2014 foi o padr\u00e3o do Jo\u00e3o escolher entre alternativas.\n\n## Anti-exemplos (N\u00c3O fazer)\n\n\u274c `\u2022 Suporte completo a 10 idiomas: Portugu\u00eas (BR/PT), Ingl\u00eas, Espanhol...`\n   \u2192 Bullet t\u00e9cnico, lista exaustiva, parece patch notes\n\n\u274c `Chegou a vers\u00e3o internacional!! Estudante de qualquer lugar do mundo!`\n   \u2192 Exclama\u00e7\u00e3o dupla, soa desesperado\n\n\u274c `Adicionamos suporte a m\u00faltiplos idiomas e melhoramos a UX do Premium.`\n   \u2192 Feature-led (\"adicionamos\"), formal, eng-speak\n\n\u274c `Bug fixes and performance improvements.`\n   \u2192 Clich\u00ea absoluto, traduzido literal sem alma\n";</script><script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script><script>document.getElementById("md").innerHTML=window.marked?marked.parse(RAW):"<pre>"+RAW.replace(/</g,"&lt;")+"</pre>";</script></div><script>(function(){try{var k="lh.scroll:"+location.pathname;var v=sessionStorage.getItem(k);if(v!==null){sessionStorage.removeItem(k);window.scrollTo(0,parseInt(v,10)||0);}document.addEventListener("submit",function(e){var f=e.target;if(f&&f.method&&f.method.toLowerCase()==="post"){sessionStorage.setItem(k,String(window.scrollY));}},true);}catch(e){}})();</script></body></html>
