<body><div class="wrap"><p class="sub" style="font-size:12px;margin:0 0 14px">Exportado em 2026-10-01 10:35 · fonte: Lab Hub local</p><p class="sub"><a href="../index.html">← hub</a> · <code>_GambitStudio/spec/product-playbook.md</code></p><div id="md"></div><script>const RAW="# Product playbook \u2014 o que faz um app do lab dar certo como PRODUTO (2026-09-27, atualizado 2026-09-28)\n\n> Regras de produto do GambitStudio, cada uma com o PORQU\u00ca e o n\u00famero do achado em `spec/research-2026-09-product.md` (21 achados com fonte, 2026-09). Vale pra app novo (`/create-ios-app`) e pra release de app vivo. Tr\u00eas n\u00edveis: **regra** (vale j\u00e1), **refer\u00eancia** (n\u00famero pra comparar, nunca meta absoluta) e **proposta** (s\u00f3 entra depois do Jo\u00e3o decidir \u2014 lista no fim). Onde uma regra daqui muda uma regra dura do `RULES.md`, ela est\u00e1 em \"Decis\u00f5es pendentes do Jo\u00e3o\" e o RULES continua mandando at\u00e9 ele editar.\n> Quem l\u00ea: coordenador do `/create-ios-app` (Fase 1 e 3), `polish-reviewer`, `qa-runner`, `analytics-analyst`, quem for planejar release de app vivo. Detalhe de implementa\u00e7\u00e3o fica em `spec/mandatory-features.md`; monetiza\u00e7\u00e3o em `aso/reference/monetization-playbook.md`.\n\n## 1. Onboarding: valor antes de pedir qualquer coisa (achados 3, 20)\n\n**Regra.** O onboarding padr\u00e3o tem 4 blocos, nesta ordem, 90-180 s no total:\n1. **2-3 steps de feature** (`OnboardingFeaturePager` do OnboardingKit): hero + t\u00edtulo + descri\u00e7\u00e3o, copy de RESULTADO (\"durma melhor em 7 noites\"), n\u00e3o de feature (\"alarme inteligente\"). Copy de resultado vs feature: +17% trial (achado 3).\n2. **2-3 perguntas de personaliza\u00e7\u00e3o** (objetivo, frequ\u00eancia, n\u00edvel; single/multi choice): resposta salva em `@AppStorage` e usada de verdade (default da home, plano sugerido, lembrete). 2-3 perguntas: +8,5% trial, +17% pagantes, +22% ARPU (achado 3). Pergunta que o app n\u00e3o usa \u00e9 atrito, n\u00e3o personaliza\u00e7\u00e3o. Enquanto o OnboardingKit n\u00e3o tiver `OnboardingQuestionStep`, \u00e9 tela pr\u00f3pria do app (mesmo gradiente/CTA do pager) e loga `onboarding_step_viewed` como os outros steps.\n3. **Dados/permiss\u00e3o configurados DENTRO do fluxo**: se o app tem lembrete/notifica\u00e7\u00e3o, o usu\u00e1rio ESCOLHE o hor\u00e1rio no onboarding e a permiss\u00e3o \u00e9 pedida ali, no contexto (+6,4% trial, +24% ARPU, achado 3; opt-in de push no iOS fica em 45-56%, e pedir no momento de relev\u00e2ncia \u00e9 o consenso, achado 20). Primer com UM bot\u00e3o neutro que SEMPRE leva ao di\u00e1logo do sistema; nunca \"Agora n\u00e3o\" (App Review 5.1.1(iv), LEARNINGS #37). Permiss\u00e3o que o app n\u00e3o usa de imediato n\u00e3o entra no onboarding: pede-se na tela que consome (LEARNINGS #4).\n4. **Paywall soft** como \u00faltimo step, s\u00f3 se o app monetiza (\u00a73). O usu\u00e1rio chega nele j\u00e1 com objetivo escolhido e lembrete configurado: paywall multi-p\u00e1gina converte 12,4% vs 9,1% single (achado 3).\n\nPersistir `hasSeenOnboarding = true` s\u00f3 no fim. Queda > 20-30% numa tela (funil `onboarding_step_viewed`) \u00e9 o sinal pra cortar ou reescrever aquela tela. Implementa\u00e7\u00e3o: `spec/mandatory-features.md` \u00a71.\n\n## 2. Ativa\u00e7\u00e3o: `core_action` em D0-D7 \u00e9 a m\u00e9trica (achado 2)\n\n**Regra.** Todo app declara UM `core_action` no `ARCHITECTURE-BRIEF.md` (a a\u00e7\u00e3o em que o usu\u00e1rio obt\u00e9m o valor: registro salvo, c\u00e1lculo feito, alarme armado) e loga `core_action(kind, first)` no ViewModel que persiste, nunca no bot\u00e3o (LEARNINGS #55). Ativa\u00e7\u00e3o = % da coorte com `core_action` at\u00e9 D7. Amplitude, 2.600 empresas: 69% dos produtos no top quartil de ativa\u00e7\u00e3o D7 est\u00e3o no top quartil de reten\u00e7\u00e3o em 3 meses; 7% da coorte voltando no D7 j\u00e1 \u00e9 top 25% (achado 2). D30 \u00e9 consequ\u00eancia, n\u00e3o alvo.\n\nEventos can\u00f4nicos (nomes s\u00f3 de `analytics/event-taxonomy.md`, `verify-analytics.py --strict` antes do release): `onboarding_step_viewed` / `onboarding_completed` / `core_action` / `feature_used` / `screen_view` / `permission_result` / `review_prompt_requested` e, com paywall, `paywall_shown` / `paywall_dismissed` / `purchase_started` / `purchase_success` / `purchase_abandoned` / `purchase_restored` / `premium_gate_hit`. Proposta pra taxonomia (fora deste doc): `onboarding_question_answered(question, answer)` e `post_purchase_viewed`.\n\n## 3. Monetiza\u00e7\u00e3o: decidir na Fase 1, cobrar no dia 0 (achados 4-8; Jo\u00e3o 27/09)\n\n**Regra (Jo\u00e3o 27/09/2026: \"pode parar de ter v1 inteira gr\u00e1tis ent\u00e3o\").** A v1 PODE monetizar. Fluxo:\n- **Fase 1 (PM spec) decide**: o app tem um *gate natural*, uma capacidade que um usu\u00e1rio engajado repete e pagaria (hist\u00f3rico ilimitado, export, 2\u00ba perfil, widget, tema, sem an\u00fancio)? O spec registra a decis\u00e3o em `## Monetiza\u00e7\u00e3o` com uma linha de motivo.\n- **Com gate**: **paywall soft no fim do onboarding** (`PurchaseScaffold` do PaywallKit + StoreKit 2 nativo, nunca RevenueCat; fech\u00e1vel depois do cooldown), planos **semanal + anual**, **trial em UM plano, decidido pelo plano-her\u00f3i** (utilit\u00e1rio de impulso: semanal + 3-5 d, anual direto; h\u00e1bito/sa\u00fade/educa\u00e7\u00e3o: anual + 7-14 d, semanal direto; produtividade/festa: sem trial ou one-time \u2014 regra completa na \"Atualiza\u00e7\u00e3o 2026-09-28\" abaixo; a linha antiga \"trial de 7 dias no anual, sempre\" vale s\u00f3 pra app de h\u00e1bito), plano-her\u00f3i pr\u00e9-selecionado, **tela p\u00f3s-compra** com o pr\u00f3ximo passo dentro do app, gate real em \u2265 1 feature (Apple rejeita IAP que n\u00e3o destrava nada, LEARNINGS #1), restore em Settings. Product IDs `com.gambitstudio.<app>.pro.weekly` / `.pro.yearly`, grupo \"<App> Premium\", `Products.storekit` no scheme (`spec/storekit-extensions.md`).\n- **Sem gate** (app de festa/uso \u00fanico, app cujo AdMob serve an\u00fancio de verdade, LEARNINGS #80): fica gr\u00e1tis, e o spec diz por qu\u00ea. \"Gr\u00e1tis\" \u00e9 decis\u00e3o registrada, n\u00e3o default.\n- **Apps vivos**: app a app, nunca release magra (mem\u00f3ria `feedback_no_thin_releases`), um por vez (cad\u00eancia de submiss\u00e3o), primeiro os que j\u00e1 t\u00eam sinal (D7 \u2265 7% e \u2265 25 ratings).\n\n**Por qu\u00ea.** 82-90% dos trials e 50% das convers\u00f5es pagas acontecem no DIA 0 (achado 4); paywall adicionado \"depois\" s\u00f3 alcan\u00e7a quem volta, 5-8% da coorte no D30 (achado 1). Hard paywall converte 10,7% vs 2,1% e rende US$ 3,09 vs 0,38 por install com a mesma reten\u00e7\u00e3o de 12 meses (27% vs 28%, achado 5). Trial 5-9 dias converte 45,9% vs 39,6% de \u2264 4 dias (planos MENSAIS \u2014 no semanal a dura\u00e7\u00e3o quase n\u00e3o importa e o que importa \u00e9 ter trial; no anual \u2264 4 d \u00e9 a pior c\u00e9lula: ver Atualiza\u00e7\u00e3o 2026-09-28); trial de 3 dias \u00e9 cancelado 55% no dia 0 e 84% at\u00e9 D1 (achado 6). Semanal \u00e9 55,5% da receita mas ret\u00e9m 5,5% em D380 contra 19,9% do anual com trial (achado 7). Mediana do app pago: US$ 492/m\u00eas; 17,3% chegam a US$ 1k MRR em 2 anos; 20 apps gr\u00e1tis rendem, em expectativa, zero (achado 8).\n\n**Ressalva de sobreviv\u00eancia (n\u00e3o esconder).** Os dados de hard paywall e trial longo v\u00eam de apps que J\u00c1 cobram e de usu\u00e1rios que ficaram tempo suficiente pra converter; a pr\u00f3pria RevenueCat diz que \u00e9 correla\u00e7\u00e3o. A paridade de reten\u00e7\u00e3o 27/28% n\u00e3o diz o que acontece quando um app GR\u00c1TIS passa a cobrar dos usu\u00e1rios atuais. Por isso o default \u00e9 **soft** (fech\u00e1vel), e app vivo migra com A/B por `variant` (playbook de monetiza\u00e7\u00e3o \u00a72), n\u00e3o por decreto.\n\n**Pre\u00e7o por pa\u00eds (achado 10).** \u00cdndia a -90% do pre\u00e7o US deu +128% de receita no pa\u00eds; apps otimizados precificam \u00cdndia 50-80% abaixo dos EUA (a Apple sugere -21%); Brasil +31% de gasto n\u00e3o-game a/a; M\u00e9xico cresce na mesma faixa; Europa cobra 29-39% acima da Am\u00e9rica do Norte. Regra: todo app pago sai com pre\u00e7o por tier, n\u00e3o com equaliza\u00e7\u00e3o autom\u00e1tica da Apple. Ponto de partida: Tier 1 (US/EU/UK/CA/AU) 1,0; BR/MX 0,5; IN 0,2. Via API: price point base USA + `equalizations` + 1 POST por territ\u00f3rio (LEARNINGS #1, #48). Script `scripts/asc/localize_prices.py` a criar (proposta 4 da pesquisa).\n\n**Reten\u00e7\u00e3o de assinante (achado 9).** 20% dos mensais que cancelam reativam em 12 meses. Duas alavancas na ASC, sem build: **Retention Messaging** (oferta na tela de cancelamento, liberada pra todos os devs) e **win-back offers** (`POST /v1/winBackOffers` por API, submiss\u00e3o s\u00f3 no web UI, LEARNINGS #1). Todo app com assinatura configura as duas antes da pr\u00f3xima itera\u00e7\u00e3o de ASO. **Small Business Program** (15%): opt-in na ASC, proceeds l\u00edquidos \u2264 US$ 1M (achado 11); conferir o enrolamento.\n\nDetalhe (planos, trial por categoria, upgrade weekly\u2192anual, o que testar primeiro): `aso/reference/monetization-playbook.md`.\n\n## 4. Reten\u00e7\u00e3o: refer\u00eancia por categoria, nunca n\u00famero absoluto (achado 1)\n\n**Refer\u00eancia.** As fontes divergem 2x entre si (Pushwoosh iOS D30 3,1% vs AppsFlyer/Adjust 5-8% vs Mixpanel top quartil ~20%). Usar a faixa da categoria e o pr\u00f3prio hist\u00f3rico do app:\n\n| Categoria | D1 | D7 | D30 |\n|---|---|---|---|\n| Produtividade | 40-50% | 22-28% | 12-18% |\n| Health & Fitness | 35-45% | 15-22% | 8-12% |\n| Games | 40-50% | 12-18% | 5-8% |\n| Geral (todas) | 30-40% | 10-15% | 5-8% |\n| iOS mediana (Pushwoosh) | ~24% | 6,9% | 3,1% |\n\nUtilities e Lifestyle n\u00e3o t\u00eam corte limpo em fonte prim\u00e1ria: usar \"geral\". Funil de refer\u00eancia (Adapty/RevenueCat 2026): install\u2192trial 10,9%, trial\u2192pago 25,6%, D35 pago com hard paywall 10,7%. Cohort com n < 30 \u00e9 direcional (RULES \"M\u00e9tricas\"); cobertura GA4 < 25% \u00e9 amostra enviesada.\n\n## 5. Qualidade: crash-free e o sensor que prova (achados 17, 19; LEARNINGS #85-#90)\n\n**Regra.** Crashlytics \u00e9 obrigat\u00f3rio junto do Analytics em todo app (mandatory-features \u00a79): app sem Crashlytics n\u00e3o tem 100% de crash-free, tem zero informa\u00e7\u00e3o (LEARNINGS #86). Firebase/Ads com `exactVersion` no `project.yml` (LEARNINGS #90). Feature com gatilho condicional se valida FOR\u00c7ANDO o ramo, n\u00e3o abrindo o app (LEARNINGS #85).\n**Meta 2026:** crash-free de sess\u00f5es **\u2265 99,9%** na vers\u00e3o da loja. Mercado: mediana 99,95%, P25 99,77%, P75 99,99%; ~99,7% correlaciona com 3 estrelas e ~99,85% com 4,5+ (achado 19). Leitura sempre por vers\u00e3o live e sem simulador (`x86_64`/`arm64` no deviceModel, LEARNINGS #54, #86).\n**Proposta:** `firebase_snapshot.py` com verde \u2265 99,9 / amarelo \u2265 99,77 / vermelho abaixo, e 99,77% como bloqueio de release (hoje o piso codificado \u00e9 99,5%).\n\n## 6. Ratings: prompt nativo no aha e resposta em 72 h (achados 12-14)\n\n**Regra (j\u00e1 em RULES \"Pipeline de ratings\", LEARNINGS #88).** S\u00f3 o prompt nativo, direto no aha-moment escolhido, com o throttle no `ReviewService` (\u2265 3 aha, 90 dias, \u2264 3/ano, 1/vers\u00e3o, foreground). \u00c9 exatamente a orienta\u00e7\u00e3o da Apple: at\u00e9 3 pedidos em 365 dias, \"when users are most likely to feel satisfaction\", \"not interrupt\" (achado 12). Aritm\u00e9tica: cada 1 estrela exige sete 5 estrelas pra segurar 4,5; convers\u00e3o tap\u2192install ~50% acima de 4,5 vs < 30% abaixo de 3,5 (vendors, achado 12).\n**Regra nova: responder toda review em \u2264 72 h.** Reply rate 30-50% \u00e9 o pico de nota (3,77 vs 3,25 de quem responde 0-1%); depois de 72 h a resposta quase n\u00e3o muda a nota; 4,4% dos autores sobem a nota ap\u00f3s resposta vs 0,7% sem (achado 13). Quem responde \u00e9 o `review-responder`; a fila \u00e9 a coluna do Lab Hub (RULES: nunca item no now.json). Reescrever resposta s\u00f3 quando a promessa foi cumprida numa vers\u00e3o LIVE (LEARNINGS #80c).\n**Review Summaries por LLM** j\u00e1 existem em 9 storefronts em ingl\u00eas (achado 14): reclama\u00e7\u00e3o repetida vira par\u00e1grafo p\u00fablico na p\u00e1gina. O `analytics-analyst` lista os 3 temas mais frequentes das reviews de 90 dias por app.\n**Dado do lab (auditoria 27/09, `reports/2026-09-27_results-audit/aso.md` \u00a75):** 13 dos 20 apps est\u00e3o abaixo de 25 ratings na loja-alvo; apps com ~200-300 instala\u00e7\u00f5es/30d somaram 0-1 rating (Hair, Walk, BLW). Antes de qualquer ASO nesses apps, auditar se o `recordPositiveEvent` dispara de verdade e se o aha est\u00e1 bem escolhido (regra rating-first do RULES).\n\n## 7. Widgets, App Intents e Live Activities: alavanca quando o job \u00e9 \"olhar r\u00e1pido\" (achado 16)\n\n**Op\u00e7\u00e3o, n\u00e3o regra.** Evid\u00eancia de reten\u00e7\u00e3o \u00e9 fraca (uma anedota B2B +34% de ativos; correla\u00e7\u00e3o Mixpanel D30 9,1% vs 5,8% com assistente in-app). O custo \u00e9 baixo: um `AppIntent` \u00fanico exp\u00f5e o app em Siri, Spotlight, Shortcuts, widgets, Controls e Apple Intelligence; iOS 26 traz push-to-start e bot\u00f5es interativos em Live Activities. Entra no brief do `screen-builder` quando o job do app \u00e9 consultar um n\u00famero/estado (passos, fase, pr\u00f3ximo alarme, tarefa do dia); n\u00e3o entra em app de fluxo longo. Widget = App Group (portal manual, LEARNINGS #83) ou keychain como canal (#83b); print do widget s\u00f3 se ele existir (RULES Screenshots).\n\n## 8. App Review 2026: o que rejeita de verdade (achado 17 + LEARNINGS)\n\n9,1M submiss\u00f5es em 2025, 2M+ rejeitadas; a mais citada \u00e9 a **2.1** (crash, bug, placeholder, IAP que n\u00e3o funciona), depois privacidade (443k) e copycat/enganoso (371k). Planejar com **3 dias** de review (as duas vers\u00f5es oficiais s\u00e3o \"90% em 24 h\" e \"90% em 48 h\"; relatos de 2026 d\u00e3o 2-3 dias em iOS). Checklist do que j\u00e1 pegou o lab:\n- Crash na abertura pega no scan autom\u00e1tico da Apple, sem stack trace; `app_exception` + trilha por minuto no GA4 localiza (LEARNINGS #85). Console do `devicectl` por 20 s depois de todo install (#89).\n- **Age rating**: question\u00e1rio novo com 8 campos obrigat\u00f3rios e coer\u00eancia com o conte\u00fado (bebidas, +18, an\u00fancios) (#65b, #77); o `preflight.py --only rating` cruza.\n- **5.1.1(iv)**: primer de permiss\u00e3o com um bot\u00e3o neutro, sem \"Agora n\u00e3o\" (#37). **5.1.2(i)**: consentimento expl\u00edcito antes de mandar dado pra IA de terceiros (novo em 11/2025).\n- **2.5.14**: l\u00e9xico spy/stealth/secret em TODOS os locales, n\u00e3o s\u00f3 nos 3 do disco (#37, #40); `preflight.py --only asc`.\n- **NS*UsageDescription** pra toda API que pede permiss\u00e3o: sem ela \u00e9 SIGABRT determin\u00edstico (#79); `preflight.py --only perms`.\n- **Links vivos** em privacy/support/marketing: encurtador morre com o servi\u00e7o (#76); `preflight asc.urls`.\n- **iPad**: app iPhone-only \u00e9 testado em iPad e reprova se quebrar; portrait-only + iPad exige `UIRequiresFullScreen` (#33, #37, #43).\n- **4.1(c)** marca/\u00edcone alheio; **4.7** mini apps HTML5; **1.2.1(a)** creator apps; 1\u00ba grupo de assinaturas s\u00f3 submete junto de uma vers\u00e3o e pelo web UI (#44, #51).\n- **Accessibility Nutrition Labels** (opcionais, pesquis\u00e1veis na busca, crit\u00e9rio de featuring): o lab j\u00e1 entrega 44 pt, texto sem truncar e `accessibilityLabel` em todo controle; preencher as labels custa minutos.\n\n## 9. URL scheme e In-App Events (LEARNINGS #94)\n\n**Regra.** Todo app registra `CFBundleURLTypes` com o scheme `<appname>://` e trata `.onOpenURL` no `@main` abrindo o conte\u00fado principal (`<appname>://home` cai na tela inicial; hosts extras por feature). Sem isso n\u00e3o existe In-App Event (a submiss\u00e3o exige `deepLink` pro conte\u00fado DENTRO do app; link da App Store n\u00e3o serve) nem deep link de widget/notifica\u00e7\u00e3o. Conferir no plist COMPILADO da vers\u00e3o live antes de montar um evento. Detalhe: `spec/mandatory-features.md` \u00a710.\n\n## 10. Featuring: passo opcional, com 2 semanas a 3 meses de anteced\u00eancia (achado 18)\n\n**Opcional (Jo\u00e3o 27/09: testar UMA nomination primeiro; n\u00e3o vira rotina de release).** Sete crit\u00e9rios p\u00fablicos: UX, UI design, inova\u00e7\u00e3o (\"new technologies\"), unicidade, acessibilidade, localiza\u00e7\u00e3o (\"high-quality support for multiple languages\") e product page (\"positive ratings and reviews\"). Efeito: App of the Day +1.747% (dado de 2017); estimativas 2026 de 3-20x na janela de 24 h pra produtividade de nicho. Quando o release tem feature nova de verdade: `scripts/asc/nominate.py --app-id N --name ... --description-file ...` cria o rascunho em ASC > Featuring > Nominations (`--submit` envia). Candidatos naturais: apps com 39 locales, paywall e nota \u2265 4,5.\n\n## 11. Portf\u00f3lio: distribui\u00e7\u00e3o e c\u00f3digo compartilhado, ou nada (achados 8, 21)\n\nContexto, n\u00e3o regra. Usu\u00e1rio abre ~10 apps/dia e 34/m\u00eas; 557k apps novos em 2025; mediana caindo. Portf\u00f3lio de 28-30 apps a US$ 22-25k/m\u00eas existe, mas com ASO agressivo, template \u00fanico e paywall desde o dia 0; o caso mediano \u00e9 9 apps e US$ 2,8k em 3 anos. A conta da meta (US$ 4k l\u00edquidos \u2248 US$ 4,7k brutos a 15%): ~10 apps pagos na mediana da Adapty, ou 1-2 no top decil. Consequ\u00eancia pr\u00e1tica: app novo s\u00f3 nasce com nicho pesquisado (`/research-aso-keywords`), kits do lab e decis\u00e3o de monetiza\u00e7\u00e3o na Fase 1; app vivo sem sinal fica congelado (veto de release magra).\n\n## 12. Proposta: crit\u00e9rio de SCALE no `kill_or_scale.py`\n\n**Proposta (n\u00e3o aplicada).** Hoje SCALE = \u2265 20 downloads/dia OU run-rate \u2265 US$ 300/m\u00eas, com nudge de reten\u00e7\u00e3o. Proposta: SCALE exige os TR\u00caS sinais: **D7 \u2265 7%** (n \u2265 30; achado 2), **\u2265 25 ratings** na loja-alvo (regra rating-first) e **paywall presente** (achados 4-5: sem paywall n\u00e3o h\u00e1 o que escalar). App sem os tr\u00eas: WATCH, com a nota de qual sinal falta. KILL continua por distribui\u00e7\u00e3o + receita zero, com o guard de reten\u00e7\u00e3o atual.\n\n## 13. Liquid Glass e Xcode 27: decis\u00e3o pendente (achado 15)\n\n**Hoje:** `UIDesignRequiresCompatibility = YES` em todo app (RULES), exce\u00e7\u00f5es s\u00f3 quando o Jo\u00e3o pede app a app (Walk, iPhotos, Cronos, College). N\u00e3o h\u00e1 evid\u00eancia p\u00fablica de que o opt-out custe convers\u00e3o, rating ou featuring. **O prazo \u00e9 real:** a Apple diz que remove a op\u00e7\u00e3o \"in the next major Xcode release\" (Xcode 27), e a exig\u00eancia de SDK 27 chega por volta de abr/2027. O playbook n\u00e3o muda o default; registra que os apps pagos (os que valem featuring, crit\u00e9rio \"new technologies\") s\u00e3o os primeiros a migrar quando o Jo\u00e3o decidir.\n\n## Atualiza\u00e7\u00e3o 2026-09-28 (pesquisa onboarding/paywall/analytics)\n\nFonte: `spec/research-2026-09-onboarding-paywall-analytics.md` (18 achados com tag de fonte). Gatilho: o dado do pr\u00f3prio portf\u00f3lio \u2014 Jo\u00e3o, 28/09 (mem\u00f3ria `user_trial_and_onboarding_insight`): \"o 3 day trial fez app que nem faturava come\u00e7ar a dar um dinheirinho\". A pesquisa de 27/09 dizia \"7 dias converte mais\"; as duas coisas coexistem porque a m\u00e9dia de 7 dias \u00e9 dos planos **mensais** e o trial de 3 dias do Jo\u00e3o estava no **semanal**. O que muda de regra:\n\n**1. Trial por plano-her\u00f3i, n\u00e3o por decreto (achados 1-3; substitui o \"7 dias no anual, sempre\" de 27/09).** O `## Monetiza\u00e7\u00e3o` da Fase 1 declara o plano-her\u00f3i (o que carrega a receita) e o trial vai S\u00d3 nele:\n\n| Plano-her\u00f3i (tipo de app) | Trial | Outro plano | N\u00famero que sustenta |\n|---|---|---|---|\n| **Semanal** \u2014 utilit\u00e1rio de impulso, uso espor\u00e1dico (cofre, anti-furto, calculadora, c\u00e2mera, editor) | **semanal + 3 dias** (A/B 5 d: +8 pp de 1\u00aa renova\u00e7\u00e3o) | anual **direto** (\u00e2ncora) | RevenueCat 17k apps: semanal \u2264 4 d 22,3% conv / 57,9% 1\u00aa renova\u00e7\u00e3o vs 5-9 d 24,3% / 65,9%; sem trial renova 35,9%; Adapty Utilities: weekly $5,99 + 3 d = 1,5x o LTV m\u00e9dio, semanal = 74% da receita da categoria; Jo\u00e3o: 3 d no semanal destravou receita em apps parados |\n| **Anual** \u2014 h\u00e1bito/sa\u00fade/educa\u00e7\u00e3o/fam\u00edlia, uso di\u00e1rio (passos, sono, BLW, idiomas, cabelo) | **anual + 7 dias** (A/B 14 d: 43% vs 33%) | semanal **direto** ou mensal | anual \u2264 4 d = 24% / 18,3% (pior c\u00e9lula da tabela); 10-16 d = 43% / 36,4% |\n| Produtividade / lifestyle / festa (tarefas, reflex\u00e3o, baralho) | **sem trial** | semanal ou mensal direto + anual direto, ou **one-time** | Adapty: trial reduz LTV 14-21% em Productivity/Lifestyle; one-time = 10,3% do mercado |\n| Qualquer um | **nunca \u2264 4 d no anual \u00b7 nunca trial nos dois planos \u00b7 nunca toggle de trial** | \u2014 | achados 1 e 7 (Apple rejeita o toggle por 3.1.2 desde jan/2026) |\n\nApps j\u00e1 publicados com \"semanal sem trial + anual 7 d\" (padr\u00e3o de 27/09) que sejam utilit\u00e1rios: corrigir por A/B (`variant`), um app por vez, come\u00e7ando pelo de maior tr\u00e1fego semanal \u2014 trial \u00e9 c\u00f3digo + intro offer, ent\u00e3o custa release (monetization-playbook \u00a73b).\n\n**2. Ordem dos experimentos (achado 9):** placement (onboarding vs in-app) \u2192 trial (plano/dura\u00e7\u00e3o) \u2192 n\u00ba de planos/pre\u00e7o \u2192 localiza\u00e7\u00e3o \u2192 copy. Copy/visual \u00e9 o teste que menos vence (34,6%); trial, dura\u00e7\u00e3o, planos e localiza\u00e7\u00e3o vencem em ~60%. Meta: \u2265 4 testes estruturais/ano por app pago (top = 14,7).\n\n**3. Valor antes do paywall (achados 11, 13).** Paywall antes do valor \u00e9 a maior queda do funil (30-60%). \"Valor\" num utilit\u00e1rio pode ser um preview do resultado com o dado da pergunta de onboarding (\"sua matriz\", \"sua semana\", \"seu cofre\") \u2014 foi o que dobrou as assinaturas do Jigger (5 \u2192 9, n pequeno, dire\u00e7\u00e3o certa). Entra como step antes do paywall (`OnboardingPreviewStep`, proposta 7 da pesquisa) e loga `onboarding_step_viewed` como os outros.\n\n**4. Timeline \"como funciona seu trial\" + lembretes (achados 6, 8).** No paywall, quando o plano selecionado tem trial: \"Hoje: acesso total \u2192 Dia N-2: lembrete \u2192 Dia N: cobran\u00e7a\" e a promessa de avisar antes (Blinkist: +23% trial starts, -55% reclama\u00e7\u00f5es, opt-in de push 6% \u2192 74%). Lembretes locais em 6 h (ativa\u00e7\u00e3o), T-2 dias e manh\u00e3 do \u00faltimo dia (`trial_reminder_scheduled(kind)`); o pedido de push acontece na tela p\u00f3s-compra. CTA com dura\u00e7\u00e3o e pre\u00e7o p\u00f3s-trial (\"3 dias gr\u00e1tis, depois R$ 9,90/semana\") \u2014 \u00e9 o que a Apple exige na tela (achado 8).\n\n**5. Exit offer com intro offer REAL (achado 5).** Uma vez, s\u00f3 depois de `purchase_abandoned(reason=cancelled)` ou do dismiss do paywall de onboarding, com intro offer PAY_AS_YOU_GO/PAY_UP_FRONT configurada na ASC e prazo verdadeiro de 24 h persistido (Superwall: 17% da receita, refund 3,3% vs 6,8%). Nunca reexibir pra quem recusou; contador que reinicia \u00e9 bait-and-switch (achado 8). Eventos `exit_offer_shown` / `exit_offer_accepted`, `source=exit_offer` na compra.\n\n**6. Prova social verific\u00e1vel e Apple-compliant (achados 8, 12).** Nota real e n\u00ba de usu\u00e1rios (da loja, nunca \"App do Ano\"), antes do CTA; 2 planos, n\u00e3o 3; valor cobrado em destaque, \"por m\u00eas\" e \"SAVE %\" subordinados; compara\u00e7\u00e3o Free vs Pro \u2264 4 linhas; \"Fechar\" vis\u00edvel (refund do hard \u00e9 70% maior, achado 4); restore vis\u00edvel.\n\n**7. P\u00f3s-compra (achados 3, 6).** Tela `PostPurchaseView` com UM pr\u00f3ximo passo e o pedido de push ali; `post_purchase_shown` can\u00f4nico. No semanal tudo se decide na semana 1 (1\u00aa renova\u00e7\u00e3o ~50%, 2\u00aa ~75-80%): reminder e p\u00f3s-compra trabalham nessa janela.\n\n**8. Analytics que decidem, n\u00e3o olh\u00f4metro (achados 17-18).** Firebase N\u00c3O v\u00ea trial\u2192pago, renova\u00e7\u00e3o nem refund; a fonte \u00e9 a ASC (`scripts/asc/subscription_events.py`, relat\u00f3rios `SUBSCRIPTION_EVENT` + `SUBSCRIBER`). A tabela de m\u00e9tricas semanais com a fonte de cada uma est\u00e1 em `analytics/event-taxonomy.md` \u00a77; benchmarks por plano no `analytics-analyst`. Trial\u2192pago por plano \u00e9 a manchete de monetiza\u00e7\u00e3o de todo report.\n\n## Material pra acompanhar\n\nLista curada (pesquisa 28/09; revisar a cada trimestre \u2014 mem\u00f3ria `user_trial_and_onboarding_insight`). Cad\u00eancia = quando ler.\n\n| Fonte | Cad\u00eancia | Por que |\n|---|---|---|\n| **RevenueCat State of Subscription Apps** + blog Growth \u2014 [revenuecat.com/state-of-subscription-apps](https://www.revenuecat.com/state-of-subscription-apps) | anual (mar) + semanal | base de todo benchmark por plano/categoria; ler o cap\u00edtulo da categoria de cada app pago |\n| **Adapty State of In-App Subscriptions** + benchmarks por categoria \u2014 [adapty.io/state-of-in-app-subscriptions](https://adapty.io/state-of-in-app-subscriptions/) | anual + por categoria | \u00fanico com LTV por configura\u00e7\u00e3o de trial/plano |\n| **Sub Club** (podcast + newsletter, RevenueCat) \u2014 [subclub.com](https://subclub.com/) | semanal | entrevistas com n\u00fameros (Mojo, Flighty, HabitKit) |\n| **Growth Gems** (Sylvain Gauchet) \u2014 [growthgems.substack.com](https://growthgems.substack.com/) | semanal | destila podcasts de growth em \"gems\" com atribui\u00e7\u00e3o |\n| **Superwall blog + case studies** \u2014 [superwall.com/blog](https://superwall.com/blog) | mensal | padr\u00f5es de paywall com receita citada e compliance |\n| **Launched** (Charlie Chapman) \u2014 [launchedfm.com](https://launchedfm.com/) | quinzenal | indies com n\u00fameros (R\u00f6hl, Jordan Morgan) |\n| **Indie Dev Monday** (Josh Holtz) \u2014 [indiedevmonday.com](https://indiedevmonday.com/) | semanal | 1-2 indies por edi\u00e7\u00e3o |\n| **iOS Dev Weekly** (Dave Verwer) | semanal | itens de neg\u00f3cio no fim |\n| **Indie App Devs** (Justas Markus) \u2014 [indieappdevs.substack.com](https://indieappdevs.substack.com/) | semanal | dicas curtas |\n| **Sebastian R\u00f6hl, Weekly Indie Log** \u2014 [sebastianroehl.substack.com](https://sebastianroehl.substack.com/) | semanal | receita crua de um indie de US$ 600k/ano |\n| **Indie Developer Diaries** (Oleh) \u2014 [indiedeveloperdiaries.substack.com](https://indiedeveloperdiaries.substack.com/) | mensal | n\u00fameros de app de \u20ac30/m\u00eas \u2014 o nosso tamanho |\n| **Amplitude Product Benchmark Report** \u2014 [amplitude.com](https://amplitude.com/blog/time-to-value-drives-user-retention) | anual | ativa\u00e7\u00e3o/reten\u00e7\u00e3o por percentil |\n| **Growth.Design case studies** \u2014 [growth.design](https://growth.design/case-studies/trial-paywall-challenge) | mensal | testes de UX com n\u00fameros (Blinkist) |\n| **Phiture Mobile Growth Stories** \u2014 [phiture.com](https://phiture.com/mobilegrowthstories-newsletter/) | mensal | ag\u00eancia, mas cita fontes |\n| **Apple: Auto-renewable subscriptions + Review Guidelines** \u2014 [developer.apple.com/app-store/subscriptions](https://developer.apple.com/app-store/subscriptions/) | a cada WWDC e a cada rejei\u00e7\u00e3o | o que a tela de compra TEM que mostrar (3.1.2) |\n\nDescartados: \"Growth Blazers\" (comunidade B2B) e \"Apps of the week\" (n\u00e3o existe como newsletter).\n\n## Decis\u00f5es pendentes do Jo\u00e3o\n\nItens que mudam uma regra dura do `RULES.md` (e os espelhos em `~/.claude/CLAUDE.md`, `spec/feature-flags.md`, `spec/storekit-extensions.md`, `spec/git-ci-cd.md`). At\u00e9 o texto do RULES mudar, o RULES manda.\n1. **\"Apps sempre gr\u00e1tis na v1\"** \u2014 APLICADA em 27/09/2026: RULES.md, `~/.claude/CLAUDE.md`, INDEX, COMMANDS e `spec/feature-flags.md` j\u00e1 dizem \"monetiza\u00e7\u00e3o decidida na Fase 1\" (\u00a74 deste playbook). Nada pendente aqui.\n2. **\"Liquid Glass SEMPRE desabilitado\"** (RULES): manter ou agendar a migra\u00e7\u00e3o antes de abr/2027 (\u00a713). Sem dado de convers\u00e3o; s\u00f3 o calend\u00e1rio.\n3. **Onboarding \"2-3 features \u2192 dados \u2192 permiss\u00e3o\"** \u2014 APLICADA em 27/09/2026 no RULES (perguntas entre features e dados; `OnboardingQuestionStep` no kit 02e8e88). Texto original: incluir as 2-3 perguntas de personaliza\u00e7\u00e3o entre features e dados/permiss\u00e3o (\u00a71) e, se aprovado, o `OnboardingQuestionStep` no OnboardingKit.\n";</script><script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script><script>document.getElementById("md").innerHTML=window.marked?marked.parse(RAW):"<pre>"+RAW.replace(/</g,"&lt;")+"</pre>";</script></div><script>(function(){try{var k="lh.scroll:"+location.pathname;var v=sessionStorage.getItem(k);if(v!==null){sessionStorage.removeItem(k);window.scrollTo(0,parseInt(v,10)||0);}document.addEventListener("submit",function(e){var f=e.target;if(f&&f.method&&f.method.toLowerCase()==="post"){sessionStorage.setItem(k,String(window.scrollY));}},true);}catch(e){}})();</script></body></html>
