<body><div class="wrap"><p class="sub" style="font-size:12px;margin:0 0 14px">Exportado em 2026-10-01 12:21 · fonte: Lab Hub local</p><p class="sub"><a href="../index.html">← hub</a> · <code>_GambitStudio/.claude/skills/build-ios/SKILL.md</code></p><div id="md"></div><script>const RAW="---\nname: build-ios\ndescription: Build an iOS (SwiftUI/UIKit) or Flutter app following the GambitStudio patterns \u2014 auto-detects project type (xcodegen / xcodeproj / xcworkspace / Flutter), regenerates Xcode project if stale, prioritizes physical device over simulator, captures clean error summary, and returns concise pass/fail status. Use when the user types `/build-ios` or says \"build the app\", \"compila o app\", \"build pro device\", \"roda no simulador\", \"ver se compila\", \"fix os erros e tenta de novo\".\n---\n\n# Build iOS\n\nTriggered by the user typing `/build-ios` from the root of an iOS or Flutter project, OR any natural-language ask to build/compile/run the iOS app.\n\n## Golden rule \u2014 DEVICE FIRST, always\n\nPer `~/.claude/CLAUDE.md` (\"Autonomia\") and `_GambitStudio/RULES.md` (Autonomia total \u2014 device first), try physical device first, fall back to simulator only if no device is connected. Do not ask the user which destination \u2014 pick deterministically.\n\n## Toolchain \u2014 `DEVELOPER_DIR` on EVERY xcodebuild / simctl / devicectl call\n\n`xcode-select` points at the CLT (or an old Xcode) while the newest Xcode lives at `/Applications/Xcode 2.app` (LEARNINGS #47). Export it once, before any `xcodebuild`, `xcrun simctl` or `xcrun devicectl`:\n\n```bash\nexport DEVELOPER_DIR=\"/Applications/Xcode 2.app/Contents/Developer\"\n```\n\nWithout it the build resolves the wrong SDK / simulator runtime. The renamed Xcode also breaks `open -a Simulator` \u2014 open it by path: `open \"$DEVELOPER_DIR/Applications/Simulator.app\"`.\n\n## Inputs (auto-detected, never ask)\n\n| Input             | How to detect                                                                |\n|-------------------|------------------------------------------------------------------------------|\n| Project root      | Walk up from cwd until finding `project.yml`, `*.xcodeproj`, `*.xcworkspace`, or `pubspec.yaml` |\n| Project type      | Flutter if `pubspec.yaml`; else xcodegen if `project.yml`; else xcodeproj/xcworkspace |\n| Scheme            | Match `*.xcodeproj` basename, OR `Runner` for Flutter, OR explicit `--scheme` |\n| Destination       | Physical device first (via `xcrun xctrace list devices`), then a simulator LEASED from `tools/sim-pool` (never one you boot yourself) |\n| Configuration     | `Debug` by default, `Release` only if `--release` flag                        |\n\n## Step 1 \u2014 Discover project\n\n```bash\n# Walk up from cwd to find one of these markers (max 5 levels)\nPROJECT_ROOT=\"$(pwd)\"\nwhile [[ \"$PROJECT_ROOT\" != \"/\" ]]; do\n  if compgen -G \"$PROJECT_ROOT/project.yml\" > /dev/null \\\n  || compgen -G \"$PROJECT_ROOT/*.xcodeproj\" > /dev/null \\\n  || compgen -G \"$PROJECT_ROOT/*.xcworkspace\" > /dev/null \\\n  || [[ -f \"$PROJECT_ROOT/pubspec.yaml\" ]]; then\n    break\n  fi\n  PROJECT_ROOT=\"$(dirname \"$PROJECT_ROOT\")\"\ndone\n[[ \"$PROJECT_ROOT\" == \"/\" ]] && { echo \"\u274c no iOS/Flutter project found in any parent dir\"; exit 1; }\n\n# Classify\nif [[ -f \"$PROJECT_ROOT/pubspec.yaml\" ]]; then\n  PROJECT_TYPE=\"flutter\"\nelif [[ -f \"$PROJECT_ROOT/project.yml\" ]]; then\n  PROJECT_TYPE=\"xcodegen\"\nelif compgen -G \"$PROJECT_ROOT\"/*.xcworkspace > /dev/null; then\n  PROJECT_TYPE=\"xcworkspace\"\nelse\n  PROJECT_TYPE=\"xcodeproj\"\nfi\necho \"\ud83d\udcc1 project: $PROJECT_ROOT (type: $PROJECT_TYPE)\"\n```\n\n## Step 2 \u2014 Regen xcodegen if stale\n\n**Per `_GambitStudio/RULES.md` + LEARNINGS #9**: never edit `.pbxproj` manually. If `project.yml` is newer than `.xcodeproj`, regen.\n\n```bash\nif [[ \"$PROJECT_TYPE\" == \"xcodegen\" ]]; then\n  cd \"$PROJECT_ROOT\"\n  PROJ_NAME=$(grep \"^name:\" project.yml | head -1 | awk '{print $2}')\n  XCODEPROJ=\"$PROJECT_ROOT/${PROJ_NAME}.xcodeproj\"\n\n  if [[ ! -d \"$XCODEPROJ\" ]] || [[ \"project.yml\" -nt \"$XCODEPROJ/project.pbxproj\" ]]; then\n    echo \"\ud83d\udd27 regenerating $PROJ_NAME.xcodeproj (project.yml is newer or missing)\"\n    which xcodegen >/dev/null || brew install xcodegen\n    xcodegen generate\n  fi\nfi\n```\n\n## Step 3 \u2014 Pick destination (DEVICE FIRST)\n\n```bash\n# Detect physical devices (excluding simulators + headers)\nDEVICE_UDID=$(xcrun xctrace list devices 2>&1 \\\n  | grep -v \"Simulator\" \\\n  | grep -v \"^==\" \\\n  | grep -E '\\([0-9A-F]{8}-[0-9A-F]{4,}\\)' \\\n  | head -1 \\\n  | grep -oE '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}|[0-9A-F]{8}-[0-9A-F]{16}')\n\nif [[ -n \"$DEVICE_UDID\" ]]; then\n  DEST=\"platform=iOS,id=$DEVICE_UDID\"\n  echo \"\ud83d\udcf1 physical device: $DEVICE_UDID\"\nelse\n  # Fallback simulator \u2014 ONLY through the shared pool (RULES 12/09/2026: max 2 simulators on this Intel\n  # Mac, every session/agent goes through the queue). Never `simctl` create/clone/boot a device of your\n  # own; the pool boots the leased device for you. Always address it by explicit UDID, never \"booted\"\n  # (LEARNINGS #41 \u2014 another session's simulator answers to \"booted\").\n  SIMPOOL=_GambitStudio/tools/sim-pool/simpool.py\n  SIM_OWNER=\"build-ios:${PROJ_NAME:-$(basename \"$PROJECT_ROOT\")}\"\n  GRANT=$(python3 \"$SIMPOOL\" acquire --owner \"$SIM_OWNER\" --purpose \"build+run\")\n  if [[ \"$GRANT\" == GRANTED* ]]; then\n    BOOTED=$(echo \"$GRANT\" | awk '{print $2}')\n    xcrun simctl list devices booted | grep -q \"$BOOTED\" || echo \"(pool is still booting $BOOTED)\"\n    DEST=\"platform=iOS Simulator,id=$BOOTED\"\n    echo \"leased simulator: $BOOTED\"\n  else\n    # QUEUED <pos> \u2014 don't sit idle: compile for a generic simulator now, run `simpool.py poll --owner\n    # \"$SIM_OWNER\"` every few minutes, and install/launch only after GRANTED. Long job \u2192 `simpool.py\n    # heartbeat` every ~15 min (a lease without heartbeat for 30 min is reclaimed).\n    DEST=\"generic/platform=iOS Simulator\"\n    echo \"simulator queue: $GRANT \u2014 building without a device, poll before install\"\n  fi\nfi\n```\n\n## Step 4 \u2014 Build\n\n### Native Swift (xcodegen / xcodeproj)\n\n```bash\nSCHEME=\"${PROJ_NAME}\"  # for xcodegen, scheme = project name\n# For .xcworkspace fallback, find scheme: ls *.xcworkspace/xcshareddata/xcschemes/*.xcscheme\n\n# ENABLE_DEBUG_DYLIB=NO: a Debug build launched by devicectl (not by Xcode) fails with POSIX error 85\n# because the split debug dylib only spawns under Xcode \u2014 build standalone (LEARNINGS #16).\n# -clonedSourcePackagesDirPath + COMPILER_INDEX_STORE_ENABLE=NO: several builds at once (a wave of\n# agents), each with its own DerivedData, re-download Firebase (~2.4 GB each) and fill the disk in\n# minutes (LEARNINGS #91) \u2014 share ONE package checkout per app, skip the index store, and run\n# `df -h /` before starting more than ~5 builds. The coordinator builds once BEFORE a wave so the\n# checkout already exists.\nxcodebuild \\\n  -project \"$XCODEPROJ\" \\\n  -scheme \"$SCHEME\" \\\n  -configuration Debug \\\n  -destination \"$DEST\" \\\n  -derivedDataPath /tmp/xcbuild-${SCHEME} \\\n  -clonedSourcePackagesDirPath \"$PROJECT_ROOT/build/DD/SourcePackages\" \\\n  COMPILER_INDEX_STORE_ENABLE=NO \\\n  ENABLE_DEBUG_DYLIB=NO \\\n  build 2>&1 | tee /tmp/xcbuild-${SCHEME}.log | \\\n  xcpretty --color 2>/dev/null || cat\n```\n\nInstall `xcpretty` once (`gem install xcpretty`) for clean output. Falls back to raw if not present.\n\n### Workspace (CocoaPods present)\n\n```bash\n# same flags as above (LEARNINGS #16 / #91)\nxcodebuild \\\n  -workspace \"$WORKSPACE\" \\\n  -scheme \"$SCHEME\" \\\n  -configuration Debug \\\n  -destination \"$DEST\" \\\n  -clonedSourcePackagesDirPath \"$PROJECT_ROOT/build/DD/SourcePackages\" \\\n  COMPILER_INDEX_STORE_ENABLE=NO \\\n  ENABLE_DEBUG_DYLIB=NO \\\n  build 2>&1 | tee /tmp/xcbuild-${SCHEME}.log | xcpretty --color 2>/dev/null || cat\n```\n\n### Flutter\n\n```bash\ncd \"$PROJECT_ROOT\"\nflutter build ios --debug --no-codesign --no-tree-shake-icons 2>&1 | tee /tmp/flutter-build.log\n```\n\n## Step 5 \u2014 Parse errors (CONCISE summary, never paste full log)\n\n```bash\nLOG=/tmp/xcbuild-${SCHEME}.log\nif grep -q \"BUILD SUCCEEDED\" \"$LOG\"; then\n  echo \"\u2705 BUILD SUCCEEDED\"\n  # Show warning count\n  WARNS=$(grep -c \" warning:\" \"$LOG\" || true)\n  [[ \"$WARNS\" -gt 0 ]] && echo \"\u26a0\ufe0f  $WARNS warnings \u2014 run with --strict to fail on warnings\"\nelse\n  echo \"\u274c BUILD FAILED\"\n  echo \"\"\n  echo \"=== Errors (first 10, deduplicated) ===\"\n  grep -E \"(error:|fatal error:)\" \"$LOG\" | sort -u | head -10 | \\\n    sed -E 's|.*/([^/]+/[^:]+):([0-9]+):([0-9]+): (error|fatal error): (.*)|  \\1:\\2  \\5|'\n  echo \"\"\n  echo \"(full log: $LOG)\"\n  exit 1\nfi\n```\n\n**Why dedup + truncate to 10**: a typo can produce 200 cascading errors. The root cause is usually in the first unique entry. Pasting full log pollutes context.\n\n## Step 6 \u2014 Optional install + launch (only if `--install` flag)\n\n```bash\nif [[ \"$INSTALL\" == \"true\" ]]; then\n  if [[ -n \"$DEVICE_UDID\" ]]; then\n    APP_PATH=\"/tmp/xcbuild-${SCHEME}/Build/Products/Debug-iphoneos/${SCHEME}.app\"\n    # install OVER the previous build \u2014 never uninstall on Jo\u00e3o's device, it wipes his data (LEARNINGS #74)\n    xcrun devicectl device install app --device \"$DEVICE_UDID\" \"$APP_PATH\"\n    BUNDLE_ID=$(plutil -extract CFBundleIdentifier raw \"$APP_PATH/Info.plist\")\n    # \"Launched application\" does NOT mean the app stayed open \u2014 it can die 200 ms later (LEARNINGS #89).\n    # Launch with the console attached IN BACKGROUND (Bash run_in_background), let it run ~20 s, then grep.\n    CONSOLE=/tmp/xcbuild-${SCHEME}-console.log\n    xcrun devicectl device process launch --device \"$DEVICE_UDID\" --console --terminate-existing \"$BUNDLE_ID\" > \"$CONSOLE\" 2>&1\n    # ...~20 s later:\n    if grep -qE \"Terminating|uncaught exception|signal|Fatal error\" \"$CONSOLE\"; then\n      echo \"CRASHED after launch \u2014 the cause is in the console (capture it BEFORE guessing a fix)\"\n      grep -E \"Terminating|uncaught exception|signal|Fatal error\" \"$CONSOLE\" | head -5\n      exit 1\n    fi\n    echo \"instalado (console limpo por ~20 s)\"   # only say \"instalado\" with a clean console\n  else\n    # simulator install \u2014 $BOOTED is the UDID the pool granted in Step 3 (poll until GRANTED if it was QUEUED)\n    [[ -z \"$BOOTED\" ]] && { echo \"no leased simulator yet: python3 $SIMPOOL poll --owner $SIM_OWNER\"; exit 1; }\n    open \"$DEVELOPER_DIR/Applications/Simulator.app\"\n    APP_PATH=\"/tmp/xcbuild-${SCHEME}/Build/Products/Debug-iphonesimulator/${SCHEME}.app\"\n    xcrun simctl install \"$BOOTED\" \"$APP_PATH\"\n    BUNDLE_ID=$(plutil -extract CFBundleIdentifier raw \"$APP_PATH/Info.plist\")\n    xcrun simctl launch \"$BOOTED\" \"$BUNDLE_ID\"\n  fi\nfi\n```\n\n**Free the simulator as soon as you are done with it** \u2014 another session is waiting in the queue: `python3 \"$SIMPOOL\" release --owner \"$SIM_OWNER\"`. Keep the lease only while you are actively installing/driving the app (`heartbeat` every ~15 min on long QA).\n\n## Flags / variants the user can ask for\n\n| Variant                       | What changes                                                    |\n|-------------------------------|-----------------------------------------------------------------|\n| `/build-ios` (default)        | Detect \u2192 build for Debug on best destination                    |\n| `/build-ios --install`        | + install + launch                                              |\n| `/build-ios --release`        | Configuration = Release (for testing release-only bugs)         |\n| `/build-ios --simulator`      | Force simulator, skip device detection                          |\n| `/build-ios --clean`          | Add `clean` action before build (rare \u2014 usually `derivedDataPath` handles it) |\n| `/build-ios --scheme=Foo`     | Override auto-detected scheme                                   |\n| `/build-ios --workspace`      | Force xcworkspace build (when both .xcodeproj + .xcworkspace exist) |\n\n## Common errors + auto-fix suggestions\n\n| Error pattern                                                | Fix to suggest                                                |\n|--------------------------------------------------------------|---------------------------------------------------------------|\n| `Provisioning profile \u2026 doesn't include the currently selected device` | Re-pair device in Xcode: `Window > Devices and Simulators` |\n| `Could not find module 'X' for target 'arm64-apple-ios'`     | Wrong SDK \u2014 verify `--simulator` vs device, or run `pod install` if Podfile present |\n| `Cycle inside ...`                                           | Stale derived data \u2014 delete `~/Library/Developer/Xcode/DerivedData/$SCHEME-*` |\n| `error: project.yml: ...`                                    | xcodegen syntax error \u2014 open project.yml, fix YAML            |\n| `error: no rule to process file '*.entitlements'`            | Entitlements file inside `sources:` \u2014 exclude via `excludes:` in project.yml |\n| `Code Signing Error: No code signing identities found`       | `-allowProvisioningUpdates` flag + DEVELOPMENT_TEAM in env    |\n| `error: cannot find 'X' in scope`                            | Missing file in target \u2014 regen xcodegen + retry              |\n| `warning: 'foregroundColor' was deprecated`                  | Per `_GambitStudio/RULES.md` (`.foregroundStyle`, never `.foregroundColor`): replace with `.foregroundStyle()` |\n\nWhen a known pattern matches, output the fix and OFFER to apply it (don't auto-apply destructive changes).\n\n## What to report back to the user\n\nSingle line for success:\n```\n\u2705 Built <App> in 12.3s (Debug, device iPhone 17 Pro Max)\n```\n\nMulti-line on failure:\n```\n\u274c Build failed (3 errors, deduped)\n\n  <App>/Views/MainView.swift:42  cannot find 'PressAnimationModifier' in scope\n  <App>/Models/User.swift:18     missing argument for parameter 'name'\n  <App>/Services/API.swift:67    'foregroundColor' is deprecated, use .foregroundStyle\n\nLog: /tmp/xcbuild-<App>.log\n\nWant me to fix the deprecation warnings?\n```\n\n**Never paste the full xcodebuild log into the chat.** Save to /tmp, reference path, summarize.\n\n## Anti-patterns (DO NOT do these)\n\n- **Don't** prompt \"should I build for device or simulator?\" \u2014 pick deterministically per Step 3\n- **Don't** prepend `cd $PROJECT_ROOT && ...` to xcodebuild \u2014 pass `-project` with absolute path instead (`cd` inside a compound command triggers a permission prompt; absolute paths keep the run autonomous \u2014 RULES)\n- **Don't** show full `xcodebuild` output \u2014 it's 5000+ lines of compiler noise. Always pipe to file + summarize\n- **Don't** manually edit `project.pbxproj` to add files \u2014 regen with xcodegen instead\n- **Don't** install to device without `--install` flag \u2014 build-only is the default for fast iteration\n- **Don't** use `--no-verify` git flags or skip code signing \u2014 fix the root issue\n- **Don't** create, clone or boot a simulator outside `tools/sim-pool` \u2014 max 2 on this Intel Mac (RULES 12/09/2026): `acquire`, use the granted UDID, `release`\n- **Don't** call `xcodebuild`/`simctl`/`devicectl` without `DEVELOPER_DIR` set to `/Applications/Xcode 2.app` (LEARNINGS #47)\n- **Don't** report \"instalado\" from `Launched application` alone \u2014 grep the `--console` log first (LEARNINGS #89)\n\n## Cross-references\n\n- `~/.claude/CLAUDE.md` \u2014 sections \"Autonomia\" (device first, never ask) + \"iOS \u2014 padr\u00f5es core\" (xcodegen, `.foregroundStyle`)\n- `_GambitStudio/RULES.md` \u2014 \"Simulador: no m\u00e1ximo 2, sempre pela fila `tools/sim-pool`\" (12/09/2026) + Autonomia total\n- `_GambitStudio/spec/xcode-project.md` (xcodegen + device-first run) \u00b7 `_GambitStudio/spec/lessons-ios.md` (build/UI lessons the lab already paid for)\n- `_GambitStudio/LEARNINGS-INDEX.md` \u2014 #16 (devicectl idioms, `ENABLE_DEBUG_DYLIB=NO`), #41 (explicit UDID), #47 (`DEVELOPER_DIR`), #74 (never uninstall on the device), #89 (console after install), #91 (parallel builds and disk)\n- `~/.claude/skills/create-ios-app/` \u2014 scaffolds new project (this skill takes over after the project exists)\n- `~/.claude/skills/develop-task/` \u2014 workflow for fixing a specific bug/task; uses this skill internally\n- `~/.claude/skills/run/` \u2014 built-in: launches and drives an app; this skill is the BUILD step, run is the LAUNCH/INTERACT step\n\n## Memory references\n\n- [feedback-no-cd-prefix] (to be added) \u2014 never `cd path && cmd` pattern, always absolute paths\n- [feedback-build-summary] (to be added) \u2014 always dedupe + truncate error output to 10 unique lines, never paste full logs\n";</script><script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script><script>document.getElementById("md").innerHTML=window.marked?marked.parse(RAW):"<pre>"+RAW.replace(/</g,"&lt;")+"</pre>";</script></div><script>(function(){try{var k="lh.scroll:"+location.pathname;var v=sessionStorage.getItem(k);if(v!==null){sessionStorage.removeItem(k);window.scrollTo(0,parseInt(v,10)||0);}document.addEventListener("submit",function(e){var f=e.target;if(f&&f.method&&f.method.toLowerCase()==="post"){sessionStorage.setItem(k,String(window.scrollY));}},true);}catch(e){}})();</script></body></html>
