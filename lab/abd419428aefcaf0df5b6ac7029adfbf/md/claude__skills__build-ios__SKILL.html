<style>
:root{--bg:#f4f5f8;--card:#fff;--tx:#0e1015;--mut:#4a5160;--acc:#0b53d6;--ok:#0d9668;--down:#c22;--bd:#c9cfda;--hl:#fff7e0}

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.55 -apple-system,system-ui,sans-serif}
.wrap{width:min(1680px,94vw);margin:0 auto;padding:28px 0 80px}@media(max-width:860px){.wrap{width:calc(100vw - 28px)}}.ico{width:20px;height:20px;border-radius:5px;vertical-align:-5px;margin-right:7px;background:var(--bd);object-fit:cover}.ico.big{width:30px;height:30px;border-radius:7px;vertical-align:-9px}h2{border-top:1px solid var(--bd);padding-top:20px;margin-top:30px}section,.twrap{min-width:0}h2:first-of-type{border-top:0;padding-top:0}h1+h2,.sub+h2{border-top:0;padding-top:0}

a{color:var(--acc);text-decoration:none}a:hover{text-decoration:underline}

.twrap{overflow-x:auto;border-radius:12px}
.imgs{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.imgs img{width:100%;border-radius:8px;border:1px solid var(--bd)}
#md{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:22px 26px}
#md pre{overflow-x:auto;background:rgba(125,125,125,.1);padding:10px;border-radius:8px}
#md table{border-collapse:collapse}#md td,#md th{border:1px solid var(--bd);padding:4px 9px;font-size:13.5px}
#md img{max-width:100%}
.hcol .row{flex-direction:column;align-items:flex-start;gap:4px}.hcol .row b{white-space:normal}.hcol .row span{width:100%}.hcol .row em{display:none}.hcol .row.done b{font-size:12px}.hrow{display:flex;gap:20px;overflow-x:auto;align-items:flex-start;padding:16px 28px 12px;margin:18px 0 26px;background:rgba(125,125,125,.07);border:1px solid var(--bd);border-radius:16px;scroll-padding:0 28px}.hcol{flex:0 0 340px;min-width:340px}.hcol:last-child{margin-right:28px}.hcol h2{margin-top:0}.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:0 20px}.cols2{display:grid;grid-template-columns:1fr 1fr;gap:0 20px;align-items:start}@media(max-width:900px){.cols2{grid-template-columns:1fr}}h3.team{margin:18px 0 8px;font-size:15px;font-weight:600}h3.team .chain{display:block;color:var(--mut);font-weight:400;font-size:12.5px;margin-top:2px}.card .step{display:inline-block;min-width:18px;height:18px;line-height:18px;text-align:center;border-radius:9px;background:var(--bd);color:var(--mut);font-size:11px;font-weight:600;margin-right:6px}.grid4{display:grid;gap:12px;grid-template-columns:repeat(4,1fr)}@media(max-width:1100px){.grid4{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.grid4{grid-template-columns:1fr}}
.rows{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;color:var(--tx);font-size:14.5px}
a.row:hover{border-color:var(--acc);text-decoration:none}
.row b{white-space:nowrap}.row span{flex:1;color:var(--mut)}.row em{color:var(--mut);font-style:normal;font-size:18px}
.row.done b{color:var(--mut);font-weight:500;font-size:12.5px}.row.done span b{color:var(--tx)}.row.done span{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;line-height:1.35}
.hdr{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:6px}
.hdr h1{margin:0}.hdr .sub{margin:2px 0 0}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 22px;font-size:14.5px;color:var(--acc)}
.btn:hover{border-color:var(--acc);text-decoration:none}
.tiles{display:flex;gap:10px;flex-wrap:nowrap;overflow-x:auto;margin:14px 0 6px;padding-bottom:4px}
a.tile{display:block;flex:0 0 auto;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 14px;color:var(--tx);min-width:128px}
a.tile:hover{border-color:var(--acc);text-decoration:none}
.tile .tl{font-size:12px;color:var(--mut);white-space:nowrap}

.tv.up{color:var(--ok);background:none}.tv.dn{color:var(--down);background:none}
.vd{font-size:15px;font-weight:700;margin-right:10px;white-space:nowrap}
.vd.s{color:var(--ok)}.vd.w{color:#c9930a}.vd.k{color:var(--down)}
.shots{display:flex;gap:8px;overflow-x:auto;padding:4px 0}
.shots img{height:210px;border-radius:10px;border:1px solid var(--bd);flex:0 0 auto}
.gallery img{height:460px;max-height:72vh}
.st{display:inline-block;border-radius:99px;padding:1px 10px;font-size:12px;font-weight:600;margin-left:8px;white-space:nowrap;vertical-align:1px}
.st.run{background:rgba(13,150,104,.16);color:var(--ok)}
.st.appr{background:rgba(201,147,10,.16);color:#c9930a}
.st.rev{background:rgba(11,83,214,.13);color:var(--acc)}
.st.draft{background:rgba(139,92,246,.15);color:#8b5cf6}
.st.mut{background:rgba(125,125,125,.16);color:var(--mut)}
.st.crit{background:rgba(200,34,34,.15);color:var(--down)}
.rowwrap{position:relative}
.rowwrap .row{padding-right:38px}
.delf{position:absolute;top:0;right:0;bottom:0;display:flex;align-items:center;margin:0}
.del{background:none;border:none;color:var(--mut);font-size:17px;line-height:1;padding:6px 12px;cursor:pointer;border-radius:8px;opacity:.45}
.rowwrap:hover .del{opacity:1}
.del:hover{color:var(--down);background:rgba(200,34,34,.08)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(430px,1fr));gap:12px;margin-top:12px}
@media(max-width:520px){.fgrid{grid-template-columns:1fr}}
.fcard{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:13px 15px}
.fcard .fh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.fcard .fh b{font-size:14.5px}.fcard .fh span{font-size:12.5px;color:var(--mut);white-space:nowrap}
.fs{display:flex;align-items:center;gap:8px;margin:3px 0;font-size:13px}
.fs .fl{flex:0 0 168px;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fs .fb{flex:1;height:13px}
.fs .fb i{display:block;height:100%;background:var(--acc);border-radius:3px;min-width:2px}
.fs .fb i.alt{background:var(--ok)}.fs .fb i.ga{background:#8b5cf6}
.fs .fn{flex:0 0 auto;font-variant-numeric:tabular-nums;font-size:12.5px}
.fs.tot .fl,.fs.tot .fn{font-weight:700}
.leak{margin:0 0 5px 176px;font-size:12px;color:var(--down)}
.leak b{font-variant-numeric:tabular-nums}
.fdiv{margin:9px 0 3px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}
.fmeta{font-size:12.5px;color:var(--mut);margin:-3px 0 9px}
.rrow{display:flex;gap:8px;margin:10px 0 4px}
.rc{flex:1;background:rgba(125,125,125,.09);border-radius:9px;padding:6px 9px}
.rc b{display:block;font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.rc .rv{display:block;font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.25}
.rc .rb{display:block;font-size:11px;color:var(--mut)}
.fnds{list-style:none;margin:10px 0 0;padding:0}
.fnds li{position:relative;padding:2px 0 2px 16px;font-size:13px;color:var(--tx)}
.fnds li:before{content:"";position:absolute;left:0;top:9px;width:7px;height:7px;border-radius:50%}
.fnds li.crit:before{background:var(--down)}.fnds li.warn:before{background:#c9930a}.fnds li.ok:before{background:var(--ok)}
.nxt{margin-top:11px;background:var(--hl);border:1px solid var(--bd);border-radius:10px;padding:9px 12px}
.nxt .nxl{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
.nxt b{font-size:14px}.nxt p{margin:3px 0 0;font-size:13px;color:var(--mut)}
.fh .st{margin-left:8px}
.dirbox{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:20px 24px;margin:20px 0 8px}
.dirlab{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--mut)}
.dirh{font-size:19px;line-height:1.35;margin:4px 0 12px;text-transform:none;letter-spacing:0;color:var(--tx)}
.dirp{margin:0 0 9px;font-size:14px;line-height:1.6;color:var(--tx)}
.prio{display:flex;gap:13px;padding:11px 0;border-top:1px solid var(--bd)}
.prn{flex:0 0 26px;height:26px;line-height:26px;text-align:center;border-radius:13px;background:var(--acc);color:#fff;font-weight:700;font-size:13px}
.prc{flex:1;min-width:0}
.prt{font-size:15px;font-weight:600;margin-bottom:3px}
.prw{margin:0 0 5px;font-size:13.5px;color:var(--tx)}
.pre{margin:0 0 4px;font-size:13px;color:var(--mut);line-height:1.55}
.pre b{color:var(--tx);font-weight:600}
.prp{margin:4px 0 0;font-size:13px;color:var(--tx);border-left:2px solid var(--acc);padding-left:9px}
.vgrid{display:flex;flex-direction:column;gap:6px}
.vrow{display:flex;align-items:baseline;gap:9px;font-size:13.5px;flex-wrap:wrap}
.vrow .st{flex:0 0 auto;margin:0}
.vrow b{flex:0 0 auto;min-width:118px}
.vrow span:last-child{flex:1;min-width:220px;color:var(--mut)}
.nots{margin:0;padding-left:18px}
.nots li{font-size:13.5px;color:var(--tx);margin-bottom:5px;line-height:1.55}
.dirfoot{margin:16px 0 0;padding-top:12px;border-top:1px solid var(--bd);font-size:12px;color:var(--mut)}
@media(max-width:700px){.vrow b{min-width:0}}
.fnote{font-size:11.5px;color:var(--mut);margin:4px 0 0 176px;line-height:1.35}

/* ---------- camada de acabamento (01/10/2026) ----------
   Tipografia com duas vozes (display para títulos e números, texto para leitura),
   neutros com viés do azul da marca em vez de cinza puro, e profundidade por
   sombra em vez de só borda. Nada aqui renomeia classe: é uma camada por cima. */
:root{
  --f-disp:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --f-text:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --bg:#eef1f7; --card:#ffffff; --tx:#0a0d14; --mut:#4b5567; --acc:#1246c8;
  --bd:#cbd3e0; --bd-soft:#dfe5ee; --ok:#07804e; --down:#c42121; --warn:#9a4408;
  --sh:0 1px 2px rgba(16,19,26,.05),0 2px 8px rgba(16,19,26,.04);
  --sh-up:0 2px 6px rgba(16,19,26,.07),0 10px 24px rgba(16,19,26,.07);
  --rad:14px;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#07090d; --card:#141922; --tx:#f7f9fc; --mut:#b2bdd0; --acc:#8ab4ff;
  --bd:#333c4c; --bd-soft:#232a36; --ok:#55e39d; --down:#ff8585; --warn:#ffbb55;
  --sh:0 1px 2px rgba(0,0,0,.4); --sh-up:0 6px 22px rgba(0,0,0,.5);
}}
body{font-family:var(--f-text);font-size:14.5px;line-height:1.6;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1{font-family:var(--f-disp);font-size:27px;font-weight:800;letter-spacing:-.02em;
  text-wrap:balance;margin:0 0 2px}
h1 .mark{display:inline-block;width:28px;height:28px;vertical-align:-5px;margin-right:11px;
  background-size:contain;background-repeat:no-repeat;background-position:center}
h2{font-family:var(--f-disp);font-size:12px;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;color:var(--mut);border-top:1px solid var(--bd-soft);
  padding-top:22px;margin:32px 0 14px}
h3{font-family:var(--f-disp);letter-spacing:-.01em}
.sub{font-size:13px;color:var(--mut)}
code,.mono{font-family:var(--f-mono);font-size:12.5px}
.card,table.t,a.tile,.row,.fcard,#md{box-shadow:var(--sh);border-color:var(--bd-soft)}
.card,a.tile,.row,.fcard{border-radius:var(--rad)}
a.tile,.row{transition:box-shadow .16s ease,border-color .16s ease,transform .16s ease}
a.tile:hover,a.row:hover{box-shadow:var(--sh-up);border-color:var(--bd);
  transform:translateY(-1px)}
/* O card do app é área de leitura, não botão: nada muda no hover. A regra antiga
   trocava a sombra, e num card sem sombra isso aparecia como animação. */
.fcard,.fcard:hover{transition:none!important;transform:none!important}
/* big numbers: the first thing anyone reads on the page */
.tiles{gap:12px;margin:18px 0 4px;padding-bottom:10px}
a.tile{padding:13px 17px;min-width:148px}
.tile .tl{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
  color:var(--mut)}
.tile .tv{font-family:var(--f-disp);font-size:25px;font-weight:800;letter-spacing:-.025em;
  margin-top:3px}
.tile .ts{font-size:11.5px;color:var(--mut)}
/* tables read as data, not as prose */
table.t{border-radius:var(--rad);font-variant-numeric:tabular-nums}
table.t th{font-family:var(--f-disp);font-size:11px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;background:var(--bd-soft);border-bottom:1px solid var(--bd)}
table.t td{padding:9px 13px;border-bottom:1px solid var(--bd-soft)}
table.t tbody tr:hover td,table.t tr:hover td{background:rgba(125,140,170,.06)}
.twrap{border-radius:var(--rad)}
/* buttons */
.btn{font-family:var(--f-disp);font-weight:600;font-size:13.5px;padding:9px 18px;
  border-radius:999px;box-shadow:var(--sh);transition:all .16s ease}
.btn:hover{border-color:var(--acc);box-shadow:var(--sh-up);transform:translateY(-1px)}
.pill,.st{font-family:var(--f-disp);font-weight:600;font-size:11.5px;letter-spacing:.02em}
/* status colours carry meaning, so keep them out of the accent */
.st.run,.st.appr{background:rgba(10,143,88,.14);color:var(--ok)}
.st.crit{background:rgba(208,47,47,.14);color:var(--down)}
.st.rev,.st.draft{background:rgba(180,83,9,.14);color:var(--warn)}
/* the lanes strip and any scroller get a thin, rounded bar */
.tiles,.hrow,.twrap{scrollbar-width:thin;scrollbar-color:var(--bd) transparent}
.tiles::-webkit-scrollbar,.hrow::-webkit-scrollbar,.twrap::-webkit-scrollbar{height:9px}
.tiles::-webkit-scrollbar-track,.hrow::-webkit-scrollbar-track,
.twrap::-webkit-scrollbar-track{background:transparent}
.tiles::-webkit-scrollbar-thumb,.hrow::-webkit-scrollbar-thumb,
.twrap::-webkit-scrollbar-thumb{background:var(--bd);border-radius:999px;
  border:3px solid transparent;background-clip:content-box}
.tiles::-webkit-scrollbar-thumb:hover,.hrow::-webkit-scrollbar-thumb:hover,
.twrap::-webkit-scrollbar-thumb:hover{background:var(--mut);background-clip:content-box}
.hrow{background:transparent;border:0;padding:0;border-radius:0}
.hcol{flex:0 0 clamp(280px,26vw,360px);min-width:0}
a:focus-visible,button:focus-visible,.btn:focus-visible{outline:2px solid var(--acc);
  outline-offset:2px;border-radius:8px}
.dirlist,.prlist{margin:10px 0 0;padding-left:18px;list-style:none}
.dirlist>li,.prlist>li{position:relative;margin:0 0 7px;font-size:13.5px;line-height:1.5;
  color:var(--tx)}
.prlist>li{color:var(--mut);font-size:13px;margin-bottom:5px}
.dirlist>li::before,.prlist>li::before{content:"";position:absolute;left:-14px;top:.62em;
  width:5px;height:5px;border-radius:50%;background:var(--acc);opacity:.75}
.prlist>li::before{background:var(--mut);opacity:.5}
.dirp{display:none}
.dapps{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));
  margin:14px 0 4px;align-items:start}
.dapp{padding:14px 16px}
.dah{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.dah b{font-family:var(--f-disp);font-size:14.5px;font-weight:700}
.drank{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;
  border-radius:6px;background:var(--acc);color:#fff;font-size:11.5px;font-weight:700;flex:none}
.st.d-dobrar{background:rgba(10,143,88,.16);color:var(--ok)}
.st.d-consertar{background:rgba(180,83,9,.16);color:var(--warn)}
.st.d-manter{background:rgba(125,140,170,.16);color:var(--mut)}
.st.d-congelar{background:rgba(125,140,170,.12);color:var(--mut)}
.dapp .prlist{margin-top:6px}
.dcall{color:var(--tx)!important;font-weight:600}
.fcard[id]{scroll-margin-top:18px}
.fdet{margin-top:10px;border-top:1px solid var(--bd-soft);padding-top:9px}
.fdet>summary{cursor:pointer;list-style:none;font-family:var(--f-disp);font-size:11.5px;
  font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);
  display:flex;align-items:center;gap:7px}
.fdet>summary::-webkit-details-marker{display:none}
.fdet>summary::before{content:"›";font-size:15px;transition:transform .15s}
.fdet[open]>summary::before{transform:rotate(90deg)}
.fdet>summary:hover{color:var(--acc)}
.fdet table.t{font-size:12.5px}
.fdet table.t td,.fdet table.t th{padding:6px 10px}
.fgrid.one{grid-template-columns:1fr!important;gap:18px}
/* Cada app é um painel com profundidade: a luz entra por cima, o corpo escurece
   até a base e a borda clareia só na primeira linha. É o que separa um app do
   outro sem precisar de moldura dura. */
.fgrid.one>.fcard{position:relative;padding:0;overflow:hidden;border-radius:16px;
  border:1px solid var(--bd-soft);
  background:linear-gradient(180deg,
    color-mix(in srgb, var(--acc) 5%, var(--card)) 0%,
    var(--card) 26%,
    color-mix(in srgb, #000 7%, var(--card)) 100%);
  box-shadow:0 1px 2px rgba(0,0,0,.05), 0 10px 26px -14px rgba(0,0,0,.28)}
@media(prefers-color-scheme:dark){.fgrid.one>.fcard{
  background:linear-gradient(180deg,
    color-mix(in srgb, var(--acc) 9%, var(--card)) 0%,
    var(--card) 30%,
    #0a0c10 100%);
  box-shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 18px 40px -22px rgba(0,0,0,.9)}}
.fgrid.one>.fcard::before{content:"";position:absolute;inset:0 0 auto;height:1px;
  background:linear-gradient(90deg, transparent,
    color-mix(in srgb, var(--acc) 45%, transparent), transparent)}
.fgrid.one>.fcard>.fh{background:transparent;margin:0;padding:15px 18px 12px;
  border-bottom:1px solid var(--bd-soft)}
.fgrid.one>.fcard>.fmeta{padding:10px 18px 0}
.fgrid.one>.fcard>.fcols{padding:16px 18px 6px}

<body><div class="wrap"><p class="sub" style="font-size:12px;margin:0 0 14px">Exportado em 2026-10-01 16:50 · fonte: Lab Hub local</p><p class="sub"><a href="../index.html">← hub</a> · <code>_GambitStudio/.claude/skills/build-ios/SKILL.md</code></p><div id="md"></div><script>const RAW="---\nname: build-ios\ndescription: Build an iOS (SwiftUI/UIKit) or Flutter app following the GambitStudio patterns \u2014 auto-detects project type (xcodegen / xcodeproj / xcworkspace / Flutter), regenerates Xcode project if stale, prioritizes physical device over simulator, captures clean error summary, and returns concise pass/fail status. Use when the user types `/build-ios` or says \"build the app\", \"compila o app\", \"build pro device\", \"roda no simulador\", \"ver se compila\", \"fix os erros e tenta de novo\".\n---\n\n# Build iOS\n\nTriggered by the user typing `/build-ios` from the root of an iOS or Flutter project, OR any natural-language ask to build/compile/run the iOS app.\n\n## Golden rule \u2014 DEVICE FIRST, always\n\nPer `~/.claude/CLAUDE.md` (\"Autonomia\") and `_GambitStudio/RULES.md` (Autonomia total \u2014 device first), try physical device first, fall back to simulator only if no device is connected. Do not ask the user which destination \u2014 pick deterministically.\n\n## Toolchain \u2014 `DEVELOPER_DIR` on EVERY xcodebuild / simctl / devicectl call\n\n`xcode-select` points at the CLT (or an old Xcode) while the newest Xcode lives at `/Applications/Xcode 2.app` (LEARNINGS #47). Export it once, before any `xcodebuild`, `xcrun simctl` or `xcrun devicectl`:\n\n```bash\nexport DEVELOPER_DIR=\"/Applications/Xcode 2.app/Contents/Developer\"\n```\n\nWithout it the build resolves the wrong SDK / simulator runtime. The renamed Xcode also breaks `open -a Simulator` \u2014 open it by path: `open \"$DEVELOPER_DIR/Applications/Simulator.app\"`.\n\n## Inputs (auto-detected, never ask)\n\n| Input             | How to detect                                                                |\n|-------------------|------------------------------------------------------------------------------|\n| Project root      | Walk up from cwd until finding `project.yml`, `*.xcodeproj`, `*.xcworkspace`, or `pubspec.yaml` |\n| Project type      | Flutter if `pubspec.yaml`; else xcodegen if `project.yml`; else xcodeproj/xcworkspace |\n| Scheme            | Match `*.xcodeproj` basename, OR `Runner` for Flutter, OR explicit `--scheme` |\n| Destination       | Physical device first (via `xcrun xctrace list devices`), then a simulator LEASED from `tools/sim-pool` (never one you boot yourself) |\n| Configuration     | `Debug` by default, `Release` only if `--release` flag                        |\n\n## Step 1 \u2014 Discover project\n\n```bash\n# Walk up from cwd to find one of these markers (max 5 levels)\nPROJECT_ROOT=\"$(pwd)\"\nwhile [[ \"$PROJECT_ROOT\" != \"/\" ]]; do\n  if compgen -G \"$PROJECT_ROOT/project.yml\" > /dev/null \\\n  || compgen -G \"$PROJECT_ROOT/*.xcodeproj\" > /dev/null \\\n  || compgen -G \"$PROJECT_ROOT/*.xcworkspace\" > /dev/null \\\n  || [[ -f \"$PROJECT_ROOT/pubspec.yaml\" ]]; then\n    break\n  fi\n  PROJECT_ROOT=\"$(dirname \"$PROJECT_ROOT\")\"\ndone\n[[ \"$PROJECT_ROOT\" == \"/\" ]] && { echo \"\u274c no iOS/Flutter project found in any parent dir\"; exit 1; }\n\n# Classify\nif [[ -f \"$PROJECT_ROOT/pubspec.yaml\" ]]; then\n  PROJECT_TYPE=\"flutter\"\nelif [[ -f \"$PROJECT_ROOT/project.yml\" ]]; then\n  PROJECT_TYPE=\"xcodegen\"\nelif compgen -G \"$PROJECT_ROOT\"/*.xcworkspace > /dev/null; then\n  PROJECT_TYPE=\"xcworkspace\"\nelse\n  PROJECT_TYPE=\"xcodeproj\"\nfi\necho \"\ud83d\udcc1 project: $PROJECT_ROOT (type: $PROJECT_TYPE)\"\n```\n\n## Step 2 \u2014 Regen xcodegen if stale\n\n**Per `_GambitStudio/RULES.md` + LEARNINGS #9**: never edit `.pbxproj` manually. If `project.yml` is newer than `.xcodeproj`, regen.\n\n```bash\nif [[ \"$PROJECT_TYPE\" == \"xcodegen\" ]]; then\n  cd \"$PROJECT_ROOT\"\n  PROJ_NAME=$(grep \"^name:\" project.yml | head -1 | awk '{print $2}')\n  XCODEPROJ=\"$PROJECT_ROOT/${PROJ_NAME}.xcodeproj\"\n\n  if [[ ! -d \"$XCODEPROJ\" ]] || [[ \"project.yml\" -nt \"$XCODEPROJ/project.pbxproj\" ]]; then\n    echo \"\ud83d\udd27 regenerating $PROJ_NAME.xcodeproj (project.yml is newer or missing)\"\n    which xcodegen >/dev/null || brew install xcodegen\n    xcodegen generate\n  fi\nfi\n```\n\n## Step 3 \u2014 Pick destination (DEVICE FIRST)\n\n```bash\n# Detect physical devices (excluding simulators + headers)\nDEVICE_UDID=$(xcrun xctrace list devices 2>&1 \\\n  | grep -v \"Simulator\" \\\n  | grep -v \"^==\" \\\n  | grep -E '\\([0-9A-F]{8}-[0-9A-F]{4,}\\)' \\\n  | head -1 \\\n  | grep -oE '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}|[0-9A-F]{8}-[0-9A-F]{16}')\n\nif [[ -n \"$DEVICE_UDID\" ]]; then\n  DEST=\"platform=iOS,id=$DEVICE_UDID\"\n  echo \"\ud83d\udcf1 physical device: $DEVICE_UDID\"\nelse\n  # Fallback simulator \u2014 ONLY through the shared pool (RULES 12/09/2026: max 2 simulators on this Intel\n  # Mac, every session/agent goes through the queue). Never `simctl` create/clone/boot a device of your\n  # own; the pool boots the leased device for you. Always address it by explicit UDID, never \"booted\"\n  # (LEARNINGS #41 \u2014 another session's simulator answers to \"booted\").\n  SIMPOOL=_GambitStudio/tools/sim-pool/simpool.py\n  SIM_OWNER=\"build-ios:${PROJ_NAME:-$(basename \"$PROJECT_ROOT\")}\"\n  GRANT=$(python3 \"$SIMPOOL\" acquire --owner \"$SIM_OWNER\" --purpose \"build+run\")\n  if [[ \"$GRANT\" == GRANTED* ]]; then\n    BOOTED=$(echo \"$GRANT\" | awk '{print $2}')\n    xcrun simctl list devices booted | grep -q \"$BOOTED\" || echo \"(pool is still booting $BOOTED)\"\n    DEST=\"platform=iOS Simulator,id=$BOOTED\"\n    echo \"leased simulator: $BOOTED\"\n  else\n    # QUEUED <pos> \u2014 don't sit idle: compile for a generic simulator now, run `simpool.py poll --owner\n    # \"$SIM_OWNER\"` every few minutes, and install/launch only after GRANTED. Long job \u2192 `simpool.py\n    # heartbeat` every ~15 min (a lease without heartbeat for 30 min is reclaimed).\n    DEST=\"generic/platform=iOS Simulator\"\n    echo \"simulator queue: $GRANT \u2014 building without a device, poll before install\"\n  fi\nfi\n```\n\n## Step 4 \u2014 Build\n\n### Native Swift (xcodegen / xcodeproj)\n\n```bash\nSCHEME=\"${PROJ_NAME}\"  # for xcodegen, scheme = project name\n# For .xcworkspace fallback, find scheme: ls *.xcworkspace/xcshareddata/xcschemes/*.xcscheme\n\n# ENABLE_DEBUG_DYLIB=NO: a Debug build launched by devicectl (not by Xcode) fails with POSIX error 85\n# because the split debug dylib only spawns under Xcode \u2014 build standalone (LEARNINGS #16).\n# -clonedSourcePackagesDirPath + COMPILER_INDEX_STORE_ENABLE=NO: several builds at once (a wave of\n# agents), each with its own DerivedData, re-download Firebase (~2.4 GB each) and fill the disk in\n# minutes (LEARNINGS #91) \u2014 share ONE package checkout per app, skip the index store, and run\n# `df -h /` before starting more than ~5 builds. The coordinator builds once BEFORE a wave so the\n# checkout already exists.\nxcodebuild \\\n  -project \"$XCODEPROJ\" \\\n  -scheme \"$SCHEME\" \\\n  -configuration Debug \\\n  -destination \"$DEST\" \\\n  -derivedDataPath /tmp/xcbuild-${SCHEME} \\\n  -clonedSourcePackagesDirPath \"$PROJECT_ROOT/build/DD/SourcePackages\" \\\n  COMPILER_INDEX_STORE_ENABLE=NO \\\n  ENABLE_DEBUG_DYLIB=NO \\\n  build 2>&1 | tee /tmp/xcbuild-${SCHEME}.log | \\\n  xcpretty --color 2>/dev/null || cat\n```\n\nInstall `xcpretty` once (`gem install xcpretty`) for clean output. Falls back to raw if not present.\n\n### Workspace (CocoaPods present)\n\n```bash\n# same flags as above (LEARNINGS #16 / #91)\nxcodebuild \\\n  -workspace \"$WORKSPACE\" \\\n  -scheme \"$SCHEME\" \\\n  -configuration Debug \\\n  -destination \"$DEST\" \\\n  -clonedSourcePackagesDirPath \"$PROJECT_ROOT/build/DD/SourcePackages\" \\\n  COMPILER_INDEX_STORE_ENABLE=NO \\\n  ENABLE_DEBUG_DYLIB=NO \\\n  build 2>&1 | tee /tmp/xcbuild-${SCHEME}.log | xcpretty --color 2>/dev/null || cat\n```\n\n### Flutter\n\n```bash\ncd \"$PROJECT_ROOT\"\nflutter build ios --debug --no-codesign --no-tree-shake-icons 2>&1 | tee /tmp/flutter-build.log\n```\n\n## Step 5 \u2014 Parse errors (CONCISE summary, never paste full log)\n\n```bash\nLOG=/tmp/xcbuild-${SCHEME}.log\nif grep -q \"BUILD SUCCEEDED\" \"$LOG\"; then\n  echo \"\u2705 BUILD SUCCEEDED\"\n  # Show warning count\n  WARNS=$(grep -c \" warning:\" \"$LOG\" || true)\n  [[ \"$WARNS\" -gt 0 ]] && echo \"\u26a0\ufe0f  $WARNS warnings \u2014 run with --strict to fail on warnings\"\nelse\n  echo \"\u274c BUILD FAILED\"\n  echo \"\"\n  echo \"=== Errors (first 10, deduplicated) ===\"\n  grep -E \"(error:|fatal error:)\" \"$LOG\" | sort -u | head -10 | \\\n    sed -E 's|.*/([^/]+/[^:]+):([0-9]+):([0-9]+): (error|fatal error): (.*)|  \\1:\\2  \\5|'\n  echo \"\"\n  echo \"(full log: $LOG)\"\n  exit 1\nfi\n```\n\n**Why dedup + truncate to 10**: a typo can produce 200 cascading errors. The root cause is usually in the first unique entry. Pasting full log pollutes context.\n\n## Step 6 \u2014 Optional install + launch (only if `--install` flag)\n\n```bash\nif [[ \"$INSTALL\" == \"true\" ]]; then\n  if [[ -n \"$DEVICE_UDID\" ]]; then\n    APP_PATH=\"/tmp/xcbuild-${SCHEME}/Build/Products/Debug-iphoneos/${SCHEME}.app\"\n    # install OVER the previous build \u2014 never uninstall on Jo\u00e3o's device, it wipes his data (LEARNINGS #74)\n    xcrun devicectl device install app --device \"$DEVICE_UDID\" \"$APP_PATH\"\n    BUNDLE_ID=$(plutil -extract CFBundleIdentifier raw \"$APP_PATH/Info.plist\")\n    # \"Launched application\" does NOT mean the app stayed open \u2014 it can die 200 ms later (LEARNINGS #89).\n    # Launch with the console attached IN BACKGROUND (Bash run_in_background), let it run ~20 s, then grep.\n    CONSOLE=/tmp/xcbuild-${SCHEME}-console.log\n    xcrun devicectl device process launch --device \"$DEVICE_UDID\" --console --terminate-existing \"$BUNDLE_ID\" > \"$CONSOLE\" 2>&1\n    # ...~20 s later:\n    if grep -qE \"Terminating|uncaught exception|signal|Fatal error\" \"$CONSOLE\"; then\n      echo \"CRASHED after launch \u2014 the cause is in the console (capture it BEFORE guessing a fix)\"\n      grep -E \"Terminating|uncaught exception|signal|Fatal error\" \"$CONSOLE\" | head -5\n      exit 1\n    fi\n    echo \"instalado (console limpo por ~20 s)\"   # only say \"instalado\" with a clean console\n  else\n    # simulator install \u2014 $BOOTED is the UDID the pool granted in Step 3 (poll until GRANTED if it was QUEUED)\n    [[ -z \"$BOOTED\" ]] && { echo \"no leased simulator yet: python3 $SIMPOOL poll --owner $SIM_OWNER\"; exit 1; }\n    open \"$DEVELOPER_DIR/Applications/Simulator.app\"\n    APP_PATH=\"/tmp/xcbuild-${SCHEME}/Build/Products/Debug-iphonesimulator/${SCHEME}.app\"\n    xcrun simctl install \"$BOOTED\" \"$APP_PATH\"\n    BUNDLE_ID=$(plutil -extract CFBundleIdentifier raw \"$APP_PATH/Info.plist\")\n    xcrun simctl launch \"$BOOTED\" \"$BUNDLE_ID\"\n  fi\nfi\n```\n\n**Free the simulator as soon as you are done with it** \u2014 another session is waiting in the queue: `python3 \"$SIMPOOL\" release --owner \"$SIM_OWNER\"`. Keep the lease only while you are actively installing/driving the app (`heartbeat` every ~15 min on long QA).\n\n## Flags / variants the user can ask for\n\n| Variant                       | What changes                                                    |\n|-------------------------------|-----------------------------------------------------------------|\n| `/build-ios` (default)        | Detect \u2192 build for Debug on best destination                    |\n| `/build-ios --install`        | + install + launch                                              |\n| `/build-ios --release`        | Configuration = Release (for testing release-only bugs)         |\n| `/build-ios --simulator`      | Force simulator, skip device detection                          |\n| `/build-ios --clean`          | Add `clean` action before build (rare \u2014 usually `derivedDataPath` handles it) |\n| `/build-ios --scheme=Foo`     | Override auto-detected scheme                                   |\n| `/build-ios --workspace`      | Force xcworkspace build (when both .xcodeproj + .xcworkspace exist) |\n\n## Common errors + auto-fix suggestions\n\n| Error pattern                                                | Fix to suggest                                                |\n|--------------------------------------------------------------|---------------------------------------------------------------|\n| `Provisioning profile \u2026 doesn't include the currently selected device` | Re-pair device in Xcode: `Window > Devices and Simulators` |\n| `Could not find module 'X' for target 'arm64-apple-ios'`     | Wrong SDK \u2014 verify `--simulator` vs device, or run `pod install` if Podfile present |\n| `Cycle inside ...`                                           | Stale derived data \u2014 delete `~/Library/Developer/Xcode/DerivedData/$SCHEME-*` |\n| `error: project.yml: ...`                                    | xcodegen syntax error \u2014 open project.yml, fix YAML            |\n| `error: no rule to process file '*.entitlements'`            | Entitlements file inside `sources:` \u2014 exclude via `excludes:` in project.yml |\n| `Code Signing Error: No code signing identities found`       | `-allowProvisioningUpdates` flag + DEVELOPMENT_TEAM in env    |\n| `error: cannot find 'X' in scope`                            | Missing file in target \u2014 regen xcodegen + retry              |\n| `warning: 'foregroundColor' was deprecated`                  | Per `_GambitStudio/RULES.md` (`.foregroundStyle`, never `.foregroundColor`): replace with `.foregroundStyle()` |\n\nWhen a known pattern matches, output the fix and OFFER to apply it (don't auto-apply destructive changes).\n\n## What to report back to the user\n\nSingle line for success:\n```\n\u2705 Built <App> in 12.3s (Debug, device iPhone 17 Pro Max)\n```\n\nMulti-line on failure:\n```\n\u274c Build failed (3 errors, deduped)\n\n  <App>/Views/MainView.swift:42  cannot find 'PressAnimationModifier' in scope\n  <App>/Models/User.swift:18     missing argument for parameter 'name'\n  <App>/Services/API.swift:67    'foregroundColor' is deprecated, use .foregroundStyle\n\nLog: /tmp/xcbuild-<App>.log\n\nWant me to fix the deprecation warnings?\n```\n\n**Never paste the full xcodebuild log into the chat.** Save to /tmp, reference path, summarize.\n\n## Anti-patterns (DO NOT do these)\n\n- **Don't** prompt \"should I build for device or simulator?\" \u2014 pick deterministically per Step 3\n- **Don't** prepend `cd $PROJECT_ROOT && ...` to xcodebuild \u2014 pass `-project` with absolute path instead (`cd` inside a compound command triggers a permission prompt; absolute paths keep the run autonomous \u2014 RULES)\n- **Don't** show full `xcodebuild` output \u2014 it's 5000+ lines of compiler noise. Always pipe to file + summarize\n- **Don't** manually edit `project.pbxproj` to add files \u2014 regen with xcodegen instead\n- **Don't** install to device without `--install` flag \u2014 build-only is the default for fast iteration\n- **Don't** use `--no-verify` git flags or skip code signing \u2014 fix the root issue\n- **Don't** create, clone or boot a simulator outside `tools/sim-pool` \u2014 max 2 on this Intel Mac (RULES 12/09/2026): `acquire`, use the granted UDID, `release`\n- **Don't** call `xcodebuild`/`simctl`/`devicectl` without `DEVELOPER_DIR` set to `/Applications/Xcode 2.app` (LEARNINGS #47)\n- **Don't** report \"instalado\" from `Launched application` alone \u2014 grep the `--console` log first (LEARNINGS #89)\n\n## Cross-references\n\n- `~/.claude/CLAUDE.md` \u2014 sections \"Autonomia\" (device first, never ask) + \"iOS \u2014 padr\u00f5es core\" (xcodegen, `.foregroundStyle`)\n- `_GambitStudio/RULES.md` \u2014 \"Simulador: no m\u00e1ximo 2, sempre pela fila `tools/sim-pool`\" (12/09/2026) + Autonomia total\n- `_GambitStudio/spec/xcode-project.md` (xcodegen + device-first run) \u00b7 `_GambitStudio/spec/lessons-ios.md` (build/UI lessons the lab already paid for)\n- `_GambitStudio/LEARNINGS-INDEX.md` \u2014 #16 (devicectl idioms, `ENABLE_DEBUG_DYLIB=NO`), #41 (explicit UDID), #47 (`DEVELOPER_DIR`), #74 (never uninstall on the device), #89 (console after install), #91 (parallel builds and disk)\n- `~/.claude/skills/create-ios-app/` \u2014 scaffolds new project (this skill takes over after the project exists)\n- `~/.claude/skills/develop-task/` \u2014 workflow for fixing a specific bug/task; uses this skill internally\n- `~/.claude/skills/run/` \u2014 built-in: launches and drives an app; this skill is the BUILD step, run is the LAUNCH/INTERACT step\n\n## Memory references\n\n- [feedback-no-cd-prefix] (to be added) \u2014 never `cd path && cmd` pattern, always absolute paths\n- [feedback-build-summary] (to be added) \u2014 always dedupe + truncate error output to 10 unique lines, never paste full logs\n";</script><script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script><script>document.getElementById("md").innerHTML=window.marked?marked.parse(RAW):"<pre>"+RAW.replace(/</g,"&lt;")+"</pre>";</script></div><script>(function(){try{var k="lh.scroll:"+location.pathname;var v=sessionStorage.getItem(k);if(v!==null){sessionStorage.removeItem(k);window.scrollTo(0,parseInt(v,10)||0);}document.addEventListener("submit",function(e){var f=e.target;if(f&&f.method&&f.method.toLowerCase()==="post"){sessionStorage.setItem(k,String(window.scrollY));}},true);}catch(e){}})();</script></body></html>
