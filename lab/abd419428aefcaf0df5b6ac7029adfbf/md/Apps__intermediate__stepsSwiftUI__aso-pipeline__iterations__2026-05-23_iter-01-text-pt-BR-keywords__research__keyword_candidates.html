<body><div class="wrap"><p class="sub" style="font-size:12px;margin:0 0 14px">Exportado em 2026-10-01 15:21 · fonte: Lab Hub local</p><p class="sub"><a href="../index.html">← hub</a> · <code>Apps/intermediate/stepsSwiftUI/aso-pipeline/iterations/2026-05-23_iter-01-text-pt-BR-keywords/research/keyword_candidates.md</code></p><div id="md"></div><script>const RAW="# An\u00e1lise iter-01 (pt-BR) \u2014 Decis\u00f5es pros 3 campos ASO\n\n**Data:** 2026-05-23 (v4 \u2014 promo\u00e7\u00e3o de `emagrecer` aplicada ap\u00f3s an\u00e1lise de ranking)\n**Source:** Astro export (`data.csv` = 106 termos \u00fanicos: 30 current_pool + 76 candidates)\n**Filtro decis\u00e3o:** **INTENT-FIRST + PROMO\u00c7\u00c3O DE RANKINGS**\n1. Intent match \u2014 quem digita o termo quer um app COMO O NOSSO?\n2. An\u00e1lise de rankings atuais \u2014 quais termos top-30 podem ser PROMOVIDOS pra peso maior (rank 11 \u2192 top-5)?\n3. Quadrante pop/diff s\u00f3 aplica depois que (1) e (2) passaram\n\nApple pesa os 3 campos diferente \u2014 usar isso a favor:\n\n| Campo    | Char max | Peso ASO | Estrat\u00e9gia                           |\n| -------- | -------- | -------- | ------------------------------------ |\n| name     | 30       | 7\u00d7       | head terms killer-feature + brand    |\n| subtitle | 30       | 3\u00d7       | high-pop heads + termos top-15 promovidos pra empurrar pra top-5 |\n| keywords | 100      | 1\u00d7       | preencher long-tail + modifiers via composition |\n\n**Princ\u00edpio:** rank 1-3 converte ~5x mais que rank 11-15. Promover termo j\u00e1 top-15 pra peso maior \u00e9 frequentemente mais impactante do que tentar ranquear termos novos no zero.\n\n---\n\n## \ud83d\udcd0 Diff visual \u2014 antes / depois\n\n**Legenda das cores:**\n<span style=\"color:#dc3545\">**\ud83d\udd34 Vermelho**</span> = saiu completamente \u00b7\n<span style=\"color:#28a745\">**\ud83d\udfe2 Verde**</span> = entrou totalmente novo \u00b7\n<span style=\"color:#3b82f6\">**\ud83d\udd35 Azul claro**</span> = mudou pra peso MAIOR (keywords \u2192 subtitle) \u00b7\n<span style=\"color:#1e3a8a\">**\ud83d\udd35 Azul escuro**</span> = mudou pra peso MENOR \u00b7\nPreto/normal = mant\u00e9m\n\n### Name (mant\u00e9m)\n\n| Antes (atual)                       | Depois (proposto)                   |\n| ----------------------------------- | ----------------------------------- |\n| `Km Caminhada - Ped\u00f4metro Pacer`    | `Km Caminhada - Ped\u00f4metro Pacer`    |\n| 30 chars \u00b7 head + brand + competitor co-opted | 30 chars \u00b7 igual            |\n\n### Subtitle (REESCRITO \u2014 promo\u00e7\u00e3o de `emagrecer`)\n\n| Antes (atual)                                                                                                                                                                              | Depois (proposto)                                                                                                                                                                                              |\n| ------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ | -------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |\n| Passos, Dist\u00e2ncia e <span style=\"color:#dc3545\">Calorias</span>                                                                                                                            | Passos, Dist\u00e2ncia e <span style=\"color:#3b82f6\">Emagrecer</span>                                                                                                                                               |\n| 28 chars \u00b7 3 heads-niche peso 3\u00d7                                                                                                                                                          | 29 chars \u00b7 sacrifica `Calorias` peso 3\u00d7 \u2192 promove `Emagrecer` de kw 1\u00d7 pra subtitle 3\u00d7 \u2014 push esperado `emagrecer caminhada` rank 11 \u2192 top-5 (composition peso 3+7=10\u00d7)                                          |\n\n### Keywords (REESCRITO)\n\n| Antes (atual)                                                                                                                                                                                                                                                                                                                                                                                                                                              |\n| -------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |\n| <span style=\"color:#dc3545\">pedometro</span>,<span style=\"color:#dc3545\">passos</span>,<span style=\"color:#dc3545\">caminhada</span>,<span style=\"color:#dc3545\">calorias</span>,<span style=\"color:#dc3545\">distancia</span>,<span style=\"color:#dc3545\">fitness</span>,<span style=\"color:#dc3545\">saude</span>,<span style=\"color:#dc3545\">km</span>,contador,<span style=\"color:#3b82f6\">emagrecer</span>,exercicio,<span style=\"color:#dc3545\">metas</span>,<span style=\"color:#dc3545\">km</span> |\n| 100 chars \u00b7 13 tokens (6 dups + 1 bug + 3 intent-fraco + 1 promovido)                                                                                                                                                                                                                                                                                                                                                                                  |\n\n| Depois (proposto)                                                                                                                                                                                                                                                                                                                                                                                          |\n| ---------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |\n| <span style=\"color:#28a745\">automatico</span>,<span style=\"color:#28a745\">di\u00e1ria</span>,<span style=\"color:#28a745\">apple watch</span>,<span style=\"color:#28a745\">apple health</span>,contador,<span style=\"color:#28a745\">gr\u00e1fico</span>,<span style=\"color:#28a745\">caminhar</span>,<span style=\"color:#28a745\">gratis</span>,exercicio,<span style=\"color:#28a745\">monitorar</span> |\n| 95 chars \u00b7 10 tokens \u00b7 0 dups \u00b7 0 bugs \u00b7 `emagrecer` promovido pra subtitle (peso 3\u00d7)                                                                                                                                                                                                                                                                                                                       |\n\n---\n\n## \ud83c\udff7 NAME \u2014 `Km Caminhada - Ped\u00f4metro Pacer` (mant\u00e9m)\n\n| Palavra      | Pop | Diff | Rank atual                         | Decis\u00e3o 7  | 63   | `dist\u00e2ncia e calorias` #14, `calorias caminhada` #15 (via name)                          | **\ud83d\udd34 SACRIFICADO** \u2014 substitu\u00eddo por `Emagrecer` pra ganho de promo\u00e7\u00e3o |\n\n### Subtitle: SAIU / ENTROU / MUDOU DE LUGAR\n\n**\ud83d\udd34 SAIU:**\n\n| Palavra      | Por qu\u00ea                                                                                              |\n| ------------ | ---------------------------------------------------------------------------------------------------- |\n| `Calorias`   | Sacrif\u00edcio deliberado. Perde 2 compositions top-15 (rank 14, 15). Pop 57 alta mas calorias ainda fica passivamente coberto via name `caminhada` + Apple morphology. Trade pago pelo upside de promover `emagrecer`. |\n\n**\ud83d\udd04 MUDOU DE LUGAR (de keywords pra subtitle \u2014 PROMO\u00c7\u00c3O):**\n\n| Palavra      | Antes              | Depois             | Por qu\u00ea                                                                                                                          |\n| ------------ | ------------------ | ------------------ | -------------------------------------------------------------------------------------------------------------------------------- |\n| `Emagrecer`  | keywords (peso 1\u00d7) | subtitle (peso 3\u00d7) | **\ud83e\udd47 Promo\u00e7\u00e3o principal da iter.** Composition `emagrecer caminhada` rank #11 \u2192 push pra **top-5** (peso 3+7=10\u00d7 vs antes 1+7=8\u00d7). Pop 56 + intent perfeito (p\u00fablico-alvo: gente que caminha pra emagrecer). |\n\n**Veredito subtitle:** trade de 1 head (Calorias pop 57) por 1 head (Emagrecer pop 56) com ganho de promo\u00e7\u00e3o. Calorias fica com cobertura passiva via Apple morphology. Net esperado: 3 rankings mid-range perdidos vs 2 potenciais top-5/top-7.\n\n---\n\n## \ud83d\udd11 KEYWORDS FIELD \u2014 reescrita\n\n### \ud83d\udd34 SAIU (do `keywords.txt` atual)\n\n| Termo                       | Pop | Diff | Por qu\u00ea removeu
