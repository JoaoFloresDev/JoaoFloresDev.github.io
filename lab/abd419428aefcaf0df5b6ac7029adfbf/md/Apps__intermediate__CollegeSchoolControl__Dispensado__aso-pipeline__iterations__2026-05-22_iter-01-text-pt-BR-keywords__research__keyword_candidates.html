<body><div class="wrap"><p class="sub" style="font-size:12px;margin:0 0 14px">Exportado em 2026-10-01 15:43 · fonte: Lab Hub local</p><p class="sub"><a href="../index.html">← hub</a> · <code>Apps/intermediate/CollegeSchoolControl/Dispensado/aso-pipeline/iterations/2026-05-22_iter-01-text-pt-BR-keywords/research/keyword_candidates.md</code></p><div id="md"></div><script>const RAW="# An\u00e1lise iter-01 (pt-BR) \u2014 Decis\u00f5es pros 3 campos ASO\n\n**Data:** 2026-05-22 (revisado com TRUE live state ap\u00f3s `verify_current.sh`)\n**Source:** Astro export (`resultdata.csv` + `result2.csv` = 485 termos \u00fanicos)\n**Filtro decis\u00e3o:** quadrante (diff \u2264 20 sempre; diff 21-40 + pop \u2265 10; diff 41-60 + pop \u2265 25 OU rank hist\u00f3rico; diff > 60 s\u00f3 com pop \u2265 40)\n\nApple pesa os 3 campos diferente \u2014 usar isso a favor:\n\n| Campo    | Char max | Peso ASO | Estrat\u00e9gia                           |\n| -------- | -------- | -------- | ------------------------------------ |\n| name     | 30       | 7\u00d7       | head terms killer-feature + brand    |\n| subtitle | 30       | 3\u00d7       | high-pop heads N\u00c3O presentes no name |\n| keywords | 100      | 1\u00d7       | preencher long-tail + modifiers      |\n\n**Princ\u00edpio:** cada palavra entra no campo com MAIOR peso poss\u00edvel dado seu pop. N\u00e3o duplicar entre campos \u2014 Apple j\u00e1 indexa o termo na primeira ocorr\u00eancia, repetir \u00e9 desperd\u00edcio.\n\n---\n\n## \ud83d\udcd0 Diff visual \u2014 antes / depois\n\n**Legenda das cores:**\n<span style=\"color:#dc3545\">**\ud83d\udd34 Vermelho**</span> = saiu completamente (n\u00e3o est\u00e1 em nenhum campo no novo) \u00b7\n<span style=\"color:#28a745\">**\ud83d\udfe2 Verde**</span> = entrou totalmente novo (n\u00e3o estava em campo nenhum antes) \u00b7\n<span style=\"color:#3b82f6\">**\ud83d\udd35 Azul claro**</span> = mudou de lugar pra um campo de PESO MAIOR (keywords \u2192 subtitle, subtitle \u2192 name) \u00b7\n<span style=\"color:#1e3a8a\">**\ud83d\udd35 Azul escuro**</span> = mudou de lugar pra um campo de PESO MENOR (name \u2192 subtitle, subtitle \u2192 keywords) \u00b7\nPreto/normal = mant\u00e9m no mesmo campo (com ou sem case-fix)\n\n### Name (mant\u00e9m)\n\n| Antes (atual)                     | Depois (proposto)              |\n| --------------------------------- | ------------------------------ |\n| `Controle de faltas \u2022 College`    | `Controle de faltas \u2022 College` |\n| 28 chars \u00b7 killer feature + brand | 28 chars \u00b7 igual               |\n\n### Subtitle (REESCRITO)\n\n| Antes (atual)                                                                                                                          | Depois (proposto)                                                                                                                                                          |\n| -------------------------------------------------------------------------------------------------------------------------------------- | -------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |\n| <span style=\"color:#dc3545\">Gest\u00e3o</span> <span style=\"color:#dc3545\">Academica</span> <span style=\"color:#dc3545\">Simplificada</span> | <span style=\"color:#28a745\">Agenda</span>, <span style=\"color:#3b82f6\">Notas</span>, <span style=\"color:#28a745\">Planner</span> <span style=\"color:#3b82f6\">Escolar</span> |\n| 29 chars \u00b7 3 palavras pop=5 \u00b7 1 typo (`Academica` sem acento \u2014 perde indexa\u00e7\u00e3o)                                                        | 30 chars \u00b7 3 heads pop\u226560 + modifier \u00b7 sem typo                                                                                                                            |\n\n### Keywords (REESCRITO)\n\n| Antes (atual)                                                                                                                                                                                                                                                                                                                                                     | Depois (proposto)                                                                                                                                                                                                                                                                                                                                                 |\n| ----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | ----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |\n| <span style=\"color:#3b82f6\">escola</span>,Contador,controle,faculdade,<br>disciplina,<span style=\"color:#dc3545\">frequ\u00eancia</span>,<span style=\"color:#3b82f6\">notas</span>,<span style=\"color:#dc3545\">aulas</span>,<br><span style=\"color:#dc3545\">marcar</span>,<span style=\"color:#dc3545\">falta</span>,<span style=\"color:#dc3545\">faculdade</span>,presen\u00e7a | contador,<span style=\"color:#28a745\">registro</span>,<span style=\"color:#28a745\">unip</span>,<span style=\"color:#28a745\">puc</span>,<span style=\"color:#28a745\">caderno</span>,<br><span style=\"color:#28a745\">digital</span>,presen\u00e7a,disciplina,faculdade,<br><span style=\"color:#28a745\">estudante</span>,<span style=\"color:#28a745\">chamada</span>,<span style=\"color:#28a745\">contagem</span> |\n| 100 chars \u00b7 12 tokens (com 1 duplicata `faculdade` + `Contador` capitalizado + 2 dups com name)                                                                                                                                                                                                                                                                   | 99 chars \u00b7 12 tokens lowercase \u00b7 0 desperd\u00edcios                                                                                                                                                                                                                                                                                                                   |\n\n---\n\n## \ud83c\udff7 NAME \u2014 `Controle de faltas \u2022 College` (mant\u00e9m)\n\nAn\u00e1lise palavra por palavra:\n\n| Palavra    | Pop | Diff | Rank atual                        | Decis\u00e3o                                                                                                 |\n| ---------- | --- | ---- | --------------------------------- | ------------------------------------------------------------------------------------------------------- |\n| `Controle` | 69  | 65   | OUT solo (mas top-1 em compounds) | **Mant\u00e9m** \u2014 head term m\u00e1ximo no nicho. Lideran\u00e7a no name garante peso 7\u00d7.                              |\n| `de`       | 9   | 70   | OUT                               | **Mant\u00e9m** \u2014 glue de leitura humana. Apple ignora stopword no scoring mas custo zero no name (j\u00e1 cabe). |\n| `faltas`   | 6   | 36   | **#1**                            | **Mant\u00e9m** \u2014 feature killer, j\u00e1 rankeamos #1.                                                           |\n| `College`  | 5   | 59   | **#4**                            | **Mant\u00e9m** \u2014 brand recognition (43 reviews referenciando este nome).                                    |\n\n**Veredito:** name est\u00e1 \u00f3timo. Cluster A (Faltas puro) coberto via name. N\u00e3o mudar.\n\n---\n\n## \ud83c\udff7 SUBTITLE \u2014 `Gest\u00e3o Academica Simplificada` (REESCREVER)\n\n### An\u00e1lise palavra-por-palavra do subtitle atual:\n\n| Palavra        | Pop | Diff | Rank atual | Problema                                                                                             |\n| -------------- | --- | ---- | ---------- | ---------------------------------------------------------------------------------------------------- |\n| `Gest\u00e3o`       | 5   | 62   | OUT        | pop baixo \u2014 palavra de marketing gen\u00e9rica sem volume de busca                                        |\n| `Academica`    | 5   | 47   | OUT        | **TYPO** \u2014 falta acento. Forma correta `Acad\u00eamica` \u00e9 indexada separada. Estamos perdendo.            |\n| `Simplificada` | 5   | 17   | #20        | **MORTA** \u2014 adjetivo de marketing sem ASO value. Rankeia #20 mas pop=5 = essencialmente 0 buscas/m\u00eas |\n\n**Diagn\u00f3stico:** subtitle atual \u00e9 **slogan**, n\u00e3o vehicle de ASO. 29 chars com peso 3\u00d7 desperdi\u00e7ados.\n\n### Subtitle: SAIU / ENTROU\n\n**\ud83d\udd34 SAIU:**\n\n| Palavra        | Por qu\u00ea                                 |\n| -------------- | --------------------------------------- |\n| `Gest\u00e3o`       | pop 5 \u2014 marketing gen\u00e9rico sem volume   |\n| `Academica`    | typo (sem acento) \u2192 perde indexa\u00e7\u00e3o     |\n| `Simplificada` | adjetivo de marketing, pop=5, ASO morto |\n\n**\ud83d\udfe2 ENTROU:**\n\n| Palavra   | Pop | Diff | Por qu\u00ea                                                                    |\n| --------- | --- | ---- | -------------------------------------------------------------------------- |\n| `Agenda`  | 68  | 64   | Head do cluster B (Schedule). Era candidata pra keywords, sobe pra peso 3\u00d7 |\n| `Planner` | 63  | 58   | Trending em pt-BR. Empr\u00e9stimo do EN. Sobe pra peso 3\u00d7                      |\n| `Escolar` | 14  | 45   | Modifier universal. Sobe pra peso 3\u00d7 e comp\u00f5e melhor com tudo              |\n\n**\ud83d\udd04 MUDOU DE LUGAR (de keywords pra subtitle):**\n\n| Palavra | Antes              | Depois             | Por qu\u00ea                              |\n| ------- | ------------------ | ------------------ | ------------------------------------ |\n| `Notas` | keywords (peso 1\u00d7) | subtitle (peso 3\u00d7) | Triplica peso ASO sem custo de chars |\n\n---\n\n## \ud83d\udd11 KEYWORDS FIELD \u2014 reescrita\n\n### \ud83d\udd34 SAIU (do `keywords.txt` atual)\n\n| Termo                       | Pop | Diff | Por qu\u00ea removeu                                                                              |\n| --------------------------- | --- | ---- | -------------------------------------------------------------------------------------------- |\n| `escola` (singular)         | 52  | 64   | **Substitu\u00eddo por `Escolar`** (modifier melhor) que vai pro subtitle                         |\n| `Contador` (capitalizado)   | 38  | 21   | **Bug de capitaliza\u00e7\u00e3o** \u2014 entra como `contador` lowercase (Astro mostrou: caps tinha pop=0) |\n| `controle`                  | 69  | 65   | **Duplicado com `name`** \u2014 `Controle de faltas` j\u00e1 indexa em peso 7\u00d7                         |\n| `faculdade` (2\u00aa ocorr\u00eancia) | \u2014   | \u2014    | **DUPLICATA literal** \u2014 Apple ignora repetidas \u2192 10 chars desperdi\u00e7ados                      |\n| `falta` (singular)          | 50  | 17   | **Duplicado com `faltas` no name** \u2014 Apple n\u00e3o diferencia singular/plural pt-BR              |\n| `aulas`                     | 5   | 62   | **Solo OUT** \u2014 s\u00f3 rankeia em compounds. Apple comp\u00f5e automaticamente sem listar solo         |\n| `marcar`                    | 5   | 23   | Mesmo padr\u00e3o de `aulas` \u2014 s\u00f3 rankeia em 2-gram (`marcar faltas` #1, etc)                     |\n| `frequ\u00eancia`                | 5   | 41   | rank #207 com 225 apps competindo \u2014 invis\u00edvel. Liberando 11 chars pra termos com pop maior   |\n\n### \ud83d\udfe2 ENTROU (no novo `keywords.txt`)\n\n| Termo       | Pop | Diff | Rank atual | Por qu\u00ea entrou                                                                                |\n| ----------- | --- | ---- | ---------- | --------------------------------------------------------------------------------------------- |\n| `contador`  | 38  | 21   | OUT        | Sweet spot puro \u2014 pop alto + diff baix\u00edssimo. Caps-bug fix do `Contador` antigo.              |\n| `registro`  | 29  | 19   | OUT        | **Sweet spot m\u00e1ximo** \u2014 verbo direto (\"registrar falta/presen\u00e7a/aula\"). Diff baix\u00edssimo (19!) |\n| `unip`      | 56  | **15** | OUT      | **\ud83e\udd47 SWEET SPOT BRUTAL** \u2014 uni-brand (Universidade Paulista). Diff 15 = ranqueia f\u00e1cil. Audience direta. |\n| `puc`       | 48  | 21   | OUT        | **\ud83e\udd48 Sweet spot uni-brand** (PUC-RS/Rio/SP/Minas). Pop 48 + diff 21 \u2014 audience college BR.   |\n| `caderno`   | 37  | 52   | OUT        | Validada pela fam\u00edlia `caderno digital` (pop=53). Solo + composi\u00e7\u00e3o.                          |\n| `digital`   | \u2014   | \u2014    | OUT        | Modifier \u2014 comp\u00f5e `caderno digital` (pop 53). Apple combina os dois tokens automaticamente.   |\n| `chamada`   | 31  | 47   | OUT        | Verbo direto pt-BR (\"marcar chamada\"). Vocabul\u00e1rio escolar/universit\u00e1rio.                     |\n| `estudante` | 50  | 58   | OUT        | Audience self-id. Pop alta, multiplier (combina com tudo).                                    |\n| `contagem`  | 28  | 45   | OUT        | Verbo direto da feature. Sweet spot diff < 50.                                                |\n\n### \ud83d\udd04 MANT\u00c9M (estava na live, fica na nova)\n\n| Termo            | Pop | Diff | Rank atual | Por qu\u00ea fica                                                                             |\n| ---------------- | --- | ---- | ---------- | ---------------------------------------------------------------------------------------- |\n| `presen\u00e7a`       | 5   | 5    | **#33**    | J\u00e1 rankeia organicamente. Mant\u00e9m + agora cluster `presen\u00e7a + chamada + contagem` refor\u00e7a |\n| `disciplina`     | 6   | 45   | **#60**    | J\u00e1 rankeia em compounds + solo. Vocabul\u00e1rio core.                                        |\n| `faculdade` (1\u00aa) | 22  | 58   | **#111**   | **CRUCIAL** \u2014 audience-defining word. J\u00e1 rankeia #111, perder isso \u00e9 regredir.           |\n\n### \ud83d\udd01 CASE-FIX\n\n| Termo      | Antes            | Depois             | Por qu\u00ea                                                                                                                                                            |\n| ---------- | ---------------- | ------------------ | ------------------------------------------------------------------------------------------------------------------------------------------------------------------ |\n| `contador` | `Contador` (cap) | `contador` (lower) | Astro mostrou que `Contador` (cap) estava com pop=0 enquanto `contador` (lower) tem pop=38. Apple/Astro tokenizer n\u00e3o trata case como esperado \u2014 corre\u00e7\u00e3o cr\u00edtica. |\n\n---\n\n## \ud83d\udcc4 Resultado final pra v1.2.0\n\n```\nNAME (UNCHANGED):\nControle de faltas \u2022 College                                                       (28/30 chars)\n\nSUBTITLE (REESCRITO):\nAgenda, Notas, Planner Escolar                                                      (30/30 chars)\n\nKEYWORDS (REESCRITO):\ncontador,registro,unip,puc,caderno,digital,presen\u00e7a,disciplina,faculdade,            (99/100 chars)\nestudante,chamada,contagem\n```\n\n### Cobertura por cluster (peso composto)\n\n| Cluster                 | name (\u00d77)        | subtitle (\u00d73)            | keywords (\u00d71)                         | Total weight cluster |\n| ----------------------- | ---------------- | ------------------------ | ------------------------------------- | -------------------- |\n| Faltas (killer feature) | controle, faltas | \u2014                        | contador, contagem, presen\u00e7a, chamada | 14 + 4 = **18\u00d7**     |\n| Schedule / Planner      | \u2014                | agenda, planner, escolar | \u2014                                     | **9\u00d7**               |\n| Uni-brand (audience)    | \u2014                | \u2014                        | unip, puc                             | **2\u00d7** (sweet spots) |\n| Grades                  | \u2014                | notas                    | \u2014                                     | **3\u00d7**               |\n| Audience                | college (brand)  | escolar                  | estudante, faculdade                  | 7 + 3 + 2 = **12\u00d7**  |\n| Verbs (intent)          | \u2014                | \u2014                        | registro, contagem, chamada           | **3\u00d7**               |\n| Subjects                | \u2014                | \u2014                        | disciplina                            | **1\u00d7**               |\n| Caderno family          | \u2014                | \u2014                        | caderno, digital                      | **2\u00d7**               |\n\n---\n\n## \ud83c\udfaf Hip\u00f3tese formal pra `meta.json`\n\n> **If we change**:\n> - Subtitle de `Gest\u00e3o Academica Simplificada` (3 palavras pop=5, 1 typo) **para** `Agenda, Notas, Planner Escolar` (3 heads pop\u226560 + modifier)\n> - Keywords de `escola,Contador,controle,faculdade,disciplina,frequ\u00eancia,notas,aulas,marcar,falta,faculdade,presen\u00e7a` (com `Contador` mal-capitalizado + `faculdade` duplicado + 3 solo-OUT) **para** `contador,registro,unip,puc,caderno,digital,presen\u00e7a,disciplina,faculdade,estudante,chamada,contagem`\n>\n> **then** total impressions em pt-BR aumentam **\u226550% em 30 dias** e downloads \u2191 **\u226530%**,\n>\n> **because**: (a) Subtitle absorve 3 heads pop\u226560 (Agenda/Notas/Planner) que estavam fora de qualquer campo, elevando-os de peso 0 pra peso 3\u00d7. (b) Corrige typo `Academica \u2192 Acad\u00eamica` (perda silenciosa de indexa\u00e7\u00e3o por anos). (c) Keywords absorve **2 uni-brands sweet-spot** (`unip` pop 56 diff 15!, `puc` pop 48 diff 21) + audience multiplier (`estudante`) + sweet-spot verbs (`registro` diff=19!, `contagem`, `chamada`). (d) `contador` ganha indexa\u00e7\u00e3o (pop 38 diff 21) que estava com bug de capitaliza\u00e7\u00e3o. (e) Mant\u00e9m os 3 termos que j\u00e1 rankeiam (`presen\u00e7a #33`, `disciplina #60`, `faculdade #111`) \u2014 protegendo rank existente. (f) Split `caderno`+`digital` indexa termo pop=53 via composi\u00e7\u00e3o.\n\n---\n\n## \u26a0\ufe0f Riscos identificados\n\n1. **Mudan\u00e7a de subtitle \u00e9 mais vis\u00edvel pro usu\u00e1rio** que mudan\u00e7a de keywords. ~1 semana pra Apple reindex+propagar.\n2. **`Planner` no subtitle \u00e9 estrangeirismo** \u2014 pode soar menos profissional pra usu\u00e1rio 40+. Mas p\u00fablico-alvo \u00e9 18-25 \u2192 risco baixo.\n3. **`Agenda` e `Planner` no subtitle** t\u00eam diff alto (58-64) \u2014 pode n\u00e3o rankear top-50 mesmo com peso 3\u00d7. Downside \u00e9 s\u00f3 \"n\u00e3o melhora\", n\u00e3o regress\u00e3o.\n4. **`unip` e `puc` (uni-brands)** \u2014 risco baixo de Apple rejeitar (nomes gen\u00e9ricos n\u00e3o-marcados), mas convers\u00e3o pode ser menor (busca por \"unip\" pode querer o app oficial UNIP, n\u00e3o nosso). Sweet spot diff (15/21) torna a aposta barata.\n4. **Subir 2 campos na mesma iter** quebra a regra \"1 vari\u00e1vel por iter\" do README. Trade-off aceito pra app cold-start: velocity > attribution. Compensa\u00e7\u00e3o: snapshots de `metrics/` cada 7 dias permitem reconstruir atribui\u00e7\u00e3o via per-keyword rank shifts.\n5. **Sem baseline measurado ainda** \u2014 `pull_analytics.py` precisa rodar ANTES do deploy pra ter o Day 0.\n6. **Apple review pode demorar 2-3 dias** pra mudan\u00e7a de subtitle.\n\n---\n\n## \ud83d\udccb Mudan\u00e7as vs an\u00e1lise anterior (transpar\u00eancia)\n\nEsta an\u00e1lise REVISADA corrige a anterior, que estava baseada nos valores do v1.1.0 (que eu havia patchado erradamente como \"current\" via API earlier). O `verify_current.sh` (novo) detectou a diverg\u00eancia e o `sync_current_from_asc.py` corrigiu pro estado live real.\n\n| O que mudou na an\u00e1lise     | Antes (errado)           | Agora (correto)                                                          |\n| -------------------------- | ------------------------ | ------------------------------------------------------------------------ |\n| Live tem stopword `de`?    | Sim (no v1.1.0)          | **N\u00e3o** (live v1.1.1 n\u00e3o tem)                                            |\n| Live tem `unive` truncado? | Sim (no v1.1.0)          | **N\u00e3o** (live v1.1.1 n\u00e3o tem)                                            |\n| `presen\u00e7a` \u00e9 novo?         | Sim (n\u00e3o estava na live) | **N\u00e3o, j\u00e1 rankeia #33**                                                  |\n| `faculdade` sai?           | Sim (era pra remover)    | **N\u00e3o, mant\u00e9m \u2014 rank #111 \u00e9 asset**                                      |\n| Token swap                 | `tarefas` na proposta    | **`faculdade` na proposta** (recupera rank #111 ao inv\u00e9s de aposta cega) |\n";</script><script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script><script>document.getElementById("md").innerHTML=window.marked?marked.parse(RAW):"<pre>"+RAW.replace(/</g,"&lt;")+"</pre>";</script></div><script>(function(){try{var k="lh.scroll:"+location.pathname;var v=sessionStora
