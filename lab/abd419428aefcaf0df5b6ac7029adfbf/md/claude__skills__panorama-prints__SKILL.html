<body><div class="wrap"><p class="sub" style="font-size:12px;margin:0 0 14px">Exportado em 2026-10-01 12:36 · fonte: Lab Hub local</p><p class="sub"><a href="../index.html">← hub</a> · <code>_GambitStudio/.claude/skills/panorama-prints/SKILL.md</code></p><div id="md"></div><script>const RAW="---\nname: panorama-prints\ndescription: Gera o PROMPT pro Jo\u00e3o pedir a imagem panor\u00e2mica de prints numa IA de imagem (ChatGPT/Nano Banana) e processa o resultado (corte, headlines, locales, PPO). Use quando o Jo\u00e3o disser \"/panorama-prints\", \"manda o prompt pra gerar imagem\", \"prompt pro tratamento X do app Y\", \"vamos fazer prints panorama pro app Z\".\n---\n\n# Panorama Prints \u2014 pedir imagem pro GPT e processar\n\nFluxo validado (Walk, Cloak, BLW \u2014 ago/2026). O Jo\u00e3o gera a imagem no ChatGPT\n(ou Nano Banana Pro); Claude prepara o prompt, corta, legenda e sobe.\nTemplate-fonte do prompt: `_GambitStudio/templates/panorama-print-prompt.md`\n(ler SEMPRE \u2014 tem o texto base + regras de corte).\n\n## Passo 1 \u2014 Preparar refer\u00eancia e specs (Claude)\n\n1. Baixar os 5 prints de produ\u00e7\u00e3o do app via ASC API (vers\u00e3o READY_FOR_SALE \u2192\n   appScreenshotSets \u2192 imageAsset.templateUrl). Salvar em\n   `~/Desktop/<App>-prints-producao/<locale>/<displayType>/` e abrir a pasta.\n2. **Descobrir o display type da default page** (n\u00e3o assumir!):\n   - `APP_IPHONE_67` \u2192 imagem 6600x2868, fatia 1320x2868, headline zone 560px,\n     cortes em x = 1320/2640/3960/5280\n   - `APP_IPHONE_65` \u2192 imagem 6210x2688, fatia 1242x2688, headline zone 525px,\n     cortes em x = 1242/2484/3726/4968\n   PPO exige o MESMO display type da default page (sen\u00e3o IMAGE_INCORRECT_DIMENSIONS).\n3. Olhar os prints (paleta real, telas, mascotes) antes de escrever o prompt.\n\n## Passo 2 \u2014 Escrever o prompt (Claude entrega, Jo\u00e3o cola no GPT)\n\n**ENTREGA = o prompt DIRETO no chat, dentro de um code fence (```) pra copiar\ncom 1 clique.** N\u00c3O criar arquivo .md, N\u00c3O abrir mdview \u2014 o Jo\u00e3o s\u00f3 precisa\ndo texto copi\u00e1vel na conversa + o lembrete de anexar os 5 prints de refer\u00eancia\n(dizer o path da pasta). Prompt em linhas longas (sem quebra manual de 80\ncolunas) pra colar limpo no ChatGPT.\n\nPreencher o template com: app name, nicho, brand color, cena do nicho,\n5 telas. Regras que N\u00c3O podem faltar (todas j\u00e1 no template):\n\n- Dimens\u00f5es + 5 pain\u00e9is iguais + linhas de corte expl\u00edcitas.\n- Headline zone no topo: escura, calma, SEM texto \u2014 e **NUNCA chapada**\n  (bullet \"CRITICAL\": a cena continua pra cima desfocada; \"zoom no topo tem\n  que mostrar a cena, n\u00e3o tinta\").\n- Phones GRANDES, **inteiros, com margem fina embaixo** (~4% da altura /\n  ~110px de fundo vis\u00edvel sob o phone \u2014 Jo\u00e3o rejeitou o phone cortado pela\n  borda em 2026-08-28: \"grudado\" faz o iPhone parecer esticado), propor\u00e7\u00e3o\n  real 9:19.5 (\"NEVER stretched\"), ~75% da altura, encostando na headline zone.\n- Conte\u00fado cr\u00edtico nos 70% centrais de cada quinto.\n- \"Do NOT render any text outside the phone screens\" (texto \u00e9 SEMPRE por c\u00f3digo).\n- Breakout card com glow na cor da marca nos pain\u00e9is 1-3.\n\n**Liberdade criativa**: se o resultado ficar \"igual \u00e0 refer\u00eancia\", trocar o\nbloco de telas por briefs conceituais (\"EACH PANEL SELLS ONE CORE FEATURE...\na user must understand it in ONE SECOND\") + \"Do NOT copy their layouts, FULL\nCREATIVE FREEDOM\". Refer\u00eancia passa a ser s\u00f3 marca/paleta.\n\n**Frame extra \"header\" (opcional \u2014 iOS 27, playbook \u00a711):** quando pedido,\no prompt ganha um 6\u00ba painel landscape \u00e0 direita (mesmo fundo de marca, mesma\nfam\u00edlia visual, SEM texto, 1 phone ou o breakout do print 1 em destaque) pra\nvirar o Creative Asset/Header quando a ASC abrir a spec. Fica em `source/`\ndo experimento e N\u00c3O sobe \u2014 propor\u00e7\u00e3o s\u00f3 se confirma no outono.\n\n## Passo 3 \u2014 Treatments pro A/B (venda diferente, n\u00e3o s\u00f3 ordem)\n\nCada treatment muda O QUE o print vende (hip\u00f3teses reais):\n- **Feature tour** (benef\u00edcio direto, telas-chave)\n- **Killer-feature-first / fear-relief** (a feature matadora no print 1)\n- **Emocional/jornada** (timeline de transforma\u00e7\u00e3o do usu\u00e1rio; headlines viram\n  a linha do tempo)\n- **Content/appetite-first** (o conte\u00fado gigante como estrela, phone menor)\n- **Din\u00e2mico 3D** (phones inclinados + elementos flutuando \u2014 validado no nicho privacy)\nVariar tamb\u00e9m cena/mood entre treatments (mesma fam\u00edlia de marca).\n\n## Passo 4 \u2014 Itera\u00e7\u00e3o (prompts curtos de refino)\n\n- **Veio com texto baked** \u2192\n  \"Keep this exact image \u2014 same phones, same screens, same background. ONLY\n  remove all the text and icons above/outside the phones. Leave that area as\n  clean background. Change absolutely nothing else.\"\n- **Topo chapado** \u2192 N\u00c3O regenerar composi\u00e7\u00e3o aprovada; Claude conserta no\n  corte (esticar cena desfocada pra cima). Prompt s\u00f3 se for regenerar por\n  outro motivo.\n- **Gap embaixo / phones flutuando** \u2192 Claude conserta no corte (ancoragem).\n- Refinos sempre \"Keep this exact image... change ONLY...\" \u2014 e avisar o Jo\u00e3o\n  que edi\u00e7\u00e3o regenera tudo (risco de perder composi\u00e7\u00e3o aprovada).\n\n## Passo 5 \u2014 Processamento (Claude, ap\u00f3s receber o PNG)\n\n1. Grid overlay pra medir: centro de cada phone (bezel), topo, bottom.\n2. Corte por painel: janela da largura-alvo CENTRADA no phone (nunca quintos\n   fixos); escala pra phone ocupar do y=PHONE_TOP (~470-560) at\u00e9 a borda\n   inferior (cortar ~15px DENTRO do bezel = look \"cropped by frame\"); pad de\n   c\u00e9u se faltar topo.\n3. **Mascotes em cima das linhas de corte**: com o v\u00e3o entre prints da App\n   Store, objeto cortado ao meio fica quebrado. Apagar o fragmento do painel\n   onde ele aparece minorit\u00e1rio (vfill vertical sobre bezel/fundo cont\u00ednuo;\n   hfill clonando coluna limpa sobre cards). CUIDADO com os limites \u2014 n\u00e3o\n   varrer conte\u00fado de tela/card (medir com zoom 3x antes).\n4. Headlines por c\u00f3digo (SF Pro via SFNS.ttf variations): branco + sombra\n   preta (topo escuro) ou cor da marca + glow claro (topo claro).\n   **No m\u00e1ximo 2 linhas, as duas do MESMO tamanho, cada linha com altura de\n   ~8-11% da largura do print** (Jo\u00e3o, 28/09/2026). Medido nos l\u00edderes da\n   categoria (Wayk, Glow, SuperAlarm, Alarmy): t\u00edtulo a 8-14% da largura, linhas\n   iguais; o que fica a 3-5% \u00e9 subt\u00edtulo e n\u00e3o se l\u00ea na lista de busca (o print\n   aparece com ~120pt de largura). Nada de linha pequena/subt\u00edtulo. Se a frase n\u00e3o\n   cabe em 2 linhas nesse tamanho, ENCURTAR A FRASE, nunca diminuir a letra nem\n   quebrar em 3. Tamanho \u00fanico por idioma (os 5 alinhados) e espa\u00e7o entre linhas\n   que reserve acento (\u00cd, \u00ca) e cedilha (\u00c7) \u2014 sem isso o acento de N\u00cdVEL colou no\n   C de ESCOLHA (\"ES\u00c7OLHA\"). Copy baseada nos t\u00edtulos dos concorrentes l\u00edderes. Todos os locales da\n   default page (conferir \u2014 pode ter es-MX etc.).\n5. **Exportar SEMPRE os dois tamanhos de iPhone** (Jo\u00e3o, 27/09/2026): 6.9\"\n   `APP_IPHONE_67` 1320x2868 E 6.5\" `APP_IPHONE_65` 1242x2688. A arte-base \u00e9 a\n   do 6.9\"; o 6.5\" sai dela com resize proporcional pela largura (1320\u21921242,\n   altura vira ~2698) + corte de ~10px no FUNDO (nunca no topo \u2014 \u00e9 onde fica a\n   headline), NUNCA esticar (`sips --resampleWidth 1242 x.png && sips -c 2688 1242\n   --cropOffset 0 0`). Pastas `<locale>/APP_IPHONE_67/` e `<locale>/APP_IPHONE_65/`.\n   Subir nos dois display types: set de 6.5\" herdado com arte velha \u00e9 o que a UI\n   da ASC mostra no preview e o que iPhone menor v\u00ea (LEARNINGS #35 UPDATE 2).\n6. Registrar no Preview Kit e mandar o link. Reordena\u00e7\u00e3o: Jo\u00e3o arrasta no\n   site \u2192 order.json \u2192 PATCH relationship na ASC.\n7. Upload PPO S\u00d3 com ordem expl\u00edcita do Jo\u00e3o (experimento draft/APPROVED\n   bloqueando \u2192 PATCH started:false \u2192 STOPPED; deletar s\u00f3 funciona em\n   PREPARE_FOR_SUBMISSION). Dedup por sourceFileChecksum p\u00f3s-upload.\n   **Antes de criar o experimento: gate de poder** (`upload_ppo.py\n   --power-check`, default ON \u2014 playbook \u00a73b). Abaixo do piso de tr\u00e1fego o\n   PPO n\u00e3o fecha nem +20% em 90 dias: a arte vai direto pra default page e se\n   mede antes/depois. 1 treatment, swing grande. No dia do stop, copiar os\n   n\u00fameros do ASC web pra `results/` do experimento.\n\n## Passo 6 \u2014 Variante CPP por keyword (playbook \u00a78)\n\nMesma arte, **s\u00f3 o painel 1 muda**: re-legendar o print 1 com a query literal\n(message match) e reaproveitar 02-05 sem tocar. Uma keyword \u2192 uma p\u00e1gina; a\nkeyword tem que estar no campo keywords da vers\u00e3o. Sa\u00edda em\n`variant_<keyword>/<locale>/`. Deploy s\u00f3 com pedido do Jo\u00e3o; medir sequencial\nantes/depois no termo \u2014 nunca CPP \u00d7 default (tr\u00e1fego diferente).\n";</script><script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script><script>document.getElementById("md").innerHTML=window.marked?marked.parse(RAW):"<pre>"+RAW.replace(/</g,"&lt;")+"</pre>";</script></div><script>(function(){try{var k="lh.scroll:"+location.pathname;var v=sessionStorage.getItem(k);if(v!==null){sessionStorage.removeItem(k);window.scrollTo(0,parseInt(v,10)||0);}document.addEventListener("submit",function(e){var f=e.target;if(f&&f.method&&f.method.toLowerCase()==="post"){sessionStorage.setItem(k,String(window.scrollY));}},true);}catch(e){}})();</script></body></html>
