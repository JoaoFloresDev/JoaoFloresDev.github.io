<style>

.wrap{width:min(1680px,94vw);margin:0 auto;padding:24px 0 80px}@media(max-width:860px){.wrap{width:calc(100vw - 28px)}}.ico{width:20px;height:20px;border-radius:5px;vertical-align:-5px;margin-right:7px;background:var(--bd);object-fit:cover}.ico.big{width:30px;height:30px;border-radius:7px;vertical-align:-9px}h2{border-top:1px solid var(--bd);padding-top:20px;margin-top:30px}section,.twrap{min-width:0}h2:first-of-type{border-top:0;padding-top:0}h1+h2,.sub+h2{border-top:0;padding-top:0}
h1{font-size:22px;margin:0 0 4px}h2{font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:34px 0 12px}

.hcol .row{flex-direction:column;align-items:flex-start;gap:4px}.hcol .row b{white-space:normal}.hcol .row span{width:100%}.hcol .row em{display:none}.hcol .row.done b{font-size:12px}.hrow{display:flex;gap:20px;overflow-x:auto;align-items:flex-start;padding:16px 28px 12px;margin:18px 0 26px;background:rgba(125,125,125,.07);border:1px solid var(--bd);border-radius:16px;scroll-padding:0 28px}.hcol{flex:0 0 340px;min-width:340px}.hcol:last-child{margin-right:28px}.hcol h2{margin-top:0}.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:0 20px}.cols2{display:grid;grid-template-columns:1fr 1fr;gap:0 20px;align-items:start}@media(max-width:900px){.cols2{grid-template-columns:1fr}}h3.team{margin:18px 0 8px;font-size:15px;font-weight:600}h3.team .chain{display:block;color:var(--mut);font-weight:400;font-size:12.5px;margin-top:2px}.card .step{display:inline-block;min-width:18px;height:18px;line-height:18px;text-align:center;border-radius:9px;background:var(--bd);color:var(--mut);font-size:11px;font-weight:600;margin-right:6px}.grid4{display:grid;gap:12px;grid-template-columns:repeat(4,1fr)}@media(max-width:1100px){.grid4{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.grid4{grid-template-columns:1fr}}
.rows{display:flex;flex-direction:column;gap:8px}

.tiles{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(152px,1fr));margin:14px 0 6px}

.shots{display:flex;gap:8px;overflow-x:auto;padding:4px 0}
.shots img{height:210px;border-radius:10px;border:1px solid var(--bd);flex:0 0 auto}
.gallery img{height:460px;max-height:72vh}

.st.run{background:rgba(13,150,104,.16);color:var(--ok)}

.st.crit{background:rgba(200,34,34,.15);color:var(--down)}
.rowwrap{position:relative}

.fnds li:before{background:var(--bd)}.fnds li.crit:before{background:var(--down)}.fnds li.warn:before{background:#c9930a}.fnds li.ok:before{background:var(--ok)}
.nxt .nxl{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}

.fnote{font-size:11.5px;color:var(--mut);margin:4px 0 0 176px;line-height:1.35}

/* ---------- camada de acabamento (01/10/2026) ----------
   Tipografia com duas vozes (display para títulos e números, texto para leitura),
   neutros com viés do azul da marca em vez de cinza puro, e profundidade por
   sombra em vez de só borda. Nada aqui renomeia classe: é uma camada por cima. */
:root{
  --f-disp:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --f-text:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --bg:#eef1f7; --card:#ffffff; --tx:#0a0d14; --mut:#4b5567; --acc:#2b3340;
  --bd:#cbd3e0; --bd-soft:#dfe5ee; --ok:#07804e; --down:#c42121; --warn:#9a4408;
  --sh:0 1px 2px rgba(16,19,26,.05),0 2px 8px rgba(16,19,26,.04);
  --sh-up:0 2px 6px rgba(16,19,26,.07),0 10px 24px rgba(16,19,26,.07);
  --boardtop:#ffffff; --boardbot:#f3f6fb;
  --bar:#2563eb; --bar2:#60a5fa;
  --rad:14px;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#07090d; --card:#141922; --tx:#f7f9fc; --mut:#b2bdd0; --acc:#ccd6e6;
  --bd:#333c4c; --bd-soft:#232a36; --ok:#55e39d; --down:#ff8585; --warn:#ffbb55;
  --sh:0 1px 2px rgba(0,0,0,.4); --sh-up:0 6px 22px rgba(0,0,0,.5);
  --boardtop:#161c26; --boardbot:#101620;
  --bar:#5b9bff; --bar2:#9dc4ff;
}}
body{font-family:var(--f-text);font-size:14.5px;line-height:1.6;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1{font-family:var(--f-disp);font-size:27px;font-weight:800;letter-spacing:-.02em;
  text-wrap:balance;margin:0 0 2px}
h1 .mark{display:inline-block;width:28px;height:28px;vertical-align:-5px;margin-right:11px;
  background-size:contain;background-repeat:no-repeat;background-position:center}
h2{font-family:var(--f-disp);font-size:12px;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;color:var(--mut);border-top:1px solid var(--bd-soft);
  padding-top:22px;margin:32px 0 14px}
h3{font-family:var(--f-disp);letter-spacing:-.01em}
.sub{font-size:13px;color:var(--mut)}
code,.mono{font-family:var(--f-mono);font-size:12.5px}
.card,table.t,a.tile,.row,.fcard,#md{box-shadow:var(--sh);border-color:var(--bd-soft)}
.card,a.tile,.row,.fcard{border-radius:var(--rad)}
a.tile,.row{transition:box-shadow .16s ease,border-color .16s ease,transform .16s ease}
a.tile:hover,a.row:hover{box-shadow:var(--sh-up);border-color:var(--bd);
  transform:translateY(-1px)}
/* O card do app é área de leitura, não botão: nada muda no hover. A regra antiga
   trocava a sombra, e num card sem sombra isso aparecia como animação. */
.fcard,.fcard:hover{transition:none!important;transform:none!important}
/* big numbers: the first thing anyone reads on the page */
.tiles{gap:12px;margin:18px 0 4px}
a.tile{padding:13px 17px;min-width:148px}
.tile .tl{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
  color:var(--mut)}
.tile .tv{font-family:var(--f-disp);font-size:25px;font-weight:800;letter-spacing:-.025em;
  margin-top:3px}
.tile .ts{font-size:11.5px;color:var(--mut)}
/* tables read as data, not as prose */
table.t{border-radius:var(--rad);font-variant-numeric:tabular-nums}
table.t th{font-family:var(--f-disp);font-size:11px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;background:var(--bd-soft);border-bottom:1px solid var(--bd)}
table.t td{padding:9px 13px;border-bottom:1px solid var(--bd-soft)}
table.t tbody tr:hover td,table.t tr:hover td{background:rgba(125,140,170,.06)}
.twrap{border-radius:var(--rad)}
/* buttons */
.btn{font-family:var(--f-disp);font-weight:600;font-size:13.5px;padding:9px 18px;
  border-radius:999px;box-shadow:var(--sh);transition:all .16s ease}
.btn:hover{border-color:var(--acc);box-shadow:var(--sh-up);transform:translateY(-1px)}
.pill,.st{font-family:var(--f-disp);font-weight:600;font-size:11.5px;letter-spacing:.02em}
/* status colours carry meaning, so keep them out of the accent */
.st.run,.st.appr{background:rgba(10,143,88,.14);color:var(--ok)}
.st.crit{background:rgba(208,47,47,.14);color:var(--down)}
.st.rev,.st.draft{background:rgba(180,83,9,.14);color:var(--warn)}
/* the lanes strip and any scroller get a thin, rounded bar */
.hrow,.twrap{scrollbar-width:thin;scrollbar-color:var(--bd) transparent}
.hrow::-webkit-scrollbar,.twrap::-webkit-scrollbar{height:9px}
.hrow::-webkit-scrollbar-track,
.twrap::-webkit-scrollbar-track{background:transparent}
.hrow::-webkit-scrollbar-thumb,
.twrap::-webkit-scrollbar-thumb{background:var(--bd);border-radius:999px;
  border:3px solid transparent;background-clip:content-box}
.hrow::-webkit-scrollbar-thumb:hover,
.twrap::-webkit-scrollbar-thumb:hover{background:var(--mut);background-clip:content-box}
.hrow{background:transparent;border:0;padding:0;border-radius:0}
.hcol{flex:0 0 clamp(280px,26vw,360px);min-width:0}
a:focus-visible,button:focus-visible,.btn:focus-visible{outline:2px solid var(--acc);
  outline-offset:2px;border-radius:8px}
.dirlist,.prlist{margin:10px 0 0;padding-left:18px;list-style:none}
.dirlist>li,.prlist>li{position:relative;margin:0 0 7px;font-size:13.5px;line-height:1.5;
  color:var(--tx)}
.prlist>li{color:var(--mut);font-size:13px;margin-bottom:5px}
.dirlist>li::before,.prlist>li::before{content:"";position:absolute;left:-14px;top:.62em;
  width:5px;height:5px;border-radius:50%;background:var(--acc);opacity:.75}
.prlist>li::before{background:var(--mut);opacity:.5}
.dirp{display:none}
.dapps{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));
  margin:14px 0 4px;align-items:start}
.dapp{padding:14px 16px}
.dah{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.dah b{font-family:var(--f-disp);font-size:14.5px;font-weight:700}
.drank{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;
  border-radius:6px;background:var(--acc);color:var(--card);font-size:11.5px;font-weight:700;flex:none}
.st.d-dobrar{background:rgba(10,143,88,.16);color:var(--ok)}
.st.d-consertar{background:rgba(180,83,9,.16);color:var(--warn)}
.st.d-manter{background:rgba(125,140,170,.16);color:var(--mut)}
.st.d-congelar{background:rgba(125,140,170,.12);color:var(--mut)}
.dapp .prlist{margin-top:6px}
.dcall{color:var(--tx)!important;font-weight:600}
.fcard[id]{scroll-margin-top:18px}
.fdet{margin-top:10px;border-top:1px solid var(--bd-soft);padding-top:9px}
.fdet>summary{cursor:pointer;list-style:none;font-family:var(--f-disp);font-size:11.5px;
  font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);
  display:flex;align-items:center;gap:7px}
.fdet>summary::-webkit-details-marker{display:none}
.fdet>summary::before{content:"›";font-size:15px;transition:transform .15s}
.fdet[open]>summary::before{transform:rotate(90deg)}
.fdet>summary:hover{color:var(--acc)}
.fdet table.t{font-size:12.5px}
.fdet table.t td,.fdet table.t th{padding:6px 10px}
.fgrid.one{grid-template-columns:1fr!important;gap:18px}
/* Cada app é um painel com profundidade: a luz entra por cima, o corpo escurece
   até a base e a borda clareia só na primeira linha. É o que separa um app do
   outro sem precisar de moldura dura. */
.fgrid.one>.fcard{position:relative;padding:0;overflow:hidden;border-radius:16px;
  border:1px solid var(--bd-soft);
  background:linear-gradient(180deg,
    color-mix(in srgb, var(--acc) 5%, var(--card)) 0%,
    var(--card) 26%,
    color-mix(in srgb, #000 7%, var(--card)) 100%);
  box-shadow:0 1px 2px rgba(0,0,0,.05), 0 10px 26px -14px rgba(0,0,0,.28)}
@media(prefers-color-scheme:dark){.fgrid.one>.fcard{
  background:linear-gradient(180deg,
    color-mix(in srgb, var(--acc) 9%, var(--card)) 0%,
    var(--card) 30%,
    #0a0c10 100%);
  box-shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 18px 40px -22px rgba(0,0,0,.9)}}
.fgrid.one>.fcard::before{content:"";position:absolute;inset:0 0 auto;height:1px;
  background:linear-gradient(90deg, transparent,
    color-mix(in srgb, var(--acc) 45%, transparent), transparent)}
.fgrid.one>.fcard>.fh{background:transparent;margin:0;padding:15px 18px 12px;
  border-bottom:1px solid var(--bd-soft)}
.fgrid.one>.fcard>.fstats{padding:12px 18px 0}
.fgrid.one>.fcard>.fcols{padding:16px 18px 6px}
.fgrid.one>.fcard>.fdet{margin:0;padding:13px 18px 16px;border-top:1px solid var(--bd-soft);
  background:color-mix(in srgb, #000 4%, transparent)}
@media(prefers-color-scheme:dark){.fgrid.one>.fcard>.fdet{
  background:rgba(0,0,0,.25)}}
.fgrid.one>.fcard>.fh b{font-size:16px;letter-spacing:-.01em}
.fgrid.one>.fcard>.fh>span{font-size:12.5px;color:var(--tx);opacity:.78;
  font-variant-numeric:tabular-nums;font-weight:500}
/* a luz no topo do painel, um pouco mais presente */
.fgrid.one>.fcard::before{height:2px;
  background:linear-gradient(90deg, transparent, var(--acc), transparent);opacity:.5}
.fcard .fmeta{font-size:12px;color:var(--mut)}
/* funil: rótulo legível, número com peso, barra com corpo */
.fs{display:grid;grid-template-columns:150px 1fr auto;align-items:center;gap:12px;
  padding:5px 0}
.fs .fl{font-size:12.5px;color:var(--tx)}
.fs .fn{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;min-width:74px;
  text-align:right}
.fb{height:9px;border-radius:999px;background:var(--bd-soft);overflow:hidden}
.fb i{display:block;height:100%;border-radius:999px}
/* retenção com leitura imediata */
.rrow{margin:0}
.rc:first-child{border-top:0;padding-top:0}
/* o rótulo é legenda; quem salta é o número, na cor da régua */
.rc b{display:block;font-family:var(--f-disp);font-size:10px;font-weight:700;
  letter-spacing:.09em;text-transform:uppercase;color:var(--mut);margin:0}
.rc .rv{display:block;font-family:var(--f-disp);font-size:21px;font-weight:800;
  letter-spacing:-.025em;line-height:1.15;margin:3px 0 2px;font-variant-numeric:tabular-nums}
.rc>b{font-family:var(--f-disp);font-size:12px;font-weight:700;letter-spacing:.04em;
  color:var(--mut)}
.rc .rv{font-family:var(--f-disp);font-size:19px;font-weight:800;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums}
.rc .rb{display:block;font-size:11.5px;color:var(--mut)}
/* achados: mais ar e marcador claro */
.fnds li{font-size:12.5px;line-height:1.5;padding:4px 0 4px 16px}
.fnds li:before{width:6px;height:6px;top:.72em}
/* o detalhe convida a abrir */
.fdet>summary{font-size:11px;color:var(--acc);padding:3px 0}
.fdet>summary:hover{opacity:.82}
.fcols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;
  align-items:start}
@media(max-width:820px){.fcols{grid-template-columns:1fr;gap:12px}}
.fcol{min-width:0}
.fcol>.fnds{margin-top:0}
/* Régua de contexto do app: instalações, ativos, novos, crash-free. Antes isso
   era uma linha de texto corrido ("187 downloads/30d · WATCH · crash-free
   100%") que ninguém comparava entre cards; como números rotulados, dá pra
   varrer a coluna de cima a baixo. */
.fstats{display:flex;flex-wrap:wrap;gap:10px 26px;align-items:baseline}
.fst{display:flex;align-items:baseline;gap:7px;min-width:0}
.fstl{font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:var(--mut)}
.fst b{font-family:var(--f-disp);font-size:15px;font-weight:700;letter-spacing:-.015em;
  font-variant-numeric:tabular-nums}
.fstd{font-size:12px;font-weight:600}
.st.vd{background:rgba(125,140,170,.14);color:var(--mut)}
.fh .noasc{font-size:11.5px;font-weight:400;color:var(--warn)}
/* Cada metade do card diz o que é antes de mostrar número. */
.fgrp{margin-bottom:16px}
.fgrp:last-child{margin-bottom:0}
.fgl{display:block;font-family:var(--f-disp);font-size:10.5px;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;color:var(--mut);
  padding-bottom:7px;margin-bottom:10px;border-bottom:1px solid var(--bd-soft)}
.fcol>.fgrp>.fnds{margin-top:0}
.instrl{list-style:none;margin:9px 0 0;padding:0}
.instrl li{font-size:12.5px;line-height:1.55;color:var(--mut);padding:3px 0 3px 14px;
  position:relative;overflow-wrap:anywhere}
/* Coluna de leitura: linhas rotuladas, sem caixa. As caixas coloridas (funil
   verde, ação amarela) e o bloco expansível empilhavam quatro objetos de forma
   diferente num espaço estreito; rótulo à esquerda e texto à direita, separados
   por uma régua fina, lê de cima a baixo sem nada competindo (João, 02/10). */
.rline{display:grid;grid-template-columns:116px minmax(0,1fr);gap:16px;
  padding:12px 0;border-top:1px solid var(--bd-soft)}
.rline:first-child{border-top:0;padding-top:0}
.rlab{font-family:var(--f-disp);font-size:10.5px;font-weight:700;letter-spacing:.07em;
  text-transform:uppercase;color:var(--mut);padding-top:2px}
.rbody{min-width:0}
.rbody>b{display:block;font-family:var(--f-disp);font-size:14px;font-weight:700;
  letter-spacing:-.01em;line-height:1.35}
.rnum{display:block;margin-top:3px;font-size:12px;font-weight:600;color:var(--tx);
  font-variant-numeric:tabular-nums}
.rbody>p{margin:5px 0 0;font-size:12.5px;line-height:1.55;color:var(--mut)}
.rline.act .rlab{color:var(--tx)}
.rline.mut .rlab,.rline.mut .instrl li{color:var(--mut)}
.rbody>.fnds{margin:0}
@media(max-width:1180px){.rline{grid-template-columns:1fr;gap:6px}
  .rline .rlab{padding-top:0}}
.instrl{list-style:none;margin:0;padding:0}
.instrl li{font-size:12.5px;line-height:1.55;color:var(--mut);padding:2px 0 2px 14px;
  position:relative;overflow-wrap:anywhere}
.instrl li::before{content:"";position:absolute;left:0;top:.72em;width:5px;height:5px;
  border-radius:50%;background:var(--bd)}
/* Os passos de loja vêm de outra fonte que os de dentro do app: barra em tom
   mais surdo pra o olho ver onde a medição troca de sistema. */
.fs .fb i.store{background:linear-gradient(90deg,
  color-mix(in srgb, var(--bar) 45%, transparent),
  color-mix(in srgb, var(--bar) 70%, transparent))}
.fsub{display:block;font-size:10.5px;font-weight:600;letter-spacing:.07em;
  text-transform:uppercase;color:var(--mut);margin-bottom:6px}
.fsub.gap2{margin-top:14px}
.lchip{font-size:10px;color:var(--mut);background:var(--bd-soft);border-radius:999px;
  padding:1px 7px;cursor:help;white-space:nowrap}
.fcols{position:relative}
@media(min-width:821px){.fcols::before{content:"";position:absolute;top:0;bottom:0;
  left:50%;width:1px;background:var(--bd-soft)}}
.fdet .ascgrid{grid-template-columns:repeat(auto-fit,minmax(118px,1fr))}
.fdetcols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;
  align-items:start}
@media(max-width:1100px){.fdetcols{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:760px){.fdetcols{grid-template-columns:1fr}}
.fdetcols>div{min-width:0;display:flex;flex-direction:column;gap:14px}
.rawbox{background:var(--bg);border:1px solid var(--bd-soft);border-radius:11px;
  padding:11px 13px;min-width:0}
.rawbox h4,.rawbox h3.team{margin:0 0 8px;font-family:var(--f-disp);font-size:10.5px;
  font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--mut)}
.rawbox h3.team .chain{text-transform:none;letter-spacing:0;font-size:11px}
.rawbox table.t{border:0;box-shadow:none;background:transparent}
.rawbox table.t th{background:transparent;border-bottom:1px solid var(--bd)}
.rawbox table.t td{border-bottom:1px solid var(--bd-soft)}
.rawbox .twrap{border-radius:0}
.rawbox .ascgrid{margin-bottom:0;grid-template-columns:repeat(auto-fit,minmax(104px,1fr))}
.rawbox .ascgrid b{font-size:14px}
.srct{float:right;font-size:9px;font-weight:700;letter-spacing:.06em;padding:2px 7px;
  border-radius:999px;background:var(--bd);color:var(--mut);text-transform:uppercase}
.s-asc{background:rgba(125,140,170,.16);color:var(--tx)}
.s-firebase{background:rgba(180,83,9,.14);color:var(--warn)}
.noasc{background:rgba(180,83,9,.14);color:var(--warn);border-radius:999px;padding:1px 8px;
  font-size:10.5px;font-weight:600}
.convwhy{display:block;font-size:10.5px;color:var(--mut);margin-top:1px}
.rawbox .rate{padding:1px 7px;border-radius:999px;font-size:12.5px}
.featname{display:block;font-family:var(--f-mono);font-size:11.5px;margin-bottom:3px}
.featbar{display:block;height:4px;border-radius:999px;background:var(--bd-soft);overflow:hidden}
.featbar i{display:block;height:100%;border-radius:999px;
  background:linear-gradient(90deg, color-mix(in srgb, var(--acc) 70%, transparent), var(--acc))}
.legacyp{margin:8px 0 0;font-size:12px;color:var(--mut);line-height:1.7}
.legacyp code{font-size:11px}
.rawbox .ascgrid>div{background:var(--card)}
.fdet{margin-top:14px;border-top:1px solid var(--bd);padding-top:12px}
.fdet[open]>summary{margin-bottom:12px;color:var(--acc)}
.t .thsub{font-size:9.5px;font-weight:600;letter-spacing:.03em;color:var(--mut);
  text-transform:none}
.t .rate{padding:1px 8px;border-radius:999px;font-variant-numeric:tabular-nums}
.t .rate.good{background:rgba(10,143,88,.16);color:var(--ok)}
.t .rate.mid{background:rgba(180,83,9,.14);color:var(--warn)}
.t .rate.low{background:rgba(208,47,47,.13);color:var(--down)}
.thin{font-size:10.5px;color:var(--mut);background:var(--bd-soft);border-radius:999px;
  padding:1px 7px;cursor:help;white-space:nowrap}
.sbx{font-size:12px;color:var(--warn);background:rgba(180,83,9,.12);border-radius:999px;
  padding:1px 8px;cursor:help;white-space:nowrap}
.sbxnote{font-size:11.5px;color:var(--warn);background:rgba(180,83,9,.10);
  border:1px solid rgba(180,83,9,.25);border-radius:9px;padding:7px 10px;margin:0 0 10px}
.actv{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 9px;margin:0 0 10px;
  padding:8px 11px;border-radius:10px;background:var(--bd-soft)}
.actvt{font-family:var(--f-disp);font-size:10px;font-weight:800;letter-spacing:.09em;
  text-transform:uppercase;color:var(--mut)}
.actv b{font-family:var(--f-disp);font-size:15px;font-variant-numeric:tabular-nums}
.actvw{flex-basis:100%;font-size:11px;color:var(--mut)}
.fover{font-size:10.5px;color:var(--warn);background:rgba(180,83,9,.12);border-radius:999px;
  padding:1px 7px;cursor:help;white-space:nowrap}
.hspan{display:inline-block;margin-left:10px;font-size:10.5px;font-weight:600;letter-spacing:.04em;
  text-transform:none;color:var(--mut);background:var(--bd-soft);padding:2px 9px;border-radius:999px;
  vertical-align:2px}
.ascspan{font-size:11px;color:var(--mut);margin:2px 0 7px}
.ascgrid{display:grid;gap:7px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
  margin-bottom:10px}
.ascgrid>div{background:var(--bd-soft);border-radius:9px;padding:7px 10px;min-width:0}
.ascgrid span{display:block;font-size:10px;color:var(--mut);text-transform:uppercase;
  letter-spacing:.04em}
.ascgrid b{font-family:var(--f-disp);font-size:15px;font-variant-numeric:tabular-nums}
.fcard[id]:target{border-color:var(--acc);box-shadow:0 0 0 2px rgba(125,140,170,.3),var(--sh-up)}
/* ---------- acabamento: luz e profundidade (01/10) ----------
   Gradiente é usado onde tem função: a luz no topo dá direção à página, a barra
   do funil ganha volume, e o cabeçalho de cada app se separa do conteúdo. Fundo
   chapado em tudo o resto, para os números seguirem sendo o que salta. */
body{background:
  radial-gradient(1100px 420px at 12% -8%, color-mix(in srgb, var(--acc) 11%, transparent), transparent 70%),
  radial-gradient(900px 360px at 88% -4%, color-mix(in srgb, var(--ok) 7%, transparent), transparent 72%),
  var(--bg);
  background-attachment:fixed}
h1{background:linear-gradient(100deg, var(--tx) 30%, color-mix(in srgb, var(--acc) 72%, var(--tx)));

pletamente (n\u00e3o est\u00e1 em nenhum campo no novo) \u00b7\n<span style=\"color:#28a745\">**\ud83d\udfe2 Verde**</span> = entrou totalmente novo (n\u00e3o estava em campo nenhum antes) \u00b7\n<span style=\"color:#3b82f6\">**\ud83d\udd35 Azul claro**</span> = mudou de lugar pra um campo de PESO MAIOR (keywords \u2192 subtitle, subtitle \u2192 name) \u00b7\n<span style=\"color:#1e3a8a\">**\ud83d\udd35 Azul escuro**</span> = mudou de lugar pra um campo de PESO MENOR (name \u2192 subtitle, subtitle \u2192 keywords) \u00b7\nPreto/normal = mant\u00e9m no mesmo campo (com ou sem case-fix)\n\n### Name (mant\u00e9m)\n\n| Antes (atual)                       | Depois (proposto)                |\n| ----------------------------------- | -------------------------------- |\n| `App Lock: Esconder Aplicativos`    | `App Lock: Esconder Aplicativos` |\n| 30 chars \u00b7 killer feature + EN-mix  | 30 chars \u00b7 igual                 |\n\n### Subtitle (REESCRITO)\n\n| Antes (atual)                                                                                                                  | Depois (proposto)                                                                                                                                                                                                                              |\n| ------------------------------------------------------------------------------------------------------------------------------ | ------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ |\n| <span style=\"color:#dc3545\">Bloqueio</span> e <span style=\"color:#dc3545\">prote\u00e7\u00e3o</span> de apps                              | <span style=\"color:#28a745\">Proteja</span> apps com <span style=\"color:#3b82f6\">senha</span> e <span style=\"color:#3b82f6\">cofre</span>                                                                                                          |\n| 27 chars \u00b7 noun list (anti-padr\u00e3o) \u00b7 `prote\u00e7\u00e3o` solo pop=19 sem rank \u00b7 `Bloqueio` solo pop=5                                  | 30 chars \u00b7 verb+object+keyword \u00b7 `Proteja` cobre stem proteg- (peso 1\u00d7\u21923\u00d7) \u00b7 `senha` pop=58 (peso 1\u00d7\u21923\u00d7) \u00b7 `cofre` peso 1\u00d7\u21923\u00d7 (composi\u00e7\u00e3o forte: `cofre apps` rank=#86)                                                                          |\n\n### Keywords (REESCRITO)\n\n| Antes (atual)                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  | Depois (proposto)                                                                                                                                                                                                                                                                                                                                                                                |\n| ------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | ------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ |\n| <span style=\"color:#dc3545\">bloqueador</span>,<span style=\"color:#dc3545\">esconder app</span>,<span style=\"color:#3b82f6\">cofre</span>,<br><span style=\"color:#3b82f6\">senha</span>,face id,<span style=\"color:#dc3545\">tempo de uso</span>,<br>parental,<span style=\"color:#dc3545\">segredo</span>,<span style=\"color:#3b82f6\">proteger</span>,<br><span style=\"color:#dc3545\">privacidade</span>                                                                                                              | <span style=\"color:#28a745\">hide apps</span>,<span style=\"color:#28a745\">bloqueio de app</span>,<br><span style=\"color:#28a745\">controle parental</span>,<span style=\"color:#28a745\">tempo de tela</span>,<br><span style=\"color:#28a745\">disfarce</span>,<span style=\"color:#28a745\">disfar\u00e7ar</span>,<span style=\"color:#28a745\">vault</span>,<br>face id,parental                              |\n| 94 chars \u00b7 10 tokens \u00b7 4 dups com name/subtitle \u00b7 `tempo de uso` rank=#1000 pop=5 desperdi\u00e7ando 12 chars \u00b7 `bloqueador` solo morto                                                                                                                                                                                                                                                                                                                                                                              | 99 chars \u00b7 9 tokens \u00b7 0 dups \u00b7 frontload por pop descendente \u00b7 1 sweet-spot (`hide apps` rank=#55 organicamente) + 2 heads pop\u226536 + 1 bigram pop=47 + 2 Gold moats                                                                                                                                                                                                                                |\n\n---\n\n## \ud83c\udff7 NAME \u2014 `App Lock: Esconder Aplicativos` (mant\u00e9m)\n\nAn\u00e1lise palavra por palavra:\n\n| Palavra       | Pop | Diff | Rank atual | Decis\u00e3o                                                                                                                |\n| ------------- | --- | ---- | ---------- | ---------------------------------------------------------------------------------------------------------------------- |\n| `App`         | 62  | 94   | OUT solo   | **Mant\u00e9m** \u2014 head do nicho, diff invi\u00e1vel solo mas alimenta TODA composi\u00e7\u00e3o.                                            |\n| `Lock`        | 7   | 52   | OUT solo   | **Mant\u00e9m** \u2014 EN, comp\u00f5e `app lock` (pop=47 diff=41) e `app lock esconder` (rank=**#3**).                                |\n| `:`           | \u2014   | \u2014    | \u2014          | **Mant\u00e9m** \u2014 separator vis\u00edvel, `app lock:` exato rankeia **#40** (Apple trata como token).                              |\n| `Esconder`    | 5   | 55   | **#55**    | **Mant\u00e9m** \u2014 ENGINE PRINCIPAL: comp\u00f5e `esconder aplicativo` rank=**#2**, `esconder aplicativos` rank=**#7**, `esconder apps` rank=**#21**. Tudo isso SEM keyword expl\u00edcita. |\n| `Aplicativos` | 5   | 92   | OUT solo   | **Mant\u00e9m** \u2014 verbose nicho, alimenta `esconder aplicativos` rank=#7.                                                    |\n\n**Veredito:** name est\u00e1 fazendo 100% do trabalho pesado de ranqueamento via composi\u00e7\u00e3o name\u00d7name. N\u00e3o mexer.\n\n---\n\n## \ud83c\udff7 SUBTITLE \u2014 `Bloqueio e prote\u00e7\u00e3o de apps` (REESCREVER)\n\n### An\u00e1lise palavra-por-palavra do subtitle atual:\n\n| Palavra    | Pop | Diff | Rank atual | Problema                                                                                              |\n| ---------- | --- | ---- | ---------- | ----------------------------------------------------------------------------------------------------- |\n| `Bloqueio` | 5   | 48   | OUT        | Solo pop=5 (piso) \u2014 bigram `bloqueio de app` pop=36 n\u00e3o rankeia (rank=1000). Noun-list anti-padr\u00e3o.   |\n| `prote\u00e7\u00e3o` | 19  | 58   | OUT        | Pop relevante mas rank=1000 \u2014 stem proteg- desperdi\u00e7ado em subtitle noun-led.                          |\n| `apps`     | 53  | 93   | OUT        | J\u00e1 era subtitle. Mant\u00e9m.                                                                              |\n\n**Diagn\u00f3stico:** subtitle atual \u00e9 noun-list (anti-padr\u00e3o memory [feedback-aso-subtitle-verb-led]). Peso 3\u00d7 desperdi\u00e7ado em forma passiva.\n\n### Subtitle: SAIU / ENTROU / MUDOU\n\n**\ud83d\udd34 SAIU:**\n\n| Palavra    | Por qu\u00ea                                                                                                          |\n| ---------- | ---------------------------------------------------------------------------------------------------------------- |\n| `Bloqueio` | Noun-led pattern. `bloqueio de app` (pop=36) movido pra keywords expl\u00edcito.                                       |\n| `prote\u00e7\u00e3o` | Stem proteg- consolidado via verbo `Proteja` (cobre proteger/prote\u00e7\u00e3o/proteja). N\u00e3o perde, eleva pra verbo.       |\n\n**\ud83d\udfe2 ENTROU:**\n\n| Palavra   | Pop  | Diff | Por qu\u00ea                                                                                                                                  |\n| --------- | ---- | ---- | ---------------------------------------------------------------------------------------------------------------------------------------- |\n| `Proteja` | (5)  | (63) | Verbo imperativo (memory [feedback et apps`. (d) `screen time` sub-bigram + `Face ID` em subtitle peso 3\u00d7 \u2014 dois heads pop alto elevados sem custo de char. (e) `invisible apps` (Sweet Spot j\u00e1 top-10) consolida pela inclus\u00e3o expl\u00edcita. (f) `conceal apps` Gold (diff=23) + `ghost apps` (pop=13) + `decoy app` (Gold) = 3 stems alternativos pra hide-intent cobertos sem usar a palavra. (g) `parental control` pop=41 + `app blocker` pop=50 = dois heads dormindo elevados. (h) `secret folder` pop=18 + composi\u00e7\u00e3o com `Secret` no name = indexa\u00e7\u00e3o dupla. (i) Char budget MAX: 30/30 name + 28/30 subtitle + 100/100 keywords.\n\n### \u26a0\ufe0f Riscos identificados \u2014 REVIS\u00c3O 2 (en-US v2)\n\n1. **\ud83d\udd34 PERDA GRANDE: `hide and lock` r=#2** \u2014 `Hide` saiu de name E subtitle. **Sem mitigation peso \u2265 3\u00d7 poss\u00edvel.** Cluster hide totalmente em peso 1\u00d7 via kw alternativos (invisible, conceal, ghost). Esperado: termo `hide and lock` cai >100.\n2. **\ud83d\udd34 PERDA: `hide apps` r=#43** \u2014 sem stem hide em campo de peso alto. Compensa\u00e7\u00e3o parcial: brand `Cloak` no name (Apple parece compor cloak\u2194hide). `Hidden apps` no kw (removida desta proposta \u2014 slot melhor pra `invisible apps`).\n3. **\ud83d\udd34 PERDA: `vault apps` r=#21** \u2014 `Apps` plural agora s\u00f3 em subtitle (peso 3\u00d7 vs 7\u00d7 do name antes). Esperado cair pra r=40-60.\n4. **\ud83d\udfe2 GANHO ESPERADO: `app lock` direto no name peso 7\u00d7** \u2014 antes composi\u00e7\u00e3o. Esperado top-30 pra `app lock` head.\n5. **\ud83d\udfe2 GANHO ESPERADO: `screen time control`** \u2014 via composi\u00e7\u00e3o subtitle `screen time` + kw `parental control` (que tem `control` token). Esperado top-50.\n6. **\ud83d\udfe2 GANHO ESPERADO: `invisible apps`** \u2014 j\u00e1 r=#7. Inclus\u00e3o expl\u00edcita consolida est\u00e1vel top-10.\n7. **\ud83d\udfe2 GANHO ESPERADO: `parental control` + `app blocker`** \u2014 heads dormindo pop=41/50. Esperado top-80 cada.\n8. **\ud83d\udfe2 GANHO ESPERADO: `secret vault`** \u2014 composi\u00e7\u00e3o name `Secret`+`Vault` adjacentes. NOVO. Esperado top-100 em 14d.\n9. **\u26a0\ufe0f Brand `Cloak` carrega muito peso** \u2014 se Apple algoritmo mudar a associa\u00e7\u00e3o `cloak \u2192 hide`, perde muito. Risco m\u00e9dio (algoritmos ASO Apple raramente mudam drasticamente).\n10. **\u26a0\ufe0f CR (conversion rate)** \u2014 name novo `Cloak: App Lock & Secret Vault` mais agressivo (vault, secret) \u2014 pode atrair usu\u00e1rios querendo photo vault. Trade-off com semantic clarity.\n11. **\u26a0\ufe0f Subtitle n\u00e3o-natural** \u2014 `Apps \u00b7 screen time + Face ID` l\u00ea como tagline de marketing, n\u00e3o frase. Apple aceita, mas pode parecer keyword stuffing pro reviewer. **Fallback**: `Lock apps + screen time control` (31 over) \u2192 `Lock apps screen time control` (29/30 sem separator).\n12. **Name + 2 campos mudando juntos** \u2014 m\u00e1xima quebra da regra \"1 vari\u00e1vel por iter\". Aceito por constraint dev. Per-keyword rank tracking via Astro permite attribution post-hoc.\n\n### Diff vs Revis\u00e3o 1 (mesma data, 2026-05-28)\n\n| Campo     | Revis\u00e3o 1 (tinha hide)               | Revis\u00e3o 2 (sem hide em nenhum lugar)        |\n| --------- | ------------------------------------ | -------------------------------------------- |\n| Name      | `Cloak: App Lock & Secret Vault`     | `Cloak: App Lock & Secret Vault` (igual)     |\n| Subtitle  | `Hide apps, screen time control` \u274c  | `Apps \u00b7 screen time + Face ID` \u2705            |\n| Keywords  | `parental control,app blocker,hidden apps,face id,decoy app,secret folder,passcode,fingerprint lock` | `invisible apps,parental control,app blocker,conceal apps,decoy app,secret folder,passcode,ghost apps` |\n| Hide stem | em subtitle (peso 3\u00d7) + `hidden apps` kw | **0\u00d7 em todos os campos** \u2014 substitu\u00eddo por brand momentum + invisible/conceal/ghost stems |\n\n---\n---\n\n# \ud83c\udf0e Resumo cross-locale (pt-BR + es-MX + en-US)\n\n## Tabela consolidada \u2014 proposed metadata por locale\n\n| Locale     | Name (UNCHANGED)                       | Subtitle (NEW)                  | Keywords (NEW)                                                                                       |\n| ---------- | -------------------------------------- | ------------------------------- | ---------------------------------------------------------------------------------------------------- |\n| **pt-BR**  | `App Lock: Esconder Aplicativos` (30)  | `Proteja apps com senha e cofre` (30) | `hide apps,bloqueio de app,controle parental,tempo de tela,disfarce,disfar\u00e7ar,vault,face id,parental` (99) |\n| **es-MX**  | `Cloak: Bloquear y Ocultar Apps` (30)  | `Bloquea apps con cofre Face ID` (30) | `control parental,contrase\u00f1a,bloquear tiktok,b\u00f3veda secreta,modo concentraci\u00f3n,huella,bloqueador` (95) |\n| **en-US**  | `Cloak: Hide & Lock Apps Vault` (29)   | `App lock \u00b7 screen time control` (30) | `parental control,app blocker,hide apps,face id,decoy app,secret folder,passcode,fingerprint lock` (96) |\n\n## Baselines downloads/dia (30d ASC Sales \u00b7 2026-04-27 \u2192 2026-05-26)\n\n| Locale | DL/dia (total) | DL/dia (Apple Ads paid) | DL/dia (organic baseline) |\n| ------ | -------------- | ----------------------- | ------------------------- |\n| BR     | 5.5            | 0.13                    | **5.4** (~98% organic)    |\n| MX     | 3.1            | 0                       | **3.1** (100% organic)    |\n| US     | 4.8            | 0                       | **4.8** (100% organic)    |\n\nApple Ads 30d: 7 paid installs / $3.95 USD spend \u2192 **insignificante**. Ganhos do iter-01 v\u00e3o ser quase 100% atribu\u00edveis ao ASO.\n\n## Padr\u00f5es cross-locale identificados\n\n| Padr\u00e3o                                                     | pt-BR                              | es-MX                              | en-US                            |\n| ---------------------------------------------------------- | ---------------------------------- | ---------------------------------- | -------------------------------- |\n| **Cluster `parental control` head dormindo**                | `controle parental` (pop=47)       | `control parental` (pop=58)        | `parental control` (pop=41)      |\n| **Stem `screen time` head dormindo**                        | `tempo de tela` (pop=27)           | `tiempo en pantalla` (pop=15)      | `screen time control` (pop=56)   |\n| **Block/Lock head bigram**                                  | `bloqueio de app` (pop=36)         | `bloquear aplicaciones` (pop=25)   | `app blocker` (pop=50)           |\n| **Feature de disguise/decoy subexplorada**                  | `disfarce` (Gold diff=13)          | `modo concentraci\u00f3n` (PURE diff=5) | `decoy app` (Gold diff=44)       |\n| **Hide stem composi\u00e7\u00e3o name\u00d7name**                          | `esconder aplicativo` r=#2         | `ocultar aplicaciones` r=#17       | `hide and lock` r=#2             |\n| **Subtitle anti-padr\u00e3o (noun-list)**                        | \"Bloqueio e prote\u00e7\u00e3o de apps\" \u274c  | \"Bloqueo de aplicaciones seguro\" \u274c | \"App lock and protect your apps\" \u274c (redundante) |\n\n**Insight:** os 3 markets compartilham os mesmos clusters dormindo (parental + screen time + block bigram). Sugere que a tese ASO \u00e9 universal pro nicho App Lock e que ganhos v\u00e3o correlacionar entre locales (n\u00e3o independentes).\n\n## Pr\u00f3ximos passos (N\u00c3O inclui deploy)\n\n1. \u2705 An\u00e1lise consolidada nesse `.md` (este documento)\n2. \u23f3 **N\u00c3O sincronizar com ASC** \u2014 user pediu s\u00f3 atualiza\u00e7\u00e3o do `.md`\n3. \u23f3 Iter-02 (futuro): description rewrite + promotional_text per locale\n4. \u23f3 Iter screenshots (paralelo): A/B test 3 treatments por locale ap\u00f3s texto deployar\n";</script><script src="https://cdn.jsdelivr.net/npm/marked/marke
