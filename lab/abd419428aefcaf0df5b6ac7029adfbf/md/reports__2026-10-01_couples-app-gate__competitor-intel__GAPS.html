/* ---------- camada de acabamento (01/10/2026) ----------
   Tipografia com duas vozes (display para títulos e números, texto para leitura),
   neutros com viés do azul da marca em vez de cinza puro, e profundidade por
   sombra em vez de só borda. Nada aqui renomeia classe: é uma camada por cima. */
:root{
  --f-disp:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --f-text:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --bg:#eef1f7; --card:#ffffff; --tx:#0a0d14; --mut:#4b5567; --acc:#2b3340;
  --bd:#cbd3e0; --bd-soft:#dfe5ee; --ok:#07804e; --down:#c42121; --warn:#9a4408;
  --sh:0 1px 2px rgba(16,19,26,.05),0 2px 8px rgba(16,19,26,.04);
  --sh-up:0 2px 6px rgba(16,19,26,.07),0 10px 24px rgba(16,19,26,.07);
  --cardup:#ffffff; --bdup:#b9c3d4;
  --boardtop:#e9edf5; --boardbot:#e3e8f1;
  --bar:#2563eb; --bar2:#60a5fa;
  --rad:14px;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#07090d; --card:#141922; --tx:#f7f9fc; --mut:#b2bdd0; --acc:#ccd6e6;
  --bd:#333c4c; --bd-soft:#232a36; --ok:#55e39d; --down:#ff8585; --warn:#ffbb55;
  --sh:0 1px 2px rgba(0,0,0,.4); --sh-up:0 6px 22px rgba(0,0,0,.5);
  --cardup:#1d2430; --bdup:#3d4859;
  --boardtop:#0d1218; --boardbot:#090d13;
  --bar:#5b9bff; --bar2:#9dc4ff;
}}
body{font-family:var(--f-text);font-size:14.5px;line-height:1.6;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1{font-family:var(--f-disp);font-size:27px;font-weight:800;letter-spacing:-.02em;
  text-wrap:balance;margin:0 0 2px}
h1 .mark{display:inline-block;width:28px;height:28px;vertical-align:-5px;margin-right:11px;
  background-size:contain;background-repeat:no-repeat;background-position:center}
h2{font-family:var(--f-disp);font-size:12px;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;color:var(--mut);border-top:1px solid var(--bd-soft);
  padding-top:22px;margin:32px 0 14px}
h3{font-family:var(--f-disp);letter-spacing:-.01em}
.sub{font-size:13px;color:var(--mut)}
code,.mono{font-family:var(--f-mono);font-size:12.5px}
.card,table.t,a.tile,.row,.fcard,#md{box-shadow:var(--sh);border-color:var(--bd-soft)}
.card,a.tile,.row,.fcard{border-radius:var(--rad)}
a.tile,.row{transition:box-shadow .16s ease,border-color .16s ease,transform .16s ease}
a.tile:hover,a.row:hover{box-shadow:var(--sh-up);border-color:var(--bd);
  transform:translateY(-1px)}
/* O card do app é área de leitura, não botão: nada muda no hover. A regra antiga
   trocava a sombra, e num card sem sombra isso aparecia como animação. */
.fcard,.fcard:hover{transition:none!important;transform:none!important}
/* big numbers: the first thing anyone reads on the page */
.tiles{gap:12px;margin:18px 0 4px}
a.tile{padding:13px 17px;min-width:148px}
.tile .tl{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
  color:var(--mut)}
.tile .tv{font-family:var(--f-disp);font-size:25px;font-weight:800;letter-spacing:-.025em;
  margin-top:3px}
.tile .ts{font-size:11.5px;color:var(--mut)}
.tile .tvd{font-family:var(--f-text);font-size:13px;font-weight:600;letter-spacing:0;white-space:nowrap}
/* tables read as data, not as prose */
table.t{border-radius:var(--rad);font-variant-numeric:tabular-nums}
table.t th{font-family:var(--f-disp);font-size:11px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;background:var(--bd-soft);border-bottom:1px solid var(--bd)}
table.t td{padding:9px 13px;border-bottom:1px solid var(--bd-soft)}
table.t tbody tr:hover td,table.t tr:hover td{background:rgba(125,140,170,.06)}
.twrap{border-radius:var(--rad)}
/* buttons */
.btn{font-family:var(--f-disp);font-weight:600;font-size:13.5px;padding:9px 18px;
  border-radius:999px;box-shadow:var(--sh);transition:all .16s ease}
.btn:hover{border-color:var(--acc);box-shadow:var(--sh-up);transform:translateY(-1px)}
.pill,.st{font-family:var(--f-disp);font-weight:600;font-size:11.5px;letter-spacing:.02em}
/* status colours carry meaning, so keep them out of the accent */
.st.run,.st.appr{background:rgba(10,143,88,.14);color:var(--ok)}
.st.crit{background:rgba(208,47,47,.14);color:var(--down)}
.st.rev,.st.draft{background:rgba(180,83,9,.14);color:var(--warn)}
/* the lanes strip and any scroller get a thin, rounded bar */
.hrow,.twrap,.tiles{scrollbar-width:thin;scrollbar-color:var(--bd) transparent}
.hrow::-webkit-scrollbar,.twrap::-webkit-scrollbar,.tiles::-webkit-scrollbar{height:9px}
.hrow::-webkit-scrollbar-track,
.twrap::-webkit-scrollbar-track,
.tiles::-webkit-scrollbar-track{background:transparent}
.hrow::-webkit-scrollbar-thumb,
.twrap::-webkit-scrollbar-thumb,
.tiles::-webkit-scrollbar-thumb{background:var(--bd);border-radius:999px;
  border:3px solid transparent;background-clip:content-box}
.hrow::-webkit-scrollbar-thumb:hover,
.twrap::-webkit-scrollbar-thumb:hover,
.tiles::-webkit-scrollbar-thumb:hover{background:var(--mut);background-clip:content-box}
.hrow{background:transparent;border:0;padding:0;border-radius:0}
.hcol{flex:0 0 clamp(280px,26vw,360px);min-width:0}
a:focus-visible,button:focus-visible,.btn:focus-visible{outline:2px solid var(--acc);
  outline-offset:2px;border-radius:8px}
.dirlist,.prlist{margin:10px 0 0;padding-left:18px;list-style:none}
.dirlist>li,.prlist>li{position:relative;margin:0 0 7px;font-size:13.5px;line-height:1.5;
  color:var(--tx)}
.prlist>li{color:var(--mut);font-size:13px;margin-bottom:5px}
.dirlist>li::before,.prlist>li::before{content:"";position:absolute;left:-14px;top:.62em;
  width:5px;height:5px;border-radius:50%;background:var(--acc);opacity:.75}
.prlist>li::before{background:var(--mut);opacity:.5}
.dirp{display:none}
.dapps{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));
  margin:14px 0 4px;align-items:start}
.dapp{padding:14px 16px}
.dah{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.dah b{font-family:var(--f-disp);font-size:14.5px;font-weight:700}
.drank{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;
  border-radius:6px;background:var(--acc);color:var(--card);font-size:11.5px;font-weight:700;flex:none}
.st.d-dobrar{background:rgba(10,143,88,.16);color:var(--ok)}
.st.d-consertar{background:rgba(180,83,9,.16);color:var(--warn)}
.st.d-manter{background:rgba(125,140,170,.16);color:var(--mut)}
.st.d-congelar{background:rgba(125,140,170,.12);color:var(--mut)}
.dapp .prlist{margin-top:6px}
.dcall{color:var(--tx)!important;font-weight:600}
.fcard[id]{scroll-margin-top:18px}
.fdet{margin-top:10px;border-top:1px solid var(--bd-soft);padding-top:9px}
.fdet>summary{cursor:pointer;list-style:none;font-family:var(--f-disp);font-size:11.5px;
  font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);
  display:flex;align-items:center;gap:7px}
.fdet>summary::-webkit-details-marker{display:none}
.fdet>summary::before{content:"›";font-size:15px;transition:transform .15s}
.fdet[open]>summary::before{transform:rotate(90deg)}
.fdet>summary:hover{color:var(--acc)}
.fdet table.t{font-size:12.5px}
.fdet table.t td,.fdet table.t th{padding:6px 10px}
.fgrid.one{grid-template-columns:1fr!important;gap:18px}
/* Cada app é um painel com profundidade: a luz entra por cima, o corpo escurece
   até a base e a borda clareia só na primeira linha. É o que separa um app do
   outro sem precisar de moldura dura. */
.fgrid.one>.fcard{position:relative;padding:0;overflow:hidden;border-radius:16px;
  border:1px solid var(--bd-soft);
  background:linear-gradient(180deg,
    color-mix(in srgb, var(--acc) 5%, var(--card)) 0%,
    var(--card) 26%,
    color-mix(in srgb, #000 7%, var(--card)) 100%);
  box-shadow:0 1px 2px rgba(0,0,0,.05), 0 10px 26px -14px rgba(0,0,0,.28)}
@media(prefers-color-scheme:dark){.fgrid.one>.fcard{
  background:linear-gradient(180deg,
    color-mix(in srgb, var(--acc) 9%, var(--card)) 0%,
    var(--card) 30%,
    #0a0c10 100%);
  box-shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 18px 40px -22px rgba(0,0,0,.9)}}
.fgrid.one>.fcard::before{content:"";position:absolute;inset:0 0 auto;height:1px;
  background:linear-gradient(90deg, transparent,
    color-mix(in srgb, var(--acc) 45%, transparent), transparent)}
.fgrid.one>.fcard>.fh{background:transparent;margin:0;padding:15px 18px 12px;
  border-bottom:1px solid var(--bd-soft)}
.fgrid.one>.fcard>.fstats{padding:12px 18px 0}
.fgrid.one>.fcard>.fcols{padding:16px 18px 6px}
.fgrid.one>.fcard>.fdet{margin:0;padding:13px 18px 16px;border-top:1px solid var(--bd-soft);
  background:color-mix(in srgb, #000 4%, transparent)}
@media(prefers-color-scheme:dark){.fgrid.one>.fcard>.fdet{
  background:rgba(0,0,0,.25)}}
.fgrid.one>.fcard>.fh b{font-size:16px;letter-spacing:-.01em}
.fgrid.one>.fcard>.fh>span{font-size:12.5px;color:var(--tx);opacity:.78;
  font-variant-numeric:tabular-nums;font-weight:500}
/* a luz no topo do painel, um pouco mais presente */
.fgrid.one>.fcard::before{height:2px;
  background:linear-gradient(90deg, transparent, var(--acc), transparent);opacity:.5}
.fcard .fmeta{font-size:12px;color:var(--mut)}
/* funil: rótulo legível, número com peso, barra com corpo */
.fs{display:grid;grid-template-columns:150px 1fr auto;align-items:center;gap:12px;
  padding:5px 0}
.fs .fl{font-size:12.5px;color:var(--tx)}
.fs .fn{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;min-width:74px;
  text-align:right}
.fb{height:9px;border-radius:999px;background:var(--bd-soft);overflow:hidden}
.fb i{display:block;height:100%;border-radius:999px}
/* retenção com leitura imediata */
.rrow{margin:0}
.rc:first-child{border-top:0;padding-top:0}
/* o rótulo é legenda; quem salta é o número, na cor da régua */
.rc b{display:block;font-family:var(--f-disp);font-size:10px;font-weight:700;
  letter-spacing:.09em;text-transform:uppercase;color:var(--mut);margin:0}
.rc .rv{display:block;font-family:var(--f-disp);font-size:21px;font-weight:800;
  letter-spacing:-.025em;line-height:1.15;margin:3px 0 2px;font-variant-numeric:tabular-nums}
.rc>b{font-family:var(--f-disp);font-size:12px;font-weight:700;letter-spacing:.04em;
  color:var(--mut)}
.rc .rv{font-family:var(--f-disp);font-size:19px;font-weight:800;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums}
.rc .rb{display:block;font-size:11.5px;color:var(--mut)}
/* achados: mais ar e marcador claro */
.fnds li{font-size:12.5px;line-height:1.5;padding:4px 0 4px 16px}
.fnds li:before{width:6px;height:6px;top:.72em}
/* o detalhe convida a abrir */
.fdet>summary{font-size:11px;color:var(--acc);padding:3px 0}
.fdet>summary:hover{opacity:.82}
.fcols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;
  align-items:start}
@media(max-width:820px){.fcols{grid-template-columns:1fr;gap:12px}}
.fcol{min-width:0}
.fcol>.fnds{margin-top:0}
/* Régua de contexto do app: instalações, ativos, novos, crash-free. Antes isso
   era uma linha de texto corrido ("187 downloads/30d · WATCH · crash-free
   100%") que ninguém comparava entre cards; como números rotulados, dá pra
   varrer a coluna de cima a baixo. */
.fstats{display:flex;flex-wrap:wrap;gap:10px 26px;align-items:baseline}
.fst{display:flex;align-items:baseline;gap:7px;min-width:0}
.fstl{font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:var(--mut)}
.fst b{font-family:var(--f-disp);font-size:15px;font-weight:700;letter-spacing:-.015em;
  font-variant-numeric:tabular-nums}
.fstd{font-size:12px;font-weight:600}
.st.vd{background:rgba(125,140,170,.14);color:var(--mut)}
.fh .noasc{font-size:11.5px;font-weight:400;color:var(--warn)}
/* Cada metade do card diz o que é antes de mostrar número. */
.fgrp{margin-bottom:16px}
.fgrp:last-child{margin-bottom:0}
.fgl{display:block;font-family:var(--f-disp);font-size:10.5px;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;color:var(--mut);
  padding-bottom:7px;margin-bottom:10px;border-bottom:1px solid var(--bd-soft)}
.fcol>.fgrp>.fnds{margin-top:0}
.instrl{list-style:none;margin:9px 0 0;padding:0}
.instrl li{font-size:12.5px;line-height:1.55;color:var(--mut);padding:3px 0 3px 14px;
  position:relative;overflow-wrap:anywhere}
/* Coluna de leitura: linhas rotuladas, sem caixa. As caixas coloridas (funil
   verde, ação amarela) e o bloco expansível empilhavam quatro objetos de forma
   diferente num espaço estreito; rótulo à esquerda e texto à direita, separados
   por uma régua fina, lê de cima a baixo sem nada competindo (João, 02/10). */
.rline{display:grid;grid-template-columns:116px minmax(0,1fr);gap:16px;
  padding:12px 0;border-top:1px solid var(--bd-soft)}
.rline:first-child{border-top:0;padding-top:0}
.rlab{font-family:var(--f-disp);font-size:10.5px;font-weight:700;letter-spacing:.07em;
  text-transform:uppercase;color:var(--mut);padding-top:2px}
.rbody{min-width:0}
.rbody>b{display:block;font-family:var(--f-disp);font-size:14px;font-weight:700;
  letter-spacing:-.01em;line-height:1.35}
.rnum{display:block;margin-top:3px;font-size:12px;font-weight:600;color:var(--tx);
  font-variant-numeric:tabular-nums}
.rbody>p{margin:5px 0 0;font-size:12.5px;line-height:1.55;color:var(--mut)}
.rline.act .rlab{color:var(--tx)}
.rline.mut .rlab,.rline.mut .instrl li{color:var(--mut)}
.rbody>.fnds{margin:0}
@media(max-width:1180px){.rline{grid-template-columns:1fr;gap:6px}
  .rline .rlab{padding-top:0}}
.instrl{list-style:none;margin:0;padding:0}
.instrl li{font-size:12.5px;line-height:1.55;color:var(--mut);padding:2px 0 2px 14px;
  position:relative;overflow-wrap:anywhere}
.instrl li::before{content:"";position:absolute;left:0;top:.72em;width:5px;height:5px;
  border-radius:50%;background:var(--bd)}
/* Os passos de loja vêm de outra fonte que os de dentro do app: barra em tom
   mais surdo pra o olho ver onde a medição troca de sistema. */
.fs .fb i.store{background:linear-gradient(90deg,
  color-mix(in srgb, var(--bar) 45%, transparent),
  color-mix(in srgb, var(--bar) 70%, transparent))}
.fsub{display:block;font-size:10.5px;font-weight:600;letter-spacing:.07em;
  text-transform:uppercase;color:var(--mut);margin-bottom:6px}
.fsub.gap2{margin-top:14px}
.lchip{font-size:10px;color:var(--mut);background:var(--bd-soft);border-radius:999px;
  padding:1px 7px;cursor:help;white-space:nowrap}
.fcols{position:relative}
@media(min-width:821px){.fcols::before{content:"";position:absolute;top:0;bottom:0;
  left:50%;width:1px;background:var(--bd-soft)}}
.fdet .ascgrid{grid-template-columns:repeat(auto-fit,minmax(118px,1fr))}
.fdetcols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;
  align-items:start}
@media(max-width:1100px){.fdetcols{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:760px){.fdetcols{grid-template-columns:1fr}}
.fdetcols>div{min-width:0;display:flex;flex-direction:column;gap:14px}
.rawbox{background:var(--bg);border:1px solid var(--bd-soft);border-radius:11px;
  padding:11px 13px;min-width:0}
.rawbox h4,.rawbox h3.team{margin:0 0 8px;font-family:var(--f-disp);font-size:10.5px;
  font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--mut)}
.rawbox h3.team .chain{text-transform:none;letter-spacing:0;font-size:11px}
.rawbox table.t{border:0;box-shadow:none;background:transparent}
.rawbox table.t th{background:transparent;border-bottom:1px solid var(--bd)}
.rawbox table.t td{border-bottom:1px solid var(--bd-soft)}
.rawbox .twrap{border-radius:0}
.rawbox .ascgrid{margin-bottom:0;grid-template-columns:repeat(auto-fit,minmax(104px,1fr))}
.rawbox .ascgrid b{font-size:14px}
.srct{float:right;font-size:9px;font-weight:700;letter-spacing:.06em;padding:2px 7px;
  border-radius:999px;background:var(--bd);color:var(--mut);text-transform:uppercase}
.s-asc{background:rgba(125,140,170,.16);color:var(--tx)}
.s-firebase{background:rgba(180,83,9,.14);color:var(--warn)}
.noasc{background:rgba(180,83,9,.14);color:var(--warn);border-radius:999px;padding:1px 8px;
  font-size:10.5px;font-weight:600}
.convwhy{display:block;font-size:10.5px;color:var(--mut);margin-top:1px}
.rawbox .rate{padding:1px 7px;border-radius:999px;font-size:12.5px}
.featname{display:block;font-family:var(--f-mono);font-size:11.5px;margin-bottom:3px}
.featbar{display:block;height:4px;border-radius:999px;background:var(--bd-soft);overflow:hidden}
.featbar i{display:block;height:100%;border-radius:999px;
  background:linear-gradient(90deg, color-mix(in srgb, var(--acc) 70%, transparent), var(--acc))}
.legacyp{margin:8px 0 0;font-size:12px;color:var(--mut);line-height:1.7}
.legacyp code{font-size:11px}
.rawbox .ascgrid>div{background:var(--card)}
.fdet{margin-top:14px;border-top:1px solid var(--bd);padding-top:12px}
.fdet[open]>summary{margin-bottom:12px;color:var(--acc)}
.t .thsub{font-size:9.5px;font-weight:600;letter-spacing:.03em;color:var(--mut);
  text-transform:none}
.t .rate{padding:1px 8px;border-radius:999px;font-variant-numeric:tabular-nums}
.t .rate.good{background:rgba(10,143,88,.16);color:var(--ok)}
.t .rate.mid{background:rgba(180,83,9,.14);color:var(--warn)}
.t .rate.low{background:rgba(208,47,47,.13);color:var(--down)}
.thin{font-size:10.5px;color:var(--mut);background:var(--bd-soft);border-radius:999px;
  padding:1px 7px;cursor:help;white-space:nowrap}
.sbx{font-size:12px;color:var(--warn);background:rgba(180,83,9,.12);border-radius:999px;
  padding:1px 8px;cursor:help;white-space:nowrap}
.sbxnote{font-size:11.5px;color:var(--warn);background:rgba(180,83,9,.10);
  border:1px solid rgba(180,83,9,.25);border-radius:9px;padding:7px 10px;margin:0 0 10px}
.actv{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 9px;margin:0 0 10px;
  padding:8px 11px;border-radius:10px;background:var(--bd-soft)}
.actvt{font-family:var(--f-disp);font-size:10px;font-weight:800;letter-spacing:.09em;
  text-transform:uppercase;color:var(--mut)}
.actv b{font-family:var(--f-disp);font-size:15px;font-variant-numeric:tabular-nums}
.actvw{flex-basis:100%;font-size:11px;color:var(--mut)}
.fover{font-size:10.5px;color:var(--warn);background:rgba(180,83,9,.12);border-radius:999px;
  padding:1px 7px;cursor:help;white-space:nowrap}
.hspan{display:inline-block;margin-left:10px;font-size:10.5px;font-weight:600;letter-spacing:.04em;
  text-transform:none;color:var(--mut);background:var(--bd-soft);padding:2px 9px;border-radius:999px;
  vertical-align:2px}
.ascspan{font-size:11px;color:var(--mut);margin:2px 0 7px}
.ascgrid{display:grid;gap:7px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
  margin-bottom:10px}
.ascgrid>div{background:var(--bd-soft);border-radius:9px;padding:7px 10px;min-width:0}
.ascgrid span{display:block;font-size:10px;color:var(--mut);text-transform:uppercase;
  letter-spacing:.04em}
.ascgrid b{font-family:var(--f-disp);font-size:15px;font-variant-numeric:tabular-nums}
.fcard[id]:target{border-color:var(--acc);box-shadow:0 0 0 2px rgba(125,140,170,.3),var(--sh-up)}
/* ---------- acabamento: luz e profundidade (01/10) ----------
   Gradiente é usado onde tem função: a luz no topo dá direção à página, a barra
   do funil ganha volume, e o cabeçalho de cada app se separa do conteúdo. Fundo
   chapado em tudo o resto, para os números seguirem sendo o que salta. */
body{background:
  radial-gradient(1100px 420px at 12% -8%, color-mix(in srgb, var(--acc) 11%, transparent), transparent 70%),
  radial-gradient(900px 360px at 88% -4%, color-mix(in srgb, var(--ok) 7%, transparent), transparent 72%),
  var(--bg);
  background-attachment:fixed}

h2{position:relative}
h2::after{content:"";position:absolute;left:0;top:0;width:44px;height:2px;
  background:linear-gradient(90deg, var(--acc), transparent)}
h2:first-of-type::after,h1+h2::after,.sub+h2::after{display:none}
a.tile{background:linear-gradient(170deg, color-mix(in srgb, var(--card) 100%, transparent),
  color-mix(in srgb, var(--acc) 5%, var(--card)))}
.fb i,.fs .fb i{background:linear-gradient(90deg,var(--bar),var(--bar2))}
.fgrid.one>.fcard>.fh{background:linear-gradient(180deg,
  color-mix(in srgb, var(--acc) 7%, var(--card)), var(--bd-soft))}
.ascgrid b,.tile .tv{background:linear-gradient(180deg, var(--tx), color-mix(in srgb, var(--tx) 72%, var(--mut)));
  -webkit-background-clip:text;background-clip:text;color:transparent}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
/* ---------- celular (14/10) ----------
   No iPhone a página nunca rola de lado: grade cede a largura pros filhos, tabela
   rola dentro do .twrap, o menu rola dentro da própria faixa. Quadro e big numbers
   seguem numa linha só com rolagem horizontal, em qualquer largura (João, 14/10). */
.cols>*,.cols2>*,.grid>*,.grid4>*,.dapps>*,.fgrid>*{min-width:0}
.board .hrow,.tiles{flex-wrap:nowrap!important;overflow-x:auto}
#md table{display:block;max-width:100%;overflow-x:auto}
#md p,#md li,#md :not(pre)>code{overflow-wrap:anywhere}
img,video{max-width:100%}
@media(max-width:860px){
  .topin{width:calc(100vw - 28px)}
}
@media(max-width:620px){
  /* header do celular (24/10): UMA linha de 52 px — cavalo + abas que rolam de
     lado com encaixe; a data sai do header fixo e vira a 1ª linha da página. */
  .topin{flex-wrap:nowrap;gap:2px;padding:4px 0;
    padding-left:env(safe-area-inset-left,0px)}
  a.brand{flex:none;min-width:44px;min-height:44px;justify-content:center;gap:0}
  a.brand .mark{width:24px;height:24px}
  a.brand .bname{display:none}
  .stamp{display:none}
  .navs{flex:1 1 auto;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;
    -webkit-overflow-scrolling:touch;scroll-snap-type:x proximity;overscroll-behavior-x:contain;
    margin-right:-14px;padding:0 max(14px,env(safe-area-inset-right,0px)) 0 2px;gap:2px;
    -webkit-ma[redigido]:linear-gradient(90deg,#000 calc(100% - 28px),transparent);
    ma[redigido]:linear-gradient(90deg,#000 calc(100% - 28px),transparent)}
  .navs::-webkit-scrollbar{display:none}
  a.nav{flex:none;scroll-snap-align:start;min-height:44px;padding:0 12px;gap:6px;font-size:14px}
  a.nav .flw-mon{width:24px;height:24px}
  .mstamp{display:block;margin:-10px 0 10px;font-size:11.5px;color:var(--mut)}
  .mstamp+style+h2,.mstamp+h2{margin-top:6px}
  div.own{padding:6px 12px;margin:0 0 12px;gap:10px}
  div.own img.flw-mon{width:40px;height:40px}
  details.pk-legend{padding:0 14px;margin-bottom:12px}
  details.pk-legend>summary{min-height:44px;padding:11px 0}
  body{font-size:15px;overflow-wrap:break-word}
  h1{font-size:24px}
  .sub,.card p,.row,.dirp,.prw,.nots li,.dirlist>li{font-size:14px}
  table.t td,table.t th{font-size:13.5px}
  table.t td:first-child,table.t th:first-child{min-width:148px}
  #md{padding:16px 14px}
  .board{padding:12px 0 14px;margin-left:0;margin-right:0}
  .boardh{padding:0 14px}
  .board .hrow{padding:12px 14px 12px;scroll-padding:0 14px}
  a.more,.btn{display:inline-flex;align-items:center;min-height:44px}
  .row{min-height:44px}
  .del{min-width:44px;min-height:44px;opacity:.7}
  .iid{position:relative}
  .iid::after{content:"";position:absolute;inset:-12px -8px}
  .fdet>summary,details>summary{min-height:44px}
  .fs{grid-template-columns:minmax(0,118px) minmax(0,1fr) auto}
  .leak,.fnote{margin-left:0}
  /* quadro no celular (25/10): João "o item em trabalho no quadro não tá responsivo no celular …
     dá uma repaginada pra ficar melhor de ver no celular" — no celular as colunas EMPILHAM (revoga a
     rolagem lateral de 14/10 só no celular): Fazer primeiro, com o item em trabalho no topo; Backlog por último. */
  .board .hrow{flex-direction:column!important;flex-wrap:nowrap!important;overflow-x:visible!important;gap:16px;padding:8px 14px 4px}
  .board .hcol{flex:none!important;min-width:0!important;width:100%}
  .board .hcol{order:3}.board .hcol.k-do{order:1}.board .hcol.k-wait{order:2}.board .hcol.k-backlog{order:4}
  .row.working .vwork{flex-wrap:wrap}
  .row .sub{white-space:normal}
  /* big numbers em grade de 2 no celular: nada cortado */
  .tiles{display:grid!important;grid-template-columns:1fr 1fr;overflow-x:visible!important}
  .tiles>.tile,a.tile{min-width:0!important;padding:10px 12px}
  .tile .tv{font-size:clamp(17px,5.4vw,22px)!important;white-space:normal}
}

html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}

/* dono da seção: legenda calma ao lado do título, não mais um segundo título em caixa alta */
h2 .ownb,h3 .ownb{text-transform:none;letter-spacing:0;font-family:var(--f-text);font-size:12.5px;font-weight:500;vertical-align:middle}

@media(max-width:620px){
  .mstamp{margin:-6px 0 12px}

  .tiles>div.tile{min-width:0;padding:10px 12px}

  h2{margin-top:28px}
}

der><div class="wrap"><div class=mstamp>atualizado 25/10 04:03</div><style>.dh{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px;margin:4px 0 18px}.dh-back{font:600 14px -apple-system,system-ui,sans-serif;padding:8px 16px;border-radius:999px;border:0;background:#111;color:#fff;cursor:pointer}.dh-mon{display:flex;align-items:center;gap:10px;padding:6px 14px 6px 6px;border:1px solid var(--bd);border-radius:14px;background:var(--card)}.dh-mon>div{display:flex;flex-direction:column}.dh-mon b{font-size:16px}.dh-mon span{font-size:12.5px;color:var(--mut);max-width:34ch}</style><div class=dh><button class=dh-back type=button onclick="history.back()">← voltar</button></div><p class="sub"><code>_GambitStudio/reports/2026-10-01_couples-app-gate/competitor-intel/GAPS.md</code></p><div id="md"><div class=mdpart data-i="0"></div></div><script>const RAWS=["# GAPS \u2014 controle de gastos para CASAIS (BR / ES / MX / US) \u2014 2026-10-01\n\nMaterial de gate. **N\u00e3o cont\u00e9m decis\u00e3o** \u2014 s\u00f3 o que o mercado mostra hoje.\nCompara\u00e7\u00e3o expl\u00edcita com o estudo do lab de 2026-06-21 (`Apps/intermediate/Controle-de-gastos/aso-pipeline/couples_niche_viability_2026-06-21.md`).\n\n**Fontes em disco (todas reexecut\u00e1veis):**\n- `us/ br/ es/` \u2014 meta.json + description.txt + \u00edcone + TODOS os prints de 48 apps (`scripts/aso/competitor_intel.py`)\n- `reviews/reviews.json` \u2014 4.657 avalia\u00e7\u00f5es cruas (RSS \"mostrecent\" da Apple, at\u00e9 500 por app/loja), 40 feeds\n- `reviews/THEMES.txt` \u2014 codifica\u00e7\u00e3o tem\u00e1tica com contagem + cita\u00e7\u00f5es (519 linhas)\n- `roster.csv` / `roster.json` \u2014 massa de avalia\u00e7\u00e3o por mercado, data de lan\u00e7amento e \u00faltima atualiza\u00e7\u00e3o de 65 apps\n- `tools/fetch_reviews.py`, `tools/themes.py`, `tools/roster.py` \u2014 pipeline usado\n\n> Gotcha salvo no `fetch_reviews.py`: a URL do RSS com `page=1` devolve feed VAZIO de forma intermitente. P\u00e1gina 1 tem que usar a forma sem `page=`. Sem isso o script conclui \"app sem avalia\u00e7\u00f5es\" num app com 28 mil.\n\n---\n\n## 1. DORES DAS REVIEWS (o item mais importante)\n\n### 1.1 Splitwise \u2014 a monetiza\u00e7\u00e3o virou a dor dominante, em 4 mercados\n\nAvalia\u00e7\u00f5es MAIS RECENTES (n\u00e3o o acumulado: o acumulado \u00e9 3,98\u2605 US / 4,71\u2605 BR):\n\n| Loja | Reviews lidas | 1-3\u2605 | % 1-3\u2605 | 1-3\u2605 sobre paywall/limite/ads | % das 1-3\u2605 |\n|---|---|---|---|---|---|\n| US | 400 | 232 | **58%** | 107 | 46% |\n| BR | 300 | 152 | **50%** | 104 | **68%** |\n| MX | 200 | 95 | 47% | 73 | **76%** |\n| ES | 200 | 83 | 41% | 61 | **73%** |\n\nTemas das 1-3\u2605 (contagem = reviews que mencionam; uma review pode entrar em v\u00e1rios):\n\n| Tema | US (232) | BR (152) | ES (83) | MX (95) |\n|---|---|---|---|---|\n| paywall/pre\u00e7o | **79** | 54 | **39** | **62** |\n| limite de lan\u00e7amentos/dia | **53** | **57** | 34 | 40 |\n| ads (pop de Pro) | 17 | 4 | 8 | 5 |\n| complexidade/confuso | 23 | 5 | 4 | 3 |\n| parceiro precisa de conta | 10 | 25 | 4 | 9 |\n| bank connect / pagamento | 19 / 22 | 1 | 1 | 1 |\n\nO mecanismo exato, reconstru\u00eddo das cita\u00e7\u00f5es: **free tier limitado a 3-5 lan\u00e7amentos por dia + an\u00fancio de 10s travando a tela ANTES de cada lan\u00e7amento**; o n\u00famero citado varia por safra (2, 3, 4, 5, 10) \u2014 \u00e9 A/B deles. Pre\u00e7o do Pro citado: **US$60/ano (US), 30\u20ac/ano (ES), ~MX$800/ano, US$5/m\u00eas**.\n\n- 1\u2605 US: *\"The free tier only allows you to enter 3 expenses each day. It also forces you to sit through an ad before entering each one. It's $60 per year for an app that does basic math.\"*\n- 1\u2605 BR: *\"Infelizmente colocaram um paywall no MEIO DO PROCESSO DE COLOCAR CONTAS. Bastante abusivo e quase um comportamento de ref\u00e9m de dados \u2014 depois que voc\u00ea j\u00e1 se cadastrou, chamou pessoas pra usar e come\u00e7ou a colocar contas BAM, toma paywall.\"*\n- 1\u2605 BR: *\"Agora s\u00f3 pode add 2 gastos por dia e vc j\u00e1 \u00e9 obrigado a pagar a vers\u00e3o PRO. Isso \u00e9 totalmente invi\u00e1vel! Desinstalando j\u00e1!\"*\n- 1\u2605 ES: *\"Ahora puedes meter 5 gastos al d\u00eda. O paga 30\u20ac al a\u00f1o\u2026 rid\u00edculo.\"*\n- 1\u2605 MX: *\"Make your model a one time purchase for $50usd and I'll gladly pay. No way I'm paying $5 a month.\"*\n- 3\u2605 US: *\"the free version getting nerfed and the ads for Pro coming in more heavy handed.\"*\n\n**O \u00eaxodo est\u00e1 escrito nas reviews, com destino nomeado:** *\"Changed to tricount to ridiculous policies in saving 3 expenses a day. Tricount also imports old Splitwise accounts\"* \u00b7 *\"Perfect substitute for Splitwise \u2014 as a Splitwise user for 10+ years, I recently switched to Tricount\"* \u00b7 *\"Era bom. Ficou limitado demais depois que veio a op\u00e7\u00e3o pro. Enfim, migrei para outro app\"* \u00b7 *\"USE A FREE ALTERNATIVE\"*. Quem recebe o \u00eaxodo \u00e9 **Tricount** (gr\u00e1tis ilimitado) e **Splid** \u2014 n\u00e3o um app de casal.\n\n### 1.2 Honeydue \u2014 o l\u00edder couples-specific est\u00e1 apodrecendo (73% das reviews recentes s\u00e3o 1-3\u2605)\n\n500 reviews mais recentes: **366 s\u00e3o 1-3\u2605**. O acumulado ainda marca 4,48\u2605 porque carrega 10 mil avalia\u00e7\u00f5es de 2017-2022.\n\n| Tema | reviews 1-3\u2605 (de 366) |\n|---|---|\n| bank connect (Plaid) quebrando | **149** |\n| suporte inexistente | **130** |\n| categorias/customiza\u00e7\u00e3o | 130 |\n| sync entre os dois celulares | 89 |\n| bug/transa\u00e7\u00e3o faltando | 76 |\n| parceiro/convite/2FA | 48 |\n| perda de dados | 9 |\n| **paywall/pre\u00e7o** | **7** (o app \u00e9 gr\u00e1tis) |\n\n- 1\u2605: *\"This app would be great if the connection to the bank didn't fail every few days. You constantly need to check if your accounts are synced.\"*\n- 1\u2605: *\"I really liked this app and used it all the time but it suddenly stopped being able to refresh my account a month ago. I tried emailing support twice and got no reply.\"*\n- 1\u2605: *\"Lost total data after invitation Accept \u2014 my husband invited me through the email link and he added all the expenses before I accept the invitation. Once I accept the invitation on my dashboard everything was zero zero. While on my husband's mobile it was showing the figures.\"*\n- 1\u2605: *\"Data deletes after 6 months \u2014 I cannot go back more than 6 months.\"*\n- 3\u2605: *\"Only 2 people allowed on account.\"*\n\nLeitura: Honeydue n\u00e3o morre por pre\u00e7o \u2014 morre por **depender de agregador banc\u00e1rio e n\u00e3o ter suporte**. \u00c9 a prova mais cara do nicho de que bank-connect \u00e9 passivo, n\u00e3o ativo, pra um dev solo.\n\n### 1.3 Tricount \u2014 gr\u00e1tis e l\u00edder, mas com uma dor estrutural: a conta errada\n\n29% (US) a 43% (ES) de 1-3\u2605 nas recentes, e o tema que mais machuca n\u00e3o \u00e9 pre\u00e7o:\n\n| Tema | US (51) | BR (61) | ES (130) |\n|---|---|---|---|\n| exportar/PDF/CSV removido | 1 | **14** | 7 |\n| **c\u00e1lculo/saldo errado** | **5** | **4** | 2 (+11 bug) |\n| parceiro/convite/divis\u00e3o por fam\u00edlia | 3 | 9 | **19** |\n| idioma removido (pt-BR) / moeda | 1 | **11** | 1 |\n| categorias (filtro removido no redesign) | 4 | 2 | 10 |\n\n- 3\u2605 US: *\"If two people take a trip and person A pays $100 and person B pays $50, the app says person B owes person A $50. That is not correct.\"*\n- 1\u2605 ES: *\"Si usas la app, pierdes dinero\u2026 hace c\u00e1lculos err\u00f3neos y al final acaba siendo de locos repartir el dinero.\"*\n- 1\u2605 BR: *\"A atualiza\u00e7\u00e3o do app s\u00f3 fez piorar! N\u00e3o tem mais como colocar em portugu\u00eas. N\u00e3o exporta mais PDF.\"*\n- 1\u2605 ES (sync): *\"Aparecen cantidades distintas en iOS y Android. El soporte t\u00e9cnico no hace caso. Llevamos as\u00ed 2 meses.\"*\n\n### 1.4 Tandem (couples-specific US, 743 ratings) \u2014 paywall na porta + abandono\n\n81 de 300 s\u00e3o 1-3\u2605; paywall=28, suporte/abandono=19, bugs=16.\n- 1\u2605: *\"The app has you make an account and takes you to a paywall you can't get passed. You can't even try it out without buying first?\"* (pre\u00e7o citado: **US$10-13/m\u00eas, at\u00e9 US$28/m\u00eas**)\n- 1\u2605: *\"Great app but seemed abandoned \u2014 the developer has decided to park this project\u2026 bugs not getting fixed, no support team at all.\"*\n- Nos 4-5\u2605 o pedido n\u00ba1 \u00e9 **pagamento integrado (41 men\u00e7\u00f5es)** e **divis\u00e3o proporcional \u00e0 renda (26)**.\n\n### 1.5 Junto$ (BR, 69 ratings \u2014 o \"l\u00edder\" couples do BR em junho) \u2014 morto\n\n\u00daltima atualiza\u00e7\u00e3o **2025-09-06** (13 meses). 20 de 44 reviews s\u00e3o 1-3\u2605.\n- 1\u2605: *\"P\u00d3S T\u00c9RMINO FREE APAGOU O HIST\u00d3RICO \u2014 vi que a avalia\u00e7\u00e3o gratuita iria acabar\u2026 a conta que havia criado para as despesas SUMIU.\"*\n- 1\u2605: *\"Eu e minha esposa baixamos o aplicativo e para utilizar precisa confirmar o cadastro. J\u00e1 vai fazer dois dias e nada do e-mail chegar.\"*\n- 1\u2605: *\"Horr\u00edvel mesmo pago. Paguei achei que seria mais r\u00e1pido na vers\u00e3o paga, mas n\u00e3o. Lento demais e toda hora trava.\"*\n\n### 1.6 O controle positivo: Splid\n\n**1% de 1-3\u2605 em 200 reviews US e 300 ES** \u2014 o melhor sentimento do nicho inteiro. Modelo: **sem cadastro**, funciona offline, grupo por link, pagamento \u00fanico opcional (~5\u20ac vital\u00edcio, citado em review ES). Pedido n\u00ba1 nos 4-5\u2605: convite/multi-pessoa (28 men\u00e7\u00f5es ES) e export (15-16).\n\n### 1.7 Pedidos recorrentes nas 4-5\u2605 (onde est\u00e1 o \"adoro mas falta X\")\n\n| Pedido | Onde aparece forte |\n|---|---|\n| **Exportar CSV/PDF/planilha** | Tricount US 20, MX 18/31, BR 19 \u00b7 Splitwise MX 31, BR 25 \u00b7 Splid US 16 |\n| **Convidar/entrar sem fric\u00e7\u00e3o, mais gente, por fam\u00edlia** | Tricount BR 21 / ES 20 \u00b7 Splitwise BR 37, MX 25, ES 19 \u00b7 Splid ES 28 |\n| **Divis\u00e3o proporcional \u00e0 renda / por partes** | Tandem 26 \u00b7 Halfway (posicionamento inteiro) \u00b7 Splitwise US 4 |\n| **Pagamento integrado (Venmo/Zelle/Pix/Bizum)** | Tandem 41 \u00b7 Splitwise US 22 (nas 1-3\u2605) \u00b7 BR: *\"Pouca utilidade sem PIX\"*, *\"poder colocar o pix de cada um\"* |\n| **Recorrente / parcelado** | Splitwise BR 9 (*\"compras parceladas\"*) \u00b7 Tandem 6 \u00b7 Settle Up (\u00e9 feature paga) |\n| **Despesa fixa + lembrete de vencimento** | ContasCasal, Our Expenses, Junto$ |\n\n---\n\n## 2. MASSA DE AVALIA\u00c7\u00c3O E TRAJET\u00d3RIA (dados completos em `roster.csv`)\n\n### 2.1 Teto do nicho por mercado\n\n| App | Tipo | Lan\u00e7ado | US | BR | ES | MX |\n|---|---|---|---|---|---|---|\n| Splitwise | split gen\u00e9rico | 2011 | 28.325 | 6.720 | 4.216 | 1.758 |\n| Tricount (by bunq) | split gen\u00e9rico | 2010 | 7.213 | 4.468 | **42.971** | 3.210 |\n| Settle Up | split gen\u00e9rico | 2013 | 1.740 | 612 | 10.668 | 309 |\n| Splid | split gen\u00e9rico | 2015 | 4.096 | 113 | 7.303 | 699 |\n| Split Pay (bills in two) | **fintech de aluguel** | 2023 | **17.984** | \u2014 | \u2014 | \u2014 |\n| **Honeydue** | **couples** | 2016 | **10.239** | \u2014 | \u2014 | \u2014 |\n| **Tandem** | **couples** | 2022 | **743** | \u2014 | \u2014 | \u2014 |\n| **Our Expenses** | couples/casa | 2016 | **488** | 13 | 6 | 21 |\n| Balance (Despesas do Casal) | couples | 2022 | 29 | 26 | 3 | 20 |\n| Manebo (Or\u00e7amento a Dois) | couples | 2021 | 14 | 10 | 3 | 8 |\n| Junto$ | couples | 2021 | 0 | 69 | 0 | 0 |\n\n**Nenhum app couples-specific lan\u00e7ado depois de 2022 passou de 30 avalia\u00e7\u00f5es em NENHUM dos 4 mercados.**\n\n### 2.2 BR \u2014 o que mudou desde junho/2026\n\n| App | Junho/2026 | Hoje | \u0394 | Estado |\n|---|---|---|---|---|\n| Junto$ | 3,7\u2605 / 68 | 3,71\u2605 / **69** | **+1 em 3,5 meses** | **abandonado** (sem update desde 2025-09-06) |\n| dividi | 5\u2605 / 10 | 4,94\u2605 / **18** | +8 | vivo, atualizado 2026-09-24 |\n| Balance \"Despesas do Casal\" | 13 | 4,42\u2605 / **26** | +13 | vivo |\n| **Coupe** | n\u00e3o existia | 4,78\u2605 / **19** | 19 em ~9 semanas | **o mais r\u00e1pido do BR** (lan\u00e7ou 2026-07-26) |\n| Os Nossos | \u2014 | 4,77\u2605 / 58 | \u2014 | vivo desde 2022 |\n| Pliit | \u2014 | 4,90\u2605 / 81 | \u2014 | vivo desde 2022 |\n| Rachou / Dvoi / duofi / Couple Finance / Pharos / ContasCasal / Mutual / Casal Financeiro / Continhas Casal | n\u00e3o existiam | 9 / 5 / 1 / 5 / 3 / 1 / 0 / 0 / 0 | \u2014 | **9 entrantes novos em 2026** |\n\nO pr\u00eamio de \"l\u00edder couples do BR\" \u00e9 de **69 avalia\u00e7\u00f5es, num app morto**. O melhor app vivo tem 26. O entrante mais r\u00e1pido de 2026 (Coupe) chegou a 19 em 2 meses \u2014 e o pr\u00f3prio print dele estampa o tamanho do neg\u00f3cio: *\"Junte-se a +400 Casais\"*.\n\n### 2.3 ES/MX \u2014 o gold rush de 2025-2026 **n\u00e3o produziu um \u00fanico sobrevivente com massa**\n\nTodos os nomes que o estudo de junho listou continuam na loja. Nenhum decolou:\n\n| App | Lan\u00e7ado | \u00daltimo update | ES | MX | US |\n|---|---|---|---|---|---|\n| ParejaPro | 2026-01-09 | 2026-06-27 | 0 | 1 | 0 |\n| DuoBalance | 2026-02-11 | **2026-03-10** | 3 | 0 | 0 |\n| WeZioo | 2026-04-11 | 2026-08-17 | 0 | \u2014 | \u2014 |\n| DuoDivvy | 2026-03-18 | **2026-03-18** (= dia do lan\u00e7amento) | 0 | 0 | 0 |\n| Inali | 2026-05-18 | 2026-07-01 | 0 | \u2014 | 0 |\n| famlyy | 2026-05-21 | 2026-08-19 | 0 | 0 | 0 |\n| Qita | 2026-01-29 | 2026-09-25 | 0 | 0 | 0 |\n| Couplesplit | 2026-03-10 | 2026-09-21 | 0 | 0 | 3 |\n| Wizpend | 2026-03-26 | 2026-08-10 | 0 | 0 | 0 |\n| Hearth | 2026-03-12 | 2026-08-22 | 0 | 0 | 6 |\n| Splits | 2026-01-13 | **2026-01-22** | 0 | 0 | 0 |\n| Lurio | 2026-03-22 | 2026-08-21 | 3 | 0 | 0 |\n| HomePot | 2026-04-15 | **2026-04-15** | 1 | 0 | 0 |\n| We Budget | 2026-05-15 | 2026-06-07 | 0 | 0 | 0 |\n\nE a **safra NOVA, lan\u00e7ada DEPOIS do estudo de junho** \u2014 ou seja, o gold rush acelerou em vez de esgotar:\nDUOVI (2026-07), Frudini (2026-07), Mutual (2026-07), Parejo (2026-07), Parejas en Balance (2026-07), Our Wallet (2026-09), dupla (2026-09), Soroka (2026-08), duofi (2026-08), Two Cents (2026-09). **Todos em 0 avalia\u00e7\u00f5es.**\n\n**Resposta direta \u00e0 pergunta do gate: ningu\u00e9m chegou a 500. Ningu\u00e9m chegou a 100. Ningu\u00e9m chegou a 10.** O recorde do gold rush ES/MX em 12+ meses \u00e9 **3 avalia\u00e7\u00f5es** (DuoBalance, Lurio). Tr\u00eas desses apps nunca receberam um segundo update \u2014 foram abandonados na semana do lan\u00e7amento.\n\nIsso \u00e9 o contr\u00e1rio do sinal \"nicho aquecido com demanda represada\": \u00e9 um nicho onde **a oferta cresce e a demanda n\u00e3o aparece**.\n\n### 2.4 O \u00fanico crescimento r\u00e1pido recente do espa\u00e7o n\u00e3o \u00e9 um app de controle de gastos\n\n**Split Pay: Split Bills in Two** \u2014 17.984 avalia\u00e7\u00f5es desde set/2023, 4,87\u2605. N\u00e3o \u00e9 tracker: \u00e9 **fintech**. D\u00e1 n\u00famero de conta e routing virtuais pra voc\u00ea dividir o aluguel, e cobra **US$9,99/m\u00eas + 1,5% do valor dividido**. **Split \u2013 Pay Together** (740 ratings) segue a mesma linha (taxa de servi\u00e7o de US$2,95 por pessoa citada em review). O que acumulou massa recentemente foi **movimentar dinheiro**, n\u00e3o registrar despesa.\n\n---\n\n## 3. MONETIZA\u00c7\u00c3O (refer\u00eancia \u2014 app GambitStudio nasce gr\u00e1tis ou com paywall soft)\n\n| App | Modelo | Pre\u00e7o | O que fica atr\u00e1s do gate |\n|---|---|---|---|\n| Splitwise | freemium agressivo + ads | US$60/ano \u00b7 30\u20ac/ano \u00b7 ~MX$800/ano \u00b7 US$5/m\u00eas | **o 4\u00ba-6\u00ba lan\u00e7amento do dia**, aus\u00eancia de ads, scan de recibo, convers\u00e3o de moeda, gr\u00e1ficos |\n| Tricount | **100% gr\u00e1tis, ilimitado** | \u2014 | nada (o premium antigo foi removido \u2014 e com ele o export CSV/PDF, o que gerou reclama\u00e7\u00e3o) |\n| Splid | **gr\u00e1tis, compra \u00fanica opcional** | ~5\u20ac vital\u00edcio | nada essencial |\n| Settle Up | freemium | assinatura | ads, despesas recorrentes/futuras, export CSV |\n| Honeydue | **gr\u00e1tis** | \u2014 | nada (hist\u00f3rico apagado ap\u00f3s 6 meses, que o usu\u00e1rio l\u00ea como gate) |\n| Tandem | **hard paywall na entrada** | US$10-13/m\u00eas (citam at\u00e9 US$28) | o app inteiro \u2014 n\u00e3o h\u00e1 o que testar sem pagar |\n| Our Expenses | freemium (assinatura) | \u2014 | pedido recorrente nas reviews: *\"I'd happily pay for a one time purchase\"* |\n| Halfway | free core generoso + Premium | \u2014 | sync banc\u00e1rio via Plaid, IA, sess\u00e3o com consultor |\n| Couplesplit (ES) | assinatura Pro mensal/anual | \u2014 | + indica\u00e7\u00e3o: casal que convida outro casal ganha 1 m\u00eas |\n| Coupe (BR) | trial 7 dias sem cart\u00e3o | assinatura | tudo; **uma assinatura vale para os dois** |\n| Monarch (refer\u00eancia gen\u00e9rica) | assinatura | US$99/ano \u00b7 US$15/m\u00eas | tudo |\n\nPadr\u00f5es: (a) os dois apps com melhor sentimento do nicho (Tricount 4,87\u2605, Splid 4,91\u2605) s\u00e3o **os que n\u00e3o cobram**; (b) o gate que o mercado odeia explicitamente \u00e9 **limitar o n\u00famero de lan\u00e7amentos**; (c) o gate natural que ningu\u00e9m explorou bem \u00e9 **\"uma assinatura cobre os dois\"** (s\u00f3 Coupe anuncia isso).\n\n---\n\n## 4. TABLE STAKES vs BRECHAS\n\n### 4.1 Table stakes \u2014 sem isso n\u00e3o entra (todos os 48 apps baixados t\u00eam)\n1. Lan\u00e7ar despesa com valor, data, categoria e quem pagou.\n2. Dividir 50/50 **e** por porcentagem/valor custom.\n3. Tela \"quem deve quanto\" com saldo l\u00edquido e bot\u00e3o de acertar.\n4. Sync em tempo real entre os dois celulares.\n5. Convite do parceiro por c\u00f3digo ou link.\n6. Despesa pessoal separada da compartilhada.\n7. Categorias com \u00edcone + resumo/gr\u00e1fico mensal.\n8. Multi-moeda (quem n\u00e3o tem leva 1\u2605 de viagem).\n9. Recorrentes/fixas (Settle Up cobra por isso; BR pede \"parcelado\").\n\n### 4.2 Brechas \u2014 o que ningu\u00e9m faz bem\n\n| Brecha | Evid\u00eancia |\n|---|---|\n| **C\u00e1lculo de saldo confi\u00e1vel, audit\u00e1vel** | Tricount leva 1\u2605 em 4 mercados por conta errada; *\"no te puedes fiar de los saldos\"*. O l\u00edder do nicho erra a aritm\u00e9tica, e ningu\u00e9m mostra \"por que esse saldo\". Hist\u00f3rico de altera\u00e7\u00e3o s\u00f3 o dividi (BR) tem. |\n| **Entrar sem conta / parceiro sem instalar** | S\u00f3 Splid e Spliit (grupo por link, sem cadastro) e Settle Up (link que abre no navegador) resolvem. **Nenhum app de CASAL faz isso** \u2014 todos exigem conta nos dois lados. |\n| **Export (CSV/PDF)** | Tricount REMOVEU, Settle Up cobra, Splitwise cobra. \u00c9 o pedido n\u00ba1 das 4-5\u2605 em 6 dos feeds lidos. Custo de implementa\u00e7\u00e3o: baixo. |\n| **Pagamento local (Pix no BR, Bizum no ES)** | *\"Pouca utilidade sem PIX\"*, *\"poder colocar o pix de cada um\"*. Ningu\u00e9m no BR integra \u2014 nem precisa integrar de verdade: copiar chave Pix + valor exato j\u00e1 resolve o atrito. |\n| **Divis\u00e3o proporcional \u00e0 renda como primeira classe** | Pedida 26\u00d7 nas 4-5\u2605 do Tandem; \u00e9 o posicionamento inteiro do Halfway e do Mutual \u2014 ambos com <15 avalia\u00e7\u00f5es. Desejada, ainda n\u00e3o entregue por ningu\u00e9m com massa. |\n| **Dado que n\u00e3o some** | Honeydue apaga depois de 6 meses; Junto$ apagou o hist\u00f3rico ao fim do trial; Tricount guarda 3 meses no modo free. \"Seus dados ficam\" \u00e9 diferencial real e barato. |\n| **Suporte que responde** | 130 das 366 reviews ruins do Honeydue e 19 das 81 do Tandem s\u00e3o sobre suporte mudo. Responder review j\u00e1 \u00e9 vantagem competitiva neste nicho. |\n| **Parceiro em plataformas diferentes** | *\"Honeydue is nice for couples who have different operating systems\"* \u00e9 citado como raz\u00e3o de escolha; Tandem leva 1\u2605 por n\u00e3o ter Android. **App iOS-only tem um teto estrutural aqui** \u2014 metade dos casais tem um Android. |\n\n---\n\n## 5. ONBOARDING DO PARCEIRO \u2014 estado da arte\n\nQuatro modelos no mercado, em ordem de fric\u00e7\u00e3o:\n\n1. **Sem conta, grupo \u00e9 um link** \u2014 *Spliit*: \"Create a group, add the people in it, and send the link. Everyone who opens it sees the same expenses \u2014 **no accounts, no invitations, and no waiting for the slowest person in the group**\". *Splid*: grupo offline + sync opcional, \"there's no sign-up required\". *Splital* (BR/MX, 100 mil usu\u00e1rios): \"SEM CONTA OBRIGAT\u00d3RIA \u2014 adicione as pessoas pelo nome e comece a dividir na hora; qualquer pessoa pode criar uma conta mais tarde\". **S\u00e3o exatamente os apps com melhor sentimento do nicho (Splid 1% de reviews ruins).**\n2. **Link/QR que abre no NAVEGADOR** \u2014 *Settle Up*: \"**No app required**: share a group link so friends can view the balance in their browser without downloading anything\" + convite por link ou QR. \u00c9 o melhor compromisso entre sync real e fric\u00e7\u00e3o zero do segundo usu\u00e1rio.\n3. **C\u00f3digo de convite com conta nos dois lados** \u2014 padr\u00e3o de **todos** os apps de casal: Dvoi (\"criem a conta em segundos \u2192 convidem o parceiro com um c\u00f3digo de convite\"), ContasCasal (\"convite por c\u00f3digo ou link no WhatsApp\"), Mutual, dividi (convite + permiss\u00f5es por papel), Coupe, ParejaPro, Couplesplit.\n4. **Conta obrigat\u00f3ria + paywall antes do valor** \u2014 *Tandem*: \"Download Tandem and create an account in minutes\" \u2192 paywall. Resultado nas reviews: *\"Waste of time\u2026 you can't even try it out without buying first\"*, e o fluxo de registro que trava nos dois lados (*\"They both showed we needed to complete registration on both ends, which was already done\"*).\n\nO custo do modelo 3/4 aparece medido: **Splitwise BR tem 25 reviews 1-3\u2605 e 37 reviews 4-5\u2605 falando de convite/cadastro** (*\"queria fazer uma simples divis\u00e3o, mas o app fica obrigando a criar conta pra cada uma das pessoas\"*, *\"Chato ter que convidar a pessoa pra colocar na conta\"*), e o caso mais caro \u00e9 Honeydue: aceitar o convite **zerou os dados** de quem convidou.\n\n**Ningu\u00e9m no segmento CASAL implementou o modelo 1 ou 2.** A fric\u00e7\u00e3o estrutural do nicho continua sem resposta \u2014 e as reviews mostram que ela \u00e9 decisiva: um app de casal s\u00f3 vale alguma coisa quando o SEGUNDO usu\u00e1rio entra, e metade da convers\u00e3o morre a\u00ed.\n\n---\n\n## 6. PADR\u00d5ES VISUAIS DOS PRINTS (slot 1)\n\n| App | Fundo | Headline | Mockup | Pessoas |\n|---|---|---|---|---|\n| Splitwise | cinza-ard\u00f3sia low-poly | \"Track balances\" branca + subheadline 2 linhas | reto, centralizado | n\u00e3o (avatares min\u00fasculos na lista) |\n| Honeydue | **vermelho s\u00f3lido** | \"Outsmart money, together.\" + selo *New Apps We Love* da Apple | reto, branco | **2 avatares reais** (ela/ele) no topo da tela |\n| Tricount | **azul cobalto s\u00f3lido** | s\u00f3 o wordmark \"tricount by bunq\" (sem headline) | **inclinado 3D**, sangrando pela direita | iniciais em c\u00edrculo (A/J/P) |\n| Tandem | **verde-petr\u00f3leo escuro** | serifada \"The essential app for living **together**.\" (palavra-chave em menta + sublinhado) + logos de imprensa | inclinado | **foto do casal** dentro do app |\n| Halfway | **creme + marrom** | serifada \"Love Is 50/50. **Bills Aren't.**\" | reto | 2 avatares com renda de cada um e barra 58%/42% |\n| Coupe (BR) | **foto de casal real no topo + bloco azul-marinho embaixo** | sans bold 3 linhas \"Organizem e planejem as finan\u00e7as em casal\" + 2 selos de louro | sem mockup no slot 1 | **foto grande de casal** |\n| dividi (BR) | **gradiente magenta\u2192violeta** | \"Contas compartilhadas sem complica\u00e7\u00e3o.\" + subheadline | reto | mascote (Divi) |\n| ParejaPro (ES) | creme + app verde-escuro | wordmark + ilustra\u00e7\u00e3o flat de casal | reto | ilustra\u00e7\u00e3o |\n\nPadr\u00f5es que se repetem:\n- **Fundo em cor s\u00f3lida de marca** com headline branca/escura no topo e mockup embaixo \u2014 \u00e9 o mesmo esqueleto do padr\u00e3o can\u00f4nico do lab.\n- **Duas pessoas sempre vis\u00edveis** \u2014 foto real (Tandem, Coupe), avatar (Honeydue, Halfway) ou iniciais (Tricount). O slot 1 de app de casal vende \"n\u00f3s dois\", n\u00e3o a planilha.\n- **Palavra \"together/juntos/em casal\" na headline** em 5 dos 8.\n- **Prova social quando existe**: selo da Apple (Honeydue), logos de imprensa (Tandem), laurel inventado (Coupe: \"O #1 Finan\u00e7as para casais\" / \"+400 Casais\").\n- **Paleta**: couples-specific puxa **quente/\u00edntimo** (vermelho, creme/marrom, petr\u00f3leo, marinho, magenta); split de grupo puxa **azul/cinza frio** (Tricount, Splitwise). N\u00e3o existe uma cor dominante do nicho \u2014 existe uma **temperatura**.\n- **Headline em serifada** \u00e9 marca dos entrantes premium de 2025-2026 (Tandem, Halfway) e destaca contra a sans dos gen\u00e9ricos.\n\n---\n\n## 7. O QUE MUDOU DESDE 21/06/2026 (diff do gate)\n\n| Sinal de junho | Hoje (01/10/2026) | Dire\u00e7\u00e3o |\n|---|---|---|\n| Termos couples = pop 5 (piso) em BR/ES | n\u00e3o remedido \u2014 nenhuma evid\u00eancia de volume novo; as SERPs couples continuam povoadas por apps de 0 avalia\u00e7\u00e3o | **igual** |\n| ES em gold rush, 15-19 apps com 0-3 ratings | **o gold rush dobrou** (+10 entrantes depois de junho) e o recorde do grupo continua sendo **3 avalia\u00e7\u00f5es** | **pior** |\n| Junto$ 3,7\u2605/68 era o \"l\u00edder\" couples BR | **abandonado** (sem update h\u00e1 13 meses), +1 avalia\u00e7\u00e3o em 3,5 meses | **pior pro incumbente, n\u00e3o melhor pro entrante** |\n| Splitwise monetizando agressivo | confirmado e medido: **46-76% das reviews ruins s\u00e3o sobre o paywall/limite**, em 4 mercados, com \u00eaxodo nomeado | **nova muni\u00e7\u00e3o de produto** |\n| Honeydue 10k, l\u00edder couples US | **73% das reviews recentes s\u00e3o 1-3\u2605**; bank-connect e suporte quebrados | **nova muni\u00e7\u00e3o de produto** |\n| \"Dividir extrato entre devices\" n\u00e3o \u00e9 diferencial t\u00e9cnico | confirmado \u2014 \u00e9 table stake, e bank-connect \u00e9 a causa n\u00ba1 de \u00f3dio no Honeydue | **igual** |\n\nResumo honesto do diff: **a dor de produto ficou claramente maior e mais documentada; a demanda de busca n\u00e3o deu nenhum sinal de ter crescido.** S\u00e3o dois eixos diferentes, e eles apontam para lados diferentes \u2014 o nicho tem wedge de produto cada vez mais n\u00edtido e continua sem oxig\u00eanio de aquisi\u00e7\u00e3o org\u00e2nica. Quem entrar depende de canal (paid, boca a boca, conte\u00fado), n\u00e3o de ASO.\n\n---\n\n## 8. RISCOS E ARMADILHAS DE LEITURA\n\n1. **Review RSS \u00e9 amostra recente, n\u00e3o o acumulado.** \"73% ruim no Honeydue\" \u00e9 dos 500 mais recentes; a nota da loja continua 4,48\u2605. N\u00e3o trocar um pelo outro.\n2. **Contagem tem\u00e1tica \u2260 reviews exclusivas** \u2014 uma review entra em v\u00e1rios temas; os percentuais de uni\u00e3o est\u00e3o na tabela 1.1 e foram calculados separadamente.\n3. **Rating 0 n\u00e3o prova 0 downloads.** Prova aus\u00eancia de massa de avalia\u00e7\u00e3o, que \u00e9 o gargalo que o lab j\u00e1 conhece (regra rating-first <25). Para o gate, \u00e9 o n\u00famero certo a olhar.\n4. **O iOS-only tem teto neste nicho espec\u00edfico**: o parceiro com Android n\u00e3o entra, e isso aparece citado como crit\u00e9rio de escolha de app nas reviews.\n5. **Split Pay (17.984 ratings) n\u00e3o \u00e9 contra-exemplo de que \"d\u00e1 pra crescer\"** \u2014 \u00e9 fintech regulada com taxa transacional, modelo fora do lab.\n"];</script><script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script><script>document.querySelectorAll("#md .mdpart").forEach(function(el){var R=RAWS[+el.dataset.i]||"";el.innerHTML=window.mar
