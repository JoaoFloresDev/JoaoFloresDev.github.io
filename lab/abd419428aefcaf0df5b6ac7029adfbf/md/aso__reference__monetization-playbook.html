<title>monetization-playbook.md</title>

<style>
:root{--bg:#f4f5f8;--card:#fff;--tx:#0e1015;--mut:#4a5160;--acc:#0b53d6;--ok:#0d9668;--down:#c22;--bd:#c9cfda;--hl:#fff7e0}
@media(prefers-color-scheme:dark){:root{--bg:#0e1013;--card:#1a1e25;--tx:#f2f4f8;--mut:#aab3c2;--acc:#6ea3ff;--bd:#39404d;--hl:#2a2717}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.55 -apple-system,system-ui,sans-serif}
.wrap{width:min(1680px,94vw);margin:0 auto;padding:28px 0 80px}@media(max-width:860px){.wrap{width:calc(100vw - 28px)}}.ico{width:20px;height:20px;border-radius:5px;vertical-align:-5px;margin-right:7px;background:var(--bd);object-fit:cover}.ico.big{width:30px;height:30px;border-radius:7px;vertical-align:-9px}h2{border-top:1px solid var(--bd);padding-top:20px;margin-top:30px}section,.twrap{min-width:0}h2:first-of-type{border-top:0;padding-top:0}h1+h2,.sub+h2{border-top:0;padding-top:0}
h1{font-size:22px;margin:0 0 4px}h2{font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:34px 0 12px}
.sub{color:var(--mut);margin:0 0 8px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px 16px}
.card b{font-size:14.5px}.card p{margin:5px 0 0;color:var(--mut);font-size:13.5px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px}
.up{background:var(--ok)}.dn{background:var(--down)}
a{color:var(--acc);text-decoration:none}a:hover{text-decoration:underline}
code{background:rgba(125,125,125,.13);padding:1px 6px;border-radius:5px;font-size:12.5px}
.pill{display:inline-block;background:rgba(125,125,125,.12);border-radius:99px;padding:1px 10px;margin:2px 3px 2px 0;font-size:12.5px}
table.t{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--bd);border-radius:12px;overflow:hidden}
table.t td,table.t th{padding:7px 12px;border-bottom:1px solid var(--bd);font-size:13.5px;text-align:left;vertical-align:top}
table.t th{color:var(--mut);font-weight:600}table.t tr:last-child td{border-bottom:0}
.twrap{overflow-x:auto;border-radius:12px}
.imgs{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.imgs img{width:100%;border-radius:8px;border:1px solid var(--bd)}
#md{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:22px 26px}
#md pre{overflow-x:auto;background:rgba(125,125,125,.1);padding:10px;border-radius:8px}
#md table{border-collapse:collapse}#md td,#md th{border:1px solid var(--bd);padding:4px 9px;font-size:13.5px}
#md img{max-width:100%}
.hcol .row{flex-direction:column;align-items:flex-start;gap:4px}.hcol .row b{white-space:normal}.hcol .row span{width:100%}.hcol .row em{display:none}.hcol .row.done b{font-size:12px}.hrow{display:flex;gap:20px;overflow-x:auto;align-items:flex-start;padding:16px 28px 12px;margin:18px 0 26px;background:rgba(125,125,125,.07);border:1px solid var(--bd);border-radius:16px;scroll-padding:0 28px}.hcol{flex:0 0 340px;min-width:340px}.hcol:last-child{margin-right:28px}.hcol h2{margin-top:0}.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:0 20px}.cols2{display:grid;grid-template-columns:1fr 1fr;gap:0 20px;align-items:start}@media(max-width:900px){.cols2{grid-template-columns:1fr}}h3.team{margin:18px 0 8px;font-size:15px;font-weight:600}h3.team .chain{display:block;color:var(--mut);font-weight:400;font-size:12.5px;margin-top:2px}.card .step{display:inline-block;min-width:18px;height:18px;line-height:18px;text-align:center;border-radius:9px;background:var(--bd);color:var(--mut);font-size:11px;font-weight:600;margin-right:6px}.grid4{display:grid;gap:12px;grid-template-columns:repeat(4,1fr)}@media(max-width:1100px){.grid4{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.grid4{grid-template-columns:1fr}}
.rows{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;color:var(--tx);font-size:14.5px}
a.row:hover{border-color:var(--acc);text-decoration:none}
.row b{white-space:nowrap}.row span{flex:1;color:var(--mut)}.row em{color:var(--mut);font-style:normal;font-size:18px}
.row.done b{color:var(--mut);font-weight:500;font-size:12.5px}.row.done span b{color:var(--tx)}.row.done span{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;line-height:1.35}
.hdr{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:6px}
.hdr h1{margin:0}.hdr .sub{margin:2px 0 0}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 22px;font-size:14.5px;color:var(--acc)}
.btn:hover{border-color:var(--acc);text-decoration:none}
.tiles{display:flex;gap:10px;flex-wrap:nowrap;overflow-x:auto;margin:14px 0 6px;padding-bottom:4px}
a.tile{display:block;flex:0 0 auto;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 14px;color:var(--tx);min-width:128px}
a.tile:hover{border-color:var(--acc);text-decoration:none}
.tile .tl{font-size:12px;color:var(--mut);white-space:nowrap}
.tile .tv{font-size:21px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px;white-space:nowrap}
.tile .ts{font-size:11.5px;color:var(--mut);margin-top:1px;white-space:nowrap}
.tv.up{color:var(--ok);background:none}.tv.dn{color:var(--down);background:none}
.vd{font-size:15px;font-weight:700;margin-right:10px;white-space:nowrap}
.vd.s{color:var(--ok)}.vd.w{color:#c9930a}.vd.k{color:var(--down)}
.shots{display:flex;gap:8px;overflow-x:auto;padding:4px 0}
.shots img{height:210px;border-radius:10px;border:1px solid var(--bd);flex:0 0 auto}
.gallery img{height:460px;max-height:72vh}
.st{display:inline-block;border-radius:99px;padding:1px 10px;font-size:12px;font-weight:600;margin-left:8px;white-space:nowrap;vertical-align:1px}
.st.run{background:rgba(13,150,104,.16);color:var(--ok)}
.st.appr{background:rgba(201,147,10,.16);color:#c9930a}
.st.rev{background:rgba(11,83,214,.13);color:var(--acc)}
.st.draft{background:rgba(139,92,246,.15);color:#8b5cf6}
.st.mut{background:rgba(125,125,125,.16);color:var(--mut)}
.st.crit{background:rgba(200,34,34,.15);color:var(--down)}
.rowwrap{position:relative}
.rowwrap .row{padding-right:38px}
.delf{position:absolute;top:0;right:0;bottom:0;display:flex;align-items:center;margin:0}
.del{background:none;border:none;color:var(--mut);font-size:17px;line-height:1;padding:6px 12px;cursor:pointer;border-radius:8px;opacity:.45}
.rowwrap:hover .del{opacity:1}
.del:hover{color:var(--down);background:rgba(200,34,34,.08)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(430px,1fr));gap:12px;margin-top:12px}
@media(max-width:520px){.fgrid{grid-template-columns:1fr}}
.fcard{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:13px 15px}
.fcard .fh{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:8px}
.fcard .fh b{font-size:14.5px}.fcard .fh span{font-size:12.5px;color:var(--mut);white-space:nowrap}
.fs{display:flex;align-items:center;gap:8px;margin:3px 0;font-size:13px}
.fs .fl{flex:0 0 168px;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fs .fb{flex:1;height:13px}
.fs .fb i{display:block;height:100%;background:var(--acc);border-radius:3px;min-width:2px}
.fs .fb i.alt{background:var(--ok)}.fs .fb i.ga{background:#8b5cf6}
.fs .fn{flex:0 0 auto;font-variant-numeric:tabular-nums;font-size:12.5px}
.fs.tot .fl,.fs.tot .fn{font-weight:700}
.leak{margin:0 0 5px 176px;font-size:12px;color:var(--down)}
.leak b{font-variant-numeric:tabular-nums}
.fdiv{margin:9px 0 3px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}
.fmeta{font-size:12.5px;color:var(--mut);margin:-3px 0 9px}
.rrow{display:flex;gap:8px;margin:10px 0 4px}
.rc{flex:1;background:rgba(125,125,125,.09);border-radius:9px;padding:6px 9px}
.rc b{display:block;font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.rc .rv{display:block;font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.25}
.rc .rb{display:block;font-size:11px;color:var(--mut)}
.fnds{list-style:none;margin:10px 0 0;padding:0}
.fnds li{position:relative;padding:2px 0 2px 16px;font-size:13px;color:var(--tx)}
.fnds li:before{content:"";position:absolute;left:0;top:9px;width:7px;height:7px;border-radius:50%}
.fnds li.crit:before{background:var(--down)}.fnds li.warn:before{background:#c9930a}.fnds li.ok:before{background:var(--ok)}
.nxt{margin-top:11px;background:var(--hl);border:1px solid var(--bd);border-radius:10px;padding:9px 12px}
.nxt .nxl{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
.nxt b{font-size:14px}.nxt p{margin:3px 0 0;font-size:13px;color:var(--mut)}
.fh .st{margin-left:8px}
.dirbox{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:20px 24px;margin:20px 0 8px}
.dirlab{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--mut)}
.dirh{font-size:19px;line-height:1.35;margin:4px 0 12px;text-transform:none;letter-spacing:0;color:var(--tx)}
.dirp{margin:0 0 9px;font-size:14px;line-height:1.6;color:var(--tx)}
.prio{display:flex;gap:13px;padding:11px 0;border-top:1px solid var(--bd)}
.prn{flex:0 0 26px;height:26px;line-height:26px;text-align:center;border-radius:13px;background:var(--acc);color:#fff;font-weight:700;font-size:13px}
.prc{flex:1;min-width:0}
.prt{font-size:15px;font-weight:600;margin-bottom:3px}
.prw{margin:0 0 5px;font-size:13.5px;color:var(--tx)}
.pre{margin:0 0 4px;font-size:13px;color:var(--mut);line-height:1.55}
.pre b{color:var(--tx);font-weight:600}
.prp{margin:4px 0 0;font-size:13px;color:var(--tx);border-left:2px solid var(--acc);padding-left:9px}
.vgrid{display:flex;flex-direction:column;gap:6px}
.vrow{display:flex;align-items:baseline;gap:9px;font-size:13.5px;flex-wrap:wrap}
.vrow .st{flex:0 0 auto;margin:0}
.vrow b{flex:0 0 auto;min-width:118px}
.vrow span:last-child{flex:1;min-width:220px;color:var(--mut)}
.nots{margin:0;padding-left:18px}
.nots li{font-size:13.5px;color:var(--tx);margin-bottom:5px;line-height:1.55}
.dirfoot{margin:16px 0 0;padding-top:12px;border-top:1px solid var(--bd);font-size:12px;color:var(--mut)}
@media(max-width:700px){.vrow b{min-width:0}}
.fnote{font-size:11.5px;color:var(--mut);margin:4px 0 0 176px;line-height:1.35}

/* ---------- camada de acabamento (01/10/2026) ----------
   Tipografia com duas vozes (display para títulos e números, texto para leitura),
   neutros com viés do azul da marca em vez de cinza puro, e profundidade por
   sombra em vez de só borda. Nada aqui renomeia classe: é uma camada por cima. */
:root{
  --f-disp:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --f-text:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --bg:#f3f5f9; --card:#ffffff; --tx:#10131a; --mut:#5a6377; --acc:#1552d8;
  --bd:#dde2ea; --bd-soft:#e8ecf3; --ok:#0a8f58; --down:#d02f2f; --warn:#b45309;
  --sh:0 1px 2px rgba(16,19,26,.05),0 2px 8px rgba(16,19,26,.04);
  --sh-up:0 2px 6px rgba(16,19,26,.07),0 10px 24px rgba(16,19,26,.07);
  --rad:14px;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#0b0d12; --card:#161a22; --tx:#eef1f7; --mut:#9aa5b8; --acc:#7aa6ff;
  --bd:#272d39; --bd-soft:#1f242e; --ok:#43d08d; --down:#ff7070; --warn:#e5a645;
  --sh:0 1px 2px rgba(0,0,0,.4); --sh-up:0 6px 22px rgba(0,0,0,.5);
}}
body{font-family:var(--f-text);font-size:14.5px;line-height:1.6;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1{font-family:var(--f-disp);font-size:27px;font-weight:800;letter-spacing:-.02em;
  text-wrap:balance;margin:0 0 2px}
h1 .mark{display:inline-block;width:28px;height:28px;vertical-align:-5px;margin-right:11px;
  background-size:contain;background-repeat:no-repeat;background-position:center}
h2{font-family:var(--f-disp);font-size:12px;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;color:var(--mut);border-top:1px solid var(--bd-soft);
  padding-top:22px;margin:32px 0 14px}
h3{font-family:var(--f-disp);letter-spacing:-.01em}
.sub{font-size:13px;color:var(--mut)}
code,.mono{font-family:var(--f-mono);font-size:12.5px}
.card,table.t,a.tile,.row,.fcard,#md{box-shadow:var(--sh);border-color:var(--bd-soft)}
.card,a.tile,.row,.fcard{border-radius:var(--rad);
  transition:box-shadow .16s ease,border-color .16s ease,transform .16s ease}
a.tile:hover,a.row:hover,.fcard:hover{box-shadow:var(--sh-up);border-color:var(--bd);
  transform:translateY(-1px)}
/* big numbers: the first thing anyone reads on the page */
.tiles{gap:12px;margin:18px 0 4px;padding-bottom:10px}
a.tile{padding:13px 17px;min-width:148px}
.tile .tl{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
  color:var(--mut)}
.tile .tv{font-family:var(--f-disp);font-size:25px;font-weight:800;letter-spacing:-.025em;
  margin-top:3px}
.tile .ts{font-size:11.5px;color:var(--mut)}
/* tables read as data, not as prose */
table.t{border-radius:var(--rad);font-variant-numeric:tabular-nums}
table.t th{font-family:var(--f-disp);font-size:11px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;background:var(--bd-soft);border-bottom:1px solid var(--bd)}
table.t td{padding:9px 13px;border-bottom:1px solid var(--bd-soft)}
table.t tbody tr:hover td,table.t tr:hover td{background:rgba(125,140,170,.06)}
.twrap{border-radius:var(--rad)}
/* buttons */
.btn{font-family:var(--f-disp);font-weight:600;font-size:13.5px;padding:9px 18px;
  border-radius:999px;box-shadow:var(--sh);transition:all .16s ease}
.btn:hover{border-color:var(--acc);box-shadow:var(--sh-up);transform:translateY(-1px)}
.pill,.st{font-family:var(--f-disp);font-weight:600;font-size:11.5px;letter-spacing:.02em}
/* status colours carry meaning, so keep them out of the accent */
.st.run,.st.appr{background:rgba(10,143,88,.14);color:var(--ok)}
.st.crit{background:rgba(208,47,47,.14);color:var(--down)}
.st.rev,.st.draft{background:rgba(180,83,9,.14);color:var(--warn)}
/* the lanes strip and any scroller get a thin, rounded bar */
.tiles,.hrow,.twrap{scrollbar-width:thin;scrollbar-color:var(--bd) transparent}
.tiles::-webkit-scrollbar,.hrow::-webkit-scrollbar,.twrap::-webkit-scrollbar{height:9px}
.tiles::-webkit-scrollbar-track,.hrow::-webkit-scrollbar-track,
.twrap::-webkit-scrollbar-track{background:transparent}
.tiles::-webkit-scrollbar-thumb,.hrow::-webkit-scrollbar-thumb,
.twrap::-webkit-scrollbar-thumb{background:var(--bd);border-radius:999px;
  border:3px solid transparent;background-clip:content-box}
.tiles::-webkit-scrollbar-thumb:hover,.hrow::-webkit-scrollbar-thumb:hover,
.twrap::-webkit-scrollbar-thumb:hover{background:var(--mut);background-clip:content-box}
.hrow{background:transparent;border:0;padding:0;border-radius:0}
.hcol{flex:0 0 clamp(280px,26vw,360px);min-width:0}
a:focus-visible,button:focus-visible,.btn:focus-visible{outline:2px solid var(--acc);
  outline-offset:2px;border-radius:8px}
.dirlist,.prlist{margin:10px 0 0;padding-left:18px;list-style:none}
.dirlist>li,.prlist>li{position:relative;margin:0 0 7px;font-size:13.5px;line-height:1.5;
  color:var(--tx)}
.prlist>li{color:var(--mut);font-size:13px;margin-bottom:5px}
.dirlist>li::before,.prlist>li::before{content:"";position:absolute;left:-14px;top:.62em;
  width:5px;height:5px;border-radius:50%;background:var(--acc);opacity:.75}
.prlist>li::before{background:var(--mut);opacity:.5}
.dirp{display:none}
.dapps{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));
  margin:14px 0 4px;align-items:start}
.dapp{padding:14px 16px}
.dah{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.dah b{font-family:var(--f-disp);font-size:14.5px;font-weight:700}
.drank{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;
  border-radius:6px;background:var(--acc);color:#fff;font-size:11.5px;font-weight:700;flex:none}
.st.d-dobrar{background:rgba(10,143,88,.16);color:var(--ok)}
.st.d-consertar{background:rgba(180,83,9,.16);color:var(--warn)}
.st.d-manter{background:rgba(125,140,170,.16);color:var(--mut)}
.st.d-congelar{background:rgba(125,140,170,.12);color:var(--mut)}
.dapp .prlist{margin-top:6px}
.dcall{color:var(--tx)!important;font-weight:600}
.fcard[id]{scroll-margin-top:18px}
.fdet{margin-top:10px;border-top:1px solid var(--bd-soft);padding-top:9px}
.fdet>summary{cursor:pointer;list-style:none;font-family:var(--f-disp);font-size:11.5px;
  font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);
  display:flex;align-items:center;gap:7px}
.fdet>summary::-webkit-details-marker{display:none}
.fdet>summary::before{content:"›";font-size:15px;transition:transform .15s}
.fdet[open]>summary::before{transform:rotate(90deg)}
.fdet>summary:hover{color:var(--acc)}
.fdet table.t{font-size:12.5px}
.fdet table.t td,.fdet table.t th{padding:6px 10px}
.fgrid.one{grid-template-columns:1fr!important}
.fcols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;
  align-items:start}
@media(max-width:820px){.fcols{grid-template-columns:1fr;gap:12px}}
.fcol{min-width:0}
.fcol>.fnds{margin-top:0}
.fdet .ascgrid{grid-template-columns:repeat(auto-fit,minmax(118px,1fr))}
.fdetcols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;
  align-items:start}
@media(max-width:1100px){.fdetcols{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:760px){.fdetcols{grid-template-columns:1fr}}
.fdetcols>div{min-width:0}
.t .thsub{font-size:9.5px;font-weight:600;letter-spacing:.03em;color:var(--mut);
  text-transform:none}
.legend{display:grid;gap:8px 18px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  margin:12px 0 0;font-size:11.5px;color:var(--mut);line-height:1.45}
.legend b{display:block;font-family:var(--f-disp);font-size:10.5px;font-weight:700;
  letter-spacing:.03em;color:var(--tx);margin-bottom:1px}
.legend .lg1{color:var(--mut)}.legend .lg2{color:var(--warn)}.legend .lg3{color:var(--warn)}
.thin{font-size:10.5px;color:var(--mut);background:var(--bd-soft);border-radius:999px;
  padding:1px 7px;cursor:help;white-space:nowrap}

<body><div class="wrap"><p class="sub" style="font-size:12px;margin:0 0 14px">Exportado em 2026-10-01 16:13 · fonte: Lab Hub local</p><p class="sub"><a href="../index.html">← hub</a> · <code>_GambitStudio/aso/reference/monetization-playbook.md</code></p><div id="md"></div><script>const RAW="# Monetization playbook (apps que T\u00caM paywall) \u2014 varredura 2026-08-22, atualizado 2026-09-28\n\n> Desde 27/09/2026 a monetiza\u00e7\u00e3o \u00e9 decidida na Fase 1 de todo app (Jo\u00e3o: \"pode parar de ter v1 inteira gr\u00e1tis ent\u00e3o\"; regras de produto em `spec/product-playbook.md` \u00a73). Este playbook vale pra todo app com paywall, novo ou vivo, e \u00e9 leitura obrigat\u00f3ria do `analytics-analyst` \u00a74 e de qualquer A/B de paywall. A se\u00e7\u00e3o \"Atualiza\u00e7\u00e3o 2026-09-27\" no fim traz os n\u00fameros novos; onde uma linha antiga foi superada, est\u00e1 marcada em linha.\n\n## 1. Onde a compra acontece\n- **Day 0 \u00e9 tudo**: 82% dos trials pagos come\u00e7am no dia 0 (RevenueCat 2026, 115k apps; Utilities 86%, Productivity 78%), 90% dos trial starts (Adapty 2026) e **50% de todas as convers\u00f5es pagas** acontecem no dia do install; depois do D2 a chance de trial \u2248 0. Paywall que o user n\u00e3o v\u00ea no Day 0 = paywall que n\u00e3o existe: um app sem oferta no dia 0 s\u00f3 alcan\u00e7a quem volta, 5-8% da coorte no D30. Onboarding com trial = 1,35% install\u2192pago (melhor placement); in-app sem trial 0,76%.\n- Onboarding responde por ~50% dos trial starts; a segunda fonte s\u00e3o os **gates de feature** (`premium_gate_hit`) \u2014 medir por `source`.\n- Onboarding + paywall s\u00e3o UM funil: o que acontece nas 5 telas antes decide a convers\u00e3o, n\u00e3o o design do paywall. Micro-compromissos (escolha de objetivo, slider, mini-quiz) antes do paywall sobem convers\u00e3o; multi-page 12,4% vs single-page 9,1%.\n\n## 2. Modelo: hard vs soft vs freemium (dados conflitam \u2014 TESTAR, n\u00e3o decretar)\n- RevenueCat 2026: hard paywall 10,7% D35 trial\u2192pago vs freemium 2,1%; receita por install D60 US$ 3,09 vs US$ 0,38 (8\u00d7); **reten\u00e7\u00e3o de 12 meses 27% vs 28% \u2014 paridade**. Adapty 2026: hard +21% LTV por assinante; paywall de onboarding sem trial converte 37,45% mas tem o menor LTV.\n- Adapty 2026: soft converte ~50% mais por volume (4,85% vs 3,34% view\u2192pay), hard d\u00e1 LTV maior.\n- **Ressalva de sobreviv\u00eancia (RevenueCat admite):** esses dados v\u00eam de apps que J\u00c1 cobram e de usu\u00e1rios que ficaram tempo suficiente pra converter; nada diz o que acontece quando um app GR\u00c1TIS passa a cobrar dos usu\u00e1rios atuais. Por isso o default do lab \u00e9 **soft** (fech\u00e1vel) no fim do onboarding; hard s\u00f3 por A/B.\n- Regra do lab: modelo s\u00f3 muda com A/B (PPO n\u00e3o testa paywall \u2014 usar variantes no PaywallKit com `variant` logado) e hip\u00f3tese escrita. Nunca por leitura de analytics sozinha.\n\n## 3. Trial\n- RevenueCat set/2026 (17k apps, planos mensais): **\u2264 4 dias 39,6% conv / 62,8% 1\u00aa renova\u00e7\u00e3o; 5-9 dias 45,9% / 62,8%; 10-16 dias 46,6% / 72,0%; 17-32 dias 43,7% / 77,5%** (H&F 46,8% em 5-9 dias). Trial de 3 dias: 55,4% dos cancelamentos no Day 0, 84% at\u00e9 D1 \u2014 e 46,5% dos apps usam < 4 dias mesmo assim. \u00c9 correla\u00e7\u00e3o (a pr\u00f3pria RevenueCat avisa), mas a dire\u00e7\u00e3o \u00e9 consistente \u2014 **pra planos mensais e anuais**. No **semanal** a dura\u00e7\u00e3o quase n\u00e3o importa (\u2264 4 d 22,3% vs 5-9 d 24,3%) e o que importa \u00e9 TER trial (sem trial renova 35,9% vs 57,9%); o default passou a ser **por plano-her\u00f3i** em 28/09 (\u00a73b e \"Atualiza\u00e7\u00e3o 2026-09-28\"): semanal + 3-5 d, anual + 7-14 d, nunca \u2264 4 d no anual.\n- **Trial PREJUDICA LTV em Productivity, Lifestyle, Graphics & Design, Entertainment** (comprador direto $56,95 vs trial $49,13 em Productivity). Em Utilities/privacy o trial AJUDA (ver 3b) \u2014 o Calc+ sem trial \u00e9 decis\u00e3o do Jo\u00e3o (mem\u00f3ria `feedback_calc_plus_no_trial`), n\u00e3o dado; n\u00e3o propor l\u00e1.\n- Tend\u00eancia top performers: trial em UM plano s\u00f3 (weekly 3d em utilities; anual 7-14d em Health) \u2014 nunca nos dois.\n\n### 3b. Em QUAL plano colocar o trial (pesquisa 2026-08-22: Adapty $3B, RevenueCat, Airbridge, Phiture)\n| Categoria | Trial ajuda? | LTV 12m trial vs direto | Setup que venceu |\n|---|---|---|---|\n| **Utilities / privacy / tools** (Cloak, Calc+, WTMP, AppLock) | **SIM** | trial > direto; weekly = 73,6% da receita; LTV pico $68,90 | **weekly $4,99-5,99 + trial 3d** (config de maior LTV do dataset, 1,5\u00d7 a m\u00e9dia); anual direto (sem trial) como \u00e2ncora. Pre\u00e7o importa mais que tipo de plano. |\n| Health & Fitness (Walk, soninho) | SIM | trial > direto; \u00fanica categoria onde anual domina (60,6%) | **anual + trial 7-14d** (user quer ver resultado antes); weekly sem trial |\n| Education (DevLingo, Bible) | SIM | trial > direto | weekly + trial 3d ou anual + trial 7d |\n| Productivity (Eisenhower, Cronos) | **N\u00c3O** | direto $56,95 > trial $49,13 (+16%) | weekly SEM trial + anual direto |\n| Lifestyle / Entertainment (Sueca, Philos) | **N\u00c3O** | trial reduz LTV 21,2% | sem trial |\n| Kids/Family (BLW) | SIM (comportamento Education/Health) | \u2014 | anual + trial 7d; weekly sem trial |\nFatos que sustentam: weekly j\u00e1 funciona como trial (RevenueCat) \u2014 trial no weekly s\u00f3 faz sentido curto (3d), nunca 7d; 3d = 55% cancelam no Day 0, 7d = 64% cancelam at\u00e9 D1, 30d = 31%; com trial o weekly ret\u00e9m 43% mais em 12 meses (Adapty); trial no anual reduz o risco percebido do compromisso longo (Headspace: 14d anual / 7d mensal). Moonly (Qonversion) p\u00f4s trial S\u00d3 no anual pra empurrar o anual \u2014 estrat\u00e9gia v\u00e1lida quando o objetivo \u00e9 mix de plano, n\u00e3o LTV bruto. Nenhuma fonte recomenda trial nos DOIS planos ao mesmo tempo: duplica o caminho gr\u00e1tis e tira a \u00e2ncora \"direto\" do paywall.\n**PADR\u00c3O DO LAB (28/09/2026 \u2014 trial pelo PLANO-HER\u00d3I; substitui o \"semanal sem trial + anual 7 d pra todos\" de 27/09):** o plano que carrega a receita recebe o trial, o outro fica direto como \u00e2ncora. **Utilit\u00e1rio de impulso (her\u00f3i = semanal): semanal + 3 dias (A/B 5 d), anual direto.** **H\u00e1bito/sa\u00fade/educa\u00e7\u00e3o/fam\u00edlia (her\u00f3i = anual): anual + 7 dias (A/B 14 d), semanal direto.** **Produtividade/lifestyle/festa: sem trial ou one-time.** Por qu\u00ea: a m\u00e9dia \"7 dias converte mais\" \u00e9 dos planos mensais; no semanal \u2264 4 d e 5-9 d convertem quase igual (22,3 vs 24,3%) e sem trial o semanal renova 35,9% e vale US$ 7,40 de LTV contra US$ 54,50 com trial de 3 d (Adapty); no anual \u2264 4 d \u00e9 a pior c\u00e9lula (24% / 18,3%). E \u00e9 o dado do pr\u00f3prio lab: o trial de 3 dias no semanal foi o que fez apps sem faturamento renderem (Jo\u00e3o 28/09, mem\u00f3ria `user_trial_and_onboarding_insight`). **Nunca trial nos dois planos; nunca \u2264 4 d no anual; nunca toggle de trial (Apple 3.1.2, jan/2026).** A tabela por categoria acima \u00e9 a mesma regra vista por categoria. Medir `trial` + `period` em `purchase_started/success` e `plan_selected(period, trial)` antes do tap; trial\u2192pago real vem da ASC (`scripts/asc/subscription_events.py`), n\u00e3o do GA4. Apps publicados fora do padr\u00e3o mant\u00eam a config at\u00e9 uma vers\u00e3o com hip\u00f3tese escrita \u2014 utilit\u00e1rio com \"semanal sem trial\" \u00e9 o primeiro A/B a rodar.\n**Aplicar em app que j\u00e1 est\u00e1 no ar = release, nunca s\u00f3 API:** o trial est\u00e1 amarrado em c\u00f3digo (labels/CTA do paywall, `hasTrial` do PaywallKit, strings localizadas) al\u00e9m do intro offer na ASC \u2014 mudar s\u00f3 na ASC desalinha o paywall. Apps publicados mant\u00eam a config atual at\u00e9 o Jo\u00e3o pedir a vers\u00e3o.\n\n### 3c. Fluxo weekly \u2192 anual (o upgrade de quem ficou)\nApple troca plano sozinha dentro do mesmo subscription group (Ajustes \u2192 Assinaturas): anual em **n\u00edvel acima** do weekly = upgrade imediato com proration; mesmo n\u00edvel = crossgrade na pr\u00f3xima renova\u00e7\u00e3o. Ordenar os n\u00edveis na ASC com o anual acima.\nPadr\u00e3o do lab pro app: card de upgrade no estado ativo do paywall (\"voc\u00ea paga X/semana \u2014 anual sai Y/m\u00eas, \u2212Z%\") que compra o produto anual via `StoreKitManager.purchase` (StoreKit faz a troca; sem c\u00f3digo extra). Gatilho: a partir da 2\u00aa-3\u00aa renova\u00e7\u00e3o semanal \u2014 nunca na 1\u00aa semana. Eventos: `upsell_shown` + `plan_changed(from, to, source)`. M\u00e9trica-alvo: % dos weeklies ativos h\u00e1 \u2265 3 semanas que migram (mix anual crescendo sem cair a convers\u00e3o do weekly).\n\n## 4. Planos e pre\u00e7o\n- Config dominante: **weekly + annual** (weekly = 55,6% da receita de subs em 2026). Melhor LTV medido: weekly $5,99 + trial 3d.\n- Pre\u00e7o alto gera ~3\u00d7 o LTV do pre\u00e7o baixo (Health 4,1\u00d7). N\u00e3o competir por pre\u00e7o baixo NO TIER 1 \u2014 e **pre\u00e7o por pa\u00eds \u00e9 obrigat\u00f3rio** (\u00a7 Atualiza\u00e7\u00e3o): mediana global US$ 7,48/sem, US$ 12,99/m\u00eas, US$ 38,42/ano; Europa cobra 29-39% acima da Am\u00e9rica do Norte.\n- 9 em 10 assinaturas vendem a pre\u00e7o cheio. **Desconto s\u00f3 p\u00f3s-dismiss** (welcome offer 24h pra quem fechou o paywall do onboarding sem converter) \u2014 nunca no paywall principal.\n- Churn: 1\u00aa renova\u00e7\u00e3o weekly 30-50%, monthly 15-40%; anual 35% no m\u00eas 1, 72% no ano. 20% dos mensais que cancelam reativam em 12 meses (RevenueCat 2026): **Retention Messaging** (oferta na tela de cancelamento, configurada na ASC) + win-back offers via API (LEARNINGS \u00a71) pra ex-assinantes \u2014 os dois em todo app com assinatura.\n\n## 5. O que testar primeiro (ordem do lab desde 28/09; taxa de vit\u00f3ria Adapty 2026 entre par\u00eanteses)\n0. **Placement** \u2014 paywall no onboarding vs in-app (onboarding + trial 1,35% install\u2192pago vs in-app sem trial 0,76%; Mojo: \"o primeiro experimento grande foi o paywall no onboarding, que responde pela maior parte dos trials at\u00e9 hoje\")\n1. **Trial** \u2014 em qual plano e dura\u00e7\u00e3o (59,6%; ver \u00a73b)\n2. N\u00famero de planos e pre\u00e7o (57,1% / 45,5%) \u2014 2 planos > 3; dura\u00e7\u00e3o do plano (58,7%)\n3. Localiza\u00e7\u00e3o do paywall (62,3%) \u2014 pre\u00e7o/moeda/idioma nativos (pre\u00e7o por pa\u00eds, \u00a7 Atualiza\u00e7\u00e3o 2026-09-27)\n4. **Visual/copy (34,6% \u2014 o pior, e o primeiro que todo mundo faz)** \u2014 s\u00f3 depois dos anteriores\nApps que experimentam consistentemente faturam at\u00e9 40\u00d7 mais; top = ~15 experimentos/ano, estruturais.\n\n## 6. Padr\u00f5es de paywall que venceram em 2026\nTabela Free vs Pro \u00b7 \"plan loader\" personalizado com prova social \u00b7 prova social (rating, n\u00ba de users) ANTES do bot\u00e3o \u00b7 welcome offer p\u00f3s-dismiss \u00b7 1 CTA, plano default = o de maior LTV pr\u00e9-selecionado.\n\n## 7. Instrumenta\u00e7\u00e3o m\u00ednima (taxonomia can\u00f4nica)\n`paywall_shown(source, placement, variant)` \u00b7 `paywall_dismissed(source, seconds)` \u00b7 `purchase_started/success/abandoned(product_id, source, period, trial)` \u00b7 `premium_gate_hit(feature)` \u00b7 `purchase_restored`. Sem `source` e `variant` registrados como custom dimension n\u00e3o existe A/B de paywall.\n\n## Atualiza\u00e7\u00e3o 2026-09-27 (pesquisa)\nN\u00fameros de `spec/research-2026-09-product.md` (achados 4-10) e a decis\u00e3o do Jo\u00e3o do mesmo dia. O que muda de pr\u00e1tica est\u00e1 em `spec/product-playbook.md` \u00a73.\n\n- **Dia 0 (achado 4):** 82% dos trials pagos come\u00e7am no dia 0 (RevenueCat 2026: Utilities 86%, Business 85%, Productivity 78%); 90% dos trial starts (Adapty 2026, 16k apps); **50% de todas as convers\u00f5es pagas** no dia 0. Corol\u00e1rio: paywall no fim do onboarding \u00e9 obrigat\u00f3rio em app que monetiza; \"premium depois\" alcan\u00e7a 5-8% da coorte.\n- **Hard vs soft (achado 5):** hard 10,7% D35 vs 2,1% freemium; US$ 3,09 vs 0,38 por install em D60; reten\u00e7\u00e3o 12 m 27% vs 28% (paridade). Adapty: hard +21% LTV; onboarding sem trial converte 37,45% com o menor LTV; weekly+trial tem o maior LTV 12 m (US$ 49,27). **Ressalva:** dados de apps que j\u00e1 cobram \u2014 vi\u00e9s de sobreviv\u00eancia; default do lab continua soft, hard s\u00f3 por A/B.\n- **Trial 7d vs 3d (achado 6):** \u2264 4 dias 39,6% / 5-9 dias 45,9% / 10-16 dias 46,6% / 17-32 dias 43,7% de convers\u00e3o (1\u00aa renova\u00e7\u00e3o 62,8 / 62,8 / 72,0 / 77,5%). 3 dias: 55,4% cancelam no dia 0, 84% at\u00e9 D1. Estrat\u00e9gias sem trial subiram de 28% (2024) pra 32% (2026); ~30% dos novos assinantes entram por intro offer. **Default: 7 dias no anual, semanal sem trial** (\u00a73, \u00a73b).\n- **Plano (achado 7):** weekly = 55,5% da receita (43,3% em 2023) e converte 1,7-7,4\u00d7 melhor que anual; D380: anual-com-trial 19,9%, mensal 14,2%, semanal 5,5%; H&F 60,6% anual; Productivity 77% mensal (91% da receita). Churn de anuais no ano 1 ~72% (35% no m\u00eas 1). LTV realizado ano 1 por pagante: H&F US$ 35,64, Productivity US$ 24,95, Gaming US$ 11,22. Assinatura rende 4,5\u00d7 o LTV de compra \u00fanica; s\u00f3 10% dos apps rodam h\u00edbrido.\n- **Pre\u00e7o por pa\u00eds (achado 10):** \u00cdndia a -90% deu +128% de receita no pa\u00eds (Personal Best: US$ 45k em 2025 com downloads -24%); apps otimizados precificam \u00cdndia 50-80% abaixo dos EUA (a Apple sugere -21%); Brasil +31% de gasto n\u00e3o-game a/a; Flo cresceu 80% em mercados n\u00e3o angl\u00f3fonos vs 35%. Ponto de partida do lab: Tier 1 = 1,0; BR/MX \u2248 0,5; IN \u2248 0,2; Europa pode ir 1,1-1,3. Aplicar via price point base USA + `equalizations` + 1 POST por territ\u00f3rio (LEARNINGS #1, #48); script `scripts/asc/localize_prices.py` a criar. Rodar nos apps pagos antes de qualquer itera\u00e7\u00e3o nova de ASO.\n- **Retention Messaging e ferramentas da Apple (achado 9):** oferta na tela de cancelamento liberada pra todos os devs; offer codes pra todo tipo de IAP; Bundles/Suites e Group Purchases; custom product pages 35\u219270 com keywords; Personalized Collections + App Notes (US, jun/2026). 20% dos mensais que cancelam reativam em 12 meses (13,7% em 2025). Configurar Retention Messaging + win-back em todo app com assinatura.\n- **Mediana (achado 8):** app pago mediano fatura US$ 492/m\u00eas; 17,3% chegam a US$ 1k MRR em 2 anos (19% no ano anterior); 4,6% a US$ 10k; 59,3% nunca passam de US$ 1k no total; top 10% ficam com 94,5% da receita. Funil de refer\u00eancia: install\u2192trial 10,9%, trial\u2192pago 25,6% (Adapty).\n- **Small Business Program (achado 11):** 15% de comiss\u00e3o com proceeds l\u00edquidos \u2264 US$ 1M no ano anterior e no corrente; opt-in na ASC, conferir o enrolamento.\n\n## Atualiza\u00e7\u00e3o 2026-09-28 (pesquisa onboarding/paywall/analytics)\nN\u00fameros de `spec/research-2026-09-onboarding-paywall-analytics.md` (achados 1-18) + o dado do lab (Jo\u00e3o 28/09: trial de 3 dias no semanal destravou receita \u2014 mem\u00f3ria `user_trial_and_onboarding_insight`). Regras aplicadas em linha nos \u00a73, \u00a73b e \u00a75; aqui o que sustenta.\n\n- **Trial por plano (achado 1, RevenueCat 17k apps):** semanal \u2264 4 d 22,3% conv / 57,9% 1\u00aa renova\u00e7\u00e3o, 5-9 d 24,3% / 65,9%; mensal \u2264 4 d 39,6% / 54,2%, 10-16 d 46,6% / 72%; anual \u2264 4 d 24% / 18,3% (pior c\u00e9lula), 10-16 d 43% / 36,4%, 17-32 d 44,6% / 47,5%. Sem trial, 1\u00aa renova\u00e7\u00e3o: semanal 35,9%, mensal 49,5%, anual 26,6%. Top 100 com semanal: 81-100 usam trial \u2264 4 d. **Regra: utilit\u00e1rio = semanal + 3 d (A/B 5 d) e anual direto; h\u00e1bito = anual + 7 d (A/B 14 d) e semanal direto; produtividade/festa = sem trial ou one-time; nunca \u2264 4 d no anual, nunca trial nos dois, nunca
