<body><div class="wrap"><p class="sub" style="font-size:12px;margin:0 0 14px">Exportado em 2026-10-01 10:20 · fonte: Lab Hub local</p><p class="sub"><a href="../index.html">← hub</a> · <code>_GambitStudio/reports/2026-10-01_couples-app-gate/GATE.md</code></p><div id="md"></div><script>const RAW="# Gate de viabilidade \u2014 app NOVO de gastos para CASAIS (BR/ES/MX/US)\n\n**Data:** 2026-10-01 \u00b7 **Pergunta:** a resposta de 21/06/2026 (NO-GO pra app standalone) mudou?\n**Veredito:** \ud83d\udd34 **REPROVA DE NOVO** \u2014 e agora com evid\u00eancia muito mais dura do que em junho.\n\nEm junho o NO-GO era uma *proje\u00e7\u00e3o* (\"todo termo \u00e9 pop 5, logo n\u00e3o h\u00e1 volume\"). Hoje \u00e9 um **experimento natural conclu\u00eddo**: cerca de 25 desenvolvedores rodaram exatamente esta aposta nos \u00faltimos 12 meses, e o teto est\u00e1 medido.\n\n> **A frase que resolve o gate:** nenhum app couples-specific lan\u00e7ado depois de 2022 passou de **30 avalia\u00e7\u00f5es** em nenhum dos 4 mercados. O \"l\u00edder\" de casal do BR tem **69 avalia\u00e7\u00f5es e est\u00e1 abandonado h\u00e1 13 meses**. O recorde do gold rush ES/MX, com 24 apps e 12+ meses, \u00e9 **3 avalia\u00e7\u00f5es**.\n\n---\n\n## 1. Os 3 crit\u00e9rios (os mesmos de junho, pra compara\u00e7\u00e3o ser honesta)\n\n| Crit\u00e9rio | Resultado | N\u00famero |\n|---|---|---|\n| **(a)** \u22653 termos com pop \u22656 **E** diff \u226420 **E** inten\u00e7\u00e3o alinhada | \ud83d\udd34 **FALHA** | **1 termo em 45** passa no n\u00famero \u2014 e falha na inten\u00e7\u00e3o |\n| **(b)** heads n\u00e3o totalmente saturados | \ud83d\udd34 **FALHA** nos 4 mercados | US: 28.327 + 112.044 + 84.114 no topo \u00b7 BR: 6.720 + 4.468 com a frase exata no nome |\n| **(c)** wedge de **ASO** (n\u00e3o s\u00f3 de produto) | \ud83d\udd34 **FALHA** | wedge de produto ficou MAIOR e est\u00e1 medido; wedge de aquisi\u00e7\u00e3o n\u00e3o existe |\n\n### (a) O \u00fanico termo que passa \u00e9 de OUTRO job\n\n45 termos medidos hoje no Astro (BR 35, ES 10). **43 deram pop 5**, que \u00e9 o piso da escala \u2014 \"volume desconhecido\", n\u00e3o \"volume baixo\".\n\n| termo | loja | pop | diff | passa? |\n|---|---|---|---|---|\n| `dividir gastos` | BR | **14** | **15** | \u2705 no n\u00famero \u00b7 \u274c na inten\u00e7\u00e3o |\n| `app para parejas` | ES | 17 | 48 | \u274c diff + inten\u00e7\u00e3o (\u00e9 app de casal em geral, n\u00e3o finan\u00e7as) |\n| `dividir gastos` | ES | 14 | 39 | \u274c diff |\n| os outros 42 | BR/ES | **5** | 5\u201355 | \u274c piso de medi\u00e7\u00e3o |\n\n**Por que `dividir gastos` BR falha na inten\u00e7\u00e3o** \u2014 a SERP ao vivo diz de quem \u00e9 o termo:\n\n| # | app | avalia\u00e7\u00f5es | subtitle |\n|---|---|---|---|\n| 1 | Splitwise | 6.720 | \"Dividir gastos **com amigos**\" |\n| 2 | tricount: dividir contas | 4.468 | \"Gastos **entre amigos** f\u00e1cil\" |\n| 3 | Splity | 107 | \"Dividir faturas e custos\" (**Grupo**) |\n| 5 | Splital | 21 | \"Rachar conta **com amigos**\" |\n| 10 | Banana Split | 9 | \"Rachar a conta **entre amigos**\" |\n| 13 | Roamie | 0 | \"Planejador de **viagens** em grupo\" |\n\n**Zero apps de casal no top 15.** O termo \u00e9 amigos/grupo/viagem. A iter-04 do Meus Gastos j\u00e1 tinha dado o mesmo veredito (`dividir gastos` = MISMATCH em pt-BR). Para um app de casal, o \u00fanico termo com volume \u00e9 um termo de outro produto.\n\n**E diff 15 ali \u00e9 uma armadilha:** #1 e #2 t\u00eam 6.720 e 4.468 avalia\u00e7\u00f5es com a frase exata no nome/subtitle. A dificuldade baixa reflete a cauda de apps com 0 avalia\u00e7\u00e3o, n\u00e3o a disputabilidade do topo. \u00c9 exatamente o risco n\u00ba1 que o estudo de junho listou (\"diff baixo n\u00e3o \u00e9 oportunidade\"), agora com o mecanismo identificado.\n\n**Nota sobre `casal` solto:** pop 54, mas diff 55 e a inten\u00e7\u00e3o \u00e9 dominada por **jogo de casal** (`jogo casal` pop 49, `quiz casal` pop 14). Polissemia, n\u00e3o demanda de finan\u00e7as.\n\n### (b) Satura\u00e7\u00e3o \u2014 por mercado\n\n- **US `couples budget`**: Honeydue 10.239 \u00b7 Goodbudget 13.470 \u00b7 Monarch **112.044** \u00b7 EveryDollar **84.114**. Os couples-specific recentes: Halfway 14, Hearth 6, OurPlan 0, Couple's Better Budget 0.\n- **US `split expenses`**: Tricount 7.214 \u00b7 Splitwise 28.327 \u00b7 Splid 4.096 \u00b7 Settle Up 1.740 no top 4. Do #5 pra baixo, tudo \u22643 avalia\u00e7\u00f5es (exceto Split 740 e Cost Split 129).\n- **BR `dividir gastos`**: Splitwise + Tricount donos do #1-2 com a frase no pr\u00f3prio nome.\n- **ES `gastos en pareja`**: 12 apps de casal na SERP somando **9 avalia\u00e7\u00f5es no total**; o **#1 tem ZERO**.\n- **MX `gastos en pareja`**: 9 apps de casal, **todos em 0 avalia\u00e7\u00f5es**, e o #10 \u00e9 o **Instagram** \u2014 a loja esgotou apps relevantes pro termo.\n\nES/MX n\u00e3o reprovam por satura\u00e7\u00e3o de gigante: reprovam pelo oposto, e \u00e9 pior. **Chegar a #1 em `gastos en pareja` na Espanha \u00e9 trivial (diff 5) e n\u00e3o vale nada** \u2014 o #1 de hoje tem 0 avalia\u00e7\u00f5es. Posi\u00e7\u00e3o sem demanda atr\u00e1s.\n\n### (c) Wedge de produto existe e cresceu \u2014 wedge de aquisi\u00e7\u00e3o n\u00e3o existe\n\nO material de concorr\u00eancia (4.657 avalia\u00e7\u00f5es cruas codificadas, 65 apps, 4 mercados \u2014 `competitor-intel/GAPS.md`) mostra dor **maior e agora medida**:\n\n- **Splitwise est\u00e1 sangrando em 4 mercados.** Das 400 reviews recentes US, **58% s\u00e3o 1-3\u2605**; e dessas, 46% (US) a **76% (MX)** falam de paywall/limite/ads. Mecanismo: **3-5 lan\u00e7amentos por dia no free + an\u00fancio de 10s travando a tela antes de cada lan\u00e7amento**; US$60/ano, 30\u20ac/ano, ~MX$800/ano. O \u00eaxodo tem destino nomeado nas reviews: *\"switched to Tricount\"*, *\"USE A FREE ALTERNATIVE\"*.\n- **Honeydue (l\u00edder couples US, 10.239) est\u00e1 apodrecendo**: 366 das 500 reviews recentes s\u00e3o 1-3\u2605 \u2014 Plaid quebrando (149), suporte mudo (130), sync falhando (89), e um caso de aceitar o convite ter **zerado os dados** de quem convidou.\n- **Ningu\u00e9m no segmento casal deixa o parceiro entrar sem conta.** Quem resolve isso (Splid, Spliit, Settle Up \u2014 grupo por link) tem o melhor sentimento do nicho inteiro (Splid: **1%** de 1-3\u2605).\n\n**Mas dor n\u00e3o \u00e9 canal.** Os dois eixos apontam pra lados diferentes: a dor de produto ficou mais n\u00edtida, a demanda de busca n\u00e3o deu **nenhum** sinal de ter crescido. Quem entra nesse nicho depende de canal pago, boca a boca ou conte\u00fado \u2014 e o lab n\u00e3o tem nenhum dos tr\u00eas (Meta Ads descartado em 31/08; Apple Ads n\u00e3o tem invent\u00e1rio pra comprar busca que n\u00e3o acontece).\n\n---\n\n## 2. O experimento natural \u2014 o que 25 devs j\u00e1 pagaram pra descobrir\n\nIsto \u00e9 o que junho n\u00e3o tinha, e \u00e9 o argumento mais forte do gate.\n\n### ES/MX \u2014 o gold rush dobrou e n\u00e3o produziu um sobrevivente\n\nTodos os nomes que o estudo de junho listou continuam na loja. Nenhum decolou:\n\n| app | lan\u00e7ado | \u00faltimo update | ES | MX | US |\n|---|---|---|---|---|---|\n| ParejaPro | 2026-01-09 | 2026-06-27 | 0 | 1 | 0 |\n| DuoBalance | 2026-02-11 | **2026-03-10** | 3 | 0 | 0 |\n| DuoDivvy | 2026-03-18 | **= dia do lan\u00e7amento** | 0 | 0 | 0 |\n| WeZioo | 2026-04-11 | 2026-08-17 | 0 | \u2014 | \u2014 |\n| Inali \u00b7 famlyy \u00b7 Qita \u00b7 Couplesplit \u00b7 Wizpend \u00b7 Splits \u00b7 HomePot \u00b7 We Budget | 2026 | v\u00e1rios | 0\u20133 | 0 | 0\u20136 |\n\nE a safra **lan\u00e7ada depois do estudo de junho**: DUOVI, Frudini, Mutual, Parejo, Parejas en Balance, Our Wallet, dupla, Soroka, duofi, Two Cents \u2014 **+10 entrantes, todos em 0 avalia\u00e7\u00f5es**.\n\n**Resposta direta \u00e0 sua pergunta:** ningu\u00e9m chegou a 500. Ningu\u00e9m chegou a 100. **Ningu\u00e9m chegou a 10.** Recorde do grupo em 12+ meses: **3 avalia\u00e7\u00f5es**. Tr\u00eas desses apps nunca receberam um segundo update \u2014 abandonados na semana do lan\u00e7amento.\n\nOferta crescendo e demanda n\u00e3o aparecendo \u00e9 o contr\u00e1rio de \"nicho aquecido com demanda represada\".\n\n### BR \u2014 9 entrantes novos em 2026, teto de 26 avalia\u00e7\u00f5es\n\n| app | junho/2026 | hoje | \u0394 |\n|---|---|---|---|\n| Junto$ (o \"l\u00edder\" de junho) | 3,7\u2605 / 68 | 3,71\u2605 / **69** | **+1 em 3,5 meses** \u00b7 **abandonado** (sem update desde 2025-09) |\n| Balance \"Despesas do Casal\" | 13 | **26** | +13 (melhor app vivo do BR) |\n| dividi | 10 | 18 | +8 |\n| **Coupe** (lan\u00e7ou 2026-07-26) | n\u00e3o existia | **19** | o entrante mais r\u00e1pido do BR |\n| Rachou \u00b7 Dvoi \u00b7 duofi \u00b7 Couple Finance \u00b7 Pharos \u00b7 ContasCasal \u00b7 Mutual \u00b7 Casal Financeiro \u00b7 Continhas Casal | n\u00e3o existiam | 9/5/1/5/3/1/0/0/0 | **9 entrantes novos** |\n\nO pr\u00eamio de \"l\u00edder de casal do BR\" \u00e9 **69 avalia\u00e7\u00f5es num app morto**. E o entrante mais r\u00e1pido de 2026 estampa o tamanho do neg\u00f3cio no pr\u00f3prio print: **\"Junte-se a +400 Casais\"**.\n\n### O \u00fanico crescimento real do espa\u00e7o n\u00e3o \u00e9 um tracker\n\n**Split Pay: Split Bills in Two** \u2014 17.984 avalia\u00e7\u00f5es desde set/2023. Parece o contra-exemplo perfeito, e n\u00e3o \u00e9: **n\u00e3o \u00e9 app de dividir entre duas pessoas**. \u00c9 fintech que parcela o aluguel em 2 pagamentos no tempo, d\u00e1 conta e routing virtuais e cobra **US$9,99/m\u00eas + 1,5%** do valor. O que acumulou massa recentemente foi **movimentar dinheiro**, n\u00e3o registrar despesa. Modelo fora do lab.\n\n---\n\n## 3. Por que n\u00e3o vale como app pago / boca a boca (voc\u00ea pediu esse racioc\u00ednio)\n\nAvaliei separadamente, porque \u00e9 a \u00fanica hip\u00f3tese que n\u00e3o depende de busca. Tamb\u00e9m reprova \u2014 e por raz\u00f5es estruturais, n\u00e3o por qualidade de produto:\n\n1. **N\u00e3o existe canal.** Boca a boca precisa de popula\u00e7\u00e3o semente, e a semente vem de busca. Meta Ads foi descartado em 31/08 (retorno pequeno mesmo no cen\u00e1rio otimista). Apple Ads em termo pop 5 n\u00e3o tem invent\u00e1rio: n\u00e3o se compra impress\u00e3o de busca que n\u00e3o acontece. Conte\u00fado/comunidade custa o seu tempo, que \u00e9 o recurso mais escasso (CLT + 20+ apps).\n2. **App de dois lados tem CAC dobrado e ativa\u00e7\u00e3o pela metade.** Todo install precisa de um segundo humano instalando tamb\u00e9m. As reviews medem esse custo: Splitwise BR tem 25 reviews 1-3\u2605 e 37 reviews 4-5\u2605 falando de convite/cadastro, e no Honeydue aceitar o convite **zerou os dados** de quem convidou. Metade da convers\u00e3o morre no onboarding do parceiro.\n3. **iOS-only tem teto estrutural AQUI.** Metade dos casais tem um parceiro no Android, e as reviews citam cross-platform como crit\u00e9rio de escolha (*\"Honeydue is nice for couples who have different operating systems\"*; Tandem leva 1\u2605 por n\u00e3o ter Android). Isso n\u00e3o \u00e9 contorn\u00e1vel com execu\u00e7\u00e3o.\n4. **Quem cobra no nicho \u00e9 punido, e quem n\u00e3o cobra ganha o sentimento.** Os dois melhores sentimentos do nicho (Tricount 4,87\u2605, Splid 4,91\u2605) s\u00e3o os que **n\u00e3o cobram**. Tandem p\u00f5e hard paywall na porta (US$10-13/m\u00eas) e colhe *\"you can't even try it out without buying first\"*. Um app pago entraria contra a corrente do pr\u00f3prio nicho.\n\nProduto bom, forma errada: dois lados + iOS-only + zero canal \u00e9 a pior combina\u00e7\u00e3o poss\u00edvel pra um lan\u00e7amento sem aquisi\u00e7\u00e3o.\n\n---\n\n## 4. Canibaliza\u00e7\u00e3o \u2014 o name/subtitle que voc\u00ea prop\u00f4s faz exatamente o movimento errado\n\nVoc\u00ea prop\u00f4s:\n```\nName      Nossas Contas: Gastos Casal     (27/30)\nSubtitle  Despesas compartilhadas a dois  (30/30)\n```\n\nIsso \u00e9 quase um clone token-a-token da superf\u00edcie de casal do Meus Gastos:\n\n| token proposto | onde j\u00e1 vive no Meus Gastos | o que sustenta hoje |\n|---|---|---|\n| `Contas` | **NAME** (`Meus Gastos: Contas e Despesas`) | \u2014 |\n| `Gastos` | **NAME** + a marca | \u2014 |\n| `Casal` | **SUBTITLE** (`Finan\u00e7as do casal e pessoais`) | **21 posi\u00e7\u00f5es \u2264#50** (iter-04) |\n| `Despesas` | **NAME** | \u2014 |\n| `compartilhadas` | **KEYWORDS** (`compartilhados`) | **9 posi\u00e7\u00f5es \u2264#50** |\n\nDois problemas:\n\n1. **Os dois apps brigariam pelas MESMAS ~30 posi\u00e7\u00f5es**, e o novo perde: a Apple favorece sinal comportamental, e o Meus Gastos tem 18 avalia\u00e7\u00f5es / 4,94\u2605 / 2,5 anos de hist\u00f3rico contra um app de 0 avalia\u00e7\u00e3o. Pior: a duplicata do mesmo dev **dilui** as posi\u00e7\u00f5es que o MG j\u00e1 tem. Na SERP `gastos casal` o MG est\u00e1 **#5 hoje** \u2014 essa \u00e9 a posi\u00e7\u00e3o que entraria em risco.\n2. **Risco de 4.3 (Spam).** Dois apps de Finan\u00e7as da mesma conta, ambos posicionados em despesas de casal em pt-BR. A regra da casa \u00e9 checar 4.3 antes de reposicionar; aqui o gatilho \u00e9 o mais \u00f3bvio poss\u00edvel.\n\n**Se um dia os dois coexistirem, a divis\u00e3o tem que ser o inverso da que voc\u00ea prop\u00f4s:** o Meus Gastos **mant\u00e9m** `casal`/`pessoal` (ele j\u00e1 tem as posi\u00e7\u00f5es, e voc\u00ea decidiu isso em 01/10), e o app novo nasce em **outro cluster de inten\u00e7\u00e3o** \u2014 grupo/rachar/amigos/viagem/rep\u00fablica. Nunca os dois no mesmo cluster.\n\n---\n\n## 5. O que eu recomendo, em ordem\n\n### Primeiro: n\u00e3o criar o app. N\u00e3o rodar o `/create-ios-app`.\nN\u00e3o parei por falta de dado \u2014 parei porque o dado est\u00e1 completo e diz n\u00e3o. Nada foi scaffoldado.\n\n### A alternativa que REALMENTE segue do dado: o wedge com volume \u00e9 **grupo**, n\u00e3o casal\n\nO \u00fanico termo que passou o filtro num\u00e9rico em 4 mercados (`dividir gastos` BR, pop 14 / diff 15) \u00e9 de **amigos/grupo/viagem**. E \u00e9 justamente ali que a dor est\u00e1 sangrando agora:\n\n- Splitwise em revolta medida nos 4 mercados sobre **limite de lan\u00e7amentos + ad antes de cada lan\u00e7amento**, com \u00eaxodo nomeado nas reviews.\n- O pedido n\u00ba1 das 4-5\u2605 em **6 feeds** \u00e9 **export CSV/PDF** \u2014 que o Tricount **removeu** e o Splitwise **cobra**. Custo de implementa\u00e7\u00e3o: baixo.\n- BR: *\"Pouca utilidade sem PIX\"* \u2014 e n\u00e3o precisa integra\u00e7\u00e3o banc\u00e1ria; copiar chave Pix + valor exato mata o atrito.\n- O modelo que ganha sentimento (Splid 1% de reviews ruins) \u00e9 **sem cadastro, grupo por link** \u2014 e nenhum app de casal faz isso.\n\n**Mas isto N\u00c3O \u00e9 um GO.** Eu n\u00e3o rodei o gate em termos de grupo \u2014 medi os de casal. E o crit\u00e9rio (b) provavelmente reprova l\u00e1 tamb\u00e9m: Splitwise 6.720 + Tricount 4.468 donos do #1-2 em BR com a frase no nome, e a regra rating-first (<25 avalia\u00e7\u00f5es = ratings antes de ASO) se aplica a qualquer app novo. **Se voc\u00ea quiser, eu rodo o gate de grupo/rachar com o mesmo rigor** \u2014 \u00e9 a \u00fanica dire\u00e7\u00e3o vizinha onde existe um termo com volume pra disputar.\n\n### Sobre \"Modo Casal\" no Meus Gastos (a recomenda\u00e7\u00e3o de junho) \u2014 eu mudaria a justificativa\n\nContinua sendo a melhor op\u00e7\u00e3o **se o objetivo for honestidade de posicionamento, n\u00e3o crescimento**:\n\n- A iter-04 provou que as 21 posi\u00e7\u00f5es de topo do `casal` s\u00e3o **MISMATCH**: o MG vende casal e n\u00e3o entrega nada (todo path do Firestore \u00e9 `.collection(userId)`, `CardModel` sem campo de pessoa \u2014 N1/N2). Cada install vindo dali chega esperando ledger compartilhado, n\u00e3o acha, e desinstala. Implementar Modo Casal \u00e9 o \u00fanico movimento que **converte essas 21 posi\u00e7\u00f5es de MISMATCH em FIT** e para de comprar install que n\u00e3o fica \u2014 e BR \u00e9 o \u00fanico locale com massa de avalia\u00e7\u00e3o a perder (18).\n- **Mas n\u00e3o \u00e9 alavanca de crescimento**: 21 posi\u00e7\u00f5es \u00d7 pop 5 continua sendo quase zero tr\u00e1fego. O ganho \u00e9 reten\u00e7\u00e3o e qualidade de nota sobre o funil amplo de finan\u00e7as que o MG j\u00e1 capta.\n- **E n\u00e3o \u00e9 feature pequena**: exige migrar todo o modelo de dados de `.collection(userId)` pra ledger compartilhado, num app Flutter **vivo, supervisionado, com 4,94\u2605**. \u00c9 migra\u00e7\u00e3o de arquitetura, n\u00e3o feature.\n\nEnt\u00e3o: vale, mas como **d\u00edvida de honestidade** com custo real de engenharia \u2014 n\u00e3o como aposta de receita. \u00c9 sua a decis\u00e3o, e o MG \u00e9 `intermediate/`: eu n\u00e3o toquei em nada dele.\n\n### Se a vontade for mesmo um app novo agora\nO dado diz que o nicho de casal n\u00e3o paga. Se o apetite \u00e9 por app novo, os candidatos j\u00e1 aprovados e parados do lab (plantas/rega est\u00e1 GO e em espera) t\u00eam gate melhor que este \u2014 e n\u00e3o t\u00eam o problema de dois lados nem o teto de iOS-only.\n\n---\n\n## 6. Limita\u00e7\u00f5es desta rodada (o que N\u00c3O est\u00e1 medido)\n\nHonestidade sobre o alcance do dado:\n\n- **Popularidade de US e MX n\u00e3o foi medida hoje.** O endpoint de popularidade do Astro passou a devolver `Astro.Errors error 5` depois de ~55 lookups e n\u00e3o voltou (reiniciei o app, continuou). US e MX est\u00e3o cobertos por **satura\u00e7\u00e3o de SERP** (que \u00e9 evid\u00eancia comportamental, mais forte que o score de dificuldade), n\u00e3o por pop/diff. Se voc\u00ea quiser o n\u00famero, eu re-rodo quando a cota voltar \u2014 mas US reprova por (b) com 112k/84k/28k no topo, e isso n\u00e3o muda com pop.\n- **Rating 0 n\u00e3o prova 0 downloads** \u2014 prova aus\u00eancia de massa de avalia\u00e7\u00e3o, que \u00e9 o gargalo que o lab j\u00e1 trata como regra (rating-first). Pro gate, \u00e9 o n\u00famero certo de olhar.\n- **Review RSS \u00e9 amostra dos mais recentes**, n\u00e3o o acumulado: \"73% ruim no Honeydue\" convive com 4,48\u2605 de loja. N\u00e3o trocar um pelo outro.\n- `dividir gastos` n\u00e3o foi medido em MX/US; `nossas contas` (sua marca proposta) ficou **sem medi\u00e7\u00e3o** \u2014 caiu junto com o endpoint.\n\n---\n\n## 7. Evid\u00eancia em disco (tudo reexecut\u00e1vel)\n\n| arquivo | conte\u00fado |\n|---|---|\n| `astro/measured_keywords.csv` | 45 termos medidos hoje (BR 35, ES 10) com pop/diff/apps_in_ranking |\n| `astro/kw_*.txt` + `seed*.py` | listas e pipeline de medi\u00e7\u00e3o (Astro app placeholder `107` = \"Couples Gate 2026-10\") |\n| `competitor-intel/GAPS.md` | gap analysis completo: dores por tema com contagem e cita\u00e7\u00e3o, trajet\u00f3ria, monetiza\u00e7\u00e3o, onboarding do parceiro, padr\u00f5es de print |\n| `competitor-intel/roster.csv` | 65 apps \u00d7 4 lojas: massa de avalia\u00e7\u00e3o, lan\u00e7amento, \u00faltimo update |\n| `competitor-intel/reviews/reviews.json` | 4.657 avalia\u00e7\u00f5es cruas, 40 feeds |\n| `competitor-intel/reviews/THEMES.txt` | codifica\u00e7\u00e3o tem\u00e1tica com contagem + cita\u00e7\u00f5es (519 linhas) |\n| `competitor-intel/{us,br,es}/` | 48 apps com prints, description, \u00edcone e meta |\n| `competitor-intel/tools/` | `fetch_reviews.py`, `themes.py`, `roster.py` |\n\n**Compara\u00e7\u00e3o com junho:** `Apps/intermediate/Controle-de-gastos/aso-pipeline/couples_niche_viability_2026-06-21.md`.\n\n### Gotcha novo pro lab\nO RSS de reviews da Apple com `page=1` devolve feed **vazio** de forma intermitente \u2014 a p\u00e1gina 1 tem que usar a forma **sem** `page=`. Sem isso o script conclui \"app sem avalia\u00e7\u00f5es\" num app com 28 mil. Salvo em `tools/fetch_reviews.py`.\n";</script><script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script><script>document.getElementById("md").innerHTML=window.marked?marked.parse(RAW):"<pre>"+RAW.replace(/</g,"&lt;")+"</pre>";</script></div><script>(function(){try{var k="lh.scroll:"+location.pathname;var v=sessionS
