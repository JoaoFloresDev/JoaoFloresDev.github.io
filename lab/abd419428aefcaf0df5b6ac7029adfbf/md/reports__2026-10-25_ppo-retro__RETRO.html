/* ---------- camada de acabamento (01/10/2026) ----------
   Tipografia com duas vozes (display para títulos e números, texto para leitura),
   neutros com viés do azul da marca em vez de cinza puro, e profundidade por
   sombra em vez de só borda. Nada aqui renomeia classe: é uma camada por cima. */
:root{
  --f-disp:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --f-text:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --bg:#eef1f7; --card:#ffffff; --tx:#0a0d14; --mut:#4b5567; --acc:#2b3340;
  --bd:#cbd3e0; --bd-soft:#dfe5ee; --ok:#07804e; --down:#c42121; --warn:#9a4408;
  --sh:0 1px 2px rgba(16,19,26,.05),0 2px 8px rgba(16,19,26,.04);
  --sh-up:0 2px 6px rgba(16,19,26,.07),0 10px 24px rgba(16,19,26,.07);
  --cardup:#ffffff; --bdup:#b9c3d4;
  --boardtop:#e9edf5; --boardbot:#e3e8f1;
  --bar:#2563eb; --bar2:#60a5fa;
  --rad:14px;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#07090d; --card:#141922; --tx:#f7f9fc; --mut:#b2bdd0; --acc:#ccd6e6;
  --bd:#333c4c; --bd-soft:#232a36; --ok:#55e39d; --down:#ff8585; --warn:#ffbb55;
  --sh:0 1px 2px rgba(0,0,0,.4); --sh-up:0 6px 22px rgba(0,0,0,.5);
  --cardup:#1d2430; --bdup:#3d4859;
  --boardtop:#0d1218; --boardbot:#090d13;
  --bar:#5b9bff; --bar2:#9dc4ff;
}}
body{font-family:var(--f-text);font-size:14.5px;line-height:1.6;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1{font-family:var(--f-disp);font-size:27px;font-weight:800;letter-spacing:-.02em;
  text-wrap:balance;margin:0 0 2px}
h1 .mark{display:inline-block;width:28px;height:28px;vertical-align:-5px;margin-right:11px;
  background-size:contain;background-repeat:no-repeat;background-position:center}
h2{font-family:var(--f-disp);font-size:12px;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;color:var(--mut);border-top:1px solid var(--bd-soft);
  padding-top:22px;margin:32px 0 14px}
h3{font-family:var(--f-disp);letter-spacing:-.01em}
.sub{font-size:13px;color:var(--mut)}
code,.mono{font-family:var(--f-mono);font-size:12.5px}
.card,table.t,a.tile,.row,.fcard,#md{box-shadow:var(--sh);border-color:var(--bd-soft)}
.card,a.tile,.row,.fcard{border-radius:var(--rad)}
a.tile,.row{transition:box-shadow .16s ease,border-color .16s ease,transform .16s ease}
a.tile:hover,a.row:hover{box-shadow:var(--sh-up);border-color:var(--bd);
  transform:translateY(-1px)}
/* O card do app é área de leitura, não botão: nada muda no hover. A regra antiga
   trocava a sombra, e num card sem sombra isso aparecia como animação. */
.fcard,.fcard:hover{transition:none!important;transform:none!important}
/* big numbers: the first thing anyone reads on the page */
.tiles{gap:12px;margin:18px 0 4px}
a.tile{padding:13px 17px;min-width:148px}
.tile .tl{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
  color:var(--mut)}
.tile .tv{font-family:var(--f-disp);font-size:25px;font-weight:800;letter-spacing:-.025em;
  margin-top:3px}
.tile .ts{font-size:11.5px;color:var(--mut)}
.tile .tvd{font-family:var(--f-text);font-size:13px;font-weight:600;letter-spacing:0;white-space:nowrap}
/* tables read as data, not as prose */
table.t{border-radius:var(--rad);font-variant-numeric:tabular-nums}
table.t th{font-family:var(--f-disp);font-size:11px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;background:var(--bd-soft);border-bottom:1px solid var(--bd)}
table.t td{padding:9px 13px;border-bottom:1px solid var(--bd-soft)}
table.t tbody tr:hover td,table.t tr:hover td{background:rgba(125,140,170,.06)}
.twrap{border-radius:var(--rad)}
/* buttons */
.btn{font-family:var(--f-disp);font-weight:600;font-size:13.5px;padding:9px 18px;
  border-radius:999px;box-shadow:var(--sh);transition:all .16s ease}
.btn:hover{border-color:var(--acc);box-shadow:var(--sh-up);transform:translateY(-1px)}
.pill,.st{font-family:var(--f-disp);font-weight:600;font-size:11.5px;letter-spacing:.02em}
/* status colours carry meaning, so keep them out of the accent */
.st.run,.st.appr{background:rgba(10,143,88,.14);color:var(--ok)}
.st.crit{background:rgba(208,47,47,.14);color:var(--down)}
.st.rev,.st.draft{background:rgba(180,83,9,.14);color:var(--warn)}
/* the lanes strip and any scroller get a thin, rounded bar */
.hrow,.twrap,.tiles{scrollbar-width:thin;scrollbar-color:var(--bd) transparent}
.hrow::-webkit-scrollbar,.twrap::-webkit-scrollbar,.tiles::-webkit-scrollbar{height:9px}
.hrow::-webkit-scrollbar-track,
.twrap::-webkit-scrollbar-track,
.tiles::-webkit-scrollbar-track{background:transparent}
.hrow::-webkit-scrollbar-thumb,
.twrap::-webkit-scrollbar-thumb,
.tiles::-webkit-scrollbar-thumb{background:var(--bd);border-radius:999px;
  border:3px solid transparent;background-clip:content-box}
.hrow::-webkit-scrollbar-thumb:hover,
.twrap::-webkit-scrollbar-thumb:hover,
.tiles::-webkit-scrollbar-thumb:hover{background:var(--mut);background-clip:content-box}
.hrow{background:transparent;border:0;padding:0;border-radius:0}
.hcol{flex:0 0 clamp(280px,26vw,360px);min-width:0}
a:focus-visible,button:focus-visible,.btn:focus-visible{outline:2px solid var(--acc);
  outline-offset:2px;border-radius:8px}
.dirlist,.prlist{margin:10px 0 0;padding-left:18px;list-style:none}
.dirlist>li,.prlist>li{position:relative;margin:0 0 7px;font-size:13.5px;line-height:1.5;
  color:var(--tx)}
.prlist>li{color:var(--mut);font-size:13px;margin-bottom:5px}
.dirlist>li::before,.prlist>li::before{content:"";position:absolute;left:-14px;top:.62em;
  width:5px;height:5px;border-radius:50%;background:var(--acc);opacity:.75}
.prlist>li::before{background:var(--mut);opacity:.5}
.dirp{display:none}
.dapps{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));
  margin:14px 0 4px;align-items:start}
.dapp{padding:14px 16px}
.dah{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.dah b{font-family:var(--f-disp);font-size:14.5px;font-weight:700}
.drank{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;
  border-radius:6px;background:var(--acc);color:var(--card);font-size:11.5px;font-weight:700;flex:none}
.st.d-dobrar{background:rgba(10,143,88,.16);color:var(--ok)}
.st.d-consertar{background:rgba(180,83,9,.16);color:var(--warn)}
.st.d-manter{background:rgba(125,140,170,.16);color:var(--mut)}
.st.d-congelar{background:rgba(125,140,170,.12);color:var(--mut)}
.dapp .prlist{margin-top:6px}
.dcall{color:var(--tx)!important;font-weight:600}
.fcard[id]{scroll-margin-top:18px}
.fdet{margin-top:10px;border-top:1px solid var(--bd-soft);padding-top:9px}
.fdet>summary{cursor:pointer;list-style:none;font-family:var(--f-disp);font-size:11.5px;
  font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);
  display:flex;align-items:center;gap:7px}
.fdet>summary::-webkit-details-marker{display:none}
.fdet>summary::before{content:"›";font-size:15px;transition:transform .15s}
.fdet[open]>summary::before{transform:rotate(90deg)}
.fdet>summary:hover{color:var(--acc)}
.fdet table.t{font-size:12.5px}
.fdet table.t td,.fdet table.t th{padding:6px 10px}
.fgrid.one{grid-template-columns:1fr!important;gap:18px}
/* Cada app é um painel com profundidade: a luz entra por cima, o corpo escurece
   até a base e a borda clareia só na primeira linha. É o que separa um app do
   outro sem precisar de moldura dura. */
.fgrid.one>.fcard{position:relative;padding:0;overflow:hidden;border-radius:16px;
  border:1px solid var(--bd-soft);
  background:linear-gradient(180deg,
    color-mix(in srgb, var(--acc) 5%, var(--card)) 0%,
    var(--card) 26%,
    color-mix(in srgb, #000 7%, var(--card)) 100%);
  box-shadow:0 1px 2px rgba(0,0,0,.05), 0 10px 26px -14px rgba(0,0,0,.28)}
@media(prefers-color-scheme:dark){.fgrid.one>.fcard{
  background:linear-gradient(180deg,
    color-mix(in srgb, var(--acc) 9%, var(--card)) 0%,
    var(--card) 30%,
    #0a0c10 100%);
  box-shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 18px 40px -22px rgba(0,0,0,.9)}}
.fgrid.one>.fcard::before{content:"";position:absolute;inset:0 0 auto;height:1px;
  background:linear-gradient(90deg, transparent,
    color-mix(in srgb, var(--acc) 45%, transparent), transparent)}
.fgrid.one>.fcard>.fh{background:transparent;margin:0;padding:15px 18px 12px;
  border-bottom:1px solid var(--bd-soft)}
.fgrid.one>.fcard>.fstats{padding:12px 18px 0}
.fgrid.one>.fcard>.fcols{padding:16px 18px 6px}
.fgrid.one>.fcard>.fdet{margin:0;padding:13px 18px 16px;border-top:1px solid var(--bd-soft);
  background:color-mix(in srgb, #000 4%, transparent)}
@media(prefers-color-scheme:dark){.fgrid.one>.fcard>.fdet{
  background:rgba(0,0,0,.25)}}
.fgrid.one>.fcard>.fh b{font-size:16px;letter-spacing:-.01em}
.fgrid.one>.fcard>.fh>span{font-size:12.5px;color:var(--tx);opacity:.78;
  font-variant-numeric:tabular-nums;font-weight:500}
/* a luz no topo do painel, um pouco mais presente */
.fgrid.one>.fcard::before{height:2px;
  background:linear-gradient(90deg, transparent, var(--acc), transparent);opacity:.5}
.fcard .fmeta{font-size:12px;color:var(--mut)}
/* funil: rótulo legível, número com peso, barra com corpo */
.fs{display:grid;grid-template-columns:150px 1fr auto;align-items:center;gap:12px;
  padding:5px 0}
.fs .fl{font-size:12.5px;color:var(--tx)}
.fs .fn{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;min-width:74px;
  text-align:right}
.fb{height:9px;border-radius:999px;background:var(--bd-soft);overflow:hidden}
.fb i{display:block;height:100%;border-radius:999px}
/* retenção com leitura imediata */
.rrow{margin:0}
.rc:first-child{border-top:0;padding-top:0}
/* o rótulo é legenda; quem salta é o número, na cor da régua */
.rc b{display:block;font-family:var(--f-disp);font-size:10px;font-weight:700;
  letter-spacing:.09em;text-transform:uppercase;color:var(--mut);margin:0}
.rc .rv{display:block;font-family:var(--f-disp);font-size:21px;font-weight:800;
  letter-spacing:-.025em;line-height:1.15;margin:3px 0 2px;font-variant-numeric:tabular-nums}
.rc>b{font-family:var(--f-disp);font-size:12px;font-weight:700;letter-spacing:.04em;
  color:var(--mut)}
.rc .rv{font-family:var(--f-disp);font-size:19px;font-weight:800;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums}
.rc .rb{display:block;font-size:11.5px;color:var(--mut)}
/* achados: mais ar e marcador claro */
.fnds li{font-size:12.5px;line-height:1.5;padding:4px 0 4px 16px}
.fnds li:before{width:6px;height:6px;top:.72em}
/* o detalhe convida a abrir */
.fdet>summary{font-size:11px;color:var(--acc);padding:3px 0}
.fdet>summary:hover{opacity:.82}
.fcols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;
  align-items:start}
@media(max-width:820px){.fcols{grid-template-columns:1fr;gap:12px}}
.fcol{min-width:0}
.fcol>.fnds{margin-top:0}
/* Régua de contexto do app: instalações, ativos, novos, crash-free. Antes isso
   era uma linha de texto corrido ("187 downloads/30d · WATCH · crash-free
   100%") que ninguém comparava entre cards; como números rotulados, dá pra
   varrer a coluna de cima a baixo. */
.fstats{display:flex;flex-wrap:wrap;gap:10px 26px;align-items:baseline}
.fst{display:flex;align-items:baseline;gap:7px;min-width:0}
.fstl{font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:var(--mut)}
.fst b{font-family:var(--f-disp);font-size:15px;font-weight:700;letter-spacing:-.015em;
  font-variant-numeric:tabular-nums}
.fstd{font-size:12px;font-weight:600}
.st.vd{background:rgba(125,140,170,.14);color:var(--mut)}
.fh .noasc{font-size:11.5px;font-weight:400;color:var(--warn)}
/* Cada metade do card diz o que é antes de mostrar número. */
.fgrp{margin-bottom:16px}
.fgrp:last-child{margin-bottom:0}
.fgl{display:block;font-family:var(--f-disp);font-size:10.5px;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;color:var(--mut);
  padding-bottom:7px;margin-bottom:10px;border-bottom:1px solid var(--bd-soft)}
.fcol>.fgrp>.fnds{margin-top:0}
.instrl{list-style:none;margin:9px 0 0;padding:0}
.instrl li{font-size:12.5px;line-height:1.55;color:var(--mut);padding:3px 0 3px 14px;
  position:relative;overflow-wrap:anywhere}
/* Coluna de leitura: linhas rotuladas, sem caixa. As caixas coloridas (funil
   verde, ação amarela) e o bloco expansível empilhavam quatro objetos de forma
   diferente num espaço estreito; rótulo à esquerda e texto à direita, separados
   por uma régua fina, lê de cima a baixo sem nada competindo (João, 02/10). */
.rline{display:grid;grid-template-columns:116px minmax(0,1fr);gap:16px;
  padding:12px 0;border-top:1px solid var(--bd-soft)}
.rline:first-child{border-top:0;padding-top:0}
.rlab{font-family:var(--f-disp);font-size:10.5px;font-weight:700;letter-spacing:.07em;
  text-transform:uppercase;color:var(--mut);padding-top:2px}
.rbody{min-width:0}
.rbody>b{display:block;font-family:var(--f-disp);font-size:14px;font-weight:700;
  letter-spacing:-.01em;line-height:1.35}
.rnum{display:block;margin-top:3px;font-size:12px;font-weight:600;color:var(--tx);
  font-variant-numeric:tabular-nums}
.rbody>p{margin:5px 0 0;font-size:12.5px;line-height:1.55;color:var(--mut)}
.rline.act .rlab{color:var(--tx)}
.rline.mut .rlab,.rline.mut .instrl li{color:var(--mut)}
.rbody>.fnds{margin:0}
@media(max-width:1180px){.rline{grid-template-columns:1fr;gap:6px}
  .rline .rlab{padding-top:0}}
.instrl{list-style:none;margin:0;padding:0}
.instrl li{font-size:12.5px;line-height:1.55;color:var(--mut);padding:2px 0 2px 14px;
  position:relative;overflow-wrap:anywhere}
.instrl li::before{content:"";position:absolute;left:0;top:.72em;width:5px;height:5px;
  border-radius:50%;background:var(--bd)}
/* Os passos de loja vêm de outra fonte que os de dentro do app: barra em tom
   mais surdo pra o olho ver onde a medição troca de sistema. */
.fs .fb i.store{background:linear-gradient(90deg,
  color-mix(in srgb, var(--bar) 45%, transparent),
  color-mix(in srgb, var(--bar) 70%, transparent))}
.fsub{display:block;font-size:10.5px;font-weight:600;letter-spacing:.07em;
  text-transform:uppercase;color:var(--mut);margin-bottom:6px}
.fsub.gap2{margin-top:14px}
.lchip{font-size:10px;color:var(--mut);background:var(--bd-soft);border-radius:999px;
  padding:1px 7px;cursor:help;white-space:nowrap}
.fcols{position:relative}
@media(min-width:821px){.fcols::before{content:"";position:absolute;top:0;bottom:0;
  left:50%;width:1px;background:var(--bd-soft)}}
.fdet .ascgrid{grid-template-columns:repeat(auto-fit,minmax(118px,1fr))}
.fdetcols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;
  align-items:start}
@media(max-width:1100px){.fdetcols{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:760px){.fdetcols{grid-template-columns:1fr}}
.fdetcols>div{min-width:0;display:flex;flex-direction:column;gap:14px}
.rawbox{background:var(--bg);border:1px solid var(--bd-soft);border-radius:11px;
  padding:11px 13px;min-width:0}
.rawbox h4,.rawbox h3.team{margin:0 0 8px;font-family:var(--f-disp);font-size:10.5px;
  font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--mut)}
.rawbox h3.team .chain{text-transform:none;letter-spacing:0;font-size:11px}
.rawbox table.t{border:0;box-shadow:none;background:transparent}
.rawbox table.t th{background:transparent;border-bottom:1px solid var(--bd)}
.rawbox table.t td{border-bottom:1px solid var(--bd-soft)}
.rawbox .twrap{border-radius:0}
.rawbox .ascgrid{margin-bottom:0;grid-template-columns:repeat(auto-fit,minmax(104px,1fr))}
.rawbox .ascgrid b{font-size:14px}
.srct{float:right;font-size:9px;font-weight:700;letter-spacing:.06em;padding:2px 7px;
  border-radius:999px;background:var(--bd);color:var(--mut);text-transform:uppercase}
.s-asc{background:rgba(125,140,170,.16);color:var(--tx)}
.s-firebase{background:rgba(180,83,9,.14);color:var(--warn)}
.noasc{background:rgba(180,83,9,.14);color:var(--warn);border-radius:999px;padding:1px 8px;
  font-size:10.5px;font-weight:600}
.convwhy{display:block;font-size:10.5px;color:var(--mut);margin-top:1px}
.rawbox .rate{padding:1px 7px;border-radius:999px;font-size:12.5px}
.featname{display:block;font-family:var(--f-mono);font-size:11.5px;margin-bottom:3px}
.featbar{display:block;height:4px;border-radius:999px;background:var(--bd-soft);overflow:hidden}
.featbar i{display:block;height:100%;border-radius:999px;
  background:linear-gradient(90deg, color-mix(in srgb, var(--acc) 70%, transparent), var(--acc))}
.legacyp{margin:8px 0 0;font-size:12px;color:var(--mut);line-height:1.7}
.legacyp code{font-size:11px}
.rawbox .ascgrid>div{background:var(--card)}
.fdet{margin-top:14px;border-top:1px solid var(--bd);padding-top:12px}
.fdet[open]>summary{margin-bottom:12px;color:var(--acc)}
.t .thsub{font-size:9.5px;font-weight:600;letter-spacing:.03em;color:var(--mut);
  text-transform:none}
.t .rate{padding:1px 8px;border-radius:999px;font-variant-numeric:tabular-nums}
.t .rate.good{background:rgba(10,143,88,.16);color:var(--ok)}
.t .rate.mid{background:rgba(180,83,9,.14);color:var(--warn)}
.t .rate.low{background:rgba(208,47,47,.13);color:var(--down)}
.thin{font-size:10.5px;color:var(--mut);background:var(--bd-soft);border-radius:999px;
  padding:1px 7px;cursor:help;white-space:nowrap}
.sbx{font-size:12px;color:var(--warn);background:rgba(180,83,9,.12);border-radius:999px;
  padding:1px 8px;cursor:help;white-space:nowrap}
.sbxnote{font-size:11.5px;color:var(--warn);background:rgba(180,83,9,.10);
  border:1px solid rgba(180,83,9,.25);border-radius:9px;padding:7px 10px;margin:0 0 10px}
.actv{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 9px;margin:0 0 10px;
  padding:8px 11px;border-radius:10px;background:var(--bd-soft)}
.actvt{font-family:var(--f-disp);font-size:10px;font-weight:800;letter-spacing:.09em;
  text-transform:uppercase;color:var(--mut)}
.actv b{font-family:var(--f-disp);font-size:15px;font-variant-numeric:tabular-nums}
.actvw{flex-basis:100%;font-size:11px;color:var(--mut)}
.fover{font-size:10.5px;color:var(--warn);background:rgba(180,83,9,.12);border-radius:999px;
  padding:1px 7px;cursor:help;white-space:nowrap}
.hspan{display:inline-block;margin-left:10px;font-size:10.5px;font-weight:600;letter-spacing:.04em;
  text-transform:none;color:var(--mut);background:var(--bd-soft);padding:2px 9px;border-radius:999px;
  vertical-align:2px}
.ascspan{font-size:11px;color:var(--mut);margin:2px 0 7px}
.ascgrid{display:grid;gap:7px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
  margin-bottom:10px}
.ascgrid>div{background:var(--bd-soft);border-radius:9px;padding:7px 10px;min-width:0}
.ascgrid span{display:block;font-size:10px;color:var(--mut);text-transform:uppercase;
  letter-spacing:.04em}
.ascgrid b{font-family:var(--f-disp);font-size:15px;font-variant-numeric:tabular-nums}
.fcard[id]:target{border-color:var(--acc);box-shadow:0 0 0 2px rgba(125,140,170,.3),var(--sh-up)}
/* ---------- acabamento: luz e profundidade (01/10) ----------
   Gradiente é usado onde tem função: a luz no topo dá direção à página, a barra
   do funil ganha volume, e o cabeçalho de cada app se separa do conteúdo. Fundo
   chapado em tudo o resto, para os números seguirem sendo o que salta. */
body{background:
  radial-gradient(1100px 420px at 12% -8%, color-mix(in srgb, var(--acc) 11%, transparent), transparent 70%),
  radial-gradient(900px 360px at 88% -4%, color-mix(in srgb, var(--ok) 7%, transparent), transparent 72%),
  var(--bg);
  background-attachment:fixed}
h1{background:linear-gradient(100deg, var(--tx) 30%, color-mix(in srgb, var(--acc) 72%, var(--tx)));
  -webkit-background-clip:text;background-clip:text;color:transparent}

h2{position:relative}
h2::after{content:"";position:absolute;left:0;top:0;width:44px;height:2px;
  background:linear-gradient(90deg, var(--acc), transparent)}
h2:first-of-type::after,h1+h2::after,.sub+h2::after{display:none}
a.tile{background:linear-gradient(170deg, color-mix(in srgb, var(--card) 100%, transparent),
  color-mix(in srgb, var(--acc) 5%, var(--card)))}
.fb i,.fs .fb i{background:linear-gradient(90deg,var(--bar),var(--bar2))}
.fgrid.one>.fcard>.fh{background:linear-gradient(180deg,
  color-mix(in srgb, var(--acc) 7%, var(--card)), var(--bd-soft))}
.ascgrid b,.tile .tv{background:linear-gradient(180deg, var(--tx), color-mix(in srgb, var(--tx) 72%, var(--mut)));
  -webkit-background-clip:text;background-clip:text;color:transparent}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
/* ---------- celular (14/10) ----------
   No iPhone a página nunca rola de lado: grade cede a largura pros filhos, tabela
   rola dentro do .twrap, o menu rola dentro da própria faixa. Quadro e big numbers
   seguem numa linha só com rolagem horizontal, em qualquer largura (João, 14/10). */
.cols>*,.cols2>*,.grid>*,.grid4>*,.dapps>*,.fgrid>*{min-width:0}
.board .hrow,.tiles{flex-wrap:nowrap!important;overflow-x:auto}
#md table{display:block;max-width:100%;overflow-x:auto}
#md p,#md li,#md :not(pre)>code{overflow-wrap:anywhere}
img,video{max-width:100%}
@media(max-width:860px){
  .topin{width:calc(100vw - 28px)}
}
@media(max-width:620px){
  /* header do celular (24/10): UMA linha de 52 px — cavalo + abas que rolam de
     lado com encaixe; a data sai do header fixo e vira a 1ª linha da página. */
  .topin{flex-wrap:nowrap;gap:2px;padding:4px 0;
    padding-left:env(safe-area-inset-left,0px)}
  a.brand{flex:none;min-width:44px;min-height:44px;justify-content:center;gap:0}
  a.brand .mark{width:24px;height:24px}
  a.brand .bname{display:none}
  .stamp{display:none}
  .navs{flex:1 1 auto;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;
    -webkit-overflow-scrolling:touch;scroll-snap-type:x proximity;overscroll-behavior-x:contain;
    margin-right:-14px;padding:0 max(14px,env(safe-area-inset-right,0px)) 0 2px;gap:2px;
    -webkit-ma[redigido]:linear-gradient(90deg,#000 calc(100% - 28px),transparent);
    ma[redigido]:linear-gradient(90deg,#000 calc(100% - 28px),transparent)}
  .navs::-webkit-scrollbar{display:none}
  a.nav{flex:none;scroll-snap-align:start;min-height:44px;padding:0 12px;gap:6px;font-size:14px}
  a.nav .flw-mon{width:24px;height:24px}
  .mstamp{display:block;margin:-10px 0 10px;font-size:11.5px;color:var(--mut)}
  .mstamp+style+h2,.mstamp+h2{margin-top:6px}
  div.own{padding:6px 12px;margin:0 0 12px;gap:10px}
  div.own img.flw-mon{width:40px;height:40px}
  details.pk-legend{padding:0 14px;margin-bottom:12px}
  details.pk-legend>summary{min-height:44px;padding:11px 0}
  body{font-size:15px;overflow-wrap:break-word}
  h1{font-size:24px}
  .sub,.card p,.row,.dirp,.prw,.nots li,.dirlist>li{font-size:14px}
  table.t td,table.t th{font-size:13.5px}
  table.t td:first-child,table.t th:first-child{min-width:148px}
  #md{padding:16px 14px}
  .board{padding:12px 0 14px;margin-left:0;margin-right:0}
  .boardh{padding:0 14px}
  .board .hrow{padding:12px 14px 12px;scroll-padding:0 14px}
  a.more,.btn{display:inline-flex;align-items:center;min-height:44px}
  .row{min-height:44px}
  .del{min-width:44px;min-height:44px;opacity:.7}
  .iid{position:relative}
  .iid::after{content:"";position:absolute;inset:-12px -8px}
  .fdet>summary,details>summary{min-height:44px}
  .fs{grid-template-columns:minmax(0,118px) minmax(0,1fr) auto}
  .leak,.fnote{margin-left:0}
  /* quadro no celular: rolagem lateral, como quadro (João 14/10, e de novo 25/10: "deixa como quadro que eu
     consigo fazer scroll horizontal, ficou muito extenso na vertical" — o empilhamento de 25/10 saiu).
     Fazer abre o quadro, com o item em trabalho no topo; Backlog fica por último. */
  .board .hcol{order:3}.board .hcol.k-do{order:1}.board .hcol.k-wait{order:2}.board .hcol.k-backlog{order:4}
  .row.working .vwork{flex-wrap:wrap}
  .row .sub{white-space:normal}
  /* big numbers em grade de 2 no celular: nada cortado */
  .tiles{display:grid!important;grid-template-columns:1fr 1fr;overflow-x:visible!important}
  .tiles>.tile,a.tile{min-width:0!important;padding:10px 12px}
  .tile .tv{font-size:clamp(17px,5.4vw,22px)!important;white-space:normal}
}

html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
a.nav.on{background:color-mix(in srgb,var(--bar) 13%,transparent);color:var(--tx);
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--bar) 22%,transparent)}
a.nav .flw-mon{transition:transform .18s ease}
a.nav:hover .flw-mon{transform:translateY(-1px) scale(1.06)}
/* dono da seção: legenda calma ao lado do título, não mais um segundo título em caixa alta */
h2 .ownb,h3 .ownb{text-transform:none;letter-spacing:0;font-family:var(--f-text);font-size:12.5px;font-weight:500;vertical-align:middle}
h2 .ownb .ownp b,h3 .ownb .ownp b{font-weight:700}
div.own{border-color:var(--bd-soft);box-shadow:var(--sh);border-radius:var(--rad)}
h1+div.own{margin-top:12px}
/* big numbers que não são link (Seller) ganham o mesmo cartão dos da home */
.tiles>div.tile{background:linear-gradient(170deg,var(--card),color-mix(in srgb,var(--acc) 5%,var(--card)));
  border:1px solid var(--bd-soft);border-radius:var(--rad);padding:13px 17px;box-shadow:var(--sh);min-width:148px}
@media(max-width:620px){
  .mstamp{margin:-6px 0 12px}
  .card,a.tile,.tiles>div.tile,.row,.fcard,div.own,.board,table.t,.twrap,#md{border-radius:16px}
  .tiles>div.tile{min-width:0;padding:10px 12px}
  h1{font-size:26px;line-height:1.2}
  h2{margin-top:28px}
}

 | APPROVED, rodando desde 20/10 07:42 \u00b7 fim 18/01 |\n| 3 | WTMP \u00b7 ppo-02 | panorama-ppo (1\u00ba ponta a ponta) | 9 (A6 incl. 1 elemento, B1, C2) | 3,60-4,95 | 7 pedidos \u00b7 4 reprova\u00e7\u00f5es | 4d 3h33 (ativo ~7h) | WAITING_FOR_REVIEW desde 25/10 03:38 \u00b7 auto_start |\n| 4 | Cloak \u00b7 ppo-08 | panorama-ppo | 8 (A2 B3 C3) | 3,20-4,40 | 2 reprova\u00e7\u00f5es \u2192 descartado | \u2014 | SUPERSEDED (nunca subiu) |\n| 5 | Cloak \u00b7 ppo-09 | panorama-ppo, arte da loja | 2 (B, C \u2014 n\u00e3o usadas) | 0,80-1,10 | 6 pedidos | \u2014 | valida\u00e7\u00e3o 2 publicada 19:01, sem OK |\n| 6 | iPhotos \u00b7 ppo-01 | panorama-ppo | 6 (B3 C3) | 2,40-3,30 | 3 (2 de fundo) | \u2014 | DRAFT, rodada 3 do fundo esperando V1 |\n| 7 | Walk \u00b7 ppo-07 | panorama-ppo | 4 (A1 B2 C1) | 1,60-2,20 | 1 | \u2014 | DRAFT, V1 aprovada 18:11, V2 em montagem |\n| 8 | Sunrise \u00b7 ppo-02 | antigo (ChatGPT na m\u00e3o) | 0 (\u2265 6 candidatas) | 0 | ~5 rodadas de prompt | ~19h (com noite) | APPROVED, rodando desde 20/10 06:17 \u00b7 fim 18/01 |\n| 9 | Hair \u00b7 ppo-02 | antigo (ChatGPT na m\u00e3o) | 0 (5 prompts) | 0 | 3 + 1 p\u00f3s-submit | 4d 7h (esperando C) | APPROVED, rodando desde 19/10 09:32 \u00b7 fim 17/01 |\n| 10 | Meus Gastos \u00b7 ppo-02 | antigo (ChatGPT, s\u00f3 estilo) | 0 (3 panoramas) | 0 | \u2014 | mesmo dia | APPROVED, rodando desde 14/10 11:30 \u00b7 50% \u00b7 fim 12/01 |\n| 11 | Walk \u00b7 ppo-06 | antigo | 0 | 0 | \u2014 | nunca rodou (Jo\u00e3o apagou o item 18/10) | \u2014 |\n\n**Totais do fluxo novo (5 apps, 6 pastas):**\n- 49 gera\u00e7\u00f5es (48 panoramas + 1 elemento) \u00b7 US$ 19,35-26,65 estimado.\n- Usadas no set final: 12 de 49 (Sueca 3, WTMP 4, Walk 3, iPhotos 2 da rodada 3, Cloak 0) \u2192 **76% das gera\u00e7\u00f5es descartadas**.\n- Mediana por app: 9 gera\u00e7\u00f5es (Walk 4, iPhotos 6, WTMP 9, Cloak 10, Sueca 20) \u2014 alvo da skill: 3.\n- Descarte por causa (37): edi\u00e7\u00e3o pelo GPT 17 (Sueca) \u00b7 dire\u00e7\u00e3o de arte reprovada 16 (Cloak 08 8, WTMP A 4, iPhotos 4 \u2014 a rodada 3 do iPhotos ainda espera V1) \u00b7 celular fino 1 (WTMP C) \u00b7 gate 2b 1 (Walk B v1) \u00b7 geradas antes de decidir o tipo de variante 2 (Cloak 09).\n- Agentes Claude no mesmo per\u00edodo (todos os PPOs, inclusive Calc+): `ppo-localizer` 19 runs \u00b7 17h27 somadas \u00b7 US$ 106 \u00b7 mediana 19m30 | `ppo-adjuster` 17 \u00b7 3h18 \u00b7 US$ 47 | `ppo-prompt-writer` 14 \u00b7 1h38 \u00b7 US$ 30 | `print-copywriter` 13 \u00b7 1h53 \u00b7 US$ 27 | `print-text-fitter` 9 \u00b7 1h12 \u00b7 US$ 19. Custo Claude \u2248 10\u00d7 o GPT (plano Max, n\u00e3o \u00e9 caixa, mas \u00e9 tempo).\n- Prints que subiram: Sueca 375 \u00b7 Neon 1.170 \u00b7 WTMP 1.755 \u00b7 Sunrise 1.170 \u00b7 Hair 585 \u00b7 Meus Gastos ~900.\n- Mensagens de cobran\u00e7a do Jo\u00e3o (\"e a\u00ed\", \"subiu?\", \"demora\", \"n\u00e3o refletiu\"): WTMP 10 \u00b7 Sueca 5 \u00b7 Cloak 3 \u00b7 Hair 1 \u00b7 Sunrise 1 \u00b7 iPhotos/Walk 0.\n- \"Qual o nome da skill disso?\": 3 vezes (19/10 Sunrise, 21/10 Sueca/WTMP, 25/10 WTMP).\n- `results/` preenchido: 0 de 6 que subiram \u00b7 `post_mortem.md` preenchido: 0 de 11 \u00b7 `meta.cadence` (D7/D14/D28): 0 de 5 rodando.\n\n---\n\n## 1. Sueca Drink \u00b7 ppo-02 (`Apps/recovery/ios/SuecaDrink/.../2026-10-19_ppo-02_gpt-abc`)\n- **Timeline:** pedido 20/10 20:19 (\"tenta gerar 3 e me mandar no site\") \u2192 gera\u00e7\u00f5es 20:23 \u2192 V1 pt-BR no site 20:33 \u2192 ajustes 20:44-21:43 \u2192 \"aprovado, pode subir\" 21:58 \u2192 11 idiomas por agente (A 1h34, B 37 min, C 43 min, paralelo) \u2192 Jo\u00e3o exige a V2 00:09 (\"eu quero uma p\u00e1gina com as imagens geradas\") \u2192 p\u00e1gina `sueca-ppo-02-prints` 00:14 \u2192 \"sobe\" 00:13 \u2192 upload 00:14 \u2192 submit ~00:33 21/10 \u2192 Apple aprovou, start 21/10 09:56.\n- **Pedido \u2192 submit:** 4h14 \u00b7 OK final \u2192 submit: 2h35.\n- **GPT:** 20 gera\u00e7\u00f5es (A3 B11 C6), US$ 8-11 \u2014 origem do LEARNINGS #117. 3 primeiras com prompt truncado no `;` (descartadas, `_discarded_truncated_prompt/`).\n- **Pedidos do Jo\u00e3o (8):**\n  - C: \"esse coringa t\u00e1 demon\u00edaco, o terceiro \u00e9 sobre assinar a premium, isso nunca pode ser uma feature\" \u2192 refeito (2 gera\u00e7\u00f5es).\n  - B: \"troca o 1 cavalo pequenino ... a escolha me parece \u00f3bvia\" \u2192 \"a compara\u00e7\u00e3o com o pato de borracha tava legal, s\u00f3 muda o outro animal\" \u2192 \"faz o gorila fazendo cara de esperto\" \u2192 \"pode ser a piscada mesmo\" \u2192 v6 escolhida (B = 11 gera\u00e7\u00f5es, vers\u00f5es \"en\" sa\u00edram com OUTRO gorila).\n  - Ordem: A 1\u21944, B 3\u21944 (\"a do casamento vende mais\"), C 3\u21945.\n  - \"nos textos do app, pra cada idioma trocar o idioma dos prints? ... s\u00f3 quando n\u00e3o zuar a imagem\".\n- **Regras que nasceram aqui:** \"o chat s\u00f3 precisa gerar a panor\u00e2mica, de resto tem que ser voc\u00ea\"; \"n\u00e3o queria um custo de 100 reais por PPO\"; Premium nunca \u00e9 assunto.\n- **Upload/verify:** 1 FAIL 409 DUPLICATE em A/en-US (1\u00aa tentativa criou o locale \u2192 tratamento com 2 en-US, um com arte antiga); ~65 sets presos em `UPLOAD_COMPLETE` > 30 min; dedupe apagou prints bons (checksum vazio = \"n\u00e3o \u00e9 nosso\"); verificador acusou 33 falsos \"sem 5,5\"\" e truncou em 30; la\u00e7o de verifica\u00e7\u00e3o leu erro de env var como \"limpo\" (#119).\n- **Estado:** rodando; `meta.json` ainda diz `WAITING_FOR_REVIEW`; sem `cadence` \u2192 D7 (28/10) n\u00e3o agendado.\n\n## 2. Neon Glow / AirDraw \u00b7 ppo-03 (`Apps/recovery/ios/AirDraw/.../2026-10-19_ppo-03_gpt-abc`)\n- **Fluxo antigo:** prompt meu \u2192 Jo\u00e3o gera no ChatGPT \u2192 manda link.\n- **Timeline:** 19/10 19:35 \"gostei desse (A) ... o b n\u00e3o gostei pq tem crian\u00e7a e \u00e9 tudo meio igual\" \u2192 20:18 B v2 aprovado \u2192 20:19 \"quero outras 2 propostas, uma mais clean\" (D, E) \u2192 22:52 \"mais minimalis ra/check \u2192 quem faz \u2192 como verificar.\n\n1. **Ler o hist\u00f3rico de PPO do app antes de escolher o tipo de variante.**\n   - Problema: Cloak 08 \u2014 a p\u00e1gina padr\u00e3o era o vencedor do PPO 08/2026; gerei arte nova 2\u00d7 (10 gera\u00e7\u00f5es, ~6h, 2 reprova\u00e7\u00f5es) at\u00e9 o Jo\u00e3o: \"n\u00e3o me parece que isso converteria mais do que os prints que tem hoje\". O ppo-09 variou o vencedor sem GPT e foi aprovado em 1 rodada.\n   - Passo: Fase 0.1c \u2014 `new_experiment.py` l\u00ea `experiments/*/meta.json` do app (`winner`, `promoted`) + idade da arte por tamanho e grava `meta.base.prior_winner`. Se a p\u00e1gina padr\u00e3o \u00e9 vencedor de PPO: B/C nascem como varia\u00e7\u00e3o do vencedor (telas traduzidas, paleta \u00fanica/light, t\u00edtulo) e GPT s\u00f3 se o Jo\u00e3o pedir; se as telas do controle est\u00e3o em ingl\u00eas nos outros idiomas, \"telas traduzidas\" \u00e9 tratamento autom\u00e1tico e barato.\n   - Quem: script (`new_experiment.py`) + coordenador.\n   - Verificar: rodar no Cloak \u2192 `meta.base.prior_winner = Panorama B 2026-08-07`, plano sem `gen_panorama.py`.\n2. **Pergunta lateral n\u00e3o encerra o fluxo; todo fim de turno deixa o pr\u00f3ximo passo no site.**\n   - Problema: WTMP \u2014 \"para tudo e responde\" (custo) \u2192 respondi e parei; 4h48 sem nada at\u00e9 \"E a\u00ed, subiu?\". 19 mensagens de cobran\u00e7a em 3 PPOs.\n   - Passo: regra no topo da skill \u2014 responder e retomar no MESMO turno; s\u00f3 \"para\"/\"espera\" expl\u00edcito encerra; antes de devolver a vez, `ab_report.py --state <slug> awaiting|working --note \"pr\u00f3ximo: <passo> \u00b7 previs\u00e3o HH:MM\"`.\n   - Quem: coordenador; o hook `lab-working.sh` acusa turno encerrado com item em `working` sem `awaiting`.\n   - Verificar: grep de \"e a\u00ed|subiu?|demora\" do Jo\u00e3o por PPO nos transcripts \u2192 alvo 0.\n3. **Banco de artes aprovadas como r\u00e9gua do prompt e do gate (antes da V1).**\n   - Problema: 7 reprova\u00e7\u00f5es de dire\u00e7\u00e3o de arte (WTMP A \u00d73, Cloak \u00d72, iPhotos \u00d72), 15 gera\u00e7\u00f5es jogadas fora; o Jo\u00e3o teve que dizer \"olha o WTMP, ele \u00e9 a base\".\n   - Passo: `templates/panorama-ppo/approved/` com C\u00d3PIA pr\u00f3pria (lab auto-contido) das panoramas que ele aprovou \u2014 WTMP A v6, Sueca B v6, Neon A/B/F, Walk A/B/C, Hair B v2 \u2014 cada uma com a frase dele e o porqu\u00ea. O `ppo-prompt-writer` cita qual aprovada cada tratamento segue (linguagem, n\u00e3o conte\u00fado); o `gen_panorama.py` anexa 1 delas como ref de ESTILO; o gate da Fase 2b compara tratamento \u00d7 banco \u00d7 controle \u00d7 l\u00edderes e reprova antes da V1.\n   - Quem: coordenador monta o banco (1\u00d7, depois a cada aprova\u00e7\u00e3o nova); `ppo-prompt-writer`; gate na Fase 2b.\n   - Verificar: `meta.decisions` com reprova\u00e7\u00e3o do Jo\u00e3o na V1 por PPO \u2192 alvo \u2264 1; eval no prompt-writer exigindo a linha \"segue: approved/<arquivo>\".\n4. **Paleta, fundo e contraste decididos e medidos ANTES de gerar.**\n   - Problema: iPhotos \u2014 2 rodadas s\u00f3 de fundo (4 gera\u00e7\u00f5es, ~1h): \"preto com vermelho parece porno\", \"horr\u00edvel ... contraste\". Cloak 09: \"um de cada cor, fulero\".\n   - Passo: o `ppo-prompt-writer` grava `meta.treatments.<T>.palette = {bg, title, ratio, fonte_lider}`; `gen_panorama.py` recusa gerar sem esse bloco ou com ratio < 7:1 (o `cut.py` j\u00e1 mede depois; mover a r\u00e9gua pra antes da chamada paga). Uma paleta por set.\n   - Quem: agente + script.\n   - Verificar: `gen_panorama.py` com prompt sem palette \u2192 exit \u2260 0 (teste no `test_cut.py` ou novo `test_gen_guard.py`).\n5. **Medir os 5 celulares por script, n\u00e3o por agente.**\n   - Problema: iPhotos 1h34 e Walk 31 min de agente general-purpose medindo cortes; Cloak: \"a detec\u00e7\u00e3o autom\u00e1tica ficou ruidosa por causa do fundo escuro, ent\u00e3o me\u00e7o pela grade\".\n   - Passo: `grid.py --auto` detecta o aro (gradiente + prior das 5 posi\u00e7\u00f5es centradas em 1/10, 3/10 \u2026) e escreve `cuts.json`; agente s\u00f3 quando sai \u2260 0.\n   - Quem: script.\n   - Verificar: rodar nas 18 panoramas da semana \u2192 \u00b18 px do `cuts.json` aprovado, < 2 min cada.\n6. **Mac acordado em fase longa (localiza\u00e7\u00e3o e upload).**\n   - Problema: Cloak 09 \u2014 localizer 45 min de trabalho levou ~11h (Mac na bateria, Idle Sleep 04:26; o modo servidor s\u00f3 segura na tomada).\n   - Passo: antes da Fase 5/6, `pmset -g batt`; na bateria \u2192 status no site \"na bateria: plugue pra eu seguir\" + `now.py set --working`, nunca seguir calado.\n   - Quem: coordenador.\n   - Verificar: `pmset -g log | grep \"Idle Sleep\"` vazio durante runs de `ppo-localizer`.\n7. **Status do site s\u00f3 muda depois do remoto conferido.**\n   - Problema: 5 vezes o Jo\u00e3o viu estado velho (cache, \"pronto pra revis\u00e3o\" com ajuste pendente, \"trabalhando\" depois de acabar).\n   - Passo: pedido de ajuste \u2192 `--state working` ANTES de chamar o `ppo-adjuster`; `awaiting` s\u00f3 depois de `publish_site.sh` + curl achar o hash da imagem nova no remoto (`publish_site.sh --expect <hash>`).\n   - Quem: coordenador + script.\n   - Verificar: zero mensagens \"n\u00e3o refletiu / t\u00e1 igual no site\" no pr\u00f3ximo PPO.\n8. **Localizar s\u00f3 a gera\u00e7\u00e3o aprovada, com trava por hash; escopo fixo desde a Fase 0.**\n   - Problema: WTMP \u2014 A localizado 2\u00d7 pra 38 idiomas (~70 min), 3 localizers en-US perdidos quando a V1 virou pt-BR, idiomas 39 \u2192 3 \u2192 39.\n   - Passo: `meta.validation1.approved[T] = md5 da panorama`; o `ppo-localizer` recusa se `cuts.json[T].file` \u2260 aprovado; tratamento regenerado depois da aprova\u00e7\u00e3o invalida a localiza\u00e7\u00e3o (apaga `treatments/<T>`). Idiomas = `store_sets.json` inteiro, sem exce\u00e7\u00e3o (j\u00e1 \u00e9 regra desde 24/10).\n   - Quem: script (checagem no localize) + agente.\n   - Verificar: rodar o localizer com panorama n\u00e3o aprovada \u2192 exit \u2260 0.\n9. **Leituras agendadas pra TODO PPO rodando e `meta.json` sincronizado com a ASC.**\n   - Problema: 5 rodando (Hair, Meus Gastos, Sunrise, Neon, Sueca) sem `meta.cadence`; D7 do Meus Gastos (21/10) passou; Hair D7 = 26/10. 3 metas dizem \"em review\" com o teste rodando. `ppo_autostart.py --scan` s\u00f3 olha `auto_start: true`.\n   - Passo: `ppo_reading.py adopt --scan` em todo `/refresh-lab-data` \u2014 todo `meta.json` com experiment_id: l\u00ea estado/startDate da ASC, grava `meta.state`, agenda D7/D14/D28 e enfileira as vencidas pro `ppo-checkpoint`.\n   - Quem: script + `ppo-checkpoint`.\n   - Verificar: os 5 com `meta.cadence`; `scan.py` lista Meus Gastos D14 (28/10) e Hair D7 (26/10).\n10. **Submit s\u00f3 depois da confer\u00eancia de +1 h, cobrado pelo script.**\n    - Problema: WTMP submeteu 3 min depois do upload (sem o +1 h da Fase 6.4); o re-clone de prints herdados chega horas depois (#35) e depois de APPROVED n\u00e3o d\u00e1 pra trocar set (409).\n    - Passo: `submit_review.py` recusa se `upload_state.json` n\u00e3o tem `verify_sets` LIMPO com \u2265 55 min depois do \u00faltimo upload; enquanto espera, site mostra \"submit \u00e0s HH:MM\".\n    - Quem: script.\n    - Verificar: caso novo no `ppo_tools/test_upload_guards.py`.\n11. **V2 com apresenta\u00e7\u00e3o por idioma antes de subir** \u2014 J\u00c1 VIROU C\u00d3DIGO (25/10): `presentation.py` + guarda `validation2.py` no uploader + `test_upload_guards.py`.\n    - Problema: Sueca (V2 s\u00f3 depois de \"eu quero uma p\u00e1gina com as imagens geradas\"), WTMP (subiu sem V2), Walk (quase).\n    - Verificar: o 1\u00ba upload do Walk ou do Cloak 09 recusa sem `--approve`.\n12. **\"O que decidir\" com no m\u00e1ximo 2 itens, s\u00f3 o que \u00e9 dele e ainda n\u00e3o foi decidido.**\n    - Problema: power check perguntado depois do \"tira esse c\u00e1lculo, n\u00e3o ligo\" (20/10); \"Premium sem cadeado, ok?\" depois de \"isso n\u00e3o importa, o importante \u00e9 converter\" (19/10); \"sem pessoa (regra do lab), ok?\".\n    - Passo: power check vira 1 linha de Status, nunca pergunta; `ab_report.py --spec` avisa se `decide` > 2 ou casa com a lista de decis\u00f5es j\u00e1 tomadas (arquivo `templates/panorama-ppo/decided.json` com a frase e a data de cada uma).\n    - Quem: script + coordenador.\n    - Verificar: `report_spec.decide` \u2264 2 nos pr\u00f3ximos 3 PPOs.\n13. **Achar a skill pelo jeito que o Jo\u00e3o fala.**\n    - Problema: \"qual o nome da skill?\" 3\u00d7; sess\u00e3o do WTMP abriu o fluxo errado (\"n\u00e3o \u00e9 esse a\u00ed n\u00e3o\").\n    - Passo: description do `/panorama-ppo` com \"teste a b\", \"teste a/b\", \"ppo\", \"faz um teste pro app X\"; `/gpt-refs` e `/panorama-prints` dizem \"para teste A/B novo, use /panorama-ppo\"; o card do teste no site mostra o comando.\n    - Quem: coordenador (edi\u00e7\u00e3o de skill).\n    - Verificar: sess\u00e3o nova com \"faz um teste a b pro app X\" carrega `/panorama-ppo`.\n14. **\u00cdcone nos tratamentos (pedido de 25/10).**\n    - Restri\u00e7\u00e3o: o \u00edcone do tratamento tem que estar no bin\u00e1rio da vers\u00e3o AO VIVO (ver `ICONES.md` nesta pasta; `ppo_extras.py` l\u00ea `GET /v1/builds/{id}/icons`). Sem \u00edcone alternativo no build live, o PPO de hoje s\u00f3 testa prints.\n    - Passo: Fase 0 lista os \u00edcones alternativos do build live; sem eles, a valida\u00e7\u00e3o 1 prop\u00f5e o \u00edcone baseado nos l\u00edderes \u2265 5k pra pr\u00f3xima vers\u00e3o do app (decis\u00e3o de vers\u00e3o \u00e9 do Jo\u00e3o) e o teste segue s\u00f3 com prints.\n    - Quem: script (`ppo_extras.py plan`) + coordenador.\n    - Verificar: `meta.treatments.<T>.app_icon_name` preenchido ou `meta.icon_check = \"sem alternativo no build <N>\"`.\n15. **Custo sempre vis\u00edvel, sem ele perguntar.**\n    - Problema: custo perguntado 6\u00d7 (Sueca 2, WTMP 4).\n    - Passo: `cost.py --write-meta` depois de cada `gen_panorama.py` e linha fixa no Status (\"GPT: N gera\u00e7\u00f5es, US$ x-y\").\n    - Quem: script.\n    - Verificar: a linha existe em todo `report_spec.status`.\n\n---\n\n## 14. Passos que se mostraram in\u00fateis (ou pioraram)\n- **Code-driven como insumo obrigat\u00f3rio** (regra de 21/10, revertida 25/10): no Cloak custou 30 min de `print-screen-builder` + gate e a rodada 1 copiou as telas planas \u2192 \"sem gra\u00e7a\". Base certa = prints da loja.\n- **Lado a lado de 110 px na p\u00e1gina de valida\u00e7\u00e3o**: \"n\u00e3o ajuda mto\" (iPhotos/Walk 25/10) \u2192 trocado pela simula\u00e7\u00e3o de busca. Como gate interno pegou 1 caso (Walk B v1) \u2014 manter s\u00f3 interno.\n- **Power check como pergunta**: o Jo\u00e3o disse \"n\u00e3o ligo\" em 20/10 e ainda aparece \"roda mesmo assim?\" (iPhotos 834 dias, Walk 206 dias).\n- **Editar a panorama pelo GPT** (\"keep this exact image\"): Sueca 17 gera\u00e7\u00f5es extras, gorila diferente por idioma. J\u00e1 proibido (#117).\n- **V1 em en-US** (WTMP 21/10): 3 localizers en-US jogados fora; virou pt-BR no mesmo dia.\n- **Reduzir aos idiomas com set pr\u00f3prio** (WTMP 21/10): revertido 24/10 (\"todos os idiomas que o app suporta\").\n- **Gerar antes de decidir o tipo de variante** (Cloak 09: B/C gerados \u00e0s 03:51 e nunca usados).\n- **`post_mortem.md` s\u00f3 como esqueleto**: 0 de 11 preenchidos; `results/` vazio em 6 de 6 que subiram. N\u00e3o \u00e9 in\u00fatil, mas hoje n\u00e3o acontece \u2014 depende da Fase 7, que ningu\u00e9m dispara (ver mudan\u00e7a 9).\n\n---\n\n## 15. O que funcionou (manter)\n- Walk: 4 gera\u00e7\u00f5es, 1 ajuste por c\u00f3digo em 3 min, V1 aprovada em 38 min da publica\u00e7\u00e3o, 41 idiomas em ~25 min com 3 localizers em paralelo.\n- Ajuste por c\u00f3digo: reordenar (WTMP A, C; Walk), trocar elemento (rosto flat, ~US$ 0,20), aumentar texto da tela (+25%, 23 min, 21 idiomas).\n- Upload paralelo idempotente: WTMP 1.755 prints em 25 min, 117/117 sem falha; `ppo_slot.py` parou o PPO-01 e seguiu.\n- Feature por dado do GA4 (Hair B v2, iPhotos, Walk) \u2014 nenhuma reprova\u00e7\u00e3o por \"feature errada\" depois que entrou.\n- Telas traduzidas por c\u00f3digo: o fluxo novo entrega o que os antigos n\u00e3o entregavam (Neon/Sunrise ficaram com tela em ingl\u00eas nos 39 idiomas).\n"];</script><script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script><script>document.querySelectorAll("#md .mdpart").forEach(function(el){var R=RAWS[+el.dataset.i]||"";el.innerHTML=window.marked?marked.parse(R):"<pre>"+R.replace(/</g,"&lt;")+"</pre>";});document.querySelectorAll("#md h1,#md h2,#md h3").forEach(function(h){if(h.id)return;h.id=h.textContent.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"");});if(location.hash){var t=document.getElementById(decodeURIComponent(location.hash.slice(1)));if(t)t.scrollIntoView();}</script></div><script>
