/* ---------- camada de acabamento (01/10/2026) ----------
   Tipografia com duas vozes (display para títulos e números, texto para leitura),
   neutros com viés do azul da marca em vez de cinza puro, e profundidade por
   sombra em vez de só borda. Nada aqui renomeia classe: é uma camada por cima. */
:root{
  --f-disp:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --f-text:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --bg:#f3f5f9; --card:#ffffff; --tx:#10131a; --mut:#5a6377; --acc:#1552d8;
  --bd:#dde2ea; --bd-soft:#e8ecf3; --ok:#0a8f58; --down:#d02f2f; --warn:#b45309;
  --sh:0 1px 2px rgba(16,19,26,.05),0 2px 8px rgba(16,19,26,.04);
  --sh-up:0 2px 6px rgba(16,19,26,.07),0 10px 24px rgba(16,19,26,.07);
  --rad:14px;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#0b0d12; --card:#161a22; --tx:#eef1f7; --mut:#9aa5b8; --acc:#7aa6ff;
  --bd:#272d39; --bd-soft:#1f242e; --ok:#43d08d; --down:#ff7070; --warn:#e5a645;
  --sh:0 1px 2px rgba(0,0,0,.4); --sh-up:0 6px 22px rgba(0,0,0,.5);
}}
body{font-family:var(--f-text);font-size:14.5px;line-height:1.6;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1{font-family:var(--f-disp);font-size:27px;font-weight:800;letter-spacing:-.02em;
  text-wrap:balance;margin:0 0 2px}
h1 .mark{display:inline-block;width:28px;height:28px;vertical-align:-5px;margin-right:11px;
  background-size:contain;background-repeat:no-repeat;background-position:center}
h2{font-family:var(--f-disp);font-size:12px;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;color:var(--mut);border-top:1px solid var(--bd-soft);
  padding-top:22px;margin:32px 0 14px}
h3{font-family:var(--f-disp);letter-spacing:-.01em}
.sub{font-size:13px;color:var(--mut)}
code,.mono{font-family:var(--f-mono);font-size:12.5px}
.card,table.t,a.tile,.row,.fcard,#md{box-shadow:var(--sh);border-color:var(--bd-soft)}
.card,a.tile,.row,.fcard{border-radius:var(--rad);
  transition:box-shadow .16s ease,border-color .16s ease,transform .16s ease}
a.tile:hover,a.row:hover,.fcard:hover{box-shadow:var(--sh-up);border-color:var(--bd);
  transform:translateY(-1px)}
/* big numbers: the first thing anyone reads on the page */
.tiles{gap:12px;margin:18px 0 4px;padding-bottom:10px}
a.tile{padding:13px 17px;min-width:148px}
.tile .tl{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
  color:var(--mut)}
.tile .tv{font-family:var(--f-disp);font-size:25px;font-weight:800;letter-spacing:-.025em;
  margin-top:3px}
.tile .ts{font-size:11.5px;color:var(--mut)}
/* tables read as data, not as prose */
table.t{border-radius:var(--rad);font-variant-numeric:tabular-nums}
table.t th{font-family:var(--f-disp);font-size:11px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;background:var(--bd-soft);border-bottom:1px solid var(--bd)}
table.t td{padding:9px 13px;border-bottom:1px solid var(--bd-soft)}
table.t tbody tr:hover td,table.t tr:hover td{background:rgba(125,140,170,.06)}
.twrap{border-radius:var(--rad)}
/* buttons */
.btn{font-family:var(--f-disp);font-weight:600;font-size:13.5px;padding:9px 18px;
  border-radius:999px;box-shadow:var(--sh);transition:all .16s ease}
.btn:hover{border-color:var(--acc);box-shadow:var(--sh-up);transform:translateY(-1px)}
.pill,.st{font-family:var(--f-disp);font-weight:600;font-size:11.5px;letter-spacing:.02em}
/* status colours carry meaning, so keep them out of the accent */
.st.run,.st.appr{background:rgba(10,143,88,.14);color:var(--ok)}
.st.crit{background:rgba(208,47,47,.14);color:var(--down)}
.st.rev,.st.draft{background:rgba(180,83,9,.14);color:var(--warn)}
/* the lanes strip and any scroller get a thin, rounded bar */
.tiles,.hrow,.twrap{scrollbar-width:thin;scrollbar-color:var(--bd) transparent}
.tiles::-webkit-scrollbar,.hrow::-webkit-scrollbar,.twrap::-webkit-scrollbar{height:9px}
.tiles::-webkit-scrollbar-track,.hrow::-webkit-scrollbar-track,
.twrap::-webkit-scrollbar-track{background:transparent}
.tiles::-webkit-scrollbar-thumb,.hrow::-webkit-scrollbar-thumb,
.twrap::-webkit-scrollbar-thumb{background:var(--bd);border-radius:999px;
  border:3px solid transparent;background-clip:content-box}
.tiles::-webkit-scrollbar-thumb:hover,.hrow::-webkit-scrollbar-thumb:hover,
.twrap::-webkit-scrollbar-thumb:hover{background:var(--mut);background-clip:content-box}
.hrow{background:transparent;border:0;padding:0;border-radius:0}
.hcol{flex:0 0 clamp(280px,26vw,360px);min-width:0}
a:focus-visible,button:focus-visible,.btn:focus-visible{outline:2px solid var(--acc);
  outline-offset:2px;border-radius:8px}
.dirlist,.prlist{margin:10px 0 0;padding-left:18px;list-style:none}
.dirlist>li,.prlist>li{position:relative;margin:0 0 7px;font-size:13.5px;line-height:1.5;
  color:var(--tx)}
.prlist>li{color:var(--mut);font-size:13px;margin-bottom:5px}
.dirlist>li::before,.prlist>li::before{content:"";position:absolute;left:-14px;top:.62em;
  width:5px;height:5px;border-radius:50%;background:var(--acc);opacity:.75}
.prlist>li::before{background:var(--mut);opacity:.5}
.dirp{display:none}
.dapps{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));
  margin:14px 0 4px;align-items:start}
.dapp{padding:14px 16px}
.dah{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.dah b{font-family:var(--f-disp);font-size:14.5px;font-weight:700}
.drank{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;
  border-radius:6px;background:var(--acc);color:#fff;font-size:11.5px;font-weight:700;flex:none}
.st.d-dobrar{background:rgba(10,143,88,.16);color:var(--ok)}
.st.d-consertar{background:rgba(180,83,9,.16);color:var(--warn)}
.st.d-manter{background:rgba(125,140,170,.16);color:var(--mut)}
.st.d-congelar{background:rgba(125,140,170,.12);color:var(--mut)}
.dapp .prlist{margin-top:6px}
.dcall{color:var(--tx)!important;font-weight:600}
.fcard[id]{scroll-margin-top:18px}
.fdet{margin-top:10px;border-top:1px solid var(--bd-soft);padding-top:9px}
.fdet>summary{cursor:pointer;list-style:none;font-family:var(--f-disp);font-size:11.5px;
  font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);
  display:flex;align-items:center;gap:7px}
.fdet>summary::-webkit-details-marker{display:none}
.fdet>summary::before{content:"›";font-size:15px;transition:transform .15s}
.fdet[open]>summary::before{transform:rotate(90deg)}
.fdet>summary:hover{color:var(--acc)}
.fdet table.t{font-size:12.5px}
.fdet table.t td,.fdet table.t th{padding:6px 10px}
.fgrid.one{grid-template-columns:1fr!important}
.actv{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 9px;margin:0 0 10px;
  padding:8px 11px;border-radius:10px;background:var(--bd-soft)}
.actvt{font-family:var(--f-disp);font-size:10px;font-weight:800;letter-spacing:.09em;
  text-transform:uppercase;color:var(--mut)}
.actv b{font-family:var(--f-disp);font-size:15px;font-variant-numeric:tabular-nums}
.actvw{flex-basis:100%;font-size:11px;color:var(--mut)}
.fover{font-size:10.5px;color:var(--warn);background:rgba(180,83,9,.12);border-radius:999px;
  padding:1px 7px;cursor:help;white-space:nowrap}
.gap{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;margin-top:11px;
  padding:9px 12px;border-radius:10px;background:rgba(180,83,9,.10);
  border:1px solid rgba(180,83,9,.25)}
.gapt{font-family:var(--f-disp);font-size:10px;font-weight:800;letter-spacing:.09em;
  text-transform:uppercase;color:var(--warn)}
.gap b{font-size:13.5px}
.gapn{font-size:12.5px;color:var(--tx);font-variant-numeric:tabular-nums}
.gapw{flex-basis:100%;font-size:11.5px;color:var(--mut)}
.hspan{display:inline-block;margin-left:10px;font-size:10.5px;font-weight:600;letter-spacing:.04em;
  text-transform:none;color:var(--mut);background:var(--bd-soft);padding:2px 9px;border-radius:999px;
  vertical-align:2px}

<body><div class="wrap"><p class="sub" style="font-size:12px;margin:0 0 14px">Exportado em 2026-10-01 15:57 · fonte: Lab Hub local</p><p class="sub"><a href="../index.html">← hub</a> · <code>_GambitStudio/aso/reference/research-2026-09-aso.md</code></p><div id="md"></div><script>const RAW="# ASO iOS \u2014 estado da arte set/2026 (varredura 2026-09-27)\n\n> Complementa `aso-ranking-playbook.md` (varredura ago/2026). Tags de confian\u00e7a: [Apple oficial] \u00b7 [estudo com dados] \u00b7 [opini\u00e3o de vendor] \u00b7 [anedota]. Datas = publica\u00e7\u00e3o da fonte.\n\n## Achados\n\n1. **S\u00f3 4 campos entram na relev\u00e2ncia textual: name, subtitle, keywords e categoria prim\u00e1ria. Description N\u00c3O \u00e9 indexada.** Apple diz que o ranking = relev\u00e2ncia textual + comportamento (\"downloads, ratings and reviews, and more\") + categorias. Tags s\u00e3o \"geradas por LLM a partir da metadata\". [Apple oficial] \u2014 [Apple: App Store Search](https://developer.apple.com/app-store/search/) (p\u00e1gina viva, 2026). AppTweak confirma description fora do ranking ([Ranking factors, 2026-01-28](https://www.apptweak.com/en/aso-blog/app-store-ranking-factors)) [opini\u00e3o de vendor].\n\n2. **Busca = ~65% dos downloads; 463,6 M de contas buscam por semana.** Apple (jan/2026): \"nearly 65 percent of downloads happening directly after a search\". Transparency Report 2025: 892,7 M visitantes/semana, 929,8 M downloads/semana, **2,05 B redownloads/semana**, 164.436 apps/semana no top 10 de \u22651.000 buscas. [Apple oficial] \u2014 [Transparency Report 2025](https://www.apple.com/legal/app-store/transparency/2025/) \u00b7 [cita\u00e7\u00e3o via MacRumors, 2026-01-23](https://www.macrumors.com/2026/01/23/more-app-store-ads-coming-soon/).\n\n3. **Desde 03/03/2026 h\u00e1 um 2\u00ba slot de an\u00fancio dentro dos resultados de busca** (UK/JP primeiro, EUA at\u00e9 fim de mar\u00e7o; iOS 26.2+). Org\u00e2nico desce uma posi\u00e7\u00e3o a mais \u2014 cada impress\u00e3o org\u00e2nica #1-2 vale mais, #3+ vale menos. [Apple oficial via imprensa] \u2014 [MacRumors, 2026-01-23](https://www.macrumors.com/2026/01/23/more-app-store-ads-coming-soon/).\n\n4. **CPPs ligadas a keywords aparecem na busca org\u00e2nica (desde 30/07/2025); at\u00e9 70 CPPs/app (out/2025).** Regras oficiais: keywords v\u00eam **s\u00f3 do keyword field da \u00faltima vers\u00e3o aprovada** (n\u00e3o do name/subtitle), sele\u00e7\u00e3o **por idioma**, **sem review** para s\u00f3 atribuir keywords (a p\u00e1gina em si precisa estar aprovada e vis\u00edvel), recomenda\u00e7\u00e3o de conjuntos \u00fanicos por p\u00e1gina, e \"search traffic per custom product page\" no App Analytics. Deep link opcional (iOS 18+). [Apple oficial] \u2014 [WWDC25 sess\u00e3o 328](https://developer.apple.com/videos/play/wwdc2025/328/) \u00b7 [ASC Help: CPPs](https://www.developer.apple.com/help/app-store-connect/create-custom-product-pages/configure-multiple-product-page-versions) \u00b7 [MobileAction, 2025-08-01](https://www.mobileaction.co/blog/custom-product-pages-meet-organic-search/) [opini\u00e3o de vendor].\n\n5. **Evid\u00eancia de lift de CPP \u00e9 correlacional e majoritariamente de tr\u00e1fego pago.** AppTweak (top-1000 US, 2025): apps com CPP tiveram CVR +5,9% (games +3,5%); **61% dos top-1000 apps ainda n\u00e3o t\u00eam CPP**. O \"156%\" da Apple \u00e9 de referral/ads, n\u00e3o de busca org\u00e2nica. Ningu\u00e9m publicou teste isolando CPP org\u00e2nica. [estudo com dados] \u2014 [AppTweak CPP framework, 2025-12-04](https://www.apptweak.com/en/aso-blog/cpp-framework) \u00b7 [Phiture, 2025-08-04](https://phiture.com/asostack/keyword-based-custom-product-pages-cpps-arrive-in-app-store-connect/) lista 5 inc\u00f3gnitas abertas.\n\n6. **Captions de screenshot indexadas: evid\u00eancia FRACA.** ConsultMyApp (2025-06-16) testou 64 frases de prints de 8 apps l\u00edderes: 36 n\u00e3o rankearam, 27 j\u00e1 estavam em name/subtitle/keywords, 1 anomalia \u2192 \"no strong evidence Apple is broadly indexing screenshot titles\". Appfigures sustenta que h\u00e1 detec\u00e7\u00e3o por IA de texto desde 06/06/2025 (AppTweak viu anomalia +6 em 07-08/06); AppTweak em jan/2026: \"no official confirmation\". [estudo com dados vs opini\u00e3o de vendor] \u2014 [ConsultMyApp](https://www.consultmyapp.com/blog/-is-apple-now-indexing-screenshot-titles-on-the-app-store) \u00b7 [resumo do lado Appfigures, 2026-05-11](https://appscreenshotstudio.com/blog/how-apple-ocr-indexes-app-store-screenshot-text-2026).\n\n7. **App Store Tags (WWDC25): geradas por LLM da metadata + revis\u00e3o humana; dev pode desmarcar em App Information; aparecem ao lado das categorias na p\u00e1gina de busca e junto do app nos resultados; \"tag rooms\" com cole\u00e7\u00e3o personalizada.** At\u00e9 set/2026 nenhuma nota da Apple confirma lan\u00e7amento p\u00fablico; fontes de 2025 dizem \"s\u00f3 no beta, n\u00e3o afeta o ranking da loja p\u00fablica\". [Apple oficial (an\u00fancio) / status incerto] \u2014 [WWDC25 328](https://developer.apple.com/videos/play/wwdc2025/328/) \u00b7 [TechCrunch, 2025-06-14](https://techcrunch.com/2025/06/14/the-app-stores-new-ai-generated-tags-are-live-in-the-beta).\n\n8. **WWDC26 (08/06/2026): Creative Assets \u2014 imagem/v\u00eddeo \"Header\" no topo da p\u00e1gina E NOS RESULTADOS DE BUSCA no lugar dos screenshots; Asset Library aprova assets sem build; asset diferente por keyword via CPP; PPO passa a testar o header; Personalized Collections + App Notes (on-device, rolando em ingl\u00eas-US, \"limited number of apps\").** iOS 27 no outono/2026. [Apple oficial] \u2014 [Apple Newsroom](https://www.apple.com/newsroom/2026/06/apple-expands-app-store-capabilities-to-help-developers-grow-and-reach-new-users/) \u00b7 [WWDC26 guide](https://developer.apple.com/wwdc26/guides/app-store/) \u00b7 [sess\u00e3o 205](https://developer.apple.com/videos/play/wwdc2026/205/) \u00b7 [Phiture, 2026-06-09](https://phiture.com/blog/wwdc26-updates/).\n\n9. **Review summaries por LLM: EUA + 8 storefronts (AU, CA, IN, IE, NZ, SG, ZA, UK), atualizados continuamente. BR/ES/MX ainda fora.** Nota-resumo \u00e9 **por territ\u00f3rio**; reset na vers\u00e3o nova existe (\"use sparingly\", reviews antigas ficam). [Apple oficial] \u2014 [Apple: Ratings, reviews, and responses](https://developer.apple.com/app-store/ratings-and-reviews/).\n\n10. **Prompt nativo: at\u00e9 3\u00d7/365 dias; resposta do dev notifica o autor, que pode editar a nota; resposta edit\u00e1vel a qualquer hora.** 5.6.1: feedback \"filtered\" = manipula\u00e7\u00e3o (prompt custom proibido). [Apple oficial] \u2014 [Ratings page](https://developer.apple.com/app-store/ratings-and-reviews/) \u00b7 [Guidelines](https://developer.apple.com/app-store/review/guidelines/).\n\n11. **Responder reviews move nota: AppFollow (92,9 M reviews, 20,7 K apps, jul/25-jul/26): taxa m\u00e9dia de resposta 24,2%; Productivity 12%, Health & Sports 21%; efeito em 3 meses = +1,39\u2605 em Health & Sports; fechar 10 pp de gap de resposta \u2248 +0,3-0,5\u2605.** Acad\u00eamico (Google Play): 38,7% mudam a nota ap\u00f3s resposta (McIlroy); 4,4% sobem vs 0,7% sem resposta (Hassan). [estudo com dados, vendor] \u2014 [AppFollow, 2026-09-13](https://appfollow.io/blog/app-review-reply-rate-benchmarks-2026) \u00b7 [ACM EASE 2021](https://dl.acm.org/doi/fullHtml/10.1145/3463274.3463311).\n\n12. **Nota 4,0 \u00e9 penhasco de convers\u00e3o; 4,5+ \u00e9 a faixa que converte.** AppTweak (top-1000 US, 2025): 95% dos apps featured \u22654,0 e 65% \u22654,6. Vendors citam 4,7\u2605 convertendo 15-25% acima de 4,0 e queda de 15-20% ao cair de 4,0 para 3,9. [estudo com dados (AppTweak) / opini\u00e3o de vendor (curvas)] \u2014 [AppTweak trends 2026, 2026-07-13](https://www.apptweak.com/en/aso-blog/aso-app-store-trends-benchmarks-report) \u00b7 [screenfast](https://screenfast.app/blog/app-rating-impact-on-downloads).\n\n13. **Cross-localization (teste com keywords falsas AppTweak/Phiture, atualizado 2025-11-21):** US = en-US + **es-MX, pt-BR, fr, ru, zh-Hans, zh-Hant, ar, ko, vi**; BR = pt-BR + en-GB; MX = es-MX + en-GB; ES = es-ES + en-GB + ca; UK = en-GB + en-AU; CA = en-CA + fr-CA; AU = en-AU + en-GB; DE = de + en-GB; FR = fr + en-GB; JP = ja + en-US; KR = ko + en-GB; PT = pt-PT + en-GB; AR = es-MX + en-GB. ASC passou a 50 locales em 31/03/2026 (+11 l\u00ednguas indianas e esloveno). [estudo com dados / Apple oficial] \u2014 [AppTweak](https://www.apptweak.com/en/aso-blog/how-to-benefit-from-cross-localization-on-the-app-store) \u00b7 [Apple News, 2026-03-31](https://developer.apple.com/news/?id=97t4mt64).\n\n14. **A escala de popularidade do Apple Ads quebrou em 29/09-03/10/2025: keywords com pop >5 nos EUA ca\u00edram 77,4% (165.875 \u2192 39.254) em 4 dias.** Confirmado por MobileAction, APPlyzer, Appfigures, **Astro** (restaurou backup de in\u00edcio de out/25 + \"Monthly Search Term Rank Report\" da Apple), Phiture e Radaso. AppTweak (ago/2026): \"a Search Popularity of 5 reflects how a keyword is classified by the App Store, not how many people are actually searching for it\" e lan\u00e7ou estimativa pr\u00f3pria (11/08/2026). [estudo com dados / vendor] \u2014 [RespectASO, 2026-04-25](https://respectaso.com/blog/apple-search-ads-popularity-unreliable-aso-keyword-data/) \u00b7 [Astro no X, 2025-10-08](https://x.com/TryAstroApp/status/1975851217323692474) \u00b7 [AppTweak, 2026-08-27](https://help.apptweak.com/en/articles/15921268-apptweak-introduces-new-keyword-volume-estimate-for-aso).\n\n15. **Apple Ads \u2014 benchmarks:** AppTweak (3.500 apps, US$1 B, 2025): CPT mediano $0,92, CPI $1,80, TTR 7,4%, CR 56%; **US CPI $4,06; BR $1,05 (TTR 9,2%); MX $1,10; ES $1,43**; US Utilities CPI $2,90, Health $3,83, Productivity $3,13. Adapty (1 M+ ad groups, 90 pa\u00edses, 2025-26): CPA mediano $0,51 (ponderado $1,34); US CPA $2,51/CPT $1,58/CR 62,7%; nichos: screen recorder $0,34, PDF $4,31, yoga $3,97, calorias $2,69, notes $6,53; install-to-paid Health 7,8%, Games 3,2%. Apple: >60% de convers\u00e3o no topo da busca; US$100 de cr\u00e9dito para conta nova; Basic = CPI, s\u00f3 resultados de busca, sem keywords, teto $10 k/app/m\u00eas; Advanced = CPT sem m\u00ednimo. [estudo com dados / Apple oficial] \u2014 [AppTweak, 2025-07-02](https://www.apptweak.com/en/aso-blog/apple-ads-benchmarks) \u00b7 [Adapty, 2026-07-13](https://adapty.io/blog/apple-ads-benchmarks-2026/) \u00b7 [Apple Ads: Basic vs Advanced](https://ads.apple.com/app-store/help/apple-ads-basic/0001-compare-apple-ads-solutions).\n\n16. **Ads \u2192 org\u00e2nico: sem dado emp\u00edrico.** O artigo da AppTweak que o playbook cita admite n\u00e3o ter medi\u00e7\u00e3o (mecanismo te\u00f3rico: convers\u00e3o por keyword + velocity). O valor comprov\u00e1vel \u00e9 o **dado**: Search Match casa queries usando metadata, apps similares do g\u00eanero e dados de busca, e o relat\u00f3rio de search terms devolve as queries reais. [Apple oficial (Search Match) / opini\u00e3o de vendor (uplift)] \u2014 [AppTweak, upd. 2024-07-24](https://www.apptweak.com/en/aso-blog/how-search-ads-can-boost-your-apps-organic-keyword-rankings) \u00b7 [Apple Ads: Search Match](https://ads.apple.com/app-store/help/campaigns/0006-understand-search-match).\n\n17. **In-App Events:** aparecem na product page, nos resultados de busca (card pesquis\u00e1vel pelo nome do evento) e nas abas Today/Games/Apps; m\u00e1x. 15 aprovados / 10 publicados, at\u00e9 31 dias, pr\u00e9-promo\u00e7\u00e3o 14 dias, **deep link obrigat\u00f3rio**, badges (Challenge, Live Event, Major Update, Special Event\u2026); Apple desaconselha eventos repetitivos ou s\u00f3 de pre\u00e7o. \u00danico estudo p\u00fablico (Phiture, 1 cliente, 2021): impress\u00f5es +~50% e pico de first-time downloads s\u00f3 enquanto o evento est\u00e1 ao vivo. AppTweak 2025: 51% dos top games e 38% dos top apps rodaram >5 eventos. [Apple oficial / estudo com dados (antigo, n=1)] \u2014 [Apple: In-App Events](https://developer.apple.com/app-store/in-app-events/) \u00b7 [Phiture, 2021-12-06](https://phiture.com/asostack/in-app-events/).\n\n18. **Re-indexa\u00e7\u00e3o e o \"seven-day cliff\" s\u00e3o coisas diferentes.** O artigo da Sensor Tower \u00e9 de **ago/2014, 2 apps, e trata s\u00f3 de LAN\u00c7AMENTO** (boost inicial), n\u00e3o de troca de metadata. Para troca de metadata, SEM Nexus (observa\u00e7\u00e3o de clientes, sem dado externo, 2026-09-16): 3-7 dias t\u00edpico, 48 h em app de tr\u00e1fego alto, 10-14 dias em app novo com pouca velocity. Sazonal: metadata no ar 2-3 semanas antes do pico. [anedota / opini\u00e3o de vendor] \u2014 [Sensor Tower, 2014-08](https://sensortower.com/blog/why-app-store-keyword-rankings-drop-dramatically-seven-days-after-launch) \u00b7 [SEM Nexus](https://semnexus.com/app-store-keyword-indexing-lag-ios-vs-android-timelines) \u00b7 [AppTweak sazonalidade](https://www.apptweak.com/en/aso-blog/app-store-seasonality).\n\n19. **Nome de IAP promovida indexa (peso baixo), comp\u00f5e com o title em long-tail.** Teste da AppFollow (2019, atualizado): IAP \"Wave Rider\" rankeando \"wave jetpack\". Apple confirma que IAPs promovidas aparecem na busca. [anedota (teste) / Apple oficial (aparecem)] \u2014 [AppFollow](https://appfollow.io/blog/advanced-app-store-optimization-how-to-use-in-app-purchases-to-gain-more-app-visibility) \u00b7 [Apple Search](https://developer.apple.com/app-store/search/).\n\n20. **2.3.7 (verbatim):** \"Choose a unique app name, assign keywords that accurately describe your app, and don't try to pack any of your metadata with trademarked terms, popular app names, pricing information, or other irrelevant phrases\u2026 App subtitles\u2026 should not include inappropriate content, reference other apps, or make unverifiable product claims. Apple may modify inappropriate keywords at any time.\" Guia oficial de keywords: sem plurais, sem \"app\"/\"game\", sem filler, sem nome de concorrente. [Apple oficial] \u2014 [Guidelines](https://developer.apple.com/app-store/review/guidelines/) \u00b7 [Apple Search](https://developer.apple.com/app-store/search/).\n\n21. **Mercado 2026 \u2014 o teto \u00e9 monetiza\u00e7\u00e3o, n\u00e3o visibilidade.** RevenueCat (115 K apps, US$16 B, 2026-03-19): top 25% cresce MRR +80% a/a, bottom 25% encolhe \u221233%; **hard paywall converte trial\u2192pago D35 em 10,7% vs 2,1% freemium; receita por install D60 US$3,09 vs US$0,38**; trial de 17-32 d converte 42,5% vs 25,5% em <4 d; pre\u00e7o alto converte 2\u00d7 o baixo. Appfigures: 557 K submiss\u00f5es novas em 2025 (+24%), Q1/2026 +60% a/a (+80% iOS). [estudo com dados] \u2014 [RevenueCat](https://www.revenuecat.com/blog/growth/subscription-app-trends-benchmarks-2026) \u00b7 [Appfigures, 2025-12-05](https://appfigures.com/resources/insights/20251205?f=2) \u00b7 [TechCrunch, 2026-04-18](https://techcrunch.com/2026/04/18/the-app-store-is-booming-again-and-ai-may-be-why/).\n\n22. **Cad\u00eancia dos top apps (AppTweak, top-1000 US, 2025):** 34% atualizaram description 2+ vezes no ano; 35% rodaram 2+ testes de screenshot; ~10% testaram \u00edcone/v\u00eddeo. [estudo com dados] \u2014 [AppTweak trends 2026](https://www.apptweak.com/en/aso-blog/aso-app-store-trends-benchmarks-report).\n\n23. **Reten\u00e7\u00e3o como fator direto: n\u00e3o confirmado pela Apple** (\"and more\"), mas redownloads s\u00e3o 2,2\u00d7 os downloads (achado 2) e Personalized Collections usam apps instalados + uso no aparelho para recomendar \u2014 o p\u00f3s-install passou a alimentar a descoberta fora da busca. [Apple oficial (dados) / infer\u00eancia de vendor] \u2014 [Phiture trends, 2026-03-19](https://phiture.com/asostack/aso-trends-in-2026/) \u00b7 [TechCrunch, 2026-06-09](https://techcrunch.com/2026/06/09/apples-app-store-rolls-out-personalized-recommendations/).\n\n## O que o lab j\u00e1 faz certo\n\n- **Rating-first (<25 ratings antes de ASO agressivo)** \u2014 ratings e reviews s\u00e3o o \u00fanico sinal comportamental que a Apple nomeia (1); a convers\u00e3o tem penhasco em 4,0 (12); prompt nativo direto no aha e sem pr\u00e9-gate \u00e9 exatamente 5.6.1 + 3\u00d7/365 (10).\n- **`review-responder` e resposta em toda review** \u2014 a categoria m\u00e9dia responde 24%, Productivity 12%; responder \u00e9 a \u00fanica alavanca sobre nota j\u00e1 dada e move +0,3-0,5\u2605 (11). Manter.\n- **Sem token \"app\", sem plural, sem duplicata entre name/subtitle/keywords** \u2014 \u00e9 literalmente o guia oficial (20); e conjuntos \u00fanicos s\u00e3o pr\u00e9-requisito das CPPs (4).\n- **39 locales por API com cross-storefront** \u2014 a tabela (13) confirma o desenho; o keyword field de pt-BR, es-MX, fr, ru, zh, ar, ko e vi conta NOS EUA, e en-GB \u00e9 o secund\u00e1rio de BR/MX/ES/DE/FR/KR/PT/AR. Os 11 locales novos (\u00cdndia) n\u00e3o valem esfor\u00e7o pro portf\u00f3lio atual.\n- **Long-tail de baixa popularidade e \"#1-2 ou nada\"** \u2014 dire\u00e7\u00e3o certa, e o 2\u00ba slot de ads (3) refor\u00e7a: #3+ org\u00e2nico vale ainda menos.\n- **PPO por API + prints code-driven fi\u00e9is** \u2014 65% dos top apps n\u00e3o testam prints (22); o lab j\u00e1 roda mais teste que a m\u00e9dia.\n- **Deploy por PATCH + verifica\u00e7\u00e3o + checkpoint D7/14/21/28** \u2014 o D7 como primeira leitura bate com os 3-7 dias observados (18).\n- **Instrumenta\u00e7\u00e3o de reten\u00e7\u00e3o (GA4/Firebase)** \u2014 vira insumo de descoberta com Personalized Collections (23), mesmo sem ser fator confirmado de ranking.\n\n## O que muda no lab\n\nOrdenado por impacto esperado em RECEITA (meta US$4 k/m\u00eas). Os itens 1-2 s\u00e3o de produto/neg\u00f3cio, n\u00e3o de ASO \u2014 mas s\u00e3o o que a busca sozinha n\u00e3o entrega.\n\n1. **Revisar \"apps sempre gr\u00e1tis na v1\" para os apps que j\u00e1 t\u00eam tr\u00e1fego.** Achado 21: hard paywall rende US$3,09/install em D60 vs US$0,38 freemium; visibilidade sem cobran\u00e7a tem teto zero. A\u00e7\u00e3o: exce\u00e7\u00e3o expl\u00edcita na `RULES.md` (bloco \"Apps sempre gr\u00e1tis\") para apps com >100 installs/m\u00eas, com `PaywallKit` + trial \u22657 d (n\u00e3o 3 d \u2014 25,5% vs 42,5%); atualizar `monetization-playbook.md` com os n\u00fameros da RevenueCat 2026. Incerteza: o pr\u00f3prio Jo\u00e3o vetou paywall como default; isso \u00e9 decis\u00e3o dele, n\u00e3o do pipeline.\n\n2. **Fechar o buraco de medi\u00e7\u00e3o de an\u00fancio antes de julgar qualquer ASO por receita.** Sales Report n\u00e3o v\u00ea AdMob (LEARNINGS #80); Truco/Foguetinho/Neon monetizam por ads e o dashboard os l\u00ea como US$0. A\u00e7\u00e3o: v\u00ednculo AdMob\u2194Firebase (manual, Jo\u00e3o) e `ad_impression` no `firebase_snapshot.py`. Sem isso o item 1 e o checkpoint de 02/10 decidem no escuro.\n\n3. **CPPs ligadas a keywords em todo app com \u22652 inten\u00e7\u00f5es de busca.** Achados 4-5: gr\u00e1tis, sem build, sem review para atribuir keywords, 61% dos top apps n\u00e3o usam, e a p\u00e1gina vira o \"print certo pra query certa\" que o code-driven j\u00e1 sabe renderizar. A\u00e7\u00e3o: (a) script `scripts/asc/cpp_keywords.py` (POST appCustomProductPages + vers\u00e3o + localizations + assign keywords por locale, reconcilia\u00e7\u00e3o por checksum, `--verify`); (b) etapa nova no `aso-field-composer` (\"mapa keyword\u2192inten\u00e7\u00e3o\u2192CPP\", 1 keyword-set \u00fanico por p\u00e1gina); (c) `aso-deployer` publica e o `aso-checkpoint` l\u00ea \"search traffic per CPP\" do App Analytics; (d) `ppo-pipeline` template ganha `cpp/`. Come\u00e7ar por 1 app com dados (Cloak ou Walk), medir sequencialmente CVR de busca antes/depois. Incerteza: nenhum estudo isola lift org\u00e2nico; esperar 3-6% de CVR, n\u00e3o milagre.\n\n4. **Recalibrar a r\u00e9gua de popularidade (pop 6-30 / \"pop=5 \u00e9 piso\").** Achado 14: desde out/2025 \"5\" \u00e9 classifica\u00e7\u00e3o, n\u00e3o volume; a Astro serve backup de out/2025 + rank report da Apple, ou seja, o lab decide com dado congelado. A\u00e7\u00e3o: em `aso-ranking-playbook.md \u00a74`, `/research-aso-keywords` e `aso-serp-analyst`: tratar pop=5 como \"desconhecido\" (nem descartar nem promover); exigir 2\u00aa fonte de volume \u2014 search terms do Apple Ads (achado 16) ou o \"Monthly Search Term Rank Report\" \u2014 antes de gastar chars de name/subtitle num termo; registrar no `meta.json` qual fonte de volume embasou cada aposta.\n\n5. **Apple Ads como or\u00e1culo de keyword e convers\u00e3o, com or\u00e7amento m\u00ednimo vi\u00e1vel por app antes de cada itera\u00e7\u00e3o.** Achados 15-16: BR/MX CPI ~US$1, ES US$1,4, US US$2,5-4; 14 dias de Search Match a US$5-10/dia devolvem queries reais + convers\u00e3o por termo (o dado que o `aso-fit-checker` hoje estima). Cr\u00e9dito de US$100 por conta nova cobre a 1\u00aa rodada. A\u00e7\u00e3o: playbook \u00a73 vira \"discovery campaign \u00e9 a fase 0 da itera\u00e7\u00e3o\"; `aso-extractor` j\u00e1 puxa search terms \u2014 tornar obrigat\u00f3rio; `scripts/apple-ads/` ganha `discovery_campaign.py` (criar/pausar por app). Honestidade: uplift org\u00e2nico direto N\u00c3O est\u00e1 provado (16); o retorno \u00e9 informa\u00e7\u00e3o e, nos nichos baratos, installs a <US$1,5.\n\n6. **Corrigir dois erros do playbook.** (a) \u00a71/\u00a75 \"captions de screenshot s\u00e3o indexadas\" \u2192 \"n\u00e3o confirmado; evid\u00eancia fraca (6)\"; manter headline com termo-alvo s\u00f3 por convers\u00e3o. (b) \u00a72 \"seven-day cliff\" \u2192 \u00e9 boost de lan\u00e7amento (2014, 2 apps), n\u00e3o penalidade p\u00f3s-troca de metadata (18); re-index 3-7 d; leitura D7 continua, mas o `aso-checkpoint` deixa de chamar oscila\u00e7\u00e3o pr\u00e9-D7 de \"cliff\". Artefato: `aso-ranking-playbook.md`, evals do `aso-checkpoint`.\n\n7. **Preparar o Header (Creative Asset) para iOS 27.** Achado 8: no outono a busca mostra 1 imagem/v\u00eddeo no lugar dos 3 prints; quem n\u00e3o subir header continua com prints, quem subir ganha o slot inteiro. A\u00e7\u00e3o: `/code-driven-prints` ganha render de header (propor\u00e7\u00e3o a confirmar quando a ASC abrir o upload) com o mesmo look da casa; PPO template testa header; Asset Library via API para n\u00e3o depender de build. Incerteza: share de devices em iOS 27 no 1\u00ba semestre.\n\n8. **Ratings por territ\u00f3rio e resumo por LLM.** Achado 9: a nota \u00e9 por storefront e o resumo s\u00f3 existe em US/UK/CA/AU/IN\u2026; o BR ainda n\u00e3o tem. A\u00e7\u00e3o: `reference_rating_pipeline` e o scan do orchestrator passam a olhar ratings **por storefront-alvo** (US primeiro), n\u00e3o o agregado; `review-responder` prioriza reviews dos storefronts com resumo por LLM, porque o texto da resposta entra no material que o resumo l\u00ea.\n\n9. **In-App Events s\u00f3 onde h\u00e1 evento real e deep link.** Achado 17: efeito s\u00f3 durante o evento, exige deep link, Apple recusa \"promo repetitiva\". Candidatos: Sueca/Truco (feriados, \"Major Update\"), Cronos (planejamento de ano novo). A\u00e7\u00e3o: template `aso/pipeline-template/iae/` (metadata 30/50/120 chars + card 16:9) e submiss\u00e3o por API; expectativa modesta, 1-2 apps por trimestre.\n\n10. **Locales: encher en-GB em todo app e usar os secund\u00e1rios dos EUA como or\u00e7amento extra.** Achado 13: en-GB \u00e9 o 2\u00ba \u00edndice de 8 storefronts que importam; pt-BR/es-MX/fr/ru/zh/ar/ko/vi indexam nos EUA \u2014 o keyword field desses locales pode carregar termos com inten\u00e7\u00e3o americana sem duplicar o en-US. Regra nova no `aso-field-composer`.\n\n11. **Tags e Collections: nada a fazer al\u00e9m de metadata honesta.** Achados 7 e 23: tags nascem da description/prints/categoria por LLM; a description volta a importar (para a IA, n\u00e3o para o \u00edndice). A\u00e7\u00e3o: `aso-copywriter` escreve a description com as features nomeadas nos primeiros par\u00e1grafos; conferir tags em App Information quando aparecerem.\n\n## Incerto ou controverso\n\n- **Captions de screenshot** \u2014 Appfigures diz que h\u00e1 indexa\u00e7\u00e3o por IA desde jun/2025; ConsultMyApp (64 frases) e AppTweak dizem que n\u00e3o h\u00e1 evid\u00eancia; Apple nunca confirmou. Tratar como sinal marginal, nunca como estrat\u00e9gia.\n- **Reten\u00e7\u00e3o como fator de ranking** \u2014 vendors afirmam; Apple s\u00f3 diz \"and more\". O que \u00e9 fato: redownloads 2,2\u00d7 downloads e Collections on-device usam uso p\u00f3s-install.\n- **Seven-day cliff e prazos de re-indexa\u00e7\u00e3o** \u2014 o cliff \u00e9 observa\u00e7\u00e3o de 2014 em 2 apps de lan\u00e7amento; \"3-7 dias\" \u00e9 experi\u00eancia de ag\u00eancia sem dado p\u00fablico. Ningu\u00e9m mediu isso com rigor em 2025-26.\n- **Ads \u2192 ranking org\u00e2nico** \u2014 nenhuma fonte tem medi\u00e7\u00e3o; o que existe \u00e9 racioc\u00ednio (velocity/convers\u00e3o) e um caso aned\u00f3tico de +56,7% misturando ads com troca de metadata.\n- **Lift de CPP org\u00e2nica** \u2014 s\u00f3 correla\u00e7\u00e3o em painel (+5,9% CVR) e n\u00fameros de ads; o efeito isolado na busca org\u00e2nica \u00e9 desconhecido.\n- **Escala de popularidade** \u2014 depois de out/2025 cada tool (Astro backup, AppTweak estimativa pr\u00f3pria, Appfigures \"m\u00e9todo alternativo\") mostra um n\u00famero diferente para a mesma keyword; compara\u00e7\u00f5es entre tools e com hist\u00f3rico pr\u00e9-out/2025 n\u00e3o valem.\n- **Tags p\u00fablicas** \u2014 anunciadas em jun/2025, \"beta\" nas fontes de 2025, nenhuma confirma\u00e7\u00e3o da Apple de lan\u00e7amento geral at\u00e9 set/2026.\n- **Nome de IAP indexado** \u2014 \u00fanico teste \u00e9 de 2019; Apple confirma s\u00f3 que IAPs promovidas aparecem na busca.\n- **Curvas \"4,7\u2605 converte 15-25% mais\"** \u2014 n\u00fameros de vendor sem metodologia; o que tem dado \u00e9 o piso 4,0 (95% dos featured) e o efeito de responder (AppFollow).\n";</script><script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script><script>document.getElementById("md").innerHTML=window.marked?marked.parse(RAW):"<pre>"+RAW.replace(/</g,"&
