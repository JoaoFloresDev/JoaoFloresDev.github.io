<body><div class="wrap"><p class="sub" style="font-size:12px;margin:0 0 14px">Exportado em 2026-10-01 10:29 · fonte: Lab Hub local</p><p class="sub"><a href="../index.html">← hub</a> · <code>_GambitStudio/.claude/skills/start-aso-pipeline/SKILL.md</code></p><div id="md"></div><script>const RAW="---\nname: start-aso-pipeline\ndescription: Coordena o processo de update de ASO de um app J\u00c1 publicado \u2014 bootstrap do aso-pipeline se faltar, depois encadeia os agentes especializados (aso-extractor \u2192 aso-longtail-miner \u2192 aso-fit-checker \u2192 aso-serp-analyst \u2192 aso-field-composer \u2192 aso-reporter \u2192 aso-deployer \u2192 deploy-verifier) e agenda os checkpoints (aso-checkpoint). Use quando o user digitar /start-aso-pipeline ou disser \"come\u00e7ar ASO no app X\", \"atualiza o ASO do app X\", \"roda uma itera\u00e7\u00e3o de ASO\".\n---\n\n# ASO Update \u2014 COORDENADOR (n\u00e3o executa, delega)\n\nVoc\u00ea \u00e9 um coordenador MAGRO. O trabalho pesado vive nos agentes (`~/.claude/agents/`). Voc\u00ea s\u00f3: prepara o terreno, passa contexto denso a cada est\u00e1gio, encadeia os outputs e reporta.\n\n## A cadeia (9 est\u00e1gios, sequenciais)\n\n| # | Est\u00e1gio | Agente | Consome | Produz |\n|---|---------|--------|---------|--------|\n| 1 | Coleta bruta | `aso-extractor` | app dir, App ID, stores | `research/`: **`locales.json` (base 3 + top-2 por instala\u00e7\u00f5es 1*/90d via `top_locales.py` \u2014 os 5 locales de toda a cadeia)**, astro_*.json por locale de trabalho, CSVs pool/candidates, competitors.md, asc_state.json, baselines (2 m\u00e9todos), search-terms reais da ASC se houver + **search terms do Apple Ads se o app tem campanha** (`apple_ads_search_terms_*.csv` \u2014 a 2\u00aa fonte de volume que o playbook \u00a74 exige desde que a r\u00e9gua de pop quebrou em out/2025) |\n| 2 | Long tails por palavra | `aso-longtail-miner` | CSVs + core words | `research/longtails_<store>.csv` (cada long tail com fonte rastre\u00e1vel, medida no Astro) |\n| 3 | Fit termo-a-termo | `aso-fit-checker` | todos os termos + SOURCE do app | `research/app_feature_inventory.md` + `research/term_fit_<locale>.csv` (FIT/PARTIAL/MISMATCH, 1 linha de raz\u00e3o cada) |\n| 4 | SERP / winnability | `aso-serp-analyst` | termos FIT/PARTIAL | `research/serp_winnability_<store>.csv` (DOMINATE/CLIMB/LOTTERY/UNWINNABLE + mapa de prote\u00e7\u00e3o) |\n| 5 | Composi\u00e7\u00e3o dos campos | `aso-field-composer` | fit + winnability + protection map | `proposed/metadata/<locale>/*.txt` + `research/composition_rationale.md` + validate limpo |\n| 6 | Relat\u00f3rio de decis\u00e3o | `aso-reporter` | proposta + rationale | `keyword_candidates.md` (SEM cabe\u00e7alho did\u00e1tico \u2014 direto nas decis\u00f5es) + `meta.json` can\u00f4nico + link mdview |\n| 7 | Deploy | `aso-deployer` | proposta validada + asc_state.json | piso de tr\u00e1fego + quarentena (`pull_analytics.py floor` / `quarantine`) \u2192 PATCH direto + read-back \u2192 `status: staged`; **D0 = dia em que a vers\u00e3o portadora fica READY_FOR_SALE** \u2192 `pull_analytics.py d0` grava `live_at` + `metrics/d00_baseline.json` (30d de 1* por pa\u00eds, r15 por territ\u00f3rio, snapshot Astro) \u2192 s\u00f3 ent\u00e3o `status: live` (aso_efficacy 27/09, regras 1/3/5) |\n| 7b | CPP por keyword (se `cpp_candidates` \u2260 vazio) | `aso-deployer` (passo 7) | `meta.json.cpp_candidates` + prints da feature | p\u00e1gina criada/reaproveitada + keywords ligadas por locale via `searchKeywords` (conjunto \u00fanico por p\u00e1gina) + read-back; token que s\u00f3 entra no field nesta itera\u00e7\u00e3o fica `pending_approval` \u2014 playbook \u00a79 |\n| 7c | Apple Ads fase 0 (OPCIONAL, custa dinheiro) | `aso-deployer` (passo 8) | aprova\u00e7\u00e3o EXPL\u00cdCITA do Jo\u00e3o nesta conversa | 1 campanha Search Match, 14 dias, US$5-10/dia; devolve queries reais + convers\u00e3o por termo pra pr\u00f3xima itera\u00e7\u00e3o (playbook \u00a73 item 4; uplift org\u00e2nico n\u00e3o provado) |\n| 8 | Auditoria | `deploy-verifier` | o que foi deployado | diff independente live vs local (inclusive campos N\u00c3O tocados) |\n| 9 | Cad\u00eancia | `aso-checkpoint` | meta.json (D7/14/21/28 contados do `live_at`) | `pull_analytics.py checkpoint` \u2192 **tr\u00eas n\u00fameros: delta no pa\u00eds-alvo, delta nos outros pa\u00edses, mediana de \u22653 apps-controle na mesma janela** (sem release/PPO/texto \u2014 `scan.py store_events`); \"ganhou\" s\u00f3 com IC do alvo excluindo 1,0 E acima do controle; ganho s\u00f3 fora do alvo = \"n\u00e3o \u00e9 do texto\"; no D7 cruza com o report App Store Search Terms (volume REAL); se a itera\u00e7\u00e3o tem CPP, l\u00ea impress\u00f5es/CVR da p\u00e1gina vs default no mesmo cluster (report App Store Discovery and Engagement); queda nos primeiros 3-7 dias = re-index, n\u00e3o \"cliff\". **Fechar = `pull_analytics.py final --write-meta`** (`results.final` com RR/IC/controle sobre a s\u00e9rie 1* de 30 dias) \u2014 `status: closed` nunca com n\u00famero \u00e0 m\u00e3o nem janela retroativa (regras 2/5) |\n\n## Regras do coordenador\n\n- **N\u00c3O fazer an\u00e1lise voc\u00ea mesmo.** Cada regra dura vive no agente do est\u00e1gio. Se um est\u00e1gio violar (ex.: composer cortando token do mapa de prote\u00e7\u00e3o), devolver PRO AGENTE citando a regra \u2014 n\u00e3o consertar na m\u00e3o.\n- Est\u00e1gios 1\u21926 sempre; **7-8 s\u00f3 com autoriza\u00e7\u00e3o do Jo\u00e3o** (pediu explicitamente ou disse \"sem revis\u00e3o\"). Sem autoriza\u00e7\u00e3o \u2192 parar no 6, entregar o link mdview e registrar item `do` no now.json.\n- **7b (CPP)** entra na mesma autoriza\u00e7\u00e3o do deploy S\u00d3 se o Jo\u00e3o viu os candidatos no relat\u00f3rio e disse que quer a p\u00e1gina; p\u00e1gina nova vai a review com a pr\u00f3xima submiss\u00e3o, o v\u00ednculo de keyword n\u00e3o. **7c (Apple Ads) \u00e9 autoriza\u00e7\u00e3o SEPARADA** \u2014 \u00e9 dinheiro: propor no relat\u00f3rio com o or\u00e7amento (benchmarks do playbook \u00a73) e s\u00f3 o deployer roda se ele aprovar com essas palavras. Sem campanha e sem report de search terms da ASC, toda aposta do relat\u00f3rio sai marcada `pop n\u00e3o confi\u00e1vel` (s\u00f3 Astro) \u2014 dizer isso no relat\u00f3rio em vez de fingir volume.\n- Est\u00e1gio 9 se agenda via now.json (datas do meta.json, contadas do `live_at`, n\u00e3o do PATCH); cada checkpoint na data vira um spawn do aso-checkpoint.\n- **Quarentena de 14 dias (aso_efficacy 27/09, regra 3):** nos 14 dias antes e depois do live de uma itera\u00e7\u00e3o de texto, **sem iniciar/parar PPO e sem release de feature** no app. Se o texto precisa de build, o build \u00e9 **s\u00f3 texto** (sem widget, prints, idiomas novos). O deployer recusa deploy com experimento APPROVED/rodando ou vers\u00e3o em review; s\u00f3 passa com `--override` expl\u00edcito seu, registrado em `meta.json.quarantine_override`. Registrar a janela de quarentena no now.json pra ningu\u00e9m agendar PPO em cima.\n- **Piso de tr\u00e1fego (regra 4):** itera\u00e7\u00e3o de keywords s\u00f3 em app com **\u2265 100 instala\u00e7\u00f5es 1* em 30 dias no pa\u00eds-alvo** (`pull_analytics.py floor --country <CC>`; o baseline do extractor j\u00e1 traz o n\u00famero por pa\u00eds). Abaixo disso a resposta do pipeline \u00e9 **\"alavanca \u00e9 ratings/prints/produto\"** \u2014 n\u00e3o abrir a itera\u00e7\u00e3o, registrar a resposta no now.json e parar. 9 das 16 itera\u00e7\u00f5es auditadas estariam bloqueadas por essa regra, e s\u00e3o as 9 sem resposta.\n- Prompts pros agentes = contexto DENSO (paths absolutos, ids, locales, o output do est\u00e1gio anterior resumido). Agente n\u00e3o descobre nada que voc\u00ea j\u00e1 sabe.\n- Toda mudan\u00e7a de estado \u2192 `_GambitStudio/now.json` no MESMO turno (o Jo\u00e3o acompanha pelo site :8770, n\u00e3o pelo chat).\n\n## Passo 0 (voc\u00ea) \u2014 contexto e bootstrap\n\n- App dir, App Store ID, bundle, locales-alvo.\n- **Locales = base 3 + top-2 por instala\u00e7\u00f5es 90d (regra do Jo\u00e3o, 28/09/2026):** toda itera\u00e7\u00e3o cobre en-US, es-ES e pt-BR MAIS os DOIS locales da App Store com mais instala\u00e7\u00f5es NOVAS (Sales Report Product Type `1*`, nunca update `7*` \u2014 LEARNINGS #53) nos \u00faltimos 90 dias do app. Rodar `python3 _GambitStudio/scripts/asc/top_locales.py --app-id <ID> --days 90` (o extractor grava o `--json` em `research/locales.json`); o script mapeia pa\u00eds \u2192 locale que a storefront indexa (playbook \u00a710 \u2014 MX vira es-MX, que N\u00c3O \u00e9 es-ES; IN vira hi, que tamb\u00e9m l\u00ea en-GB; c\u00f3digos aceitos pela API, #57b), e um slot com `sem tr\u00e1fego suficiente` (< 30 instala\u00e7\u00f5es) fica vazio, nunca chutado. Passar os 5 locales (ou menos) no prompt de TODOS os est\u00e1gios \u2014 miner, fit-checker, serp-analyst, composer, reporter, deployer trabalham nos 5; o deployer cria a localization que n\u00e3o existir. Na 1\u00aa itera\u00e7\u00e3o p\u00f3s-launch de um app novo o script ainda pode devolver dois slots vazios \u2014 a\u00ed a itera\u00e7\u00e3o \u00e9 s\u00f3 nos 3 e o item fica anotado no meta.json.\n- App LIVE (READY_FOR_SALE) \u00e9 pr\u00e9-requisito. Astro Desktop aberto (MCP `http://127.0.0.1:8089/mcp`; 500 persistente \u2192 `killall Astro && open -a Astro`).\n- **Gate de tr\u00e1fego ANTES de abrir a itera\u00e7\u00e3o:** `./scripts/pull_analytics.py floor --country <pa\u00eds-alvo>` (piso 100 instala\u00e7\u00f5es 1*/30d). Reprovou \u2192 responder \"alavanca \u00e9 ratings/prints/produto\" e n\u00e3o abrir a itera\u00e7\u00e3o. Passou \u2192 conferir que o app tem request ONGOING de App Analytics (`pull_analytics.py baseline` cria; sem ele n\u00e3o existe impress\u00e3o \"antes\", s\u00f3 a partir do dia em que o request nasce).\n- Se `aso-pipeline/` n\u00e3o existir:\n```bash\nbash _GambitStudio/aso/pipeline-template/init.sh \\\n  --target <app>/aso-pipeline --app-id <ID> --bundle-id <BUNDLE> \\\n  --app-name \"<NAME>\" --primary-locale <LOC> --baseline-downloads-per-day <N>\n```\n- Criar a itera\u00e7\u00e3o: `./scripts/new_iteration.sh text <locale> keywords` \u2014 UMA folder por iter, mesmo multi-campo/multi-locale (escopo declarado no meta.json).\n\n## Por que essa arquitetura (contexto pro futuro)\n\nA skill monol\u00edtica antiga (backup em `SKILL.md.pre-coordinator.bak`) fazia tudo num contexto s\u00f3 e produziu a falha da iter-03 do Walk (18/08): descartou como \"vaidade pop-5\" tudo que tinha ranking e encheu o campo de apostas OUT \u2014 Jo\u00e3o reverteu na m\u00e3o, linha a linha. As corre\u00e7\u00f5es viraram regras hard-coded nos est\u00e1gios:\n- fit-checker: cada termo validado contra o que o app ENTREGA (invent\u00e1rio do source + NOT-list);\n- longtail-miner: long tails que usam cada palavra, com fonte rastre\u00e1vel;\n- serp-analyst: mapa de prote\u00e7\u00e3o (composi\u00e7\u00e3o rankeada \u2192 token que a protege) + winnability honesta;\n- composer: token do mapa de prote\u00e7\u00e3o NUNCA sai; OUT sem retorno sai; \u22643 apostas novas nos chars liberados;\n- reporter: an\u00e1lise final SEM cabe\u00e7alho did\u00e1tico;\n- deployer: PATCH direto (deliver mente) + read-back + deploy-verifier.\nRefer\u00eancias: `_GambitStudio/aso/learnings.md` (2026-08-18), mem\u00f3rias `feedback_aso_dominate_low_pop_terms` e `feedback_coordinator_over_monolith`.\n";</script><script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script><script>document.getElementById("md").innerHTML=window.marked?marked.parse(RAW):"<pre>"+RAW.replace(/</g,"&lt;")+"</pre>";</script></div><script>(function(){try{var k="lh.scroll:"+location.pathname;var v=sessionStorage.getItem(k);if(v!==null){sessionStorage.removeItem(k);window.scrollTo(0,parseInt(v,10)||0);}document.addEventListener("submit",function(e){var f=e.target;if(f&&f.method&&f.method.toLowerCase()==="post"){sessionStorage.setItem(k,String(window.scrollY));}},true);}catch(e){}})();</script></b
