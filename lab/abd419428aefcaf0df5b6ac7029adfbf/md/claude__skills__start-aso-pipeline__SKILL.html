<style>
:root{--bg:#f4f5f8;--card:#fff;--tx:#0e1015;--mut:#4a5160;--acc:#0b53d6;--ok:#0d9668;--down:#c22;--bd:#c9cfda;--hl:#fff7e0}
@media(prefers-color-scheme:dark){:root{--bg:#0e1013;--card:#1a1e25;--tx:#f2f4f8;--mut:#aab3c2;--acc:#6ea3ff;--bd:#39404d;--hl:#2a2717}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.55 -apple-system,system-ui,sans-serif}
.wrap{width:min(1680px,94vw);margin:0 auto;padding:28px 0 80px}@media(max-width:860px){.wrap{width:calc(100vw - 28px)}}.ico{width:20px;height:20px;border-radius:5px;vertical-align:-5px;margin-right:7px;background:var(--bd);object-fit:cover}.ico.big{width:30px;height:30px;border-radius:7px;vertical-align:-9px}h2{border-top:1px solid var(--bd);padding-top:20px;margin-top:30px}section,.twrap{min-width:0}h2:first-of-type{border-top:0;padding-top:0}h1+h2,.sub+h2{border-top:0;padding-top:0}
h1{font-size:22px;margin:0 0 4px}h2{font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:34px 0 12px}
.sub{color:var(--mut);margin:0 0 8px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px 16px}
.card b{font-size:14.5px}.card p{margin:5px 0 0;color:var(--mut);font-size:13.5px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px}
.up{background:var(--ok)}.dn{background:var(--down)}
a{color:var(--acc);text-decoration:none}a:hover{text-decoration:underline}
code{background:rgba(125,125,125,.13);padding:1px 6px;border-radius:5px;font-size:12.5px}
.pill{display:inline-block;background:rgba(125,125,125,.12);border-radius:99px;padding:1px 10px;margin:2px 3px 2px 0;font-size:12.5px}
table.t{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--bd);border-radius:12px;overflow:hidden}
table.t td,table.t th{padding:7px 12px;border-bottom:1px solid var(--bd);font-size:13.5px;text-align:left;vertical-align:top}
table.t th{color:var(--mut);font-weight:600}table.t tr:last-child td{border-bottom:0}
.twrap{overflow-x:auto;border-radius:12px}
.imgs{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.imgs img{width:100%;border-radius:8px;border:1px solid var(--bd)}
#md{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:22px 26px}
#md pre{overflow-x:auto;background:rgba(125,125,125,.1);padding:10px;border-radius:8px}
#md table{border-collapse:collapse}#md td,#md th{border:1px solid var(--bd);padding:4px 9px;font-size:13.5px}
#md img{max-width:100%}
.hcol .row{flex-direction:column;align-items:flex-start;gap:4px}.hcol .row b{white-space:normal}.hcol .row span{width:100%}.hcol .row em{display:none}.hcol .row.done b{font-size:12px}.hrow{display:flex;gap:20px;overflow-x:auto;align-items:flex-start;padding:16px 28px 12px;margin:18px 0 26px;background:rgba(125,125,125,.07);border:1px solid var(--bd);border-radius:16px;scroll-padding:0 28px}.hcol{flex:0 0 340px;min-width:340px}.hcol:last-child{margin-right:28px}.hcol h2{margin-top:0}.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:0 20px}.cols2{display:grid;grid-template-columns:1fr 1fr;gap:0 20px;align-items:start}@media(max-width:900px){.cols2{grid-template-columns:1fr}}h3.team{margin:18px 0 8px;font-size:15px;font-weight:600}h3.team .chain{display:block;color:var(--mut);font-weight:400;font-size:12.5px;margin-top:2px}.card .step{display:inline-block;min-width:18px;height:18px;line-height:18px;text-align:center;border-radius:9px;background:var(--bd);color:var(--mut);font-size:11px;font-weight:600;margin-right:6px}.grid4{display:grid;gap:12px;grid-template-columns:repeat(4,1fr)}@media(max-width:1100px){.grid4{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.grid4{grid-template-columns:1fr}}
.rows{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;color:var(--tx);font-size:14.5px}
a.row:hover{border-color:var(--acc);text-decoration:none}
.row b{white-space:nowrap}.row span{flex:1;color:var(--mut)}.row em{color:var(--mut);font-style:normal;font-size:18px}
.row.done b{color:var(--mut);font-weight:500;font-size:12.5px}.row.done span b{color:var(--tx)}.row.done span{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;line-height:1.35}
.hdr{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:6px}
.hdr h1{margin:0}.hdr .sub{margin:2px 0 0}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 22px;font-size:14.5px;color:var(--acc)}
.btn:hover{border-color:var(--acc);text-decoration:none}
.tiles{display:flex;gap:10px;flex-wrap:nowrap;overflow-x:auto;margin:14px 0 6px;padding-bottom:4px}
a.tile{display:block;flex:0 0 auto;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 14px;color:var(--tx);min-width:128px}
a.tile:hover{border-color:var(--acc);text-decoration:none}
.tile .tl{font-size:12px;color:var(--mut);white-space:nowrap}
.tile .tv{font-size:21px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px;white-space:nowrap}
.tile .ts{font-size:11.5px;color:var(--mut);margin-top:1px;white-space:nowrap}
.tv.up{color:var(--ok);background:none}.tv.dn{color:var(--down);background:none}
.vd{font-size:15px;font-weight:700;margin-right:10px;white-space:nowrap}
.vd.s{color:var(--ok)}.vd.w{color:#c9930a}.vd.k{color:var(--down)}
.shots{display:flex;gap:8px;overflow-x:auto;padding:4px 0}
.shots img{height:210px;border-radius:10px;border:1px solid var(--bd);flex:0 0 auto}
.gallery img{height:460px;max-height:72vh}
.st{display:inline-block;border-radius:99px;padding:1px 10px;font-size:12px;font-weight:600;margin-left:8px;white-space:nowrap;vertical-align:1px}
.st.run{background:rgba(13,150,104,.16);color:var(--ok)}
.st.appr{background:rgba(201,147,10,.16);color:#c9930a}
.st.rev{background:rgba(11,83,214,.13);color:var(--acc)}
.st.draft{background:rgba(139,92,246,.15);color:#8b5cf6}
.st.mut{background:rgba(125,125,125,.16);color:var(--mut)}
.st.crit{background:rgba(200,34,34,.15);color:var(--down)}
.rowwrap{position:relative}
.rowwrap .row{padding-right:38px}
.delf{position:absolute;top:0;right:0;bottom:0;display:flex;align-items:center;margin:0}
.del{background:none;border:none;color:var(--mut);font-size:17px;line-height:1;padding:6px 12px;cursor:pointer;border-radius:8px;opacity:.45}
.rowwrap:hover .del{opacity:1}
.del:hover{color:var(--down);background:rgba(200,34,34,.08)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(430px,1fr));gap:12px;margin-top:12px}
@media(max-width:520px){.fgrid{grid-template-columns:1fr}}
.fcard{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:13px 15px}
.fcard .fh{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:8px}
.fcard .fh b{font-size:14.5px}.fcard .fh span{font-size:12.5px;color:var(--mut);white-space:nowrap}
.fs{display:flex;align-items:center;gap:8px;margin:3px 0;font-size:13px}
.fs .fl{flex:0 0 168px;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fs .fb{flex:1;height:13px}
.fs .fb i{display:block;height:100%;background:var(--acc);border-radius:3px;min-width:2px}
.fs .fb i.alt{background:var(--ok)}.fs .fb i.ga{background:#8b5cf6}
.fs .fn{flex:0 0 auto;font-variant-numeric:tabular-nums;font-size:12.5px}
.fs.tot .fl,.fs.tot .fn{font-weight:700}
.leak{margin:0 0 5px 176px;font-size:12px;color:var(--down)}
.leak b{font-variant-numeric:tabular-nums}
.fdiv{margin:9px 0 3px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}
.fmeta{font-size:12.5px;color:var(--mut);margin:-3px 0 9px}
.rrow{display:flex;gap:8px;margin:10px 0 4px}
.rc{flex:1;background:rgba(125,125,125,.09);border-radius:9px;padding:6px 9px}
.rc b{display:block;font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.rc .rv{display:block;font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.25}
.rc .rb{display:block;font-size:11px;color:var(--mut)}
.fnds{list-style:none;margin:10px 0 0;padding:0}
.fnds li{position:relative;padding:2px 0 2px 16px;font-size:13px;color:var(--tx)}
.fnds li:before{content:"";position:absolute;left:0;top:9px;width:7px;height:7px;border-radius:50%}
.fnds li.crit:before{background:var(--down)}.fnds li.warn:before{background:#c9930a}.fnds li.ok:before{background:var(--ok)}
.nxt{margin-top:11px;background:var(--hl);border:1px solid var(--bd);border-radius:10px;padding:9px 12px}
.nxt .nxl{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
.nxt b{font-size:14px}.nxt p{margin:3px 0 0;font-size:13px;color:var(--mut)}
.fh .st{margin-left:8px}
.dirbox{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:20px 24px;margin:20px 0 8px}
.dirlab{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--mut)}
.dirh{font-size:19px;line-height:1.35;margin:4px 0 12px;text-transform:none;letter-spacing:0;color:var(--tx)}
.dirp{margin:0 0 9px;font-size:14px;line-height:1.6;color:var(--tx)}
.prio{display:flex;gap:13px;padding:11px 0;border-top:1px solid var(--bd)}
.prn{flex:0 0 26px;height:26px;line-height:26px;text-align:center;border-radius:13px;background:var(--acc);color:#fff;font-weight:700;font-size:13px}
.prc{flex:1;min-width:0}
.prt{font-size:15px;font-weight:600;margin-bottom:3px}
.prw{margin:0 0 5px;font-size:13.5px;color:var(--tx)}
.pre{margin:0 0 4px;font-size:13px;color:var(--mut);line-height:1.55}
.pre b{color:var(--tx);font-weight:600}
.prp{margin:4px 0 0;font-size:13px;color:var(--tx);border-left:2px solid var(--acc);padding-left:9px}
.vgrid{display:flex;flex-direction:column;gap:6px}
.vrow{display:flex;align-items:baseline;gap:9px;font-size:13.5px;flex-wrap:wrap}
.vrow .st{flex:0 0 auto;margin:0}
.vrow b{flex:0 0 auto;min-width:118px}
.vrow span:last-child{flex:1;min-width:220px;color:var(--mut)}
.nots{margin:0;padding-left:18px}
.nots li{font-size:13.5px;color:var(--tx);margin-bottom:5px;line-height:1.55}
.dirfoot{margin:16px 0 0;padding-top:12px;border-top:1px solid var(--bd);font-size:12px;color:var(--mut)}
@media(max-width:700px){.vrow b{min-width:0}}
.fnote{font-size:11.5px;color:var(--mut);margin:4px 0 0 176px;line-height:1.35}

/* ---------- camada de acabamento (01/10/2026) ----------
   Tipografia com duas vozes (display para títulos e números, texto para leitura),
   neutros com viés do azul da marca em vez de cinza puro, e profundidade por
   sombra em vez de só borda. Nada aqui renomeia classe: é uma camada por cima. */
:root{
  --f-disp:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --f-text:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --bg:#f3f5f9; --card:#ffffff; --tx:#10131a; --mut:#5a6377; --acc:#1552d8;
  --bd:#dde2ea; --bd-soft:#e8ecf3; --ok:#0a8f58; --down:#d02f2f; --warn:#b45309;
  --sh:0 1px 2px rgba(16,19,26,.05),0 2px 8px rgba(16,19,26,.04);
  --sh-up:0 2px 6px rgba(16,19,26,.07),0 10px 24px rgba(16,19,26,.07);
  --rad:14px;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#0b0d12; --card:#161a22; --tx:#eef1f7; --mut:#9aa5b8; --acc:#7aa6ff;
  --bd:#272d39; --bd-soft:#1f242e; --ok:#43d08d; --down:#ff7070; --warn:#e5a645;
  --sh:0 1px 2px rgba(0,0,0,.4); --sh-up:0 6px 22px rgba(0,0,0,.5);
}}
body{font-family:var(--f-text);font-size:14.5px;line-height:1.6;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1{font-family:var(--f-disp);font-size:27px;font-weight:800;letter-spacing:-.02em;
  text-wrap:balance;margin:0 0 2px}
h1 .mark{display:inline-block;width:28px;height:28px;vertical-align:-5px;margin-right:11px;
  background-size:contain;background-repeat:no-repeat;background-position:center}
h2{font-family:var(--f-disp);font-size:12px;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;color:var(--mut);border-top:1px solid var(--bd-soft);
  padding-top:22px;margin:32px 0 14px}
h3{font-family:var(--f-disp);letter-spacing:-.01em}
.sub{font-size:13px;color:var(--mut)}
code,.mono{font-family:var(--f-mono);font-size:12.5px}
.card,table.t,a.tile,.row,.fcard,#md{box-shadow:var(--sh);border-color:var(--bd-soft)}
.card,a.tile,.row,.fcard{border-radius:var(--rad)}
a.tile,.row{transition:box-shadow .16s ease,border-color .16s ease,transform .16s ease}
a.tile:hover,a.row:hover{box-shadow:var(--sh-up);border-color:var(--bd);
  transform:translateY(-1px)}
/* o card do app não se mexe: é área de leitura, não botão */
.fcard{transition:none}
.fcard:hover{box-shadow:var(--sh);border-color:var(--bd-soft);transform:none}
/* big numbers: the first thing anyone reads on the page */
.tiles{gap:12px;margin:18px 0 4px;padding-bottom:10px}
a.tile{padding:13px 17px;min-width:148px}
.tile .tl{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
  color:var(--mut)}
.tile .tv{font-family:var(--f-disp);font-size:25px;font-weight:800;letter-spacing:-.025em;
  margin-top:3px}
.tile .ts{font-size:11.5px;color:var(--mut)}
/* tables read as data, not as prose */
table.t{border-radius:var(--rad);font-variant-numeric:tabular-nums}
table.t th{font-family:var(--f-disp);font-size:11px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;background:var(--bd-soft);border-bottom:1px solid var(--bd)}
table.t td{padding:9px 13px;border-bottom:1px solid var(--bd-soft)}
table.t tbody tr:hover td,table.t tr:hover td{background:rgba(125,140,170,.06)}
.twrap{border-radius:var(--rad)}
/* buttons */
.btn{font-family:var(--f-disp);font-weight:600;font-size:13.5px;padding:9px 18px;
  border-radius:999px;box-shadow:var(--sh);transition:all .16s ease}
.btn:hover{border-color:var(--acc);box-shadow:var(--sh-up);transform:translateY(-1px)}
.pill,.st{font-family:var(--f-disp);font-weight:600;font-size:11.5px;letter-spacing:.02em}
/* status colours carry meaning, so keep them out of the accent */
.st.run,.st.appr{background:rgba(10,143,88,.14);color:var(--ok)}
.st.crit{background:rgba(208,47,47,.14);color:var(--down)}
.st.rev,.st.draft{background:rgba(180,83,9,.14);color:var(--warn)}
/* the lanes strip and any scroller get a thin, rounded bar */
.tiles,.hrow,.twrap{scrollbar-width:thin;scrollbar-color:var(--bd) transparent}
.tiles::-webkit-scrollbar,.hrow::-webkit-scrollbar,.twrap::-webkit-scrollbar{height:9px}
.tiles::-webkit-scrollbar-track,.hrow::-webkit-scrollbar-track,
.twrap::-webkit-scrollbar-track{background:transparent}
.tiles::-webkit-scrollbar-thumb,.hrow::-webkit-scrollbar-thumb,
.twrap::-webkit-scrollbar-thumb{background:var(--bd);border-radius:999px;
  border:3px solid transparent;background-clip:content-box}
.tiles::-webkit-scrollbar-thumb:hover,.hrow::-webkit-scrollbar-thumb:hover,
.twrap::-webkit-scrollbar-thumb:hover{background:var(--mut);background-clip:content-box}
.hrow{background:transparent;border:0;padding:0;border-radius:0}
.hcol{flex:0 0 clamp(280px,26vw,360px);min-width:0}
a:focus-visible,button:focus-visible,.btn:focus-visible{outline:2px solid var(--acc);
  outline-offset:2px;border-radius:8px}
.dirlist,.prlist{margin:10px 0 0;padding-left:18px;list-style:none}
.dirlist>li,.prlist>li{position:relative;margin:0 0 7px;font-size:13.5px;line-height:1.5;
  color:var(--tx)}
.prlist>li{color:var(--mut);font-size:13px;margin-bottom:5px}
.dirlist>li::before,.prlist>li::before{content:"";position:absolute;left:-14px;top:.62em;
  width:5px;height:5px;border-radius:50%;background:var(--acc);opacity:.75}
.prlist>li::before{background:var(--mut);opacity:.5}
.dirp{display:none}
.dapps{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));
  margin:14px 0 4px;align-items:start}
.dapp{padding:14px 16px}
.dah{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.dah b{font-family:var(--f-disp);font-size:14.5px;font-weight:700}
.drank{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;
  border-radius:6px;background:var(--acc);color:#fff;font-size:11.5px;font-weight:700;flex:none}
.st.d-dobrar{background:rgba(10,143,88,.16);color:var(--ok)}
.st.d-consertar{background:rgba(180,83,9,.16);color:var(--warn)}
.st.d-manter{background:rgba(125,140,170,.16);color:var(--mut)}
.st.d-congelar{background:rgba(125,140,170,.12);color:var(--mut)}
.dapp .prlist{margin-top:6px}
.dcall{color:var(--tx)!important;font-weight:600}
.fcard[id]{scroll-margin-top:18px}
.fdet{margin-top:10px;border-top:1px solid var(--bd-soft);padding-top:9px}
.fdet>summary{cursor:pointer;list-style:none;font-family:var(--f-disp);font-size:11.5px;
  font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);
  display:flex;align-items:center;gap:7px}
.fdet>summary::-webkit-details-marker{display:none}
.fdet>summary::before{content:"›";font-size:15px;transition:transform .15s}
.fdet[open]>summary::before{transform:rotate(90deg)}
.fdet>summary:hover{color:var(--acc)}
.fdet table.t{font-size:12.5px}
.fdet table.t td,.fdet table.t th{padding:6px 10px}
.fgrid.one{grid-template-columns:1fr!important;gap:0}
.fgrid.one>.fcard{border:0;border-radius:0;box-shadow:none;background:transparent;
  padding:22px 0 24px;border-bottom:1px solid var(--bd)}
.fgrid.one>.fcard:last-child{border-bottom:0}
.fgrid.one>.fcard:first-child{padding-top:4px}
.fcols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;
  align-items:start}
@media(max-width:820px){.fcols{grid-template-columns:1fr;gap:12px}}
.fcol{min-width:0}
.fcol>.fnds{margin-top:0}
.fdet .ascgrid{grid-template-columns:repeat(auto-fit,minmax(118px,1fr))}
.fdetcols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;
  align-items:start}
@media(max-width:1100px){.fdetcols{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:760px){.fdetcols{grid-template-columns:1fr}}
.fdetcols>div{min-width:0;display:flex;flex-direction:column;gap:14px}
.rawbox{background:var(--bg);border:1px solid var(--bd-soft);border-radius:11px;
  padding:11px 13px;min-width:0}
.rawbox h4,.rawbox h3.team{margin:0 0 8px;font-family:var(--f-disp);font-size:10.5px;
  font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--mut)}

<body><div class="wrap"><p class="sub" style="font-size:12px;margin:0 0 14px">Exportado em 2026-10-01 16:15 · fonte: Lab Hub local</p><p class="sub"><a href="../index.html">← hub</a> · <code>_GambitStudio/.claude/skills/start-aso-pipeline/SKILL.md</code></p><div id="md"></div><script>const RAW="---\nname: start-aso-pipeline\ndescription: Coordena o processo de update de ASO de um app J\u00c1 publicado \u2014 Passo 0 com os gates por script (plataforma/locale da ASC, modo standard/small, rating-first, 4.3(b), algoritmo, PPO/release), depois encadeia os agentes especializados (aso-extractor \u2192 mercado por script \u2192 aso-longtail-miner \u2192 aso-fit-checker \u2192 SERP por script \u2192 aso-serp-analyst \u2192 aso-field-composer \u2192 aso-listing-writer \u2192 aso-reporter \u2192 [autoriza\u00e7\u00e3o] aso-deployer \u2192 gate G \u2192 deploy-verifier), agenda os checkpoints (aso-checkpoint D7/D14/D28) e fecha a itera\u00e7\u00e3o pelo n\u00famero do script. Use quando o user digitar /start-aso-pipeline ou disser \"come\u00e7ar ASO no app X\", \"atualiza o ASO do app X\", \"roda uma itera\u00e7\u00e3o de ASO\".\n---\n\n# ASO Update \u2014 COORDENADOR (n\u00e3o executa, delega)\n\nVoc\u00ea \u00e9 um coordenador MAGRO. O trabalho pesado vive nos agentes (`~/.claude/agents/`) e nos scripts (`<app>/aso-pipeline/scripts/`, `_GambitStudio/scripts/`). Voc\u00ea s\u00f3: roda os gates do Passo 0, passa contexto denso a cada est\u00e1gio, confere o contrato de sa\u00edda de cada um, encadeia e reporta.\n\nPor que a cadeia tem esta forma (reforma de 01/10/2026, `_GambitStudio/reports/2026-10-01_aso-layer-audit/`): 41 itera\u00e7\u00f5es de texto no lab, 27 chegaram \u00e0 loja e **nenhuma foi medida por script**; um deploy reportado como \"232/232 aplicado\" deixou a vers\u00e3o sem condi\u00e7\u00e3o de submeter (promo n\u00e3o herdado em 16 locales, whatsNew vazio em 29, pergunta `socialMedia` do age rating sem resposta), e o brief saiu com locale prim\u00e1rio e plataforma errados porque vinham do README. Cada gate abaixo fecha um desses buracos.\n\n`$LAB` = `_GambitStudio` \u00b7 `$PY` = `/usr/local/bin/python3` \u00b7 `./scripts/` = `<app>/aso-pipeline/scripts/`.\n\n## A cadeia (13 est\u00e1gios)\n\n| # | Est\u00e1gio | Quem | Produz (contrato de sa\u00edda) |\n|---|---------|------|----------------------------|\n| P0 | Gates + bootstrap | voc\u00ea (s\u00f3 scripts) | `current/asc_app.json`, modo, rating-first, `4.3b_risk`, lock de algoritmo, conflito PPO resolvido, itera\u00e7\u00e3o com `meta.json` v2 |\n| 1 | Coleta bruta | `aso-extractor` | `research/`: `asc_state.json`, `locales.json` (`top_locales.py`, com `generator`), `apple_popularity_<locale>_<data>.json` (`volume.py`, volume oficial), `ratings_by_store.json`, `baselines.json` (`baselines --compare`), `astro_<store>_<data>.json`, `listing_audit_live.json` (`listing_check.py` na live), `tags_us.md`, CSVs pool/candidatos, search terms do Apple Ads se houver campanha |\n| 1b | Mercado | script (o extractor roda) | `research/market/snapshot_<cc>_<data>.json` + `chart_*.json` (`market_intel.py snapshot` + `charts`), `market_diff.md` desde a itera\u00e7\u00e3o anterior |\n| 2 | Long tails por palavra | `aso-longtail-miner` | `research/longtails_<store>_<data>.csv` com `Volume Source` \u2208 {`apple-official`, `apple-below-cutoff`, `apple-ads-search-terms`, `not-verified`} |\n| 3 | Fit termo-a-termo | `aso-fit-checker` | `app_feature_inventory.md` (cada feature com a cadeia de chamada, `reachability.py`), `key_features.json`, `paywall_claims.csv`, `term_fit_<locale>.csv` (inclui os tokens NO AR) |\n| 4a | SERP medida | script: `$PY $LAB/scripts/aso/market_intel.py serp` + `gap` | `research/serp_top10_<store>.json` (`measured` true/false por termo) + `keyword_gap_<store>.csv` |\n| 4 | Winnability | `aso-serp-analyst` | `serp_winnability_<store>.csv` (+ `SERP Measured`, nota pr\u00f3pria, gap; nota < 4,0 rebaixa DOMINATE \u2192 CLIMB) |\n| 5a | Campos que indexam | `aso-field-composer` | `proposed/metadata/<locale>/{name,subtitle,keywords}.txt` (variantes em `proposed/variants/`) + `validate_proposed.py` limpo |\n| 5b | Texto que converte | `aso-listing-writer` | `proposed/listing/<locale>/{description,promotional_text,whats_new}.txt` com `listing_check.py proposed/listing` exit 0; `paywall_findings.md` vira item `do` (\u00e9 c\u00f3digo do app, nunca deploy de ASO) |\n| 6 | Relat\u00f3rio de decis\u00e3o | `aso-reporter` | `keyword_candidates.md` (mercado, convers\u00e3o, KPI de posi\u00e7\u00e3o) + `meta.json` com `meta_schema.py --cross` exit 0 + link mdview |\n| 7 | Deploy (s\u00f3 com autoriza\u00e7\u00e3o) | `aso-deployer` | `version_diff.py` live\u2192editable ANTES do 1\u00ba PATCH + restaura\u00e7\u00e3o do que a heran\u00e7a perdeu \u2192 PATCH `proposed/metadata` (e `proposed/listing` s\u00f3 com OK do Jo\u00e3o pro texto) \u2192 read-back |\n| G | Gate \"vers\u00e3o submet\u00edvel\" | `aso-deployer` | `listing_check.py --app-id N --version editable --prev live --source <src> --only submittable` \u2192 exit 0 = `status: staged` \u00b7 exit 1 = **`status: blocked`** + item `do` com os campos exatos |\n| 8 | Auditoria | `deploy-verifier` | diff contra `proposed/` + `version_diff.py` live\u2192editable (campo N\u00c3O tocado que regrediu = FAIL) |\n| D0 | Dia live | `aso-deployer` (re-spawn na data) | `metrics/d00_baseline.json` + positions do D0 + market snapshot do D0 \u2192 `status: live` |\n| 9 | Checkpoints | `aso-checkpoint` | D7 = s\u00f3 status de re-index \u00b7 D14 = 1\u00aa leitura \u00b7 D28 = fechamento |\n| 10 | Fecho | script | `pull_analytics.py final --write-meta` \u2192 `promote_winner.sh` \u2192 `registry/` |\n\n7b (CPP por keyword) e 7c (Apple Ads fase 0) continuam opcionais dentro do deployer \u2014 ver Regras.\n\n## Passo 0 (voc\u00ea) \u2014 nada de brief antes destes passos\n\nRodar de dentro de `<app>/aso-pipeline/`. Cada passo \u00e9 um script; voc\u00ea l\u00ea o exit code e a sa\u00edda, n\u00e3o interpreta dado.\n\n0. **Scripts da reforma presentes no app?** `ls scripts/{volume.py,check_research_schema.py,version_diff.py,meta_schema.py}` e `$PY scripts/pull_analytics.py mode --help`. Faltou algum = a c\u00f3pia do app \u00e9 anterior a 01/10 (o template corrigido n\u00e3o chega sozinho, F07). App em `Apps/recovery/` \u2192 `bash $LAB/aso/pipeline-template/init.sh --upgrade-scripts --target <app>/aso-pipeline --app-id <ID>`. App em `Apps/intermediate/` ou `Apps/important/` \u2192 **n\u00e3o rode o upgrade**: item `do` no now.json (\"rodar init.sh --upgrade-scripts no <app>?\") e pare aqui at\u00e9 o Jo\u00e3o dar o aval. `aso-pipeline/` inexistente \u2192 `bash $LAB/aso/pipeline-template/init.sh --target <app>/aso-pipeline --app-id <ID> --bundle-id <BUNDLE> --app-name \"<NAME>\"` (o prim\u00e1rio vem da ASC; `--primary-locale` s\u00f3 pra sobrescrever).\na. **Fatos do app pela ASC, nunca pelo README:** `$PY scripts/sync_current_from_asc.py --app-id <ID> --platform IOS` \u2192 `current/asc_app.json` (`platform: IOS`, `primaryLocale`, `primaryCategory`/`secondaryCategory`, `locales[]`, `live_version`, `editable_version`). App LIVE (READY_FOR_SALE) \u00e9 pr\u00e9-requisito. O prim\u00e1rio e a lista de locales do brief saem DAQUI.\nb. **Modo:** `$PY scripts/pull_analytics.py mode --country <CC alvo>` \u2192 `standard` (\u2265 100 instala\u00e7\u00f5es 1*/30d no pa\u00eds-alvo, m\u00e9trica = RR de instala\u00e7\u00e3o) ou `small` (< 100). **O modo small N\u00c3O para a itera\u00e7\u00e3o \u2014 troca a m\u00e9trica**: mede POSI\u00c7\u00c3O de \u2265 3 `targets.positions` por store-alvo (rank no D0, ausente = 251) contra os termos intocados do mesmo app/store, via `pull_analytics.py positions`; instala\u00e7\u00e3o vira leitura secund\u00e1ria com n. \"Ganhou posi\u00e7\u00e3o\" nunca se escreve como \"ganhou instala\u00e7\u00e3o\".\nc. **Rating-first:** `$PY scripts/pull_analytics.py ratings --app-id <ID> --countries <stores-alvo> --gate` \u2192 exit 4 (< 25 ratings ou nota < 4,0 no store-alvo) = `small` + **s\u00f3 keywords field** (nada de name/subtitle) + a alavanca de ratings vai no relat\u00f3rio; exit 3 = n\u00e3o verificado, repetir (nunca vira \"liberado\", #80b).\nd. **Risco 4.3(b):** `$PY $LAB/scripts/asc/kill_or_scale.py --app-id <ID> --days 45` \u2192 flag `4.3b_risk` (categoria saturada abaixo do piso pode ser removida, R1 achado 16) vai como AVISO no brief e no relat\u00f3rio; n\u00e3o bloqueia.\ne. **Algoritmo:** `$LAB/aso/reference/algorithm_changes.json` \u2014 evento no pa\u00eds-alvo nos \u00faltimos 14 dias = a itera\u00e7\u00e3o pode ser pesquisada, mas o deploy espera (o deployer recusa); diga a data prov\u00e1vel no now.json.\nf. **PPO rodando / release na janela:** GET de `appStoreVersionExperimentsV2` (rodando = `startDate` preenchido, nunca o campo `started`, #39b) e de vers\u00e3o em review. Conflito com a quarentena (14 dias antes / 30 depois do live) = **o Jo\u00e3o escolhe ANTES do brief**: parar o PPO ou adiar o texto. Voc\u00ea pergunta e registra a resposta; nunca para PPO por conta.\ng. **Itera\u00e7\u00e3o:** `./scripts/new_iteration.sh text <locale> <campo> --mode <standard|small>` \u2192 `meta.json` v2 (mode, `cadence.checkpoints` ISO, `quarantine {before_days:14, after_days:30}`, `targets.positions[]`) que passa em `$PY scripts/meta_schema.py <iter>`. UMA pasta por itera\u00e7\u00e3o, mesmo multi-campo/multi-locale.\n\n**Locales = base 3 + top-2 por instala\u00e7\u00f5es 90d (regra do Jo\u00e3o, 28/09/2026):** toda itera\u00e7\u00e3o cobre en-US, es-ES e pt-BR MAIS os DOIS locales com mais instala\u00e7\u00f5es NOVAS (Product Type `1*`, nunca update `7*` \u2014 LEARNINGS #53) nos \u00faltimos 90 dias: `$PY $LAB/scripts/asc/top_locales.py --app-id <ID> --days 90` (o extractor grava o `--json` em `research/locales.json`, com `generator`, e ningu\u00e9m edita \u00e0 m\u00e3o). O script mapeia pa\u00eds \u2192 locale que a storefront indexa (playbook \u00a710: MX vira es-MX, AT/DE/CH viram de-DE com en-GB, IN vira hi; c\u00f3digos aceitos pela API, #57b), e um slot com `sem tr\u00e1fego suficiente` (< 30 instala\u00e7\u00f5es) fica vazio, nunca chutado. Os 5 locales (ou menos) v\u00e3o no prompt de TODOS os est\u00e1gios.\n\nAstro Desktop aberto (MCP `http://127.0.0.1:8089/mcp`; 500 persistente \u2192 `killall Astro && open -a Astro`). O request ONGOING de App Analytics tem que existir antes da itera\u00e7\u00e3o (`pull_analytics.py baseline` cria).\n\n## Regras do coordenador\n\n- **N\u00c3O fazer an\u00e1lise voc\u00ea mesmo.** Cada regra dura vive no agente do est\u00e1gio ou no script. Se um est\u00e1gio violar (ex.: composer cortando token do mapa de prote\u00e7\u00e3o), devolver PRO AGENTE citando a regra \u2014 n\u00e3o consertar na m\u00e3o.\n- **Contrato de sa\u00edda antes de passar adiante:** depois dos est\u00e1gios 1, 2 e 4, `$PY scripts/check_research_schema.py <iter>` exit 0; depois do 5a, `validate_proposed.sh <iter>` sem BLOCKER; depois do 5b, `$PY $LAB/scripts/verify/listing_check.py <iter>/proposed/listing --source <src>` exit 0; depois do 6, `$PY scripts/meta_schema.py --cross <iter>` exit 0. Reprovou = volta pro agente do est\u00e1gio.\n- **Falha de est\u00e1gio: at\u00e9 2 retries, depois `status: blocked`.** O agente devolveu erro, sa\u00edda fora do contrato ou o script reprovou \u2192 re-spawn com o erro exato no prompt (retry 1), de novo (retry 2); falhou a 3\u00aa = grave `meta.json.status: blocked` + `blocked_by` (est\u00e1gio, erro) e item `do` no now.json com o passo exato. **O coordenador nunca produz o artefato de um est\u00e1gio** (CSV, campo, relat\u00f3rio) \u2014 foi assim que a auditoria achou CSV fora do contrato e decis\u00f5es sem rastro (F20).\n- Est\u00e1gios 1\u21926 sempre; **7-8 s\u00f3 com autoriza\u00e7\u00e3o do Jo\u00e3o** (pediu explicitamente ou disse \"sem revis\u00e3o\"). Sem autoriza\u00e7\u00e3o \u2192 parar no 6, entregar o link mdview e registrar item `do` no now.json. O texto que converte (`proposed/listing/`: description, promo, whatsNew) \u00e9 do Jo\u00e3o: a autoriza\u00e7\u00e3o tem que cit\u00e1-lo, sen\u00e3o o deployer aplica s\u00f3 os campos de \u00edndice.\n- **PATCH direto (deliver mente)** \u2014 o deployer nunca usa fastlane; o read-back e o `deploy-verifier` s\u00e3o o or\u00e1culo.\n- **Gate G decide o que se reporta:** `status: blocked` nunca vira \"feito\", \"deployed\" nem \"N/N aplicado\" \u2014 o entreg\u00e1vel \u00e9 a vers\u00e3o submet\u00edvel, n\u00e3o a contagem de PATCH.\n- **7b (CPP por keyword)** entra na mesma autoriza\u00e7\u00e3o do deploy S\u00d3 se o Jo\u00e3o viu os candidatos no relat\u00f3rio e disse que quer a p\u00e1gina; p\u00e1gina nova vai a review com a pr\u00f3xima submiss\u00e3o, o v\u00ednculo de keyword n\u00e3o (conjunto \u00fanico por p\u00e1gina). **7c (Apple Ads) \u00e9 autoriza\u00e7\u00e3o SEPARADA** \u2014 \u00e9 dinheiro: o relat\u00f3rio prop\u00f5e com or\u00e7amento/dia \u2265 5 \u00d7 CPI do storefront (padr\u00e3o s\u00f3 BR/MX, playbook \u00a73) e s\u00f3 o deployer roda se ele aprovar com essas palavras.\n- **Volume:** a fonte \u00e9 a oficial da Apple (`volume.py`); termo `apple-below-cutoff` \u00e9 TETO (\"volume < corte oficial\") e nunca compra name/subtitle; termo s\u00f3 com pop da Astro sai marcado `pop n\u00e3o confi\u00e1vel`. O report \"App Store Search Terms\" da ASC n\u00e3o existe \u2014 ningu\u00e9m o cita como fonte.\n- **Quarentena de 14 dias antes / 30 depois do live (aso_efficacy 27/09 regra 3, janela ampliada em 01/10):** sem iniciar/parar PPO e sem release de feature. Se o texto precisa de build, o build \u00e9 **s\u00f3 texto** (sem widget, prints, idiomas novos). O deployer recusa deploy com experimento APPROVED/rodando ou vers\u00e3o em review; s\u00f3 passa com `--override` expl\u00edcito seu, registrado em `meta.json.quarantine_override`. Registrar a janela no now.json pra ningu\u00e9m agendar PPO em cima.\n- **D0 = dia em que a vers\u00e3o portadora fica READY_FOR_SALE** (n\u00e3o o dia do PATCH): o deployer re-spawnado na data grava `metrics/d00_baseline.json`, as positions do D0 e o market snapshot.\n- **Checkpoints (`aso-checkpoint`), contados do `live_at`:** D7 = s\u00f3 status de re-index (sem veredito, sem rollback); **D14 = 1\u00aa leitura**; D28 = fechamento. Standard = tr\u00eas n\u00fameros: delta no pa\u00eds-alvo, delta nos outros pa\u00edses, mediana de \u22653 apps-controle na mesma janela (sem release/PPO/texto \u2014 `scan.py store_events`); \"ganhou\" s\u00f3 com IC do alvo excluindo 1,0 E acima do controle. Small = `pull_analytics.py positions` (\u0394 alvo \u00d7 \u0394 intocados). Os dois leem confounders (`algorithm_changes.json`, `market_diff.md`, eventos do app) e a CVR por territ\u00f3rio com n. Cada data vira item `wait` no now.json e um spawn do aso-checkpoint.\n- **Fechar (passo 10) = `pull_analytics.py final --write-meta` \u2192 `./scripts/promote_winner.sh <iter>`** \u2014 `status: closed` nunca com n\u00famero \u00e0 m\u00e3o nem janela retroativa. Itera\u00e7\u00e3o live h\u00e1 > 30 dias sem `results.final` aparece no `scan.py` como `aso_unmeasured`.\n- Prompts pros agentes = contexto DENSO (paths absolutos, ids, locales, modo, o output do est\u00e1gio anterior resumido). Agente n\u00e3o descobre nada que voc\u00ea j\u00e1 sabe.\n- Toda mudan\u00e7a de estado \u2192 `_GambitStudio/now.json` no MESMO turno (o Jo\u00e3o acompanha pelo site do GitHub, n\u00e3o pelo chat).\n\n## Por que essa arquitetura (contexto pro futuro)\n\nA skill monol\u00edtica antiga (backup em `SKILL.md.pre-coordinator.bak`) fazia tudo num contexto s\u00f3 e produziu uma itera\u00e7\u00e3o de 18/08 que descartou como \"vaidade pop-5\" tudo que tinha ranking e encheu o campo de apostas OUT \u2014 o Jo\u00e3o reverteu na m\u00e3o, linha a linha. As corre\u00e7\u00f5es viraram regras nos est\u00e1gios (fit contra o que o app entrega, long tails com fonte, mapa de prote\u00e7\u00e3o, \u2264 3 apostas novas, PATCH + read-back). A auditoria de 27/09 (`aso_efficacy`) mostrou que o texto mexia no ranking e quase nunca na instala\u00e7\u00e3o, e que nada era medido no dia certo; a de 01/10 (`reports/2026-10-01_aso-layer-audit/`) mostrou que a cadeia tinha s\u00f3 um dono pros campos que indexam, nenhum pros que convertem, e nenhum gate de \"vers\u00e3o submet\u00edvel\". Refer\u00eancias: `_GambitStudio/aso/learnings.md`, `aso/reference/aso-ranking-playbook.md` (Atualiza\u00e7\u00e3o 2026-10-01), LEARNINGS da reforma.\n";</script><script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script><script>document.getElementById("md").innerHTML=window.marked?marked.parse(RAW):"<pre>"+RAW.replace(/</g,"&lt;")+"</pre>";</script></div><script>(function(){try{var k="lh.scroll:"+location.pathname;var v=sessionStorage.getItem(k);if(v!==null){sessionStorage.removeItem(k);window.scrollTo(0,parseInt(v,10)||0);}document.addEventListener("submit",function(e){var f=e.target;if(f&&f.method&&f.method.toLowerCase()==="post"){sessionStorage.setItem(k,String(window.scrollY));}},true);}catch(e){}})();</script></body></html>
