/* ---------- camada de acabamento (01/10/2026) ----------
   Tipografia com duas vozes (display para títulos e números, texto para leitura),
   neutros com viés do azul da marca em vez de cinza puro, e profundidade por
   sombra em vez de só borda. Nada aqui renomeia classe: é uma camada por cima. */
:root{

  --bd:#cbd3e0; --bd-soft:#dfe5ee; --ok:#07804e; --down:#c42121; --warn:#9a4408;
  --sh:0 1px 2px rgba(16,19,26,.05),0 2px 8px rgba(16,19,26,.04);
  --sh-up:0 2px 6px rgba(16,19,26,.07),0 10px 24px rgba(16,19,26,.07);
  --cardup:#ffffff; --bdup:#b9c3d4;
  --boardtop:#e9edf5; --boardbot:#e3e8f1;
  --bar:#2563eb; --bar2:#60a5fa;
  --rad:14px;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#07090d; --card:#141922; --tx:#f7f9fc; --mut:#b2bdd0; --acc:#ccd6e6;
  --bd:#333c4c; --bd-soft:#232a36; --ok:#55e39d; --down:#ff8585; --warn:#ffbb55;
  --sh:0 1px 2px rgba(0,0,0,.4); --sh-up:0 6px 22px rgba(0,0,0,.5);
  --cardup:#1d2430; --bdup:#3d4859;
  --boardtop:#0d1218; --boardbot:#090d13;
  --bar:#5b9bff; --bar2:#9dc4ff;
}}

body{background:

h2{position:relative}
h2::after{content:"";position:absolute;left:0;top:0;width:44px;height:2px;
  background:linear-gradient(90deg, var(--acc), transparent)}
h2:first-of-type::after,h1+h2::after,.sub+h2::after{display:none}
a.tile{background:linear-gradient(170deg, color-mix(in srgb, var(--card) 100%, transparent),
  color-mix(in srgb, var(--acc) 5%, var(--card)))}
.fb i,.fs .fb i{background:linear-gradient(90deg,var(--bar),var(--bar2))}
.fgrid.one>.fcard>.fh{background:linear-gradient(180deg,
  color-mix(in srgb, var(--acc) 7%, var(--card)), var(--bd-soft))}
.ascgrid b,.tile .tv{background:linear-gradient(180deg, var(--tx), color-mix(in srgb, var(--tx) 72%, var(--mut)));
  -webkit-background-clip:text;background-clip:text;color:transparent}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
/* ---------- celular (14/10) ----------
   No iPhone a página nunca rola de lado: grade cede a largura pros filhos, tabela
   rola dentro do .twrap, o menu rola dentro da própria faixa. Quadro e big numbers
   seguem numa linha só com rolagem horizontal, em qualquer largura (João, 14/10). */
.cols>*,.cols2>*,.grid>*,.grid4>*,.dapps>*,.fgrid>*{min-width:0}
.board .hrow,.tiles{flex-wrap:nowrap!important;overflow-x:auto}
#md table{display:block;max-width:100%;overflow-x:auto}
#md p,#md li,#md :not(pre)>code{overflow-wrap:anywhere}
img,video{max-width:100%}
@media(max-width:860px){
  .topin{width:calc(100vw - 28px)}
}
@media(max-width:620px){
  /* header do celular (24/10): UMA linha de 52 px — cavalo + abas que rolam de
     lado com encaixe; a data sai do header fixo e vira a 1ª linha da página. */
  .topin{flex-wrap:nowrap;gap:2px;padding:4px 0;
    padding-left:env(safe-area-inset-left,0px)}
  a.brand{flex:none;min-width:44px;min-height:44px;justify-content:center;gap:0}
  a.brand .mark{width:24px;height:24px}
  a.brand .bname{display:none}
  .stamp{display:none}
  .navs{flex:1 1 auto;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;
    -webkit-overflow-scrolling:touch;scroll-snap-type:x proximity;overscroll-behavior-x:contain;
    margin-right:-14px;padding:0 max(14px,env(safe-area-inset-right,0px)) 0 2px;gap:2px;
    -webkit-ma[redigido]:linear-gradient(90deg,#000 calc(100% - 28px),transparent);
    ma[redigido]:linear-gradient(90deg,#000 calc(100% - 28px),transparent)}
  .navs::-webkit-scrollbar{display:none}
  a.nav{flex:none;scroll-snap-align:start;min-height:44px;padding:0 12px;gap:6px;font-size:14px}
  a.nav .flw-mon{width:24px;height:24px}
  .mstamp{display:block;margin:-10px 0 10px;font-family:var(--f-disp);font-size:15px;font-weight:700;color:var(--tx)}
  .mstamp+style+h2,.mstamp+h2{margin-top:6px}
  div.own{padding:6px 12px;margin:0 0 12px;gap:10px}
  div.own img.flw-mon{width:40px;height:40px}
  details.pk-legend{padding:0 14px;margin-bottom:12px}
  details.pk-legend>summary{min-height:44px;padding:11px 0}
  body{font-size:15px;overflow-wrap:break-word}
  h1{font-size:24px}
  .sub,.card p,.row,.dirp,.prw,.nots li,.dirlist>li{font-size:14px}
  table.t td,table.t th{font-size:13.5px}
  table.t td:first-child,table.t th:first-child{min-width:148px}
  #md{padding:16px 14px}
  .board{padding:12px 0 14px;margin-left:0;margin-right:0}
  .boardh{padding:0 14px}
  .board .hrow{padding:12px 14px 12px;scroll-padding:0 14px}
  a.more,.btn{display:inline-flex;align-items:center;min-height:44px}
  .row{min-height:44px}
  .del{min-width:44px;min-height:44px;opacity:.7}
  .iid{position:relative}
  .iid::after{content:"";position:absolute;inset:-12px -8px}
  .fdet>summary,details>summary{min-height:44px}
  .fs{grid-template-columns:minmax(0,118px) minmax(0,1fr) auto}
  .leak,.fnote{margin-left:0}
  /* quadro no celular: rolagem lateral, como quadro (João 14/10, e de novo 25/10: "deixa como quadro que eu
     consigo fazer scroll horizontal, ficou muito extenso na vertical" — o empilhamento de 25/10 saiu).
     Fazer abre o quadro, com o item em trabalho no topo; Backlog fica por último. */
  .board .hcol{order:3}.board .hcol.k-do{order:1}.board .hcol.k-wait{order:2}.board .hcol.k-backlog{order:4}
  .row.working .vwork{flex-wrap:wrap}
  .row .sub{white-space:normal}
  /* big numbers em grade de 2 no celular: nada cortado */
  .tiles{display:grid!important;grid-template-columns:1fr 1fr;overflow-x:visible!important}
  .tiles>.tile,a.tile{min-width:0!important;padding:10px 12px}
  .tile .tv{font-size:clamp(17px,5.4vw,22px)!important;white-space:normal}
}

(detalhes na se\u00e7\u00e3o 3).\n- **O edital exige atestado de fornecimento de licen\u00e7a SaaS** e a empresa n\u00e3o tem nenhum. Para disputar, seria preciso marcar *\"cumpre plenamente os requisitos de habilita\u00e7\u00e3o\"*, o que seria uma declara\u00e7\u00e3o falsa.\n- **D\u00e1 preju\u00edzo at\u00e9 no pre\u00e7o m\u00e1ximo.** O Premium custa \u00e0 Anthropic US$ 1.200/ano, \u2248 R$ 7.420 j\u00e1 com IOF, contra um teto de R$ 7.389,82 antes do imposto. **O piso com lucro fica acima do teto em todos os itens.**\n- **O caixa n\u00e3o fecha.** A Anthropic cobra o plano anual adiantado (\u2248 R$ 89 mil para o lote 1 inteiro), e a Prefeitura paga 1/12 por m\u00eas, depois do m\u00eas usado.\n- A compra **continua aberta**: os 3 itens est\u00e3o \"Em andamento\", sem resultado. Simplesmente n\u00e3o \u00e9 para n\u00f3s.\n\n---\n\n## 1. Ainda est\u00e1 aberta? Onde e como\n\n| Item | O que diz |\n|---|---|\n| Situa\u00e7\u00e3o no PNCP | \"Divulgada no PNCP\". Itens 1, 2 e 3 **\"Em andamento\", `temResultado: false`**. Nada homologado. **Aberta** |\n| Modalidade | Preg\u00e3o Eletr\u00f4nico, **Registro de Pre\u00e7os**, menor pre\u00e7o **por lote**, modo **aberto** |\n| Lotes | **Lote 1 (ampla):** item 1 = 30 \u00d7 Claude Team Standard (m\u00e1x. R$ 1.646,99/ano) e item 2 = 6 \u00d7 Claude Team Premium (m\u00e1x. R$ 7.389,82/ano), total R$ 93.748,62. **Lote 2 (exclusivo ME/EPP):** item 3 = 10 \u00d7 ChatGPT Business Standard (m\u00e1x. R$ 1.432,14/ano), total R$ 14.321,40 |\n| Plataforma | **BLL, Bolsa de Licita\u00e7\u00f5es e Leil\u00f5es** (`bll.org.br`). Segundo terceiros (Effecti, ConLicita\u00e7\u00e3o), o cadastro \u00e9 gratuito e validado em at\u00e9 24 h \u00fateis. A taxa s\u00f3 vem para quem vence: ~1,5% at\u00e9 R$ 40 mil por lote, ou **R$ 600 fixos** acima disso. Confirmar no regulamento vigente |\n| Propostas | 23/11 at\u00e9 **14/12/2026 (segunda), 08:00** |\n| Sess\u00e3o | Abre em 14/12 \u00e0s 08:00. **Lances a partir das 08:30**, um lote por vez |\n| Lances | 10 min + prorroga\u00e7\u00e3o autom\u00e1tica de 2 min a cada lance nos 2 min finais (7.2). Intervalo m\u00ednimo: R$ 50 no lote 1 e R$ 10 no lote 2 (7.2.1) |\n| Depois dos lances | O 1\u00ba colocado tem **2 h** (prorrog\u00e1veis por mais 2) para mandar a proposta ajustada e a habilita\u00e7\u00e3o (8.2) |\n| Impugna\u00e7\u00e3o e esclarecimento | At\u00e9 3 dias \u00fateis antes, ou seja, **at\u00e9 09/12**, s\u00f3 pela plataforma (16.1) |\n| Regras de pre\u00e7o | **Nenhum pre\u00e7o unit\u00e1rio pode passar do m\u00e1ximo**, sob pena de desclassifica\u00e7\u00e3o (6.1 / TR 13.2). Pre\u00e7os fixos por 12 meses a contar de 13/11/2026. **C\u00e2mbio e reajuste do fabricante n\u00e3o d\u00e3o reajuste autom\u00e1tico**, s\u00f3 pedido de reequil\u00edbrio com prova (TR 11.2) |\n| Ades\u00e3o | Proibida (3.6). Munic\u00edpio \u00e9 o \u00fanico contratante. **Sem garantia de consumo**: o m\u00ednimo por pedido \u00e9 1 licen\u00e7a (3.3) |\n\n---\n\n## 2. Habilita\u00e7\u00e3o: o que pedem, o que temos e como resolver\n\nClassifica\u00e7\u00e3o: **1 = resolve at\u00e9 o prazo** \u00b7 **2 = tenta assim mesmo** (pior caso: recusa; LC 123 art. 43, Lei 14.133 art. 64) \u00b7 **3 = bloqueio**. Uma declara\u00e7\u00e3o obrigat\u00f3ria que seria falsa \u00e9 sempre 3.\n\n| # | Exig\u00eancia (item) | Temos? (`documentos-empresa/`) | Classe | Como resolver |\n|---|---|---|---|---|\n| 0 | Credenciamento na BLL (4.1) | N\u00e3o | 1 | Cadastro online, valida\u00e7\u00e3o em at\u00e9 24 h \u00fateis. S\u00f3 faria sentido se o resto passasse |\n| 1 | Contrato social registrado (9.1 c) | **Sim**, certid\u00e3o JUCESP de 03/08/2026 | ok | \u2014 |\n| 2 | Cart\u00e3o CNPJ (9.2 a) | **Sim**, baixado em 27/11/2026 | ok | Emitir outro no dia |\n| 3 | Inscri\u00e7\u00e3o municipal/estadual \"pertinente\" (9.2 b) | N\u00e3o | 1 | FDC do CCM de SP. Estadual: consulta Cadesp \"sem IE\" (a empresa s\u00f3 presta servi\u00e7o) |\n| 4 | CND federal (9.2 c) | **Sim**, at\u00e9 28/04/2027 | ok | \u2014 |\n| 5 | Estadual e municipal da sede (9.2 d) | N\u00e3o (em emiss\u00e3o) | 1 | SEFAZ-SP (n\u00e3o inscritos) + PGE-SP (d\u00edvida ativa) + Certid\u00e3o Conjunta Mobili\u00e1ria SP. Saem online |\n| 6 | CRF do FGTS (9.2 e) | N\u00e3o (em emiss\u00e3o) | 1, sen\u00e3o 2 | Caixa online. Se der \"informa\u00e7\u00f5es insuficientes\", entra o art. 43 da LC 123 (9.2.1) |\n| 7 | CNDT (9.2 f) | **Sim**, at\u00e9 28/04/2027 | ok | \u2014 |\n| 8 | **Fal\u00eancia de PJ**, emitida h\u00e1 no m\u00e1ximo 90 dias (9.3 a) | **N\u00e3o**. O arquivo `x_` \u00e9 de pessoa f\u00edsica | 1 | Pedido no e-SAJ do TJSP, certid\u00e3o de distribui\u00e7\u00e3o de fal\u00eancias e recupera\u00e7\u00f5es em nome da PJ. At\u00e9 ~5 dias \u00fateis |\n| 9 | Balan\u00e7o dos 2 \u00faltimos exerc\u00edcios com LG, SG e LC \u2265 1, ou PL \u2265 10% do lote (9.3 b) | N\u00e3o | 1 | **Balan\u00e7o de abertura** (a empresa foi criada no exerc\u00edcio, art. 65 \u00a71\u00ba, previsto no pr\u00f3prio 9.3 b), feito pela Contabilizei. Sem passivo, os \u00edndices atendem. Os R$ 1.000 de PL **n\u00e3o** chegam aos 10% (R$ 9.375 no lote 1, R$ 1.432 no lote 2), ent\u00e3o a via precisa ser a dos \u00edndices |\n| 10 | **Atestado** de fornecimento de **licen\u00e7as SaaS ou assinaturas corporativas de software** (9.4 / TR 14.4) | **N\u00e3o** | **3** | Ver a se\u00e7\u00e3o 4 |\n| 11 | Declara\u00e7\u00e3o unificada (Anexo V) + campo do sistema (5.2): *\"cumpre plenamente os requisitos de habilita\u00e7\u00e3o\"* | \u2014 | **3** | Sem atestado, a declara\u00e7\u00e3o \u00e9 **falsa** (art. 155 VIII, inidoneidade de 3 a 6 anos). N\u00e3o marcar |\n| 12 | Declara\u00e7\u00e3o (TR 14.5 / Anexo V): licen\u00e7as *\"originais, adquiridas no ambiente oficial do fabricante ou por seu canal de distribui\u00e7\u00e3o, ativadas em ambiente de titularidade do Munic\u00edpio\"* | \u2014 | **3** | Comprar em claude.ai \u00e9, ao p\u00e9 da letra, o \"ambiente oficial\". S\u00f3 que **repassar com margem \u00e9 revenda**, e isso a Anthropic pro\u00edbe sem aprova\u00e7\u00e3o (se\u00e7\u00e3o 3). Sem a aprova\u00e7\u00e3o escrita, a licen\u00e7a n\u00e3o fica \"regular durante toda a vig\u00eancia\" (TR 7 a) |\n| 13 | ME/EPP, menor, reserva de cargos, independ\u00eancia da proposta | \u2014 | 1 | S\u00e3o verdadeiras |\n| \u2014 | Carta do fabricante, credenciamento ou certifica\u00e7\u00e3o | \u2014 | **n\u00e3o exigido** | O edital diz expressamente que n\u00e3o exige (9.4 e 14.6). **S\u00f3 que isso n\u00e3o muda os termos da Anthropic.** O edital n\u00e3o pede autoriza\u00e7\u00e3o de revenda, mas o contrato com o fabricante pede |\n\n---\n\n## 3. A pergunta-chave: pode comprar Claude Team e repassar para a Prefeitura?\n\n**Resposta curta: n\u00e3o, sem aprova\u00e7\u00e3o expressa e por escrito da Anthropic.**\n\nO que dizem os textos atuais:\n\n- **Commercial Terms of Service** (valem para Team e Enterprise; anthropic.com/legal/commercial-terms, vigentes desde 17/06/2025), se\u00e7\u00e3o D.4: o cliente n\u00e3o pode *\"resell the Services except as expressly approved by Anthropic.\"* Na se\u00e7\u00e3o M.4: *\"Neither party may assign its rights or delegate its obligations under these Terms\"* sem consentimento pr\u00e9vio por escrito. Logo, criar a organiza\u00e7\u00e3o no nosso nome e pass\u00e1-la \u00e0 Prefeitura tamb\u00e9m esbarra nisso. No pre\u00e2mbulo, o cliente \u00e9 *\"the organization, company, or other entity that you represent\"*.\n- **Claude Partner Network Agreement** (anthropic.com/legal/cpna, de 03/06/2026), se\u00e7\u00e3o C.4: *\"acceptance into the Program does not authorize you to access, use, resell or sublicense Anthropic Services.\"* A J.5 inclui expressamente *\"Team and Enterprise services\"*. Ou seja, **nem entrar no programa de parceiros (gr\u00e1tis, lan\u00e7ado em 12/03/2026) d\u00e1 direito de revender**. A revenda depende de um acordo de revenda \u00e0 parte, que a Anthropic s\u00f3 fecha com quem ela escolhe. A SoftwareOne foi noticiada (ABES) como revendedora autorizada. N\u00e3o achei uma lista p\u00fablica de revendedores no Brasil.\n- **Como funciona o Team, na pr\u00e1tica:** o cart\u00e3o de cobran\u00e7a s\u00f3 pode ser cadastrado por quem \u00e9 *Owner* ou *Primary Owner* (support.claude.com, roles), e s\u00f3 se aceita cart\u00e3o de cr\u00e9dito, d\u00e9bito ou pr\u00e9-pago. O edital exige que o Primary Owner seja o servidor Davidson e pro\u00edbe que a contratada continue como administradora depois da ativa\u00e7\u00e3o sem autoriza\u00e7\u00e3o formal (TR 3.1.2-3.1.3). Pagar com o nosso cart\u00e3o exigiria ficar como Owner. Isso \u00e9 poss\u00edvel com autoriza\u00e7\u00e3o formal, mas continua sendo revenda.\n- **E se a Prefeitura for o \"Customer\" e n\u00f3s s\u00f3 pagarmos?** Na pr\u00e1tica \u00e9 revenda: n\u00f3s cobramos da Prefeitura pelo acesso aos Services, com margem. Sem aprova\u00e7\u00e3o, a Anthropic pode suspender a conta. **Pelo TR 7 a, a contratada responde pela suspens\u00e3o**, com multa de 10-20% (TR 15 c).\n- **A via \"canal de distribui\u00e7\u00e3o\"** (comprar de um revendedor autorizado que permita sub-revenda) \u00e9 leg\u00edtima. S\u00f3 que sai **mais caro** que o pre\u00e7o de lista e piora a conta da se\u00e7\u00e3o 5.\n- **Lote 2 (ChatGPT Business):** a mesma coisa. O OpenAI Services Agreement (vigente desde 01/01/2026), se\u00e7\u00e3o 3.1, diz: *\"Customer may not resell or lease access to its Account or any End User Account.\"*\n\n---\n\n## 4. Qualifica\u00e7\u00e3o t\u00e9cnica: o atestado\n\n**O texto que decide (9.4 / TR 14.4):** *\"atestado(s) de capacidade t\u00e9cnica, emitido(s) por pessoa jur\u00eddica de direito p\u00fablico ou privado, que comprove(m) o fornecimento de licen\u00e7as de software em nuvem (SaaS) ou assinaturas corporativas de software, compat\u00edvel(is) em caracter\u00edsticas com o objeto, sem exig\u00eancia de quantitativo m\u00ednimo (art. 67, II).\"*\n\n- **N\u00e3o temos.** O portf\u00f3lio (gambitstudiotech.com e os apps iOS) n\u00e3o \u00e9 atestado, e nossos apps s\u00e3o vendidos ao consumidor pela Apple, n\u00e3o fornecidos a uma pessoa jur\u00eddica.\n- Diferente do SEMAE, aqui o edital n\u00e3o tem cl\u00e1usula que prevale\u00e7a e dispense o atestado. Ele \u00e9 exigido de forma clara e \u00fanica.\n- **Classe 3.** Sem atestado, marcar \"cumpre plenamente\" \u00e9 declara\u00e7\u00e3o falsa. Pela dilig\u00eancia do art. 64 s\u00f3 d\u00e1 para juntar um atestado de algo **que j\u00e1 existia** no dia 14/12. Um atestado de favor ou de fornecimento que n\u00e3o aconteceu \u00e9 fraude.\n- S\u00f3 sairia da classe 3 se at\u00e9 14/12 existir um fornecimento **real** de licen\u00e7a SaaS a uma PJ, com atestado verdadeiro. Mesmo assim os bloqueios das se\u00e7\u00f5es 3 e 5 continuam.\n\n---\n\n## 5. Escopo, esfor\u00e7o e pre\u00e7o\n\n**O que teria que entregar** (TR 3-6): ativar em at\u00e9 **5 dias \u00fateis** da Ordem de Fornecimento, numa organiza\u00e7\u00e3o em nome do Munic\u00edpio (dom\u00ednio @scpalmeiras.sp.gov.br, Primary Owner = servidor); entregar o Relat\u00f3rio de Ativa\u00e7\u00e3o com prints do console; dar **suporte em portugu\u00eas** em dias \u00fateis das 8h \u00e0s 17h, com 1\u00ba atendimento em **4 h \u00fateis** se houver incidente; dar **uma capacita\u00e7\u00e3o ao vivo de 2 h por lote** (at\u00e9 30 pessoas, com grava\u00e7\u00e3o e certificado) em at\u00e9 30 dias; avisar o fim da vig\u00eancia com 30 dias de anteced\u00eancia; cooperar na transi\u00e7\u00e3o. **S\u00e3o ~25 h no ano.**\n\n**Pagamento (TR 10):** 12 parcelas de 1/12, **sempre depois do m\u00eas usado**. O atesto sai at\u00e9 o 5\u00ba dia \u00fatil, e o pagamento em at\u00e9 30 dias depois. **O primeiro dinheiro chega 35-65 dias ap\u00f3s a ativa\u00e7\u00e3o.** O pr\u00e9-pagamento ao fabricante \u00e9 *\"risco e \u00f4nus exclusivo da contratada\"* (10.3).\n\n**Pre\u00e7o de lista** (claude.com/pricing, 27/11/2026; impostos \u00e0 parte):\n\n| Assento | Anual (cobrado de uma vez, no in\u00edcio) | Mensal |\n|---|---|---|\n| Team Standard | US$ 20/m\u00eas = **US$ 240/ano** | US$ 25 |\n| Team Premium | US$ 100/m\u00eas = **US$ 1.200/ano** | US$ 125 |\n| ChatGPT Business Standard | US$ 20/m\u00eas = US$ 240/ano | US$ 25 |\n\nA Anthropic diz que *\"Pricing, currency, and tax handling vary by region\"*. Talvez o checkout no Brasil mostre o pre\u00e7o em R$. **N\u00e3o conferi logado** e n\u00e3o muda o veredito.\n\n**Conta** (PTAX de 26/11 = 5,7446; cart\u00e3o com +4% de spread; IOF de 3,5% no cart\u00e3o internacional; Simples a 15,5%; pior caso com d\u00f3lar +5%, como manda a Regra de risco):\n\n| Item | Teto do edital | Fica para n\u00f3s no teto (\u221215,5%) | Custo anual (base) | Custo anual (pior caso) | **Resultado por assento no teto (pior caso)** | **Piso com lucro (pior caso)** |\n|---|---|---|---|---|---|---|\n| Claude Standard | R$ 1.646,99 | R$ 1.391,71 | R$ 1.484 | R$ 1.558 | **\u2212R$ 167** | R$ 1.844 (> teto) |\n| Claude Premium | R$ 7.389,82 | R$ 6.244,40 | R$ 7.420 | R$ 7.791 | **\u2212R$ 1.547** | R$ 9.220 (> teto) |\n| ChatGPT Business | R$ 1.432,14 | R$ 1.210,16 | R$ 1.484 | R$ 1.558 | **\u2212R$ 348** | R$ 1.844 (> teto) |\n\n- **Lote 1 cheio, no teto:** custo de ~R$ 93,5 mil (pior caso) contra R$ 79,2 mil l\u00edquidos. **Preju\u00edzo de ~R$ 16 mil**, ainda sem a taxa da BLL (R$ 600) e as ~25 h de trabalho.\n- **D\u00f3lar de equil\u00edbrio (PTAX):** Standard a R$ 5,39, Premium a R$ 4,83, ChatGPT a R$ 4,68. Hoje est\u00e1 em ~5,56-5,74.\n- **Nem no melhor cen\u00e1rio fecha:** com Simples a 6% (Anexo III com fator R) e d\u00f3lar base, o Standard d\u00e1 +R$ 64 por assento, mas o Premium ainda perde R$ 474 por assento.\n- **No plano mensal \u00e9 pior**, porque o mensal custa 25% mais.\n- **Imposto de importa\u00e7\u00e3o de servi\u00e7o** (IRRF, PIS/COFINS-Importa\u00e7\u00e3o e ISS sobre o pagamento \u00e0 Anthropic): n\u00e3o entrou na conta. Na pr\u00e1tica, quem paga por cart\u00e3o s\u00f3 recolhe o IOF. A formalidade completa pioraria a margem em 10-30%. Confirmar com a Contabilizei se um dia houver revenda autorizada.\n- **Caixa:** com o anual adiantado, o lote 1 cheio pede **~R$ 89 mil no cart\u00e3o no 1\u00ba dia**. A recupera\u00e7\u00e3o leva 13-14 meses. O capital \u00e9 de R$ 1.000.\n\n**Concorr\u00eancia esperada:** o lote 1 \u00e9 amplo, ent\u00e3o revendedores autorizados com desconto de canal (tipo SoftwareOne ou integradores grandes) conseguem ficar abaixo do teto. Quem compra a pre\u00e7o de lista n\u00e3o consegue. O lote 2 tem teto abaixo do pre\u00e7o de lista: **a chance de sair deserto ou fracassado \u00e9 real**, e se sair, o \u00f3rg\u00e3o vai precisar refazer o or\u00e7amento.\n\n---\n\n## 6. Veredito: **NO-GO**\n\n**Os bloqueios (classe 3):**\n\n1. **Revenda proibida sem aprova\u00e7\u00e3o expressa da Anthropic** (Commercial Terms D.4 e CPNA C.4). O mesmo vale para a OpenAI no lote 2 (Services Agreement 3.1).\n2. **Falta o atestado de fornecimento SaaS.** A declara\u00e7\u00e3o de que \"cumpre plenamente\" seria falsa.\n3. **O piso com lucro fica acima do teto em todos os itens**, e o caixa adiantado (~R$ 89 mil) \u00e9 incompat\u00edvel com a empresa.\n\n**Para o Degrau 0 do MAPA:** revender licen\u00e7a de IA de marca de terceiro **s\u00f3 com acordo de revenda por escrito do fabricante** e desconto de canal de no m\u00ednimo ~25-35% sobre a lista. Sem isso, o modelo n\u00e3o fecha nem juridicamente nem na conta. A vantagem do MAPA (\"IA gen\u00e9rica sem marca\") n\u00e3o serve aqui, porque o edital indica marca (art. 41, I, b).\n\n**Checklist** (nada obrigat\u00f3rio, porque \u00e9 NO-GO):\n\n| Quando | O qu\u00ea |\n|---|---|\n| \u2014 | **N\u00e3o** fazer o cadastro na BLL por causa deste edital |\n| At\u00e9 09/12 | (S\u00f3 se o Jo\u00e3o quiser, sem mudar o veredito) esclarecimento pela BLL perguntando se o \u00f3rg\u00e3o conferiu se o revendedor tem autoriza\u00e7\u00e3o do fabricante. **N\u00e3o fiz nada disso** |\n| 14/12, 08:30 | Sess\u00e3o. Vale acompanhar pelo PNCP se sair deserta ou fracassada no lote 2, porque isso \u00e9 sinal de que o or\u00e7amento est\u00e1 abaixo do custo |\n| Pend\u00eancias gerais (servem para outros editais) | Fal\u00eancia de PJ no TJSP e balan\u00e7o de abertura com a Contabilizei. Os dois aparecem em quase todo preg\u00e3o |\n\n**N\u00e3o fiz nada externo:** n\u00e3o contatei a Prefeitura nem a Anthropic, n\u00e3o me cadastrei em nada e n\u00e3o enviei nada.\n\n---\n\n### Fontes externas\n- [Anthropic Commercial Terms](https://www.anthropic.com/legal/commercial-terms): D.4 (resale), M.4 (assignment), vigentes desde 17/06/2025.\n- [Claude Partner Network Agreement](https://www.anthropic.com/legal/cpna): C.4 e J.5, de 03/06/2026.\n- [An\u00fancio do Claude Partner Network](https://anthropic.com/news/claude-partner-network), de 12/03/2026: gr\u00e1tis, sem men\u00e7\u00e3o a revenda.\n- [Pre\u00e7os do Claude](https://claude.com/pricing): Team Standard US$ 20/25 e Premium US$ 100/125, de 2 a 150 assentos.\n- [Como \u00e9 calculada a cobran\u00e7a do Team](https://support.claude.com/en/articles/9267289-how-is-my-team-plan-bill-calculated): o anual \u00e9 cobrado de uma vez no in\u00edcio; *\"Pricing, currency, and tax handling vary by region.\"*\n- [Pap\u00e9is no Team/Enterprise](https://support.claude.com/en/articles/9267276-what-roles-are-available-on-the-team-and-enterprise-plans): s\u00f3 Owner ou Primary Owner mexe na cobran\u00e7a; s\u00f3 cart\u00e3o.\n- [OpenAI Services Agreement](https://openai.com/policies/services-agreement/), se\u00e7\u00e3o 3.1, vigente desde 01/01/2026; [ChatGPT Business](https://help.openai.com/en/articles/8792828-chatgpt-business-overview), US$ 20 no anual e US$ 25 no mensal.\n- [ABES: SoftwareOne revendedora autorizada Anthropic](https://abes.org.br/en/?p=108066).\n- [Guia BLL (ConLicita\u00e7\u00e3o)](https://conlicitacao.com.br/bll-compras-guia-para-licitantes/):
