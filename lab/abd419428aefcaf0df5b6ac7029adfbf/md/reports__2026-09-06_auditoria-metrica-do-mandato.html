<body><div class="wrap"><p class="sub" style="font-size:12px;margin:0 0 14px">Exportado em 2026-10-01 15:21 · fonte: Lab Hub local</p><p class="sub"><a href="../index.html">← hub</a> · <code>_GambitStudio/reports/2026-09-06_auditoria-metrica-do-mandato.md</code></p><div id="md"></div><script>const RAW="# Auditoria da m\u00e9trica que julga o mandato (06/09/2026)\n\nO mandato 02/09\u219202/10 \u00e9 julgado por **\"US$200 de receita do conjunto OU um app com +300\ninstala\u00e7\u00f5es (Product Type 1*) em 30 dias vs a baseline\"**. Antes do checkpoint de 02/10,\nesta auditoria pergunta se o n\u00famero que julga mede o que diz medir.\n\n**Veredito: o juiz est\u00e1 CERTO \u2014 e a discrep\u00e2ncia que motivou a auditoria estava no OUTRO\nn\u00famero da mesma tela.** `downloads` (Sales Report, 1*) \u00e9 fiel ao relat\u00f3rio cru da Apple.\nQuem estava errado era `funnel.first_downloads` (App Store Analytics), que somava um\nbackfill de 8 meses como se fosse a semana corrente. O painel encostava os dois lado a\nlado sem dizer que eram coisas diferentes.\n\n---\n\n## 1. A aritm\u00e9tica do 130 vs 909 (Sueca, App Store ID 1491372792)\n\nO `fetch_funnel` pegava as 4 \u00faltimas inst\u00e2ncias WEEKLY **por `processingDate`** e somava\ntudo. S\u00f3 que o dado de cada linha vem carimbado na coluna `Date`, que **n\u00e3o \u00e9** o\nprocessingDate \u2014 e a **primeira inst\u00e2ncia de um request ONGOING traz um BACKFILL** com\nmeses de hist\u00f3rico junto da semana.\n\nInst\u00e2ncias do relat\u00f3rio `r4` (App Downloads Detailed) da Sueca, medidas:\n\n| processingDate | segmentos | datas do DADO | first-time |\n|---|---|---|---|\n| 2026-08-07 | 1 | 2026-07-27 | 22 |\n| **2026-08-14** | **2** | 2026-08-03 **+ 2025-12-29..2026-07-27** | 18 **+ 845** |\n| 2026-08-21 | 1 | 2026-08-10 | 20 |\n| 2026-08-28 | 1 | 2026-08-17 | 16 |\n| 2026-09-04 | 1 | 2026-08-24 | 10 |\n\n`863 + 20 + 16 + 10 = 909` \u2014 o n\u00famero exato que estava no `dashboard.json`. Reproduzido\nbyte a byte a partir dos TSV baixados da ASC.\n\n**O 909 \u00e9, ent\u00e3o: 64 downloads reais das 4 semanas + 845 de oito meses de hist\u00f3rico.**\nO mesmo mecanismo produzia `impressions: 72015` (67.177 do backfill + 1.945 + 1.485 + 1.408).\nPior: o backfill **re-entrega datas que outra inst\u00e2ncia j\u00e1 trouxe** \u2014 a semana de\n2026-07-27 aparecia duas vezes (22 na inst\u00e2ncia de 08-07 e 22 dentro do backfill).\n\n### E os 64 restantes ainda n\u00e3o s\u00e3o instala\u00e7\u00e3o\n\nMesmo limpo, o funil v\u00ea **64** onde o Sales Report tem **119** instala\u00e7\u00f5es nas mesm\u00edssimas\n4 semanas (03/08\u201330/08). A causa \u00e9 o **piso de privacidade** da Apple: nos relat\u00f3rios\nDETAILED, combina\u00e7\u00e3o de dimens\u00f5es com menos de 5 eventos n\u00e3o \u00e9 publicada \u2014 ela some\ninteira, n\u00e3o vira zero. Medido na amostra da Sueca: **nenhuma linha com `Counts` < 5, e 62\nlinhas exatamente em 5**. Com `data \u00d7 vers\u00e3o \u00d7 device \u00d7 vers\u00e3o de OS \u00d7 origem \u00d7 tipo de\np\u00e1gina \u00d7 territ\u00f3rio`, app pequeno perde quase tudo.\n\nSemana a semana, as duas fontes:\n\n| semana | Sales 1* (instala\u00e7\u00e3o) | Analytics first-time | visto |\n|---|---|---|---|\n| 27/07\u201302/08 | 48 | 22 | 46% |\n| 03/08\u201309/08 | 27 | 18 | 67% |\n| 10/08\u201316/08 | 35 | 20 | 57% |\n| 17/08\u201323/08 | 31 | 16 | 52% |\n| 24/08\u201330/08 | 26 | 10 | 38% |\n| **4 semanas** | **119** | **64** | **54%** |\n\nIsso fecha o padr\u00e3o que parecia contradit\u00f3rio: onde h\u00e1 backfill o funil v\u00ea **7\u00d7 mais**\n(Sueca); onde n\u00e3o h\u00e1, v\u00ea **muito menos ou zero** (Truco 6 contra 66; Bible, Peptide,\nSafeDoc, Cronos e Foguetinho com zero contra 5\u201325). N\u00e3o \u00e9 fator de escala: s\u00e3o dois\ndefeitos independentes empilhados \u2014 contamina\u00e7\u00e3o por backfill para cima, piso de\nprivacidade para baixo.\n\nE o `weeks` variava (2, 3 ou 4) porque os requests ONGOING foram provisionados em datas\ndiferentes. **Cinco dos dez apps de recovery n\u00e3o t\u00eam request nenhum** \u2014 para eles o funil\nsimplesmente n\u00e3o existe.\n\n---\n\n## 2. O Sales Report est\u00e1 certo \u2014 mas uma fam\u00edlia de linhas estava sendo jogada fora\n\nReagrupei os 47 relat\u00f3rios di\u00e1rios crus (`GET /v1/salesReports`, vendor [vendor]) por\n`Product Type Identifier` sem usar o c\u00f3digo do lab: **130 instala\u00e7\u00f5es (1F) para a Sueca na\njanela 06/08\u201304/09**, id\u00eantico ao painel. O `pull_data.py` l\u00ea o relat\u00f3rio fielmente.\n\nO que ningu\u00e9m tinha visto: al\u00e9m de `1*` (instala\u00e7\u00e3o) e `7*` (atualiza\u00e7\u00e3o), existe a\nfam\u00edlia **`3*` (3 / 3F / F3) = REDOWNLOAD/restore** \u2014 o mesmo Apple ID reinstalando. Ela\nn\u00e3o estava em bucket nenhum: **5.632 unidades em 30 dias no portf\u00f3lio, invis\u00edveis**.\n\nA identifica\u00e7\u00e3o \u00e9 emp\u00edrica: a raz\u00e3o `3*/1*` cresce com o tamanho da base legada, que \u00e9\nexatamente o comportamento de reinstala\u00e7\u00e3o \u2014\n\n| app | 1* | 3* | 7* (updates) | 3*/1* |\n|---|---|---|---|---|\n| Peptide (novo) | 24 | 2 | 70 | 8% |\n| DevLingo | 23 | 6 | 87 | 26% |\n| Neon | 82 | 42 | 3.316 | 51% |\n| Sueca | 130 | 100 | 1.006 | 77% |\n| iPhotos | 165 | 256 | 17.889 | 155% |\n| Truco | 66 | 130 | 2.899 | 197% |\n\n**`3*` N\u00c3O pode entrar em `downloads`.** Somar premiaria app velho (o Truco dobraria) e\nquebraria a compara\u00e7\u00e3o com a baseline. Agora tem bucket pr\u00f3prio, `redownloads`, ao lado de\n`updates`.\n\n---\n\n## 3. O juiz do mandato\n\n**Use `downloads` do `dashboard.json` (Sales Report, Product Type 1*). \u00c9 o n\u00famero certo, e\no `compare.py` j\u00e1 usa exatamente ele.** Justificativa: 1* \u00e9 a \u00fanica contagem de *aquisi\u00e7\u00e3o\nde usu\u00e1rio novo* que existe \u2014 atualiza\u00e7\u00e3o (7*) infla (LEARNINGS #53) e redownload (3*)\nconta quem o app j\u00e1 tinha. O funil do App Analytics n\u00e3o serve de juiz nem depois de\ncorrigido: ele \u00e9 **medido com supress\u00e3o**, e a supress\u00e3o morde mais no app pequeno, que \u00e9\njustamente onde o mandato precisa enxergar crescimento.\n\n### A baseline continua v\u00e1lida \u2014 e essa \u00e9 a parte que salva o m\u00eas\n\nA baseline de 02/09 guardou `downloads_window`, capturado do **mesmo campo** (`downloads`\ndo `dashboard.json` de 01/09), com a **mesma janela** (30 dias m\u00f3veis) e a **mesma\nsem\u00e2ntica** (`installs 1*`, est\u00e1 escrito no campo `source`). O `compare.py` junta\n`downloads_window` (base) com `downloads` (hoje), por `app_id`.\n\nNenhuma das corre\u00e7\u00f5es desta noite toca esse campo \u2014 o bug estava no funil, n\u00e3o na venda.\n**Mesmo campo, mesmo vi\u00e9s dos dois lados: o delta \u00e9 audit\u00e1vel e a meta \u00e9 mensur\u00e1vel.**\nN\u00e3o h\u00e1 convers\u00e3o a fazer e a baseline n\u00e3o precisa ser reescrita.\n\nEstado de hoje (06/09), pelo `compare.py`:\n\n```\nCONJUNTO  installs 437 vs 432 (+5) | receita US$ 6.44 vs 6.29 (+0.15)\nMETA  US$200 do conjunto (faltam US$ 193.56) OU +300 installs num app\n      melhor app hoje: Truco +9 (faltam 291)\n```\n\n### Tr\u00eas ressalvas que o checkpoint de 02/10 precisa carregar\n\n1. **A receita continua cega para an\u00fancio** (LEARNINGS #80). `revenue_usd` \u00e9\n   `Developer Proceeds` do Sales Report: s\u00f3 IAP e app pago. Truco, Foguetinho e Neon\n   servem interstitial e n\u00e3o aparecem em lugar nenhum. O bra\u00e7o \"US$200\" do mandato \u00e9\n   inaudit\u00e1vel enquanto o v\u00ednculo AdMob\u2194Firebase n\u00e3o existir.\n2. **O Cronos n\u00e3o est\u00e1 na baseline** (9 apps, n\u00e3o 10 \u2014 em 01/09 ele n\u00e3o tinha venda, ent\u00e3o\n   n\u00e3o entrou no `dashboard.json` e nem no arquivo). Um salto do Cronos \u00e9 invis\u00edvel para o\n   `compare.py`. Tratar baseline ausente como 0 resolve; n\u00e3o mexi no arquivo.\n3. **\"+300 instala\u00e7\u00f5es\"** \u00e9 lido como *um app* crescer 300 no seu pr\u00f3prio 30d m\u00f3vel. Com\n   o melhor app do conjunto em +9, o bra\u00e7o de instala\u00e7\u00e3o exige mudan\u00e7a de ordem de\n   grandeza, n\u00e3o otimiza\u00e7\u00e3o.\n\n---\n\n## 4. O que mudou no c\u00f3digo\n\n**`tools/lab-dashboard/pull_data.py`**\n- `own_rows_by_date()` / `window_rows()` / `aggregate_funnel()` \u2014 fun\u00e7\u00f5es **puras**: cada\n  `Date` fica com as linhas de uma inst\u00e2ncia s\u00f3 (a de `processingDate` mais recente que a\n  cont\u00e9m = a vers\u00e3o corrigida), e linhas id\u00eanticas repetidas dentro da mesma inst\u00e2ncia caem\n  fora. `fetch_funnel` virou I/O + chamada da fun\u00e7\u00e3o pura, lendo 12 inst\u00e2ncias em vez de 4.\n- A janela reportada passou a ser a de **dado** (`period_start`/`period_end`/`dates`), n\u00e3o\n  a de processamento. O `period_end` do arquivo antigo (`2026-09-04`) era processingDate;\n  o dado terminava em `2026-08-30`.\n- `fetch_cvr_page` tinha a mesma classe de bug (pegava \"a \u00faltima inst\u00e2ncia\", que num\n  request novo \u00e9 o backfill) \u2014 passou pelo mesmo `window_rows`.\n- `bucket_for()` classifica Product Type numa fun\u00e7\u00e3o pura; `REDOWNLOAD_TYPES` = `3/3F/3T/F3`\n  ganhou bucket `redownloads`.\n- O funil carrega `min_count_floor: 5`, e o `main` anexa `sales_installs_window` +\n  `measured_pct` \u2014 o Sales Report do **mesmo per\u00edodo**, para o funil nunca ser lido como\n  contagem. Para isso a coleta puxa `--days + 21` dias de Sales (a janela do funil termina\n  antes da de 30 dias) e recorta os 30 do painel.\n- `FX` virou pregui\u00e7oso: importar o m\u00f3dulo n\u00e3o pode bater na rede, sen\u00e3o o eval n\u00e3o roda.\n\n**`tools/lab-hub/hub.py`** \u2014 cada card do funil mostra a **sua** janela e a linha\n\"medido pelo App Analytics \u2026 no mesmo per\u00edodo o Sales Report tem N instala\u00e7\u00f5es \u2014 o funil\nenxerga X%\". O cabe\u00e7alho da p\u00e1gina deixou de afirmar \"\u00faltimas 4 semanas\" (varia por app) e\ndiz qual n\u00famero julga a meta.\n\n**`scripts/analytics/firebase_snapshot.py`** \u2014 o denominador da `coverage` passou a ser\n`1* + 3*`. O `first_open` do GA4 dispara em **toda** instala\u00e7\u00e3o do bin\u00e1rio num device,\ninclusive reinstala\u00e7\u00e3o; o Sales s\u00f3 conta 1*. Era por isso que apps de base legada grande\nmarcavam \"cobertura\" acima de 100%, que \u00e9 ileg\u00edvel:\n\n| app | antes | depois |\n|---|---|---|\n| Neon | 126,7% | **83,8%** |\n| College | 129,4% | **90,4%** |\n| iPhotos | 116,2% | **45,6%** |\n| BLW | 144,0% | **129,6%** \u2190 continua aberto |\n\nTr\u00eas dos quatro entram na faixa leg\u00edvel (abaixo de 100%, acima do piso de 25%). **O BLW\nn\u00e3o** \u2014 254 novos no GA4 contra 210 instala\u00e7\u00f5es+redownloads. A property tem um \u00fanico stream\niOS (`com.bemestar.POC`, conferido na Admin API), ent\u00e3o sobra multi-device/limpeza de dados\nou o desencaixe de janela (GA4 09/08\u201305/09 contra Sales 06/08\u201304/09). **Fica registrado\ncomo aberto, n\u00e3o explicado.** O DevLingo (163%) sai da conta: a property hospeda dois apps\niOS (DevLingo + Sunrise) e o numerador j\u00e1 vem contaminado \u2014 contamina\u00e7\u00e3o real de medi\u00e7\u00e3o,\nda fam\u00edlia do LEARNINGS #54, e \u00e9 bug separado.\n\nUma coisa que a auditoria **n\u00e3o** sustenta: \"coverage > 100% prova que o Sales Report\nsubconta\". A raz\u00e3o n\u00e3o \u00e9 limitada a 100% por constru\u00e7\u00e3o \u2014 numerador e denominador contam\ncoisas diferentes (inst\u00e2ncia de app \u00d7 compra por Apple ID). O que ela provou foi que o\n**denominador estava incompleto**, n\u00e3o que a instala\u00e7\u00e3o esteja errada.\n\n### O estrago no portf\u00f3lio inteiro (dashboard.json j\u00e1 corrigido)\n\nReprocessei os 20 apps que tinham funil, com o mesmo Sales Report do per\u00edodo ao lado:\n\n| app | dl 1\u00aa vez antes | depois | Sales 1* no mesmo per\u00edodo | funil enxerga |\n|---|---|---|---|---|\n| Calc+ (Secret Gallery Vault) | 13.167 | **1.807** | 2.699 | 67% |\n| College | 954 | **195** | 341 | 57% |\n| Sueca | 909 | **64** | 119 | 54% |\n| Neon | 155 | **0** | 78 | 0% |\n| My Expenses | 134 | **18** | 195 | 9% |\n| BLW | 78 | **11** | 143 | 8% |\n| Cloak | 1.144 | 1.144 | 2.108 | 54% |\n| iPhotos | 26 | 26 | 119 | 22% |\n| Hair Schedule | 122 | 122 | 210 | 58% |\n| Walk | 39 | 39 | 148 | 26% |\n| Truco / philos | 6 / 5 | 6 / 5 | 42 / 45 | 14% / 11% |\n| Bible, Peptide, DevLingo, Foguetinho, SafeDoc, Cronos, Sunrise, My Way | 0 | 0 | 4\u201381 | 0% |\n\nSeis apps tinham backfill somado (os que j\u00e1 rodavam ONGOING em 14/08); o resto s\u00f3 sofria a\nsupress\u00e3o. **Em nenhum app o funil chega perto da contagem real** \u2014 o melhor caso do\nportf\u00f3lio v\u00ea 67%. Confirma que ele nunca serviu, e nunca vai servir, de medida de\ninstala\u00e7\u00e3o.\n\nNota de janela: s\u00e3o as \u00faltimas N semanas **com dado publicado**, n\u00e3o as \u00faltimas N semanas\nde calend\u00e1rio. O My Expenses, por exemplo, tem semanas inteiras suprimidas, ent\u00e3o suas 4\ndatas v\u00e3o de 06/07 a 30/08 \u2014 e a compara\u00e7\u00e3o com o Sales cobre o mesmo intervalo real.\n\n---\n\n## 5. O teste que prova (com caso negativo)\n\n`tools/lab-dashboard/test_pull_data.py` \u2014 26 casos, todos verdes. Positivos usam os dados\n**reais** da Sueca:\n\n- as 4 semanas d\u00e3o **64**, n\u00e3o 909; a janela reportada \u00e9 03/08\u201330/08, n\u00e3o o processingDate;\n- semana entregue duas vezes conta uma; re-entrega **corrigida** substitui a antiga (25, n\u00e3o\n  22 nem 47); segmento repetido dentro da mesma inst\u00e2ncia n\u00e3o dobra;\n- impress\u00f5es das 4 semanas = 5.979, n\u00e3o 72.015;\n- `1F/1/F1\u2192downloads`, `3F/3/F3\u2192redownloads`, `7F/7/F7\u2192updates`, e redownload **n\u00e3o** entra\n  em `downloads` (130, n\u00e3o 230).\n\n**Negativos** (o que n\u00e3o pode disparar): 4 semanas distintas somam 40 \u2014 o dedupe n\u00e3o pode\ncomer dado leg\u00edtimo; duas linhas da mesma data com **dimens\u00f5es diferentes** somam (15), n\u00e3o\ns\u00e3o duplicata; `IAY/IA1/IA9/FI1` e string vazia n\u00e3o viram download/update/redownload;\nredownload/update/restore ficam fora de `first_downloads`.\n\n**Meta-teste por muta\u00e7\u00e3o** (LEARNINGS #63): remover o dedupe por `Date` faz a Sueca voltar a\n909 e o eval reprovar; mover `3*` para `INSTALL_TYPES` faz a classifica\u00e7\u00e3o reprovar.\nAsser\u00e7\u00e3o que sobrevive \u00e0 pr\u00f3pria muta\u00e7\u00e3o \u00e9 inerte e n\u00e3o protege nada.\n\n```\n/usr/local/bin/python3 tools/lab-dashboard/test_pull_data.py\n```\n\n---\n\n## 6. A li\u00e7\u00e3o\n\nO `downloads` estava certo o tempo todo; o que estava errado era o n\u00famero **ao lado dele na\nmesma tela**, sem r\u00f3tulo dizendo que media outra coisa, em outra janela, com supress\u00e3o. \u00c9 a\nmesma fam\u00edlia do #53 (update somado com instala\u00e7\u00e3o), do #54 (crash-free agregado misturando\nTestFlight com produ\u00e7\u00e3o) e do #80 (a m\u00e9trica que n\u00e3o enxerga o canal onde entra o dinheiro):\n**o n\u00famero existia e estava certo \u2014 s\u00f3 n\u00e3o media a coisa que a decis\u00e3o precisava.**\n\nO detalhe novo, e o que vale guardar: **relat\u00f3rio de analytics da Apple vem com backfill, e\no carimbo da inst\u00e2ncia n\u00e3o \u00e9 o per\u00edodo do dado.** Qualquer agrega\u00e7\u00e3o de `analyticsReports`\ntem que agrupar pela coluna `Date` e deduplicar entre inst\u00e2ncias. Somar por inst\u00e2ncia \u00e9\ncorreto exatamente at\u00e9 o dia em que a Apple entrega o hist\u00f3rico \u2014 e a\u00ed erra por 14\u00d7, calado.\n";</script><script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script><script>document.getElementById("md").innerHTML=window.marked?marked.parse(RAW):"<pre>"+RAW.replace(/</g,"&lt;")+"</pre>";</script></div><script>(function(){try{var k="lh.scroll:"+location.pathname;var v=sessionStorage.getItem(k);if(v!==null)
