<style>
:root{--bg:#f4f5f8;--card:#fff;--tx:#0e1015;--mut:#4a5160;--acc:#2b3340;--ok:#0d9668;--down:#c22;--bd:#c9cfda;--hl:#fff7e0}
@media(prefers-color-scheme:dark){:root{--bg:#0e1013;--card:#1a1e25;--tx:#f2f4f8;--mut:#aab3c2;--acc:#ccd6e6;--bd:#39404d;--hl:#2a2717}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.55 -apple-system,system-ui,sans-serif}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;

.topin{width:min(1680px,94vw);margin:0 auto;display:flex;align-items:center;gap:10px 22px;

.navs{display:flex;gap:4px;flex-wrap:wrap;min-width:0}
a.nav{font-family:var(--f-disp);font-size:13px;font-weight:600;color:var(--mut);

a.nav:hover{color:var(--tx);background:var(--bd-soft);text-decoration:none}
a.nav.on{color:var(--tx);background:var(--bd-soft)}
.stamp{margin-left:auto;font-size:11.5px;color:var(--mut);white-space:nowrap}
.ico.lab{display:inline-block;vertical-align:-5px;background-color:transparent;background-size:contain;
  background-repeat:no-repeat;background-position:center;border-radius:0}
/* O quadro é a primeira coisa que o João lê e estava no mesmo fundo do resto da
   página; agora é um painel com fundo próprio (João, 02/10). */
.board{margin:18px 0 10px;padding:16px 18px 18px;border-radius:var(--rad);
  border:1px solid var(--bd-soft);box-shadow:var(--sh);
  background:linear-gradient(180deg,var(--boardtop),var(--boardbot))}
.boardh h2{margin:0 0 12px;border-top:0;padding-top:0}
.iid{margin-left:auto;flex:none;font-family:var(--f-mono);font-size:11px;font-weight:500;
  color:var(--mut);background:var(--bd-soft);border:1px solid var(--bd);border-radius:999px;
  padding:1px 8px;cursor:pointer;line-height:1.5}
.iid:hover{color:var(--tx);border-color:var(--mut)}
.iid.ok{color:var(--ok);border-color:var(--ok)}
/* Cabeçalho do card: ícone · nome · chip do número, em colunas fixas. Em
   fluxo normal o ícone do lab caía numa linha só pra ele. */
.rhead{display:grid;grid-template-columns:20px minmax(0,1fr) auto;align-items:center;gap:8px}
.rhead .ico{margin-right:0;width:20px;height:20px}
.rwhen{font-family:var(--f-mono);font-size:11px;font-weight:500;color:var(--mut);margin-right:4px}
.rows>.rowwrap>.row,.rows>.row{display:flex;flex-direction:column}
.board .hcol>h2{margin-top:0;border-top:0;padding-top:0}
@media(max-width:620px){.stamp{margin-left:0;flex-basis:100%}}
.wrap{width:min(1680px,94vw);margin:0 auto;padding:24px 0 80px}@media(max-width:860px){.wrap{width:calc(100vw - 28px)}}.ico{width:20px;height:20px;border-radius:5px;vertical-align:-5px;margin-right:7px;background:var(--bd);object-fit:cover}.ico.big{width:30px;height:30px;border-radius:7px;vertical-align:-9px}h2{border-top:1px solid var(--bd);padding-top:20px;margin-top:30px}section,.twrap{min-width:0}h2:first-of-type{border-top:0;padding-top:0}h1+h2,.sub+h2{border-top:0;padding-top:0}
h1{font-size:22px;margin:0 0 4px}h2{font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:34px 0 12px}
.sub{color:var(--mut);margin:0 0 8px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px 16px}
.card b{font-size:14.5px}.card p{margin:5px 0 0;color:var(--mut);font-size:13.5px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px}
.up{background:var(--ok)}.dn{background:var(--down)}
a{color:var(--acc);text-decoration:none}a:hover{text-decoration:underline}
code{background:rgba(125,125,125,.13);padding:1px 6px;border-radius:5px;font-size:12.5px}
.pill{display:inline-block;background:rgba(125,125,125,.12);border-radius:99px;padding:1px 10px;margin:2px 3px 2px 0;font-size:12.5px}
table.t{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--bd);border-radius:12px;overflow:hidden}
table.t td,table.t th{padding:7px 12px;border-bottom:1px solid var(--bd);font-size:13.5px;text-align:left;vertical-align:top}
table.t th{color:var(--mut);font-weight:600}table.t tr:last-child td{border-bottom:0}
.twrap{overflow-x:auto;border-radius:12px}
.imgs{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.imgs img{width:100%;border-radius:8px;border:1px solid var(--bd)}
#md{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:22px 26px}
#md pre{overflow-x:auto;background:rgba(125,125,125,.1);padding:10px;border-radius:8px}
#md table{border-collapse:collapse}#md td,#md th{border:1px solid var(--bd);padding:4px 9px;font-size:13.5px}
#md img{max-width:100%}
.hcol .row{flex-direction:column;align-items:flex-start;gap:4px}.hcol .row b{white-space:normal}.hcol .row span{width:100%}.hcol .row em{display:none}.hcol .row.done b{font-size:12px}.hrow{display:flex;gap:20px;overflow-x:auto;align-items:flex-start;padding:16px 28px 12px;margin:18px 0 26px;background:rgba(125,125,125,.07);border:1px solid var(--bd);border-radius:16px;scroll-padding:0 28px}.hcol{flex:0 0 340px;min-width:340px}.hcol:last-child{margin-right:28px}.hcol h2{margin-top:0}.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:0 20px}.cols2{display:grid;grid-template-columns:1fr 1fr;gap:0 20px;align-items:start}@media(max-width:900px){.cols2{grid-template-columns:1fr}}h3.team{margin:18px 0 8px;font-size:15px;font-weight:600}h3.team .chain{display:block;color:var(--mut);font-weight:400;font-size:12.5px;margin-top:2px}.card .step{display:inline-block;min-width:18px;height:18px;line-height:18px;text-align:center;border-radius:9px;background:var(--bd);color:var(--mut);font-size:11px;font-weight:600;margin-right:6px}.grid4{display:grid;gap:12px;grid-template-columns:repeat(4,1fr)}@media(max-width:1100px){.grid4{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.grid4{grid-template-columns:1fr}}
.rows{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;color:var(--tx);font-size:14.5px}
a.row:hover{border-color:var(--acc);text-decoration:none}
.row span{flex:1;color:var(--mut)}.row em{color:var(--mut);font-style:normal;font-size:18px}
.row.done b{color:var(--mut);font-weight:500;font-size:12.5px}.row.done span b{color:var(--tx)}.row.done span{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;line-height:1.35}
.hdr{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:6px}
.hdr h1{margin:0}.hdr .sub{margin:2px 0 0}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 22px;font-size:14.5px;color:var(--acc)}
.btn:hover{border-color:var(--acc);text-decoration:none}
.tiles{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(152px,1fr));margin:14px 0 6px}
a.tile{display:block;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 14px;color:var(--tx);min-width:128px}
a.tile:hover{border-color:var(--acc);text-decoration:none}
.tile .tl{font-size:12px;color:var(--mut);white-space:nowrap}
.tile .tv{font-size:21px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px;white-space:nowrap}
.tile .ts{font-size:11.5px;color:var(--mut);margin-top:1px;white-space:nowrap}
.tv.up{color:var(--ok);background:none}.tv.dn{color:var(--down);background:none}
.vd{font-size:15px;font-weight:700;margin-right:10px;white-space:nowrap}
.vd.s{color:var(--ok)}.vd.w{color:#c9930a}.vd.k{color:var(--down)}
.shots{display:flex;gap:8px;overflow-x:auto;padding:4px 0}
.shots img{height:210px;border-radius:10px;border:1px solid var(--bd);flex:0 0 auto}
.gallery img{height:460px;max-height:72vh}
.st{display:inline-block;border-radius:99px;padding:1px 10px;font-size:12px;font-weight:600;margin-left:8px;white-space:nowrap;vertical-align:1px}
.st.run{background:rgba(13,150,104,.16);color:var(--ok)}
.st.appr{background:rgba(201,147,10,.16);color:#c9930a}
.st.rev{background:rgba(125,140,170,.14);color:var(--mut)}
.st.draft{background:rgba(139,92,246,.15);color:#8b5cf6}
.st.mut{background:rgba(125,125,125,.16);color:var(--mut)}
.st.crit{background:rgba(200,34,34,.15);color:var(--down)}
.rowwrap{position:relative}
.rowwrap .row{padding-right:38px}
.delf{position:absolute;top:0;right:0;bottom:0;display:flex;align-items:center;margin:0}
.del{background:none;border:none;color:var(--mut);font-size:17px;line-height:1;padding:6px 12px;cursor:pointer;border-radius:8px;opacity:.45}
.rowwrap:hover .del{opacity:1}
.del:hover{color:var(--down);background:rgba(200,34,34,.08)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(430px,1fr));gap:12px;margin-top:12px}
@media(max-width:520px){.fgrid{grid-template-columns:1fr}}
.fcard{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:13px 15px}
.fcard .fh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.fcard .fh b{font-size:14.5px}.fcard .fh span{font-size:12.5px;color:var(--mut);white-space:nowrap}
.fs{display:flex;align-items:center;gap:8px;margin:3px 0;font-size:13px}
.fs .fl{flex:0 0 188px;color:var(--tx)}
.fs .fb{flex:1;height:13px}
.fs .fb i{display:block;height:100%;background:var(--acc);border-radius:3px;min-width:2px}
.fs .fb i.alt{background:var(--ok)}
.fs .fn{flex:0 0 auto;font-variant-numeric:tabular-nums;font-size:12.5px}
.fs.tot .fl,.fs.tot .fn{font-weight:700}
.leak{margin:0 0 5px 176px;font-size:12px;color:var(--down)}
.leak b{font-variant-numeric:tabular-nums}
.fdiv{margin:9px 0 3px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}
.fmeta{font-size:12.5px;color:var(--mut);margin:-3px 0 9px}
.rrow{margin:0}
.rc{display:grid;grid-template-columns:34px 72px minmax(0,1fr);align-items:baseline;gap:10px;padding:7px 0;border-top:1px solid var(--bd-soft)}
.rc b{display:block;font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.rc .rv{display:block;font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.25}
.rc .rb{display:block;font-size:11px;color:var(--mut)}
.fnds{list-style:none;margin:10px 0 0;padding:0}
.fnds li{position:relative;padding:2px 0 2px 16px;font-size:13px;color:var(--tx)}
.fnds li:before{content:"";position:absolute;left:0;top:9px;width:7px;height:7px;border-radius:50%}
.fnds li:before{background:var(--bd)}.fnds li.crit:before{background:var(--down)}.fnds li.warn:before{background:#c9930a}.fnds li.ok:before{background:var(--ok)}
.nxt .nxl{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
.nxt b{font-size:14px}.nxt p{margin:3px 0 0;font-size:13px;color:var(--mut)}
.fh .st{margin-left:8px}
.dirbox{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:20px 24px;margin:20px 0 8px}
.dirlab{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--mut)}
.dirh{font-size:19px;line-height:1.35;margin:4px 0 12px;text-transform:none;letter-spacing:0;color:var(--tx)}
.dirp{margin:0 0 9px;font-size:14px;line-height:1.6;color:var(--tx)}
.prio{display:flex;gap:13px;padding:11px 0;border-top:1px solid var(--bd)}
.prn{flex:0 0 26px;height:26px;line-height:26px;text-align:center;border-radius:13px;background:var(--acc);color:var(--card);font-weight:700;font-size:13px}
.prc{flex:1;min-width:0}
.prt{font-size:15px;font-weight:600;margin-bottom:3px}
.prw{margin:0 0 5px;font-size:13.5px;color:var(--tx)}
.pre{margin:0 0 4px;font-size:13px;color:var(--mut);line-height:1.55}
.pre b{color:var(--tx);font-weight:600}
.prp{margin:4px 0 0;font-size:13px;color:var(--tx);border-left:2px solid var(--acc);padding-left:9px}
.vgrid{display:flex;flex-direction:column;gap:6px}
.vrow{display:flex;align-items:baseline;gap:9px;font-size:13.5px;flex-wrap:wrap}
.vrow .st{flex:0 0 auto;margin:0}
.vrow b{flex:0 0 auto;min-width:118px}
.vrow span:last-child{flex:1;min-width:220px;color:var(--mut)}
.nots{margin:0;padding-left:18px}
.nots li{font-size:13.5px;color:var(--tx);margin-bottom:5px;line-height:1.55}
.dirfoot{margin:16px 0 0;padding-top:12px;border-top:1px solid var(--bd);font-size:12px;color:var(--mut)}
@media(max-width:700px){.vrow b{min-width:0}}
.fnote{font-size:11.5px;color:var(--mut);margin:4px 0 0 176px;line-height:1.35}

/* ---------- camada de acabamento (01/10/2026) ----------
   Tipografia com duas vozes (display para títulos e números, texto para leitura),
   neutros com viés do azul da marca em vez de cinza puro, e profundidade por
   sombra em vez de só borda. Nada aqui renomeia classe: é uma camada por cima. */
:root{
  --f-disp:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --f-text:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --bg:#eef1f7; --card:#ffffff; --tx:#0a0d14; --mut:#4b5567; --acc:#2b3340;
  --bd:#cbd3e0; --bd-soft:#dfe5ee; --ok:#07804e; --down:#c42121; --warn:#9a4408;
  --sh:0 1px 2px rgba(16,19,26,.05),0 2px 8px rgba(16,19,26,.04);
  --sh-up:0 2px 6px rgba(16,19,26,.07),0 10px 24px rgba(16,19,26,.07);
  --boardtop:#ffffff; --boardbot:#f3f6fb;
  --bar:#2563eb; --bar2:#60a5fa;
  --rad:14px;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#07090d; --card:#141922; --tx:#f7f9fc; --mut:#b2bdd0; --acc:#ccd6e6;
  --bd:#333c4c; --bd-soft:#232a36; --ok:#55e39d; --down:#ff8585; --warn:#ffbb55;
  --sh:0 1px 2px rgba(0,0,0,.4); --sh-up:0 6px 22px rgba(0,0,0,.5);
  --boardtop:#161c26; --boardbot:#101620;
  --bar:#5b9bff; --bar2:#9dc4ff;
}}
body{font-family:var(--f-text);font-size:14.5px;line-height:1.6;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1{font-family:var(--f-disp);font-size:27px;font-weight:800;letter-spacing:-.02em;
  text-wrap:balance;margin:0 0 2px}
h1 .mark{display:inline-block;width:28px;height:28px;vertical-align:-5px;margin-right:11px;
  background-size:contain;background-repeat:no-repeat;background-position:center}
h2{font-family:var(--f-disp);font-size:12px;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;color:var(--mut);border-top:1px solid var(--bd-soft);
  padding-top:22px;margin:32px 0 14px}
h3{font-family:var(--f-disp);letter-spacing:-.01em}
.sub{font-size:13px;color:var(--mut)}
code,.mono{font-family:var(--f-mono);font-size:12.5px}
.card,table.t,a.tile,.row,.fcard,#md{box-shadow:var(--sh);border-color:var(--bd-soft)}
.card,a.tile,.row,.fcard{border-radius:var(--rad)}
a.tile,.row{transition:box-shadow .16s ease,border-color .16s ease,transform .16s ease}
a.tile:hover,a.row:hover{box-shadow:var(--sh-up);border-color:var(--bd);
  transform:translateY(-1px)}
/* O card do app é área de leitura, não botão: nada muda no hover. A regra antiga
   trocava a sombra, e num card sem sombra isso aparecia como animação. */
.fcard,.fcard:hover{transition:none!important;transform:none!important}
/* big numbers: the first thing anyone reads on the page */
.tiles{gap:12px;margin:18px 0 4px}
a.tile{padding:13px 17px;min-width:148px}
.tile .tl{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
  color:var(--mut)}
.tile .tv{font-family:var(--f-disp);font-size:25px;font-weight:800;letter-spacing:-.025em;
  margin-top:3px}
.tile .ts{font-size:11.5px;color:var(--mut)}
/* tables read as data, not as prose */
table.t{border-radius:var(--rad);font-variant-numeric:tabular-nums}
table.t th{font-family:var(--f-disp);font-size:11px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;background:var(--bd-soft);border-bottom:1px solid var(--bd)}
table.t td{padding:9px 13px;border-bottom:1px solid var(--bd-soft)}
table.t tbody tr:hover td,table.t tr:hover td{background:rgba(125,140,170,.06)}
.twrap{border-radius:var(--rad)}
/* buttons */
.btn{font-family:var(--f-disp);font-weight:600;font-size:13.5px;padding:9px 18px;
  border-radius:999px;box-shadow:var(--sh);transition:all .16s ease}
.btn:hover{border-color:var(--acc);box-shadow:var(--sh-up);transform:translateY(-1px)}
.pill,.st{font-family:var(--f-disp);font-weight:600;font-size:11.5px;letter-spacing:.02em}
/* status colours carry meaning, so keep them out of the accent */
.st.run,.st.appr{background:rgba(10,143,88,.14);color:var(--ok)}
.st.crit{background:rgba(208,47,47,.14);color:var(--down)}
.st.rev,.st.draft{background:rgba(180,83,9,.14);color:var(--warn)}
/* the lanes strip and any scroller get a thin, rounded bar */
.hrow,.twrap{scrollbar-width:thin;scrollbar-color:var(--bd) transparent}
.hrow::-webkit-scrollbar,.twrap::-webkit-scrollbar{height:9px}
.hrow::-webkit-scrollbar-track,
.twrap::-webkit-scrollbar-track{background:transparent}
.hrow::-webkit-scrollbar-thumb,
.twrap::-webkit-scrollbar-thumb{background:var(--bd);border-radius:999px;
  border:3px solid transparent;background-clip:content-box}
.hrow::-webkit-scrollbar-thumb:hover,
.twrap::-webkit-scrollbar-thumb:hover{background:var(--mut);background-clip:content-box}
.hrow{background:transparent;border:0;padding:0;border-radius:0}
.hcol{flex:0 0 clamp(280px,26vw,360px);min-width:0}
a:focus-visible,button:focus-visible,.btn:focus-visible{outline:2px solid var(--acc);
  outline-offset:2px;border-radius:8px}
.dirlist,.prlist{margin:10px 0 0;padding-left:18px;list-style:none}
.dirlist>li,.prlist>li{position:relative;margin:0 0 7px;font-size:13.5px;line-height:1.5;
  color:var(--tx)}
.prlist>li{color:var(--mut);font-size:13px;margin-bottom:5px}
.dirlist>li::before,.prlist>li::before{content:"";position:absolute;left:-14px;top:.62em;
  width:5px;height:5px;border-radius:50%;background:var(--acc);opacity:.75}
.prlist>li::before{background:var(--mut);opacity:.5}
.dirp{display:none}
.dapps{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));
  margin:14px 0 4px;align-items:start}
.dapp{padding:14px 16px}
.dah{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.dah b{font-family:var(--f-disp);font-size:14.5px;font-weight:700}
.drank{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;
  border-radius:6px;background:var(--acc);color:var(--card);font-size:11.5px;font-weight:700;flex:none}
.st.d-dobrar{background:rgba(10,143,88,.16);color:var(--ok)}
.st.d-consertar{background:rgba(180,83,9,.16);color:var(--warn)}
.st.d-manter{background:rgba(125,140,170,.16);color:var(--mut)}
.st.d-congelar{background:rgba(125,140,170,.12);color:var(--mut)}
.dapp .prlist{margin-top:6px}
.dcall{color:var(--tx)!important;font-weight:600}
.fcard[id]{scroll-margin-top:18px}
.fdet{margin-top:10px;border-top:1px solid var(--bd-soft);padding-top:9px}
.fdet>summary{cursor:pointer;list-style:none;font-family:var(--f-disp);font-size:11.5px;
  font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);
  display:flex;align-items:center;gap:7px}
.fdet>summary::-webkit-details-marker{display:none}
.fdet>summary::before{content:"›";font-size:15px;transition:transform .15s}
.fdet[open]>summary::before{transform:rotate(90deg)}
.fdet>summary:hover{color:var(--acc)}
.fdet table.t{font-size:12.5px}
.fdet table.t td,.fdet table.t th{padding:6px 10px}
.fgrid.one{grid-template-columns:1fr!important;gap:18px}
/* Cada app é um painel com profundidade: a luz entra por cima, o corpo escurece
   até a base e a borda clareia só na primeira linha. É o que separa um app do
   outro sem precisar de moldura dura. */
.fgrid.one>.fcard{position:relative;padding:0;overflow:hidden;border-radius:16px;
  border:1px solid var(--bd-soft);
  background:linear-gradient(180deg,
    color-mix(in srgb, var(--acc) 5%, var(--card)) 0%,
    var(--card) 26%,
    color-mix(in srgb, #000 7%, var(--card)) 100%);
  box-shadow:0 1px 2px rgba(0,0,0,.05), 0 10px 26px -14px rgba(0,0,0,.28)}
@media(prefers-color-scheme:dark){.fgrid.one>.fcard{
  background:linear-gradient(180deg,
    color-mix(in srgb, var(--acc) 9%, var(--card)) 0%,
    var(--card) 30%,
    #0a0c10 100%);
  box-shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 18px 40px -22px rgba(0,0,0,.9)}}
.fgrid.one>.fcard::before{content:"";position:absolute;inset:0 0 auto;height:1px;
  background:linear-gradient(90deg, transparent,
    color-mix(in srgb, var(--acc) 45%, transparent), transparent)}
.fgrid.one>.fcard>.fh{background:transparent;margin:0;padding:15px 18px 12px;
  border-bottom:1px solid var(--bd-soft)}
.fgrid.one>.fcard>.fstats{padding:12px 18px 0}
.fgrid.one>.fcard>.fcols{padding:16px 18px 6px}
.fgrid.one>.fcard>.fdet{margin:0;padding:13px 18px 16px;border-top:1px solid var(--bd-soft);
  background:color-mix(in srgb, #000 4%, transparent)}
@media(prefers-color-scheme:dark){.fgrid.one>.fcard>.fdet{
  background:rgba(0,0,0,.25)}}
.fgrid.one>.fcard>.fh b{font-size:16px;letter-spacing:-.01em}
.fgrid.one>.fcard>.fh>span{font-size:12.5px;color:var(--tx);opacity:.78;
  font-variant-numeric:tabular-nums;font-weight:500}
/* a luz no topo do painel, um pouco mais presente */
.fgrid.one>.fcard::before{height:2px;
  background:linear-gradient(90deg, transparent, var(--acc), transparent);opacity:.5}
.fcard .fmeta{font-size:12px;color:var(--mut)}
/* funil: rótulo legível, número com peso, barra com corpo */
.fs{display:grid;grid-template-columns:150px 1fr auto;align-items:center;gap:12px;
  padding:5px 0}
.fs .fl{font-size:12.5px;color:var(--tx)}
.fs .fn{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;min-width:74px;
  text-align:right}
.fb{height:9px;border-radius:999px;background:var(--bd-soft);overflow:hidden}
.fb i{display:block;height:100%;border-radius:999px}
/* retenção com leitura imediata */
.rrow{margin:0}
.rc:first-child{border-top:0;padding-top:0}
/* o rótulo é legenda; quem salta é o número, na cor da régua */
.rc b{display:block;font-family:var(--f-disp);font-size:10px;font-weight:700;
  letter-spacing:.09em;text-transform:uppercase;color:var(--mut);margin:0}
.rc .rv{display:block;font-family:var(--f-disp);font-size:21px;font-weight:800;
  letter-spacing:-.025em;line-height:1.15;margin:3px 0 2px;font-variant-numeric:tabular-nums}
.rc>b{font-family:var(--f-disp);font-size:12px;font-weight:700;letter-spacing:.04em;
  color:var(--mut)}
.rc .rv{font-family:var(--f-disp);font-size:19px;font-weight:800;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums}
.rc .rb{display:block;font-size:11.5px;color:var(--mut)}
/* achados: mais ar e marcador claro */
.fnds li{font-size:12.5px;line-height:1.5;padding:4px 0 4px 16px}
.fnds li:before{width:6px;height:6px;top:.72em}
/* o detalhe convida a abrir */
.fdet>summary{font-size:11px;color:var(--acc);padding:3px 0}
.fdet>summary:hover{opacity:.82}
.fcols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;
  align-items:start}
@media(max-width:820px){.fcols{grid-template-columns:1fr;gap:12px}}
.fcol{min-width:0}
.fcol>.fnds{margin-top:0}
/* Régua de contexto do app: instalações, ativos, novos, crash-free. Antes isso
   era uma linha de texto corrido ("187 downloads/30d · WATCH · crash-free
   100%") que ninguém comparava entre cards; como números rotulados, dá pra
   varrer a coluna de cima a baixo. */
.fstats{display:flex;flex-wrap:wrap;gap:10px 26px;align-items:baseline}
.fst{display:flex;align-items:baseline;gap:7px;min-width:0}
.fstl{font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:var(--mut)}
.fst b{font-family:var(--f-disp);font-size:15px;font-weight:700;letter-spacing:-.015em;
  font-variant-numeric:tabular-nums}
.fstd{font-size:12px;font-weight:600}
.st.vd{background:rgba(125,140,170,.14);color:var(--mut)}
.fh .noasc{font-size:11.5px;font-weight:400;color:var(--warn)}
/* Cada metade do card diz o que é antes de mostrar número. */
.fgrp{margin-bottom:16px}
.fgrp:last-child{margin-bottom:0}
.fgl{display:block;font-family:var(--f-disp);font-size:10.5px;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;color:var(--mut);
  padding-bottom:7px;margin-bottom:10px;border-bottom:1px solid var(--bd-soft)}
.fcol>.fgrp>.fnds{margin-top:0}
.instrl{list-style:none;margin:9px 0 0;padding:0}
.instrl li{font-size:12.5px;line-height:1.55;color:var(--mut);padding:3px 0 3px 14px;
  position:relative;overflow-wrap:anywhere}
/* Coluna de leitura: linhas rotuladas, sem caixa. As caixas coloridas (funil
   verde, ação amarela) e o bloco expansível empilhavam quatro objetos de forma
   diferente num espaço estreito; rótulo à esquerda e texto à direita, separados
   por uma régua fina, lê de cima a baixo sem nada competindo (João, 02/10). */
.rline{display:grid;grid-template-columns:116px minmax(0,1fr);gap:16px;
  padding:12px 0;border-top:1px solid var(--bd-soft)}
.rline:first-child{border-top:0;padding-top:0}
.rlab{font-family:var(--f-disp);font-size:10.5px;font-weight:700;letter-spacing:.07em;
  text-transform:uppercase;color:var(--mut);padding-top:2px}
.rbody{min-width:0}
.rbody>b{display:block;font-family:var(--f-disp);font-size:14px;font-weight:700;
  letter-spacing:-.01em;line-height:1.35}
.rnum{display:block;margin-top:3px;font-size:12px;font-weight:600;color:var(--tx);
  font-variant-numeric:tabular-nums}
.rbody>p{margin:5px 0 0;font-size:12.5px;line-height:1.55;color:var(--mut)}
.rline.act .rlab{color:var(--tx)}
.rline.mut .rlab,.rline.mut .instrl li{color:var(--mut)}
.rbody>.fnds{margin:0}
@media(max-width:1180px){.rline{grid-template-columns:1fr;gap:6px}
  .rline .rlab{padding-top:0}}
.instrl{list-style:none;margin:0;padding:0}
.instrl li{font-size:12.5px;line-height:1.55;color:var(--mut);padding:2px 0 2px 14px;
  position:relative;overflow-wrap:anywhere}
.instrl li::before{content:"";position:absolute;left:0;top:.72em;width:5px;height:5px;
  border-radius:50%;background:var(--bd)}
/* Os passos de loja vêm de outra fonte que os de dentro do app: barra em tom
   mais surdo pra o olho ver onde a medição troca de sistema. */
.fs .fb i.store{background:linear-gradient(90deg,
  color-mix(in srgb, var(--bar) 45%, transparent),
  color-mix(in srgb, var(--bar) 70%, transparent))}
.fsub{display:block;font-size:10.5px;font-weight:600;letter-spacing:.07em;
  text-transform:uppercase;color:var(--mut);margin-bottom:6px}
.fsub.gap2{margin-top:14px}
.lchip{font-size:10px;color:var(--mut);background:var(--bd-soft);border-radius:999px;
  padding:1px 7px;cursor:help;white-space:nowrap}
.fcols{position:relative}
@media(min-width:821px){.fcols::before{content:"";position:absolute;top:0;bottom:0;
  left:50%;width:1px;background:var(--bd-soft)}}
.fdet .ascgrid{grid-template-columns:repeat(auto-fit,minmax(118px,1fr))}
.fdetcols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;
  align-items:start}
@media(max-width:1100px){.fdetcols{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:760px){.fdetcols{grid-template-columns:1fr}}
.fdetcols>div{min-width:0;display:flex;flex-direction:column;gap:14px}
.rawbox{background:var(--bg);border:1px solid var(--bd-soft);border-radius:11px;
  padding:11px 13px;min-width:0}
.rawbox h4,.rawbox h3.team{margin:0 0 8px;font-family:var(--f-disp);font-size:10.5px;
  font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--mut)}
.rawbox h3.team .chain{text-transform:none;letter-spacing:0;font-size:11px}
.rawbox table.t{border:0;box-shadow:none;background:transparent}
.rawbox table.t th{background:transparent;border-bottom:1px solid var(--bd)}
.rawbox table.t td{border-bottom:1px solid var(--bd-soft)}
.rawbox .twrap{border-radius:0}
.rawbox .ascgrid{margin-bottom:0;grid-template-columns:repeat(auto-fit,minmax(104px,1fr))}
.rawbox .ascgrid b{font-size:14px}
.srct{float:right;font-size:9px;font-weight:700;letter-spacing:.06em;padding:2px 7px;
  border-radius:999px;background:var(--bd);color:var(--mut);text-transform:uppercase}
.s-asc{background:rgba(125,140,170,.16);color:var(--tx)}
.s-firebase{background:rgba(180,83,9,.14);color:var(--warn)}
.noasc{background:rgba(180,83,9,.14);color:var(--warn);border-radius:999px;padding:1px 8px;
  font-size:10.5px;font-weight:600}
.convwhy{display:block;font-size:10.5px;color:var(--mut);margin-top:1px}
.rawbox .rate{padding:1px 7px;border-radius:999px;font-size:12.5px}
.featname{display:block;font-family:var(--f-mono);font-size:11.5px;margin-bottom:3px}
.featbar{display:block;height:4px;border-radius:999px;background:var(--bd-soft);overflow:hidden}
.featbar i{display:block;height:100%;border-radius:999px;
  background:linear-gradient(90deg, color-mix(in srgb, var(--acc) 70%, transparent), var(--acc))}
.legacyp{margin:8px 0 0;font-size:12px;color:var(--mut);line-height:1.7}
.legacyp code{font-size:11px}
.rawbox .ascgrid>div{background:var(--card)}
.fdet{margin-top:14px;border-top:1px solid var(--bd);padding-top:12px}
.fdet[open]>summary{margin-bottom:12px;color:var(--acc)}
.t .thsub{font-size:9.5px;font-weight:600;letter-spacing:.03em;color:var(--mut);
  text-transform:none}
.t .rate{padding:1px 8px;border-radius:999px;font-variant-numeric:tabular-nums}
.t .rate.good{background:rgba(10,143,88,.16);color:var(--ok)}
.t .rate.mid{background:rgba(180,83,9,.14);color:var(--warn)}
.t .rate.low{background:rgba(208,47,47,.13);color:var(--down)}
.thin{font-size:10.5px;color:var(--mut);background:var(--bd-soft);border-radius:999px;
  padding:1px 7px;cursor:help;white-space:nowrap}
.sbx{font-size:12px;color:var(--warn);background:rgba(180,83,9,.12);border-radius:999px;
  padding:1px 8px;cursor:help;white-space:nowrap}
.sbxnote{font-size:11.5px;color:var(--warn);background:rgba(180,83,9,.10);
  border:1px solid rgba(180,83,9,.25);border-radius:9px;padding:7px 10px;margin:0 0 10px}
.actv{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 9px;margin:0 0 10px;
  padding:8px 11px;border-radius:10px;background:var(--bd-soft)}
.actvt{font-family:var(--f-disp);font-size:10px;font-weight:800;letter-spacing:.09em;
  text-transform:uppercase;color:var(--mut)}
.actv b{font-family:var(--f-disp);font-size:15px;font-variant-numeric:tabular-nums}
.actvw{flex-basis:100%;font-size:11px;color:var(--mut)}
.fover{font-size:10.5px;color:var(--warn);background:rgba(180,83,9,.12);border-radius:999px;
  padding:1px 7px;cursor:help;white-space:nowrap}
.hspan{display:inline-block;margin-left:10px;font-size:10.5px;font-weight:600;letter-spacing:.04em;
  text-transform:none;color:var(--mut);background:var(--bd-soft);padding:2px 9px;border-radius:999px;
  vertical-align:2px}
.ascspan{font-size:11px;color:var(--mut);margin:2px 0 7px}
.ascgrid{display:grid;gap:7px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
  margin-bottom:10px}
.ascgrid>div{background:var(--bd-soft);border-radius:9px;padding:7px 10px;min-width:0}
.ascgrid span{display:block;font-size:10px;color:var(--mut);text-transform:uppercase;
  letter-spacing:.04em}
.ascgrid b{font-family:var(--f-disp);font-size:15px;font-variant-numeric:tabular-nums}
.fcard[id]:target{border-color:var(--acc);box-shadow:0 0 0 2px rgba(125,140,170,.3),var(--sh-up)}
/* ---------- acabamento: luz e profundidade (01/10) ----------
   Gradiente é usado onde tem função: a luz no topo dá direção à página, a barra
   do funil ganha volume, e o cabeçalho de cada app se separa do conteúdo. Fundo
   chapado em tudo o resto, para os números seguirem sendo o que salta. */

  radial-gradient(1100px 420px at 12% -8%, color-mix(in srgb, var(--acc) 11%, transparent), transparent 70%),

  background-attachment:fixed}

<body><header class=top><div class=topin><a class=brand href="../index.html"><span class=mark></span>GambitStudio</a><nav class=navs><a class="nav" href="../index.html">Agora</a><a class="nav" href="../business.html">Business Analysis</a><a class="nav" href="../aso.html">ASO</a><a class="nav" href="../vendas.html">Seller</a></nav><span class=stamp>atualizado 02/10 11:08</span></div></header><div class="wrap"><p class="sub"><code>_GambitStudio/reports/2026-09-27_results-audit/REPORT.md</code></p><div id="md"></div><script>const RAW="# Auditoria de alavancas \u2014 decis\u00e3o (27/09/2026)\n\nS\u00edntese dos quatro audits do dia (`aso.md`, `ppo.md`, `analytics.md`, `store_funnel.md`, mesma pasta). Nada foi alterado em app, ASC ou GA4: tudo abaixo \u00e9 proposta ou prepara\u00e7\u00e3o que espera o seu ok. Calc+ e Cloak est\u00e3o congelados (sua decis\u00e3o, 27/09) e entram s\u00f3 como base fixa.\n\n## Resumo em 10 linhas\n\n1. **Onde o dinheiro est\u00e1:** US$ 2.306 em 30 dias (28/08\u201326/09), 100% assinatura. Calc+ US$ 1.410 (61%) + Cloak US$ 686 (30%) = **US$ 2.096 congelados**. Os outros 21 apps fazem **US$ 210 sobre 2.565 instala\u00e7\u00f5es** (US$ 0,08/inst).\n2. **Aritm\u00e9tica at\u00e9 US$ 4k:** faltam **US$ 1.904/m\u00eas** e t\u00eam que sair dos apps que hoje fazem 210 \u2014 9\u00d7. O tr\u00e1fego atual n\u00e3o fecha a nenhuma convers\u00e3o (2.565 inst \u00d7 US$ 0,30 = US$ 770): precisa de convers\u00e3o E 2-3\u00d7 instala\u00e7\u00f5es nos apps certos.\n3. **Quem carrega:** Hair Schedule (teto US$ 190-270), Sunrise (250-350), BLW (300-350) e iPhotos (200-250) = ~US$ 1.220; demais n\u00e3o congelados ~250. Total ~US$ 1.450 + base 2.096 = **~US$ 3.550 em dez/2027**, faltando US$ 450-600 mesmo com os quatro acertando e a base n\u00e3o caindo (Calc+ 1.4.0 \u00e9 de out/2025; \"constante\" \u00e9 a hip\u00f3tese otimista).\n4. **O que fecha o buraco n\u00e3o est\u00e1 neste relat\u00f3rio:** descongelar o Calc+ ou um app novo no molde dele (vault, sem trial, BR+US \u2014 os dois \u00fanicos apps acima de US$ 0,20/inst s\u00e3o desse nicho). Decis\u00e3o sua (se\u00e7\u00e3o 6, item 20).\n5. **Coisa 1 \u2014 produto \u00e0 venda onde tem gente e n\u00e3o tem receita:** Sunrise (229 inst/30d, +90%, D1 46%, sem assinatura no ar, build 12 pronto) e Hair (419 inst/30d, melhor topo de funil do lab, 90% veem o paywall, US$ 0). Juntos: US$ 180-265/m\u00eas no cen\u00e1rio realista.\n6. **Coisa 2 \u2014 pre\u00e7o e trial:** BLW anual 8,99 \u2192 14,99 (+US$ 50 agora, +150 com o crescimento) e tirar o trial de 3 dias do semanal (em todo app com trial as unidades a US$ 0 igualam ou superam as pagas; o Calc+, sem trial, tem a melhor taxa: 8,4 pagos/100).\n7. **Coisa 3 \u2014 o clique na busca:** iPhotos (6.373 impress\u00f5es \u2192 14 page views, 0,2%; lab faz 3-6%) e Meus Gastos (7.420 \u2192 82, 1,1%) perdem antes da p\u00e1gina. \u00c9 \u00edcone/subt\u00edtulo/3 primeiros prints, n\u00e3o keyword.\n8. **Bloqueadores transversais:** o crash do \"sim\" (#85) ainda est\u00e1 na loja em Hair, Walk e Peptide \u2014 44 usu\u00e1rios ca\u00edram no instante de avaliar, e os tr\u00eas t\u00eam 1 / 5 / 0 ratings; 5 vers\u00f5es rejeitadas seguram trabalho pronto (Sueca, Truco, Bible, SafeDoc; Calc+ congelado).\n9. **Medi\u00e7\u00e3o:** 76% das instala\u00e7\u00f5es e 91% da receita n\u00e3o t\u00eam GA4 (congelados); receita de an\u00fancio n\u00e3o existe em fonte nenhuma; 0 de 42 PPOs com resultado em disco; 12 itera\u00e7\u00f5es ASO sem checkpoint.\n10. **Regra do dia:** nada sobe sem voc\u00ea pedir; release s\u00f3 com alavanca de verdade; texto de loja \u00e9 seu \u2014 aqui vai proposta, n\u00e3o decis\u00e3o.\n\n## Top 10 a\u00e7\u00f5es ranqueadas por US$/m\u00eas esperado\n\n| # | a\u00e7\u00e3o | app | evid\u00eancia (n\u00famero) | US$/m\u00eas esperado (hip\u00f3tese) | esfor\u00e7o | build / review? | onde |\n|---|---|---|---|---|---|---|---|\n| 1 | Assinatura no ar com pre\u00e7o real | Sunrise | 229 inst/30d (+90%), D1 46,1% (n=217), D7 12,5% (n=144), 60% Europa; subs READY_TO_SUBMIT a US$ 0,29 / 2,99; US$ 0 | **80-115** (229 \u00d7 ARPI 0,35-0,50); teto 250-350 | repricing 2 h por API; build 12 j\u00e1 VALID | build n\u00e3o / review sim (vers\u00e3o + 1\u00ba grupo, web UI) | ASC grupo 22419442; `soninho_ios/.../Paywall/Views/PaywallView.swift` |\n| 2 | 1.2.0 com paywall que vende + prints certos + fim do crash | Hair Schedule | 419 inst/30d; imp\u2192PV 6,3% (447/7.063, melhor do lab); paywall visto 90% (438/485), 3,5% iniciam (17), **0 pagos**; BLW inicia 26%; crash-free 94,6% (25 de 461); 1 rating | **100-150** (n\u00edvel BLW: 6 pagos/100 \u00d7 ARPI 0,25 \u00d7 420); teto 190-270 | gate de valor 1-2 dias; reordenar prints 2 h; es-MX = PATCH | build sim (7) / review sim | `Cronogram-Capilar/ios-native`; ASC 1.2.0 (PREPARE) |\n| 3 | Anual 8,99 \u2192 14,99, trial s\u00f3 no anual | BLW | 11 anuais pagos (US$ 95) + 18 a US$ 0; 10 semanais + 8; paywall\u2192compra 8,8% (31/351, melhor do lab); +21% 7d; US 5 dos 11 | **+50 agora** (break-even a \u221240% de convers\u00e3o); +150 com crescimento; teto 300-350 | 1 h por API (price point + equaliza\u00e7\u00f5es) | n\u00e3o / n\u00e3o | ASC sub `com.bemestar.poc.pro.yearly` |\n| 4 | Consertar o clique na busca (\u00edcone, subt\u00edtulo, 3 prints) | iPhotos | 6.373 imp \u2192 14 PV (0,2%) \u2192 159 inst; ARPI 0,39; 450 ratings US 4,02; paywall 4,7% (13/278) | **+115-150** se imp\u21921\u00ba dl for de 0,3% a 1,5% (~500 inst \u00d7 0,30) | 2-3 dias (\u00edcone + prints code-driven) | build sim (\u00edcone) / review sim (prints s\u00f3 em vers\u00e3o nova, #73) | `iPhotosEditor` + `aso-pipeline/` |\n| 5 | Pro anual com feature no lugar do IAP morto | College | 355/363 (98%) chegam \u00e0 tela de compra, 17 iniciam, **0 unidades** no Sales; base 1.534 updates/30d; 52 ratings 4,73; D7 14,4% (n=494) | **40-100** (R$ 19,90/ano \u2248 US$ 3,2 l\u00edquido \u00d7 2% novos + 0,5%/m\u00eas da base) | 2-3 dias (sub via API + PaywallKit) | sim / sim | `CollegeSchoolControl/.../Purchase/PurchaseViewController.swift`; IAP 1519377452 |\n| 6 | Parar o PPO v3, ordem na p\u00e1gina padr\u00e3o, trial do mensal, busca | Meus Gastos | 7.420 imp \u2192 82 PV \u2192 17 dl (0,2%); 7 trials \u00d7 2 pagos; PPO v3 precisa de 542 semanas para +15%; 6,9\" pt-BR com arte de dez/2024 | **+40-70** | parar = 1 PATCH; ordem + 6,9\" = vers\u00e3o edit\u00e1vel (45.4.0 j\u00e1 no repo); trial = DELETE 15 min | sim (45.4.0) / sim | exp `9570de85`; `Controle-de-gastos` |\n| 7 | Tirar o trial de 3 dias do semanal (teste de 4 semanas) | BLW, Walk, Meus Gastos | unidades a US$ 0 \u2265 pagas: BLW 26\u00d721, Walk 8\u00d77, MG 7\u00d72 (n pequeno); Calc+ sem trial = 8,4 pagos/100 vs BLW 6,4, Cloak 4,6 | **+20-40** (+10-30% de transa\u00e7\u00f5es pagas); valor maior = virar regra para Sunrise e Hair | 1 h (DELETE intro offer do weekly) | n\u00e3o / n\u00e3o | `subscriptionIntroductoryOffers` de cada weekly |\n| 8 | Release com o kit corrigido + prompt nativo + ASO US/GB/DE | Walk | 285 inst (+28%); IN 76 + PK de 248; ARPI 0,08; paywall 12% iniciam \u2192 3% compram (41\u219211); crash-free 96,2% (13/341); 5 ratings | **+30-50** (mesma convers\u00e3o, geografia que paga) | release 7.4.0 (kit 0e95ebd + 90a5268 + revamp pendente) + `/start-aso-pipeline` US/GB/DE | sim / sim | `stepsSwiftUI`; iter-03 (reancorar) |\n| 9 | Destravar a 42 (age rating), decidir an\u00fancio vs SDK; Truco 52 + es-MX | Sueca, Truco | Sueca 168 inst/30d, 162 ratings 4,66, GA4 1,6% (4/274), nada \u00e0 venda; Truco 117 inst, 462 ratings, interstitial no ar, es-MX 34\u219289 chars preso | **0 direto**; destrava 285 inst/m\u00eas + 624 ratings sem produto e a leitura do an\u00fancio | age rating PATCH + re-submit 1 h; v\u00ednculo AdMob 15 min (seu) | Sueca: build 44 existe / review sim; Truco: build corrigido / review sim | `SuecaDrink`, `TrucoMarcador`; console AdMob |\n| 10 | Promotional text + higiene de locales, sem release | Walk, Neon, Sueca, iPhotos, College, MG, Cronos, Peptide | promo vazio em 41/41, 39/39, 12/12, 13/13, 11/11, 13/29; ~40 mil imp/m\u00eas somadas; Cronos sem es-MX (MX 9 ratings > US 7); Peptide es-MX/en-GB/en-AU no posicionamento antigo | marginal por app (n\u00e3o indexa; \u00e9 a 1\u00aa linha da p\u00e1gina) | 3 locales \u00d7 app, edit\u00e1vel na vers\u00e3o live | n\u00e3o / n\u00e3o | `appStoreVersionLocalizations.promotionalText` |\n\n**1. Sunrise.** \u00c9 a \u00fanica a\u00e7\u00e3o onde tudo j\u00e1 existe: 1.4.0 com o build 12 (paywall novo) anexado e VALID em PREPARE_FOR_SUBMISSION, duas assinaturas READY_TO_SUBMIT. O que falta \u00e9 pre\u00e7o \u2014 US$ 0,29/semana e 2,99/ano s\u00e3o placeholder \u2014 e o envio, que s\u00f3 o web UI faz (1\u00ba grupo vai junto da vers\u00e3o, #44/#51). Proposta: weekly 1,99 / yearly 14,99, trial s\u00f3 no anual (item 7). Primeiro passo: decis\u00f5es 1 e 2; eu preparo os price points equalizados nos 175 territ\u00f3rios; voc\u00ea marca as duas subs na 1.4.0 e envia. Depois da aprova\u00e7\u00e3o, conferir `paywall_shown` e `purchase_success` no GA4 \u2014 na 1.3.0 s\u00e3o zero em 220 usu\u00e1rios novos.\n\n**2. Hair Schedule.** Maior tr\u00e1fego n\u00e3o congelado, melhor imp\u2192PV do lab, e o paywall \"premium = sem an\u00fancio\" n\u00e3o convence: 3,5% iniciam contra 26% no BLW. A 1.2.0 j\u00e1 est\u00e1 aberta na ASC e o repo tem o trabalho de 23-27/09 (paywall com benef\u00edcios, trial s\u00f3 no semanal a seu pedido). O que a auditoria adiciona antes do archive: (a) o gate de valor do benchmark (scanner ilimitado, \"serve pro meu cabelo\", evolu\u00e7\u00e3o do di\u00e1rio) \u2014 decis\u00e3o 3; (b) a p\u00e1gina viva est\u00e1 na ordem main, settings, onboarding, feature1, feature2 \u2014 settings e onboarding nos slots 2-3 que aparecem na busca, e onboarding viola o RULES; reordenar na 1.2.0 custa 2 h, sem review extra \u2014 decis\u00e3o 5; (c) o crash do \"sim\" ainda derruba ~1 usu\u00e1rio/dia na 1.1.0 (27 `rating_gate_yes` = 27 `app_exception`) e \u00e9 por isso que 419 instala\u00e7\u00f5es renderam 1 rating; (d) diagnosticar os 4 `purchase_success` a US$ 0 (param `product_id` \u00d7 relat\u00f3rio SUBSCRIPTION da ASC) antes de mexer em pre\u00e7o; (e) whatsNew e promo vazios nos 39 idiomas; Firebase em `exactVersion` (#90).\n\n**3. BLW.** \u00danico n\u00e3o congelado com funil de compra provado (8,8% paywall\u2192compra) e o anual mais barato do nicho (parenting pratica 20-40/ano). Subir para 14,99 s\u00f3 para novos assinantes (`preserveCurrentPrice`) n\u00e3o precisa de build nem review. Primeiro passo: decis\u00e3o 6; medir 4 semanas contra as 4 anteriores (pagos/100 e ARPI). Na carona do pr\u00f3ximo release: Crashlytics (412 ativos sem sensor) e o call site de `feature_used` (0 usu\u00e1rios em 412).\n\n**4. iPhotos.** O vazamento com mais dinheiro atr\u00e1s: 450 ratings US e ARPI 0,39 j\u00e1 existem, s\u00f3 falta o clique \u2014 0,2% imp\u2192PV contra 3-6% do lab. A corre\u00e7\u00e3o \u00e9 a p\u00e1gina (\u00edcone, nome/subt\u00edtulo, 3 primeiros prints), e print de vers\u00e3o publicada \u00e9 imut\u00e1vel (#73): custa uma vers\u00e3o nova. Primeiro passo: decis\u00e3o 10; eu preparo \u00edcone, subt\u00edtulo e 3 prints code-driven como proposta, sem subir nada. Acompanhar o anual 12,99 agendado para 29/09 sobre trial\u2192pago (6 pagos / 11 trials hoje). Crashlytics na mesma vers\u00e3o (549 ativos, maior base cega).\n\n**5. College.** 98% dos usu\u00e1rios chegam \u00e0 tela de compra e ningu\u00e9m compra o Premium vital\u00edcio (ex-NoAds): 0 unidades em 4 semanas. Reten\u00e7\u00e3o \u00e9 a melhor estrutura do lab (D7 14,4%, picos de 7 em 7 dias) e a base de 1.534 updates/m\u00eas \u00e9 o ativo. ARPU de estudante BR limita: US$ 40-100. Primeiro passo: decis\u00e3o 11 \u2014 sub anual R$ 19,90 com feature real (c\u00e1lculo de nota, widget, backup) e PaywallKit no lugar da `PurchaseViewController` legada.\n\n**6. Meus Gastos.** O PPO v3 aixa do iPad corrigida e o es-MX de 34 \u2192 89 chars preso. Primeiro passo: decis\u00f5es 13-16 \u2014 corrigir o `ageRatingDeclaration` e re-submeter a 42; re-submeter a 52; v\u00ednculo AdMob\u2194Firebase no console (s\u00f3 voc\u00ea, 15 min): sem ele, \"an\u00fancio ou sub\" nesses dois \u00e9 chute.\n\n**10. Promo text e higiene.** N\u00e3o move ranking, mas \u00e9 a primeira linha vis\u00edvel da p\u00e1gina, edit\u00e1vel na vers\u00e3o live sem review, e est\u00e1 vazio em 13 apps com ~40 mil impress\u00f5es/m\u00eas somadas. Mesma leva: es-MX do Cronos copiado do es-ES; Peptide es-MX/en-GB/en-AU alinhados ao posicionamento GLP-1; Bible es-MX sem o token \"app\". Primeiro passo: decis\u00e3o 19 \u2014 eu escrevo as propostas (3 locales por app, benef\u00edcio + prova), voc\u00ea aprova, PATCH.\n\n## Vazamentos por etapa\n\nRefer\u00eancia do lab: imp\u2192PV Hair 6,3% \u00b7 Cloak/College/Calc+ 4,3% \u00b7 BLW 3,2%; PV\u2192inst BLW 37% \u00b7 Sunrise 30%; pagos por 100 instala\u00e7\u00f5es Calc+ 8,4 \u00b7 BLW 6,4 \u00b7 Cloak 4,6. Piso de privacidade 5/semana: \"0\" \u00e9 \"< 5\", n\u00e3o zero.\n\n**Impress\u00e3o \u2192 page view (aparece e ningu\u00e9m toca)**\n\n| app | impress\u00f5es | PV | imp\u2192PV | causa prov\u00e1vel |\n|---|---:|---:|---:|---|\n| Neon | 5.057 | 0 (<5/sem.) | 0,0% | rankeia baixo em termos gen\u00e9ricos de desenho; as 88 instala\u00e7\u00f5es v\u00eam da base (2.680 updates). Prints code-driven da v26+ substitu\u00edram o vencedor \"Real scenes\" sem teste \u2014 conferir CVR v25 vs v28 no ASC web |\n| iPhotos | 6.373 | 14 | 0,2% | nome/\u00edcone/subt\u00edtulo n\u00e3o convencem no resultado; \u00e9 o vazamento com mais dinheiro atr\u00e1s (ARPI 0,39, 450 ratings) |\n| Bible Pills | 3.469 | 17 | 0,5% | termos de inten\u00e7\u00e3o errada (\"bible\" gen\u00e9rico); 1.2.0 de maio, 1.2.2 rejeitada parada; 32 inst/m\u00eas \u2014 n\u00e3o priorizar |\n| (Meus Gastos) | 7.420 | 82 | 1,1% | mesmo padr\u00e3o em escala maior; tes de mexer em pre\u00e7o.\n\n## Medi\u00e7\u00e3o: o que est\u00e1 cego\n\n- **Cobertura:** 9 apps sem GA4 no build publicado = 6.830 instala\u00e7\u00f5es (76%) e US$ 2.096 (91%) \u2014 quase tudo Calc+ e Cloak. Os 12 medidos somam 2.169 instala\u00e7\u00f5es e US$ 210: a an\u00e1lise de produto orienta 9% da receita.\n- **O crash do \"sim\" (#85) continua nas vers\u00f5es publicadas.** Hair 1.1.0: crash-free 94,6%, 25 de 461 usu\u00e1rios, `rating_gate_yes` 27 = `app_exception` 27. Walk 7.3.0: 96,2%, 13 de 341, 12 = 13. Peptide 1.1.3: 85,4% (pior do lab), 6 de 40, 5 = 6. Correspond\u00eancia 1:1 nos tr\u00eas; 44 pessoas ca\u00edram no instante de avaliar. As tr\u00eas vers\u00f5es s\u00e3o anteriores ao fix do kit (`0e95ebd`, 08/09); s\u00f3 release resolve. Neon (95,6%, 4 usu\u00e1rios) e Sunrise (98,6%, 3) entram no mesmo pacote quando houver vers\u00e3o.\n- **Sem Crashlytics:** iPhotos (549 ativos, maior base cega), BLW (412), Cronos (64), DevLingo (45), Philos \u2014 1.070 usu\u00e1rios ativos que n\u00e3o conseguem reportar um crash; \"100% crash-free\" ali \u00e9 aus\u00eancia de sensor (#86).\n- **Zero telemetria com tr\u00e1fego real:** Truco (117 inst/m\u00eas, 462 ratings, serve AdMob \u2014 nenhum plist), Philos (plist instrumentado em 06/09 continua `??` no git, loja na 1.0.3 sem Firebase), Bible (`AnalyticsService` sem backend), Foguetinho (serve AdMob sem medir), SafeDoc (6 inst/m\u00eas \u2014 n\u00e3o vale).\n- **Preso ou mudo:** Sueca 1,6% de cobertura (4/274) porque o Firebase s\u00f3 existe na 42.0.0 rejeitada; Meus Gastos 45.3.1 emite `paywall_view`/`onboarding_complete`/`purchase_start` e nenhum `core_action` (a 45.4.0 corrige, no repo); BLW `feature_used` 0 em 412; iPhotos `onboarding_completed` 2 em 212; Sunrise `paywall_shown` 0 em 220 (ou a 1.3.0 n\u00e3o apresenta paywall, ou o hook est\u00e1 desligado \u2014 o build 12 tem que provar).\n- **O buraco do AdMob (#80):** Truco, Neon e Foguetinho servem interstitial (Truco e Foguetinho no mesmo ad unit, ent\u00e3o nem o console separa); Hair, iPhotos e Calc+ carregam o SDK; Sueca linka e n\u00e3o mostra. `ad_impression` est\u00e1 ausente nas 11 properties porque o v\u00ednculo AdMob\u2194Firebase nunca foi feito. Todo \"US$\" deste relat\u00f3rio \u00e9 assinatura; o checkpoint de 02/10 precisa declarar o buraco em vez de somar zero.\n- **Ru\u00eddo de ferramenta:** cobertura > 100% (College 139%, Cronos 148%) \u00e9 `first_open` de quem atualizou de vers\u00e3o sem Firebase \u2014 ler como ~100%; `crash_live = None` em WTMP/College/iPhotos/Cronos/Sueca porque o GA4 reporta build number e a loja marketing version (fix no `firebase_snapshot.py` via `preReleaseVersion`); o `verify-analytics.py` n\u00e3o v\u00ea evento emitido por hook de kit (Cronos); ativa\u00e7\u00e3o do painel com denominador errado (item j\u00e1 no now.json).\n- **PPO e ASO sem leitura:** 0 de 42 experimentos com CVR em disco; 12 vencedores promovidos com \u2264 3 dias de dados (4 com < 1 dia); s\u00f3 Calc+ e Cloak t\u00eam tr\u00e1fego para detectar +15% em 90 dias \u2014 nos outros 18 apps, PPO \u00e9 canal de publica\u00e7\u00e3o, n\u00e3o teste. 12 itera\u00e7\u00f5es de texto com checkpoint vencido (Walk, Philos, BLW, iPhotos e Meus Gastos j\u00e1 passaram do fechamento).\n- **O que instrumentar primeiro, e por qu\u00ea:** (1) v\u00ednculo AdMob\u2194Firebase \u2014 15 min seus, sem build, e \u00e9 o \u00fanico jeito de saber se Sueca/Truco/Neon valem an\u00fancio ou sub; (2) Crashlytics em iPhotos e BLW na carona do pr\u00f3ximo release de cada um (n\u00e3o \u00e9 release magra: \u00e9 um pod a mais no build que j\u00e1 vai sair); (3) re-submeter a Sueca 42 \u2014 o analytics vai junto; (4) `purchase_abandoned` por `reason` nos 5 apps do fim do funil antes de qualquer mudan\u00e7a de pre\u00e7o; (5) `/refresh-lab-data` + `aso-checkpoint` em lote nas 5 itera\u00e7\u00f5es vencidas antes de abrir itera\u00e7\u00e3o nova; (6) os dois fixes do `firebase_snapshot.py` (build\u2192vers\u00e3o, denominador da ativa\u00e7\u00e3o).\n\n## Congelados \u2014 s\u00f3 fatos (sem a\u00e7\u00e3o por decis\u00e3o do Jo\u00e3o, 27/09)\n\n- **Calc+ (Secret Calculator Vault):** US$ 1.409,98/30d (61,1% do lab), flat +3%; 1.4.0 na loja desde 09/10/2025 (build 200); 3.064 instala\u00e7\u00f5es/30d, US$ 0,46/inst \u2014 melhor economia do lab; 240 pagos (208 mensais US$ 4,99 + 32 anuais 19,99) e **0 trials** (\u00fanico app sem intro offer); BR = 68% das instala\u00e7\u00f5es e 57% da receita; 4.825 ratings (US 943, BR 2.801, MX 967, ES 114). P\u00e1gina: 6,9\" em en-US/pt-BR/es-ES/es-MX com a arte de 2022, s\u00f3 o 6,5\" recebeu o vencedor Vault Green (12/08); o PPO \"Ordem de telas\" (28/08\u201326/11) tem no 6,9\" um controle que \u00e9 a arte velha \u2014 mede \"arte nova vs 2022\", n\u00e3o ordem; +15% leg\u00edvel por volta de 05/10. Keywords: pt-BR com ~65 dos 100 chars redundantes, en-US com \"sg\", \"c\" truncado e \"vulte\"; iter-01 pt-BR em draft desde 22/07; promo vazio 12/12. 1.5.0 DEVELOPER_REJECTED desde out/2025 com build 224 VALID e 8 locales novos parados. Sem FirebaseAnalytics; 0 eventos.\n- **Cloak (App Lock):** US$ 686,02/30d (29,7%), flat \u22121%; 9.6 na loja desde 01/06/2026; 3.370 instala\u00e7\u00f5es/30d, US$ 0,20/inst; weekly 4,99 (trial 3 dias): 122 pagos + 92 a US$ 0; yearly 19,99: 19 + 24; monthly 3; total 144 pagos / 116 zero; IAP `applocker.yearly.pro` MISSING_METADATA (morto); CN 499 + VN 333 + IN 212 = 33% das instala\u00e7\u00f5es em pa\u00edses de ARPU baixo; 33 ratings (US 12, \u00fanico com velocidade: 4 \u2192 12 desde 19/08). P\u00e1gina: s\u00f3 6,5\" (Apple escala; sem arte velha), vencedor 5/5; \"Screen Order 21L\" parou em 23/09 sem resultado registrado, nenhum teste desde. Keywords: \"app\" 5\u00d7, \"secre\"/\"cl\" truncados, repete lock/vault/blocker do nome; 21 de 39 locales. 9.7 DEVELOPER_REJECTED desde 04/08 com keywords novas e o Firebase (property com 0 eventos); iter-01 em \"research\" desde 23/05.\n\n## Decis\u00f5es pendentes do Jo\u00e3o\n\nSim/n\u00e3o; recomenda\u00e7\u00e3o primeiro, motivo numa linha.\n\n1. **Sunrise \u2014 repricing antes de submeter (weekly 1,99 / yearly 14,99, trial s\u00f3 no anual)?** Sim. 0,29/2,99 \u00e9 placeholder; Europa \u00e9 60% das instala\u00e7\u00f5es e D1 46% \u00e9 o melhor do lab \u2014 p\u00fablico que paga.\n2. **Sunrise \u2014 enviar a 1.4.0 com as 2 assinaturas pelo web UI?** Sim, depois do item 1. Build 12 VALID j\u00e1 anexado; o 1\u00ba grupo s\u00f3 entra junto da vers\u00e3o.\n3. **Hair \u2014 trocar \"premium = sem an\u00fancio\" por gate de valor (scanner ilimitado, recomenda\u00e7\u00e3o por perfil, evolu\u00e7\u00e3o do di\u00e1rio)?** Sim. 3,5% iniciam compra contra 26% no BLW com o mesmo kit; o benchmark de 19 concorrentes diz que calend\u00e1rio atr\u00e1s de paywall gera 1 estrela.\n4. **Hair \u2014 mover o trial do semanal para o anual?** Sim, como hip\u00f3tese (n pequeno): em todo app com trial as unidades a US$ 0 igualam as pagas; um trial de anual que converte vale 8-10 semanais. Pre\u00e7os ficam intocados, como voc\u00ea pediu em 23/09.\n5. **Hair 1.2.0 \u2014 reordenar prints (main, feature1, feature2; settings/onboarding fora dos slots 2-3) e autorizar o deploy do es-MX + frizz\u2192test?** Sim aos dois. Onboarding na p\u00e1gina viola o RULES; o es-MX \u00e9 o conserto do M\u00e9xico e s\u00f3 texto.\n6. **BLW \u2014 anual 8,99 \u2192 14,99 para novos assinantes?** Sim, medindo 4 semanas. Break-even a \u221240% de convers\u00e3o; nicho pratica 20-40/ano; US 5 dos 11 anuais.\n7. **Trial semanal \u2014 tirar o intro offer do weekly em BLW, Walk e Meus Gastos por 4 semanas (manter no anual)?** Sim. Hip\u00f3tese com n \u2264 30 por app, custo zero, revers\u00edvel.\n8. **Meus Gastos \u2014 parar o PPO v3 (`9570de85`)?** Sim. 542 semanas para +15%; termina em 27/11 sem resposta poss\u00edvel e segura a arte velha no 6,9\" pt-BR.\n9. **Meus Gastos \u2014 publicar a 45.4.0 iOS com a ordem de prints que voc\u00ea preferir + trial do mensal removido?** Sim, quando quiser. Leva o analytics can\u00f4nico (a loja emite nomes legados) e a arte nova no 6,9\"; n\u00e3o \u00e9 release magra.\n10. **iPhotos \u2014 vers\u00e3o nova com \u00edcone, subt\u00edtulo e 3 primeiros prints refeitos (texto e arte s\u00e3o propostas minhas para voc\u00ea aprovar)?** Sim. 0,2% imp\u2192PV com 450 ratings e ARPI 0,39 \u00e9 o clique mais caro do lab; Crashlytics vai junto.\n11. **College \u2014 substituir o Premium vital\u00edcio (0 vendas) por Pro anual R$ 19,90 com feature real?** Sim, sabendo que o teto \u00e9 US$ 40-100 (ARPU de estudante BR); 98% chegam \u00e0 tela de compra.\n12. **Walk \u2014 release 7.4.0 (kit corrigido + prompt nativo + revamp) e ASO voltado a US/GB/DE?** Sim. 13 crashes no \"sim\" e 5 ratings em 285 instala\u00e7\u00f5es; IN 31% do tr\u00e1fego n\u00e3o paga.\n13. **Sueca \u2014 corrigir o age rating (`sexualContentOrNudity`) e re-submeter a 42.0.0?** Sim. Prende analytics, keywords, prints e o prompt de review; 168 inst/m\u00eas e 162 ratings.\n14. **Sueca \u2014 ligar an\u00fancio de verdade ou tirar o SDK AdMob?** Tirar, se n\u00e3o for ligar em 30 dias. Hoje paga o custo (age rating `advertising`, peso) e fatura zero; a sub 3,99 em MISSING_METADATA \u00e9 a alternativa se o item 15 mostrar que an\u00fancio rende pouco.\n15. **AdMob\u2194Firebase \u2014 fazer o v\u00ednculo no console do AdMob (s\u00f3 a conta dona)?** Sim, 15 min. Sem isso a receita de Truco/Neon/Foguetinho n\u00e3o existe em fonte nenhuma e \"premium = sem an\u00fancio\" no Hair/iPhotos n\u00e3o tem pre\u00e7o.\n16. **Truco \u2014 re-submeter a 52 (faixa do iPad corrigida) levando o es-MX de 89 chars?** Sim. 462 ratings 4,73 passa na regra rating-first; decidir antes o \u00e1lcool (declarar 12+ ou tirar a anima\u00e7\u00e3o de cerveja \u2014 recomenda\u00e7\u00e3o: tirar).\n17. **Bible 1.2.2 e SafeDoc 1.1.0 \u2014 re-submeter agora?** N\u00e3o. 32 e 6 instala\u00e7\u00f5es/m\u00eas; s\u00f3 quando houver alavanca real (Bible: c\u00e2mera + Firebase; SafeDoc: cofre de documentos, metadata j\u00e1 corrigida).\n18. **Peptide \u2014 release s\u00f3 para o crash (85,4%) + pin do Firebase?** N\u00e3o agora. 37 inst/m\u00eas, veredito KILL; agrupar com a pr\u00f3xima vers\u00e3o que tiver alavanca (e travar o Firebase em 12.18.0 antes de qualquer archive).\n19. **Promo text \u2014 eu escrevo as propostas (3 locales) para Walk, Neon, Sueca, iPhotos, College e Meus Gastos e voc\u00ea aprova?** Sim. Custo zero, sem review, ~40 mil impress\u00f5es/m\u00eas passam por essa linha.\n20. **Meta \u2014 congelados, o portf\u00f3lio chega a ~US$ 3.550 no melhor caso. Descongelar o Calc+ (61% da receita, parado desde out/2025) ou abrir um app novo no molde dele?** Registro, n\u00e3o recomenda\u00e7\u00e3o: \u00e9 a \u00fanica decis\u00e3o que fecha os US$ 450-600 que faltam.\n21. **Neon \u2014 conferir no ASC web o CVR de p\u00e1gina da v25 vs v28 antes de mexer na p\u00e1gina, e subir a corre\u00e7\u00e3o do bot\u00e3o gravar/Pro quando houver janela?** Sim aos dois. 5.057 impress\u00f5es com 0 PV medido; o paywall \"no momento do valor\" abriu zero vezes porque o bot\u00e3o estava escondido.\n22. **WTMP \u2014 produto + paywall agora?** N\u00e3o. D7 1,1% (n=89), app de sess\u00e3o \u00fanica; primeiro o A/B dos prints em review e a leitura das 2 semanas.\n\n## M\u00e9todo e limites\n\n- **Janelas.** `dashboard.json` regravado 27/09 21:48: Sales Reports di\u00e1rios 28/08\u201326/09 (30d; instala\u00e7\u00f5es `1*`, updates `7*`, redownloads `3*`, proceeds USD, ratings por iTunes lookup, vers\u00e3o live). Funil da ASC semanal 24/08\u201320/09 (WTMP 2 semanas, Philos 5), piso de privacidade 5. Sales semanais 24/08\u201320/09 para separar pagos \u00d7 US$ 0. `firebase.json` 28d at\u00e9 26/09. `aso.md` e `ppo.md` usaram o dashboard de 06/09 (funil at\u00e9 30/08); ratings contra a base de 19/08. Onde os audits divergem (Hair 307 vs 419 inst; iPhotos imp\u21921\u00ba dl 0,6% vs 0,3%), vale o `store_funnel.md`, o mais fresco.\n- **Requests.** ASC API s\u00f3 leitura: ~118 GETs (aso), 299 (ppo), 105 (funil); GA4: snapshot + 2 chamadas. Nenhum write.\n- **O que n\u00e3o foi medido.** Receita de an\u00fancio (nenhuma fonte); motivo oficial das rejei\u00e7\u00f5es (Resolution Center n\u00e3o tem API \u2014 vem por e-mail); lift dos PPOs (s\u00f3 no ASC web, 0 de 42 em disco); assinatura nova vs renova\u00e7\u00e3o (`IAY` junta as duas \u2014 \"pagos por 100 instala\u00e7\u00f5es\" \u00e9 teto, n\u00e3o CVR); pre\u00e7o dos IAPs `NoAds.*` (rota 404; 0 unidades, irrelevante); crash-free da vers\u00e3o live onde o GA4 reporta build number; ARPI infla apps com base velha (iPhotos, Calc+) e subestima os novos (Hair, Sunrise).\n- **n pequeno.** Reten\u00e7\u00e3o com n < 30 (Peptide D14, Meus Gastos D30, DevLingo D30, Cronos D14) e todo n\u00famero de produto de Sueca, Philos, Truco e Bible (n \u2264 4 ou zero) s\u00e3o direcionais. `purchase_success` no GA4 dispara em trial (US$ 0) e possivelmente em restore \u2014 \"sucesso\" sem receita n\u00e3o \u00e9 venda.\n- **Estimativas de US$.** Hip\u00f3teses declaradas na tabela (ARPI \u00d7 instala\u00e7\u00f5es, ou taxa do app de refer\u00eancia aplicada ao volume do alvo); sem crescimento al\u00e9m do escrito e sem receita de an\u00fancio.\n";</script><script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script><script>document.getElementById("md").innerHTML=window.marked?marked.parse(RAW):"<pre>"+RAW.replace(/</g,"&lt;")+"</pre>";</script></div><script>
