<body><div class="wrap"><p class="sub" style="font-size:12px;margin:0 0 14px">Exportado em 2026-10-01 10:28 · fonte: Lab Hub local</p><p class="sub"><a href="../index.html">← hub</a> · <code>_GambitStudio/reports/2026-09-27_results-audit/REPORT.md</code></p><div id="md"></div><script>const RAW="# Auditoria de alavancas \u2014 decis\u00e3o (27/09/2026)\n\nS\u00edntese dos quatro audits do dia (`aso.md`, `ppo.md`, `analytics.md`, `store_funnel.md`, mesma pasta). Nada foi alterado em app, ASC ou GA4: tudo abaixo \u00e9 proposta ou prepara\u00e7\u00e3o que espera o seu ok. Calc+ e Cloak est\u00e3o congelados (sua decis\u00e3o, 27/09) e entram s\u00f3 como base fixa.\n\n## Resumo em 10 linhas\n\n1. **Onde o dinheiro est\u00e1:** US$ 2.306 em 30 dias (28/08\u201326/09), 100% assinatura. Calc+ US$ 1.410 (61%) + Cloak US$ 686 (30%) = **US$ 2.096 congelados**. Os outros 21 apps fazem **US$ 210 sobre 2.565 instala\u00e7\u00f5es** (US$ 0,08/inst).\n2. **Aritm\u00e9tica at\u00e9 US$ 4k:** faltam **US$ 1.904/m\u00eas** e t\u00eam que sair dos apps que hoje fazem 210 \u2014 9\u00d7. O tr\u00e1fego atual n\u00e3o fecha a nenhuma convers\u00e3o (2.565 inst \u00d7 US$ 0,30 = US$ 770): precisa de convers\u00e3o E 2-3\u00d7 instala\u00e7\u00f5es nos apps certos.\n3. **Quem carrega:** Hair Schedule (teto US$ 190-270), Sunrise (250-350), BLW (300-350) e iPhotos (200-250) = ~US$ 1.220; demais n\u00e3o congelados ~250. Total ~US$ 1.450 + base 2.096 = **~US$ 3.550 em dez/2027**, faltando US$ 450-600 mesmo com os quatro acertando e a base n\u00e3o caindo (Calc+ 1.4.0 \u00e9 de out/2025; \"constante\" \u00e9 a hip\u00f3tese otimista).\n4. **O que fecha o buraco n\u00e3o est\u00e1 neste relat\u00f3rio:** descongelar o Calc+ ou um app novo no molde dele (vault, sem trial, BR+US \u2014 os dois \u00fanicos apps acima de US$ 0,20/inst s\u00e3o desse nicho). Decis\u00e3o sua (se\u00e7\u00e3o 6, item 20).\n5. **Coisa 1 \u2014 produto \u00e0 venda onde tem gente e n\u00e3o tem receita:** Sunrise (229 inst/30d, +90%, D1 46%, sem assinatura no ar, build 12 pronto) e Hair (419 inst/30d, melhor topo de funil do lab, 90% veem o paywall, US$ 0). Juntos: US$ 180-265/m\u00eas no cen\u00e1rio realista.\n6. **Coisa 2 \u2014 pre\u00e7o e trial:** BLW anual 8,99 \u2192 14,99 (+US$ 50 agora, +150 com o crescimento) e tirar o trial de 3 dias do semanal (em todo app com trial as unidades a US$ 0 igualam ou superam as pagas; o Calc+, sem trial, tem a melhor taxa: 8,4 pagos/100).\n7. **Coisa 3 \u2014 o clique na busca:** iPhotos (6.373 impress\u00f5es \u2192 14 page views, 0,2%; lab faz 3-6%) e Meus Gastos (7.420 \u2192 82, 1,1%) perdem antes da p\u00e1gina. \u00c9 \u00edcone/subt\u00edtulo/3 primeiros prints, n\u00e3o keyword.\n8. **Bloqueadores transversais:** o crash do \"sim\" (#85) ainda est\u00e1 na loja em Hair, Walk e Peptide \u2014 44 usu\u00e1rios ca\u00edram no instante de avaliar, e os tr\u00eas t\u00eam 1 / 5 / 0 ratings; 5 vers\u00f5es rejeitadas seguram trabalho pronto (Sueca, Truco, Bible, SafeDoc; Calc+ congelado).\n9. **Medi\u00e7\u00e3o:** 76% das instala\u00e7\u00f5es e 91% da receita n\u00e3o t\u00eam GA4 (congelados); receita de an\u00fancio n\u00e3o existe em fonte nenhuma; 0 de 42 PPOs com resultado em disco; 12 itera\u00e7\u00f5es ASO sem checkpoint.\n10. **Regra do dia:** nada sobe sem voc\u00ea pedir; release s\u00f3 com alavanca de verdade; texto de loja \u00e9 seu \u2014 aqui vai proposta, n\u00e3o decis\u00e3o.\n\n## Top 10 a\u00e7\u00f5es ranqueadas por US$/m\u00eas esperado\n\n| # | a\u00e7\u00e3o | app | evid\u00eancia (n\u00famero) | US$/m\u00eas esperado (hip\u00f3tese) | esfor\u00e7o | build / review? | onde |\n|---|---|---|---|---|---|---|---|\n| 1 | Assinatura no ar com pre\u00e7o real | Sunrise | 229 inst/30d (+90%), D1 46,1% (n=217), D7 12,5% (n=144), 60% Europa; subs READY_TO_SUBMIT a US$ 0,29 / 2,99; US$ 0 | **80-115** (229 \u00d7 ARPI 0,35-0,50); teto 250-350 | repricing 2 h por API; build 12 j\u00e1 VALID | build n\u00e3o / review si pre\u00e7o; (e) whatsNew e promo vazios nos 39 idiomas; Firebase em `exactVersion` (#90).\n\n**3. BLW.** \u00danico n\u00e3o congelado com funil de compra provado (8,8% paywall\u2192compra) e o anual mais barato do nicho (parenting pratica 20-40/ano). Subir para 14,99 s\u00f3 para novos assinantes (`preserveCurrentPrice`) n\u00e3o precisa de build nem review. Primeiro passo: decis\u00e3o 6; medir 4 semanas contra as 4 anteriores (pagos/100 e ARPI). Na carona do pr\u00f3ximo release: Crashlytics (412 ativos sem sensor) e o call site de `feature_used` (0 usu\u00e1rios em 412).\n\n**4. iPhotos.** O vazamento com mais dinheiro atr\u00e1s: 450 ratings US e ARPI 0,39 j\u00e1 existem, s\u00f3 falta o clique \u2014 0,2% imp\u2192PV contra 3-6% do lab. A corre\u00e7\u00e3o \u00e9 a p\u00e1gina (\u00edcone, nome/subt\u00edtulo, 3 primeiros prints), e print de vers\u00e3o publicada \u00e9 imut\u00e1vel (#73): custa uma vers\u00e3o nova. Primeiro passo: decis\u00e3o 10; eu preparo \u00edcone, subt\u00edtulo e 3 prints code-driven como proposta, sem subir nada. Acompanhar o anual 12,99 agendado para 29/09 sobre trial\u2192pago (6 pagos / 11 trials hoje). Crashlytics na mesma vers\u00e3o (549 ativos, maior base cega).\n\n**5. College.** 98% dos usu\u00e1rios chegam \u00e0 tela de compra e ningu\u00e9m compra o Premium vital\u00edcio (ex-NoAds): 0 unidades em 4 semanas. Reten\u00e7\u00e3o \u00e9 a melhor estrutura do lab (D7 14,4%, picos de 7 em 7 dias) e a base de 1.534 updates/m\u00eas \u00e9 o ativo. ARPU de estudante BR limita: US$ 40-100. Primeiro passo: decis\u00e3o 11 \u2014 sub anual R$ 19,90 com feature real (c\u00e1lculo de nota, widget, backup) e PaywallKit no lugar da `PurchaseViewController` legada.\n\n**6. Meus Gastos.** O PPO v3 (3 tratamentos, 1.430 impress\u00f5es/semana) precisaria de 542 semanas para detectar +15% e termina em 27/11 sem resposta poss\u00edvel \u2014 enquanto isso o 6,9\" do pt-BR mostra a arte de dez/2024. Primeiro passo: decis\u00e3o 8 (parar, 1 PATCH) e 9 (aplicar a ordem que voc\u00ea preferir na p\u00e1gina padr\u00e3o da 45.4.0, que j\u00e1 carrega o analytics can\u00f4nico \u2014 a 45.3.1 na loja emite nomes legados e `core_action` \u00e9 mudo). Depois: tirar o trial do mensal (7 trials, 2 pagos) e a SERP (7.420 \u2192 82) pelo `/start-aso-pipeline`.\n\n**7. Trial semanal.** Hip\u00f3tese, n\u00e3o prova (n \u2264 30 por app): onde h\u00e1 intro offer, as unidades a US$ 0 igualam ou superam as pagas; o \u00fanico app sem trial tem a melhor taxa de pagamento. Um trial de anual que converte vale 8-10 semanais, ent\u00e3o manter no anual. Primeiro passo: decis\u00e3o 7; antes, puxar `purchase_abandoned` por `reason` (Hair tem 17 usu\u00e1rios com o evento) \u2014 se for `failed`/`pending` \u00e9 StoreKit, se for `cancelled` \u00e9 oferta.\n\n**8. Walk.** O paywall converte (12% iniciam, 3% compram); a geografia n\u00e3o paga (IN 31% das instala\u00e7\u00f5es, weekly 0,99 vira 0,90/unidade). Numa vers\u00e3o s\u00f3: o kit corrigido (13 crashes = 13 \"sim\" na 7.3.0; 5 ratings em 285 instala\u00e7\u00f5es), o prompt nativo na meta batida (90a5268) e o revamp pendente; depois ASO voltado a US/GB/DE, texto seu. Primeiro passo: decis\u00e3o 12; reancorar o meta.json da iter-03 (live real 30/08) e rodar o checkpoint antes de abrir itera\u00e7\u00e3o nova.\n\n**9. Sueca e Truco.** 285 instala\u00e7\u00f5es/m\u00eas e 624 ratings sem nada \u00e0 venda. Sueca: a 42.0.0 (rejeitada 2\u00d7 por age rating incoerente \u2014 baralho 18+ com `sexualContentOrNudity: NONE`) prende analytics, keywords pt-BR, prints e o prompt de review novo; a sub 3,99 nunca saiu de MISSING_METADATA; o SDK AdMob est\u00e1 linkado e mudo. Truco: serve interstitial (receita desconhecida), a 52 tem a faixa do iPad corrigida e o es-MX de 34 \u2192 89 chars preso. Primeiro passo: decis\u00f5es 13-16 \u2014 corrigir o `ageRatingDeclaration` e re-submeter a 42; re-submeter a 52; v\u00ednculo AdMob\u2194Firebase no console (s\u00f3 voc\u00ea, 15 min): sem ele, \"an\u00fancio ou sub\" nesses dois \u00e9 chute.\n\n**10. Promo text e higiene.** N\u00e3o move ranking, mas \u00e9 a primeira linha vis\u00edvel da p\u00e1gina, edit\u00e1vel na vers\u00e3o live sem review, e est\u00e1 vazio em 13 apps com ~40 mil impress\u00f5es/m\u00eas somadas. Mesma leva: es-MX do Cronos copiado do es-ES; Peptide es-MX/en-GB/en-AU alinhados ao posicionamento GLP-1; Bible es-MX sem o token \"app\". Primeiro passo: decis\u00e3o 19 \u2014 eu escrevo as propostas (3 locales por app, benef\u00edcio + prova), voc\u00ea aprova, PATCH.\n\n## Vazamentos por etapa\n\nRefer\u00eancia do lab: imp\u2192PV Hair 6,3% \u00b7 Cloak/College/Calc+ 4,3% \u00b7 BLW 3,2%; PV\u2192inst BLW 37% \u00b7 Sunrise 30%; pagos por 100 instala\u00e7\u00f5es Calc+ 8,4 \u00b7 BLW 6,4 \u00b7 Cloak 4,6. Piso de privacidade 5/semana: \"0\" \u00e9 \"< 5\", n\u00e3o zero.\n\n**Impress\u00e3o \u2192 page view (aparece e ningu\u00e9m toca)**\n\n| app | impress\u00f5es | PV | imp\u2192PV | causa prov\u00e1vel |\n|---|---:|---:|---:|---|\n| Neon | 5.057 | 0 (<5/sem.) | 0,0% | rankeia baixo em termos gen\u00e9ricos de desenho; as 88 instala\u00e7\u00f5es v\u00eam da base (2.680 updates). Prints code-driven da v26+ substitu\u00edram o vencedor \"Real scenes\" sem teste \u2014 conferir CVR v25 vs v28 no ASC web |\n| iPhotos | 6.373 | 14 | 0,2% | nome/\u00edcone/subt\u00edtulo n\u00e3o convencem no resultado; \u00e9 o vazamento com mais dinheiro atr\u00e1s (ARPI 0,39, 450 ratings) |\n| Bible Pills | 3.469 | 17 | 0,5% | termos de inten\u00e7\u00e3o errada (\"bible\" gen\u00e9rico); 1.2.0 de maio, 1.2.2 rejeitada parada; 32 inst/m\u00eas \u2014 n\u00e3o priorizar |\n| (Meus Gastos) | 7.420 | 82 | 1,1% | mesmo padr\u00e3o em escala maior; 18 ratings BR 4,94 n\u00e3o aparecem na busca US/ES onde rankeia |\n\n**Page view \u2192 instala\u00e7\u00e3o (abriu e n\u00e3o instalou; s\u00f3 \u2265 50 PV)**\n\n| app | PV | inst. via p\u00e1gina | PV\u2192inst | causa prov\u00e1vel |\n| nstala\u00e7\u00f5es e US$ 210: a an\u00e1lise de produto orienta 9% da receita.\n- **O crash do \"sim\" (#85) continua nas vers\u00f5es publicadas.** Hair 1.1.0: crash-free 94,6%, 25 de 461 usu\u00e1rios, `rating_gate_yes` 27 = `app_exception` 27. Walk 7.3.0: 96,2%, 13 de 341, 12 = 13. Peptide 1.1.3: 85,4% (pior do lab), 6 de 40, 5 = 6. Correspond\u00eancia 1:1 nos tr\u00eas; 44 pessoas ca\u00edram no instante de avaliar. As tr\u00eas vers\u00f5es s\u00e3o anteriores ao fix do kit (`0e95ebd`, 08/09); s\u00f3 release resolve. Neon (95,6%, 4 usu\u00e1rios) e Sunrise (98,6%, 3) entram no mesmo pacote quando houver vers\u00e3o.\n- **Sem Crashlytics:** iPhotos (549 ativos, maior base cega), BLW (412), Cronos (64), DevLingo (45), Philos \u2014 1.070 usu\u00e1rios ativos que n\u00e3o conseguem reportar um crash; \"100% crash-free\" ali \u00e9 aus\u00eancia de sensor (#86).\n- **Zero telemetria com tr\u00e1fego real:** Truco (117 inst/m\u00eas, 462 ratings, serve AdMob \u2014 nenhum plist), Philos (plist instrumentado em 06/09 continua `??` no git, loja na 1.0.3 sem Firebase), Bible (`AnalyticsService` sem backend), Foguetinho (serve AdMob sem medir), SafeDoc (6 inst/m\u00eas \u2014 n\u00e3o vale).\n- **Preso ou mudo:** Sueca 1,6% de cobertura (4/274) porque o Firebase s\u00f3 existe na 42.0.0 rejeitada; Meus Gastos 45.3.1 emite `paywall_view`/`onboarding_complete`/`purchase_start` e nenhum `core_action` (a 45.4.0 corrige, no repo); BLW `feature_used` 0 em 412; iPhotos `onboarding_completed` 2 em 212; Sunrise `paywall_shown` 0 em 220 (ou a 1.3.0 n\u00e3o apresenta paywall, ou o hook est\u00e1 desligado \u2014 o build 12 tem que provar).\n- **O buraco do AdMob (#80):** Truco, Neon e Foguetinho servem interstitial (Truco e Foguetinho no mesmo ad unit, ent\u00e3o nem o console separa); Hair, iPhotos e Calc+ carregam o SDK; Sueca linka e n\u00e3o mostra. `ad_impression` est\u00e1 ausente nas 11 properties porque o v\u00ednculo AdMob\u2194Firebase nunca foi feito. Todo \"US$\" deste relat\u00f3rio \u00e9 assinatura; o checkpoint de 02/10 precisa declarar o buraco em vez de somar zero.\n- **Ru\u00eddo de ferramenta:** cobertura > 100% (College 139%, Cronos 148%) \u00e9 `first_open` de quem atualizou de vers\u00e3o sem Firebase \u2014 ler como ~100%; `crash_live = None` em WTMP/College/iPhotos/Cronos/Sueca porque o GA4 reporta build number e a loja marketing version (fix no `firebase_snapshot.py` via `preReleaseVersion`); o `verify-analytics.py` n\u00e3o v\u00ea evento emitido por hook de kit (Cronos); ativa\u00e7\u00e3o do painel com denominador errado (item j\u00e1 no now.json).\n- **PPO e ASO sem leitura:** 0 de 42 experimentos com CVR em disco; 12 vencedores promovidos com \u2264 3 dias de dados (4 com < 1 dia); s\u00f3 Calc+ e Cloak t\u00eam tr\u00e1fego para detectar +15% em 90 dias \u2014 nos outros 18 apps, PPO \u00e9 canal de publica\u00e7\u00e3o, n\u00e3o teste. 12 itera\u00e7\u00f5es de texto com checkpoint vencido (Walk, Philos, BLW, iPhotos e Meus Gastos j\u00e1 passaram do fechamento).\n- **O que instrumentar primeiro, e por qu\u00ea:** (1) v\u00ednculo AdMob\u2194Firebase \u2014 15 min seus, sem build, e \u00e9 o \u00fanico jeito de saber se Sueca/Truco/Neon valem an\u00fancio ou sub; (2) Crashlytics em iPhotos e BLW na carona do pr\u00f3ximo release de cada um (n\u00e3o \u00e9 release magra: \u00e9 um pod a mais no build que j\u00e1 vai sair); (3) re-submeter a Sueca 42 \u2014 o analytics vai junto; (4) `purchase_abandoned` por `reason` nos 5 apps do fim do funil antes de qualquer mudan\u00e7a de pre\u00e7o; (5) `/refresh-lab-data` + `aso-checkpoint` em lote nas 5 itera\u00e7\u00f5es vencidas antes de abrir itera\u00e7\u00e3o nova; (6) os dois fixes do `firebase_snapshot.py` (build\u2192vers\u00e3o, denominador da ativa\u00e7\u00e3o).\n\n## Congelados \u2014 s\u00f3 fatos (sem a\u00e7\u00e3o por decis\u00e3o do Jo\u00e3o, 27/09)\n\n- **Calc+ (Secret Calculator Vault):** US$ 1.409,98/30d (61,1% do lab), flat +3%; 1.4.0 na loja desde 09/10/2025 (build 200); 3.064 instala\u00e7\u00f5es/30d, US$ 0,46/inst \u2014 melhor economia do lab; 240 pagos (208 mensais US$ 4,99 + 32 anuais 19,99) e **0 trials** (\u00fanico app sem intro offer); BR = 68% das instala\u00e7\u00f5es e 57% da receita; 4.825 ratings (US 943, BR 2.801, MX 967, ES 114). P\u00e1gina: 6,9\" em en-US/pt-BR/es-ES/es-MX com a arte de 2022, s\u00f3 o 6,5\" recebeu o vencedor Vault Green (12/08); o PPO \"Ordem de telas\" (28/08\u201326/11) tem no 6,9\" um controle que \u00e9 a arte velha \u2014 mede \"arte nova vs 2022\", n\u00e3o ordem; +15% leg\u00edvel por volta de 05/10. Keywords: pt-BR com ~65 dos 100 chars redundantes, en-US com \"sg\", \"c\" truncado e \"vulte\"; iter-01 pt-BR em draft desde 22/07; promo vazio 12/12. 1.5.0 DEVELOPER_REJECTED desde out/2025 com build 224 VALID e 8 locales novos parados. Sem FirebaseAnalytics; 0 eventos.\n- **Cloak (App Lock):** US$ 686,02/30d (29,7%), flat \u22121%; 9.6 na loja desde 01/06/2026; 3.370 instala\u00e7\u00f5es/30d, US$ 0,20/inst; weekly 4,99 (trial 3 dias): 122 pagos + 92 a US$ 0; yearly 19,99: 19 + 24; monthly 3; total 144 pagos / 116 zero; IAP `applocker.yearly.pro` MISSING_METADATA (morto); CN 499 + VN 333 + IN 212 = 33% das instala\u00e7\u00f5es em pa\u00edses de ARPU baixo; 33 ratings (US 12, \u00fanico com velocidade: 4 \u2192 12 desde 19/08). P\u00e1gina: s\u00f3 6,5\" (Apple escala; sem arte velha), vencedor 5/5; \"Screen Order 21L\" parou em 23/09 sem resultado registrado, nenhum teste desde. Keywords: \"app\" 5\u00d7, \"secre\"/\"cl\" truncados, repete lock/vault/blocker do nome; 21 de 39 locales. 9.7 DEVELOPER_REJECTED desde 04/08 com keywords novas e o Firebase (property com 0 eventos); iter-01 em \"research\" desde 23/05.\n\n## Decis\u00f5es pendentes do Jo\u00e3o\n\nSim/n\u00e3o; recomenda\u00e7\u00e3o primeiro, motivo numa linha.\n\n1. **Sunrise \u2014 repricing antes de submeter (weekly 1,99 / yearly 14,99, trial s\u00f3 no anual)?** Sim. 0,29/2,99 \u00e9 placeholder; Europa \u00e9 60% das instala\u00e7\u00f5es e D1 46% \u00e9 o melhor do lab \u2014 p\u00fablico que paga.\n2. **Sunrise \u2014 enviar a 1.4.0 com as 2 assinaturas pelo web UI?** Sim, depois do item 1. Build 12 VALID j\u00e1 anexado; o 1\u00ba grupo s\u00f3 entra junto da vers\u00e3o.\n3. **Hair \u2014 trocar \"premium = sem an\u00fancio\" por gate de valor (scanner ilimitado, recomenda\u00e7\u00e3o por perfil, evolu\u00e7\u00e3o do di\u00e1rio)?** Sim. 3,5% iniciam compra contra 26% no BLW com o mesmo kit; o benchmark de 19 concorrentes diz que calend\u00e1rio atr\u00e1s de paywall gera 1 estrela.\n4. **Hair \u2014 mover o trial do semanal para o anual?** Sim, como hip\u00f3tese (n pequeno): em todo app com trial as unidades a US$ 0 igualam as pagas; um trial de anual que converte vale 8-10 semanais. Pre\u00e7os ficam intocados, como voc\u00ea pediu em 23/09.\n5. **Hair 1.2.0 \u2014 reordenar prints (main, feature1, feature2; settings/onboarding fora dos slots 2-3) e autorizar o deploy do es-MX + frizz\u2192test?** Sim aos dois. Onboarding na p\u00e1gina viola o RULES; o es-MX \u00e9 o conserto do M\u00e9xico e s\u00f3 texto.\n6. **BLW \u2014 anual 8,99 \u2192 14,99 para novos assinantes?** Sim, medindo 4 semanas. Break-even a \u221240% de convers\u00e3o; nicho pratica 20-40/ano; US 5 dos 11 anuais.\n7. **Trial semanal \u2014 tirar o intro offer do weekly em BLW, Walk e Meus Gastos por 4 semanas (manter no anual)?** Sim. Hip\u00f3tese com n \u2264 30 por app, custo zero, revers\u00edvel.\n8. **Meus Gastos \u2014 parar o PPO v3 (`9570de85`)?** Sim. 542 semanas para +15%; termina em 27/11 sem resposta poss\u00edvel e segura a arte velha no 6,9\" pt-BR.\n9. **Meus Gastos \u2014 publicar a 45.4.0 iOS com a ordem de prints que voc\u00ea preferir + trial do mensal removido?** Sim, quando quiser. Leva o analytics can\u00f4nico (a loja emite nomes legados) e a arte nova no 6,9\"; n\u00e3o \u00e9 release magra.\n10. **iPhotos \u2014 vers\u00e3o nova com \u00edcone, subt nenhuma fonte); motivo oficial das rejei\u00e7\u00f5es (Resolution Center n\u00e3o tem API \u2014 vem por e-mail); lift dos PPOs (s\u00f3 no ASC web, 0 de 42 em disco); assinatura nova vs renova\u00e7\u00e3o (`IAY` junta as duas \u2014 \"pagos por 100 instala\u00e7\u00f5es\" \u00e9 teto, n\u00e3o CVR); pre\u00e7o dos IAPs `NoAds.*` (rota 404; 0 unidades, irrelevante); crash-free da vers\u00e3o live onde o GA4 reporta build number; ARPI infla apps com base velha (iPhotos, Calc+) e subestima os novos (Hair, Sunrise).\n- **n pequeno.** Reten\u00e7\u00e3o com n < 30 (Peptide D14, Meus Gastos D30, DevLingo D30, Cronos D14) e todo n\u00famero de produto de Sueca, Philos, Truco e Bible (n \u2264 4 ou zero) s\u00e3o direcionais. `purchase_success` no GA4 dispara em trial (US$ 0) e possivelmente em restore \u2014 \"sucesso\" sem receita n\u00e3o \u00e9 venda.\n- **Estimativas de US$.** Hip\u00f3teses declaradas na tabela (ARPI \u00d7 instala\u00e7\u00f5es, ou taxa do app de refer\u00eancia aplicada ao volume do alvo); sem crescimento al\u00e9m do escrito e sem receita de an\u00fancio.\n";</script><script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script><script>document.getElementById("md").innerHTML=window.marked?marked.parse(RAW):"<pre>"+RAW.replace(/</g,"&lt;")+"</pre>";</script></div><script>(function(){try{var k="lh.scroll:"+location.pathname;var v=sessionStorage.getItem(k);if(v!==null){sessionStorage.removeItem(k);window.scrollTo(0,parseInt(v,10)||0);}document.addEventListener("submit",function(e){var f=e.target;if(f&&f.method&&f.method.toLowerCase()==="post"){sessionStorage.setItem(k,String(window.scrollY));}},true);}catch(e){}})();</script></body></html>
