<body><div class="wrap"><p class="sub" style="font-size:12px;margin:0 0 14px">Exportado em 2026-10-01 11:05 · fonte: Lab Hub local</p><p class="sub"><a href="../index.html">← hub</a> · <code>Apps/important/Calculator-/aso-pipeline/iterations/2026-07-22_iter-01-text-pt-BR-keywords/research/keyword_candidates.md</code></p><div id="md"></div><script>const RAW="# Calc+ \u2014 ASO iter-01 (pt-BR, keywords) \u2014 candidatos\n\n**Data:** 2026-07-22\n**Source:** Astro MCP (99 keywords trackeados no store \ud83c\udde7\ud83c\uddf7 br, pop/diff/currentRanking reais)\n**App:** Calculadora Secreta Cofre Foto (1479873340) \u2014 **SCALE**, ~225 downloads/dia (60% BR), receita ~US$1063/m\u00eas, tend\u00eancia flat\n**Filtro decis\u00e3o (quadrante):** diff \u2264 20 gold \u00b7 diff 21\u201340 + pop \u2265 10 sweet \u00b7 diff 41\u201352 + pop \u2265 25 ou rank hist\u00f3rico = apostas moderadas \u00b7 diff > 60 s\u00f3 se pop \u2265 40\n\n---\n\n## Peso ASO por campo\n\n| Campo | Peso | Chars | Estrat\u00e9gia nesta iter |\n|-------|------|-------|------------------------|\n| **Name** | 7\u00d7 | 30 | INTOCADO \u2014 \"Calculadora Secreta Cofre Foto\" j\u00e1 rankeia top-5 em `calculadora secreta` (r5), `cofre foto` (r4) |\n| **Subtitle** | 3\u00d7 | 30 | INTOCADO \u2014 \"Esconder fotos e pasta secreta\" ancora `pasta secreta` (r2), `esconder fotos` (r3) |\n| **Keywords** | 1\u00d7 | 100 | **\u00daNICO campo mexido** (sequencial \u2014 app estabelecido, attribution > velocity) |\n\n**Princ\u00edpio:** Apple indexa cada token na primeira ocorr\u00eancia (peso maior). Keywords N\u00c3O repete nada de name/subtitle. Ocupados por name+subtitle: `calculadora, secreta, cofre, foto, esconder, fotos, pasta`.\n\n**Caveat Astro:** `popularity = 5` \u00e9 o **piso** (Astro n\u00e3o detecta volume confi\u00e1vel abaixo) \u2014 tratar como incerteza, n\u00e3o \"baixo volume real\".\n\n---\n\n## \ud83d\udcd0 Diff \u2014 Keywords field antes/depois\n\n**Legenda:** <span style=\"color:#dc3545\">\ud83d\udd34 saiu</span> \u00b7 <span style=\"color:#28a745\">\ud83d\udfe2 entrou</span> \u00b7 preto = mant\u00e9m\n\n**ANTES (100/100):**\n<code><span style=\"color:#dc3545\">foto</span>, senha, ocultar, <span style=\"color:#dc3545\">cofre</span>, <span style=\"color:#dc3545\">esconder</span>, <span style=\"color:#dc3545\">guardar</span>, keep, safe, <span style=\"color:#dc3545\">calculadora</span>, album, privacy, vault, <span style=\"color:#dc3545\">photo</span>, calculator</code>\n\n**DEPOIS (95/100):**\n<code><span style=\"color:#28a745\">hide apps</span>, <span style=\"color:#28a745\">galeria</span>, <span style=\"color:#28a745\">keepsafe</span>, senha, vault, privacy, album, calculator, keep, safe, ocultar, <span style=\"color:#28a745\">hide</span>, <span style=\"color:#28a745\">app lock</span></code>\n\n---\n\n## \ud83d\udd11 KEYWORDS FIELD \u2014 decis\u00e3o por termo\n\n### \ud83d\udd34 SAIU (dup com name/subtitle OU dead weight)\n\n| Termo | Pop | Diff | Rank | Por qu\u00ea sai |\n|-------|-----|------|------|-------------|\n| `foto` | 65 | 83 | 69 | **Dup com name** (\"Foto\") \u2014 Apple j\u00e1 indexa via name (7\u00d7) |\n| `cofre` | 5 | 52 | 9 | **Dup com name** \u2014 j\u00e1 rankeia r9 pelo name |\n| `esconder` | 5 | 56 | 23 | **Dup com subtitle** |\n| `calculadora` | 72 | 55 | 23 | **Dup com name** |\n| `guardar` | 5 | 49 | **1000** | \u274c Dead \u2014 r1000, pop no piso |\n| `photo` | 57 | 80 | **1000** | \u274c Dead \u2014 r1000, diff 80; `galeria` cobre o intent |\n\n### \ud83d\udfe2 ENTROU (sweet spots dos dados reais)\n\n| Termo | Pop | Diff | Rank | Por qu\u00ea entra |\n|-------|-----|------|------|---------------|\n| `hide apps` | 35 | **21** | 42 | \ud83e\udd47 **GOLD** \u2014 menor diff do pool. App TEM a feature (tab Apps); `esconder apps` j\u00e1 r5 |\n| `galeria` | **56** | 54 | 56 | Pop alto, r56; cluster (galeria fotos r30, galeria de fotos r38) mostra tra\u00e7\u00e3o |\n| `keepsafe` | **60** | 60 | \u2014 | Brand competitor
