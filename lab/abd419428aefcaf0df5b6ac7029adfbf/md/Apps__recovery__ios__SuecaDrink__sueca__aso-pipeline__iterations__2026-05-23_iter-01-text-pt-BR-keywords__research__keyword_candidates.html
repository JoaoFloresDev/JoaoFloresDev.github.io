<style>

.hcol .row{flex-direction:column;align-items:flex-start;gap:4px}.hcol .row b{white-space:normal}.hcol .row span{width:100%}.hcol .row em{display:none}.hcol .row.done b{font-size:12px}.hrow{display:flex;gap:20px;overflow-x:auto;align-items:flex-start;padding:16px 28px 12px;margin:18px 0 26px;background:rgba(125,125,125,.07);border:1px solid var(--bd);border-radius:16px;scroll-padding:0 28px}.hcol{flex:0 0 340px;min-width:340px}.hcol:last-child{margin-right:28px}.hcol h2{margin-top:0}.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:0 20px}.cols2{display:grid;grid-template-columns:1fr 1fr;gap:0 20px;align-items:start}@media(max-width:900px){.cols2{grid-template-columns:1fr}}h3.team{margin:18px 0 8px;font-size:15px;font-weight:600}h3.team .chain{display:block;color:var(--mut);font-weight:400;font-size:12.5px;margin-top:2px}.card .step{display:inline-block;min-width:18px;height:18px;line-height:18px;text-align:center;border-radius:9px;background:var(--bd);color:var(--mut);font-size:11px;font-weight:600;margin-right:6px}.grid4{display:grid;gap:12px;grid-template-columns:repeat(4,1fr)}@media(max-width:1100px){.grid4{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.grid4{grid-template-columns:1fr}}

.fcard{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:13px 15px}

/* ---------- camada de acabamento (01/10/2026) ----------
   Tipografia com duas vozes (display para títulos e números, texto para leitura),
   neutros com viés do azul da marca em vez de cinza puro, e profundidade por
   sombra em vez de só borda. Nada aqui renomeia classe: é uma camada por cima. */
:root{
  --f-disp:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --f-text:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --bg:#f3f5f9; --card:#ffffff; --tx:#10131a; --mut:#5a6377; --acc:#1552d8;
  --bd:#dde2ea; --bd-soft:#e8ecf3; --ok:#0a8f58; --down:#d02f2f; --warn:#b45309;
  --sh:0 1px 2px rgba(16,19,26,.05),0 2px 8px rgba(16,19,26,.04);
  --sh-up:0 2px 6px rgba(16,19,26,.07),0 10px 24px rgba(16,19,26,.07);
  --rad:14px;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#0b0d12; --card:#161a22; --tx:#eef1f7; --mut:#9aa5b8; --acc:#7aa6ff;
  --bd:#272d39; --bd-soft:#1f242e; --ok:#43d08d; --down:#ff7070; --warn:#e5a645;
  --sh:0 1px 2px rgba(0,0,0,.4); --sh-up:0 6px 22px rgba(0,0,0,.5);
}}
body{font-family:var(--f-text);font-size:14.5px;line-height:1.6;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1{font-family:var(--f-disp);font-size:27px;font-weight:800;letter-spacing:-.02em;
  text-wrap:balance;margin:0 0 2px}
h1 .mark{display:inline-block;width:28px;height:28px;vertical-align:-5px;margin-right:11px;
  background-size:contain;background-repeat:no-repeat;background-position:center}
h2{font-family:var(--f-disp);font-size:12px;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;color:var(--mut);border-top:1px solid var(--bd-soft);
  padding-top:22px;margin:32px 0 14px}
h3{font-family:var(--f-disp);letter-spacing:-.01em}
.sub{font-size:13px;color:var(--mut)}
code,.mono{font-family:var(--f-mono);font-size:12.5px}
.card,table.t,a.tile,.row,.fcard,#md{box-shadow:var(--sh);border-color:var(--bd-soft)}
.card,a.tile,.row,.fcard{border-radius:var(--rad);
  transition:box-shadow .16s ease,border-color .16s ease,transform .16s ease}
a.tile:hover,a.row:hover,.fcard:hover{box-shadow:var(--sh-up);border-color:var(--bd);
  transform:translateY(-1px)}
/* big numbers: the first thing anyone reads on the page */
.tiles{gap:12px;margin:18px 0 4px;padding-bottom:10px}
a.tile{padding:13px 17px;min-width:148px}
.tile .tl{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
  color:var(--mut)}
.tile .tv{font-family:var(--f-disp);font-size:25px;font-weight:800;letter-spacing:-.025em;
  margin-top:3px}
.tile .ts{font-size:11.5px;color:var(--mut)}
/* tables read as data, not as prose */
table.t{border-radius:var(--rad);font-variant-numeric:tabular-nums}
table.t th{font-family:var(--f-disp);font-size:11px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;background:var(--bd-soft);border-bottom:1px solid var(--bd)}
table.t td{padding:9px 13px;border-bottom:1px solid var(--bd-soft)}
table.t tbody tr:hover td,table.t tr:hover td{background:rgba(125,140,170,.06)}
.twrap{border-radius:var(--rad)}
/* buttons */
.btn{font-family:var(--f-disp);font-weight:600;font-size:13.5px;padding:9px 18px;
  border-radius:999px;box-shadow:var(--sh);transition:all .16s ease}
.btn:hover{border-color:var(--acc);box-shadow:var(--sh-up);transform:translateY(-1px)}
.pill,.st{font-family:var(--f-disp);font-weight:600;font-size:11.5px;letter-spacing:.02em}
/* status colours carry meaning, so keep them out of the accent */
.st.run,.st.appr{background:rgba(10,143,88,.14);color:var(--ok)}
.st.crit{background:rgba(208,47,47,.14);color:var(--down)}
.st.rev,.st.draft{background:rgba(180,83,9,.14);color:var(--warn)}
/* the lanes strip and any scroller get a thin, rounded bar */
.tiles,.hrow,.twrap{scrollbar-width:thin;scrollbar-color:var(--bd) transparent}
.tiles::-webkit-scrollbar,.hrow::-webkit-scrollbar,.twrap::-webkit-scrollbar{height:9px}
.tiles::-webkit-scrollbar-track,.hrow::-webkit-scrollbar-track,
.twrap::-webkit-scrollbar-track{background:transparent}
.tiles::-webkit-scrollbar-thumb,.hrow::-webkit-scrollbar-thumb,
.twrap::-webkit-scrollbar-thumb{background:var(--bd);border-radius:999px;
  border:3px solid transparent;background-clip:content-box}
.tiles::-webkit-scrollbar-thumb:hover,.hrow::-webkit-scrollbar-thumb:hover,
.twrap::-webkit-scrollbar-thumb:hover{background:var(--mut);background-clip:content-box}
.hrow{background:transparent;border:0;padding:0;border-radius:0}
.hcol{flex:0 0 clamp(280px,26vw,360px);min-width:0}
a:focus-visible,button:focus-visible,.btn:focus-visible{outline:2px solid var(--acc);
  outline-offset:2px;border-radius:8px}
.dirlist,.prlist{margin:10px 0 0;padding-left:18px;list-style:none}
.dirlist>li,.prlist>li{position:relative;margin:0 0 7px;font-size:13.5px;line-height:1.5;
  color:var(--tx)}
.prlist>li{color:var(--mut);font-size:13px;margin-bottom:5px}
.dirlist>li::before,.prlist>li::before{content:"";position:absolute;left:-14px;top:.62em;
  width:5px;height:5px;border-radius:50%;background:var(--acc);opacity:.75}
.prlist>li::before{background:var(--mut);opacity:.5}
.dirp{display:none}
.dapps{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));
  margin:14px 0 4px;align-items:start}
.dapp{padding:14px 16px}
.dah{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.dah b{font-family:var(--f-disp);font-size:14.5px;font-weight:700}
.drank{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;
  border-radius:6px;background:var(--acc);color:#fff;font-size:11.5px;font-weight:700;flex:none}
.st.d-dobrar{background:rgba(10,143,88,.16);color:var(--ok)}
.st.d-consertar{background:rgba(180,83,9,.16);color:var(--warn)}
.st.d-manter{background:rgba(125,140,170,.16);color:var(--mut)}
.st.d-congelar{background:rgba(125,140,170,.12);color:var(--mut)}
.dapp .prlist{margin-top:6px}
.dcall{color:var(--tx)!important;font-weight:600}
.fcard[id]{scroll-margin-top:18px}
.fdet{margin-top:10px;border-top:1px solid var(--bd-soft);padding-top:9px}
.fdet>summary{cursor:pointer;list-style:none;font-family:var(--f-disp);font-size:11.5px;
  font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);
  display:flex;align-items:center;gap:7px}
.fdet>summary::-webkit-details-marker{display:none}
.fdet>summary::before{content:"›";font-size:15px;transition:transform .15s}
.fdet[open]>summary::before{transform:rotate(90deg)}
.fdet>summary:hover{color:var(--acc)}
.fdet table.t{font-size:12.5px}
.fdet table.t td,.fdet table.t th{padding:6px 10px}
.fgrid.one{grid-template-columns:1fr!important}
.fcols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;
  align-items:start}
@media(max-width:820px){.fcols{grid-template-columns:1fr;gap:12px}}
.fcol{min-width:0}
.fcol>.fnds{margin-top:0}
.fdet .ascgrid{grid-template-columns:repeat(auto-fit,minmax(118px,1fr))}
.fdetcols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;
  align-items:start}
@media(max-width:820px){.fdetcols{grid-template-columns:1fr}}
.thin{font-size:10.5px;color:var(--mut);background:var(--bd-soft);border-radius:999px;
  padding:1px 7px;cursor:help;white-space:nowrap}
.thinnote{font-size:11.5px;color:var(--mut);background:var(--bd-soft);border-radius:9px;
  padding:7px 10px;margin:0 0 10px}
.sbx{font-size:12px;color:var(--warn);background:rgba(180,83,9,.12);border-radius:999px;
  padding:1px 8px;cursor:help;white-space:nowrap}
.sbxnote{font-size:11.5px;color:var(--warn);background:rgba(180,83,9,.10);
  border:1px solid rgba(180,83,9,.25);border-radius:9px;padding:7px 10px;margin:0 0 10px}
.actv{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 9px;margin:0 0 10px;
  padding:8px 11px;border-radius:10px;background:var(--bd-soft)}
.actvt{font-family:var(--f-disp);font-size:10px;font-weight:800;letter-spacing:.09em;

<body><div class="wrap"><p class="sub" style="font-size:12px;margin:0 0 14px">Exportado em 2026-10-01 16:07 · fonte: Lab Hub local</p><p class="sub"><a href="../index.html">← hub</a> · <code>Apps/recovery/ios/SuecaDrink/sueca/aso-pipeline/iterations/2026-05-23_iter-01-text-pt-BR-keywords/research/keyword_candidates.md</code></p><div id="md"></div><script>const RAW="# Keyword Candidates \u2014 pt-BR \u2014 iter-01 (2026-05-23)\n\n**Data**: 2026-05-23\n**Source**: Astro export ([data.csv](data.csv) = 190 termos)\n**Filtro decis\u00e3o (quadrante)**:\n- diff \u2264 20 (any pop) \u2014 **gold** \u2705\n- diff 21-40 + pop \u2265 10 \u2014 **sweet spot** \u2705\n- diff 41-60 + pop \u2265 25 ou rank hist\u00f3rico \u2014 **apostas moderadas** \u26a0\ufe0f\n- diff > 60 \u2014 s\u00f3 com pop \u2265 40, NO NAME \u274c (n\u00e3o tocamos name nesta iter)\n\n## \ud83c\udfaf Positioning filter (decidido com dev 2026-05-23)\n\nApp = **drinking game for groups at parties/bars**. N\u00c3O usar clusters off-positioning:\n\n| Cluster rejeitado | Raz\u00e3o                                                                    |\n|-------------------|--------------------------------------------------------------------------|\n| \u274c `casal`/`+18`  | Posiciona app como couple/intimate \u2014 n\u00e3o \u00e9 o caso. App \u00e9 group/friends. |\n| \u274c `adult` suffix | Apenas marca como \"spicy version\" \u2192 confunde positioning + risco Apple age rating. |\n| \u274c `modo`/`fases`/`n\u00edveis` | Gen\u00e9ricos demais \u2014 descritores mechanic sem search intent espec\u00edfico. |\n| \u274c `churrasco`/`festa de casa` | Off-topic \u2014 comida BR gen\u00e9rica, n\u00e3o drinking game. |\n| \u274c `bingo`/`truco` | Outros jogos n\u00e3o relacionados \u2014 induz install errado, hurts retention. |\n\n**Clusters mantidos (on-topic):**\n- \u2705 Drinking game names: kings cup, brincadeira de beber, drink game, drink games\n- \u2705 Game variants: eu nunca, verdade desafio, consequ\u00eancia (verdade ou consequ\u00eancia), eu nunca x\n- \u2705 Group/friends: amigos, group games\n- \u2705 Party/bar occasion: festa, bar, balada, noite\n- \u2705 Brand defense: eu nunca x (competitor brand interception)\n\n## \u2696\ufe0f Tabela peso ASO (Apple)\n\n| Campo               | Peso  | Char budget | Estrat\u00e9gia                                                                              |\n|---------------------|-------|-------------|-----------------------------------------------------------------------------------------|\n| **name**            | 7\u00d7    | 30          | **N\u00c3O MEXER** \u2014 `Sueca Drink \u2022 Eu nunca desafio` j\u00e1 cobre eu/nunca/desafio/sueca/drink. |\n| **subtitle**        | 3\u00d7    | 30          | **Re-escrever** \u2014 `Jogo de bebida entre amigos` \u2192 `Jogo, bebida amigos, festa bar`. Preserva triumvirate compositional (jogo/bebida/amigos), adiciona festa+bar (cluster occasion on-topic). |\n| **keywords field**  | 1\u00d7    | 100         | **Re-escrever** \u2014 8 termos novos/protegidos, 0% noise off-positioning. |\n| **description**     | ~0\u00d7   | 4000        | N\u00e3o mexer essa iter. |\n| **promotional_text**| 0\u00d7    | 170         | N\u00e3o mexer essa iter. |\n\n### Princ\u00edpio\nApple indexa cada token UMA VEZ na primeira ocorr\u00eancia. N\u00c3O duplicar entre name \u2194 subtitle \u2194 keywords field.\n\n### Caveat Astro pop=5\nAstro reporta `5` como piso quando volume real \u00e9 indetect\u00e1vel. N\u00c3O confiar em pop=5 como signal absoluto \u2014 usar como moat em slots sobrando.\n\n---\n\n## \ud83d\udcd0 Diff visual \u2014 antes/depois\n\n> Legenda:\n> - <span style=\"color:#dc3545\">\ud83d\udd34 Vermelho</span> = saiu completamente\n> - <span style=\"color:#28a745\">\ud83d\udfe2 Verde</span> = entrou totalmente novo\n> - <span style=\"color:#3b82f6\">\ud83d\udd35 Azul claro</span> = mudou pra peso MAIOR (keywords\u2192subtitle)\n> - <span style=\"color:#1e3a8a\">\ud83d\udd35 Azul escuro</span> = mudou pra peso MENOR\n> - Preto/normal = mant\u00e9m\n\n### NAME (30/30 \u2014 **SEM mudan\u00e7a**)\n\n| Antes (live)                       | Depois (proposto)                |\n|------------------------------------|----------------------------------|\n| Sueca Drink \u2022 Eu nunca desafio     | Sueca Drink \u2022 Eu nunca desafio   |\n\n### SUBTITLE (28/30 \u2192 30/30)\n\n| Antes (live)                                                                                                                                                               | Depois (proposto)                                                                                       |\n|----------------------------------------------------------------------------------------------------------------------------------------------------------------------------|---------------------------------------------------------------------------------------------------------|\n| Jogo <span style=\"color:#dc3545\">de</span> bebida <span style=\"color:#dc3545\">entre</span> amigos | Jogo, bebida amigos, <span style=\"color:#3b82f6\">festa</span> <span style=\"color:#28a745\">bar</span> |\n\n**Tokens preservados**: `jogo`, `bebida`, `amigos` (compositional triumvirate). **Tokens novos**: `festa` (move kw 1\u00d7 \u2192 subtitle 3\u00d7), `bar` (reborn from removed kw \u2192 subtitle 3\u00d7).\n\n### KEYWORDS FIELD (100/100 \u2192 100/100)\n\n| Antes (live) \u2014 11 termos                                                                                                                                                                                                                                                                                                                                                                                                                              | Depois (proposto) \u2014 8 termos                                                                                                                                                                                                                                                                                                                                          |\n|-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|--------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|\n| <span style=\"color:#dc3545\">eu nunca</span>, <span style=\"color:#1e3a8a\">festa</span>, <span style=\"color:#dc3545\">jogo de bebida</span>, verdade desafio, <span style=\"color:#1e3a8a\">bar</span>, <span style=\"color:#dc3545\">bebida</span>, <span style=\"color:#dc3545\">beber</span>, <span style=\"color:#dc3545\">amigo</span>, <span style=\"color:#dc3545\">jogo da bebida</span>, drink game, <span style=\"color:#dc3545\">sueca</span> | <span style=\"color:#28a745\">group games</span>, <span style=\"color:#28a745\">kings cup</span>, <span style=\"color:#28a745\">brincadeira de beber</span>, drink game, <span style=\"color:#28a745\">eu nunca x</span>, verdade desafio, <span style=\"color:#28a745\">consequ\u00eancia</span>, <span style=\"color:#28a745\">balada</span> |\n\n---\n\n## \ud83c\udff7 NAME \u2014 `Sueca Drink \u2022 Eu nunca desafio` (30/30, peso 7\u00d7)\n\n**Decis\u00e3o: SEM mudan\u00e7a** \u2014 ri[redigido].\n\n| Palavra   | Cluster      | Astro                          | Decis\u00e3o |\n|-----------|--------------|--------------------------------|---------|\n| Sueca     | brand        | pop=8, diff=43, rank=4         | \u2705 keep |\n| Drink     | drinking     | pop=31, diff=51, rank=15       | \u2705 keep |\n| Eu/Nunca  | head_action  | (comp\u00f5e `eu nunca` pop=54)    | \u2705 keep |\n| Desafio   | head_action  | pop=5, diff=65, rank=93        | \u2705 keep |\n\n---\n\n## \ud83c\udff7 SUBTITLE \u2014 `Jogo de bebida entre amigos` \u2192 `Jogo, bebida amigos, festa bar` (30/30, peso 3\u00d7)\n\n### SAI\n| Palavra | Astro | Por qu\u00ea |\n|---------|-------|---------|\n| `de`    | stopword | Apple ignora |\n| `entre` | stopword | Apple ignora |\n\n### ENTRA\n| Palavra | Astro | Por qu\u00ea |\n|---------|-------|---------|\n| `festa` | pop=5 piso, diff=60, rank=47 (em kw 1\u00d7 atual) | \ud83d\udd35 **MOVE de kw 1\u00d7 \u2192 subtitle 3\u00d7**. Pop=5 piso mas RANKING 47 prova volume real. Peso 3\u00d7 pode empurrar pra top-20. Custo zero (swap entre campos). On-topic (party occasion). |\n| `bar`   | pop=26, diff=46, rank=168 (em kw 1\u00d7 atual) | \ud83d\udd04 **REBORN no subtitle 3\u00d7** (era em kw 1\u00d7 rank 168). Pop=26 \u00e9 signal real. Peso 3\u00d7 pode pushar pra top-50 ou melhor. On-topic (drinking-game venue). |\n\n### MANT\u00c9M (compositional preservation)\n| Palavra | Astro | Por qu\u00ea |\n|---------|-------|---------|\n| `jogo` | pop=76 diff=80 solo r=1000 | \u2705 CR\u00cdTICO compositional. Comp\u00f5e `jogo de bebida entre amigos` r5, `eu nunca jogo` r7, `sueca jogo` r5, `jogo de festa` r44. |\n| `bebida` | pop=44 diff=47 solo r=1000 | \u2705 CR\u00cdTICO compositional. Comp\u00f5e `bebida entre amigos` r1, `eu nunca bebida` r3, `desafio bebida` r2, `bebida amigos` r12. |\n| `amigos` | pop=50 diff=60 solo r=1000 | \u2705 CR\u00cdTICO compositional. Comp\u00f5e ~5 top-30 ranks. |\n\n---\n\n## \ud83d\udd11 KEYWORDS FIELD \u2014 atual 100/100 \u2192 proposto 100/100\n\n### SAI (7 termos, libera 64 chars)\n\n| Termo            | Astro                          | Motivo da sa\u00edda                                                                                                                                  |\n|------------------|--------------------------------|--------------------------------------------------------------------------------------------------------------------------------------------------|\n| `eu nunca`       | pop=54, diff=40, rank=23       | \ud83d\udd34 **DUP com NAME** \u2014 Apple j\u00e1 indexa via name 7\u00d7. Libera 8 chars. |\n| `festa`          | pop=5 piso, diff=60, rank=47   | \ud83d\udd35 **Move pra subtitle 3\u00d7** \u2014 n\u00e3o some, ganha peso. |\n| `jogo de bebida` | pop=46, diff=48, rank=83       | \ud83d\udd34 **DUP com subtitle** (subtitle agora tem `jogo` E `bebida`). Apple comp\u00f5e. Libera 14 chars. |\n| `bar`            | pop=26, diff=46, rank=168      | \ud83d\udd35 **Move pra subtitle 3\u00d7** \u2014 peso \u2191, pop=26 real signal. |\n| `bebida`         | pop=44, diff=47, rank=1000     | \ud83d\udd34 **DUP com subtitle**. Libera 7 chars. |\n| `beber`          | pop=22, diff=55, rank=1000     | \ud83d\udd34 **Rank 1000 solo, diff 55 alto**. Compositional `beber amigos` r12 preservado via subtitle `amigos`. Libera 6 chars. |\n| `amigo`          | pop=50, diff=54, rank=80       | \ud83d\udd34 **DUP com subtitle `amigos`** (morphology). Libera 6 chars. |\n| `jogo da bebida` | pop=25, diff=17, rank=37       | \ud83d\udd34 **DUP variante de `jogo de bebida`** \u2014 Apple tokeniza. Libera 15 chars. |\n| `sueca`          | pop=8, diff=43, rank=4         | \ud83d\udd34 **DUP com NAME**. Libera 6 chars. |\n\n### ENTRA (6 termos novos + 0 moats gen\u00e9ricos)\n\n| Termo                     | Astro                          | Por qu\u00ea (on-topic: drinking-game-com-amigos-festa)                                                                                                          |\n|---------------------------|--------------------------------|--------------------------------------------------------------------------------------------------------------------------------------------------------------|\n| `group games`             | pop=41, **diff=23**, rank=158  | \ud83e\udd47 **GOLD: high-pop + sweet diff**. Pop 41 + diff 23 = sweet spot premium. Rank 158 hoje sugere Apple J\u00c1 nos considera marginalmente \u2014 kw 1\u00d7 + sweet diff = expected top-30 em 30 dias. Direct fit (app \u00c9 group game). |\n| `kings cup`               | pop=34, diff=44, rank=1000     | \ud83e\udd48 **DRINKING GAME NAME** \u2014 Kings Cup \u00e9 jogo cl\u00e1ssico de bebida com cartas. Pop 34 \u00e9 signal real. Diff 44 \u00e9 moderado mas on-topic justifica. Rank 1000 hoje = upside expressivo. Cost 9 chars. |\n| `brincadeira de beber`    | pop=16, **diff=23**, rank=1000 | \ud83e\udd48 **SWEET BR direct** \u2014 \"drinking play\" literal. Pop 16 + diff 23 = sweet spot. Sem competitor cobertura \u2014 moat com signal real. Cost 20 chars. |\n| `consequ\u00eancia`            | pop=5 piso, diff=19, rank=1000 | \ud83e\udd49 **Head term BR** \u2014 Verdade ou Consequ\u00eancia? Festa (14k ratings, top do nicho). Diff 19 sweet. On-topic (game type variante). Cost 12 chars. |\n| `balada`                  | pop=5 piso, diff=21, rank=1000 | \ud83e\udd49 **Occasion BR** \u2014 clubbing/party. Diff 21 sweet. On-topic (drinking occasion). Cost 6 chars. |\n| `eu nunca x`              | pop=5, diff=42, rank=11        | \ud83d\udee1 **Competitor brand interception** \u2014 Eu Nunca X (GARJ, 2k ratings). Rank 11 hoje prova Apple respeita verbatim. Cost 10 chars. Defensive moat. |\n\n### MANT\u00c9M (rank-protect)\n\n| Termo             | Astro                       | Por qu\u00ea manter                                                          |\n|-------------------|-----------------------------|-------------------------------------------------------------------------|\n| `verdade desafio` | pop=23, diff=45, rank=36    | \u2705 Rank 36 + pop 23 = real traffic. Cortar = -36 rank. Cost 15 chars.   |\n| `drink game`      | pop=6, diff=43, rank=11     | \u2705 Rank 11 trabalhando. Compositional via name `drink` fr\u00e1gil sem verbatim. Cost 10 chars. |\n\n---\n\n## \ud83d\udccb Ordena\u00e7\u00e3o dos keywords (front-loading)\n\n**Princ\u00edpio**: Apple pesa tokens no IN\u00cdCIO do kw field MAIS que no fim.\n\n| Posi\u00e7\u00e3o | Termo                       | Pop  | Diff | Rank atual | Bucket                          |\n|---------|-----------------------------|------|------|------------|----------------------------------|\n| 1       | `group games`               | 41   | 23   | 158        | \ud83e\udd47 high-pop gold                 |\n| 2       | `kings cup`                 | 34   | 44   | 1000       | \ud83e\udd47 high-pop on-topic (drink game name) |\n| 3       | `brincadeira de beber`      | 16   | 23   | 1000       | \ud83e\udd48 sweet BR direct               |\n| 4       | `drink game`                | 6    | 43   | 11         | \ud83d\udee1 rank-protect                  |\n| 5       | `eu nunca x`                | 5    | 42   | 11         | \ud83d\udee1 rank-protect (competitor)     |\n| 6       | `verdade desafio`           | 23   | 45   | 36         | \ud83d\udee1 rank-protect (moderate-pop)   |\n| 7       | `consequ\u00eancia`              | 5    | 19   | 1000       | \ud83e\udd49 head-term moat (verdade ou consequ\u00eancia) |\n| 8       | `balada`                    | 5    | 21   | 1000       | \ud83e\udd49 occasion moat                 |\n\n**Rationale**:\n- Posi\u00e7\u00f5es 1-3 = high-pop/sweet quadrants \u2014 apostas com melhor ROI\n- Posi\u00e7\u00f5es 4-6 = rank-protect (preserve existing wins)\n- Posi\u00e7\u00f5es 7-8 = moats sweet-diff (speculation com upside)\n\nFesta moved to subtitle (peso \u2191 swap) \u2014 n\u00e3o est\u00e1 no kw mas \u00e9 peso 3\u00d7 via subtitle.\n\n---\n\n## \ud83d\udcc4 Resultado final\n\n```\nNAME (30/30 \u2014 SEM mudan\u00e7a):\nSueca Drink \u2022 Eu nunca desafio\n\nSUBTITLE (30/30):\nJogo, bebida amigos, festa bar\n\nKEYWORDS (100/100):\ngroup games,kings cup,brincadeira de beber,drink game,eu nunca x,verdade desafio,consequ\u00eancia,balada\n```\n\n---\n\n## \ud83c\udfaf Cobertura por cluster (peso composto)\n\n| Cluster        | Tokens NAME (7\u00d7)            | Tokens SUBTITLE (3\u00d7)            | Tokens KEYWORDS (1\u00d7)                                              | Peso total |\n|----------------|-----------------------------|----------------------------------|-------------------------------------------------------------------|-------------|\n| **head_action**| eu, nunca, desafio (3\u00d77=21) | \u2014                                | verdade desafio, eu nunca x (2)                                   | **23**     |\n| **game_type**  | drink (7)                   | jogo (3)                         | group games, kings cup, brincadeira de beber, drink game (4)      | **14**     |\n| **audience**   | \u2014                           | amigos (3)                       | \u2014                                                                  | **3**      |\n| **occasion**   | \u2014                           | festa, bar (2\u00d73=6)               | balada (1)                                                         | **7**      |\n| **drinking**   | drink (7)                   | bebida (3)                       | brincadeira de beber, drink game (2)                              | **12**     |\n| **brand**      | sueca (7)                   | \u2014                                | eu nunca x (defensive, 1)                                          | **8**      |\n\n**Sem clusters off-positioning** \u2014 0 weight em adult/casal/gen\u00e9rico.\n\n---\n\n## \ud83d\udee1 Termos protegidos (verificar p\u00f3s-deploy Day 7)\n\n| Termo                       | Rank baseline | Source field atual | Source field proposto | Risco mudan\u00e7a |
