<style>

.hcol .row{flex-direction:column;align-items:flex-start;gap:4px}.hcol .row b{white-space:normal}.hcol .row span{width:100%}.hcol .row em{display:none}.hcol .row.done b{font-size:12px}.hrow{display:flex;gap:20px;overflow-x:auto;align-items:flex-start;padding:16px 28px 12px;margin:18px 0 26px;background:rgba(125,125,125,.07);border:1px solid var(--bd);border-radius:16px;scroll-padding:0 28px}.hcol{flex:0 0 340px;min-width:340px}.hcol:last-child{margin-right:28px}.hcol h2{margin-top:0}.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:0 20px}.cols2{display:grid;grid-template-columns:1fr 1fr;gap:0 20px;align-items:start}@media(max-width:900px){.cols2{grid-template-columns:1fr}}h3.team{margin:18px 0 8px;font-size:15px;font-weight:600}h3.team .chain{display:block;color:var(--mut);font-weight:400;font-size:12.5px;margin-top:2px}.card .step{display:inline-block;min-width:18px;height:18px;line-height:18px;text-align:center;border-radius:9px;background:var(--bd);color:var(--mut);font-size:11px;font-weight:600;margin-right:6px}.grid4{display:grid;gap:12px;grid-template-columns:repeat(4,1fr)}@media(max-width:1100px){.grid4{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.grid4{grid-template-columns:1fr}}

/* ---------- camada de acabamento (01/10/2026) ----------
   Tipografia com duas vozes (display para títulos e números, texto para leitura),
   neutros com viés do azul da marca em vez de cinza puro, e profundidade por
   sombra em vez de só borda. Nada aqui renomeia classe: é uma camada por cima. */
:root{
  --f-disp:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --f-text:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --bg:#f3f5f9; --card:#ffffff; --tx:#10131a; --mut:#5a6377; --acc:#1552d8;
  --bd:#dde2ea; --bd-soft:#e8ecf3; --ok:#0a8f58; --down:#d02f2f; --warn:#b45309;
  --sh:0 1px 2px rgba(16,19,26,.05),0 2px 8px rgba(16,19,26,.04);
  --sh-up:0 2px 6px rgba(16,19,26,.07),0 10px 24px rgba(16,19,26,.07);
  --rad:14px;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#0b0d12; --card:#161a22; --tx:#eef1f7; --mut:#9aa5b8; --acc:#7aa6ff;
  --bd:#272d39; --bd-soft:#1f242e; --ok:#43d08d; --down:#ff7070; --warn:#e5a645;
  --sh:0 1px 2px rgba(0,0,0,.4); --sh-up:0 6px 22px rgba(0,0,0,.5);
}}
body{font-family:var(--f-text);font-size:14.5px;line-height:1.6;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1{font-family:var(--f-disp);font-size:27px;font-weight:800;letter-spacing:-.02em;
  text-wrap:balance;margin:0 0 2px}
h1 .mark{display:inline-block;width:28px;height:28px;vertical-align:-5px;margin-right:11px;
  background-size:contain;background-repeat:no-repeat;background-position:center}
h2{font-family:var(--f-disp);font-size:12px;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;color:var(--mut);border-top:1px solid var(--bd-soft);
  padding-top:22px;margin:32px 0 14px}
h3{font-family:var(--f-disp);letter-spacing:-.01em}
.sub{font-size:13px;color:var(--mut)}
code,.mono{font-family:var(--f-mono);font-size:12.5px}
.card,table.t,a.tile,.row,.fcard,#md{box-shadow:var(--sh);border-color:var(--bd-soft)}
.card,a.tile,.row,.fcard{border-radius:var(--rad);
  transition:box-shadow .16s ease,border-color .16s ease,transform .16s ease}
a.tile:hover,a.row:hover,.fcard:hover{box-shadow:var(--sh-up);border-color:var(--bd);
  transform:translateY(-1px)}
/* big numbers: the first thing anyone reads on the page */
.tiles{gap:12px;margin:18px 0 4px;padding-bottom:10px}
a.tile{padding:13px 17px;min-width:148px}
.tile .tl{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
  color:var(--mut)}
.tile .tv{font-family:var(--f-disp);font-size:25px;font-weight:800;letter-spacing:-.025em;
  margin-top:3px}
.tile .ts{font-size:11.5px;color:var(--mut)}
/* tables read as data, not as prose */
table.t{border-radius:var(--rad);font-variant-numeric:tabular-nums}
table.t th{font-family:var(--f-disp);font-size:11px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;background:var(--bd-soft);border-bottom:1px solid var(--bd)}
table.t td{padding:9px 13px;border-bottom:1px solid var(--bd-soft)}
table.t tbody tr:hover td,table.t tr:hover td{background:rgba(125,140,170,.06)}
.twrap{border-radius:var(--rad)}
/* buttons */
.btn{font-family:var(--f-disp);font-weight:600;font-size:13.5px;padding:9px 18px;
  border-radius:999px;box-shadow:var(--sh);transition:all .16s ease}
.btn:hover{border-color:var(--acc);box-shadow:var(--sh-up);transform:translateY(-1px)}
.pill,.st{font-family:var(--f-disp);font-weight:600;font-size:11.5px;letter-spacing:.02em}
/* status colours carry meaning, so keep them out of the accent */
.st.run,.st.appr{background:rgba(10,143,88,.14);color:var(--ok)}
.st.crit{background:rgba(208,47,47,.14);color:var(--down)}
.st.rev,.st.draft{background:rgba(180,83,9,.14);color:var(--warn)}
/* the lanes strip and any scroller get a thin, rounded bar */
.tiles,.hrow,.twrap{scrollbar-width:thin;scrollbar-color:var(--bd) transparent}
.tiles::-webkit-scrollbar,.hrow::-webkit-scrollbar,.twrap::-webkit-scrollbar{height:9px}
.tiles::-webkit-scrollbar-track,.hrow::-webkit-scrollbar-track,
.twrap::-webkit-scrollbar-track{background:transparent}
.tiles::-webkit-scrollbar-thumb,.hrow::-webkit-scrollbar-thumb,
.twrap::-webkit-scrollbar-thumb{background:var(--bd);border-radius:999px;
  border:3px solid transparent;background-clip:content-box}
.tiles::-webkit-scrollbar-thumb:hover,.hrow::-webkit-scrollbar-thumb:hover,
.twrap::-webkit-scrollbar-thumb:hover{background:var(--mut);background-clip:content-box}
.hrow{background:transparent;border:0;padding:0;border-radius:0}
.hcol{flex:0 0 clamp(280px,26vw,360px);min-width:0}
a:focus-visible,button:focus-visible,.btn:focus-visible{outline:2px solid var(--acc);
  outline-offset:2px;border-radius:8px}
.dirlist,.prlist{margin:10px 0 0;padding-left:18px;list-style:none}
.dirlist>li,.prlist>li{position:relative;margin:0 0 7px;font-size:13.5px;line-height:1.5;
  color:var(--tx)}
.prlist>li{color:var(--mut);font-size:13px;margin-bottom:5px}
.dirlist>li::before,.prlist>li::before{content:"";position:absolute;left:-14px;top:.62em;
  width:5px;height:5px;border-radius:50%;background:var(--acc);opacity:.75}
.prlist>li::before{background:var(--mut);opacity:.5}
.dirp{display:none}
.dapps{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));
  margin:14px 0 4px;align-items:start}
.dapp{padding:14px 16px}
.dah{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.dah b{font-family:var(--f-disp);font-size:14.5px;font-weight:700}
.drank{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;
  border-radius:6px;background:var(--acc);color:#fff;font-size:11.5px;font-weight:700;flex:none}
.st.d-dobrar{background:rgba(10,143,88,.16);color:var(--ok)}
.st.d-consertar{background:rgba(180,83,9,.16);color:var(--warn)}
.st.d-manter{background:rgba(125,140,170,.16);color:var(--mut)}
.st.d-congelar{background:rgba(125,140,170,.12);color:var(--mut)}
.dapp .prlist{margin-top:6px}
.dcall{color:var(--tx)!important;font-weight:600}
.fcard[id]{scroll-margin-top:18px}
.fdet{margin-top:10px;border-top:1px solid var(--bd-soft);padding-top:9px}
.fdet>summary{cursor:pointer;list-style:none;font-family:var(--f-disp);font-size:11.5px;
  font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);
  display:flex;align-items:center;gap:7px}
.fdet>summary::-webkit-details-marker{display:none}
.fdet>summary::before{content:"›";font-size:15px;transition:transform .15s}
.fdet[open]>summary::before{transform:rotate(90deg)}
.fdet>summary:hover{color:var(--acc)}
.fdet table.t{font-size:12.5px}
.fdet table.t td,.fdet table.t th{padding:6px 10px}
.fgrid.one{grid-template-columns:1fr!important}
.fcols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;
  align-items:start}
@media(max-width:820px){.fcols{grid-template-columns:1fr;gap:12px}}
.fcol{min-width:0}
.fcol>.fnds{margin-top:0}
.fdet .ascgrid{grid-template-columns:repeat(auto-fit,minmax(118px,1fr))}
.fdetcols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;
  align-items:start}
@media(max-width:1100px){.fdetcols{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:760px){.fdetcols{grid-template-columns:1fr}}
.fdetcols>div{min-width:0}
.t tr.focus td{background:rgba(21,82,216,.09);box-shadow:inset 0 0 0 9999px rgba(21,82,216,.03)}
.t tr.focus td:first-child{box-shadow:inset 3px 0 0 var(--acc)}
@media(prefers-color-scheme:dark){.t tr.focus td{background:rgba(122,166,255,.12)}}
.t .thsub{font-size:9.5px;font-weight:600;letter-spacing:.03em;color:var(--mut);
  text-transform:none}
.legend{display:grid;gap:8px 18px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  margin:12px 0 0;font-size:11.5px;color:var(--mut);line-height:1.45}
.legend b{display:block;font-family:var(--f-disp);font-size:10.5px;font-weight:700;
  letter-spacing:.03em;color:var(--tx);margin-bottom:1px}

<body><div class="wrap"><p class="sub" style="font-size:12px;margin:0 0 14px">Exportado em 2026-10-01 16:12 · fonte: Lab Hub local</p><p class="sub"><a href="../index.html">← hub</a> · <code>Apps/intermediate/Cronogram-Capilar/aso-pipeline/iterations/2026-09-12_iter-02-text-en-US-keywords/research/keyword_candidates.md</code></p><div id="md"></div><script>const RAW="# Hair Schedule: Care Routine \u2014 iter-02 (2026-09-12) \u00b7 es-MX (conserto) \u00b7 en-US \u00b7 pt-BR \u00b7 es-ES\n\n## \ud83d\udcc4 Resultado final\n\n### \ud83c\uddf2\ud83c\uddfd es-MX \u2014 conserto da regress\u00e3o da 1.1.0\n| Campo | Antes (no ar, 1.1.0) | Depois (proposto, vai na 1.2.0) |\n|---|---|---|\n| title | Cronograma Capilar: Rutina | Cronograma Capilar: Rutina |\n| subtitle | <span style=\"color:#d93025\">Hidratar</span>, <span style=\"color:#d93025\">nutrir</span> y <span style=\"color:#d93025\">reparar</span> (26) | <span style=\"color:#1e8e3e\">Hidrataci\u00f3n</span>, <span style=\"color:#1e8e3e\">nutrici\u00f3n</span> y <span style=\"color:#3b9cf0\">rizos</span> (30) |\n| keywords | rizos,lacio,<span style=\"color:#d93025\">seco</span>,porosidad,frizz,caspa,lavado,mascarilla,ca\u00edda,keratina,tratamiento (83) | <span style=\"color:#1e8e3e\">cabello</span>,<span style=\"color:#1e8e3e\">cuidado</span>,<span style=\"color:#1e8e3e\">pelo</span>,<span style=\"color:#1e8e3e\">rizado</span>,lacio,porosidad,frizz,caspa,lavado,mascarilla,caida,keratina,tratamiento (100) |\n\n**Por qu\u00ea:**\n- <span style=\"color:#1e8e3e\">nutrici\u00f3n</span>: `nutrici\u00f3n capilar` (pop 5) estava **#1** em 25/08 e hoje est\u00e1 fora do ranking. Alvo **top 3** at\u00e9 D28 (SERP com s\u00f3 2 apps). Risco: se n\u00e3o reindexar at\u00e9 D14, fica fora sem custar nenhuma posi\u00e7\u00e3o protegida.\n- <span style=\"color:#1e8e3e\">hidrataci\u00f3n</span>: `hidrataci\u00f3n capilar` saiu de **#2** para fora do ranking. Alvo **top 3-5** (top 3 com 3/0/0 avalia\u00e7\u00f5es). `cronograma capilar hidrataci\u00f3n` tamb\u00e9m est\u00e1 fora, com alvo top 3-5 (top 3 com 59/3/3).\n- <span style=\"color:#1e8e3e\">pelo</span> + <span style=\"color:#1e8e3e\">rizado</span>: `rutina pelo rizado` saiu de **#1** para fora. Alvo **top 5**: a palavra antes pesava como subtitle e agora pesa como keyword (head `pelo rizado` com 6/41/11). `cronograma capilar rizado` est\u00e1 fora, alvo top 3-5. `porosidad del pelo` segura **#1** e `pelo lacio` vai de **#5** para top 3.\n- <span style=\"color:#1e8e3e\">cabello</span>: sa\u00edram do ranking `cronograma cabello` (era **#2**), `frizz cabello` (**#3**), `rutina de cabello` (**#5**) e `tratamiento cabello` (**#7**). Alvo **top 3-5** para todos (SERPs de 4-10 apps; `rutina de cabello` com top 3 de 0/30/0). Tamb\u00e9m refor\u00e7a `caspa y ca\u00edda del cabello` **#1**.\n- <span style=\"color:#1e8e3e\">cuidado</span>: `cuidado capilar` saiu de **#6** para fora, alvo **top 3-5** (top 3 com 0/59/30). `cuidado de rizos`, alvo do iter-01 no MX, segue fora; alvo top 3-5 (SERP de 5 apps).\n- <span style=\"color:#3b9cf0\">rizos</span>: `cronograma capilar rizos` **#1** e `rutina capilar rizos` **#1** ficam em **#1** (top 3 com 0 avalia\u00e7\u00f5es).\n- <span style=\"color:#d93025\">hidratar</span> \u00b7 <span style=\"color:#d93025\">nutrir</span> \u00b7 <span style=\"color:#d93025\">reparar</span> \u00b7 <span style=\"color:#d93025\">seco</span>: nenhuma composi\u00e7\u00e3o rankeada no MX. O custo \u00e9 deixar de fora `reparar cabello` e `reparar el cabello` (DOMINATE, nunca rankearam) e `cabello seco` (PARTIAL).\n- Protegidos: 13/13 tokens do mapa MX, **9 composi\u00e7\u00f5es em #1**. Das 25 que ca\u00edram com a 1.1.0, **13 voltam a ter todos os tokens** (2 dos 5 que eram #1). As outras 12 v\u00e3o para a fila.\n\n### \ud83c\uddfa\ud83c\uddf8 en-US \u2014 \u00edndice inalterado \u00b7 decis\u00e3o aberta\n| Campo | Antes (no ar, 1.1.0) | Depois (proposto) |\n|---|---|---|\n| title | Hair Schedule: Care Routine | Hair Schedule: Care Routine |\n| subtitle | Hydration, nutrition & repair | Hydration, nutrition & repair |\n| keywords | dry,reconstruction,curly,coily,wavy,porosity,wash day,moisture,protein,frizz,scalp,treatment,dryness (100) | dry,reconstruction,curly,coily,wavy,porosity,wash day,moisture,protein,frizz,scalp,treatment,dryness (100) |\n\n**Op\u00e7\u00e3o B, n\u00e3o aplicada (depende do seu ok):**\n| Campo | A (proposto) | B |\n|---|---|---|\n| keywords | dry,reconstruction,curly,coily,wavy,porosity,wash day,moisture,protein,<span style=\"color:#d93025\">frizz</span>,scalp,treatment,dryness (100) | <span style=\"color:#1e8e3e\">test</span>,dry,reconstruction,curly,coily,wavy,porosity,wash day,moisture,protein,scalp,treatment,dryness (99) |\n\n**Por qu\u00ea:**\n- Com A, nenhuma posi\u00e7\u00e3o nova entra em jogo. Ficam onde est\u00e3o: `hair schedule routine` **#2**, `hair care schedule` **#4**, `hair nutrition routine` **#4**, `protein treatment schedule` **#5** e `hair treatment schedule` **#5**. Hoje o US tem 0 composi\u00e7\u00f5es em #1; em 25/08 eram 5, sem nenhum campo alterado. Isso \u00e9 deriva, e keyword n\u00e3o resolve.\n- B, o que sai: <span style=\"color:#d93025\">frizz</span> (pop 22) est\u00e1 em **#172**, sem alvo (LOTTERY; o #1 do SERP, Fizz, tem 21.172 avalia\u00e7\u00f5es). `anti frizz routine` est\u00e1 em #208, tamb\u00e9m sem alvo.\n- B, o que entra: <span style=\"color:#1e8e3e\">test</span> leva `hair porosity test` (pop 5, diff 15) de fora do ranking para alvo **top 3-5** at\u00e9 D28 (top 3 com 2/2/5 avalia\u00e7\u00f5es; estava em #26 em 25/08). `porosity test` (diff 5) vai de fora para top 30-50 (SERP de testes de engenharia, 4/3/1). Risco: depois da release, voltar atr\u00e1s custa uma vers\u00e3o nova.\n- Protegidos: com A, 21/21 tokens e 118 composi\u00e7\u00f5es. Com B, 20/21: sai `frizz` (#172, #208 e o feeder `hair frizz`).\n\n### \ud83c\udde7\ud83c\uddf7 pt-BR \u2014 \u00edndice inalterado (74% dos downloads novos)\n| Campo | Antes (no ar, 1.1.0) | Depois (proposto) |\n|---|---|---|\n| title | Cronograma Capilar: Rotina | Cronograma Capilar: Rotina |\n| subtitle | Hidrata\u00e7\u00e3o, nutri\u00e7\u00e3o, cabelo | Hidrata\u00e7\u00e3o, nutri\u00e7\u00e3o, cabelo |\n| keywords | cuidados,reconstru\u00e7\u00e3o,cacheado,crespo,ondulado,liso,porosidade,umecta\u00e7\u00e3o,frizz,tratamento,oleosidade (100) | cuidados,reconstrucao,cacheado,crespo,ondulado,liso,porosidade,umectacao,frizz,tratamento,oleosidade (100) |\n\n**Por qu\u00ea:**\n- Nenhuma posi\u00e7\u00e3o em jogo: 17/17 tokens seguram 96 composi\u00e7\u00f5es (**48 em #1**, 76 no top 10). `cronograma capilar` (pop 60) fica em **#4**; o teto \u00e9 do Meu Cronograma Capilar, com 76k avalia\u00e7\u00f5es.\n- O iter-01 roda neste campo at\u00e9 o D28 (28/09): `cuidados com cabelo cacheado` e `cuidados com cabelo liso` est\u00e3o em **#1**, `cuidados com cabelo crespo` em **#2** e `cuidados com o cabelo` em #15 (alvo #5).\n\n### \ud83c\uddea\ud83c\uddf8 es-ES \u2014 \u00edndice inalterado\n| Campo | Antes (no ar, 1.1.0) | Depois (proposto) |\n|---|---|---|\n| title | Cronograma Capilar: Rutina | Cronograma Capilar: Rutina |\n| subtitle | Hidrataci\u00f3n, nutrici\u00f3n, pelo | Hidrataci\u00f3n, nutrici\u00f3n, pelo |\n| keywords | rizos,reconstrucci\u00f3n,rizado,ondulado,liso,crespo,porosidad,frizz,tratamiento,grasa,cuidado,cabello (98) | rizos,reconstruccion,rizado,ondulado,liso,crespo,porosidad,frizz,tratamiento,grasa,cuidado,cabello (98) |\n\n**Por qu\u00ea:**\n- Nenhuma posi\u00e7\u00e3o em jogo: 18/18 tokens seguram 72 composi\u00e7\u00f5es (**29 em #1**, 57 no top 10). Os alvos do iter-01 ficam onde est\u00e3o: `cronograma capilar rizos` **#1** e `cuidado de rizos` **#3**. `cronograma capilar` fica em **#10**.\n\n---\n\n## \ud83e\udded Decis\u00f5es suas\n\n1. **en-US: trocar `frizz` por `test`?** A mant\u00e9m a regra de prote\u00e7\u00e3o. B troca duas posi\u00e7\u00f5es sem tr\u00e1fego (#172 e #208) por um top 3-5 prov\u00e1vel em `hair porosity test`, que tem fit com os 10 testes da 1.2.0. B s\u00f3 entra com o seu ok, porque \u00e9 exce\u00e7\u00e3o \u00e0 regra \"token protegido nunca sai\".\n2. **Deploy (est\u00e1gio 7): n\u00e3o autorizado.** Escopo: subtitle e keywords do es-MX; keywords do pt-BR e do es-ES (s\u00f3 tira acento, \u00edndice id\u00eantico, opcional); en-US s\u00f3 se escolher B. Tudo entra na 1.2.0 (`PREPARE_FOR_SUBMISSION`). Antes da submiss\u00e3o, reverter custa 1 PATCH; depois da release, custa uma vers\u00e3o.\n3. **CPP:** escolher 1 dos 3 abaixo, ou nenhum por enquanto.\n4. **Antes de submeter a 1.2.0 (fora deste deploy):** `whatsNew` e `promotionalText` est\u00e3o NULL nos 39 locales da 1.2.0, e a description n\u00e3o fala do di\u00e1rio, dos produtos, do scanner, das receitas e t\u00e9cnicas, nem dos 4 tratamentos novos.\n\n---\n\n## \ud83d\udcd0 Diff antes/depois por locale\n\nBase = metadata viva da 1.1.0 (`current/metadata/`). `name` n\u00e3o muda em nenhum locale.\n\n### es-MX\n| Campo | Live 1.1.0 | Proposto | Chars |\n|---|---|---|---|\n| name | Cronograma Capilar: Rutina | Cronograma Capilar: Rutina | 26 \u2192 26 |\n| subtitle | <span style=\"color:#d93025\">Hidratar</span>, <span style=\"color:#d93025\">nutrir</span> y <span style=\"color:#d93025\">reparar</span> | <span style=\"color:#1e8e3e\">Hidrataci\u00f3n</span>, <span style=\"color:#1e8e3e\">nutrici\u00f3n</span> y <span style=\"color:#3b9cf0\">rizos</span> | 26 \u2192 **30** |\n| keywords | rizos,lacio,<span style=\"color:#d93025\">seco</span>,porosidad,frizz,caspa,lavado,mascarilla,ca\u00edda,keratina,tratamiento | <span style=\"color:#1e8e3e\">cabello</span>,<span style=\"color:#1e8e3e\">cuidado</span>,<span style=\"color:#1e8e3e\">pelo</span>,<span style=\"color:#1e8e3e\">rizado</span>,lacio,porosidad,frizz,caspa,lavado,mascarilla,caida,keratina,tratamiento | 83 \u2192 **100** |\n\nOrdem das keywords: `cabello` (10 DOMINATE) \u00b7 `cuidado` \u00b7 `pelo` \u00b7 `rizado`, depois o bloco protegi
