  <nav class="vr-tabs"><span class="vr-title">iPhotos 1.10.0</span><button id="btn-resumo">Resumo</button><button id="btn-prints">Prints</button><button id="btn-aso">ASO</button></nav><section class="tab" id="tab-resumo"><div class="vr vr-end"><div class="kicker">Relatório de versão</div><h1>iPhotos 1.10.0</h1><div class="md" id="vr-summary"></div><script>document.getElementById("vr-summary").innerHTML = window.marked ? marked.parse("# iPhotos 1.10.0 \u2014 o que entra, o que decidir, como enviar\n\nBin\u00e1rio **short version 30 / build 35**. O app tem duas numera\u00e7\u00f5es paralelas: a de marketing que a loja exibe (1.9.0 \u2192 1.10.0) e a num\u00e9rica do bin\u00e1rio (29 \u2192 30). A compara\u00e7\u00e3o que a Apple faz no upload \u00e9 a do bin\u00e1rio \u2014 foi o que recusou um upload como \"1.10.0\" (lido como 1 < 29).\n\n## O que entra\n\n### 1. O app passa a falar os 13 idiomas da loja\nEra 100% ingl\u00eas. Os 9 `Main.strings` localizados tinham 49 strings cada com **zero caractere non-ASCII** \u2014 exports nunca traduzidos, `\"Gallery\" = \"Gallery\"` no japon\u00eas \u2014 e o c\u00f3digo novo tinha o ingl\u00eas cravado no fonte.\n\n- **402 literais** de c\u00f3digo viraram chave, resolvendo em **389 chaves** (`String(localized:)`, `%@` texto e `%lld` inteiro).\n- **12 idiomas traduzidos**: pt-BR, pt-PT, es-ES, es-MX, fr, de, it, ja, ko, ru, tr, zh-Hans \u2014 cada um com as 389 chaves **mais** as 38 strings reais do storyboard.\n- Conferido por script nos 24 arquivos: conjunto de chaves id\u00eantico ao ingl\u00eas, mesma contagem de `%@`/`%lld` por chave, `plutil -lint` limpo.\n- Verificado **renderizado no simulador** em alem\u00e3o e japon\u00eas antes de fechar: t\u00edtulo, corpo e bot\u00e3o na l\u00edngua certa, quebrando linha em vez de cortar.\n\n**Tr\u00eas bugs de localiza\u00e7\u00e3o que o ingl\u00eas escondia:**\n1. **N\u00e3o existia bundle de alem\u00e3o, espanhol de Espanha nem portugu\u00eas de Portugal.** A loja vende nos tr\u00eas e o app n\u00e3o tinha nenhum \u2014 continuariam em ingl\u00eas por melhor que fosse a tradu\u00e7\u00e3o.\n2. **O `pt-BR` estava fora do grupo de variantes do storyboard.** O arquivo existia no disco e o projeto n\u00e3o o inclu\u00eda: o Brasil j\u00e1 lia o storyboard em ingl\u00eas.\n3. **Os cart\u00f5es da Home cortavam texto** (`numberOfLines = 1` + `minimumScaleFactor`). S\u00f3 parecia aceit\u00e1vel porque tudo era ingl\u00eas; agora quebram em 2 linhas.\n\nO `pt-PT` deixou de ser c\u00f3pia literal do `pt-BR`: **61 das 389 chaves divergem** \u2014 `ecr\u00e3`/`tela`, `guardar`/`salvar`, `grelha`/`grade`, `partilhar`/`compartilhar`, `gerir subscri\u00e7\u00e3o`/`gerenciar assinatura`.\n\n### 2. Um m\u00eas de trabalho que nunca saiu da m\u00e1quina\nA 1.9.0 \u00e9 o commit `d312d26` (25/08). Tudo depois disso est\u00e1 s\u00f3 no repo e entra agora:\n- **Revamp do grid** (13 commits de 31/08): layouts de 7-9 fotos, ratio 4x6, sombra de c\u00e9lula, rascunhos com salvamento autom\u00e1tico, margem externa e seletor de cor livre, galeria de layouts por fam\u00edlia, fundos gradiente e textura de papel, texto no collage, divis\u00f3rias arrast\u00e1veis com ratios 3:4 e 16:9, preenchimento em lote, stickers de emoji, layouts de corte diagonal, bot\u00e3o shuffle, recortes estilo Shuffles via Vision, templates photo dump de 8-12 fotos, molduras anal\u00f3gicas e texto de journaling.\n- **Eventos can\u00f4nicos de onboarding** (28/08).\n- **Remo\u00e7\u00e3o do pr\u00e9-prompt de avalia\u00e7\u00e3o** (11/09) \u2014 estava na lista de releases pendentes do lab.\n\n### 3. Corre\u00e7\u00f5es de empacotamento\n- **`CFBundleIconName` na raiz do Info.plist.** O actool escreveu s\u00f3 o aninhado; sem o da raiz o altool aceita o upload e o build **nunca materializa** na ASC. Pego pelo preflight.\n- **`ITSAppUsesNonExemptEncryption`** declarado \u2014 sem ele o build para no gate de Missing Compliance.\n\n## O que decidir\n\n### a) O texto de ASO dos 13 locales\nEst\u00e1 na aba **ASO** deste relat\u00f3rio, no template da casa. Keywords mudam nos 13, subtitle muda em 3 (es-MX, de-DE, zh-Hans), **name intocado**. Metadata da loja \u00e9 decis\u00e3o sua \u2014 depois do seu ok eu aplico por PATCH e escrevo o whatsNew (os 13 est\u00e3o vazios e \u00e9 obrigat\u00f3rio pra submeter).\n\n### b) O subtitle do de-DE\nTirou `collage` do campo de peso 3\u00d7 apostando que `Fotocollage` no nome indexa por substring. A evid\u00eancia de substring foi medida em **CJK**, n\u00e3o em alem\u00e3o \u2014 o compositor marcou como hip\u00f3tese n\u00e3o testada. O D7 vigia `karussell collage` #22. Mant\u00e9m ou reverte?\n\n### c) `\ub124\ucef7` no coreano\nFragmento de `\uc778\uc0dd\ub124\ucef7`, que \u00e9 cabine fotogr\u00e1fica (10/10 no SERP). \u00c9 o PARTIAL de maior risco do store. Cortar custa 3 chars e nenhuma posi\u00e7\u00e3o.\n\n### d) O trial est\u00e1 no plano errado pelo playbook\nConferido na ASC: o **anual** tem FREE_TRIAL de **3 dias** (ativo desde 10/06) e semanal/mensal n\u00e3o t\u00eam nenhum. O badge \"Free Trial\" no card anual diz a verdade, ent\u00e3o n\u00e3o h\u00e1 risco de 2.3.1 \u2014 mas a regra do lab para app **utilit\u00e1rio** \u00e9 trial no **semanal** (plano-her\u00f3i). Decis\u00e3o de produto.\n\n### e) A copy do paywall vende feature, n\u00e3o ganho\nOs 4 benef\u00edcios s\u00e3o \"All premium filters & effects\", \"Pro editing & retouch tools\", \"Unlimited collages, grids & stickers\", \"Remove all ads\". E o paywall legado \u2014 que todo usu\u00e1rio iOS 16 v\u00ea \u2014 tem o t\u00edtulo **\"Go Premium\"**, exatamente o gen\u00e9rico que a regra pro\u00edbe. N\u00e3o mexi: copy de paywall \u00e9 sua.\n\n## Como enviar\n\n**Hoje est\u00e1 bloqueado, e n\u00e3o \u00e9 pelo app.** A API da Apple recusa assinar: a mesma chave responde **200** em `/v1/apps`, `/v1/builds` e `/v1/users` e **403** em `/v1/certificates`, `/v1/profiles`, `/v1/bundleIds` e `/v1/devices`, todos com *\"Unable to find a team with the given Team ID [team] to which you belong\"*. O build 34 exportou de manh\u00e3 com os mesmos par\u00e2metros. Metade loja funciona, metade portal n\u00e3o: \u00e9 **membership do Developer Program vencida/em renova\u00e7\u00e3o, ou contrato novo esperando aceite do Account Holder**. Isso trava o archive de todos os apps do lab.\n\nDepois de destravar a conta, a sequ\u00eancia \u00e9:\n1. Exportar e subir o **build 35** \u2014 o archive j\u00e1 est\u00e1 em disco (`build/release/iPhotos-b35.xcarchive`) e passou o preflight (11 checks, 0 falha, 0 aviso).\n2. Anexar o 35 na vers\u00e3o 1.10.0 (hoje est\u00e1 com o 34, que n\u00e3o tem tradu\u00e7\u00e3o).\n3. Com o seu ok no ASO: PATCH dos 13 locales + whatsNew.\n4. Submeter.\n\n## O que N\u00c3O entra, de prop\u00f3sito\n- Tradu\u00e7\u00e3o de `ar`, `hi`, `id`, `fr-CA` e `zh-Hant`: existem como `.lproj` no app mas a loja n\u00e3o vende nesses idiomas; caem no ingl\u00eas.\n- Nomes decorativos de template (`Silk`, `Reed`, `Palisade`, `Midband`, `Hero`, `Frost`, a fam\u00edlia `Lilac Six`, `Photo Dump`, `Reel`) ficam em ingl\u00eas nos 12 idiomas: leem como nome, n\u00e3o como descri\u00e7\u00e3o.\n- Identificadores CoreImage, product ids de StoreKit, nomes de SF Symbol, nomes de evento de analytics e rawValue de enum persistido \u2014 nada disso se traduz.\n\n## Limite conhecido, registrado em vez de escondido\nO badge de trial monta n\u00famero e unidade de chaves separadas, ent\u00e3o o russo n\u00e3o consegue concord\u00e2ncia para todo n\u00famero e as unidades de portugu\u00eas e espanhol ficaram em plural fixo \u2014 correto para o trial de 3 dias que o app vende, errado se um dia vender 1 semana. Isso pede `.stringsdict`, n\u00e3o tradu\u00e7\u00e3o melhor.\n") : '<pre>' + "# iPhotos 1.10.0 \u2014 o que entra, o que decidir, como enviar\n\nBin\u00e1rio **short version 30 / build 35**. O app tem duas numera\u00e7\u00f5es paralelas: a de marketing que a loja exibe (1.9.0 \u2192 1.10.0) e a num\ partilhar`/`compartilhar`, `gerir subscri\u00e7\u00e3o`/`gerenciar assinatura`.\n\n### 2. Um m\u00eas de trabalho que nunca saiu da m\u00e1quina\nA 1.9.0 \u00e9 o commit `d312d26` (25/08). Tudo depois disso est\u00e1 s\u00f3 no repo e entra agora:\n- **Revamp do grid** (13 commits de 31/08): layouts de 7-9 fotos, ratio 4x6, sombra de c\u00e9lula, rascunhos com salvamento autom\u00e1tico, margem externa e seletor de cor livre, galeria de layouts por fam\u00edlia, fundos gradiente e textura de papel, texto no collage, divis\u00f3rias arrast\u00e1veis com ratios 3:4 e 16:9, preenchimento em lote, stickers de emoji, layouts de corte diagonal, bot\u00e3o shuffle, recortes estilo Shuffles via Vision, templates photo dump de 8-12 fotos, molduras anal\u00f3gicas e texto de journaling.\n- **Eventos can\u00f4nicos de onboarding** (28/08).\n- **Remo\u00e7\u00e3o do pr\u00e9-prompt de avalia\u00e7\u00e3o** (11/09) \u2014 estava na lista de releases pendentes do lab.\n\n### 3. Corre\u00e7\u00f5es de empacotamento\n- **`CFBundleIconName` na raiz do Info.plist.** O actool escreveu s\u00f3 o aninhado; sem o da raiz o altool aceita o upload e o build **nunca materializa** na ASC. Pego pelo preflight.\n- **`ITSAppUsesNonExemptEncryption`** declarado \u2014 sem ele o build para no gate de Missing Compliance.\n\n## O que decidir\n\n### a) O texto de ASO dos 13 locales\nEst\u00e1 na aba **ASO** deste relat\u00f3rio, no template da casa. Keywords mudam nos 13, subtitle muda em 3 (es-MX, de-DE, zh-Hans), **name intocado**. Metadata da loja \u00e9 decis\u00e3o sua \u2014 depois do seu ok eu aplico por PATCH e escrevo o whatsNew (os 13 est\u00e3o vazios e \u00e9 obrigat\u00f3rio pra submeter).\n\n### b) O subtitle do de-DE\nTirou `collage` do campo de peso 3\u00d7 apostando que `Fotocollage` no nome indexa por substring. A evid\u00eancia de substring foi medida em **CJK**, n\u00e3o em alem\u00e3o \u2014 o compositor marcou como hip\u00f3tese n\u00e3o testada. O D7 vigia `karussell collage` #22. Mant\u00e9m ou reverte?\n\n### c) `\ub124\ucef7` no coreano\nFragmento de `\uc778\uc0dd\ub124\ucef7`, que \u00e9 cabine fotogr\u00e1fica (10/10 no SERP). \u00c9 o PARTIAL de maior risco do store. Cortar custa 3 chars e nenhuma posi\u00e7\u00e3o.\n\n### d) O trial est\u00e1 no plano errado pelo playbook\nConferido na ASC: o **anual** tem FREE_TRIAL de **3 dias** (ativo desde 10/06) e semanal/mensal n\u00e3o t\u00eam nenhum. O badge &quot;Free Trial&quot; no card anual diz a verdade, ent\u00e3o n\u00e3o h\u00e1 risco de 2.3.1 \u2014 mas a regra do lab para app **utilit\u00e1rio** \u00e9 trial no **semanal** (plano-her\u00f3i). Decis\u00e3o de produto.\n\n### e) A copy do paywall vende feature, n\u00e3o ganho\nOs 4 benef\u00edcios s\u00e3o &quot;All premium filters &amp; effects&quot;, &quot;Pro editing &amp; retouch tools&quot;, &quot;Unlimited collages, grids &amp; stickers&quot;, &quot;Remove all ads&quot;. E o paywall legado \u2014 que todo usu\u00e1rio iOS 16 v\u00ea \u2014 tem o t\u00edtulo **&quot;Go Premium&quot;**, exatamente o gen\u00e9rico que a regra pro\u00edbe. N\u00e3o mexi: copy de paywall \u00e9 sua.\n\n## Como enviar\n\n**Hoje est\u00e1 bloqueado, e n\u00e3o \u00e9 pelo app.** A API da Apple recusa assinar: a mesma chave responde **200** em `/v1/apps`, `/v1/builds` e `/v1/users` e **403** em `/v1/certificates`, `/v1/profiles`, `/v1/bundleIds` e `/v1/devices`, todos com *&quot;Unable to find a team with the given Team ID [team] to which you belong&quot;*. O build 34 exportou de manh\u00e3 com os mesmos par\u00e2metros. Metade loja funciona, metade portal n\u00e3o: \u00e9 **membership do Developer Program vencida/em renova\u00e7\u00e3o, ou contrato novo esperando aceite do Account Holder**. Isso trava o archive de todos os apps do lab.\n\nDepois de destravar a conta, a sequ\u00eancia \u00e9:\n1. Exportar e subir o **build 35** \u2014 o archive j\u00e1 est\u00e1 em disco (`build/release/iPhotos-b35.xcarchive`) e passou o preflight (11 checks, 0 falha, 0 aviso).\n2. Anexar o 35 na vers\u00e3o 1.10.0 (hoje est\u00e1 com o 34, que n\u00e3o tem tradu\u00e7\u00e3o).\n3. Com o seu ok no ASO: PATCH dos 13 locales + whatsNew.\n4. Submeter.\n\n## O que N\u00c3O entra, de prop\u00f3sito\n- Tradu\u00e7\u00e3o de `ar`, `hi`, `id`, `fr-CA` e `zh-Hant`: existem como `.lproj` no app mas a loja n\u00e3o vende nesses idiomas; caem no ingl\u00eas.\n- Nomes decorativos de template (`Silk`, `Reed`, `Palisade`, `Midband`, `Hero`, `Frost`, a fam\u00edlia `Lilac Six`, `Photo Dump`, `Reel`) ficam em ingl\u00eas nos 12 idiomas: leem como nome, n\u00e3o como descri\u00e7\u00e3o.\n- Identificadores CoreImage, product ids de StoreKit, nomes de SF Symbol, nomes de evento de analytics e rawValue de enum persistido \u2014 nada disso se traduz.\n\n## Limite conhecido, registrado em vez de escondido\nO badge de trial monta n\u00famero e unidade de chaves separadas, ent\u00e3o o russo n\u00e3o consegue concord\u00e2ncia para todo n\u00famero e as unidades de portugu\u00eas e espanhol ficaram em plural fixo \u2014 correto para o trial de 3 dias que o app vende, errado se um dia vender 1 semana. Isso pede `.stringsdict`, n\u00e3o tradu\u00e7\u00e3o melhor.\n" + '</pre>';</script></div></section><div class="langfloat" id="langFloat" hidden><label>Idioma</label><select id="langSel"></select></div>

 localizados t\u00eam **49 strings cada com ZERO caractere non-ASCII** (`ja.lproj`: `\"Gallery\" = \"Gallery\"`), e o c\u00f3digo novo tem **~112 strings de UI em ingl\u00eas hardcoded** (Composer 75, Editor 26, Home 11). Cruzando com o funil de 36 dias:\n\n| store | impress\u00f5es | taps | instala\u00e7\u00f5es 1F/30d | ratings |\n|---|---|---|---|---|\n| ja | 822 | **3** (0,36%) | 0 | **0** |\n| ko | 265 | **0** (0,0%) | 0 | **0** |\n| zh-Hans | 294 | 9 (3,06%) | 1 | **0** |\n| it | 307 | 9 (2,93%) | 2 | **0** |\n| tr | 1.627 | 9 (0,55%) | 1 | 7 \u00b7 **3,86** |\n\nEsta itera\u00e7\u00e3o sobe impress\u00e3o. Sem tradu\u00e7\u00e3o, boa parte dela morre no tap: o texto da loja promete em japon\u00eas uma p\u00e1gina que fala ingl\u00eas. **\u00c9 a alavanca maior que a keyword e cabe na mesma 1.10.0** \u2014 mas \u00e9 escopo de produto, n\u00e3o de ASO, e por isso \u00e9 decis\u00e3o dele. Se ficar pra depois, ja/ko/zh-Hans/it valem como **cobertura de ranking**, n\u00e3o como receita, e o checkpoint deve l\u00ea-los assim.\n\n### (b) Os 3 subtitles trocados \u2014 e o de-DE em especial\n\n| locale | o que muda de posi\u00e7\u00e3o | n\u00famero que sustenta |\n|---|---|---|\n| es-MX | `carrusel` sobe de keywords (1\u00d7) pro subtitle (3\u00d7): `hacer carrusel` **#8 \u2192 #4-6**, `editor de carrusel` #17 \u2192 **#8-12**, `carrusel instagram` #19 \u2192 #10-14, `editor carrusel` #26 \u2192 #13-18, `carrusel de instagram` #27 \u2192 #14-18. `difuminar` desce pro keyword field e **n\u00e3o sai do campo** \u2014 as 5 posi\u00e7\u00f5es dele (#41, #120, #162, #176, #186) continuam com token, 3\u00d7 mais fracas. | `carrusel` sustenta 9 posi\u00e7\u00f5es, 6 no top-30; o cluster `difuminar` \u00e9 LOTTERY (SERP mediana 777 ratings) |\n| de-DE | `erstellen` sobe pro subtitle: `instagram karussell erstellen` **#13 \u2192 #5-8**, `karussell erstellen` #23 \u2192 **#10-14**. O SERP de `instagram karussell erstellen` tem top-3 de **19, 93 e 103 ratings** \u2014 \u00e9 imer` = **0**. **Se ele quiser zero exposi\u00e7\u00e3o, cortar `\ub124\ucef7` custa 3 chars e nenhuma posi\u00e7\u00e3o** (o termo est\u00e1 OUT hoje).\n\n---\n\n## \ud83c\udf0d 3. Por locale \u2014 saiu, entrou, protegido\n\nToda popularidade desta itera\u00e7\u00e3o \u00e9 `astro-only` (**`pop n\u00e3o confi\u00e1vel`** \u2014 sem ASC search terms e sem Apple Ads; achado 14 da `research-2026-09-aso`). Consequ\u00eancia aplicada: **nenhum token novo entrou em name ou subtitle por volume**; as 3 mudan\u00e7as de subtitle s\u00e3o promo\u00e7\u00e3o de token com **posi\u00e7\u00e3o medida**. Auditoria linha a linha em `composition_rationale_*.md` e `protection_map_*.md`.\n\n**en-US** \u00b7 modo conservador (ordem dele: \"n\u00e3o mexe muito no americano\"), teto de 2 trocas, **1 usada**.\nSaiu `pictures` (9 chars, **0 posi\u00e7\u00f5es** \u2014 nenhuma das 20 composi\u00e7\u00f5es rankeadas o cita). Entrou `post`. Protegido: **20/20** composi\u00e7\u00f5es seguem cobertas; `panorama`+`carousel`+`scrapbook` do subtitle congelado entram em **11 das 20**. A 2\u00aa troca foi **recusada por n\u00famero** (\u00a75).\n\n**pt-BR** \u00b7 saiu `rosto` (MISMATCH, **0 posi\u00e7\u00f5es**) e `desenhar` (**0**). Entraram `montagem`, `criar`. Protegido: **48/48**; `instagram` (15 posi\u00e7\u00f5es), `fazer` (9), `scrapbook` (6), `mural` (5, 4 delas no top-3), `dividir`, `desfoque`, `recortes` todos no campo novo.\n\n**pt-PT** \u00b7 deixa de ser c\u00f3pia do pt-BR: **5 tokens de diferen\u00e7a**. Sa\u00edram `filtros` (**0**), `arte` (**0**) e \u2014 **trade-off declarado** \u2014 `mural` (**1** posi\u00e7\u00e3o: #26 num ranking de 173 apps, palavra brasileira ausente de todos os top-10 pt-PT medidos) e `rosto` (**2**: #120 `editor de rosto`, #184 `rosto`; MISMATCH, e pela r\u00e9gua de TTR do playbook #120/#184 valem ~0 instala\u00e7\u00e3o). Entraram `grelha`, `mosaico`, `criar`. Protegido: **63 de 65**.\n\n**es-ES** \u00b7 sa\u00edram `filtros` (**0**) e `marco` (**0**, 8 page views).\n\n**D7 / D14 / D21 / D28 contados do `live_at`** \u2014 o dia em que a 1.10.0 ficar `READY_FOR_SALE`, **n\u00e3o** do dia do deploy do texto. A data depende da Apple e n\u00e3o est\u00e1 fixada aqui.\n\nO que o checkpoint l\u00ea: **posi\u00e7\u00e3o dos termos da \u00a74 no Astro** + **impress\u00f5es por territ\u00f3rio na ASC**. E a limita\u00e7\u00e3o sem rodeio: ele arrancou a trava do piso de tr\u00e1fego em 30/09 (\"pode arrancar essa trava, isso \u00e9 tentando renascer o app\"), ent\u00e3o **esta itera\u00e7\u00e3o n\u00e3o fecha com `results.final` de risco relativo e IC** \u2014 com 153 instala\u00e7\u00f5es 1F/30d no mundo (US 59) contra um piso de 100 por pa\u00eds, n\u00e3o existe amostra pra isso em 12 dos 13 locales. **Fechar com RR/IC seria inventar n\u00famero.** O fechamento \u00e9 por posi\u00e7\u00e3o + impress\u00e3o, e a leitura de instala\u00e7\u00e3o \u00e9 direcional.\n\nBaseline recomputado em **01/10** por causa do LEARNINGS #100 (o fix anterior testava prefixo e perdia a forma `F1`): o iPhotos s\u00f3 emite `1F`/`7F`/`3F`, ent\u00e3o **o n\u00famero n\u00e3o mudou** \u2014 **153 instala\u00e7\u00f5es 1F em 30 dias no mundo (US 59), 4.694 updates; 413 em 90 dias (US 197)**. Diferen\u00e7a vs o reportado antes: **+0**.\n\nCheckpoints:\n\n| checkpoint | o que decide |\n|---|---|\n| D7 | re-index entrou? `karussell collage` #22 e `bildcollage` #207 no de (rollback = devolver `Collage` ao subtitle) \u00b7 `\u8f6e\u64ad\u56fe\u7f16\u8f91\u5668` #30 e `\u5168\u666f` #177 no cn \u00b7 `panorama b\u00f6lme` **#3** no tr \u00b7 `\u0441\u043a\u0440\u0430\u043f\u0431\u0443\u043a\u0438\u043d\u0433` #56 no ru \u00b7 as 20 posi\u00e7\u00f5es do us intactas \u00b7 a anomalia `iphotos` OUT no de |\n| D14 | as apostas DOMINATE de SERP raso (`grelha de fotos`, `\u0444\u043e\u0442\u043e\u0441\u0435\u0442\u043a\u0438`, `\uc81c\uc791`, `\u62c6\u5206`, `kaydirmali`, `scroll` nos 5 latinos) entraram no alvo? |\n| D21 | impress\u00f5es de busca por territ\u00f3rio vs a janela de 36d do baseline |\n| D28 | posi\u00e7\u00e3o final vs a coluna **alvo D28** da \u00a74, termo por termo; e se o tap rate de ja/ko/zh-Hans/it continuar no ch\u00e3o, a conclus\u00e3o \u00e9 a decis\u00e3o (a), n\u00e3o a keyword |\n\n**CPP**: nenhum candidato a Custom Product Page foi medido nesta itera\u00e7\u00e3o (os 13 `serp_winnability_*.csv` n\u00e3o trazem a coluna), ent\u00e3o nenhum token foi vinculado a p\u00e1gina.\n\n---\n\n## \u26a0\ufe0f 7. Riscos operacionais\n\n1. **zh-Hans: os dois campos t\u00eam que ser aplicados juntos.** `\u8f6e\u64ad` e `\u5168\u666f` sa\u00edram do keyword field porque passaram a viver no subtitle novo. Se s\u00f3 o `keywords.txt` entrar, o store perde `\u8f6e\u64ad` (**6 posi\u00e7\u00f5es**) e `\u5168\u666f` (2 + o cluster) de uma vez. **O read-back do `deploy-verifier` tem que conferir subtitle E keywords nesse locale**, n\u00e3o um dos dois.\n2. **N\u00e3o \u00e9 PATCH num app no ar.** keywords vivem em `appStoreVersionLocalizations` e subtitle em `appInfoLocalizations` do appInfo `PREPARE_FOR_SUBMISSION`; hoje o app s\u00f3 tem a 1.9.0 `READY_FOR_SALE` e um \u00fanico appInfo `READY_FOR_SALE`. Exige a vers\u00e3o nova com build (short `30`, build `34`) e passa por review \u2014 logo o texto s\u00f3 come\u00e7a a contar do `live_at`, depois da aprova\u00e7\u00e3o.\n3. **Duas numera\u00e7\u00f5es paralelas no mesmo app.** A loja exibe 1.9.0, mas o bin\u00e1rio live carrega short version **29**. Pro 1.10.0, `MARKETING_VERSION` e `CURRENT_PROJECT_VERSION` precisam ser setados explicitamente (30 / 34) nos 4 pontos do pbxproj \u2014 errar aqui \u00e9 build recusado no ingest, n\u00e3o bug de ASO.\n4. **Janela de re-index de 3-7 dias.** No en-US, 13 dos 15 tokens ficaram parados de prop\u00f3sito: o churn est\u00e1 concentrado nos 12 locales sem funil a proteger.\n5. **de-DE perdeu peso em `collage`** (3\u00d7 \u2192 1\u00d7). Risco de uma posi\u00e7\u00e3o top-30; mitiga\u00e7\u00e3o j\u00e1 aplicada (token mantido nas keywords) e rollback barato (devolver `Collage` ao subtitle no lugar de `Erstellen`).\n6. **es-MX perdeu `hacer pegatinas` #37** por entrega inexistente, e `difuminar` caiu de 3\u00d7 para 1\u00d7 (5 posi\u00e7\u00f5es, a melhor #41, enfraquecem). Custo declarado e aprovado no est\u00e1gio 4.\n7. **`\u0434\u043b\u044f` no ru (4 chars)**: se a Apple tratar preposi\u00e7\u00e3o como stopword, s\u00e3o 4 chars mortos. \u00c9 o primeiro corte do ru se algum char fizer falta.\n8. **O risco maior n\u00e3o \u00e9 de keyword.** `tr` tem **3,86 em 7 ratings** \u2014 abaixo do penhasco de 4,0 do playbook \u2014 com 1.627 impress\u00f5es e 0,55% de tap. Ranquear mais ali amplifica um funil que j\u00e1 prova n\u00e3o converter: a alavanca do tr \u00e9 nota + tradu\u00e7\u00e3o, e por isso l\u00e1 s\u00f3 foi feito o que \u00e9 quase gr\u00e1tis (dedup de 23 chars + write-off de 19).\n") : '<pre>' + "# iPhotos iter-02 \u2014 subtitle + keywords nos 13 locales \u00b7 o que aprovar\n\n`name` n\u00e3o muda em nenhum locale. Mudam **subtitle em 3** (`es-MX`, `de-DE`, `zh-Hans`) e **keywords em 13**. Vai embarcado na **1.10.0** (short `30`, build `34`) \u2014 keywords e subtitle s\u00e3o version-scoped, ent\u00e3o **n\u00e3o \u00e9 PATCH num app no ar**: exige vers\u00e3o nova com build e passa por review.\n\n## \u2705 1. O que ele aprova\n\n| locale | subtitle antes | subtitle depois | len | keywords len | apostas |\n|---|---|---|---|---|---|\n| en-US | `Panorama Carousel Scrapbook` | *(congelado)* | 27 | 99 \u2192 **95** | 1 |\n| pt-BR | `Colagem Carrossel Panorama` | *(igual)* | 26 | 99 \u2192 **99** | 2 |\n| pt-PT | `Colagem Carrossel Panorama` | *(igual)* | 26 | 99 \u2192 **95** | 3 |\n| es-ES | `Collage Carrusel Panorama` | *(igual)* | 25 | 99 \u2192 **98** | 2 |\n| es-MX | `Collage Difuminar Scrapbook` | **`Carrusel Scrapbook Collage`** | 27 \u2192 **26** | 98 \u2192 **97** | 3 |\n| fr-FR | `Collage Carrousel Panorama` | *(igual)* | 26 | 90 \u2192 **89 \u00d7): `hacer carrusel` **#8 \u2192 #4-6**, `editor de carrusel` #17 \u2192 **#8-12**, `carrusel instagram` #19 \u2192 #10-14, `editor carrusel` #26 \u2192 #13-18, `carrusel de instagram` #27 \u2192 #14-18. `difuminar` desce pro keyword field e **n\u00e3o sai do campo** \u2014 as 5 posi\u00e7\u00f5es dele (#41, #120, #162, #176, #186) continuam com token, 3\u00d7 mais fracas. | `carrusel` sustenta 9 posi\u00e7\u00f5es, 6 no top-30; o cluster `difuminar` \u00e9 LOTTERY (SERP mediana 777 ratings) |\n| de-DE | `erstellen` sobe pro subtitle: `instagram karussell erstellen` **#13 \u2192 #5-8**, `karussell erstellen` #23 \u2192 **#10-14**. O SERP de `instagram karussell erstellen` tem top-3 de **19, 93 e 103 ratings** \u2014 \u00e9 o \u00fanico lugar do grupo EU onde #1-3 n\u00e3o \u00e9 fantasia. **`collage` saiu do subtitle** (3\u00d7) e desceu pras keywords (1\u00d7). | de-DE \u00e9 o store de melhor tap fora do anglo: **7,35%** (35 taps / 476 impress\u00f5es) com **5 ratings** |\n| zh-Hans | `\u5168\u666f` deixa de existir solto (era ele que puxava SERP 10/10 de VR/360/street-view) e passa a existir dentro de `\u5168\u666f\u5207\u7247`. Com isso `\u8f6e\u64ad\u56fe\u7f16\u8f91\u5668` **#30 \u2192 #5-15** fica completo e em 3\u00d7, e `\u5168\u666f\u5207\u7247` (**2 apps no ranking inteiro**) + `\u65e0\u7f1d\u8f6e\u64ad\u56fe` (10 apps) entram DOMINATE **#3-10** de gra\u00e7a. | os 4 termos do subtitle novo medem **pop 5 = piso** (sem afirma\u00e7\u00e3o de volume): \u00e9 corre\u00e7\u00e3o de inten\u00e7\u00e3o, n\u00e3o compra por popularidade |\n\n**O risco a vigiar \u00e9 o de-DE.** `karussell collage` **#22** era carregado por dois tokens de subtitle (`karussell` + `collage`); agora `collage` est\u00e1 a 1\u00d7 e a aposta impl\u00edcita \u00e9 que `Fotocollage` no name (7\u00d7) indexe `collage` por substring. **Essa hip\u00f3tese est\u00e1 medida em CJK, n\u00e3o em alem\u00e3o** \u2014 o pr\u00f3prio compositor a marcou como n\u00e3o testada e manteve `collage` nas keywords como ap\u00f3lice (8 chars que iam ficar ociosos). D7 tem que ler `karussell collage` #22 e `bildcollage` #207; se ca\u00edrem, o rollback \u00e9 devolver `Collage` ao subtitle.\n\n### (c) `\ub124\ucef7` no ko \u2014 o PARTIAL de maior risco do store\n\n`\ub124\ucef7 \ud504\ub808\uc784` \u00e9 o **layout de 4 quadros** (a tira `s-story-strip` existe live), n\u00e3o a cabine fotogr\u00e1fica. O veredito de fit \u00e9 **PARTIAL**: depende de o coreano que digita `\ub124\ucef7 \ud504\ub808\uc784` querer o layout e n\u00e3o a cabine. O termo de cabine ficou fora e tem o melhor n\u00famero do grupo \u2014 `\uc778\uc0dd\ub124\ucef7`, **pop 61 / diff 15** \u2014, derrubado por entrega: `grep countdown|photoBooth|selfTimer` = **0**. **Se ele quiser zero exposi\u00e7\u00e3o, cortar `\ub124\ucef7` custa 3 chars e nenhuma posi\u00e7\u00e3o** (o termo est\u00e1 OUT hoje).\n\n---\n\n## \ud83c\udf0d 3. Por locale \u2014 saiu, entrou, protegido\n\nToda popularidade desta itera\u00e7\u00e3o \u00e9 `astro-only` (**`pop n\u00e3o confi\u00e1vel`** \u2014 sem ASC search terms e sem Apple Ads; achado 14 da `research-2026-09-aso`). Consequ\u00eancia aplicada: **nenhum token novo entrou em name ou subtitle por volume**; as 3 mudan\u00e7as de subtitle s\u00e3o promo\u00e7\u00e3o de token com **posi\u00e7\u00e3o medida**. Auditoria linha a linha em `composition_rationale_*.md` e `protection_map_*.md`.\n\n**en-US** \u00b7 modo conservador (ordem dele: &quot;n\u00e3o mexe muito no americano&quot;), teto de 2 trocas, **1 usada**.\nSaiu `pictures` (9 chars, **0 posi\u00e7\u00f5es** \u2014 nenhuma das 20 composi\u00e7\u00f5es rankeadas o cita). Entrou `post`. Protegido: **20/20** composi\u00e7\u00f5es seguem cobertas; `panorama`+`carousel`+`scrapbook` do subtitle congelado entram em **11 das 20**. A 2\u00aa troca foi **recusada por n\u00famero** (\u00a75).\n\n**pt-BR** \u00b7 saiu `rosto` (MISMATCH, **0 posi\u00e7\u00f5es**) e `desenhar` (**0**). Entraram `montagem`, `criar`. Protegido: **48/48**; `instagram` (15 posi\u00e7\u00f5es), `fazer` (9), `scrapbook` (6), `mural` (5, 4 delas no top-3), `dividir`, `desfoque`, `recortes` todos no campo novo.\n\n**pt-PT** \u00b7 deixa de ser c\u00f3pia do pt-BR: **5 tokens de diferen\u00e7a**. Sa\u00edram `filtros` (**0**), `arte` (**0**) e \u2014 **trade-off declarado** \u2014 `mural` (**1** posi\u00e7\u00e3o: #26 num ranking de 173 apps, palavra brasileira ausente de todos os top-10 pt-PT medidos) e `rosto` (**2**: #120 `editor de rosto`, #184 `rosto`; MISMATCH, e pela r\u00e9gua de TTR do playbook #120/#184 valem ~0 instala\u00e7\u00e3o). Entraram `grelha`, `mosaico`, `criar`. Protegido: **63 de 65**.\n\n**es-ES** \u00b7 sa\u00edram `filtros` (**0**) e `marco` (**0**, existia pra fixar `polaroid`, que \u00e9 LOTTERY). Entraram `crear`, `scroll`. Protegido: **46/46**. `montaje` **n\u00e3o** saiu apesar de pedido no est\u00e1gio 4 \u2014 sustenta 7 posi\u00e7\u00f5es, a melhor #29.\n\n**es-MX** \u00b7 sa\u00edram `arte` (**0**), `filtros` (**0**) e \u2014 **trade-off declarado** \u2014 `pegatinas` (**1**: `hacer pegatinas` **#37**, MISMATCH: 8 pacotes de imagem + 16 emojis, sem export PNG com alpha; o SERP de `pegatinas` no mx \u00e9 teclado/iMessage/jogo, zero editores de foto). Entraram `scroll`, `crear`, `digital`. Protegido: **39 de 40**.\n\n**fr-FR** \u00b7 sa\u00edram `montage` (**0**; em fr \u00e9 edi\u00e7\u00e3o de v\u00eddeo, cluster mediana 53.514 ratings), `dessiner` (**0**) e `cadre` (**0**). Entraram `scroll`, `createur`, `faire`. Protegido: **33/33**, incluindo os dois **#2** de `creer`. 11 chars ociosos de prop\u00f3sito \u2014 com 27 ratings e 753 impress\u00f5es/36d o store n\u00e3o sustenta mais de 3 apostas.\n\n**de-DE** \u00b7 sa\u00edram `teilen` (**0**; em alem\u00e3o \u00e9 primeiro *compartilhar*), `rahmen` (**0**) e `zeichnen` (**0**). Entraram `post`, `digitales`, `scroll`; `collage` desceu do subtitle pras keywords. Protegido: **19/19**, as 8 do top-30 intactas. Anomalia a  SERP de **servi\u00e7o de impress\u00e3o** (CEWE 170505, Saal 8733, PosterXXL 5278) | a inten\u00e7\u00e3o \u00e9 encomendar um quadro, n\u00e3o renderizar imagem \u2014 contradiz o FIT de entrega |\n| heads gen\u00e9ricos: `scroll` solto (en-US), `grid`, `layout`, `efeitos`, `collage foto`, `modifica foto`, `bilder bearbeiten`, `montage photo`, `editor de fotos`, `\u6ee4\u955c`, `\u4fee\u56fe`, `\uc0ac\uc9c4\ud3b8\uc9d1`, `\u0444\u043e\u0442\u043e\u0440\u0435\u0434\u0430\u043a\u0442\u043e\u0440`, `fotograf duzenleme` | mediana de **10k a 456k** ratings no top-10; `grid` 120k; `scroll` 246 apps a ~15k; `\u6ee4\u955c` 456.607; `\u0444\u043e\u0442\u043e\u0440\u0435\u0434\u0430\u043a\u0442\u043e\u0440` 101.418 | sem alvo \u00fatil em 28 dias. Onde j\u00e1 estavam em campo, sa\u00edram como write-off (ru, tr) |\n| `no crop` (pop 46, o maior do tr) \u00b7 `tam foto\u011fraf` \u00b7 `square fit` | duas travas no c\u00f3digo: `ComposerRenderer.imageRect` \u00e9 aspect-**FILL** e o zoom \u00e9 clampado em `min(max(scale,1),4)` | \u00e9 fisicamente imposs\u00edvel caber a foto com faixas. MISMATCH |\n| 9-grid como corte: `\u4e5d\u5bab\u683c\u5207\u56fe`, `\u5207\u56fe`, `9 kare`, `griglia 9 foto`, `raster 9 bilder` | `CarouselRenderer` gera `stripSize` de **1 fileira**, nunca matriz 3\u00d73 | MISMATCH como corte; vira FIT como *layout* de 9 fotos quando a 1.10.0 estiver no ar |\n| `pared de fotos` \u00b7 `mural de fotos instagram` \u00b7 `muro di foto` \u00b7 `scrapbook num\u00e9rique` | DOMINATE de gra\u00e7a, mas 1 a 25 apps no \u00edndice e mediana 0-15 ratings | posi\u00e7\u00e3o garantida, volume nulo \u2014 SERP sem inten\u00e7\u00e3o |\n| 2\u00aa troca do en-US | `scroll` 246 apps / mediana ~15k \u00b7 `grid` 120k \u00b7 `polaroid` marca | **recusada por n\u00famero**: trocar um token morto por um bilhete de loteria custaria a janela de re-index de 3-7 dias no \u00fanico store com 59 instala\u00e7\u00f5es/30d e assinatura ativa |\n\nItens cort\u00e1veis a custo zero se ele quiser rigor m\u00e1ximo: `\u62cd\u7acb\u5f97\u98ce\u683c` no cn (\u22126 chars, 0 posi\u00e7\u00f5es; `\u62cd\u7acb\u5f97` \u00e9 substantivo comum em chin\u00eas \u2014 a marca transliterada \u00e9 `\u5b9d\u4e3d\u6765` \u2014 e j\u00e1 est\u00e1 na description LIVE) e `\ub124\ucef7` no ko (\u22123 chars, 0 posi\u00e7\u00f5es).\n\n---\n\n## \ud83d\udccf 6. Como vai ser medido\n\n&gt; **Se** os 13 campos entrarem como acima, **ent\u00e3o** as posi\u00e7\u00f5es da tabela \u00a74 se movem pros alvos D28 e as impress\u00f5es de busca sobem acima das 193/dia do US e das 964/dia do mundo, **porque** o gargalo medido \u00e9 impress\u00e3o (92% de 34.724 em 36 dias v\u00eam de busca) e n\u00e3o convers\u00e3o de p\u00e1gina (51,4% no US, n=278 page views).\n\n**D7 / D14 / D21 / D28 contados do `live_at`** \u2014 o dia em que a 1.10.0 ficar `READY_FOR_SALE`, **n\u00e3o** do dia do deploy do texto. A data depende da Apple e n\u00e3o est\u00e1 fixada aqui.\n\nO que o checkpoint l\u00ea: **posi\u00e7\u00e3o dos termos da \u00a74 no Astro** + **impress\u00f5es por territ\u00f3rio na ASC**. E a limita\u00e7\u00e3o sem rodeio: ele arrancou a trava do piso de tr\u00e1fego em 30/09 (&quot;pode arrancar essa trava, isso \u00e9 tentando renascer o app&quot;), ent\u00e3o **esta itera\u00e7\u00e3o n\u00e3o fecha com `results.final` de risco relativo e IC** \u2014 com 153 instala\u00e7\u00f5es 1F/30d no mundo (US 59) contra um piso de 100 por pa\u00eds, n\u00e3o existe amostra pra isso em 12 dos 13 locales. **Fechar com RR/IC seria inventar n\u00famero.** O fechamento \u00e9 por posi\u00e7\u00e3o + impress\u00e3o, e a leitura de instala\u00e7\u00e3o \u00e9 direcional.\n\nBaseline recomputado em **01/10** por causa do LEARNINGS #100 (o fix anterior testava prefixo e perdia a forma `F1`): o iPhotos s\u00f3 emite `1F`/`7F`/`3F`, ent\u00e3o **o n\u00famero n\u00e3o mudou** \u2014 **153 instala\u00e7\u00f5es 1F em 30 dias no mundo (US 59), 4.694 updates; 413 em 90 dias (US 197)**. Diferen\u00e7a vs o reportado antes: **+0**.\n\nCheckpoints:\n\n| checkpoint | o que decide |\n|---|---|\n| D7 | re-index entrou? `karussell collage` #22 e `bildcollage` #207 no de (rollback = devolver `Collage` ao subtitle) \u00b7 `\u8f6e\u64ad\u56fe\u7f16\u8f91\u5668` #30 e `\u5168\u666f` #177 no cn \u00b7 `panorama b\u00f6lme` **#3** no tr \u00b7 `\u0441\u043a\u0440\u0430\u043f\u0431\u0443\u043a\u0438\u043d\u0433` #56 no ru \u00b7 as 20 posi\u00e7\u00f5es do us intactas \u00b7 a anomalia `iphotos` OUT no de |\n| D14 | as apostas DOMINATE de SERP raso (`grelha de fotos`, `\u0444\u043e\u0442\u043e\u0441\u0435\u0442\u043a\u0438`, `\uc81c\uc791`, `\u62c6\u5206`, `kaydirmali`, `scroll` nos 5 latinos) entraram no alvo? |\n| D21 | impress\u00f5es de busca por territ\u00f3rio vs a janela de 36d do baseline |\n| D28 | posi\u00e7\u00e3o final vs a coluna **alvo D28** da \u00a74, termo por termo; e se o tap rate de ja/ko/zh-Hans/it continuar no ch\u00e3o, a conclus\u00e3o \u00e9 a decis\u00e3o (a), n\u00e3o a keyword |\n\n**CPP**: nenhum candidato a Custom Product Page foi medido nesta itera\u00e7\u00e3o (os 13 `serp_winnability_*.csv` n\u00e3o trazem a coluna), ent\u00e3o nenhum token foi vinculado a p\u00e1gina.\n\n---\n\n## \u26a0\ufe0f 7. Riscos operacionais\n\n1. **zh-Hans: os dois campos t\u00eam que ser aplicados juntos.** `\u8f6e\u64ad` e `\u5168\u666f` sa\u00edram do keyword field porque passaram a viver no subtitle novo. Se s\u00f3 o `keywords.txt` entrar, o store perde `\u8f6e\u64ad` (**6 posi\u00e7\u00f5es**) e `\u5168\u666f` (2 + o cluster) de uma vez. **O read-back do `deploy-verifier` tem que conferir subtitle E keywords nesse locale**, n\u00e3o um dos dois.\n2. **N\u00e3o \u00e9 PATCH num app no ar.** keywords vivem em `appStoreVersionLocalizations` e subtitle em `appInfoLocalizations` do appInfo `PREPARE_FOR_SUBMISSION`; hoje o app s\u00f3 tem a 1.9.0 `READY_FOR_SALE` e um \u00fanico appInfo `READY_FOR_SALE`. Exige a vers\u00e3o nova com build (short `30`, build `34`) e passa por review \u2014 logo o texto s\u00f3 come\u00e7a a contar do `live_at`, depois da aprova\u00e7\u00e3o.\n3. **Duas numera\u00e7\u00f5es paralelas no mesmo app.** A loja exibe 1.9.0, mas o bin\u00e1rio live carrega short version **29**. Pro 1.10.0, `MARKETING_VERSION` e `CURRENT_PROJECT_VERSION` precisam ser setados explicitamente (30 / 34) nos 4 pontos do pbxproj \u2014 errar aqui \u00e9 build recusado no ingest, n\u00e3o bug de ASO.\n4. **Janela de re-index de 3-7 dias.** No en-US, 13 dos 15 tokens ficaram parados de prop\u00f3sito: o churn est\u00e1 concentrado nos 12 locales sem funil a proteger.\n5. **de-DE perdeu peso em `collage`** (3\u00d7 \u2192 1\u00d7). Risco de uma posi\u00e7\u00e3o top-30; mitiga\u00e7\u00e3o j\u00e1 aplicada (token mantido nas keywords) e rollback barato (devolver `Collage` ao subtitle no lugar de `Erstellen`).\n6. **es-MX perdeu `hacer pegatinas` #37** por entrega inexistente, e `difuminar` caiu de 3\u00d7 para 1\u00d7 (5 posi\u00e7\u00f5es, a melhor #41, enfraquecem). Custo declarado e aprovado no est\u00e1gio 4.\n7. **`\u0434\u043b\u044f` no ru (4 chars)**: se a Apple tratar preposi\u00e7\u00e3o como stopword, s\u00e3o 4 chars mortos. \u00c9 o primeiro corte do ru se algum char fizer falta.\n8. **O risco maior n\u00e3o \u00e9 de keyword.** `tr` tem **3,86 em 7 ratings** \u2014 abaixo do penhasco de 4,0 do playbook \u2014 com 1.627 impress\u00f5es e 0,55% de tap. Ranquear mais ali amplifica um funil que j\u00e1 prova n\u00e3o converter: a alavanca do tr \u00e9 nota + tradu\u00e7\u00e3o, e por isso l\u00e1 s\u00f3 foi feito o que \u00e9 quase gr\u00e1tis (dedup de 23 chars + write-off de 19).\n" + '</pre>';</script></div></section>

<script>window.STATIC_TREE = [{"id": "version", "name": "iPhotos 1.10.0", "groups": [{"name": "iPhone 6.9\" (APP_IPHONE_67)", "locales": [{"code": "en-US", "label": "English (U.S.)", "flag": "US", "shots": [{"name": "01 Filters", "file": "01_01_filters_iphone.png", "dir": "", "url": "img/009.jpg"}, {"name": "02 Collage", "file": "02_02_collage_iphone.png", "dir": "", "url": "img/010.jpg"}, {"name": "03 Retouch", "file": "03_03_retouch_iphone.png", "dir": "", "url": "img/011.jpg"}, {"name": "04 Stickers", "file": "04_04_stickers_iphone.png", "dir": "", "url": "img/012.jpg"}, {"name": "05 Blur", "file": "05_05_blur_iphone.png", "dir": "", "url": "img/013.jpg"}]}], "count": 5}, {"name": "iPad 12.9\" (3rd gen)", "locales": [{"code": "en-US", "label": "English (U.S.)", "flag": "US", "shots": [{"name": "995 1X Shots So", "file": "01_995_1x_shots_so.png", "dir": "", "url": "img/001.jpg"}, {"name": "875 1X Shots So", "file": "02_875_1x_shots_so.png", "dir": "", "url": "img/002.jpg"}, {"name": "112 1X Shots So", "file": "03_112_1x_shots_so.png", "dir": "", "url": "img/003.jpg"}]}], "count": 3}, {"name": "iPhone 5.5\"", "locales": [{"code": "en-US", "label": "English (U.S.)", "flag": "US", "shots": [{"name": "Model 40", "file": "01_Model 40.png", "dir": "", "url": "img/004.jpg"}, {"name": "Model 39", "file": "02_Model 39.png", "dir": "", "url": "img/005.jpg"}, {"name": "Model 41", "file": "03_Model 41.png", "dir": "", "url": "img/006.jpg"}, {"name": "Model 38", "file": "04_Model 38.png", "dir": "", "url": "img/007.jpg"}, {"name": "Model 42", "file": "05_Model 42.png", "dir": "", "url": "img/008.jpg"}]}], "count": 5}]}];</script>
<script>
let TREE = [];
let srcIdx = 0;
let curLang = null;          // single language applied to all sections
let live = true, timer = null;
let lastSig = null;          // signature of last-rendered tree (skip no-op re-renders)

function deepLinkApp() { return new URLSearchParams(location.search).get("app"); }

async function load(preserve = true) {
  let data;
  try { data = window.STATIC_TREE; }
  catch (e) { return; }
  // Skip re-render when the polled tree is identical — keeps horizontal
  // scroll position from resetting every 4s.
  const sig = JSON.stringify(data);
  if (preserve && sig === lastSig) return;
  lastSig = sig;
  TREE = data;
  if (!preserve) {
    const want = deepLinkApp();
    const idx = TREE.findIndex(s => s.id === want);
    if (idx >= 0) srcIdx = idx;
  }
  buildSourceSelect();
  const langs = allLangs();
  // Prefer en-US as the initial language when present (falls back to first available).
  if (!preserve || !langs.includes(curLang)) {
    curLang = langs.includes("en-US") ? "en-US" : (langs[0] || null);
  }
  render();
}

function currentSrc() { return TREE[srcIdx] || { groups: [] }; }

// Union of real locales across all groups (ignores "_all" flat folders),
// in first-seen order. Falls back to ["_all"] when nothing is localized.
function allLangs() {
  const seen = new Set(), out = [];
  currentSrc().groups.forEach(g => g.locales.forEach(l => {
    if (l.code !== "_all" && !seen.has(l.code)) { seen.add(l.code); out.push(l.code); }
  }));
  return out.length ? out : ["_all"];
}

// Locale shown for a group given the selected language: exact match,
// else the group's flat "_all" folder (shows in any language).
function localeFor(g, code) {
  return g.locales.find(l => l.code === code) || g.locales.find(l => l.code === "_all");
}

function langLabel(code) {
  if (code === "_all") return "Todos";
  for (const g of currentSrc().groups)
    for (const l of g.locales) if (l.code === code) return l.label;
  return code;
}

function buildSourceSelect() {
  const s = document.getElementById("srcSel");
  s.innerHTML = "";
  TREE.forEach((src, i) => {
    const o = document.createElement("option");
    o.value = i; o.textContent = src.name; s.appendChild(o);
  });
  s.style.display = TREE.length > 1 ? "" : "none";
  s.value = srcIdx;
}

function deviceLabel(shots) {
  const f = shots.map(s => s.file.toLowerCase()).join(" ");
  if (/69|6\.9/.test(f)) return 'iPhone 6.9" Display';
  if (/67|6\.7/.test(f)) return 'iPhone 6.7" Display';
  if (/65|6\.5/.test(f)) return 'iPhone 6.5" Display';
  if (/ipad/.test(f)) return 'iPad Display';
  return 'iPhone Display';
}

function render() {
  const wrap = document.getElementById("wrap");
  const src = currentSrc();
  if (!src.groups.length) {
    wrap.innerHTML = `<div class="empty">Sem imagens ainda.<br>Gere os prints — aparecem aqui no ao vivo.</div>`;
    return;
  }
  const langs = allLangs();

  // Floating language picker (lives outside .wrap so it isn't rebuilt away).
  const float = document.getElementById("langFloat");
  const ls = document.getElementById("langSel");
  const onlyAll = langs.length === 1 && langs[0] === "_all";
  float.hidden = onlyAll;
  if (!onlyAll) {
    ls.innerHTML = langs.map(c =>
      `<option value="${c}" ${c === curLang ? "selected" : ""}>${langLabel(c)}</option>`).join("");
    ls.onchange = e => { curLang = e.target.value; render(); };
  }

  // One section card per group (treatment), all stacked in a list.
  const sections = src.groups.map(g => {
    const l = localeFor(g, curLang);
    let strip = `<div class="empty">Sem imagens nesse idioma.</div>`;
    if (l && l.shots.length) {
      strip = `<div class="strip">` + l.shots.map((s, i) =>
        `<div class="shot" draggable="false" data-file="${s.file}" data-dir="${s.dir || ""}">
           <img loading="lazy" src="${s.url}" alt="${s.name}" data-url="${s.url}">
           <div class="idx">${i + 1}</div>
           <div class="fn">${s.file}</div>
         </div>`).join("") + `</div>`;
    }
    return `
      <div class="card">
        <div class="card-top">
          <h2>${g.name}</h2>
          <span class="dev active">${l ? deviceLabel(l.shots) : "iPhone"}</span>
        </div>
        <p class="reorder">${l ? l.shots.length : 0} capturas · clique pra ampliar</p>
        ${strip}
      </div>`;
  }).join("");

  wrap.innerHTML = `
    <div class="vhead">
      <h1>${src.name}</h1>
      <span class="status"><span class="s-dot"></span>Relatório de versão</span>
    </div>
    <p class="vsub">${src.groups.length} conjunto(s) · prints da versão, estilo App Store Connect</p>
    ${sections}`;

  wrap.querySelectorAll(".shot img").forEach(im => im.onclick = () => openLb(im.dataset.url));
  wireDrag();
}

// MARK: - Drag-to-reorder (persists via POST /api/reorder -> order.json)
let dragging = false;

function wireDrag() {
  document.querySelectorAll(".strip").forEach(strip => {
    let dragged = null;
    strip.querySelectorAll(".shot").forEach(shot => {
      shot.addEventListener("dragstart", () => {
        dragged = shot; dragging = true;
        shot.classList.add("dragging");
      });
      shot.addEventListener("dragend", async () => {
        shot.classList.remove("dragging");
        strip.querySelectorAll(".dragover").forEach(x => x.classList.remove("dragover"));
        dragging = false;
        await persistOrder(strip);
      });
      shot.addEventListener("dragover", e => {
        e.preventDefault();
        if (!dragged || dragged === shot || dragged.parentElement !== strip) return;
        shot.classList.add("dragover");
        const kids = [...strip.querySelectorAll(".shot")];
        if (kids.indexOf(dragged) < kids.indexOf(shot)) shot.after(dragged);
        else shot.before(dragged);
      });
      shot.addEventListener("dragleave", () => shot.classList.remove("dragover"));
    });
  });
}

async function persistOrder(strip) {
  const shots = [...strip.querySelectorAll(".shot")];
  const dir = shots[0] && shots[0].dataset.dir;
  if (!dir) return;
  // Only files that live in the SAME dir can be reordered together.
  const order = shots.filter(s => s.dataset.dir === dir).map(s => s.dataset.file);
  shots.forEach((s, i) => { const idx = s.querySelector(".idx"); if (idx) idx.textContent = i + 1; });
  try {
    await fetch("/api/reorder", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ app: currentSrc().id, dir, order }),
    });
  } catch (e) { /* server offline — order stays visual only */ }
  lastSig = null;  // force next poll to re-render with the persisted order
}

function openLb(url) {
  document.getElementById("lbImg").src = url;
  document.getElementById("lb").classList.add("on");
}

document.getElementById("lb").onclick = () => document.getElementById("lb").classList.remove("on");
document.getElementById("srcSel").onchange = e => { srcIdx = +e.target.value; pickDefault(); render(); };
document.getElementById("refreshBtn").onclick = () => load(true);
document.getElementById("liveBtn").onclick = () => {
  live = !live;
  document.getElementById("liveBtn").textContent = live ? "pausar" : "ao vivo";
  document.getElementById("dot").classList.toggle("on", live);
  document.getElementById("liveTxt").textContent = live ? "ao vivo" : "pausado";
  if (live) startTimer(); else clearInterval(timer);
};
function startTimer() { return; clearInterval(timer); timer = setInterval(() => live && !dragging && load(true), 4000); }

load(false);
startTimer();
</script>

<script>
(function () {
  const ids = ["resumo", "prints", "aso"];
  function show(id) {
    if (!ids.includes(id)) id = ids[0];
    ids.forEach(t => {
      document.getElementById("tab-" + t).hidden = t !== id;
      document.getElementById("btn-" + t).classList.toggle("on", t === id);
    });
    // The locale picker belongs to the prints viewer only.
    document.getElementById("langFloat").style.visibility = id === "prints" ? "" : "hidden";
    history.replaceState(null, "", "#" + id);
  }
  ids.forEach(t => document.getElementById("btn-" + t).onclick = () => show(t));
  show(location.hash.slice(1));
})();
</script>
