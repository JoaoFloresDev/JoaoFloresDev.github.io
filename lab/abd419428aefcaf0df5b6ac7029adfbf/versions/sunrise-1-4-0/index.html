<style>
  :root {
    --bg: #f5f5f7; --panel: #ffffff; --line: #d2d2d7; --line-soft: #e8e8ed;
    --ink: #1d1d1f; --sub: #6e6e73; --blue: #0066cc; --blue-bg: #e8f1fd;
    --shadow: rgba(0,0,0,.08); --green: #34c759; --yellow: #ff9f0a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font: 14px/1.45 -apple-system, "SF Pro Text", "Helvetica Neue", "Segoe UI", Roboto, sans-serif;
    color: var(--ink); background: var(--bg); height: 100vh;
    display: grid; grid-template-rows: 48px 1fr;
  }

  /* Global top bar (ASC white header) */
  .topbar {
    background: var(--panel); border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 12px; padding: 0 20px;
  }
  .topbar .wm { font-weight: 600; color: var(--ink); }
  .topbar .wm span { color: var(--sub); font-weight: 400; }
  .topbar .spacer { flex: 1; }
  .topbar select, .topbar button {
    background: var(--panel); color: var(--ink); border: 1px solid var(--line);
    border-radius: 7px; padding: 6px 11px; font-size: 13px; cursor: pointer;
  }
  .topbar button:hover, .topbar select:hover { background: #f5f5f7; }
  .topbar .live { display: flex; align-items: center; gap: 6px; color: var(--sub); font-size: 12px; }
  .topbar .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); }
  .topbar .dot.on { animation: pulse 1.6s infinite; }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(52,199,89,.5)} 70%{box-shadow:0 0 0 7px rgba(52,199,89,0)} 100%{box-shadow:0 0 0 0 rgba(52,199,89,0)} }

  /* Main scroll area */
  .main { overflow-y: auto; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 26px 28px 80px; }

  /* Version header */
  .vhead { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
  .vhead .spacer-h { flex: 1; }
  .vhead h1 { font-size: 26px; font-weight: 600; margin: 0; }
  .status { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; color: var(--sub); }
  .status .s-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--yellow); }
  .vsub { color: var(--sub); margin: 0 0 22px; font-size: 13px; }

  /* Treatment tabs (PPO-style) */
  .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 24px; flex-wrap: wrap; }
  .tab {
    padding: 11px 18px; font-size: 14px; color: var(--sub); cursor: pointer;

    -webkit-appearance: none; appearance: none; cursor: pointer; min-width: 190px;
  }

  .langfloat {
    position: fixed; top: 62px; right: 26px; z-index: 30;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    box-shadow: 0 6px 20px rgba(0,0,0,.14); padding: 9px 12px;
    display: flex; align-items: center; gap: 9px;
  }
  .langfloat label { color: var(--sub); font-size: 12px; font-weight: 500; }

    border: 1px solid var(--line); border-radius: 8px; padding: 7px 30px 7px 12px; font-size: 13px;

  }
  .langfloat[hidden] { display: none; }

  /* Device size pills */
  .devbar { display: flex; gap: 8px; margin: 16px 0 20px; flex-wrap: wrap; }
  .dev {
    font-size: 13px; color: var(--sub); padding: 7px 14px; border-radius: 18px;
    border: 1px solid var(--line); background: var(--panel);
  }
  .dev.active { color: var(--blue); border-color: var(--blue); background: var(--blue-bg); font-weight: 500; }
  .reorder { color: var(--sub); font-size: 12px; margin: 0 0 14px; }

  /* Screenshot strip (raw images, ASC style) */
  .strip { display: flex; gap: 16px; overflow-x: auto; padding-bottom: 12px; }
  .shot { flex: 0 0 auto; position: relative; cursor: grab; }
  .shot.dragging { opacity: .35; }
  .shot.dragover img { outline: 3px solid var(--blue); outline-offset: 2px; }
  .shot img {
    height: 380px; display: block; border-radius: 14px; border: 1px solid var(--line);

  .shot img:hover { transform: translateY(-2px); }
  .shot .idx {
    position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,.55); color: #fff;
    font-size: 11px; font-weight: 600; border-radius: 6px; padding: 2px 7px; backdrop-filter: blur(2px);

  .empty { color: var(--sub); padding: 70px 0; text-align: center; }

  /* Lightbox */
  .lb { position: fixed; inset: 0; background: rgba(0,0,0,.85); display: none; align-items: center; justify-content: center; z-index: 50; cursor: zoom-out; }
  .lb.on { display: flex; }
  .lb img { max-width: 92vw; max-height: 92vh; border-radius: 14px; box-shadow: 0 20px 60px rgba(0,0,0,.5); }

  </main></section><section class="tab" id="tab-aso" hidden><div class="vr vr-end"><div class="md" id="vr-aso-0"></div><script>document.getElementById("vr-aso-0").innerHTML = window.marked ? marked.parse("# Sunrise Alarm Clock \u00b7 iter-01 (27/09) \u00b7 en-US \u00b7 pt-BR \u00b7 es-ES \u00b7 es-MX: s\u00f3 keywords\n\n## \ud83d\udcc4 Resultado final\n\n### \ud83c\uddfa\ud83c\uddf8 en-US\n\n| Campo | Antes (no ar) | Depois (aplicado) |\n| --- | --- | --- |\n| title | Sunrise Alarm Clock: Wake Up (28) | Sunrise Alarm Clock: Wake Up (28) |\n| subtitle | Gentle Light, Heavy Sleepers (28) | Gentle Light, Heavy Sleepers (28) |\n| keywords | mission,math,puzzle,snooze,loud,sounds,dawn,sun,lamp,morning,<span style=\"color:#dc3545\">routine</span>,sleep,cycle,<span style=\"color:#dc3545\">tracker</span>,smart (94) | <span style=\"color:#28a745\">gently</span>,<span style=\"color:#28a745\">sunlight</span>,<span style=\"color:#28a745\">fast</span>,mission,math,puzzle,snooze,loud,sounds,dawn,sun,lamp,morning,sleep,cycle,smart (99) |\n\n**Por qu\u00ea:**\n- <span style=\"color:#28a745\">`gently`</span>: `wake up gently` (pop 5 / diff 17) est\u00e1 **#13** \u2192 alvo **#1-3** at\u00e9 D28 (SERP: Wonderwake 665 ratings, Clock \u2013 Wake Up Gently 402). Risco: pop 5 \u00e9 o piso do Astro, ent\u00e3o o volume real \u00e9 incerto.\n- <span style=\"color:#28a745\">`sunlight`</span>: `sunlight alarm` (pop 5 / diff 11) est\u00e1 #38 \u2192 alvo **#5-10** (SERP: Light Alarm 73, Glow Alarm 37, Sunlight Alarm 0).\n- <span style=\"color:#28a745\">`fast`</span>: `wake up fast` (pop 5 / diff 13) est\u00e1 #172 \u2192 alvo **#5-10** (SERP: WAKE UP: stop snoozing 75, Wake Me Up 165). \u00c9 a aposta mais fraca das tr\u00eas e a primeira a cortar se voc\u00ea quiser s\u00f3 2 apostas; a\u00ed o campo fica com 94.\n- <span style=\"color:#dc3545\">`routine`</span>: `morning routine` (pop 9 / diff 57) est\u00e1 OUT e continua sem chance (LOTTERY, SERP de habit trackers com 17.970 ratings). Ne az o prompt nativo. O checkpoint acompanha o delta de ratings junto das m\u00e9tricas, e o iter-02 (subtitle, mais agressivo) s\u00f3 roda com pelo menos 10 avalia\u00e7\u00f5es.\n2. **Atribui\u00e7\u00e3o confundida:** a 1.4.0 muda prints, prompt de review e keywords ao mesmo tempo. *Mitiga\u00e7\u00e3o:* o sinal atribu\u00edvel \u00e9 o **rank por termo no Astro**, porque prints n\u00e3o mexem em indexa\u00e7\u00e3o. O efeito em downloads fica declarado como conjunto.\n3. **`sounds` fica ao lado de um MISMATCH:** `sleep sounds` n\u00e3o descreve o app (n\u00e3o tem ru\u00eddo branco). *Mitiga\u00e7\u00e3o:* o token protege `sunrise alarm clock sounds` #42, e \"alarm sounds\" \u00e9 verdade no app. Revisar no iter-02 se #42 cair para al\u00e9m de #60.\n4. **`fast` \u00e9 a aposta mais fraca (#172):** pode n\u00e3o entrar no top 30. *Mitiga\u00e7\u00e3o:* se n\u00e3o passar de #100 no D14, trocar por um token FIT DOMINATE (por exemplo `wakeup`, que est\u00e1 #27 e precisa desse token) com 1 PATCH.\n5. **Os baselines n\u00e3o batem:** o dashboard do lab mostra cerca de **131 instala\u00e7\u00f5es/30d**, e o split s\u00f3 de instala\u00e7\u00f5es do est\u00e1gio 1 mostra **229/30d** (us 15 \u00b7 br 15 \u00b7 es 26 \u00b7 mx 1). As duas s\u00e9ries dizem ser product type 1*. *Mitiga\u00e7\u00e3o:* os targets usam a s\u00e9rie do est\u00e1gio 1 (a mesma que o `pull_data`/Sales Report por SKU devolve). No D7 as duas s\u00e9ries t\u00eam que ser conciliadas antes de qualquer veredito.\n6. **N\u00e3o h\u00e1 volume real por query:** o Search Terms report n\u00e3o existe na ASC deste app. O que existe \u00e9 agregado: 3.274 impress\u00f5es de busca e 11 taps de busca entre 01/08 e 14/09. *Mitiga\u00e7\u00e3o:* medir impress\u00f5es por store no Discovery & Engagement semanal, e usar rank no Astro como proxy.\n7. **A amostra \u00e9 pequena:** US+BR+ES+MX somaram 57 instala\u00e7\u00f5es em 30 dias, ent\u00e3o \u00b130% \u00e9 ru\u00eddo semanal. *Mitiga\u00e7\u00e3o:* o rollback de downloads usa janela de 14 dias. Para os 7 primeiros dias, o sinal que vale \u00e9 posi\u00e7\u00e3o.\n8. **A description diverge do app** (texto \u00e9 decis\u00e3o sua, n\u00e3o entra aqui):\n   - A description diz janela inteligente \"up to 30 min\", mas o app oferece de 15 a 60 min.\n   - Diz \"take a few steps to turn the alarm off\", mas os passos s\u00f3 existem no check depois de desligar o alarme.\n   - Existe uma string \"Sync with Apple Health\" que nunca aparece no app.\n   Diverg\u00eancia entre loja e app \u00e9 risco de avalia\u00e7\u00e3o ruim, justamente o que o app n\u00e3o tem margem para absorver.\n\n---\n\n## \ud83d\udcc8 Proje\u00e7\u00e3o\n\nBaseline: 4 stores (US+BR+ES+MX) = **1,9 instala\u00e7\u00f5es/dia** (57/30d, s\u00e9rie do est\u00e1gio 1, s\u00f3 1*). O app inteiro faz **7,6/dia** nessa s\u00e9rie (229/30d) ou cerca de **4,4/dia** no dashboard (131/30d). Impress\u00f5es de busca: cerca de 73/dia (3.274 em 45 dias). Heur\u00edstica do playbook \u00a77: keywords 1\u00d7 \u2248 +10 a 30% de rank, e o rank se move antes dos downloads.\n\n| Cen\u00e1rio | Termos novos no top 10 (de 5) | Impress\u00f5es de busca/dia (4 stores) | Instala\u00e7\u00f5es/dia (4 stores) |\n| --- | --- | --- | --- |\n| pessimista | 0-1 | 73 \u2192 75 (+3%) | 1,9 \u2192 1,9 |\n| realista | 3 | 73 \u2192 84 (+15%) | 1,9 \u2192 2,3 |\n| otimista (com efeito dos prints e ratings da 1.4.0) | 5 | 73 \u2192 102 (+40%) | 1,9 \u2192 2,8 |\n\n- Chance de chegar no **conservador** (2,3/dia): **~45%**. Chance de chegar no **bold** (2,8/dia, meta oficial): **~20%**.\n- Curva realista, instala\u00e7\u00f5es/dia nos 4 stores, D0 \u2192 D28: `1,9 \u2581 D7 1,9 \u2581 D14 2,1 \u2583 D21 2,2 \u2585 D28 2,3 \u2586`\n\n| Checkpoint | Sucesso | Falha |\n| --- | --- | --- |\n| D7 | `gently`, `sunlight`, `anti` e `reto` indexados (termos com rank). `wake up gently` \u2264 #10. Nenhuma posi\u00e7\u00e3o protegida do top 10 cai mais de 5. Baselines conciliados. | Termo novo sem O checkpoint acompanha o delta de ratings junto das m\u00e9tricas, e o iter-02 (subtitle, mais agressivo) s\u00f3 roda com pelo menos 10 avalia\u00e7\u00f5es.\n2. **Atribui\u00e7\u00e3o confundida:** a 1.4.0 muda prints, prompt de review e keywords ao mesmo tempo. *Mitiga\u00e7\u00e3o:* o sinal atribu\u00edvel \u00e9 o **rank por termo no Astro**, porque prints n\u00e3o mexem em indexa\u00e7\u00e3o. O efeito em downloads fica declarado como conjunto.\n3. **`sounds` fica ao lado de um MISMATCH:** `sleep sounds` n\u00e3o descreve o app (n\u00e3o tem ru\u00eddo branco). *Mitiga\u00e7\u00e3o:* o token protege `sunrise alarm clock sounds` #42, e &quot;alarm sounds&quot; \u00e9 verdade no app. Revisar no iter-02 se #42 cair para al\u00e9m de #60.\n4. **`fast` \u00e9 a aposta mais fraca (#172):** pode n\u00e3o entrar no top 30. *Mitiga\u00e7\u00e3o:* se n\u00e3o passar de #100 no D14, trocar por um token FIT DOMINATE (por exemplo `wakeup`, que est\u00e1 #27 e precisa desse token) com 1 PATCH.\n5. **Os baselines n\u00e3o batem:** o dashboard do lab mostra cerca de **131 instala\u00e7\u00f5es/30d**, e o split s\u00f3 de instala\u00e7\u00f5es do est\u00e1gio 1 mostra **229/30d** (us 15 \u00b7 br 15 \u00b7 es 26 \u00b7 mx 1). As duas s\u00e9ries dizem ser product type 1*. *Mitiga\u00e7\u00e3o:* os targets usam a s\u00e9rie do est\u00e1gio 1 (a mesma que o `pull_data`/Sales Report por SKU devolve). No D7 as duas s\u00e9ries t\u00eam que ser conciliadas antes de qualquer veredito.\n6. **N\u00e3o h\u00e1 volume real por query:** o Search Terms report n\u00e3o existe na ASC deste app. O que existe \u00e9 agregado: 3.274 impress\u00f5es de busca e 11 taps de busca entre 01/08 e 14/09. *Mitiga\u00e7\u00e3o:* medir impress\u00f5es por store no Discovery &amp; Engagement semanal, e usar rank no Astro como proxy.\n7. **A amostra \u00e9 pequena:** US+BR+ES+MX somaram 57 instala\u00e7\u00f5es em 30 dias, ent\u00e3o \u00b130% \u00e9 ru\u00eddo semanal. *Mitiga\u00e7\u00e3o:* o rollback de  Termo novo sem rank depois de 7 dias no ar. `acordar com luz`, `despertar con luz` ou `sunrise alarm clock` (BR/ES) fora do top 10. |\n| D14 | 3 dos 5 termos-alvo \u2264 #10. Impress\u00f5es de busca +10% contra as 2 semanas antes. Primeiras avalia\u00e7\u00f5es pelo prompt nativo. | `fast` &gt; #100 (trocar o token). Impress\u00f5es \u2264 baseline. |\n| D21 | `wake up gently` \u2264 #5. `anti soneca` e `alarma con reto` \u2264 #10. Instala\u00e7\u00f5es nos 4 stores \u2265 2,1/dia (14d). | Instala\u00e7\u00f5es &lt; 1,6/dia sustentadas por 14 dias. |\n| D28 | Instala\u00e7\u00f5es \u2265 2,3/dia (conservador) e ratings \u2265 5. Veredito, e se passar abre o iter-02 (subtitle). | &lt; 1,9/dia. A\u00ed a pr\u00f3xima alavanca \u00e9 convers\u00e3o (CPP-1/2) e ratings, n\u00e3o texto. |\n\n---\n\n## \ud83c\udfb2 Confidence breakdown\n\n| Premissa cr\u00edtica | Confian\u00e7a | Impacto se falhar |\n| --- | --- | --- |\n| Os tokens novos indexam em at\u00e9 7 dias depois da 1.4.0 ir ao ar | 90% | Atrasa todos os checkpoints em 1 semana |\n| Nenhuma posi\u00e7\u00e3o protegida cai por causa da troca (o mapa est\u00e1 100% coberto) | 90% | Perda de #2 a #9 em BR/ES/MX, que carregam as impress\u00f5es |\n| Os termos DOMINATE pop 5 chegam ao top 10 (SERP fraco) | 65% | Ganho de rank sem ganho de download |\n| Pop 5 corresponde a volume real maior que zero | 40% | O realista vira o pessimista, mesmo com o rank batendo |\n| O prompt nativo gera \u2265 5 avalia\u00e7\u00f5es at\u00e9 D28 | 45% | CVR continua travado, e o bold fica fora de alcance |\n| A s\u00e9rie de baseline do est\u00e1gio 1 (229/30d) \u00e9 a correta | 60% | Os targets absolutos mudam, mas os deltas % continuam valendo |\n" + '</pre>';</script><div class="md" id="vr-aso-1"></div><script>document.getElementById("vr-aso-1").innerHTML = window.marked ? marked.parse("# Sunrise Alarm Clock \u00b7 iter-02 \u00b7 fr-FR + de-DE (os 2 locales extras da regra dos 5; en-US/es-ES/pt-BR est\u00e3o na iter-01, mesma v langschlafer opcional, recomendado N\u00c3O aplicar\n```\n\n---\n\n## \ud83c\udfaf Hip\u00f3tese formal\n\n&gt; **If** o keywords do fr-FR trocar `suivi` por `defis` + `leger` (93 \u2192 99 chars), com name/subtitle intocados e o de-DE sem mudan\u00e7a,\n&gt; **then** at\u00e9 D28: pelo menos 3 das 5 composi\u00e7\u00f5es-alvo (`r\u00e9veil avec d\u00e9fis`, `r\u00e9veil \u00e0 d\u00e9fis`, `r\u00e9veil d\u00e9fis`, `r\u00e9veil l\u00e9ger`, `r\u00e9veil sommeil l\u00e9ger`) no top 10; impress\u00f5es de busca FR de 5,2 para \u2265 5,7/dia (+10%); nenhuma posi\u00e7\u00e3o protegida do top 10 FR sai do top 10; instala\u00e7\u00f5es FR \u2265 1,17/dia,\n&gt; **because** (a) as 5 composi\u00e7\u00f5es s\u00e3o FIT (F1 miss\u00f5es, F4 rampa, F5 janela inteligente) e as SERPs t\u00eam 5-9 apps com top 3 de 0-11 ratings, onde um app com 0 ratings compete; (b) `suivi` n\u00e3o protege nenhuma posi\u00e7\u00e3o e o \u00fanico alvo dele (`suivi de sommeil`, pop 26) \u00e9 LOTTERY contra apps com 4k-38k ratings; (c) todas as 80 composi\u00e7\u00f5es FR rankeadas mant\u00eam os tokens; (d) playbook \u00a77: token novo no campo 1\u00d7 move rank em dias, antes de mover downloads. Como o volume \u00e9 astro-only, o ganho em impress\u00f5es \u00e9 incerto.\n\n---\n\n## \u26a0\ufe0f Riscos\n\n1. **Pop n\u00e3o confi\u00e1vel.** As 5 composi\u00e7\u00f5es-alvo t\u00eam pop 5 (piso do Astro) e n\u00e3o h\u00e1 search terms nem Apple Ads pra confirmar volume. Mitiga\u00e7\u00e3o: o crit\u00e9rio prim\u00e1rio \u00e9 rank. O veredito de impress\u00f5es fica pro D28, e sem impress\u00e3o nova as duas apostas viram `anti`/`soleil` na pr\u00f3xima itera\u00e7\u00e3o.\n2. **Efeito conjunto com os prints da 1.4.0.** Downloads FR n\u00e3o isolam o texto. Mitiga\u00e7\u00e3o: o DE, sem mudan\u00e7a de texto, \u00e9 o controle. O `pull_analytics.py final` compara o RR de FR contra DE e contra a mediana dos apps quietos.\n3. **Tend\u00eancia FR j\u00e1 em queda.** O semanal FR foi 5 \u2192 **16** \u2192 8 \u2192 5 (pico em 07-13/09); o DE subiu 1 \u2192 4 \u2192 8 \u2192 9. Uma janela de 30 dias com o pico dentro pode mostrar queda que n\u00e3o vem do texto. Mitiga\u00e7\u00e3o: ler o FR sempre contra o DE e contra os outros pa\u00edses, nunca sozinho.\n4. **`tot`/`reveiller` sem acento.** `se r\u00e9veiller t\u00f4t` #5, `se lever t\u00f4t` #7 e `r\u00e9veil t\u00f4t` #15 dependem desses tokens. O mapa j\u00e1 os registra sem acento e o `langschlafer` #7 prova a normaliza\u00e7\u00e3o. Mitiga\u00e7\u00e3o: se qualquer um cair mais de 5 posi\u00e7\u00f5es no D7, o acento volta em 1 PATCH.\n5. **Busca FR \u00e9 minoria das instala\u00e7\u00f5es FR.** Foram 198 impress\u00f5es de busca em 38 dias contra 87 taps de browse e 45 page views de referrer. O texto s\u00f3 mexe na fatia de busca. Mitiga\u00e7\u00e3o: targets de download modestos, e o sucesso \u00e9 medido primeiro em rank e impress\u00f5es.\n6. **de-DE abaixo do piso (29/30).** Composi\u00e7\u00e3o de texto aqui mediria nada. Mitiga\u00e7\u00e3o: n\u00e3o aplicar a normaliza\u00e7\u00e3o, e o DE vira controle.\n7. **Mesma vers\u00e3o que a iter-01.** Texto de en-US/pt-BR/es-ES/es-MX e de fr-FR entram no mesmo D0. Mitiga\u00e7\u00e3o: os pa\u00edses-alvo n\u00e3o se sobrep\u00f5em (FR aqui; US/BR/ES/MX l\u00e1). BE e CH leem fr-FR como secund\u00e1rio e ficam fora do alvo.\n\n---\n\n## \ud83d\udcc8 Proje\u00e7\u00e3o\n\nBaseline FR: 5,2 impress\u00f5es de busca/dia (198 entre 21/08 e 27/09) e 1,17 instala\u00e7\u00e3o/dia (35 em 30 dias).\n\n| Cen\u00e1rio | Prob. | Composi\u00e7\u00f5es-alvo no top 10 (D28) | Impress\u00f5es busca FR/dia | Installs FR/dia |\n|---|---|---|---|---|\n| pessimista | 30% | 0-2 de 5 | 5,2 (0%) | 0,9 (queda do pico de setembro continua) |\n| realista | 50% | 3-4 de 5 | 6,5 (+25%) | 1,2 (+3%, dentro do ru\u00eddo) |\n| otimista | 20% | 5 de 5, \u2265 3 no top 5 | 8,0 (+55%) | 1,5 (+28%) |\n\n**Probabilidades:** chance de bater o conservador \u2248 **50%**; de bater o bold \u2248 **20%**.\n\n**D0-D28 (realista):**\n```\nrank r\u00e9veil avec d\u00e9fis   OUT \u2581  D3 #12 \u2583  D7 #6 \u2585  D14 #4 \u2586  D21 #3 \u2587  D28 #3 \u2587\nimpress\u00f5es busca FR/dia  5,2 \u2583  D7 5,4 \u2583  D14 5,9 \u2584  D21 6,2 \u2585  D28 6,5 \u2586\ninstalls FR/dia          1,17 \u2585 D7 1,1 \u2585  D14 1,1 \u2585  D21 1,2 \u2585  D28 1,2 \u2585   (ru\u00eddo: n \u2248 8/semana)\n```\n\n| Checkpoint | Sucesso | Falha \u2192 a\u00e7\u00e3o |\n|---|---|---|\n| D7 | `defis` e `leger` indexados, com \u2265 2 alvos rankeados e \u2265 1 no top 10; protegidas top 10 intactas (\u00b13) | protegida com acento caiu mais de 5 \u2192 volta `t\u00f4t`/`r\u00e9veiller`; token novo sem rank \u2192 esperar D14 |\n| D14 | \u2265 3 alvos no top 10; impress\u00f5es FR \u2265 5,5/dia | token novo sem rank em 14 dias \u2192 trocar por `anti` (ou `soleil` se o sem-rank for `leger`) |\n| D21 | `r\u00e9veil avec d\u00e9fis`/`r\u00e9veil \u00e0 d\u00e9fis` \u2264 #5; FR RR \u2265 DE RR | FR abaixo do DE por mais de 30% por 14 dias \u2192 revisar se \u00e9 texto ou prints antes de mexer |\n| D28 | conservador (3/5 top 10, impress\u00f5es \u2265 5,7, installs \u2265 1,17) ou bold | abaixo do conservador \u2192 a alavanca FR passa a ser ratings + convers\u00e3o, n\u00e3o texto |\n\n---\n\n## \ud83c\udfb2 Confidence breakdown\n\n| Premissa cr\u00edtica | Confian\u00e7a | Impacto se falhar |\n|---|---|---|\n| A Apple casa `defis`/`leger` sem acento com as buscas &quot;d\u00e9fis&quot;/&quot;l\u00e9ger&quot; | 90% | 0 de 5 alvos. Evid\u00eancia a favor: `langschlafer` #7 pelo token com trema |\n| SERPs de 5-9 apps com top 3 de 0-11 ratings aceitam um app com 0 ratings no top 5 | 65% | alvos param em #6-10 (continua valendo pro conservador) |\n| As composi\u00e7\u00f5es pop 5 t\u00eam volume real | 40% | rank sobe e impress\u00f5es n\u00e3o; o texto certo, sem demanda |\n| Tirar `suivi` n\u00e3o custa posi\u00e7\u00e3o | 95% | nenhuma composi\u00e7\u00e3o rankeada depende dele |\n| Posi\u00e7\u00f5es protegidas seguram com os tokens reordenados e sem acento | 90% | r\u00e9veil t\u00f4t / se lever t\u00f4t caem; rollback em 1 PATCH |\n| Download FR atribu\u00edvel ao texto no D28 | 20% | efeito conjunto com prints e n \u2248 35/30 dias. Por isso o veredito de texto \u00e9 rank |\n\n---\n\n## \ud83c\udf0e Resumo cross-locale\n\n| Locale | Name | Subtitle | Keywords | Muda? |\n|---|---|---|---|---|\n| fr-FR | `Sunrise Alarm Clock : R\u00e9veil` (28) | `Lumi\u00e8re douce, sommeil lourd` (28) | `defis,leger,\u2026,mission` (99) | sim: \u2212`suivi`, +`defis`, +`leger`, `t\u00f4t`/`r\u00e9veiller` sem acento |\n| de-DE | `Sunrise Alarm Clock: Wecker` (27) | `Sanftes Licht, Tiefschl\u00e4fer` (27) | igual (96) | n\u00e3o (normaliza\u00e7\u00e3o opcional, recomendado n\u00e3o aplicar) |\n\n| Locale | Installs 1*/30d | /dia | Installs 1*/90d | Impress\u00f5es busca 21/08-27/09 | Ratings |\n|---|---|---|---|---|---|\n| fr-FR (FR) | 35 | 1,17 | 42 | 198 | 0 |\n| de-DE (DE, sem CH/AT) | 22 | 0,73 | 25 (29 com CH/AT) | 212 | 0 |\n\n| Padr\u00e3o | fr-FR | de-DE |\n|---|---|---|\n| \u00c2ncora de luz (subtitle) | r\u00e9veil lumi\u00e8re douce **#2** | lichtwecker sonnenaufgang **#5**, licht aufwachen **#6** |\n| Sono pesado / quem dorme demais | sommeil lourd **#4** | langschl\u00e4fer **#4**, tiefschl\u00e4fer #11 |\n| Head em ingl\u00eas | sunrise alarm clock **#7** (pop 27) | sunrise alarm clock **#5** (pop 27) |\n| Miss\u00f5es | r\u00e9veil mission #58 \u2192 aposta `defis` (#1-5) | aufwachmissionen #23; `aufgaben` fora (Decis\u00e3o) |\n| \u00cdndice secund\u00e1rio en-GB | sunrise lamp #4, wake up light #16 | wake #16, wake up light #24 |\n\nAs duas lojas j\u00e1 seguram o top 10 no cluster de luz e no de sono pesado, s\u00f3 com o texto localizado. O que falta nas duas \u00e9 o cluster de miss\u00f5es/desafios, e o FR \u00e9 onde d\u00e1 pra comprar isso sem tirar ningu\u00e9m do lugar.\n\n**Pr\u00f3ximos passos:** (1) Jo\u00e3o decide se os campos fr-FR entram na 1.4.0 antes de submeter; o de-DE n\u00e3o recebe PATCH. (2) D0 = `READY_FOR_SALE` da 1.4.0, com `pull_analytics.py d0 --write-meta`. (3) Checkpoints D7/14/21/28 pelo `aso-checkpoint`, com o rank dos 5 alvos FR mais as protegidas.\n" + '</pre>';</script></div></section>

<script>
let TREE = [];
let srcIdx = 0;
let curLang = null;          // single language applied to all sections
let live = true, timer = null;
let lastSig = null;          // signature of last-rendered tree (skip no-op re-renders)

function deepLinkApp() { return new URLSearchParams(location.search).get("app"); }

async function load(preserve = true) {
  let data;
  try { data = window.STATIC_TREE; }
  catch (e) { return; }
  // Skip re-render when the polled tree is identical — keeps horizontal
  // scroll position from resetting every 4s.
  const sig = JSON.stringify(data);
  if (preserve && sig === lastSig) return;
  lastSig = sig;
  TREE = data;
  if (!preserve) {
    const want = deepLinkApp();
    const idx = TREE.findIndex(s => s.id === want);
    if (idx >= 0) srcIdx = idx;
  }
  buildSourceSelect();
  const langs = allLangs();
  // Prefer en-US as the initial language when present (falls back to first available).
  if (!preserve || !langs.includes(curLang)) {
    curLang = langs.includes("en-US") ? "en-US" : (langs[0] || null);
  }
  render();
}

function currentSrc() { return TREE[srcIdx] || { groups: [] }; }

// Union of real locales across all groups (ignores "_all" flat folders),
// in first-seen order. Falls back to ["_all"] when nothing is localized.
function allLangs() {
  const seen = new Set(), out = [];
  currentSrc().groups.forEach(g => g.locales.forEach(l => {
    if (l.code !== "_all" && !seen.has(l.code)) { seen.add(l.code); out.push(l.code); }
  }));
  return out.length ? out : ["_all"];
}

// Locale shown for a group given the selected language: exact match,
// else the group's flat "_all" folder (shows in any language).
function localeFor(g, code) {
  return g.locales.find(l => l.code === code) || g.locales.find(l => l.code === "_all");
}

function langLabel(code) {
  if (code === "_all") return "Todos";
  for (const g of currentSrc().groups)
    for (const l of g.locales) if (l.code === code) return l.label;
  return code;
}

function buildSourceSelect() {
  const s = document.getElementById("srcSel");
  s.innerHTML = "";
  TREE.forEach((src, i) => {
    const o = document.createElement("option");
    o.value = i; o.textContent = src.name; s.appendChild(o);
  });
  s.style.display = TREE.length > 1 ? "" : "none";
  s.value = srcIdx;
}

function deviceLabel(shots) {
  const f = shots.map(s => s.file.toLowerCase()).join(" ");
  if (/69|6\.9/.test(f)) return 'iPhone 6.9" Display';
  if (/67|6\.7/.test(f)) return 'iPhone 6.7" Display';
  if (/65|6\.5/.test(f)) return 'iPhone 6.5" Display';
  if (/ipad/.test(f)) return 'iPad Display';
  return 'iPhone Display';
}

function render() {
  const wrap = document.getElementById("wrap");
  const src = currentSrc();
  if (!src.groups.length) {
    wrap.innerHTML = `<div class="empty">Sem imagens ainda.<br>Gere os prints — aparecem aqui no ao vivo.</div>`;
    return;
  }
  const langs = allLangs();

  // Floating language picker (lives outside .wrap so it isn't rebuilt away).
  const float = document.getElementById("langFloat");
  const ls = document.getElementById("langSel");
  const onlyAll = langs.length === 1 && langs[0] === "_all";
  float.hidden = onlyAll;
  if (!onlyAll) {
    ls.innerHTML = langs.map(c =>
      `<option value="${c}" ${c === curLang ? "selected" : ""}>${langLabel(c)}</option>`).join("");
    ls.onchange = e => { curLang = e.target.value; render(); };
  }

  // One section card per group (treatment), all stacked in a list.
  const sections = src.groups.map(g => {
    const l = localeFor(g, curLang);
    let strip = `<div class="empty">Sem imagens nesse idioma.</div>`;
    if (l && l.shots.length) {
      strip = `<div class="strip">` + l.shots.map((s, i) =>
        `<div class="shot" draggable="false" data-file="${s.file}" data-dir="${s.dir || ""}">
           <img loading="lazy" src="${s.url}" alt="${s.name}" data-url="${s.url}">
           <div class="idx">${i + 1}</div>
           <div class="fn">${s.file}</div>
         </div>`).join("") + `</div>`;
    }
    return `
      <div class="card">
        <div class="card-top">
          <h2>${g.name}</h2>
          <span class="dev active">${l ? deviceLabel(l.shots) : "iPhone"}</span>
        </div>
        <p class="reorder">${l ? l.shots.length : 0} capturas · clique pra ampliar</p>
        ${strip}
      </div>`;
  }).join("");

  wrap.innerHTML = `
    <div class="vhead">
      <h1>${src.name}</h1>
      <span class="status"><span class="s-dot"></span>Relatório de versão</span>
    </div>
    <p class="vsub">${src.groups.length} conjunto(s) · prints da versão, estilo App Store Connect</p>
    ${sections}`;

  wrap.querySelectorAll(".shot img").forEach(im => im.onclick = () => openLb(im.dataset.url));
  wireDrag();
}

// MARK: - Drag-to-reorder (persists via POST /api/reorder -> order.json)
let dragging = false;

function wireDrag() {
  document.querySelectorAll(".strip").forEach(strip => {
    let dragged = null;
    strip.querySelectorAll(".shot").forEach(shot => {
      shot.addEventListener("dragstart", () => {
        dragged = shot; dragging = true;
        shot.classList.add("dragging");
      });
      shot.addEventListener("dragend", async () => {
        shot.classList.remove("dragging");
        strip.querySelectorAll(".dragover").forEach(x => x.classList.remove("dragover"));
        dragging = false;
        await persistOrder(strip);
      });
      shot.addEventListener("dragover", e => {
        e.preventDefault();
        if (!dragged || dragged === shot || dragged.parentElement !== strip) return;
        shot.classList.add("dragover");
        const kids = [...strip.querySelectorAll(".shot")];
        if (kids.indexOf(dragged) < kids.indexOf(shot)) shot.after(dragged);
        else shot.before(dragged);
      });
      shot.addEventListener("dragleave", () => shot.classList.remove("dragover"));
    });
  });
}

async function persistOrder(strip) {
  const shots = [...strip.querySelectorAll(".shot")];
  const dir = shots[0] && shots[0].dataset.dir;
  if (!dir) return;
  // Only files that live in the SAME dir can be reordered together.
  const order = shots.filter(s => s.dataset.dir === dir).map(s => s.dataset.file);
  shots.forEach((s, i) => { const idx = s.querySelector(".idx"); if (idx) idx.textContent = i + 1; });
  try {
    await fetch("/api/reorder", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ app: currentSrc().id, dir, order }),
    });
  } catch (e) { /* server offline — order stays visual only */ }
  lastSig = null;  // force next poll to re-render with the persisted order
}

function openLb(url) {
  document.getElementById("lbImg").src = url;
  document.getElementById("lb").classList.add("on");
}

document.getElementById("lb").onclick = () => document.getElementById("lb").classList.remove("on");
document.getElementById("srcSel").onchange = e => { srcIdx = +e.target.value; pickDefault(); render(); };
document.getElementById("refreshBtn").onclick = () => load(true);
document.getElementById("liveBtn").onclick = () => {
  live = !live;
  document.getElementById("liveBtn").textContent = live ? "pausar" : "ao vivo";
  document.getElementById("dot").classList.toggle("on", live);
  document.getElementById("liveTxt").textContent = live ? "ao vivo" : "pausado";
  if (live) startTimer(); else clearInterval(timer);
};
function startTimer() { return; clearInterval(timer); timer = setInterval(() => live && !dragging && load(true), 4000); }

load(false);
startTimer();
</script>

<script>
(function () {
  const ids = ["resumo", "prints", "aso"];
  function show(id) {
    if (!ids.includes(id)) id = ids[0];
    ids.forEach(t => {
      document.getElementById("tab-" + t).hidden = t !== id;
      document.getElementById("btn-" + t).classList.toggle("on", t === id);
    });
    // The locale picker belongs to the prints viewer only.
    document.getElementById("langFloat").style.visibility = id === "prints" ? "" : "hidden";
    history.replaceState(null, "", "#" + id);
  }
  ids.forEach(t => document.getElementById("btn-" + t).onclick = () => show(t));
  show(location.hash.slice(1));
})();
</script>
